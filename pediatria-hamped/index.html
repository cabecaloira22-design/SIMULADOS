el e cordão palpável acima."], ["Hérnia inguinal.", "Errada: é redutível e não se palpa o cordão acima da massa."], ["Varicocele.", "Errada: típica do adolescente, à esquerda, 'saco de vermes' que aumenta com Valsalva."], ["Torção do cordão espermático.", "Errada: dor súbita intensa, testículo elevado e horizontalizado."]], "conc": "Hidrocele: transilumina, não redutível (comunicante varia ao longo do dia), cordão palpável acima. Hérnia: redutível, sinal da 'seda', sem cordão acima; cirurgia eletiva precoce. Varicocele: adolescente, esquerda, aumenta em pé/Valsalva.", "rac": "Transiluminação + cordão palpável acima.", "pista": "'Palpa-se o cordão' acima da massa.", "mud": "Massa redutível, sem cordão acima = hérnia inguinal.", "cmp": "Hérnia encarcerada (A10): massa endurecida, dolorosa, irredutível, com choro e vômitos.", "arm": "Transiluminar e não palpar acima da massa.", "regra": "Cordão acima = hidrocele; sem cordão acima e redutível = hérnia.", "cf": "Hidrocele comunicante muda de tamanho ao longo do dia.", "fonte": "F2, Seção 12, p. 28"}, {"n": 5, "sub": "Escroto agudo", "comp": "Reconhecer torção do cordão e agir", "tags": [], "rel": ["A10"], "enun": "Adolescente de 14 anos com dor escrotal súbita e intensa há 2 horas, com vômitos. O testículo está elevado e horizontalizado, o reflexo cremastérico está ausente e a elevação não alivia a dor. Qual a conduta?", "ops": [["Cirurgia imediata, sem atrasar por Doppler quando a clínica é típica.", "Correta: torção do cordão; viabilidade cai após ~6 h."], ["Antibiótico e analgesia para orquiepididimite, com reavaliação em 48 horas.", "Errada: na orquiepididimite, o início é gradual, com cremastérico presente e Prehn positivo."], ["Analgesia e repouso para torção de apêndice testicular.", "Errada: há ponto azul no polo superior e reflexo cremastérico presente."], ["Doppler eletivo no dia seguinte para confirmar o diagnóstico.", "Errada: atrasar a cirurgia compromete a viabilidade."]], "conc": "Torção do cordão: neonato e adolescente; súbito, dor intensa, vômitos; testículo elevado e horizontal, cremastérico ausente, Prehn negativo; cirurgia imediata. Torção de apêndice: 7–12 anos, ponto azul, reflexo presente. Orquiepididimite: gradual, febre, sintomas urinários, Prehn positivo.", "rac": "Súbito + horizontalizado + cremastérico ausente + Prehn negativo = torção.", "pista": "'Elevação não alivia' = Prehn negativo.", "mud": "Ponto azul no polo superior com reflexo presente = torção de apêndice.", "cmp": "F2, p. 36: torção testicular — cirurgia em até ~6 h.", "arm": "Pedir Doppler e esperar.", "regra": "Escroto agudo típico: centro cirúrgico.", "cf": "No lactente irritado com dor, sempre examinar o escroto (A10).", "fonte": "F2, Seção 12, p. 28; F2, p. 36"}, {"n": 6, "sub": "Estadiamento de Tanner", "comp": "Identificar puberdade precoce", "tags": [], "rel": ["A15"], "enun": "Menina de 7 anos apresenta broto mamário bilateral, sem pelos pubianos. Como classificar esse achado?", "ops": [["Puberdade precoce: telarca (M2) antes dos 8 anos.", "Correta: o limite feminino é 8 anos."], ["Desenvolvimento normal: a telarca é esperada entre 6 e 10 anos.", "Errada: a faixa é ~8–13 anos; antes de 8 é precoce."], ["Atraso puberal, pela ausência de pelos pubianos.", "Errada: atraso é ausência de M2 aos 13 anos."], ["Normal, pois a puberdade só é considerada iniciada com a menarca.", "Errada: o primeiro sinal puberal feminino é a telarca."]], "conc": "Telarca (M2): primeiro sinal feminino, ~8–13 anos. G2 (testículo ≥ 4 mL, escroto mais fino e avermelhado): primeiro sinal masculino, ~9–14 anos. Precoce: < 8 anos (meninas), < 9 anos (meninos). Atraso: sem M2 aos 13 ou sem G2 aos 14. Menarca: 2–2,5 anos após a telarca, geralmente em M4.", "rac": "7 anos < 8 anos + M2 = precoce.", "pista": "'Broto mamário' = M2.", "mud": "Aos 9 anos, a mesma telarca seria normal.", "cmp": "No menino, o primeiro sinal é o aumento testicular, não os pelos.", "arm": "Usar a menarca como marco de início puberal.", "regra": "Meninas antes de 8, meninos antes de 9: precoce.", "cf": "Menino de 10 anos com testículos de 4 mL: G2, puberdade normal.", "fonte": "F2, Seção 12, p. 29"}, {"n": 7, "sub": "Genitália feminina", "comp": "Reconhecer achados frequentes na menina", "tags": [], "rel": [], "enun": "Menina de 3 anos, assintomática, apresenta uma membrana fina translúcida na linha média unindo os pequenos lábios. Qual a hipótese e a conduta?", "ops": [["Sinéquia de pequenos lábios; tratar só se sintomática (estrogênio tópico).", "Correta: achado frequente entre 3 meses e 6 anos."], ["Hímen imperfurado; correção cirúrgica imediata.", "Errada: hímen imperfurado causa hidrocolpo no RN ou hematocolpo na adolescente."], ["Sinéquia de pequenos lábios; separação manual obrigatória no consultório.", "Errada: assintomática, não precisa de tratamento."], ["Clitoromegalia por hiperplasia adrenal congênita.", "Errada: o achado é a fusão dos pequenos lábios, não o clitóris aumentado."]], "conc": "Achados: sinéquia (3 meses–6 anos, linha média translúcida, tratar só se sintomática); vulvovaginite inespecífica (mais comum); corpo estranho (secreção fétida e sanguinolenta); prolapso uretral (massa anular avermelhada); líquen escleroso (placas brancas em 'figura de 8'); hímen imperfurado; clitoromegalia (HAC, tumor virilizante).", "rac": "Membrana translúcida na linha média dos pequenos lábios, sem sintomas.", "pista": "'Translúcida na linha média'.", "mud": "Com disúria ou retenção urinária, a sinéquia poderia ser tratada.", "cmp": "Corpo estranho vaginal: secreção fétida e sanguinolenta.", "arm": "Separar à força uma sinéquia assintomática.", "regra": "Sinéquia sem sintoma: observar.", "cf": "Técnica: posição de rã, separação e tração labial delicada; sem exame especular em pré-púberes no ambulatório.", "fonte": "F2, Seção 12, p. 29"}, {"n": 8, "sub": "Suspeita de abuso sexual", "comp": "Conduzir suspeita de abuso sexual", "tags": ["osce"], "rel": ["A15"], "enun": "Menina de 6 anos é diagnosticada com infecção sexualmente transmissível e, durante a consulta, relata espontaneamente que 'um vizinho mexe nela'. Qual a conduta adequada?", "ops": [["Acolher sem interrogatório repetitivo, registrar, notificar e comunicar ao Conselho Tutelar.", "Correta: conduta descrita no material (ECA art. 13; Lei 13.431/2017)."], ["Interrogar a criança detalhadamente para obter todos os fatos antes de notificar o caso.", "Errada: interrogatório repetitivo revitimiza; a escuta é especializada."], ["Aguardar a comprovação pericial antes de comunicar o caso ao Conselho Tutelar.", "Errada: suspeita já obriga a comunicação."], ["Confrontar a família e o suposto agressor na mesma consulta para esclarecer os fatos.", "Errada: não é conduta do material e pode expor a criança a risco."]], "conc": "Sinais: lesões genitais/anais sem explicação, IST em criança, gravidez, sangramento, comportamento sexualizado, relato da criança. Conduta: acolher sem interrogatório repetitivo, registrar fielmente, notificação compulsória (SINAN), Conselho Tutelar (ECA art. 13), encaminhar para profilaxias e escuta especializada (Lei 13.431/2017).", "rac": "IST + relato = suspeita forte → proteger, notificar, encaminhar.", "pista": "'IST em criança' e 'relata espontaneamente'.", "mud": "Nada no material condiciona a notificação à confirmação: a suspeita basta.", "cmp": "Ver A15: em adolescentes, violência sexual também exige profilaxias, contracepção de emergência e escuta especializada.", "arm": "Querer 'investigar' pessoalmente, revitimizando a criança.", "regra": "Acolher, registrar, notificar, encaminhar.", "cf": "Registrar as palavras da criança como foram ditas, sem interpretação.", "fonte": "F2, Seção 12, p. 29"}]}, {"id": "A13", "titulo": "Alteração da coloração da urina na criança", "arq": "F2", "pags": "30–31", "bloco": 4, "q": [{"n": 1, "sub": "Uratos no recém-nascido", "comp": "Reconhecer causa benigna de urina avermelhada no RN", "tags": [], "rel": ["A02"], "enun": "Mãe de um menino de 2 dias, em aleitamento materno, mostra uma mancha rosa-alaranjada 'cor de tijolo' na fralda. O RN está ativo. Qual a interpretação?", "ops": [["Cristais de urato, transitórios; avaliar a amamentação.", "Correta: causa benigna dos primeiros dias, citada no material."], ["Hematúria macroscópica; solicitar urina tipo 1 e ultrassonografia de rins.", "Errada: o contexto e a cor típica apontam para uratos."], ["Pseudomenstruação por influência hormonal materna, sem significado patológico.", "Errada: ocorre na menina (sangue vaginal); o RN é menino."], ["Hemoglobinúria por hemólise; solicitar Coombs direto.", "Errada: sem icterícia ou palidez; a cor de tijolo é típica de uratos."]], "conc": "Causas benignas de urina vermelha/rosada: beterraba, amora, corantes; rifampicina, fenazopiridina; cristais de urato no RN (mancha rosa-alaranjada 'cor de tijolo', primeiros dias, transitória; indica ingestão ainda baixa); pseudomenstruação na RN.", "rac": "Primeiros dias + cor de tijolo + RN bem = uratos.", "pista": "'Cor de tijolo'.", "mud": "Persistindo após a 1ª semana ou com outros sinais, investigar.", "cmp": "Primeiro passo do algoritmo: é urina mesmo? (sangue vaginal, retal, perineal, dermatite).", "arm": "Investigar hematúria em achado fisiológico.", "regra": "Fralda cor de tijolo nos primeiros dias: olhe a amamentação.", "cf": "Na menina com sangue na fralda nos primeiros dias, pensar em pseudomenstruação.", "fonte": "F2, Seção 13, p. 30"}, {"n": 2, "sub": "Fita positiva sem hemácias", "comp": "Diferenciar hemoglobinúria de mioglobinúria", "tags": [], "rel": [], "enun": "Adolescente de 15 anos, após treino intenso, tem urina escura. Fita com heme positivo; sedimento sem hemácias; o plasma é claro. Qual a hipótese e os exames?", "ops": [["Mioglobinúria por rabdomiólise: CPK, potássio e função renal.", "Correta: fita + sem hemácias + plasma claro."], ["Hemoglobinúria por hemólise: haptoglobina, LDH e Coombs.", "Errada: na hemoglobinúria, o plasma é rosado."], ["Hematúria glomerular: C3, C4 e ASLO.", "Errada: não há hemácias no sedimento."], ["Pigmento alimentar: nenhum exame adicional.", "Errada: a fita heme seria negativa."]], "conc": "Fita heme +, sem hemácias: hemoglobinúria (plasma rosado: haptoglobina, LDH, Coombs) ou mioglobinúria (plasma claro: CPK, potássio, função renal).", "rac": "Plasma claro = o pigmento não está no plasma de forma visível = mioglobina.", "pista": "'Treino intenso' e 'plasma claro'.", "mud": "Com plasma rosado e icterícia, pensar em hemólise.", "cmp": "Hematúria verdadeira: ≥ 5 hemácias/campo em 2–3 amostras.", "arm": "Chamar de 'hematúria' toda fita positiva.", "regra": "Fita positiva sem hemácias: olhe a cor do plasma.", "cf": "Anamnese que pontua: trauma, exercício intenso, mialgia (rabdomiólise).", "fonte": "F2, Seção 13, pp. 30–31"}, {"n": 3, "sub": "Fita negativa", "comp": "Reconhecer pigmento não heme", "tags": [], "rel": [], "enun": "Criança de 6 anos com urina avermelhada após almoço com beterraba. A fita reagente é negativa para heme. Qual a conclusão?", "ops": [["Pigmento, sem sangue: causa alimentar benigna.", "Correta: fita negativa direciona para pigmentos."], ["Hematúria glomerular, pois a cor é avermelhada.", "Errada: hematúria daria fita positiva."], ["Hemoglobinúria, pois a fita não detecta hemoglobina livre.", "Errada: a fita heme detecta hemoglobina e mioglobina."], ["Infecção urinária, a ser confirmada por urocultura.", "Errada: nada no quadro sugere ITU."]], "conc": "Fita heme negativa → pigmento: alimentos, fármacos (rifampicina, fenazopiridina), uratos, porfiria, bilirrubina (testar).", "rac": "Segundo passo do algoritmo: heme negativo = não é sangue.", "pista": "'Negativa para heme'.", "mud": "Fita positiva levaria à microscopia.", "cmp": "Alimentos e medicações das últimas 48 h fazem parte da anamnese.", "arm": "Pedir investigação renal para urina de beterraba.", "regra": "Heme negativo = pigmento.", "cf": "Urina laranja após rifampicina também é pigmento benigno.", "fonte": "F2, Seção 13, pp. 30–31"}, {"n": 4, "sub": "Hematúria glomerular x não glomerular", "comp": "Localizar a origem da hematúria", "tags": [], "rel": ["A14"], "enun": "Qual conjunto de achados indica hematúria de origem glomerular?", "ops": [["Urina marrom, hemácias dismórficas e cilindros hemáticos.", "Correta: são os marcadores glomerulares do algoritmo."], ["Urina vermelho-viva com coágulos e hemácias eumórficas.", "Errada: padrão não glomerular."], ["Disúria, dor lombar em cólica e hemácias eumórficas no sedimento.", "Errada: sugere ITU ou litíase (não glomerular)."], ["Hematúria terminal com urina fétida e polaciúria.", "Errada: sugere cistite."]], "conc": "Glomerular: marrom, cilindros hemáticos, dismórficas (acantócitos), proteinúria, edema, HAS. Não glomerular: vermelho vivo, coágulos, eumórficas, disúria, cólica — ITU, litíase, hipercalciúria, trauma, tumor, coagulopatia, traço falciforme.", "rac": "Cilindros hemáticos e acantócitos só se formam com passagem pelo glomérulo/túbulo.", "pista": "'Cilindros hemáticos'.", "mud": "Coágulos indicam origem baixa (não glomerular).", "cmp": "Ver A14: síndrome nefrítica tem hemácias dismórficas e cilindros hemáticos.", "arm": "Achar que coágulos indicam gravidade glomerular.", "regra": "Coca-cola + cilindro = glomérulo; vermelho + coágulo = vias urinárias.", "cf": "Urina tipo 1 com pesquisa de dismorfismo eritrocitário é o exame inicial.", "fonte": "F2, Seção 13, p. 30"}, {"n": 5, "sub": "Anamnese de latência", "comp": "Usar a latência infecciosa no diagnóstico", "tags": ["osce"], "rel": ["A14"], "enun": "Menino de 11 anos com hematúria macroscópica que começou ontem, junto com um resfriado iniciado anteontem. Já teve episódio igual há 1 ano. Qual hipótese a anamnese favorece?", "ops": [["Nefropatia por IgA (Berger).", "Correta: hematúria concomitante ou 1–2 dias após IVAS, recorrente."], ["Glomerulonefrite pós-estreptocócica.", "Errada: tem latência de 1–3 semanas (faringe) ou 3–6 semanas (pele)."], ["Vasculite por IgA.", "Errada: haveria púrpura em membros inferiores, artralgia e dor abdominal."], ["Rabdomiólise pós-viral.", "Errada: haveria mialgia, e o sedimento teria poucas ou nenhuma hemácia."]], "conc": "Latência: faringite 1–3 semanas ou impetigo 3–6 semanas antes (GNPE) versus IVAS concomitante ou 1–2 dias antes (nefropatia por IgA, recorrente).", "rac": "Intervalo curtíssimo + recorrência = IgA.", "pista": "'Começou ontem, junto com um resfriado'.", "mud": "Se a garganta inflamada tivesse sido há 2 semanas, pensar em GNPE.", "cmp": "Nefropatia por IgA: C3 normal; GNPE: C3 baixo e transitório.", "arm": "Ver 'infecção + hematúria' e responder GNPE automaticamente.", "regra": "Junto com a IVAS = IgA; semanas depois = GNPE.", "cf": "Púrpura, artralgia e dor abdominal apontariam para vasculite por IgA.", "fonte": "F2, Seção 13, p. 31; Seção 14, p. 32"}, {"n": 6, "sub": "Urina branca e amarelo-escura", "comp": "Diferenciar causas benignas de urina turva", "tags": [], "rel": ["A09"], "enun": "Criança de 5 anos sem sintomas tem urina branca e turva após o almoço. Ao acrescentar ácido acético à amostra, ela clareia. Qual a explicação?", "ops": [["Fosfatúria benigna.", "Correta: clareia com ácido acético."], ["Piúria por infecção urinária.", "Errada: piúria não clareia com ácido acético, e a criança está assintomática."], ["Quilúria por obstrução linfática.", "Errada: causa rara, sem relação com a resposta ao ácido."], ["Lipidúria da síndrome nefrótica.", "Errada: haveria edema e proteinúria."]], "conc": "Branca/turva: piúria (ITU), quilúria, lipidúria (nefrótica); fosfatúria benigna (pós-prandial, alcalina, clareia com ácido acético). Amarelo-escura: concentrada ou colúria (espuma amarelada, fita com bilirrubina +).", "rac": "Pós-prandial + assintomática + clareia com ácido = fosfato.", "pista": "'Clareia com ácido acético'.", "mud": "Com febre e disúria, piúria por ITU seria provável.", "cmp": "Ver A09: urina escura com espuma amarelada e fita com bilirrubina = colúria.", "arm": "Tratar urina turva como ITU sem sintomas.", "regra": "Turva que clareia no ácido = fosfatúria.", "cf": "Urina verde/azul: azul de metileno, propofol, amitriptilina; raramente Pseudomonas.", "fonte": "F2, Seção 13, p. 30"}, {"n": 7, "sub": "Hematúria microscópica isolada", "comp": "Conduzir hematúria microscópica assintomática", "tags": [], "rel": [], "enun": "Menina de 8 anos, assintomática, tem 6 hemácias por campo em uma urina de rotina, sem proteinúria; PA e função renal normais. Qual a conduta?", "ops": [["Repetir a urina em 2–3 semanas e acompanhar.", "Correta: conduta para hematúria microscópica isolada."], ["Encaminhar para biópsia renal pela presença de hematúria em exame de rotina.", "Errada: não há persistência documentada nem sinais de doença."], ["Solicitar cistoscopia para afastar tumor de bexiga.", "Errada: não há indicação no quadro descrito."], ["Encaminhar com urgência ao nefrologista no mesmo dia.", "Errada: não há HAS, edema, oligúria, proteinúria ou alteração de função."]], "conc": "Hematúria = ≥ 5 hemácias/campo em 2–3 amostras. Microscópica isolada, assintomática, sem proteinúria, PA e função normais: repetir em 2–3 semanas; geralmente transitória (febre, exercício).", "rac": "Uma única amostra não define hematúria; sem sinais de alarme → repetir.", "pista": "'Assintomática' e 'sem proteinúria'.", "mud": "Persistindo nas 2–3 amostras, completar a investigação inicial.", "cmp": "Exames iniciais: urina com dismorfismo, urocultura, P/C, Ca/Cr (hipercalciúria > 0,2 mg/mg em > 6 anos), ureia, creatinina, hemograma, USG.", "arm": "Escalar a investigação a partir de um exame isolado.", "regra": "Hematúria micro isolada: repita antes de investigar.", "cf": "História familiar de hematúria, surdez e doença renal faria pensar em Alport.", "fonte": "F2, Seção 13, pp. 30–31"}, {"n": 8, "sub": "Encaminhamento urgente", "comp": "Reconhecer quando encaminhar no mesmo dia", "tags": [], "rel": ["A14"], "enun": "Qual criança com alteração da cor da urina precisa de avaliação no mesmo dia?", "ops": [["Urina coca-cola com edema palpebral, PA elevada e pouca diurese.", "Correta: hematúria macroscópica com síndrome nefrítica."], ["Urina laranja após início de rifampicina, sem outros sintomas.", "Errada: pigmento medicamentoso benigno."], ["Urina branca pós-prandial que clareia com ácido acético.", "Errada: fosfatúria benigna."], ["Hematúria microscópica isolada em exame de rotina, com PA e função renal normais.", "Errada: repetir em 2–3 semanas."]], "conc": "Encaminhar com urgência: hematúria com HAS, edema, oligúria, proteinúria significativa, creatinina elevada, massa abdominal, trauma ou coagulopatia. Hematúria macroscópica com síndrome nefrítica: mesmo dia.", "rac": "Edema + HAS + oligúria + urina marrom = nefrítica.", "pista": "'PA elevada' e 'redução da diurese'.", "mud": "Sem edema, HAS ou oligúria, a urgência diminui.", "cmp": "Ver A14: GNPE pode complicar com encefalopatia hipertensiva e congestão circulatória.", "arm": "Tratar como ITU sem medir a PA.", "regra": "Hematúria + HAS ou edema ou oligúria = hoje.", "cf": "Massa abdominal com hematúria também exige avaliação urgente.", "fonte": "F2, Seção 13, p. 31"}]}, {"id": "A14", "titulo": "Glomerulopatias na infância: manifestações clínicas e laboratoriais", "arq": "F2", "pags": "32–33", "bloco": 4, "q": [{"n": 1, "sub": "Nefrítica x nefrótica", "comp": "Diferenciar as duas grandes síndromes", "tags": [], "rel": ["A13"], "enun": "Menino de 7 anos com edema periorbitário, PA elevada, urina cor de coca-cola e redução da diurese. Qual síndrome glomerular ele apresenta?", "ops": [["Síndrome nefrítica.", "Correta: hematúria macroscópica, hipertensão, edema e oligúria."], ["Síndrome nefrótica.", "Errada: teria edema intenso, urina espumosa, hipoalbuminemia e proteinúria nefrótica, em geral sem HAS."], ["Infecção urinária alta.", "Errada: febre e sintomas urinários, sem HAS e edema."], ["Nefropatia por refluxo vesicoureteral.", "Errada: não explica o quadro agudo descrito."]], "conc": "Nefrítica: inflamação glomerular; hematúria (coca-cola), HAS, edema por retenção de sódio, oligúria, azotemia; proteinúria geralmente não nefrótica; hemácias dismórficas e cilindros hemáticos. Nefrótica: lesão da barreira; edema intenso, gravitacional, urina espumosa; proteinúria ≥ 40 mg/m²/h ou P/C ≥ 2 mg/mg; albumina baixa; dislipidemia.", "rac": "Hematúria + HAS + oligúria = nefrítica.", "pista": "'Urina cor de coca-cola' com 'PA elevada'.", "mud": "Anasarca com urina espumosa e PA normal apontaria para nefrótica.", "cmp": "Protótipos: GNPE (nefrítica) e lesões mínimas (nefrótica).", "arm": "Achar que todo edema renal é 'nefrótico'.", "regra": "Sangue e pressão = nefrítica; proteína e albumina baixa = nefrótica.", "cf": "O edema da nefrítica decorre de retenção de sódio; o da nefrótica, da perda de proteína.", "fonte": "F2, Seção 14, p. 32"}, {"n": 2, "sub": "GNPE — complemento e marcadores", "comp": "Interpretar complemento e marcadores estreptocócicos", "tags": [], "rel": ["A13"], "enun": "Escolar de 8 anos com síndrome nefrítica que teve impetigo há 4 semanas. Qual perfil laboratorial é esperado?", "ops": [["C3 baixo, C4 normal; anti-DNase B é o marcador mais útil.", "Correta: GNPE após piodermite."], ["C3 e C4 baixos; ASLO é o marcador mais útil após a infecção.", "Errada: C3 e C4 baixos sugerem lúpus; ASLO é mais útil após faringite."], ["C3 normal; ASLO elevado confirma o diagnóstico.", "Errada: na GNPE o C3 está baixo."], ["C3 baixo; ASLO é mais útil que anti-DNase B após piodermite.", "Errada: após infecção de pele, o anti-DNase B é o marcador indicado."]], "conc": "GNPE: 5–12 anos; latência após faringite (1–3 semanas) ou piodermite (3–6 semanas) por estreptococo do grupo A nefritogênico. C3 baixo e C4 normal, com normalização do C3 em até 8 semanas. ASLO (faringe) e anti-DNase B (pele).", "rac": "Impetigo há 4 semanas = latência de pele → anti-DNase B; GNPE → C3 baixo, C4 normal.", "pista": "'Impetigo há 4 semanas'.", "mud": "Após faringite há 2 semanas, ASLO seria o marcador indicado.", "cmp": "C3 e C4 baixos: lúpus.", "arm": "Pedir só ASLO após infecção de pele.", "regra": "Garganta: ASLO; pele: anti-DNase B; GNPE: C3 baixo, C4 normal.", "cf": "C3 que não normaliza em 8 semanas exige reavaliação diagnóstica.", "fonte": "F2, Seção 14, pp. 32–33"}, {"n": 3, "sub": "GNPE — manejo e complicações", "comp": "Tratar a GNPE e reconhecer complicações", "tags": [], "rel": [], "enun": "Na GNPE com edema e hipertensão, qual manejo está de acordo com o material?", "ops": [["Restrição de sal e água, furosemida e anti-hipertensivo; penicilina não muda o curso renal.", "Correta: tratamento de suporte."], ["Pulsoterapia com corticoide para reduzir a inflamação glomerular e a proteinúria.", "Errada: não faz parte do manejo da GNPE no material."], ["Penicilina em dose plena, que reverte a nefrite se iniciada nos primeiros dias.", "Errada: a penicilina não altera o curso renal."], ["Hidratação venosa vigorosa para manter o fluxo urinário e proteger a função renal.", "Errada: há retenção de sódio e água; o risco é congestão circulatória."]], "conc": "Suporte: restrição de sal e água, furosemida, anti-hipertensivo se necessário; penicilina para erradicar a cepa (não altera o curso renal). Complicações: encefalopatia hipertensiva (cefaleia, convulsão), congestão circulatória (ICC, edema agudo de pulmão), LRA. Hematúria microscópica pode persistir 1–2 anos.", "rac": "Mecanismo da HAS e do edema: retenção de sódio → diurético e restrição.", "pista": "'Suporte'.", "mud": "Cefaleia intensa e convulsão indicariam encefalopatia hipertensiva.", "cmp": "Corticoide é a base na síndrome nefrótica por lesões mínimas, não na GNPE.", "arm": "Achar que antibiótico 'cura' a nefrite.", "regra": "GNPE: sal, água, diurético, pressão.", "cf": "Hematúria microscópica residual por até 1–2 anos não indica, sozinha, falha do tratamento.", "fonte": "F2, Seção 14, p. 32"}, {"n": 4, "sub": "Complemento como atalho e biópsia", "comp": "Indicar biópsia na nefrite com C3 persistentemente baixo", "tags": [], "rel": [], "enun": "Criança com quadro nefrítico inicialmente atribuído a GNPE mantém C3 baixo 12 semanas depois. Qual a interpretação?", "ops": [["Sugere GN membranoproliferativa/glomerulopatia C3 e indica biópsia.", "Correta: é o diferencial com a GNPE que não normaliza."], ["É o curso habitual da GNPE, que normaliza o C3 em até 6 meses.", "Errada: a normalização esperada é em até 8 semanas."], ["Sugere nefropatia por IgA, que cursa com C3 baixo persistente.", "Errada: na nefropatia por IgA o C3 é normal."], ["Sugere síndrome de Alport, que consome complemento.", "Errada: no Alport o complemento é normal."]], "conc": "C3 baixo: GNPE (transitório), MPGN/C3 (persistente), lúpus (C3 e C4 baixos), endocardite, nefrite de shunt, crioglobulinemia. C3 normal: IgA, vasculite por IgA, Alport, lesões mínimas, GESF, membranosa, ANCA. GNPE com indicação de biópsia: C3 baixo > 8 semanas, sem evidência de estreptococcia, proteinúria nefrótica persistente, piora da função renal, hematúria macroscópica prolongada.", "rac": "12 > 8 semanas → não é o comportamento da GNPE.", "pista": "'12 semanas depois'.", "mud": "Se o C3 tivesse normalizado em 6 semanas, o diagnóstico de GNPE se manteria.", "cmp": "Complemento é o atalho diagnóstico das glomerulopatias.", "arm": "Esperar 'mais um pouco' além das 8 semanas.", "regra": "C3 baixo depois de 8 semanas = biópsia.", "cf": "C3 e C4 baixos em adolescente com rash e artrite: pensar em nefrite lúpica (FAN, anti-dsDNA).", "fonte": "F2, Seção 14, pp. 32–33"}, {"n": 5, "sub": "Síndrome nefrótica — corticoide", "comp": "Calcular a corticoterapia na síndrome nefrótica", "tags": ["calculo"], "rel": [], "enun": "Menino de 4 anos com síndrome nefrótica idiopática (provável lesões mínimas), superfície corporal de 0,7 m². Pelo esquema IPNA do material, qual a prescrição?", "ops": [["42 mg/dia por 4 semanas, seguidos de 28 mg em dias alternados por 4 semanas.", "Correta: 60 mg/m²/dia (máx. 60 mg) e depois 40 mg/m² em dias alternados."], ["60 mg/dia por 4 semanas para todas as crianças, que é a dose máxima.", "Errada: a dose é por m²; 60 mg é apenas o teto."], ["42 mg/dia por 4 semanas, seguidos de 28 mg/dia diariamente por 4 semanas.", "Errada: a segunda fase é em dias alternados."], ["28 mg/dia por 4 semanas, seguidos de 42 mg em dias alternados por 4 semanas.", "Errada: inverte as doses das fases."]], "conc": "Prednisolona/prednisona 60 mg/m²/dia (máx. 60 mg) por 4 semanas, depois 40 mg/m² em dias alternados por 4 semanas (IPNA). Remissão: P/C < 0,2 mg/mg ou fita negativa/traços por 3 dias. Corticorresistência após 4–6 semanas → biópsia (GESF).", "rac": "0,7 × 60 = 42 mg (< 60); 0,7 × 40 = 28 mg em dias alternados.", "pista": "'Dias alternados' na segunda fase.", "mud": "Com SC de 1,2 m², a primeira fase seria limitada a 60 mg/dia (teto).", "cmp": "Perfil de lesões mínimas: 1–10 anos (pico 2–6), meninos, após IVAS, sem HAS ou hematúria macroscópica, função normal, C3 normal.", "arm": "Esquecer o teto de 60 mg ou a alternância.", "regra": "60 diário por 4 semanas, 40 alternado por 4 semanas (por m²).", "cf": "Sem remissão após 4–6 semanas de corticoide, indica-se biópsia.", "fonte": "F2, Seção 14, p. 32; F2, p. 36"}, {"n": 6, "sub": "Complicações da síndrome nefrótica", "comp": "Reconhecer complicação infecciosa da síndrome nefrótica", "tags": [], "rel": [], "enun": "Criança de 5 anos em atividade de síndrome nefrótica, com ascite, apresenta febre e dor abdominal difusa. Qual a hipótese principal?", "ops": [["Peritonite bacteriana espontânea (pneumococo).", "Correta: perda de imunoglobulinas e complemento favorece a infecção."], ["Apendicite aguda complicada com perfuração.", "Errada: possível, mas o contexto clássico da questão é a PBE na nefrótica."], ["Trombose aguda de veia renal.", "Errada: manifesta-se com hematúria e dor lombar."], ["Pancreatite aguda induzida por corticoide.", "Errada: não é a complicação típica citada no material."]], "conc": "Complicações: infecções (PBE por S. pneumoniae, celulite; vacinar contra pneumococo e varicela fora da corticoterapia em dose alta); trombose (perda de antitrombina III, hiperviscosidade: veia renal, TVP); hipovolemia/LRA; efeitos do corticoide.", "rac": "Ascite + febre + dor abdominal em nefrótico = PBE.", "pista": "'Ascite' e 'febre'.", "mud": "Hematúria com dor lombar súbita apontaria para trombose de veia renal.", "cmp": "Infecção (perda de imunoglobulina) versus trombose (perda de antitrombina III).", "arm": "Atribuir a dor abdominal ao edema de alças.", "regra": "Nefrótico com febre e dor abdominal: pense em PBE.", "cf": "Diuréticos em excesso ou diarreia podem precipitar hipovolemia e LRA.", "fonte": "F2, Seção 14, p. 33"}, {"n": 7, "sub": "Vasculite por IgA", "comp": "Diagnosticar e acompanhar vasculite por IgA", "tags": [], "rel": ["A10"], "enun": "Menino de 6 anos com púrpura palpável em membros inferiores e nádegas, artralgia e dor abdominal em cólica. Plaquetas e coagulograma normais; urina com hematúria microscópica. Qual afirmação está correta?", "ops": [["Vasculite por IgA; seguir urina e PA por 6–12 meses.", "Correta: recomendação SHARE citada no material."], ["Púrpura trombocitopênica imune; as plaquetas devem cair nas próximas horas.", "Errada: plaquetas normais com púrpura palpável apontam para vasculite."], ["É nefropatia por IgA isolada, que se diagnostica sem biópsia.", "Errada: a nefropatia por IgA isolada não tem púrpura e se diagnostica por biópsia."], ["É síndrome hemolítico-urêmica, pela hematúria associada.", "Errada: na SHU há plaquetopenia e anemia hemolítica."]], "conc": "Vasculite por IgA (Henoch-Schönlein): 3–15 anos; púrpura palpável em MMII e nádegas, artrite/artralgia, dor abdominal (risco de invaginação), nefrite em parte dos casos; plaquetas, coagulação e C3 normais. Acompanhar urina e PA por 6–12 meses (SHARE).", "rac": "Púrpura palpável com plaquetas normais = vasculite, não plaquetopenia.", "pista": "'Plaquetas e coagulograma normais'.", "mud": "Plaquetopenia e anemia com esquizócitos após diarreia sanguinolenta = SHU.", "cmp": "Ver A10: invaginação é complicação abdominal temida.", "arm": "Liberar sem seguimento renal por a urina estar 'só com micro-hematúria'.", "regra": "Púrpura palpável, plaquetas normais: vasculite por IgA — vigie rim e PA.", "cf": "A nefrite costuma surgir nas primeiras semanas.", "fonte": "F2, Seção 14, p. 32"}, {"n": 8, "sub": "Síndrome hemolítico-urêmica", "comp": "Reconhecer SHU após diarreia sanguinolenta", "tags": [], "rel": ["A08"], "enun": "Criança de 3 anos, uma semana após diarreia com sangue, fica pálida e urina pouco. Exames: anemia com esquizócitos, plaquetopenia e creatinina elevada. Qual o diagnóstico e o cuidado na diarreia?", "ops": [["SHU; evitar antibiótico e antiperistálticos na diarreia por EHEC.", "Correta: tríade anemia hemolítica microangiopática, plaquetopenia e LRA."], ["Púrpura trombocitopênica imune; iniciar corticoide e repetir as plaquetas.", "Errada: não explica a hemólise com esquizócitos nem a LRA."], ["Glomerulonefrite pós-estreptocócica; dosar ASLO.", "Errada: o antecedente é diarreia sanguinolenta, não estreptococcia."], ["Desidratação grave com insuficiência pré-renal; Plano C.", "Errada: não explica esquizócitos e plaquetopenia."]], "conc": "SHU: após diarreia sanguinolenta (E. coli O157:H7, toxina Shiga), < 5 anos; palidez, oligúria. Tríade: anemia hemolítica microangiopática (esquizócitos), plaquetopenia, LRA. Suporte; evitar antibiótico e antiperistálticos na diarreia por EHEC.", "rac": "Diarreia sanguinolenta + tríade = SHU.", "pista": "'Esquizócitos'.", "mud": "Sem esquizócitos e com plaquetas normais, outra causa de LRA seria buscada.", "cmp": "Ver A08: antidiarreicos não são rotina na diarreia aguda da criança.", "arm": "Tratar a diarreia sanguinolenta com antidiarreico.", "regra": "Sangue nas fezes + palidez + pouca urina: pense em SHU.", "cf": "Exames: hemograma, esfregaço, LDH, haptoglobina, função renal, eletrólitos.", "fonte": "F2, Seção 14, pp. 32–33"}]}, {"id": "A15", "titulo": "Consulta do adolescente: comunicação, sigilo e saúde sexual e reprodutiva", "arq": "F2", "pags": "34–35", "bloco": 5, "q": [{"n": 1, "sub": "Estrutura da consulta", "comp": "Organizar os momentos da consulta", "tags": ["osce"], "rel": ["A01"], "enun": "Adolescente de 15 anos vem à consulta com a mãe. Após apresentar-se aos dois, colher motivo da consulta, antecedentes e explicar as regras de sigilo, qual o próximo momento?", "ops": [["Conversar a sós com o adolescente e aplicar o HEEADSSS.", "Correta: momento 2 da consulta."], ["Examinar o adolescente na presença da mãe e encerrar com orientações a ambos.", "Errada: pula o momento a sós, central na consulta."], ["Pedir à mãe que relate os comportamentos de risco do filho antes de falar com ele.", "Errada: a abordagem se dirige ao adolescente."], ["Encerrar com o plano terapêutico e solicitar retorno com exames laboratoriais.", "Errada: falta a conversa a sós e o exame."]], "conc": "Momento 1: adolescente + responsável (apresentação, motivo, antecedentes, vacinas, desenvolvimento, regras de sigilo). Momento 2: adolescente sozinho (queixa na versão dele, HEEADSSS, SSR, substâncias, saúde mental, limites do sigilo). Exame com acompanhante se desejado. Momento 3: fechamento com o responsável, apenas o pactuado.", "rac": "Momento 1 concluído → momento 2.", "pista": "'Explicar as regras de sigilo' encerra o momento 1.", "mud": "Se o adolescente não quiser ficar sozinho, respeitar e tentar em outra oportunidade.", "cmp": "Privacidade (atendido sozinho), confidencialidade (não repassado sem autorização), sigilo com limites.", "arm": "Conduzir toda a consulta com o responsável falando pelo adolescente.", "regra": "Junto, a sós, exame, fechamento pactuado.", "cf": "No exame: antropometria, IMC, PA, Tanner, acne, tireoide, teste de Adams, mamas e genitália quando indicado.", "fonte": "F2, Seção 15, p. 34"}, {"n": 2, "sub": "Sigilo e contracepção", "comp": "Manter sigilo na saúde sexual do adolescente", "tags": ["osce"], "rel": [], "enun": "Adolescente de 16 anos, com relações sexuais consentidas com o namorado de 17 anos, pede contraceptivo e não quer que a mãe saiba. Qual a conduta?", "ops": [["Manter o sigilo, orientar dupla proteção e prescrever o método.", "Correta: atividade sexual consentida acima de 14 anos não justifica quebra de sigilo."], ["Prescrever apenas com autorização da mãe, por ser menor de 18 anos.", "Errada: o adolescente pode ser atendido sem autorização dos pais, inclusive em SSR."], ["Quebrar o sigilo, pois a vida sexual na adolescência é situação de risco.", "Errada: não é, por si, motivo de quebra de sigilo."], ["Exigir exame especular antes de iniciar qualquer contraceptivo hormonal.", "Errada: o exame especular não é pré-requisito."]], "conc": "CEM art. 74: vedado revelar sigilo de paciente adolescente, inclusive aos pais, se houver discernimento, salvo risco de dano. MS: atendimento sem presença ou autorização dos pais, inclusive em SSR. Atividade sexual consentida > 14 anos, contraceptivo ou orientação sexual não são, por si, motivo de quebra.", "rac": "16 anos + consentimento + parceiro de 17 → não há violência presumida; há direito ao sigilo.", "pista": "'Consentidas' e idade > 14.", "mud": "Se ela tivesse 13 anos, a situação seria de estupro de vulnerável (CP art. 217-A).", "cmp": "Dupla proteção: preservativo (IST) + método eficaz.", "arm": "Confundir 'menor de idade' com 'sem direito ao sigilo'.", "regra": "Sexo consentido acima de 14 não quebra sigilo.", "cf": "Oferecer testes rápidos de HIV, sífilis e hepatites B e C.", "fonte": "F2, Seção 15, pp. 34–35"}, {"n": 3, "sub": "Quebra de sigilo", "comp": "Identificar quando e como quebrar o sigilo", "tags": ["osce"], "rel": [], "enun": "Adolescente de 14 anos relata, na conversa a sós, que pensa em se matar e já planejou como. Qual a conduta em relação ao sigilo?", "ops": [["Quebrar o sigilo para protegê-lo, avisando-o antes.", "Correta: risco de vida justifica a quebra, sempre avisando antes."], ["Manter sigilo absoluto para preservar o vínculo e reavaliar no próximo retorno.", "Errada: risco de vida é exceção ao sigilo."], ["Contar à mãe sem avisar o adolescente, para evitar que ele negue.", "Errada: o adolescente deve ser avisado antes."], ["Encaminhar a um serviço especializado sem comunicar ninguém da família.", "Errada: a situação de risco exige envolver o responsável."]], "conc": "Quebra de sigilo justificada (sempre avisando antes): risco de vida (ideação suicida com plano, automutilação grave, transtorno alimentar grave), violência contra o adolescente, risco a terceiros, drogas com dependência/risco grave, gravidez com risco, recusa de tratamento indispensável.", "rac": "Ideação com plano = risco de vida.", "pista": "'Já planejou como'.", "mud": "Tristeza sem ideação de risco não justificaria quebra de sigilo.", "cmp": "Fala-modelo: 'Só existe uma exceção: se eu perceber que você ou outra pessoa está correndo um risco sério... vou te avisar antes'.", "arm": "Sigilo absoluto em situação de risco, ou quebra sem avisar.", "regra": "Risco sério: quebra o sigilo, mas avisa antes.", "cf": "No HEEADSSS, o domínio 'Suicide/depression' investiga tristeza, isolamento, automutilação e pensamentos de morte.", "fonte": "F2, Seção 15, pp. 34–35"}, {"n": 4, "sub": "HEEADSSS", "comp": "Aplicar a ordem do HEEADSSS", "tags": ["osce"], "rel": [], "enun": "Ao aplicar o HEEADSSS em uma adolescente de 13 anos, qual estratégia de ordem o material recomenda?", "ops": [["Começar por casa e escola; temas sensíveis depois do vínculo.", "Correta: começar pelos domínios menos invasivos."], ["Começar por sexualidade, que é a principal causa de procura do serviço nessa idade.", "Errada: domínios invasivos ficam para depois."], ["Começar por drogas e suicídio, pelo maior risco de vida.", "Errada: sem vínculo, as respostas tendem a ser menos sinceras."], ["Aplicar apenas os domínios relacionados à queixa principal.", "Errada: o HEEADSSS é rastreamento psicossocial amplo."]], "conc": "HEEADSSS: Home, Education/Employment, Eating, Activities, Drugs, Sexuality, Suicide/depression, Safety (Goldenring e Rosen, 2004). Começar pelos menos invasivos.", "rac": "Vínculo primeiro, temas sensíveis depois.", "pista": "'Ordem'.", "mud": "Nada muda a ordem recomendada; a profundidade se ajusta à idade.", "cmp": "Perguntas neutras quanto a gênero: 'você namora alguém?'.", "arm": "Abrir a conversa com 'você já transou?'.", "regra": "Casa e escola primeiro.", "cf": "Normalizar ajuda: 'muitos jovens da sua idade já experimentaram...'.", "fonte": "F2, Seção 15, p. 35"}, {"n": 5, "sub": "Gravidez em menor de 14 anos", "comp": "Conduzir gravidez em menor de 14 anos", "tags": [], "rel": ["A12"], "enun": "Adolescente de 13 anos chega com teste de gravidez positivo; afirma que a relação foi consentida com o namorado de 19 anos. Qual a conduta?", "ops": [["Violência sexual presumida: acolher, notificar (SINAN), Conselho Tutelar e informar direitos.", "Correta: menor de 14 anos = estupro de vulnerável, independentemente de consentimento."], ["Manter sigilo, pois a adolescente afirma consentimento e tem direito à confidencialidade.", "Errada: o consentimento não afasta o crime em menor de 14 anos."], ["Notificar o caso apenas se a adolescente concordar com a notificação.", "Errada: a notificação é compulsória."], ["Encaminhar somente ao pré-natal de alto risco, sem outras comunicações.", "Errada: falta a proteção e a comunicação obrigatória."]], "conc": "CP art. 217-A: relação sexual com menor de 14 anos é estupro de vulnerável, independentemente de consentimento. Gravidez < 14 anos: violência sexual presumida — acolher, notificar (SINAN), Conselho Tutelar, rede de proteção, informação sobre aborto legal.", "rac": "13 anos < 14 → violência presumida.", "pista": "Idade de 13 anos.", "mud": "Aos 16 anos, com relação consentida, o tema seria pré-natal e sigilo, salvo outros riscos.", "cmp": "ECA art. 13: suspeita ou confirmação de maus-tratos → Conselho Tutelar.", "arm": "Aplicar o raciocínio de sigilo do adolescente maior a uma menor de 14.", "regra": "Menor de 14 + relação sexual = violência presumida.", "cf": "Escuta especializada sem revitimização (Lei 13.431/2017).", "fonte": "F2, Seção 15, pp. 34–35"}, {"n": 6, "sub": "Contracepção na adolescência", "comp": "Indicar métodos contraceptivos", "tags": [], "rel": [], "enun": "Adolescente de 17 anos, nulípara, quer o método mais eficaz possível. Qual orientação está de acordo com o material?", "ops": [["DIU e implante são 1ª linha, inclusive em nulíparas.", "Correta: LARC 1ª linha para adolescentes."], ["O DIU é contraindicado em nulíparas; a pílula é a única opção eficaz para ela.", "Errada: LARC é 1ª linha inclusive para nulíparas."], ["É necessário colher citologia oncótica antes de iniciar qualquer método.", "Errada: rastreamento de colo começa aos 25 anos e não é pré-requisito."], ["O preservativo isolado é suficiente como método de 1ª linha.", "Errada: recomenda-se dupla proteção (preservativo + método eficaz)."]], "conc": "Dupla proteção. LARC (DIU e implante) de 1ª linha, inclusive nulíparas; também pílula, injetável, anel. Prescrição a adolescente com discernimento é ética e legal. Especular não é pré-requisito. Rastreamento de colo: a partir dos 25 anos.", "rac": "'Mais eficaz' + adolescente → LARC.", "pista": "'Nulípara' é a armadilha dos distratores.", "mud": "Se ela quisesse método sem procedimento, pílula, injetável ou anel seriam opções.", "cmp": "LARC (longa duração, alta eficácia) + preservativo (IST).", "arm": "Achar que nuliparidade contraindica DIU.", "regra": "Adolescente: LARC de 1ª linha + preservativo.", "cf": "Vacinação do adolescente: dTpa, meningocócica ACWY, hepatite B, HPV.", "fonte": "F2, Seção 15, p. 35"}, {"n": 7, "sub": "Contracepção de emergência", "comp": "Prescrever contracepção de emergência", "tags": [], "rel": [], "enun": "Adolescente de 15 anos relata rompimento do preservativo há 30 horas. Qual a conduta?", "ops": [["Levonorgestrel 1,5 mg dose única, já; pode ser fornecido sem os pais.", "Correta: até 72 h (eficácia menor até 120 h)."], ["Não há indicação, pois já se passaram mais de 24 horas.", "Errada: o uso vai até 72 h, com eficácia menor até 120 h."], ["Prescrever apenas com autorização do responsável legal.", "Errada: pode ser fornecida a adolescentes."], ["Solicitar beta-hCG e aguardar o resultado antes de prescrever.", "Errada: atrasa a dose, cuja eficácia diminui com o tempo."]], "conc": "Contracepção de emergência: levonorgestrel 1,5 mg dose única, o mais cedo possível, até 72 h (eficácia menor até 120 h); pode ser fornecida a adolescentes.", "rac": "30 h < 72 h → indicar já.", "pista": "'Há 30 horas'.", "mud": "Em violência sexual, somam-se profilaxias para HIV, IST e hepatite B, e escuta especializada.", "cmp": "Contracepção de emergência não substitui método regular: aproveitar para iniciar dupla proteção.", "arm": "Achar que a janela é de 24 h.", "regra": "Quanto antes, melhor; até 72 h, possível até 120 h.", "cf": "Testes rápidos de HIV, sífilis e hepatites B e C e PEP quando indicada.", "fonte": "F2, Seção 15, p. 35"}, {"n": 8, "sub": "Vacina HPV e rastreamento", "comp": "Aplicar o esquema atual da vacina HPV", "tags": [], "rel": [], "enun": "Menino de 12 anos, imunocompetente, nunca vacinado contra HPV. Segundo a Nota Técnica MS nº 41/2024 citada no material, qual o esquema?", "ops": [["Dose única.", "Correta: dose única para meninas e meninos de 9 a 14 anos."], ["Duas doses com intervalo de 6 meses.", "Errada: substituído pela dose única nessa faixa."], ["A vacina é indicada apenas para meninas.", "Errada: meninos de 9 a 14 anos também recebem."], ["Três doses, por ser menor de 15 anos.", "Errada: 3 doses são para imunossuprimidos e vítimas de violência sexual."]], "conc": "HPV: dose única para meninas e meninos de 9 a 14 anos (NT MS 41/2024); resgate até 19 anos; 3 doses para imunossuprimidos e vítimas de violência sexual. Rastreamento de câncer de colo: a partir dos 25 anos (MS).", "rac": "12 anos, imunocompetente → dose única.", "pista": "'Imunocompetente'.", "mud": "Se fosse imunossuprimido ou vítima de violência sexual: 3 doses.", "cmp": "F2, p. 36: HPV dose única 9–14 anos.", "arm": "Repetir o esquema antigo de duas doses.", "regra": "HPV 9–14: uma dose.", "cf": "Um adolescente de 17 anos não vacinado pode receber no resgate até 19 anos.", "fonte": "F2, Seção 15, p. 35; F2, p. 36"}]}], "figs": {"rx": {"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wgARCADwAbADASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAAQFBgcIAwIBCf/EABUBAQEAAAAAAAAAAAAAAAAAAAAB/9oADAMBAAIQAxAAAAHVIZ/NAFO9y2yp3YsIrh3JgR3kSczv2NBFGPha5T6gtgrZOWiV3IiRFQri0CjnotcZqxLnKt+lolSNxdhVEtJUVXJiXFPry0Sj3It4p15LJK7sQAAAAAAAAAAIFPQgFX6PCmpHYQVPN5CEAkr0mK0SWV5IKomrYRf7MuxVC2zOZBJeq6kEWTD6Va/SuMkxq2cuRAvro+ESSSp3IBJH3qQebOwVV4tgKfcLQCt2O5ArSywAAAAAAAAAAAAAAAAAI1JQzui0qFDv1tBlqRaDDLizRLQUr10UFDvNvhm1NpsKWielQzKq0g1mdHy5H8zW6aAAAAAAAAAAAAAAAAAAAAM86G/Osv15pKAm7n3FFvF886t5lqJqwh5b0az40GjZ5i3R5MIKyV+WmZtbzXXbNDmX96pHiXgno9sNBec5cTXU6y5fhDl2b3E125ZmtosXnBOJYKaAQ4mTXnpnNN/My+TcjRCmsmizPjQa76ZXnxc3Wm4wX4jzkuNHOOR0JuVzqC3w/Oz9E/ztGxGm7j7KoVKhwTtHElbN6axCm5cTvprLWoRlqC488nr50WHZ6Z1Y5t/R7GVrePZHvCzgWVflC34Y0WtHse57WD6TRujiUm8O7NIi8+vh8+ffhpiqLqzqefbK4kkkMbWFltsZ4Dkj+sIvhLmzmq7npW6g/O/9EMFFedlHw7SNhkA0qr7t0xi26RzcM/FXwE2pcu6jGXPl+59Hd5ia4eeChGP6VJ2E3Zy8DD6cW4sq+aJvUxh98+z25tjwKWpx4ihokbENp78nz56+GqaEuyghpV8uJLuHpOPy+JP58j8laSNp1jaaxuuk7sDKGr8UhH49KxpcXj2aq919YRxx7qPNBFFUjdCKaEq61Cv89aFzmPHrpxHLyiugrJ3i646uP3wIOLskLDu2mrmMX+/HU9uaN2EyFy5iltfWgbfHTmePn0NNUJemeTn6Fg5cOiU9ODC9Dn6RczijeW40ndFQW+H57/oR+d5GHZmWFnySsrUIHMeTgco/Ia1E7Dy8kj0zkrTxGM3aSzUS9KsTCHRWdriICvfGIXIlTucm+TtpMbVrG0DFzidT2qQqzszvLaPTW7tg3JlXgSfO3E0TnXQeaR5WpVA7ofqclka03nU69lHMVt8lfS0LZryww/Ov9FPzsIr089Cc2pS9rnhydlR   try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}
  return fresh();}
let S=load();
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;render();}}

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function maxRun(a){let m=1,c=1;for(let i=1;i<a.length;i++){c=a[i]===a[i-1]?c+1:1;if(c>m)m=c;}return a.length?m:0;}
function balancedLetters(n){const base=Math.floor(n/4),rest=n%4;const arr=[];for(let k=0;k<4;k++)for(let i=0;i<base;i++)arr.push(k);
  shuffle([0,1,2,3]).slice(0,rest).forEach(k=>arr.push(k));
  let best=shuffle(arr.slice());for(let t=0;t<800&&maxRun(best)>3;t++){const c=shuffle(arr.slice());if(maxRun(c)<maxRun(best))best=c;}return best;}
function letterCounts(sess){const c=[0,0,0,0];sess.qids.forEach(id=>{c[sess.ord[id].indexOf(QMAP[id].correct)]++;});return c;}
function say(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const pct=(a,b)=>b?Math.round(100*a/b):0;
function lastAttempt(id){const t=S.tent[id];return t&&t.length?t[t.length-1]:null;}
function everWrong(id){return (S.tent[id]||[]).some(x=>!x.ok);}

/* ---------- sessão ---------- */
function newSession(opts){
  let qids=opts.qids.slice();if(opts.shuffle)shuffle(qids);
  let sess;for(let tries=0;tries<20;tries++){
    const L=balancedLetters(qids.length),ord={};
    qids.forEach((id,i)=>{const q=QMAP[id];const d=shuffle(q.ops.filter(o=>o.id!==q.correct).map(o=>o.id));d.splice(L[i],0,q.correct);ord[id]=d;});
    sess={id:Date.now(),modo:opts.modo,label:opts.label,qids,ord,resp:{},conf:{},done:{},cur:0,finished:false,startedAt:Date.now()};
    const c=letterCounts(sess);if(Math.max(...c)-Math.min(...c)<=1)break;}
  S.session=sess;save();view='quiz';render();window.scrollTo(0,0);}
function record(sess,id){const r=sess.resp[id];if(!r)return;const ok=r===QMAP[id].correct;
  (S.tent[id]=S.tent[id]||[]).push({opt:r,ok,conf:sess.conf[id]||null,at:Date.now(),modo:sess.modo});}
function finishSession(){const s=S.session;if(!s||s.finished)return;
  if(s.modo==='prova')s.qids.forEach(id=>record(s,id));
  s.finished=true;s.finishedAt=Date.now();const r=summarize(s);
  S.hist.push({at:s.finishedAt,modo:s.modo,label:s.label,n:s.qids.length,ok:r.ok,bad:r.bad,blank:r.blank});
  save();view='result';render();window.scrollTo(0,0);}
function summarize(s){let ok=0,bad=0,blank=0;const byA={},byB={},byC={baixa:[0,0],media:[0,0],alta:[0,0],'sem registro':[0,0]};
  s.qids.forEach(id=>{const q=QMAP[id],r=s.resp[id],answered=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    const a=byA[q.aula]=byA[q.aula]||{ok:0,bad:0,blank:0},b=byB[AULA[q.aula].bloco]=byB[AULA[q.aula].bloco]||{ok:0,bad:0,blank:0};
    if(!answered){blank++;a.blank++;b.blank++;return;}
    const k=s.conf[id]||'sem registro';const good=r===q.correct;byC[k][1]++;if(good){ok++;a.ok++;b.ok++;byC[k][0]++;}else{bad++;a.bad++;b.bad++;}});
  return {ok,bad,blank,byA,byB,byC};}

function poolCustom(){return ALLQ.filter(id=>custom.aulas.has(QMAP[id].aula)&&(!custom.osce||QMAP[id].tags.includes('osce')));}

function vQuiz(){const s=S.session;if(!s){view='home';return vHome();}
  const id=s.qids[s.cur],q=QMAP[id],a=AULA[q.aula];const ord=s.ord[id];const r=s.resp[id];
  const reveal=s.finished||(s.modo==='estudo'&&s.done[id]);const answeredN=Object.keys(s.modo==='prova'?s.resp:s.done).length;

    if(s.finished||(s.modo==='estudo'&&s.done[qid])){if(rr)c+=rr===QMAP[qid].correct?' ok':' bad';}else if(rr)c+=' ans';
    if(i===s.cur)c+=' cur';if(S.marks.includes(qid))c+=' mk';

    ${navOpen?`<div class="navgrid">${nav}</div><p class="small muted">Legenda: ponto amarelo = marcada para rever${s.modo==='prova'&&!s.finished?'; azul = respondida':'; verde = correta; vermelho = errada'}.</p>`:''}

    <p class="enun">${esc(q.enun)}</p>

    <div class="opts" role="group" aria-label="Alternativas">

        return `<button class="${cls}" data-act="pick" data-v="${oid}" aria-pressed="${r===oid}" ${reveal?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o.t)}${tag?`<span class="tag">${tag}${tag==='Correta'&&oid===r?' · sua resposta':''}</span>`:''}</span></button>`;}).join('')}

      <div class="row"><button class="btn" data-act="mark" aria-pressed="${marked}">${marked?'Desmarcar revisão':'Marcar para rever'}</button>

    </div>

function finishBox(s){const pend=s.qids.filter(id=>!(s.modo==='prova'?s.resp[id]:s.done[id])).length;

function correction(q,r,ord){const ci=ord.indexOf(q.correct),co=q.ops.find(o=>o.id===q.correct);
  const ban=!r?`<div class="banner blank">Em branco. A resposta correta é a ${LET[ci]}.</div>`:(r===q.correct?`<div class="banner ok">Você acertou: alternativa ${LET[ci]}.</div>`:`<div class="banner bad">Você marcou ${LET[ord.indexOf(r)]}; a correta é a ${LET[ci]}.</div>`);
  const fig=q.figc&&DATA.figs[q.figc]?figHtml(q.figc):'';
  const rel=q.rel.length?`<p class="small muted">Relaciona-se com: ${q.rel.map(x=>esc(x.replace('A','Aula ')+' — '+AULA[x].titulo)).join('; ')}.</p>`:'';
  return `<div class="aula">${ban}
  <h3>Mini-aula</h3>
  <dl>
   <div><dt>Resposta</dt><dd><b>${LET[ci]}.</b> ${esc(co.t)} ${esc(cap(co.a.replace(/^Correta[^:]*:\s*/,'')))}</dd></div>
   <div><dt>Conceito</dt><dd>${esc(q.ma.conc)}</dd></div>
   <div><dt>Raciocínio passo a passo</dt><dd>${esc(q.ma.rac)}</dd></div>
   <div><dt>Análise das alternativas</dt><dd><ul class="alts">${ord.map((oid,i)=>{const o=q.ops.find(x=>x.id===oid);return `<li><b>${LET[i]}</b><span>${esc(o.a)}</span></li>`;}).join('')}</ul></dd></div>
   <div><dt>Pista decisiva</dt><dd>${esc(q.ma.pista)}</dd></div>
   <div><dt>O que mudaria a resposta</dt><dd>${esc(q.ma.mud)}</dd></div>
   <div><dt>Comparação principal</dt><dd>${esc(q.ma.cmp)}</dd></div>
   <div><dt>Armadilha</dt><dd>${esc(q.ma.arm)}</dd></div>
   <div><dt>Regra de ouro</dt><dd class="gold">${esc(q.ma.regra)}</dd></div>
   <div><dt>Aplicação</dt><dd>${esc(q.ma.cf)}</dd></div>
   <div><dt>Fonte</dt><dd class="small">${esc(q.fonte.replace(/\bF1\b/g,'F1 ('+ARQ.F1+')').replace(/\bF2\b/g,'F2 ('+ARQ.F2+')'))}</dd></div>
  </dl>${fig}${rel}</div>`;}
function figHtml(k){const f=DATA.figs[k];return `<figure><span class="eyebrow">Figura do material</span>${f.rot?`<canvas data-fig="${k}" role="img" aria-label="${esc(f.alt)}"></canvas><div class="row"><button class="btn" data-act="rotfig" data-v="${k}">Ver na orientação original</button></div>`:`<img src="${f.src}" alt="${esc(f.alt)}">`}<figcaption>${esc(f.cap)}</figcaption></figure>`;}
const figRot={};
function drawFigs(){document.querySelectorAll('canvas[data-fig]').forEach(cv=>{const k=cv.dataset.fig,f=DATA.figs[k];const img=new Image();img.onload=()=>{const rot=!figRot[k];
  const ctx=cv.getContext('2d');if(rot){cv.width=img.height;cv.height=img.width;ctx.translate(cv.width,0);ctx.rotate(Math.PI/2);}else{cv.width=img.width;cv.height=img.height;}ctx.drawImage(img,0,0);};img.src=f.src;});}

function vResult(){const s=S.session;if(!s||!s.finished){view='home';return vHome();}const r=summarize(s);const n=s.qids.length;
  const answered=r.ok+r.bad;
  const aulas=Object.keys(r.byA).sort();
  const weak=aulas.map(k=>({k,...r.byA[k],t:r.byA[k].ok+r.byA[k].bad+r.byA[k].blank})).filter(x=>x.bad+x.blank>0).sort((x,y)=>(y.bad+y.blank)/y.t-(x.bad+x.blank)/x.t);
  const strong=aulas.filter(k=>{const x=r.byA[k];return x.bad===0&&x.blank===0&&x.ok>0;});
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Relatório · ${s.modo==='prova'?'modo prova':'modo estudo'}</span><h1>${esc(s.label)}</h1>

  <section><div class="grid2">

   <div class="stat"><span class="small muted">Acertos sobre as respondidas</span><b>${r.ok}/${answered} · ${pct(r.ok,answered)}%</b></div>
   <div class="stat"><span class="small muted">Erros</span><b>${r.bad}</b></div>
   <div class="stat"><span class="small muted">Em branco</span><b>${r.blank}</b></div></div></section>
  <section><h2>Por aula</h2><div class="tbl"><table><thead><tr><th>Aula</th><th>Acertos</th><th>Erros</th><th>Branco</th><th>%</th></tr></thead><tbody>
   ${aulas.map(k=>{const x=r.byA[k],t=x.ok+x.bad+x.blank;return `<tr><td><b class="mono">${k}</b> ${esc(AULA[k].titulo)}</td><td class="n">${x.ok}</td><td class="n">${x.bad}</td><td class="n">${x.blank}</td><td class="n"><div class="bar" title="${pct(x.ok,t)}%"><i style="width:${pct(x.ok,t)}%"></i></div>${pct(x.ok,t)}% de ${t}</td></tr>`;}).join('')}
  </tbody></table></div></section>
  <section><h2>Por bloco</h2><div class="tbl"><table><thead><tr><th>Bloco</th><th>Acertos</th><th>Total</th></tr></thead><tbody>
   ${Object.keys(r.byB).map(b=>{const x=r.byB[b],t=x.ok+x.bad+x.blank;return `<tr><td>${esc(BLOCOS[b])}</td><td class="n">${x.ok} (${pct(x.ok,t)}%)</td><td class="n">${t}</td></tr>`;}).join('')}</tbody></table></div></section>
  <section><h2>Por confiança declarada</h2><div class="tbl"><table><thead><tr><th>Confiança</th><th>Acertos / respondidas</th></tr></thead><tbody>
   ${Object.entries(r.byC).filter(([k,v])=>v[1]).map(([k,v])=>`<tr><td>${k==='media'?'média':k}</td><td class="n">${v[0]}/${v[1]} (${pct(v[0],v[1])}%)</td></tr>`).join('')||'<tr><td colspan="2">Nenhuma resposta respondida.</td></tr>'}</tbody></table></div>
   ${r.byC.alta[1]-r.byC.alta[0]>0?`<p class="notice">${r.byC.alta[1]-r.byC.alta[0]} erro(s) com confiança alta: são os mais importantes para revisar, porque indicam um conceito aprendido de forma errada.</p>`:''}</section>
  <section><h2>Plano de revisão</h2>
   ${weak.length?`<ul class="plain">${weak.map(x=>`<li><b>${esc(AULA[x.k].titulo)}</b>: ${x.bad} erro(s) e ${x.blank} em branco de ${x.t}. Reler ${esc(AULA[x.k].arq)} (${esc(ARQ[AULA[x.k].arq])}), pp. ${esc(AULA[x.k].pags)}, e refazer pelo caderno de erros.</li>`).join('')}</ul>`:'<p>Nenhum erro nem questão em branco neste simulado.</p>'}
   ${strong.length?`<p class="small muted">Pontos fortes: ${strong.map(k=>esc(AULA[k].titulo)).join('; ')}.</p>`:''}</section>
  <section><h2>Próximos passos</h2><div class="row">
   <button class="btn primary" data-act="reviewsess">Ver correção questão a questão</button>
   <button class="btn" data-act="redo">Refazer as mesmas questões</button>
   <button class="btn" data-act="redraw">Novo sorteio das mesmas aulas</button>
   <button class="btn" data-act="go" data-v="erros">Caderno de erros</button></div></section>
  <section><h2>Exportar resultado</h2><p class="small muted">Gera uma tabela (CSV) com sua resposta, a correta e a confiança de cada questão. Nada é enviado a servidores.</p>
   <div class="row"><button class="btn" data-act="csvcopy">Copiar CSV</button><button class="btn" data-act="csvdl">Baixar CSV</button><button class="btn" data-act="csvshow">${csvShown?'Ocultar texto':'Mostrar texto'}</button></div>
   ${csvShown?`<label for="csvt" class="small muted">Selecione e copie o texto abaixo se os botões não funcionarem neste aplicativo.</label><textarea id="csvt" readonly>${esc(csv(s))}</textarea>`:''}</section>`;}
function csv(s){const rows=[['questao','aula','subtema','sua_resposta','resposta_correta','resultado','confianca']];
  s.qids.forEach(id=>{const q=QMAP[id],ord=s.ord[id],r=s.resp[id],ans=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    rows.push([id,AULA[q.aula].titulo,q.sub,ans?LET[ord.indexOf(r)]+') '+q.ops.find(o=>o.id===r).t:'',LET[ord.indexOf(q.correct)]+') '+q.ops.find(o=>o.id===q.correct).t,ans?(r===q.correct?'acerto':'erro'):'branco',s.conf[id]||'']);});
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');}

function vErros(){const ids=ALLQ.filter(everWrong);
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Caderno de erros</span><h1>Questões que você já errou</h1>
  <p class="muted">A primeira resposta fica registrada para sempre; refazer a questão cria uma nova tentativa. Uma questão passa a "revisada" quando a última tentativa está correta.</p></header>
  ${ids.length?`<div class="row"><button class="btn primary" data-act="rev" data-v="pend">Treinar as pendentes (${ids.filter(id=>!lastAttempt(id).ok).length})</button></div>
  <div class="stack">${ids.map(id=>{const q=QMAP[id],t=S.tent[id],first=t[0],firstWrong=t.find(x=>!x.ok),rev=lastAttempt(id).ok;
    const txt=o=>esc(q.ops.find(x=>x.id===o).t);
    return `<div class="card stack"><div class="qmeta"><span class="chip acc mono">${id}</span><span class="chip">${esc(AULA[q.aula].titulo)}</span><span class="chip">${rev?'Revisada':'Pendente'}</span><span class="chip mono">${t.length} tentativa(s)</span></div>
      <p>${esc(q.enun)}</p>
      <p class="small"><b>Primeira resposta:</b> ${txt(first.opt)} ${first.ok?'(acerto)':'(erro)'}${first.conf?` · confiança ${first.conf==='media'?'média':first.conf}`:''}</p>
      ${first.ok?`<p class="small"><b>Primeiro erro:</b> ${txt(firstWrong.opt)}</p>`:''}
      <p class="small"><b>Correta:</b> ${txt(q.correct)}</p>
      <details><summary>Ver explicação</summary><p class="small">${esc(q.ma.conc)}</p><p class="small gold">${esc(q.ma.regra)}</p><p class="small muted">${esc(q.fonte)}</p></details>
      <div class="row"><button class="btn" data-act="one" data-v="${id}">Refazer esta questão</button></div></div>`;}).join('')}</div>`
  :'<p class="card">Nenhum erro registrado ainda. Os erros dos simulados aparecem aqui automaticamente.</p>'}`;}

function vSobre(){return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Sobre o simulado</span><h1>Fontes, cobertura e critérios</h1></header>
  <section><h2>Material-base</h2><div class="tbl"><table><thead><tr><th>Código</th><th>Arquivo</th><th>Conteúdo</th></tr></thead><tbody>
   <tr><td class="n">F1</td><td>${esc(ARQ.F1)}</td><td>HAM PED, 4º período, Aulas 1–8 (pp. 3–21) e Aula Revisão (p. 22), com anotações manuscritas</td></tr>
   <tr><td class="n">F2</td><td>${esc(ARQ.F2)}</td><td>OSCE HAM Pediatria, Seções 9–15 (pp. 21–35), Revisão relâmpago (p. 36) e Referências</td></tr></tbody></table></div>
   <p class="small muted">Cada aula de F1 e cada seção de F2 é uma unidade: 15 unidades × 8 questões = 120 questões e 480 alternativas. As páginas de revisão não viraram unidades; foram usadas como complemento nas correções. As páginas citam o número impresso no rodapé de cada PDF.</p></section>
  <section><h2>Cobertura por aula</h2><div class="stack">${DATA.aulas.map(a=>`<details class="card"><summary>${a.id} · ${esc(a.titulo)} <span class="muted small">(${a.arq}, pp. ${esc(a.pags)})</span></summary><ul class="plain small">${a.q.map(q=>`<li><span class="mono">Q${String(q.n).padStart(2,'0')}</span> ${esc(q.sub)}: ${esc(q.comp)}</li>`).join('')}</ul></details>`).join('')}</div></section>
  <section><h2>Critérios adotados</h2><ul class="plain small">${DATA.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Gabarito</h2><p class="small muted">A posição da alternativa correta é sorteada a cada simulado, com quantidades equilibradas de A, B, C e D (diferença máxima de 1) e sem mais de três letras iguais seguidas sempre que possível. Ao retomar um simulado, a ordem salva é mantida.</p></section>
  <section><h2>Uso</h2><p class="small muted">Material de estudo para prova e OSCE de graduação. Não substitui protocolos institucionais nem a conferência de doses e condutas no atendimento real.</p></section>`;}

/* ---------- eventos ---------- */
function bind(){document.querySelectorAll('[data-act]').forEach(el=>{const ev=(el.type==='checkbox'||el.type==='range')?(el.type==='range'?'input':'change'):'click';el.addEventListener(ev,e=>act(el.dataset.act,el.dataset.v,el,e));});}
function startAula(aid){newSession({modo:'estudo',qids:ALLQ.filter(id=>QMAP[id].aula===aid),label:aid.replace('A','Aula ')+' · '+AULA[aid].titulo,shuffle:false});}
function act(a,v,el){const s=S.session;
  switch(a){
  case 'go':view=v;confirmReset=false;render();window.scrollTo(0,0);break;
  case 'resume':view='quiz';render();break;
  case 'fullmodo':fullModo=v;render();break;
  case 'full':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · 120 questões',shuffle:false});break;
  case 'fullshuf':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · ordem embaralhada',shuffle:true});break;
  case 'aula':startAula(v);break;
  case 'custom':view='custom';render();window.scrollTo(0,0);break;
  case 'caula':el.checked?custom.aulas.add(v):custom.aulas.delete(v);custom.qtd=0;render();break;
  case 'call':DATA.aulas.forEach(x=>custom.aulas.add(x.id));custom.qtd=0;render();break;
  case 'cnone':custom.aulas.clear();custom.qtd=0;render();break;
  case 'cosce':custom.osce=el.checked;custom.qtd=0;render();break;
  case 'cqtd':custom.qtd=+el.value;document.getElementById('qtdv').textContent=custom.qtd;document.querySelector('[data-act="cstart"]').textContent='Começar '+custom.qtd+' questões';break;
  case 'cmodo':custom.modo=v;render();break;
  case 'cshuf':custom.shuf=el.checked;break;
  case 'cstart':{let pool=poolCustom();const n=custom.qtd||pool.length;if(n<pool.length){pool=shuffle(pool.slice()).slice(0,n);pool.sort((x,y)=>ALLQ.indexOf(x)-ALLQ.indexOf(y));}
    newSession({modo:custom.modo,qids:pool,label:'Personalizado · '+pool.length+' questões'+(custom.osce?' (OSCE)':''),shuffle:custom.shuf});break;}
  case 'rev':{let ids=[],label='';
    if(v==='erradas'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok;});label='Revisão das erradas';}
    if(v==='alta'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok&&l.conf==='alta';});label='Erros de alta confiança';}
    if(v==='marcadas'){ids=ALLQ.filter(id=>S.marks.includes(id));label='Questões marcadas';}
    if(v==='favs'){ids=ALLQ.filter(id=>S.favs.includes(id));label='Favoritas';}
    if(v==='pend'){ids=ALLQ.filter(id=>everWrong(id)&&!lastAttempt(id).ok);label='Caderno de erros · pendentes';}
    if(ids.length)newSession({modo:'estudo',qids:ids,label,shuffle:false});break;}
  case 'one':newSession({modo:'estudo',qids:[v],label:'Refazer '+v,shuffle:false});break;
  case 'reset':confirmReset=true;render();break;
  case 'resetno':confirmReset=false;render();break;
  case 'resetyes':S=fresh();save();confirmReset=false;render();say('Progresso apagado.');break;
  case 'nav':navOpen=!navOpen;render();break;
  case 'jump':s.cur=+v;confirmFinish=false;save();render();window.scrollTo(0,0);break;
  case 'prev':if(s.cur>0){s.cur--;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'next':if(s.cur<s.qids.length-1){s.cur++;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'pick':{const id=s.qids[s.cur];if(s.finished||(s.modo==='estudo'&&s.done[id]))break;s.resp[id]=v;save();render();
    if(s.modo==='prova')say('Resposta registrada.');break;}
  case 'conf':{const id=s.qids[s.cur];s.conf[id]=s.conf[id]===v?undefined:v;save();render();break;}
  case 'confirm':{const id=s.qids[s.cur];if(!s.resp[id])break;s.done[id]=true;record(s,id);save();render();
    say(s.resp[id]===QMAP[id].correct?'Resposta correta.':'Resposta incorreta. Veja a correção.');break;}
  case 'mark':{const id=s.qids[s.cur];const i=S.marks.indexOf(id);i>=0?S.marks.splice(i,1):S.marks.push(id);save();render();break;}
  case 'fav':{const id=s.qids[s.cur];const i=S.favs.indexOf(id);i>=0?S.favs.splice(i,1):S.favs.push(id);save();render();break;}
  case 'finish':confirmFinish=true;render();break;
  case 'finishno':confirmFinish=false;render();break;
  case 'finishyes':confirmFinish=false;finishSession();break;
  case 'reviewsess':s.cur=0;view='quiz';render();window.scrollTo(0,0);break;
  case 'redo':newSession({modo:s.modo,qids:s.qids.slice(),label:s.label+' (refeito)',shuffle:false});break;
  case 'redraw':{const aulas=new Set(s.qids.map(id=>QMAP[id].aula));const pool=ALLQ.filter(id=>aulas.has(QMAP[id].aula));
    newSession({modo:s.modo,qids:pool,label:'Novo sorteio · '+aulas.size+' aula(s)',shuffle:true});break;}
  case 'csvcopy':{const t=csv(s);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>say('CSV copiado.'),()=>{csvShown=true;render();say('Não foi possível copiar; o texto está na caixa abaixo.');});}else{csvShown=true;render();}break;}
  case 'csvdl':{try{const b=new Blob(['﻿'+csv(s)],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='resultado-simulado-hamped.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){}
    csvShown=true;render();say('Se o download não começou, copie o texto exibido.');break;}
  case 'csvshow':csvShown=!csvShown;render();break;
  case 'rotfig':figRot[v]=!figRot[v];el.textContent=figRot[v]?'Ver girada para leitura':'Ver na orientação original';drawFigs();break;
  }}
render();
</script>
