<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado HAM PED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: coluna única de leitura (máx. 760px), barra fixa de progresso no simulado, cartões só para a questão e a correção */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14232B; --muted:#56666E; --line:#D3DDE1;
  --accent:#1C5A72; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2;
  --ok:#276E49; --ok-soft:#E2F1E8; --bad:#A33C2B; --bad-soft:#F8E5E0; --warn:#8A5D0B; --warn-soft:#F7EED9;
  --display:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.3rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile strong{font-size:1.02rem}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.stat b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--muted)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.checks input{margin-top:4px;width:18px;height:18px;flex:none}
.bloco{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
/* topo do simulado */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:40vh;overflow:auto;padding:2px}
.nb{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.85rem;position:relative}
.nb.ans{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{outline:2px solid var(--ink)}
.nb.ok{background:var(--ok-soft);border-color:var(--ok)}
.nb.bad{background:var(--bad-soft);border-color:var(--bad)}
.nb.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enun{font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.opt .L{font-family:var(--mono);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .tag{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.banner{padding:12px 14px;border-radius:8px;font-weight:600}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.blank{background:var(--warn-soft);color:var(--warn)}
.aula{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.aula dl{margin:0;display:flex;flex-direction:column;gap:10px}
.aula dt{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.aula dd{margin:2px 0 0}
.alts{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.alts li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.alts li b{font-family:var(--mono)}
.gold{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:600}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img,figure canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;font-size:.9rem}
.confirmbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.78rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>
<script>
document.documentElement.lang='pt-BR';
const DATA={"aulas": [{"id": "A01", "titulo": "Protocolo SPIKES", "arq": "F1", "pags": "3–4", "bloco": 1, "q": [{"n": 1, "sub": "Conceito de má notícia", "comp": "Reconhecer quando a comunicação exige abordagem de má notícia", "tags": ["osce"], "rel": ["A15"], "enun": "Na maternidade, o teste da orelhinha de um RN de 2 dias veio alterado e exigirá reteste e investigação. Um colega afirma que não é preciso aplicar o SPIKES porque 'não se trata de um diagnóstico grave como câncer'. Segundo o conceito adotado no material, o que caracteriza uma má notícia?", "ops": [["Qualquer informação que muda negativamente a expectativa da pessoa ou da família sobre o futuro.", "Correta: é a definição do material; triagem alterada é um dos exemplos pediátricos citados."], ["Apenas o diagnóstico de doença potencialmente fatal, como neoplasia ou cardiopatia grave.", "Errada: restringe o conceito à gravidade objetiva; o que define é o impacto na expectativa da família."], ["Toda informação clínica que exige assinatura de termo de consentimento pelo responsável.", "Errada: consentimento é questão ético-legal de procedimentos, não define má notícia."], ["A comunicação de óbito ou de prognóstico reservado feita ao responsável legal.", "Errada: são exemplos extremos; o material inclui internação, malformação, triagem alterada e atraso do desenvolvimento."]], "conc": "Má notícia é qualquer informação que muda negativamente a expectativa sobre o futuro. Em pediatria, a conversa costuma ser com os responsáveis e inclui diagnóstico grave, internação, malformação, resultado de triagem alterado, atraso importante do desenvolvimento ou piora clínica.", "rac": "O dado decisivo é o efeito sobre a família: uma mãe que esperava alta tranquila passa a ter uma dúvida sobre a audição do filho. Isso já muda a expectativa e justifica preparar a conversa.", "pista": "'Resultado de triagem alterado' está literalmente entre os exemplos do material.", "mud": "Se o reteste já tivesse sido normal e a informação fosse apenas de rotina, não haveria mudança negativa de expectativa.", "cmp": "Gravidade médica (critério do profissional) versus impacto na expectativa (critério da família): o SPIKES se guia pelo segundo.", "arm": "Achar que só 'notícia trágica' merece estrutura; notícias aparentemente pequenas mal comunicadas geram ansiedade e perda de vínculo.", "regra": "Se a informação piora o futuro esperado pela família, é má notícia e merece SPIKES.", "cf": "Informar que a criança precisará ficar internada mais 3 dias para antibiótico também é má notícia, ainda que o prognóstico seja bom.", "fonte": "F1, Aula 1, p. 3"}, {"n": 2, "sub": "Etapa P — Perception", "comp": "Identificar a fala adequada para explorar a percepção", "tags": ["osce"], "rel": [], "enun": "O ecocardiograma de um RN de 3 dias mostrou uma cardiopatia que precisará de cirurgia. Você já se apresentou, levou os pais a uma sala reservada, sentou-se e desligou o celular. Qual é a próxima fala mais adequada pelo SPIKES?", "ops": [["'O que vocês já entenderam até agora sobre o exame do coração do bebê?'", "Correta: etapa P — descobrir o que a família sabe, entendeu ou suspeita antes de informar."], ["'Posso explicar agora o resultado? Preferem que eu explique tudo de uma vez ou por partes?'", "Errada nesta ordem: é a etapa I, que vem depois de ouvir a percepção."], ["'Infelizmente, o exame mostrou uma alteração importante no coração do bebê.'", "Errada: é a etapa K; dar a notícia sem explorar a percepção pula duas etapas."], ["'O plano é transferir o bebê para o centro cardíaco e conversamos de novo depois.'", "Errada: é a etapa final (Strategy/Summary), usada só depois da informação e do acolhimento."]], "conc": "Perception: descobrir o que a pessoa já sabe, entendeu ou suspeita, corrigindo apenas depois de ouvir.", "rac": "O setting (S) já está completo: sala reservada, sentado, sem interrupções. A sequência S-P-I-K-E-S indica que agora se explora a percepção.", "pista": "O enunciado descreve todas as ações do Setting up — o próximo passo é P.", "mud": "Se os pais já tivessem dito o que entenderam, o próximo passo seria pedir permissão (I).", "cmp": "P pergunta o que eles sabem; I pergunta quanto e como querem saber.", "arm": "Começar 'despejando o diagnóstico' é o primeiro erro que faz a estação perder pontos.", "regra": "Antes de falar, pergunte; antes de corrigir, ouça.", "cf": "Se o pai diz 'acho que é só um sopro que some sozinho', você registra essa percepção para ajustar a explicação depois, sem corrigir de imediato.", "fonte": "F1, Aula 1, p. 3"}, {"n": 3, "sub": "Etapa I — Invitation", "comp": "Aplicar o convite antes de informar", "tags": ["osce"], "rel": [], "enun": "Na mesma conversa, a mãe responde: 'Acho que é só um sopro, a enfermeira disse que é comum'. Seguindo o SPIKES, qual deve ser a conduta seguinte?", "ops": [["Pedir permissão para explicar e perguntar se prefere receber a informação de uma vez ou por partes.", "Correta: etapa I — saber quanto e como a pessoa quer receber a informação naquele momento."], ["Corrigir imediatamente a ideia errada, explicando o tipo de cardiopatia e as cirurgias possíveis.", "Errada: pula o convite e despeja informação técnica sem preparo."], ["Perguntar se ela gostaria que algum familiar estivesse presente antes de começar a conversa.", "Errada neste momento: isso pertence ao Setting up, que já foi feito."], ["Entregar um material escrito sobre cardiopatias e marcar retorno para tirar dúvidas.", "Errada: não informa, não acolhe e encerra sem plano; também perde pontos."]], "conc": "Invitation: perguntar quanto e como a pessoa quer receber a informação. Respeita o ritmo e dá controle à família.", "rac": "A percepção já foi colhida (ela acha que é sopro benigno). Agora se pede permissão e se pergunta o formato preferido.", "pista": "A mãe acabou de responder à pergunta da etapa P.", "mud": "Se ela dissesse 'não quero saber detalhes agora, só o que vai acontecer hoje', a explicação seria limitada ao essencial e ao plano imediato.", "cmp": "Convite (I) é diferente de aviso de preparação (K): o convite pede permissão; o aviso anuncia que a notícia é difícil.", "arm": "Achar que corrigir a percepção errada é urgente; a correção vem dentro do K, depois do convite.", "regra": "Peça licença para informar.", "cf": "Em adolescente com capacidade de participar, o convite também é dirigido a ele, não só ao responsável.", "fonte": "F1, Aula 1, p. 3"}, {"n": 4, "sub": "Etapa K — Knowledge", "comp": "Escolher a fala que transmite a informação corretamente", "tags": ["osce"], "rel": [], "enun": "Após o convite, os pais pedem que você explique. Qual fala executa melhor a etapa Knowledge?", "ops": [["'Infelizmente, o exame mostrou uma alteração importante no coração do bebê. Vou explicar com calma o que isso significa.'", "Correta: aviso de preparação, linguagem simples, bloco curto e abertura para seguir no ritmo da família."], ["'O ecocardiograma evidenciou uma cardiopatia congênita complexa, com prognóstico reservado sem correção cirúrgica precoce.'", "Errada: jargão sem tradução ('cardiopatia complexa', 'prognóstico reservado'), erro citado no material."], ["'Fiquem tranquilos: isso tem cirurgia, os resultados costumam ser ótimos e vai ficar tudo bem.'", "Errada: falsa garantia quando não é possível prometer o desfecho."], ["'Vou explicar tudo agora: o defeito, as cirurgias, os riscos de cada uma e o seguimento até a adolescência.'", "Errada: excesso de informação de uma vez; o material pede blocos curtos e checagem de compreensão."]], "conc": "Knowledge: dar a informação em linguagem simples, em blocos curtos, começando com aviso de preparação, e checar compreensão.", "rac": "Comparar as quatro falas com os critérios: aviso de preparação, linguagem leiga, brevidade, sem promessas. Só a primeira cumpre todos.", "pista": "A palavra 'Infelizmente' funciona como aviso de preparação, exatamente como no exemplo do material.", "mud": "Se os pais fossem profissionais de saúde, poderia haver mais termos técnicos, mas ainda em blocos curtos e com checagem.", "cmp": "Aviso de preparação (prepara para o impacto) versus falsa garantia (anula a gravidade e quebra a confiança).", "arm": "Achar que tecnicismo transmite segurança; para a família, soa distante e confuso.", "regra": "Aviso, uma ou duas frases, pausa.", "cf": "Para dizer 'lesão hipóxico-isquêmica', traduza: 'o cérebro do bebê ficou sem oxigênio suficiente por um tempo e sofreu uma lesão'.", "fonte": "F1, Aula 1, pp. 3–4"}, {"n": 5, "sub": "Etapa E — Emotions/Empathy", "comp": "Conduzir a reação emocional", "tags": ["osce"], "rel": [], "enun": "Logo após ouvir a notícia, a mãe começa a chorar em silêncio e o pai olha para o chão. Qual conduta pontua na etapa Emotions/Empathy?", "ops": [["Tolerar o silêncio e depois nomear e validar a emoção, sem pressa de continuar.", "Correta: reconhecer a emoção, tolerar o silêncio e validar sem frases vazias."], ["Continuar explicando o plano de tratamento para que o silêncio não aumente a angústia do casal.", "Errada: falar rápido para preencher o silêncio é erro listado no material."], ["Dizer 'não chore, a senhora precisa ser forte pelo bebê' e retomar a explicação.", "Errada: tenta interromper o choro e invalida a emoção."], ["Sair da sala e voltar quando os pais estiverem mais calmos, para então concluir a conversa.", "Errada: abandona a família no momento de maior necessidade de acolhimento."]], "conc": "Emotions/Empathy: reconhecer emoção, tolerar silêncio, nomear e validar, sem frases vazias. Só depois continuar com detalhes.", "rac": "O mini-roteiro diz: dê a informação, pare, observe a reação, acolha a emoção e só depois continue.", "pista": "O casal está em reação emocional aguda — não há espaço para mais informação técnica agora.", "mud": "Se os pais perguntassem 'e agora, o que vai acontecer?', seria a hora de seguir para o plano.", "cmp": "Empatia verdadeira nomeia a emoção do outro; frase vazia ('sei como se sente') presume e encerra.", "arm": "O desconforto do próprio estudante com o silêncio leva a falar demais.", "regra": "Silêncio também é intervenção.", "cf": "Se o pai reagir com raiva ('ninguém viu isso no pré-natal!'), também se nomeia e valida a emoção antes de esclarecer fatos.", "fonte": "F1, Aula 1, pp. 3–4"}, {"n": 6, "sub": "Etapa S — Strategy/Summary", "comp": "Encerrar a conversa com plano e checagem", "tags": ["osce"], "rel": [], "enun": "Para encerrar a comunicação da cardiopatia, qual fechamento atende à etapa Strategy/Summary?", "ops": [["Resumir o conhecido e o desconhecido, explicar o próximo passo, checar a compreensão e combinar retorno.", "Correta: resumo, próximos passos, checagem de compreensão e canal para dúvidas."], ["Perguntar 'ficou alguma dúvida?' e, diante da negativa, entregar o pedido de transferência.", "Errada: não resume nem verifica compreensão de forma ativa; encerra sem plano compartilhado."], ["Comunicar a decisão já tomada pela equipe, sem abrir espaço para opiniões dos pais.", "Errada: o material orienta dividir decisões possíveis com a família."], ["Assegurar que a cirurgia resolverá definitivamente o problema do coração e que não haverá sequelas para o bebê.", "Errada: falsa garantia; o fechamento deve distinguir o conhecido do desconhecido."]], "conc": "Strategy/Summary: resumir, explicar próximos passos, dividir decisões possíveis, combinar retorno e deixar canal para dúvidas.", "rac": "O mini-roteiro inclui: explicar o que é conhecido, o que não é e o próximo passo; pedir que a pessoa repita; resumir e combinar retorno.", "pista": "'Repetir com as próprias palavras' é a checagem ativa de compreensão citada no material.", "mud": "Se a família estivesse muito abalada, o resumo seria mínimo e o retorno marcado mais cedo.", "cmp": "'Ficou alguma dúvida?' (pergunta fechada, induz 'não') versus 'o que você entendeu até aqui?' (checagem ativa).", "arm": "Encerrar sem plano concreto, um dos erros que tiram pontos.", "regra": "Fechou a conversa? Resumo + próximo passo + retorno.", "cf": "Frase que salva a estação: 'Antes de continuar, quero saber o que você entendeu até aqui e qual é a sua maior preocupação agora.'", "fonte": "F1, Aula 1, pp. 3–4"}, {"n": 7, "sub": "Erros que perdem pontos", "comp": "Reconhecer conduta penalizada na estação", "tags": ["osce"], "rel": ["A15"], "enun": "Em uma estação, o estudante deve comunicar a uma mãe e ao filho de 13 anos, lúcido e participativo, que o adolescente terá de ser internado para investigação. Qual conduta do estudante faria a estação perder pontos?", "ops": [["Dirigir toda a explicação apenas à mãe, sem incluir o adolescente na conversa.", "Correta (é o erro): o material penaliza ignorar a criança/adolescente com capacidade de participar."], ["Perguntar à mãe e ao adolescente o que eles já entenderam sobre os exames.", "Errada (é conduta adequada): corresponde à etapa P."], ["Trocar 'investigação etiológica' por 'exames para descobrir a causa'.", "Errada (é conduta adequada): traduzir jargão é exigido na etapa K."], ["Fazer uma pausa depois de dar a informação principal e observar a reação.", "Errada (é conduta adequada): é o passo 4 do mini-roteiro."]], "conc": "Erros listados: despejar o diagnóstico; jargão sem tradução; falar rápido para preencher silêncio; falsa garantia; encerrar sem plano ou checagem; ignorar a criança/adolescente capaz de participar.", "rac": "Três opções descrevem condutas recomendadas; apenas uma corresponde a um erro da lista.", "pista": "'13 anos, lúcido e participativo' indica capacidade de participar.", "mud": "Em lactente ou criança sem capacidade de compreender, a conversa é dirigida aos responsáveis.", "cmp": "Comunicação centrada na pessoa (inclui o paciente) versus centrada apenas no responsável.", "arm": "Por hábito, olhar só para o adulto que acompanha.", "regra": "Se o paciente entende, ele também é interlocutor.", "cf": "Na consulta do adolescente (A15), o princípio é o mesmo: dirigir-se ao adolescente, não ao responsável.", "fonte": "F1, Aula 1, p. 3"}, {"n": 8, "sub": "Mini-roteiro de OSCE", "comp": "Ordenar os passos da estação", "tags": ["osce"], "rel": [], "enun": "Pelo mini-roteiro de OSCE do material, o estudante acabou de dar a informação principal em uma ou duas frases. Qual é o passo seguinte?", "ops": [["Parar, observar a reação e acolher a emoção antes de continuar com detalhes.", "Correta: passos 4 e 5 do roteiro — pausa, observação e acolhimento."], ["Explicar imediatamente o que é conhecido, o que não é e o próximo passo.", "Errada: é o passo 6, que vem só depois do acolhimento."], ["Pedir que a pessoa repita com as próprias palavras o que entendeu.", "Errada: é o passo 7, perto do fechamento."], ["Apresentar as opções de tratamento em ordem de preferência da equipe.", "Errada: detalhes técnicos antes do acolhimento atropelam a emoção."]], "conc": "Mini-roteiro: 1) apresentar-se, privacidade; 2) o que sabe e o que preocupa; 3) permissão e aviso; 4) informação em 1–2 frases, pausa; 5) acolher; 6) conhecido/desconhecido/próximo passo; 7) repetir com as próprias palavras; 8) resumir, combinar retorno, espaço para perguntas.", "rac": "Localizar o ponto da conversa (fim do passo 4) e identificar o passo 5.", "pista": "'Dê a informação. Pare. Observe a reação.'", "mud": "Se a pessoa reagisse pedindo detalhes imediatamente, o acolhimento seria breve e se seguiria ao passo 6.", "cmp": "Ordem das etapas SPIKES (K antes de E) é a mesma lógica do roteiro (informar, depois acolher).", "arm": "Ansiedade de 'cumprir o checklist' e emendar tudo em um bloco só.", "regra": "Informação curta, pausa, emoção, depois detalhe.", "cf": "SPIKES é mapa, não texto decorado: se a família chega chorando, o acolhimento pode vir antes de qualquer informação.", "fonte": "F1, Aula 1, pp. 3–4"}]}, {"id": "A02", "titulo": "Anamnese do recém-nascido, APGAR e DNV", "arq": "F1", "pags": "5–6", "bloco": 1, "q": [{"n": 1, "sub": "Cálculo do APGAR", "comp": "Calcular o APGAR a partir de achados clínicos", "tags": ["calculo", "osce"], "rel": ["A03"], "enun": "No 1º minuto de vida, um RN apresenta FC de 120 bpm, respiração lenta e irregular, alguma flexão das extremidades, careta à aspiração de vias aéreas e corpo rosado com extremidades azuladas. Qual é o APGAR?", "ops": [["6", "Correta: FC ≥ 100 = 2; respiração lenta/irregular = 1; alguma flexão = 1; careta = 1; corpo rosado com extremidades azuladas = 1. Total 6."], ["7", "Errada: resulta de pontuar a cor com 2; acrocianose (extremidades azuladas) vale 1."], ["5", "Errada: resulta de pontuar a FC de 120 bpm com 1; o ponto de corte é 100 bpm."], ["8", "Errada: atribuiria 2 pontos à respiração e ao tônus, que só pontuam 2 com choro vigoroso e movimentos ativos/boa flexão."]], "conc": "APGAR avalia cinco componentes (FC, respiração, tônus, irritabilidade reflexa e cor), cada um de 0 a 2, total de 0 a 10.", "rac": "FC: ausente 0, < 100 = 1, ≥ 100 = 2. Respiração: ausente 0, lenta/irregular ou choro fraco 1, boa/choro vigoroso 2. Tônus: flácido 0, alguma flexão 1, movimentos ativos 2. Reflexo: sem resposta 0, careta 1, choro/tosse/espirro 2. Cor: pálido/cianótico 0, corpo rosado e extremidades azuladas 1, completamente rosado 2.", "pista": "Os termos 'lenta e irregular', 'alguma flexão', 'careta' e 'extremidades azuladas' são todos descritores de 1 ponto.", "mud": "Com choro vigoroso e movimentos ativos, o total iria a 8.", "cmp": "Acrocianose (cor = 1) versus cianose/palidez global (cor = 0).", "arm": "Confundir o corte da FC (100 bpm) com o de normalidade neonatal mais alto; acima de 100 já vale 2.", "regra": "Cinco itens, 0–1–2, some na ordem FC-respiração-tônus-reflexo-cor.", "cf": "Anotação de aula: 0–3 grave, 4–6 moderado, 7–10 boa vitalidade; este RN (6) teria comprometimento moderado da vitalidade naquele minuto.", "fonte": "F1, Aula 2, p. 5"}, {"n": 2, "sub": "Momentos de registro do APGAR", "comp": "Aplicar a regra de reavaliação do APGAR", "tags": [], "rel": [], "enun": "Um RN teve APGAR 4 no 1º minuto e 6 no 5º minuto. Segundo o material, como deve prosseguir o registro do APGAR?", "ops": [["Continuar a cada 5 minutos até o 20º minuto, enquanto estiver abaixo de 7.", "Correta: escore < 7 no 5º minuto exige reavaliação de 5 em 5 minutos até o 20º."], ["Encerrar o registro, pois o APGAR oficial é somente o do 1º e do 5º minuto.", "Errada: 1º e 5º são obrigatórios, mas < 7 no 5º exige continuar."], ["Repetir uma única vez no 10º minuto e registrar na ficha apenas o melhor valor obtido.", "Errada: não é uma reavaliação única; segue de 5 em 5 minutos até o 20º."], ["Registrar apenas a partir do momento em que o escore atingir 7 ou mais.", "Errada: os valores baixos também devem ser registrados; descrevem a resposta ao longo do tempo."]], "conc": "O APGAR é registrado no 1º e no 5º minuto; se permanecer < 7 no 5º, continua a cada 5 minutos até o 20º.", "rac": "O 5º minuto foi 6, ou seja, < 7 — aciona a regra de continuidade.", "pista": "O número 6 no 5º minuto.", "mud": "Se o 5º minuto fosse 8, bastariam os registros do 1º e do 5º.", "cmp": "APGAR registra evolução; não é ferramenta para decidir manobras.", "arm": "Achar que o APGAR 'termina' no 5º minuto em qualquer caso.", "regra": "Menor que 7 no 5º? Siga de 5 em 5 até o 20º.", "cf": "Na DNV, porém, só são registrados os valores do 1º e do 5º minuto.", "fonte": "F1, Aula 2, p. 5"}, {"n": 3, "sub": "APGAR e reanimação", "comp": "Reconhecer os limites do APGAR", "tags": ["osce"], "rel": [], "enun": "Um RN nasce apneico e hipotônico. Um estudante na sala de parto propõe aguardar o APGAR de 1 minuto para decidir se inicia manobras. Qual afirmação está correta?", "ops": [["Agir pela avaliação clínica e pelo algoritmo de reanimação, sem esperar o APGAR.", "Correta: pegadinha do material — o APGAR não decide sozinho a reanimação."], ["É correto aguardar, pois o APGAR de 1 minuto define a indicação de ventilação.", "Errada: atrasar a assistência à espera do escore é exatamente o erro apontado."], ["APGAR de 1 minuto ≤ 3 confirma asfixia perinatal e indica reanimação avançada.", "Errada: o APGAR não deve ser usado isoladamente para diagnosticar asfixia."], ["A decisão deve ser tomada com o APGAR do 5º minuto, que tem maior valor prognóstico para o RN.", "Errada: esperar 5 minutos para agir é ainda mais grave; o escore descreve, não decide."]], "conc": "O APGAR descreve a condição e a resposta do RN ao longo dos minutos. Não decide sozinho as manobras e não diagnostica asfixia isoladamente.", "rac": "Apneia e hipotonia ao nascer exigem ação imediata pelo algoritmo; o escore será atribuído em paralelo.", "pista": "'Aguardar o APGAR para decidir' é o erro descrito na caixa PEGADINHA.", "mud": "Nada muda essa regra: em qualquer RN que não respira ao nascer, a decisão é clínica e imediata.", "cmp": "APGAR (descrição) versus avaliação inicial da reanimação (decisão).", "arm": "Associar 'número baixo' a 'indicação' e esperar o número existir.", "regra": "Primeiro age, depois pontua.", "cf": "Um RN com APGAR 8 no 1º minuto pode ainda assim precisar de cuidados se surgir desconforto respiratório depois.", "fonte": "F1, Aula 2, p. 6"}, {"n": 4, "sub": "Anamnese do parto", "comp": "Relacionar dados do parto ao risco neonatal", "tags": [], "rel": [], "enun": "Na anamnese de um RN, qual informação do bloco 'parto' é a que mais ajuda a estimar risco de sepse neonatal?", "ops": [["Bolsa rota prolongada com febre materna durante o trabalho de parto.", "Correta: bolsa rota e febre/corioamnionite são dados do parto ligados a risco infeccioso."], ["Líquido amniótico meconial espesso durante o trabalho de parto.", "Errada: mecônio é dado do parto relacionado sobretudo a asfixia/sofrimento, não primariamente a sepse."], ["Macrossomia fetal com distocia de ombro no período expulsivo.", "Errada: relaciona-se a trauma de parto (fratura de clavícula, lesão de plexo)."], ["Cesárea eletiva por cesárea anterior, sem trabalho de parto.", "Errada: não é fator de risco infeccioso; a indicação da cesárea deve ser registrada por outros motivos."]], "conc": "O bloco 'parto' (IG, via e indicação, bolsa rota, febre/corioamnionite, mecônio, apresentação) ajuda a estimar risco de sepse, trauma, asfixia e prematuridade.", "rac": "Associar cada dado a seu risco principal: bolsa rota + febre → sepse; mecônio → asfixia; distocia → trauma.", "pista": "'Febre materna' é a palavra-chave infecciosa.", "mud": "Se a pergunta fosse sobre risco de trauma, a resposta seria a distocia de ombro.", "cmp": "Revisão relâmpago (F2, p. 36): bolsa rota de risco ≥ 18 h.", "arm": "Ver 'mecônio' e pensar em infecção.", "regra": "Bolsa rota e febre materna = pense em sepse.", "cf": "RN de mãe com bolsa rota há 20 h e febre intraparto deve ter a anamnese e o exame focados em sinais precoces de infecção.", "fonte": "F1, Aula 2, p. 5; F2, p. 36"}, {"n": 5, "sub": "Eliminações e prevenção", "comp": "Identificar lacuna relevante na anamnese do RN", "tags": ["osce"], "rel": ["A07", "A13"], "enun": "RN de 30 horas em alojamento conjunto: aleitamento exclusivo, BCG e hepatite B aplicadas, exame físico normal. O prontuário não informa se houve diurese nem eliminação de mecônio. Qual a conduta correta na anamnese?", "ops": [["Perguntar e registrar a primeira diurese e o mecônio, porque o atraso pode sinalizar doença.", "Correta: eliminações fazem parte da anamnese; atraso de mecônio/diurese pode sinalizar doença."], ["Considerar irrelevante enquanto o RN estiver mamando bem e sem distensão abdominal.", "Errada: mamar bem não substitui a informação; atraso pode indicar obstrução ou outras doenças."], ["Solicitar radiografia de abdome para confirmar a passagem de mecônio pelo cólon.", "Errada: a informação é obtida por anamnese; não há indicação de imagem."], ["Deixar o registro para a consulta de puericultura da primeira semana de vida.", "Errada: a lacuna deve ser preenchida antes da alta, na avaliação neonatal."]], "conc": "O bloco eliminações pergunta primeira diurese e mecônio, frequência atual e cor das fezes e urina.", "rac": "Com 30 horas, já se espera diurese (até 24 h) e, na maioria, mecônio (até 24–48 h), segundo a revisão relâmpago.", "pista": "'O prontuário não informa' — a falha é de registro, resolvida pela anamnese.", "mud": "Se o RN não tivesse eliminado mecônio após 48 h, seria sinal de alarme (pensar em Hirschsprung).", "cmp": "Anotação de aula: mecônio = primeiras fezes, 24–48 h no máximo.", "arm": "Confiar no 'mama bem' e esquecer as eliminações.", "regra": "Entrou, saiu? Pergunte diurese e mecônio.", "cf": "No bloco prevenção, lacuna de testes do pezinho, olhinho, orelhinha e coraçãozinho também deve ser conferida.", "fonte": "F1, Aula 2, p. 5; F2, p. 36"}, {"n": 6, "sub": "DNV — definição de nascido vivo", "comp": "Decidir sobre a emissão da DNV", "tags": [], "rel": [], "enun": "Gestação de 21 semanas: o RN, com 380 g, apresenta batimentos cardíacos e pulsações do cordão por alguns minutos após a separação, evoluindo para óbito. Sobre a Declaração de Nascido Vivo, está correto:", "ops": [["Deve ser emitida, pois houve sinal de vida após a separação, independentemente da IG e do peso.", "Correta: a DNV é emitida para todo nascimento com vida, sem limite de IG, peso ou estatura."], ["Não deve ser emitida, pois abaixo de 22 semanas e 500 g o produto não é considerado nascido vivo.", "Errada: o material é explícito em que a IG e o peso não definem nascimento vivo."], ["Só seria emitida se o RN sobrevivesse pelo menos 24 horas após o nascimento.", "Errada: não há exigência de tempo de sobrevida."], ["Só seria emitida se houvesse respiração espontânea; batimentos isolados não bastam.", "Errada: basta respiração ou qualquer outro sinal de vida, como batimentos ou pulsação do cordão."]], "conc": "Nascimento vivo: respiração ou qualquer outro sinal de vida após a separação (anotação de aula: batimentos, pulsações do cordão, movimentos efetivos de músculos de contração voluntária), independentemente da IG.", "rac": "Houve batimentos e pulsação do cordão após a separação = sinal de vida = nascido vivo = DNV.", "pista": "'Independentemente da duração da gestação, do peso ou da estatura.'", "mud": "Se não houvesse qualquer sinal de vida após a separação, não seria nascido vivo.", "cmp": "Critério de vida (sinal após separação) versus critérios de viabilidade (IG/peso), que não definem a DNV.", "arm": "Aplicar cortes de viabilidade ao conceito de nascido vivo.", "regra": "Sinal de vida após a separação = DNV.", "cf": "Em gestação de 39 semanas com RN sem nenhum sinal de vida após o parto, não se emite DNV.", "fonte": "F1, Aula 2, p. 6"}, {"n": 7, "sub": "DNV — blocos e gestação múltipla", "comp": "Localizar dados nos blocos da DNV", "tags": [], "rel": [], "enun": "Gestação gemelar com dois nascidos vivos; um deles tem fenda labial. Como fica o preenchimento da DNV?", "ops": [["Uma DNV para cada gêmeo; a fenda labial é registrada no bloco VI (anomalias congênitas).", "Correta: gestação múltipla exige uma DNV por nascido vivo, e o bloco VI é o de anomalias congênitas."], ["Uma única DNV com os dois RN; a fenda labial é registrada no bloco I (identificação).", "Errada: cada nascido vivo tem sua DNV, e anomalias têm bloco próprio."], ["Uma DNV para cada gêmeo; a fenda labial é registrada no bloco V (gestação e parto).", "Errada: o bloco V trata de gestações, pré-natal, parto e IG, não de anomalias."], ["Uma DNV para cada gêmeo; a anomalia vai só no prontuário, pois a DNV não tem campo próprio.", "Errada: há o bloco VI justamente para anomalias congênitas."]], "conc": "Blocos: I RN; II local; III parturiente; IV responsável legal; V gestações, pré-natal, parto, IG; VI anomalias; VII responsável pelo preenchimento; VIII cartório.", "rac": "Duas decisões: quantas DNV (uma por nascido vivo) e onde vai a anomalia (bloco VI).", "pista": "'Gestação múltipla: preencher uma DNV para cada nascido vivo.'", "mud": "Se um dos gêmeos nascesse sem sinal de vida, só o outro teria DNV.", "cmp": "Bloco III (quem pariu) versus bloco IV (responsável legal).", "arm": "Confundir 'dados da gestação' (V) com 'anomalias' (VI).", "regra": "Um nascido vivo, uma DNV; anomalia, bloco VI.", "cf": "Anotação de aula (confirmada em F2, p. 36): vias — branca para a Secretaria Municipal de Saúde, amarela para a família levar ao cartório, rosa arquivada na unidade.", "fonte": "F1, Aula 2, p. 6; F2, p. 36"}, {"n": 8, "sub": "DNV — preenchimento em estação", "comp": "Transcrever dados corretamente para a DNV", "tags": ["osce"], "rel": ["A04"], "enun": "Em uma estação, o prontuário traz: peso 3,250 kg aferido na 2ª hora de vida, APGAR 8 no 1º e 9 no 5º minuto; o comprimento não foi registrado. Como preencher a DNV?", "ops": [["Registrar 3250 g e APGAR 8 e 9, sem inventar o comprimento ausente e sem rasuras.", "Correta: peso em gramas, APGAR de 1º e 5º minuto, usar apenas dados documentados."], ["Registrar 3,25 kg e somente o APGAR do 5º minuto, por ser o mais representativo.", "Errada: o peso é registrado em gramas e os dois valores de APGAR são exigidos."], ["Registrar 3250 g, APGAR 8 e 9 e estimar o comprimento pela média esperada para a IG.", "Errada: o material orienta não inventar informações na estação."], ["Registrar 3250 g e deixar o APGAR em branco, pois cabe ao pediatra completar depois.", "Errada: o APGAR está documentado e deve constar; campos em branco devem ser evitados."]], "conc": "Peso ao nascer em gramas, aferido até a 5ª hora; APGAR do 1º e 5º minuto; evitar campos em branco, rasuras e abreviações; não inventar dados.", "rac": "Converter 3,250 kg para 3250 g; transcrever os dois APGAR; comprimento ausente não pode ser inventado.", "pista": "'Não tente interpretar o que deve ser transcrito do prontuário: use o dado documentado.'", "mud": "Se o peso só tivesse sido aferido após a 5ª hora, isso deveria ser apontado como desvio da orientação do manual.", "cmp": "Evitar campo em branco (quando o dado existe) versus não inventar (quando o dado não existe).", "arm": "'Completar' o formulário com estimativas para parecer completo.", "regra": "Transcreva, não invente.", "cf": "Na estação, identificar primeiro o bloco pedido (ex.: bloco I para peso e APGAR) antes de preencher.", "fonte": "F1, Aula 2, p. 6"}]}, {"id": "A03", "titulo": "Exame físico do recém-nascido", "arq": "F1", "pags": "7–8", "bloco": 1, "q": [{"n": 1, "sub": "Preparo e sequência do exame", "comp": "Iniciar o exame do RN corretamente", "tags": ["osce"], "rel": [], "enun": "Você vai examinar um RN de 8 horas de vida em alojamento conjunto, com a mãe presente. Qual conduta inicial está de acordo com o material?", "ops": [["Higienizar as mãos, explicar o exame e observar o RN antes de manipulá-lo.", "Correta: 'primeiro observe; depois manipule', em ambiente aquecido e iluminado."], ["Começar pelo reflexo de Moro, aproveitando que o RN está calmo para avaliar o neurológico com precisão.", "Errada: provocar choro antes de observar perde informações; reflexos ficam para o fim da sequência."], ["Despir completamente o RN de uma vez para tornar o exame mais rápido e completo.", "Errada: deve-se expor por partes e evitar perda de calor."], ["Medir o perímetro cefálico e o comprimento antes de qualquer observação do RN.", "Errada: a observação geral vem antes da antropometria e dos sinais vitais."]], "conc": "Antes de tocar: mãos higienizadas, identificação, explicação ao responsável, ambiente aquecido, exposição por partes, observação de estado geral, postura, cor, padrão respiratório e movimentação antes de provocar choro. Exame completo preferencialmente entre 6 e 12 horas de vida.", "rac": "A sequência prática começa pela observação geral e só depois segue para antropometria, sinais vitais e o restante craniocaudal.", "pista": "'Exame sistemático, gentil e craniocaudal. Primeiro observe; depois manipule.'", "mud": "Em RN instável (cianose, apneia), a prioridade passa a ser a estabilização, não o exame completo.", "cmp": "Ordem do exame do RN (observar → medir → craniocaudal → reflexos) versus exame do adulto (inspeção segmentar).", "arm": "Começar pelo que é mais 'chamativo' (reflexos) e provocar choro.", "regra": "Olhe antes de tocar.", "cf": "Pergunte também se houve diurese e mecônio: atraso exige avaliação.", "fonte": "F1, Aula 3, p. 7"}, {"n": 2, "sub": "Respiração e sinais vitais", "comp": "Diferenciar padrão respiratório esperado de desconforto", "tags": [], "rel": [], "enun": "RN a termo com 10 horas de vida: FR de 52 irpm contada em 1 minuto, respiração predominantemente abdominal, FC de 140 bpm. Qual achado adicional seria sinal de alerta?", "ops": [["Gemência expiratória com retração subcostal.", "Correta: gemência e retrações são sinais de desconforto respiratório."], ["Respiração predominantemente abdominal.", "Errada: é o padrão esperado no RN."], ["Frequência cardíaca de 140 bpm em repouso.", "Errada: o material ressalta FC > 100 bpm como habitual."], ["Acrocianose de mãos e pés nas primeiras horas.", "Errada: acrocianose pode ser transitória no período imediato; cianose central é que é alerta."]], "conc": "Respiração predominantemente abdominal, contada por 1 minuto; material: cerca de 40–60 irpm. Alertas: gemência, batimento de asa nasal, retrações, apneia, FR persistentemente alterada.", "rac": "FR 52, padrão abdominal e FC 140 estão dentro do esperado; o único achado anormal é gemência com retração.", "pista": "'Gemência' e 'retração' estão na coluna Alerta da tabela.", "mud": "Se a FR fosse persistentemente de 80 irpm, mesmo sem gemência, haveria alerta.", "cmp": "Acrocianose (extremidades, transitória) versus cianose central (lábios, língua, tronco).", "arm": "Tratar respiração abdominal como sinal de esforço.", "regra": "Conte 1 minuto inteiro e procure gemência, BAN, retrações e apneia.", "cf": "Pulsos e enchimento capilar completam a avaliação de perfusão.", "fonte": "F1, Aula 3, p. 7"}, {"n": 3, "sub": "Pele: fisiológico x alerta", "comp": "Reconhecer achados de pele não fisiológicos", "tags": [], "rel": ["A09"], "enun": "Ao exame de RN, qual achado de pele NÃO deve ser assumido como fisiológico?", "ops": [["Icterícia visível com 18 horas de vida.", "Correta (é o alerta): icterícia nas primeiras 24 horas não deve ser assumida como fisiológica."], ["Máculas eritematosas com pequenas pápulas centrais no tronco (eritema tóxico).", "Errada: eritema tóxico é achado fisiológico comum."], ["Pequenas pápulas brancas no dorso do nariz (milium).", "Errada: milium é achado fisiológico."], ["Mancha azul-acinzentada na região lombossacra (melanocitose dérmica).", "Errada: melanocitose dérmica congênita está entre os achados fisiológicos."]], "conc": "Fisiológicos: vérnix, lanugo, eritema tóxico, milium, manchas salmão, melanocitose dérmica congênita, descamação. Alertas: icterícia < 24 h, progressão rápida ou com sinais clínicos, petéquias, palidez, cianose.", "rac": "Três achados constam da lista de fisiológicos; a icterícia com 18 h está explicitamente fora.", "pista": "'Nas primeiras 24 horas.'", "mud": "Icterícia que surge no 3º dia, em RN ativo e mamando, pode ser fisiológica.", "cmp": "Ver A09: icterícia nas primeiras 24 h é sempre patológica (pensar em hemólise).", "arm": "Achar que toda icterícia neonatal é fisiológica.", "regra": "Icterícia antes de 24 h = investigar.", "cf": "Petéquias generalizadas também não são fisiológicas e merecem investigação.", "fonte": "F1, Aula 3, p. 7; F2, p. 21"}, {"n": 4, "sub": "Bossa x cefalo-hematoma", "comp": "Diferenciar coleções do couro cabeludo", "tags": [], "rel": ["A09"], "enun": "RN de 2 dias, nascido de parto com fórcipe, apresenta tumoração no couro cabeludo sobre o parietal direito, que não ultrapassa a sutura sagital. Qual a hipótese?", "ops": [["Cefalo-hematoma, coleção subperiosteal que respeita as suturas.", "Correta: o limite pela sutura é a pista do cefalo-hematoma."], ["Bossa serossanguínea, edema que atravessa as suturas.", "Errada: a bossa ultrapassa as suturas."], ["Fontanela anterior abaulada por hipertensão intracraniana.", "Errada: a lesão é parietal, sobre o osso, e não na fontanela."], ["Afundamento craniano por fratura de parietal com hematoma.", "Errada: não descrito no material e não explica o limite pela sutura."]], "conc": "Bossa atravessa suturas; cefalo-hematoma é subperiosteal e respeita suturas. Fontanela persistentemente abaulada: pensar em HIC; deprimida: desidratação.", "rac": "Coleção limitada a um único osso = abaixo do periósteo = cefalo-hematoma.", "pista": "'Não ultrapassa a sutura sagital.'", "mud": "Se o edema cruzasse a linha média, seria bossa serossanguínea.", "cmp": "Cefalo-hematoma é causa de aumento de produção de bilirrubina (F2, p. 21).", "arm": "Chamar qualquer 'galo' no RN de bossa.", "regra": "Respeita sutura = cefalo-hematoma.", "cf": "Esse RN merece atenção à icterícia nos dias seguintes.", "fonte": "F1, Aula 3, p. 7; F2, p. 21"}, {"n": 5, "sub": "Moro assimétrico", "comp": "Interpretar assimetria do Moro", "tags": ["osce"], "rel": [], "enun": "RN macrossômico, com distocia de ombro no parto. No reflexo de Moro, o braço direito não se move. Qual a conduta mais adequada no exame?", "ops": [["Palpar as clavículas, pensando em fratura de clavícula/úmero ou lesão do plexo braquial.", "Correta: Moro assimétrico sugere essas lesões; a palpação clavicular faz parte do exame."], ["Considerar normal, pois o Moro só se torna simétrico após o terceiro mês de vida.", "Errada: a resposta esperada é simétrica desde o nascimento."], ["Suspeitar de hemorragia intracraniana e solicitar tomografia de crânio imediata.", "Errada: a assimetria localizada após distocia aponta para lesão periférica (clavícula, úmero, plexo)."], ["Reavaliar o reflexo apenas na primeira consulta de puericultura, pois pode ser transitório.", "Errada: o achado deve ser investigado já na avaliação neonatal."]], "conc": "Clavículas: palpar continuidade; Moro assimétrico pode sugerir fratura de clavícula/úmero ou lesão do plexo braquial.", "rac": "Distocia de ombro + ausência de movimento unilateral = trauma de parto do membro superior.", "pista": "Macrossomia e distocia de ombro (ligação com a anamnese do parto, A02).", "mud": "Moro ausente bilateralmente sugeriria comprometimento neurológico global.", "cmp": "Moro: abdução/extensão dos braços, abertura das mãos e depois adução/flexão, simétrico.", "arm": "Esquecer de palpar as clavículas no exame de rotina.", "regra": "Moro assimétrico: olhe clavícula, úmero e plexo.", "cf": "Anotação de aula: no Moro, após a queda controlada da cabeça, segue-se a adução e o choro.", "fonte": "F1, Aula 3, p. 8"}, {"n": 6, "sub": "Pulsos femorais", "comp": "Reconhecer sinal de obstrução aórtica", "tags": [], "rel": [], "enun": "RN de 2 dias, ativo, com pulsos braquiais amplos e pulsos femorais muito fracos bilateralmente. Qual a interpretação?", "ops": [["Merece investigação de obstrução do arco/aorta.", "Correta: pulsos femorais reduzidos são o alerta descrito no material."], ["Achado esperado por imaturidade da circulação periférica nas primeiras 72 horas.", "Errada: não há tal normalidade; a diferença entre membros é anormal."], ["Sugere hipovolemia, devendo-se iniciar expansão volêmica antes de outra avaliação.", "Errada: a hipovolemia reduziria todos os pulsos, não apenas os femorais."], ["Sugere hipotermia; deve-se reaquecer o RN e reavaliar após 24 horas.", "Errada: a assimetria membros superiores x inferiores não se explica por temperatura."]], "conc": "Coração: auscultar ritmo e sopros; palpar pulsos braquiais e femorais. Pulsos femorais reduzidos merecem investigação de obstrução do arco/aorta.", "rac": "A discrepância braquial forte x femoral fraco localiza uma obstrução entre os dois territórios.", "pista": "Comparação entre membros na avaliação de perfusão.", "mud": "Todos os pulsos fracos com enchimento lento apontariam para choque/perfusão ruim.", "cmp": "Revisão relâmpago (F2, p. 36): teste do coraçãozinho 24–48 h, SatO2 ≥ 95% e diferença ≤ 3%.", "arm": "Palpar só o pulso braquial.", "regra": "Sempre compare braquial com femoral.", "cf": "A palpação dos femorais é parte obrigatória do checklist cardiovascular do RN.", "fonte": "F1, Aula 3, pp. 7–8"}, {"n": 7, "sub": "Quadril: Barlow e Ortolani", "comp": "Identificar a manobra e interpretar o resultado", "tags": ["osce"], "rel": [], "enun": "Com o RN em decúbito dorsal, quadril e joelho fletidos a 90°, o examinador aduz suavemente a coxa em direção à linha média e sente a cabeça femoral deslizar para fora do acetábulo. Qual é a manobra e o significado?", "ops": [["Barlow positivo: quadril aparentemente encaixado, porém instável e luxável.", "Correta: Barlow usa adução e testa se o quadril se desloca."], ["Ortolani positivo: quadril luxado que retorna ao acetábulo com ressalto.", "Errada: Ortolani usa abdução e percebe a redução ('clunk')."], ["Ortolani negativo: quadril estável, sem significado patológico.", "Errada: houve deslocamento — o teste é positivo e é o de Barlow."], ["Reflexo de Galant: resposta medular normal à estimulação.", "Errada: Galant é a curvatura do tronco ao estímulo paravertebral."]], "conc": "Anotação de aula: Ortolani — abdução, quadril luxado volta à posição com ressalto palpável ('clunk'). Barlow — adução, quadril instável desliza para fora. Um quadril por vez, delicadamente, útil até cerca de 3 meses.", "rac": "Movimento de adução + sensação de saída = Barlow positivo.", "pista": "'Aduz' e 'para fora'.", "mud": "Se, ao abduzir, o quadril luxado voltasse com ressalto, seria Ortolani positivo.", "cmp": "Mnemônico: Barlow = 'bota para fora'; Ortolani = 'ora, voltou'.", "arm": "Valorizar estalidos inespecíficos; o 'clunk' verdadeiro é que tem relevância.", "regra": "Adução luxa (Barlow), abdução reduz (Ortolani).", "cf": "Técnica delicada, sem forçar a articulação, um quadril de cada vez.", "fonte": "F1, Aula 3, p. 8 (texto e anotações de aula)"}, {"n": 8, "sub": "Reflexos primitivos", "comp": "Identificar reflexo pela resposta", "tags": ["osce"], "rel": [], "enun": "Ao estimular a região paravertebral de um lado, o RN curva o tronco para o lado estimulado. Qual reflexo foi pesquisado?", "ops": [["Galant.", "Correta: estímulo paravertebral → curvatura do tronco para o lado estimulado."], ["Tônico-cervical assimétrico.", "Errada: pesquisado rodando a cabeça; extensão do lado da face e flexão contralateral."], ["Moro.", "Errada: estímulo súbito controlado; abdução/extensão e depois adução/flexão dos braços."], ["Marcha automática.", "Errada: RN sustentado ereto com plantas na superfície dá passos alternados."]], "conc": "Reflexos: sucção, preensão palmar/plantar, Moro, marcha automática, tônico-cervical assimétrico, Galant. Todos devem ser simétricos.", "rac": "Associar estímulo (paravertebral) e resposta (curvatura lateral) ao nome.", "pista": "'Região paravertebral'.", "mud": "Resposta ausente de um lado sugere alteração neurológica ou medular desse lado.", "cmp": "Anotação de aula: Babinski — pode ser fisiológico até 2 anos; depois, sugere alteração da via piramidal.", "arm": "Trocar tônico-cervical por Moro por ambos envolverem os braços.", "regra": "Nome do reflexo = estímulo + resposta; conferir simetria.", "cf": "No checklist final, verbalize: atenção a desconforto respiratório, perfusão, dismorfismos, orifícios, quadril e simetria neurológica.", "fonte": "F1, Aula 3, p. 8"}]}, {"id": "A04", "titulo": "Baixo peso e interpretação de gráficos", "arq": "F1", "pags": "9–12", "bloco": 1, "q": [{"n": 1, "sub": "Classificação por peso ao nascer", "comp": "Classificar o RN pelo peso absoluto", "tags": ["calculo"], "rel": ["A02"], "enun": "RN nasce com 1.420 g. Como ele é classificado pelo peso ao nascer?", "ops": [["Muito baixo peso ao nascer.", "Correta: < 1.500 g e ≥ 1.000 g."], ["Extremo baixo peso ao nascer.", "Errada: exigiria < 1.000 g."], ["Baixo peso ao nascer, sem outra subcategoria.", "Errada: está abaixo de 1.500 g, logo é muito baixo peso."], ["Pequeno para a idade gestacional.", "Errada: PIG depende da IG (percentil); não é dado apenas pelo peso."]], "conc": "Baixo peso < 2.500 g; muito baixo peso < 1.500 g; extremo baixo peso < 1.000 g. É classificação pelo valor absoluto.", "rac": "1.420 < 1.500 e ≥ 1.000 → muito baixo peso (que também é, por definição, baixo peso).", "pista": "O corte é estrito: '<'.", "mud": "Com 1.500 g exatos, seria baixo peso, não muito baixo peso.", "cmp": "Peso absoluto (BPN) versus peso para IG (PIG/AIG/GIG).", "arm": "Usar a classificação mais ampla (BPN) quando cabe a mais específica.", "regra": "2.500 / 1.500 / 1.000, sempre com 'menor que'.", "cf": "Anotação de aula: pela IG, < 37 semanas pré-termo, 37 a 41+6 termo, ≥ 42 pós-termo — outra classificação, independente do peso.", "fonte": "F1, Aula 4, p. 9"}, {"n": 2, "sub": "BPN x PIG/AIG", "comp": "Combinar as duas classificações", "tags": [], "rel": [], "enun": "RN de 34 semanas nasce com 2.200 g, peso no percentil 30 para a idade gestacional. Qual a classificação correta?", "ops": [["Baixo peso ao nascer e adequado para a idade gestacional (AIG).", "Correta: < 2.500 g (BPN) e entre p10 e p90 (AIG) — exemplo do próprio material."], ["Baixo peso ao nascer e pequeno para a idade gestacional (PIG).", "Errada: PIG exige < p10."], ["Peso adequado ao nascer e AIG, por ser compatível com a idade gestacional.", "Errada: o BPN é corte absoluto em gramas, independentemente da IG."], ["Muito baixo peso ao nascer e PIG.", "Errada: não é < 1.500 g nem < p10."]], "conc": "Baixo peso usa corte em gramas; PIG/AIG/GIG comparam o peso com a IG (p10–p90 = AIG).", "rac": "Duas perguntas independentes: quanto pesa (2.200 g → BPN) e onde está no percentil para a IG (p30 → AIG).", "pista": "'Não confunda': prematuro de 34 semanas com 2.200 g pode ser AIG e ter baixo peso.", "mud": "Se o percentil fosse 5, seria BPN e PIG.", "cmp": "BPN pode decorrer de prematuridade, de restrição de crescimento ou de ambos.", "arm": "Assumir que todo BPN é PIG.", "regra": "Gramas dizem BPN; percentil para a IG diz PIG/AIG/GIG.", "cf": "Um RN a termo com 2.400 g no p5 é BPN e PIG — aqui a causa provável é restrição de crescimento, não prematuridade.", "fonte": "F1, Aula 4, p. 9"}, {"n": 3, "sub": "Interpretação de PIG e GIG", "comp": "Relacionar a categoria ao que investigar", "tags": [], "rel": [], "enun": "RN de 39 semanas com 4.450 g, peso acima do percentil 90 para a IG. Qual afirmação está correta?", "ops": [["É GIG; deve-se considerar diabetes materno entre os fatores associados.", "Correta: GIG > p90; o material cita diabetes materno e outros fatores."], ["É AIG, pois a idade gestacional a termo garante a adequação do peso.", "Errada: a categoria depende do percentil, não apenas de ser termo."], ["É GIG; deve-se investigar principalmente insuficiência placentária.", "Errada: causas placentárias são investigadas no PIG."], ["Não se classifica por percentil; apenas se registra o peso em gramas.", "Errada: peso para IG é classificação central do material."]], "conc": "PIG < p10 (investigar causas maternas, placentárias, fetais e constitucionais); AIG p10–p90; GIG > p90 (considerar diabetes materno e outros fatores).", "rac": "> p90 → GIG → fator mais lembrado: diabetes materno.", "pista": "'Acima do percentil 90'.", "mud": "No p7, seria PIG e a investigação incluiria causas placentárias.", "cmp": "PIG = 'pequeno para a IG'; GIG = 'grande para a IG' (anotações de aula).", "arm": "Achar que a termo + peso alto = 'bebê saudável e grande', sem investigar.", "regra": "PIG: placenta, mãe, feto. GIG: lembre do diabetes materno.", "cf": "Um RN de 37 semanas com 2.700 g no p8 é PIG mesmo sem baixo peso ao nascer.", "fonte": "F1, Aula 4, p. 9"}, {"n": 4, "sub": "Escolha do indicador", "comp": "Escolher o indicador que responde à pergunta clínica", "tags": [], "rel": ["A08"], "enun": "Criança de 3 anos parece magra; o peso para idade está em escore-z −2,3. A dúvida é se ela está emagrecida ou se é apenas baixa. Qual indicador responde melhor?", "ops": [["Peso para estatura ou IMC para idade, junto da estatura para idade.", "Correta: avaliam a proporção peso-tamanho; peso/idade não diferencia baixa de emagrecida."], ["Repetir o peso para idade em um mês para confirmar a tendência.", "Errada: continua sem diferenciar baixa estatura de magreza."], ["Perímetro cefálico para idade, que reflete o estado nutricional global.", "Errada: PC avalia crescimento craniano, sobretudo até 2 anos."], ["Peso para idade em escore-z, comparado com o percentil do nascimento.", "Errada: é o mesmo indicador, com a mesma limitação."]], "conc": "Peso/idade: triagem, não diferencia criança baixa de emagrecida. Estatura/idade: baixa estatura/comprometimento crônico. Peso/estatura: magreza/excesso. IMC/idade: magreza, sobrepeso e obesidade.", "rac": "A pergunta é sobre proporção → indicadores de proporção (P/E ou IMC/I), mais E/I para o componente crônico.", "pista": "'Emagrecida ou apenas baixa'.", "mud": "Se a pergunta fosse 'ela é baixa?', o indicador seria estatura para idade.", "cmp": "F2, p. 36: magreza z < −2; magreza acentuada z < −3.", "arm": "Concluir 'desnutrida' só com peso/idade.", "regra": "Peso/idade triagem; P/E ou IMC/I proporção; E/I cronicidade.", "cf": "Na diarreia (A08), lembre que a desidratação reduz artificialmente o peso: reavaliar após reidratar.", "fonte": "F1, Aula 4, pp. 10–11; F2, p. 36"}, {"n": 5, "sub": "Peso para idade — escore-z", "comp": "Classificar pelo escore-z da Caderneta", "tags": [], "rel": [], "enun": "Lactente de 10 meses tem peso para idade em escore-z de −2,5 na Caderneta da Criança. Qual a classificação?", "ops": [["Baixo peso para idade.", "Correta: ≥ −3 e < −2."], ["Muito baixo peso para idade.", "Errada: exigiria escore-z < −3."], ["Peso adequado para idade.", "Errada: adequado é ≥ −2 e ≤ +2."], ["Magreza acentuada.", "Errada: magreza se classifica por P/E ou IMC/I, não por peso/idade."]], "conc": "Peso/idade: > +2 elevado; ≥ −2 e ≤ +2 adequado; ≥ −3 e < −2 baixo; < −3 muito baixo.", "rac": "−2,5 está entre −3 e −2.", "pista": "Faixas da tabela 'Peso para idade — cortes da Caderneta'.", "mud": "Com −3,2, seria muito baixo peso para idade.", "cmp": "Peso para idade (classificação de peso) versus IMC/idade (magreza).", "arm": "Usar o termo 'magreza' para indicador de peso/idade.", "regra": "−2 e −3 são as linhas de corte do baixo e do muito baixo peso.", "cf": "Mesmo com o ponto em −1,5 (adequado), se a trajetória estiver caindo, há motivo para investigar.", "fonte": "F1, Aula 4, pp. 11–12", "figc": "oms"}, {"n": 6, "sub": "Trajetória da curva", "comp": "Interpretar a tendência da curva", "tags": ["osce"], "rel": ["A05"], "enun": "Lactente de 9 meses: peso para idade em escore-z +1 aos 4 meses, 0 aos 6 meses e −1,5 aos 9 meses. Qual interpretação é correta?", "ops": [["Há queda de trajetória; investigar alimentação, doença e condições sociais.", "Correta: a trajetória é mais importante que um ponto isolado."], ["Peso adequado para idade, pois o último ponto está entre −2 e +2.", "Errada: dizer 'normal' só pelo ponto atual é o erro apontado no material."], ["Só será preciso investigar se o próximo ponto ficar abaixo de −2.", "Errada: mudança rápida de canal já justifica investigação."], ["Baixo peso para idade, pela queda acumulada de 2,5 escores-z em apenas 5 meses de seguimento.", "Errada: a classificação depende do valor atual (−1,5); a queda é motivo de investigação, não muda a classificação."]], "conc": "Comparar com pontos anteriores; mudança rápida de canal, cruzamento de linhas, curva horizontal ou afastamento progressivo exigem investigação de contexto clínico, alimentação, doença e condições sociais.", "rac": "O ponto atual é adequado, mas cruzou duas faixas em 5 meses: alerta de trajetória.", "pista": "Três pontos em sequência descendente.", "mud": "Se a criança se mantivesse paralela à linha −1,5 desde o nascimento, poderia ser seu canal habitual.", "cmp": "Classificação (onde está) versus trajetória (para onde vai).", "arm": "Chamar de 'normal' tudo entre −2 e +2.", "regra": "No OSCE: medida, idade, indicador, escore-z e trajetória.", "cf": "Uma curva que fica horizontal (sem ganho) por 2 meses também é sinal de alerta, mesmo sem cruzar linhas ainda.", "fonte": "F1, Aula 4, pp. 10–12", "figc": "oms"}, {"n": 7, "sub": "Curvas do prematuro", "comp": "Escolher curva e idade no seguimento do prematuro", "tags": [], "rel": [], "enun": "Lactente nascido com 30 semanas está em seguimento ambulatorial. Para avaliar seu crescimento, o material orienta:", "ops": [["Curva para pré-termo (INTERGROWTH-21) com idade corrigida pelo período recomendado.", "Correta: é o que a Figura 1 e o passo 2 de leitura da curva indicam."], ["Usar a curva da OMS com a idade cronológica desde a primeira consulta.", "Errada: no prematuro, usa-se idade corrigida pelo período recomendado."], ["Usar a idade corrigida apenas para o perímetro cefálico e a cronológica para peso.", "Errada: a correção vale para a avaliação do crescimento e desenvolvimento."], ["Aguardar os 2 anos de idade cronológica para iniciar o registro em gráficos de crescimento.", "Errada: o acompanhamento da trajetória é contínuo desde o início."]], "conc": "Escolher o gráfico correto (sexo, idade, indicador e curvas específicas para prematuros) e conferir a idade exata; em prematuros, idade corrigida pelo período recomendado.", "rac": "Pré-termo → curva de pré-termo (INTERGROWTH-21) + idade corrigida.", "pista": "Figura 1: 'Em prematuros, use curva apropriada e idade corrigida.'", "mud": "Em RN a termo, usa-se a curva padrão (ex.: OMS) com idade cronológica.", "cmp": "Idade cronológica (desde o nascimento) versus idade corrigida (desconta a prematuridade).", "arm": "Plotar o prematuro na curva de termo pela idade cronológica e concluir 'baixo peso'.", "regra": "Prematuro: curva certa e idade corrigida.", "cf": "Anotações de aula ao lado da Figura 1: comprimento z < −3 muito baixo, ≥ −3 e < −2 baixo, ≥ −2 adequado.", "fonte": "F1, Aula 4, p. 10", "figc": "intergrowth"}, {"n": 8, "sub": "Perímetro cefálico", "comp": "Classificar o PC pelo escore-z", "tags": [], "rel": ["A03"], "enun": "Pelos cortes de escore-z de perímetro cefálico anotados na aula, um lactente de 4 meses com PC em escore-z −2,4 é classificado como:", "ops": [["Microcefalia (abaixo do esperado).", "Correta: faixa ≥ −3 e < −2."], ["Microcefalia grave (muito abaixo do esperado).", "Errada: exigiria escore-z < −3."], ["Perímetro cefálico adequado para a idade.", "Errada: adequado é entre −2 e +2."], ["Macrocefalia (acima do esperado).", "Errada: macrocefalia é escore-z > +2."]], "conc": "PC para idade detecta micro e macrocefalia e mudança de trajetória, sobretudo nos 2 primeiros anos. Anotação de aula: < −3 microcefalia grave; ≥ −3 e < −2 microcefalia; −2 a +2 adequado; > +2 acima do esperado.", "rac": "−2,4 está entre −3 e −2.", "pista": "O valor está abaixo de −2, mas acima de −3.", "mud": "Com −3,5, seria microcefalia grave.", "cmp": "F2, p. 36: PC ao nascer ~33–37 cm.", "arm": "Esquecer que o PC também se interpreta por trajetória, não só por um ponto.", "regra": "PC: −2 e −3 separam adequado, microcefalia e microcefalia grave.", "cf": "Um PC que cai de 0 para −1,8 em 3 meses ainda é 'adequado', mas a queda merece investigação.", "fonte": "F1, Aula 4, pp. 10–11 (texto e anotações de aula)"}]}, {"id": "A05", "titulo": "Refluxo gastroesofágico na criança", "arq": "F1", "pags": "13–14", "bloco": 2, "q": [{"n": 1, "sub": "Definições", "comp": "Diferenciar regurgitação, vômito, RGE e DRGE", "tags": [], "rel": [], "enun": "Mãe relata que o filho de 2 meses devolve pequena quantidade de leite pela boca logo após as mamadas, sem esforço e sem choro. Como se denomina esse fenômeno?", "ops": [["Regurgitação: retorno sem esforço do conteúdo gástrico à boca.", "Correta: definição do material; no lactente saudável, costuma ser benigna."], ["Vômito: expulsão do conteúdo gástrico pela boca.", "Errada: vômito é expulsão ativa, com contrações musculares/retches."], ["DRGE: refluxo que alcança a boca e se repete após as mamadas.", "Errada: DRGE exige sintomas incômodos, repercussão ou complicações."], ["Retching: esforço de vômito com contração abdominal.", "Errada: o enunciado descreve ausência de esforço."]], "conc": "RGE: passagem do conteúdo gástrico ao esôfago, com ou sem regurgitação; pode ser fisiológico. Regurgitação: sem esforço. Vômito: ativo. DRGE: sintomas incômodos, repercussão funcional ou complicações.", "rac": "'Sem esforço' separa regurgitação de vômito; 'sem choro' e lactente bem afastam DRGE.", "pista": "'Sem esforço'.", "mud": "Se houvesse contração abdominal vigorosa, seria vômito, que pede outra linha de raciocínio.", "cmp": "RGE é o fenômeno; regurgitação é uma forma de manifestação; DRGE é doença.", "arm": "Usar 'vômito' e 'regurgitação' como sinônimos.", "regra": "Sem esforço = regurgitação.", "cf": "Anotação de aula: RGE fisiológico — regurgita após mamadas, está confortável e ganha peso.", "fonte": "F1, Aula 5, p. 13"}, {"n": 2, "sub": "Roma IV — regurgitação do lactente", "comp": "Aplicar critérios de Roma IV", "tags": [], "rel": ["A04"], "enun": "Lactente de 4 meses, nascido a termo, regurgita de 3 a 5 vezes por dia há 5 semanas. Mama bem, está tranquilo e ganha peso na curva. Não há tosse, apneia, sangue ou postura anormal. Qual o diagnóstico mais provável?", "ops": [["Regurgitação do lactente (fisiológica).", "Correta: 3 semanas a 12 meses, ≥ 2 regurgitações/dia por ≥ 3 semanas, sem sinais de alarme."], ["DRGE, pela frequência diária das regurgitações.", "Errada: frequência isolada não define DRGE; faltam sintomas problemáticos ou complicações."], ["Estenose hipertrófica do piloro em evolução.", "Errada: haveria vômitos em jato progressivos, em geral nas primeiras semanas."], ["Obstrução intestinal parcial de origem congênita.", "Errada: sem vômito bilioso, distensão ou falha de crescimento."]], "conc": "Roma IV: lactente saudável de 3 semanas a 12 meses, ≥ 2 regurgitações/dia por ≥ 3 semanas, sem retching, hematêmese, aspiração, apneia, falha de crescimento, dificuldade alimentar/deglutição ou postura anormal.", "rac": "Idade, frequência e duração cumprem os critérios; não há nenhum dos excludentes.", "pista": "'Ganha peso na curva' e ausência de sinais de alarme.", "mud": "Se houvesse falha de crescimento ou hematêmese, sairia de Roma IV e se pensaria em DRGE ou outro diagnóstico.", "cmp": "O RGE fisiológico aumenta entre 2 e 4 meses e melhora progressivamente.", "arm": "Rotular como doença pela quantidade de 'golfadas'.", "regra": "'Golfar muito' não é sinônimo de doença.", "cf": "Anotação de aula: pico de regurgitação por volta dos 4 meses.", "fonte": "F1, Aula 5, p. 13"}, {"n": 3, "sub": "Manejo do RGE fisiológico", "comp": "Definir a conduta no RGE fisiológico", "tags": ["osce"], "rel": [], "enun": "A mãe do lactente da questão anterior, em aleitamento materno exclusivo, pede um remédio para o refluxo. Qual a conduta adequada?", "ops": [["Orientar benignidade, revisar técnica e volume, evitar superalimentação e manter o aleitamento.", "Correta: RGE fisiológico não precisa de procinético, antiácido ou IBP."], ["Prescrever omeprazol por 4 a 8 semanas e reavaliar a frequência das regurgitações no retorno.", "Errada: IBP não é indicado no RGE fisiológico."], ["Retirar leite e derivados da dieta materna como teste terapêutico.", "Errada: o material diz para não trocar a dieta materna sem indicação clínica específica."], ["Prescrever procinético antes das mamadas para acelerar o esvaziamento.", "Errada: procinético não é indicado no RGE fisiológico."]], "conc": "Manejo: confirmar regurgitação x vômito e alarmes; avaliar curva, técnica e volume; manter aleitamento; não trocar dieta/fórmula sem indicação; sem procinético, antiácido ou IBP no RGE fisiológico.", "rac": "Diagnóstico de regurgitação fisiológica → orientação, sem medicamento.", "pista": "O quadro anterior não tinha sinais de alarme.", "mud": "Com sinais de alarme ou suspeita real de DRGE, investigar e considerar gastroenterologia pediátrica.", "cmp": "F2, p. 36 cita teste sem leite de vaca de 2–4 semanas e IBP na DRGE por 4–8 semanas — condutas para outras situações, não para RGE fisiológico.", "arm": "Ceder à ansiedade familiar e medicalizar.", "regra": "RGE fisiológico: orientar e acompanhar.", "cf": "Em lactente com fórmula, a fórmula espessada pode reduzir regurgitações em casos selecionados, sem tratar toda DRGE.", "fonte": "F1, Aula 5, pp. 13–14"}, {"n": 4, "sub": "Vômito bilioso", "comp": "Reconhecer sinal de alarme cirúrgico", "tags": [], "rel": ["A10"], "enun": "Lactente de 3 semanas que vinha bem passa a apresentar vômitos esverdeados. Qual a interpretação correta?", "ops": [["Não é típico de RGE: pensar em obstrução intestinal até prova em contrário.", "Correta: vômito bilioso é sinal de alarme."], ["Regurgitação fisiológica com refluxo duodenogástrico, comum nessa idade.", "Errada: vômito bilioso não é compatível com regurgitação fisiológica."], ["DRGE com esofagite, indicando inibidor de bomba de prótons.", "Errada: a cor biliosa aponta para obstrução, não para esofagite."], ["Intolerância à fórmula, com indicação de trocar o leite.", "Errada: trocar a dieta atrasa o diagnóstico de uma possível emergência."]], "conc": "Vômito bilioso não é típico de RGE; pensar em obstrução intestinal até prova em contrário.", "rac": "Cor verde/amarela = bile = conteúdo vindo de além do piloro.", "pista": "'Vômitos esverdeados'.", "mud": "Vômitos lácteos, sem esforço e em lactente que ganha peso, apontariam para regurgitação.", "cmp": "Ver A10: vômitos biliosos em RN/lactente previamente bem = má rotação com volvo até prova em contrário.", "arm": "Achar que 'bile' é só refluxo mais intenso.", "regra": "Verde é emergência.", "cf": "Anotação de aula: vômitos biliosos = amarelos/verdes.", "fonte": "F1, Aula 5, p. 13; F2, p. 23"}, {"n": 5, "sub": "Vômito em jato", "comp": "Suspeitar de estenose hipertrófica do piloro", "tags": [], "rel": ["A10"], "enun": "Menino de 5 semanas, primogênito, apresenta vômitos em jato, não biliosos, logo após as mamadas, cada vez mais frequentes; continua faminto. Qual a hipótese principal?", "ops": [["Estenose hipertrófica do piloro.", "Correta: vômito persistentemente em jato no lactente jovem é o sinal de alarme citado."], ["Regurgitação fisiológica do lactente.", "Errada: regurgitação é sem esforço; vômito em jato progressivo é alarme."], ["DRGE com esofagite.", "Errada: o padrão em jato e progressivo aponta para obstrução ao esvaziamento gástrico."], ["Má rotação com volvo de intestino médio.", "Errada: no volvo, os vômitos são biliosos."]], "conc": "Vômito persistentemente em jato: pensar em estenose hipertrófica do piloro, especialmente no lactente jovem.", "rac": "Idade (2–8 semanas), sexo masculino, primogênito, não bilioso, em jato, faminto: perfil clássico (F2, p. 23).", "pista": "'Em jato' e 'faminto'.", "mud": "Se o vômito fosse bilioso, a hipótese passaria a ser volvo.", "cmp": "Piloro (não bilioso, obstrução antes do duodeno) versus volvo (bilioso).", "arm": "Chamar de 'refluxo forte'.", "regra": "Jato no lactente jovem = pense no piloro.", "cf": "No laboratório, espera-se alcalose metabólica hipoclorêmica e hipocalêmica (A10).", "fonte": "F1, Aula 5, p. 13; F2, p. 23"}, {"n": 6, "sub": "Quando o RGE vira DRGE", "comp": "Definir o que caracteriza DRGE", "tags": [], "rel": ["A04"], "enun": "Lactente de 6 meses regurgita, chora e arqueia durante as mamadas, recusa parte delas, e a curva de peso caiu nos últimos 2 meses. O que caracteriza este quadro como DRGE?", "ops": [["Sintomas incômodos com repercussão (recusa e falha de crescimento).", "Correta: DRGE é refluxo com sintomas problemáticos, repercussões ou complicações."], ["O número de regurgitações, que passou de cinco por dia.", "Errada: frequência isolada não define doença."], ["A persistência das regurgitações frequentes depois dos 3 meses de idade.", "Errada: o RGE fisiológico costuma persistir e melhorar até o 1º ano."], ["O grande volume de leite regurgitado a cada episódio.", "Errada: volume isolado não define DRGE."]], "conc": "O que transforma RGE em DRGE é a presença de sintomas problemáticos, repercussões ou complicações.", "rac": "Recusa alimentar e queda da curva são repercussões; dor nas mamadas é sintoma incômodo.", "pista": "'A curva de peso caiu.'", "mud": "Sem recusa e com ganho de peso adequado, seria regurgitação fisiológica.", "cmp": "Anotação de aula: DRGE — recusa alimentar, irritabilidade, dor nas refeições, dificuldade de ganhar peso, disfagia/odinofagia, hematêmese, esofagite.", "arm": "Valorizar o 'quanto' golfa em vez do 'quanto prejudica'.", "regra": "DRGE = refluxo que prejudica.", "cf": "Complicações de DRGE (anotação): esofagite, estenose, aspiração.", "fonte": "F1, Aula 5, pp. 13–14"}, {"n": 7, "sub": "Sono seguro", "comp": "Orientar posição para dormir", "tags": ["osce"], "rel": [], "enun": "A mãe de um lactente com RGE fisiológico pergunta se deve colocá-lo para dormir de bruços para reduzir as golfadas. Qual orientação está correta?", "ops": [["Dormir em decúbito dorsal, em superfície firme; posição não trata refluxo.", "Correta: orientação de sono seguro do material."], ["Dormir em decúbito ventral, pois reduz o refluxo e o risco de aspiração.", "Errada: posição insegura não deve ser usada como tratamento."], ["Dormir em decúbito lateral esquerdo, que diminui os episódios de refluxo.", "Errada: não é a posição de sono seguro recomendada."], ["Dormir sobre travesseiro antirrefluxo inclinado no berço, com a cabeceira bem elevada.", "Errada: posicionamento inseguro não deve ser usado como tratamento."]], "conc": "Sono seguro: decúbito dorsal em superfície firme; não usar posicionamento inseguro como tratamento do refluxo.", "rac": "O benefício hipotético na regurgitação não justifica posição insegura para o sono.", "pista": "'Para dormir'.", "mud": "Acordado e observado, o bebê pode ficar em outras posições.", "cmp": "Medidas de alimentação (volume, técnica) versus medidas posturais (não recomendadas como tratamento).", "arm": "Oferecer uma 'dica caseira' que contraria o sono seguro.", "regra": "Para dormir: barriga para cima, superfície firme.", "cf": "Evitar superalimentação é medida útil e segura.", "fonte": "F1, Aula 5, p. 14"}, {"n": 8, "sub": "Sinais que afastam o fisiológico", "comp": "Reconhecer achado incompatível com regurgitação fisiológica", "tags": [], "rel": [], "enun": "Qual dado torna MENOS provável que as regurgitações de um lactente sejam fisiológicas?", "ops": [["Início das regurgitações aos 8 meses de idade.", "Correta: início após 6 meses é sinal de alarme no material."], ["Pico das regurgitações entre 3 e 4 meses de idade.", "Errada: é o comportamento esperado (aumenta entre 2 e 4 meses)."], ["Regurgitações após as mamadas com o bebê confortável.", "Errada: descreve o RGE fisiológico."], ["Melhora progressiva das regurgitações ao longo dos meses.", "Errada: é a evolução natural do RGE fisiológico."]], "conc": "Sinais de alarme: perda de peso/falha de crescimento; recusa, disfagia, odinofagia; hematêmese; vômito bilioso; vômito em jato; início após 6 meses ou piora após 12; apneia, cianose, aspiração; febre, letargia, distensão, diarreia crônica, sangramento retal; alterações neurológicas/fontanela abaulada.", "rac": "O RGE fisiológico começa cedo e melhora; começar aos 8 meses foge do padrão.", "pista": "'Início após 6 meses' está na tabela de sinais de alarme.", "mud": "Se começasse com 1 mês e melhorasse, seria esperado.", "cmp": "Fontanela abaulada com vômitos: pensar em causa neurológica.", "arm": "Esquecer que idade de início também é critério.", "regra": "Tardio, bilioso, em jato, com sangue ou sem ganhar peso: não é fisiológico.", "cf": "Apneia ou pneumonia de repetição em lactente que regurgita exigem investigação.", "fonte": "F1, Aula 5, p. 13"}]}, {"id": "A06", "titulo": "Corpo estranho no esôfago", "arq": "F1", "pags": "15–16", "bloco": 2, "q": [{"n": 1, "sub": "Suspeita clínica", "comp": "Suspeitar de corpo estranho sem ingestão presenciada", "tags": [], "rel": [], "enun": "Menino de 2 anos, previamente hígido, passa a babar muito e a recusar alimentos de forma súbita há 3 horas, enquanto brincava sozinho. Afebril, sem coriza. Ninguém viu ingestão de objeto. Qual hipótese deve ser levantada primeiro?", "ops": [["Corpo estranho no esôfago.", "Correta: início súbito de sialorreia e recusa alimentar em criança pequena previamente bem."], ["Faringoamigdalite aguda.", "Errada: costuma ter febre e instalação menos abrupta."], ["Estomatite herpética.", "Errada: há febre e lesões orais; o início não é súbito durante brincadeira."], ["Doença do refluxo gastroesofágico.", "Errada: não explica sialorreia súbita em criança previamente bem."]], "conc": "Muitas ingestões não são presenciadas. Sintomas: disfagia/odinofagia, sialorreia/incapacidade de engolir saliva, recusa súbita, vômitos/engasgos, saliva com sangue, dor, tosse/estridor/febre nas complicações.", "rac": "Início súbito + idade típica + criança bem antes + sem sinais infecciosos.", "pista": "'Babar muito' (anotação de aula: sialorreia = perda involuntária de saliva pela boca).", "mud": "Febre alta e placas amigdalianas direcionariam para infecção.", "cmp": "Corpo estranho (súbito, afebril) versus infecção de orofaringe (progressivo, febril).", "arm": "Descartar a hipótese porque 'ninguém viu'.", "regra": "Criança pequena + sintoma súbito de deglutição = pense em corpo estranho.", "cf": "Se a criança não deglute nem a própria saliva, há obstrução importante e remoção imediata.", "fonte": "F1, Aula 6, p. 15"}, {"n": 2, "sub": "Exame de imagem inicial", "comp": "Escolher o exame inicial", "tags": ["osce"], "rel": [], "enun": "Para a criança da questão anterior, com suspeita de corpo estranho radiopaco, qual exame inicial o material recomenda?", "ops": [["Radiografia simples de pescoço, tórax e abdome em AP e perfil.", "Correta: localiza, conta, identifica formato e procura complicações."], ["Tomografia de tórax, por ser mais sensível para objetos pequenos.", "Errada: TC é reservada a objeto radiotransparente ou suspeita de complicação."], ["Radiografia de tórax apenas em AP, sufici
