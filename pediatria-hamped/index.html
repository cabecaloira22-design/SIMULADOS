ente para objetos metálicos.", "Errada: o perfil é essencial (ex.: diferenciar moeda de bateria) e o abdome deve ser incluído."], ["Endoscopia digestiva alta sem imagem prévia, que é diagnóstica e terapêutica.", "Errada: a endoscopia é indicada após a avaliação inicial; a radiografia vem primeiro."]], "conc": "Radiopaco: radiografia simples de pescoço, tórax e abdome em AP e perfil. Objetivo: localizar, contar, formato e sinais de complicação. TC: radiotransparente ou complicação (perfuração, mediastinite, peritonite). EDA: diagnóstica e terapêutica quando indicada.", "rac": "Abranger o trajeto inteiro e ter duas incidências.", "pista": "'AP e perfil' e 'pescoço, tórax e abdome'.", "mud": "Suspeita de objeto radiotransparente com sintomas → TC pode ser indicada.", "cmp": "Radiografia (localiza e caracteriza) versus endoscopia (confirma e remove).", "arm": "Pedir só tórax AP e perder o objeto no abdome ou o sinal do perfil.", "regra": "Pescoço, tórax e abdome; AP e perfil.", "cf": "A radiografia também conta os objetos: dois ímãs mudam totalmente a conduta.", "fonte": "F1, Aula 6, p. 15"}, {"n": 3, "sub": "Moeda x bateria botão", "comp": "Interpretar a radiografia descrita", "tags": ["osce"], "rel": [], "enun": "A radiografia em AP mostra disco radiopaco no esôfago cervical com contorno duplo concêntrico (um anel interno dentro da borda); no perfil, as duas faces do disco aparecem com um desnível entre elas. Qual o objeto mais provável?", "ops": [["Bateria botão.", "Correta: duplo halo em AP e degrau (step-off) no perfil."], ["Moeda.", "Errada: moeda tem contorno único em AP e espessura homogênea no perfil."], ["Dois ímãs acoplados.", "Errada: não é o padrão descrito pelo material para ímãs; a descrição corresponde à bateria."], ["Duas moedas sobrepostas.", "Errada: o material ensina o duplo halo com degrau como sinal da bateria botão."]], "conc": "Moeda: borda única em AP, espessura homogênea em perfil. Bateria botão: duplo contorno/'duplo halo' em AP e 'degrau' em perfil. 'Pilha tipo moeda/botão' = bateria botão.", "rac": "Contorno duplo + desnível no perfil = assinatura radiológica da bateria.", "pista": "'Anel interno' e 'desnível'.", "mud": "Contorno único e espessura homogênea indicariam moeda.", "cmp": "Veja a figura abaixo: A e B são moedas (AP e perfil); C e D, bateria (duplo halo e degrau).", "arm": "Tratar a bateria como moeda comum e adiar a retirada.", "regra": "Duplo halo + degrau = bateria = emergência se no esôfago.", "cf": "Se a mesma imagem mostrasse o objeto no estômago, em criança assintomática, a conduta seria outra (F2, p. 36).", "fonte": "F1, Aula 6, pp. 15–16", "figc": "rx"}, {"n": 4, "sub": "Bateria no esôfago", "comp": "Definir conduta e tempo na bateria esofágica", "tags": ["osce"], "rel": [], "enun": "Criança de 3 anos, assintomática, ingeriu uma bateria botão há 1 hora; a radiografia mostra o objeto no esôfago médio. Qual a conduta?", "ops": [["Remoção endoscópica imediata, idealmente em até 2 horas, mantendo jejum.", "Correta: bateria no esôfago é emergência mesmo sem sintomas."], ["Observação por 12 a 24 horas, pois a criança está assintomática.", "Errada: não se espera sintomas quando há bateria no esôfago."], ["Repetir a radiografia em 7 a 14 dias para confirmar a eliminação.", "Errada: essa conduta é citada para bateria já no estômago, não no esôfago."], ["Oferecer mel e aguardar a passagem espontânea ao estômago.", "Errada: o mel nunca deve atrasar a endoscopia."]], "conc": "Bateria no esôfago → remoção endoscópica imediata, idealmente < 2 h. Lesão por compressão, descarga elétrica e meio alcalino; pode evoluir mesmo após a retirada.", "rac": "Objeto (bateria) + local (esôfago) = categoria IMEDIATA da tabela, independentemente de sintomas.", "pista": "'Não espere sintomas.'", "mud": "Se a bateria estivesse no estômago, com criança assintomática e ingestão ≤ 12 h, a revisão relâmpago cita RX em 7–14 dias (ESPGHAN 2021).", "cmp": "Bateria (imediata, < 2 h) versus moeda sem obstrução (urgente, < 24 h).", "arm": "Ser tranquilizado pela ausência de sintomas.", "regra": "Bateria no esôfago = endoscopia já.", "cf": "Complicações temidas: esofagite cáustica, estenose, perfuração, mediastinite, fístula traqueoesofágica e para grandes vasos.", "fonte": "F1, Aula 6, p. 16; F2, p. 36"}, {"n": 5, "sub": "Obstrução esofágica completa", "comp": "Reconhecer obstrução completa", "tags": [], "rel": [], "enun": "Menino de 6 anos engasgou com um pedaço de carne; desde então não consegue engolir nem a própria saliva, que escorre pela boca. Respira bem. Qual a conduta?", "ops": [["Remoção imediata, pois há obstrução esofágica completa.", "Correta: não deglutir saliva = obstrução completa = remoção imediata (< 2 h)."], ["Remoção urgente em até 24 horas, pois alimento impactado é objeto rombo.", "Errada: o prazo de 24 h vale para alimento sem obstrução completa."], ["Oferecer líquidos gaseificados para ajudar o bolo a descer.", "Errada: não se oferecem alimentos/líquidos para empurrar o objeto."], ["Induzir o vômito para expulsar o bolo alimentar.", "Errada: induzir vômito está na lista do NÃO FAÇA."]], "conc": "Criança que não consegue deglutir a própria saliva tem obstrução esofágica importante e precisa de remoção imediata.", "rac": "O sintoma (não deglute saliva) se sobrepõe ao tipo de objeto na decisão de tempo.", "pista": "'Não consegue engolir nem a própria saliva.'", "mud": "Se conseguisse deglutir saliva, alimento impactado entraria na categoria urgente (< 24 h).", "cmp": "ABC primeiro: como respira bem, a via aérea não exige estabilização imediata.", "arm": "Classificar pelo objeto e esquecer o critério funcional.", "regra": "Não engole saliva = imediata.", "cf": "Anotação de aula: ABC = vias aéreas, respiração e circulação; se via aérea comprometida, estabilizar antes de tudo.", "fonte": "F1, Aula 6, pp. 15–16"}, {"n": 6, "sub": "Moeda no esôfago", "comp": "Definir o prazo de remoção da moeda", "tags": [], "rel": [], "enun": "Criança de 4 anos ingeriu moeda há 2 horas; está assintomática e deglute saliva normalmente. A radiografia mostra moeda no esôfago proximal. Segundo o manual da SBP citado no material, qual a conduta?", "ops": [["Remoção urgente, em geral em até 24 horas; prioridade se houver sintomas.", "Correta: moeda no esôfago sem obstrução completa é URGENTE (< 24 h)."], ["Remoção imediata em até 2 horas, como para qualquer objeto no esôfago.", "Errada: o prazo de 2 h é para bateria, objeto cortante ou obstrução completa."], ["Alta com orientação, pois moedas sempre passam espontaneamente pelo esôfago.", "Errada: moeda que permanece no esôfago deve ser retirada."], ["Oferecer pão para empurrar a moeda e repetir a radiografia.", "Errada: está na lista do NÃO FAÇA."]], "conc": "Moeda/objeto rombo no esôfago sem obstrução completa → urgente, em geral < 24 h; sintomáticos têm prioridade. A revisão relâmpago (F2) cita observar 12–24 h na moeda esofágica assintomática — ou seja, a espera é limitada a esse intervalo.", "rac": "Objeto rombo + sem obstrução + assintomático = categoria urgente.", "pista": "'Deglute saliva normalmente' e 'assintomática'.", "mud": "Se a criança não deglutisse saliva, seria remoção imediata.", "cmp": "Moeda (menos corrosiva) versus bateria (lesão cáustica/elétrica rápida).", "arm": "Tratar toda moeda como emergência de 2 horas ou, ao contrário, como benigna.", "regra": "Moeda no esôfago sem obstrução: até 24 h.", "cf": "Se a moeda já tivesse passado para o estômago, com criança assintomática, muitas vezes caberia conduta expectante com orientação.", "fonte": "F1, Aula 6, p. 16; F2, p. 36"}, {"n": 7, "sub": "Ingestão de ímãs", "comp": "Reconhecer o risco de múltiplos ímãs", "tags": [], "rel": ["A10"], "enun": "Menino de 4 anos engoliu duas pequenas esferas magnéticas de um brinquedo; a radiografia mostra os dois objetos no abdome. Está assintomático. Qual conduta reflete o material?", "ops": [["Tratar como alto risco (necrose e perfuração entre alças): avaliação e remoção urgentes.", "Correta: ≥ 2 ímãs (ou ímã + metal) é situação urgente."], ["Conduta expectante, pois são objetos pequenos, rombos e já ultrapassaram o esôfago sem sintomas.", "Errada: a regra expectante não se aplica a múltiplos ímãs."], ["Radiografias semanais até a eliminação, sem outra intervenção.", "Errada: subestima o risco de necrose e perfuração."], ["Laxante para acelerar a eliminação e alta com orientação.", "Errada: não há essa conduta no material; o risco é de lesão entre alças."]], "conc": "Dois ou mais ímãs (ou ímã + metal): alto risco de compressão entre alças, necrose e perfuração; avaliação/remoção urgente conforme localização.", "rac": "O número de objetos (2) e o tipo (ímã) definem o risco, não o tamanho.", "pista": "'Duas' esferas 'magnéticas'.", "mud": "Um único objeto pequeno, rombo, não tóxico, no estômago, em criança assintomática: muitas vezes expectante.", "cmp": "Por isso a história dirigida pergunta 'quantos objetos? pode ser mais de um ímã?'.", "arm": "Aplicar a regra do objeto pequeno e rombo sem perguntar o material.", "regra": "Dois ímãs = urgência.", "cf": "Um ímã + um clipe metálico tem o mesmo risco de compressão.", "fonte": "F1, Aula 6, pp. 15–16"}, {"n": 8, "sub": "O que não fazer e medidas temporárias", "comp": "Conhecer condutas proibidas e o papel do mel", "tags": ["osce"], "rel": [], "enun": "Sobre uma criança de 3 anos com suspeita de bateria botão no esôfago, qual afirmação está correta?", "ops": [["Mel (> 1 ano) ou sucralfato são pontes se houver atraso de acesso, sem atrasar a endoscopia.", "Correta: é exatamente a ressalva do material."], ["Induzir o vômito é útil se a ingestão ocorreu há menos de 30 minutos.", "Errada: não se induz vômito."], ["Oferecer pão ajuda a levar a bateria ao estômago, onde ela é inofensiva.", "Errada: não se oferecem alimentos para empurrar o objeto."], ["Em criança assintomática, pode-se aguardar o surgimento de sintomas antes de indicar a endoscopia.", "Errada: não se espera sintoma quando há bateria no esôfago."]], "conc": "NÃO FAÇA: induzir vômito, oferecer alimentos para empurrar, esperar sintomas. Mel (> 1 ano) ou sucralfato: estratégia temporária se há atraso de acesso; nunca atrasa a endoscopia.", "rac": "Excluir as três condutas da lista proibida.", "pista": "'NUNCA deve atrasar a remoção endoscópica.'", "mud": "Em criança < 1 ano, mel não é opção.", "cmp": "F2, p. 36: mel 10 mL a cada 10 min (> 1 ano, < 12 h da ingestão).", "arm": "Achar que a medida temporária substitui a endoscopia.", "regra": "Bateria esofágica = emergência endoscópica; o resto é ponte.", "cf": "A lesão pela bateria pode continuar evoluindo mesmo após a retirada, por isso o seguimento importa.", "fonte": "F1, Aula 6, p. 16; F2, p. 36"}]}, {"id": "A07", "titulo": "Constipação intestinal na infância", "arq": "F1", "pags": "17–18", "bloco": 2, "q": [{"n": 1, "sub": "Fisiopatologia e escape fecal", "comp": "Explicar o escape fecal na constipação", "tags": [], "rel": [], "enun": "Menina de 5 anos, com controle esfincteriano desde os 3, passou a sujar a calcinha com fezes amolecidas várias vezes por semana. A mãe acha que é 'diarreia'. Ela evita o vaso, evacua fezes muito grossas e dolorosas a cada 5 dias. Qual a explicação mais provável?", "ops": [["Escape fecal por transbordamento na constipação funcional.", "Correta: o ciclo de retenção leva a fecaloma e incontinência por transbordamento."], ["Diarreia infecciosa intermitente associada à constipação crônica.", "Errada: o padrão é de retenção crônica com escape, não de diarreia."], ["Incontinência fecal neurogênica por disrafismo oculto.", "Errada: não há sinais neurológicos; o quadro tem comportamento retentivo típico."], ["Diarreia crônica por má absorção de carboidratos.", "Errada: não explica fezes grossas e dolorosas nem a retenção."]], "conc": "Ciclo: evacuação dolorosa → evita evacuar → retenção → absorção de água → fezes maiores e mais duras → mais dor. Com o tempo: fecaloma, distensão retal e escape fecal por transbordamento.", "rac": "Fezes grossas a cada 5 dias + evitar o vaso + sujar a roupa = retenção com transbordamento.", "pista": "'Já tinha controle esfincteriano' + 'evita o vaso'.", "mud": "Se houvesse alteração de sensibilidade perineal ou de força em membros inferiores, pensar em causa neurológica.", "cmp": "Escape fecal (constipação) versus diarreia (aumento de frequência e redução de consistência habitual).", "arm": "Tratar o 'escape' com antidiarreico, piorando a retenção.", "regra": "Criança constipada que suja a roupa: pense em transbordamento.", "cf": "Anotação de aula: fecaloma = massa dura e compacta de fezes acumuladas presa no reto/intestino grosso.", "fonte": "F1, Aula 7, p. 17"}, {"n": 2, "sub": "Roma IV até 4 anos", "comp": "Aplicar Roma IV em menores de 4 anos", "tags": [], "rel": [], "enun": "Menino de 2 anos, sem controle esfincteriano, há 6 semanas evacua 2 vezes por semana, com fezes duras e dolorosas; fica rígido e cruza as pernas para não evacuar. Sem sinais de alarme. Qual a classificação?", "ops": [["Constipação funcional por Roma IV: ≥ 2 critérios por pelo menos 1 mês.", "Correta: ≤ 2 evacuações/semana, evacuação dolorosa e retenção excessiva, por > 1 mês."], ["Ainda não fecha critério, pois Roma IV exige 3 meses de sintomas nessa idade.", "Errada: para até 4 anos, o critério é de pelo menos 1 mês."], ["Disquesia do lactente, pela idade e pelo esforço evacuatório.", "Errada: disquesia é em < 9 meses e com fezes macias."], ["Só fecha critério após radiografia mostrando grande massa fecal no cólon.", "Errada: o diagnóstico é clínico; radiografia não é rotina."]], "conc": "Roma IV até 4 anos: ≥ 2 por ≥ 1 mês — ≤ 2 evacuações/semana; retenção excessiva; evacuação dolorosa/difícil; grande massa fecal no reto; fezes de grande diâmetro. Com controle esfincteriano, também contam incontinência ≥ 1/semana e fezes que entopem o vaso.", "rac": "Três critérios presentes por 6 semanas.", "pista": "'Fica rígido e cruza as pernas' = comportamento de retenção.", "mud": "Com apenas 2 semanas de sintomas, ainda não completaria o tempo mínimo.", "cmp": "Critério de tempo: ≥ 1 mês nas duas faixas etárias do material.", "arm": "Importar o tempo de critérios de adultos.", "regra": "Dois critérios, um mês.", "cf": "Se esse menino já usasse o vaso, 'fezes que entopem o vaso' também contariam.", "fonte": "F1, Aula 7, p. 17"}, {"n": 3, "sub": "Roma IV a partir de 4 anos", "comp": "Aplicar Roma IV na criança maior", "tags": [], "rel": [], "enun": "Menina de 6 anos, há 6 semanas, evacua no vaso 2 vezes por semana, com fezes de grande diâmetro que entopem o vaso. Não tem dor abdominal que preencha critérios de síndrome do intestino irritável. Ela preenche Roma IV para constipação funcional?", "ops": [["Sim: dois critérios, ao menos 1 vez por semana, por pelo menos 1 mês.", "Correta: ≤ 2 evacuações no vaso/semana + fezes de grande diâmetro que obstruem o vaso."], ["Não: para essa idade são necessários pelo menos 3 meses de sintomas.", "Errada: o material usa no mínimo 1 mês."], ["Não: o diagnóstico exige fecaloma palpável ao exame.", "Errada: grande massa fecal é um dos critérios, não obrigatório."], ["Não: é necessário evacuar 1 vez ou menos por semana.", "Errada: o critério é ≤ 2 evacuações no vaso por semana."]], "conc": "Roma IV (idade de desenvolvimento ≥ 4 anos): ≥ 2, pelo menos 1×/semana por ≥ 1 mês, sem critérios suficientes para SII — ≤ 2 evacuações no vaso/semana; ≥ 1 incontinência/semana; retenção/posturas retentivas; evacuação dolorosa/dura; grande massa fecal retal; fezes de grande diâmetro que obstruem o vaso.", "rac": "Dois critérios presentes, por 6 semanas, e sem SII.", "pista": "'Entopem o vaso' é critério explícito.", "mud": "Se a dor abdominal preenchesse critérios de SII, a classificação seria outra.", "cmp": "'Idade de desenvolvimento' (não só cronológica) define a faixa.", "arm": "Achar que só 'evacuar pouco' basta; são necessários dois critérios.", "regra": "≥ 4 anos: dois critérios, semanais, por um mês, sem SII.", "cf": "Incontinência fecal ≥ 1×/semana também seria critério nessa faixa.", "fonte": "F1, Aula 7, p. 17"}, {"n": 4, "sub": "Sinais de alarme", "comp": "Reconhecer red flags de doença orgânica", "tags": [], "rel": ["A10"], "enun": "Lactente de 3 meses tem evacuações difíceis desde a primeira semana de vida e abdome distendido. Na maternidade, eliminou mecônio com 60 horas de vida. Qual a conduta mais adequada?", "ops": [["Considerar doença orgânica (Hirschsprung) e investigar.", "Correta: início < 30 dias e mecônio após 48 h são red flags."], ["Diagnosticar constipação funcional e iniciar PEG de manutenção em dose baixa.", "Errada: na presença de sinais de alarme, não se assume quadro funcional."], ["Tranquilizar como disquesia do lactente e orientar a família.", "Errada: disquesia tem fezes macias e não cursa com distensão nem atraso do mecônio."], ["Trocar a fórmula infantil e reavaliar em 30 dias.", "Errada: atrasa a investigação de doença orgânica."]], "conc": "Red flags: início < 30 dias; mecônio após 48 h; vômitos biliosos/distensão intensa; déficit de ganho de peso/febre; sangue sem fissura; fezes em fita/posição anal anormal; alterações sacrais/neurológicas; história familiar de Hirschsprung.", "rac": "Duas red flags clássicas de Hirschsprung no mesmo caso.", "pista": "'Mecônio com 60 horas'.", "mud": "Início aos 2 anos, após desfralde, sem red flags, sugere constipação funcional.", "cmp": "F2, p. 23: Hirschsprung e íleo meconial entre as causas de abdome agudo neonatal.", "arm": "Rotular como funcional sem perguntar sobre o mecônio.", "regra": "Começou no 1º mês ou mecônio > 48 h: pense em Hirschsprung.", "cf": "Anotação de aula: mecônio = primeiras fezes, 24–48 h no máximo.", "fonte": "F1, Aula 7, pp. 17–18; F2, p. 23"}, {"n": 5, "sub": "Disquesia do lactente", "comp": "Diferenciar disquesia de constipação", "tags": [], "rel": [], "enun": "Lactente de 3 meses, em aleitamento materno, saudável e ganhando peso, faz força, chora e fica vermelho por cerca de 15 minutos antes de eliminar fezes macias. Qual a conduta?", "ops": [["Orientar que é disquesia do lactente, sem laxante nem estimulação retal.", "Correta: incoordenação benigna, com fezes macias, em lactente saudável < 9 meses."], ["Diagnosticar constipação funcional e prescrever PEG de manutenção.", "Errada: fezes macias excluem constipação."], ["Indicar supositório de glicerina para aliviar o esforço evacuatório nos episódios mais longos.", "Errada: estimulação retal rotineira não é indicada."], ["Investigar Hirschsprung pelo esforço evacuatório prolongado.", "Errada: não há red flags; o lactente é saudável."]], "conc": "Disquesia: lactente < 9 meses, esforço e choro ≥ 10 minutos antes de fezes macias, por incoordenação entre pressão abdominal e relaxamento do assoalho pélvico. Não é constipação.", "rac": "Fezes macias + lactente saudável + idade < 9 meses = disquesia.", "pista": "'Fezes macias'.", "mud": "Fezes duras e infrequentes mudariam o diagnóstico para constipação.", "cmp": "Disquesia (problema de coordenação) versus constipação (fezes duras e retenção).", "arm": "Medicar o esforço sem olhar a consistência das fezes.", "regra": "Fezes macias = não é constipação.", "cf": "A estimulação retal frequente pode atrasar o aprendizado da coordenação.", "fonte": "F1, Aula 7, p. 18"}, {"n": 6, "sub": "Desimpactação com PEG", "comp": "Calcular a dose de PEG para desimpactação", "tags": ["calculo"], "rel": [], "enun": "Criança de 4 anos e 16 kg com constipação funcional e grande massa fecal retal. Pelo material da SBP, qual é a dose de PEG para desimpactação?", "ops": [["16 a 24 g/dia por via oral, por no máximo 6 dias.", "Correta: 1,0–1,5 g/kg/dia × 16 kg."], ["3,2 a 12,8 g/dia por via oral, por no máximo 6 dias.", "Errada: é a faixa de manutenção (0,2–0,8 g/kg/dia)."], ["16 a 48 mL/dia de lactulose por via oral.", "Errada: é a faixa de lactulose (1–3 mL/kg/dia), opção de manutenção, não a desimpactação preferida."], ["16 a 24 g/dia por via oral, por 30 dias seguidos.", "Errada: a desimpactação dura no máximo 6 dias; depois vem a manutenção."]], "conc": "Se há impactação, desimpactar; o material da SBP prefere PEG oral: 1,0–1,5 g/kg/dia, máx. 6 dias. Manutenção: 0,2–0,8 g/kg/dia. Lactulose: 1–3 mL/kg/dia.", "rac": "16 × 1,0 = 16 g; 16 × 1,5 = 24 g; duração máxima 6 dias.", "pista": "'Desimpactação' define a faixa mais alta e o tempo curto.", "mud": "Após desimpactar, a dose cai para manutenção (3,2–12,8 g/dia nessa criança).", "cmp": "F2, p. 36: 1–1,5 g/kg/d por 3–6 dias — compatível.", "arm": "Trocar a dose de desimpactação pela de manutenção.", "regra": "Desimpactar: 1–1,5 g/kg/dia, até 6 dias.", "cf": "Para 20 kg, a desimpactação seria 20–30 g/dia.", "fonte": "F1, Aula 7, p. 18; F2, p. 36"}, {"n": 7, "sub": "Manutenção e medidas comportamentais", "comp": "Planejar a fase de manutenção", "tags": ["osce"], "rel": ["A11"], "enun": "Após a desimpactação, qual plano de manutenção está de acordo com o material?", "ops": [["PEG 0,2–0,8 g/kg/dia por meses, com rotina no vaso após refeições e sem punição.", "Correta: manutenção prolongada + treino comportamental com reforço positivo."], ["Suspender o laxante na primeira evacuação normal e manter apenas uma dieta rica em fibras e água.", "Errada: o tratamento costuma durar meses; suspensão precoce favorece recaída."], ["Aumentar fibras e líquidos muito acima da necessidade, substituindo o laxante.", "Errada: excesso além da necessidade não substitui laxativo quando indicado."], ["Enemas diários por um mês, associados a punição leve quando houver escape.", "Errada: enemas diários não são a manutenção descrita, e a punição é contraindicada."]], "conc": "Manutenção por tempo suficiente para fezes macias e evacuação indolor (meses); treino comportamental após refeições com apoio para os pés, sem punição, com reforço positivo; líquidos e fibras adequados; reavaliar adesão e red flags; encaminhar se refratária.", "rac": "Combinar fármaco ajustado + comportamento + alimentação adequada.", "pista": "'Sem punição' e 'por meses'.", "mud": "Sem resposta, reavaliar adesão e sinais de alarme e considerar gastroenterologia pediátrica.", "cmp": "Lactulose (1–3 mL/kg/dia) é opção, mas pode causar gases e dor abdominal.", "arm": "Parar o laxante quando a criança melhora.", "regra": "Manutenção longa, rotina no vaso, zero punição.", "cf": "Explicar o ciclo de retenção à família retira a culpa da criança.", "fonte": "F1, Aula 7, p. 18"}, {"n": 8, "sub": "Investigação", "comp": "Decidir sobre exames na constipação típica", "tags": [], "rel": [], "enun": "Criança de 5 anos com quadro clássico de constipação funcional e sem sinais de alarme. Qual afirmação sobre a investigação está correta?", "ops": [["O diagnóstico é clínico; radiografia e toque retal não são rotina.", "Correta: história, exame e Roma IV bastam no quadro típico."], ["A radiografia de abdome é necessária para confirmar o fecaloma antes de iniciar o tratamento.", "Errada: não é exame de rotina para confirmar constipação."], ["O toque retal deve ser feito em todos os casos para definir a impactação.", "Errada: só se diagnóstico incerto, falha terapêutica ou suspeita anatômica/neurológica."], ["A manometria anorretal deve ser feita antes de iniciar laxantes.", "Errada: não faz parte da avaliação do quadro típico."]], "conc": "Exame: inspeção, ausculta, palpação, inspeção perianal e lombossacra quando indicado. Toque retal não obrigatório de rotina. Radiografia de abdome não é rotina.", "rac": "Quadro típico + ausência de red flags = diagnóstico clínico.", "pista": "'Quadro clássico' e 'sem sinais de alarme'.", "mud": "Falha terapêutica ou suspeita neurológica justificariam toque retal e outros exames.", "cmp": "Inspeção lombossacra: desvio da fenda glútea, tufo de pelos, fosseta atípica (disrafismo).", "arm": "Pedir radiografia 'para documentar'.", "regra": "Constipação típica: olho clínico, não imagem.", "cf": "A ausculta abdominal faz parte do exame geral, mas não confirma constipação isoladamente.", "fonte": "F1, Aula 7, pp. 17–18"}]}, {"id": "A08", "titulo": "Síndromes diarreicas, hidratação e nutrição", "arq": "F1", "pags": "19–21", "bloco": 2, "q": [{"n": 1, "sub": "Classificação da hidratação — Plano B", "comp": "Classificar o estado de hidratação", "tags": ["osce"], "rel": [], "enun": "Criança de 2 anos com diarreia aquosa há 2 dias: irritada, olhos fundos, bebe água avidamente, boca seca, prega abdominal que desaparece lentamente, pulso cheio. Qual a classificação e o plano?", "ops": [["Com desidratação, sem gravidade: Plano B.", "Correta: dois ou mais sinais de desidratação e nenhum sinal de gravidade (asterisco)."], ["Sem desidratação: Plano A.", "Errada: há vários sinais de desidratação."], ["Desidratação grave: Plano C.", "Errada: não há sinal com asterisco (letargia/coma, incapacidade de beber, pulso fraco)."], ["Com desidratação: Plano B, com início por via venosa.", "Errada: o Plano B é feito com SRO no estabelecimento de saúde."]], "conc": "Plano B: dois ou mais sinais de desidratação. Plano C: dois ou mais sinais e pelo menos um de gravidade (asterisco): comatoso/hipotônico/letárgico/inconsciente; não consegue beber; pulso fraco ou ausente.", "rac": "Sinais B: irritado, olhos fundos, sedento, boca seca, prega lenta. Nenhum asterisco: está alerta, bebe e tem pulso cheio.", "pista": "'Bebe avidamente' é sinal B; 'não consegue beber' seria C.", "mud": "Se a criança estivesse letárgica, passaria para Plano C.", "cmp": "No OSCE, descrever o conjunto: estado geral, olhos, sede, boca, prega, pulso, diurese/perda ponderal.", "arm": "Dizer só 'mucosa seca' e classificar por um único sinal.", "regra": "Dois sinais = B; dois sinais + um asterisco = C.", "cf": "Em dúvida entre B e C, o Ministério orienta considerar o pior cenário.", "fonte": "F1, Aula 8, p. 19"}, {"n": 2, "sub": "Classificação da hidratação — Plano C", "comp": "Reconhecer desidratação grave", "tags": ["osce"], "rel": [], "enun": "Lactente de 8 meses com diarreia e vômitos: letárgico, não consegue beber, olhos muito fundos, prega abdominal que desaparece muito lentamente e pulso fraco. Qual a conduta?", "ops": [["Desidratação grave: Plano C, com hidratação venosa em serviço de saúde.", "Correta: há sinais de desidratação e de gravidade (letargia, não bebe, pulso fraco)."], ["Desidratação: Plano B, com SRO 75 mL/kg em 4 a 6 horas.", "Errada: sinais com asterisco indicam Plano C."], ["Sem desidratação: Plano A, com SRO após cada evacuação.", "Errada: há múltiplos sinais de desidratação grave."], ["Plano B, pois a presença de diurese descarta desidratação grave.", "Errada: a classificação é sindrômica pelos sinais da tabela; ainda há três sinais de gravidade."]], "conc": "Plano C: tratamento em serviço de saúde/hospital, com SF 0,9% ou Ringer lactato, monitorização e reavaliação frequente.", "rac": "Três sinais com asterisco presentes.", "pista": "'Letárgico', 'não consegue beber' e 'pulso fraco'.", "mud": "Se estivesse irritado, bebendo avidamente e com pulso cheio, seria Plano B.", "cmp": "Prega que some 'muito lentamente (> 2 s)' é coluna C da tabela.", "arm": "Iniciar SRO oral em criança que não consegue beber.", "regra": "Asterisco presente = via venosa.", "cf": "Se a criança puder beber durante a hidratação venosa, oferecer SRO em pequenas quantidades assim que for seguro.", "fonte": "F1, Aula 8, pp. 19–20"}, {"n": 3, "sub": "Cálculo do Plano B", "comp": "Calcular o volume de SRO no Plano B", "tags": ["calculo"], "rel": [], "enun": "Criança de 12 kg classificada em Plano B. Qual a prescrição inicial de reidratação?", "ops": [["600 a 1.200 mL de SRO em 4 a 6 horas, na unidade.", "Correta: 50–100 mL/kg (média 75 mL/kg) em 4–6 h."], ["360 mL de soro fisiológico intravenoso em 30 minutos.", "Errada: corresponde à 1ª etapa do Plano C (30 mL/kg) em ≥ 1 ano."], ["1.200 mL de SRO ao longo de 24 horas, em casa, junto com a dieta habitual.", "Errada: o Plano B é feito no estabelecimento em 4–6 h."], ["100 a 200 mL de SRO após cada evacuação, em casa.", "Errada: essa é a orientação do Plano A para 1–10 anos."]], "conc": "Plano B: SRO 50–100 mL/kg (média 75 mL/kg) em 4–6 h no estabelecimento; oferecer em pequenos volumes; termina quando os sinais desaparecem (passa ao A); sem melhora em 6 h, hospitalizar.", "rac": "12 × 50 = 600 mL; 12 × 100 = 1.200 mL; média 12 × 75 = 900 mL.", "pista": "'Plano B' = SRO na unidade.", "mud": "Se não houver melhora em 6 horas, encaminhar para hospitalização; se piorar, Plano C.", "cmp": "Plano A (casa, reposição de perdas) versus Plano B (unidade, reposição do déficit).", "arm": "Usar soro venoso em criança que pode beber.", "regra": "Plano B: 75 mL/kg de SRO em 4–6 h.", "cf": "Vômitos não justificam abandonar a reidratação: oferecer volumes menores e mais frequentes.", "fonte": "F1, Aula 8, p. 20"}, {"n": 4, "sub": "Cálculo do Plano C", "comp": "Calcular o Plano C por faixa etária", "tags": ["calculo"], "rel": [], "enun": "Lactente de 9 meses, 8 kg, em Plano C. Qual o esquema de hidratação venosa?", "ops": [["240 mL em 1 hora, seguidos de 560 mL em 5 horas.", "Correta: < 1 ano — 30 mL/kg em 1 h + 70 mL/kg em 5 h."], ["240 mL em 30 minutos, seguidos de 560 mL em 2 horas e 30 minutos.", "Errada: são os tempos para ≥ 1 ano."], ["800 mL em 1 hora, seguidos de manutenção.", "Errada: 100 mL/kg é o total da fase, distribuído em 6 h no menor de 1 ano."], ["80 mL em 1 hora, seguidos de 160 mL em 5 horas.", "Errada: usa 10 e 20 mL/kg, volumes que não constam do protocolo."]], "conc": "Plano C: < 1 ano — 30 mL/kg em 1 h + 70 mL/kg em 5 h (100 mL/kg em 6 h); ≥ 1 ano — 30 mL/kg em 30 min + 70 mL/kg em 2 h 30 min (100 mL/kg em 3 h). SF 0,9% ou Ringer lactato.", "rac": "8 × 30 = 240 mL; 8 × 70 = 560 mL; 9 meses → tempos do menor de 1 ano.", "pista": "A idade (< 1 ano) define os tempos.", "mud": "Com 1 ano e 3 meses, os mesmos volumes seriam dados em 30 min e 2 h 30 min.", "cmp": "RN e cardiopatas graves exigem maior cautela na expansão (o MS traz modificação para esses grupos).", "arm": "Acertar os volumes e errar os tempos por faixa etária.", "regra": "30 + 70: em 1 h + 5 h (< 1 ano) ou 30 min + 2h30 (≥ 1 ano).", "cf": "F2, p. 36: na manutenção após a fase grave, KCl 10% 2 mL a cada 100 mL.", "fonte": "F1, Aula 8, p. 20; F2, p. 36"}, {"n": 5, "sub": "Plano A", "comp": "Orientar o Plano A", "tags": ["osce"], "rel": [], "enun": "Criança de 3 anos com diarreia aguda aquosa, sem desidratação. Qual orientação está de acordo com o Plano A do Ministério da Saúde?", "ops": [["SRO 100–200 mL por evacuação, alimentação habitual e zinco 20 mg/dia por 10–14 dias.", "Correta: volumes para 1–10 anos, sem jejum, zinco > 6 meses."], ["SRO 50–100 mL após cada evacuação, jejum de 12 horas e zinco 10 mg/dia.", "Errada: volume e zinco são da faixa < 1 ano/≤ 6 meses, e não se faz jejum."], ["SRO 100–200 mL após cada evacuação, suspender leite e derivados e zinco por 3 dias.", "Errada: mantém-se a alimentação habitual, e o zinco é por 10–14 dias."], ["SRO à vontade, antibiótico por 5 dias e retorno apenas se a diarreia durar mais de 14 dias.", "Errada: antibiótico não é rotina, e o retorno deve ser antecipado diante de sinais de piora."]], "conc": "Plano A: tratar em casa; mais líquidos e SRO após cada evacuação/vômito (< 1 ano 50–100 mL; 1–10 anos 100–200 mL; > 10 anos o quanto aceitar); manter alimentação e aleitamento; não fazer jejum; preparo correto do SRO e higiene; zinco até 6 m 10 mg/dia, > 6 m 20 mg/dia, por 10–14 dias; sinais de retorno.", "rac": "3 anos → 100–200 mL e zinco 20 mg/dia.", "pista": "A faixa etária define o volume e a dose de zinco.", "mud": "Em lactente de 5 meses: SRO 50–100 mL e zinco 10 mg/dia.", "cmp": "Retornar imediatamente se piora, vômitos repetidos, sangue nas fezes, pouca urina, muita sede, recusa alimentar; reavaliar se não melhorar em 2 dias.", "arm": "Prescrever jejum 'para o intestino descansar'.", "regra": "Plano A: SRO + comida + zinco + sinais de retorno.", "cf": "F2, p. 36: zinco 20 mg para > 6 meses até 5 anos.", "fonte": "F1, Aula 8, p. 20; F2, p. 36"}, {"n": 6, "sub": "Medicamentos", "comp": "Indicar ou contraindicar fármacos na diarreia", "tags": [], "rel": [], "enun": "Menino de 4 anos com diarreia aquosa há 2 dias, afebril, ativo e hidratado. A mãe pede antibiótico e um remédio para 'prender o intestino'. Qual a conduta?", "ops": [["Nenhum dos dois: não são rotina nesse quadro.", "Correta: base = reidratação, alimentação e zinco."], ["Antibiótico empírico para encurtar o quadro, sem antidiarreico.", "Errada: antibiótico é reservado a situações específicas."], ["Antiparasitário empírico, que é seguro e cobre uma causa frequente de diarreia.", "Errada: antiparasitário depende de diagnóstico/indicação."], ["Antidiarreico que reduz motilidade para diminuir as perdas.", "Errada: não deve ser usado rotineiramente em crianças."]], "conc": "Antibiótico: reservado a situações específicas (disenteria com comprometimento do estado geral, cólera conforme contexto). Antidiarreicos que reduzem motilidade não são rotina. Antiparasitário só com indicação.", "rac": "Diarreia aquosa, criança bem, hidratada → Plano A sem antimicrobianos.", "pista": "'Aquosa', 'afebril, ativo e hidratado'.", "mud": "Disenteria com comprometimento do estado geral seria indicação de antibiótico.", "cmp": "Ver A14: na diarreia sanguinolenta por E. coli produtora de toxina Shiga, evitar antibiótico e antiperistálticos pelo risco de SHU.", "arm": "Ceder ao pedido e prescrever 'para garantir'.", "regra": "Diarreia aquosa: hidratar, alimentar, zinco.", "cf": "Se surgir sangue nas fezes com febre alta e prostração, reavaliar a indicação de antibiótico.", "fonte": "F1, Aula 8, pp. 20–21"}, {"n": 7, "sub": "Padrões clínicos", "comp": "Classificar o padrão da diarreia", "tags": [], "rel": [], "enun": "Criança de 18 meses com fezes com sangue e muco, febre e dor ao evacuar (tenesmo). Qual padrão clínico e sua implicação?", "ops": [["Disentérica/inflamatória: maior chance de invasão da mucosa.", "Correta: sangue/muco, febre e tenesmo são as pistas."], ["Aquosa: o principal risco é a desidratação.", "Errada: não há sangue na diarreia aquosa."], ["Gordurosa/má absorção: pensar em giardíase ou doença celíaca.", "Errada: seria fezes volumosas, oleosas e fétidas com perda ponderal."], ["Persistente: risco nutricional pela duração.", "Errada: o padrão é definido pelo aspecto; não foi informada duração > 14 dias."]], "conc": "Aquosa: líquida, sem sangue, risco de desidratação. Disentérica/inflamatória: sangue e/ou muco, febre, dor/tenesmo, invasão de mucosa. Gordurosa/má absorção: volumosas, oleosas/fétidas, perda ponderal/deficiências.", "rac": "Sangue + muco + febre + tenesmo = inflamatória.", "pista": "'Sangue e muco'.", "mud": "Fezes líquidas abundantes sem sangue = aquosa.", "cmp": "Padrão (aspecto) e duração (aguda, persistente, crônica) são eixos diferentes.", "arm": "Misturar classificação por aspecto com classificação por tempo.", "regra": "Sangue e muco = disentérica.", "cf": "Disenteria com comprometimento do estado geral é situação em que o antibiótico pode estar indicado.", "fonte": "F1, Aula 8, p. 19"}, {"n": 8, "sub": "Diarreia persistente e nutrição", "comp": "Reconhecer o risco nutricional da diarreia persistente", "tags": [], "rel": ["A04"], "enun": "Lactente de 10 meses, desmamado aos 2 meses, tem diarreia intermitente há 20 dias após uma gastroenterite aguda; a curva de peso está caindo. Qual afirmação está correta?", "ops": [["Diarreia persistente com risco nutricional; avaliar peso e trajetória.", "Correta: > 14 dias após episódio agudo, com fatores de risco e ciclo mucosa–desnutrição."], ["Diarreia aguda prolongada; o manejo é igual e a nutrição só é avaliada após cessar.", "Errada: > 14 dias define persistente, e a nutrição é parte do manejo."], ["É diarreia crônica, que exige investigação etiológica ampliada de imediato.", "Errada: crônica é em geral > 4 semanas."], ["Indica jejum alimentar curto para permitir a recuperação da mucosa.", "Errada: o jejum piora o ciclo de desnutrição e má regeneração da mucosa."]], "conc": "Diarreia persistente (SPSP): após episódio agudo presumivelmente infeccioso, prolonga-se, contínua ou intermitente, por > 14 dias, com possível comprometimento nutricional. Fatores de risco: < 1 ano, baixo peso ao nascer, desnutrição, imunodeficiência, desmame precoce, gastroenterocolite recente, práticas alimentares inadequadas.", "rac": "20 dias (> 14 e < 4 semanas), após GECA, < 1 ano, desmame precoce, peso caindo.", "pista": "'Curva de peso caindo' + duração.", "mud": "Com mais de 4 semanas, seria classificada como crônica.", "cmp": "Na desidratação, o peso está artificialmente reduzido: reavaliar após reidratar antes de concluir perda nutricional.", "arm": "Tratar a nutrição como detalhe secundário.", "regra": "Diarreia persistente: lesão de mucosa → má absorção → desnutrição → pior reparo.", "cf": "Procure também emagrecimento visível, redução de subcutâneo, edema bilateral e alterações de cabelo e pele.", "fonte": "F1, Aula 8, pp. 19–21"}]}, {"id": "A09", "titulo": "Propedêutica das síndromes ictéricas na infância", "arq": "F2", "pags": "21–22", "bloco": 3, "q": [{"n": 1, "sub": "Icterícia nas primeiras 24 horas", "comp": "Investigar icterícia precoce", "tags": [], "rel": ["A03"], "enun": "RN a termo, mãe O positivo, apresenta icterícia visível com 16 horas de vida. Qual a conduta adequada?", "ops": [["Investigar hemólise: BT e frações, tipagem ABO/Rh, Coombs direto e reticulócitos.", "Correta: icterícia < 24 h é sempre patológica (pensar em hemólise)."], ["Observar como icterícia fisiológica e reavaliar no 3º dia de vida.", "Errada: a fisiológica começa após 24 h."], ["Dosar TSH e T4 como primeira investigação da icterícia precoce.", "Errada: hipotireoidismo entra na icterícia prolongada, não na precoce."], ["Solicitar ultrassonografia abdominal para afastar atresia de vias biliares.", "Errada: atresia cursa com colestase (BD), e não com icterícia nas primeiras horas."]], "conc": "Icterícia que inicia nas primeiras 24 h é sempre patológica: hemólise. Propedêutica da indireta: BT e frações, ABO/Rh, Coombs direto, hemograma com reticulócitos e esfregaço, G6PD conforme indicação.", "rac": "Mãe O + icterícia < 24 h → pensar em isoimunização ABO (Coombs direto +).", "pista": "'16 horas de vida'.", "mud": "Icterícia que começa no 3º dia, em RN ativo, com aumento gradual, tende a ser fisiológica.", "cmp": "Indireta por hemólise (Coombs) versus direta por colestase (BD ≥ 1 mg/dL).", "arm": "Esperar o 'pico fisiológico' em RN com icterícia no 1º dia.", "regra": "Icterícia < 24 h = hemólise até prova em contrário.", "cf": "Cefalo-hematoma e policitemia também aumentam a produção de bilirrubina.", "fonte": "F2, Seção 9, pp. 21–22"}, {"n": 2, "sub": "Zonas de Kramer", "comp": "Estimar a bilirrubina pela progressão craniocaudal", "tags": ["osce"], "rel": [], "enun": "RN de 3 dias, com boa luz e digitopressão, tem icterícia que vai da cabeça até os joelhos, poupando pernas, palmas e plantas. Qual a interpretação correta?", "ops": [["Zona 3 de Kramer (~8–16 mg/dL); confirmar com dosagem.", "Correta: umbigo até joelhos = zona 3; avaliação visual é imprecisa."], ["Zona 2 de Kramer (5–12 mg/dL); não há necessidade de dosagem.", "Errada: zona 2 vai só até o umbigo; e a estimativa visual deve ser confirmada."], ["Zona 4 de Kramer (11–18 mg/dL); iniciar fototerapia sem dosagem.", "Errada: zona 4 inclui braços e pernas abaixo dos joelhos; decisão exige dosagem."], ["Zona 3 de Kramer; o valor visual estimado basta para decidir sobre a fototerapia.", "Errada: a decisão usa BT plotada por idade em horas, IG e fatores de risco."]], "conc": "Kramer: 1 cabeça/pescoço 4–8; 2 tronco até umbigo 5–12; 3 umbigo até joelhos 8–16; 4 braços e pernas abaixo dos joelhos 11–18; 5 palmas e plantas > 15. Visual é impreciso (pele escura, fototerapia).", "rac": "Limite inferior nos joelhos = zona 3.", "pista": "'Até os joelhos'.", "mud": "Icterícia em palmas e plantas = zona 5 (> 15 mg/dL).", "cmp": "Técnica: luz natural ou branca adequada, digitopressão em fronte, esterno, joelho e planta.", "arm": "Decidir conduta só pelo olho.", "regra": "Kramer estima; dosagem decide.", "cf": "Olhar a fralda: cor da urina e das fezes pelo cartão colorimétrico da Caderneta.", "fonte": "F2, Seção 9, p. 21"}, {"n": 3, "sub": "Aleitamento x leite materno", "comp": "Diferenciar as icterícias ligadas à amamentação", "tags": [], "rel": [], "enun": "Lactente de 3 semanas em aleitamento materno exclusivo, ativo, ganhando peso, com icterícia leve. Bilirrubina total 12 mg/dL com direta de 0,4 mg/dL; teste do pezinho normal. Qual a hipótese mais provável?", "ops": [["Icterícia do leite materno.", "Correta: tardia (2ª–3ª semana), indireta, em RN bem."], ["Icterícia do aleitamento por ingestão insuficiente.", "Errada: ocorre na 1ª semana, com perda de peso > 10%; aqui há ganho de peso."], ["Colestase neonatal por atresia de vias biliares.", "Errada: a bilirrubina direta é < 1 mg/dL."], ["Hemólise por isoimunização ABO.", "Errada: a hemólise se manifesta precocemente, em geral nas primeiras 24 h."]], "conc": "Icterícia do aleitamento: ingestão insuficiente, 1ª semana, perda de peso > 10%. Icterícia do leite materno: tardia, 2ª–3ª semana, RN bem.", "rac": "Tardia + indireta + RN bem + ganho de peso = leite materno.", "pista": "BD 0,4 mg/dL e 'ganhando peso'.", "mud": "Com BD ≥ 1 mg/dL, seria colestase, e a abordagem mudaria completamente.", "cmp": "Icterícia que persiste > 2 semanas no termo exige dosar a BD — foi o que permitiu afastar colestase aqui.", "arm": "Rotular icterícia prolongada como 'do leite' sem dosar a direta.", "regra": "Prolongou? Dose a direta antes de tranquilizar.", "cf": "Na icterícia prolongada, TSH/T4 (teste do pezinho) também são revisados para afastar hipotireoidismo.", "fonte": "F2, Seção 9, pp. 21–22"}, {"n": 4, "sub": "Colestase e atresia de vias biliares", "comp": "Reconhecer urgência na colestase do lactente", "tags": [], "rel": ["A13"], "enun": "Lactente de 5 semanas com icterícia desde a 2ª semana, fezes esbranquiçadas ('massa de vidraceiro'), urina escura e fígado palpável. Qual a conduta?", "ops": [["Dosar a bilirrubina direta e encaminhar com urgência (atresia de vias biliares).", "Correta: Kasai tem melhores resultados até ~60 dias."], ["Suspender o aleitamento por 48 horas para testar a hipótese de icterícia do leite materno.", "Errada: acolia e colúria indicam colestase, não icterícia do leite materno."], ["Iniciar fototerapia e dosar a bilirrubina total em 24 horas.", "Errada: fototerapia não trata colestase e atrasa o diagnóstico."], ["Observar até os 3 meses, quando a maioria das colestases se resolve.", "Errada: a janela da cirurgia de Kasai é de ~60 dias."]], "conc": "Icterícia com predomínio direto é patológica em qualquer idade; no lactente, atresia de vias biliares até prova em contrário. Fezes acólicas e urina escura exigem encaminhamento urgente ao gastropediatra/cirurgião pediátrico.", "rac": "Acolia + colúria + hepatomegalia aos 35 dias: tempo curto até o limite de ~60 dias.", "pista": "'Massa de vidraceiro'.", "mud": "Fezes coradas e BD normal tornariam a colestase improvável.", "cmp": "Ver A13: urina escura por colúria tem fita com bilirrubina positiva e espuma amarelada.", "arm": "Perder tempo com hipótese benigna enquanto a janela do Kasai se fecha.", "regra": "Fezes brancas + urina escura = urgência.", "cf": "Atresia: o RN muitas vezes 'parece bem' no início, o que engana.", "fonte": "F2, Seção 9, pp. 21–22"}, {"n": 5, "sub": "Exames na colestase", "comp": "Interpretar exames que sugerem atresia", "tags": [], "rel": [], "enun": "Na investigação de colestase de um lactente de 6 semanas, qual conjunto de achados reforça a hipótese de atresia de vias biliares?", "ops": [["GGT elevada e USG em jejum com vesícula ausente/pequena e cordão triangular.", "Correta: são os achados citados para atresia."], ["Coombs direto positivo e reticulocitose com numerosos esferócitos no esfregaço.", "Errada: indicam hemólise (hiperbilirrubinemia indireta)."], ["Bilirrubina indireta elevada isolada com direta < 1 mg/dL.", "Errada: isso afasta colestase."], ["Substâncias redutoras na urina e glicemia baixa.", "Errada: sugerem galactosemia, outra causa de colestase."]], "conc": "Colestase: BT e frações, TGO, TGP, GGT (elevada na atresia), FA; TAP/INR, albumina, glicemia; USG em jejum (vesícula ausente/pequena, cordão triangular, cisto de colédoco); urocultura, TORCH, sífilis, TSH/T4, alfa-1 antitripsina, substâncias redutoras, teste do suor. Cintilografia, biópsia e colangiografia intraoperatória definem atresia.", "rac": "Selecionar os achados específicos de atresia entre os de outras causas.", "pista": "'Cordão triangular'.", "mud": "Substâncias redutoras positivas apontariam para galactosemia.", "cmp": "TAP/INR alargado na colestase pode refletir má absorção de vitamina K.", "arm": "Achar que a USG sozinha define atresia; a definição vem de cintilografia, biópsia e colangiografia.", "regra": "Atresia: GGT alta, vesícula ausente, cordão triangular.", "cf": "Cisto de colédoco também aparece na USG e é diferencial cirúrgico.", "fonte": "F2, Seção 9, p. 22"}, {"n": 6, "sub": "Critérios de icterícia patológica", "comp": "Identificar critério de icterícia patológica", "tags": [], "rel": [], "enun": "Qual característica de uma icterícia neonatal sugere causa patológica?", "ops": [["Aumento da bilirrubina de 0,3 mg/dL por hora.", "Correta: velocidade > 0,2 mg/dL/h é critério de patológica."], ["Início no 3º dia de vida em RN a termo ativo e mamando.", "Errada: é o padrão fisiológico (após 24 h)."], ["Pico entre o 3º e o 5º dia de vida no RN a termo.", "Errada: é o pico esperado da fisiológica."], ["Resolução completa até 10 dias de vida.", "Errada: a fisiológica resolve em até 2 semanas."]], "conc": "Sugere patológica: início < 24 h; persistência > 2 semanas no termo ou > 3 no pré-termo; aumento > 0,2 mg/dL/h ou > 5 mg/dL/dia; nível próximo/acima do limiar de fototerapia; BD ≥ 1 mg/dL; palidez, hepatoesplenomegalia, letargia, sucção débil, colúria, acolia.", "rac": "0,3 > 0,2 mg/dL/h.", "pista": "Velocidade.", "mud": "Aumento de 0,1 mg/dL/h seria gradual.", "cmp": "Velocidade horária (> 0,2) e diária (> 5 mg/dL/dia) são dois modos de expressar o mesmo critério.", "arm": "Olhar só o valor absoluto e ignorar a velocidade.", "regra": "Cedo, rápido, longo, direto ou com sinais = patológica.", "cf": "F2, p. 36: icterícia patológica < 24 h; > 2 semanas (termo); > 3 semanas (pré-termo).", "fonte": "F2, Seção 9, p. 21"}, {"n": 7, "sub": "Kernicterus", "comp": "Reconhecer a encefalopatia bilirrubínica", "tags": [], "rel": [], "enun": "RN de 5 dias com bilirrubina indireta muito elevada fica letárgico, hipotônico e com sucção débil; horas depois surgem hipertonia, opistótono, choro agudo e febre. Qual o diagnóstico e uma sequela típica?", "ops": [["Encefalopatia bilirrubínica (kernicterus); sequela de surdez neurossensorial.", "Correta: fase aguda e sequelas descritas no material."], ["Sepse neonatal tardia; a sequela típica é a perda auditiva condutiva.", "Errada: o quadro com BI muito alta e evolução para opistótono é o de kernicterus."], ["Hipoglicemia neonatal grave; sequela típica de epilepsia de ausência na infância.", "Errada: não explica a progressão descrita nem a relação com a bilirrubina."], ["Hipertensão intracraniana por hemorragia; sequela de hidrocefalia.", "Errada: o contexto é hiperbilirrubinemia grave."]], "conc": "Kernicterus: fase aguda com letargia, hipotonia, sucção débil, depois hipertonia, opistótono, choro agudo, febre. Sequelas: paralisia cerebral coreoatetoide, surdez neurossensorial, paralisia do olhar vertical.", "rac": "Bilirrubina indireta muito alta + sequência hipotonia → hipertonia/opistótono.", "pista": "'Opistótono' e 'choro agudo' com BI elevada.", "mud": "Febre isolada com hipotonia, sem hiperbilirrubinemia importante, faria pensar em sepse.", "cmp": "Três sequelas: coreoatetose, surdez neurossensorial, paralisia do olhar vertical.", "arm": "Achar que a hipotonia inicial é 'sono do bebê ictérico'.", "regra": "Bilirrubina indireta alta + alteração neurológica = kernicterus.", "cf": "Por isso a decisão de fototerapia considera fatores de risco de neurotoxicidade.", "fonte": "F2, Seção 9, p. 22"}, {"n": 8, "sub": "Icterícia na criança maior", "comp": "Diagnosticar causa de icterícia no adolescente", "tags": [], "rel": [], "enun": "Adolescente de 15 anos, saudável, nota olhos amarelados quando fica em jejum prolongado ou gripado. Exame físico normal, sem anemia; bilirrubina indireta discretamente elevada. Qual a hipótese?", "ops": [["Síndrome de Gilbert.", "Correta: icterícia leve em jejum, estresse ou infecção, de bilirrubina indireta."], ["Doença de Wilson.", "Errada: cursa com hemólise e hepatopatia, e pode haver anel de Kayser-Fleischer."], ["Hepatite A.", "Errada: cursa com quadro agudo e hepatopatia, não com episódios recorrentes ligados a jejum."], ["Esferocitose hereditária.", "Errada: haveria anemia hemolítica; a colelitíase é complicação típica."]], "conc": "Criança maior/adolescente: Gilbert (icterícia leve em jejum, estresse, infecção; benigna); hemólises (falciforme, esferocitose, G6PD, autoimune); hepatite viral (A mais comum); hepatite autoimune; Wilson (> 5 anos, hemólise + hepatopatia, Kayser-Fleischer); hepatite medicamentosa; colelitíase em doenças hemolíticas; cisto de colédoco.", "rac": "Episódios ligados a jejum/infecção + BI leve + sem anemia nem hepatopatia.", "pista": "'Jejum prolongado ou gripado'.", "mud": "Com anemia, reticulocitose e esplenomegalia, pensar em hemólise.", "cmp": "Gilbert (falha de conjugação, benigno) versus Wilson (hepatopatia + hemólise).", "arm": "Investigar exaustivamente um quadro benigno típico.", "regra": "Icterícia leve no jejum, resto normal = Gilbert.", "cf": "G6PD: icterícia e urina escura após oxidantes ou fava.", "fonte": "F2, Seção 9, p. 21"}]}, {"id": "A10", "titulo": "Abdome agudo no neonato e na criança", "arq": "F2", "pags": "23–25", "bloco": 3, "q": [{"n": 1, "sub": "Vômitos biliosos no neonato", "comp": "Reconhecer má rotação com volvo", "tags": [], "rel": ["A05"], "enun": "RN de 10 dias, a termo, que vinha mamando bem, inicia vômitos biliosos. O abdome está plano e indolor. Qual a hipótese e a conduta?", "ops": [["Volvo de intestino médio: emergência cirúrgica (seriografia ou USG).", "Correta: vômito bilioso em RN previamente bem = volvo até prova em contrário."], ["Estenose hipertrófica do piloro: USG eletiva e realimentação.", "Errada: no piloro os vômitos não são biliosos."], ["Refluxo gastroesofágico fisiológico: orientar e reavaliar.", "Errada: vômito bilioso nunca é RGE fisiológico."], ["Enterocolite necrosante: dieta zero e antibiótico.", "Errada: ocorre sobretudo em prematuros em dieta enteral, com distensão e sangue nas fezes."]], "conc": "Má rotação com volvo: vômitos biliosos em RN/lactente previamente bem = emergência cirúrgica até prova em contrário; abdome inicialmente pode ser plano. Seriografia: junção duodenojejunal à direita da coluna, 'saca-rolhas'; USG: inversão de artéria e veia mesentéricas, sinal do redemoinho.", "rac": "Bilioso + previamente bem + abdome plano não tranquiliza.", "pista": "'Abdome plano' é armadilha: o volvo pode começar assim.", "mud": "Vômitos não biliosos em jato com 4 semanas apontariam para piloro.", "cmp": "A idade é o principal filtro diagnóstico do abdome agudo pediátrico.", "arm": "Esperar distensão para considerar cirurgia.", "regra": "Verde no RN = volvo até provar o contrário.", "cf": "Sinais de alarme gerais: vômitos biliosos ou fecaloides, distensão progressiva, parada de gases e fezes.", "fonte": "F2, Seção 10, p. 23"}, {"n": 2, "sub": "Estenose hipertrófica do piloro", "comp": "Reconhecer o distúrbio metabólico do piloro", "tags": [], "rel": ["A05"], "enun": "Lactente de 4 semanas com vômitos em jato não biliosos e oliva palpável no epigástrio. Qual distúrbio ácido-básico e eletrolítico é esperado?", "ops": [["Alcalose metabólica hipoclorêmica e hipocalêmica.", "Correta: perda de ácido clorídrico gástrico pelos vômitos."], ["Acidose metabólica hiperclorêmica e hipocalêmica.", "Errada: típica de perdas intestinais baixas, como na diarreia."], ["Alcalose metabólica hiperclorêmica e hipercalêmica.", "Errada: o potássio tende a cair."], ["Acidose metabólica com hipocalemia e cloro normal.", "Errada: a perda gástrica produz alcalose."]], "conc": "Estenose do piloro: 2–8 semanas, mais em meninos primogênitos; vômitos não biliosos, em jato, pós-mamada, lactente faminto; oliva palpável no epigástrio/HD; onda peristáltica visível; alcalose metabólica hipoclorêmica e hipocalêmica. USG: músculo ≥ 3–4 mm, canal ≥ 15–17 mm.", "rac": "Vomitar suco gástrico = perder H+ e Cl−.", "pista": "Vômito não bilioso = obstrução antes do duodeno.", "mud": "Se houvesse diarreia volumosa associada, o padrão poderia ser acidose.", "cmp": "Onda peristáltica gástrica visível da esquerda para a direita.", "arm": "Trocar 'hipo' por 'hiper' no potássio.", "regra": "Piloro: alcalose, cloro baixo, potássio baixo.", "cf": "F2, p. 36: USG com músculo ≥ 3–4 mm e canal ≥ 15–17 mm.", "fonte": "F2, Seção 10, p. 23; F2, p. 36"}, {"n": 3, "sub": "Invaginação intestinal", "comp": "Diagnosticar e tratar invaginação", "tags": [], "rel": ["A14"], "enun": "Lactente de 9 meses com crises de choro intenso e pernas fletidas, intercaladas com períodos de letargia, e vômitos. Palpa-se massa alongada no quadrante superior direito, com fossa ilíaca direita 'vazia'. Qual exame e tratamento?", "ops": [["USG (alvo/pseudorrim) e redução hidrostática ou pneumática.", "Correta: é a abordagem descrita para invaginação."], ["Radiografia com dupla bolha e correção cirúrgica eletiva.", "Errada: dupla bolha é da atresia duodenal."], ["Seriografia com junção duodenojejunal à direita e cirurgia imediata.", "Errada: são achados de má rotação/volvo."], ["USG com espessura muscular ≥ 4 mm e piloromiotomia.", "Errada: são achados de estenose do piloro."]], "conc": "Invaginação: pico 6 meses–3 anos; cólica intermitente com choro e flexão das pernas, intercalada com letargia; vômitos; fezes em 'geleia de framboesa' (tardio); massa em 'salsicha' no QSD; FID vazia (sinal de Dance). USG: alvo (transversal) e pseudorrim (longitudinal). Tratamento: redução hidrostática ou pneumática guiada.", "rac": "Idade + cólica com letargia + massa em salsicha + Dance.", "pista": "'Fossa ilíaca direita vazia' = sinal de Dance.", "mud": "Se o choro fosse contínuo, com febre e vômitos biliosos no RN, o filtro de idade levaria a pensar em volvo.", "cmp": "Ver A14: a vasculite por IgA pode causar dor abdominal com risco de invaginação.", "arm": "Esperar as fezes em geleia de framboesa, que são achado tardio.", "regra": "Cólica + letargia + salsicha = invaginação.", "cf": "Sangue nas fezes está entre os sinais de alarme (invaginação, enterocolite, Meckel, SHU).", "fonte": "F2, Seção 10, pp. 23–24"}, {"n": 4, "sub": "Abdome agudo neonatal", "comp": "Diferenciar causas neonatais pela imagem e pelo contexto", "tags": [], "rel": [], "enun": "RN com características de síndrome de Down apresenta vômitos biliosos nas primeiras horas de vida; a radiografia mostra imagem em 'dupla bolha'. Qual o diagnóstico?", "ops": [["Atresia duodenal.", "Correta: vômitos biliosos precoces, dupla bolha e associação com Down."], ["Enterocolite necrosante.", "Errada: prematuro em dieta enteral; RX com pneumatose, gás portal ou pneumoperitônio."], ["Doença de Hirschsprung.", "Errada: atraso do mecônio > 48 h e distensão."], ["Íleo meconial.", "Errada: associado à fibrose cística, com distensão."]], "conc": "Atresia duodenal: vômitos biliosos nas primeiras horas, 'dupla bolha', associação com Down. Jejunoileais: distensão e múltiplos níveis. ECN: prematuro, pneumatose, gás portal, pneumoperitônio, estadiamento de Bell. Hirschsprung/íleo meconial: mecônio > 48 h, distensão; íleo meconial ↔ fibrose cística.", "rac": "Três pistas convergentes: Down, primeiras horas, dupla bolha.", "pista": "'Dupla bolha'.", "mud": "Prematuro de 29 semanas em dieta, com distensão e sangue nas fezes, apontaria para ECN.", "cmp": "Dupla bolha (atresia) versus pneumatose intestinal (ECN).", "arm": "Ver vômito bilioso e responder 'volvo' sem olhar a imagem.", "regra": "Down + dupla bolha = atresia duodenal.", "cf": "Íleo meconial deve levar a pensar em fibrose cística.", "fonte": "F2, Seção 10, p. 23"}, {"n": 5, "sub": "Pediatric Appendicitis Score", "comp": "Calcular o PAS e definir a conduta", "tags": ["calculo"], "rel": [], "enun": "Menino de 9 anos: dor que começou periumbilical e migrou para a FID, náuseas, temperatura 38,2 °C e dor à palpação da FID. Não tem anorexia, e o teste do salto é negativo. Leucócitos 9.000/mm³ e neutrófilos 6.000/mm³. Qual o PAS e a conduta?", "ops": [["5 pontos; risco intermediário: USG.", "Correta: migração 1 + náuseas 1 + febre 1 + dor à palpação da FID 2 = 5."], ["7 pontos; alto risco: avaliação cirúrgica.", "Errada: pontuaria anorexia e leucócitos/neutrófilos, que estão ausentes."], ["3 pontos; baixo risco: alta com orientação.", "Errada: subestima; a dor à palpação da FID vale 2."], ["5 pontos; baixo risco: alta com orientação.", "Errada: 4–6 é risco intermediário, com indicação de USG."]], "conc": "PAS: dor em FID à tosse/percussão/salto 2; dor à palpação da FID 2; anorexia 1; febre ≥ 38 °C 1; náuseas/vômitos 1; migração para FID 1; leucócitos > 10.000 1; neutrófilos > 7.500 1. ≤ 3 baixo; 4–6 intermediário (USG); ≥ 7 alto (cirurgia).", "rac": "Somar só os itens presentes: 1 + 1 + 1 + 2 = 5.", "pista": "Teste do salto negativo e leucograma normal não pontuam.", "mud": "Com teste do salto positivo (+2), o total seria 7: avaliação cirúrgica.", "cmp": "Alvarado (MANTRELS) usa febre ≥ 37,3 °C e dá 2 pontos à leucocitose.", "arm": "Esquecer que dor à palpação da FID vale 2.", "regra": "PAS 4–6: USG; ≥ 7: cirurgião.", "cf": "Em escore intermediário com USG inconclusivo, observação com reavaliação seriada é estratégia válida.", "fonte": "F2, Seção 10, p. 25"}, {"n": 6, "sub": "Manobras do exame abdominal", "comp": "Interpretar manobras semiológicas", "tags": ["osce"], "rel": [], "enun": "Com a criança em decúbito lateral esquerdo, a extensão passiva do quadril direito provoca dor abdominal. Qual o sinal e o que sugere?", "ops": [["Sinal do psoas: apêndice retrocecal.", "Correta: extensão passiva do quadril direito ou flexão contra resistência."], ["Sinal do obturador: apêndice pélvico.", "Errada: obturador é a rotação interna da coxa direita fletida."], ["Sinal de Rovsing: apendicite.", "Errada: compressão da FIE provocando dor na FID."], ["Sinal de Blumberg: irritação peritoneal em FID.", "Errada: descompressão brusca dolorosa no ponto de McBurney."]], "conc": "Blumberg (descompressão em McBurney); Rovsing (FIE → dor FID); psoas (retrocecal); obturador (pélvico); Dunphy/hop test (dor ao tossir ou pular); Murphy (colecistite); Dance (invaginação); Giordano (pielonefrite, litíase).", "rac": "Extensão do quadril estira o psoas, que tem contato com o apêndice retrocecal.", "pista": "'Extensão passiva do quadril direito'.", "mud": "Dor à rotação interna da coxa fletida = obturador (apêndice pélvico).", "cmp": "Em crianças, preferir manobras menos dolorosas: pular, tossir, andar na ponta dos pés.", "arm": "Trocar psoas por obturador.", "regra": "Psoas = retrocecal; obturador = pélvico.", "cf": "Percussão dolorosa já indica irritação peritoneal sem precisar de descompressão brusca.", "fonte": "F2, Seção 10, p. 24"}, {"n": 7, "sub": "Evidência e imagem na apendicite", "comp": "Aplicar a evidência diagnóstica", "tags": [], "rel": [], "enun": "Sobre a avaliação de apendicite em crianças, segundo a revisão citada no material (JAMA, Rational Clinical Examination), qual afirmação está correta?", "ops": [["Febre e rebote aumentam a probabilidade; leucometria normal a reduz.", "Correta: e nenhum achado isolado confirma ou exclui."], ["Leucometria normal exclui apendicite e dispensa reavaliação.", "Errada: reduz a probabilidade, mas não exclui."], ["Dor periumbilical isolada confirma o diagnóstico de apendicite na criança pequena.", "Errada: nenhum achado isolado confirma."], ["A tomografia é o exame inicial de escolha pela maior acurácia.", "Errada: USG é o exame inicial em crianças, sem radiação."]], "conc": "Febre e rebote aumentam muito a probabilidade; leucometria normal e neutrófilos baixos reduzem; usar escores. USG inicial (apêndice não compressível > 6 mm); TC ou RM se inconclusivo.", "rac": "Nenhum dado isolado basta → escores + imagem racional.", "pista": "'Os achados que mais aumentam'.", "mud": "USG inconclusivo com dúvida persistente → TC ou RM.", "cmp": "Em < 5 anos, a perfuração é frequente pela apresentação atípica.", "arm": "Liberar a criança por leucograma normal.", "regra": "Escore + USG; nenhum achado sozinho decide.", "cf": "Apendicite: dor periumbilical que migra para FID, anorexia, vômitos após a dor, febre baixa.", "fonte": "F2, Seção 10, pp. 23–25"}, {"n": 8, "sub": "Causas clínicas de dor abdominal", "comp": "Lembrar causas extra-abdominais", "tags": ["osce"], "rel": [], "enun": "Menino de 4 anos com dor abdominal, febre de 39 °C e frequência respiratória aumentada; abdome sem defesa ou rigidez. Qual hipótese não pode ser esquecida e qual passo do exame a confirma?", "ops": [["Pneumonia de base; auscultar os pulmões.", "Correta: dor abdominal + taquipneia é a pista citada no material."], ["Apendicite aguda; solicitar avaliação cirúrgica imediata.", "Errada: sem sinais peritoneais, e a taquipneia aponta para o tórax."], ["Adenite mesentérica; tranquilizar após IVAS.", "Errada: não explica a taquipneia."], ["Invaginação intestinal; solicitar USG abdominal.", "Errada: a idade é possível, mas o quadro febril com taquipneia sugere pneumonia."]], "conc": "Causas clínicas: adenite mesentérica, constipação, gastroenterite, pneumonia de base (dor abdominal + taquipneia), ITU/pielonefrite, faringite estreptocócica, CAD, vasculite por IgA. No exame, sempre auscultar os pulmões.", "rac": "Taquipneia + febre + abdome sem sinais peritoneais = pense no tórax.", "pista": "'Frequência respiratória aumentada'.", "mud": "Com rigidez e dor à percussão, a hipótese cirúrgica ganharia força.", "cmp": "Adolescente com dor abdominal: sempre beta-hCG (gravidez ectópica).", "arm": "Focar no abdome e esquecer o resto do exame.", "regra": "Sempre: inguinais, escroto, perianal, Giordano e pulmões.", "cf": "A maioria das dores abdominais agudas em crianças é de causa clínica.", "fonte": "F2, Seção 10, pp. 23–24"}]}, {"id": "A11", "titulo": "Infecção do trato urinário em bebês e crianças: enfoque sindrômico", "arq": "F2", "pags": "26–27", "bloco": 4, "q": [{"n": 1, "sub": "Febre sem foco no lactente", "comp": "Indicar coleta de urina adequada", "tags": [], "rel": [], "enun": "Lactente de 10 meses com febre de 39 °C há 2 dias, sem foco ao exame, em bom estado geral. Qual conduta é a mais adequada?", "ops": [["Colher urina por cateterismo para urinálise e urocultura antes do antibiótico.", "Correta: ITU é a principal causa bacteriana de febre sem sinais localizatórios no lactente."], ["Coletar urina por saco coletor e iniciar o antibiótico apenas se a urocultura for positiva.", "Errada: saco coletor só vale se negativo; positivo não confirma."], ["Aguardar 72 horas de febre antes de qualquer exame de urina.", "Errada: nessa faixa, a urina deve ser colhida na febre sem foco."], ["Iniciar amoxicilina empírica e colher urina se não houver melhora.", "Errada: a urocultura deve ser colhida antes do antibiótico."]], "conc": "Lactente 3–24 meses: febre sem foco, irritabilidade, vômitos, diarreia, urina com odor forte. Sempre colher urina em febre sem foco nessa faixa. Cateterismo é o método mais usado; punção suprapúbica é padrão-ouro.", "rac": "Idade + febre sem foco → urina por método estéril → urocultura antes do ATB.", "pista": "'Sem foco ao exame'.", "mud": "Criança de 6 anos com controle esfincteriano: jato médio após higiene.", "cmp": "Quanto menor a criança, mais inespecífica a apresentação.", "arm": "Usar o saco coletor como método diagnóstico.", "regra": "Febre sem foco no lactente = urina, por método estéril.", "cf": "No neonato e < 3 meses, ITU vem com risco de bacteremia e sepse: investigar sepse.", "fonte": "F2, Seção 11, p. 26"}, {"n": 2, "sub": "Saco coletor", "comp": "Interpretar urocultura de saco coletor", "tags": [], "rel": [], "enun": "Lactente de 8 meses febril teve urina colhida por saco coletor: urocultura com 100.000 UFC/mL de E. coli. Qual a interpretação?", "ops": [["Não confirma ITU; repetir a coleta por método estéril.", "Correta: saco coletor tem alto índice de contaminação; só serve se negativo."], ["ITU confirmada, pois ≥ 100.000 UFC/mL de um único agente.", "Errada: esse limiar é para jato médio em criança com controle esfincteriano."], ["ITU confirmada, pois E. coli é o agente mais comum na faixa etária.", "Errada: o agente não valida o método de coleta."], ["ITU descartada, pois saco coletor não tem valor diagnóstico.", "Errada: o negativo tem valor; o positivo é que precisa de confirmação."]], "conc": "Saco coletor: só serve se o resultado for negativo; positivo não confirma — repetir por método estéril.", "rac": "Positivo em saco = possível contaminação → confirmar por cateterismo ou punção.", "pista": "'Saco coletor'.", "mud": "Se a mesma cultura viesse de cateterismo, com piúria, confirmaria ITU.", "cmp": "Valor preditivo negativo alto versus positivo pouco confiável.", "arm": "Tratar pela cultura de saco.", "regra": "Saco: negativo ajuda, positivo não serve.", "cf": "Coletar a nova amostra antes de iniciar antibiótico.", "fonte": "F2, Seção 11, p. 26"}, {"n": 3, "sub": "Limiares de urocultura", "comp": "Aplicar o critério diagnóstico da AAP", "tags": [], "rel": [], "enun": "Lactente de 14 meses febril. Urina colhida por cateterismo: piúria e 60.000 UFC/mL de E. coli. Pelo critério da AAP adotado no material, qual a interpretação?", "ops": [["ITU confirmada: urinálise sugestiva e ≥ 50.000 UFC/mL de um único uropatógeno por cateterismo.", "Correta: é o critério AAP."], ["Não confirma, pois o limiar é ≥ 100.000 UFC/mL para qualquer método.", "Errada: 100.000 é o limiar do jato médio."], ["Provável contaminação, pois o cateterismo exige qualquer crescimento para ser negativo.", "Errada: 'qualquer crescimento' é o critério da punção suprapúbica, para positividade."], ["Não confirma; só a punção suprapúbica pode diagnosticar ITU no lactente.", "Errada: punção é padrão-ouro, mas o cateterismo é o método mais usado."]], "conc": "Punção suprapúbica: qualquer crescimento de uropatógeno. Cateterismo: ≥ 50.000 UFC/mL (AAP; alguns protocolos aceitam ≥ 10.000). Jato médio: ≥ 100.000 de agente único. Diagnóstico AAP: urinálise sugestiva + urocultura ≥ 50.000 por cateterismo ou punção.", "rac": "60.000 ≥ 50.000 + piúria + método estéril.", "pista": "Método = cateterismo.", "mud": "Com 60.000 em jato médio, não fecharia o critério.", "cmp": "Referencial: AAP (F2, p. 26).", "arm": "Usar 100.000 para todos os métodos.", "regra": "Punção: qualquer; cateterismo: 50 mil; jato médio: 100 mil.", "cf": "F2, p. 36: cateterismo ≥ 50.000 / jato médio ≥ 100.000 UFC/mL.", "fonte": "F2, Seção 11, p. 26; F2, p. 36"}, {"n": 4, "sub": "Fita urinária no lactente", "comp": "Interpretar nitrito e esterase", "tags": [], "rel": [], "enun": "Lactente de 6 meses febril: urina por cateterismo com esterase leucocitária positiva e nitrito negativo. Qual afirmação está correta?", "ops": [["Nitrito negativo não afasta ITU no lactente; a esterase é mais sensível.", "Correta: nitrito é específico, mas pouco sensível em lactentes."], ["O nitrito negativo afasta ITU, pois é o marcador mais sensível da fita urinária.", "Errada: o nitrito é muito específico e pouco sensível."], ["A esterase positiva isolada confirma ITU e dispensa a urocultura.", "Errada: o diagnóstico exige urocultura."], ["A fita perde valor no lactente e não deve ser solicitada.", "Errada: a urinálise faz parte do critério diagnóstico."]], "conc": "Nitrito: muito específico, pouco sensível em lactentes (não há tempo de conversão na bexiga). Esterase leucocitária: mais sensível. Gram de urina não centrifugada aumenta a acurácia.", "rac": "Esterase + com nitrito − em lactente febril mantém a hipótese; aguardar urocultura.", "pista": "'Lactente' + 'nitrito negativo'.", "mud": "Nitrito positivo aumentaria muito a probabilidade (alta especificidade).", "cmp": "Sensibilidade (esterase) versus especificidade (nitrito).", "arm": "Descartar ITU por nitrito negativo.", "regra": "Nitrito positivo confirma muito; negativo exclui pouco.", "cf": "Urocultura antes do antibiótico é sempre a regra.", "fonte": "F2, Seção 11, p. 26"}, {"n": 5, "sub": "Via e local do tratamento", "comp": "Decidir internação e via do antibiótico", "tags": [], "rel": [], "enun": "Lactente de 6 semanas com febre, irritabilidade e recusa alimentar; urina por cateterismo com piúria. Qual a conduta?", "ops": [["Internação com antibiótico parenteral e investigação de sepse.", "Correta: < 2–3 meses é indicação de parenteral/internação."], ["Antibiótico oral ambulatorial, que é tão eficaz quanto o endovenoso.", "Errada: a equivalência oral/EV vale para > 2–3 meses sem toxemia."], ["Observar 48 horas e iniciar antibiótico oral se a febre persistir.", "Errada: atrasar o tratamento em lactente jovem febril é inadequado."], ["Nitrofurantoína oral até o resultado da urocultura.", "Errada: nitrofurantoína não atinge nível no parênquima renal."]], "conc": "Oral é tão eficaz quanto EV em > 2–3 meses, sem toxemia, que aceitam VO. Parenteral/internação: < 2–3 meses, toxemia/sepse, vômitos persistentes, desidratação, falha oral, má adesão, uropatia complexa. Neonato: ampicilina + gentamicina ou cefotaxima.", "rac": "6 semanas < 2–3 meses → parenteral e internação.", "pista": "Idade.", "mud": "Lactente de 10 meses, bem, aceitando VO → oral ambulatorial.", "cmp": "ITU no < 3 meses: risco de bacteremia e sepse.", "arm": "Aplicar a regra 'oral = EV' a qualquer idade.", "regra": "Menor de 2–3 meses ou toxemiado: interna e faz EV.", "cf": "ITU febril: 7–14 dias (AAP); cistite: 3–5 dias.", "fonte": "F2, Seção 11, pp. 26–27"}, {"n": 6, "sub": "Escolha do antibiótico", "comp": "Reconhecer antibiótico inadequado na pielonefrite", "tags": [], "rel": [], "enun": "Menina de 3 anos com pielonefrite, em bom estado, aceitando via oral. Qual opção é INADEQUADA para o tratamento?", "ops": [["Nitrofurantoína.", "Correta (é a inadequada): não atinge nível no parênquima renal."], ["Cefuroxima.", "Errada (é adequada): consta entre os orais usuais."], ["Amoxicilina-clavulanato.", "Errada (é adequada): consta entre os orais usuais."], ["Cefixima.", "Errada (é adequada): consta entre os orais usuais."]], "conc": "Orais usuais: cefalexina (cistite), cefuroxima, amoxicilina-clavulanato, cefixima; SMX-TMP se a sensibilidade local permitir. Parenterais: ceftriaxona, cefotaxima, aminoglicosídeos. Nitrofurantoína não em pielonefrite. Ajustar pelo antibiograma e resistência local.", "rac": "Pielonefrite = infecção de parênquima → droga deve atingir o rim.", "pista": "'Pielonefrite'.", "mud": "Em cistite de adolescente, a nitrofurantoína poderia ser considerada.", "cmp": "Febre deve ceder em 48–72 h; se não, reavaliar (abscesso, uropatia, resistência).", "arm": "Achar que todo antibiótico 'urinário' serve para pielonefrite.", "regra": "Nitrofurantoína não trata rim.", "cf": "Sempre colher urocultura antes do antibiótico e ajustar ao antibiograma.", "fonte": "F2, Seção 11, p. 27"}, {"n": 7, "sub": "Investigação por imagem", "comp": "Indicar imagem após a 1ª ITU febril", "tags": [], "rel": [], "enun": "Lactente de 8 meses teve a primeira ITU febril, com boa resposta ao tratamento em 48 horas. Qual investigação por imagem está indicada?", "ops": [["Ultrassonografia de rins e vias urinárias; UCM não é rotina.", "Correta: USG após a 1ª ITU febril de 2–24 meses (AAP)."], ["Uretrocistografia miccional de rotina para pesquisar refluxo vesicoureteral.", "Errada: só se USG alterada, recorrência ou ITU atípica."], ["Cintilografia com DMSA na fase aguda para detectar cicatriz.", "Errada: o DMSA para cicatriz é feito 4–6 meses após, em ITU atípica ou recorrente."], ["Tomografia de abdome para afastar abscesso renal.", "Errada: houve boa resposta; não há indicação."]], "conc": "USG: após a 1ª ITU febril de 2–24 meses, ITU atípica ou recorrente, neonatos. UCM: se USG alterada, ITU febril recorrente ou atípica/complexa; gradua RVU e diagnostica válvula de uretra posterior. DMSA: 4–6 meses depois, em ITU atípica ou recorrente.", "rac": "1ª ITU febril típica, boa resposta → só USG.", "pista": "'Primeira' e 'boa resposta em 48 horas'.", "mud": "USG com hidronefrose → UCM indicada.", "cmp": "ITU atípica (NICE): grave/séptica, fluxo fraco, massa, creatinina elevada, sem resposta em 48 h, agente não E. coli.", "arm": "Pedir UCM para toda primeira ITU.", "regra": "1ª ITU febril: USG; UCM só se algo alterado.", "cf": "Agente não E. coli tornaria a ITU atípica, ampliando a investigação.", "fonte": "F2, Seção 11, p. 27"}, {"n": 8, "sub": "Prevenção de recorrência", "comp": "Planejar prevenção de ITU recorrente", "tags": [], "rel": ["A07"], "enun": "Menina de 6 anos com duas ITU no último ano tem constipação crônica e segura a urina por longos períodos na escola. Qual medida preventiva é a mais adequada?", "ops": [["Tratar a constipação e a disfunção miccional (micções programadas, hidratação).", "Correta: disfunção vesical e intestinal é fator de risco modificável."], ["Profilaxia antibiótica contínua de rotina para todas as crianças com ITU recorrente.", "Errada: profilaxia não é rotina; é indicada individualmente."], ["Tratar a bacteriúria assintomática encontrada nas uroculturas de controle.", "Errada: bacteriúria assintomática não deve ser tratada (salvo exceções)."], ["Restringir a ingestão de líquidos para reduzir a frequência das micções.", "Errada: o oposto; hidratação e micções programadas são recomendadas."]], "conc": "Prevenção: tratar constipação e disfunção miccional; higiene; evitar retenção; profilaxia não rotineira (RIVUR: reduziu recorrência em RVU I–IV, sem reduzir cicatrizes); procurar atendimento precoce em nova febre.", "rac": "Fatores de risco identificáveis (constipação, retenção) → tratar a causa.", "pista": "'Constipação' e 'segura a urina'.", "mud": "RVU de alto grau ou ITU febril recorrente pode justificar profilaxia individualizada.", "cmp": "Bacteriúria assintomática: urocultura positiva sem sintomas e sem piúria — não tratar, exceto gestantes e antes de procedimentos urológicos.", "arm": "Recorrer ao antibiótico antes de corrigir os hábitos.", "regra": "ITU de repetição: olhe intestino e bexiga.", "cf": "Ver A07: tratar a constipação funcional faz parte da prevenção de ITU.", "fonte": "F2, Seção 11, pp. 26–27"}]}, {"id": "A12", "titulo": "Exame clínico geniturinário", "arq": "F2", "pags": "28–29", "bloco": 4, "q": [{"n": 1, "sub": "Postura ética no exame genital", "comp": "Conduzir o exame genital com ética", "tags": ["osce"], "rel": ["A15"], "enun": "Menina de 8 anos precisa de exame da genitália em consulta de rotina, acompanhada da mãe. Qual conduta pontua na estação?", "ops": [["Explicar, pedir consentimento a ambas, manter a mãe presente e expor só a região.", "Correta: itens de atitude listados no material."], ["Pedir que a mãe saia para a criança não se sentir constrangida durante o exame.", "Errada: o responsável deve estar presente."], ["Realizar exame especular para avaliar o canal vaginal, aproveitando a consulta.", "Errada: especular não é feito em pré-púberes no ambulatório."], ["Adiar o exame genital para a adolescência, pois não há queixa.", "Errada: o exame faz parte da avaliação; feito com técnica e ética adequadas."]], "conc": "Atitudes: explicar o porquê em linguagem adequada à idade; responsável presente; escolares/adolescentes escolhem quem fica e se oferece acompanhante do mesmo sexo; luvas, mãos aquecidas, ambiente reservado; ensinar a regra do toque; avaliar PA, edema, rins, bexiga, coluna lombossacra, Tanner.", "rac": "A estação avalia técnica e postura ética ao mesmo tempo.", "pista": "Consentimento + responsável presente + pudor.", "mud": "Em adolescente, perguntar quem prefere na sala e oferecer chaperone do mesmo sexo.", "cmp": "Técnica feminina: posição de rã, tração labial delicada para baixo e para fora.", "arm": "Achar que retirar a mãe protege a criança.", "regra": "Explicar, consentir, acompanhar, expor só o necessário.", "cf": "Frase-modelo: 'ninguém pode tocar suas partes íntimas, só o médico na frente da mamãe ou quem cuida da sua higiene'.", "fonte": "F2, Seção 12, pp. 28–29"}, {"n": 2, "sub": "Hipospádia", "comp": "Reconhecer hipospádia e sua implicação", "tags": [], "rel": ["A03"], "enun": "RN com meato uretral na face ventral do pênis, prepúcio incompleto em 'capuz' dorsal e curvatura ventral. A família pede circuncisão. Qual a orientação?", "ops": [["Não circuncidar: o prepúcio será usado na correção da hipospádia.", "Correta: orientação explícita do material."], ["Realizar a circuncisão, que ajuda a corrigir a curvatura ventral do pênis.", "Errada: o prepúcio é necessário para a reconstrução."], ["Trata-se de epispádia, associada ao complexo extrofia.", "Errada: epispádia tem meato dorsal."], ["Trata-se de fimose fisiológica, que resolve até os 3–5 anos.", "Errada: o achado principal é a posição do meato."]], "conc": "Hipospádia: meato ventral (glandar a perineal), prepúcio em capuz, curvatura ventral (chordee); não circuncidar. Epispádia: meato dorsal (complexo extrofia).", "rac": "Meato ventral + capuz + chordee = hipospádia.", "pista": "'Face ventral'.", "mud": "Meato na face dorsal = epispádia.", "cmp": "Micropênis: comprimento esticado < −2,5 DP (RN termo < 2,5 cm); pênis embutido tem comprimento normal escondido pela gordura suprapúbica.", "arm": "Indicar circuncisão de rotina sem olhar o meato.", "regra": "Hipospádia: não circuncidar.", "cf": "Medir o pênis esticado comprimindo a gordura suprapúbica evita falso diagnóstico de micropênis.", "fonte": "F2, Seção 12, p. 28"}, {"n": 3, "sub": "Testículo fora da bolsa", "comp": "Diferenciar criptorquidia de testículo retrátil", "tags": ["osce"], "rel": [], "enun": "Menino de 10 meses: o testículo direito é palpável no canal inguinal e não alcança a bolsa, mesmo com a manobra de 'ordenha' e a criança em posição de alfaiate. Qual a conduta?", "ops": [["Criptorquidia: orquidopexia, idealmente entre 6 e 18 meses.", "Correta: não alcança a bolsa = criptorquidia."], ["Testículo retrátil: apenas acompanhar, pois é uma variação normal do exame.", "Errada: o retrátil desce e permanece na bolsa sem tensão."], ["Aguardar a puberdade, quando a descida espontânea é comum.", "Errada: a cirurgia é indicada entre 6 e 18 meses."], ["Testículo ectópico, pois está fora da bolsa escrotal.", "Errada: ectópico está fora do trajeto de descida; aqui está no canal inguinal."]], "conc": "Criptorquidia (não palpável ou não alcança a bolsa): orquidopexia entre 6 e 18 meses. Retrátil: desce e permanece na bolsa sem tensão (acompanhar). Ectópico: fora do trajeto. Manobras: uma mão 'ordenhando' o canal inguinal; cócoras ou alfaiate reduzem o reflexo cremastérico.", "rac": "Mesmo com as manobras, não chega à bolsa.", "pista": "'Não alcança a bolsa'.", "mud": "Se descesse e ficasse na bolsa sem tensão, seria retrátil.", "cmp": "Hipoplasia escrotal ipsilateral pode acompanhar a criptorquidia.", "arm": "Examinar com mãos frias e confundir retração cremastérica com criptorquidia.", "regra": "Não chega à bolsa: cirurgia entre 6 e 18 meses.", "cf": "F2, p. 36: orquidopexia 6–18 meses.", "fonte": "F2, Seção 12, p. 28"}, {"n": 4, "sub": "Massas escrotais", "comp": "Diferenciar hidrocele, hérnia e varicocele", "tags": ["osce"], "rel": [], "enun": "Lactente de 6 meses com aumento escrotal à direita, indolor, que transilumina, não é redutível, e acima do qual se palpa o cordão. Qual a hipótese?", "ops": [["Hidrocele.", "Correta: transilumina, não redutív
