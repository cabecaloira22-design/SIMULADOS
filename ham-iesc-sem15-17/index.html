 → MRKH; se P1/P2, considerar insensibilidade androgênica.", "s": "Amenorreia — Casos de prova", "r": [[0.2063, 0.8032, 0.8501, 0.8233]]}], "img": ["sv-amenorreia"], "t": "P17"}, {"id": "P17-07", "sub": "Supressão hipotalâmica funcional", "comp": "Amenorreia por déficit energético", "rac": "Raciocínio e conduta", "q": "Atleta de ginástica, 16 anos, M3 P4, sem menarca. Treina 5 h/dia, perdeu 6 kg em um ano, IMC 19,5. FSH e LH baixos, estradiol baixo, TSH e prolactina normais, β-hCG negativo. O técnico pede “um remédio para descer a menstruação”. Conduta?", "o": [["Restabelecer o aporte energético e reduzir o treino, com nutrição, saúde mental e saúde óssea", "Supressão hipotalâmica funcional: tratar a causa; pode ocorrer mesmo com IMC normal."], ["Prescrever anticoncepcional oral para induzir sangramento mensal e proteger os ossos", "O PDF diz para não iniciar anticoncepcional só para produzir sangramento."], ["Solicitar cariótipo, pois FSH baixo sugere disgenesia gonadal", "Disgenesia cursa com FSH alto."], ["Tranquilizar: com IMC normal não há déficit energético, então é atraso constitucional", "Baixa disponibilidade energética pode existir com IMC normal."]], "pista": "Treino intenso + perda de peso + gonadotrofinas e estradiol baixos = supressão hipotalâmica.", "pp": ["Excluir gestação (feito).", "Gonadotrofinas baixas → causa central/funcional.", "História: exercício e perda de peso.", "Mecanismo: menos pulsos de GnRH → estradiol baixo.", "Tratar causa e avaliar saúde óssea."], "ap": "<p>No PDF (p. 45), “déficit energético/exercício/estresse” aparece com o mecanismo (baixa disponibilidade energética → redução de pulsos de GnRH → estradiol baixo) e a ressalva de que “pode ocorrer mesmo com IMC normal”. Conduta: aporte energético, redução de treino, nutricionista, saúde mental e avaliação óssea. A estação prática reforça: “não iniciar anticoncepcional apenas para produzir sangramento antes de investigar” (p. 47).<\/p>", "mud": [["Anosmia", "Kallmann", "PDF p. 45"], ["Uso de antipsicótico e galactorreia", "Hiperprolactinemia: revisar fármaco e investigar", "PDF p. 45"]], "arm": "Achar que IMC normal exclui déficit energético.", "ouro": "Amenorreia de atleta: corrigir energia e treino, não “fazer sangrar”.", "m2": ["Que pergunta privada o PDF inclui na anamnese de amenorreia?", "Atividade sexual, possibilidade de gravidez, violência e segurança (PDF p. 47)."], "n": ["FSH/LH baixos + exercício = funcional.", "Pode haver IMC normal.", "Sem anticoncepcional para induzir sangramento."], "loc": [{"f": "ped", "p": 45, "q": "Baixa disponibilidade energéHca → redução de pulsos de GnRH → estradiol baixo. Pode ocorrer mesmo com IMC normal.", "s": "Amenorreia — Déficit energético / exercício", "r": [[0.3656, 0.3876, 0.5755, 0.4062], [0.3656, 0.4023, 0.6221, 0.4208], [0.3656, 0.4169, 0.606, 0.4355], [0.3656, 0.4316, 0.4213, 0.4501]]}, {"f": "ped", "p": 47, "q": "Não iniciar anHconcepcional apenas para produzir sangramento antes de invesHgar.", "s": "Amenorreia — Conduta após investigação", "r": [[0.5817, 0.687, 0.8738, 0.7071], [0.0768, 0.7056, 0.3776, 0.7257]]}], "img": ["sv-amenorreia"], "t": "P17"}, {"id": "P17-08", "sub": "Hiperprolactinemia e hipotireoidismo", "comp": "Causas endócrinas de amenorreia", "rac": "Interpretação de exames", "q": "Adolescente de 15 anos e 4 meses, M4, sem menarca, em uso de risperidona há 1 ano. Sem galactorreia. β-hCG negativo, FSH e LH baixos, prolactina elevada, TSH normal. Qual a interpretação?", "o": [["Hiperprolactinemia (provável fármaco) inibindo o GnRH: revisar a medicação", "Prolactina elevada inibe GnRH; antipsicóticos estão listados; galactorreia pode faltar."], ["Exclui-se hiperprolactinemia, pois não há galactorreia", "O PDF ressalva que a galactorreia pode estar ausente."], ["Insuficiência ovariana primária, pela ausência de menarca com mamas", "FSH baixo não é padrão de falência ovariana."], ["Insensibilidade androgênica, pois a prolactina eleva os andrógenos", "Não há relação; útero e pelos não foram descritos como ausentes."]], "pista": "Prolactina alta + gonadotrofinas baixas + antipsicótico.", "pp": ["Toda amenorreia: β-hCG, FSH, LH, estradiol, TSH, prolactina, US.", "Prolactina alta inibe GnRH → FSH/LH baixos.", "Risperidona eleva prolactina.", "Revisar fármaco, investigar hipófise se indicado."], "ap": "<p>O PDF agrupa “hiperprolactinemia / hipotireoidismo”: a prolactina elevada inibe GnRH, e o hipotireoidismo pode elevar TRH e prolactina; galactorreia pode estar ausente. Conduta: TSH/T4L, prolactina, revisar fármacos, tratar etiologia e investigar hipófise se indicado (p. 45). A anamnese dirigida da estação inclui “medicamentos (antipsicóticos)” e “secreção mamária” (p. 47).<\/p>", "mud": [["TSH muito elevado com prolactina alta", "Hipotireoidismo como causa", "TRH eleva prolactina"], ["Cefaleia e alteração visual", "Lesão hipotálamo-hipofisária: RM de sela", "PDF p. 45"]], "arm": "Excluir prolactina pela ausência de galactorreia.", "ouro": "Prolactina e TSH entram em toda amenorreia; galactorreia pode faltar.", "m2": ["Quais medicações a anamnese do PDF cita?", "Antipsicóticos (PDF p. 47)."], "n": ["Prolactina inibe GnRH.", "Galactorreia pode faltar.", "Revisar fármacos."], "loc": [{"f": "ped", "p": 45, "q": "ProlacHna elevada inibe GnRH; hipoHreoidismo pode elevar TRH e prolacHna. Galactorreia pode estar ausente.", "s": "Amenorreia — Hiperprolactinemia / hipotireoidismo", "r": [[0.3656, 0.6008, 0.5665, 0.6193], [0.3656, 0.6154, 0.5905, 0.634], [0.3656, 0.6301, 0.5919, 0.6486], [0.3656, 0.6447, 0.4266, 0.6633]]}], "img": ["sv-amenorreia"], "t": "P17"}, {"id": "P17-09", "sub": "Sinais de pega adequada", "comp": "Avaliação da mamada", "rac": "Observação clínica", "q": "Na observação de uma mamada de RN de 4 dias, qual conjunto indica pega adequada?", "o": [["Boca bem aberta, lábio inferior evertido, queixo na mama e mais aréola acima da boca", "Exatamente os critérios de pega adequada do PDF."], ["Bochechas encovadas durante a sucção, estalos audíveis e sucção apenas do mamilo", "São sinais de pega inadequada."], ["Lábios voltados para dentro, mais aréola visível abaixo do lábio inferior e sucções rápidas", "Lábios para dentro e sucções superficiais indicam pega ruim."], ["Mãe sentindo dor intensa e persistente, que é esperada na primeira semana", "Dor persistente não é esperada e sugere pega inadequada."]], "pista": "Lábio inferior evertido e mais aréola visível ACIMA da boca.", "pp": ["Boca bem aberta.", "Lábio inferior virado para fora.", "Queixo toca a mama.", "Mais aréola visível acima.", "Sucções profundas e pausadas, deglutição audível, sem dor persistente."], "ap": "<p>O PDF compara pega adequada × inadequada (p. 48): na inadequada, boca pouco aberta, lábios para dentro, sucção só do mamilo, bochechas encovadas, estalos, dor, fissuras, mamada ineficiente e bebê insatisfeito. A observação da mamada inteira é obrigatória — “não basta perguntar se o bebê mama”.<\/p>", "mud": [["Estalos e bochechas encovadas", "Corrigir a pega", "Sinais de pega ruim"]], "arm": "Achar que dor no mamilo é normal nas primeiras semanas.", "ouro": "Pega boa: boca aberta, lábio evertido, queixo na mama, aréola acima.", "m2": ["Como tirar o bebê da mama sem machucar?", "Interromper o vácuo com dedo limpo no canto da boca (PDF p. 48)."], "n": ["Lábio inferior evertido.", "Mais aréola acima.", "Sem dor persistente."], "loc": [{"f": "ped", "p": 48, "q": "Boca bem aberta, lábio inferior virado para fora, queixo toca a mama, mais aréola visível acima da boca", "s": "Amamentação — Pega adequada × inadequada", "r": [[0.0856, 0.4887, 0.4839, 0.5072], [0.0856, 0.5033, 0.3477, 0.5218]]}], "img": ["sv-pega"], "t": "P17"}, {"id": "P17-10", "sub": "Posição após cesárea e gemelar", "comp": "Posicionamento", "rac": "Escolha de técnica", "q": "Puérpera de cesárea há 24 h, com gêmeos, refere dor na incisão quando apoia os bebês no colo. Qual posição o material indica como útil nesse cenário?", "o": [["Invertida (futebol americano), bebê ao lado do tronco", "Bebê ao lado do tronco, pernas para trás — útil após cesárea e em gêmeos."], ["Tradicional (berço), apoiando os bebês sobre o abdome", "Apoiar sobre a incisão aumenta a dor; não é a indicação do PDF."], ["Deitada de lado, com os bebês dormindo na cama da mãe", "O PDF orienta que, após a mamada deitada, o bebê retorne ao próprio local de sono seguro."], ["Semirreclinada, com o bebê de bruços sobre a incisão", "A posição é válida em outros contextos, mas apoia o bebê sobre o abdome operado."]], "pista": "Cesárea ou gêmeos → invertida/futebol americano.", "pp": ["Problema: incisão abdominal dolorosa e dois bebês.", "Posição invertida: bebê ao lado do tronco, mão sustenta ombros/nuca.", "Evita peso sobre o abdome.", "Permite amamentar gêmeos simultaneamente."], "ap": "<p>A tabela de posições do PDF (p. 48) associa cada posição a uma utilidade: berço cruzado ajuda a ajustar a pega em RN pequeno; invertida é útil após cesárea ou em gêmeos; deitada de lado exige mãe acordada e atenta, com retorno do bebê ao próprio local de sono; semirreclinada favorece contato pele a pele com via aérea livre.<\/p>", "mud": [["RN prematuro pequeno com dificuldade de pega", "Berço cruzado", "PDF p. 48"]], "arm": "Escolher a posição tradicional por hábito.", "ouro": "Cesárea ou gêmeos: posição invertida.", "m2": ["O que fazer ao amamentar deitada?", "Mãe acordada e atenta; após a mamada, bebê retorna ao próprio local de sono seguro (PDF p. 48)."], "n": ["Invertida: cesárea e gêmeos.", "Berço cruzado: RN pequeno.", "Deitada: mãe atenta."], "loc": [{"f": "ped", "p": 48, "q": "Bebê ao lado do tronco materno, pernas para trás, mão sustentando ombros/nuca; úHl após cesárea ou em gêmeos.", "s": "Amamentação — Posições e execução", "r": [[0.5056, 0.2586, 0.8623, 0.2771], [0.5056, 0.2732, 0.8922, 0.2918]]}], "img": ["sv-pega"], "t": "P17"}, {"id": "P17-11", "sub": "Ingurgitamento mamário", "comp": "Dificuldades na amamentação", "rac": "Conduta", "q": "Puérpera no 4º dia, mamas tensas, edemaciadas e dolorosas bilateralmente, sem febre; o RN não consegue abocanhar a aréola endurecida. Qual orientação está de acordo com o material?", "o": [["Ordenha manual suave para amolecer a aréola antes da mamada, mantendo mamadas frequentes", "Ingurgitamento: ordenha manual suave antes da mamada; evitar massagem profunda e retirada excessiva."], ["Massagem profunda e vigorosa e esvaziamento completo com bomba após cada mamada", "O PDF orienta evitar massagem profunda e retirada excessiva."], ["Suspender a amamentação por 48 h até as mamas amolecerem, oferecendo fórmula", "Suspender piora o ingurgitamento; a conduta é remoção frequente e eficaz."], ["Antibiótico empírico pela possibilidade de mastite bilateral", "Sem febre e com quadro bilateral típico, é ingurgitamento, não mastite."]], "pista": "Bilateral, tenso, sem febre = ingurgitamento: amolecer a aréola com ordenha suave.", "pp": ["Reconhecer: mamas tensas, edema, dificuldade de abocanhar.", "Ordenha manual suave para amolecer a aréola.", "Mamadas frequentes (livre demanda).", "Evitar massagem profunda e retirada excessiva."], "ap": "<p>A fisiologia do PDF (p. 49) explica: remoção frequente e eficaz mantém a produção; pega inadequada e mamadas pouco eficazes reduzem a transferência e causam ingurgitamento. A ordenha manual é feita com polegar e indicador em C atrás da aréola, pressionando em direção ao tórax e comprimindo/soltando ritmicamente, sem puxar o mamilo.<\/p>", "mud": [["Dor focal, calor, eritema e febre", "Mastite: manter amamentação, analgesia, antibiótico se bacteriana", "PDF p. 49"], ["Massa flutuante", "Abscesso", "PDF p. 49"]], "arm": "Esvaziar demais: estimula produção e piora o quadro.", "ouro": "Ingurgitamento: ordenha suave para amolecer, mamadas frequentes, sem massagem profunda.", "m2": ["Como fazer a ordenha manual?", "Polegar e indicador em C atrás da aréola, pressionar gentilmente em direção ao tórax, comprimir/soltar alternando segmentos, sem puxar o mamilo (PDF p. 49)."], "n": ["Ordenha suave pré-mamada.", "Livre demanda.", "Sem massagem profunda."], "loc": [{"f": "ped", "p": 49, "q": "Mama tensa, edema e dihculdade para abocanhar. Ordenha manual suave para amolecer aréola antes da mamada; evitar massagem profunda e reHrada excessiva.", "s": "Amamentação — Ingurgitamento", "r": [[0.5056, 0.299, 0.8909, 0.3175], [0.5056, 0.3137, 0.8967, 0.3322], [0.5056, 0.3283, 0.7721, 0.3468]]}], "img": ["sv-lactacao", "sv-mama-puerperio"], "t": "P17"}, {"id": "P17-12", "sub": "Fissura mamilar", "comp": "Dificuldades na amamentação", "rac": "Investigação da causa", "q": "Mãe no 6º dia pós-parto com fissura em ambos os mamilos e dor a cada mamada. Já usa pomada de lanolina e protetor de silicone. Qual a abordagem prioritária segundo o material?", "o": [["Observar a mamada e corrigir pega e posição, avaliando frênulo e formato do mamilo", "Fissura: verificar pega, posição, frênulo e formato do mamilo; corrigir técnica; evitar irritantes."], ["Suspender a mama afetada por 1 semana e oferecer fórmula até cicatrizar", "Não resolve a causa e reduz a produção."], ["Associar pomada antibiótica e anestésica antes de cada mamada", "O PDF orienta evitar substâncias irritantes e corrigir a técnica."], ["Indicar frenotomia imediata, já que a fissura bilateral confirma anquiloglossia", "A aparência isolada do frênulo não determina frenotomia; avalia-se a função."]], "pista": "Fissura = problema de pega até prova em contrário.", "pp": ["Observar a mamada inteira.", "Checar pega e posição.", "Avaliar frênulo e formato do mamilo após a mamada.", "Corrigir técnica; evitar irritantes.", "Dor persistente apesar disso → investigar."], "ap": "<p>O PDF trata fissura junto com dor (p. 49): “verificar pega, posição, frênulo e formato do mamilo após mamada; corrigir técnica; evitar substâncias irritantes; dor persistente exige investigação”. Na página de técnica (p. 48): “fissuras: corrigir pega”.<\/p>", "mud": [["Fissura persistente com pega corrigida e língua com mobilidade restrita", "Avaliar anquiloglossia pela função na mamada", "PDF p. 49"]], "arm": "Tratar fissura só com pomadas sem olhar a mamada.", "ouro": "Fissura: olhe a pega antes de prescrever.", "m2": ["O que o mamilo após a mamada revela?", "Formato achatado/em bico de batom sugere compressão por pega inadequada — o PDF manda checar o formato após a mamada (p. 49)."], "n": ["Observar a mamada.", "Corrigir pega e posição.", "Evitar irritantes."], "loc": [{"f": "ped", "p": 49, "q": "Verihcar pega, posição, frênulo e formato do mamilo após mamada. Corrigir técnica; evitar substâncias irritantes. Dor persistente exige invesHgação.", "s": "Amamentação — Dor/fissura", "r": [[0.5056, 0.2494, 0.8786, 0.2679], [0.5056, 0.264, 0.8826, 0.2826], [0.5056, 0.2787, 0.7051, 0.2972]]}], "img": ["sv-pega"], "t": "P17"}, {"id": "P17-13", "sub": "Baixa transferência e perda ponderal", "comp": "Avaliação da ingestão", "rac": "Priorização clínica", "q": "RN de 5 dias, termo, aleitamento exclusivo. Perdeu 11% do peso de nascimento, tem 3 fraldas molhadas/dia, está sonolento e faz mamadas curtas com pouca deglutição audível. Qual a conduta mais adequada?", "o": [["Avaliar bebê e mãe e a mamada, corrigir a técnica e definir suplementação se indicada", "Baixa transferência: avaliar ambos, corrigir técnica e definir suplementação quando indicada; perda ≥ 10% exige avaliação cuidadosa."], ["Substituir imediatamente por fórmula, pois a perda acima de 10% indica leite insuficiente", "O PDF: perda ≥ 10% exige avaliação cuidadosa, não implica fórmula automática."], ["Tranquilizar e reavaliar em 15 dias, pois perda de peso na primeira semana é fisiológica", "Perda ≥ 10%, poucas fraldas e sonolência exigem avaliação rápida."], ["Oferecer água e chá entre as mamadas para hidratar o RN", "No aleitamento exclusivo não se oferece água/chá."]], "pista": "≥ 10% + poucas fraldas + sonolência = avaliar rápido, sem fórmula automática.", "pp": ["Sinais de ingestão suficiente: deglutição, ≥ 6 fraldas/dia após o 5º dia, ganho ponderal.", "Aqui: 3 fraldas, sonolência, perda 11%.", "Baixa transferência.", "Avaliar bebê e mãe; corrigir técnica; suplementar se indicado."], "ap": "<p>O PDF (p. 49) lista “baixa transferência: pouca deglutição, perda ponderal excessiva, pouca urina e sonolência. Avaliar bebê e mãe, corrigir técnica e definir suplementação quando indicada”. O fechamento da estação de pega (p. 48) reforça: poucas fraldas molhadas, letargia ou baixo ganho de peso exigem avaliação rápida.<\/p>", "mud": [["Perda de 6%, 7 fraldas/dia e deglutição audível", "Ingestão suficiente; manter", "PDF p. 49"]], "arm": "Responder à perda ponderal com fórmula automática ou com chá.", "ouro": "Perda ≥ 10%: avaliar mamada, mãe e bebê; suplementar só se indicado.", "m2": ["Quantas fraldas molhadas indicam ingestão adequada?", "Em geral ≥ 6 por dia após o quinto dia (PDF p. 49)."], "n": ["≥ 6 fraldas após o 5º dia.", "≥ 10% = avaliação cuidadosa.", "Sem fórmula automática."], "loc": [{"f": "ped", "p": 49, "q": "diurese adequada (em geral ≥6 fraldas molhadas por dia após o quinto dia) e evolução ponderal saHsfatória. Perda ≥10% do peso ao nascer exige avaliação cuidadosa, não implica fórmula automáHca.", "s": "Amamentação — Sinais de ingestão suficiente", "r": [[0.5421, 0.6345, 0.9154, 0.6546], [0.0768, 0.653, 0.8995, 0.6731], [0.0768, 0.6716, 0.2795, 0.6917]]}, {"f": "ped", "p": 49, "q": "Pouca degluHção, perda ponderal excessiva, pouca urina e sonolência. Avaliar bebê e mãe, corrigir técnica e dehnir suplementação quando indicada.", "s": "Amamentação — Baixa transferência", "r": [[0.5056, 0.4129, 0.8798, 0.4314], [0.5056, 0.4275, 0.8654, 0.4461], [0.5056, 0.4422, 0.721, 0.4607]]}], "img": ["sv-lactacao"], "t": "P17"}, {"id": "P17-14", "sub": "Aleitamento exclusivo e passos da pega", "comp": "Orientação à família", "rac": "Orientação", "q": "Avó de um lactente de 2 meses em aleitamento exclusivo quer dar chá de camomila “para a cólica” e água “porque está calor”. A mãe também pergunta como aproximar o bebê para mamar. Qual orientação está correta?", "o": [["Não oferecer água nem chá; nariz na altura do mamilo, esperar boca aberta e aproximar com o queixo primeiro", "Aleitamento exclusivo sem água/chá; passos da pega do PDF."], ["Água é permitida no calor, desde que fervida; aproximar a cabeça do bebê empurrando-a contra a mama", "Água/chá não entram no exclusivo; não se empurra a cabeça."], ["Chá pode ser dado em pequenas quantidades; a boca do bebê deve ser posicionada na altura da aréola inferior", "Não há exceção para chá; o nariz fica na altura do mamilo."], ["Introduzir outros líquidos a partir de 4 meses; aproximar o bebê pelo nariz para facilitar a respiração", "Complementação a partir de 6 meses; queixo primeiro."]], "pista": "Exclusivo até 6 meses = nada de água ou chá.", "pp": ["Exclusivo até 6 meses, livre demanda.", "Sem água/chá.", "Complementar a partir de 6 meses, manter até 2 anos ou mais.", "Pega: nariz na altura do mamilo → tocar lábio superior → boca bem aberta → queixo primeiro."], "ap": "<p>A sequência da pega do PDF (p. 48): 1) mãe confortável, bebê próximo, orelha–ombro–quadril alinhados, barriga voltada para a mãe; 2) mama em C se necessário, dedos longe da aréola; 3) nariz na altura do mamilo, tocar o lábio superior e esperar boca bem aberta; 4) aproximar o bebê à mama, queixo primeiro, sem empurrar a cabeça; 5) verificar deglutição e conforto.<\/p>", "mud": [["Lactente de 6 meses", "Iniciar alimentação complementar mantendo o leite materno", "PDF p. 48"]], "arm": "Empurrar a cabeça do bebê contra a mama.", "ouro": "Exclusivo é exclusivo; queixo primeiro, sem empurrar a cabeça.", "m2": ["Até quando manter o aleitamento?", "Até 2 anos ou mais, com complementação a partir de 6 meses (PDF p. 48)."], "n": ["Sem água/chá até 6 meses.", "Nariz no mamilo, queixo primeiro.", "Manter até 2 anos ou mais."], "loc": [{"f": "ped", "p": 48, "q": "Aleitamento exclusivo até 6 meses, em livre demanda; complementar a parHr de 6 meses e manter até 2 anos ou mais. Não oferecer água/chá no aleitamento exclusivo.", "s": "Amamentação — Orientações e problemas", "r": [[0.0768, 0.598, 0.9117, 0.6181], [0.0768, 0.6166, 0.4253, 0.6366]]}, {"f": "ped", "p": 48, "q": "Nariz do bebê na altura do mamilo. Tocar lábio superior e esperar boca bem aberta. 4. Aproximar o bebê à mama, queixo primeiro, sem empurrar a cabeça.", "s": "Amamentação — Pega correta passo a passo", "r": [[0.3566, 0.4215, 0.8934, 0.4416], [0.0768, 0.44, 0.6342, 0.4601]]}], "img": ["sv-pega"], "t": "P17"}, {"id": "P17-15", "sub": "Anquiloglossia e fisiologia", "comp": "Avaliação de dificuldades", "rac": "Decisão baseada em função", "q": "RN de 10 dias com frênulo lingual curto à inspeção. A mãe não tem dor, o bebê tem deglutição audível, 7 fraldas molhadas/dia e já recuperou o peso de nascimento. Um profissional recomendou frenotomia “porque o frênulo é curto”. Qual a posição do material?", "o": [["Avaliar mobilidade e função na mamada; a aparência isolada não indica frenotomia", "Anquiloglossia: avaliar função; aparência isolada do frênulo não determina frenotomia."], ["Frenotomia imediata, pois todo frênulo curto prejudica a produção de leite a longo prazo", "O critério é funcional; aqui a transferência está adequada."], ["Suspender o aleitamento até o procedimento, para evitar fissuras futuras", "Não há indicação de suspender; a amamentação está eficaz."], ["Iniciar fórmula complementar preventiva enquanto se aguarda avaliação", "Não há sinal de baixa transferência."]], "pista": "Função normal na mamada + sinais de boa ingestão = sem indicação pela aparência.", "pp": ["Sinais de transferência efetiva: deglutição audível, ≥ 6 fraldas, ganho ponderal.", "Mãe sem dor.", "Critério do PDF: função, não aparência.", "Seguimento."], "ap": "<p>O PDF começa a página de dificuldades pela fisiologia: sucção → prolactina (produção) e ocitocina (ejeção); remoção frequente e eficaz mantém a produção (p. 49). Se a remoção é eficaz — como neste caso —, um achado anatômico isolado não justifica intervenção.<\/p>", "mud": [["Dor persistente, fissuras e baixo ganho com língua de mobilidade restrita", "Avaliação funcional especializada para frenotomia", "Disfunção demonstrada"]], "arm": "Indicar frenotomia pela aparência.", "ouro": "Frênulo: decide-se pela função na mamada, não pelo aspecto.", "m2": ["Qual hormônio é responsável pela ejeção do leite?", "Ocitocina; a prolactina responde pela produção (PDF p. 49)."], "n": ["Avaliar função.", "Prolactina produz, ocitocina ejeta.", "Remoção eficaz mantém produção."], "loc": [{"f": "ped", "p": 49, "q": "Avaliar mobilidade lingual e função na mamada; aparência isolada do frênulo não determina frenotomia.", "s": "Amamentação — Anquiloglossia", "r": [[0.5056, 0.4625, 0.8803, 0.4811], [0.5056, 0.4772, 0.8006, 0.4957]]}, {"f": "ped", "p": 49, "q": "Sucção → esŠmulo nervoso → prolacHna (produção do leite) e ocitocina (ejeção).", "s": "Amamentação — Fisiologia", "r": [[0.0768, 0.1637, 0.6504, 0.1837]]}], "img": ["sv-lactacao"], "t": "P17"}, {"id": "A15-01", "sub": "Sinais de presunção, probabilidade e certeza", "comp": "Diagnóstico clínico da gravidez", "rac": "Classificação de sinais", "q": "Mulher de 27 anos, atraso menstrual de 9 semanas. Relata náuseas e polaciúria. Ao exame, colo amolecido, istmo amolecido ao toque bimanual e mucosa vaginal violácea. Na consulta seguinte, com 21 semanas, o médico palpa movimentos fetais. Qual achado deste caso é sinal de CERTEZA de gravidez?", "o": [["Movimentos fetais percebidos pelo examinador", "Sinais de certeza: visualização embrionária/fetal na US, atividade cardíaca fetal e movimentos percebidos pelo examinador."], ["Amolecimento do istmo uterino ao toque (sinal de Hegar)", "Hegar é sinal de probabilidade."], ["Coloração violácea da mucosa vaginal (Chadwick/Jacquemier)", "É sinal de probabilidade."], ["Amenorreia com náuseas e polaciúria há 9 semanas", "São sinais de presunção: sugerem, não confirmam."]], "pista": "Certeza exige ver o embrião/feto, ver/ouvir atividade cardíaca ou o examinador sentir o feto.", "pp": ["Presunção: amenorreia, náuseas, mastalgia, polaciúria, fadiga.", "Probabilidade: útero aumentado, Goodell, Hegar, Chadwick/Jacquemier, hCG +.", "Certeza: embrião/feto na US, atividade cardíaca, movimentos pelo examinador.", "No caso, só os movimentos palpados pelo médico são de certeza."], "ap": "<p>A classificação do PDF (p. 7) diferencia o que a mulher relata (presunção), o que o examinador observa mas outras condições podem imitar (probabilidade — inclusive o hCG positivo, que pode ocorrer sem gravidez viável/tópica) e o que só um feto produz (certeza). Movimentos referidos pela própria gestante não entram na certeza: precisam ser percebidos pelo examinador.<\/p>", "mud": [["Os movimentos fossem apenas referidos pela gestante", "Não seriam sinal de certeza", "Critério: percebidos pelo examinador"], ["US com embrião e atividade cardíaca", "Certeza", "PDF p. 7"]], "arm": "Considerar o hCG positivo como certeza: ele não confirma localização nem viabilidade.", "ouro": "Certeza = ver o feto, ver/ouvir o coração ou o examinador sentir o feto.", "m2": ["Goodell é amolecimento de quê?", "Do colo uterino; Hegar é do istmo (PDF p. 7)."], "n": ["Presunção sugere.", "Probabilidade inclui hCG +.", "Certeza: US, atividade cardíaca, movimentos pelo examinador."], "loc": [{"f": "adu", "p": 7, "q": "Sinais de certeza são visualização embrionária/fetal por US, atividade cardíaca fetal identificada e movimentos fetais percebidos pelo examinador.", "s": "Cap. 14.1 — Reconhecer e confirmar a gravidez", "r": [[0.1851, 0.2473, 0.9136, 0.265], [0.0689, 0.2652, 0.6121, 0.2828]]}, {"f": "adu", "p": 7, "q": "Sinais de probabilidade incluem aumento uterino, amolecimento cervical (Goodell), amolecimento do istmo (Hegar), coloração violácea vaginal (Chadwick/Jacquemier) e teste de hCG positivo.", "s": "Cap. 14.1 — Reconhecer e confirmar a gravidez", "r": [[0.1723, 0.1939, 0.8967, 0.2116], [0.0689, 0.2117, 0.9234, 0.2294], [0.0689, 0.2295, 0.1482, 0.2472]]}], "img": ["sv-sinais-gravidez"], "t": "A15"}, {"id": "A15-02", "sub": "Caderneta da gestante", "comp": "Registro e continuidade", "rac": "Organização do cuidado", "q": "Gestante de 11 semanas em primeira consulta pré-natal na UBS. Qual conjunto descreve corretamente o preenchimento e a função da Caderneta da Gestante segundo o material?", "o": [["Registrar DUM, IG, DPP e método de datação; plotar AU e peso; levar a caderneta a todas as consultas e à maternidade", "O PDF lista esses itens e manda explicar que a caderneta acompanha a gestante em todas as consultas e na maternidade."], ["Ficar arquivada na UBS para proteger dados sensíveis, sendo levada à maternidade só no dia do parto", "A caderneta fica com a gestante e acompanha todas as consultas."], ["Registrar apenas exames alterados, para não sobrecarregar o documento com resultados normais", "Registram-se exames com datas e resultados."], ["Ser preenchida a partir de 20 semanas, quando AU e BCF passam a ser mensuráveis", "O registro começa na primeira consulta (DUM, IG, DPP, risco, exames, vacinas)."]], "pista": "A caderneta acompanha a gestante em TODAS as consultas e na maternidade.", "pp": ["Primeira consulta: DUM, IG, DPP, método de datação, antecedentes, risco, peso/IMC, grupo/Rh, exames.", "Cada consulta: peso, PA, AU, BCF, movimentos, apresentação, edema, queixas, condutas.", "Plotar AU e peso nos gráficos.", "Registrar vacinas, ferro/cálcio, referência e retorno."], "ap": "<p>O cap. 15.2 (PDF p. 13) descreve a caderneta “como preencher na estação”. Ela é o instrumento de comunicação entre a APS, o ambulatório de alto risco e a maternidade; uma gestante que chega ao parto sem caderneta perde informações de grupo sanguíneo, sorologias e evolução da AU e PA.<\/p>", "mud": [["Gestante encaminhada ao alto risco", "A caderneta segue com ela e registra a contrarreferência", "Continuidade do cuidado"]], "arm": "Achar que AU e BCF são os primeiros dados da caderneta.", "ouro": "Caderneta: preenchida desde a 1ª consulta e sempre com a gestante.", "m2": ["O que registrar sobre a datação?", "DUM, IG em semanas e dias, DPP e o MÉTODO de datação (DUM ou US) (PDF p. 13)."], "n": ["DUM, IG, DPP, método.", "Plotar AU e peso.", "Acompanha a gestante sempre."], "loc": [{"f": "adu", "p": 13, "q": "Registre DUM, IG em semanas/dias, DPP e método de datação.", "s": "Cap. 15.2 — Caderneta da gestante", "r": [[0.0689, 0.0929, 0.6168, 0.1106]]}, {"f": "adu", "p": 13, "q": "Explique que a caderneta deve acompanhá-la em todas as consultas e na maternidade.", "s": "Cap. 15.2 — Caderneta da gestante", "r": [[0.6218, 0.1642, 0.8959, 0.1819], [0.0689, 0.182, 0.5588, 0.1997]]}], "img": ["adu-exames-ig"], "t": "A15"}, {"id": "A15-03", "sub": "β-hCG indeterminado", "comp": "Confirmação laboratorial", "rac": "Interpretação de exame", "q": "Mulher de 30 anos com atraso de 5 dias. Teste urinário negativo, mas ela mantém mastalgia e náuseas. O β-hCG sérico vem 18 mUI/mL. Ela está assintomática, sem dor nem sangramento. Qual interpretação e conduta?", "o": [["Resultado indeterminado: repetir o β-hCG sérico em alguns dias", "5–25 mUI/mL é faixa indeterminada; suspeita persistente → repetir."], ["Positivo: gravidez confirmada e tópica, iniciar pré-natal", "≥ 25 é positivo; e hCG positivo não confirma localização."], ["Negativo: excluída gravidez, investigar outras causas de atraso", "< 5 é usualmente negativo; 18 não é."], ["Ectópica provável: US transvaginal de urgência e encaminhar", "Sem dor, síncope ou sangramento não há indicação de urgência; primeiro repetir."]], "pista": "β-hCG entre 5 e 25 = indeterminado.", "pp": ["Faixas: < 5 negativo; 5–25 indeterminado; ≥ 25 positivo.", "Teste urinário negativo + suspeita persistente → repetir ou β-hCG sérico.", "18 = indeterminado → repetir em alguns dias.", "Sinais de alarme mudariam a conduta."], "ap": "<p>O PDF (p. 7) orienta: teste urinário após o atraso; se negativo e suspeita persistente, repetir em alguns dias ou solicitar β-hCG sérico; valores “conforme laboratório”. O hCG é produzido pelo sinciciotrofoblasto após a implantação, por isso pode estar baixo nos primeiros dias.<\/p>", "mud": [["β-hCG 340 com dor unilateral intensa e síncope", "Excluir ectópica com urgência", "PDF p. 7"], ["β-hCG 3", "Usualmente negativo", "< 5"]], "arm": "Tratar 18 mUI/mL como positivo ou negativo.", "ouro": "β-hCG 5–25: repetir.", "m2": ["O hCG positivo confirma gravidez tópica e viável?", "Não; não confirma localização nem viabilidade (PDF p. 7)."], "n": ["< 5 negativo.", "5–25 indeterminado.", "≥ 25 positivo."], "loc": [{"f": "adu", "p": 7, "q": "Valores séricos <5 mUI/mL usualmente negativos, 5–25 indeterminados e ≥25 positivos, conforme laboratório.", "s": "Cap. 14.1 — item 1", "r": [[0.385, 0.3436, 0.8718, 0.3612], [0.0689, 0.3614, 0.5462, 0.379]]}, {"f": "adu", "p": 7, "q": "se negativo e suspeita persistente, repita em alguns dias ou solicite β-hCG sérico.", "s": "Cap. 14.1 — item 1", "r": [[0.5216, 0.3257, 0.9176, 0.3434], [0.0689, 0.3436, 0.3862, 0.3612]]}], "img": ["sv-hcg-us"], "t": "A15"}, {"id": "A15-04", "sub": "US precoce inconclusiva", "comp": "Ultrassonografia no 1º trimestre", "rac": "Interpretação e conduta", "q": "Gestante, DUM certa há 5 semanas e 4 dias, β-hCG positivo. US transvaginal: saco gestacional intrauterino, sem vesícula vitelínica e sem embrião. Sem dor nem sangramento. Ela pergunta se “perdeu o bebê”. Resposta correta?", "o": [["Achado esperado para a IG: repetir a US, sem declarar perda", "SG ~5 sem; vesícula 5–6; embrião/atividade 6–7. Não determinar perda por US precoce inconclusiva."], ["Gestação anembrionada: programar esvaziamento uterino", "É cedo para esse diagnóstico; a vesícula e o embrião aparecem depois."], ["Ectópica até prova em contrário, pois não há embrião", "Há saco intrauterino e a paciente está assintomática."], ["Gestação inviável pela ausência de atividade cardíaca", "A atividade cardíaca é esperada perto de 6–7 semanas."]], "pista": "5 semanas: só saco gestacional é esperado.", "pp": ["Marcos: SG ~5; vesícula ~5–6; embrião/BCF ~6–7.", "IG 5s4d.", "Achado compatível.", "Não determinar perda por uma US precoce; repetir conforme achados."], "ap": "<p>O item 2 do cap. 14.1 (PDF p. 7) é explícito: “Não determine perda por uma US precoce inconclusiva; repita conforme achados. Dor intensa unilateral, síncope e sangramento exigem excluir ectópica urgentemente.” Comunicar a incerteza com honestidade evita intervenções precipitadas.<\/p>", "mud": [["Dor unilateral intensa e síncope", "Excluir ectópica com urgência", "PDF p. 7"], ["IG de 8 semanas por DUM certa sem embrião", "Reavaliar datação e repetir; suspeita aumenta", "Marcos já ultrapassados"]], "arm": "Declarar perda numa US de 5 semanas.", "ouro": "US precoce inconclusiva: repetir, não sentenciar.", "m2": ["Quando a US transvaginal é indicada na suspeita de gravidez?", "Dúvida de idade, dor/sangramento ou localização (PDF p. 7)."], "n": ["SG 5; vesícula 5–6; embrião 6–7.", "Repetir US inconclusiva.", "Dor + síncope + sangramento = ectópica?"], "loc": [{"f": "adu", "p": 7, "q": "Saco gestacional costuma aparecer por volta de 5 semanas, vesícula vitelínica em torno de 5–6 e embrião/atividade cardíaca perto de 6–7.", "s": "Cap. 14.1 — item 2", "r": [[0.7285, 0.3863, 0.8803, 0.404], [0.0689, 0.4041, 0.9263, 0.4218], [0.0689, 0.4219, 0.2679, 0.4396]]}, {"f": "adu", "p": 7, "q": "Não determine perda por uma US precoce inconclusiva; repita conforme achados.", "s": "Cap. 14.1 — item 2", "r": [[0.2666, 0.4219, 0.8963, 0.4396], [0.0689, 0.4398, 0.1526, 0.4574]]}], "img": ["sv-hcg-us"], "t": "A15"}, {"id": "A15-05", "sub": "Cálculo da IG pela DUM", "comp": "Datação da gestação", "rac": "Cálculo", "q": "Gestante com DUM confiável em 03/06/2026 e ciclos regulares de 28 dias. Primeira consulta em 20/08/2026. Qual a idade gestacional?", "o": [["11 semanas e 1 dia", "De 03/06 a 20/08 são 78 dias; 78 ÷ 7 = 11, resto 1."], ["11 semanas e 3 dias", "Erro de contagem dos dias de julho/agosto."], ["10 semanas e 6 dias", "Subtrai um mês de 30 dias em vez de contar os 31 dias de julho."], ["12 semanas exatas", "Arredonda pelos meses, sem contar dias."]], "pista": "Contar os dias: 27 (junho) + 31 (julho) + 20 (agosto) = 78.", "pp": ["Junho: de 03 a 30 = 27 dias.", "Julho: 31 dias.", "Agosto: até 20 = 20 dias.", "Total 78; ÷ 7 = 11 semanas, resto 1 dia."], "ap": "<p>Regra do PDF (p. 7): “dias entre DUM e consulta ÷ 7, quociente = semanas e resto = dias”. Com DUM incerta ou discordante, a US precoce pelo comprimento cabeça-nádega data melhor; não se redata a cada US tardia.<\/p>", "mud": [["DUM incerta", "Datar pela US precoce (CCN)", "PDF p. 7"], ["US de 30 semanas discordante", "Não redatar pela US tardia", "PDF p. 7"]], "arm": "Contar meses como 4 semanas exatas.", "ouro": "IG = dias desde a DUM ÷ 7 (quociente semanas, resto dias).", "m2": ["Qual a DPP desta gestante por Näegele?", "03/06 + 7 dias = 10/06 → −3 meses = 10/03 → +1 ano: 10/03/2027."], "n": ["Contar dias reais.", "Quociente = semanas; resto = dias.", "DUM incerta → CCN."], "loc": [{"f": "adu", "p": 7, "q": "Estabeleça idade gestacional (IG) por DUM confiável: dias entre DUM e consulta ÷7, quociente = semanas e resto = dias.", "s": "Cap. 14.1 — item 3", "r": [[0.0906, 0.4647, 0.9113, 0.4824], [0.0689, 0.4825, 0.2828, 0.5002]]}], "img": ["sv-dpp"], "t": "A15"}, {"id": "A15-06", "sub": "DPP pela regra de Näegele", "comp": "Datação da gestação", "rac": "Cálculo", "q": "DUM em 25/11/2026, ciclos regulares. Pela regra de Näegele, qual a data provável do parto?", "o": [["02/09/2027", "25/11 + 7 dias = 02/12; −3 meses = 02/09; +1 ano = 2027."], ["02/08/2027", "Subtraiu 4 meses."], ["18/08/2027", "Subtraiu 7 dias em vez de somar."], ["02/09/2026", "Esqueceu de acrescentar 1 ano."]], "pista": "Some 7 dias, subtraia 3 meses e acrescente 1 ano.", "pp": ["25/11/2026 + 7 dias = 02/12/2026.", "− 3 meses = 02/09.", "+ 1 ano = 02/09/2027.", "DPP é estimativa (~280 dias)."], "ap": "<p>O PDF (p. 7) traz a regra e o exemplo (DUM 10/08/2026 → DPP 17/05/2027) e lembra que a DPP equivale a 280 dias em ciclo de 28 dias e “não é data obrigatória do nascimento”. Quando a soma de 7 dias muda o mês (como aqui, de 25/11 para 02/12), é a nova data que recebe a subtração de 3 meses.<\/p>", "mud": [["DUM 10/08/2026", "DPP 17/05/2027", "Exemplo do PDF"]], "arm": "Subtrair os 3 meses antes de somar os 7 dias quando a soma cruza o mês.", "ouro": "Näegele: +7 dias, −3 meses, +1 ano.", "m2": ["A DPP define a data do parto?", "Não; é estimativa (PDF p. 7)."], "n": ["+7 d, −3 m, +1 a.", "≈ 280 dias.", "Estimativa."], "loc": [{"f": "adu", "p": 7, "q": "Regra de Näegele: some 7 dias ao primeiro dia da DUM, subtraia 3 meses e acrescente 1 ano quando necessário.", "s": "Cap. 14.1 — Data provável do parto", "r": [[0.0689, 0.5496, 0.8806, 0.5673], [0.0689, 0.5675, 0.243, 0.5851]]}, {"f": "adu", "p": 7, "q": "Exemplo DUM 10/08/2026 → DPP 17/05/2027. A DPP é estimativa e não data obrigatória do nascimento.", "s": "Cap. 14.1 — Data provável do parto", "r": [[0.592, 0.5675, 0.8824, 0.5851], [0.0689, 0.5853, 0.6823, 0.6029]]}], "img": ["sv-dpp"], "t": "A15"}, {"id": "A15-07", "sub": "Datação: DUM incerta × US", "comp": "Datação da gestação", "rac": "Escolha do método", "q": "Gestante não lembra a DUM (“foi no começo do mês, acho”). US com 9 semanas pelo CCN. Com 32 semanas, nova US estima IG de 30 semanas. Como a IG deve ser registrada?", "o": [["Manter a datação pela US precoce, sem redatar pela tardia", "US precoce pelo CCN é melhor se DUM incerta; não redatar a cada US tardia."], ["Redatar para 30 semanas, pois a US mais recente é a mais precisa", "A US tardia mede crescimento, não idade; redatar mascararia restrição."], ["Usar a média entre DUM estimada e as duas US", "Não é método do material."], ["Datar só pela AU, que reflete melhor a idade gestacional", "AU é medida de crescimento, não método de datação."]], "pista": "Datação se faz cedo; US tardia avalia crescimento.", "pp": ["DUM incerta → US precoce pelo CCN.", "Datação fixada no 1º trimestre.", "US tardia discordante: avaliar crescimento, não redatar.", "Discrepância pode indicar restrição."], "ap": "<p>O PDF (p. 7): “US precoce pelo comprimento cabeça-nádega é melhor para datar se DUM incerta ou discordante. Não redatar a cada US tardia.” Uma US de 32 semanas que “mede” 30 semanas pode estar mostrando um feto pequeno — informação que se perde ao redatar.<\/p>", "mud": [["DUM confiável e US precoce concordante", "Usar a DUM", "PDF p. 7"]], "arm": "Redatar pela US mais recente.", "ouro": "Datar cedo; nunca redatar pela US tardia.", "m2": ["Em que janela a caderneta recomenda a US obstétrica inicial?", "7–12 semanas (PDF p. 10)."], "n": ["DUM incerta → CCN.", "Não redatar tardiamente.", "US tardia = crescimento."], "loc": [{"f": "adu", "p": 7, "q": "US precoce pelo comprimento cabeça-nádega é melhor para datar se DUM incerta ou discordante. Não redatar a cada US tardia.", "s": "Cap. 14.1 — item 3", "r": [[0.2814, 0.4825, 0.9311, 0.5002], [0.0689, 0.5003, 0.5349, 0.518]]}], "img": ["sv-dpp"], "t": "A15"}, {"id": "A15-08", "sub": "Anamnese da primeira consulta", "comp": "Primeira consulta pré-natal", "rac": "Comunicação e segurança", "q": "Primeira consulta de gestante de 10 semanas, acompanhada do companheiro, que responde por ela e insiste em ficar na sala. Ela evita contato visual. Qual a conduta mais adequada?", "o": [["Garantir um momento a sós para perguntar sobre violência e saúde mental", "O PDF inclui saúde mental e violência “em privacidade” na anamnese da primeira consulta."], ["Perguntar sobre violência na frente do companheiro, para mostrar transparência", "Expõe a gestante a risco e inibe a resposta."], ["Omitir perguntas sobre violência para não constranger o casal na primeira consulta", "Rastrear violência é parte obrigatória da anamnese."], ["Encaminhar diretamente ao alto risco por suspeita de violência, sem completar a anamnese", "A avaliação continua na APS; a estratificação considera o quadro completo."]], "pista": "“Saúde mental e violência (em privacidade).”", "pp": ["Primeira consulta idealmente até 12 semanas.", "Anamnese ampla: social, obstétrica, ginecológica, IST, crônicas, medicamentos, hábitos.", "Saúde mental e violência em privacidade.", "Avaliar vulnerabilidade e construir plano."], "ap": "<p>O roteiro do PDF (p. 7) inclui identificação, ocupação, acesso, moradia, apoio, aceitação da gravidez, DUM, história obstétrica, antecedentes, IST, crônicas, cirurgias, alergias, medicamentos, imunizações, família, álcool, tabaco, substâncias, saúde mental e violência “em privacidade”. Um companheiro que controla a consulta é sinal de alerta.<\/p>", "mud": [["Ela revelasse violência", "Acolher, plano de segurança, rede de apoio e proteção", "IESC p. 4"]], "arm": "Perguntar sobre violência com o parceiro presente.", "ouro": "Violência se pergunta a sós.", "m2": ["Que dados sociais o roteiro inclui?", "Ocupação, acesso à unidade, moradia, apoio, planejamento/aceitação da gravidez (PDF p. 7)."], "n": ["Violência em privacidade.", "Saúde mental na 1ª consulta.", "Avaliar vulnerabilidade."], "loc": [{"f": "adu", "p": 7, "q": "álcool, tabaco, outras substâncias, saúde mental e violência (em privacidade).", "s": "Cap. 14.2 — Primeira consulta: roteiro de anamnese", "r": [[0.332, 0.7385, 0.8958, 0.7562], [0.0689, 0.7563, 0.188, 0.774]]}], "img": [], "t": "A15"}, {"id": "A15-09", "sub": "Exame físico da primeira consulta", "comp": "Primeira consulta pré-natal", "rac": "Técnica e indicação", "q": "Gestante de 9 semanas, assintomática, em primeira consulta. O estudante planeja: PA, peso, altura, IMC, ausculta, exame abdominal, “expressão das papilas para ver se tem colostro” e “AU e BCF obrigatórios”. Qual correção o preceptor deve fazer?", "o": [["Sem expressão papilar de rotina; AU e BCF não são exigidos quando ainda não detectáveis", "Mamas só com queixa/indicação, sem expressão papilar de rotina; no início o útero pode estar intrapélvico."], ["O roteiro está correto, pois a expressão papilar avalia a futura lactação", "Não há indicação de expressão papilar de rotina."], ["Retirar o IMC, que só tem valor após 20 semanas", "Peso, altura e IMC inicial são obrigatórios."], ["O BCF deve ser buscado com Pinard nessa idade gestacional", "Pinard só após ~20 semanas; Doppler a partir de 10–12."]], "pista": "“Não fazer expressão papilar de rotina” e “não exigir AU e BCF quando não detectáveis”.", "pp": ["Higienizar, explicar, consentimento.", "PA com manguito correto; peso, altura, IMC.", "Pele, mucosas, tireoide, ausculta, abdome, membros, edema.", "Mamas: só com queixa/indicação; sem expressão papilar.", "Útero pode estar intrapélvico: AU/BCF conforme técnica."], "ap": "<p>O exame físico inicial do PDF (p. 10) segue uma ordem: preparo e PA (repouso, braço apoiado na altura do coração, manguito adequado), antropometria e IMC, exame geral, mamas com privacidade e indicação, e exame obstétrico conforme IG. A tabela da p. 8 mostra que o BCF com Doppler começa entre 10–12 semanas.<\/p>", "mud": [["Gestante com 12 semanas", "Doppler pode detectar BCF; útero palpável acima da sínfise", "PDF p. 8"], ["Queixa de nódulo mamário", "Exame das mamas indicado", "PDF p. 10"]], "arm": "Achar que ausência de BCF ao Doppler com 9 semanas é anormal.", "ouro": "1ª consulta: exame completo, mas sem expressão papilar de rotina e sem exigir AU/BCF inaudíveis.", "m2": ["Como aferir a PA na gestante?", "Após repouso, braço apoiado à altura do coração, manguito correto (PDF p. 10)."], "n": ["Sem expressão papilar de rotina.", "AU/BCF quando detectáveis.", "IMC inicial obrigatório."], "loc": [{"f": "adu", "p": 10, "q": "Avalie mamas se queixa ou indicação, com privacidade; não fazer expressão papilar de rotina.", "s": "Cap. 14 — Exame físico inicial, item 2", "r": [[0.4687, 0.1624, 0.8459, 0.1801], [0.0689, 0.1802, 0.5138, 0.1979]]}, {"f": "adu", "p": 10, "q": "No início, útero pode estar intrapélvico; não exigir AU e BCF quando não são detectáveis pela técnica.", "s": "Cap. 14 — Exame físico inicial, item 3", "r": [[0.7411, 0.2052, 0.9263, 0.2228], [0.0689, 0.223, 0.7699, 0.2407]]}, {"f": "adu", "p": 8, "r": [[0.039, 0.075, 0.469, 0.112]], "s": "Tabela “Avaliação obstétrica por IG” (imagem) — 10–12 semanas: BCF com sonar Doppler"}], "img": ["adu-ig-tabela"], "t": "A15"}, {"id": "A15-10", "sub": "Glicemia de jejum 98 na primeira consulta", "comp": "Exames iniciais", "rac": "Interpretação de exame", "q": "Gestante de 11 semanas, IMC 31, sem diabetes prévio. Glicemia de jejum na primeira consulta: 98 mg/dL. Qual a conduta?", "o": [["Diagnosticar DMG agora, sem aguardar o TOTG de 24–28 semanas", "92–125 na glicemia inicial = DMG; não aguardar 24 semanas."], ["Programar o TOTG com 24–28 semanas para confirmar", "O TOTG é para jejum < 92; aqui o critério já foi preenchido."], ["Diagnosticar diabetes manifesto e iniciar insulina", "Diabetes manifesto é ≥ 126."], ["Repetir a glicemia no 3º trimestre, pois 98 é normal em obesas", "Não há ajuste por IMC."]], "pista": "92–125 = DMG já na 1ª consulta.", "pp": ["Jejum < 92 → TOTG 24–28.", "92–125 → DMG.", "≥ 126 → diabetes manifesto (confirmar se assintomática).", "Não aguardar 24 semanas se já preenche critério."], "ap": "<p>A tabela de exames (PDF p. 10) e a seção do TOTG (p. 12) convergem: “Não aguardar 24 semanas se glicemia inicial já preenche critério.” A conduta após o diagnóstico é orientação alimentar, atividade segura, monitorização glicêmica e encaminhamento conforme controle, com insulina se necessário.<\/p>", "mud": [["Jejum 88", "Programar TOTG 24–28", "< 92"], ["Jejum 131 assintomática", "Suspeita de diabetes manifesto, confirmar", "≥ 126"]], "arm": "Pedir TOTG para confirmar algo já diagnosticado.", "ouro": "Jejum inicial 92–125 = DMG imediato.", "m2": ["Quais os pontos de corte do TOTG 75 g?", "Jejum ≥ 92, 1 h ≥ 180, 2 h ≥ 153 — um basta (PDF p. 12)."], "n": ["< 92 TOTG.", "92–125 DMG.", "≥ 126 manifesto."], "loc": [{"f": "adu", "p": 10, "q": "<92 mg/dL: programar TOTG; 92–125: diabetes gestacional; ≥126: diabetes manifesto, confirmar conforme critérios se assintomática.", "s": "Cap. 14.3 — Exames iniciais (glicemia de jejum)", "r": [[0.3225, 0.4099, 0.8768, 0.4252], [0.3225, 0.4238, 0.7434, 0.4391]]}, {"f": "adu", "p": 12, "q": "Não aguardar 24 semanas se glicemia inicial já preenche critério.", "s": "Cap. 15 — TOTG 75 g", "r": [[0.7409, 0.571, 0.8923, 0.5887], [0.0689, 0.5888, 0.489, 0.6065]]}], "img": ["sv-glicemia"], "t": "A15"}, {"id": "A15-11", "sub": "Rh negativo com Coombs negativo", "comp": "Exames iniciais", "rac": "Interpretação e plano", "q": "Gestante de 10 semanas, O negativo, primeira gestação, parceiro Rh positivo. Coombs indireto negativo. Qual o plano?", "o": [["Repetir o Coombs e programar a imunoglobulina anti-D conforme indicação", "Rh negativo com Coombs negativo: repetir e programar anti-D."], ["Aplicar anti-D agora, pois já há risco de sensibilização", "A profilaxia de rotina é por volta de 28 semanas e após eventos sensibilizantes."], ["Encaminhar ao alto risco por aloimunização", "Coombs negativo = não sensibilizada."], ["Dispensar seguimento, pois na primeira gestação não há risco", "O objetivo é justamente evitar sensibilização nesta gestação."]], "pista": "Coombs NEGATIVO = não sensibilizada → prevenir.", "pp": ["ABO/Rh identifica risco de aloimunização.", "Rh negativo → Coombs indireto.", "Negativo → repetir e programar anti-D.", "Positivo → tipar anticorpo e encaminhar."], "ap": "<p>Na tabela de exames iniciais (PDF p. 10): “Se Coombs positivo, tipar anticorpo e encaminhar; se negativo, repetir e programar anti-D conforme indicação.” A sequência completa (p. 12): anti-D usualmente por volta de 28 semanas, até 72 h após parto de RN Rh positivo/desconhecido e após eventos sensibilizantes, 300 µg IM na rotina.<\/p>", "mud": [["Coombs positivo", "Caracterizar anticorpo e referenciar; anti-D não trata", "PDF p. 12"], ["Sangramento vaginal com 20 semanas", "Considerar anti- iversal."], "ap": "<p>O PDF (p. 10) cita a recomendação nacional recente de cálcio universal (1.000 mg de cálcio elementar, em duas tomadas) e a necessidade de separar do ferro. A IESC (p. 4) reforça a Nota Técnica 251/2024. O AAS é discutido no alto risco de pré-eclâmpsia, idealmente iniciado entre 12 e 16 semanas.<\/p>", "mud": [["Filho anterior com mielomeningocele", "Ácido fólico em dose alta (ex.: 5 mg) com orientação", "Risco elevado de DTN"], ["Hipertensão crônica", "Discutir AAS precoce", "Alto risco de PE"]], "arm": "Prescrever 5 mg de fólico e AAS para todas.", "ouro": "400 µg de fólico, cálcio universal a partir de 12 sem; AAS só no risco.", "m2": ["Até quando o ferro profilático?", "Até 3 meses pós-parto (PDF p. 10; IESC p. 4)."], "n": ["Fólico 400 µg.", "Cálcio 12 sem–parto.", "AAS não universal."], "loc": [{"f": "adu", "p": 10, "q": "Ácido fólico 400 microgramas/dia, idealmente antes da concepção até 12 semanas; dose alta (ex.: 5 mg/dia) apenas com indicação de risco elevado de defeito do tubo neural", "s": "Cap. 14.4 — Suplementação", "r": [[0.0689, 0.7467, 0.9245, 0.7644], [0.0689, 0.7645, 0.7246, 0.7822]]}, {"f": "adu", "p": 10, "q": "recomendação nacional recente de suplementação universal de 1.000 mg de cálcio elementar/dia da 12ª semana ao parto, em duas tomadas, separado do ferro por pelo menos 2 horas.", "s": "Cap. 14.4 — Suplementação", "r": [[0.0689, 0.8358, 0.9211, 0.8534], [0.0689, 0.8536, 0.8262, 0.8713]]}], "img": ["sv-suplementos"], "t": "A15"}, {"id": "A15-14", "sub": "Vacinação na gestação", "comp": "Imunização", "rac": "Prescrição", "q": "Gestante de 22 semanas, caderneta com dT completa há 4 anos, nunca vacinada para hepatite B, suscetível à rubéola. É época de influenza. Qual plano está correto?", "o": [["Influenza, dTpa e hepatite B; tríplice viral só no puerpério", "Influenza na temporada; dTpa a partir de 20 sem em cada gestação; hepatite B se incompleto; tríplice viral contraindicada."], ["Tríplice viral agora, pela suscetibilidade, e dTpa só após o parto", "Tríplice viral é contraindicada na gestação; dTpa é feita a partir de 20 semanas."], ["Apenas influenza, pois a dT completa dispensa a dTpa", "dTpa é recomendada em cada gestação."], ["Adiar todas as vacinas para o puerpério por segurança fetal", "Influenza, dTpa e hepatite B são indicadas na gestação."]], "pista": "Vacinas vivas (tríplice viral, varicela) não; dTpa em cada gestação.", "pp": ["Influenza: cada temporada.", "dTpa: ≥ 20 semanas em cada gestação.", "Hepatite B: se esquema incompleto.", "VSR: ≥ 28 semanas.", "Tríplice viral/varicela: contraindicadas; atualizar no puerpério."], "ap": "<p>Vacinas (PDF p. 11): conferir a caderneta; influenza a cada temporada; dTpa a partir de 20 semanas em cada gestação, completando dT conforme histórico; hepatite B se incompleto; covid-19 conforme calendário; VSR materna a partir de 28 semanas; tríplice viral e varicela contraindicadas (atualizar no puerpério); febre amarela por avaliação de risco-benefício.<\/p>", "mud": [["Gestante com 29 semanas", "Acrescentar vacina materna contra VSR", "≥ 28 sem"], ["Viagem a área de febre amarela", "Avaliação de risco-benefício", "PDF p. 11"]], "arm": "Achar que dT recente dispensa a dTpa da gestação.", "ouro": "Na gestação: influenza, dTpa (≥ 20 sem), hepatite B, VSR (≥ 28 sem); vivas, não.", "m2": ["Quanto tempo evitar engravidar após tríplice viral?", "30 dias (PDF p. 18)."], "n": ["dTpa em cada gestação.", "VSR ≥ 28 sem.", "Tríplice viral contraindicada."], "loc": [{"f": "adu", "p": 11, "q": "Influenza a cada temporada; dTpa a partir de 20 semanas em cada gestação, completar dT conforme histórico; hepatite B se esquema incompleto", "s": "Cap. 14.4 — Vacinas", "r": [[0.3163, 0.0597, 0.9021, 0.0773], [0.0689, 0.0775, 0.7603, 0.0952]]}, {"f": "adu", "p": 11, "q": "Tríplice viral e varicela são contraindicadas na gestação; atualizar no puerpério.", "s": "Cap. 14.4 — Vacinas", "r": [[0.531, 0.1131, 0.9094, 0.1308], [0.0689, 0.1309, 0.3869, 0.1486]]}], "i , ["Cefálica; BCF abaixo do umbigo à direita", "Polo cefálico no fundo indica que a cabeça está em cima."], ["Córmica; BCF na linha média suprapúbica", "Na córmica o polo não está no fundo."], ["Pélvica; BCF sobre as pequenas partes à esquerda", "O BCF se ausculta sobre o dorso."]], "pista": "Cabeça (dura, redonda, móvel) no fundo → nádegas embaixo.", "pp": ["1º tempo: identifica o polo no fundo.", "Cabeça: dura, arredondada, móvel; nádegas: macias, irregulares.", "Cabeça no fundo = pélvica.", "2º tempo: dorso define o local da ausculta.", "Pélvica: BCF acima do umbigo."], "ap": "<p>A tabela de Leopold (PDF p. 14) e a ausculta (p. 15): “posicione o sonar sobre o dorso (em apresentação cefálica geralmente abaixo do umbigo; pélvica, acima)”. A imagem da apostila (p. 8) anota “BCF acima do umbigo” na pélvica e “próximo ao umbigo” na transversa.<\/p>", "mud": [["Polo macio e irregular no fundo", "Cefálica; BCF abaixo do umbigo", "PDF p. 14–15"], ["Polos nos flancos", "Situação transversa", "PDF p. 8"]], "arm": "Confundir o polo encontrado no fundo com a apresentação.", "ouro": "O que está no fundo NÃO é o que se apresenta.", "m2": ["Qual tempo define o local de ausculta?", "O 2º tempo (lados), ao localizar o dorso (PDF p. 14)."], "n": ["1º tempo = fundo.", "Pélvica: BCF acima do umbigo.", "BCF sobre o dorso."], "loc": [{"f": "adu", "p": 14, "q": "Cabeça dura, arredondada, móvel; nádegas mais macias, irregulares.", "s": "Cap. 16.3 — Leopold (1º tempo)", "r": [[0.5325, 0.6127, 0.8923, 0.628], [0.5325, 0.6266, 0.681, 0.6419]]}, {"f": "adu", "p": 15, "q": "posicione sonar sobre dorso (em apresentação cefálica geralmente abaixo do umbigo; pélvica, acima).", "s": "Cap. 16.4 — Ausculta do BCF", "r": [[0.3989, 0.3876, 0.8797, 0.4053], [0.0689, 0.4054, 0.4813, 0.4231]]}, {"f": "adu", "p": 8, "r": [[0.088, 0.64, 0.42, 0.807]], "s": "Figura de estática fetal (imagem) — apresentações"}], "img": ["adu-leopold-slide", "adu-estatica"], "t": "A16"}, {"id": "A16-04", "sub": "3º e 4º tempos de Leopold", "comp": "Manobras de Leopold", "rac": "Técnica", "q": "Na estação de OSCE, o estudante executa o 3º tempo de Leopold e encontra o polo cefálico acima do púbis, facilmente móvel. Depois vira-se para os pés da gestante para o 4º tempo. O que cada achado/ação significa?", "o": [["Polo móvel = provavelmente não insinuado; 4º tempo avalia a descida", "3º tempo: polo e mobilidade; 4º tempo, voltado para os pés, avalia descida."], ["Polo móvel = insinuado; o 4º tempo avalia o dorso fetal", "Mobilidade indica que NÃO está insinuado; dorso é o 2º tempo."], ["O 3º tempo localiza o dorso; o 4º mede a altura uterina", "Dorso é 2º tempo; AU é medida com fita."], ["Virar-se para os pés é erro: todos os tempos são feitos de frente para a cabeça", "No 4º tempo o examinador se volta para os pés."]], "pista": "Móvel = não insinuado; 4º tempo = de frente para os pés.", "pp": ["Examinador inicialmente voltado para a cabeça da gestante.", "3º tempo: polo inferior e mobilidade.", "Móvel: provavelmente não insinuado.", "4º tempo: voltado para os pés; descida e flexão."], "ap": "<p>Tabela do PDF (p. 14): 3º tempo — uma mão acima do púbis, polegar e dedos circundam o polo; identifica polo e mobilidade (“se móvel, provavelmente não insinuado”). 4º tempo — “vire-se para os pés; mãos nos quadrantes inferiores, dedos dirigidos à pelve”; avalia grau de descida e, em cefálica, flexão/extensão. As manobras são mais úteis no 3º trimestre.<\/p>", "mud": [["Polo fixo, difícil de mobilizar", "Sugere insinuação", "Inverso do móvel"]], "arm": "Esquecer de mudar de posição no 4º tempo.", "ouro": "3º: polo e mobilidade; 4º: de frente para os pés, descida.", "m2": ["Por que Leopold é pouco útil antes do 3º trimestre?", "A apresentação pode variar em gestação precoce (PDF p. 14)."], "n": ["3º tempo: mobilidade.", "4º: virar para os pés.", "Úteis no 3º trimestre."], "loc": [{"f": "adu", "p": 14, "q": "Identifica polo apresentado e mobilidade (se móvel, provavelmente não insinuado).", "s": "Cap. 16.3 — Leopold (3º tempo)", "r": [[0.5325, 0.7059, 0.9114, 0.7212], [0.5325, 0.7198, 0.7622, 0.7351]]}, {"f": "adu", "p": 14, "q": "Vire-se para os pés; mãos nos quadrantes inferiores, dedos dirigidos à pelve", "s": "Cap. 16.3 — Leopold (4º tempo)", "r": [[0.2553, 0.7595, 0.4773, 0.7748], [0.2553, 0.7734, 0.4677, 0.7887], [0.2553, 0.7873, 0.3846, 0.8026]]}], "img": ["adu-leopold-slide", "adu-p15-0"], "t": "A16"}, {"id": "A16-05", "sub": "BCF × pulso materno", "comp": "Ausculta fetal", "rac": "Técnica e interpretação", "q": "Gestante de 24 semanas, ansiosa, FC 96 bpm. Com o sonar Doppler, o estudante ouve batimentos regulares a 96 bpm na fossa ilíaca e registra “bradicardia fetal”. Qual o erro e a conduta?", "o": [["Provável pulso materno: comparar com o radial e reposicionar sobre o dorso", "O PDF manda comparar com o pulso radial materno para não confundir; reposicionar."], ["Bradicardia fetal confirmada: encaminhar para resolução imediata da gestação", "Antes, verificar a técnica; a FC coincide com a materna."], ["Normal: o BCF esperado é 80–120 bpm no 2º trimestre", "Faixa basal esperada: 110–160 bpm."], ["Trocar pelo Pinard, que com 24 semanas é mais sensível que o sonar Doppler", "Pinard é possível após ~20 sem, mas o erro é não comparar com o pulso materno."]], "pista": "FC “fetal” igual à FC materna = pulso materno.", "pp": ["BCF esperado 110–160.", "96 = FC materna.", "Comparar com pulso radial.", "Leopold → dorso → ajustar ângulo.", "Persistindo ausência/bradicardia → avaliação obstétrica."], "ap": "<p>PDF p. 15: “Ajuste ângulo suavemente até ouvir; compare com pulso radial materno para não confundir. Conte durante um minuto, registre bpm e regularidade.” Ausência em idade esperada, bradicardia ou taquicardia persistentes “exigem verificação técnica e avaliação obstétrica; não tranquilize sem confirmar”.<\/p>", "mud": [["BCF real de 100 confirmado", "Avaliação obstétrica", "Bradicardia persistente"]], "arm": "Registrar o pulso materno como BCF.", "ouro": "Todo BCF auscultado se compara com o pulso materno.", "m2": ["Por quanto tempo contar o BCF?", "Um minuto (PDF p. 15)."], "n": ["110–160 bpm.", "Comparar com radial.", "Contar 1 minuto."], "loc": [{"f": "adu", "p": 15, "q": "compare com pulso radial materno para não confundir. Conte durante um minuto, registre bpm e regularidade. Faixa basal esperada 110–160 bpm.", "s": "Cap. 16.4 — Ausculta do BCF", "r": [[0.2684, 0.4233, 0.9118, 0.4409], [0.0689, 0.4411, 0.7095, 0.4587]]}], "img": ["adu-estatica"], "t": "A16"}, {"id": "A16-06", "sub": "Redução de movimentos fetais", "comp": "Sinais de alarme", "rac": "Priorização", "q": "Gestante de 34 semanas liga para a UBS: “o bebê está mexendo bem menos desde ontem”. A técnica de enfermagem orienta contar movimentos em casa por 3 dias. Qual a orientação adequada?", "o": [["Avaliação no mesmo dia (BCF e avaliação obstétrica)", "Redução dos movimentos exige avaliação, não apenas contagem domiciliar."], ["Contagem em casa por 3 dias e retorno se zerar", "O PDF diz que a redução exige avaliação, não só contagem."], ["Tranquilizar: após 32 semanas o feto mexe menos pela falta de espaço", "Redução em relação ao padrão é alarme."], ["Marcar US morfológica na próxima semana", "Não é a ferramenta nem o prazo adequados."]], "pista": "“Redução exige avaliação, não apenas contagem domiciliar.”", "pp": ["Perguntar o padrão habitual e a mudança.", "Redução importante = sinal de retorno urgente.", "Avaliar BCF e encaminhar à avaliação obstétrica.", "Não substituir por contagem domiciliar."], "ap": "<p>O PDF aparece duas vezes: na ausculta (p. 15 — “redução exige avaliação, não apenas contagem domiciliar”) e nos sinais de retorno urgente (p. 13 — “redução importante dos movimentos fetais em relação ao padrão habitual”). A IESC lista “redução/ausência de movimentos fetais” entre as situações que não aguardam o ambulatório (p. 4).<\/p>", "mud": [["Movimentos no padrão habitual", "Orientar e seguir rotina", "Sem alarme"]], "arm": "Responder à , proteinúria, avaliação fetal.", "Sem gravidade: seguimento próximo."], "ap": "<p>PDF p. 12: “sem proteinúria ainda pode existir” e “edema isolado não diagnostica pré-eclâmpsia”. A IESC (p. 3) completa: hipertensão gestacional é nova após 20 semanas sem proteinúria ou outras manifestações; a suspeita de PE é encaminhada à avaliação obstétrica imediata.<\/p>", "mud": [["PA 164/112 com escotomas", "Urgência: estabilizar e transferir", "Gravidade"], ["PA elevada desde 10 semanas", "HAS crônica", "< 20 sem"]], "arm": "Afastar PE porque a fita urinária é negativa.", "ouro": "Hipertensão nova após 20 sem: investigar PE com laboratório e feto.", "m2": ["Que exame de proteinúria o PDF cita?", "Relação proteína/creatinina ≥ 0,3 g/g ou 24 h ≥ 300 mg (PDF p. 12)."], "n": ["PE sem proteinúria existe.", "P/C ≥ 0,3.", "Plaquetas, creatinina, TGO/TGP."], "loc": [{"f": "adu", "p": 12, "q": "Após 20 semanas, hipertensão nova associada a proteinúria ou disfunção orgânica sugere pré-eclâmpsia; sem proteinúria ainda pode existir.", "s": "Cap. 15.1 — Hipertensão que não pode passar despercebida", "r": [[0.6713, 0.6381, 0.8351, 0.6558], [0.0689, 0.6559, 0.8649, 0.6736], [0.0689, 0.6738, 0.335, 0.6914]]}, {"f": "adu", "p": 12, "q": "Solicitar plaquetas, creatinina, transaminases e avaliação de proteinúria (relação proteína/creatinina ≥0,3 g/g ou 24 h ≥300 mg), e avaliação fetal.", "s": "Cap. 15.1 — Hipertensão", "r": [[0.6771, 0.6916, 0.8486, 0.7092], [0.0689, 0.7094, 0.9227, 0.7271], [0.0689, 0.7272, 0.3203, 0.7449]]}], "img": ["sv-has"], "t": "A16"}, {"id": "A16-08", "sub": "Edema na gestação", "comp": "Exame físico da gestante", "rac": "Interpretação semiológica", "q": "Gestante de 36 semanas com edema de tornozelos bilateral, cacifo 1+, que piora ao fim do dia. PA 112/70. Na mesma tarde, outra gestante de 30 semanas relata dor e edema apenas na panturrilha esquerda. Qual a interpretação correta?", "o": [["1ª: edema isolado não define PE; 2ª: pensar em trombose", "Edema isolado não diagnostica PE; edema unilateral doloroso sugere trombose."], ["Ambas: pré-eclâmpsia, pois edema é critério diagnóstico", "Edema não é critério; a PA da primeira é normal."], ["Primeira: insuficiência cardíaca; segunda: edema fisiológico", "Edema unilateral doloroso não é fisiológico."], ["Ambas: edema fisiológico da gestação, sem necessidade de avaliação", "Unilateral doloroso exige avaliação."]], "pista": "Edema isolado ≠ PE; unilateral doloroso = trombose?", "pp": ["Pesquisar edema de pernas, mãos e face.", "Cacifo: pressionar pré-tibial/tornozelo.", "Bilateral, sem PA alta: não diagnostica PE.", "Unilateral doloroso: trombose.", "Facial com cefaleia/PA alta: alerta."], "ap": "<p>PDF p. 15: “Edema unilateral doloroso sugere trombose; edema facial com cefaleia/PA alta é alerta.” E p. 12: “Edema isolado não diagnostica pré-eclâmpsia.” A IESC (p. 7) reforça no puerpério: suspeita de TEV → avaliação urgente, não massagear.<\/p>", "mud": [["Edema facial com cefaleia e PA 150/100", "Alerta de PE", "PDF p. 15"]], "arm": "Chamar edema de critério de PE.", "ouro": "Edema conta a história junto com PA, lateralidade e dor.", "m2": ["Como pesquisar cacifo?", "Pressionar região pré-tibial/tornozelo por alguns segundos; descrever localização e simetria (PDF p. 15)."], "n": ["Edema isolado não é PE.", "Unilateral doloroso = TVP?", "Facial + cefaleia = alerta."], "loc": [{"f": "adu", "p": 15, "q": "Edema unilateral doloroso sugere trombose; edema facial com cefaleia/PA alta é alerta.", "s": "Cap. 16.5 — PA, edema e exame complementar", "r": [[0.0689, 0.6062, 0.8313, 0.6238]]}, {"f": "adu", "p": 12, "q": "Edema isolado não diagnostica pré-eclâmpsia.", "s": "Cap. 15.1 — Hipertensão", "r": [[0.319, 0.7272, 0.7253, 0.7449]]}], "img": ["sv-has"], "t": "A16"}, {"id": "A16-09", "sub": "Anti-D com 28 semanas e pós-parto", "comp": "Gestante Rh negativo", "rac": "Prescrição", "q": "Gestante A negativo, Coombs indireto negativo com 27 semanas, sem intercorrências. Parceiro Rh positivo. Qual o plano?", "o": [["Anti-D ~28 sem e até 72 h após parto de RN Rh+", "Profilaxia de rotina ~28 sem e até 72 h após parto de RN Rh positivo/desconhecido; também em eventos sensibilizantes."], ["Anti-D só se o RN nascer Rh positivo, sem dose antenatal", "Há profilaxia antenatal de rotina."], ["Anti-D semanal até o parto para manter proteção", "Não é o esquema do material."], ["Encaminhar ao pré-natal de alto risco por aloimunização Rh", "Coombs negativo = não sensibilizada."]], "pista": "Coombs negativo: anti-D ~28 sem + até 72 h pós-parto.", "pp": ["Rh negativo + Coombs negativo.", "Anti-D ~28 semanas, 300 µg IM.", "Até 72 h após parto de RN Rh+ ou desconhecido.", "Também após eventos sensibilizantes.", "Coombs positivo: referenciar."], "ap": "<p>PDF p. 12 (“Rh negativo: sequência”) e tabela da p. 9 (28 semanas: imunoglobulina anti-D para gestantes Rh negativo não sensibilizadas, quando indicada; iniciar consultas quinzenais). A profilaxia não trata sensibilização já estabelecida.<\/p>", "mud": [["Coombs positivo", "Caracterizar anticorpo e referenciar", "PDF p. 12"], ["RN com Rh desconhecido", "Aplicar até 72 h", "PDF p. 12"]], "arm": "Achar que anti-D trata Coombs positivo.", "ouro": "Rh−/Coombs−: 28 semanas + 72 h pós-parto.", "m2": ["O que mais acontece com 28 semanas no calendário?", "Consultas passam a ser quinzenais (PDF p. 9 e 12)."], "n": ["~28 semanas.", "≤ 72 h pós-parto.", "Eventos sensibilizantes."], "loc": [{"f": "adu", "p": 12, "q": "Se Rh negativo e Coombs indireto negativo, acompanhar e indicar imunoglobulina anti-D profilática usualmente por volta de 28 semanas e até 72 h após parto de RN Rh positivo ou desconhecido", "s": "Cap. 15.1 — Rh negativo: sequência", "r": [[0.0689, 0.7765, 0.9311, 0.7942], [0.0689, 0.7943, 0.8992, 0.812]]}, {"f": "adu", "p": 9, "r": [[0.3, 0.777, 0.7, 0.839]], "s": "Tabela “Exames e condutas por IG” (imagem) — 28 semanas"}], "img": ["sv-rh", "adu-exames-ig"], "t": "A16"}, {"id": "A16-10", "sub": "Toque vaginal e sangramento", "comp": "Exame obstétrico", "rac": "Segurança", "q": "Gestante de 31 semanas chega com sangramento vaginal vermelho-vivo, indolor, em moderada quantidade. Útero relaxado, BCF 148. O interno quer fazer toque vaginal “para ver o colo”. Qual a orientação correta?", "o": [["Evitar o toque até avaliação (suspeita de placenta prévia)", "Evitar toque digital no sangramento com suspeita de placenta prévia; toque vaginal não é rotina."], ["Fazer toque para medir dilatação e decidir a conduta", "Pode agravar o sangramento."], ["Toque vaginal é rotina em toda consulta do 3º trimestre", "O PDF diz que não é rotina."], ["Toque é seguro se o BCF estiver normal e o útero relaxado", "BCF normal não torna seguro o toque."]], "pista": "Sangramento indolor no 3º trimestre = placenta prévia até prova em contrário: sem toque.", "pp": ["Toque vaginal: indicado conforme queixa, não rotina.", "Sangramento + suspeita de placenta prévia: evitar toque digital.", "Sangramento ativo: avaliação urgente."], "ap": "<p>PDF p. 15: “Avaliação obstétrica não inclui toque vaginal de rotina em toda consulta; indicar conforme queixa e cenário, evitar toque digital em sangramento com suspeita de placenta prévia até avaliação.” A IESC (p. 3) lista placenta prévia entre as alterações que exigem plano especializado e “sangramento ativo exige avaliação urgente”.<\/p>", "mud": [["Contrações regulares a termo sem sangramento", "Toque conforme cenário", "Indicação"]], "arm": "Tocar antes de afastar placenta prévia.", "ouro": "Sangrou no 3º trimestre: nada de toque antes da avaliação.", "m2": ["Sangramento é motivo de esperar o ambulatório?", "Não; sangramento significativo é urgência (IESC p. 4)."], "n": ["Toque não é rotina.", "Sangramento: sem toque.", "Avaliação urgente."], "loc": [{"f": "adu", "p": 15, "q": "Avaliação obstétrica não inclui toque vaginal de rotina em toda consulta; indicar conforme queixa e cenário, evitar toque digital em sangramento com suspeita de placenta prévia até avaliação.", "s": "
