<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#1d1f23;--mut:#5c6370;--line:#dedad3;--acc:#1f5f8b;--acc2:#e8f0f6;--ok:#1d6b3a;--okbg:#e6f3ea;--bad:#a12a2a;--badbg:#f8e7e7;--warn:#8a5a00;--warnbg:#fbf1dc;--ped:#8a3f8f;--adu:#2f6b3a;--iesc:#1f5f8b;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#e8e6e1;--mut:#a3a9b3;--line:#333842;--acc:#7db4dc;--acc2:#1f2b36;--ok:#7fd19b;--okbg:#17291e;--bad:#f19a9a;--badbg:#341c1c;--warn:#f0c46e;--warnbg:#33290f;--ped:#d3a1e0;--adu:#8fd19b;--iesc:#7db4dc;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap,.modal .box,.navbar{overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 80px max(14px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top)) 14px 8px}
.toprow{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme=dark] .btn.pri{color:#0f1419}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h1{font-size:22px;line-height:1.25;margin:8px 0 4px}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:16px;margin:16px 0 6px}
.mut{color:var(--mut)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
.tag.ped{color:var(--ped);border-color:var(--ped)}
.tag.adu{color:var(--adu);border-color:var(--adu)}
.tag.iesc{color:var(--iesc);border-color:var(--iesc)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{position:sticky;top:var(--hh,57px);z-index:20;background:var(--acc2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:4px 16px;font-weight:600;font-size:15px}
.stem{font-size:17px;margin:6px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;min-height:48px;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.sel{border-color:var(--acc)}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .st{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.lesson{border-top:2px solid var(--line);margin-top:16px;padding-top:8px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.toc button{font-size:13px;min-height:34px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.blk{margin:14px 0;padding-top:4px;scroll-margin-top:120px}
.blk>h3{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px}
.blk>h3 .bl{font-size:12px;color:var(--mut);font-weight:700}
.note{border-left:4px solid var(--acc);background:var(--acc2);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.note.warn{border-color:var(--warn);background:var(--warnbg)}
.note.ok{border-color:var(--ok);background:var(--okbg)}
.tw{margin:10px 0}
.tw .cap{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:4px}
table.t{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.t th{background:var(--acc2)}
@media(max-width:640px){table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}table.t thead{display:none}table.t tr{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:4px 0;background:var(--card)}table.t td{border:none;border-bottom:1px dashed var(--line);padding:6px 10px}table.t td:last-child{border-bottom:none}table.t td::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:var(--mut)}}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0}
.flow .st{border:1.5px solid var(--acc);border-radius:10px;padding:8px 12px;background:var(--card);font-size:14px}
.flow .ar{text-align:center;color:var(--acc);font-weight:700;line-height:1.2}
figure{margin:10px 0}
figure img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
figcaption{font-size:13px;color:var(--mut);margin-top:4px}
ol.pp{padding-left:22px}ol.pp li{margin:4px 0}
.altan{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.altan.c{border-color:var(--ok)}
.altan b.h{display:block}
details.m2{border:1px dashed var(--acc);border-radius:10px;padding:8px 12px}
details.m2 summary{cursor:pointer;font-weight:600;min-height:32px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.palette button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.palette .cur{outline:2px solid var(--acc)}
.palette .a{background:var(--acc2)}
.palette .ok{background:var(--okbg);border-color:var(--ok)}
.palette .bad{background:var(--badbg);border-color:var(--bad)}
.palette .mk{text-decoration:underline;font-weight:700}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.navbar .in{max-width:860px;margin:0 auto;display:flex;gap:8px}
.navbar .in .btn{flex:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:stretch;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:900px;margin:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.modal .bar{position:sticky;top:0;background:var(--card);display:flex;gap:8px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line);z-index:2}
.modal img.pg{width:100%;height:auto;border:1px solid var(--line);margin:8px 0;background:#fff}
.topics{display:grid;grid-template-columns:1fr;gap:8px}
.tp{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.tp .nm{flex:1;min-width:0}
.tp .ct{font-size:13px;color:var(--mut)}
label.ck{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 6px;border-radius:8px;cursor:pointer}
label.ck input{width:22px;height:22px;flex:0 0 22px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.conf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.conf button{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:2px 12px;font-size:14px;cursor:pointer}
.conf button.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}

.cropsc{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
.crop{position:relative;width:max(100%,620px);overflow:hidden;outline:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in;margin:6px 0}
.crop img{position:absolute;max-width:none;display:block}
.hl{position:absolute;background:rgba(255,214,0,.38);outline:2px solid #e0a800;border-radius:3px;mix-blend-mode:multiply;pointer-events:none}
.pgwrap{position:relative;width:100%;margin:8px 0;border:1px solid var(--line);background:#fff}
.pgwrap img{width:100%;height:auto;display:block}
.locbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card)}
.locbox .lh{font-size:14px;margin-bottom:4px}
.keyfig{margin:10px 0}
.keyfig img{max-height:420px;object-fit:contain;width:100%}
.ext{font-size:12px;color:var(--warn);font-weight:700}
</style>

<script id="DATA" type="application/json">{"topics": [{"id": "P15", "d": "ped", "aula": "Semana 15", "short": "Sigilo e gravidez na adolescência; alterações genitais", "n": "HAM Ped — Semana 15: comunicação sobre a quebra de sigilo diante de gravidez na adolescência; interpretação clínica das alterações do exame da genitália da criança e do adolescente", "pages": [["ped", 42], ["ped", 43], ["ped", 50], ["ped", 51], ["ped", 35], ["ped", 36], ["ped", 37]], "imgs": ["sv-sigilo", "sv-genital-menino", "sv-genital-menina"], "rev": "<p><b>Sigilo é a regra, com limites explicados antes.<\/b> A consulta do adolescente começa com ele e o responsável, e parte dela ocorre a sós. Antes das perguntas sensíveis, o médico explica os limites do sigilo, pergunta como o jovem prefere ser chamado e garante privacidade (HAM Ped, PDF p. 42). As informações são preservadas “com discernimento, inclusive diante dos responsáveis, salvo risco relevante ou dever legal de proteção”. As exceções citadas no material são violência, exploração sexual e risco grave de autoagressão; atividade sexual envolvendo menor de 14 anos exige avaliação protetiva e cumprimento dos deveres legais. O atendimento não é condicionado à presença dos pais nem a boletim de ocorrência, e não se promete segredo absoluto (PDF p. 42–43, 51).<\/p><p><b>Gravidez na adolescência.<\/b> O material trata a possibilidade de gravidez dentro da saúde sexual e reprodutiva (DUM, ciclos, testar quando indicado, avaliar segurança) e lembra que a primeira ovulação pode anteceder a menarca (PDF p. 46). A gestação, por si só, não é exceção ao sigilo: o que justifica a quebra é a presença de risco relevante, violência/coerção/exploração ou idade inferior a 14 anos. Quando a quebra é necessária, a frase-modelo do material orienta: “vou explicar o que precisamos fazer e buscar ajuda com você” — comunicar ao adolescente antes e compartilhar apenas o necessário. Suspeita de violência sexual: notificação à vigilância em até 24 h e comunicação ao Conselho Tutelar (PDF p. 50–51).<\/p><p><b>Alterações genitais: interpretar pelo mapa de raciocínio.<\/b> Alteração do meato → anomalia anatômica (hipospádia: meato ventral, prepúcio dorsal em capuz, curvatura — não circuncidar); alteração do prepúcio → avaliar cicatriz e perfusão (parafimose é urgência); bolsa vazia → localizar o testículo (retrátil permanece temporariamente; criptorquídico não); massa indolor → hidrocele (transilumina) × hérnia (varia com choro, redutível); dor escrotal súbita → torção até exclusão, sem atrasar por Doppler (PDF p. 35, 37). Na menina: sinéquia (não separar à força), corpo estranho (corrimento fétido/sanguinolento persistente), prolapso uretral (anel avermelhado ao redor do meato), hímen imperfurado, líquen escleroso; no RN, genitália atípica com vômitos/desidratação exige excluir crise adrenal (PDF p. 36–37). Achados genitais isolados não comprovam nem excluem abuso; não se faz “teste de virgindade”.<\/p>", "tab": [{"cap": "Alterações genitais do menino — reconhecer e conduzir (PDF p. 35)", "h": ["Alteração", "Achado-chave", "Conduta"], "r": [["Hipospádia", "Meato ventral, curvatura ventral, prepúcio dorsal em capuz", "Não circuncidar; urologia pediátrica; se proximal + testículos impalpáveis → avaliar DDS"], ["Epispádia", "Meato dorsal, possível incontinência", "Urologia pediátrica; investigar malformações"], ["Fimose", "Não retrátil fisiológico é comum", "Não forçar; corticoide tópico se indicado; encaminhar se cicatricial/refratária"], ["Parafimose", "Anel constritivo, edema, dor, alteração de perfusão", "Urgência: analgesia e redução por profissional; cirurgia se falha/isquemia"], ["Criptorquidia", "Bolsa vazia; testículo não permanece", "Encaminhar se não descer até 6 meses corrigidos; orquidopexia 6–12 (até 18) meses"], ["Hidrocele", "Aumento indolor, transilumina; comunicante varia no dia", "Observar no lactente; cirurgia se persistente/comunicante"], ["Hérnia inguinal", "Abaulamento ao choro, redutível", "Cirurgia; dolorosa/irredutível = urgência"], ["Torção testicular", "Dor súbita, náusea, testículo alto/horizontal, cremastérico ausente", "Emergência cirúrgica; não atrasar por US"]]}, {"cap": "Sigilo — o que o material autoriza (PDF p. 42–43, 50–51)", "h": ["Situação", "Sigilo", "Ação"], "r": [["Adolescente com discernimento, sem risco", "Preservado, inclusive diante dos responsáveis", "Atender, orientar, dupla proteção, seguimento"], ["Gravidez sem risco, sem violência, ≥ 14 anos", "Regra continua sendo o sigilo", "Pré-natal, apoio para decidir como contar à família"], ["Violência, coerção, exploração (inclusive digital)", "Exceção", "Proteger, notificar, acionar rede"], ["Risco grave de autoagressão", "Exceção", "Proteger e encaminhar"], ["Atividade sexual < 14 anos", "Dever legal de proteção", "Avaliação protetiva, notificação, Conselho Tutelar"]]}], "cmp": {"cap": "Massa ou dor escrotal: como diferenciar", "h": ["Achado", "Hidrocele", "Hérnia inguinal", "Torção"], "r": [["Dor", "Ausente", "Variável; intensa se encarcerada", "Súbita e intensa, com náusea"], ["Transiluminação", "Positiva (sugere líquido)", "Em geral negativa", "Não orienta conduta"], ["Variação", "Comunicante varia ao longo do dia", "Aumenta ao choro; redutível", "Testículo alto/horizontal"], ["Conduta", "Observar lactente; cirurgia se persistente", "Cirurgia; urgência se irredutível", "Cirurgia imediata, sem esperar Doppler"]]}, "flow": {"cap": "Quebra de sigilo responsável", "s": ["Explicar os limites do sigilo antes das perguntas", "Entrevistar a sós (HEADSSS, perguntas abertas)", "Identificar exceção: risco grave, violência/exploração, < 14 anos", "Comunicar ao adolescente o que será feito e por quê", "Compartilhar só o necessário; notificar e acionar rede", "Manter vínculo e seguimento"]}, "refs": ["HAM Ped — Complemento OSCE: Consulta do adolescente; Adolescente — entrevista e exame; Alterações genitais (menino; menina e RN); Geniturinário — diferenciais; Violência sexual (PDF p. 35–37, 42–43, 50–51).", "SBP. Criptorquidismo; Ministério da Saúde. Linhas de cuidado: Hebicultura; VIVA/SINAN; Violência sexual (referências do complemento, PDF p. 53).", "Complemento externo, sinalizado nas questões: Código Penal art. 217-A (estupro de vulnerável, menor de 14 anos); ECA art. 13 (comunicação obrigatória ao Conselho Tutelar)."]}, {"id": "P16", "d": "ped", "aula": "Semana 16", "short": "Exame da genitália e marcos da puberdade", "n": "HAM Ped — Semana 16: exame da genitália da criança e do adolescente; exame clínico dos marcos da puberdade", "pages": [["ped", 34], ["ped", 43], ["ped", 44], ["ped", 45], ["ped", 37]], "imgs": ["sv-puberdade", "sv-orquidometro", "sv-tanner", "sv-genital-menino"], "rev": "<p><b>Exame genital: externo, respeitoso e com finalidade clínica.<\/b> Explicar o que será feito, oferecer acompanhante/chaperone e não forçar o exame em criança resistente, salvo urgência com abordagem especializada. Decúbito dorsal com exposição mínima; menina em posição de rã (quadris e joelhos fletidos e abduzidos); menino em decúbito dorsal ou sentado de pernas cruzadas se o reflexo cremastérico for intenso. Inspeção antes da palpação (HAM Ped, PDF p. 34).<\/p><p><b>O que avaliar.<\/b> Abdome e flancos (bexiga palpável, dor), no menino posição do meato, curvatura, prepúcio sem retração forçada, presença e localização dos dois testículos, palpando gentilmente do canal inguinal à bolsa; na menina grandes/pequenos lábios, clitóris, meato, introito, aderências e lesões, com afastamento labial suave; períneo/ânus só por inspeção se indicado. No adolescente, estágio puberal com consentimento e exame genital apenas quando indicado — sem toque vaginal ou especular de rotina na criança. <b>Manobras:<\/b> transiluminação (luz atravessa = líquido, mas não exclui outras causas); deslizar a mão da região inguinal para a bolsa (retrátil desce e fica temporariamente); reflexo cremastérico (ausência sugere torção, presença não exclui); sinal de Prehn não serve para descartar torção (PDF p. 34).<\/p><p><b>Marcos puberais.<\/b> Meninas: telarca 8–13 anos, estirão antes da menarca, menarca geralmente 2–3 anos após a telarca. Meninos: aumento testicular (≥ 4 mL) 9–14 anos, seguido de crescimento peniano e estirão mais tardio. Investigar ausência de telarca aos 13 ou volume testicular < 4 mL aos 14; puberdade precoce antes dos 8 (meninas) ou 9 (meninos). Registrar M/G e P separadamente: pelos pubianos dependem sobretudo de andrógenos adrenais, então pubarca isolada não comprova ativação gonadal (PDF p. 44–45).<\/p>", "tab": [{"cap": "Marcos e limites (PDF p. 44)", "h": ["Marco", "Meninas", "Meninos"], "r": [["Primeiro sinal puberal", "Telarca (M2), 8–13 anos", "Testículos ≥ 4 mL (G2), 9–14 anos"], ["Sequência", "Estirão antes da menarca; menarca 2–3 anos após telarca", "Pênis cresce depois; estirão mais tardio"], ["Precoce", "Antes dos 8 anos", "Antes dos 9 anos"], ["Investigar atraso", "Sem telarca aos 13", "Volume < 4 mL aos 14"]]}, {"cap": "Posição e técnica (PDF p. 34)", "h": ["Item", "Como fazer"], "r": [["Menina", "Posição em rã; inspeção externa; afastamento labial suave se necessário"], ["Menino", "Decúbito dorsal ou sentado de pernas cruzadas se cremastérico intenso"], ["Testículo", "Mão desliza da região inguinal à bolsa"], ["Transiluminação", "Local escurecido; luz sobre massa indolor"], ["Cremastérico", "Estímulo da face medial da coxa → elevação ipsilateral"], ["Registro", "Localização, tamanho, simetria, cor, dor, secreção — sem inferir diagnóstico pelo aspecto isolado"]]}], "cmp": {"cap": "Testículo retrátil × criptorquídico", "h": ["", "Retrátil", "Criptorquídico"], "r": [["Manobra inguinal → bolsa", "Pode ser levado à bolsa", "Não alcança a bolsa"], ["Após soltar", "Permanece temporariamente", "Não permanece"], ["Conduta", "Observação/seguimento", "Encaminhar se não desceu até 6 meses corrigidos"]]}, "flow": {"cap": "Sequência do exame genital pediátrico", "s": ["Explicar, pedir assentimento/consentimento, oferecer acompanhante", "Posicionar (rã na menina; pernas cruzadas se cremastérico intenso)", "Abdome e flancos", "Inspeção genital externa antes de palpar", "Palpação gentil (inguinal → bolsa) e manobras indicadas", "Estadiar Tanner (M/G e P separados)", "Registrar sem inferir diagnóstico pelo aspecto isolado"]}, "refs": ["HAM Ped — Exame clínico geniturinário; Adolescente — entrevista e exame; Tanner e amenorreia primária (PDF p. 34, 43–45).", "SBP. Como avaliar e tratar adolescentes com puberdade atrasada (2022), citado no PDF p. 47."]}, {"id": "P17", "d": "ped", "aula": "Semana 17", "short": "Tanner, amenorreia primária e amamentação", "n": "HAM Ped — Semana 17: classificação de Tanner e amenorreia primária; técnicas de amamentação e posicionamento da criança para a pega correta", "pages": [["ped", 44], ["ped", 45], ["ped", 46], ["ped", 47], ["ped", 48], ["ped", 49]], "imgs": ["sv-tanner", "sv-amenorreia", "sv-pega", "sv-lactacao"], "rev": "<p><b>Tanner.<\/b> Mamas: M1 pré-puberal; M2 broto; M3 mama aumenta sem contorno secundário; M4 aréola e papila formam elevação secundária; M5 contorno adulto com papila projetada. Genital masculino: G2 testículos ≥ 4 mL e mudança de textura da bolsa; G3 crescimento do pênis em comprimento; G4 aumento de diâmetro/glande e escurecimento da bolsa; G5 adulto. Pelos: P2 escassos e finos na base; P3 mais escuros e grossos; P4 tipo adulto em área menor; P5 alcança a face medial das coxas (HAM Ped, PDF p. 44).<\/p><p><b>Amenorreia primária.<\/b> Investigar se não houver menarca aos 15 anos ou mais de 3 anos após a telarca, e se não houver mamas aos 13; dor cíclica/obstrução exige avaliação antes desses limites. Toda amenorreia: excluir gestação (a primeira ovulação pode anteceder a menarca), dosar FSH, LH, estradiol, TSH e prolactina e fazer US pélvico. <b>Sem mamas:<\/b> FSH alto = falência gonadal (Turner/disgenesia → cariótipo); FSH baixo/normal = atraso constitucional, déficit energético, doença crônica ou causa central (Kallmann se anosmia). <b>Com mamas:<\/b> útero ausente = MRKH (46,XX, pelos habituais) × insensibilidade androgênica completa (46,XY, pelos escassos, possível massa inguinal); útero presente com dor cíclica = obstrução de saída (hímen imperfurado, septo); sem obstrução = gravidez, anovulação, distúrbio endócrino. Não iniciar anticoncepcional só para produzir sangramento (PDF p. 44–47).<\/p><p><b>Amamentação.<\/b> Observar uma mamada inteira. Alinhamento orelha–ombro–quadril, barriga do bebê voltada para a mãe, nariz na altura do mamilo, esperar boca bem aberta e aproximar o bebê à mama, queixo primeiro. Pega adequada: boca bem aberta, lábio inferior evertido, queixo tocando a mama, mais aréola visível acima da boca, sucções profundas com deglutição audível e sem dor persistente. Aleitamento exclusivo até 6 meses em livre demanda, sem água ou chá; complementar a partir de 6 meses, mantendo até 2 anos ou mais. Sinais de ingestão suficiente: deglutição audível, ≥ 6 fraldas molhadas/dia após o 5º dia, ganho ponderal; perda ≥ 10% exige avaliação cuidadosa, sem fórmula automática (PDF p. 48–49).<\/p>", "tab": [{"cap": "Amenorreia primária — casos de prova (PDF p. 47)", "h": ["Caso", "Hipótese"], "r": [["13 anos, M1, baixa estatura, FSH alto", "Turner/disgenesia gonadal"], ["15 anos, M4, cólicas mensais sem fluxo", "Obstrução genital (hímen imperfurado/septo)"], ["16 anos, M5, P5, útero ausente", "MRKH"], ["16 anos, M5, P1/P2, útero ausente", "Insensibilidade androgênica"], ["16 anos, atleta, perda de peso, FSH e estradiol baixos", "Supressão hipotalâmica funcional"]]}, {"cap": "Posições para amamentar (PDF p. 48)", "h": ["Posição", "Quando ajuda"], "r": [["Tradicional/berço", "Rotina; cabeça no antebraço do lado da mama"], ["Berço cruzado", "Ajustar pega em RN pequeno"], ["Invertida/futebol americano", "Após cesárea; gêmeos"], ["Deitada de lado", "Mãe acordada e atenta; bebê volta ao próprio local de sono"], ["Semirreclinada", "Contato pele a pele, via aérea livre"]]}], "cmp": {"cap": "MRKH × insensibilidade completa aos andrógenos (PDF p. 46)", "h": ["", "MRKH", "Insensibilidade androgênica"], "r": [["Cariótipo", "46,XX", "46,XY"], ["Gônadas", "Ovários funcionantes", "Testículos (AMH → sem útero)"], ["Mamas", "Presentes", "Presentes (aromatização)"], ["Pelos pubianos/axilares", "Habituais", "Escassos"], ["Pistas", "Pesquisar anomalias renais e esqueléticas", "Pode haver massa inguinal; testosterona"]]}, "flow": {"cap": "Corrigir a pega — passo a passo", "s": ["Mãe confortável; bebê próximo, orelha–ombro–quadril alinhados", "Sustentar a mama em C, dedos longe da aréola", "Nariz na altura do mamilo; tocar o lábio superior", "Esperar a boca bem aberta", "Aproximar o bebê à mama, queixo primeiro, sem empurrar a cabeça", "Verificar deglutição e conforto"]}, "refs": ["HAM Ped — Tanner e amenorreia primária; mecanismos e causas; mamas presentes; estação prática; Amamentação — técnica e pega; avaliação de dificuldades (PDF p. 44–49).", "ASRM. Current evaluation of amenorrhea (2024); SBP. Puberdade atrasada (2022) — citados no PDF p. 47."]}, {"id": "A15", "d": "adu", "aula": "Semana 15", "short": "Diagnóstico da gravidez, 1ª consulta e caderneta", "n": "HAM Adulto — Semana 15: diagnóstico da gravidez, primeira consulta pré-natal e Caderneta da Gestante", "pages": [["adu", 7], ["adu", 8], ["adu", 9], ["adu", 10], ["adu", 11], ["adu", 13]], "imgs": ["sv-sinais-gravidez", "sv-hcg-us", "sv-dpp", "sv-glicemia", "adu-exames-ig", "adu-ig-tabela"], "rev": "<p><b>Diagnóstico.<\/b> Sinais de presunção (amenorreia, náuseas, mastalgia, polaciúria, fadiga) sugerem; sinais de probabilidade (aumento uterino, Goodell — amolecimento cervical, Hegar — amolecimento do istmo, Chadwick/Jacquemier — coloração violácea vaginal, hCG positivo) reforçam; sinais de certeza são embrião/feto na US, atividade cardíaca fetal e movimentos fetais percebidos pelo examinador. O hCG é secretado pelo sinciciotrofoblasto após a implantação e não confirma localização nem viabilidade. β-hCG sérico: < 5 mUI/mL usualmente negativo, 5–25 indeterminado, ≥ 25 positivo. Na US transvaginal: saco gestacional ~5 semanas, vesícula vitelínica ~5–6, embrião/atividade cardíaca ~6–7; não declarar perda por uma US precoce inconclusiva; dor unilateral intensa, síncope e sangramento exigem excluir ectópica (HAM Adulto, PDF p. 7).<\/p><p><b>Datação.<\/b> IG pela DUM confiável: dias entre DUM e consulta ÷ 7 (quociente = semanas, resto = dias). US precoce pelo CCN data melhor se a DUM é incerta ou discordante; não redatar a cada US tardia. DPP por Näegele: DUM + 7 dias − 3 meses (+1 ano) ≈ 280 dias; é estimativa (PDF p. 7).<\/p><p><b>Primeira consulta (idealmente até 12 semanas).<\/b> Anamnese ampla (social, obstétrica, ginecológica, IST, crônicas, medicamentos, imunizações, hábitos, saúde mental e violência em privacidade); classificar risco a cada consulta. Exame: PA com manguito correto, peso, altura, IMC, mucosas, tireoide, ausculta, abdome, membros; mamas só se queixa/indicação, sem expressão papilar de rotina; não exigir AU e BCF quando não detectáveis. Exames: hemograma (Hb < 11 sugere anemia), ABO/Rh e Coombs indireto se Rh negativo, glicemia de jejum (< 92 programar TOTG; 92–125 DMG; ≥ 126 diabetes manifesto), HIV, sífilis, HBsAg, anti-HCV, toxoplasmose IgG/IgM, EAS e urocultura, eletroforese de Hb e HTLV, US obstétrica (7–12 sem). Suplementos: ácido fólico 400 µg (5 mg só com risco elevado de DTN), ferro profilático, cálcio 1.000 mg da 12ª semana ao parto separado do ferro por 2 h; AAS não universal. Vacinas: influenza, dTpa ≥ 20 sem em cada gestação, hepatite B se incompleta, covid-19, VSR ≥ 28 sem; tríplice viral e varicela contraindicadas (PDF p. 7, 10–11).<\/p><p><b>Caderneta.<\/b> Registrar DUM, IG, DPP e método de datação, antecedentes, risco, peso/IMC inicial, grupo/Rh, exames com datas; em cada consulta peso, PA, AU, BCF, movimentos, apresentação, edema, queixas e condutas, plotando AU e peso; vacinas, ferro/cálcio, referência e retorno. A caderneta acompanha a gestante em todas as consultas e na maternidade (PDF p. 13).<\/p>", "tab": [{"cap": "Exames iniciais e próxima ação (PDF p. 10)", "h": ["Exame", "Interpretação e ação"], "r": [["Hemograma", "Hb < 11 g/dL sugere anemia; investigar ferro e tratar conforme gravidade"], ["ABO/Rh + Coombs (Rh−)", "Coombs + → tipar anticorpo e encaminhar; − → repetir e programar anti-D"], ["Glicemia de jejum", "< 92 TOTG; 92–125 DMG; ≥ 126 diabetes manifesto"], ["HIV, sífilis, HBsAg, anti-HCV", "Triagem e confirmação; conduta oportuna sem aguardar sintomas"], ["Toxoplasmose IgG/IgM", "Suscetibilidade × infecção passada × suspeita recente"], ["EAS e urocultura", "Bacteriúria assintomática exige tratamento e controle"], ["Eletroforese de Hb, HTLV", "Oferta prevista na caderneta brasileira"], ["US obstétrica", "7–12 semanas: localização, viabilidade, número fetal, datação"]]}], "cmp": {"cap": "Sinais de gravidez", "h": ["Classe", "Exemplos", "Valor"], "r": [["Presunção", "Amenorreia, náuseas, mastalgia, polaciúria, fadiga", "Sugerem"], ["Probabilidade", "Útero aumentado, Goodell, Hegar, Chadwick/Jacquemier, hCG +", "Reforçam"], ["Certeza", "Embrião/feto na US, atividade cardíaca, movimentos percebidos pelo examinador", "Confirmam"]]}, "flow": {"cap": "Primeira consulta", "s": ["Confirmar gravidez (teste urinário/β-hCG; US se dúvida, dor ou sangramento)", "Datar: IG pela DUM ou CCN; DPP por Näegele", "Anamnese completa e violência em privacidade", "Exame físico inicial", "Exames iniciais", "Suplementação e vacinas", "Classificar risco e registrar na caderneta"]}, "refs": ["HAM IV — Manual de Semiologia, cap. 14 (Diagnóstico da gravidez e primeira consulta) e cap. 15.2 (Caderneta), PDF p. 7–11 e 13 (rodapé p. 40–44).", "Brasil. Ministério da Saúde. Caderneta da Gestante; Calendário Nacional de Vacinação."]}, {"id": "A16", "d": "adu", "aula": "Semana 16", "short": "Gestante no 2º e 3º trimestres", "n": "HAM Adulto — Semana 16: abordagem clínica da gestante no 2º e 3º trimestres", "pages": [["adu", 12], ["adu", 13], ["adu", 14], ["adu", 15], ["adu", 8], ["adu", 9], ["adu", 17], ["adu", 18], ["adu", 19]], "imgs": ["adu-leopold-slide", "adu-p15-0", "adu-au-figura", "adu-au-curva", "adu-estatica", "sv-calendario", "sv-has", "sv-rh", "sv-glicemia"], "rev": "<p><b>Calendário e conteúdo.<\/b> Consultas em geral mensais até 28 semanas, quinzenais de 28 a 36 e semanais a partir de 36, adaptadas ao risco; não existe alta do pré-natal no termo. Em cada contato: queixas, alarme, PA, peso, edema, IG, AU e BCF, movimentos fetais, exames, medicamentos, vacinas, risco e orientação. 2º trimestre (14–27s6d): AU e BCF seriados, TOTG 75 g entre 24–28 semanas se indicado, Coombs se Rh negativo não sensibilizado, toxo se suscetível, US morfológica (18–24 sem). 3º trimestre (≥ 28): crescimento, apresentação, PA e sinais de pré-eclâmpsia, repetir hemograma, glicemia, sífilis/HIV, EAS/urocultura, rever maternidade, plano de parto e sinais de trabalho de parto (HAM Adulto, PDF p. 12). Pesquisa de estreptococo do grupo B 35–37 semanas e avaliação obstétrica com 41 semanas (PDF p. 9).<\/p><p><b>TOTG 75 g.<\/b> Um valor ≥ 92 (jejum) / 180 (1 h) / 153 (2 h) confirma DMG; diferenciar diabetes manifesto (ex.: 2 h ≥ 200). <b>Hipertensão:<\/b> PA ≥ 140/90 repetida; após 20 semanas, hipertensão nova com proteinúria (P/C ≥ 0,3 ou ≥ 300 mg/24 h) ou disfunção orgânica sugere pré-eclâmpsia, que pode existir sem proteinúria; PA ≥ 160/110, cefaleia intensa, alteração visual, dor epigástrica/HCD, dispneia ou convulsão = urgência; edema isolado não diagnostica. <b>Rh negativo:<\/b> Coombs indireto negativo → anti-D ~28 semanas (300 µg IM) e até 72 h após parto de RN Rh positivo/desconhecido e após eventos sensibilizantes; Coombs positivo → caracterizar anticorpo e referenciar (PDF p. 12).<\/p><p><b>Semiologia obstétrica.<\/b> Esvaziar a bexiga; decúbito dorsal com cabeceira elevada; inclinação lateral esquerda se mal-estar. AU: fita inelástica do bordo superior da sínfise ao fundo, no eixo longitudinal; de ~20 a ~36 semanas AU (cm) ≈ IG, mas vale a curva seriada; abaixo: datação, técnica, oligodrâmnio, RCF; acima: datação, gemelaridade, polidrâmnio, macrossomia, mioma — confirmar com US se persistir. Leopold: 1º fundo, 2º lados (dorso × pequenas partes; define ausculta), 3º apresentação e mobilidade, 4º descida (examinador voltado para os pés). BCF: Doppler a partir de 10–12 sem, Pinard após ~20; sobre o dorso (cefálica abaixo do umbigo, pélvica acima); contar 1 minuto; comparar com o pulso materno; 110–160 bpm. Redução de movimentos exige avaliação. Toque vaginal não é rotina e é evitado no sangramento com suspeita de placenta prévia (PDF p. 14–15).<\/p><p><b>TORCHS no seguimento.<\/b> Sífilis: teste rápido na 1ª consulta, 3º trimestre e parto; se reagente, VDRL quantitativo e penicilina imediata; tardia/duração ignorada 2,4 milhões UI semanais × 3 (reiniciar se intervalo > 9 dias); queda de 4 vezes = duas diluições; tratamento iniciado ≥ 30 dias antes do parto. Toxoplasmose: avidez alta até 16 semanas exclui aquisição gestacional; espiramicina antes de 16 semanas. HIV: carga viral perto do parto define AZT IV e via (≥ 1.000 cópias ou desconhecida → cesárea programada); não amamentar no Brasil (PDF p. 17–19).<\/p>", "tab": [{"cap": "Leopold-Zweifel (PDF p. 14)", "h": ["Tempo", "Como", "O que encontra"], "r": [["1º fundo", "Mãos circundam o fundo uterino", "Cabeça dura, arredondada, móvel × nádegas macias, irregulares"], ["2º lados", "Estabiliza um lado e palpa o outro", "Dorso liso e resistente × pequenas partes; define local do BCF"], ["3º apresentação", "Uma mão acima do púbis circunda o polo inferior", "Polo apresentado e mobilidade (móvel = provavelmente não insinuado)"], ["4º descida", "Examinador voltado para os pés; dedos para a pelve", "Grau de descida; flexão/extensão cefálica"]]}, {"cap": "AU fora da curva (PDF p. 14)", "h": ["Abaixo", "Acima"], "r": [["Erro de datação", "Erro de datação"], ["Técnica/posição", "Gemelaridade"], ["Oligodrâmnio", "Polidrâmnio"], ["Restrição de crescimento", "Macrossomia; mioma"]]}], "cmp": {"cap": "Hipertensão após 20 semanas", "h": ["", "HAS gestacional", "Pré-eclâmpsia", "Gravidade"], "r": [["Definição", "Hipertensão nova sem proteinúria/disfunção", "Hipertensão + proteinúria OU disfunção orgânica", "PA ≥ 160/110 ou sintomas"], ["Exames", "Monitorar", "Plaquetas, creatinina, transaminases, proteinúria, vitalidade fetal", "Idem + urgência"], ["Conduta", "Seguimento próximo", "Avaliação obstétrica imediata", "Estabilizar e transferir"]]}, "flow": {"cap": "Consulta de seguimento (2º/3º trimestres)", "s": ["Queixas e sinais de alarme", "PA (técnica correta), peso, edema", "AU com fita e plotagem na curva", "Leopold (3º trimestre) e BCF sobre o dorso, 1 minuto", "Movimentos fetais", "Exames do trimestre e condutas (TOTG, Coombs/anti-D, sífilis/HIV)", "Registrar na caderneta e orientar retorno/maternidade"]}, "refs": ["HAM IV — Manual de Semiologia, cap. 15 (Seguimento pré-natal e caderneta), cap. 16 (Semiologia obstétrica), cap. 18 (TORCHS), PDF p. 12–15 e 17–19; tabelas e figuras das p. 8–9.", "Brasil. Ministério da Saúde. Diretriz MS 100/2022 (toxoplasmose), citada no PDF p. 18."]}, {"id": "A17", "d": "adu", "aula": "Semana 17", "short": "Nódulos mamários", "n": "HAM Adulto — Semana 17: manifestações clínicas dos nódulos mamários (exame clínico das mamas)", "pages": [["adu", 21], ["adu", 22], ["adu", 23], ["adu", 24]], "imgs": ["adu-p22-0", "adu-p22-2", "adu-p22-3", "adu-p22-4", "adu-p23-0", "adu-p23-1", "adu-p23-2", "adu-p23-3", "adu-p24-0", "sv-birads", "sv-nodulo"], "rev": "<p><b>Biologia.<\/b> A mama contém tecido glandular (lobos/lóbulos e ductos), gordura, estroma e ligamentos de Cooper; a cauda axilar prolonga o tecido superolateralmente e a drenagem é principalmente axilar. Tumores benignos crescem de forma expansiva, sem invasão; malignos invadem, retraem ligamentos/pele, obstruem linfáticos (casca de laranja) e metastatizam. Nenhuma característica palpável isolada confirma benignidade (HAM Adulto, PDF p. 21).<\/p><p><b>Manifestações.<\/b> Fibroadenoma: jovem, fibroelástico, móvel, bem delimitado, indolor. Cisto: liso, móvel, varia com o ciclo, às vezes doloroso; a US define simples/complexo. Alterações fibrocísticas: nodularidade e mastalgia cíclicas, frequentemente bilaterais. Mastite/abscesso: dor, calor, rubor, febre; flutuação sugere coleção; mastite que não resolve exige rever diagnóstico. Carcinoma: massa nova endurecida, irregular, fixa, indolor, retração, alteração mamilar ou linfonodo suspeito — mas pode ser móvel ou doloroso. Alarmes: massa persistente, retração nova, descarga espontânea unilateral uniductal sanguinolenta/serosa, casca de laranja, adenopatia dura e fixa (PDF p. 21).<\/p><p><b>Exame.<\/b> Lateralidade da paciente; quadrantes QSE/QSL, QSI/QSM, QIE/QIL, QII/QIM; relógio em visão frontal (na mama direita 9 h é lateral; na esquerda 3 h é lateral); registrar mama, hora, quadrante, distância do mamilo e tamanho. Inspeção sentada (estática; dinâmica com braços elevados, mãos na cintura contraindo peitorais, inclinação opcional) — consistência é palpação, não inspeção. Linfonodos sentada: supra e infraclaviculares; axila com antebraço sustentado, explorando paredes anterior, posterior, lateral, central e apical. Palpação deitada, mão atrás da cabeça, da clavícula ao sulco inframamário e do esterno à linha axilar, com cauda axilar e região retroareolar; Velpeaux (mão espalmada, circular) e Bloodgood (polpas de três dedos “tocando piano”, pressão leve, média e profunda); trajeto vertical, radial ou circular, sem obrigação de iniciar pelo mamilo. Expressão papilar apenas se houver descarga (PDF p. 21–24).<\/p><p><b>Investigação.<\/b> Concordância clínica–imagem–histologia. < 30 anos e gestação: US primeiro; a partir de 30–40 anos: mamografia diagnóstica + US. Imagem negativa não encerra suspeita clínica alta. Core biopsy para sólido suspeito; PAAF em cisto selecionado. BI-RADS classifica imagem, não estadia tumor (0 completar; 1–2 rotina; 3 ≤ 2% controle ~6 meses; 4A/4B/4C biópsia; 5 ≥ 95% biópsia e encaminhamento rápido; 6 malignidade confirmada). Rastreamento depende de idade/risco; investigação de sintoma é indicada independentemente da idade (PDF p. 24).<\/p>", "tab": [{"cap": "Manifestações típicas (PDF p. 21)", "h": ["Doença", "Manifestações"], "r": [["Fibroadenoma", "Jovens; fibroelástico, móvel, bem delimitado, geralmente indolor"], ["Cisto", "Liso, móvel, varia com o ciclo, às vezes doloroso; US define simples/complexo"], ["Alterações fibrocísticas", "Nodularidade e mastalgia cíclicas, frequentemente bilaterais"], ["Mastite/abscesso", "Dor, calor, rubor, febre; flutuação sugere coleção"], ["Carcinoma", "Massa nova endurecida, irregular, fixa, indolor; retração, alteração mamilar, linfonodo suspeito (pode ser móvel/doloroso)"]]}, {"cap": "BI-RADS (PDF p. 24)", "h": ["Categoria", "Risco", "Conduta"], "r": [["0", "Incompleto", "Completar imagem/comparar"], ["1", "Negativo", "Rotina se concordante"], ["2", "Benigno", "Rotina"], ["3", "≤ 2%", "Controle curto (~6 meses)"], ["4A / 4B / 4C", ">2–10% / >10–50% / >50–<95%", "Biópsia"], ["5", "≥ 95%", "Biópsia e encaminhamento rápido"], ["6", "Malignidade confirmada", "Planejamento terapêutico"]]}], "cmp": {"cap": "Descarga papilar", "h": ["", "Mais suspeita", "Menos suspeita"], "r": [["Espontaneidade", "Espontânea", "Provocada"], ["Lateralidade", "Unilateral", "Bilateral"], ["Ductos", "Uniductal", "Multiductal"], ["Aspecto", "Sanguinolenta/serosa", "Galactorreia fora da lactação: medicamentos, gravidez, prolactina, TSH"]]}, "flow": {"cap": "Exame clínico das mamas (OSCE)", "s": ["Acompanhante, privacidade, explicar etapas", "Inspeção estática sentada", "Inspeção dinâmica (braços elevados; mãos na cintura; inclinação)", "Linfonodos supra/infraclaviculares e axilares (sentada)", "Palpação deitada: Velpeaux + Bloodgood, sem áreas descobertas", "Expressão papilar só se descarga", "Descrever lesão e planejar imagem/biópsia sem afirmar diagnóstico"]}, "refs": ["HAM IV — Manual de Semiologia, cap. 19 (Nódulos mamários e exame clínico das mamas), PDF p. 21–24 (rodapé p. 52–55); figuras do roteiro institucional.", "ACR BI-RADS (categorias reproduzidas no PDF p. 24)."]}, {"id": "I15", "d": "iesc", "aula": "Semana 15", "short": "Pré-natal de alto risco na APS", "n": "IESC — Semana 15: abordagem da mulher na consulta pré-natal de alto risco na APS", "pages": [["iesc", 1], ["iesc", 2], ["iesc", 3], ["iesc", 4], ["iesc", 8]], "imgs": ["sv-fluxo-ar", "sv-risco", "sv-has", "sv-glicemia", "sv-urgencia", "sv-suplementos"], "rev": "<p><b>Conceito e classificação.<\/b> Gestação de alto risco é a condição materna, fetal ou obstétrica que aumenta a probabilidade de complicações, adoecimento ou morte; o risco muda e é reavaliado a cada consulta. Classificação nacional: risco habitual (UBS e equipe de saúde da família), risco intermediário (vulnerabilidades como idade extrema, baixo apoio familiar, tabagismo, obesidade, antecedentes obstétricos — vigilância ampliada, não internação automática) e alto risco (HAS crônica, diabetes prévio, cardiopatia, nefropatia, lúpus, gestação múltipla, RCF, isoimunização Rh — pré-natal compartilhado). Minas Gerais (nota técnica 2024) organiza o fluxo em risco habitual e alto risco, além das urgências (IESC, PDF p. 1).<\/p><p><b>Responsabilidades da APS.<\/b> Identificar precocemente (até 12 semanas), estratificar, solicitar exames, iniciar prevenção, tratar o que é de sua competência e encaminhar de forma responsável. Encaminhar não é dar alta: a APS continua coordenando adesão, vacinas, saúde bucal, condições sociais, visitas domiciliares e intercorrências. Fluxo: UBS → estratificação → regulação/ambulatório de alto risco → plano compartilhado e contrarreferência → maternidade vinculada → puerpério na APS. Rede Alyne: mínimo de sete consultas intercaladas entre médico e enfermeiro; mensal até 28, quinzenal 28–36, semanal ≥ 36; alto risco pode exigir intervalos menores; não existe alta antes do nascimento (PDF p. 1).<\/p><p><b>Situações principais.<\/b> HAS crônica (≥ 140/90 antes da gestação ou < 20 sem, ou persistente > 12 sem pós-parto; IECA/BRA contraindicados); HAS gestacional; pré-eclâmpsia (com proteinúria ou disfunção orgânica); gravidade (≥ 160/110, cefaleia persistente, escotomas, epigastralgia, dispneia, oligúria, convulsão) exige manejo urgente; AAS em baixa dose para risco aumentado, idealmente iniciado entre 12 e 16 semanas. Diabetes: jejum na 1ª consulta < 92 → TOTG; 92–125 → DMG; ≥ 126 → suspeita de manifesto; metas jejum < 95, 1 h < 140, 2 h < 120; insulina se controle insuficiente; diabetes prévio e DMG com necessidade farmacológica → atenção especializada. Rh negativo: anti-D em não sensibilizada (antenatal, eventos sensibilizantes, até 72 h pós-parto). Sífilis: penicilina benzatina sem atrasar por encaminhamento, tratar parceria; HIV: vincular ao SAE; bacteriúria: tratar por urocultura; pielonefrite: hospital. Gestação múltipla, RCF, placenta prévia, malformações, alterações do líquido: plano especializado; sangramento ativo: urgência (PDF p. 3). Sinais que não aguardam o ambulatório e fluxo de urgência com SAMU/regulação, sem mandar a gestante buscar vaga sozinha (PDF p. 4).<\/p>", "tab": [{"cap": "Classificação de risco (PDF p. 1)", "h": ["Nível", "Exemplos", "Onde/como"], "r": [["Habitual", "Sem condição que exija especialista", "UBS/ESF"], ["Intermediário (nacional)", "Idade extrema, baixo apoio, tabagismo, obesidade, antecedentes obstétricos", "Vigilância ampliada; apoio especializado eventual; não é internação"], ["Alto risco", "HAS crônica, DM prévio, cardiopatia, nefropatia, lúpus, gemelar, RCF, isoimunização", "Pré-natal compartilhado com especialista"]]}, {"cap": "Diabetes na gestação (PDF p. 3)", "h": ["Momento", "Valor", "Interpretação"], "r": [["Jejum 1ª consulta", "< 92", "TOTG 75 g 24–28 sem"], ["Jejum 1ª consulta", "92–125", "DMG"], ["Jejum 1ª consulta", "≥ 126", "Suspeita de diabetes manifesto"], ["TOTG", "jejum ≥ 92, 1 h ≥ 180, 2 h ≥ 153 (um basta)", "DMG"], ["Metas", "jejum < 95, 1 h < 140, 2 h < 120", "Insulina se controle insuficiente"]]}], "cmp": {"cap": "Risco intermediário × alto risco", "h": ["", "Intermediário", "Alto risco"], "r": [["Natureza", "Vulnerabilidade/fator de risco", "Doença materna ou complicação obstétrica/fetal"], ["Local", "APS com vigilância ampliada", "Compartilhado com ambulatório especializado"], ["Armadilha", "Não significa internação", "Não significa alta da UBS"]]}, "flow": {"cap": "Fluxo do alto risco", "s": ["Captação até 12 semanas na UBS", "Estratificação de risco (repetida a cada consulta)", "Regulação para ambulatório de alto risco", "Plano compartilhado e contrarreferência — APS segue coordenando", "Maternidade vinculada", "Retorno ao puerpério na APS"]}, "refs": ["IESC IV — N3, PDF p. 1–4 e 8 (Pré-natal de alto risco na APS; Consulta passo a passo; Principais situações; Prevenção, suporte e urgências; Revisão).", "Brasil. Ministério da Saúde. Manual de gestação de alto risco, 2022; SES-MG. Estratificação de risco gestacional e fluxo de atendimento, 2024; Nota Técnica Conjunta 251/2024 (cálcio)."]}, {"id": "I16", "d": "iesc", "aula": "Semana 16", "short": "Rede de apoio à gestante e Rede Alyne", "n": "IESC — Semana 16: rede de apoio à saúde da mulher gestante e Rede Alyne", "pages": [["iesc", 5], ["iesc", 4], ["iesc", 1]], "imgs": ["sv-alyne6", "sv-alyne-pontos", "sv-rede-apoio", "sv-urgencia"], "rev": "<p><b>Base legal.<\/b> A Rede Alyne foi instituída pela Portaria GM/MS nº 5.350, de 12/09/2024, com financiamento regulamentado pela nº 5.349/2024; reestrutura a Rede Cegonha com atenção à redução da mortalidade materna e infantil, especialmente neonatal, e às desigualdades raciais e territoriais. O nome homenageia Alyne Pimentel, cuja morte materna evidenciou falhas de acesso e de assistência. Abrange planejamento reprodutivo, gestação, parto, puerpério e cuidado infantil, com foco no crescimento e desenvolvimento até 24 meses. Princípios: direitos humanos, equidade, integralidade, humanização, respeito à diversidade e combate ao racismo (IESC, PDF p. 5). <i>Complemento externo (não está no PDF):<\/i> Alyne, mulher negra de 28 anos de Belford Roxo (RJ), morreu em 2002 grávida de seis meses; em 2011 o Comitê CEDAW da ONU responsabilizou o Estado brasileiro — primeira decisão de um órgão internacional sobre morte materna evitável. O Ministério divulgou como metas reduzir a mortalidade materna em 25% e, entre mulheres pretas, em 50% até 2027.<\/p><p><b>Seis componentes.<\/b> (1) Pré-natal: UBS, captação precoce, no mínimo sete consultas, exames, estratificação, assistência especializada e vinculação à maternidade. (2) Parto e nascimento: maternidades, centros de parto normal, leitos obstétricos e neonatais, boas práticas, acompanhante, assistência segura a complicações. (3) Puerpério e atenção integral à criança: seguimento materno e infantil na APS, aleitamento, planejamento reprodutivo. (4) Sistema logístico: transporte sanitário, transporte de urgência e regulação. (5) Sistema de apoio: apoio diagnóstico e terapêutico, informação. (6) Sistema de governança: pactuação entre gestores, organização regional, monitoramento de indicadores, avaliação e melhoria (PDF p. 5).<\/p><p><b>Pontos de atenção e direitos.<\/b> UBS/ESF → AGPAR (ambulatório especializado de alto risco, onde habilitado) → maternidade de referência, leitos GPAR e UTI → APS após a alta. A Casa da Gestante, Bebê e Puérpera (CGBP) apoia a permanência temporária de usuárias que precisam de acompanhamento próximo ao hospital sem indicação de internação. Direitos: vinculação prévia à maternidade, acompanhante de livre escolha, atendimento respeitoso, informação e consentimento; regulação evita peregrinação. Atualização 2026: Portaria GM/MS nº 10.273/2026 integra ações de humanização do luto materno e parental (PDF p. 5).<\/p><p><b>Rede de apoio individual e social.<\/b> Avaliar quem acompanha a gestante, transporte e renda, segurança alimentar, moradia, saúde mental e capacidade de comparecer às consultas; construir o plano com consentimento; acionar ACS/eMulti, CRAS/CREAS, CAPS e rede de proteção. Não confundir rede familiar com a rede assistencial do SUS (PDF p. 4).<\/p>", "tab": [{"cap": "Seis componentes da Rede Alyne (PDF p. 5)", "h": ["Componente", "Conteúdo"], "r": [["1. Pré-natal", "UBS, captação precoce, ≥ 7 consultas, exames, estratificação, especializada, vinculação à maternidade"], ["2. Parto e nascimento", "Maternidades, CPN, leitos obstétricos/neonatais, boas práticas, acompanhante, complicações"], ["3. Puerpério e atenção integral à criança", "Seguimento materno-infantil na APS, aleitamento, planejamento reprodutivo, especializada"], ["4. Sistema logístico", "Transporte sanitário e de urgência, regulação"], ["5. Sistema de apoio", "Apoio diagnóstico e terapêutico, informação, outros recursos"], ["6. Sistema de governança", "Pactuação entre gestores, região, indicadores, avaliação e melhoria"]]}, {"cap": "Quem acionar na rede de apoio (PDF p. 4)", "h": ["Necessidade", "Recurso"], "r": [["Vínculo territorial, visitas, busca ativa", "ACS / eMulti"], ["Renda, segurança alimentar, benefícios", "CRAS"], ["Violação de direitos, violência", "CREAS / rede de proteção"], ["Sofrimento mental grave", "CAPS"]]}], "cmp": {"cap": "Termos que confundem", "h": ["Termo", "O que é", "O que não é"], "r": [["AGPAR", "Ambulatório especializado de gestação de alto risco", "Leito de internação"], ["GPAR", "Leitos de gestação e puerpério de alto risco na maternidade", "Ambulatório"], ["CGBP", "Permanência temporária perto do hospital, sem indicação de internação", "Internação hospitalar"], ["Rede de apoio familiar", "Pessoas que acompanham a gestante", "Rede assistencial do SUS"]]}, "flow": {"cap": "Trajeto da gestante de alto risco na Rede Alyne", "s": ["UBS/ESF (coordenação)", "AGPAR, onde habilitado", "Maternidade de referência, GPAR, UTI se necessário", "CGBP quando precisa ficar perto sem internação", "APS após a alta"]}, "refs": ["IESC IV — N3, PDF p. 4–5 (Rede de apoio individual e social; Rede Alyne: organização do SUS).", "Brasil. Portarias GM/MS nº 5.350 e 5.349, de 12/09/2024; Portaria nº 10.273, de 26/02/2026.", "Complementos externos sinalizados: Comitê CEDAW, caso Alyne da Silva Pimentel Teixeira v. Brasil (2011); metas do Ministério da Saúde para 2027."]}, {"id": "I17", "d": "iesc", "aula": "Semana 17", "short": "Saúde da mulher no puerpério", "n": "IESC — Semana 17: abordagem à saúde da mulher no puerpério", "pages": [["iesc", 6], ["iesc", 7], ["iesc", 8]], "imgs": ["sv-puerperio", "sv-4ts", "sv-humor", "sv-mama-puerperio", "sv-lam"], "rev": "<p><b>Definição e calendário.<\/b> Puerpério é o período após a dequitação em que ocorrem involução uterina, adaptações hormonais, lactação e recuperação física e emocional. Didaticamente: imediato (1º–10º dia), tardio (11º–45º) e remoto (após 45 dias); a consulta de rotina deve ocorrer antes de 42 dias. Minas Gerais: ao menos duas consultas — primeira semana (com o cuidado do RN) e entre 30 e 42 dias; no alto risco, também no serviço de referência, compartilhado com a APS; antecipar se complicações (IESC, PDF p. 6).<\/p><p><b>Consulta.<\/b> Anamnese (parto, intercorrências, sangramento, dor, febre, cefaleia, micção/evacuação, sono, alimentação, medicamentos, amamentação, apoio; humor e violência em privado); exame geral (PA, temperatura, pulso, mucosas, anemia, edema, membros inferiores); útero (fundo desce ~1 cm/dia e deixa de ser palpável no abdome em ~2 semanas; dor uterina + febre + lóquios fétidos sugere infecção); lóquios (rubros → serosos/acastanhados → claros/esbranquiçados; sangramento crescente/intenso é anormal); ferida/períneo; mamas e observação da mamada; plano (aleitamento exclusivo até 6 meses, vacinas e ferro, contracepção, saúde mental, alerta) — avaliar o RN sem perder o foco na mulher (PDF p. 6).<\/p><p><b>Complicações.<\/b> Hemorragia pós-parto (4 Ts; tardia por restos ou infecção) → urgência; endometrite (febre, dor uterina, lóquios fétidos) → hospital; hipertensão/pré-eclâmpsia pós-parto (cefaleia, visão, epigastralgia, dispneia, ≥ 160/110) → urgência, anti-hipertensivos compatíveis com lactação; TEV (dor/edema unilateral, dispneia súbita, dor torácica, síncope) → urgência, não massagear; ingurgitamento (bilateral; pega, livre demanda, ordenha para conforto); mastite (manter amamentação, anti-inflamatório, avaliar antibiótico; abscesso → US e drenagem); baby blues (até 2 semanas), depressão pós-parto (EPDS, avaliar risco, tratar), psicose puerperal (emergência). <b>Contracepção:<\/b> ovulação pode voltar antes da menstruação; preservativo, progestagênio isolado, DIU imediato pós-dequitação até 48 h ou a partir de 4 semanas; evitar estrogênio no puerpério inicial; LAM só com os três requisitos (PDF p. 7).<\/p>", "tab": [{"cap": "Complicações puerperais (PDF p. 7)", "h": ["Quadro", "Pistas", "Conduta"], "r": [["Hemorragia pós-parto", "Sangramento intenso, taquicardia, tontura, hipotensão", "Urgência; 4 Ts; tardia: restos/infecção"], ["Endometrite", "Febre, dor uterina, lóquios fétidos", "Avaliação hospitalar, antibiótico; sepse = emergência"], ["Hipertensão pós-parto", "Cefaleia, visão, epigastralgia, dispneia, ≥ 160/110", "Urgência; anti-hipertensivo compatível com lactação"], ["TEV", "Dor/edema unilateral, dispneia súbita, dor torácica, síncope", "Urgência; não massagear"], ["Ingurgitamento", "Mamas tensas, bilateral", "Pega, livre demanda, ordenha p/ conforto"], ["Mastite", "Dor localizada, rubor, sintomas sistêmicos", "Manter amamentação; anti-inflamatório; ± antibiótico; abscesso → US/drenagem"], ["Baby blues", "Labilidade nos primeiros dias", "Autolimitado até 2 semanas; acolher"], ["Depressão pós-parto", "Persistente, anedonia, culpa, prejuízo", "Rastrear (EPDS), avaliar risco, tratar"], ["Psicose puerperal", "Delírios, alucinações, confusão", "Emergência psiquiátrica"]]}], "cmp": {"cap": "Fases × consultas", "h": ["", "Definição didática", "Consulta (MG)"], "r": [["Imediato", "1º–10º dia", "1ª semana (com RN)"], ["Tardio", "11º–45º dia", "30–42 dias"], ["Remoto", "após 45 dias", "— (rotina deve ocorrer antes de 42 dias)"]]}, "flow": {"cap": "Consulta puerperal", "s": ["Anamnese (incluindo humor e violência em privado)", "Exame geral: PA, temperatura, pulso, mucosas, membros", "Útero: involução, dor, consistência", "Lóquios: quantidade, odor, evolução", "Ferida operatória/períneo", "Mamas e observação da mamada", "Plano: aleitamento, vacinas/ferro, contracepção, saúde mental, alerta, retorno"]}, "refs": ["IESC IV — N3, PDF p. 6–8 (Puerpério: consulta e seguimento; complicações e condutas; Revisão).", "SES-MG. Estratificação de risco gestacional e fluxo de atendimento, 2024 (calendário puerperal)."]}], "questions": [{"id": "P15-01", "sub": "Gravidez aos 16 anos sem risco: sigilo como regra", "comp": "Comunicação e confidencialidade", "rac": "Aplicação de princípio ético", "q": "Ana, 16 anos, vem à UBS com a mãe por “dor de barriga”. Na parte da consulta a sós, conta que está com atraso menstrual e que o teste de farmácia deu positivo. Namora há um ano um rapaz de 17 anos, relação consentida, sem coerção. Nega uso de substâncias, humor preservado, sem ideação suicida, mora com a mãe e diz que “ainda não está pronta para contar”. Ao sair do consultório, a mãe pede ao médico: “Doutor, me fala o que ela tem, sou responsável por ela”. Qual a conduta mais adequada?", "o": [["Manter o sigilo, iniciar o pré-natal e oferecer ajuda para Ana decidir como e quando contar à família, se e quando quiser", "Ana tem discernimento, não há violência, coerção, risco grave nem idade < 14 anos. O material manda preservar as informações “inclusive diante dos responsáveis”, e a gravidez sozinha não cria exceção."], ["Informar a mãe da gestação, porque a gravidez em menor de 18 anos é situação de risco que obriga a comunicação aos responsáveis", "Não há no material regra que transforme toda gravidez adolescente em exceção ao sigilo; as exceções são risco relevante, violência/exploração e dever legal (< 14 anos)."], ["Condicionar o início do pré-natal à presença e à autorização da mãe, para proteger juridicamente a equipe", "O PDF é explícito: não condicionar o atendimento à presença dos pais ou a boletim de ocorrência."], ["Notificar o caso ao Conselho Tutelar, já que relação sexual na adolescência configura violência presumida", "A presunção legal de violência vale para menores de 14 anos; Ana tem 16 e a relação é consentida, sem coerção. Notificar aqui violaria o sigilo sem base."]], "pista": "16 anos + relação consentida + sem coerção, risco ou ideação = nenhuma das exceções listadas no material.", "pp": ["O que se pergunta: se a gravidez, por si só, autoriza contar aos pais.", "Regra do material: sigilo preservado com discernimento, inclusive diante dos responsáveis.", "Exceções: risco relevante, violência/exploração, risco grave de autoagressão e atividade sexual < 14 anos.", "Checar o caso: 16 anos, parceiro 17, sem coerção, sem ideação, mora com a mãe — nenhuma exceção.", "Conduta: manter sigilo, garantir o cuidado (confirmação e pré-natal) e trabalhar com ela a comunicação à família."], "ap": "<p>O roteiro da consulta do adolescente (HAM Ped, PDF p. 42) começa com o responsável e reserva um momento a sós, explicando antes os limites do sigilo. A informação é do adolescente; o que a lei e a ética autorizam é a quebra <b>proporcional ao risco<\/b>. Em uma gravidez de 16 anos sem violência, o papel do médico é garantir acesso ao pré-natal, avaliar rede de apoio e ajudar a jovem a decidir como contar — inclusive oferecendo-se para estar presente nessa conversa. Responder à mãe com acolhimento (“entendo sua preocupação; Ana está sendo cuidada e vamos conversar juntas”) mantém o vínculo com a família sem expor a paciente.<\/p>", "mud": [["Ana tivesse 13 anos", "Avaliação protetiva, notificação e comunicação ao Conselho Tutelar, explicando a ela antes", "Atividade sexual < 14 anos é dever legal de proteção (PDF p. 42)"], ["O namorado tivesse 28 anos e controlasse seu celular e suas saídas", "Exceção por coerção/exploração: proteger e acionar a rede", "Violência e coerção estão entre as exceções"], ["Ana relatasse ideação suicida com plano", "Quebrar o sigilo no necessário para protegê-la, comunicando-lhe antes", "Risco grave de autoagressão é exceção"]], "arm": "Confundir “menor de idade” com “sem direito a sigilo”. O critério do material é discernimento e risco, não a maioridade civil.", "ouro": "Gravidez na adolescência não quebra sigilo; risco, violência ou idade < 14 anos, sim.", "m2": ["Mesma Ana pede que o médico “minta” para a mãe dizendo que é gastrite. O que fazer?", "Não mentir: o médico pode recusar-se a revelar o diagnóstico sem inventar outro, explicando à mãe que a filha está em acompanhamento e que conversarão juntas. Sigilo não é falsear informação (PDF p. 43: não prometer segredo absoluto, ser transparente sobre o que será feito)."], "n": ["Sigilo é a regra para o adolescente com discernimento.", "Gravidez isolada não é exceção.", "Exceções: risco relevante, violência/exploração, autoagressão grave, < 14 anos.", "Não condicionar atendimento aos pais."], "loc": [{"f": "ped", "p": 42, "q": "Preservar informações do adolescente com discernimento, inclusive diante dos responsáveis, salvo risco relevante ou dever legal de proteção.", "s": "Consulta do adolescente — Sigilo e proteção", "r": [[0.0768, 0.5433, 0.9004, 0.5634], [0.0768, 0.5619, 0.2522, 0.582]]}, {"f": "ped", "p": 42, "q": "Não condicionar atendimento à presença dos pais ou boletim de ocorrência.", "s": "Consulta do adolescente — Sigilo e proteção", "r": [[0.8305, 0.599, 0.8655, 0.6191], [0.0768, 0.6176, 0.5824, 0.6376]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-02", "sub": "Gravidez aos 13 anos: dever legal de proteção", "comp": "Quebra de sigilo responsável", "rac": "Priorização ética e legal", "q": "Júlia, 13 anos e 4 meses, comparece com a avó por náuseas. A sós, relata que o “namorado”, de 19 anos, é vizinho, e que mantêm relações há 3 meses; ela pede muito que ninguém saiba. O β-hCG é positivo. Ela está estável, sem sangramento. Qual a sequência de condutas mais adequada?", "o": [["Acolher, explicar a Júlia que a idade exige acionar a proteção, notificar, comunicar ao Conselho Tutelar e manter o pré-natal", "Atividade sexual envolvendo menor de 14 anos exige avaliação protetiva e cumprimento dos deveres legais; a quebra é comunicada a ela antes e vem acompanhada do cuidado."], ["Manter sigilo absoluto como ela pediu, já que relatou relação consentida e o vínculo terapêutico deve ser preservado acima de tudo", "Não se promete segredo absoluto. Com menos de 14 anos, o consentimento não afasta o dever legal de proteção."], ["Aguardar que a família registre boletim de ocorrência antes de iniciar o pré-natal, para não interferir na investigação", "O material diz para não condicionar atendimento a boletim de ocorrência e não atrasar a assistência."], ["Confrontar o vizinho com a família presente para esclarecer os fatos e só então decidir se há o que notificar", "O PDF orienta não confrontar o possível agressor; a investigação não cabe ao médico."]], "pista": "13 anos = atividade sexual com menor de 14 anos: dever legal de proteção, independentemente do “consentimento”.", "pp": ["Idade: 13 anos (< 14).", "Regra do material: atividade sexual com menor de 14 exige avaliação protetiva e cumprimento dos deveres legais.", "Comunicação: não prometer segredo; explicar à adolescente o que será feito e por quê.", "Ações: notificar à vigilância (até 24 h na violência sexual) e comunicar ao Conselho Tutelar.", "Cuidado clínico não espera: pré-natal, avaliação de risco e de segurança domiciliar."], "ap": "<p>O material separa dois planos: o <b>cuidado<\/b> (que nunca é condicionado a BO ou à presença dos pais) e a <b>proteção<\/b> (notificação, Conselho Tutelar, rede). <i>Complemento externo:<\/i> o Código Penal (art. 217-A) define como estupro de vulnerável a conjunção carnal ou ato libidinoso com menor de 14 anos, e o ECA (art. 13) obriga a comunicação ao Conselho Tutelar de suspeita ou confirmação de maus-tratos. Por isso o “namoro consentido” não muda a conduta. A forma importa: explicar previamente, em linguagem acolhedora, que será necessário buscar ajuda e que ela continuará sendo cuidada — exatamente a frase-modelo do PDF.<\/p>", "mud": [["Júlia tivesse 16 anos e parceiro de 17, sem coerção", "Sigilo preservado; pré-natal e apoio", "Sem exceção ao sigilo"], ["Houvesse sangramento e dor intensa", "Prioridade assistencial imediata (excluir complicação), proteção em paralelo", "Assistência não espera a rede"], ["Ela dissesse que não se sente segura para voltar para casa", "Não devolvê-la a ambiente inseguro sem articulação protetiva", "PDF p. 50"]], "arm": "Achar que o consentimento da adolescente afasta a notificação. Abaixo de 14 anos, o dever legal se impõe; acima, decide-se pela presença de risco ou violência.", "ouro": "Menor de 14 anos com atividade sexual: acolher, cuidar e proteger — notificar e acionar o Conselho Tutelar, explicando antes.", "m2": ["Na mesma situação, a avó pede que nada seja registrado no prontuário. É possível?", "Não. O PDF manda registrar data, hora, palavras exatas relevantes e achados objetivos; o registro é parte da proteção e do cuidado (PDF p. 50)."], "n": ["< 14 anos: dever legal de proteção.", "Notificação de violência sexual em até 24 h + Conselho Tutelar.", "Não condicionar cuidado a BO.", "Não confrontar o possível agressor."], "loc": [{"f": "ped", "p": 42, "q": "atividade sexual envolvendo menor de 14 anos exige avaliação protetiva e cumprimento dos deveres legais.", "s": "Consulta do adolescente — Sigilo e proteção", "r": [[0.0768, 0.599, 0.8333, 0.6191]]}, {"f": "ped", "p": 50, "q": "noHhcação compulsória imediata de violência sexual à vigilância em até 24h, comunicação ao Conselho Tutelar", "s": "Violência sexual na infância — Notificação e rede de proteção", "r": [[0.2568, 0.5751, 0.9136, 0.5952], [0.0768, 0.5937, 0.2015, 0.6138]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-03", "sub": "Momento de explicar os limites do sigilo", "comp": "Estrutura da consulta do adolescente", "rac": "Sequência de condutas", "q": "Em uma estação de OSCE, o estudante atende Pedro, 15 anos, acompanhado do pai, para “check-up”. O avaliador observa a ordem das etapas. Qual sequência está de acordo com o roteiro do material?", "o": [["Começar com Pedro e o pai, anunciar a parte individual e, a sós, explicar os limites do sigilo antes das perguntas do HEADSSS", "O roteiro manda começar com adolescente e responsável, explicar a parte individual e esclarecer os limites do sigilo antes das perguntas."], ["Pedir ao pai que saia e, só depois de Pedro revelar algo sensível, explicar quando o sigilo poderia ser quebrado", "Explicar os limites depois da revelação quebra a confiança; o material diz “explicar limites do sigilo antes das perguntas”."], ["Fazer toda a entrevista com o pai presente para que ele confirme as informações e só usar o momento a sós para o exame físico", "Perguntas sobre sexualidade, drogas e humor dependem de privacidade; o momento a sós serve sobretudo à entrevista."], ["Começar pelas perguntas de sexualidade e drogas, que são as mais importantes, e deixar casa e escola para o fim", "O HEADSSS começa por perguntas abertas e menos sensíveis (casa, escola) — não é interrogatório."]], "pista": "“Explicar limites do sigilo ANTES das perguntas” e começar com adolescente + responsável.", "pp": ["Primeiro contato: adolescente e responsável juntos.", "Anunciar que parte da consulta será individual.", "A sós: como prefere ser chamado, ambiente privado, limites do sigilo.", "HEADSSS: das perguntas menos sensíveis às mais sensíveis.", "Fechamento com a frase-modelo sobre sigilo e exceções."], "ap": "<p>O HEADSSS (Home, Education/Eating, Activities, Drugs, Sexuality, Suicide/depression, Safety) é descrito no PDF como “roteiro psicossocial, não interrogatório”, começando por perguntas abertas e menos sensíveis (p. 43). A ordem existe para construir confiança: casa e escola abrem caminho para sexualidade, substâncias e humor. Os limites do sigilo vêm antes porque o adolescente precisa saber, ao decidir o que contar, em que situações a equipe terá de agir.<\/p>", "mud": [["Pedro chegasse sozinho", "Atender normalmente; não condicionar à presença do responsável", "PDF p. 42"], ["O pai se recusasse a sair", "Negociar explicando o objetivo; o direito à privacidade do adolescente faz parte do atendimento", "Garantir ambiente privado"]], "arm": "Deixar para explicar o sigilo “se surgir algo”. Explicar depois parece traição e reduz a revelação de riscos.", "ouro": "Juntos → a sós → limites do sigilo → HEADSSS do menos ao mais sensível.", "m2": ["Qual a frase de fechamento sugerida pelo material?", "“O que conversarmos será mantido em sigilo, exceto se houver risco importante à sua segurança ou necessidade legal de proteção. Se isso acontecer, vou explicar o que precisamos fazer e buscar ajuda com você.” (PDF p. 42)"], "n": ["Começar com o responsável, explicar a parte individual.", "Limites do sigilo antes das perguntas.", "HEADSSS do menos para o mais sensível."], "loc": [{"f": "ped", "p": 42, "q": "Começar com adolescente e responsável, explicar que parte da consulta pode ocorrer individualmente.", "s": "Consulta do adolescente — Roteiro de comunicação", "r": [[0.0768, 0.1637, 0.8018, 0.1837]]}, {"f": "ped", "p": 42, "q": "ouvir sem julgamento e explicar limites do sigilo antes das perguntas.", "s": "Consulta do adolescente — Roteiro de comunicação", "r": [[0.2301, 0.1822, 0.7191, 0.2023]]}, {"f": "ped", "p": 43, "q": "HEADSSS é um roteiro psicossocial, não um interrogatório. Começar por perguntas abertas e menos sensíveis.", "s": "Adolescente — entrevista e exame", "r": [[0.0768, 0.1032, 0.848, 0.1233]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-04", "sub": "Gravidez com ideação suicida", "comp": "Avaliação de risco e quebra de sigilo", "rac": "Priorização de risco", "q": "Larissa, 15 anos, descobriu a gravidez há uma semana. A sós, diz que ninguém em casa sabe, que “prefere morrer a contar para o pai” e que pensou em tomar os remédios da avó; tem acesso a eles. Ela implora sigilo. Qual a conduta mais adequada?", "o": [["Explicar que o risco à vida exige ajuda, protegê-la já (saúde mental, afastar os meios) e envolver só quem for preciso, junto com ela", "Risco grave de autoagressão é exceção ao sigilo. A quebra é proporcional e comunicada antes, e a prioridade passa a ser a proteção."], ["Manter o sigilo sobre a ideação e a gravidez, agendar retorno em 30 dias e orientar que procure a UBS ou o CAPS caso os pensamentos piorem", "Ideação com plano e acesso a meios é risco atual; o PDF diz “se risco atual, proteger e encaminhar”."], ["Contar ao pai sobre a gravidez e a ideação sem avisar a adolescente, para evitar que ela fuja ou abandone o acompanhamento", "A quebra deve ser explicada ao adolescente e feita com ele; quebrar às escondidas destrói o vínculo e não é o que o material orienta."], ["Notificar o Conselho Tutelar por se tratar de gravidez na adolescência e encerrar a consulta após a notificação", "Gravidez aos 15 anos sem violência não é motivo de notificação; o que define a conduta aqui é o risco de suicídio, que exige proteção imediata."]], "pista": "“Prefere morrer” + plano (remédios da avó) + acesso = risco grave de autoagressão.", "pp": ["Identificar risco: ideação com plano e acesso a meios.", "Material: “saúde mental — autoagressão e ideação suicida; se risco atual, proteger e encaminhar”.", "Exceção ao sigilo: risco grave de autoagressão.", "Como quebrar: explicar antes, compartilhar o mínimo necessário, construir junto.", "Gravidez segue sendo cuidada (pré-natal) após garantir segurança."], "ap": "<p>O último “S” do HEADSSS (saúde mental) pergunta por humor, sono, ansiedade, autoagressão e ideação; o material é direto: risco atual → proteger e encaminhar (PDF p. 43). A quebra de sigilo aqui não é sobre a gravidez, e sim sobre a vida. O médico pode negociar com Larissa quem será a pessoa de confiança envolvida (por exemplo, a mãe em vez do pai), mantendo o máximo de autonomia compatível com a segurança.<\/p>", "mud": [["Larissa negasse ideação e tivesse apoio da mãe", "Sigilo preservado e pré-natal; trabalhar a comunicação à família", "Sem exceção"], ["Ela revelasse que o pai é violento", "Também exceção por violência: proteção e rede (CREAS/Conselho Tutelar)", "Violência entra no “S” de segurança"]], "arm": "Tratar a pergunta como “sigilo sobre a gravidez”. O dado que muda a conduta é o risco de suicídio.", "ouro": "Risco de vida supera o pedido de sigilo — mas a quebra é anunciada, mínima e construída com o adolescente.", "m2": ["Qual erro de comunicação o PDF aponta na revelação de violência?", "Prometer segredo absoluto. Deve-se acolher, priorizar proteção e acionar a rede, sem promessa de sigilo total (PDF p. 43 e 51)."], "n": ["Ideação com plano/meios = risco atual.", "Proteger e encaminhar.", "Quebra comunicada antes e limitada ao necessário."], "loc": [{"f": "ped", "p": 43, "q": "Humor, sono, ansiedade, autoagressão e ideação suicida; se risco atual, proteger e encaminhar.", "s": "Adolescente — entrevista e exame (HEADSSS)", "r": [[0.5056, 0.3267, 0.8897, 0.3452], [0.5056, 0.3413, 0.7333, 0.3598]]}, {"f": "ped", "p": 42, "q": "Explicar previamente que situações como violência, exploração sexual e risco grave de autoagressão exigem ajuda e comunicação necessária.", "s": "Consulta do adolescente — Sigilo e proteção", "r": [[0.2493, 0.5619, 0.8561, 0.582], [0.0768, 0.5804, 0.4628, 0.6005]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-05", "sub": "Atraso menstrual na adolescente", "comp": "Saúde sexual e reprodutiva", "rac": "Conduta na consulta", "q": "Bianca, 15 anos, vem com uma amiga por atraso menstrual de 3 semanas. Usa preservativo “às vezes”, parceiro de 16 anos, sem coerção. Pede para não envolver a mãe. Segundo o material, qual a abordagem mais completa?", "o": [["Perguntar sobre gestação, testar, avaliar segurança e oferecer dupla proteção e testes de IST, mantendo o sigilo", "O PDF lista para atraso menstrual: perguntar possibilidade de gestação, testar quando indicado e avaliar segurança; e orientar dupla proteção, contracepção de emergência quando indicada e IST."], ["Recusar o atendimento até que um responsável legal compareça, por se tratar de adolescente menor de 18 anos", "O atendimento não é condicionado à presença dos pais."], ["Prescrever anticoncepcional oral imediatamente para regularizar o ciclo, sem necessidade de testar gravidez antes", "Antes de qualquer conduta é preciso testar; o próprio material de amenorreia diz para não iniciar anticoncepcional só para produzir sangramento."], ["Orientar que o atraso é comum na adolescência e repetir a avaliação em 3 meses, sem exames", "Atraso em adolescente sexualmente ativa exige pensar em gravidez agora."]], "pista": "Atraso menstrual + atividade sexual com uso irregular de preservativo → testar gravidez, avaliar segurança, dupla proteção.", "pp": ["Situação de OSCE descrita no PDF: atraso menstrual.", "Passos: perguntar possibilidade de gestação → testar → avaliar segurança.", "Saúde sexual: dupla proteção (preservativo + método), contracepção de emergência quando indicada, vacinação HPV/hepatite B, testes de IST.", "Sigilo: sem exceção no caso."], "ap": "<p>A seção “Saúde sexual e reprodutiva” (PDF p. 42) pede DUM, ciclos, sintomas, possibilidade de gravidez e exposição a IST “sem presumir orientação/identidade”. Dupla proteção significa preservativo associado a um método contraceptivo eficaz. Se o teste for negativo, a consulta é oportunidade de contracepção; se positivo, inicia-se o cuidado pré-natal e a avaliação de rede de apoio, mantendo o sigilo enquanto não houver exceção.<\/p>", "mud": [["O teste fosse negativo e houvesse relação desprotegida há 2 dias", "Oferecer contracepção de emergência e iniciar método", "CE quando indicada"], ["Bianca nunca tivesse menstruado", "A primeira ovulação pode anteceder a menarca: testar mesmo assim", "PDF p. 46"]], "arm": "Pensar que adolescente que “nunca” ou “quase nunca” menstruou não pode estar grávida.", "ouro": "Atraso menstrual na adolescente: perguntar, testar, avaliar segurança — e oferecer dupla proteção.", "m2": ["O que significa “dupla proteção”?", "Uso de preservativo (proteção contra IST) junto com um método contraceptivo eficaz (PDF p. 42)."], "n": ["Testar gravidez no atraso menstrual.", "Avaliar segurança.", "Dupla proteção e IST.", "Sigilo preservado se não há exceção."], "loc": [{"f": "ped", "p": 43, "q": "Atraso menstrual: perguntar possibilidade de gestação, testar quando indicado e avaliar segurança.", "s": "Adolescente — Situações de OSCE", "r": [[0.1314, 0.5375, 0.8294, 0.5576]]}, {"f": "ped", "p": 42, "q": "Orientar dupla proteção (preservativo + método contraceptivo), contracepção de emergência quando indicada", "s": "Consulta do adolescente — Saúde sexual e reprodutiva", "r": [[0.0768, 0.4643, 0.8583, 0.4844]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-06", "sub": "Coerção e exploração digital", "comp": "Identificação de violência", "rac": "Reconhecimento de exceção", "q": "Camila, 15 anos, grávida de 8 semanas, conta que o parceiro, de 24 anos, exige fotos íntimas, ameaça divulgá-las se ela terminar e decide quando ela pode sair de casa. Ela diz que “isso é normal em namoro” e pede sigilo. Qual a avaliação correta?", "o": [["Há coerção e exploração digital, exceções ao sigilo: proteger, notificar e acionar a rede, explicando antes a Camila", "O HEADSSS inclui violência, coerção e exposição digital; violência e exploração sexual são exceções explícitas ao sigilo."], ["Como ela tem mais de 14 anos e considera o namoro normal, o sigilo deve ser mantido integralmente, sem notificar", "A idade ≥ 14 não afasta a exceção por violência/coerção/exploração."], ["O problema é apenas de saúde mental; basta encaminhá-la ao CAPS, sem qualquer comunicação à rede de proteção", "Há violência em curso; a resposta envolve proteção e rede, não só saúde mental."], ["A conduta deve aguardar boletim de ocorrência registrado pela família", "Atendimento e proteção não dependem de BO."]], "pista": "Ameaça de divulgar imagens + controle de saídas = coerção e exploração (inclusive digital).", "pp": ["Domínio “Segurança” do HEADSSS: violência, coerção, exposição digital.", "Exceções ao sigilo incluem violência e exploração sexual.", "Proteger, notificar, acionar rede (Conselho Tutelar/rede de proteção).", "Explicar antes e manter pré-natal."], "ap": "<p>A exploração não precisa ser presencial: o PDF lista “exploração presencial ou digital” entre as pistas contextuais (p. 50) e “segurança digital” no HEADSSS (p. 42). O fato de a adolescente normalizar a violência não muda a avaliação — ao contrário, reforça a necessidade de acolhimento sem julgamento e de articulação com a rede.<\/p>", "mud": [["Não houvesse coerção nem ameaças", "Sigilo e pré-natal", "Sem exceção"], ["Ela relatasse risco imediato ao voltar para casa", "Não devolver a ambiente inseguro sem articulação protetiva", "PDF p. 50"]], "arm": "Achar que só violência física ou sexual presencial conta. Coerção e exploração digital também são exceções.", "ouro": "Coerção, ameaça e exploração digital = violência: proteger e acionar a rede.", "m2": ["O que perguntar no domínio “Safety”?", "Violência, coerção, acidentes, segurança digital e rede de apoio (PDF p. 42–43)."], "n": ["Exploração digital é violência.", "Exceção ao sigilo.", "Proteger e notificar sem exigir BO."], "loc": [{"f": "ped", "p": 42, "q": "S — Safety Violência, coerção, acidentes, segurança digital?", "s": "Consulta do adolescente — HEADSSS", "r": [[0.0856, 0.386, 0.1597, 0.4045], [0.5056, 0.386, 0.8161, 0.4045]]}, {"f": "ped", "p": 50, "q": "Relato espontâneo, medo de determinada pessoa, coerção, ameaças, exploração presencial ou digital.", "s": "Violência sexual — Manifestações e pistas clínicas", "r": [[0.5056, 0.2732, 0.8876, 0.2918], [0.5056, 0.2879, 0.7778, 0.3064]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-07", "sub": "Promessa de segredo absoluto", "comp": "Comunicação na revelação de violência", "rac": "Comunicação", "q": "Durante a consulta, Beatriz, 14 anos, diz: “Só conto o que aconteceu se você prometer que não vai contar para ninguém”. Qual a resposta mais adequada segundo o material?", "o": [["“Fica entre nós, exceto se houver risco à sua segurança ou dever legal de proteção; aí eu explico e busco ajuda com você”", "É a frase de fechamento proposta no PDF: sigilo com limites claros, sem promessa de segredo absoluto."], ["“Prometo que nada do que você disser sai desta sala, em nenhuma hipótese; pode confiar em mim”", "O material diz para evitar promessas de sigilo absoluto, que poderão ter de ser quebradas."], ["“Não posso garantir nada: tudo o que você disser aqui será repassado aos seus pais ao final da consulta”", "Isso nega o direito ao sigilo e inviabiliza a revelação; o sigilo é a regra."], ["“Se você não contar agora o que aconteceu, terei de chamar a polícia para investigar o caso”", "Ameaça e coerção revitimizam; a escuta deve ser acolhedora e não indutiva."]], "pista": "Nunca prometer segredo absoluto; explicar limites e oferecer ajuda conjunta.", "pp": ["Pedido de promessa absoluta.", "Material: evitar promessas de sigilo absoluto.", "Responder com a regra (sigilo) + exceções + compromisso de explicar e agir junto."], "ap": "<p>O PDF repete a orientação em dois pontos: no relato de violência, “acolher, priorizar proteção e acionar rede, sem prometer segredo absoluto” (p. 43) e na anamnese não indutiva, “evitar perguntas sugestivas, confrontos e promessas de sigilo absoluto” (p. 51). Prometer e depois quebrar é revitimizar.<\/p>", "mud": [["Ela já tivesse revelado violência", "Acolher, dizer que fez bem em contar, proteger e acionar a rede", "PDF p. 50"]], "arm": "Ach
