ar que prometer segredo “facilita a revelação”. Facilita na hora e destrói a confiança depois.", "ouro": "Sigilo com limites ditos de antemão; nunca segredo absoluto.", "m2": ["Quais perguntas abertas o PDF sugere?", "“Você pode me contar o que aconteceu?”, “Está sentindo dor em algum lugar?”, “Você se sente seguro para voltar para casa?” (PDF p. 51)."], "n": ["Sem promessa de sigilo absoluto.", "Explicar limites antes.", "Agir junto com o adolescente."], "loc": [{"f": "ped", "p": 51, "q": "Evitar perguntas sugesHvas, confrontos e promessas de sigilo absoluto.", "s": "Violência sexual — Anamnese não indutiva", "r": [[0.0768, 0.2984, 0.5775, 0.3185]]}, {"f": "ped", "p": 42, "q": "O que conversarmos será manHdo em sigilo, exceto se houver risco importante à sua segurança ou necessidade legal de proteção.", "s": "Consulta do adolescente — Como fechar a estação", "r": [[0.0768, 0.678, 0.9044, 0.6981], [0.0768, 0.6966, 0.172, 0.7167]]}], "img": ["sv-sigilo"], "t": "P15"}, {"id": "P15-08", "sub": "Hipospádia", "comp": "Interpretação do exame genital", "rac": "Reconhecimento e conduta", "q": "RN de 2 dias, termo, em alojamento conjunto. Ao exame: meato uretral na face ventral do pênis, próximo à junção penoescrotal, curvatura ventral e prepúcio em “capuz” dorsal. Os testículos não são palpáveis na bolsa nem na região inguinal. Os pais perguntam se podem marcar a circuncisão. Qual a conduta?", "o": [["Não circuncidar; encaminhar à urologia pediátrica e investigar diferenciação sexual", "Hipospádia: não circuncidar (o prepúcio pode ser usado na correção). Proximal + testículos não palpáveis → avaliar diferenciação sexual."], ["Realizar a circuncisão eletiva agora, pois o procedimento facilita a futura correção do meato", "O prepúcio é reservado para a reconstrução; circuncidar antes da avaliação urológica é erro."], ["Tranquilizar: é epispádia leve que se resolve com o crescimento", "Epispádia é meato DORSAL; aqui o meato é ventral. Nenhuma das duas se resolve espontaneamente."], ["Aguardar 6 meses para descida testicular e só então reavaliar o pênis", "Testículos impalpáveis com hipospádia proximal não é criptorquidia simples; a avaliação deve ser imediata."]], "pista": "Meato ventral + capuz dorsal = hipospádia; proximal + testículos impalpáveis = avaliar DDS.", "pp": ["Meato ventral → hipospádia (dorsal seria epispádia).", "Achados associados: curvatura ventral, prepúcio dorsal em capuz.", "Conduta geral: não circuncidar; urologia pediátrica.", "Sinal de alerta: proximal + testículos não palpáveis → diferenciação sexual."], "ap": "<p>O “mapa de localização” do PDF associa MEATO → face inferior à hipospádia e MEATO → face superior à epispádia (p. 35). A combinação hipospádia proximal + gônadas impalpáveis é uma das apresentações de variação do desenvolvimento sexual; o próprio material, na página da menina e RN, lembra que genitália atípica exige equipe especializada e, se houver vômitos e desidratação, excluir crise adrenal (p. 36).<\/p>", "mud": [["Hipospádia distal com testículos tópicos", "Não circuncidar e encaminhar à urologia pediátrica (eletivo)", "Sem sinal de DDS"], ["Vômitos, desidratação e choque no 7º dia", "Glicemia, eletrólitos e 17-OHP; excluir crise adrenal", "HAC"]], "arm": "Trocar hipospádia (ventral) por epispádia (dorsal) e liberar circuncisão.", "ouro": "Hipospádia: não circuncidar; proximal + testículos impalpáveis = pensar em DDS.", "m2": ["E se o meato estiver na face dorsal com incontinência?", "Epispádia: urologia pediátrica e investigar malformações associadas (PDF p. 35)."], "n": ["Ventral = hipospádia; dorsal = epispádia.", "Não circuncidar.", "Proximal + testículos impalpáveis → DDS."], "loc": [{"f": "ped", "p": 35, "q": "Meato ventral fora da ponta, curvatura ventral, prepúcio dorsal em capuz.", "s": "Alterações genitais — menino (Hipospádia)", "r": [[0.3656, 0.1518, 0.619, 0.1703], [0.3656, 0.1664, 0.5896, 0.185]]}, {"f": "ped", "p": 35, "q": "Não circuncidar; urologia pediátrica. Se proximal e tesŠculos não palpáveis, avaliar diferenciação sexual.", "s": "Alterações genitais — menino (Hipospádia)", "r": [[0.6456, 0.1518, 0.8991, 0.1703], [0.6456, 0.1664, 0.8762, 0.185], [0.6456, 0.1811, 0.8297, 0.1996]]}], "img": ["sv-genital-menino"], "t": "P15"}, {"id": "P15-09", "sub": "Retrátil × criptorquídico", "comp": "Interpretação do exame genital", "rac": "Diferencial e prazo", "q": "Lactente de 9 meses (nascido a termo) com bolsa escrotal direita vazia desde o nascimento. Com a mão deslizando da região inguinal para a bolsa, o testículo direito é palpado no canal inguinal, chega ao alto da bolsa sob tração, mas sobe imediatamente ao soltar. O esquerdo é tópico. Qual a interpretação e conduta?", "o": [["Criptorquidia: encaminhar à cirurgia, com orquidopexia idealmente entre 6 e 12 meses (até 18)", "O retrátil permanece temporariamente na bolsa; o criptorquídico não permanece. Já passou do limite de 6 meses para encaminhar."], ["Testículo retrátil, variante da normalidade; apenas reavaliar o lactente aos 2 anos de idade", "O retrátil, levado à bolsa, permanece provisoriamente; aqui sobe ao soltar."], ["Aguardar a puberdade, quando a testosterona fará o testículo descer", "Não há base para esperar; o PDF fixa encaminhamento até 6 meses corrigidos e cirurgia até 18 meses."], ["Solicitar US antes de qualquer encaminhamento, pois o exame físico não diferencia as situações", "O próprio exame (permanência após soltar) diferencia; o PDF orienta pela manobra clínica."]], "pista": "“Sobe imediatamente ao soltar” = não permanece = criptorquidia.", "pp": ["Manobra: deslizar da região inguinal para a bolsa.", "Retrátil: levado à bolsa e permanece temporariamente.", "Criptorquídico: não permanece ou não alcança.", "Prazo: encaminhar se não desceu até 6 meses corrigidos; orquidopexia 6–12 meses, até 18."], "ap": "<p>O PDF descreve a manobra na página do exame (p. 34) e a conduta na tabela de alterações (p. 35) e de diferenciais (p. 37: “cirurgia geralmente entre 6 e 18 meses”). Note o “meses corrigidos”: em prematuro, o prazo conta pela idade corrigida.<\/p>", "mud": [["O testículo permanecesse na bolsa após soltar", "Retrátil: seguimento", "Permanece temporariamente"], ["O lactente fosse prematuro de 32 semanas com 7 meses cronológicos", "Usar idade corrigida (~5 meses) para o prazo", "“6 meses corrigidos”"]], "arm": "Considerar “desceu com tração” como testículo normal. O critério é permanecer após soltar.", "ouro": "Retrátil fica; criptorquídico sobe — encaminhar após 6 meses corrigidos.", "m2": ["Como relaxar o cremastérico para examinar?", "Examinar sentado de pernas cruzadas ou em decúbito dorsal, com mãos aquecidas, deslizando da região inguinal à bolsa (PDF p. 34)."], "n": ["Retrátil permanece temporariamente.", "Criptorquídico não permanece.", "Encaminhar após 6 meses corrigidos; cirurgia 6–18 meses."], "loc": [{"f": "ped", "p": 34, "q": "TesŠculo retráHl pode ser levado à bolsa e permanece temporariamente; criptorquídico não permanece ou não alcança a bolsa.", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.5464, 0.5836, 0.8475, 0.6037], [0.0768, 0.6022, 0.6744, 0.6222]]}, {"f": "ped", "p": 35, "q": "Encaminhar se não descer até 6 meses corrigidos; orquidopexia idealmente 6– 12 meses, até 18 meses.", "s": "Alterações genitais — menino (Criptorquidia)", "r": [[0.6456, 0.356, 0.8954, 0.3745], [0.6456, 0.3706, 0.8997, 0.3891], [0.6456, 0.3852, 0.8058, 0.4038]]}], "img": ["sv-genital-menino"], "t": "P15"}, {"id": "P15-10", "sub": "Torção testicular", "comp": "Urgência genital", "rac": "Priorização", "q": "Adolescente de 13 anos acorda com dor escrotal esquerda súbita e intensa, náuseas e um vômito, há 2 horas. O testículo esquerdo está elevado, em posição horizontal, edemaciado; o reflexo cremastérico está ausente à esquerda. O plantonista sugere pedir US com Doppler e, “se o sinal de Prehn for negativo, afastar torção”. Qual a conduta correta?", "o": [["Avaliação cirúrgica imediata, sem atrasar por Doppler diante da forte suspeita", "Dor súbita + náusea + testículo alto/horizontal + cremastérico ausente: torção até exclusão; emergência cirúrgica, sem atrasar por US."], ["Doppler obrigatório antes de acionar a cirurgia, pois o quadro pode ser epididimite", "Com suspeita alta, o Doppler não deve atrasar a cirurgia (PDF p. 35 e 37)."], ["Usar o sinal de Prehn para decidir: se a elevação aliviar a dor, é epididimite e dá alta", "O PDF diz expressamente: não usar sinal de Prehn para descartar torção."], ["Analgesia, gelo e reavaliação em 24 h, já que o cremastérico ausente não tem valor", "A ausência do cremastérico sugere torção; o tempo é crítico para salvar o testículo."]], "pista": "Testículo alto e horizontal + náusea + cremastérico ausente = torção; tempo é testículo.", "pp": ["Reconhecer o padrão: dor súbita, náuseas, testículo alto/horizontal.", "Cremastérico: ausência sugere torção; presença não exclui.", "Prehn não descarta.", "Conduta: emergência cirúrgica; não atrasar por US se suspeita alta."], "ap": "<p>O “mapa de raciocínio” do PDF (p. 35) é categórico: dor escrotal súbita → torção até exclusão. A página de diferenciais reforça: “avaliação cirúrgica imediata; não atrasar por Doppler quando suspeita alta” (p. 37). O reflexo cremastérico é testado por estímulo suave da face medial da coxa; sua ausência apoia a torção, mas sua presença não a afasta (p. 34).<\/p>", "mud": [["Dor gradual, febre e disúria, testículo em posição normal", "Considerar processo infeccioso e avaliar; ainda assim, dúvida → cirurgia", "Torção até exclusão em dor aguda"], ["Suspeita baixa e serviço com US imediato", "US pode ajudar, desde que não atrase", "A regra é não atrasar quando suspeita alta"]], "arm": "Confiar no Prehn ou no cremastérico presente para excluir torção.", "ouro": "Dor escrotal súbita = torção até prova em contrário: cirurgia já.", "m2": ["Massa escrotal dolorosa irredutível com vômitos em lactente: o que pensar?", "Hérnia inguinal encarcerada — urgência cirúrgica (PDF p. 37)."], "n": ["Dor súbita = torção até exclusão.", "Não atrasar por Doppler.", "Prehn não exclui; cremastérico presente não exclui."], "loc": [{"f": "ped", "p": 35, "q": "Dor súbita, náusea, tesŠculo alto/horizontal, edema; reuexo pode estar ausente.", "s": "Alterações genitais — menino (Torção testicular)", "r": [[0.3656, 0.4902, 0.5511, 0.5087], [0.3656, 0.5048, 0.6046, 0.5234], [0.3656, 0.5195, 0.4619, 0.538]]}, {"f": "ped", "p": 34, "q": "ausência pode sugerir torção, mas presença não exclui. Não usar sinal de Prehn para descartar torção.", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.7493, 0.6258, 0.9085, 0.6459], [0.0768, 0.6443, 0.6375, 0.6644]]}], "img": ["sv-genital-menino"], "t": "P15"}, {"id": "P15-11", "sub": "Hidrocele × hérnia inguinal", "comp": "Interpretação do exame genital", "rac": "Diagnóstico diferencial", "q": "Lactente de 5 meses com aumento escrotal direito indolor. A mãe percebe que “de manhã está menor e à tarde maior”. À transiluminação em sala escura, a luz atravessa a massa. Não aumenta ao choro de forma evidente, não há massa redutível no canal e o lactente está bem. Qual a melhor interpretação?", "o": [["Hidrocele comunicante: observar no lactente e operar se persistir ou houver suspeita de hérnia", "Aumento indolor, transiluminação positiva e variação ao longo do dia descrevem hidrocele (comunicante)."], ["Hérnia inguinal encarcerada, com indicação de cirurgia de urgência", "Encarceramento seria massa dolorosa irredutível com vômitos; o lactente está bem e indolor."], ["Torção testicular, com indicação de exploração cirúrgica imediata", "Torção é dor súbita e intensa; massa indolor que transilumina não é o padrão."], ["A transiluminação positiva exclui qualquer outra causa; alta sem seguimento", "O PDF ressalva que a transiluminação sugere líquido mas não exclui outras causas; há indicação de seguimento."]], "pista": "Indolor + transilumina + varia durante o dia = hidrocele comunicante.", "pp": ["Massa indolor → hidrocele × hérnia.", "Transiluminação: luz atravessa = conteúdo líquido (não exclui outras causas).", "Variação ao longo do dia → comunicante.", "Conduta: observar casos simples no lactente; cirurgia se persistente/comunicante ou suspeita de hérnia."], "ap": "<p>A hidrocele comunicante e a hérnia inguinal compartilham a persistência do conduto peritoneovaginal; a diferença está no conteúdo (líquido × alça/omento). Por isso o PDF inclui “suspeita de hérnia” entre as indicações de cirurgia na hidrocele (p. 35) e lembra, na tabela de diferenciais, que a hérnia pode variar com o choro e ser redutível (p. 37).<\/p>", "mud": [["Abaulamento inguinal que aparece ao choro e reduz com pressão", "Hérnia: encaminhar à cirurgia", "Redutível, varia com choro"], ["Massa dolorosa e irredutível com vômitos", "Encarceramento: urgência", "PDF p. 37"]], "arm": "Tomar a transiluminação positiva como diagnóstico definitivo.", "ouro": "Indolor e transilumina: hidrocele; dolorosa e irredutível: hérnia encarcerada.", "m2": ["Como fazer a transiluminação?", "Em local escurecido, luz apropriada sobre a massa escrotal indolor; a passagem de luz sugere líquido (PDF p. 34)."], "n": ["Hidrocele transilumina.", "Comunicante varia no dia.", "Transiluminação não exclui outras causas."], "loc": [{"f": "ped", "p": 35, "q": "Aumento indolor, transiluminação, varia durante o dia se comunicante.", "s": "Alterações genitais — menino (Hidrocele)", "r": [[0.3656, 0.4056, 0.6264, 0.4241], [0.3656, 0.4202, 0.5635, 0.4388]]}, {"f": "ped", "p": 34, "q": "passagem de luz sugere conteúdo líquido (hidrocele), mas não exclui outras causas.", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.6915, 0.5465, 0.863, 0.5666], [0.0768, 0.565, 0.4951, 0.5851]]}], "img": ["sv-genital-menino"], "t": "P15"}, {"id": "P15-12", "sub": "Parafimose × fimose", "comp": "Urgência genital", "rac": "Reconhecimento e conduta", "q": "Menino de 4 anos é trazido ao pronto atendimento: a mãe retraiu o prepúcio no banho “para limpar” e ele não voltou. Há anel constritivo atrás da glande, edema importante e glande arroxeada, com muita dor. Qual a conduta adequada?", "o": [["Parafimose: urgência — analgesia e redução por profissional; cirurgia se falhar", "Prepúcio retraído preso atrás da glande com edema e alteração de perfusão = parafimose, urgência."], ["Fimose fisiológica: orientar higiene externa e retornar em 6 meses", "Fimose é prepúcio não retrátil; aqui o prepúcio está retraído e preso — é o oposto e é urgente."], ["Prescrever corticoide tópico por 4 semanas e reavaliar", "Corticoide tópico é opção para fimose selecionada, não para parafimose com isquemia."], ["Orientar a mãe a tentar reduzir em casa com gelo e voltar se não conseguir", "A redução deve ser feita por profissional, com analgesia; há risco de isquemia."]], "pista": "Prepúcio preso ATRÁS da glande + edema + cor alterada = parafimose (urgência).", "pp": ["Diferenciar: fimose = não retrai; parafimose = retraído e preso.", "Achados de gravidade: anel constritivo, edema, dor, alteração de cor/perfusão.", "Conduta: analgesia + redução por profissional; cirurgia se falha/isquemia.", "Prevenção: não forçar retração do prepúcio."], "ap": "<p>O mapa do PDF diz: alteração do prepúcio → avaliar cicatriz e perfusão (p. 35). A parafimose é frequentemente iatrogênica, decorrente da retração forçada do prepúcio — justamente o que o material desaconselha no exame e na higiene (“não forçar retração”, p. 35 e 37).<\/p>", "mud": [["Prepúcio não retrátil, sem anel fibroso, assintomático", "Fimose fisiológica: higiene externa, não forçar", "PDF p. 37"], ["Cicatriz esbranquiçada e balanites recorrentes", "Fimose patológica: corticoide tópico ou cirurgia", "PDF p. 37"]], "arm": "Inverter os nomes: fimose é a que não abre; parafimose é a que não fecha.", "ouro": "Parafimose = urgência de perfusão: analgesia e redução por profissional.", "m2": ["O que caracteriza fimose patológica?", "Cicatriz esbranquiçada, balanites recorrentes ou sintomas obstrutivos (PDF p. 37)."], "n": ["Parafimose: retraído e preso, urgência.", "Fimose fisiológica é comum.", "Nunca forçar retração."], "loc": [{"f": "ped", "p": 35, "q": "Anel constriHvo, edema, dor e alteração de cor/perfusão.", "s": "Alterações genitais — menino (Parafimose)", "r": [[0.3656, 0.286, 0.6246, 0.3045], [0.3656, 0.3006, 0.4775, 0.3192]]}, {"f": "ped", "p": 37, "q": "Prepúcio retraído preso atrás da glande → edema e risco de isquemia. Urgência; analgesia e redução por prohssional treinado", "s": "Geniturinário — diferenciais e urgências (Parafimose)", "r": [[0.5056, 0.2307, 0.8898, 0.2492], [0.5056, 0.2453, 0.867, 0.2639], [0.5056, 0.26, 0.5699, 0.2785]]}], "img": ["sv-genital-menino"], "t": "P15"}, {"id": "P15-13", "sub": "Sinéquia labial", "comp": "Interpretação do exame genital feminino", "rac": "Conduta e armadilha de abuso", "q": "Menina de 2 anos, assintomática, em consulta de puericultura. Ao afastar suavemente os grandes lábios, observa-se membrana fina unindo os pequenos lábios na linha média, com pequena abertura anterior por onde a criança urina sem dificuldade. A mãe pergunta se “alguém fez algo” com a filha. Qual a conduta mais adequada?", "o": [["Higiene e observação, sem separar à força; o achado isolado não comprova nem exclui abuso", "Sinéquia assintomática: observação e higiene; não separar à força. Achados genitais isolados não permitem concluir abuso."], ["Separar os lábios no consultório com manobra digital para evitar fusão completa", "O material proíbe separar à força."], ["Notificar violência sexual, pois a aderência labial é um sinal físico de abuso", "Sinéquia não permite concluir abuso; também não exclui. Avalia-se o contexto, não o achado isolado."], ["Encaminhar para correção cirúrgica do introito vaginal com urgência", "Não é anomalia do introito que exija cirurgia; sintomáticas podem receber estrogênio ou corticoide tópico."]], "pista": "Membrana fina + assintomática = sinéquia: observar, não separar.", "pp": ["Reconhecer: membrana fina unindo pequenos lábios, abertura residual.", "Distinguir de anomalia do introito.", "Assintomática: higiene e observação; sintomática: tópico (estrogênio/corticoide).", "Abuso: aspecto genital isolado não comprova nem exclui."], "ap": "<p>O PDF reforça em três páginas que eritema, fissuras, sinéquia e variantes himenais não permitem concluir abuso (p. 36, 37, 50) e que não se realiza “teste de virgindade”. Ao mesmo tempo, “a ausência de sinais não justifica deixar de proteger” se houver relato ou contexto suspeito. Para a mãe, a resposta honesta é explicar que o achado é comum e não indica, por si só, violência.<\/p>", "mud": [["Jato desviado, gotejamento e ITU de repetição", "Sinéquia sintomática: estrogênio ou corticoide tópico orientado", "Tratamento tópico"], ["Criança com relato espontâneo de violência", "Acolher, proteger e notificar, independentemente do exame", "Exame normal não exclui"]], "arm": "Rotular sinéquia como sinal de abuso ou, ao contrário, usar exame normal para afastar violência relatada.", "ouro": "Sinéquia: observar e não separar à força; achado genital isolado não confirma nem exclui abuso.", "m2": ["Placas esbranquiçadas vulvoperianais em “oito”, com prurido e fissuras: hipótese?", "Líquen escleroso — especialista e corticoide tópico potente sob orientação (PDF p. 36)."], "n": ["Assintomática: observar.", "Não separar à força.", "Achado isolado não comprova abuso."], "loc": [{"f": "ped", "p": 36, "q": "AssintomáHca: observação e higiene. SintomáHca: avaliação para estrogênio ou corHcoide tópico. Não separar à força.", "s": "Alterações genitais — menina e RN (Sinéquia labial)", "r": [[0.6456, 0.1518, 0.8854, 0.1703], [0.6456, 0.1664, 0.896, 0.185], [0.6456, 0.1811, 0.9131, 0.1996]]}, {"f": "ped", "p": 36, "q": "Importante: aspecto do hímen, eritema, pequenas hssuras ou ausência de lesão não comprovam nem excluem abuso sexual.", "s": "Alterações genitais — menina e RN", "r": [[0.0768, 0.4876, 0.9, 0.5077], [0.0768, 0.5062, 0.1316, 0.5263]]}], "img": ["sv-genital-menina"], "t": "P15"}, {"id": "P15-14", "sub": "Corpo estranho vaginal", "comp": "Interpretação do exame genital feminino", "rac": "Diagnóstico diferencial", "q": "Menina de 6 anos com corrimento fétido e raias de sangue na calcinha há 5 semanas. Já recebeu orientação de higiene e banho de assento, sem melhora. Nega trauma; a mãe não lembra de nada introduzido. Ao exame externo, secreção sanguinolenta no introito, sem outras lesões. Qual a hipótese principal e conduta?", "o": [["Corpo estranho vaginal: ginecologia pediátrica, sem explorar às cegas", "Corrimento fétido/sanguinolento persistente/recorrente com história ausente sugere corpo estranho; não explorar às cegas."], ["Vulvovaginite inespecífica; manter higiene e banhos de assento por mais 3 meses", "Persistência apesar da higiene e o caráter fétido e sanguinolento afastam o quadro inespecífico simples."], ["Realizar exame especular no consultório para retirar o objeto", "O PDF não recomenda especular de rotina em criança e manda não explorar às cegas."], ["Concluir violência sexual pelo sangramento e notificar sem avaliação adicional", "Sangramento inexplicado merece avaliação especializada; o achado isolado não confirma abuso, embora o contexto deva ser avaliado."]], "pista": "Corrimento fétido + sanguinolento + persistente = corpo estranho até prova em contrário.", "pp": ["Vulvovaginite pré-puberal: higiene, irritantes, oxiúros.", "Sinal de alerta: fétido ou sanguinolento persistente.", "Hipótese: corpo estranho (história pode ser ausente).", "Conduta: ginecologia pediátrica; não explorar às cegas."], "ap": "<p>A tabela de diferenciais (PDF p. 37) mostra o raciocínio: eritema, prurido e corrimento sugerem vulvovaginite (irritantes, higiene, oxiúros), mas “corrimento fétido ou sanguinolento persistente: pensar corpo estranho e encaminhar”. Sangramento inexplicado sempre merece avaliação especializada (p. 36).<\/p>", "mud": [["Prurido perianal noturno e eritema vulvar", "Pensar em oxiúros como causa de vulvovaginite", "PDF p. 37"], ["Massa avermelhada circunferencial ao redor do meato com sangramento", "Prolapso uretral: avaliação especializada", "PDF p. 36"]], "arm": "Insistir em higiene em corrimento fétido e sanguinolento persistente.", "ouro": "Corrimento fétido e sanguinolento persistente na criança: corpo estranho — encaminhar, não explorar às cegas.", "m2": ["RN de 5 dias com secreção vaginal branca e discreto sangramento, bem e sem febre: conduta?", "Secreção neonatal fisiológica por retirada hormonal materna: orientar e observar (PDF p. 36)."], "n": ["Fétido + sanguinolento + persistente = corpo estranho.", "Ginecologia pediátrica.", "Sem exploração às cegas."], "loc": [{"f": "ped", "p": 36, "q": "Corrimento féHdo, sanguinolento ou recorrente; história pode ser ausente.", "s": "Alterações genitais — menina e RN (Corpo estranho)", "r": [[0.3656, 0.251, 0.6026, 0.2696], [0.3656, 0.2657, 0.6111, 0.2842]]}, {"f": "ped", "p": 37, "q": "Corrimento féHdo ou sanguinolento persistente: pensar corpo estranho e encaminhar.", "s": "Geniturinário — diferenciais (Vulvovaginite pré-puberal)", "r": [[0.6013, 0.5577, 0.9129, 0.5763], [0.5056, 0.5724, 0.7485, 0.5909]]}], "img": ["sv-genital-menina"], "t": "P15"}, {"id": "P15-15", "sub": "Genitália atípica no RN", "comp": "Reconhecimento de emergência", "rac": "Priorização", "q": "RN de 10 dias, 46,XX ainda não conhecido, nascido com clitóris aumentado e fusão labial parcial, sem gônadas palpáveis. Chega com vômitos, recusa alimentar, desidratação moderada e má perfusão. Qual a conduta inicial mais adequada segundo o material?", "o": [["Estabilizar, dosar glicemia e eletrólitos, pensar em HAC (17-OHP) e acionar equipe especializada já", "Genitália atípica + vômitos, desidratação ou choque: excluir crise adrenal — glicemia, eletrólitos, 17-OHP, equipe especializada urgente."], ["Agendar consulta ambulatorial com endocrinologia em 30 dias para definir o sexo", "O quadro é de urgência potencialmente fatal (crise de perda de sal)."], ["Tratar como gastroenterite aguda com soro oral e alta com retorno", "Ignora a pista da genitália atípica e o risco de crise adrenal."], ["Priorizar o cariótipo antes de qualquer outro exame laboratorial", "O cariótipo é importante, mas não antecede estabilização, glicemia e eletrólitos."]], "pista": "Genitália atípica + vômitos/desidratação/choque = crise adrenal até exclusão.", "pp": ["Reconhecer genitália atípica (clitóris/falo, fusão labial, gônadas).", "Sinais sistêmicos: vômitos, desidratação, choque.", "Hipótese: hiperplasia adrenal congênita com perda de sal.", "Conduta: estabilidade, glicemia, eletrólitos, 17-OHP, equipe especializada urgente."], "ap": "<p>O PDF trata “variação do desenvolvimento sexual” como situação de equipe especializada urgente, com glicemia, eletrólitos e 17-OHP “conforme caso” e a ordem de “excluir crise adrenal” (p. 36–37). A prioridade é a estabilidade hemodinâmica e metabólica; a definição diagnóstica completa vem depois.<\/p>", "mud": [["RN bem, sem vômitos, genitália atípica isolada", "Equipe especializada rapidamente, sem urgência hemodinâmica", "Ainda é situação especializada"], ["Menino com hipospádia distal e testículos tópicos", "Urologia pediátrica eletiva", "Sem sinal de DDS"]], "arm": "Encarar genitália atípica como questão apenas “de registro do sexo” e perder a crise adrenal.", "ouro": "Genitália atípica com vômitos e desidratação: glicemia, eletrólitos e 17-OHP — crise adrenal até prova em contrário.", "m2": ["Qual o cuidado com registro e exames repetidos em alteração genital?", "Descrever objetivamente e evitar fotografias ou exames repetidos sem indicação (PDF p. 37)."], "n": ["Genitália atípica = equipe especializada urgente.", "Vômitos/desidratação → crise adrenal.", "Glicemia, eletrólitos, 17-OHP."], "loc": [{"f": "ped", "p": 36, "q": "Equipe especializada urgente; glicemia, eletrólitos, 17-OHP conforme caso; excluir crise adrenal.", "s": "Alterações genitais — menina e RN (Variação do desenvolvimento sexual)", "r": [[0.6456, 0.4405, 0.8992, 0.4591], [0.6456, 0.4552, 0.8731, 0.4737], [0.6456, 0.4698, 0.782, 0.4884]]}, {"f": "ped", "p": 37, "q": "Avaliar estabilidade, glicemia e eletrólitos; suspeitar hiperplasia adrenal congênita, especialmente com vômitos, desidratação ou choque.", "s": "Geniturinário — diferenciais (Genitália atípica no RN)", "r": [[0.5056, 0.5927, 0.9123, 0.6112], [0.5056, 0.6073, 0.8984, 0.6259], [0.5056, 0.622, 0.5829, 0.6405]]}], "img": ["sv-genital-menina"], "t": "P15"}, {"id": "P16-01", "sub": "Preparação e criança resistente", "comp": "Exame genital — preparo e ética", "rac": "Conduta no exame", "q": "Menina de 5 anos é levada à UBS por ardor ao urinar. Ao ser informada de que o médico vai “olhar a pererequinha”, chora, fecha as pernas e se recusa. Não há febre, sangramento ou sinais de urgência. A mãe sugere “segurar firme para acabar logo”. Qual a conduta mais adequada?", "o": [["Não forçar: explicar, oferecer acompanhante e, se a recusa persistir, reprogramar", "O PDF orienta não forçar exame em criança resistente, salvo urgência com abordagem especializada; explicar e oferecer acompanhante."], ["Pedir à mãe e à técnica que contenham a criança, pois o exame genital é obrigatório na queixa urinária", "Contenção para exame genital não urgente é traumática e contraria o material."], ["Realizar o exame sob contenção, mas incluir toque vaginal para não precisar repetir o procedimento depois", "Além de forçar, toque vaginal não é feito de rotina em criança."], ["Dispensar o exame genital e tratar empiricamente como ITU, sem nenhuma outra avaliação clínica ou laboratorial", "O exame pode ser reprogramado; abdome, flancos e urina continuam sendo avaliados."]], "pista": "Criança resistente sem urgência: não forçar.", "pp": ["Contexto: queixa não urgente.", "Regra: explicar, oferecer acompanhante/chaperone, assentimento.", "Não forçar exame em criança resistente; exceção é urgência, com abordagem especializada.", "Seguir com o que é possível (abdome, flancos, urina) e reprogramar."], "ap": "<p>A sequência do PDF (p. 34) começa por “explicar o que será feito e oferecer acompanhante/chaperone; não forçar exame em criança resistente, salvo urgência com abordagem especializada”. Exame genital forçado é vivido como violência e compromete consultas futuras; a avaliação da queixa urinária pode avançar com anamnese, abdome, flancos, jato e exame de urina.<\/p>", "mud": [["Houvesse sangramento genital importante", "Urgência: abordagem especializada (eventualmente sob sedação)", "Exceção do material"], ["A criança aceitasse com a mãe ao lado", "Posição em rã, exposição mínima, inspeção antes da palpação", "Sequência padrão"]], "arm": "Achar que a obrigação de examinar justifica contenção. Fora de urgência, não se força.", "ouro": "Criança que recusa, sem urgência: não forçar — explicar, acolher, reprogramar.", "m2": ["Qual posição para a menina?", "Posição em rã: quadris e joelhos fletidos e abduzidos, decúbito dorsal, exposição mínima (PDF p. 34)."], "n": ["Explicar e oferecer acompanhante.", "Não forçar sem urgência.", "Inspeção antes da palpação."], "loc": [{"f": "ped", "p": 34, "q": "Explicar o que será feito e oferecer acompanhante/chaperone; não forçar exame em criança resistente, salvo urgência com abordagem especializada.", "s": "Exame clínico geniturinário — Sequência prática", "r": [[0.0936, 0.1637, 0.8602, 0.1837], [0.0768, 0.1822, 0.3614, 0.2023]]}], "img": [], "t": "P16"}, {"id": "P16-02", "sub": "Posição do menino com cremastérico intenso", "comp": "Técnica do exame genital masculino", "rac": "Técnica", "q": "Menino de 6 anos encaminhado por “testículo que some”. Em decúbito dorsal, ao tocar a face interna da coxa durante a palpação, o testículo sobe rapidamente ao canal. Qual ajuste técnico o material propõe para examiná-lo?", "o": [["Examinar sentado de pernas cruzadas, deslizando a mão do canal inguinal para a bolsa", "Para meninos com reflexo cremastérico intenso, o PDF sugere sentado de pernas cruzadas; palpação deslizando do canal inguinal à bolsa."], ["Examinar em pé com manobra de Valsalva, pinçando o testículo diretamente na bolsa", "Pinçar diretamente estimula a retração; a técnica é deslizar da região inguinal para a bolsa."], ["Desistir do exame físico e pedir US para localizar o testículo antes de qualquer palpação", "O exame clínico diferencia retrátil de criptorquídico; US não substitui a manobra."], ["Aplicar gelo na coxa para inibir o reflexo e palpar a bolsa de baixo para cima", "Frio aumenta a contração do cremaster; não é técnica do material."]], "pista": "Cremastérico intenso → sentado de pernas cruzadas; palpar do canal para a bolsa.", "pp": ["Problema: reflexo cremastérico exacerbado.", "Ajuste de posição do PDF: decúbito dorsal ou sentado de pernas cruzadas.", "Técnica: mão desliza da região inguinal para a bolsa.", "Interpretar: retrátil permanece temporariamente na bolsa."], "ap": "<p>A posição sentada com pernas cruzadas relaxa o cremaster, e a manobra de “ordenhar” o canal inguinal em direção à bolsa evita que o testículo fuja para cima. O objetivo é responder: o testículo alcança a bolsa e permanece? (PDF p. 34).<\/p>", "mud": [["O testículo descesse e permanecesse", "Retrátil: seguimento", "PDF p. 34"], ["Não alcançasse a bolsa", "Criptorquidia: encaminhar", "PDF p. 35"]], "arm": "Pinçar a bolsa diretamente e concluir “testículo ausente”.", "ouro": "Cremastérico intenso: sentar de pernas cruzadas e deslizar da virilha à bolsa.", "m2": ["Como se pesquisa o reflexo cremastérico?", "Estímulo suave da face medial da coxa → elevação ipsilateral do testículo (PDF p. 34)."], "n": ["Sentado de pernas cruzadas.", "Deslizar do canal à bolsa.", "Inspeção antes da palpação."], "loc": [{"f": "ped", "p": 34, "q": "para meninos, decúbito dorsal ou sentado de pernas cruzadas se reuexo cremastérico intenso.", "s": "Exame clínico geniturinário — Sequência prática", "r": [[0.3116, 0.2008, 0.916, 0.2209], [0.0768, 0.2193, 0.1398, 0.2394]]}, {"f": "ped", "p": 34, "q": "Palpação do tesŠculo: mão desliza suavemente da região inguinal em direção à bolsa", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.4922, 0.565, 0.8958, 0.5851], [0.0768, 0.5836, 0.2777, 0.6037]]}], "img": ["sv-genital-menino"], "t": "P16"}, {"id": "P16-03", "sub": "Transiluminação: alcance e limite", "comp": "Manobras do exame genital", "rac": "Interpretação de manobra", "q": "Ao examinar um menino de 3 anos com massa escrotal indolor, o estudante faz a transiluminação em sala escura e a luz atravessa a massa. Ele conclui: “transiluminação positiva, portanto não é tumor nem hérnia”. Como o avaliador deve corrigi-lo?", "o": [["A luz sugere conteúdo líquido, mas não exclui outras causas; integrar ao exame", "Exatamente a ressalva do PDF: sugere líquido, mas não exclui outras causas."], ["Correto: a transiluminação positiva tem valor de exclusão absoluto para hérnia e para tumor testicular", "O material não atribui valor de exclusão à manobra."], ["A transiluminação só deve ser feita em massa dolorosa, para confirmar torção", "O PDF indica a manobra sobre massa escrotal indolor; torção é diagnóstico clínico e cirúrgico."], ["O exame foi inválido, pois a manobra deve ser feita com a sala iluminada", "A técnica pede local escurecido."]], "pista": "“Sugere líquido, mas não exclui outras causas.”", "pp": ["Técnica: sala escurecida, luz sobre massa indolor.", "Positiva = sugere líquido (hidrocele).", "Limite: não exclui outras causas (inclusive hérnia com conteúdo líquido associado).", "Integrar com redutibilidade, variação com choro, dor."], "ap": "<p>Manobras semiológicas raramente “excluem” sozinhas. A hérnia inguinal pode coexistir com hidrocele, e alças intestinais em lactentes podem transiluminar parcialmente. Por isso o PDF descreve a manobra com cautela e manda observar variação com choro e redutibilidade (p. 34, 37).<\/p>", "mud": [["A massa aumentasse ao choro e reduzisse", "Pensar em hérnia apesar da transiluminação", "PDF p. 37"], ["Massa dolorosa e irredutível com vômitos", "Encarceramento: urgência", "PDF p. 37"]], "arm": "Transformar um achado “sugestivo” em critério de exclusão.", "ouro": "Transiluminação positiva sugere líquido; não exclui nada sozinha.", "m2": ["O que o PDF manda descrever ao fechar a estação?", "Localização, tamanho, simetria, cor, dor, secreção e alterações anatômicas, sem inferir diagnóstico pelo aspecto isolado (PDF p. 34)."], "n": ["Sala escura, massa indolor.", "Sugere líquido.", "Não exclui outras causas."], "loc": [{"f": "ped", "p": 34, "q": "Transiluminação: em local escurecido, usar luz apropriada sobre massa escrotal indolor; passagem de luz sugere conteúdo líquido (hidrocele), mas não exclui outras causas.", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.0768, 0.5465, 0.863, 0.5666], [0.0768, 0.565, 0.4951, 0.5851]]}], "img": ["sv-genital-menino"], "t": "P16"}, {"id": "P16-04", "sub": "Reflexo cremastérico", "comp": "Manobras do exame genital", "rac": "Interpretação de sinal", "q": "Adolescente de 14 anos com dor escrotal direita há 3 horas. O reflexo cremastérico está presente à direita. O interno conclui que “o cremastérico presente afasta torção”. Qual a afirmação correta segundo o material?", "o": [["A ausência sugere torção, mas a presença não a exclui; decide o quadro clínico", "O PDF: “ausência pode sugerir torção, mas presença não exclui”."], ["O cremastérico presente exclui torção e autoriza alta com analgésico e retorno se a dor persistir", "Presença não exclui; com dor aguda, torção segue no diferencial."], ["O reflexo é pesquisado comprimindo o testículo e observando a dor referida", "A técnica é estímulo suave da face medial da coxa com elevação ipsilateral do testículo."], ["O cremastérico substitui a avaliação cirúrgica quando o Doppler está indisponível", "Nenhum sinal isolado substitui a avaliação cirúrgica na suspeita."]], "pista": "Cremastérico: ausência sugere; presença não exclui.", "pp": ["Técnica: estímulo da face medial da coxa → elevação do testículo.", "Ausente: sugere torção.", "Presente: não exclui.", "Conduta guiada pela clínica: dor súbita, náusea, posição do testículo."], "ap": "<p>Sinais com boa sensibilidade em uma direção não funcionam na outra. O PDF faz essa ressalva para o cremastérico e acrescenta que o sinal de Prehn não deve ser usado para descartar torção (p. 34). Em dor escrotal aguda, a regra prática do material permanece: torção até exclusão (p. 35).<\/p>", "mud": [["O cremastérico estivesse ausente", "Reforça torção: cirurgia imediata", "PDF p. 35"], ["Dor gradual, febre, disúria", "Ainda assim avaliar; torção não se exclui por sinal isolado", "Raciocínio clínico"]], "arm": "Usar cremastérico presente ou Prehn para “descartar” torção.", "ouro": "Cremastérico presente não afasta torção.", "m2": ["Qual o achado de posição típico na torção?", "Testículo alto e horizontal, com edema (PDF p. 35)."], "n": ["Estímulo na face medial da coxa.", "Ausência sugere torção.", "Presença não exclui."], "loc": [{"f": "ped", "p": 34, "q": "Reuexo cremastérico: esŠmulo suave da face medial da coxa → elevação ipsilateral do tesŠculo; ausência pode sugerir torção, mas presença não exclui.", "s": "Exame clínico geniturinário — Manobras úteis", "r": [[0.0768, 0.6258, 0.9085, 0.6459], [0.0768, 0.6443, 0.311, 0.6644]]}], "img": ["sv-genital-menino"], "t": "P16"}, {"id": "P16-05", "sub": "Exame genital no adolescente", "comp": "Ética do exame do adolescente", "rac": "Indicação do exame", "q": "Rapaz de 15 anos vem para avaliação esportiva. Não tem queixas genitais. O estudante pretende “fazer o exame completo, incluindo genital, porque é rotina”. Qual orientação do material se aplica?", "o": [["Genitália só com indicação, privacidade e consentimento, podendo interromper", "O PDF: examinar genitais apenas com indicação, privacidade e consentimento; o paciente pode pedir interrupção."], ["O exame genital é obrigatório em toda consulta de adolescente, independentemente de consentimento", "Não há obrigatoriedade; é exame com indicação e consentimento."], ["O exame genital deve ser feito sempre na presença dos pais, para proteção legal do médico e da instituição", "O material prioriza privacidade e acompanhante/chaperone conforme a necessidade, não a presença obrigatória dos pais."], ["Em adolescentes, o estadiamento puberal deve ser substituído pela idade óssea", "Tanner é parte do exame; idade óssea é exame complementar em atraso puberal."]], "pista": "“Examinar genitais apenas com indicação, privacidade e consentimento.”", "pp": ["Contexto: avaliação preventiva sem queixa.", "Exame do adolescente: PA, peso, estatura, IMC, pele, tireoide, desenvolvimento puberal conforme indicação.", "Genital: só com indicação, privacidade, consentimento.", "Paciente pode pedir interrupção."], "ap": "<p>O PDF lista o exame preventivo do adolescente: PA, peso, estatura, IMC por idade, marcha/postura, pele (acne, acantose, lesões), tireoide e desenvolvimento puberal conforme indicação; investigar sono, atividade física, alimentação, vacinação, saúde bucal e visão (p. 43). O estadiamento pode ser obtido com o mínimo de exposição necessário, sempre explicando ao paciente.<\/p>", "mud": [["Houvesse queixa de dor ou massa testicular", "Exame genital indicado, com consentimento", "Indicação clínica"], ["O adolescente pedisse para parar", "Interromper", "Direito do paciente"]], "arm": "Confundir “exame completo” com exame genital de rotina.", "ouro": "Adolescente: genital só com indicação, privacidade e consentimento.", "m2": ["Quais achados de pele o PDF manda observar no adolescente?", "Acne, acantose e lesões (PDF p. 43)."], "n": ["Exame genital com indicação.", "Privacidade e consentimento.", "Pode interromper."], "loc": [{"f": "ped", "p": 43, "q": "Examinar genitais apenas com indicação, privacidade e consenHmento; explicar que o paciente pode pedir interrupção.", "s": "Adolescente — Exame clínico e cuidado preventivo", "r": [[0.0768, 0.4585, 0.9136, 0.4786]]}], "img": ["sv-tanner"], "t": "P16"}, {"id": "P16-06", "sub": "Prepúcio e meato no exame do menino", "comp": "Técnica do exame genital masculino", "rac": "Técnica", "q": "No exame de um menino de 2 anos sem queixas, a mãe pergunta se o médico vai “puxar a pele para ver se está tudo limpo”. O que o exame deve avaliar no pênis segundo o material?", "o": [["Meato, curvatura, lesões e secreção, sem retrair à força", "O PDF lista: posição do meato, curvatura, edema, lesões, secreções, prepúcio sem retração forçada."], ["Retrair totalmente o prepúcio para expor a glande e limpar o esmegma", "Retração forçada é contraindicada e pode causar parafimose e fissuras."], ["Medir o comprimento peniano esticado em toda consulta para estadiar Tanner", "O estadiamento usa outros critérios; medir esticado não é rotina do material."], ["Avaliar apenas a bolsa, pois o pênis só é examinado se houver queixa urinária", "O pênis e o meato fazem parte da inspeção padrão."]], "pista": "“Prepúcio sem retração forçada.”", "pp": ["Inspeção antes da palpação.", "Pênis e meato: posição do meato, curvatura, edema, lesões, secreções.", "Prepúcio: não forçar.", "Bolsa e virilhas: simetria, testículos, massas, hérnia/hidrocele."], "ap": "<p>A fimose fisiológica (prepúcio não retrátil, sem anel fibroso e sem sintomas) é comum na infância; a orientação é higiene externa e não forçar retração (PDF p. 37). Forçar a retração produz microfissuras que cicatrizam e podem gerar fimose patológica, além do risco de parafimose.<\/p>", "mud": [["Prepúcio com anel esbranquiçado e balanites recorrentes", "Fimose patológica: corticoide tópico ou cirurgia", "PDF p. 37"], ["Meato na face ventral", "Hipospádia: urologia pediátrica", "PDF p. 35"]], "arm": "Achar que higiene exige retrair o prepúcio da criança.", "ouro": "No menino pequeno: olhar meato e prepúcio, nunca forçar a retração.", "m2": ["O que avaliar na bolsa e virilhas?", "Simetria, presença/localização dos dois testículos, volume, consistência, dor, massas; hérnia/hidrocele (PDF p. 34)."], "n": ["Meato, curvatura, lesões, secreção.", "Sem retração forçada.", "Fimose fisiológica é comum."], "loc": [{"f": "ped", "p": 34, "q": "Posição do meato, curvatura, edema, lesões, secreções, prepúcio sem retração forçada.", "s": "Exame clínico geniturinário — Menino: pênis e meato", "r": [[0.5056, 0.3029, 0.8633, 0.3215], [0.5056, 0.3176, 0.71, 0.3361]]}], "img": ["sv-genital-menino"], "t": "P16"}, {"id": "P16-07", "sub": "Exame da menina pré-púbere", "comp": "Técnica do exame genital feminino", "rac": "Técnica e limites", "q": "Menina de 7 anos com prurido vulvar. Com a criança em posição de rã, qual sequência corresponde ao exame recomendado?", "o": [["Inspeção externa com afastamento labial suave, sem toque ou especular", "O PDF descreve a inspeção externa com afastamento suave e diz que não se faz toque vaginal ou especular de rotina em criança."], ["Fazer exame especular pediátrico para colher secreção vaginal antes mesmo de inspecionar a vulva", "Especular não é rotina na criança e a inspeção vem antes."], ["Realizar toque retal e vaginal bimanual para avaliar útero e anexos, já que há queixa genital", "Exame invasivo de rotina não é indicado."], ["Avaliar o hímen para afirmar se houve ou não abuso sexual", "O aspecto do hímen não comprova nem exclui abuso; não se realiza “teste de virgindade”."]], "pista": "Menina: exame EXTERNO com afastamento labial suave; nada invasivo de rotina.", "pp": ["Posição em rã.", "Inspeção externa: grandes/pequenos lábios, clitóris, meato, introito, secreção, eritema, aderências, lesões.", "Afastamento labial suave se necessário.", "Períneo/ânus: inspeção se indicado.", "Sem toque vaginal/especular de rotina."], "ap": "<p>No prurido vulvar pré-puberal, o PDF lembra causas como irritantes, higiene e oxiúros (p. 37). O exame externo costuma bastar; corrimento fétido ou sanguinolento persistente muda o raciocínio (corpo estranho) e leva à ginecologia pediátrica, não à exploração às cegas.<\/p>", "mud": [["Corrimento fétido e sanguinolento persistente", "Pensar em corpo estranho e encaminhar", "PDF p. 37"], ["Placas esbranquiçadas em “oito”", "Líquen escleroso", "PDF p. 36"]], "arm": "Usar o exame do hímen para “confirmar” ou “descartar” abuso.", "ouro": "Menina: inspeção externa cuidadosa; nada de toque ou especular de rotina.", "m2": ["O que o PDF recomenda no registro?", "Descrever achado, lateralidade, tamanho, consistência, dor, posição, secreção e relação com micção; evitar fotos e exames repetidos sem indicação (PDF p. 37)."], "n": ["Posição em rã.", "Afastamento labial suave.", "Sem toque/especular de rotina."], "loc": [{"f": "ped", "p": 34, "q": "Grandes/pequenos lábios, clitóris, meato uretral, introito, secreção, eritema, aderências e lesões; afastamento labial suave se necessário.", "s": "Exame clínico geniturinário — Menina: região externa", "r": [[0.5056, 0.3875, 0.8764, 0.4061], [0.5056, 0.4022, 0.879, 0.4207], [0.5056, 0.4168, 0.6402, 0.4354]]}, {"f": "ped", "p": 34, "q": "Não realizaria toque vaginal ou especular de roHna em criança.", "s": "Exame clínico geniturinário — Como fechar a estação", "r": [[0.1932, 0.7234, 0.6381, 0.7435]]}], "img": ["sv-genital-menina"], "t": "P16"}, {"id": "P16-08", "sub": "Registro do exame genital", "comp": "Documentação", "rac": "Comunicação e registro", "q": "Após examinar menino de 8 anos com aumento escrotal esquerdo, o estudante escreve no prontuário: “hidrocele”. O preceptor pede outra forma de registro. Qual está de acordo com o material?", "o": [["“Aumento escrotal à esquerda, ~4 cm, indolor, cístico, transilumina; testículo palpável”", "O PDF: descrever localização, tamanho, simetria, cor, dor, secreção e alterações anatômicas, sem inferir diagnóstico pelo aspecto isolado."], ["“Hidrocele à esquerda, sem necessidade de seguimento”, pois o diagnóstico é clínico", "Rotular sem descrever infere diagnóstico pelo aspecto e não documenta o exame."], ["Fotografar a bolsa escrotal com o celular para anexar ao prontuário e comparar na próxima consulta", "O PDF orienta evitar fotografias sem indicação."], ["“Exame genital normal”, para não constranger a família", "Registro falso é inaceitável e prejudica o seguimento."]], "pista": "Descrever, não rotular.", "pp": ["Regra de fechamento: descrever localização, tamanho, simetria, cor, dor, secreção.", "Não inferir diagnóstico pelo aspecto isolado.", "Evitar fotografias e exames repetidos."], "ap": "<p>O registro descritivo permite comparação entre consultas e evita que hipóteses virem rótulos. O PDF repete essa orientação no exame geniturinário (p. 34) e no registro final dos diferenciais (p. 37), inclusive em contexto de suspeita de violência, em que a descrição objetiva é parte da proteção.<\/p>", "mud": [["Houvesse suspeita de violência", "Registrar palavras exatas, data/hora, achados objetivos e acompanhante", "PDF p. 50"]], "arm": "Escrever só a hipótese.", "ouro": "Prontuário genital: descrição objetiva, não diagnóstico pelo aspecto.", "m2": ["O que registrar no relato espontâneo de violência?", "Palavras exatas, data/hora, achados objetivos e acompanhante (PDF p. 50)."], "n": ["Descrever achados.", "Não inferir pelo aspecto.", "Sem fotos sem indicação."], "loc": [{"f": "ped", "p": 34, "q": "Descreveria localização, tamanho, simetria, cor, dor, secreção e alterações anatômicas, sem inferir diagnósHco pelo aspecto isolado.", "s": "Exame clínico geniturinário — Como fechar a estação", "r": [[0.0768, 0.7048, 0.8871, 0.7249], [0.0768, 0.7234, 0.196, 0.7435]]}, {"f": "ped", "p": 37, "q": "evitar fotograhas ou exames repeHdos sem indicação.", "s": "Geniturinário — Registro do exame", "r": [[0.4688, 0.7003, 0.8507, 0.7204]]}], "img": [], "t": "P16"}, {"id": "P16-09", "sub": "Telarca aos 7 anos", "comp": "Marcos puberais", "rac": "Interpretação de idade-limite", "q": "Menina de 7 anos e 2 meses: a mãe nota “caroço” sob a aréola direita há 2 meses, depois à esquerda. Ao exame, broto mamário bilateral; sem pelos pubianos. Estatura acima do canal habitual na caderneta. Como interpretar?", "o": [["Puberdade precoce (telarca antes dos 8 anos): investigar", "O PDF: puberdade precoce antes dos 8 anos em meninas."], ["Telarca normal, pois a faixa esperada é de 6 a 13 anos", "A faixa do material é 8–13 anos."], ["Achado isolado sem relevância enquanto não houver menarca", "A telarca é o marco; não se espera a menarca para investigar."], ["Ginecomastia fisiológica da infância, que regride espontaneamente", "O termo não se aplica; broto bilateral progressivo em menina de 7 anos é telarca."]], "pista": "Menina: puberdade precoce se início antes dos 8 anos.", "pp": ["Marco: telarca (M2).", "Faixa normal: 8–13 anos.", "Antes dos 8 = precoce.", "Aceleração do crescimento reforça ativação puberal."], "ap": "<p>Na menina, o primeiro sinal puberal costuma ser a telarca; o estirão vem antes da menarca, que ocorre em geral 2–3 anos após a telarca (PDF p. 44). O aumento da velocidade de crescimento acompanha a ativação do eixo e reforça a necessidade de investigar quando o início é antes dos 8 anos.<\/p>", "mud": [["Mesma telarca aos 9 anos", "Variante normal (8–13)", "Faixa do PDF"], ["Apenas pelos pubianos aos 7, sem mamas", "Pubarca isolada: não comprova ativação ovariana; investigar andrógenos adrenais", "PDF p. 45"]], "arm": "Usar 6 ou 7 anos como corte. O material usa 8 (meninas) e 9 (meninos).", "ouro": "Telarca < 8 anos ou aumento testicular < 9 anos = precoce.", "m2": ["Menino de 8 anos com testículos de 5 mL: interpretação?", "Início puberal antes dos 9 anos: puberdade precoce, investigar (PDF p. 44)."], "n": ["Telarca 8–13 anos.", "< 8 = precoce.", "Menarca 2–3 anos após a telarca."], "loc": [{"f": "ped", "p": 44, "q": "Meninas: telarca 8–13 anos, esHrão antes da menarca; menarca geralmente 2–3 anos após telarca.", "s": "Tanner e amenorreia — Marcos puberais e atraso", "r": [[0.0768, 0.366, 0.7722, 0.3861]]}, {"f": "ped", "p": 44, "q": "puberdade precoce antes dos 8 (meninas) ou 9 (meninos).", "s": "Tanner e amenorreia — Marcos puberais e atraso", "r": [[0.3009, 0.4032, 0.713, 0.4233]]}], "img": ["sv-puberdade"], "t": "P16"}, {"id": "P16-10", "sub": "Sem telarca aos 13 anos", "comp": "Marcos puberais", "rac": "Atraso puberal", "q": "Menina de 13 anos e 3 meses, M1 P2, estatura no percentil 3, mãe com menarca aos 12. Sem doenças crônicas conhecidas. A avó diz que “é só esperar”. Segundo o material, o que fazer?", "o": [["Investigar: ausência de telarca aos 13 anos é critério de atraso puberal", "O PDF manda investigar ausência de telarca aos 13 anos."], ["Esperar até os 15 anos, pois só então se investiga amenorreia primária", "O limite de 15 anos é para menarca; para telarca o limite é 13."], ["A presença de P2 prova que os ovários já estão ativos, então não há atraso", "Pubarca depende de andrógenos adrenais e não comprova ativação ovariana."], ["Prescrever anticoncepcional oral para induzir as mamas", "Indução puberal é decisão especializada após investigação; anticoncepcional não é a ferramenta."]], "pista": "Sem mamas aos 13 = investigar (mesmo com pelos).", "pp": ["Telarca esperada 8–13.", "Limite: sem telarca aos 13 → investigar.", "P2 vem de andrógenos adrenais.", "Baixa estatura: pensar também em Turner e doença crônica."], "ap": "<p>A combinação “sem mamas + baixa estatura” abre o diferencial de disgenesia gonadal (Turner) e de causas funcionais/centrais; os exames iniciais são FSH, LH, estradiol, TSH, prolactina e US pélvico, com idade óssea e cariótipo conforme achados (PDF p. 44–45). O caso de prova do PDF — 13 anos, M1, baixa estatura, FSH alto — aponta Turner (p. 47).<\/p>", "mud": [["FSH alto", "Falência gonadal: cariótipo e endocrinologia", "PDF p. 44"], ["FSH baixo, idade óssea atrasada, pais tardios", "Atraso constitucional (diagnóstico de exclusão)", "PDF p. 45"]], "arm": "Confundir os limites: 13 anos (telarca) × 15 anos (menarca).", "ouro": "Sem telarca aos 13: investigar; pubarca não prova ovário ativo.", "m2": ["Quais estigmas de Turner o PDF cita?", "Baixa estatura, pescoço alado, tórax amplo — e lembra que Turner pode ter poucos estigmas (PDF p. 45)."], "n": ["Telarca ausente aos 13 → investigar.", "Menarca ausente aos 15 → investigar.", "P isolado não prova ovário ativo."], "loc": [{"f": "ped", "p": 44, "q": "InvesHgar ausência de telarca aos 13 ou volume tesHcular <4 mL aos 14", "s": "Tanner e amenorreia — Marcos puberais e atraso", "r": [[0.6057, 0.3846, 0.8893, 0.4047], [0.0768, 0.4032, 0.3038, 0.4233]]}, {"f": "ped", "p": 45, "q": "Pelos pubianos dependem sobretudo de andrógenos adrenais: pubarca isolada NÃO comprova aHvação ovariana.", "s": "Amenorreia primária — Fisiologia", "r": [[0.6452, 0.2193, 0.912, 0.2394], [0.0768, 0.2379, 0.6097, 0.258]]}], "img": ["sv-puberdade", "sv-tanner"], "t": "P16"}, {"id": "P16-11", "sub": "Volume testicular aos 14 anos", "comp": "Marcos puberais masculinos", "rac": "Atraso puberal", "q": "Rapaz de 14 anos e 5 meses, queixa de ser “o mais baixo da turma”. Volume testicular de 3 mL bilateralmente ao orquidômetro, pênis infantil, P1. Refere não sentir cheiros. Qual a interpretação?", "o": [["Atraso puberal (< 4 mL aos 14); com anosmia, pensar em Kallmann", "Volume < 4 mL aos 14 exige investigação; anosmia/hiposmia sugere Kallmann."], ["Normal, pois o aumento testicular só começa após os 15 anos", "A faixa do PDF é 9–14 anos."], ["Puberdade precoce, já que os testículos são palpáveis", "Precoce é início antes dos 9 anos; aqui o início não ocorreu."], ["Hipogonadismo hipergonadotrófico confirmado pelo exame físico", "Sem dosar FSH/LH não se classifica; e a anosmia aponta para causa central (gonadotrofinas baixas)."]], "pista": "< 4 mL aos 14 = investigar; anosmia = Kallmann.", "pp": ["Primeiro sinal puberal masculino: testículos ≥ 4 mL (G2), entre 9 e 14 anos.", "< 4 mL aos 14 → investigar atraso.", "Pista: anosmia → deficiência de GnRH (Kallmann).", "Esperado: gonadotrofinas e esteroides sexuais baixos."], "ap": "<p>O PDF descreve o hipogonadismo hipogonadotrófico congênito como deficiência de GnRH, com síndrome de Kallmann se houver anosmia/hiposmia; manejo com endocrinologia, avaliação genética/hipofisária e indução puberal individualizada (p. 45). O diferencial principal é o atraso constitucional, diagnóstico de exclusão com história familiar de puberdade tardia e idade óssea atrasada.<\/p>", "mud": [["Pai com puberdade tardia, olfato normal, idade óssea atrasada", "Atraso constitucional: acompanhar crescimento e progressão", "PDF p. 45"], ["Testículos 6 mL aos 12 anos", "Normal (G2 iniciado)", "Faixa 9–14"]], "arm": "Ignorar a pergunta sobre olfato — é ela que separa Kallmann de atraso constitucional.", "ouro": "Menino: < 4 mL aos 14 investiga; anosmia aponta Kallmann.", "m2": ["Que alterações do olfato o PDF manda perguntar na estação de amenorreia?", "“Alteração do olfato” está na anamnese dirigida — pista de Kallmann (PDF p. 47)."], "n": ["G2 = ≥ 4 mL.", "Faixa 9–14 anos.", "Anosmia → Kallmann."], "loc": [{"f": "ped", "p": 44, "q": "Meninos: aumento tesHcular 9–14 anos, seguido de crescimento peniano e esHrão mais tardio.", "s": "Tanner e amenorreia — Marcos puberais e atraso", "r": [[0.7694, 0.366, 0.9086, 0.3861], [0.0768, 0.3846, 0.6085, 0.4047]]}, {"f": "ped", "p": 45, "q": "Dehciência de GnRH; síndrome de Kallmann se anosmia/hiposmia.", "s": "Amenorreia primária — Atraso puberal: causas centrais", "r": [[0.3656, 0.5015, 0.5867, 0.5201], [0.3656, 0.5162, 0.5723, 0.5347]]}], "img": ["sv-orquidometro", "sv-puberdade"], "t": "P16"}, {"id": "P16-12", "sub": "Primeiro sinal puberal no menino", "comp": "Marcos puberais masculinos", "rac": "Interpretação de exame", "q": "Menino de 10 anos e 6 meses. A mãe está preocupada porque “o pênis ainda é de criança e não tem pelos”, mas os testículos medem 5 mL, com bolsa de textura mais fina e avermelhada. Qual a interpretação correta?", "o": [["Puberdade iniciada: o testículo ≥ 4 mL é o primeiro marco e precede o pênis", "No menino, aumento testicular 9–14 anos vem antes do crescimento peniano e do estirão."], ["Atraso puberal, pois o pênis deveria crescer antes dos testículos", "A sequência é inversa: testículos primeiro, pênis depois."], ["Puberdade precoce, porque 5 mL antes dos 12 anos é patológico", "Precoce é antes dos 9 anos."], ["Hipogonadismo, já que a ausência de pelos indica falta de testosterona", "Pelos podem vir depois e dependem também de andrógenos adrenais; G2 já está presente."]], "pista": "G2 = testículos ≥ 4 mL e mudança da bolsa: primeiro sinal puberal masculino.", "pp": ["Volume ≥ 4 mL = G2.", "Bolsa muda de textura = G2.", "Sequência: testículos → pênis → estirão.", "Idade dentro de 9–14 anos."], "ap": "<p>Na tabela de Tanner do PDF, G2 é definido por testículos ≥ 4 mL e bolsa que muda de textura; G3, crescimento do pênis em comprimento; G4, aumento do diâmetro/glande e escurecimento da bolsa (p. 44). O estirão masculino é mais tardio que o feminino.<\/p>", "mud": [["Mesmo achado aos 8 anos", "Precoce: investigar", "< 9 anos"], ["3 mL aos 14 anos e 6 meses", "Atraso: investigar", "< 4 mL aos 14"]], "arm": "Esperar crescimento peniano como primeiro sinal.", "ouro": "Menino: o primeiro sinal é o testículo ≥ 4 mL.", "m2": ["Como registrar este menino em Tanner?", "G2 (testículos ≥ 4 mL, bolsa com textura alterada) e P1 — registrados separadamente (PDF p. 44)."], "n": ["G2 = ≥ 4 mL.", "Testículo → pênis → estirão.", "Registrar G e P separados."], "loc": [{"f": "ped", "p": 44, "q": "TesŠculos ≥4 mL; bolsa muda textura", "s": "Tanner — tabela de estágios (G2)", "r": [[0.5056, 0.1721, 0.6969, 0.1907], [0.5056, 0.1868, 0.5582, 0.2053]]}, {"f": "ped", "p": 44, "q": "Meninos: aumento tesHcular 9–14 anos, seguido de crescimento peniano e esHrão mais tardio.", "s": "Tanner e amenorreia — Marcos puberais", "r": [[0.7694, 0.366, 0.9086, 0.3861], [0.0768, 0.3846, 0.6085, 0.4047]]}], "img": ["sv-orquidometro", "sv-tanner"], "t": "P16"}, {"id": "P16-13", "sub": "Sequência telarca–estirão–menarca", "comp": "Marcos puberais femininos", "rac": "Previsão clínica", "q": "Menina de 11 anos, telarca aos 10 anos, hoje M3 P2. Cresceu 8 cm no último ano. A mãe pergunta quando deve vir a primeira menstruação e se o crescimento rápido é preocupante. Qual a resposta correta?", "o": [["Estirão antes; menarca 2–3 anos após a telarca (investigar se > 3 anos ou aos 15)", "Telarca → estirão → menarca 2–3 anos depois; limites de investigação do material."], ["A menarca ocorre antes do estirão; o crescimento rápido sem menarca sugere doença", "A sequência é estirão antes da menarca."], ["A menarca deve ocorrer no máximo 1 ano após a telarca; já há atraso", "O intervalo esperado é 2–3 anos; o limite de investigação é > 3 anos."], ["Não há relação entre telarca e menarca; não é possível prever", "O PDF estabelece a relação temporal."]], "pista": "Telarca → estirão → menarca (2–3 anos depois).", "pp": ["Telarca aos 10.", "Estirão vem antes da menarca (crescimento rápido esperado).", "Menarca prevista ~12–13 anos.", "Investigar se > 3 anos após telarca sem menarca ou aos 15."], "ap": "<p>O material usa dois limites para amenorreia primária: ausência de menarca aos 15 anos ou mais de 3 anos após a telarca (PDF p. 44). Para esta menina, a menarca só seria “atrasada” após os 13 anos (3 anos depois da telarca aos 10). M3 indica mama que aumenta sem contorno secundário.<\/p>", "mud": [["Telarca aos 10 e sem menarca aos 13 e meio", "Investigar amenorreia primária (> 3 anos)", "Limite do PDF"], ["Cólicas mensais sem fluxo aos 13", "Investigar obstrução antes dos limites", "PDF p. 44"]], "arm": "Achar que o estirão vem depois da menarca.", "ouro": "Estirão antes da menarca; menarca 2–3 anos após a telarca.", "m2": ["Qual o estágio M em que aréola e papila formam elevação secundária?", "M4 (PDF p. 44)."], "n": ["Estirão antes da menarca.", "Menarca 2–3 anos após telarca.", "> 3 anos ou 15 anos → investigar."], "loc": [{"f": "ped", "p": 44, "q": "Meninas: telarca 8–13 anos, esHrão antes da menarca; menarca geralmente 2–3 anos após telarca.", "s": "Tanner e amenorreia — Marcos puberais", "r": [[0.0768, 0.366, 0.7722, 0.3861]]}, {"f": "ped", "p": 44, "q": "Ausência de menarca aos 15 anos ou >3 anos depois da telarca", "s": "Amenorreia primária — quando investigar", "r": [[0.0768, 0.4637, 0.5255, 0.4837]]}], "img": ["sv-puberdade"], "t": "P16"}, {"id": "P16-14", "sub": "Pubarca isolada", "comp": "Marcos puberais", "rac": "Interpretação fisiológica", "q": "Menina de 9 anos com pelos pubianos finos e escassos na base dos grandes lábios há 4 meses. Mamas M1. Sem odor axilar intenso ou clitoromegalia. O residente registra “puberdade iniciada, ovários ativos”. Qual a correção?", "o": [["Registrar M1 e P2 separados: pelos dependem de andrógeno adrenal", "O PDF: registrar M e P separadamente; pubarca isolada NÃO comprova ativação ovariana."], ["O registro está correto, pois pelos pubianos indicam produção de estradiol", "Estradiol produz telarca; pelos dependem de andrógenos."], ["Deve-se classificar como Tanner 2 global, já que um dos critérios evoluiu", "O Tanner é registrado por eixo (M e P), sem presumir evolução conjunta."], ["É puberdade precoce central confirmada e exige bloqueio imediato", "Aos 9 anos com P isolado não há precocidade pela idade de corte do material, nem confirmação de causa central."]], "pista": "“Registrar separadamente M e P”; pubarca ≠ ovário ativo.", "pp": ["M1 = sem estímulo estrogênico evidente.", "P2 = pelos escassos e finos na base.", "Pelos: andrógenos adrenais.", "Registrar separado e acompanhar."], "ap": "<p>A fisiologia do PDF (p. 45): GnRH pulsátil → FSH/LH → estradiol → mamas e endométrio. Pelos pubianos “dependem sobretudo de andrógenos adrenais”. Por isso o material abre a página de Tanner com “registrar separadamente maturação mamária/genital e pelos pubianos, sem presumir que todos evoluem juntos” (p. 44).<\/p>", "mud": [["Mesmo quadro aos 6 anos com clitoromegalia", "Investigar hiperandrogenismo (andrógenos, 17-OHP)", "Sinal de virilização"], ["M2 aos 9 anos", "Telarca na faixa normal", "8–13 anos"]], "arm": "Somar M e P num “Tanner único”.", "ouro": "M é estrogênio, P é andrógeno: registre cada eixo.", "m2": ["Qual o P5?", "Distribuição adulta que alcança a face medial das coxas (PDF p. 44)."], "n": ["M e P separados.", "Pubarca = andrógeno adrenal.", "Não presumir ovário ativo."], "loc": [{"f": "ped", "p": 44, "q": "Registrar separadamente maturação mamária/genital e pelos pubianos, sem presumir que todos evoluem juntos.", "s": "Tanner e amenorreia primária — abertura", "r": [[0.0768, 0.1032, 0.8733, 0.1233]]}, {"f": "ped", "p": 45, "q": "Pelos pubianos dependem sobretudo de andrógenos adrenais: pubarca isolada NÃO comprova aHvação ovariana.", "s": "Amenorreia primária — Fisiologia", "r": [[0.6452, 0.2193, 0.912, 0.2394], [0.0768, 0.2379, 0.6097, 0.258]]}], "img": ["sv-tanner"], "t": "P16"}, {"id": "P16-15", "sub": "HEADSSS: ordem das perguntas", "comp": "Entrevista do adolescente", "rac": "Comunicação", "q": "Na estação de “consulta do adolescente”, o estudante decide abrir a entrevista a sós com: “Você já usou drogas ou teve relação sexual sem camisinha?”. O avaliador desconta pontos. Qual a justificativa baseada no material?", "o": [["Começar por perguntas abertas e menos sensíveis (casa, escola, atividades)", "HEADSSS não é interrogatório: perguntas abertas e menos sensíveis primeiro."], ["Drogas e sexualidade não fazem parte da consulta do adolescente sem autorização dos pais", "Fazem parte do roteiro, com privacidade."], ["A pergunta deveria ser feita com os pais presentes, para confirmar a resposta", "O momento a sós existe exatamente para essas perguntas."], ["O correto é aplicar um questionário escrito e não perguntar diretamente", "O material propõe entrevista com perguntas abertas, não substituição por formulário."]], "pista": "“Começar por perguntas abertas e menos sensíveis.”", "pp": ["HEADSSS: Home, Education/Eating, Activities, Drugs, Sexuality, Suicide, Safety.", "Ordem que constrói confiança.", "Perguntas abertas.", "Sensíveis depois, a sós, com sigilo explicado."], "ap": "<p>O PDF sugere perguntas úteis por domínio: “Com quem mora? Sente-se seguro em casa? Quem é sua pessoa de confiança?” (H); rendimento, bullying, planos (E); tempo livre, alimentação, imagem corporal (A); depois substâncias, sexualidade (consentimento, contracepção, IST, DUM), saúde mental e segurança (p. 43).<\/p>", "mud": [["O adolescente trouxesse espontaneamente uma queixa sexual", "Acolher a demanda e abordá-la, com privacidade", "Escuta centrada no adolescente"]], "arm": "Tratar o HEADSSS como checklist a ser disparado na ordem inversa.", "ouro": "HEADSSS: do menos ao mais sensível, com perguntas abertas.", "m2": ["Qual a primeira pergunta sugerida no domínio “casa”?", "“Com quem mora? Sente-se seguro em casa?” (PDF p. 42–43)."], "n": ["Começar por casa/escola.", "Perguntas abertas.", "Sensíveis a sós, após explicar sigilo."], "loc": [{"f": "ped", "p": 43, "q": "HEADSSS é um roteiro psicossocial, não um interrogatório. Começar por perguntas abertas e menos sensíveis.", "s": "Adolescente — entrevista e exame", "r": [[0.0768, 0.1032, 0.848, 0.1233]]}], "img": ["sv-sigilo"], "t": "P16"}, {"id": "P17-01", "sub": "Estadiamento M e P", "comp": "Classificação de Tanner", "rac": "Aplicação de classificação", "q": "Adolescente de 13 anos. Ao exame, aréola e papila formam uma elevação secundária acima do contorno da mama; pelos pubianos de tipo adulto, porém ocupando área menor que no adulto, sem atingir a face medial das coxas. Como registrar?", "o": [["M4 P4", "Elevação secundária da aréola/papila = M4; pelo tipo adulto em área menor = P4."], ["M3 P4", "M3 é a mama que aumenta SEM contorno secundário; a elevação secundária define M4."], ["M5 P5", "M5 é contorno adulto com papila projetada; P5 alcança a face medial das coxas."], ["M4 P3", "P3 são pelos mais escuros, grossos e espalhados, mas ainda não do tipo adulto."]], "pista": "“Elevação secundária” = M4; “tipo adulto, área menor” = P4.", "pp": ["M3: mama aumenta sem contorno secundário.", "M4: aréola/papila formam elevação secundária.", "P4: tipo adulto em área menor.", "P5: alcança a face medial das coxas."], "ap": "<p>O PDF registra os eixos separadamente e descreve cada estágio por um critério morfológico (p. 44). A chave de M4 é o “duplo contorno”; em M5 esse contorno secundário desaparece e só a papila se projeta. Nos pelos, a transição P4 → P5 é definida pela extensão às coxas.<\/p>", "mud": [["Contorno adulto com papila projetada", "M5", "PDF p. 44"], ["Pelos alcançando a face medial das coxas", "P5", "PDF p. 44"]], "arm": "Trocar M3 por M4: a diferença é a elevação secundária.", "ouro": "M4 = duplo contorno; P4 = adulto em área menor.", "m2": ["Broto mamário isolado corresponde a qual estágio?", "M2 (PDF p. 44)."], "n": ["M3 sem contorno secundário.", "M4 com elevação secundária.", "P5 atinge coxas."], "loc": [{"f": "ped", "p": 44, "q": "Aréola/papila formam elevação secundária", "s": "Tanner — tabela (M4)", "r": [[0.2957, 0.2567, 0.4419, 0.2753], [0.2957, 0.2714, 0.4301, 0.2899]]}, {"f": "ped", "p": 44, "q": "Tipo adulto, área menor", "s": "Tanner — tabela (P4)", "r": [[0.7156, 0.2567, 0.8745, 0.2753]]}], "img": ["sv-tanner"], "t": "P17"}, {"id": "P17-02", "sub": "Estadiamento G", "comp": "Classificação de Tanner masculina", "rac": "Aplicação de classificação", "q": "Rapaz de 14 anos: testículos de 12 mL, pênis maior em comprimento e agora também em diâmetro, glande desenvolvida, bolsa escrotal mais escura. Pelos tipo adulto restritos à região púbica. Registro correto:", "o": [["G4 P4", "Aumento de diâmetro/glande e bolsa escurecida = G4; tipo adulto em área menor = P4."], ["G3 P4", "G3 é crescimento em comprimento; aumento de diâmetro e glande caracteriza G4."], ["G5 P5", "G5 são genitais adultos; P5 exige extensão às coxas."], ["G2 P4", "G2 é o início (≥ 4 mL); a descrição atual é de estágio mais avançado."]], "pista": "Diâmetro/glande + bolsa escura = G4.", "pp": ["G2: ≥ 4 mL, bolsa muda textura.", "G3: pênis cresce em comprimento.", "G4: diâmetro/glande; bolsa escurece.", "P4: tipo adulto em área menor."], "ap": "<p>No eixo genital masculino, cada estágio acrescenta uma característica: volume (G2), comprimento (G3), diâmetro e glande com pigmentação da bolsa (G4), genitais adultos (G5) (PDF p. 44). Registre G e P separadamente.<\/p>", "mud": [["Só crescimento em comprimento", "G3", "PDF p. 44"], ["Pelos atingindo face medial das coxas", "P5", "PDF p. 44"]], "arm": "Parar no comprimento peniano e esquecer diâmetro/glande.", "ouro": "G3 comprimento; G4 diâmetro, glande e bolsa escura.", "m2": ["Testículos de 4 mL e bolsa com nova textura: estágio?", "G2 (PDF p. 44)."], "n": ["G2 volume.", "G3 comprimento.", "G4 diâmetro/glande."], "loc": [{"f": "ped", "p": 44, "q": "Aumento diâmetro/glande, bolsa escurece", "s": "Tanner — tabela (G4)", "r": [[0.5056, 0.2567, 0.6847, 0.2753], [0.5056, 0.2714, 0.6051, 0.2899]]}], "img": ["sv-tanner", "sv-orquidometro"], "t": "P17"}, {"id": "P17-03", "sub": "Quando investigar amenorreia primária", "comp": "Definição de amenorreia primária", "rac": "Aplicação de critério temporal", "q": "Gabriela, 14 anos e 6 meses, telarca aos 10 anos e 3 meses, M5 P4, nunca menstruou. Sem dor cíclica. A mãe ouviu que “só se investiga aos 15”. O que é correto?", "o": [["Investigar agora, pois já se passaram mais de 3 anos desde a telarca", "Critério do PDF: sem menarca aos 15 OU > 3 anos depois da telarca. Aqui são ~4 anos."], ["Aguardar até os 15 anos completos, pois a idade é o único critério de amenorreia primária", "Existem dois critérios; o temporal após a telarca já foi atingido."], ["Aguardar até os 16 anos, já que a menarca pode ocorrer até 4 anos após a telarca", "O limite do material é > 3 anos."], ["Prescrever anticoncepcional para induzir o primeiro sangramento e ver se o útero responde", "O PDF diz para não iniciar anticoncepcional só para produzir sangramento antes de investigar."]], "pista": "Telarca 10a3m → 14a6m = mais de 3 anos.", "pp": ["Critério 1: sem menarca aos 15 anos.", "Critério 2: > 3 anos após a telarca.", "Critério 3: sem mamas aos 13.", "Dor cíclica/obstrução: avaliar mesmo antes.", "Gabriela preenche o critério 2."], "ap": "<p>A primeira etapa do algoritmo do PDF vale para toda amenorreia: excluir gestação, FSH, LH, estradiol, TSH, prolactina e US pélvico (p. 47). Com mamas presentes (houve estrogênio), a investigação se volta para útero, via de saída e função ovulatória (p. 46).<\/p>", "mud": [["Telarca aos 12 e hoje 14a6m", "Ainda dentro do esperado; acompanhar", "< 3 anos e < 15"], ["Cólicas mensais sem fluxo", "Investigar já (obstrução)", "PDF p. 44"]], "arm": "Lembrar só do “15 anos” e esquecer o “3 anos após a telarca”.", "ouro": "Amenorreia primária: 15 anos OU > 3 anos após a telarca (ou sem mamas aos 13).", "m2": ["E a amenorreia secundária em ciclos antes regulares?", "Ausência por mais de 3 meses; 6 meses se irregulares (PDF p. 46)."], "n": ["15 anos ou > 3 anos após telarca.", "Sem mamas aos 13.", "Não induzir sangramento antes de investigar."], "loc": [{"f": "ped", "p": 44, "q": "Ausência de menarca aos 15 anos ou >3 anos depois da telarca; invesHgar também se não há desenvolvimento mamário aos 13 anos.", "s": "Amenorreia primária — quando investigar", "r": [[0.0768, 0.4637, 0.9208, 0.4837], [0.0768, 0.4822, 0.1699, 0.5023]]}], "img": ["sv-amenorreia", "sv-puberdade"], "t": "P17"}, {"id": "P17-04", "sub": "Sem mamas + FSH alto", "comp": "Interpretação hormonal", "rac": "Raciocínio fisiopatológico", "q": "Menina de 13 anos e 8 meses, M1 P2, estatura abaixo do percentil 3, tórax amplo, sem outras queixas. FSH 78 UI/L e estradiol indetectável; TSH e prolactina normais; US com útero pequeno. Hipótese e próximo passo?", "o": [["Disgenesia gonadal (Turner): solicitar cariótipo e encaminhar à endocrinologia", "Sem mamas + FSH alto + estradiol baixo = falência gonadal; baixa estatura reforça Turner."], ["Atraso constitucional: apenas observar o crescimento até os 16 anos", "No atraso constitucional, FSH/LH são baixos ou normais, não elevados."], ["Hipogonadismo hipogonadotrófico por déficit energético, com aumento da ingesta", "Nesse quadro as gonadotrofinas seriam baixas."], ["Hímen imperfurado: US e correção cirúrgica pela ginecologia pediátrica", "Obstrução de saída cursa com mamas presentes e dor cíclica."]], "pista": "FSH ALTO + estradiol baixo = problema na gônada.", "pp": ["Sem mamas = sem estrogênio.", "FSH alto = hipófise tentando estimular gônada que não responde.", "Baixa estatura e tórax amplo → Turner.", "Cariótipo e endocrinologia; avaliar cardíaco, renal, audição."], "ap": "<p>O PDF separa hipogonadismo hipergonadotrófico (FSH alto: falência gonadal/Turner, insuficiência ovariana primária) do hipogonadotrófico (FSH baixo/normal: atraso constitucional, déficit energético, doença crônica, causas centrais) (p. 44–45, 47). Em Turner, o material lembra a avaliação cardíaca, renal, auditiva e endócrina e a indução puberal.<\/p>", "mud": [["FSH e LH baixos, idade óssea atrasada, pais tardios", "Atraso constitucional (exclusão)", "PDF p. 45"], ["Quimioterapia prévia e FSH alto", "Insuficiência ovariana primária", "PDF p. 45"]], "arm": "Achar que FSH alto “é bom” porque a hipófise funciona — o defeito está no ovário.", "ouro": "Sem mamas: FSH alto = gônada; FSH baixo = centro/funcional.", "m2": ["Turner sempre tem estigmas evidentes?", "Não; pode ter poucos estigmas — por isso o cariótipo (PDF p. 45)."], "n": ["FSH alto + E2 baixo = falência gonadal.", "Turner: cariótipo.", "Baixa estatura é pista."], "loc": [{"f": "ped", "p": 44, "q": "FSH alto + estradiol baixo Falência gonadal/Turner: endocrinologia; carióHpo conforme quadro.", "s": "Tanner e amenorreia — Padrão hormonal", "r": [[0.0856, 0.6655, 0.2516, 0.6841], [0.5056, 0.6655, 0.8961, 0.6841], [0.5056, 0.6802, 0.5616, 0.6987]]}, {"f": "ped", "p": 47, "q": "13 anos, M1, baixa estatura, FSH alto → suspeitar Turner/disgenesia.", "s": "Amenorreia — Casos de prova", "r": [[0.0768, 0.7846, 0.563, 0.8047]]}], "img": ["sv-amenorreia"], "t": "P17"}, {"id": "P17-05", "sub": "Hímen imperfurado", "comp": "Amenorreia com mamas e dor cíclica", "rac": "Diagnóstico e conduta", "q": "Adolescente de 14 anos, M4 P4, nunca menstruou. Há 5 meses tem cólicas mensais intensas, agora com dificuldade para urinar. Ao exame externo, membrana abaulada e azulada no introito; massa suprapúbica dolorosa. Conduta adequada na UBS?", "o": [["US pélvico e encaminhamento à ginecologia pediátrica para correção, sem puncionar", "Hímen imperfurado: hematocolpo/hematometra; US e correção especializada; não puncionar na UBS. Retenção urinária torna rápido."], ["Puncionar a membrana na UBS para drenar o sangue retido e aliviar a dor imediatamente", "O PDF: não puncionar na UBS."], ["Iniciar anticoncepcional contínuo para suprimir as menstruações até os 18 anos", "Não trata a obstrução e atrasa a correção."], ["Solicitar cariótipo, pois a ausência de menarca com mamas indica insensibilidade androgênica", "Útero e ovários presentes, dor cíclica e membrana abaulada apontam obstrução de saída."]], "pista": "Mamas + dor cíclica + membrana azulada abaulada = hímen imperfurado.", "pp": ["Mamas presentes: houve estrogênio.", "Dor cíclica sem fluxo: menstruação não exterioriza.", "Exame: membrana abaulada azulada; massa (hematocolpo).", "US pélvico; ginecologia; não puncionar.", "Retenção urinária/dor intensa = encaminhar com urgência."], "ap": "<p>O mecanismo (PDF p. 46): útero e ovários presentes, a menstruação não exterioriza e se acumula (hematocolpo/hematometra), causando dor cíclica, massa pélvica e retenção urinária. O septo vaginal transverso tem quadro semelhante, mas o exame externo pode ser normal. Dor intensa, retenção urinária ou massa dolorosa estão entre os motivos de encaminhamento urgente (p. 46).<\/p>", "mud": [["Exame externo normal com dor cíclica e coleção proximal", "Septo vaginal transverso: US/RM e correção especializada", "PDF p. 46"], ["Sem dor cíclica, útero ausente", "MRKH ou insensibilidade androgênica", "PDF p. 46"]], "arm": "Puncionar na UBS.", "ouro": "Cólica mensal sem fluxo com mamas: obstrução de saída até prova em contrário.", "m2": ["Caso de prova do PDF: 15 anos, M4, cólicas mensais sem fluxo. Hipótese?", "Obstrução genital (hímen imperfurado/septo) (PDF p. 47)."], "n": ["Hematocolpo por obstrução.", "US pélvico.", "Não puncionar na UBS."], "loc": [{"f": "ped", "p": 46, "q": "Útero e ovários presentes; menstruação não exterioriza → hematocolpo/hematometra. Dor cíclica, massa pélvica, retenção urinária; membrana abaulada azulada", "s": "Amenorreia primária — mamas presentes (Hímen imperfurado)", "r": [[0.3656, 0.1703, 0.6253, 0.1889], [0.3656, 0.185, 0.4665, 0.2035], [0.3656, 0.1996, 0.6248, 0.2182], [0.3656, 0.2143, 0.5796, 0.2328], [0.3656, 0.2289, 0.5544, 0.2475]]}, {"f": "ped", "p": 46, "q": "US pélvico; ginecologia pediátrica para correção cirúrgica. Não puncionar na UBS.", "s": "Amenorreia primária — mamas presentes (Hímen imperfurado)", "r": [[0.6456, 0.1703, 0.8952, 0.1889], [0.6456, 0.185, 0.8844, 0.2035], [0.6456, 0.1996, 0.6817, 0.2182]]}], "img": ["sv-amenorreia", "sv-genital-menina"], "t": "P17"}, {"id": "P17-06", "sub": "MRKH × insensibilidade androgênica", "comp": "Amenorreia com útero ausente", "rac": "Diagnóstico diferencial", "q": "Duas pacientes de 16 anos, ambas M5, sem menarca e com útero ausente na US. Laura tem P5 e pelos axilares normais. Sofia tem P1 e pelos axilares escassos, além de nódulo inguinal bilateral. Qual a interpretação mais provável?", "o": [["Laura: MRKH (46,XX); Sofia: insensibilidade androgênica (46,XY)", "Pelos habituais = MRKH; pelos escassos e massa inguinal = insensibilidade completa aos andrógenos."], ["Ambas têm MRKH, pois o útero ausente com mamas define a síndrome de Rokitansky", "O útero ausente com mamas tem dois diagnósticos; os pelos separam."], ["Laura: insensibilidade androgênica; Sofia: MRKH, porque os pelos dependem de estrogênio", "Pelos dependem de andrógenos; na insensibilidade eles faltam."], ["Ambas têm Turner, já que nenhuma menstruou até os 16 anos", "Turner cursa sem mamas e com FSH alto; ambas têm M5."]], "pista": "Útero ausente: pelos normais = MRKH; pelos escassos = insensibilidade androgênica.", "pp": ["Mamas + útero ausente: MRKH × insensibilidade.", "MRKH: 46,XX, ovários funcionantes, mamas e pelos habituais.", "Insensibilidade: 46,XY, testículos (AMH → sem útero), mamas por aromatização, pelos escassos, massa inguinal.", "Exames: testosterona, cariótipo, equipe multidisciplinar."], "ap": "<p>A explicação fisiológica do PDF (p. 46): na insensibilidade completa, os testículos produzem AMH (que regride as estruturas müllerianas → sem útero) e testosterona, que, sem receptor funcional, não produz pelos, mas é aromatizada a estradiol (→ mamas). Na MRKH, a gônada é ovário normal; falta apenas o desenvolvimento mülleriano. Caso de prova: “16 anos, M5, P5, útero ausente → MRKH; se P1/P2, insensibilidade androgênica” (p. 47).<\/p>", "mud": [["Útero presente sem dor cíclica", "Investigar gravidez, anovulação, endócrino", "PDF p. 47"], ["Sem mamas", "Ir para FSH", "PDF p. 47"]], "arm": "Atribuir os pelos ao estrogênio.", "ouro": "Útero ausente com mamas: olhe os pelos.", "m2": ["Na MRKH, o que pesquisar além do útero?", "Anomalias renais e esqueléticas, apoio psicológico e ginecologia (PDF p. 46)."], "n": ["MRKH 46,XX, pelos normais.", "Insensibilidade 46,XY, pelos escassos.", "Massa inguinal = gônada."], "loc": [{"f": "ped", "p": 46, "q": "46,XY; tesŠculos produzem AMH → ausência de útero; aromaHzação de andrógenos → mamas; pelos pubianos/axilares escassos. Pode haver massa inguinal.", "s": "Amenorreia primária — mamas presentes (Insensibilidade androgênica)", "r": [[0.3656, 0.3778, 0.5784, 0.3963], [0.3656, 0.3924, 0.5971, 0.411], [0.3656, 0.4071, 0.5551, 0.4256], [0.3656, 0.4217, 0.6203, 0.4403], [0.3656, 0.4364, 0.4689, 0.4549]]}, {"f": "ped", "p": 47, "q": "16 anos, M5, P5, útero ausente
