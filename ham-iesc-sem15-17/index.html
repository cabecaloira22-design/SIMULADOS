al até 28 semanas, quinzenal de 28–36 e semanal a partir de 36, adaptado ao risco. Não dar alta do pré-natal no termo.", "s": "Cap. 15.1 — Calendário e conteúdo de cada consulta", "r": [[0.7155, 0.1761, 0.9268, 0.1937], [0.0689, 0.1939, 0.8557, 0.2116], [0.0689, 0.2117, 0.2427, 0.2294]]}, {"f": "adu", "p": 9, "r": [[0.3, 0.839, 0.7, 0.974]], "s": "Tabela “Exames e condutas por IG” (imagem) — 35–41 semanas"}], "img": ["sv-calendario", "adu-exames-ig"], "t": "A16"}, {"id": "A16-12", "sub": "Sífilis no 3º trimestre", "comp": "TORCHS", "rac": "Tratamento", "q": "Gestante de 30 semanas com teste rápido treponêmico reagente (era não reagente na 1ª consulta). Sem lesões, sem tratamento prévio. VDRL 1:16. Não sabe quando se infectou. Qual a conduta?", "o": [["Benzatina 2,4 milhões UI IM semanal × 3, iniciando já", "Duração ignorada = esquema de 3 doses; não retardar."], ["Dose única de 2,4 milhões UI, pois a soroconversão prova sífilis recente", "O PDF classifica pela duração; sem data definida, usa o esquema de 3 semanas."], ["Aguardar VDRL em 30 dias para confirmar antes de tratar", "Com teste reagente em gestante sem tratamento, iniciar penicilina imediatamente."], ["Ceftriaxona, para evitar reação de Jarisch-Herxheimer", "Penicilina é o único esquema comprovado para prevenir transmissão vertical."]], "pista": "Reagente + sem tratamento = penicilina imediata; duração ignorada = 3 doses.", "pp": ["Teste rápido reagente → VDRL quantitativo basal.", "Penicilina imediata.", "Duração ignorada: 2,4 milhões UI/semana × 3.", "Intervalo ideal 7 dias; > 9 dias reiniciar.", "Tratar parcerias; VDRL mensal."], "ap": "<p>PDF p. 18: recente (primária, secundária, latente até 1 ano) = dose única; tardia ou duração ignorada = semanal × 3 (7,2 milhões UI), intervalo ideal 7 dias e reinício se > 9 dias. Alergia: dessensibilizar. Para prevenção neonatal, tratamento adequado ao estágio e iniciado ≥ 30 dias antes do parto. <i>Observação:<\/i> embora a soroconversão sugira infecção na gestação, o PDF classifica por estágio conhecido; sem data, o esquema é o da duração ignorada.<\/p>", "mud": [["Cancro genital indolor há 1 semana", "Primária: dose única", "Recente"], ["Intervalo de 10 dias entre doses", "Reiniciar o esquema", "> 9 dias"]], "arm": "Esperar confirmação para tratar a gestante.", "ouro": "Gestante com sífilis: penicilina já; duração ignorada = 3 doses semanais.", "m2": ["VDRL caiu de 1:32 para 1:8. Interpretação?", "Queda de 4 vezes (duas diluições): resposta adequada (PDF p. 18)."], "n": ["Penicilina imediata.", "Ignorada = 3 doses.", "> 9 dias reinicia."], "loc": [{"f": "adu", "p": 18, "q": "2,4 milhões UI IM semanal por 3 semanas, total 7,2 milhões UI. Em gestante, intervalo ideal 7 dias, se >9 dias reiniciar esquema.", "s": "Cap. 18.3 — Sífilis (tabela de tratamento)", "r": [[0.3225, 0.4777, 0.881, 0.4931], [0.3225, 0.4916, 0.701, 0.507]]}, {"f": "adu", "p": 18, "q": "se reagente, colher VDRL/RPR quantitativo basal e iniciar penicilina imediatamente em gestante sem tratamento adequado documentado.", "s": "Cap. 18.3 — Sífilis na gestação", "r": [[0.1058, 0.3103, 0.861, 0.328], [0.0689, 0.3281, 0.5153, 0.3458]]}], "img": [], "t": "A16"}, {"id": "A16-13", "sub": "Seguimento do VDRL", "comp": "TORCHS", "rac": "Interpretação de títulos", "q": "Gestante tratada para sífilis recente com 20 semanas (VDRL 1:32). Controles mensais: 1:16 com 24 sem, 1:8 com 28 sem e 1:32 com 34 sem. O parceiro não foi tratado. Interpretação?", "o": [["Reinfecção/falha: retratar e tratar o parceiro", "Aumento sustentado de duas diluições sugere reinfecção/falha."], ["Cicatriz sorológica: manter apenas o seguimento mensal habitual", "Cicatriz é título baixo estável, não ascensão."], ["Resposta adequada, pois houve queda inicial de 4 vezes", "A subida posterior muda a interpretação."], ["Usar o teste treponêmico para controlar a cura", "O treponêmico pode ficar reagente por toda a vida; não serve para controle."]], "pista": "1:8 → 1:32 = subiu duas diluições.", "pp": ["VDRL acompanha títulos (mensal na gestação).", "Queda de 4 vezes = duas diluições.", "Aumento sustentado de duas diluições = reinfecção/falha.", "Parceiro não tratado: fonte de reinfecção.", "Retratar, tratar parceria, notificar."], "ap": "<p>PDF p. 18: “Acompanhar VDRL mensal na gestação; aumento sustentado de duas diluições sugere reinfecção/falha. Avaliar/tratar parcerias, notificar, orientar preservativo.” E: “Teste treponêmico pode permanecer reagente por toda vida; não serve para controle.”<\/p>", "mud": [["Títulos 1:2 estáveis", "Pensar em cicatriz sorológica", "Sem ascensão"]], "arm": "Controlar cura com teste treponêmico.", "ouro": "VDRL controla; duas diluições acima = reinfecção ou falha.", "m2": ["Prazo mínimo de tratamento antes do parto para prevenção neonatal?", "Tratamento adequado iniciado ≥ 30 dias antes do parto (PDF p. 18)."], "n": ["VDRL mensal.", "↑ 2 diluições = falha/reinfecção.", "Tratar parceria."], "loc": [{"f": "adu", "p": 18, "q": "Acompanhar VDRL mensal na gestação; aumento sustentado de duas diluições sugere reinfecção/falha.", "s": "Cap. 18.3 — Sífilis na gestação", "r": [[0.324, 0.5976, 0.9311, 0.6153], [0.0689, 0.6154, 0.3642, 0.6331]]}, {"f": "adu", "p": 18, "q": "Teste treponêmico pode permanecer reagente por toda vida; não serve para controle.", "s": "Cap. 18.3 — Sífilis na gestação", "r": [[0.514, 0.3281, 0.9226, 0.3458], [0.0689, 0.3459, 0.411, 0.3636]]}], "img": [], "t": "A16"}, {"id": "A16-14", "sub": "Toxoplasmose: avidez e tratamento", "comp": "TORCHS", "rac": "Interpretação e conduta", "q": "Gestante de 12 semanas com IgG e IgM positivas para toxoplasmose na primeira coleta. Avidez de IgG baixa. US normal. Qual a interpretação e conduta segundo o material?", "o": [["Avidez baixa não prova infecção recente: espiramicina e referência", "Avidez baixa/intermediária pode persistir; antes de 16 sem, espiramicina 1 g 8/8 h."], ["Infecção aguda confirmada: sulfadiazina, pirimetamina e ácido folínico já", "Evitar pirimetamina no 1º trimestre; esquema tríplice é ≥ 16 sem."], ["Infecção antiga, anterior à gestação: dispensar o tratamento", "Só avidez ALTA até 16 sem ajuda a excluir aquisição gestacional."], ["Amniocentese imediata para PCR no líquido amniótico", "PCR após 18 semanas e ≥ 4 semanas da provável infecção."]], "pista": "Avidez alta exclui; baixa não confirma. < 16 sem: espiramicina.", "pp": ["IgG+/IgM+: recente ou IgM persistente.", "Avidez alta até 16 sem → exclui aquisição na gestação.", "Avidez baixa não prova recente.", "Suspeita aguda < 16 sem: espiramicina.", "Referenciar; US seriado; PCR após 18 sem se indicado."], "ap": "<p>PDF p. 17–18: espiramicina 1 g (3 milhões UI) 8/8 h antes de 16 semanas reduz transmissão, mas não trata infecção fetal confirmada; a partir de 16 semanas, esquema tríplice sob referência (sulfadiazina, pirimetamina, ácido folínico — não ácido fólico), evitando pirimetamina no 1º trimestre. Notificar e referenciar.<\/p>", "mud": [["Avidez alta com 12 semanas", "Infecção anterior à gestação", "PDF p. 17"], ["Infecção fetal confirmada com 22 sem", "Esquema tríplice sob referência", "PDF p. 17"]], "arm": "Tratar avidez baixa como prova.", "ouro": "Avidez alta precoce exclui; baixa não confirma.", "m2": ["Por que ácido folínico e não fólico?", "O folínico reduz a mielotoxicidade da pirimetamina (PDF p. 17)."], "n": ["Avidez alta ≤ 16 sem exclui.", "Espiramicina < 16 sem.", "Pirimetamina: não no 1º tri."], "loc": [{"f": "adu", "p": 17, "q": "Avidez alta de IgG em amostra até 16 semanas ajuda a excluir aquisição durante gestação; avidez baixa/intermediária não prova infecção recente (pode persistir).", "s": "Cap. 18.2 — Toxoplasmose", "r": [[0.0689, 0.6247, 0.9256, 0.6424], [0.0689, 0.6425, 0.6262, 0.6602]]}, {"f": "adu", "p": 17, "q": "Antes de 16 semanas, espiramicina 1 g (3 milhões UI) VO de 8/8 h é esquema habitual para reduzir transmissão.", "s": "Cap. 18.2 — Tratamento e investigação fetal", "r": [[0.2249, 0.7453, 0.9026, 0.7629], [0.0689, 0.7631, 0.3706, 0.7808]]}], "img": [], "t": "A16"}, {"id": "A16-15", "sub": "HIV: carga viral perto do parto", "comp": "TORCHS", "rac": "Decisão de via de parto", "q": "Gestante vivendo com HIV em TARV (TDF + 3TC + DTG), com 34 semanas: carga viral 4.200 cópias/mL por má adesão. Qual planejamento segue o material?", "o": [["Cesárea programada, AZT IV, não amamentar e manter a TARV", "Carga ≥ 1.000 ou desconhecida → cesárea programada e AZT IV; não amamentar; não interromper TARV."], ["Parto vaginal sem AZT, pois ela já está em TARV", "A carga viral define AZT e via."], ["Amamentar com TARV, já que no Brasil é permitido", "No Brasil, não amamentar quando a mãe vive com HIV."], ["Suspender a TARV após o parto para reduzir toxicidade", "Não interromper TARV no puerpério."]], "pista": "CV ≥ 1.000 perto do parto = cesárea programada + AZT IV.", "pp": ["Carga viral perto do parto define conduta.", "≥ 1.000 cópias/mL ou desconhecida → cesárea programada.", "AZT IV.", "Fórmula e manejo da lactação.", "Manter TARV; RN com profilaxia."], "ap": "<p>PDF p. 19: esquema frequente TDF 300 mg + 3TC 300 mg + DTG 50 mg; monitorar carga viral perto do parto, que define AZT IV e via; no Brasil não amamentar; RN recebe profilaxia estratificada; não interromper TARV no puerpério. Reforçar adesão nas semanas restantes.<\/p>", "mud": [["Carga indetectável com 34 sem", "Via obstétrica", "CV < 1.000"], ["Herpes genital recorrente", "Supressão com aciclovir de 36 semanas ao parto", "PDF p. 19"]], "arm": "Achar que TARV em uso dispensa AZT intraparto com carga alta.", "ouro": "HIV: a carga viral do fim da gestação decide via e AZT.", "m2": ["Lesão herpética no trabalho de parto: conduta?", "Cesárea (PDF p. 19)."], "n": ["CV ≥ 1.000 → cesárea + AZT.", "Não amamentar.", "Manter TARV."], "loc": [{"f": "adu", "p": 19, "q": "Monitorar carga viral perto do parto: define necessidade de zidovudina IV e via de parto (carga ≥1.000 cópias/mL ou desconhecida geralmente indica cesariana programada).", "s": "Cap. 18.7 — HIV", "r": [[0.6026, 0.6191, 0.9233, 0.6368], [0.0689, 0.6369, 0.8859, 0.6546], [0.0689, 0.6548, 0.4428, 0.6724]]}, {"f": "adu", "p": 19, "q": "No Brasil não amamentar quando mãe vive com HIV; garantir fórmula e manejo da lactação.", "s": "Cap. 18.7 — HIV", "r": [[0.4415, 0.6548, 0.9045, 0.6724], [0.0689, 0.6726, 0.411, 0.6902]]}], "img": [], "t": "A16"}, {"id": "A17-01", "sub": "Nódulo em mulher jovem", "comp": "Manifestações e investigação", "rac": "Hipótese e primeiro exame", "q": "Mulher de 23 anos percebeu nódulo na mama esquerda há 3 meses. Ao exame: nódulo de 2 cm, fibroelástico, bem delimitado, muito móvel, indolor, sem retração ou linfonodos. Qual a hipótese mais provável e o primeiro exame de imagem?", "o": [["Fibroadenoma; US mamária como primeiro exame", "Jovem, fibroelástico, móvel, bem delimitado, indolor = fibroadenoma; < 30 anos, US primeiro."], ["Carcinoma; mamografia diagnóstica", "Achados típicos de lesão benigna e idade < 30: US primeiro."], ["Cisto simples; dispensar imagem, pois o exame é típico", "Nenhuma característica palpável isolada confirma benignidade; imagem é necessária."], ["Alteração fibrocística; repetir exame na próxima menstruação", "Alteração fibrocística é nodularidade cíclica, bilateral; aqui há nódulo único definido."]], "pista": "Jovem + fibroelástico + móvel + bem delimitado = fibroadenoma; < 30 anos → US.", "pp": ["Características: fibroelástico, móvel, bem delimitado, indolor.", "Idade 23.", "Hipótese: fibroadenoma.", "< 30 anos e gestação: US primeiro.", "Concordância clínica–imagem–histologia."], "ap": "<p>A tabela do PDF (p. 21) descreve o fibroadenoma em jovens como nódulo fibroelástico, móvel, bem delimitado, geralmente indolor; e o capítulo 19.6 (p. 24) define a US como primeiro exame em < 30 anos e gestantes. Mesmo assim, “nenhuma característica palpável isolada confirma benignidade” — a imagem é obrigatória.<\/p>", "mud": [["Idade 48", "Mamografia diagnóstica + US", "≥ 30–40"], ["Lesão sólida suspeita na US", "Core biopsy", "PDF p. 24"]], "arm": "Dispensar imagem porque o exame “parece benigno”.", "ouro": "Jovem com nódulo: US primeiro, nunca só o exame clínico.", "m2": ["Gestante de 30 semanas com nódulo novo: primeiro exame?", "US mamária (PDF p. 24)."], "n": ["Fibroadenoma: jovem, móvel.", "< 30/gestante: US.", "Exame clínico não confirma benignidade."], "loc": [{"f": "adu", "p": 21, "q": "Jovens, nódulo fibroelástico, móvel, bem delimitado, geralmente indolor.", "s": "Cap. 19.1 — tabela de manifestações (Fibroadenoma)", "r": [[0.3225, 0.3039, 0.8501, 0.3192]]}, {"f": "adu", "p": 24, "q": "Em jovens <30 anos e gestação, US geralmente primeiro.", "s": "Cap. 19.6 — Investigação e BI-RADS", "r": [[0.0689, 0.3487, 0.5734, 0.3664]]}], "img": ["sv-nodulo"], "t": "A17"}, {"id": "A17-02", "sub": "Sinais de malignidade", "comp": "Manifestações clínicas", "rac": "Reconhecimento de alarme", "q": "Mulher de 58 anos com nódulo endurecido de 3 cm no QSL da mama direita, irregular, fixo, indolor, com retração da pele sobrejacente e pele em casca de laranja na região. Linfonodo axilar direito endurecido e fixo. Qual o mecanismo da casca de laranja e o próximo passo?", "o": [["Obstrução linfática tumoral; imagem diagnóstica e biópsia", "Malignos obstruem linfáticos (casca de laranja) e retraem ligamentos/pele; investigação diagnóstica e histologia."], ["Inflamação bacteriana; antibiótico por 10 dias e reavaliação", "Mastite que não resolve exige rever diagnóstico; aqui os achados são de malignidade."], ["Edema por cisto volumoso; punção aspirativa e alta com retorno anual", "Não explica fixação, retração e linfonodo fixo."], ["Retração dos ligamentos de Cooper por fibroadenoma; US em 6 meses", "Fibroadenoma não infiltra pele nem fixa."]], "pista": "Casca de laranja = linfáticos obstruídos; retração = ligamentos de Cooper tracionados.", "pp": ["Benignos crescem expansivamente; malignos invadem.", "Retração: tração de ligamentos/pele.", "Casca de laranja: obstrução linfática.", "Linfonodo duro e fixo: suspeito.", "Imagem diagnóstica + biópsia."], "ap": "<p>O PDF (p. 21) explica as manifestações pela biologia: tumores malignos “invadem tecidos, podem retrair ligamentos/pele, obstruir linfáticos (casca de laranja) e metastatizar”. A drenagem linfática é principalmente axilar, o que explica o linfonodo. No OSCE, verbalizar que a confirmação é histológica e não afirmar diagnóstico antes da biópsia (p. 24).<\/p>", "mud": [["Nódulo móvel e liso, variável com o ciclo", "Pensar em cisto; US define", "PDF p. 21"]], "arm": "Achar que carcinoma é sempre fixo e indolor — pode ser móvel ou doloroso.", "ouro": "Retração e casca de laranja: malignidade até prova histológica em contrário.", "m2": ["Carcinoma pode ser móvel ou doloroso?", "Sim (PDF p. 21)."], "n": ["Casca de laranja = linfáticos.", "Retração = Cooper.", "Biópsia confirma."], "loc": [{"f": "adu", "p": 21, "q": "malignos invadem tecidos, podem retrair ligamentos/pele, obstruir linfáticos (casca de laranja) e metastatizar.", "s": "Cap. 19.1 — Anatomia e características biológicas", "r": [[0.8436, 0.2117, 0.9282, 0.2294], [0.0689, 0.2295, 0.8248, 0.2472], [0.0689, 0.2473, 0.1897, 0.265]]}, {"f": "adu", "p": 21, "q": "Massa nova endurecida, irregular, fixa, indolor; retração, alteração mamilar ou linfonodo suspeito. Pode também ser móvel ou doloroso.", "s": "Cap. 19.1 — tabela (Carcinoma)", "r": [[0.3225, 0.4209, 0.894, 0.4362], [0.3225, 0.4347, 0.7368, 0.4501]]}], "img": ["sv-nodulo", "sv-birads"], "t": "A17"}, {"id": "A17-03", "sub": "Regra do relógio e quadrantes", "comp": "Localização de lesões", "rac": "Aplicação espacial", "q": "Nódulo na mama ESQUERDA, na posição de 2 horas, a 3 cm do mamilo. Em qual quadrante ele está?", "o": [["Quadrante superior lateral (externo)", "Na mama esquerda, 3 h é lateral; 2 h fica acima e lateral = QSL/QSE."], ["Quadrante superior medial (interno)", "Seria verdade na mama direita, onde 3 h é medial."], ["Quadrante inferior lateral (externo)", "2 h está acima da linha horizontal."], ["Quadrante inferior medial (interno)", "Nem inferior nem medial."]], "pista": "Mama esquerda: 3 h é lateral.", "pp": ["Relógio em visão frontal: 12 superior, 6 inferior, 3 à direita do examinador, 9 à esquerda.", "Na mama esquerda, 3 h aponta para fora (lateral).", "2 h: superior + lateral.", "Registrar mama, hora, quadrante, distância do mamilo e tamanho."], "ap": "<p>PDF p. 21: “na mama direita 9 é lateral; na esquerda 3 é lateral”. A figura original da p. 22 tem um alerta da própria apostila: leia 12 horas como polo superior das duas mamas (o desenho da mama esquerda está invertido). Use a lateralidade da paciente.<\/p>", "mud": [["Mesmo nódulo às 2 h na mama DIREITA", "Quadrante superior medial", "Na direita, 3 h é medial"]], "arm": "Esquecer que o relógio é visto de frente e inverter os lados.", "ouro": "Direita: 9 h lateral. Esquerda: 3 h lateral.", "m2": ["O que registrar além do quadrante?", "Mama, hora, distância do mamilo e tamanho (PDF p. 21)."], "n": ["Visão frontal.", "Esquerda: 3 h lateral.", "Direita: 9 h lateral."], "loc": [{"f": "adu", "p": 21, "q": "Relógio: na visão frontal, 12 superior, 6 inferior, 3 à direita do examinador, 9 à esquerda. Assim, na mama direita 9 é lateral; na esquerda 3 é lateral.", "s": "Cap. 19.2 — Localização e preparação", "r": [[0.847, 0.6127, 0.9233, 0.6304], [0.0689, 0.6305, 0.9169, 0.6482], [0.0689, 0.6483, 0.4397, 0.666]]}, {"f": "adu", "p": 22, "q": "Na figura original, leia 12 horas como polo superior de ambas as mamas.", "s": "Cap. 19 — legenda da figura do relógio", "r": [[0.4948, 0.3161, 0.9281, 0.331], [0.0689, 0.3292, 0.1509, 0.3441]]}], "img": ["adu-p22-0"], "t": "A17"}, {"id": "A17-04", "sub": "Inspeção estática e dinâmica", "comp": "Exame clínico das mamas", "rac": "Técnica", "q": "Na estação de exame das mamas, com a paciente sentada, o estudante pede que ela eleve os braços acima da cabeça e depois coloque as mãos na cintura, pressionando. Ele comenta: “agora vejo que o nódulo é endurecido”. O que está correto e o que está errado?", "o": [["As manobras estão corretas; consistência se avalia na palpação", "Inspeção dinâmica: braços elevados, mãos na cintura contraindo peitorais; consistência é palpação."], ["A inspeção dinâmica é feita deitada; consistência pode ser inferida pela forma", "Inspeção é sentada; palpação é deitada."], ["Mãos na cintura não fazem parte da inspeção; a consistência está correta", "Contrair os peitorais com mãos na cintura é parte da inspeção dinâmica."], ["A inspeção dinâmica deve preceder a estática", "Estática primeiro, braços ao lado do corpo."]], "pista": "“Consistência é palpação, não inspeção.”", "pp": ["Estática: sentada, braços ao lado; simetria, contorno, pele, aréolas, mamilos.", "Dinâmica: braços acima da cabeça; mãos na cintura contraindo peitorais; inclinação opcional.", "Comparar retrações e assimetrias.", "Consistência: só na palpação."], "ap": "<p>PDF p. 22: na inspeção estática observar simetria, contorno, pele (eritema, edema, retrações, feridas), aréolas e mamilos (inversão nova, descamação, secreção). A dinâmica acentua retrações produzidas por lesões aderidas aos planos profundos/ligamentos de Cooper. “Consistência é palpação, não inspeção.”<\/p>", "mud": [["Retração aparece só ao contrair os peitorais", "Achado de alarme a investigar", "Lesão aderida"]], "arm": "Descrever consistência na inspeção.", "ouro": "Inspeção (sentada) mostra; palpação (deitada) sente.", "m2": ["Qual manobra opcional?", "Inclinação do tronco à frente (PDF p. 22)."], "n": ["Estática → dinâmica.", "Braços elevados; mãos na cintura.", "Consistência na palpação."], "loc": [{"f": "adu", "p": 22, "q": "Dinâmica: pedir elevação dos braços acima da cabeça; depois mãos na cintura com pressão para contrair peitorais; opcional inclinação do tronco à frente.", "s": "Cap. 19.3 — Inspeção estática e dinâmica", "r": [[0.8212, 0.4008, 0.9144, 0.4185], [0.0689, 0.4186, 0.8949, 0.4363], [0.0689, 0.4364, 0.4912, 0.4541]]}, {"f": "adu", "p": 22, "q": "Consistência é palpação, não inspeção.", "s": "Cap. 19.3 — Inspeção estática e dinâmica", "r": [[0.2246, 0.4543, 0.5695, 0.4719]]}], "img": ["adu-p22-2", "adu-p22-3", "adu-p22-4"], "t": "A17"}, {"id": "A17-05", "sub": "Palpação linfonodal", "comp": "Exame clínico das mamas", "rac": "Técnica", "q": "Ao examinar as cadeias linfonodais de uma paciente com nódulo mamário, qual técnica está de acordo com o material?", "o": [["Sentada; sustentar o antebraço e explorar as paredes da axila até o ápice", "Paciente sentada, ombros relaxados; sustentar o antebraço e explorar paredes anterior, posterior, lateral, central e apical."], ["Deitada, com o braço elevado e tenso, palpando só a parede anterior", "A axila é palpada com a paciente sentada e o braço relaxado e sustentado."], ["Sentada, com as mãos na cintura e peitorais contraídos durante toda a palpação", "Contração dificulta a palpação; é manobra de inspeção."], ["Apenas fossas supraclaviculares, pois a axila é avaliada na mamografia", "A palpação axilar é parte do exame clínico."]], "pista": "Linfonodos: sentada, braço relaxado e sustentado.", "pp": ["Sentada, ombros relaxados.", "Supraclaviculares e infraclaviculares: polpas digitais, movimentos circulares.", "Axila: sustentar o antebraço; dedos até o ápice.", "Paredes: anterior, posterior, lateral, central, apical.", "Descrever número, tamanho, consistência, dor, mobilidade, aderência."], "ap": "<p>PDF p. 22: “Linfonodo doloroso pode ser reativo; endurecido/fixo suspeito.” A palpação é bilateral e comparativa. Sustentar o antebraço relaxa o peitoral e permite chegar ao ápice da axila.<\/p>", "mud": [["Linfonodo doloroso, móvel, com mastite", "Provavelmente reativo", "PDF p. 22"]], "arm": "Palpar a axila com o braço elevado e tenso.", "ouro": "Axila: sentada, antebraço sustentado, todas as paredes.", "m2": ["Que características descrever?", "Número, tamanho, consistência, dor, mobilidade e aderência (PDF p. 22)."], "n": ["Sentada.", "Antebraço sustentado.", "Cinco paredes."], "loc": [{"f": "adu", "p": 22, "q": "Axilares: sustente antebraço da paciente e introduza dedos até ápice da axila, explore paredes anterior/peitoral, posterior/subescapular, lateral/umeral, central e apical", "s": "Cap. 19.4 — Palpação linfonodal", "r": [[0.7601, 0.8036, 0.9205, 0.8212], [0.0689, 0.8214, 0.8868, 0.8391], [0.0689, 0.8392, 0.553, 0.8569]]}], "img": ["adu-p23-0", "adu-p23-1"], "t": "A17"}, {"id": "A17-06", "sub": "Velpeaux × Bloodgood", "comp": "Exame clínico das mamas", "rac": "Técnica", "q": "Qual descrição corresponde corretamente às técnicas de palpação mamária do material?", "o": [["Velpeaux: mão espalmada; Bloodgood: polpas digitais em “piano”, 3 pressões", "Velpeaux: face palmar em movimentos circulares; Bloodgood: polpas de indicador, médio e anular, pressões leve, média e profunda."], ["Velpeaux: pinçar o tecido entre polegar e indicador; Bloodgood: palma da mão", "Pinçar não é técnica descrita; a palma é Velpeaux."], ["Ambas usam só pressão profunda, iniciando obrigatoriamente pelo mamilo", "Bloodgood usa três níveis de pressão; não há obrigação de iniciar pelo mamilo."], ["Bloodgood é feita com a paciente sentada e Velpeaux deitada", "Ambas na palpação deitada."]], "pista": "Velpeaux = palma; Bloodgood = polpas, “tocar piano”.", "pp": ["Posição: decúbito dorsal, mão atrás da cabeça.", "Velpeaux: mão espalmada, movimentos circulares suaves.", "Bloodgood: polpas de 3 dedos, pressões leve, média, profunda.", "Trajeto vertical, radial ou circular, sem áreas descobertas."], "ap": "<p>PDF p. 23: área de palpação da clavícula ao sulco inframamário e do esterno à linha axilar, incluindo cauda axilar e retroareolar; “não existe obrigação de iniciar pelo mamilo”. As figuras do roteiro institucional mostram os três sentidos de exploração (radial, circular, vertical).<\/p>", "mud": [["Massa encontrada", "Descrever dimensões, localização, forma, contornos, consistência, sensibilidade, mobilidade, relação com pele/planos", "PDF p. 23"]], "arm": "Achar que é obrigatório começar pelo mamilo.", "ouro": "Palma (Velpeaux) + polpas em três pressões (Bloodgood), sem deixar áreas descobertas.", "m2": ["Que regiões não podem ser esquecidas?", "Cauda axilar e região retroareolar (PDF p. 23)."], "n": ["Velpeaux: palma.", "Bloodgood: polpas, 3 pressões.", "Sem áreas descobertas."], "loc": [{"f": "adu", "p": 23, "q": "Velpeaux: mão espalmada, face palmar desliza em movimentos suaves circulares. Bloodgood: polpas de indicador, médio e anular, dedilhamento sucessivo como tocar piano, pressões leve, média e profunda.", "s": "Cap. 19.5 — Palpação mamária", "r": [[0.6114, 0.3195, 0.894, 0.3371], [0.0689, 0.3373, 0.9264, 0.355], [0.0689, 0.3551, 0.7348, 0.3728]]}], "img": ["adu-p23-2", "adu-p23-3"], "t": "A17"}, {"id": "A17-07", "sub": "Posição e área da palpação", "comp": "Exame clínico das mamas", "rac": "Técnica", "q": "Na palpação da mama direita, qual posicionamento e área de exploração seguem o material?", "o": [["Deitada, mão direita atrás da cabeça; clavícula a sulco, esterno a axila", "Decúbito dorsal, mão do lado examinado atrás da cabeça; área inclui cauda axilar e retroareolar."], ["Sentada, braços ao lado; apenas a região areolar e os quadrantes superiores", "Palpação é deitada e cobre toda a área."], ["Deitada, mão esquerda atrás da cabeça; do mamilo até a borda da aréola", "A mão do lado EXAMINADO vai atrás da cabeça; a área é ampla."], ["Em pé, inclinada para frente; da clavícula ao sulco, sem incluir a axila", "Não é a posição; a cauda axilar é obrigatória."]], "pista": "Mão do lado examinado atrás da cabeça.", "pp": ["Decúbito dorsal.", "Mão ipsilateral atrás da cabeça; apoio sob o ombro se necessário.", "Uma mama exposta por vez.", "Limites: clavícula, sulco inframamário, esterno, linha axilar.", "Incluir cauda axilar e retroareolar."], "ap": "<p>Elevar o braço ipsilateral e colocar um pequeno apoio sob o ombro espalha o tecido mamário sobre a parede torácica, facilitando a palpação, sobretudo do quadrante superolateral, onde está a cauda axilar (PDF p. 23).<\/p>", "mud": [["Mama volumosa", "Apoio sob o ombro ipsilateral", "PDF p. 23"]], "arm": "Esquecer a cauda axilar.", "ouro": "Deitada, braço do lado examinado atrás da cabeça, da clavícula ao sulco e do esterno à axila.", "m2": ["Expressão papilar é rotina?", "Não; somente se indicada (descarga) (PDF p. 23)."], "n": ["Mão ipsilateral atrás da cabeça.", "Uma mama por vez.", "Cauda axilar."], "loc": [{"f": "adu", "p": 23, "q": "Paciente em decúbito dorsal, mão do lado examinado atrás da cabeça; pequeno apoio sob ombro ipsilateral se necessário.", "s": "Cap. 19.5 — Palpação mamária", "r": [[0.0689, 0.2838, 0.9165, 0.3015], [0.0689, 0.3017, 0.2876, 0.3193]]}, {"f": "adu", "p": 23, "q": "Palpe da clavícula ao sulco inframamário, do esterno à linha axilar, incluindo cauda axilar e retroareolar.", "s": "Cap. 19.5 — Palpação mamária", "r": [[0.544, 0.3017, 0.9083, 0.3193], [0.0689, 0.3195, 0.6127, 0.3371]]}], "img": ["adu-p23-2"], "t": "A17"}, {"id": "A17-08", "sub": "Descarga papilar", "comp": "Manifestações clínicas", "rac": "Classificação de risco", "q": "Duas pacientes com descarga papilar. Helena, 52 anos: secreção sanguinolenta espontânea, mama direita, por um único ducto. Sofia, 30 anos: secreção leitosa bilateral, multiductal, só à expressão, fora da lactação, em uso de metoclopramida. Qual a interpretação?", "o": [["Helena: alarme; Sofia: galactorreia (fármaco, β-hCG, PRL, TSH)", "Espontânea, unilateral, uniductal, sanguinolenta = alarme; bilateral multiductal provocada = menos suspeita."], ["Ambas: mamografia e biópsia imediata, pois toda descarga papilar é maligna", "A descarga bilateral, multiductal e provocada é menos suspeita."], ["Helena: ectasia benigna; Sofia: carcinoma, pela bilateralidade", "A lógica é inversa."], ["Ambas: expressão papilar em toda consulta para monitorar o volume", "Expressão só se indicada."]], "pista": "Espontânea + unilateral + uniductal + sanguinolenta = alarme.", "pp": ["Alarme: espontânea, unilateral, uniductal, sanguinolenta/serosa.", "Menos suspeita: bilateral, multiductal, provocada.", "Galactorreia fora da lactação: medicamentos, gravidez, prolactina, TSH.", "Expressão: pressionar a região subareolar sem pinçar."], "ap": "<p>PDF p. 21 (sinais de alarme) e p. 23 (técnica de expressão): pressionar suavemente a região subareolar em direção à papila sem pinçar, observando ductos, lateralidade, cor e espontaneidade. A metoclopramida eleva a prolactina.<\/p>", "mud": [["Sofia com descarga sanguinolenta unilateral espontânea", "Investigar", "Critérios de alarme"]], "arm": "Tratar toda descarga como igualmente suspeita.", "ouro": "Descarga suspeita: espontânea, unilateral, uniductal, sanguinolenta.", "m2": ["Como fazer a expressão papilar?", "Pressão suave da região subareolar em direção à papila, sem pinçar (PDF p. 23)."], "n": ["Unilateral uniductal espontânea = alarme.", "Galactorreia: prolactina, TSH, fármacos.", "Expressão só se indicada."], "loc": [{"f": "adu", "p": 21, "q": "secreção espontânea unilateral uniductal sanguinolenta/serosa, pele em casca de laranja, adenopatia dura e fixa.", "s": "Cap. 19.1 — Sinais de alarme", "r": [[0.4391, 0.5011, 0.8007, 0.5187], [0.0689, 0.5189, 0.6956, 0.5365]]}, {"f": "adu", "p": 23, "q": "Descarga bilateral multiductal provocada costuma ser menos suspeita; galactorreia fora lactação requer investigação de medicamentos, gravidez, prolactina e TSH conforme quadro.", "s": "Cap. 19.5 — Expressão papilar", "r": [[0.7677, 0.7154, 0.9311, 0.7331], [0.0689, 0.7333, 0.9277, 0.7509], [0.0689, 0.7511, 0.6251, 0.7687]]}], "img": ["adu-p24-0", "adu-p24-1"], "t": "A17"}, {"id": "A17-09", "sub": "BI-RADS 3 e 4A", "comp": "Investigação por imagem", "rac": "Conduta por categoria", "q": "Duas mulheres de 45 anos com nódulos palpáveis concordantes com a imagem. Laudo de Joana: BI-RADS 3. Laudo de Marta: BI-RADS 4A. Qual a conduta para cada uma?", "o": [["Joana: controle em ~6 meses; Marta: biópsia", "BI-RADS 3 (≤ 2%) controle curto; 4A (> 2 a ≤ 10%) biópsia."], ["Joana: biópsia; Marta: controle em 6 meses", "Inversão das condutas."], ["Ambas: rotina, pois categorias abaixo de 5 são benignas", "Só 1 e 2 são rotina."], ["Ambas: completar imagem antes de decidir", "Completar imagem é BI-RADS 0."]], "pista": "3 = controle curto; 4 (A, B, C) = biópsia.", "pp": ["0 incompleto.", "1–2 rotina.", "3 ≤ 2%: controle ~6 meses.", "4A >2–10%; 4B >10–50%; 4C >50–<95%: biópsia.", "5 ≥ 95%: biópsia e encaminhamento rápido; 6 confirmado."], "ap": "<p>A tabela da p. 24 do PDF. O BI-RADS classifica imagem, não estadia tumor; a concordância com o exame clínico é exigida — se a suspeita clínica é alta, imagem tranquilizadora não encerra a investigação.<\/p>", "mud": [["BI-RADS 0", "Completar imagem/comparar anteriores", "PDF p. 24"], ["BI-RADS 5", "Biópsia e encaminhamento rápido", "≥ 95%"]], "arm": "Considerar 4A “quase benigno” e acompanhar.", "ouro": "BI-RADS 4 em qualquer subcategoria = biópsia.", "m2": ["BI-RADS estadia o câncer?", "Não; classifica a imagem (PDF p. 24)."], "n": ["3: controle 6 meses.", "4: biópsia.", "0: completar."], "loc": [{"f": "adu", "p": 24, "q": "Provavelmente benigno, ≤2% Controle em curto intervalo, geralmente 6 meses", "s": "Cap. 19.6 — Tabela BI-RADS (3)", "r": [[0.2553, 0.536, 0.4758, 0.5513], [0.5325, 0.536, 0.8927, 0.5513]]}, {"f": "adu", "p": 24, "q": "4A >2 a ≤10% Biópsia", "s": "Cap. 19.6 — Tabela BI-RADS (4A)", "r": [[0.079, 0.5618, 0.1045, 0.5771], [0.2553, 0.5618, 0.3447, 0.5771], [0.5325, 0.5618, 0.591, 0.5771]]}], "img": ["sv-birads"], "t": "A17"}, {"id": "A17-10", "sub": "Suspeita clínica alta com imagem negativa", "comp": "Investigação diagnóstica", "rac": "Concordância clínico-radiológica", "q": "Mulher de 61 anos com nódulo endurecido, irregular e fixo de 2,5 cm no QSL esquerdo. Mamografia diagnóstica: mamas densas, BI-RADS 1. Ela pergunta se pode “ficar tranquila”. Conduta?", "o": [["Não: completar a investigação com US e biópsia", "Se suspeita clínica alta, imagem negativa não encerra a investigação."], ["Sim: BI-RADS 1 é negativo e a rotina pode ser mantida", "BI-RADS 1 só é rotina se concordante com a clínica."], ["Repetir a mamografia em 6 meses, como no BI-RADS 3", "É conduta do BI-RADS 3, e atrasa o diagnóstico."], ["Tratar como alteração fibrocística e orientar autoexame mensal", "Nódulo fixo e irregular não é alteração fibrocística."]], "pista": "Discordância clínica–imagem: prevalece a investigação.", "pp": ["Exame clínico suspeito.", "Imagem negativa.", "Discordância.", "Completar com US e histologia (core biopsy)."], "ap": "<p>PDF p. 24: “Nódulo palpável exige concordância entre exame clínico, imagem e, quando indicada, histologia. Se suspeita clínica alta, imagem negativa não encerra investigação.” Na tabela BI-RADS, o 1 é “rotina, se concordante com clínica”.<\/p>", "mud": [["Exame clínico sem nódulo e mamografia BI-RADS 1", "Rotina", "Concordância"]], "arm": "Confiar no laudo e ignorar o exame clínico.", "ouro": "Clínica suspeita vence imagem negativa.", "m2": ["Qual biópsia para lesão sólida suspeita?", "Core biopsy (PDF p. 24)."], "n": ["Concordância obrigatória.", "Imagem negativa não encerra.", "Core biopsy."], "loc": [{"f": "adu", "p": 24, "q": "Se suspeita clínica alta, imagem negativa não encerra investigação. Core biopsy para lesão sólida suspeita", "s": "Cap. 19.6 — Investigação e BI-RADS", "r": [[0.571, 0.3666, 0.8556, 0.3842], [0.0689, 0.3844, 0.7197, 0.402]]}], "img": ["sv-nodulo"], "t": "A17"}, {"id": "A17-11", "sub": "Rastreamento × investigação", "comp": "Raciocínio de saúde pública", "rac": "Diferenciação de condutas", "q": "Mulher de 34 anos, sem fatores de risco, com nódulo palpável novo. Na UBS, disseram-lhe que “mamografia só a partir dos 40” e não pediram exame. Qual o erro?", "o": [["Confundir rastreamento com investigação de sintoma", "A investigação diagnóstica de sintoma é indicada independentemente da idade."], ["Nenhum: em menores de 40 anos o exame é apenas clínico", "Há investigação por imagem e histologia quando indicadas."], ["O erro foi não pedir ressonância como primeiro exame", "O PDF define US e/ou mamografia conforme a idade."], ["O erro foi não iniciar tamoxifeno preventivo enquanto aguarda os 40 anos", "Não há indicação."]], "pista": "Rastreamento é para assintomáticas; nódulo é sintoma.", "pp": ["Rastreamento: assintomática, depende de idade/risco/política.", "Investigação: há sintoma — independente da idade.", "34 anos: mamografia diagnóstica e/ou US conforme protocolo."], "ap": "<p>PDF p. 24: “Diferencie rastreamento de pessoa assintomática (depende de idade/risco e política vigente) de investigação diagnóstica de sintoma, indicada independentemente da idade.” Entre 30 e 40 anos, conforme idade e risco, mamografia diagnóstica e US complementar.<\/p>", "mud": [["34 anos, assintomática", "Sem rastreamento populacional", "Rastreamento por idade/risco"]], "arm": "Aplicar a idade do rastreamento a uma mulher com sintoma.", "ouro": "Sintoma mamário: investigar em qualquer idade.", "m2": ["Que exames entre 30–40 anos?", "Mamografia diagnóstica e US complementar, conforme idade/risco e protocolo (PDF p. 24)."], "n": ["Rastreamento ≠ investigação.", "Sintoma = investigar.", "Idade não impede."], "loc": [{"f": "adu", "p": 24, "q": "Diferencie rastreamento de pessoa assintomática (depende de idade/risco e política vigente) de investigação diagnóstica de sintoma, indicada independentemente da idade.", "s": "Cap. 19.6 — Investigação e BI-RADS", "r": [[0.0689, 0.7095, 0.9038, 0.7271], [0.0689, 0.7273, 0.7379, 0.745]]}], "img": ["sv-nodulo"], "t": "A17"}, {"id": "A17-12", "sub": "Mastite que não resolve", "comp": "Diagnóstico diferencial", "rac": "Revisão diagnóstica", "q": "Mulher de 44 anos, não lactante, tratada há 3 semanas como “mastite” com dois antibióticos. Mantém mama esquerda eritematosa, endurecida, com pele espessada, sem febre e sem flutuação. Qual a conduta?", "o": [["Rever o diagnóstico e investigar com imagem e biópsia", "Mastite que não resolve exige rever diagnóstico."], ["Trocar por um terceiro antibiótico de espectro mais amplo", "Persistir no mesmo raciocínio atrasa o diagnóstico."], ["Drenar cirurgicamente pela suspeita de abscesso", "Sem flutuação, não há sinal de coleção."], ["Aplicar compressas mornas e manter observação clínica por mais 1 mês", "Atrasa a investigação."]], "pista": "“Mastite que não resolve exige rever diagnóstico.”", "pp": ["Mastite: dor, calor, rubor, febre.", "Flutuação = coleção.", "Falha terapêutica sem febre, pele espessada, não lactante: suspeitar outra causa.", "Imagem e histologia."], "ap": "<p>O PDF encerra a anamnese com a frase “Mastite que não resolve exige rever diagnóstico” (p. 21). Eritema e pele espessada sem febre, em mulher fora da lactação, podem corresponder a infiltração linfática tumoral (lembre a casca de laranja).<\/p>", "mud": [["Lactante com febre, dor focal e massa flutuante", "Abscesso: US e drenagem", "IESC p. 7"]], "arm": "Trocar antibiótico indefinidamente.", "ouro": "Mastite refratária: biópsia, não outro antibiótico.", "m2": ["O que sugere coleção?", "Flutuação (PDF p. 21)."], "n": ["Refratária = rever diagnóstico.", "Flutuação = coleção.", "Pele espessada = alerta."], "loc": [{"f": "adu", "p": 21, "q": "Mastite que não resolve exige rever diagnóstico.", "s": "Cap. 19.1 — Anamnese e sinais de alarme", "r": [[0.6943, 0.5189, 0.9069, 0.5365], [0.0689, 0.5367, 0.2828, 0.5544]]}, {"f": "adu", "p": 21, "q": "Dor, calor, rubor, febre; flutuação sugere coleção.", "s": "Cap. 19.1 — tabela (Mastite/abscesso)", "r": [[0.3225, 0.3951, 0.6868, 0.4104]]}], "img": ["sv-mama-puerperio"], "t": "A17"}, {"id": "A17-13", "sub": "Cisto mamário", "comp": "Manifestações clínicas", "rac": "Hipótese e investigação", "q": "Mulher de 42 anos com massa lisa, móvel, dolorosa na mama direita, que aumenta antes da menstruação. Qual a hipótese e o exame que define a natureza da lesão?", "o": [["Cisto; a US define se é simples ou complexo", "Cisto: liso, móvel, variável com o ciclo, às vezes doloroso; US define simples/complexo."], ["Carcinoma inflamatório; biópsia de pele imediata", "Não há sinais inflamatórios cutâneos."], ["Fibroadenoma; exame clínico basta para o diagnóstico", "Variação com o ciclo sugere cisto; e exame clínico não basta."], ["Alteração fibrocística; dispensar imagem", "Massa definida exige imagem."]], "pista": "Lisa + móvel + varia com o ciclo = cisto; US define.", "pp": ["Características: liso, móvel, variável com o ciclo, às vezes doloroso.", "Hipótese: cisto.", "US: simples × complexo.", "PAAF pode ser útil em cisto selecionado."], "ap": "<p>A tabela do PDF (p. 21) e a p. 24: “PAAF pode ser útil em cisto selecionado”. Aos 42 anos, a investigação inclui mamografia diagnóstica e US conforme protocolo; a US é o exame que caracteriza o conteúdo.<\/p>", "mud": [["US mostra componente sólido", "Cisto complexo: investigar (biópsia)", "Não é simples"]], "arm": "Dispensar imagem por ser doloroso.", "ouro": "Cisto: US define simples × complexo.", "m2": ["Nodularidade cíclica bilateral com mastalgia: hipótese?", "Alterações fibrocísticas (PDF p. 21)."], "n": ["Cisto varia com ciclo.", "US define conteúdo.", "PAAF em cisto selecionado."], "loc": [{"f": "adu", "p": 21, "q": "Massa lisa, móvel, variável com ciclo, por vezes dolorosa; US define conteúdo simples/complexo.", "s": "Cap. 19.1 — tabela (Cisto)", "r": [[0.3225, 0.3296, 0.8871, 0.3449], [0.3225, 0.3435, 0.4627, 0.3588]]}], "img": ["sv-nodulo"], "t": "A17"}, {"id": "A17-14", "sub": "Comunicação na estação de mamas", "comp": "Comunicação de achado suspeito", "rac": "Comunicação", "q": "Ao final da estação, o estudante encontra nódulo endurecido e irregular. Qual a forma de comunicar que está de acordo com o material?", "o": [["Explicar que o achado exige imagem e biópsia, sem afirmar diagnóstico", "O PDF: verbalizar que nódulo suspeito precisa de confirmação histológica; não afirmar diagnóstico antes da biópsia."], ["“É câncer; vamos encaminhar para a oncologia hoje”", "Afirma diagnóstico sem histologia."], ["“Não é nada, provavelmente é um nódulo benigno; volte daqui a um ano”", "Minimiza achado suspeito e atrasa a investigação."], ["Não comentar o achado para não assustar a paciente", "A paciente tem direito à informação."]], "pista": "Nódulo suspeito precisa de histologia; não afirmar antes.", "pp": ["Descrever o achado.", "Explicar a necessidade de imagem e biópsia.", "Não afirmar diagnóstico.", "Acolher e planejar."], "ap": "<p>PDF p. 24: “No OSCE: verbalize que nódulo suspeito precisa confirmação histológica e explique com cuidado sem afirmar diagnóstico antes da biópsia.” A preparação inclui oferecer acompanhante, privacidade, cobertura e explicar cada etapa (p. 21).<\/p>", "mud": [["Biópsia confirmar carcinoma", "BI-RADS 6: planejamento terapêutico", "PDF p. 24"]], "arm": "Antecipar diagnóstico ou omitir o achado.", "ouro": "Suspeito ≠ confirmado: explique a investigação com cuidado.", "m2": ["Qual o preparo antes do exame?", "Acompanhante, privacidade, cobertura e explicação das etapas (PDF p. 21)."], "n": ["Não afirmar antes da biópsia.", "Explicar próximos passos.", "Acolher."], "loc": [{"f": "adu", "p": 24, "q": "No OSCE: verbalize que nódulo suspeito precisa confirmação histológica e explique com cuidado sem afirmar diagnóstico antes da biópsia.", "s": "Cap. 19.6 — Investigação e BI-RADS", "r": [[0.7366, 0.7273, 0.9086, 0.745], [0.0689, 0.7451, 0.846, 0.7628], [0.0689, 0.7629, 0.3262, 0.7806]]}], "img": [], "t": "A17"}, {"id": "A17-15", "sub": "Alterações fibrocísticas", "comp": "Manifestações clínicas", "rac": "Diferencial", "q": "Mulher de 36 anos com mastalgia e “mamas encaroçadas” bilaterais, piores na fase pré-menstrual, sem nódulo dominante ao exame. Qual a interpretação e a postura correta?", "o": [["Alterações fibrocísticas; atenção a nódulo dominante", "Nodularidade e mastalgia cíclicas bilaterais; nódulo persistente é alarme."], ["Fibroadenomas múltiplos; ressecção cirúrgica", "Não há nódulos definidos."], ["Carcinoma bilateral; biópsia guiada das duas mamas", "Quadro cíclico e difuso, sem nódulo dominante."], ["Mastite bilateral; antibiótico oral por 10 dias e reavaliação", "Não há sinais inflamatórios nem febre."]], "pista": "Cíclico + bilateral + difuso = alterações fibrocísticas.", "pp": ["Nodularidade e mastalgia cíclicas.", "Frequentemente bilaterais.", "Sem nódulo dominante.", "Alarme: massa persistente, retração, descarga suspeita."], "ap": "<p>A tabela do PDF (p. 21) define alterações fibrocísticas como nodularidade e mastalgia cíclicas, frequentemente bilaterais. O sinal que muda a conduta é uma massa persistente, que não acompanha o ciclo — então, imagem conforme a idade.<\/p>", "mud": [["Nódulo dominante que persiste após a menstruação", "Investigar com imagem", "Massa persistente"]], "arm": "Biopsiar nodularidade difusa cíclica.", "ouro": "Cíclico e difuso tranquiliza; nódulo dominante persistente investiga.", "m2": ["Cite sinais de alarme.", "Massa persistente, retração nova, descarga espontânea unilateral uniductal sanguinolenta/serosa, casca de laranja, adenopatia dura e fixa (PDF p. 21)."], "n": ["Cíclica, bilateral.", "Sem nódulo dominante.", "Massa persistente = investigar."], "loc": [{"f": "adu", "p": 21, "q": "Nodularidade e mastalgia cíclicas, frequentemente bilaterais.", "s": "Cap. 19.1 — tabela (Alterações fibrocísticas)", "r": [[0.3225, 0.3693, 0.7697, 0.3846]]}, {"f": "adu", "p": 21, "q": "Sinais de alarme: massa persistente, retração nova", "s": "Cap. 19.1 — Sinais de alarme", "r": [[0.7838, 0.4832, 0.868, 0.5009], [0.0689, 0.5011, 0.4403, 0.5187]]}], "img": ["sv-nodulo"], "t": "A17"}, {"id": "I15-01", "sub": "Encaminhar não é dar alta", "comp": "Coordenação do cuidado pela APS", "rac": "Organização da rede", "q": "Gestante de 14 semanas com hipertensão crônica em uso de anti-hipertensivo foi encaminhada ao ambulatório de alto risco. A enfermeira da ESF pergunta se ela “sai da agenda” da UBS. Qual a resposta correta?", "o": [["Não: a UBS mantém o vínculo e coordena o cuidado compartilhado", "Encaminhar não é dar alta; a APS coordena adesão, vacinas, saúde bucal, condições sociais e intercorrências."], ["Sim: após o encaminhamento, o pré-natal passa a ser exclusivo do especialista", "Contraria o material."], ["Sim, mas a UBS volta a vê-la no puerpério, apenas para vacinas", "A APS acompanha durante a gestação."], ["Depende: só segue na UBS se faltar à consulta especializada", "A coordenação é contínua, não condicional."]], "pista": "“Encaminhar não significa dar alta da UBS.”", "pp": ["Alto risco: pré-natal compartilhado.", "APS: coordenação, adesão, vacinas, saúde bucal, social, visitas, intercorrências.", "Comunicação com o serviço especializado.", "Busca de faltosas."], "ap": "<p>IESC p. 1 (item 2): “Encaminhar não significa dar alta da UBS. A APS continua coordenando o cuidado [...] em comunicação com o serviço especializado.” A questão 1 da revisão do PDF (p. 8) repete: a UBS deve manter vínculo, coordenação e cuidado compartilhado.<\/p>", "mud": [["Gestante de risco habitual", "Pré-natal na UBS", "IESC p. 1"]], "arm": "Achar que encaminhamento transfere a responsabilidade.", "ouro": "Alto risco é compartilhado; a APS nunca solta a mão.", "m2": ["Qual o fluxo completo?", "UBS → estratificação → regulação/ambulatório de alto risco → plano compartilhado e contrarreferência → maternidade vinculada → puerpério na APS (IESC p. 1)."], "n": ["Não há alta da UBS.", "Cuidado compartilhado.", "APS coordena."], "loc": [{"f": "iesc", "p": 1, "q": "Encaminhar não significa dar alta da UBS. A APS continua coordenando o cuidado, acompanhando a adesão", "s": "1 — Responsabilidades da APS", "r": [[0.0851, 0.5392, 0.8797, 0.5599]]}, {"f": "iesc", "p": 8, "q": "Resposta: Não. Deve manter vínculo, coordenação e cuidado compartilhado.", "s": "8 — Revisão, questão 1", "r": [[0.0851, 0.2247, 0.6497, 0.2455]]}], "img": ["sv-fluxo-ar"], "t": "I15"}, {"id": "I15-02", "sub": "Risco intermediário", "comp": "Estratificação de risco", "rac": "Classificação", "q": "Gestante de 17 anos, tabagista (10 cigarros/dia), IMC 33, mora sozinha e refere pouco apoio familiar. Sem doenças crônicas. Pela classificação nacional, como classificar e conduzir?", "o": [["Intermediário: vigilância ampliada, sem internação", "Vulnerabilidades (idade extrema, baixo apoio, tabagismo, obesidade) = intermediário; não é internação."], ["Alto risco com internação para cessar o tabagismo", "Intermediário não significa internação."], ["Risco habitual: vulnerabilidades sociais não alteram a estratificação de risco", "Elas definem o intermediário."], ["Alto risco obrigatório pela idade inferior a 18 anos", "Idade extrema é fator do intermediário."]], "pista": "Vulnerabilidades sem doença materna importante = intermediário.", "pp": ["Habitual: sem condição que exija especialista.", "Intermediário: idade extrema, baixo apoio, tabagismo, obesidade, antecedentes obstétricos.", "Alto: doença materna/complicação.", "Reestratificar a cada consulta."], "ap": "<p>IESC p. 1: o risco intermediário exige “vigilância ampliada e eventual apoio especializado” e “não significa automaticamente internação”. Em Minas Gerais, a nota técnica de 2024 organiza o fluxo em habitual e alto risco (além de urgências) — não confundir as duas abordagens.<\/p>", "mud": [["Mesmo caso com HAS crônica", "Alto risco", "Doença materna"], ["Pela nota técnica de MG", "Fluxo habitual × alto risco", "IESC p. 1"]], "arm": "Equiparar “intermediário” a internação.", "ouro": "Intermediário = vigiar mais, não internar.", "m2": ["O risco é fixo na gestação?", "Não: muda e deve ser reavaliado a cada consulta (IESC p. 1)."], "n": ["Vulnerabilidades = intermediário.", "Não é internação.", "MG: habitual × alto."], "loc": [{"f": "iesc", "p": 1, "q": "Vulnerabilidades ou fatores que exigem vigilância ampliada e eventual apoio especializado: idade extrema, baixo apoio familiar, tabagismo, obesidade, antecedentes obstétricos, entre outros. Não significa automaticamente internação.", "s": "1 — Conceito e classificação (Risco intermediário)", "r": [[0.4296, 0.27, 0.8811, 0.2908], [0.0851, 0.2896, 0.845, 0.3103], [0.0851, 0.3091, 0.5952, 0.3298]]}], "img": ["sv-risco"], "t": "I15"}, {"id": "I15-03", "sub": "Classificação em Minas Gerais", "comp": "Estratificação de risco", "rac": "Normas regionais", "q": "Em uma UBS de Governador Valadares (MG), o residente classifica uma gestante como “risco intermediário” e diz que é o fluxo estadual. Qual a correção?", "o": [["MG (2024) usa habitual e alto risco, mais urgências", "O intermediário é da classificação nacional; MG organiza em habitual e alto risco."], ["MG usa quatro níveis: baixo, intermediário, alto e muito alto", "Não é o que o material descreve."], ["MG não estratifica risco; encaminha todas as gestantes ao especialista", "MG estratifica e organiza fluxo."], ["O fluxo de MG é idêntico ao nacional, com três níveis", "O material destaca a diferença."]], "pista": "“Não confunda as duas abordagens.”", "pp": ["Nacional: habitual, intermediário, alto.", "MG 2024: habitual e alto risco + urgências.", "Aplicar o fluxo local, conhecendo o nacional."], "ap": "<p>IESC p. 1: “Atenção para Minas Gerais — A nota técnica estadual de 2024 organiza o fluxo em risco habitual e alto risco, além das urgências obstétricas. A classificação nacional descreve também risco intermediário.”<\/p>", "mud": [["Prova cobrando o Manual nacional", "Três níveis", "IESC p. 1"]], "arm": "Misturar a classificação nacional com o fluxo de MG.", "ouro": "MG: habitual × alto (+ urgência); nacional: inclui intermediário.", "m2": ["Qual documento estadual?", "SES-MG, Estratificação de risco gestacional e fluxo de atendimento, 2024 (IESC p. 8)."], "n": ["MG: dois níveis + urgência.", "Nacional: três níveis.", "Não confundir."], "loc": [{"f": "iesc", "p": 1, "q": "Atenção para Minas Gerais — A nota técnica estadual de 2024 organiza o fluxo em risco habitual e alto risco, além das urgências obstétricas.", "s": "1 — Conceito e classificação", "r": [[0.0851, 0.3997, 0.8879, 0.4205], [0.0851, 0.4192, 0.3196, 0.44]]}], "img": ["sv-risco"], "t": "I15"}, {"id": "I15-04", "sub": "Pré-eclâmpsia grave na APS", "comp": "Urgência obstétrica", "rac": "Priorização", "q": "Gestante de 32 semanas na UBS: PA 164/112 mmHg confirmada, cefaleia e escotomas. A consulta no ambulatório de alto risco está marcada para daqui a 5 dias. Qual a conduta?", "o": [["Suspeita de PE grave: estabilizar e transferir com urgência", "PA grave + sintomas: estabilizar e transferir; não aguardar."], ["Manter a consulta especializada agendada e iniciar anti-hipertensivo oral", "Gravidade exige manejo urgente."], ["Orientar repouso e procurar a maternidade por conta própria se piorar", "A gestante não deve ser orientada a buscar vaga sozinha."], ["Solicitar proteinúria de 24 h e reavaliar com o resultado", "Atrasar por exames é erro na gravidade."]], "pista": "≥ 160/110 + escotomas = urgência.", "pp": ["Gravidade: PA ≥ 160 e/ou ≥ 110, cefaleia, escotomas, epigastralgia, dispneia, oligúria, convulsão.", "Estabilização inicial (anti-hipertensivos e MgSO₄ conforme protocolo).", "SAMU/regulação, comunicar a maternidade.", "Não esperar o ambulatório."], "ap": "<p>IESC p. 3 (gravidade e conduta) e p. 8 (questão 2 da revisão: “Suspeita de pré-eclâmpsia grave: estabilização inicial e transferência urgente”). O fluxo de urgência da p. 4: ABC, sinais vitais, estado materno-fetal, SAMU/regulação, suporte sem atrasar o transporte e comunicação com o serviço receptor.<\/p>", "mud": [["PA 144/92 sem sintomas", "Avaliação obstétrica imediata pela suspeita de PE, sem critério de gravidade", "IESC p. 3"]], "arm": "Esperar o ambulatório ou exames.", "ouro": "PE com gravidade: estabiliza e transfere — não espera.", "m2": ["O que é HELLP?", "Hemólise, enzimas hepáticas elevadas e plaquetopenia (IESC p. 3)."], "n": ["≥ 160/110 ou sintomas = urgência.", "Estabilizar e transferir.", "Não mandar buscar vaga."], "loc": [{"f": "iesc", "p": 3, "q": "Gravidade — PA ≥160 sistólica ou ≥110 diastólica, cefaleia persistente, escotomas, epigastralgia, dispneia, oligúria ou convulsão exigem manejo urgente.", "s": "3 — Hipertensão e pré-eclâmpsia", "r": [[0.0851, 0.3349, 0.8647, 0.3556], [0.0851, 0.3544, 0.4282, 0.3751]]}, {"f": "iesc", "p": 8, "q": "Resposta: Não. Suspeita de pré-eclâmpsia grave: estabilização inicial e transferência urgente.", "s": "8 — Revisão, questão 2", "r": [[0.0851, 0.2764, 0.7688, 0.2971]]}], "img": ["sv-has", "sv-urgencia"], "t": "I15"}, {"id": "I15-05", "sub": "HAS crônica em uso de IECA", "comp": "Manejo de doença crônica na gestação", "rac": "Prescrição segura", "q": "Mulher de 35 anos, hipertensa em uso de enalapril, descobre gravidez de 7 semanas. PA 138/88. Qual a conduta adequada na APS?", "o": [["Suspender o enalapril, trocar o anti-hipertensivo e referenciar", "HAS crônica = alto risco; IECA/BRA contraindicados na gestação."], ["Manter o enalapril, pois a PA está controlada e a troca pode descompensar", "IECA/BRA são contraindicados na gestação."], ["Trocar por losartana, que é mais segura na gestação", "BRA também é contraindicado."], ["Suspender todo anti-hipertensivo até 20 semanas", "Deve-se revisar e substituir, não simplesmente suspender."]], "pista": "IECA/BRA contraindicados; HAS crônica = alto risco.", "pp": ["HAS crônica: ≥ 140/90 antes da gestação ou < 20 sem.", "Revisar tratamento.", "IECA/BRA contraindicados.", "Pré-natal compartilhado com especialista.", "Considerar AAS (12–16 sem)."], "ap": "<p>IESC p. 3: “HAS crônica — [...] Revisar tratamento (IECA/BRA são contraindicados na gestação).” Na p. 1, HAS crônica aparece entre as condições de alto risco. O plano inclui exames dirigidos (função renal, proteinúria) e AAS em baixa dose idealmente iniciado entre 12 e 16 semanas.<\/p>", "mud": [["Hipertensão surgida com 26 semanas", "HAS gestacional/PE", "> 20 sem"]], "arm": "Trocar IECA por BRA.", "ouro": "Gestante: IECA e BRA, nunca.", "m2": ["Quando a HAS crônica é diagnosticada no pós-parto?", "Hipertensão que persiste além de 12 semanas pós-parto (IESC p. 3)."], "n": ["IECA/BRA contraindicados.", "HAS crônica = alto risco.", "AAS 12–16 sem."], "loc": [{"f": "iesc", "p": 3, "q": "HAS crônica — PA ≥140/90 mmHg antes da gestação ou antes de 20 semanas, ou persistente além de 12 semanas pós-parto. Revisar tratamento (IECA/BRA são contraindicados na gestação).", "s": "3 — Hipertensão e pré-eclâmpsia", "r": [[0.0851, 0.1794, 0.855, 0.2001], [0.0851, 0.1989, 0.7101, 0.2196]]}], "img": ["sv-has"], "t": "I15"}, {"id": "I15-06", "sub": "AAS para prevenção de pré-eclâmpsia", "comp": "Medidas preventivas", "rac": "Timing de intervenção", "q": "Gestante de 18 semanas com lúpus e HAS crônica chega ao pré-natal pela primeira vez. Sobre o AAS em baixa dose, qual afirmativa segue o material?", "o": [["Risco aumentado; ideal iniciar entre 12 e 16 semanas", "AAS baixa dose para risco aumentado, idealmente 12–16 semanas; não universal."], ["É universal para todas as gestantes a partir de 20 semanas", "Não é universal."], ["Está contraindicado após 16 semanas, então não há o que discutir", "O material diz “idealmente” 12–16; a decisão é individual."], ["Substitui o anti-hipertensivo no controle da HAS crônica", "AAS é prevenção de PE, não anti-hipertensivo."]], "pista": "AAS: risco aumentado; ideal 12–16 sem.", "pp": ["Indicação: risco aumentado de PE.", "Janela ideal: 12–16 semanas.", "Não universal.", "Captação tardia: decidir conforme protocolo."], "ap": "<p>IESC p. 3: “AAS em baixa dose para risco aumentado, conforme prescrição/protocolo, idealmente iniciado entre 12 e 16 semanas.” A captação precoce (até 12 semanas) existe justamente para não perder janelas como essa. HAM Adulto p. 10 reforça: “não universal”.<\/p>", "mud": [["Gestante de risco habitual", "Sem AAS", "Não universal"]], "arm": "Prescrever AAS para todas ou achar que após 16 semanas é proibido.", "ouro": "AAS: alto risco de PE, idealmente começando entre 12 e 16 semanas.", "m2": ["Por que a captação até 12 semanas importa aqui?", "Para iniciar AAS na janela ideal e outras medidas precoces (IESC p. 1 e 3)."], "n": ["Risco aumentado.", "12–16 sem.", "Não universal."], "loc": [{"f": "iesc", "p": 3, "q": "AAS em baixa dose para risco aumentado, conforme prescrição/protocolo, idealmente iniciado entre 12 e 16 semanas.", "s": "3 — Hipertensão e pré-eclâmpsia (Conduta)", "r": [[0.8169, 0.4192, 0.8798, 0.44], [0.0851, 0.4387, 0.8958, 0.4595]]}], "img": ["sv-suplementos"], "t": "I15"}, {"id": "I15-07", "sub": "DMG: metas e encaminhamento", "comp": "Diabetes na gestação", "rac": "Seguimento", "q": "Gestante com DMG diagnosticado com 26 semanas, em dieta há 2 semanas. Perfil: jejum 102, 1 h pós-prandial 152, 2 h 118 mg/dL. Qual a conduta segundo o material?", "o": [["Controle insuficiente: insulina e especialista", "Metas: jejum < 95, 1 h < 140, 2 h < 120. Necessidade farmacológica → especializada."], ["Controle adequado: manter dieta e TOTG de controle", "Jejum e 1 h acima das metas."], ["Metformina pela UBS e manter o seguimento só na atenção primária", "O material cita insulina e atenção especializada conforme fluxo."], ["Repetir TOTG para confirmar o diagnóstico", "O diagnóstico está feito; avalia-se o controle."]], "pista": "Jejum 102 (> 95) e 1 h 152 (> 140).", "pp": ["Metas: jejum < 95; 1 h < 140; 2 h < 120.", "Jejum e 1 h fora.", "Insulina quando controle insuficiente.", "DMG com necessidade farmacológica → especializada."], "ap": "<p>IESC p. 3: “Conduta — Orientação alimentar, atividade física se liberada, automonitorização e seguimento. Metas usuais [...]. Insulina quando controle insuficiente, conforme avaliação. Diabetes prévio e DMG com controle inadequado/necessidade de tratamento farmacológico demandam atenção especializada conforme fluxo local.”<\/p>", "mud": [["Todas as glicemias nas metas", "Manter dieta e automonitorização na APS", "Controle adequado"]], "arm": "Considerar 1 h de 152 “próxima do normal”.", "ouro": "DMG for // ---------- gabarito equilibrado ----------
function balancedLetters(n){var base=Math.floor(n/4),rem=n%4,arr=[];for(var k=0;k<4;k++)for(var i=0;i<base;i++)arr.push(k);arr=arr.concat(shuffle([0,1,2,3]).slice(0,rem));
 for(var tries=0;tries<400;tries++){shuffle(arr);var ok=true,run=1;for(var i=1;i<arr.length;i++){run=arr[i]===arr[i-1]?run+1:1;if(run>3){ok=false;break}}if(ok)break}return arr}
function makeOrder(target){var others=shuffle([1,2,3]);var ord=[],j=0;for(var p=0;p<4;p++)ord.push(p===target?0:others[j++]);return ord}

function newSession(qids,mode,title,keepOrder){var ids=qids.slice();if(!keepOrder)shuffle(ids);var L=balancedLetters(ids.length);var ord={};ids.forEach(function(id,i){ord[id]=makeOrder(L[i])});
 S.seq=(S.seq||0)+1;var sid='s'+Date.now()+'_'+S.seq;S.sessions[sid]={id:sid,created:Date.now(),mode:mode,title:title,qids:ids,ord:ord,ans:{},idx:0,done:false,conf:{}};S.cur=sid;

 if(n>=total){var all=[];tids.forEach(function(t){all=all.concat(pools[t])});return all}
 var alloc={},sum=0,fr=[];tids.forEach(function(t){var x=pools[t].length*n/total;alloc[t]=Math.floor(x);sum+=alloc[t];fr.push([x-alloc[t],t])});
 fr.sort(function(a,b){return b[0]-a[0]||Math.random()-.5});for(var i=0;sum<n&&i<fr.length;i++){var t=fr[i][1];if(alloc[t]<pools[t].length){alloc[t]++;sum++}}
 var out=[];tids.forEach(function(t){out=out.concat(shuffle(pools[t].slice()).slice(0,alloc[t]))});return out}

 blk('J','Imagens e esquemas',imgs.length?('<p class="small mut">Figuras do PDF reproduzidas sem alteração e esquemas didáticos construídos a partir do texto; toque para ampliar.</p>'+imgs.map(function(k){return figHTML(k)}).join('')):'<p class="mut small">Sem figuras para este tema.</p>');

var savedY=0;

 savedY=window.scrollY;var t=T[q.t];var groups={},order=[];q.loc.forEach(function(L){var k=L.f+'-'+L.p;if(!groups[k]){groups[k]={f:L.f,p:L.p,r:[],s:[]};order.push(k)}groups[k].r=groups[k].r.concat(L.r);groups[k].s.push(L.s)});
 var fk=q.loc[focus||0]?q.loc[focus||0].f+'-'+q.loc[focus||0].p:order[0];order.sort(function(a,b){return (a===fk?-1:0)-(b===fk?-1:0)});

function aggregate(ids,ansOf){var by={},tot={x:0,y:0,n:0};ids.forEach(function(id){var k=Q[id].t;by[k]=by[k]||{x:0,y:0,n:0};by[k].n++;tot.n++;var a=ansOf(id);if(a){by[k].y++;tot.y++;if(a.ok){by[k].x++;tot.x++}}});return{by:by,tot:tot}}
function reportTable(ag){var rows=[];DORDER.forEach(function(d){var dx=0,dy=0,dn=0;D.topics.filter(function(t){return t.d===d&&ag.by[t.id]}).forEach(function(t){var b=ag.by[t.id];dx+=b.x;dy+=b.y;dn+=b.n;rows.push([DISC[d].n,t.aula+' — '+t.short,b.x+' de '+b.y+(b.y?(' ('+pct(b.x,b.y)+'%)'):''),(b.y-b.x)+'',(b.n-b.y)+''])});
  if(dn)rows.push([DISC[d].n,'SUBTOTAL',dx+' de '+dy+(dy?(' ('+pct(dx,dy)+'%)'):''),(dy-dx)+'',(dn-dy)+''])});
 return tableHTML({cap:'Desempenho por tema (acertos sobre respondidas)',h:['Disciplina','Tema','Acertos','Erradas','Não respondidas'],r:rows})}
function vResult(){var s=cur();if(!s){go('home');return}var ag=aggregate(s.qids,function(id){return s.ans[id]});var t=ag.tot;
 var h='<h1>Resultado</h1><p class="mut small">'+esc(s.title)+' · modo '+s.mode+'</p><div class="card"><p style="font-size:18px;margin:0"><b>Acertos: '+t.x+' de '+t.y+' respondidas ('+pct(t.x,t.y)+'%)</b></p><p class="small mut">Respondidas: '+t.y+' de '+t.n+' · Erradas: '+(t.y-t.x)+' · Não respondidas: '+(t.n-t.y)+'</p></div><div class="card">'+reportTable(ag)+'</div>';
 var plan=[];Object.keys(ag.by).forEach(function(k){var b=ag.by[k];if(b.y&&pct(b.x,b.y)<70)plan.push([T[k].aula+' — '+T[k].short,b.x+'/'+b.y,'Reler a revisão teórica e as páginas do PDF; refazer as erradas'])});
 if(plan.length)h+='<div class="card">'+tableHTML({cap:'Plano de revisão (temas com menos de 70%)',h:['Tema','Acertos','Ação'],r:plan})+'</div>';
 h+='<div class="card"><div class="grid2"><button class="btn pri" id="rev">Revisar questões com correção</button><button class="btn" id="redo">Refazer erradas desta sessão</button><button class="btn" id="csv">Exportar CSV</button><button class="btn" id="hm">Início</button></div></div>';
 el('app').innerHTML=h;el('rev').onclick=function(){s.idx=0;save();go('q')};
 el('redo').onclick=function(){var w=s.qids.filter(function(id){return !(s.ans[id]&&s.ans[id].ok)});if(!w.length){notify('Nenhuma questão errada ou em branco.');return}newSession(w,'estudo','Refazer erradas',true)};
 el('csv').onclick=function(){csvExport(s.qids.map(function(id){var a=s.ans[id];return[id,DISC[T[Q[id].t].d].n,T[Q[id].t].short,Q[id].sub,a?(a.ok?'certa':'errada'):'em branco',a&&a.conf||'']}),['questao','disciplina','tema','subtema','resultado','confianca'],'sessao.csv')};el('hm').onclick=function(){go('home')}}
function csvExport(rows,head,name){var txt=[head].concat(rows).map(function(r){return r.map(function(c){c=String(c==null?'':c);return '"'+c.replace(/"/g,'""')+'"'}).join(';')}).join('\n');
 dlg('<h2>Exportar CSV</h2><p class="small mut">Copie e cole numa planilha (separador ponto e vírgula).</p><textarea id="csvt" readonly style="width:100%;height:180px;font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="ccopy">Copiar</button><button class="btn" id="cdl">Baixar arquivo</button><button class="btn" id="cclose">Fechar</button></div><p class="small" id="cmsg"></p>');el('csvt').value=txt;el('cclose').onclick=function(){closeModal()};var fr=false;try{fr=window.self!==window.top}catch(e){fr=true}if(fr)el('cdl').style.display='none';
 el('ccopy').onclick=function(){function man(){el('csvt').select();el('cmsg').textContent='Selecione e copie manualmente.'}try{navigator.clipboard.writeText(txt).then(function(){el('cmsg').textContent='Copiado.'},man)}catch(e){man()}};
 el('cdl').onclick=function(){try{var blob=new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){el('cmsg').textContent='Download bloqueado aqui; use Copiar.'}}}

function listHTML(ids){var h='<div class="card">';ids.forEach(function(id){var q=Q[id],t=T[q.t];var hs=S.hist[id];h+='<div class="tp" style="margin:6px 0"><div class="nm"><div class="small"><span class="tag '+t.d+'">'+esc(t.short)+'</span>'+(hs?(hs.ok?'<span class="tag" style="color:var(--ok)">acertou</span>':'<span class="tag" style="color:var(--bad)">errou</span>'):'')+'</div><div class="small">'+esc(q.q.slice(0,140))+'…</div></div><button class="btn sm" data-one="'+id+'">Abrir</button></div>'});return h+'</div>'}

 if(!ids.length)h+='<div class="card">Nenhum erro registrado ainda.</div>';else{h+='<div class="card"><div class="grid2"><button class="btn pri" id="redo">Refazer todas ('+ids.length+')</button>'+(hc.length?'<button class="btn" id="redohc">Só alta confiança ('+hc.length+')</button>':'')+'</div></div>'+listHTML(ids)}
 el('app').innerHTML=h;if(el('redo'))el('redo').onclick=function(){newSession(ids,'estudo','Caderno de erros',true)};if(el('redohc'))el('redohc').onclick=function(){newSession(hc,'estudo','Erros de alta confiança',true)};wireList()}

 el('app').innerHTML='<h1>Relatório de desempenho</h1><p class="small mut">Primeira tentativa de cada questão, em todas as sessões.</p><div class="card"><b>Acertos: '+t.x+' de '+t.y+' respondidas ('+pct(t.x,t.y)+'%)</b><br><span class="small mut">Ainda não respondidas: '+(t.n-t.y)+' de '+t.n+'</span></div><div class="card">'+reportTable(ag)+'</div><div class="card"><button class="btn" id="csv">Exportar CSV</button></div>';
 el('csv').onclick=function(){csvExport(D.questions.map(function(q){var a=S.hist[q.id];return[q.id,DISC[T[q.t].d].n,T[q.t].short,q.sub,a?(a.ok?'certa':'errada'):'nao respondida',a&&a.conf||'']}),['questao','disciplina','tema','subtema','primeira_tentativa','confianca'],'historico.csv')}}

function vAbout(){var h='<h1>Sobre o simulado</h1>';
 h+='<div class="card"><h2>Arquivos-base</h2>'+tableHTML({cap:'',h:['Arquivo','Disciplina','Páginas usadas'],r:[[D.files.ped.name,'HAM Ped (sem. 15–17)','PDF p. 34–37, 42–51'],[D.files.adu.name,'HAM Adulto (sem. 15–17)','PDF p. 7–15, 17–19, 21–24 (rodapé p. 40–55)'],[D.files.iesc.name,'IESC (sem. 15–17)','PDF p. 1–8']]})+'</div>';
 h+='<div class="card"><h2>Matriz de cobertura</h2>'+tableHTML({cap:'',h:['ID','Disciplina','Semana','Tema','Questões'],r:D.topics.map(function(t){return[t.id,DISC[t.d].n,t.aula,t.n,String(topicCount(t.id))]})})+'</div>';
 var lg=0,sh=0;D.questions.forEach(function(q){var L=q.o.map(function(o){return o[0].length});var mx=Math.max.apply(null,L),mn=Math.min.apply(null,L);if(L[0]===mx)lg++;if(L[0]===mn)sh++});
 h+='<div class="card"><h2>Como as correções foram construídas</h2><ul class="small"><li>Cada questão aponta a página real do PDF e a seção; o recorte mostra o trecho exato destacado em amarelo (localizado automaticamente no texto do PDF; nas páginas digitalizadas do HAM Adulto, p. 8 e 9, o destaque foi marcado manualmente).</li><li>Mini-aula em blocos A–P: identificação, resposta e pista, onde está no PDF, revisão teórica, tabelas, passo a passo, análise das quatro alternativas, comparação, fluxograma, imagens, o que mudaria a resposta, armadilha, regra de ouro, segundo cenário, síntese e fontes.</li><li>Imagens: figuras do PDF do HAM Adulto reproduzidas sem alteração; para HAM Ped e IESC (sem figuras), esquemas didáticos originais construídos a partir do texto. Não há fotografias íntimas pediátricas.</li><li>Informações que não estão nos PDFs aparecem marcadas como <span class="ext">complemento externo</span> (ex.: caso Alyne Pimentel no Comitê CEDAW, metas de 2027, art. 217-A do Código Penal).</li><li>Gabarito sorteado de forma equilibrada entre A–D a cada sessão (no máximo três letras iguais seguidas). A correta é a alternativa mais longa em '+lg+' de '+D.questions.length+' questões e a mais curta em '+sh+'.</li><li>Progresso salvo apenas neste navegador. Modo prova oculta a correção na interface até finalizar.</li></ul></div>';
 h+='<div class="card"><h2>Divergências entre os materiais</h2><ul class="small"><li>Ferro profilático: IESC fixa “a partir da 20ª semana até três meses após o parto”; o HAM Adulto diz “a partir do início do acompanhamento/idade indicada pelo protocolo”. Nenhuma questão depende dessa diferença.</li><li>US morfológica: HAM Adulto cita 18–24 semanas no texto (p. 12) e 20–24 na tabela (p. 9).</li><li>Estratificação: classificação nacional (habitual, intermediário, alto) × nota técnica de MG 2024 (habitual e alto risco + urgências) — cobrada explicitamente.</li></ul></div>';
 el('app').innerHTML=h}
