<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 490' width='640' height='490' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='640' height='490' fill='#fff'/><text x='320.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Fisiologia da lactação e transferência de leite</text><rect x='60.0' y='46' width='520' height='58' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='320.0' y='71.05' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Sucção eficaz do bebê</text><text x='320.0' y='88.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>estímulo nervoso aréola/mamilo</text><line x1='320.0' y1='104' x2='320.0' y2='128' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='130' width='520' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='320.0' y='155.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Prolactina → PRODUÇÃO do leite</text><text x='320.0' y='172.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>Ocitocina → EJEÇÃO do leite</text><line x1='320.0' y1='188' x2='320.0' y2='212' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='214' width='520' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='320.0' y='239.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Remoção frequente e eficaz</text><text x='320.0' y='256.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>mantém a produção (livre demanda)</text><line x1='320.0' y1='272' x2='320.0' y2='296' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='298' width='520' height='58' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='320.0' y='323.05' font-size='13' fill='#a12a2a' font-weight="700" text-anchor='middle'>Pega ruim / dor / mamada ineficaz</text><text x='320.0' y='340.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>→ baixa transferência: ingurgitamento, fissura, baixo ganho</text><line x1='320.0' y1='356' x2='320.0' y2='380' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='382' width='520' height='58' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='320.0' y='407.05' font-size='13' fill='#8a5a00' font-weight="700" text-anchor='middle'>Sinais de ingestão suficiente</text><text x='320.0' y='424.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>deglutição audível, ≥ 6 fraldas/dia após o 5º dia, ganho ponderal</text><text x='320.0' y='480.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Ped, PDF p. 49.</text></svg>