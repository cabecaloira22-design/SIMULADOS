<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 680 470' width='680' height='470' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='680' height='470' fill='#fff'/><text x='340.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Sigilo na consulta do adolescente: regra e exceções</text><rect x='190' y='46' width='300' height='62' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='340.0' y='65.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>REGRA: sigilo</text><text x='340.0' y='81.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>preservado com discernimento,</text><text x='340.0' y='97.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>inclusive diante dos responsáveis</text><rect x='20' y='140' width='300' height='92' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='170.0' y='166.2' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>ANTES das perguntas</text><text x='170.0' y='182.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>explicar os limites do sigilo;</text><text x='170.0' y='198.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>parte da consulta a sós;</text><text x='170.0' y='214.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>não condicionar ao responsável/BO</text><rect x='360' y='140' width='300' height='92' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='510.0' y='166.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>EXCEÇÕES (quebra justificada)</text><text x='510.0' y='182.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>risco relevante à vida/saúde</text><text x='510.0' y='198.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>violência, coerção, exploração</text><text x='510.0' y='214.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>atividade sexual &lt; 14 anos</text><line x1='340' y1='108' x2='170' y2='138' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><line x1='340' y1='108' x2='510' y2='138' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='360' y='262' width='300' height='92' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='510.0' y='288.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>COMO quebrar</text><text x='510.0' y='304.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>comunicar ao adolescente antes;</text><text x='510.0' y='320.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>compartilhar só o necessário;</text><text x='510.0' y='336.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>buscar ajuda junto com ele</text><line x1='510' y1='232' x2='510' y2='260' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='20' y='262' width='300' height='92' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='170.0' y='288.2' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>Gravidez na adolescência</text><text x='170.0' y='304.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>sigilo NÃO cai só pela gestação;</text><text x='170.0' y='320.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>avaliar idade, violência, risco,</text><text x='170.0' y='336.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>rede de apoio e desejo da jovem</text><rect x='190' y='380' width='300' height='56' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='340.0' y='404.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>Suspeita de violência</text><text x='340.0' y='420.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>notificar (até 24 h) + Conselho Tutelar</text><line x1='510' y1='354' x2='400' y2='378' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><text x='340.0' y='460.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original baseado em HAM Ped, PDF p. 42–43 e 50–51.</text></svg>