<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 400' width='720' height='400' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='400' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Hipertensão na gestação: classificar pelo tempo e pelos achados</text><line x1='40' y1='70' x2='680' y2='70' stroke='#1d1f23' stroke-width='2' /><line x1='360.0' y1='60' x2='360.0' y2='80' stroke='#a12a2a' stroke-width='3' /><text x='360.0' y='54' font-size='13' fill='#a12a2a' font-weight="700" text-anchor='middle'>20 semanas</text><rect x='20' y='92' width='330' height='82' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='185.0' y='121.2' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>HAS CRÔNICA</text><text x='185.0' y='137.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>≥ 140/90 antes da gestação ou &lt; 20 sem</text><text x='185.0' y='153.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>(ou persistente &gt; 12 sem pós-parto)</text><rect x='370' y='92' width='330' height='82' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='535.0' y='121.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>HAS GESTACIONAL</text><text x='535.0' y='137.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>hipertensão nova &gt; 20 sem</text><text x='535.0' y='153.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>sem proteinúria/disfunção orgânica</text><rect x='370' y='190' width='330' height='96' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='535.0' y='218.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>PRÉ-ECLÂMPSIA</text><text x='535.0' y='234.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>&gt; 20 sem + proteinúria (≥ 300 mg/24 h</text><text x='535.0' y='250.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>ou P/C ≥ 0,3) OU disfunção orgânica</text><text x='535.0' y='266.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>mesmo sem proteinúria</text><rect x='20' y='190' width='330' height='96' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='185.0' y='218.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>GRAVIDADE → URGÊNCIA</text><text x='185.0' y='234.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>PA ≥ 160 e/ou ≥ 110 · cefaleia, escotomas</text><text x='185.0' y='250.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>epigastralgia, dispneia, oligúria</text><text x='185.0' y='266.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>convulsão = eclâmpsia</text><rect x='20' y='304' width='680' height='60' rx='10' fill='#ffffff' stroke='#1d1f23' stroke-width='1.6'/><text x='360.0' y='330.275' font-size='11.5' fill='#1d1f23' font-weight="700" text-anchor='middle'>Investigar: plaquetas, creatinina, transaminases, proteinúria e vitalidade fetal · IECA/BRA contraindicados</text><text x='360.0' y='345.775' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>Edema isolado NÃO diagnostica pré-eclâmpsia · HELLP = hemólise + enzimas hepáticas ↑ + plaquetopenia</text><text x='360.0' y='390.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 3; HAM Adulto, PDF p. 12.</text></svg>