<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 420' width='700' height='420' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='420' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Mapa de raciocínio do exame genital (menino)</text><rect x='20' y='50' width='230' height='58' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='135.0' y='83.55' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Alteração do MEATO</text><line x1='250' y1='79' x2='300' y2='79' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='302' y='50' width='378' height='58' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='491.0' y='67.2' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>anomalia anatômica</text><text x='491.0' y='83.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>(hipospádia ventral /</text><text x='491.0' y='99.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>epispádia dorsal)</text><rect x='20' y='120' width='230' height='58' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='135.0' y='153.55' font-size='13' fill='#8a5a00' font-weight="700" text-anchor='middle'>Alteração do PREPÚCIO</text><line x1='250' y1='149' x2='300' y2='149' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='302' y='120' width='378' height='58' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='491.0' y='137.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>avaliar cicatriz e perfusão</text><text x='491.0' y='153.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>(fimose fisiológica × patológica;</text><text x='491.0' y='169.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>parafimose = urgência)</text><rect x='20' y='190' width='230' height='58' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='135.0' y='223.55' font-size='13' fill='#6a3d8f' font-weight="700" text-anchor='middle'>BOLSA VAZIA</text><line x1='250' y1='219' x2='300' y2='219' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='302' y='190' width='378' height='58' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='491.0' y='207.2' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>localizar o testículo</text><text x='491.0' y='223.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>(retrátil permanece; criptorquídico</text><text x='491.0' y='239.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>não permanece/não alcança)</text><rect x='20' y='260' width='230' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='135.0' y='293.55' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>MASSA INDOLOR</text><line x1='250' y1='289' x2='300' y2='289' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='302' y='260' width='378' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='491.0' y='277.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>hidrocele (transilumina)</text><text x='491.0' y='293.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>× hérnia (varia com choro,</text><text x='491.0' y='309.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>redutível)</text><rect x='20' y='330' width='230' height='58' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='135.0' y='363.55' font-size='13' fill='#a12a2a' font-weight="700" text-anchor='middle'>DOR ESCROTAL SÚBITA</text><line x1='250' y1='359' x2='300' y2='359' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='302' y='330' width='378' height='58' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='491.0' y='347.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>TORÇÃO até exclusão:</text><text x='491.0' y='363.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>cirurgia imediata, não</text><text x='491.0' y='379.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>atrasar por Doppler</text><text x='350.0' y='410.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original a partir do “Mapa de raciocínio” — HAM Ped, PDF p. 35.</text></svg>