<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 500' width='700' height='500' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='500' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Alterações genitais na menina e no RN — o que cada achado sugere</text><rect x='16' y='46' width='300' height='52' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='166.0' y='76.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Membrana fina unindo pequenos lábios</text><line x1='316' y1='72' x2='352' y2='72' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='46' width='330' height='52' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='519.0' y='68.2' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Sinéquia labial: higiene/observação;</text><text x='519.0' y='84.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>tópico se sintomática; NÃO separar à força</text><rect x='16' y='105' width='300' height='52' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='166.0' y='135.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Corrimento fétido/sanguinolento persistente</text><line x1='316' y1='131' x2='352' y2='131' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='105' width='330' height='52' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='519.0' y='127.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>Corpo estranho vaginal: ginecologia</text><text x='519.0' y='143.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>pediátrica; não explorar às cegas</text><rect x='16' y='164' width='300' height='52' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='166.0' y='194.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Anel avermelhado ao redor do meato</text><line x1='316' y1='190' x2='352' y2='190' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='164' width='330' height='52' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='519.0' y='186.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>Prolapso uretral: especialista;</text><text x='519.0' y='202.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>urgência se retenção/necrose/dor</text><rect x='16' y='223' width='300' height='52' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='166.0' y='253.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Amenorreia + dor cíclica + abaulamento azulado</text><line x1='316' y1='249' x2='352' y2='249' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='223' width='330' height='52' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='519.0' y='245.2' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>Hímen imperfurado: US pélvico</text><text x='519.0' y='261.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>e correção cirúrgica</text><rect x='16' y='282' width='300' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='166.0' y='312.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Placas esbranquiçadas, padrão em “oito”</text><line x1='316' y1='308' x2='352' y2='308' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='282' width='330' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='519.0' y='304.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Líquen escleroso: corticoide</text><text x='519.0' y='320.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>tópico potente sob orientação</text><rect x='16' y='341' width='300' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='166.0' y='371.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>RN: secreção branca/discreto sangue</text><line x1='316' y1='367' x2='352' y2='367' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='341' width='330' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='519.0' y='363.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Retirada hormonal materna:</text><text x='519.0' y='379.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>orientar e observar</text><rect x='16' y='400' width='300' height='52' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='166.0' y='430.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>Genitália atípica + vômitos/desidratação</text><line x1='316' y1='426' x2='352' y2='426' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='354' y='400' width='330' height='52' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='519.0' y='422.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>Excluir crise adrenal (HAC):</text><text x='519.0' y='438.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>glicemia, eletrólitos, 17-OHP</text><text x='350.0' y='490.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Ped, PDF p. 36–37. Achados genitais isolados não comprovam nem excluem abuso.</text></svg>