<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 300' width='700' height='300' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='300' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>IG pela DUM e DPP pela regra de Näegele</text><rect x='20' y='50' width='320' height='110' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='180.0' y='84.05' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Idade gestacional</text><text x='180.0' y='101.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>(dias entre DUM e consulta) ÷ 7</text><text x='180.0' y='118.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>quociente = semanas</text><text x='180.0' y='135.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>resto = dias</text><rect x='360' y='50' width='320' height='110' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='520.0' y='84.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Näegele</text><text x='520.0' y='101.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>DUM + 7 dias − 3 meses (+1 ano)</text><text x='520.0' y='118.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>= 280 dias (ciclo de 28 dias)</text><text x='520.0' y='135.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>DPP é estimativa</text><rect x='120' y='186' width='460' height='74' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='350.0' y='210.55' font-size='13' fill='#8a5a00' font-weight="700" text-anchor='middle'>Exemplo do PDF</text><text x='350.0' y='227.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>DUM 10/08/2026 → +7 dias = 17/08 → −3 meses = 17/05 → +1 ano</text><text x='350.0' y='244.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>DPP 17/05/2027</text><text x='350.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 7 (cap. 14.1, item 3 e DPP).</text></svg>