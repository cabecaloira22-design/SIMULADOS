<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 470' width='720' height='470' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='470' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Rede Alyne: os seis componentes</text><rect x='20' y='46' width='330' height='104' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='185.0' y='85.875' font-size='12.5' fill='#1d6b3a' font-weight="700" text-anchor='middle'>1. Pré-natal</text><text x='185.0' y='102.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>UBS, captação precoce, ≥ 7 consultas,</text><text x='185.0' y='118.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>exames, estratificação, vinculação</text><rect x='370' y='46' width='330' height='104' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='535.0' y='85.875' font-size='12.5' fill='#1f5f8b' font-weight="700" text-anchor='middle'>2. Parto e nascimento</text><text x='535.0' y='102.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>maternidades, CPN, leitos, boas práticas,</text><text x='535.0' y='118.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>acompanhante, complicações</text><rect x='20' y='164' width='330' height='104' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='185.0' y='195.625' font-size='12.5' fill='#6a3d8f' font-weight="700" text-anchor='middle'>3. Puerpério e atenção</text><text x='185.0' y='212.125' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>integral à criança</text><text x='185.0' y='228.625' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>seguimento na APS, aleitamento,</text><text x='185.0' y='245.125' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>planejamento reprodutivo</text><rect x='370' y='164' width='330' height='104' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='535.0' y='203.875' font-size='12.5' fill='#8a5a00' font-weight="700" text-anchor='middle'>4. Sistema logístico</text><text x='535.0' y='220.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>transporte sanitário e de urgência,</text><text x='535.0' y='236.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>regulação</text><rect x='20' y='282' width='330' height='104' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='185.0' y='321.875' font-size='12.5' fill='#8a5a00' font-weight="700" text-anchor='middle'>5. Sistema de apoio</text><text x='185.0' y='338.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>apoio diagnóstico e terapêutico,</text><text x='185.0' y='354.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>informação</text><rect x='370' y='282' width='330' height='104' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='535.0' y='321.875' font-size='12.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>6. Sistema de governança</text><text x='535.0' y='338.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>pactuação entre gestores, região,</text><text x='535.0' y='354.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>indicadores, avaliação</text><text x='360' y='418' font-size='13' fill='#1d1f23' font-weight="700" text-anchor='middle'>Assistenciais: 1–3 · Estruturantes (meio): 4–6</text><text x='360' y='438' font-size='12' fill='#5c6370'  text-anchor='middle'>Portaria GM/MS 5.350/2024 (financiamento: 5.349/2024) — reestrutura a Rede Cegonha</text><text x='360.0' y='460.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 5.</text></svg>