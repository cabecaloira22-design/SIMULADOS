<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 406' width='640' height='406' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='640' height='406' fill='#fff'/><text x='320.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Gestante Rh negativo: sequência</text><rect x='60.0' y='46' width='520' height='58' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='320.0' y='71.05' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>ABO/Rh na 1ª consulta → Rh NEGATIVO</text><text x='320.0' y='88.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>solicitar Coombs indireto</text><line x1='320.0' y1='104' x2='320.0' y2='128' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='130' width='520' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='320.0' y='155.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Coombs indireto NEGATIVO (não sensibilizada)</text><text x='320.0' y='172.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>repetir e programar profilaxia</text><line x1='320.0' y1='188' x2='320.0' y2='212' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='214' width='520' height='58' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='320.0' y='239.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Anti-D ~28 semanas (300 µg IM, rotina)</text><text x='320.0' y='256.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>+ até 72 h após parto de RN Rh+/desconhecido + eventos sensibilizantes</text><line x1='320.0' y1='272' x2='320.0' y2='296' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='60.0' y='298' width='520' height='58' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='320.0' y='323.05' font-size='13' fill='#a12a2a' font-weight="700" text-anchor='middle'>Coombs indireto POSITIVO</text><text x='320.0' y='340.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>caracterizar anticorpo e referenciar — anti-D NÃO trata sensibilização</text><text x='320.0' y='396.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 10 e 12; IESC, PDF p. 3.</text></svg>