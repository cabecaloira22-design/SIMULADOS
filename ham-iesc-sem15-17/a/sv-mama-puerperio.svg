<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' width='720' height='300' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='300' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Mama no puerpério: ingurgitamento × mastite × abscesso</text><rect x='16' y='52' width='220' height='150' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='126.0' y='107.2' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>INGURGITAMENTO</text><text x='126.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>mamas tensas, geralmente bilateral</text><text x='126.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>corrigir pega, livre demanda</text><text x='126.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>ordenhar um pouco p/ conforto</text><rect x='248' y='52' width='220' height='150' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='358.0' y='107.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>MASTITE</text><text x='358.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>dor localizada, rubor, sintomas</text><text x='358.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>sistêmicos · manter amamentação</text><text x='358.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>anti-inflamatório ± antibiótico</text><rect x='480' y='52' width='220' height='150' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='590.0' y='107.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>ABSCESSO</text><text x='590.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>massa flutuante</text><text x='590.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>US e drenagem</text><text x='590.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>conforme avaliação</text><text x='360' y='238' font-size='13' fill='#1d1f23' font-weight="700" text-anchor='middle'>Fissura = problema de pega: corrigir a técnica.</text><text x='360.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 7; HAM Ped, PDF p. 48–49.</text></svg>