<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 430' width='720' height='430' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='430' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Pega: o que observar durante a mamada</text><text x='180' y='62' font-size='15' fill='#1d6b3a' font-weight="700" text-anchor='middle'>PEGA ADEQUADA</text><path d='M60,90 C190,90 235,150 235,190 C235,230 190,290 60,290' fill='#f6e6dc' stroke='#b07a62' stroke-width='2'/><ellipse cx='235' cy='190' rx='9' ry='34' fill='#d9a28c' stroke='#b07a62'/><path d='M320,140 Q242,140 222,158' fill='none' stroke='#1d1f23' stroke-width='3'/><path d='M320,250 Q242,250 216,230' fill='none' stroke='#1d1f23' stroke-width='3'/><path d='M216,230 q-8,6 -2,14' fill='none' stroke='#1d1f23' stroke-width='3'/><path d='M222,158 q-8,-6 -2,-14' fill='none' stroke='#1d1f23' stroke-width='3'/><text x='60' y='316.0' font-size='12.5' fill='#1d6b3a'  text-anchor='start'>• boca bem aberta</text><text x='60' y='332.0' font-size='12.5' fill='#1d6b3a'  text-anchor='start'>• lábio inferior evertido</text><text x='60' y='348.0' font-size='12.5' fill='#1d6b3a'  text-anchor='start'>• queixo toca a mama</text><text x='60' y='364.0' font-size='12.5' fill='#1d6b3a'  text-anchor='start'>• mais aréola visível acima</text><text x='60' y='380.0' font-size='12.5' fill='#1d6b3a'  text-anchor='start'>• sucção profunda, deglutição audível</text><text x='540' y='62' font-size='15' fill='#a12a2a' font-weight="700" text-anchor='middle'>PEGA INADEQUADA</text><path d='M420,90 C550,90 595,150 595,190 C595,230 550,290 420,290' fill='#f6e6dc' stroke='#b07a62' stroke-width='2'/><ellipse cx='595' cy='190' rx='9' ry='18' fill='#d9a28c' stroke='#b07a62'/><path d='M680,176 Q620,176 606,182' fill='none' stroke='#1d1f23' stroke-width='3'/><path d='M680,204 Q620,204 606,198' fill='none' stroke='#1d1f23' stroke-width='3'/><path d='M606,182 q6,4 0,8' fill='none' stroke='#1d1f23' stroke-width='3'/><text x='420' y='316.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>• boca pouco aberta</text><text x='420' y='332.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>• lábios para dentro</text><text x='420' y='348.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>• suga só o mamilo</text><text x='420' y='364.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>• bochechas encovadas, estalos</text><text x='420' y='380.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>• dor, fissura, bebê insatisfeito</text><text x='360.0' y='420.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original, abstrato — HAM Ped, PDF p. 48. Alinhamento orelha–ombro–quadril; queixo primeiro.</text></svg>