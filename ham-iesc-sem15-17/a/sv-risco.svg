<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 330' width='720' height='330' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='330' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Estratificação de risco: nacional × Minas Gerais</text><text x='180' y='60' font-size='14' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Classificação nacional</text><rect x='20' y='72' width='320' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='180.0' y='94.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Risco habitual</text><text x='180.0' y='110.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>UBS + equipe de saúde da família</text><rect x='20' y='134' width='320' height='62' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='180.0' y='153.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>Risco intermediário</text><text x='180.0' y='169.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>vulnerabilidades: vigilância ampliada,</text><text x='180.0' y='185.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>NÃO é internação automática</text><rect x='20' y='206' width='320' height='62' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='180.0' y='225.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>Alto risco</text><text x='180.0' y='241.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>doença materna / complicação fetal:</text><text x='180.0' y='257.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>pré-natal compartilhado</text><text x='540' y='60' font-size='14' fill='#6a3d8f' font-weight="700" text-anchor='middle'>Nota técnica SES-MG 2024</text><rect x='380' y='72' width='320' height='52' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='540.0' y='102.55' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Risco habitual</text><rect x='380' y='134' width='320' height='62' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='540.0' y='169.55' font-size='13' fill='#a12a2a' font-weight="700" text-anchor='middle'>Alto risco</text><rect x='380' y='206' width='320' height='62' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='540.0' y='233.2' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>Urgências obstétricas</text><text x='540.0' y='249.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>(fluxo próprio)</text><text x='360' y='300.0' font-size='12.5' fill='#1d1f23' font-weight="700" text-anchor='middle'>Não confunda: MG organiza o fluxo em habitual e alto risco (+ urgência).</text><text x='360.0' y='320.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 1 (item 1).</text></svg>