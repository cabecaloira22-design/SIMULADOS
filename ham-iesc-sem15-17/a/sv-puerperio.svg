<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 740 380' width='740' height='380' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='740' height='380' fill='#fff'/><text x='370.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Puerpério: fases, consultas e involução</text><rect x='51.166666666666664' y='56' width='100.50000000000003' height='28' rx='4' fill='#f8e7e7' stroke='#a12a2a' opacity='1'/><text x='101.41666666666667' y='75' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>imediato 1–10</text><rect x='162.83333333333331' y='56' width='379.6666666666667' height='28' rx='4' fill='#fbf1dc' stroke='#8a5a00' opacity='1'/><text x='352.66666666666663' y='75' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>tardio 11–45</text><rect x='553.6666666666666' y='56' width='156.33333333333337' height='28' rx='4' fill='#e6f3ea' stroke='#1d6b3a' opacity='1'/><text x='631.8333333333333' y='75' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>remoto &gt; 45</text><line x1='40' y1='120' x2='710' y2='120' stroke='#1d1f23' stroke-width='2' /><line x1='40.0' y1='114' x2='40.0' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='40.0' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>0 d</text><line x1='118.16666666666667' y1='114' x2='118.16666666666667' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='118.16666666666667' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>7 d</text><line x1='196.33333333333334' y1='114' x2='196.33333333333334' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='196.33333333333334' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>14 d</text><line x1='375.0' y1='114' x2='375.0' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='375.0' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>30 d</text><line x1='509.0' y1='114' x2='509.0' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='509.0' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>42 d</text><line x1='710.0' y1='114' x2='710.0' y2='126' stroke='#1d1f23' stroke-width='2' /><text x='710.0' y='142' font-size='12' fill='#5c6370'  text-anchor='middle'>60 d</text><rect x='51.166666666666664' y='152' width='67.0' height='24' rx='4' fill='#e8f0f6' stroke='#1f5f8b' opacity='1'/><text x='51.166666666666664' y='194' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='start'>1ª consulta: 1ª semana (com RN)</text><rect x='375.0' y='152' width='134.0' height='24' rx='4' fill='#e8f0f6' stroke='#1f5f8b' opacity='1'/><text x='363.8333333333333' y='194' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='start'>2ª consulta: 30–42 d (MG)</text><text x='370' y='226.0' font-size='12.5' fill='#1d1f23' font-weight="700" text-anchor='middle'>Consulta de rotina SEMPRE antes de 42 dias · alto risco: também na referência</text><text x='40' y='258.0' font-size='12.5' fill='#1d1f23'  text-anchor='start'>Útero: fundo desce ~1 cm/dia; deixa de ser palpável no abdome em ~2 semanas</text><text x='40' y='284.0' font-size='12.5' fill='#1d1f23'  text-anchor='start'>Lóquios: rubros (primeiros dias) → serosos/acastanhados → claros/esbranquiçados</text><text x='40' y='310.0' font-size='12.5' fill='#a12a2a'  text-anchor='start'>Anormal: sangramento crescente/intenso, odor fétido + febre + dor uterina (endometrite)</text><text x='40' y='336.0' font-size='12.5' fill='#6a3d8f'  text-anchor='start'>Baby blues: até 2 semanas, autolimitado · persistente/prejuízo funcional: depressão pós-parto</text><text x='370.0' y='370.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 6–7.</text></svg>