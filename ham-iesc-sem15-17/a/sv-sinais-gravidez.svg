<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 360' width='700' height='360' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='360' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Sinais de gravidez: presunção, probabilidade e certeza</text><rect x='30' y='50' width='640' height='80' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='350.0' y='86.05' font-size='13' fill='#8a5a00' font-weight="700" text-anchor='middle'>PRESUNÇÃO (sugerem, não confirmam)</text><text x='350.0' y='103.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>amenorreia, náuseas, mastalgia, polaciúria, fadiga</text><rect x='30' y='146' width='640' height='90' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='350.0' y='178.55' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>PROBABILIDADE</text><text x='350.0' y='195.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>aumento uterino · Goodell (colo amolecido) · Hegar (istmo amolecido)</text><text x='350.0' y='212.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>Chadwick/Jacquemier (vagina violácea) · hCG positivo</text><rect x='30' y='252' width='640' height='80' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='350.0' y='288.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>CERTEZA</text><text x='350.0' y='305.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>embrião/feto na US · atividade cardíaca fetal · movimentos fetais percebidos pelo EXAMINADOR</text><text x='350.0' y='350.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 7 (cap. 14.1). hCG positivo não confirma localização nem viabilidade.</text></svg>