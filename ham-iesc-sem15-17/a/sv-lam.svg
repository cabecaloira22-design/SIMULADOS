<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 300' width='700' height='300' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='300' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>LAM: método da lactação e amenorreia</text><rect x='20' y='56' width='210' height='80' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='125.0' y='100.55' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Bebê &lt; 6 meses</text><text x='238' y='102' font-size='22' fill='#1d1f23' font-weight="700" text-anchor='middle'>+</text><rect x='246' y='56' width='210' height='80' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='351.0' y='100.55' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Amenorreia</text><text x='464' y='102' font-size='22' fill='#1d1f23' font-weight="700" text-anchor='middle'>+</text><rect x='472' y='56' width='210' height='80' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='577.0' y='83.55' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Aleitamento exclusivo</text><text x='577.0' y='100.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>ou quase, frequente</text><text x='577.0' y='117.55' font-size='13' fill='#1d1f23'  text-anchor='middle'>dia e noite</text><line x1='350' y1='136' x2='350' y2='168' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='70' y='170' width='560' height='74' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='350.0' y='194.875' font-size='12.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>Os TRÊS juntos = proteção contraceptiva</text><text x='350.0' y='211.375' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>Qualquer requisito falhou → iniciar outro método</text><text x='350.0' y='227.875' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>(ovulação pode voltar ANTES da 1ª menstruação)</text><text x='350.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 7.</text></svg>