<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 360' width='720' height='360' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='360' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Glicemia na gestação: 1ª consulta e TOTG 75 g (24–28 sem)</text><text x='20' y='62' font-size='14' fill='#1d1f23' font-weight="700" text-anchor='start'>Glicemia de jejum na 1ª consulta</text><rect x='20' y='72' width='216' height='62' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='128.0' y='99.125' font-size='12.5' fill='#1d6b3a' font-weight="700" text-anchor='middle'>&lt; 92 mg/dL</text><text x='128.0' y='115.625' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>programar TOTG 24–28 sem</text><rect x='252' y='72' width='216' height='62' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='360.0' y='99.125' font-size='12.5' fill='#8a5a00' font-weight="700" text-anchor='middle'>92–125 mg/dL</text><text x='360.0' y='115.625' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>DMG (não esperar 24 sem)</text><rect x='484' y='72' width='216' height='62' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='592.0' y='99.125' font-size='12.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>≥ 126 mg/dL</text><text x='592.0' y='115.625' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>diabetes manifesto</text><text x='20' y='172' font-size='14' fill='#1d1f23' font-weight="700" text-anchor='start'>TOTG 75 g — UM valor alterado basta para DMG</text><rect x='20' y='182' width='216' height='48' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='128.0' y='210.9' font-size='14' fill='#1f5f8b' font-weight="700" text-anchor='middle'>Jejum ≥ 92</text><rect x='252' y='182' width='216' height='48' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='360.0' y='210.9' font-size='14' fill='#1f5f8b' font-weight="700" text-anchor='middle'>1 hora ≥ 180</text><rect x='484' y='182' width='216' height='48' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='592.0' y='210.9' font-size='14' fill='#1f5f8b' font-weight="700" text-anchor='middle'>2 horas ≥ 153</text><rect x='20' y='248' width='680' height='52' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='360.0' y='270.125' font-size='12.5' fill='#6a3d8f' font-weight="700" text-anchor='middle'>Diabetes manifesto deve ser diferenciado (ex.: 2 h ≥ 200)</text><text x='360.0' y='286.625' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>Metas usuais: jejum &lt; 95 · 1 h &lt; 140 · 2 h &lt; 120 mg/dL</text><text x='360.0' y='350.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 10 e 12; IESC, PDF p. 3.</text></svg>