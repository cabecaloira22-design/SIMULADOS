<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 520' width='720' height='520' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='520' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Amenorreia primária: algoritmo pelo desenvolvimento mamário</text><rect x='210' y='44' width='300' height='58' rx='10' fill='#ffffff' stroke='#1d1f23' stroke-width='1.6'/><text x='360.0' y='69.2' font-size='12' fill='#1d1f23' font-weight="700" text-anchor='middle'>Toda amenorreia primária</text><text x='360.0' y='85.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>β-hCG · FSH, LH, estradiol · TSH, prolactina · US pélvico</text><line x1='300' y1='102' x2='170' y2='134' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><line x1='420' y1='102' x2='550' y2='134' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='20' y='136' width='300' height='48' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='170.0' y='164.55' font-size='13' fill='#6a3d8f' font-weight="700" text-anchor='middle'>SEM mamas (sem estrogênio)</text><rect x='400' y='136' width='300' height='48' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='550.0' y='164.55' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>COM mamas (houve estrogênio)</text><line x1='110' y1='184' x2='90' y2='216' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><line x1='230' y1='184' x2='250' y2='216' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='10' y='218' width='160' height='104' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='90.0' y='250.775' font-size='11.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>FSH ALTO</text><text x='90.0' y='266.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>falência gonadal</text><text x='90.0' y='281.775' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>Turner/disgenesia</text><text x='90.0' y='297.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>→ cariótipo</text><rect x='180' y='218' width='160' height='104' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='260.0' y='250.775' font-size='11.5' fill='#8a5a00' font-weight="700" text-anchor='middle'>FSH baixo/normal</text><text x='260.0' y='266.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>atraso constitucional,</text><text x='260.0' y='281.775' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>déficit energético,</text><text x='260.0' y='297.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>doença crônica, central</text><line x1='500' y1='184' x2='470' y2='216' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><line x1='600' y1='184' x2='630' y2='216' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='380' y='218' width='160' height='104' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='460.0' y='251.35' font-size='11' fill='#6a3d8f' font-weight="700" text-anchor='middle'>ÚTERO AUSENTE</text><text x='460.0' y='266.35' font-size='11' fill='#1d1f23'  text-anchor='middle'>MRKH: 46,XX, P normal</text><text x='460.0' y='281.35' font-size='11' fill='#1d1f23'  text-anchor='middle'>× insensib. androgênica:</text><text x='460.0' y='296.35' font-size='11' fill='#1d1f23'  text-anchor='middle'>46,XY, P escasso</text><rect x='550' y='218' width='160' height='104' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='630.0' y='250.775' font-size='11.5' fill='#1d6b3a' font-weight="700" text-anchor='middle'>ÚTERO PRESENTE</text><text x='630.0' y='266.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>dor cíclica? →</text><text x='630.0' y='281.775' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>obstrução de saída</text><text x='630.0' y='297.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>(hímen/septo)</text><line x1='630' y1='322' x2='630' y2='356' stroke='#5c6370' stroke-width='1.8' marker-end='url(#ah)'/><rect x='500' y='358' width='210' height='80' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='605.0' y='386.525' font-size='11.5' fill='#1d6b3a' font-weight="700" text-anchor='middle'>Sem obstrução</text><text x='605.0' y='402.025' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>gravidez, anovulação,</text><text x='605.0' y='417.525' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>prolactina/tireoide</text><rect x='20' y='370' width='440' height='92' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='240.0' y='396.775' font-size='11.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>Quando investigar</text><text x='240.0' y='412.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>sem menarca aos 15 anos ou &gt; 3 anos após a telarca;</text><text x='240.0' y='427.775' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>sem telarca aos 13; dor cíclica/obstrução: antes dos limites.</text><text x='240.0' y='443.275' font-size='11.5' fill='#1d1f23'  text-anchor='middle'>Não iniciar anticoncepcional só para “fazer sangrar”.</text><text x='360.0' y='510.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Ped, PDF p. 44–47.</text></svg>