<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 330' width='720' height='330' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='330' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>β-hCG sérico e marcos da US transvaginal precoce</text><rect x='20' y='50' width='216' height='62' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='128.0' y='77.05' font-size='13' fill='#1d6b3a' font-weight="700" text-anchor='middle'>&lt; 5 mUI/mL</text><text x='128.0' y='94.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>usualmente negativo</text><rect x='252' y='50' width='216' height='62' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='360.0' y='77.05' font-size='13' fill='#8a5a00' font-weight="700" text-anchor='middle'>5–25 mUI/mL</text><text x='360.0' y='94.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>indeterminado: repetir</text><rect x='484' y='50' width='216' height='62' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='592.0' y='77.05' font-size='13' fill='#1f5f8b' font-weight="700" text-anchor='middle'>≥ 25 mUI/mL</text><text x='592.0' y='94.05' font-size='13' fill='#1d1f23'  text-anchor='middle'>positivo</text><line x1='60' y1='210' x2='680' y2='210' stroke='#1d1f23' stroke-width='2' /><line x1='60.0' y1='204' x2='60.0' y2='216' stroke='#1d1f23' stroke-width='2' /><text x='60.0' y='236' font-size='12' fill='#5c6370'  text-anchor='middle'>4 sem</text><line x1='215.0' y1='204' x2='215.0' y2='216' stroke='#1d1f23' stroke-width='2' /><text x='215.0' y='236' font-size='12' fill='#5c6370'  text-anchor='middle'>5 sem</text><line x1='370.0' y1='204' x2='370.0' y2='216' stroke='#1d1f23' stroke-width='2' /><text x='370.0' y='236' font-size='12' fill='#5c6370'  text-anchor='middle'>6 sem</text><line x1='525.0' y1='204' x2='525.0' y2='216' stroke='#1d1f23' stroke-width='2' /><text x='525.0' y='236' font-size='12' fill='#5c6370'  text-anchor='middle'>7 sem</text><line x1='680.0' y1='204' x2='680.0' y2='216' stroke='#1d1f23' stroke-width='2' /><text x='680.0' y='236' font-size='12' fill='#5c6370'  text-anchor='middle'>8 sem</text><circle cx='215.0' cy='210' r='6' fill='#1f5f8b'/><text x='215.0' y='160' font-size='12' fill='#1f5f8b' font-weight="700" text-anchor='middle'>saco gestacional ~5 sem</text><circle cx='292.5' cy='210' r='6' fill='#1d6b3a'/><text x='292.5' y='186' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>vesícula vitelínica ~5–6</text><circle cx='447.5' cy='210' r='6' fill='#a12a2a'/><text x='447.5' y='160' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>embrião + atividade cardíaca ~6–7</text><text x='360' y='276.0' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>US inconclusiva precoce: repetir — não declarar perda por um exame isolado.</text><text x='360' y='296.0' font-size='12.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>Dor unilateral intensa, síncope e sangramento: excluir ectópica com urgência.</text><text x='360.0' y='320.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 7 (cap. 14.1, itens 1–2).</text></svg>