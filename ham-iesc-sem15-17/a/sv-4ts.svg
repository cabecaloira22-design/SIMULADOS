<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 280' width='700' height='280' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='280' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Hemorragia pós-parto: os 4 Ts</text><rect x='20' y='54' width='156' height='84' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='98.0' y='91.9' font-size='14' fill='#a12a2a' font-weight="700" text-anchor='middle'>TÔNUS</text><text x='98.0' y='109.9' font-size='14' fill='#1d1f23'  text-anchor='middle'>atonia uterina</text><rect x='188' y='54' width='156' height='84' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='266.0' y='91.9' font-size='14' fill='#8a5a00' font-weight="700" text-anchor='middle'>TRAUMA</text><text x='266.0' y='109.9' font-size='14' fill='#1d1f23'  text-anchor='middle'>lacerações, hematoma</text><rect x='356' y='54' width='156' height='84' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='434.0' y='91.9' font-size='14' fill='#6a3d8f' font-weight="700" text-anchor='middle'>TECIDO</text><text x='434.0' y='109.9' font-size='14' fill='#1d1f23'  text-anchor='middle'>restos placentários</text><rect x='524' y='54' width='156' height='84' rx='10' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.6'/><text x='602.0' y='91.9' font-size='14' fill='#1f5f8b' font-weight="700" text-anchor='middle'>TROMBINA</text><text x='602.0' y='109.9' font-size='14' fill='#1d1f23'  text-anchor='middle'>coagulopatia</text><rect x='20' y='160' width='660' height='72' rx='10' fill='#ffffff' stroke='#1d1f23' stroke-width='1.6'/><text x='350.0' y='192.125' font-size='12.5' fill='#1d1f23' font-weight="700" text-anchor='middle'>Sangramento intenso + taquicard