50' rx='18.230249470757705' ry='26.433861732598672' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.4'/><text x='295.0478806079998' y='196.43386173259867' font-size='13' fill='#1d1f23'  text-anchor='middle'>10</text><ellipse cx='348.8665873468774' cy='150' rx='19.588457268119896' ry='28.403263038773847' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.4'/><text x='348.8665873468774' y='198.40326303877384' font-size='13' fill='#1d1f23'  text-anchor='middle'>12</text><ellipse cx='405.8834696729307' cy='150' rx='21.428425057933378' ry='31.071216334003395' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.4'/><text x='405.8834696729307' y='201.0712163340034' font-size='13' fill='#1d1f23'  text-anchor='middle'>15</text><ellipse cx='467.43650652836214' cy='150' rx='24.12461179749811' ry='34.98068710637226' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.4'/><text x='467.43650652836214' y='204.98068710637227' font-size='13' fill='#1d1f23'  text-anchor='middle'>20</text><ellipse cx='534.0611183258602' cy='150' rx='26.5' ry='38.425' fill='#e8f0f6' stroke='#1f5f8b' stroke-width='1.4'/><text x='534.0611183258602' y='208.425' font-size='13' fill='#1d1f23'  text-anchor='middle'>25</text><text x='350' y='262' font-size='12' fill='#a12a2a'  text-anchor='middle'>≥ 4 mL = G2 (início puberal masculino). Investigar se &lt; 4 mL aos 14 anos; puberdade precoce se início antes dos 9.</text><text x='350.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Ped, PDF p. 44.</text></svg>