<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' width='720' height='300' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='720' height='300' fill='#fff'/><text x='360.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>Alterações de humor no puerpério</text><rect x='16' y='52' width='220' height='150' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='126.0' y='107.2' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>BABY BLUES</text><text x='126.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>labilidade nos primeiros dias</text><text x='126.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>autolimitado em até 2 semanas</text><text x='126.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>acolher e orientar apoio</text><rect x='248' y='52' width='220' height='150' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='358.0' y='107.2' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>DEPRESSÃO PÓS-PARTO</text><text x='358.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>sintomas persistentes, anedonia,</text><text x='358.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>culpa, prejuízo funcional</text><text x='358.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>rastrear (EPDS), avaliar risco, tratar</text><rect x='480' y='52' width='220' height='150' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='590.0' y='107.2' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>PSICOSE PUERPERAL</text><text x='590.0' y='123.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>delírios, alucinações, confusão</text><text x='590.0' y='139.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>risco à mãe/bebê</text><text x='590.0' y='155.2' font-size='12' fill='#1d1f23'  text-anchor='middle'>EMERGÊNCIA psiquiátrica</text><text x='360' y='238' font-size='13' fill='#1d1f23' font-weight="700" text-anchor='middle'>Perguntar sobre humor e violência em ambiente PRIVADO.</text><text x='360.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — IESC, PDF p. 6–7.</text></svg>