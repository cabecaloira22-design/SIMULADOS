<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 300' width='700' height='300' font-family='-apple-system,Segoe UI,Roboto,Arial,sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5c6370'/></marker></defs><rect x='0' y='0' width='700' height='300' fill='#fff'/><text x='350.0' y='26' font-size='17' fill='#1d1f23' font-weight="700" text-anchor='middle'>BI-RADS: risco de malignidade e conduta</text><rect x='16' y='60' width='68' height='60' rx='10' fill='#ffffff' stroke='#1d1f23' stroke-width='1.6'/><text x='50.0' y='97.0' font-size='20' fill='#1d1f23' font-weight="700" text-anchor='middle'>0</text><text x='50.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>incompleto</text><text x='50.0' y='172' font-size='12' fill='#1d1f23' font-weight="700" text-anchor='middle'>completar</text><rect x='90' y='60' width='68' height='60' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='124.0' y='97.0' font-size='20' fill='#1d6b3a' font-weight="700" text-anchor='middle'>1</text><text x='124.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>negativo</text><text x='124.0' y='172' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>rotina</text><rect x='164' y='60' width='68' height='60' rx='10' fill='#e6f3ea' stroke='#1d6b3a' stroke-width='1.6'/><text x='198.0' y='97.0' font-size='20' fill='#1d6b3a' font-weight="700" text-anchor='middle'>2</text><text x='198.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>benigno</text><text x='198.0' y='172' font-size='12' fill='#1d6b3a' font-weight="700" text-anchor='middle'>rotina</text><rect x='238' y='60' width='68' height='60' rx='10' fill='#fbf1dc' stroke='#8a5a00' stroke-width='1.6'/><text x='272.0' y='97.0' font-size='20' fill='#8a5a00' font-weight="700" text-anchor='middle'>3</text><text x='272.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>≤ 2%</text><text x='272.0' y='172' font-size='12' fill='#8a5a00' font-weight="700" text-anchor='middle'>controle ~6 m</text><rect x='312' y='60' width='68' height='60' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='346.0' y='97.0' font-size='20' fill='#a12a2a' font-weight="700" text-anchor='middle'>4A</text><text x='346.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>&gt;2–10%</text><text x='346.0' y='172' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>biópsia</text><rect x='386' y='60' width='68' height='60' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='420.0' y='97.0' font-size='20' fill='#a12a2a' font-weight="700" text-anchor='middle'>4B</text><text x='420.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>&gt;10–50%</text><text x='420.0' y='172' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>biópsia</text><rect x='460' y='60' width='68' height='60' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='494.0' y='97.0' font-size='20' fill='#a12a2a' font-weight="700" text-anchor='middle'>4C</text><text x='494.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>&gt;50–&lt;95%</text><text x='494.0' y='172' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>biópsia</text><rect x='534' y='60' width='68' height='60' rx='10' fill='#f8e7e7' stroke='#a12a2a' stroke-width='1.6'/><text x='568.0' y='97.0' font-size='20' fill='#a12a2a' font-weight="700" text-anchor='middle'>5</text><text x='568.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>≥ 95%</text><text x='568.0' y='172' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>biópsia +</text><text x='568.0' y='187' font-size='12' fill='#a12a2a' font-weight="700" text-anchor='middle'>rápido</text><rect x='608' y='60' width='68' height='60' rx='10' fill='#f1e8f7' stroke='#6a3d8f' stroke-width='1.6'/><text x='642.0' y='97.0' font-size='20' fill='#6a3d8f' font-weight="700" text-anchor='middle'>6</text><text x='642.0' y='146' font-size='12' fill='#1d1f23'  text-anchor='middle'>confirmado</text><text x='642.0' y='172' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>planejar</text><text x='642.0' y='187' font-size='12' fill='#6a3d8f' font-weight="700" text-anchor='middle'>tratamento</text><text x='350' y='236.0' font-size='12.5' fill='#1d1f23'  text-anchor='middle'>BI-RADS classifica IMAGEM, não estadia tumor. Imagem negativa com suspeita clínica alta</text><text x='350' y='254.0' font-size='12.5' fill='#a12a2a' font-weight="700" text-anchor='middle'>não encerra a investigação: concordância clínica + imagem + histologia.</text><text x='350.0' y='290.0' font-size='10.5' fill='#5c6370'  text-anchor='middle'>Esquema original — HAM Adulto, PDF p. 24 (cap. 19.6).</text></svg>