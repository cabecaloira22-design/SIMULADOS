m blastômeros (comum em amostra fresca). Métodos quantitativos, como o Kato-Katz, podem estimar a intensidade da infecção em contextos específicos.", "rac": "Compare cada característica do laudo com a tabela do material: formato, casca e conteúdo coincidem com o ovo de ancilostomídeo. Lembre que o EPF não identifica a espécie.", "pista": "'Casca fina, hialina' + 'blastômeros'.", "mud": "Se a amostra ficasse muito tempo antes do exame, os ovos poderiam embrionar e até eclodir, o que pode confundir com larvas; por isso a amostra fresca é relevante.", "cmp": "EPF qualitativo: diz se há ovos. Kato-Katz: estima a carga de ovos, útil para intensidade da infecção.", "arm": "Afirmar a espécie (Ancylostoma ou Necator) a partir do ovo no EPF convencional.", "regra": "Ancilostomíase no EPF = OVO oval, casca fina hialina, blastômeros.", "cf": "Em um levantamento escolar que precise estimar intensidade da infecção, um método quantitativo como Kato-Katz é mais útil que o EPF apenas qualitativo.", "fonte": "F1, Aula 4, p. 10 (item 4, tabela de achados) e p. 11 (item 5, Kato-Katz)"}, {"n": 7, "sub": "Ovo x larva: pegadinha com estrongiloidíase", "comp": "Diferenciar o achado do EPF entre ancilostomíase e estrongiloidíase", "tags": [], "rel": [], "enun": "Um colega comenta: 'O EPF desse paciente mostrou larvas, então é ancilostomíase, porque o ancilostomídeo infecta pela pele'. Qual é a correção mais adequada?", "ops": [["Na ancilostomíase procura-se o ovo; larva no EPF sugere tipicamente estrongiloidíase.", "Correta: é a pegadinha destacada no material."], ["Está correto, pois os ancilostomídeos são eliminados como larvas filarioides nas fezes.", "Errada: a L3 se forma no solo; nas fezes, a forma diagnóstica do ancilostomídeo é o ovo."], ["Está correto, e a larva permite distinguir Ancylostoma de Necator.", "Errada: o EPF não distingue as duas espécies, e larva não é o achado típico."], ["Larvas nas fezes indicam ascaridíase, pois o Ascaris tem fase pulmonar.", "Errada: fase pulmonar não define o achado do EPF; ascaridíase é diagnosticada por ovos."]], "conc": "Ancilostomíase: no EPF, procura-se o OVO. Estrongiloidíase: tipicamente procura-se a LARVA. As duas parasitoses têm penetração cutânea e passagem pulmonar, o que leva à confusão.", "rac": "1) Achado: larva. 2) Associação típica: Strongyloides. 3) Via de infecção cutânea é comum às duas e não serve para diferenciar.", "pista": "A forma encontrada (larva) e não a via de entrada.", "mud": "Se o laudo descrevesse ovos de casca fina e blastômeros, a interpretação seria ancilostomíase.", "cmp": "Ancilostomíase: ovo nas fezes, L3 no solo. Estrongiloidíase: larva nas fezes.", "arm": "Usar a via de entrada (pele) para identificar o parasito no laudo.", "regra": "Ancilo = OVO. Estrongiloides = LARVA.", "cf": "Na revisão de véspera do material, os dois pontos aparecem juntos: o EPF procura ovo e não diferencia Ancylostoma de Necator.", "fonte": "F1, Aula 4, p. 10 (pegadinha) e p. 20 (revisão, item 11)"}, {"n": 8, "sub": "Tratamento", "comp": "Planejar tratamento antiparasitário e da anemia", "tags": [], "rel": [], "enun": "Paciente com ancilostomíase confirmada no EPF e anemia ferropriva documentada por hemograma e ferritina. Qual plano terapêutico está de acordo com o material?", "ops": [["Benzimidazólico (albendazol ou mebendazol) conforme protocolo, associado à correção da deficiência de ferro.", "Correta: o material indica antiparasitário benzimidazólico e reposição de ferro quando houver deficiência."], ["Apenas sulfato ferroso, pois a anemia é a principal manifestação.", "Errada: sem eliminar o verme, a perda de sangue continua."], ["Apenas albendazol, pois a anemia se corrige espontaneamente após a cura.", "Errada: o material orienta corrigir a deficiência de ferro existente."], ["Transfusão de concentrado de hemácias e corticoide sistêmico para reduzir a eosinofilia e a inflamação.", "Errada: não há indicação descrita de corticoide; a conduta é antiparasitário e ferro."]], "conc": "O tratamento usa benzimidazólicos, como albendazol ou mebendazol, conforme protocolo, e corrige a deficiência de ferro quando existente. O hemograma pode mostrar eosinofilia e anemia microcítica; ferritina e estudos do ferro documentam a deficiência.", "rac": "Dois problemas exigem duas ações: o parasito (antiparasitário) e a deficiência já instalada (ferro).", "pista": "'Anemia ferropriva documentada'.", "mud": "Em paciente com ancilostomíase sem anemia e com ferritina normal, bastaria o antiparasitário, com orientações de prevenção.", "cmp": "Antiparasitário elimina a causa; ferro repõe o estoque perdido.", "arm": "Tratar apenas um dos dois problemas.", "regra": "Ancilostomíase com anemia: benzimidazólico + ferro.", "cf": "Sem medidas de prevenção (calçados, saneamento), o paciente que volta a andar descalço no mesmo solo pode se reinfectar.", "fonte": "F1, Aula 4, p. 11 (itens 5 e 6, exames e tratamento)"}]}, {"id": "A05", "titulo": "Diarreia aguda e crônica: manifestações, prevenção e reidratação oral", "arq": "F1", "pags": "12–13 e 23", "bloco": 2, "q": [{"n": 1, "sub": "Definição e classificação temporal", "comp": "Classificar a diarreia pela duração", "tags": [], "rel": [], "enun": "Homem de 30 anos tem fezes amolecidas, 4 a 5 vezes ao dia, há 20 dias, diferente do seu padrão habitual. Pelas referências práticas do material, como classificar a diarreia?", "ops": [["Persistente, pois dura 14 dias ou mais, sem ainda ultrapassar cerca de 4 semanas.", "Correta: aguda < 14 dias; persistente ≥ 14 dias; crônica geralmente > 4 semanas."], ["Aguda, pois dura menos de 30 dias.", "Errada: aguda é menos de 14 dias."], ["Crônica, pois dura mais de 14 dias.", "Errada: crônica é geralmente mais de 4 semanas; 20 dias ainda não chegou lá."], ["Não é diarreia, pois são menos de 6 evacuações por dia.", "Errada: frequentemente se define diarreia como 3 ou mais evacuações amolecidas/líquidas em 24 h."]], "conc": "Diarreia é aumento da frequência e/ou redução da consistência das fezes em relação ao padrão habitual, frequentemente definida como 3 ou mais evacuações amolecidas ou líquidas em 24 h. Pela duração: aguda < 14 dias; persistente ≥ 14 dias; crônica geralmente > 4 semanas.", "rac": "1) É diarreia? Sim: 4 a 5 evacuações amolecidas e mudança do padrão. 2) Duração: 20 dias. 3) Passou de 14 dias, mas não de 4 semanas (28 dias). 4) Persistente.", "pista": "20 dias está entre 14 e 28 dias.", "mud": "Com 10 dias, seria aguda; com 6 semanas, crônica.", "cmp": "Aguda: geralmente infecciosa e autolimitada. Persistente e crônica: pedem investigação além do básico.", "arm": "Contar 'mais de 2 semanas' como crônica, ignorando a categoria persistente.", "regra": "< 14 dias aguda; ≥ 14 dias persistente; > 4 semanas crônica.", "cf": "Uma diarreia persistente/crônica é um dos critérios do material para investigar além do básico.", "fonte": "F1, Aula 5, p. 12 (item 1, definição e duração)"}, {"n": 2, "sub": "Padrões clínicos: esteatorreia", "comp": "Reconhecer fezes gordurosas e seu significado", "tags": [], "rel": [], "enun": "Paciente de 52 anos relata fezes volumosas, brilhantes, oleosas, muito fétidas, que boiam e são difíceis de limpar do vaso, há 2 meses, com emagrecimento. Qual padrão de diarreia e qual mecanismo geral são sugeridos?", "ops": [["Esteatorreia, sugerindo má digestão ou má absorção.", "Correta: fezes volumosas, oleosas, brilhantes, fétidas e difíceis de limpar caracterizam esteatorreia."], ["Diarreia inflamatória, sugerindo colite infecciosa.", "Errada: o padrão inflamatório tem sangue e/ou muco, febre, dor e tenesmo."], ["Diarreia aquosa secretória, sugerindo toxina bacteriana.", "Errada: a aquosa é líquida, sem gordura visível."], ["Diarreia disentérica, sugerindo parasitose invasiva.", "Errada: disentérica é sinônimo de inflamatória, com sangue e muco."]], "conc": "Padrões úteis: aquosa (fezes líquidas, geralmente sem sangue; osmótica ou secretória); inflamatória/disentérica (sangue e/ou muco, febre, dor, urgência/tenesmo); gordurosa/esteatorreia (volumosa, oleosa, brilhante, fétida, difícil de limpar; sugere má digestão/má absorção).", "rac": "Cada característica descrita (volume, brilho, óleo, odor, dificuldade de limpar) pertence à esteatorreia. Duração de 2 meses com emagrecimento também indica investigação.", "pista": "'Difíceis de limpar do vaso'.", "mud": "Se houvesse sangue e muco com febre e tenesmo, o padrão seria inflamatório/disentérico.", "cmp": "Aquosa: líquida. Inflamatória: sangue/muco. Esteatorreia: gordura.", "arm": "Chamar qualquer fezes fétidas de esteatorreia sem as demais características.", "regra": "Volumosa, oleosa, brilhante, fétida e difícil de limpar = esteatorreia = má digestão/má absorção.", "cf": "Diarreia crônica com esteatorreia é indicação clara de investigar além do básico.", "fonte": "F1, Aula 5, p. 12 (item 2, padrões clínicos)"}, {"n": 3, "sub": "Padrão inflamatório e quando investigar", "comp": "Identificar diarreia inflamatória e indicação de investigação", "tags": [], "rel": [], "enun": "Mulher de 28 anos com diarreia há 3 dias, com sangue e muco nas fezes, febre de 38,8 °C, cólicas e sensação de evacuação incompleta (tenesmo). Está hidratada. Como descrever o padrão e o que o material orienta?", "ops": [["Padrão inflamatório/disentérico; sangue nas fezes e febre importante justificam investigar além do básico.", "Correta: sangue/muco, febre e tenesmo definem o padrão, e o material lista esses dados como motivo para investigar mais."], ["Padrão aquoso; basta Plano A, sem necessidade de investigação.", "Errada: há sangue e muco, que não pertencem ao padrão aquoso."], ["Esteatorreia; investigar má absorção.", "Errada: não há fezes oleosas e volumosas."], ["Padrão inflamatório; como está hidratada, nenhuma investigação adicional cabe neste momento do atendimento.", "Errada: estar hidratada define o plano de hidratação, mas sangue e febre importante indicam investigação."]], "conc": "Diarreia inflamatória/disentérica: sangue e/ou muco, febre, dor, urgência e tenesmo. Quando investigar além do básico: sangue nas fezes ou febre importante; quadro grave, imunossupressão ou idoso frágil; diarreia persistente/crônica; uso recente de antibiótico ou internação (pensar em C. difficile); contexto epidemiológico, surto ou suspeita de parasitose.", "rac": "1) Hidratação: preservada (Plano A). 2) Padrão: sangue, muco, febre, tenesmo, ou seja, inflamatório. 3) Critério de investigação presente: sangue e febre importante.", "pista": "Sangue e muco com tenesmo.", "mud": "Se as fezes fossem apenas líquidas, sem sangue e sem febre, em paciente hidratada, o Plano A sem investigação adicional seria suficiente.", "cmp": "Hidratação e investigação etiológica são eixos diferentes: um não substitui o outro.", "arm": "Achar que paciente hidratado não precisa de investigação mesmo com sangue nas fezes.", "regra": "Sangue, febre importante, gravidade, imunossupressão, cronicidade, antibiótico recente ou surto → investigar mais.", "cf": "Um idoso frágil com diarreia aquosa também entra nos critérios de investigar além do básico, mesmo sem sangue.", "fonte": "F1, Aula 5, p. 12 (item 2) e p. 13 (item 7, quando investigar)"}, {"n": 4, "sub": "Primeiro passo: estado de hidratação", "comp": "Priorizar a avaliação de hidratação", "tags": ["osce"], "rel": [], "enun": "Na estação de OSCE, o paciente-ator relata diarreia aquosa há 1 dia. O examinador pergunta: 'Qual é o seu primeiro passo após a anamnese inicial?'. Qual resposta está de acordo com o material?", "ops": [["Classificar o estado de hidratação e a repercussão clínica do quadro.", "Correta: antes de buscar o agente, classifique a hidratação."], ["Solicitar coprocultura e exame parasitológico de fezes para definir o agente etiológico.", "Errada: a busca etiológica não é o primeiro passo e nem sempre é necessária."], ["Prescrever antibiótico empírico para encurtar a diarreia.", "Errada: o material não indica antibiótico como passo inicial; a prioridade é a hidratação."], ["Prescrever antidiarreico e orientar dieta sem resíduos.", "Errada: não é o primeiro passo; o material orienta manter a alimentação habitual no Plano A."]], "conc": "Antes de buscar o agente etiológico, classifique a repercussão clínica e o estado de hidratação: estado geral (alerta, irritado ou letárgico/hipotônico), sede (normal, bebe avidamente, bebe mal), mucosas e olhos, pulso e perfusão, diurese e hemodinâmica (PA e sinais de choque, sobretudo em adultos e idosos).", "rac": "A pergunta é sobre prioridade. Na diarreia, a ameaça imediata é a desidratação, por isso a classificação da hidratação vem antes de exames e de qualquer tratamento específico.", "pista": "'Primeiro passo'.", "mud": "Mesmo com sangue nas fezes, a hidratação continua sendo avaliada primeiro; a investigação etiológica vem em paralelo ou depois.", "cmp": "Avaliar hidratação define o plano (A, B ou C). Investigar agente define tratamento específico, quando indicado.", "arm": "Começar pela coprocultura e deixar de examinar perfusão, diurese e PA.", "regra": "Diarreia → primeiro classifique a hidratação.", "cf": "No idoso, hipotensão postural e taquicardia podem ser os sinais mais confiáveis de desidratação, mais do que a sede.", "fonte": "F1, Aula 5, p. 12 (item 3, primeiro passo) e p. 23 (figura 5)"}, {"n": 5, "sub": "Plano A", "comp": "Orientar o paciente sem desidratação", "tags": ["osce"], "rel": [], "enun": "Paciente com diarreia aguda aquosa está alerta, com sede normal, mucosas úmidas, pulso cheio e diurese preservada. Qual orientação corresponde ao plano adequado?", "ops": [["Aumentar líquidos, usar SRO após as evacuações, manter a alimentação habitual e retornar se houver sinais de piora.", "Correta: é o Plano A, sem desidratação."], ["Permanecer na unidade recebendo SRO em pequenos volumes até desaparecerem os sinais de desidratação.", "Errada: é o Plano B, para desidratação sem gravidade."], ["Iniciar reidratação endovenosa e transferir para o hospital.", "Errada: é o Plano C, para desidratação grave."], ["Suspender a alimentação por 24 horas para repouso intestinal.", "Errada: o material orienta manter a alimentação habitual."]], "conc": "Plano A (sem desidratação): aumentar ingestão de água e outros líquidos; usar SRO especialmente após as evacuações; manter alimentação habitual; orientar preparo correto do SRO; orientar retorno se piora, sangue nas fezes, vômitos repetidos, muita sede, recusa, redução de diurese ou ausência de melhora.", "rac": "Todos os parâmetros de hidratação estão normais: sem desidratação. Plano A, com orientações de retorno.", "pista": "Alerta, sede normal, mucosas úmidas, pulso cheio, diurese preservada.", "mud": "Se ele bebesse avidamente, com olhos fundos e mucosas secas, mas sem sinais de gravidade, o plano seria B.", "cmp": "Plano A: em casa. Plano B: SRO na unidade. Plano C: EV imediata.", "arm": "Orientar jejum, que piora a recuperação e não tem respaldo no material.", "regra": "Hidratado → Plano A: líquidos, SRO após evacuações, comida habitual e sinais de retorno.", "cf": "Na estação de OSCE, verbalizar os sinais de retorno (sangue, vômitos repetidos, muita sede, menos urina, sem melhora) costuma pontuar.", "fonte": "F1, Aula 5, p. 12 (item 4, Plano A)"}, {"n": 6, "sub": "Plano B", "comp": "Conduzir desidratação sem gravidade", "tags": ["osce"], "rel": [], "enun": "Mulher de 35 anos com diarreia aquosa há 2 dias está irritada, bebe água avidamente, tem olhos fundos e mucosas secas, mas está com PA normal, sem alteração de consciência e consegue beber. Qual é a conduta?", "ops": [["Plano B: SRO em pequenos volumes na unidade, com reavaliação até sumirem os sinais.", "Correta: desidratação sem gravidade é tratada com SRO na unidade e reavaliação repetida."], ["Plano A: liberar para casa com SRO e orientação de retorno em 48 horas se não melhorar.", "Errada: há sinais de desidratação; o Plano A é para quem não tem desidratação."], ["Plano C: reidratação endovenosa imediata e transferência para o hospital.", "Errada: não há sinais de gravidade (choque, consciência alterada, incapacidade de beber)."], ["Prescrever SRO em volume fixo calculado e alta após a primeira dose.", "Errada: o volume depende da sede e da resposta clínica, com reavaliação até desaparecerem os sinais."]], "conc": "Plano B (com desidratação, sem gravidade): o paciente permanece na unidade recebendo SRO em pequenos volumes e frequência progressiva, até desaparecerem os sinais de desidratação. A quantidade depende da sede e da resposta clínica. Reavaliar repetidamente: se os sinais desaparecerem, passa ao Plano A; se não melhorar ou piorar, reclassificar.", "rac": "1) Há desidratação: irritada, bebe avidamente, olhos fundos, mucosas secas. 2) Há gravidade? Não: PA normal, consciente, bebe. 3) Plano B.", "pista": "'Bebe avidamente' + ausência de sinais de choque.", "mud": "Se, durante o Plano B, ela passasse a ter vômitos incoercíveis e hipotensão, seria reclassificada para Plano C.", "cmp": "Plano B usa a via oral, mas com supervisão na unidade; o Plano A é domiciliar.", "arm": "Mandar para casa um paciente desidratado porque 'consegue beber'.", "regra": "Desidratado sem gravidade → SRO na unidade, reavaliar, depois Plano A.", "cf": "O Plano B funciona como teste: a resposta à SRO observada na unidade decide se o paciente pode ir para casa.", "fonte": "F1, Aula 5, p. 13 (item 5, Plano B) e p. 23 (figura 5)"}, {"n": 7, "sub": "Plano C e sinais de gravidade", "comp": "Reconhecer desidratação grave e iniciar reidratação EV", "tags": ["osce"], "rel": ["A06"], "enun": "Idoso de 81 anos com diarreia aquosa intensa há 2 dias chega sonolento, com pulso fino e rápido, PA 78/46 mmHg, extremidades frias, sem conseguir beber e sem urinar há 12 horas. Qual é a conduta?", "ops": [["Plano C: reidratação endovenosa imediata, com manejo hospitalar.", "Correta: hipotensão, alteração de consciência, pulso fraco, incapacidade de beber e oligúria indicam desidratação grave."], ["Plano B: SRO em pequenos volumes na unidade com reavaliação frequente.", "Errada: ele não consegue beber e tem sinais de choque."], ["Coletar coprocultura e aguardar o resultado antes de hidratar.", "Errada: a reidratação é urgente; a investigação não pode atrasá-la."], ["Plano A com antidiarreico oral para reduzir as perdas fecais.", "Errada: ignora a desidratação grave e o choque."]], "conc": "Plano C (desidratação grave): reidratação endovenosa imediata e transferência/manejo hospitalar. Assim que o paciente puder beber, associar SRO em pequenas quantidades e suspender a EV quando estiver hidratado, tolerando via oral e sem vômitos relevantes. Sinais de gravidade: hipotensão, alteração de consciência, pulso muito fraco, incapacidade de beber, oligúria/anúria e sinais de choque.", "rac": "Liste os sinais: sonolência (consciência), pulso fino, hipotensão, extremidades frias (choque), não bebe, sem diurese. Vários sinais de gravidade: Plano C.", "pista": "PA 78/46 mmHg + incapacidade de beber.", "mud": "Se, após a expansão EV, ele despertasse, aceitasse líquidos e voltasse a urinar, a SRO seria associada e a EV retirada progressivamente.", "cmp": "Na hemorragia digestiva, o raciocínio inicial é parecido: estabilidade hemodinâmica antes de qualquer investigação.", "arm": "Tentar SRO por via oral em paciente sonolento e chocado.", "regra": "Desidratação grave → EV imediata, depois SRO quando puder beber.", "cf": "Um idoso frágil, mesmo com quadro menos intenso, entra nos critérios de investigar além do básico e de reavaliar com cautela.", "fonte": "F1, Aula 5, p. 13 (item 6, Plano C e quadro de gravidade)"}, {"n": 8, "sub": "Investigação dirigida e prevenção", "comp": "Associar contexto clínico à hipótese etiológica e orientar prevenção", "tags": [], "rel": [], "enun": "Mulher de 67 anos recebeu alta há 10 dias após internação por pneumonia tratada com antibiótico. Agora tem diarreia aquosa, 6 vezes ao dia, com cólicas. Está hidratada. Que hipótese o material manda considerar?", "ops": [["Infecção por Clostridioides (C.) difficile, pelo uso recente de antibiótico e internação.", "Correta: uso recente de antibiótico ou internação é contexto que manda pensar em C. difficile e investigar além do básico."], ["Ancilostomíase, pela faixa etária e pelas cólicas.", "Errada: não há exposição compatível; ancilostomíase cursa mais com anemia ferropriva."], ["Esteatorreia por má absorção.", "Errada: o padrão descrito é aquoso, não gorduroso."], ["Diarreia viral simples, que dispensa qualquer investigação.", "Errada: o contexto de antibiótico e internação é critério explícito para investigar mais."]], "conc": "Contextos que indicam investigar além do básico incluem uso recente de antibiótico ou internação (pensar em C. difficile). A prevenção geral das diarreias inclui lavagem de mãos, água segura e saneamento, higiene e cozimento adequado dos alimentos, armazenamento adequado e evitar alimentos crus/malcozidos de procedência duvidosa.", "rac": "1) Hidratada: Plano A para hidratação. 2) Contexto: antibiótico + internação recentes. 3) Hipótese: C. difficile, com investigação dirigida.", "pista": "'Alta há 10 dias' e 'tratada com antibiótico'.", "mud": "Sem antibiótico nem internação, em paciente jovem e hidratada, uma diarreia aquosa aguda seria conduzida com Plano A e orientações.", "cmp": "Prevenção comunitária (mãos, água, saneamento, alimentos) atua sobre diarreias infecciosas em geral; o uso criterioso de antibiótico reduz o risco de C. difficile.", "arm": "Esquecer de perguntar sobre antibióticos e internação recentes na anamnese da diarreia.", "regra": "Antibiótico recente ou internação + diarreia → pensar em C. difficile.", "cf": "Num surto de diarreia em uma creche ou restaurante, o contexto epidemiológico também justifica investigação e medidas de prevenção coletiva.", "fonte": "F1, Aula 5, p. 13 (itens 7 e 8, quando investigar e prevenção)"}]}, {"id": "A06", "titulo": "Hemorragias digestivas: manifestações e diferenças entre HDA e HDB", "arq": "F1", "pags": "14–15 e 23–24", "bloco": 2, "q": [{"n": 1, "sub": "Localização: ligamento de Treitz", "comp": "Definir o limite anatômico entre HDA e HDB", "tags": [], "rel": [], "enun": "Qual estrutura anatômica é classicamente usada como limite entre hemorragia digestiva alta e baixa?", "ops": [["Ligamento de Treitz: a HDA ocorre proximalmente a ele (esôfago, estômago e duodeno).", "Correta: é a definição clássica do material."], ["Piloro: a HDA ocorre apenas no esôfago e no estômago.", "Errada: o duodeno faz parte da HDA."], ["Válvula ileocecal: tudo antes dela é HDA.", "Errada: o limite clássico é o ligamento de Treitz, e o intestino delgado distal não é HDA."], ["Junção retossigmoide: tudo acima dela é HDA.", "Errada: o cólon e o reto são as principais origens da HDB."]], "conc": "HDA: origem no esôfago, estômago e duodeno, classicamente proximal ao ligamento de Treitz. HDB: principalmente cólon e reto. O sangramento do intestino delgado pode ser abordado separadamente.", "rac": "Lembre que o duodeno pertence à HDA; o ligamento de Treitz marca a transição duodenojejunal.", "pista": "'Classicamente proximal ao ligamento de Treitz'.", "mud": "Se a fonte estiver no jejuno ou íleo, não é HDA clássica; o material menciona que o delgado pode ser abordado separadamente.", "cmp": "HDA: esôfago, estômago, duodeno. HDB: principalmente cólon e reto.", "arm": "Excluir o duodeno da HDA e esquecer que a úlcera duodenal é causa clássica de HDA.", "regra": "Acima do Treitz = HDA; cólon e reto = HDB.", "cf": "Uma úlcera na segunda porção do duodeno que sangra é HDA, investigada por endoscopia digestiva alta.", "fonte": "F1, Aula 6, p. 14 (item 1, localização)"}, {"n": 2, "sub": "Vômito em borra de café e hematêmese", "comp": "Interpretar a aparência do sangue vomitado", "tags": [], "rel": ["A03"], "enun": "Homem de 55 anos, em uso crônico de anti-inflamatório para artrose, apresenta vômito de material escuro e granular, semelhante a 'borra de café'. Qual é a interpretação adequada?", "ops": [["Sangue que teve contato com ácido gástrico, sugerindo HDA.", "Correta: a borra de café resulta do contato do sangue com o ácido e indica HDA."], ["Sangue fresco de origem colônica refluído ao estômago, sugerindo HDB.", "Errada: sangue colônico não é vomitado; a borra de café é sinal de HDA."], ["Sangue deglutido de origem nasal, que exclui sangramento digestivo.", "Errada: a hipótese de origem nasal pode existir em situações específicas, mas não 'exclui' HDA; no contexto de AINE, a HDA é o foco."], ["Melena, que indica sangramento de intestino delgado distal.", "Errada: melena é fezes negras, não vômito."]], "conc": "Hematêmese é vômito de sangue vermelho. Vômito em 'borra de café' é material escuro/granular resultante do contato do sangue com o ácido. Ambos sugerem HDA. Úlcera péptica (inclusive associada a AINEs) é causa importante de HDA.", "rac": "1) Vômito com sangue alterado pelo ácido. 2) Origem acima do Treitz. 3) Fator de risco: AINE, que favorece úlcera e erosões. 4) Interpretação: HDA.", "pista": "'Escuro e granular' = borra de café.", "mud": "Se o vômito fosse de sangue vermelho vivo, seria hematêmese, ainda HDA, sugerindo sangramento mais ativo.", "cmp": "Hematêmese: sangue vermelho vomitado. Borra de café: sangue alterado pelo ácido. Melena: fezes negras.", "arm": "Desconsiderar o vômito escuro como 'comida' e não pesquisar estabilidade hemodinâmica.", "regra": "Vômito com sangue (vivo ou em borra de café) = HDA.", "cf": "Um paciente com borra de café e taquicardia precisa primeiro de estabilização e depois de EDA.", "fonte": "F1, Aula 6, p. 14 (item 2, aparência do sangue; item 3, causas)"}, {"n": 3, "sub": "Melena", "comp": "Interpretar melena", "tags": [], "rel": [], "enun": "Paciente de 62 anos relata fezes negras, brilhantes, pegajosas e muito fétidas há 2 dias, com tontura ao levantar. Qual é a interpretação mais provável da origem do sangramento?", "ops": [["Geralmente HDA, pois melena resulta de sangue digerido de origem proximal.", "Correta: melena sugere geralmente HDA."], ["HDB de origem retal, pois as fezes estão alteradas.", "Errada: sangramento retal costuma se manifestar como sangue vivo (hematoquezia)."], ["Sangramento oculto, pois não há sangue vermelho visível nas fezes nem no vômito.", "Errada: sangramento oculto não é visível; melena é visível e característica."], ["Origem exclusivamente colônica, por diverticulose.", "Errada: diverticulose causa tipicamente hematoquezia, não melena."]], "conc": "Melena são fezes negras, brilhantes/pegajosas e muito fétidas, geralmente de origem alta (HDA). Hematoquezia é sangue vermelho vivo ou vinho pelo reto, geralmente HDB. Sangramento oculto não é visível e aparece em teste ou como anemia, podendo vir de qualquer segmento.", "rac": "1) Descrição clássica de melena. 2) Associação usual: HDA. 3) Tontura ao levantar sugere repercussão hemodinâmica (hipotensão postural), que deve ser avaliada primeiro.", "pista": "'Negras, brilhantes, pegajosas e muito fétidas'.", "mud": "Se as fezes fossem com sangue vermelho vivo, a hipótese mais provável seria HDB, salvo instabilidade importante sugerindo HDA maciça.", "cmp": "Melena: geralmente HDA. Hematoquezia: geralmente HDB. Oculto: qualquer segmento.", "arm": "Ignorar a tontura postural, que indica perda volêmica relevante.", "regra": "Melena geralmente = HDA.", "cf": "Um paciente com anemia ferropriva sem sangramento visível pode ter sangramento oculto de qualquer segmento do tubo digestivo.", "fonte": "F1, Aula 6, p. 14 (item 2, tabela) e p. 14–15 (item 4, repercussão sistêmica)"}, {"n": 4, "sub": "Pegadinha: hematoquezia na HDA maciça", "comp": "Reconhecer que hematoquezia não exclui HDA", "tags": [], "rel": ["A07"], "enun": "Homem de 50 anos, etilista, com cirrose conhecida, chega com grande volume de sangue vermelho vivo pelo reto, FC 128 bpm e PA 82/50 mmHg. Um colega afirma que, por ser hematoquezia, a origem é certamente colônica. Qual é a resposta correta?", "ops": [["Não: hematoquezia não exclui HDA, pois sangramento alto maciço pode sair vivo pelo reto.", "Correta: é a pegadinha destacada no material; neste contexto, varizes esofagogástricas são possibilidade."], ["Está correto: hematoquezia indica sempre HDB, e o exame inicial deve ser a colonoscopia de urgência.", "Errada: hematoquezia geralmente indica HDB, mas não sempre; HDA maciça também pode causá-la."], ["Está correto, pois pacientes cirróticos sangram mais pelo cólon.", "Errada: varizes esofagogástricas, causa de HDA, são relevantes nesse contexto."], ["Sangue vivo indica sangramento oculto, que pode vir de qualquer segmento.", "Errada: sangramento oculto não é visível."]], "conc": "Hematoquezia (sangue vermelho vivo ou vinho pelo reto) geralmente indica HDB, mas uma HDA maciça e rápida pode atravessar o trato gastrointestinal e aparecer como sangue vivo pelo reto. Por isso, diante de sangramento e instabilidade, fale primeiro de estabilidade hemodinâmica e não descarte a origem alta.", "rac": "1) Volume grande + taquicardia + hipotensão: sangramento rápido e grave. 2) Contexto: cirrose (risco de varizes, causa de HDA). 3) Conclusão: a origem alta não pode ser excluída pela cor do sangue.", "pista": "Instabilidade hemodinâmica com hematoquezia.", "mud": "Em paciente estável, com pequena quantidade de sangue vivo e sem fatores para HDA, a hipótese de HDB seria a principal.", "cmp": "A cor do sangue depende do local e da velocidade: sangramento alto rápido pode chegar vermelho ao reto.", "arm": "Usar a cor do sangue como regra absoluta.", "regra": "Hematoquezia geralmente é HDB, mas HDA maciça também pode causá-la.", "cf": "A cirrose pode decorrer de hepatites virais crônicas (B, C, D), conectando esta aula à de hepatites.", "fonte": "F1, Aula 6, p. 14 (pegadinha) e p. 23 (figura 6)"}, {"n": 5, "sub": "Causas de HDA: Mallory-Weiss", "comp": "Associar a história à causa de HDA", "tags": [], "rel": [], "enun": "Jovem de 24 anos, após uma noite de muita bebida alcoólica, teve vários episódios de vômitos intensos. No último, observou sangue vermelho vivo misturado ao vômito. Está estável. Qual causa de HDA é a mais sugerida pela história?", "ops": [["Laceração de Mallory-Weiss.", "Correta: hematêmese após vômitos repetidos sugere laceração da junção esofagogástrica."], ["Angiodisplasia.", "Errada: é causa de HDB, típica de idosos."], ["Diverticulose.", "Errada: é causa de HDB."], ["Varizes esofagogástricas sangrantes.", "Errada: são causa de HDA, mas associadas a hipertensão portal/cirrose, não a vômitos em jovem sem hepatopatia."]], "conc": "Principais causas de HDA: úlcera péptica, varizes esofagogástricas, erosões/gastrite, laceração de Mallory-Weiss e neoplasias. Principais causas de HDB: diverticulose, angiodisplasia, colites, doença inflamatória intestinal, neoplasias/pólipos e doença anorretal.", "rac": "A sequência 'vômitos repetidos → depois sangue' indica lesão produzida pelo esforço do vômito na junção esofagogástrica: Mallory-Weiss.", "pista": "O sangue apareceu depois de vários episódios de vômito.", "mud": "Se ele tivesse cirrose com ascite e icterícia, varizes esofagogástricas seriam a hipótese prioritária.", "cmp": "Mallory-Weiss: laceração por esforço de vômito. Varizes: hipertensão portal. Úlcera: AINE, H. pylori.", "arm": "Associar todo sangramento em etilista a varizes, sem considerar a história de vômitos.", "regra": "Vômitos repetidos e depois sangue = Mallory-Weiss.", "cf": "Um idoso com uso crônico de AINE e melena tem a úlcera péptica como hipótese mais provável.", "fonte": "F1, Aula 6, p. 14 (item 3, principais causas)"}, {"n": 6, "sub": "Causas de HDB", "comp": "Associar o perfil clínico a causas de HDB", "tags": [], "rel": [], "enun": "Idoso de 78 anos, estável hemodinamicamente, apresenta episódio de hematoquezia indolor e volumosa. Colonoscopia prévia de 3 anos atrás mostrou divertículos no sigmoide. Qual causa é a mais provável?", "ops": [["Diverticulose.", "Correta: é causa clássica de HDB, com sangramento tipicamente indolor no idoso."], ["Úlcera péptica duodenal.", "Errada: é causa de HDA, e o paciente está estável, o que favorece origem baixa."], ["Laceração de Mallory-Weiss.", "Errada: é HDA associada a vômitos."], ["Erosões gástricas.", "Errada: são causa de HDA."]], "conc": "Causas de HDB: diverticulose, angiodisplasia, colites, doença inflamatória intestinal, neoplasias/pólipos e doença anorretal. No idoso com hematoquezia indolor, diverticulose e angiodisplasia são hipóteses frequentes.", "rac": "1) Hematoquezia em paciente estável: favorece HDB. 2) Idoso com divertículos conhecidos. 3) Sangramento indolor e volumoso: típico de diverticulose.", "pista": "Divertículos documentados + hematoquezia indolor.", "mud": "Se houvesse diarreia com sangue, febre e dor, colite seria hipótese mais provável; se houvesse emagrecimento e anemia crônica, neoplasia.", "cmp": "Diverticulose e angiodisplasia: sangramento indolor no idoso. Colites e DII: sangue com diarreia e dor.", "arm": "Esquecer de avaliar estabilidade antes de discutir causa e exame.", "regra": "HDB no idoso, indolor: pense em diverticulose e angiodisplasia.", "cf": "Sendo estável, o exame indicado é a colonoscopia após preparo adequado.", "fonte": "F1, Aula 6, p. 14 (item 3, causas de HDB) e p. 23 (figura 6)"}, {"n": 7, "sub": "Abordagem inicial", "comp": "Priorizar a estabilidade hemodinâmica", "tags": ["osce"], "rel": ["A05"], "enun": "Na estação de OSCE, o paciente-ator tem hematêmese, FC 118 bpm e PA 90/60 mmHg. O examinador pergunta qual é a sua primeira ação. Qual resposta pontua melhor?", "ops": [["Avaliar ABC e sinais de choque, obter acesso venoso e colher exames iniciais.", "Correta: o material manda verbalizar primeiro estabilidade hemodinâmica, depois acesso, exames e localização da fonte."], ["Solicitar endoscopia digestiva alta imediata, antes de qualquer outra medida de suporte.", "Errada: a EDA é feita após estabilização inicial."], ["Iniciar IBP oral e agendar endoscopia digestiva alta ambulatorial.", "Errada: há instabilidade; o paciente precisa de abordagem imediata."], ["Solicitar angiotomografia para localizar o ponto de sangramento.", "Errada: angio-TC é reservada a HDB importante com instabilidade ou difícil localização, e a estabilização vem antes."]], "conc": "Abordagem inicial: ABC/estabilidade → acesso venoso → hemograma, coagulação, função renal/hepática → tipagem se relevante → localizar a fonte. Repercussão sistêmica: palidez, fraqueza, tontura, síncope, taquicardia, hipotensão/hipotensão postural e choque nos casos graves; na perda crônica, anemia ferropriva, fadiga e dispneia aos esforços.", "rac": "1) Taquicardia e PA limítrofe: repercussão hemodinâmica. 2) Prioridade: estabilizar. 3) Só depois, localizar a fonte com o exame adequado.", "pista": "O material: 'antes de qual endoscopia?, diga que avalia via aérea, circulação, sinais de choque'.", "mud": "Em paciente estável com melena discreta, a estabilização continua sendo verificada, mas a EDA pode ser programada sem urgência extrema.", "cmp": "A mesma lógica aparece na diarreia grave: hemodinâmica antes de etiologia.", "arm": "Responder 'endoscopia' como primeira ação.", "regra": "Sangramento digestivo: estabilidade primeiro, fonte depois.", "cf": "Em hepatopata com HDA, a coagulação e a função hepática colhidas na abordagem inicial ajudam a estimar gravidade.", "fonte": "F1, Aula 6, pp. 14–15 (itens 4 e 5, repercussão e abordagem inicial; quadro OSCE)"}, {"n": 8, "sub": "Exame de escolha conforme o cenário", "comp": "Escolher o exame de localização adequado", "tags": [], "rel": [], "enun": "Mulher de 74 anos com hematoquezia volumosa e ativa permanece hipotensa apesar da reposição inicial, e a fonte do sangramento não está clara. Qual exame o material indica para localizar o sangramento ativo e orientar a intervenção?", "ops": [["Angiotomografia.", "Correta: na HDB importante/ativa com instabilidade ou dificuldade de localização, a angio-TC pode localizar o sangramento ativo e orientar intervenção."], ["Colonoscopia após preparo adequado.", "Errada: é o exame da HDB estável."], ["Endoscopia digestiva alta eletiva.", "Errada: é o exame da suspeita de HDA, após estabilização."], ["Pesquisa de sangue oculto nas fezes.", "Errada: o sangramento já é visível e ativo; o teste não localiza a fonte."]], "conc": "Exame conforme o cenário: suspeita de HDA → endoscopia digestiva alta após estabilização inicial; HDB estável → colonoscopia após preparo adequado; HDB importante/ativa com instabilidade ou dificuldade de localização → angiotomografia para localizar sangramento ativo e orientar intervenção.", "rac": "1) HDB (hematoquezia) importante e ativa. 2) Instabilidade persistente. 3) Fonte incerta. 4) Exame indicado: angiotomografia.", "pista": "'Permanece hipotensa' e 'fonte não está clara'.", "mud": "Se ela estabilizasse e o sangramento cessasse, a colonoscopia com preparo seria o exame de escolha.", "cmp": "EDA: HDA. Colonoscopia: HDB estável. Angio-TC: HDB ativa com instabilidade ou difícil localização.", "arm": "Pedir colonoscopia em paciente instável, sem preparo, com sangramento ativo.", "regra": "HDA → EDA. HDB estável → colonoscopia. HDB ativa instável → angio-TC.", "cf": "Lembre que, em paciente instável com hematoquezia, também se considera HDA maciça; a EDA pode ser necessária para afastar fonte alta.", "fonte": "F1, Aula 6, p. 15 (item 6, exame de escolha conforme suspeita)"}]}, {"id": "A07", "titulo": "Hepatites virais: manifestações, sorologias/marcadores e tratamento", "arq": "F1", "pags": "16–19 e 24", "bloco": 3, "q": [{"n": 1, "sub": "Manifestações e exames gerais", "comp": "Reconhecer as fases clínicas e o marcador laboratorial de gravidade", "tags": [], "rel": [], "enun": "Homem de 32 anos teve uma semana de fadiga, anorexia, náuseas e desconforto em hipocôndrio direito; agora está ictérico, com urina escura e fezes claras. ALT 1.850 U/L, AST 1.420 U/L. Qual exame do material é marcador de comprometimento da síntese hepática e, portanto, de gravidade?", "ops": [["TP/INR prolongado.", "Correta: reflete comprometimento da síntese hepática e é marcador de gravidade."], ["ALT/TGP muito elevada.", "Errada: indica lesão hepatocelular, mas o nível não mede a função de síntese."], ["Bilirrubina elevada.", "Errada: relaciona-se à icterícia, não especificamente à síntese."], ["FA/GGT elevadas.", "Errada: sugerem componente colestático quando desproporcionais."]], "conc": "Muitas hepatites são assintomáticas. Quando sintomáticas, há fase prodrômica (fadiga, mal-estar, anorexia, náuseas/vômitos, febre, mialgia, desconforto em hipocôndrio direito) seguida de fase ictérica (icterícia, colúria, hipocolia/acolia e, às vezes, prurido). Exames: ALT/AST elevadas = lesão hepatocelular; bilirrubina = icterícia; FA/GGT = colestase quando desproporcional; TP/INR prolongado = comprometimento de síntese, marcador de gravidade; albumina baixa = mais típica de doença crônica/avançada.", "rac": "A pergunta pede o marcador de gravidade por síntese. O fígado produz fatores de coagulação; se a síntese cai, o TP/INR se prolonga.", "pista": "'Comprometimento da síntese'.", "mud": "Se a pergunta fosse sobre o que indica doença crônica/avançada, a albumina baixa seria a resposta mais típica.", "cmp": "ALT/AST: lesão. TP/INR: função (síntese). Albumina baixa: cronicidade/avanço.", "arm": "Achar que transaminases mais altas significam doença mais grave.", "regra": "Lesão = ALT/AST; gravidade por síntese = TP/INR.", "cf": "Na hepatite E em gestante, a monitorização do INR ajuda a reconhecer precocemente evolução para insuficiência hepática aguda.", "fonte": "F1, Aula 7, p. 16 (item 1, manifestações e exames gerais)"}, {"n": 2, "sub": "Hepatite A", "comp": "Interpretar anti-HAV e definir o tratamento", "tags": [], "rel": [], "enun": "Criança de 9 anos e sua mãe têm icterícia após surto na escola. A sorologia da mãe mostra anti-HAV IgM positivo. Qual é a interpretação e o tratamento?", "ops": [["Hepatite A aguda/recente; tratamento de suporte, sem antiviral específico.", "Correta: anti-HAV IgM indica infecção aguda; não há antiviral específico de rotina."], ["Imunidade vacinal contra hepatite A; não há doença ativa.", "Errada: imunidade vacinal ou infecção passada é indicada pelo anti-HAV IgG."], ["Hepatite A crônica; iniciar antiviral de ação direta.", "Errada: não há hepatite A crônica no material, e DAA são usados na hepatite C."], ["Hepatite A aguda; iniciar tenofovir para reduzir a replicação viral e a icterícia.", "Errada: tenofovir é usado na hepatite B crônica."]], "conc": "Hepatite A: anti-HAV IgM = infecção aguda/recente; anti-HAV IgG = infecção passada ou imunidade vacinal. Tratamento: suporte, hidratação/alimentação adequadas, evitar álcool e substâncias hepatotóxicas; não há antiviral específico de rotina.", "rac": "1) Marcador: IgM. 2) IgM aponta infecção recente/aguda. 3) Tratamento da hepatite A: suporte.", "pista": "IgM positivo.", "mud": "Se só o anti-HAV IgG fosse positivo, a mãe teria imunidade (contato prévio ou vacina), e a icterícia exigiria outra explicação.", "cmp": "IgM: recente. IgG: passado/imunidade. A regra vale para HAV e HEV.", "arm": "Prescrever antiviral para hepatite A.", "regra": "Anti-HAV IgM = aguda; tratamento de suporte.", "cf": "Um adulto vacinado contra hepatite A terá anti-HAV IgG positivo e IgM negativo.", "fonte": "F1, Aula 7, p. 16 (item 2, hepatite A) e pp. 18–19 (tabela final)"}, {"n": 3, "sub": "Hepatite B: perfil vacinal", "comp": "Interpretar o perfil sorológico de vacinação", "tags": [], "rel": [], "enun": "Estudante de Medicina faz sorologia admissional: HBsAg negativo, anti-HBc total negativo, anti-HBs positivo. Qual é a interpretação?", "ops": [["Imunidade por vacinação contra hepatite B.", "Correta: anti-HBs isolado, sem anti-HBc, indica vacina, que não produz anti-HBc."], ["Infecção passada curada pelo HBV.", "Errada: a cura de infecção natural deixa anti-HBc positivo junto com anti-HBs."], ["Susceptível à hepatite B, devendo ser vacinado.", "Errada: o susceptível tem os três marcadores negativos."], ["Janela imunológica de infecção aguda.", "Errada: a janela tem HBsAg e anti-HBs negativos com anti-HBc IgM positivo."]], "conc": "Perfis clássicos (HBsAg / anti-HBc / anti-HBs): susceptível (−/−/−); vacinado (−/−/+); infecção aguda (+/IgM+/−); infecção passada/curada (−/+/+); infecção crônica (+/total ou IgG+/−). A vacina contém apenas o antígeno de superfície e, por isso, produz anti-HBs, mas não anti-HBc.", "rac": "1) HBsAg negativo: sem vírus presente. 2) Anti-HBc negativo: nunca teve contato natural. 3) Anti-HBs positivo: imunidade. 4) Imunidade sem contato natural = vacina.", "pista": "Anti-HBc negativo com anti-HBs positivo.", "mud": "Se o anti-HBc total também fosse positivo, a imunidade seria por infecção natural curada.", "cmp": "Vacinado: só anti-HBs. Curado: anti-HBs + anti-HBc.", "arm": "Pensar que a vacina produz anti-HBc.", "regra": "Anti-HBc é marca de contato natural; vacina dá só anti-HBs.", "cf": "Um profissional com os três marcadores negativos é susceptível e deve ser vacinado.", "fonte": "F1, Aula 7, pp. 16–17 (item 3, marcadores e perfis clássicos) e p. 24 (figura 7)"}, {"n": 4, "sub": "Hepatite B: janela imunológica", "comp": "Identificar o marcador da janela", "tags": [], "rel": [], "enun": "Paciente com hepatite aguda clínica há 6 semanas tem: HBsAg negativo, anti-HBs negativo, anti-HBc IgM positivo. Qual é a interpretação?", "ops": [["Janela imunológica da hepatite B aguda.", "Correta: o marcador-chave da janela é o anti-HBc IgM positivo."], ["Paciente susceptível, sem contato com o HBV.", "Errada: anti-HBc IgM positivo indica contato recente."], ["Hepatite B crônica com baixa replicação.", "Errada: a crônica tem HBsAg positivo e anti-HBc total/IgG."], ["Imunidade vacinal recente contra hepatite B.", "Errada: a vacina não produz anti-HBc e produz anti-HBs, que está negativo."]], "conc": "Na janela imunológica, o HBsAg já foi eliminado e o anti-HBs ainda não surgiu. Só o anti-HBc IgM denuncia a infecção aguda nesse período. Por isso, o anti-HBc IgM é chamado de marcador da janela.", "rac": "1) HBsAg negativo e anti-HBs negativo poderiam sugerir susceptível. 2) Mas o anti-HBc IgM está positivo: houve contato recente. 3) Combinação = janela.", "pista": "Anti-HBc IgM positivo isolado em quadro agudo.", "mud": "Se o anti-HBs aparecesse semanas depois, com anti-HBc total positivo, o perfil passaria a ser de infecção passada/curada.", "cmp": "Susceptível: tudo negativo. Janela: só anti-HBc IgM positivo.", "arm": "Interpretar HBsAg negativo como exclusão de hepatite B aguda sem olhar o anti-HBc IgM.", "regra": "Janela: HBsAg −, anti-HBs −, anti-HBc IgM +.", "cf": "Se apenas o HBsAg tivesse sido pedido, a infecção poderia passar despercebida na janela; por isso, o anti-HBc IgM é útil na suspeita de hepatite aguda.", "fonte": "F1, Aula 7, p. 17 (quadro 'Janela imunológica') e p. 20 (revisão, item 19)"}, {"n": 5, "sub": "Hepatite B crônica: HBeAg e HBV-DNA", "comp": "Interpretar o perfil crônico e o papel do HBV-DNA", "tags": [], "rel": [], "enun": "Doador de sangue assintomático tem, em dois exames com 8 meses de intervalo: HBsAg positivo, anti-HBc total/IgG positivo, anti-HBc IgM negativo, anti-HBs negativo e HBeAg positivo. Qual afirmação está correta?", "ops": [["Hepatite B crônica; o HBeAg sugere maior replicação, mas não substitui o HBV-DNA.", "Correta: perfil crônico; HBV-DNA é o marcador de carga viral usado na decisão terapêutica."], ["É hepatite B aguda, pois o HBsAg está positivo nos dois exames.", "Errada: o HBsAg indica infecção presente, aguda ou crônica; a ausência de IgM e a persistência apontam cronicidade."], ["É infecção passada e curada, pois o anti-HBc IgG está positivo.", "Errada: na cura, o HBsAg é negativo e o anti-HBs é positivo."], ["O HBeAg positivo dispensa a dosagem de HBV-DNA para decidir o início do tratamento.", "Errada: o material afirma que o HBeAg não substitui o HBV-DNA."]], "conc": "HBsAg = infecção pelo HBV presente (aguda ou crônica). Anti-HBc total/IgG = contato natural. HBeAg = em geral maior replicação/infectividade, mas não substitui HBV-DNA. Anti-HBe = soroconversão do sistema e, frequentemente menor replicação, mas não significa cura. HBV-DNA = carga viral, importante para atividade, tratamento e monitoramento. Na forma crônica, a decisão de tratar considera carga viral, ALT, fibrose/cirrose e situações especiais.", "rac": "1) HBsAg positivo persistente (8 meses). 2) Anti-HBc IgG/total, sem IgM. 3) Anti-HBs negativo. 4) Perfil crônico. 5) HBeAg sugere replicação, mas a decisão usa HBV-DNA, ALT e fibrose.", "pista": "Persistência do HBsAg com anti-HBc IgG e sem IgM.", "mud": "Se o paciente tivesse anti-HBe positivo e HBeAg negativo, isso sugeriria menor replicação, mas ainda seria infecção crônica e não cura.", "cmp": "Aguda: HBsAg + anti-HBc IgM. Crônica: HBsAg + anti-HBc total/IgG.", "arm": "Achar que anti-HBe positivo significa cura.", "regra": "HBsAg + anti-HBc IgG sem anti-HBs = crônica; decisão de tratar usa HBV-DNA, ALT e fibrose.", "cf": "No SUS, medicamentos para hepatite B crônica incluem tenofovir desoproxila (TDF), entecavir (ETV), tenofovir alafenamida (TAF) e alfapeguinterferona em situações selecionadas; o objetivo é suprimir replicação e reduzir cirrose, carcinoma hepatocelular e morte.", "fonte": "F1, Aula 7, pp. 16–17 (item 3, marcadores, perfis e tratamento da hepatite B)"}, {"n": 6, "sub": "Hepatite B: infecção passada x vacina", "comp": "Diferenciar imunidade natural de vacinal", "tags": [], "rel": [], "enun": "Paciente de 58 anos, nunca vacinado contra hepatite B, tem: HBsAg negativo, anti-HBc total positivo, anti-HBs positivo. Qual interpretação está correta?", "ops": [["Infecção passada pelo HBV, com cura e imunidade natural.", "Correta: anti-HBc indica contato natural, e anti-HBs com HBsAg negativo indica cura."], ["Imunidade vacinal, pois o anti-HBs está positivo.", "Errada: a vacina não produz anti-HBc, e o paciente nunca foi vacinado."], ["Hepatite B crônica com imunidade parcial.", "Errada: a crônica exige HBsAg positivo e anti-HBs negativo."], ["Janela imunológica, pois o HBsAg está negativo.", "Errada: na janela o anti-HBs ainda é negativo."]], "conc": "Infecção passada/curada: HBsAg negativo, anti-HBc positivo e anti-HBs positivo. O anti-HBc é a marca do contato natural com o vírus; o anti-HBs indica imunidade.", "rac": "1) HBsAg negativo: vírus não presente. 2) Anti-HBc positivo: houve infecção natural. 3) Anti-HBs positivo: imunidade. 4) Curado.", "pista": "Anti-HBc e anti-HBs ambos positivos.", "mud": "Se o anti-HBc fosse negativo, o anti-HBs isolado indicaria vacinação.", "cmp": "Curado: anti-HBc + anti-HBs. Vacinado: só anti-HBs.", "arm": "Ler anti-HBs positivo e concluir automaticamente 'vacinado'.", "regra": "Anti-HBc = contato natural; anti-HBs = imunidade.", "cf": "Uma pessoa vacinada e depois infectada e curada também teria anti-HBc positivo, porque o anti-HBc vem da infecção, não da vacina.", "fonte": "F1, Aula 7, pp. 16–17 (perfis clássicos) e p. 20 (revisão, item 18)"}, {"n": 7, "sub": "Hepatite C", "comp": "Conduzir anti-HCV positivo e conhecer o tratamento", "tags": [], "rel": ["A03"], "enun": "Paciente assintomático tem anti-HCV positivo em exame de rotina. Qual é o próximo passo e qual o tratamento disponível se a infecção for confirmada?", "ops": [["Pedir HCV-RNA; se detectável, tratar com antivirais de ação direta pangenotípicos.", "Correta: anti-HCV indica contato; o HCV-RNA define viremia, e o tratamento atual usa DAA segundo o PCDT vigente."], ["Confirmar hepatite C crônica pelo anti-HCV e iniciar tratamento imediatamente.", "Errada: o anti-HCV isolado não define infecção ativa."], ["Repetir o anti-HCV em 6 meses para verificar se o exame negativa.", "Errada: o anti-HCV indica contato e pode persistir; o exame que define atividade é o HCV-RNA."], ["Solicitar HCV-RNA; se detectável, tratar com alfapeguinterferona isolada, padrão atual.", "Errada: o tratamento atual descrito é com DAA pangenotípicos."]], "conc": "Anti-HCV indica contato com o HCV, mas não define infecção ativa. HCV-RNA detectável confirma viremia/infecção ativa; HCV-RNA não detectável indica ausência de viremia atual. Tratamento atual: antivirais de ação direta, com esquemas pangenotípicos segundo o PCDT vigente, com taxa de cura superior a 95% na maioria dos pacientes.", "rac": "1) Anti-HCV positivo = contato. 2) Pergunta-chave: o vírus está circulando? Pedir HCV-RNA. 3) RNA positivo = ativa → DAA. RNA negativo = sem viremia atual.", "pista": "O anti-HCV 'não define sozinho' infecção ativa.", "mud": "Se o HCV-RNA fosse não detectável, não haveria viremia atual, e o paciente não teria indicação de tratamento antiviral naquele momento.", "cmp": "Mesmo raciocínio do H. pylori: anticorpo indica contato; teste de agente (RNA, antígeno) indica infecção ativa.", "arm": "Iniciar tratamento com base apenas no anti-HCV.", "regra": "Anti-HCV + → pedir HCV-RNA. RNA + → ativa → DAA.", "cf": "Um paciente curado com DAA continuará com anti-HCV positivo, mas com HCV-RNA não detectável.", "fonte": "F1, Aula 7, p. 17 (item 4, hepatite C) e p. 20 (revisão, item 20)"}, {"n": 8, "sub": "Hepatite D e hepatite E", "comp": "Relacionar HDV à dependência do HBV e reconhecer o risco da HEV na gestação", "tags": [], "rel": [], "enun": "Homem com hepatite B crônica conhecida há 10 anos, estável, apresenta piora súbita e grave da função hepática. Exames mostram anti-HDV positivo e HDV-RNA detectável. Como classificar a situação?", "ops": [["Superinfecção pelo HDV, com tendência a maior gravidade.", "Correta: aquisição do HDV em quem já tem HBV crônico é superinfecção, de maior gravidade."], ["Coinfecção HBV-HDV, pois os dois vírus estão presentes ao mesmo tempo.", "Errada: coinfecção é aquisição simultânea dos dois vírus."], ["Hepatite D isolada, sem relação com o HBV crônico.", "Errada: o HDV depende do HBsAg; só ocorre associado ao HBV."], ["Hepatite E aguda sobreposta, pela piora súbita.", "Errada: os marcadores positivos são do HDV."]], "conc": "O HDV depende do HBsAg do HBV; por isso, a hepatite D ocorre associada à infecção pelo HBV. Coinfecção: HBV e HDV adquiridos ao mesmo tempo. Superinfecção: paciente com HBV crônico adquire HDV depois; tende a maior gravidade. Anti-HDV = contato/infecção; HDV-RNA = replicação ativa. No SUS, usa-se alfapeguinterferona 2a, associando tratamento do HBV com análogo de nucleos(t)ídeo quando indicado, com acompanhamento especializado. Hepatite E: anti-HEV IgM = aguda; IgG = contato prévio; HEV-RNA = ativa; em geral suporte, com atenção a gestantes pelo maior risco de insuficiência hepática aguda.", "rac": "1) HBV crônico prévio. 2) Novo vírus (HDV) com replicação ativa. 3) Sequência temporal: HBV antes, HDV depois = superinfecção. 4) Clínica grave condiz com superinfecção.", "pista": "'Hepatite B crônica conhecida há 10 anos' e piora súbita com HDV-RNA detectável.", "mud": "Se o paciente adquirisse HBV e HDV no mesmo episódio, seria coinfecção.", "cmp": "Coinfecção: simultânea. Superinfecção: HDV sobre HBV crônico, mais grave.", "arm": "Achar que o HDV pode infectar sozinho.", "regra": "HDV depende do HBV; superinfecção é mais grave.", "cf": "Gestante com icterícia e anti-HEV IgM positivo exige atenção especial, pelo maior risco de insuficiência hepática aguda na hepatite E.", "fonte": "F1, Aula 7, p. 18 (itens 5 e 6, hepatites D e E) e pp. 18–19 (tabela final)"}]}, {"id": "A08", "titulo": "Queixa urinária, exame físico urinário/renal e exames de confirmação", "arq": "F2", "pags": "1–5", "bloco": 4, "q": [{"n": 1, "sub": "Cistite não complicada", "comp": "Reconhecer ITU baixa e a necessidade de exames", "tags": ["osce"], "rel": [], "enun": "Mulher de 26 anos, não gestante, relata há 2 dias ardor ao urinar, urgência, aumento da frequência urinária e pressão em hipogástrio. Está afebril, sem dor lombar e sem calafrios. Qual é a hipótese e a conduta diagnóstica mais adequadas?", "ops": [["Cistite típica não complicada; o diagnóstico pode ser clínico, com EAS se houver dúvida e sem imagem de rotina.", "Correta: é a descrição de ITU baixa típica e da conduta diagnóstica do material."], ["Pielonefrite; solicitar urocultura, hemograma, creatinina e ultrassom.", "Errada: não há febre, calafrios nem dor lombar/flanco."], ["Cólica ureteral; solicitar TC sem contraste.", "Errada: não há dor súbita em ondas do flanco à virilha."], ["Retenção urinária; palpar o globo vesical e medir resíduo pós-miccional.", "Errada: não há dificuldade para urinar, jato fraco nem abaulamento suprapúbico."]], "conc": "Cistite (ITU baixa): disúria, polaciúria, urgência, dor/pressão hipogástrica, em geral sem febre alta. Pode haver sensibilidade suprapúbica, sem dor em ângulo costovertebral. Na cistite típica não complicada, o diagnóstico pode ser clínico; EAS se dúvida; urocultura em situações selecionadas (recorrência, complicação, gestação); sem imagem de rotina.", "rac": "1) Sintomas de bexiga: disúria, urgência, polaciúria, dor hipogástrica. 2) Sem sinais sistêmicos nem dor lombar. 3) Não gestante, sem complicação. 4) Cistite típica: diagnóstico clínico.", "pista": "Sintomas miccionais sem febre e sem dor lombar.", "mud": "Febre, calafrios e dor em flanco transformariam a hipótese em pielonefrite; gestação indicaria urocultura.", "cmp": "Cistite: local (bexiga), sem febre. Pielonefrite: sistêmica, com febre, dor lombar e possível Giordano positivo.", "arm": "Pedir ultrassom de rotina para cistite típica não complicada.", "regra": "Disúria + urgência + polaciúria sem febre = cistite; diagnóstico pode ser clínico.", "cf": "Modelo de fala no OSCE: 'O conjunto de ardor ao urinar, urgência e dor suprapúbica sem febre sugere infecção urinária baixa. Vou avaliar se há necessidade de exame de urina/cultura.'", "fonte": "F2, Seção 01, p. 1 (tabela de hipóteses); Seção 03, p. 5 (tabela de exames); Seção 10, p. 15 (modelos de fala)"}, {"n": 2, "sub": "Pielonefrite", "comp": "Solicitar exames na ITU alta", "tags": ["osce"], "rel": ["A10"], "enun": "Mulher de 34 anos com febre de 38,9 °C, calafrios, náuseas e dor em flanco direito há 2 dias, sem disúria. A punho-percussão lombar direita provoca dor. Está com PA 118/72 mmHg. Quais exames iniciais o material recomenda?", "ops": [["EAS, urocultura antes do antibiótico, hemograma e creatinina; imagem se complicação.", "Correta: é a investigação da pielonefrite descrita no material."], ["Nenhum exame, pois o diagnóstico de pielonefrite é sempre clínico.", "Errada: na pielonefrite o material indica EAS, urocultura e exames de gravidade."], ["TC sem contraste como primeiro exame obrigatório, antes do EAS.", "Errada: TC sem contraste é mais acurada na cólica renal; na pielonefrite, imagem é reservada a situações específicas."], ["Apenas EAS; a urocultura só deve ser colhida após o início do antibiótico, para evitar atraso.", "Errada: a urocultura deve ser colhida antes do antibiótico quando viável."]], "conc": "Pielonefrite (ITU alta): febre > 38 °C, calafrios, dor lombar/flanco, náusea/vômito; pode não ter disúria. Giordano pode ser positivo; há risco de sepse. Exames: EAS, urocultura antes do antibiótico quando viável, hemograma e creatinina conforme gravidade. US/TC se suspeita de obstrução, complicação, má resposta ou risco aumentado. Avaliar sepse.", "rac": "1) Febre, calafrios e dor em flanco: ITU alta. 2) Ausência de disúria não exclui. 3) Giordano positivo reforça. 4) Exames: urina, cultura antes do antibiótico, avaliação de gravidade.", "pista": "Febre + calafrios + dor em flanco + dor à punho-percussão.", "mud": "Se ela estivesse hipotensa e confusa, a prioridade seria o manejo de sepse; se houvesse cólica com suspeita de obstrução, imagem urgente.", "cmp": "Na cistite o diagnóstico pode ser clínico; na pielonefrite, exames de urina, cultura e gravidade são indicados.", "arm": "Descartar pielonefrite porque a paciente 'não tem ardor ao urinar'.", "regra": "Febre + dor em flanco = ITU alta: EAS, urocultura antes do antibiótico, hemograma e creatinina.", "cf": "Modelo de fala: 'Febre e dor em flanco com sensibilidade costovertebral sugerem infecção urinária alta. Avaliarei gravidade, EAS, urocultura e função renal.'", "fonte": "F2, Seção 01, p. 1 (tabela); Seção 03, p. 5 (tabela de exames); Seção 10, p. 15 (modelos de fala)"}, {"n": 3, "sub": "Cólica ureteral / urolitíase", "comp": "Reconhecer cólica renal e escolher o exame de imagem", "tags": ["osce"], "rel": ["A10"], "enun": "Homem de 41 anos chega agitado, sem conseguir ficar parado, com dor súbita e intensa em ondas que vai do flanco esquerdo para a virilha, com vômitos. O EAS não mostra hematúria. Qual interpretação e qual exame de imagem são mais adequados quando confirmação ou localização é necessária?", "ops": [["Cólica ureteral; hematúria ausente não exclui; TC sem contraste é a mais acurada.", "Correta: é o quadro típico de urolitíase, e o material destaca que a ausência de hematúria não exclui."], ["Hematúria ausente exclui litíase; investigar dor musculoesquelética.", "Errada: o material afirma que a ausência de hematúria não exclui."], ["Pielonefrite; a imagem só é necessária após falha do antibiótico.", "Errada: não há febre; o padrão é de cólica."], ["Cólica ureteral; a urografia excretora é o exame de primeira escolha para localizar o cálculo.", "Errada: o material cita ultrassom em situações adequadas e TC sem contraste como mais acurada."]], "conc": "Urolitíase/cólica ureteral: dor súbita e intensa em ondas, de flanco para virilha/genitália, inquietação, vômitos e/ou hematúria. Pode ter Giordano positivo; a ausência de hematúria não exclui. Exames: EAS (hematúria possível), creatinina e outros conforme o quadro; teste de gestação quando aplicável; ultrassom em situações adequadas; TC sem contraste é mais acurada quando confirmação/localização é necessária.", "rac": "1) Dor súbita, em ondas, irradiando para virilha. 2) Inquietação (diferente do paciente com peritonite, que fica imóvel). 3) EAS sem hematúria não descarta. 4) Imagem: TC sem contraste para confirmar e localizar.", "pista": "Paciente inquieto com dor em ondas do flanco à virilha.", "mud": "Se surgissem febre e calafrios, a hipótese de obstrução infectada tornaria o caso urgente.", "cmp": "Cólica ureteral: inquieto, dor em ondas. Peritonite: imóvel, dor contínua, piora ao movimento.", "arm": "Excluir litíase porque o EAS veio sem sangue.", "regra": "Cólica em ondas do flanco à virilha: pense em litíase; hematúria ausente não exclui; TC sem contraste confirma.", "cf": "Em mulher em idade fértil com o mesmo quadro, o teste de gestação faz parte dos exames iniciais, quando aplicável.", "fonte": "F2, Seção 01, p. 1 (tabela de hipóteses); Seção 03, p. 5 (tabela de exames)"}, {"n": 4, "sub": "Sinal de gravidade: obstrução infectada", "comp": "Reconhecer urgência urológica", "tags": ["osce"], "rel": [], "enun": "Mulher de 50 anos com cólica renal direita há 2 dias passou a ter febre de 39 °C e calafrios. A ultrassonografia mostra dilatação do sistema coletor direito por cálculo ureteral. Qual é o raciocínio correto?", "ops": [["Cólica renal com febre/calafrios sugere obstrução infectada, que exige avaliação urgente e pode demandar drenagem e antibiótico.", "Correta: é sinal de gravidade destacado no material."], ["É cólica renal comum; analgesia e retorno ambulatorial com urologista em 30 dias.", "Errada: febre com obstrução muda a gravidade e exige conduta urgente."], ["A febre indica cistite associada, tratada com antibiótico oral isolado.", "Errada: a infecção acima de um cálculo obstrutivo precisa de avaliação urgente e possível drenagem."], ["Deve-se aguardar a eliminação espontânea do cálculo antes de iniciar antibiótico.", "Errada: a obstrução infectada não deve esperar; antibiótico e possível drenagem são necessários."]], "conc": "Sinais de gravidade: cólica renal com febre/calafrios, anúria, rim único com possível obstrução, sepse, hipotensão, dor intratável ou piora da função renal exigem avaliação urgente. A obstrução infectada pode demandar drenagem e antibiótico.", "rac": "1) Cálculo obstrutivo documentado. 2) Febre e calafrios surgem: infecção acima da obstrução. 3) Combinação = urgência.", "pista": "Cólica renal + febre e calafrios.", "mud": "Sem febre, com dor controlada, função renal normal e rim contralateral presente, o manejo poderia ser menos urgente.", "cmp": "Cólica renal simples: dor sem sinais sistêmicos. Obstrução infectada: dor + febre/calafrios, risco de sepse.", "arm": "Tratar a febre como 'detalhe' e manter conduta de cólica simples.", "regra": "Cálculo + febre = obstrução infectada até prova em contrário: urgência.", "cf": "Paciente com rim único e cólica com anúria também é urgência, mesmo sem febre.", "fonte": "F2, Seção 01, p. 1 (quadro 'Sinal de gravidade')"}, {"n": 5, "sub": "Globo vesical", "comp": "Executar palpação/percussão suprapúbica e reconhecer retenção", "tags": ["osce"], "rel": ["A09"], "enun": "Homem de 72 anos não urina há 10 horas e refere dor suprapúbica. À palpação, há massa mediana, lisa e globosa acima da sínfise púbica; a percussão do umbigo em direção ao púbis passa de som timpânico para maciço. Qual é a interpretação e o exame complementar adequado?", "ops": [["Globo vesical; medir o volume com ultrassom/bladder scan e investigar a causa.", "Correta: massa mediana globosa com macicez suprapúbica sugere globo vesical."], ["Cistite aguda; colher EAS e tratar com antibiótico empírico por via oral em domicílio.", "Errada: na cistite pode haver dor, mas sem massa palpável e sem macicez."], ["Massa de origem renal; solicitar TC de abdome com contraste.", "Errada: a massa é mediana e suprapúbica, topografia da bexiga."], ["Ascite volumosa; realizar paracentese para análise do líquido.", "Errada: a macicez é localizada na região suprapúbica mediana, com massa globosa."]], "conc": "Palpação suprapúbica: paciente deitado, abdome relaxado; mão espalmada logo acima da sínfise, pressão leve e gradual; percutir do umbigo ao púbis buscando mudança de timpânico para maciço. Normal: sem dor, sem massa, sem macicez. Alterado: dor sem massa pode acompanhar cistite; massa mediana lisa, globosa e com macicez sugere retenção/globo vesical. Exames: história, exame físico e volume residual pós-miccional com ultrassom/bladder scan; investigar causa obstrutiva/neurogênica; retenção dolorosa aguda exige conduta imediata.", "rac": "1) Não urina há horas e tem dor. 2) Massa mediana globosa suprapúbica. 3) Transição timpânico → maciço. 4) Globo vesical.", "pista": "Massa mediana com macicez suprapúbica.", "mud": "Se houvesse dor suprapúbica sem massa e sem macicez, a hipótese seria inflamatória (cistite), não retenção.", "cmp": "Globo vesical: massa mediana, maciça. Cistite: dor sem massa.", "arm": "Esquecer de percutir e não diferenciar bexiga distendida de alças com gás.", "regra": "Massa mediana lisa e globosa + macicez suprapúbica = globo vesical.", "cf": "Em homem idoso, HPB é causa obstrutiva frequente de retenção; a investigação prostática entra na sequência.", "fonte": "F2, Seção 02, Manobra 1, pp. 1–2; Seção 03, p. 5 (globo vesical); p. 15 (registro de suspeita de retenção)"}, {"n": 6, "sub": "Palpação renal bimanual: Guyon", "comp": "Executar Guyon e interpretar rim não palpável", "tags": ["osce"], "rel": [], "enun": "Na estação de OSCE, você executa a manobra de Guyon em um adulto de peso normal e não palpa nenhum dos rins. Como executar a manobra e como interpretar o achado?", "ops": [["Decúbito dorsal, mãos lombar e anterior, palpar na inspiração; rim não palpável é frequentemente normal.", "Correta: é a técnica descrita, e o material afirma que os rins frequentemente não são palpáveis no adulto."], ["Decúbito lateral contrário ao rim examinado; rins não palpáveis indicam atrofia renal.", "Errada: decúbito lateral é a manobra de Israel, e rim não palpável é achado frequente e normal."], ["Paciente em pé com a perna apoiada; rins não palpáveis exigem ultrassom.", "Errada: em pé com apoio é a manobra de Goelet, e não palpar os rins é frequentemente normal."], ["Decúbito dorsal com palpação na expiração forçada; rim não palpável confirma ausência de massa.", "Errada: a palpação se coordena com a inspiração profunda, e o exame não 'confirma' ausência de doença."]], "conc": "Guyon: decúbito dorsal, músculos relaxados, um rim de cada vez. Mão posterior atrás do flanco/lombar, entre rebordo costal e crista ilíaca; mão anterior espalmada sob o rebordo costal. Na inspiração profunda, a mão posterior impulsiona a loja renal para a frente e a anterior palpa o polo inferior; na expiração, mantém a palpação sem compressão brusca. Normal: rins frequentemente não palpáveis; ocasionalmente o polo inferior direito é palpável em pessoas magras. Alterado: aumento de volume, massa, assimetria, dor ou mobilidade anormal, que exigem investigação.", "rac": "Identifique a manobra pelo posicionamento (dorsal) e lembre do achado normal: não palpar os rins no adulto é o esperado na maioria.", "pista": "'Decúbito dorsal' e 'adulto de peso normal'.", "mud": "Se a palpação mostrasse massa renal aumentada e assimétrica, o achado seria alterado e exigiria investigação, sem definir etiologia.", "cmp": "Guyon: dorsal. Israel: decúbito lateral contrário ao rim avaliado. Goelet: em pé, com a perna do lado examinado apoiada.", "arm": "Registrar 'rins não palpáveis' como achado anormal.", "regra": "Rins não palpáveis no adulto: frequentemente normal; polo inferior direito pode ser palpável em magros.", "cf": "Registro normal sugerido: 'Lojas renais sem massas palpáveis. Giordano bilateral negativo.'", "fonte": "F2, Seção 02, Manobra 2, pp. 2–3; p. 15 (registro urinário sem alterações)"}, {"n": 7, "sub": "Manobras de Israel e Goelet", "comp": "Posicionar corretamente o paciente nas variações de palpação renal", "tags": ["osce"], "rel": [], "enun": "O examinador pede que você palpe o rim ESQUERDO pela manobra de Israel. Como posicionar o paciente?", "ops": [["Em decúbito lateral direito, com o lado esquerdo para cima.", "Correta: Israel usa decúbito lateral contrário ao rim avaliado, com o lado examinado para cima."], ["Em decúbito lateral esquerdo, com o lado esquerdo apoiado na maca.", "Errada: o lado examinado deve ficar para cima, não apoiado."], ["Em pé, com a perna esquerda apoiada em um banco.", "Errada: essa é a manobra de Goelet."], ["Em decúbito dorsal, com uma mão na região lombar e outra no flanco anterior.", "Errada: essa é a manobra de Guyon."]], "conc": "Israel: paciente em decúbito lateral contrário ao rim avaliado, lado examinado para cima; mão posterior sustenta a região lombar, mão anterior palpa profundamente o flanco sob o rebordo costal, sincronizando com a inspiração; comparar lados. Ajuda quando a palpação supina é pouco informativa. Goelet: paciente em pé, com a perna do lado examinado apoiada em banco estável para relaxar o flanco; mãos como em Guyon; avaliar abaixamento, mobilidade, dor ou massa. Nenhuma das manobras confirma cálculo ou infecção.", "rac": "Rim esquerdo → lado contrário = direito. Paciente deitado sobre o lado direito, com o esquerdo para cima.", "pista": "'Decúbito lateral contrário ao rim avaliado'.", "mud": "Se o pedido fosse Goelet para o rim esquerdo, o paciente ficaria em pé com a perna esquerda apoiada.", "cmp": "Guyon (dorsal), Israel (lateral contrário), Goelet (ortostatismo com apoio da perna do lado examinado).", "arm": "Deitar o paciente sobre o lado que se quer examinar.", "regra": "Israel: deita do lado oposto, rim examinado para cima.", "cf": "Se, em qualquer manobra, houver massa renal palpável, descreva lado, consistência, mobilidade e sensibilidade; a manobra não define a causa.", "fonte": "F2, Seção 02, Manobras 3 e 4, pp. 3–4"}, {"n": 8, "sub": "Percussão renal: Giordano", "comp": "Executar a punho-percussão e interpretar o resultado", "tags": ["osce"], "rel": ["A11"], "enun": "Na estação de OSCE, você deve pesquisar o sinal de Giordano. Qual descrição de execução e interpretação está correta?", "ops": [["Paciente sentado, punho frouxo sobre a mão espalmada no ângulo costovertebral; dor sugere, não define a doença.", "Correta: é a técnica indireta descrita, e o material destaca que o sinal positivo não define a causa."], ["Paciente deitado; golpe firme com o punho fechado diretamente sobre as costelas; dor confirma pielonefrite.", "Errada: não se bate diretamente sobre osso/costelas, e o sinal não confirma pielonefrite."], ["Paciente sentado; percussão forte e repetida até reproduzir a dor; Giordano negativo exclui doença urinária alta.", "Errada: a força deve ser mínima, e o sinal negativo não exclui doença urinária."], ["Paciente em pé; percussão leve na fossa ilíaca; dor indica cólica ureteral.", "Errada: a percussão é no ângulo costovertebral, não na fossa ilíaca."]], "conc": "Percussão renal: direta (borda ulnar da mão em toques leves no ângulo costovertebral) ou indireta (mão espalmada sobre o ângulo costovertebral e toque suave com o punho frouxamente fechado). Há variação de nomenclatura entre escolas. Positivo: dor provocada no ângulo costovertebral, que ocorre em pielonefrite, urolitíase e até causas musculoesqueléticas; não identifica a doença isoladamente. Negativo: sem dor; não exclui doença urinária. Exame com dor intensa, trauma ou suspeita de fratura não deve ser repetido.", "rac": "1) Posição: sentado, costas expostas. 2) Local: ângulo costovertebral, bilateral, comparando. 3) Força: mínima. 4) Interpretação: sinal sugere, não diagnostica.", "pista": "'Não identifica a doença isoladamente'.", "mud": "Em paciente com trauma lombar ou suspeita de fratura, a manobra não deve ser repetida.", "cmp": "Giordano positivo + febre: pensar pielonefrite. Giordano positivo + cólica para virilha ± hematúria: considerar urolitíase.", "arm": "Bater com força ou diretamente sobre as costelas, causando dor e um falso positivo.", "regra": "Giordano: toque leve no ângulo costovertebral, bilateral; positivo sugere, não confirma.", "cf": "Registro sugerido: 'Punho-percussão lombar direita positiva (Giordano direito positivo); esquerda negativa.'", "fonte": "F2, Seção 02, Manobra 5, pp. 4–5; Seção 09, p. 14 (Giordano na dor abdominal)"}]}, {"id": "A09", "titulo": "Próstata, toque retal e exame geniturinário masculino", "arq": "F2", "pags": "5–9 e 16", "bloco": 4, "q": [{"n": 1, "sub": "Investigação x rastreamento", "comp": "Distinguir rastreamento populacional de investigação por suspeita clínica", "tags": [], "rel": [], "enun": "Homem de 55 anos, assintomático e sem fatores de risco conhecidos, pede para 'fazer o exame da próstata' porque um amigo fez. Outro homem, de 67 anos, tem nódulo endurecido detectado em toque retal realizado por queixa urinária. Segundo o material, qual afirmação é correta?", "ops": [["Não há rastreio populacional indiscriminado; o nódulo suspeito exige investigação clínica.", "Correta: o material separa rastreio populacional de investigação de achado suspeito."], ["Os dois devem fazer PSA e toque anualmente, pois o rastreamento populacional é recomendado no Brasil.", "Errada: o material afirma que o INCA/MS não recomenda rastreio populacional indiscriminado."], ["Nenhum dos dois precisa de investigação, pois o câncer inicial costuma ser assintomático.", "Errada: o nódulo suspeito exige investigação."], ["O segundo homem só deve ser investigado se o PSA vier acima do valor de referência.", "Errada: PSA 'normal' não anula achado suspeito ao toque."]], "conc": "O câncer prostático inicial é frequentemente assintomático. Toque retal alterado indica avaliação, mas não fecha diagnóstico. O INCA/Ministério da Saúde não recomenda rastreamento populacional indiscriminado com PSA/toque; nódulo suspeito ou sintomas/achados relevantes exigem investigação clínica, o que é diferente de rastreio.", "rac": "Separe os dois homens: o primeiro é assintomático, sem achado, ou seja, pergunta de rastreio. O segundo tem achado suspeito, o que é investigação por suspeita clínica.", "pista": "'Nódulo endurecido' x 'assintomático'.", "mud": "Se o primeiro homem tivesse hematúria, dor óssea persistente ou emagrecimento, deixaria de ser rastreio e passaria a ser investigação.", "cmp": "Rastreio: população sem sintomas. Investigação: pessoa com sintoma ou achado suspeito.", "arm": "Confundir a não recomendação de rastreio com 'não investigar' um nódulo.", "regra": "Sem sintomas: não há rastreio populacional indiscriminado. Com nódulo suspeito: investigar.", "cf": "Na anamnese prostática, perguntas sobre antecedentes familiares, sangue na urina, dor óssea, emagrecimento e PSA prévio ajudam a separar suspeita oncológica de simples rastreio.", "fonte": "F2, Seção 04, p. 5 (introdução); Seção 05, p. 9 (quadro 'Rastreamento no Brasil' e item 4)"}, {"n": 2, "sub": "Anamnese: armazenamento x esvaziamento", "comp": "Classificar sintomas urinários baixos", "tags": ["osce"], "rel": [], "enun": "Homem de 70 anos relata que demora para começar a urinar, o jato está fraco e interrompido, precisa fazer força e continua gotejando ao final. Como classificar esses sintomas?", "ops": [["Sintomas de esvaziamento.", "Correta: hesitação, jato fraco, intermitência, esforço e gotejamento são sintomas de esvaziamento."], ["Sintomas de armazenamento.", "Errada: armazenamento inclui polaciúria, urgência, noctúria e incontinência."], ["Sintomas de infecção/inflamação prostática.", "Errada: esses são febre, disúria, dor pélvica/perineal e dor ejaculatória."], ["Sintomas de suspeita oncológica.", "Errada: sangue na urina, dor óssea persistente e emagrecimento são os dados de suspeita oncológica."]], "conc": "Perguntas antes do toque: armazenamento (polaciúria, urgência, noctúria, incontinência); esvaziamento (jato fraco, hesitação, intermitência, esforço, gotejamento, retenção); infecção/inflamação (febre, disúria, dor pélvica/perineal, dor ejaculatória, mal-estar); suspeita oncológica (antecedentes familiares, idade, sangue na urina, dor óssea, emagrecimento, PSA prévio).", "rac": "Cada sintoma descrito tem a ver com a saída da urina: começar (hesitação), força do jato, continuidade (intermitência), esforço e fim (gotejamento).", "pista": "Todos os sintomas se referem a 'tirar' a urina da bexiga.", "mud": "Se ele relatasse acordar 3 vezes à noite para urinar e não conseguir segurar, seriam sintomas de armazenamento.", "cmp": "Esvaziamento: dificuldade para sair. Armazenamento: dificuldade para guardar.", "arm": "Classificar noctúria como sintoma de esvaziamento.", "regra": "Hesitação, jato fraco, intermitência, esforço, gotejamento = esvaziamento.", "cf": "HPB costuma cursar com jato fraco, noctúria, hesitação e retenção; confirmar obstrução é tarefa da avaliação clínica, não só do toque. O escore IPSS pode ser usado quando apropriado.", "fonte": "F2, Seção 04, p. 6 (perguntas antes do toque); Seção 05, pp. 8–9 (tabela HPB e item 1, IPSS)"}, {"n": 3, "sub": "Preparo e posição do toque retal", "comp": "Preparar o toque retal com consentimento e posição adequada", "tags": ["osce"], "rel": [], "enun": "Na estação de OSCE de toque retal, qual sequência inicial atende ao material?", "ops": [["Explicar, obter consentimento, oferecer acompanhante, posicionar em Sims (lateral esquerdo, fletido), lubrificar e inspecionar o ânus.", "Correta: é a sequência de indicação, consentimento e posição descrita."], ["Posicionar em decúbito lateral direito com pernas estendidas e introduzir o dedo sem inspeção prévia para reduzir o desconforto do paciente.", "Errada: a posição de Sims é decúbito lateral esquerdo com flexão, e a inspeção anal precede o toque."], ["Realizar o toque e só depois explicar o que foi feito, para não aumentar a ansiedade do paciente.", "Errada: explicar e pedir consentimento vêm antes de qualquer toque."], ["Usar vaselina sólida como lubrificante e dispensar a oferta de acompanhante, pois o exame é rápido.", "Errada: o material indica lubrificante hidrossolúvel e oferta de acompanhante conforme boas práticas."]], "conc": "Toque retal: explicar o objetivo (tamanho, superfície, consistência, assimetria, dor, nódulos) e que o exame não confirma câncer por si só; pedir consentimento específico; oferecer acompanhante/chaperone; garantir privacidade; posição de Sims (decúbito lateral esquerdo, quadris e joelhos fletidos, nádegas próximas à borda da maca); luvas, lubrificante hidrossolúvel no indicador e avisar antes de tocar; inspecionar o ânus (fissuras, hemorroidas, lesões, sangue, inflamação). Interromper diante de dor importante ou retirada do consentimento.", "rac": "Siga a ordem: comunicação e consentimento → privacidade e acompanhante → posição → material → inspeção → só então o toque.", "pista": "Sims = decúbito lateral esquerdo com flexão.", "mud": "Se o paciente retirar o consentimento durante o exame, o procedimento deve ser interrompido.", "cmp": "Inspeção antes do toque identifica fissuras, hemorroidas e lesões que mudam a abordagem.", "arm": "Pular a explicação e o consentimento, item que costuma ser crítico no checklist do OSCE.", "regra": "Explique, consinta, ofereça acompanhante, Sims, luva e lubrificante, inspecione, toque.", "cf": "Se houver suspeita de prostatite aguda, o toque, quando feito, deve ser cuidadoso e sem massagem prostática.", "fonte": "F2, Seção 04, p. 6 (toque retal: indicação, consentimento e posição; quadro 'Cuidados') e p. 16 (prancha visual)"}, {"n": 4, "sub": "Execução: onde está a próstata", "comp": "Direcionar a palpação para a parede retal correta", "tags": ["osce"], "rel": [], "enun": "Durante o toque retal, após introduzir o indicador acompanhando o canal anal e a curvatura sacral e palpar circunferencialmente a ampola, para onde você deve dirigir a polpa do dedo para palpar a próstata?", "ops": [["Para a parede anterior do reto, voltada para o púbis.", "Correta: a face posterior da próstata é palpada pela parede anterior do reto."], ["Para a parede posterior do reto, voltada para o sacro.", "Errada: a próstata está à frente do reto, não atrás."], ["Para a parede lateral direita, onde fica o lobo mediano.", "Errada: palpam-se os dois lobos laterais e o sulco mediano pela parede anterior."], ["
