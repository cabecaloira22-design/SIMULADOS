<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado HAM Adulto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: coluna única de leitura (máx. 760px), barra fixa de progresso no simulado, cartões só para a questão e a correção */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14232B; --muted:#56666E; --line:#D3DDE1;
  --accent:#1C5A72; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2;
  --ok:#276E49; --ok-soft:#E2F1E8; --bad:#A33C2B; --bad-soft:#F8E5E0; --warn:#8A5D0B; --warn-soft:#F7EED9;
  --display:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.3rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile strong{font-size:1.02rem}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.stat b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--muted)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.checks input{margin-top:4px;width:18px;height:18px;flex:none}
.bloco{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
/* topo do simulado */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:40vh;overflow:auto;padding:2px}
.nb{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.85rem;position:relative}
.nb.ans{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{outline:2px solid var(--ink)}
.nb.ok{background:var(--ok-soft);border-color:var(--ok)}
.nb.bad{background:var(--bad-soft);border-color:var(--bad)}
.nb.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enun{font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.opt .L{font-family:var(--mono);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .tag{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.banner{padding:12px 14px;border-radius:8px;font-weight:600}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.blank{background:var(--warn-soft);color:var(--warn)}
.aula{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.aula dl{margin:0;display:flex;flex-direction:column;gap:10px}
.aula dt{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.aula dd{margin:2px 0 0}
.alts{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.alts li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.alts li b{font-family:var(--mono)}
.gold{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:600}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img,figure canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;font-size:.9rem}
.confirmbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.78rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>
<script>
document.documentElement.lang='pt-BR';
const DATA={"aulas": [{"id": "A01", "titulo": "Avaliação funcional do idoso: cognição, humor/comportamento, comunicação e mobilidade", "arq": "F1", "pags": "3–5 e 21", "bloco": 1, "q": [{"n": 1, "sub": "Autonomia x independência", "comp": "Diferenciar capacidade de decidir de capacidade de executar", "tags": ["osce"], "rel": [], "enun": "Sr. Joaquim, 78 anos, teve AVC há 6 meses e ficou com hemiparesia direita. Precisa de ajuda para tomar banho e para se transferir da cama para a cadeira. Durante a consulta, discute com clareza os riscos e benefícios de iniciar fisioterapia domiciliar e decide, com argumentos coerentes, que prefere fazê-la no centro de reabilitação. Como descrever corretamente sua situação funcional?", "ops": [["Autonomia preservada com independência reduzida.", "Correta: ele decide sobre a própria vida (autonomia), mas não executa sozinho banho e transferência (independência comprometida)."], ["Autonomia e independência reduzidas, pois depende de terceiros.", "Errada: depender de ajuda para executar tarefas não retira a capacidade de decidir; ele argumenta de forma coerente."], ["Independência preservada com autonomia reduzida pela sequela do AVC.", "Errada: inverte os conceitos; a sequela motora afeta a execução, não a decisão."], ["Autonomia e independência preservadas, pois a cognição está íntegra.", "Errada: cognição íntegra sustenta a autonomia, mas a limitação motora reduz a independência para ABVD."]], "conc": "Autonomia é a capacidade de decidir sobre a própria vida; independência é a capacidade de executar atividades sem ajuda. São dimensões diferentes: uma pessoa com limitação física pode decidir tudo sobre si, e uma pessoa com demência pode ainda executar tarefas simples sem conseguir decidir de forma segura.", "rac": "Separe os dados em dois eixos. Execução: precisa de ajuda para banho e transferência (duas ABVD de Katz), logo a independência está reduzida. Decisão: compreende riscos, compara opções e escolhe com coerência, logo a autonomia está preservada.", "pista": "A frase 'decide, com argumentos coerentes' aponta para autonomia; 'precisa de ajuda para banho e transferência' aponta para perda de independência.", "mud": "Se ele não conseguisse compreender as opções ou mudasse de ideia de forma incoerente por déficit cognitivo, a autonomia também estaria comprometida e a decisão exigiria apoio de representante.", "cmp": "Autonomia = decidir (depende sobretudo de cognição e humor). Independência = executar (depende de mobilidade, força, comunicação e também de cognição).", "arm": "Achar que quem depende fisicamente de outra pessoa perdeu o direito de decidir. Isso leva a excluir o idoso de decisões sobre o próprio cuidado.", "regra": "Autonomia = decidir; independência = executar. Avalie as duas separadamente.", "cf": "Uma idosa com demência moderada que ainda toma banho e se veste sozinha, mas não consegue avaliar riscos de morar só, tem independência relativamente preservada e autonomia comprometida.", "fonte": "F1, Aula 1, p. 3 (item 2) e p. 20 (revisão, item 2)"}, {"n": 2, "sub": "ABVD x AIVD: Katz e Lawton-Brody", "comp": "Identificar a escala adequada ao déficit funcional descrito", "tags": ["osce"], "rel": [], "enun": "Dona Lourdes, 74 anos, toma banho, veste-se, alimenta-se e usa o banheiro sozinha, sem incontinência. A filha relata que, nos últimos meses, ela passou a errar os horários dos remédios, esqueceu de pagar contas e deixou de fazer compras sozinha. Qual instrumento descreve melhor o déficit observado?", "ops": [["Escala de Lawton-Brody, pois as perdas estão nas atividades instrumentais de vida diária.", "Correta: medicamentos, finanças e compras são itens das AIVD avaliadas pela Lawton-Brody."], ["Escala de Katz, pois avalia administração de medicamentos e finanças.", "Errada: Katz avalia ABVD (banho, vestir-se, banheiro, transferência, continência, alimentação), que estão preservadas."], ["Timed Up and Go, pois a perda de compras sugere limitação de mobilidade.", "Errada: TUG avalia mobilidade e risco de quedas; o problema descrito é organizacional/cognitivo nas tarefas complexas."], ["Escala de Depressão Geriátrica, pois a perda de iniciativa para tarefas indica humor deprimido.", "Errada: GDS rastreia sintomas depressivos; não mede funcionalidade nas AIVD."]], "conc": "ABVD são as tarefas de autocuidado (Katz: banho, vestir-se, uso do banheiro, transferência, continência, alimentação). AIVD são tarefas mais complexas para viver de forma independente na comunidade (Lawton-Brody: telefone, compras, refeições, cuidar da casa, transporte, medicamentos e finanças).", "rac": "Liste o que está preservado (todas as ABVD) e o que se perdeu (medicamentos, contas, compras). As perdas pertencem ao grupo instrumental; portanto, a escala que as descreve é a de Lawton-Brody.", "pista": "Medicamentos e finanças são itens clássicos das AIVD.", "mud": "Se ela passasse a precisar de ajuda para tomar banho e se vestir, haveria também perda de ABVD, descrita pela escala de Katz, indicando dependência mais avançada.", "cmp": "Katz = ABVD, autocuidado básico. Lawton-Brody = AIVD, tarefas complexas. A perda costuma começar pelas AIVD.", "arm": "Concluir que a idosa é 'independente' porque se alimenta e toma banho sozinha. A perda de AIVD pode ocorrer antes da perda de ABVD e já sinaliza vulnerabilidade, inclusive cognitiva.", "regra": "Katz = ABVD; Lawton = AIVD. A perda funcional aparece primeiro nas tarefas mais complexas.", "cf": "Um idoso que não consegue mais usar o telefone nem pegar ônibus sozinho, mas faz todo o autocuidado, também tem perda de AIVD isolada.", "fonte": "F1, Aula 1, p. 3 (item 3, pegadinha de prova) e p. 21 (figura 1)"}, {"n": 3, "sub": "IVCF-20", "comp": "Interpretar a pontuação do IVCF-20", "tags": ["calculo"], "rel": [], "enun": "Na atenção primária, um idoso de 76 anos responde ao Índice de Vulnerabilidade Clínico-Funcional (IVCF-20) e obtém 9 pontos. Qual é a interpretação adequada segundo o material?", "ops": [["Risco aumentado de vulnerabilidade; indica avaliação mais detalhada.", "Correta: a faixa 7–14 corresponde a risco aumentado e pede avaliação mais detalhada."], ["Baixa vulnerabilidade; idoso robusto, sem necessidade de nova avaliação.", "Errada: baixa vulnerabilidade corresponde à faixa 0–6."], ["Alta vulnerabilidade clínico-funcional, compatível com provável fragilidade.", "Errada: alta vulnerabilidade/provável fragilidade corresponde a 15 pontos ou mais."], ["Resultado diagnóstico de síndrome demencial, pois inclui cognição.", "Errada: o IVCF-20 é rastreio multidimensional; não diagnostica demência."]], "conc": "O IVCF-20 é uma ferramenta rápida e multidimensional que reúne idade, autopercepção de saúde, atividades de vida diária, cognição, humor, mobilidade, comunicação e comorbidades. Serve para rastrear vulnerabilidade e direcionar quem precisa de avaliação geriátrica mais aprofundada.", "rac": "Localize o valor nas faixas do material: 0–6 baixa vulnerabilidade; 7–14 risco aumentado; 15 ou mais alta vulnerabilidade. 9 pontos está entre 7 e 14.", "pista": "9 pontos está acima de 6 e abaixo de 15.", "mud": "Com 16 pontos, o idoso seria classificado como de alta vulnerabilidade/provável fragilidade; com 5 pontos, como robusto.", "cmp": "IVCF-20 rastreia vulnerabilidade global; MEEM rastreia cognição; GDS rastreia sintomas depressivos; TUG avalia mobilidade. Nenhum deles, isoladamente, fecha diagnóstico.", "arm": "Tratar uma ferramenta de rastreio como diagnóstico. A pontuação orienta o próximo passo, não substitui a avaliação clínica.", "regra": "IVCF-20: 0–6 robusto; 7–14 risco aumentado; 15 ou mais alta vulnerabilidade.", "cf": "Se a pontuação subir de 9 para 15 em um ano, o paciente passou para a faixa de provável fragilidade e precisa de plano de cuidado mais intensivo.", "fonte": "F1, Aula 1, pp. 3–4 (item 4, tabela de pontuação)"}, {"n": 4, "sub": "Delirium x demência", "comp": "Reconhecer delirium e priorizar a busca de causa aguda", "tags": ["osce"], "rel": [], "enun": "Dona Cecília, 82 anos, era lúcida e independente. Há 2 dias ficou confusa, sonolenta pela manhã e agitada à noite, não consegue manter a atenção na conversa e alterna momentos de melhora e piora. Iniciou ardor ao urinar na semana anterior. Qual é a conduta mais adequada?", "ops": [["Considerar delirium e investigar causa clínica aguda antes de atribuir o quadro a demência.", "Correta: início agudo, curso flutuante e desatenção caracterizam delirium, frequentemente reversível, e pedem busca de causa aguda."], ["Diagnosticar síndrome demencial de início recente e iniciar acompanhamento cognitivo ambulatorial.", "Errada: demência tem início insidioso (meses a anos) e curso progressivo; aqui o início foi em dias."], ["Aplicar o MEEM e, se a pontuação for baixa, confirmar demência.", "Errada: o MEEM é rastreio, não diagnostica demência sozinho, e não deve ser usado para rotular quadro agudo."], ["Rastrear depressão com a GDS, pois sonolência e alteração do sono sugerem humor deprimido.", "Errada: a desatenção aguda e flutuante não se explica por depressão; o risco é perder a causa clínica."]], "conc": "Delirium é uma disfunção cerebral aguda: começa em horas a dias, flutua ao longo do dia, compromete muito a atenção e pode alterar o nível de consciência. Frequentemente é potencialmente reversível quando se trata a causa (infecção, medicamento, desidratação, distúrbio metabólico). Demência é insidiosa, progressiva e, no início, costuma preservar atenção e consciência.", "rac": "1) Qual era o basal? Lúcida e independente. 2) Velocidade de mudança: 2 dias, ou seja, aguda. 3) Padrão: flutuante, com inversão sono-vigília. 4) Atenção: muito prejudicada. 5) Gatilho possível: disúria. Conclusão: delirium com provável causa infecciosa.", "pista": "'Ficou confusa de repente' em idosa que estava habitual é a regra de segurança do material.", "mud": "Se a família relatasse esquecimentos progressivos há 2 anos, com atenção preservada e sem flutuação, a hipótese passaria a ser síndrome demencial, e a investigação seria ambulatorial.", "cmp": "Delirium: agudo, flutuante, atenção muito prejudicada, frequentemente reversível. Demência: insidiosa, progressiva, atenção preservada no início, em geral crônica.", "arm": "Atribuir confusão aguda à idade ou a uma 'demência que apareceu'. O delirium pode ser a única manifestação de infecção grave no idoso.", "regra": "Idoso que mudou de repente: pense em delirium e procure a causa clínica.", "cf": "Um idoso com demência conhecida que piora bruscamente em 1 dia após iniciar um novo medicamento também pode ter delirium sobreposto; a piora aguda nunca deve ser atribuída automaticamente à doença de base.", "fonte": "F1, Aula 1, p. 4 (item 5, tabela delirium x demência e regra de segurança)"}, {"n": 5, "sub": "MEEM: alcance e limites", "comp": "Interpretar corretamente um teste de rastreio cognitivo", "tags": [], "rel": [], "enun": "Uma idosa de 71 anos, sem escolaridade formal, obtém pontuação abaixo do esperado no Mini Exame do Estado Mental (MEEM) aplicado na consulta. Não há queixa de perda funcional relatada pela família. Qual interpretação está de acordo com o material?", "ops": [["O MEEM é rastreio; deve ser interpretado pela escolaridade, com história, informante e função.", "Correta: o MEEM não diagnostica demência sozinho e sua interpretação depende da escolaridade."], ["A pontuação baixa confirma demência, pois o MEEM avalia orientação, memória, atenção e linguagem.", "Errada: avaliar vários domínios não transforma o rastreio em diagnóstico."], ["A pontuação baixa indica delirium, pois o MEEM avalia atenção e cálculo.", "Errada: delirium é definido pelo início agudo e flutuação, não por uma pontuação isolada."], ["O MEEM não se aplica a pessoas sem escolaridade e deve ser substituído pela GDS.", "Errada: o MEEM pode ser aplicado com interpretação ajustada; a GDS avalia sintomas depressivos, não cognição."]], "conc": "O MEEM avalia orientação, registro, atenção/cálculo, evocação e linguagem. É um teste de rastreamento: aponta quem precisa de investigação mais detalhada. A escolaridade influencia muito o desempenho, então o mesmo número pode ter significado diferente em pessoas com diferentes anos de estudo.", "rac": "1) Identifique a natureza do teste: rastreio. 2) Identifique o fator de confusão: ausência de escolaridade. 3) Procure repercussão funcional: a família não relata perda. 4) Conclusão: o número sozinho não fecha nada; é preciso história, informante e avaliação funcional.", "pista": "'Sem escolaridade formal' e 'sem perda funcional relatada' são os dados que impedem concluir demência pelo escore.", "mud": "Se houvesse perda progressiva de AIVD (medicamentos, finanças) confirmada por informante confiável, o resultado do MEEM ganharia peso e a investigação de síndrome demencial avançaria.", "cmp": "Rastreio (MEEM, GDS, IVCF-20) seleciona quem investigar. Diagnóstico exige integração de história, exame, informante, repercussão funcional e exclusão de causas.", "arm": "Rotular demência a partir de um único escore, sem considerar escolaridade, visão, audição ou um quadro agudo.", "regra": "MEEM rastreia; não diagnostica. Interprete pela escolaridade e confirme com a função.", "cf": "Um engenheiro aposentado com MEEM 'normal', mas que começou a se perder em locais conhecidos e errar remédios, também merece investigação: o escore normal não exclui declínio em quem tinha alto desempenho prévio.", "fonte": "F1, Aula 1, p. 4 (item 5, MEEM)"}, {"n": 6, "sub": "Humor e comportamento: GDS", "comp": "Reconhecer o papel da GDS e os sintomas a investigar", "tags": [], "rel": [], "enun": "Na avaliação de rotina, um idoso de 80 anos relata desânimo, perda de interesse por atividades de que gostava, sono ruim e diz que 'a vida perdeu o sentido'. A versão curta da Escala de Depressão Geriátrica (GDS-15) vem alterada. Qual conduta é coerente com o material?", "ops": [["Prosseguir com avaliação clínica, perguntando diretamente sobre ideação suicida.", "Correta: GDS alterada exige avaliação clínica; desesperança e falta de sentido na vida obrigam investigar ideação suicida."], ["Confirmar o diagnóstico de depressão maior com base na GDS alterada.", "Errada: a GDS não substitui o diagnóstico; é ferramenta de rastreamento."], ["Considerar os sintomas próprios do envelhecimento e apenas repetir a escala em um ano.", "Errada: tristeza persistente e anedonia não são normais da idade e não devem ser adiadas."], ["Aplicar o TUG, pois a desmotivação costuma ser secundária ao medo de cair.", "Errada: o TUG avalia mobilidade; não investiga o humor, embora medo de cair também mereça atenção."]], "conc": "Na avaliação do humor, procure tristeza persistente, perda de prazer (anedonia), alterações de sono e apetite, fadiga, culpa, desesperança e ideação suicida. Também observe mudanças comportamentais: apatia, irritabilidade, agitação, delírios, alucinações, desinibição e inversão do ciclo sono-vigília. A GDS (versões 15 ou 5 itens) é rastreio.", "rac": "1) Os sintomas descritos são do domínio humor. 2) O instrumento aplicado (GDS) é de rastreio, então não fecha diagnóstico. 3) Há frase de desesperança, que é sinal de alerta. 4) O próximo passo é avaliação clínica dirigida, incluindo risco de suicídio.", "pista": "'A vida perdeu o sentido' é desesperança, um dos sinais listados no material e um alerta para ideação suicida.", "mud": "Se, em vez de tristeza, houvesse alucinações e agitação de início súbito, o foco deixaria de ser humor e passaria a ser delirium ou alteração comportamental com causa a investigar.", "cmp": "Apatia (falta de iniciativa, comum em síndromes demenciais) não é o mesmo que tristeza com desesperança (humor deprimido), embora possam coexistir.", "arm": "Normalizar tristeza no idoso e não perguntar sobre suicídio por receio de 'induzir a ideia'. Perguntar de forma direta e acolhedora faz parte da avaliação.", "regra": "GDS alterada = avaliar clinicamente; desesperança = perguntar sobre ideação suicida.", "cf": "Uma idosa com GDS normal, mas com apatia, desinibição e mudança recente de personalidade relatada pela família, merece investigação de alteração comportamental mesmo sem sintomas depressivos típicos.", "fonte": "F1, Aula 1, p. 4 (item 6, humor e comportamento; GDS)"}, {"n": 7, "sub": "Comunicação: visão, audição, fala e linguagem", "comp": "Avaliar os domínios da comunicação antes de concluir déficit cognitivo", "tags": ["osce"], "rel": [], "enun": "Na estação de OSCE, o acompanhante diz que o pai, de 84 anos, 'não entende mais nada do que falam com ele'. O paciente responde de forma adequada quando o examinador fala de frente e em voz mais alta, mas erra quando a fala é baixa ou vem de trás. Qual é o passo mais adequado?", "ops": [["Avaliar a audição: queixa funcional, otoscopia e teste da voz sussurrada.", "Correta: antes de concluir que o paciente 'não entende', verifique se ele consegue ouvir; os dados sugerem déficit auditivo."], ["Aplicar o MEEM para confirmar déficit cognitivo, já relatado pelo acompanhante.", "Errada: aplicar teste cognitivo em paciente que não ouve bem gera falso resultado alterado."], ["Classificar o quadro como afasia, pois há dificuldade de compreender a linguagem.", "Errada: afasia é distúrbio da linguagem; aqui a compreensão melhora quando o som é adequado, o que aponta para audição."], ["Avaliar a acuidade visual com a tabela de Snellen como primeiro exame.", "Errada: a visão também faz parte da comunicação, mas os dados apontam para via auditiva."]], "conc": "A comunicação depende de ouvir, enxergar, articular a fala, processar a linguagem e ter cognição para compreender e responder. Visão: queixas, uso de óculos, acuidade com tabela de Snellen. Audição: queixa funcional, otoscopia, teste da voz sussurrada e audiometria se indicada. Fala/linguagem: distinguir disartria (articulação) de afasia (linguagem).", "rac": "O dado decisivo é que o desempenho muda conforme volume e posição da fala. Isso indica problema de entrada sensorial auditiva, não de compreensão central. Por isso, a audição deve ser avaliada antes de qualquer rastreio cognitivo.", "pista": "Responde bem quando falam de frente e mais alto; erra quando a fala é baixa ou vem de trás.", "mud": "Se ele ouvisse bem, mas produzisse frases sem sentido e não compreendesse ordens simples, a hipótese passaria a ser afasia; se compreendesse, mas falasse com voz arrastada e mal articulada, seria disartria.", "cmp": "Disartria = problema motor de articulação, com linguagem preservada. Afasia = problema de linguagem (compreender e/ou produzir), com articulação possivelmente normal.", "arm": "Concluir 'demência' em idoso com hipoacusia ou baixa visão não corrigida. O déficit sensorial pode imitar ou agravar o déficit cognitivo.", "regra": "Antes de dizer que o idoso 'não entende', confirme que ele ouve e enxerga.", "cf": "Uma idosa que deixou de ler e de reconhecer pessoas à distância pode ter catarata ou outra perda visual; avaliar acuidade visual vem antes de atribuir o isolamento a déficit cognitivo.", "fonte": "F1, Aula 1, pp. 4–5 (item 7, comunicação)"}, {"n": 8, "sub": "Mobilidade e quedas: TUG", "comp": "Executar e interpretar o Timed Up and Go", "tags": ["osce", "calculo"], "rel": [], "enun": "Em uma estação de OSCE, você aplica o Timed Up and Go em uma idosa de 79 anos que teve duas quedas no último ano. Ela realiza o teste em 16 segundos, com marcha lenta e apoio nos móveis. Qual alternativa descreve corretamente a sequência do teste e a interpretação?", "ops": [["Levantar da cadeira, andar cerca de 3 m, virar, voltar e sentar; tempo acima de 12 s sugere maior risco de queda, interpretado com o contexto clínico.", "Correta: é a sequência do TUG e o ponto de corte usado em muitos protocolos, sem ser diagnóstico isolado."], ["Levantar da cadeira, andar cerca de 3 m e parar em pé; tempo acima de 12 s confirma sarcopenia.", "Errada: o teste inclui virar, voltar e sentar, e não diagnostica sarcopenia."], ["Levantar e sentar da cadeira cinco vezes; mais de 12 s indica fraqueza de membros inferiores.", "Errada: descreve o teste de sentar e levantar, outro teste útil, não o TUG."], ["Andar cerca de 3 m a partir da posição em pé; tempo abaixo de 16 s exclui risco de queda.", "Errada: o teste começa sentado, e nenhum tempo isolado exclui risco, sobretudo com quedas prévias."]], "conc": "O TUG avalia mobilidade funcional: o paciente parte sentado, levanta, anda cerca de 3 metros, vira, volta e senta. Em muitos protocolos, mais de 12 segundos é usado como sinal de maior risco de queda, mas o resultado deve ser interpretado junto do contexto (história de quedas, medo de cair, tontura postural, auxílio de marcha). Outros testes úteis: sentar e levantar da cadeira, velocidade da marcha, equilíbrio e força (MRC).", "rac": "1) Confira a sequência: sentado, levanta, anda, vira, volta, senta. 2) Compare o tempo: 16 s está acima de 12 s. 3) Some o contexto: duas quedas no ano e apoio nos móveis. 4) Conclusão: risco de queda aumentado, que pede plano de prevenção.", "pista": "A sequência completa termina com o paciente sentado de novo.", "mud": "Se ela fizesse o teste em 9 s, sem quedas, sem medo de cair e sem tontura, o risco seria menor, mas ainda assim o resultado não seria um 'atestado' isolado de ausência de risco.", "cmp": "TUG = mobilidade e risco de queda. Sentar e levantar = força de membros inferiores. Velocidade da marcha = desempenho global. MRC = força muscular graduada.", "arm": "Esquecer de perguntar sobre quedas no último ano, tontura ao levantar e uso de bengala/andador, que pesam tanto quanto o tempo do teste.", "regra": "TUG: sentado → levanta → 3 m → vira → volta → senta. Mais de 12 s = maior risco, sempre com contexto.", "cf": "No roteiro de OSCE de 1 minuto, após mobilidade e quedas, o candidato ainda deve abordar cognição, humor, visão/audição, revisão de medicamentos e rede de apoio antes de sintetizar o risco funcional.", "fonte": "F1, Aula 1, p. 5 (item 8, TUG e roteiro de OSCE)"}]}, {"id": "A02", "titulo": "DRGE: manifestações clínicas, complicações, diagnóstico e tratamento", "arq": "F1", "pags": "6–7 e 21–22", "bloco": 2, "q": [{"n": 1, "sub": "Conceito de DRGE", "comp": "Distinguir refluxo fisiológico ocasional de doença", "tags": [], "rel": [], "enun": "Um estudante de 22 anos relata que, uma ou duas vezes por mês, após jantares muito volumosos, sente leve queimação retroesternal que passa espontaneamente em minutos. Não tem outros sintomas e não se sente incomodado no dia a dia. Pelo conceito apresentado no material, como classificar esse quadro?", "ops": [["Refluxo ocasional, que não é sinônimo de doença, pois não produz sintomas incômodos nem complicações.", "Correta: DRGE exige sintomas incômodos e/ou complicações; refluxo esporádico e tolerável não preenche o conceito."], ["DRGE, pois qualquer episódio de pirose indica refluxo patológico.", "Errada: a pirose isolada e ocasional não define doença; o critério é o incômodo e/ou as complicações."], ["Dispepsia funcional, pois o sintoma surge após refeições volumosas.", "Errada: queimação retroesternal é pirose, sintoma esofágico; dispepsia é epigástrica."], ["Esofagite erosiva provável, que exige endoscopia para confirmação.", "Errada: não há sinais de alarme nem sintomas relevantes que justifiquem presumir lesão ou indicar EDA."]], "conc": "A doença do refluxo gastroesofágico ocorre quando o refluxo do conteúdo gástrico para o esôfago produz sintomas incômodos e/ou complicações (esofagite, estenose, Barrett, sangramento). Algum refluxo é fisiológico; ele só vira doença quando prejudica a qualidade de vida ou lesa o esôfago.", "rac": "Pergunte: há sintomas incômodos? Não, são raros, leves e autolimitados. Há complicações ou alarmes? Não. Então é refluxo ocasional, que pode ser abordado com orientação sobre gatilhos individuais, como refeição volumosa.", "pista": "'Não se sente incomodado' e 'uma ou duas vezes por mês'.", "mud": "Se a pirose ocorresse várias vezes por semana, atrapalhando o sono e o trabalho, o quadro passaria a ser DRGE típica, com indicação de teste terapêutico com IBP.", "cmp": "Refluxo ocasional: fisiológico, sem impacto. DRGE: sintomas incômodos e/ou complicações.", "arm": "Tratar todo episódio de azia como doença e prescrever IBP prolongado sem indicação.", "regra": "Refluxo só vira DRGE quando incomoda ou complica.", "cf": "Um paciente com pouca pirose, mas com estenose péptica na endoscopia, tem DRGE pela complicação, mesmo que os sintomas sejam discretos.", "fonte": "F1, Aula 2, p. 6 (item 1, conceito)"}, {"n": 2, "sub": "Quadro típico e conduta inicial", "comp": "Indicar o teste terapêutico com IBP na DRGE típica sem alarme", "tags": [], "rel": ["A03"], "enun": "Mulher de 38 anos relata, há 3 meses, queimação retroesternal ascendente várias vezes por semana e retorno de conteúdo amargo à boca sem esforço de vômito, piores ao deitar. Nega disfagia, odinofagia, perda de peso, vômitos e sangramento. Qual é o próximo passo mais adequado?", "ops": [["Teste terapêutico com IBP por período definido, com reavaliação, associado a medidas comportamentais.", "Correta: pirose + regurgitação sem alarme = quadro típico, abordado inicialmente com teste terapêutico com IBP."], ["Endoscopia digestiva alta imediata para confirmar o diagnóstico e graduar a esofagite antes de tratar.", "Errada: EDA é indicada principalmente diante de sinais de alarme ou necessidade de avaliar lesão estrutural."], ["pH-impedanciometria antes de qualquer tratamento.", "Errada: a monitorização de refluxo é reservada a dúvida diagnóstica com EDA normal."], ["Encaminhamento para avaliação de cirurgia antirrefluxo.", "Errada: terapia invasiva é para casos selecionados, com DRGE objetivamente comprovada e sintomas persistentes ou complicações."]], "conc": "Pirose (queimação retroesternal, frequentemente ascendente) e regurgitação (retorno de conteúdo ácido/amargo à boca sem esforço de vômito) formam o quadro típico da DRGE. Sem sinais de alarme, a abordagem inicial é clínica: teste terapêutico com IBP por período definido e reavaliação, junto com medidas comportamentais.", "rac": "1) Identifique os sintomas típicos: pirose e regurgitação. 2) Pesquise alarmes: todos negados. 3) Escolha a conduta da linha 'sem alarme' do fluxograma: teste terapêutico com IBP. 4) Piora ao deitar sugere também elevar a cabeceira e evitar refeições perto de deitar.", "pista": "Dois sintomas típicos e todos os alarmes negados.", "mud": "A presença de disfagia, perda ponderal, anemia ou vômitos persistentes mudaria a conduta para endoscopia digestiva alta.", "cmp": "Regurgitação: retorno passivo de conteúdo sem esforço. Vômito: expulsão ativa com contração abdominal.", "arm": "Pedir EDA para todo paciente com azia típica, sem alarme, como se fosse obrigatória para o diagnóstico.", "regra": "Pirose + regurgitação sem alarme = teste terapêutico com IBP e reavaliação.", "cf": "Se após o teste terapêutico os sintomas persistirem e o diagnóstico continuar duvidoso, a investigação avança: EDA e, se normal, monitorização ambulatorial do refluxo.", "fonte": "F1, Aula 2, pp. 6–7 (itens 2, 3 e 5) e p. 21 (figura 2)"}, {"n": 3, "sub": "Sinais de alarme", "comp": "Reconhecer sinais de alarme que mudam a investigação", "tags": [], "rel": ["A03", "A06"], "enun": "Homem de 61 anos com pirose há anos, usando antiácidos por conta própria, relata que há 2 meses 'a comida para no meio do peito' e que perdeu 7 kg sem tentar. Qual é a conduta adequada?", "ops": [["Endoscopia digestiva alta, pois disfagia e perda de peso involuntária são sinais de alarme.", "Correta: sinal de alarme muda a investigação e geralmente leva à EDA."], ["Teste terapêutico com IBP por 8 semanas e reavaliação.", "Errada: o teste terapêutico é para quadro típico sem alarme; aqui há dois alarmes."], ["pHmetria esofágica de 24 horas para quantificar a exposição ácida antes de qualquer exame endoscópico.", "Errada: a monitorização de refluxo não avalia lesão estrutural, que é a preocupação diante de disfagia e emagrecimento."], ["Medidas comportamentais e perda de peso, com retorno em 3 meses.", "Errada: adiar a investigação diante de disfagia progressiva e emagrecimento é inseguro."]], "conc": "Sinais de alarme na DRGE: disfagia, odinofagia, perda de peso involuntária, sangramento digestivo ou anemia, vômitos persistentes e massa ou achado suspeito. Eles sugerem possível lesão estrutural (estenose, úlcera, neoplasia) e indicam endoscopia digestiva alta.", "rac": "1) Paciente com DRGE de longa data. 2) Sintoma novo: disfagia (dificuldade de passagem do alimento). 3) Emagrecimento involuntário de 7 kg. 4) Dois alarmes: o próximo passo é EDA, não tratamento empírico.", "pista": "'A comida para no meio do peito' é disfagia.", "mud": "Se ele tivesse apenas pirose e regurgitação, sem disfagia e sem perda de peso, o teste terapêutico com IBP seria aceitável.", "cmp": "Disfagia = dificuldade de passagem do alimento. Odinofagia = dor ao engolir. Ambas são sinais de alarme.", "arm": "Manter IBP indefinidamente em paciente com DRGE crônica sem valorizar sintoma novo de disfagia.", "regra": "DRGE com alarme → EDA.", "cf": "Uma paciente com pirose e anemia ferropriva sem causa aparente também tem sinal de alarme e deve ser submetida a EDA, ainda que não relate sangramento visível.", "fonte": "F1, Aula 2, p. 6 (item 3, sinais de alarme e conduta) e p. 20 (revisão, item 6)"}, {"n": 4, "sub": "EDA normal e monitorização do refluxo", "comp": "Escolher o exame quando o diagnóstico permanece duvidoso", "tags": [], "rel": [], "enun": "Paciente de 45 anos com sintomas atribuídos à DRGE não melhorou como esperado com IBP. A endoscopia digestiva alta foi normal, e o diagnóstico permanece duvidoso. A equipe quer documentar refluxos ácidos, fracamente ácidos e não ácidos e relacioná-los aos sintomas. Qual exame atende a esse objetivo?", "ops": [["pH-impedanciometria esofágica.", "Correta: detecta refluxos ácidos, fracamente ácidos e não ácidos e relaciona os episódios aos sintomas."], ["pHmetria esofágica convencional.", "Errada: avalia a exposição ácida e a relação temporal com sintomas, mas não detecta bem refluxos não ácidos."], ["Nova endoscopia digestiva alta com biópsias.", "Errada: a EDA já foi normal; ela avalia lesão estrutural, não episódios de refluxo."], ["Teste respiratório da ureia.", "Errada: é teste para infecção ativa por H. pylori, usado na dispepsia, não na DRGE."]], "conc": "Quando a EDA é normal e o diagnóstico continua duvidoso, faz-se monitorização ambulatorial do refluxo. A pHmetria mede a exposição do esôfago ao ácido e a relação temporal com sintomas. A pH-impedanciometria também detecta movimento de conteúdo, identificando refluxos ácidos, fracamente ácidos e não ácidos.", "rac": "1) EDA normal: não há lesão estrutural visível. 2) Dúvida persiste: indicação de monitorização. 3) Objetivo inclui refluxos não ácidos: só a pH-impedanciometria detecta esse tipo.", "pista": "'Fracamente ácidos e não ácidos' só aparece no material associado à pH-impedanciometria.", "mud": "Se o objetivo fosse apenas quantificar a exposição ácida e correlacionar com sintomas, a pHmetria convencional seria suficiente.", "cmp": "pHmetria: exposição a ácido + relação temporal. pH-impedanciometria: ácidos, fracamente ácidos e não ácidos + relação com sintomas.", "arm": "Interpretar EDA normal como exclusão de DRGE. Muitos pacientes têm doença com mucosa endoscopicamente normal.", "regra": "Alarme → EDA. EDA normal com dúvida → pHmetria ou pH-impedanciometria.", "cf": "Um paciente com tosse crônica e EDA normal, sem resposta ao IBP, também pode precisar de monitorização para saber se o refluxo de fato se relaciona com a tosse antes de atribuí-la à DRGE.", "fonte": "F1, Aula 2, pp. 6–7 (item 5, tabela de diagnóstico; pHmetria x pH-impedanciometria)"}, {"n": 5, "sub": "Manifestações extraesofágicas e dor torácica", "comp": "Atribuir com cautela sintomas atípicos à DRGE", "tags": [], "rel": [], "enun": "Homem de 58 anos, hipertenso e tabagista, procura o pronto-atendimento com dor torácica em queimação há 40 minutos. Tem história de pirose e acha que 'é o refluxo de sempre'. Qual é a conduta adequada em relação à hipótese de DRGE?", "ops": [["Excluir causa cardíaca conforme o contexto antes de atribuir a dor torácica à DRGE.", "Correta: a dor torácica pode ocorrer na DRGE, mas a causa cardíaca deve ser excluída conforme o contexto."], ["Iniciar IBP e liberar o paciente, pois a história prévia de pirose confirma a origem esofágica.", "Errada: o antecedente de pirose não exclui síndrome coronariana em paciente com fatores de risco."], ["Solicitar pH-impedanciometria de urgência para correlacionar a dor com refluxo.", "Errada: o exame é ambulatorial e não é prioridade diante de possível causa cardíaca."], ["Atribuir a dor à DRGE, pois manifestações extraesofágicas são específicas da doença.", "Errada: o material afirma que manifestações atípicas são pouco específicas."]], "conc": "A DRGE pode causar dor torácica e manifestações extraesofágicas (tosse crônica, rouquidão/laringite, piora de sintomas respiratórios), mas essas manifestações são pouco específicas. Por isso, o material orienta evitar atribuí-las automaticamente à DRGE e, na dor torácica, excluir causa cardíaca conforme o contexto.", "rac": "1) Sintoma: dor torácica aguda. 2) Contexto: homem de 58 anos, hipertenso, tabagista, isto é, risco cardiovascular. 3) A história de pirose não muda a obrigação de excluir causa potencialmente fatal. 4) Só depois se considera DRGE.", "pista": "Dor torácica em paciente com fatores de risco cardiovascular.", "mud": "Em um paciente jovem, com avaliação cardiológica já negativa e dor sempre relacionada a refeições e decúbito, a hipótese esofágica ganharia força.", "cmp": "Sintomas típicos (pirose, regurgitação) têm boa relação com DRGE. Sintomas atípicos (dor torácica, tosse, rouquidão) são pouco específicos e exigem exclusão de outras causas.", "arm": "Ancoragem no diagnóstico prévio: o paciente diz 'é o refluxo' e o médico aceita sem excluir infarto.", "regra": "Dor torácica: primeiro exclua o coração, depois pense no esôfago.", "cf": "Um paciente com rouquidão persistente e tabagismo não deve ter o sintoma atribuído à DRGE sem avaliação da laringe, porque a manifestação é inespecífica.", "fonte": "F1, Aula 2, p. 6 (item 2, manifestações típicas e extraesofágicas)"}, {"n": 6, "sub": "Esôfago de Barrett", "comp": "Definir Barrett e seu significado prognóstico", "tags": [], "rel": [], "enun": "A biópsia do esôfago distal de um paciente com DRGE de longa data mostra metaplasia intestinal, sem displasia. O paciente pergunta se tem câncer. Qual é a resposta correta?", "ops": [["Não; é esôfago de Barrett, uma metaplasia intestinal que aumenta o risco de adenocarcinoma esofágico.", "Correta: Barrett é metaplasia, não câncer, mas é fator de risco para adenocarcinoma."], ["Sim; é esôfago de Barrett, forma inicial de adenocarcinoma esofágico.", "Errada: Barrett não é câncer por definição; é uma alteração pré-maligna."], ["Não; é esofagite erosiva, que tende a evoluir para carcinoma espinocelular.", "Errada: esofagite é inflamação/erosão; a metaplasia intestinal define Barrett, cujo risco é de adenocarcinoma."], ["Não; é estenose péptica, uma cicatrização sem significado neoplásico.", "Errada: estenose é complicação fibrótica que estreita o lúmen, não alteração do epitélio."]], "conc": "A agressão crônica pelo refluxo pode levar o epitélio do esôfago distal a ser substituído por epitélio do tipo intestinal (metaplasia intestinal). Isso é o esôfago de Barrett. Ele não é câncer, mas aumenta o risco de adenocarcinoma esofágico, o que justifica acompanhamento.", "rac": "1) Achado: metaplasia intestinal no esôfago distal. 2) Definição: Barrett. 3) Natureza: metaplasia, não neoplasia. 4) Significado: risco aumentado de adenocarcinoma.", "pista": "'Metaplasia intestinal, sem displasia'.", "mud": "Se a biópsia mostrasse células neoplásicas invadindo a lâmina própria, aí sim haveria adenocarcinoma, e não apenas Barrett.", "cmp": "Metaplasia = troca de um tipo de epitélio por outro (adaptação). Neoplasia = proliferação anormal e autônoma. Barrett é a primeira situação.", "arm": "Dizer ao paciente que ele 'tem câncer' por ter Barrett, ou, no extremo oposto, dizer que o achado não tem importância.", "regra": "Barrett = metaplasia intestinal; não é câncer, mas aumenta o risco de adenocarcinoma.", "cf": "Um paciente com Barrett que passa a ter disfagia progressiva e emagrecimento precisa de nova EDA, pois os sinais de alarme podem indicar progressão neoplásica.", "fonte": "F1, Aula 2, p. 6 (item 4, Barrett) e p. 20 (revisão, item 7)"}, {"n": 7, "sub": "Complicações: esofagite e estenose", "comp": "Reconhecer a sequência que leva à estenose péptica", "tags": [], "rel": [], "enun": "Homem de 66 anos com DRGE não tratada por muitos anos relata disfagia progressiva, primeiro para sólidos. A endoscopia mostra estreitamento regular do esôfago distal, com fibrose, sem lesão vegetante. Qual mecanismo explica melhor o achado?", "ops": [["Refluxo repetido causou esofagite e erosões; a cicatrização com fibrose levou à estenose péptica.", "Correta: é a cadeia de complicações descrita: refluxo → esofagite → erosão/úlcera → sangramento → cicatrização → estenose."], ["Metaplasia intestinal do epitélio, que reduz o calibre do esôfago.", "Errada: Barrett é troca de epitélio, não fibrose que estreita o lúmen."], ["Hérnia hiatal volumosa comprimindo externamente o esôfago distal e reduzindo progressivamente o seu calibre.", "Errada: o achado é estreitamento fibrótico da parede, típico da cicatrização."], ["Espasmo esofágico por exposição ácida, que desaparece com o IBP.", "Errada: espasmo é funcional e transitório; a fibrose é estrutural."]], "conc": "A exposição repetida ao refluxo inflama a mucosa (esofagite), que pode evoluir com erosões e úlceras, às vezes sangrantes. O reparo dessas lesões ocorre com cicatrização e fibrose, e a retração cicatricial estreita o lúmen: é a estenose péptica.", "rac": "1) DRGE de longa data sem tratamento. 2) Disfagia progressiva para sólidos, sugerindo obstrução mecânica. 3) EDA: estreitamento regular com fibrose, sem tumor. 4) Mecanismo: cicatrização de lesões inflamatórias.", "pista": "'Estreitamento regular com fibrose'.", "mud": "Se a EDA mostrasse lesão vegetante e irregular, a hipótese principal seria neoplasia, com biópsia obrigatória.", "cmp": "Estenose péptica: complicação fibrótica de lesão inflamatória. Barrett: complicação metaplásica do epitélio. Ambas decorrem da agressão crônica.", "arm": "Esquecer que a disfagia na DRGE é sinal de alarme e assumir que se trata apenas de 'refluxo mais forte'.", "regra": "Refluxo → esofagite → erosão/úlcera → sangramento → cicatrização → estenose.", "cf": "Um paciente com esofagite erosiva e melena pode estar na etapa de sangramento da mesma cadeia, o que conecta a DRGE às causas de hemorragia digestiva alta.", "fonte": "F1, Aula 2, p. 6 (item 4, complicações) e p. 21 (figura 2, complicações principais)"}, {"n": 8, "sub": "Tratamento: medidas comportamentais e IBP", "comp": "Prescrever medidas comportamentais e explicar o IBP", "tags": [], "rel": [], "enun": "Paciente com DRGE típica, IMC 31 kg/m², piora noturna dos sintomas e hábito de jantar e deitar logo em seguida. Vai iniciar omeprazol. Qual orientação está de acordo com o material?", "ops": [["Perder peso, evitar refeições perto de deitar, elevar a cabeceira e tomar o IBP antes da refeição, conforme o esquema prescrito.", "Correta: são as medidas comportamentais do material, e o IBP é em geral tomado antes da refeição."], ["Suspender café, chocolate, cítricos e frituras para todos os pacientes, e tomar o IBP após a refeição.", "Errada: o material orienta identificar gatilhos individuais, não proibir alimentos universalmente; e o IBP costuma ser antes da refeição."], ["Deitar logo após o jantar para acelerar o esvaziamento gástrico e tomar o IBP ao deitar.", "Errada: deitar perto da refeição piora o refluxo noturno."], ["Indicar cirurgia antirrefluxo de imediato, pois a obesidade torna o IBP ineficaz.", "Errada: terapia invasiva é para casos selecionados, com doença objetivamente comprovada e sintomas persistentes ou complicações."]], "conc": "Medidas comportamentais: perda de peso quando há sobrepeso/obesidade; evitar refeições muito próximas de deitar; elevar a cabeceira se o refluxo for noturno; reconhecer e reduzir gatilhos individuais. Os IBP (omeprazol, pantoprazol, esomeprazol) bloqueiam a H+/K+-ATPase da célula parietal e reduzem a secreção ácida; em geral são tomados antes da refeição.", "rac": "1) Obesidade: perda de peso. 2) Sintomas noturnos e jantar seguido de deitar: evitar refeição perto de deitar e elevar a cabeceira. 3) IBP: antes da refeição. 4) Restrições alimentares: individualizadas.", "pista": "Cada medida da alternativa correta corresponde a um dado do caso (IMC, piora noturna, jantar e deitar).", "mud": "Em paciente com DRGE objetivamente comprovada, sintomas persistentes relevantes, grande hérnia hiatal ou complicações, pode-se encaminhar para avaliação de terapia invasiva.", "cmp": "IBP age na bomba de prótons (etapa final da secreção ácida). Medidas comportamentais reduzem a oportunidade de refluxo.", "arm": "Entregar lista padronizada de alimentos proibidos, que piora a adesão sem respaldo individual.", "regra": "Peso, horário das refeições, cabeceira e gatilhos individuais + IBP antes da refeição.", "cf": "Um paciente magro, com sintomas apenas diurnos após refeições muito gordurosas, se beneficia mais de reconhecer esse gatilho do que de elevar a cabeceira.", "fonte": "F1, Aula 2, p. 7 (item 6, tratamento; quando pensar em cirurgia)"}]}, {"id": "A03", "titulo": "Dispepsias: manifestações clínicas, diagnóstico e tratamento", "arq": "F1", "pags": "8–9 e 22", "bloco": 2, "q": [{"n": 1, "sub": "Dispepsia como síndrome; queimação epigástrica x pirose", "comp": "Localizar o sintoma para diferenciar dispepsia de DRGE", "tags": [], "rel": ["A02"], "enun": "Paciente de 35 anos relata 'queimação' há 2 meses. Ao ser solicitado a apontar o local, indica a região logo abaixo do apêndice xifoide, sem irradiação para cima e sem retorno de conteúdo à boca. Como o sintoma deve ser classificado?", "ops": [["Queimação epigástrica, sintoma de dispepsia.", "Correta: a localização epigástrica, sem ascensão retroesternal, define queimação epigástrica, sintoma central da dispepsia."], ["Pirose, sintoma típico de DRGE.", "Errada: pirose é queimação retroesternal, frequentemente ascendente; aqui é epigástrica."], ["Regurgitação, sintoma típico de DRGE.", "Errada: regurgitação é retorno de conteúdo à boca, negado pelo paciente."], ["Plenitude pós-prandial, sintoma de dispepsia.", "Errada: plenitude é sensação de estômago cheio após comer, não queimação."]], "conc": "Dispepsia é uma síndrome, não uma doença única: descreve sintomas originados na região gastroduodenal. Seus sintomas centrais são dor epigástrica, queimação epigástrica, plenitude pós-prandial e saciedade precoce. Queimação epigástrica não é sinônimo de pirose, que é retroesternal.", "rac": "O dado decisivo é a localização. Peça ao paciente para apontar: epigástrio = dispepsia; atrás do esterno, subindo = pirose (DRGE). A ausência de regurgitação reforça.", "pista": "'Logo abaixo do apêndice xifoide, sem irradiação para cima'.", "mud": "Se a queimação subisse por trás do esterno e houvesse regurgitação ácida, o quadro seria de DRGE típica.", "cmp": "Dispepsia: epigástrica. Pirose da DRGE: retroesternal. Podem coexistir, mas são conceitos diferentes.", "arm": "Aceitar a palavra 'queimação' ou 'azia' do paciente sem localizar o sintoma.", "regra": "Peça para apontar: epigástrio é dispepsia; retroesterno é pirose.", "cf": "Um paciente com queimação epigástrica e, em outros momentos, pirose retroesternal com regurgitação pode ter dispepsia e DRGE ao mesmo tempo.", "fonte": "F1, Aula 3, p. 8 (item 1) e p. 9 (quadro 'Diferencie')"}, {"n": 2, "sub": "Dispepsia orgânica x funcional", "comp": "Definir dispepsia funcional", "tags": [], "rel": [], "enun": "Mulher de 32 anos com dor epigástrica recorrente há 8 meses fez investigação apropriada: pesquisa de H. pylori negativa, endoscopia normal, sem uso de AINEs e exames laboratoriais normais. Os sintomas persistem. Como classificar o quadro?", "ops": [["Dispepsia funcional: sintomas típicos sem doença estrutural que os explique após investigação.", "Correta: é a definição do material para dispepsia funcional."], ["Dispepsia orgânica, pois os sintomas são persistentes há mais de 6 meses e não respondem ao tratamento.", "Errada: a cronicidade não define dispepsia orgânica; é necessária causa estrutural/metabólica."], ["DRGE não erosiva, pois a endoscopia é normal.", "Errada: dor epigástrica não é sintoma típico de DRGE; endoscopia normal não leva automaticamente a esse diagnóstico."], ["Úlcera péptica cicatrizada, que não aparece mais na endoscopia.", "Errada: é suposição sem base; a investigação não identificou causa estrutural."]], "conc": "Dispepsia orgânica tem causa estrutural ou metabólica que explica os sintomas (úlcera péptica, neoplasia, pancreatopatia, fármacos como AINEs, H. pylori). Dispepsia funcional é a presença de sintomas típicos sem doença estrutural capaz de explicá-los após investigação apropriada.", "rac": "1) Sintoma dispéptico típico (dor epigástrica). 2) Investigação adequada: H. pylori negativo, EDA normal, sem AINEs. 3) Nenhuma causa encontrada. 4) Classificação: funcional.", "pista": "'Investigação apropriada' sem causa identificada.", "mud": "Se a EDA mostrasse úlcera duodenal, o quadro seria dispepsia orgânica, com causa a tratar.", "cmp": "Orgânica: há explicação estrutural/metabólica. Funcional: sintomas reais sem lesão estrutural que os explique.", "arm": "Achar que dispepsia funcional significa sintoma 'imaginário'. Os sintomas são reais; o que falta é lesão estrutural.", "regra": "Sintomas dispépticos + investigação apropriada sem causa = dispepsia funcional.", "cf": "Um paciente com dispepsia que usa ibuprofeno diariamente tem possível causa orgânica (fármaco) a revisar antes de qualquer rótulo de dispepsia funcional.", "fonte": "F1, Aula 3, p. 8 (item 2, tabela orgânica x funcional)"}, {"n": 3, "sub": "Roma IV: síndrome do desconforto pós-prandial", "comp": "Classificar o fenótipo da dispepsia funcional", "tags": [], "rel": [], "enun": "Paciente com dispepsia funcional já confirmada relata: 'como pouco e já fico cheia' e 'depois do almoço fico com o estômago pesado por horas'. Não tem dor nem queimação relevantes. Pelos critérios de Roma IV, qual é o fenótipo?", "ops": [["Síndrome do desconforto pós-prandial.", "Correta: predominam saciedade precoce e plenitude pós-prandial."], ["Síndrome da dor epigástrica.", "Errada: esse fenótipo é definido por dor e queimação epigástricas, ausentes aqui."], ["Dispepsia orgânica por gastroparesia diabética.", "Errada: o caso informa dispepsia funcional já confirmada, sem causa estrutural."], ["DRGE com manifestação pós-prandial.", "Errada: não há pirose nem regurgitação."]], "conc": "Roma IV divide a dispepsia funcional em dois fenótipos: síndrome do desconforto pós-prandial (plenitude pós-prandial e saciedade precoce) e síndrome da dor epigástrica (dor e queimação epigástricas).", "rac": "'Como pouco e já fico cheia' = saciedade precoce. 'Estômago pesado depois do almoço' = plenitude pós-prandial. Ambos pertencem ao desconforto pós-prandial.", "pista": "A frase típica do material: 'como pouco e já fico cheia'.", "mud": "Se a queixa principal fosse dor e ardor no epigástrio, inclusive em jejum, o fenótipo seria síndrome da dor epigástrica.", "cmp": "Desconforto pós-prandial: cheio cedo e depois de comer. Dor epigástrica: dor e queimação no epigástrio.", "arm": "Confundir saciedade precoce (fica satisfeito antes de terminar a refeição) com perda de apetite (não tem vontade de comer).", "regra": "Cheio cedo ou depois de comer = desconforto pós-prandial.", "cf": "Se a mesma paciente perdesse peso sem querer, o sintoma de saciedade deixaria de ser apenas fenótipo funcional e passaria a ser contexto de alarme, exigindo EDA.", "fonte": "F1, Aula 3, p. 8 (item 3, Roma IV e memória rápida) e p. 22 (figura 3)"}, {"n": 4, "sub": "Roma IV: síndrome da dor epigástrica", "comp": "Reconhecer o fenótipo de dor epigástrica", "tags": [], "rel": [], "enun": "Homem de 29 anos, com dispepsia funcional já documentada após investigação apropriada, descreve dor e ardor no epigástrio, intermitentes, que não se relacionam claramente às refeições. Não relata saciedade precoce. Qual fenótipo de Roma IV corresponde ao quadro?", "ops": [["Síndrome da dor epigástrica.", "Correta: predominam dor e queimação epigástricas."], ["Síndrome do desconforto pós-prandial.", "Errada: exige predomínio de plenitude pós-prandial e saciedade precoce."], ["Síndrome do intestino irritável.", "Errada: é distúrbio do hábito intestinal com dor abdominal; não é fenótipo de dispepsia."], ["Pirose funcional da DRGE.", "Errada: pirose é retroesternal; aqui o sintoma é epigástrico."]], "conc": "Na síndrome da dor epigástrica, predominam dor epigástrica e queimação epigástrica. No desconforto pós-prandial, predominam plenitude e saciedade precoce. A separação ajuda a organizar o raciocínio e o tratamento.", "rac": "Sintomas predominantes: dor e ardor epigástricos. Ausência de saciedade precoce. Classificação: síndrome da dor epigástrica.", "pista": "Dor + ardor no epigástrio, sem saciedade.", "mud": "Se ele passasse a ter vômitos persistentes, o quadro deixaria de ser apenas funcional e exigiria investigação por sinal de alarme.", "cmp": "Os dois fenótipos são funcionais; diferem pelo sintoma predominante, não pela presença de lesão.", "arm": "Achar que 'dor epigástrica' significa automaticamente úlcera. Em paciente investigado, sem lesão, é fenótipo funcional.", "regra": "Dor/queimação no epigástrio = síndrome da dor epigástrica.", "cf": "Um paciente com os dois grupos de sintomas pode apresentar sobreposição dos fenótipos; o predomínio orienta a descrição.", "fonte": "F1, Aula 3, p. 8 (item 3, tabela de Roma IV)"}, {"n": 5, "sub": "Sinais de alarme na dispepsia", "comp": "Indicar endoscopia na dispepsia com alarme", "tags": [], "rel": ["A02", "A06"], "enun": "Homem de 63 anos com dispepsia há 4 meses apresenta perda de 6 kg sem dieta e hemograma com anemia. O irmão teve câncer gástrico. Qual é a conduta mais adequada?", "ops": [["Endoscopia digestiva alta, pela presença de sinais de alarme e maior risco de neoplasia.", "Correta: perda ponderal, anemia e história familiar relevante indicam EDA."], ["Testar H. pylori com antígeno fecal e tratar se positivo, antes de qualquer exame endoscópico.", "Errada: a estratégia testar-e-tratar se aplica quando não há alarme nem risco aumentado."], ["Teste terapêutico com IBP por 8 semanas.", "Errada: o tratamento empírico atrasa o diagnóstico em paciente com alarme."], ["Classificar como dispepsia funcional e iniciar tricíclico em baixa dose.", "Errada: dispepsia funcional só se define após investigação apropriada; aqui há alarmes."]], "conc": "Sinais de alarme e risco na dispepsia: perda ponderal involuntária, anemia ou sangramento, disfagia progressiva, vômitos persistentes, massa ou linfonodo suspeito e maior risco individual de neoplasia ou história familiar relevante. A presença deles leva a considerar EDA.", "rac": "1) Dispepsia em paciente de 63 anos. 2) Emagrecimento involuntário. 3) Anemia. 4) Parente de primeiro grau com câncer gástrico. 5) O fluxo prático manda considerar EDA antes de testar H. pylori ou tratar empiricamente.", "pista": "Três dados de alarme/risco no mesmo caso.", "mud": "Em um paciente jovem, sem alarmes e sem história familiar, o caminho seria testar H. pylori quando indicado e tratar se positivo.", "cmp": "Sem alarme: testar H. pylori → tratar → IBP. Com alarme ou risco: EDA.", "arm": "Tratar empiricamente para 'ver se melhora' em paciente com anemia e emagrecimento, perdendo tempo diagnóstico.", "regra": "Dispepsia com alarme ou risco de neoplasia → EDA.", "cf": "Uma paciente de 30 anos com dispepsia e disfagia progressiva também tem alarme, mesmo jovem, e deve fazer EDA.", "fonte": "F1, Aula 3, p. 8 (item 4, sinais de alarme) e p. 22 (figura 3, fluxo prático)"}, {"n": 6, "sub": "H. pylori: escolha do teste", "comp": "Escolher o teste para infecção ativa e controle de erradicação", "tags": [], "rel": [], "enun": "Paciente tratado para H. pylori há 2 meses quer saber se a bactéria foi erradicada. Ele já tinha sorologia positiva antes do tratamento. Qual exame é o mais adequado para confirmar a erradicação?", "ops": [["Teste respiratório da ureia ou antígeno fecal, que detectam infecção ativa.", "Correta: são testes não invasivos de infecção ativa, úteis para confirmar erradicação."], ["Repetir a sorologia para H. pylori.", "Errada: a sorologia pode permanecer positiva após a cura, então não comprova erradicação."], ["Endoscopia digestiva alta obrigatória com biópsias gástricas e teste da urease.", "Errada: em paciente sem alarme, testes não invasivos são suficientes para confirmar infecção ativa."], ["pH-impedanciometria esofágica.", "Errada: avalia refluxo gastroesofágico, não infecção por H. pylori."]], "conc": "Para detectar infecção ativa por H. pylori, os testes não invasivos úteis são o teste respiratório da ureia e o antígeno fecal. A sorologia detecta anticorpos, que podem persistir depois da cura; por isso não é o melhor exame para confirmar erradicação.", "rac": "1) Objetivo: saber se a infecção atual foi eliminada. 2) Precisa de teste de infecção ativa. 3) Sorologia reflete contato, não infecção atual. 4) Escolha: teste respiratório da ureia ou antígeno fecal.", "pista": "'Confirmar a erradicação' exige teste de infecção ativa.", "mud": "Se a pergunta fosse apenas sobre contato prévio com a bactéria, a sorologia responderia, mas sem dizer se a infecção está ativa.", "cmp": "Antígeno fecal e teste respiratório: infecção ativa. Sorologia: contato (pode ficar positiva após cura).", "arm": "Retratar paciente já curado porque a sorologia 'ainda está positiva'.", "regra": "Erradicação se confirma com teste de infecção ativa, nunca com sorologia.", "cf": "Raciocínio semelhante aparece nas hepatites: anti-HCV indica contato, e só o HCV-RNA confirma infecção ativa.", "fonte": "F1, Aula 3, p. 9 (item 5, H. pylori)"}, {"n": 7, "sub": "Sequência prática do tratamento", "comp": "Ordenar as etapas do manejo da dispepsia sem alarme", "tags": [], "rel": [], "enun": "Jovem de 27 anos, sem sinais de alarme e sem risco aumentado para neoplasia, tem dispepsia. Usa naproxeno quase diariamente para cefaleia. O antígeno fecal para H. pylori veio positivo. Qual é a sequência adequada?", "ops": [["Revisar o uso do AINE, erradicar o H. pylori segundo diretriz local e, se persistir, testar IBP.", "Correta: revisar fármacos e gatilhos, erradicar se positivo e, persistindo sintomas, testar IBP."], ["Iniciar IBP isolado e manter o naproxeno, pois o H. pylori raramente causa sintomas dispépticos relevantes.", "Errada: o material manda tratar H. pylori quando positivo e revisar AINEs."], ["Realizar EDA antes de tratar, pois H. pylori positivo é sinal de alarme.", "Errada: H. pylori positivo não é sinal de alarme; o paciente não tem alarmes nem risco aumentado."], ["Iniciar tricíclico em baixa dose como primeira medida.", "Errada: neuromodulador é para persistência após as etapas iniciais."]], "conc": "Sequência do material: 1) revisar medicamentos e fatores desencadeantes (AINEs, álcool, excesso de gordura conforme tolerância); 2) se H. pylori positivo, erradicar segundo diretriz local; 3) se negativo ou se os sintomas persistirem após erradicação, testar IBP; 4) persistência: considerar tricíclico em baixa dose e/ou procinético em pacientes selecionados.", "rac": "1) Sem alarme: não precisa de EDA inicial. 2) Usa AINE: causa orgânica possível, revisar. 3) H. pylori positivo: erradicar. 4) IBP fica para persistência.", "pista": "Uso diário de naproxeno + antígeno fecal positivo em paciente sem alarmes.", "mud": "Se o H. pylori fosse negativo, o passo após revisar o AINE seria o teste com IBP.", "cmp": "Revisar fármacos e erradicar H. pylori tratam causas; IBP e neuromoduladores tratam sintomas quando a causa não é encontrada ou persiste.", "arm": "Tratar só o sintoma com IBP e manter o AINE, ignorando duas causas tratáveis.", "regra": "Fármacos → H. pylori → IBP → neuromodulador/procinético.", "cf": "Após erradicar o H. pylori e suspender o AINE, a persistência de sintomas ainda pode ocorrer; aí entra o teste com IBP antes de rotular dispepsia funcional refratária.", "fonte": "F1, Aula 3, p. 9 (itens 5 e 6, sequência prática e tratamento) e p. 22 (figura 3)"}, {"n": 8, "sub": "Persistência dos sintomas", "comp": "Escolher terapia adicional na dispepsia funcional persistente", "tags": [], "rel": [], "enun": "Paciente com dispepsia funcional, sem alarmes, já teve H. pylori erradicado (confirmado), suspendeu AINEs e fez teste com IBP sem melhora satisfatória. Qual opção terapêutica é sugerida pelo material para esse momento?", "ops": [["Neuromodulador tricíclico em baixa dose e/ou procinético em pacientes selecionados.", "Correta: é a etapa de persistência do material."], ["Novo esquema de erradicação do H. pylori, mesmo com erradicação confirmada.", "Errada: não há infecção ativa a tratar."], ["Cirurgia antirrefluxo, pois a falha do IBP indica doença grave.", "Errada: o paciente tem dispepsia funcional, não DRGE comprovada."], ["Sorologia anual para H. pylori para monitorar recidiva.", "Errada: sorologia não serve para controle, pois pode permanecer positiva após a cura."]], "conc": "Na persistência dos sintomas após revisar fármacos, erradicar H. pylori quando positivo e testar IBP, o material sugere considerar neuromodulador tricíclico em baixa dose e/ou procinético em pacientes selecionados.", "rac": "1) Etapas iniciais concluídas. 2) Sem resposta satisfatória. 3) Sem alarmes. 4) Próxima etapa: terapias adicionais (tricíclico/procinético).", "pista": "Todas as etapas anteriores do fluxo já foram feitas.", "mud": "Se, durante o seguimento, surgissem vômitos persistentes ou emagrecimento, a conduta mudaria para investigação com EDA.", "cmp": "Tricíclico em baixa dose: modula a percepção visceral. Procinético: atua na motilidade, especialmente quando predomina o desconforto pós-prandial.", "arm": "Repetir exames e esquemas sem necessidade porque o sintoma persiste, em vez de seguir a sequência terapêutica.", "regra": "Persistiu após fármacos, H. pylori e IBP: considerar tricíclico em baixa dose e/ou procinético.", "cf": "No fluxo da figura do material, a persistência leva a considerar dispepsia funcional e terapias adicionais conforme contexto.", "fonte": "F1, Aula 3, p. 9 (item 6, passo 4) e p. 22 (figura 3, passo 6)"}]}, {"id": "A04", "titulo": "Ancilostomíase + interpretação do exame parasitológico de fezes", "arq": "F1", "pags": "10–11 e 22", "bloco": 2, "q": [{"n": 1, "sub": "Agentes", "comp": "Identificar os ancilostomídeos humanos", "tags": [], "rel": [], "enun": "Em uma aula de parasitologia, o professor pergunta quais são os principais agentes da ancilostomíase humana. Qual alternativa está correta?", "ops": [["Ancylostoma duodenale e Necator americanus.", "Correta: são os principais ancilostomídeos humanos."], ["Strongyloides stercoralis e Necator americanus.", "Errada: Strongyloides causa estrongiloidíase, cujo diagnóstico típico no EPF é a larva."], ["Ascaris lumbricoides e Ancylostoma duodenale.", "Errada: Ascaris causa ascaridíase, não ancilostomíase."], ["Ancylostoma duodenale e Enterobius vermicularis.", "Errada: Enterobius causa enterobíase (oxiuríase)."]], "conc": "A ancilostomíase é causada principalmente por Ancylostoma duodenale e Necator americanus. Os dois têm ciclo semelhante e ovos que não se distinguem de forma confiável no EPF convencional.", "rac": "Basta reconhecer o par de gêneros da ancilostomíase. Os distratores misturam um ancilostomídeo com parasitos de outras doenças.", "pista": "'Ancilo' remete a Ancylostoma; o outro ancilostomídeo é Necator.", "mud": "Se a pergunta fosse sobre a parasitose cujo diagnóstico típico no EPF é a larva, a resposta seria Strongyloides stercoralis.", "cmp": "Ancilostomíase (Ancylostoma/Necator): procura-se ovo. Estrongiloidíase (Strongyloides): procura-se larva.", "arm": "Confundir Necator com Strongyloides por ambos serem transmitidos pela pele.", "regra": "Ancilostomíase = Ancylostoma duodenale + Necator americanus.", "cf": "Num laudo que descreve 'ovos de ancilostomídeo', não é possível afirmar qual das duas espécies está presente.", "fonte": "F1, Aula 4, p. 10 (item 1, agentes)"}, {"n": 2, "sub": "Forma infectante e via de entrada", "comp": "Relacionar exposição ao modo de infecção", "tags": [], "rel": [], "enun": "Trabalhador rural de 34 anos que anda descalço em plantação adubada com fezes humanas apresenta prurido e pápulas eritematosas nos pés, seguidos semanas depois de anemia. Qual forma do parasito iniciou a infecção e por qual via?", "ops": [["Larva filarioide L3, por penetração ativa na pele.", "Correta: a L3 do solo penetra a pele, causando prurido local ('ground itch')."], ["Ovo embrionado, por ingestão de alimento contaminado.", "Errada: no ancilostomídeo os ovos eclodem no solo; a infecção típica do material é pela pele."], ["Verme adulto, por contato direto com o solo.", "Errada: o adulto vive no intestino delgado; não é forma infectante."], ["Larva rabditoide, por inalação de poeira contaminada.", "Errada: a forma infectante descrita é a L3 filarioide, e a via é cutânea."]], "conc": "Os ovos eliminados nas fezes chegam ao solo, onde se desenvolvem até a larva filarioide L3, forma infectante. A L3 penetra a pele, cai na circulação, chega ao pulmão, sobe pela árvore respiratória, é deglutida e alcança o intestino delgado, onde vira adulto.", "rac": "1) Exposição: andar descalço em solo contaminado. 2) Primeira manifestação: prurido e pápulas nos pés, ou seja, porta de entrada cutânea. 3) Forma que penetra pele: L3.", "pista": "Prurido e pápulas no local de contato com o solo.", "mud": "Se o paciente usasse calçados e o solo não fosse contaminado, o risco de ancilostomíase seria muito menor.", "cmp": "Ancilostomíase: L3 penetra pele. Ascaridíase: ingestão de ovos. Ambas podem ter fase pulmonar.", "arm": "Achar que todo verme intestinal é adquirido por via oral.", "regra": "Andar descalço em solo contaminado → L3 penetra a pele.", "cf": "Medidas de prevenção que interrompem esse ciclo incluem saneamento (evitar fezes no solo) e uso de calçados.", "fonte": "F1, Aula 4, p. 10 (itens 2 e 3) e p. 11 (quadro 'Para a prova')"}, {"n": 3, "sub": "Ciclo biológico", "comp": "Ordenar as etapas do ciclo", "tags": [], "rel": [], "enun": "Qual sequência representa corretamente o ciclo do ancilostomídeo no ser humano, a partir da penetração da larva na pele?", "ops": [["Pele → circulação → pulmão → árvore respiratória → deglutição → intestino delgado.", "Correta: é o trajeto descrito no material e na figura do ciclo."], ["Pele → intestino delgado → circulação → pulmão → eliminação pela tosse.", "Errada: a larva passa pelo pulmão antes de chegar ao intestino, e o ciclo termina com ovos nas fezes."], ["Pele → linfonodos → fígado → intestino grosso → eliminação de larvas nas fezes.", "Errada: o adulto se fixa no intestino delgado e o que se elimina são ovos."], ["Pele → circulação → intestino delgado → pulmão → deglutição.", "Errada: a ordem pulmão-intestino está invertida."]], "conc": "Ciclo: ovos nas fezes → solo → larva filarioide L3 → penetra pele → circulação → pulmão → sobe pela árvore respiratória → deglutição → intestino delgado. No intestino, o adulto se fixa à mucosa e produz perda sanguínea crônica; os ovos saem nas fezes e mantêm o ciclo.", "rac": "Lembre que a larva precisa 'dar a volta' pelo pulmão: chega pelo sangue, sobe pela via aérea, é engolida e só então chega ao intestino delgado.", "pista": "Deglutição precede imediatamente a chegada ao intestino delgado.", "mud": "Se a pergunta começasse no meio externo, a sequência incluiria ovos nas fezes → solo → L3 antes da pele.", "cmp": "A passagem pulmonar explica a fase com tosse, sibilância e eosinofilia, antes dos sintomas intestinais.", "arm": "Esquecer a etapa pulmonar e achar que a larva vai direto da pele ao intestino.", "regra": "Pele → sangue → pulmão → sobe → engole → intestino delgado.", "cf": "Um paciente com tosse seca e eosinofilia algumas semanas após dermatite nos pés pode estar na fase de migração pulmonar.", "fonte": "F1, Aula 4, p. 10 (item 2, ciclo) e p. 22 (figura 4)"}, {"n": 4, "sub": "Fase de migração pulmonar", "comp": "Reconhecer as manifestações da passagem pulmonar", "tags": [], "rel": [], "enun": "Duas semanas após apresentar prurido nos pés, um adolescente que trabalha na roça desenvolve tosse, sibilância, infiltrados pulmonares transitórios na radiografia e eosinofilia. Qual é a explicação mais provável?", "ops": [["Migração pulmonar das larvas, que pode cursar como síndrome de Löeffler.", "Correta: tosse, sibilância, infiltrados transitórios e eosinofilia caracterizam a fase pulmonar."], ["Pneumonia bacteriana secundária à anemia ferropriva e à desnutrição do trabalhador rural.", "Errada: o quadro com eosinofilia e infiltrados transitórios não sugere pneumonia bacteriana, e a anemia é tardia."], ["Fixação do verme adulto na mucosa brônquica.", "Errada: o adulto vive no intestino delgado, não nos brônquios."], ["Asma ocupacional por poeira de fertilizante.", "Errada: não explica o encadeamento com a lesão cutânea nem a sequência do ciclo."]], "conc": "Manifestações por fase: penetração cutânea (prurido, eritema, pápulas, 'ground itch'); migração pulmonar (tosse, sibilância, infiltrados transitórios, eosinofilia, possível síndrome de Löeffler); intestinal (dor abdominal, náusea, alteração do hábito; em carga elevada, perda crônica de sangue); crônica/intensa (anemia ferropriva, palidez, fadiga e, em casos intensos, hipoproteinemia).", "rac": "1) Cronologia: pele primeiro, pulmão depois. 2) Achados pulmonares transitórios com eosinofilia. 3) Isso corresponde à passagem larval pelo pulmão.", "pista": "Infiltrados transitórios + eosinofilia após lesão cutânea.", "mud": "Meses depois, com palidez, fadiga e anemia microcítica, o quadro estaria na fase crônica intestinal.", "cmp": "Fase pulmonar: larva, eosinofilia, sintomas respiratórios. Fase intestinal crônica: verme adulto, perda de sangue, anemia ferropriva.", "arm": "Pedir EPF nessa fase esperando encontrar ovos; o parasito ainda não chegou ao intestino como adulto.", "regra": "Pele → pulmão (tosse, sibilância, eosinofilia, Löeffler) → intestino (perda de sangue).", "cf": "Na estrongiloidíase também há passagem pulmonar, mas o diagnóstico no EPF busca larvas, não ovos.", "fonte": "F1, Aula 4, p. 10 (item 3, tabela por fase)"}, {"n": 5, "sub": "Mecanismo da anemia", "comp": "Explicar o tipo de anemia da ancilostomíase", "tags": [], "rel": ["A06"], "enun": "Mulher de 40 anos, agricultora, com cansaço e palidez progressivos, tem Hb de 8,2 g/dL, VCM e HCM baixos e ferritina reduzida. O EPF mostra ovos de ancilostomídeo. Qual mecanismo explica a anemia?", "ops": [["Fixação do verme à mucosa intestinal com sangramento crônico, perda de ferro e anemia microcítica e hipocrômica.", "Correta: é a cadeia descrita no material."], ["Hemólise intravascular causada por toxinas larvais, com anemia macrocítica.", "Errada: o mecanismo é perda sanguínea, e a anemia é microcítica e hipocrômica."], ["Má absorção de vitamina B12 no íleo, com anemia megaloblástica.", "Errada: os índices são baixos (microcitose) e a ferritina está reduzida."], ["Supressão medular por eosinofilia intensa, com anemia normocítica.", "Errada: eosinofilia não suprime a medula; os índices são de deficiência de ferro."]], "conc": "O verme adulto se fixa à mucosa do intestino delgado e provoca perda sanguínea crônica. A perda contínua de sangue esgota o ferro, reduz a hemoglobina e produz anemia microcítica (VCM baixo) e hipocrômica (HCM baixo), confirmada por ferritina baixa.", "rac": "1) Hb baixa. 2) VCM e HCM baixos: microcitose e hipocromia. 3) Ferritina baixa: deficiência de ferro. 4) Causa: perda sanguínea crônica pelo parasito.", "pista": "VCM, HCM e ferritina baixos.", "mud": "Se a ferritina fosse normal e o VCM alto, a ancilostomíase não explicaria o quadro, e outra causa deveria ser buscada.", "cmp": "Ancilostomíase e hemorragia digestiva oculta crônica compartilham o mesmo resultado laboratorial: anemia ferropriva por perda de sangue.", "arm": "Tratar só o ferro e esquecer o antiparasitário, ou tratar só o verme e esquecer a reposição de ferro.", "regra": "Fixação → sangramento → perda de ferro → Hb, VCM e HCM baixos.", "cf": "Em casos intensos, além de ferro, pode haver perda de proteínas, levando à hipoproteinemia.", "fonte": "F1, Aula 4, p. 10 (item 3, 'Por que dá anemia?') e p. 11 (item 5, exames complementares)"}, {"n": 6, "sub": "EPF: morfologia do ovo", "comp": "Reconhecer o ovo de ancilostomídeo no EPF", "tags": [], "rel": [], "enun": "Um laudo de exame parasitológico de fezes de amostra fresca descreve: 'ovos ovais/elípticos, casca fina, hialina e incolor, com conteúdo segmentado em blastômeros'. Qual é a interpretação adequada?", "ops": [["Achado compatível com ovo de ancilostomídeo.", "Correta: oval/elíptico, casca fina hialina e blastômeros em amostra fresca são características típicas."], ["Achado compatível com larva de Strongyloides stercoralis.", "Errada: o laudo descreve ovos, não larvas."], ["Achado que permite afirmar infecção por Necator americanus.", "Errada: o EPF convencional não distingue de forma confiável os ovos de Ancylostoma e Necator."], ["Achado inespecífico que não sugere nenhum parasito.", "Errada: a descrição é característica de ancilostomídeo."]], "conc": "Na ancilostomíase, a forma diagnóstica clássica no EPF é o ovo: oval/elíptico, casca fina, hialina/incolor, com conteúdo segmentado e
