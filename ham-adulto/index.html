Para o ápice do cóccix, onde se palpa a base da próstata.", "Errada: o cóccix é posterior; a base da próstata é alcançada até onde o dedo chega na parede anterior."]], "conc": "Execução: encostar a polpa do indicador na margem anal posterior e aguardar relaxamento; introduzir lentamente acompanhando o canal anal e a curvatura sacral; avaliar tônus esfincteriano e sensibilidade; palpar a parede retal em toda a circunferência; girar a polpa para a parede anterior do reto (voltada para o púbis), onde está a face posterior da próstata; percorrer os dois lobos do ápice em direção à base até onde o dedo alcança; sentir o sulco mediano; descrever tamanho, simetria, superfície, consistência, sulco, nódulos, endurecimentos, mobilidade e dor; retirar delicadamente, observar a luva, oferecer higiene e explicar os próximos passos.", "rac": "Lembre a anatomia em corte sagital: bexiga e próstata ficam à frente do reto. Logo, a palpação é na parede anterior.", "pista": "'Voltada para a região pubiana'.", "mud": "Se o objetivo fosse procurar massas retais, a palpação circunferencial de toda a parede seria a etapa principal.", "cmp": "Palpação circunferencial: avalia o reto. Parede anterior: avalia a próstata.", "arm": "Esquecer de avaliar tônus esfincteriano e de olhar a luva ao final (fezes, sangue).", "regra": "Próstata = parede ANTERIOR do reto.", "cf": "Ao retirar o dedo, observar sangue ou fezes na luva pode acrescentar informação ao exame.", "fonte": "F2, Seção 04, pp. 6–7 (execução detalhada) e p. 7 (figura de corte sagital)"}, {"n": 5, "sub": "Próstata normal e registro", "comp": "Descrever a próstata normal e reconhecer o limite do exame", "tags": ["osce"], "rel": [], "enun": "Ao toque, você encontra próstata de volume aparentemente habitual, com dois lobos simétricos, superfície lisa e regular, consistência fibroelástica, sulco mediano palpável, indolor e sem nódulos. Qual é a interpretação correta?", "ops": [["Achado normal ao toque; não há achado suspeito, mas o toque normal não exclui câncer.", "Correta: é a descrição de próstata normal, e o material ressalta que o toque normal não exclui câncer."], ["Achado compatível com HPB, pois a próstata é palpável.", "Errada: HPB tem aumento difuso; aqui o volume é habitual e o sulco está palpável."], ["Achado normal que exclui câncer de próstata.", "Errada: o toque normal não exclui câncer."], ["Achado sugestivo de prostatite crônica, pois a consistência é elástica.", "Errada: consistência fibroelástica e ausência de dor são características normais."]], "conc": "Próstata normal: discreta proeminência no reto (descrever como 'volume habitual/sem aumento evidente', pois a estimativa digital é imprecisa); dois lobos aproximadamente simétricos com sulco mediano identificável; superfície lisa e regular; consistência firme-elástica/fibroelástica ('borrachosa'); sem nódulos e sem dor. Registro modelo: esfíncter com tônus preservado, ampola sem massas, próstata de volume aparentemente habitual, lobos simétricos, superfície lisa, consistência fibroelástica, sulco palpável, indolor, sem nódulos.", "rac": "Cada característica descrita corresponde ao padrão normal. A pergunta testa também o limite: normal ao toque não é o mesmo que ausência de doença.", "pista": "Sulco mediano palpável e consistência fibroelástica.", "mud": "Um nódulo pétreo em um dos lobos mudaria a interpretação para suspeita de neoplasia.", "cmp": "Normal: fibroelástica, sulco presente. HPB: aumentada, sulco pode estar apagado. Câncer: nódulo pétreo, assimetria.", "arm": "Escrever que o toque normal 'afasta câncer'.", "regra": "Normal = lisa, simétrica, fibroelástica, sulco presente, indolor; toque normal não exclui câncer.", "cf": "Registrar o volume em palavras ('volume aparentemente habitual') é mais adequado que estimar gramas pelo dedo.", "fonte": "F2, Seção 04, p. 7 (próstata normal e registro modelo); Seção 05, p. 8 (tabela)"}, {"n": 6, "sub": "HPB x câncer suspeito", "comp": "Interpretar achado suspeito e definir a sequência de investigação", "tags": ["osce"], "rel": [], "enun": "Homem de 66 anos com noctúria tem, ao toque, próstata com área endurecida, pétrea e de limites irregulares no lobo direito, com assimetria e sulco pouco delimitado. O PSA recente foi 'normal'. Qual é a conduta adequada?", "ops": [["Achado suspeito: encaminhar ao urologista para PSA, RM e biópsia, pois PSA normal não o anula.", "Correta: é a sequência de investigação prostática do material."], ["Achado típico de HPB; tratar sintomas urinários e reavaliar em 1 ano.", "Errada: HPB é aumento liso e simétrico, sem nódulo pétreo."], ["Como o PSA recente está normal, o achado ao toque pode ser desconsiderado e reavaliado em um ano.", "Errada: o material afirma que PSA 'normal' não anula achado suspeito ao toque."], ["Realizar massagem prostática para coletar secreção e excluir prostatite.", "Errada: não há quadro de prostatite, e a conduta para nódulo suspeito é investigação urológica."]], "conc": "HPB: aumento difuso/simétrico, liso, elástico, em geral indolor; sulco pode ficar menos evidente. Câncer suspeito: nódulo focal duro/pétreo, induração, assimetria, irregularidade, possível fixação ou perda de limites/sulco; pode não ter sintoma. Investigação: encaminhar ao urologista; PSA, estratificação, RM multiparamétrica pré-biópsia conforme indicação; biópsia dirigida (± sistemática/perilesional) dá confirmação histológica. PSA 'normal' não anula achado suspeito ao toque.", "rac": "1) Achado focal, pétreo, irregular, assimétrico: padrão de suspeita. 2) PSA normal não muda isso. 3) Sequência: urologista → PSA/RM → biópsia.", "pista": "'Pétrea e de limites irregulares'.", "mud": "Se a próstata estivesse aumentada globalmente, lisa e simétrica, o padrão seria de HPB.", "cmp": "HPB: liso e simétrico. Câncer suspeito: nódulo duro e irregular. Prostatite: dor marcante com sinais infecciosos.", "arm": "Confiar no PSA normal para dispensar a investigação.", "regra": "Nódulo duro/irregular ao toque = investigação urológica, independentemente do PSA.", "cf": "Modelo de fala: 'Encontrei uma área endurecida/irregular ao toque; isso não é diagnóstico de câncer, mas precisa de avaliação urológica e exames complementares.'", "fonte": "F2, Seção 05, p. 8 (tabela e registros) e p. 9 (sequência da investigação); Seção 10, p. 15 (modelo de fala)"}, {"n": 7, "sub": "Prostatite aguda", "comp": "Reconhecer prostatite aguda e o que não fazer", "tags": ["osce"], "rel": ["A08"], "enun": "Homem de 45 anos com febre de 39 °C, disúria, dor perineal e mal-estar. Ao toque cuidadoso, a próstata está intensamente dolorosa, edemaciada e amolecida. Qual afirmação está correta?", "ops": [["Prostatite aguda; não massagear; diagnóstico clínico com exames de urina, sem usar PSA.", "Correta: são exatamente os cuidados e a interpretação do material."], ["Sugere câncer de próstata; solicitar PSA, que confirma o diagnóstico.", "Errada: o quadro é infeccioso, e o PSA pode alterar na prostatite sem diagnosticá-la."], ["Sugere HPB; iniciar tratamento para sintomas obstrutivos urinários baixos.", "Errada: HPB é indolor e sem sinais infecciosos."], ["Sugere prostatite; fazer massagem prostática vigorosa para coletar secreção e guiar o antibiótico.", "Errada: na suspeita de prostatite aguda, não se faz massagem."]], "conc": "Prostatite aguda: dor acentuada, edema, próstata sensível e por vezes amolecida ('boggy'); febre, disúria, dor perineal. Não massagear. Diagnóstico clínico e exames de urina. Com febre e próstata muito dolorosa, pensar primeiro em prostatite aguda e tratar/investigar infecção; o PSA pode ficar alterado e não é teste diagnóstico. Prostatite crônica/dor pélvica: o toque pode ser normal ou causar desconforto; o toque isolado não define.", "rac": "1) Febre, disúria, dor perineal: quadro infeccioso. 2) Toque: muito doloroso, amolecido. 3) Prostatite aguda. 4) Cuidados: sem massagem; PSA não diagnostica.", "pista": "Febre + próstata intensamente dolorosa e amolecida.", "mud": "Se não houvesse febre e o toque fosse normal com desconforto pélvico crônico, a hipótese seria prostatite crônica/dor pélvica, com diagnóstico diferencial amplo.", "cmp": "Prostatite aguda: dor marcante + infecção. HPB: indolor, lisa. Câncer: nódulo duro, frequentemente indolor.", "arm": "Pedir PSA para 'confirmar' prostatite ou interpretar PSA alto na prostatite como câncer.", "regra": "Febre + próstata muito dolorosa = prostatite aguda: sem massagem.", "cf": "Registro sugerido: 'Próstata intensamente dolorosa à palpação leve, consistência amolecida/edemaciada; exame limitado por desconforto. Sem massagem.'", "fonte": "F2, Seção 04, p. 6 (cuidados); Seção 05, p. 8 (tabela e registro) e p. 9 (item 5)"}, {"n": 8, "sub": "Exame geniturinário complementar: dor escrotal", "comp": "Reconhecer torção testicular como urgência", "tags": ["osce"], "rel": [], "enun": "Adolescente de 16 anos acorda com dor escrotal súbita e intensa à esquerda, com náuseas. Ao exame, o testículo esquerdo está elevado e horizontalizado. Qual é a conduta adequada?", "ops": [["Suspeitar de torção testicular, uma urgência cirúrgica, sem atrasar o encaminhamento por exames desnecessários.", "Correta: dor súbita intensa com testículo elevado/horizontalizado sugere torção."], ["Suspeitar de epididimite e iniciar antibiótico, com retorno em 7 dias.", "Errada: epididimite tem epidídimo doloroso, febre/disúria ou secreção; o quadro súbito com testículo elevado sugere torção."], ["Solicitar US Doppler eletivo e aguardar o laudo para decidir.", "Errada: na suspeita clínica de torção, não se deve atrasar o encaminhamento."], ["Realizar transiluminação; se positiva, tranquilizar e liberar.", "Errada: transiluminação não é a conduta na suspeita de torção e não substitui encaminhamento urgente."]], "conc": "Exame geniturinário masculino (complementar, com consentimento, privacidade, exposição mínima, luvas e acompanhante): inspeção do pênis, meato e escroto; palpação de testículos (comparar posição, tamanho, consistência, superfície, dor, nódulos), epidídimos (face posterior) e cordão espermático. Achados: dor súbita intensa com testículo elevado/horizontalizado = suspeita de torção, urgência cirúrgica; epidídimo doloroso com febre/disúria/secreção = epididimite/orquiepididimite (EAS, urocultura, testes de IST, US Doppler se dúvida de torção); nódulo testicular firme, em geral indolor = massa suspeita (US escrotal e urologia; transiluminação isolada não exclui neoplasia); abaulamento inguinal que aumenta ao tossir = hérnia possível (dor intensa, irredutibilidade ou vômitos = urgência).", "rac": "1) Início súbito e intenso. 2) Testículo elevado e horizontalizado. 3) Adolescente. 4) Torção até prova em contrário: urgência.", "pista": "'Elevado e horizontalizado'.", "mud": "Se a dor fosse progressiva, com febre, disúria e epidídimo espessado e doloroso, a hipótese seria epididimite; o Doppler ajudaria em caso de dúvida com torção.", "cmp": "Torção: súbita, testículo elevado, urgência cirúrgica. Epididimite: progressiva, sinais infecciosos, epidídimo doloroso.", "arm": "Atrasar a cirurgia esperando exame de imagem.", "regra": "Dor escrotal súbita + testículo elevado/horizontalizado = torção: urgência.", "cf": "Um nódulo testicular firme e indolor também exige US escrotal e avaliação urológica; transiluminação isolada não exclui neoplasia.", "fonte": "F2, Seção 05-A, p. 9 (inspeção, palpação e tabela de achados)"}]}, {"id": "A10", "titulo": "Diretiva antecipada de vontade e dor lombar: diferencial", "arq": "F2", "pags": "10", "bloco": 5, "q": [{"n": 1, "sub": "Conceito de DAV", "comp": "Definir diretiva antecipada de vontade e sua base normativa", "tags": ["osce"], "rel": [], "enun": "Qual alternativa define corretamente diretiva antecipada de vontade (DAV) e cita a norma do CFM que orienta sua consideração na prática médica, conforme o material?", "ops": [["Preferências do paciente, manifestadas antes, para quando não puder decidir; Resolução CFM 1.995/2012.", "Correta: é a definição e a referência normativa do material."], ["Decisão da família sobre o tratamento do paciente que perdeu a consciência; Resolução CFM 1.995/2012.", "Errada: a DAV é manifestação do próprio paciente, não da família."], ["Documento médico que define quais tratamentos o paciente deve receber, independentemente da sua vontade.", "Errada: a DAV expressa a vontade do paciente, não do médico."], ["Termo de consentimento informado assinado pelo paciente antes de cada procedimento cirúrgico.", "Errada: consentimento informado é para um procedimento atual; a DAV antecipa preferências para incapacidade futura."]], "conc": "DAV são as preferências previamente manifestadas pelo paciente quanto a cuidados e tratamentos, para um eventual momento em que não consiga decidir ou expressar sua vontade. A Resolução CFM 1.995/2012 orienta sua consideração na prática médica.", "rac": "Três elementos definem a DAV: quem manifesta (o paciente), quando (antecipadamente) e para quê (situação futura de incapacidade de decidir).", "pista": "'Previamente manifestadas pelo paciente'.", "mud": "Se o paciente está capaz no momento, é a decisão atual dele que orienta o cuidado, não um documento anterior.", "cmp": "DAV: vontade antecipada para incapacidade futura. Consentimento informado: decisão atual sobre um procedimento.", "arm": "Achar que a DAV pertence à família ou ao médico.", "regra": "DAV = vontade do paciente, registrada antes, para quando ele não puder decidir.", "cf": "Fala sugerida no OSCE: 'Quero entender o que é importante para o senhor caso, no futuro, não consiga falar por si. Há tratamentos que não gostaria de receber? Quem gostaria que participasse das decisões?'", "fonte": "F2, Seção 06, p. 10 (definição, Resolução CFM 1.995/2012 e exemplo de fala)"}, {"n": 2, "sub": "Paciente capaz", "comp": "Respeitar a decisão atual do paciente capaz", "tags": ["osce"], "rel": ["A01"], "enun": "Senhora de 79 anos, lúcida e com capacidade decisória preservada, com câncer avançado, diz que não deseja ser intubada caso piore. A filha, presente, pede que o médico 'faça tudo' e que não converse sobre isso com a mãe. Qual é a conduta adequada?", "ops": [["Conversar diretamente com a paciente; como ela está capaz, sua decisão atual orienta o cuidado, sem substituí-la pela família.", "Correta: com o paciente capaz, a decisão é dele."], ["Seguir o pedido da filha, pois a família é responsável pelas decisões de pacientes idosos.", "Errada: idade não retira capacidade decisória; a paciente decide."], ["Adiar a conversa até que a paciente perca a consciência e então consultar a família.", "Errada: o momento adequado é enquanto a paciente pode decidir."], ["Registrar a vontade da filha como diretiva antecipada.", "Errada: a DAV expressa a vontade do paciente, não da família."]], "conc": "Se o paciente está capaz, a decisão atual dele orienta o cuidado; converse diretamente com ele, sem substituí-lo pela família. A família pode participar, mas não decide no lugar do paciente capaz.", "rac": "1) Capacidade decisória preservada. 2) Vontade clara. 3) Conflito com a família. 4) Prevalece a decisão da paciente, com acolhimento da filha.", "pista": "'Lúcida e com capacidade decisória preservada'.", "mud": "Se a paciente estivesse inconsciente, seria preciso procurar DAV registrada, representante designado e informações sobre seus valores e preferências.", "cmp": "Autonomia (decidir) pode estar preservada mesmo com dependência física, conceito também visto na avaliação funcional do idoso.", "arm": "Excluir o idoso da conversa por pedido da família.", "regra": "Paciente capaz decide; a família apoia, mas não substitui.", "cf": "Documentar a capacidade decisória, as opções discutidas, as preferências e os interlocutores protege a paciente e a equipe.", "fonte": "F2, Seção 06, p. 10 (itens 1 e 5)"}, {"n": 3, "sub": "Paciente incapaz", "comp": "Conduzir decisão quando o paciente não pode decidir", "tags": ["osce"], "rel": [], "enun": "Homem de 74 anos chega inconsciente após AVC extenso. A equipe discute se deve realizar procedimento invasivo de suporte. O que o material orienta fazer?", "ops": [["Procurar DAV registrada, representante designado e informações sobre os valores e preferências do paciente.", "Correta: é a conduta para o paciente incapaz."], ["Decidir apenas com base na opinião do médico assistente, pois o paciente não pode se manifestar.", "Errada: as preferências do paciente devem ser buscadas."], ["Realizar todos os procedimentos possíveis, pois a ausência de manifestação equivale a consentimento para tudo.", "Errada: o material orienta buscar DAV, representante e valores, e considerar limites de tratamentos desproporcionais."], ["Aguardar decisão judicial antes de qualquer cuidado.", "Errada: não é o primeiro passo; conflitos podem exigir ética/bioética, mas o cuidado não é suspenso."]], "conc": "Se o paciente está incapaz: procurar DAV registrada, representante designado e informação sobre valores e preferências. Explicar com empatia o contexto e os limites de tratamentos potencialmente desproporcionais. Documentar; conflitos podem exigir apoio de ética/bioética.", "rac": "1) Paciente sem capacidade de decidir. 2) Buscar o que ele quereria: DAV, representante, valores. 3) Decidir respeitando essa vontade e documentar.", "pista": "'Inconsciente'.", "mud": "Se houvesse DAV registrada recusando aquele procedimento, ela deveria ser considerada na decisão.", "cmp": "Capaz: decisão atual. Incapaz: DAV, representante e valores.", "arm": "Tomar a decisão sem buscar o que o paciente expressou antes.", "regra": "Incapaz: DAV → representante → valores e preferências; documentar.", "cf": "Se a família discorda da DAV registrada e o conflito persiste, o material indica que pode ser necessário envolver ética/bioética.", "fonte": "F2, Seção 06, p. 10 (itens 2, 3 e 5)"}, {"n": 4, "sub": "Limitação de intervenção não é abandono", "comp": "Manter cuidados de conforto ao limitar tratamentos", "tags": ["osce"], "rel": [], "enun": "Após discussão com o paciente, ficou definido que não haverá intubação em caso de piora. Um colega sugere suspender também analgesia, higiene e avaliações, 'já que não vamos fazer mais nada'. Qual é a resposta adequada?", "ops": [["Limitar uma intervenção não é abandono: manter analgesia, conforto, higiene e paliação.", "Correta: é a orientação expressa do material."], ["Concordar, pois a decisão de não intubar implica suspender todos os cuidados e avaliações.", "Errada: o material afirma que limitação não é abandono."], ["Manter apenas a analgesia e suspender a higiene, para reduzir manipulação.", "Errada: higiene, conforto e acolhimento fazem parte do cuidado."], ["Reverter a decisão e intubar, pois limitar cuidados é eticamente inaceitável.", "Errada: a limitação de intervenção desproporcional respeitando a vontade do paciente é aceita; o erro seria abandonar."]], "conc": "Manter analgesia, conforto, higiene, acolhimento e cuidados paliativos quando indicados; limitação de uma intervenção não significa abandono. Documentar capacidade decisória, opções, preferências, interlocutores e plano.", "rac": "A decisão foi sobre uma intervenção específica (intubação). Todo o restante do cuidado continua, e o foco em conforto pode até aumentar.", "pista": "'Não vamos fazer mais nada'.", "mud": "Se o paciente mudar de ideia enquanto capaz, a nova vontade orienta o cuidado; as preferências podem ser revistas quando ele desejar.", "cmp": "Limitar intervenção desproporcional (aceitável) x abandonar o paciente (inaceitável).", "arm": "Interpretar 'não intubar' como 'não cuidar'.", "regra": "Limitar uma intervenção não é abandono.", "cf": "Na fala do OSCE, oferecer revisar as preferências quando o paciente quiser demonstra que a DAV é um processo, não um documento fixo.", "fonte": "F2, Seção 06, p. 10 (itens 4 e 5; exemplo de fala)"}, {"n": 5, "sub": "Dor lombar mecânica", "comp": "Reconhecer dor lombar mecânica e não indicar imagem sem alarme", "tags": [], "rel": [], "enun": "Homem de 36 anos sente dor lombar paravertebral desde que carregou móveis há 3 dias. A dor piora ao se movimentar, não irradia para as pernas, e ele nega febre e sintomas urinários. Exame neurológico normal. Qual é a abordagem coerente com o material?", "ops": [["Lombalgia mecânica; exame clínico e neurológico, sem imagem inicial.", "Correta: o material afirma que a imagem em geral não é inicial sem alarme."], ["Radiculopatia; solicitar ressonância magnética de coluna lombar imediata.", "Errada: não há dor irradiada para membro inferior, parestesia ou déficit."], ["Pielonefrite; solicitar EAS, urocultura e hemograma.", "Errada: não há febre nem sintomas urinários."], ["Cólica ureteral; solicitar TC de abdome sem contraste.", "Errada: a dor é relacionada a esforço e movimento, sem caráter em ondas para a virilha."]], "conc": "Dor lombar mecânica/muscular: após esforço, piora com movimento, dor paravertebral, sem febre e sem sintomas urinários. Exames úteis: exame da coluna/músculos, mobilidade e neurológico; imagem em geral não é inicial sem alarme.", "rac": "1) Gatilho mecânico (carregar peso). 2) Piora com movimento. 3) Sem irradiação, febre ou sintomas urinários. 4) Neurológico normal. 5) Sem red flags: sem imagem inicial.", "pista": "'Desde que carregou móveis' e 'piora ao se movimentar'.", "mud": "Se houvesse dor irradiada pela perna com parestesia e fraqueza, a hipótese seria radiculopatia; anestesia em sela ou retenção urinária nova indicariam urgência.", "cmp": "Mecânica: piora com movimento. Cólica ureteral: inquieto, dor em ondas independente da posição. Pielonefrite: febre e dor em flanco.", "arm": "Pedir imagem de coluna para toda lombalgia aguda.", "regra": "Lombalgia mecânica sem alarme: exame clínico, sem imagem inicial.", "cf": "Um idoso com lombalgia e história de câncer não se enquadra nessa regra: tem red flag e precisa de investigação.", "fonte": "F2, Seção 07, p. 10 (tabela de dor lombar)"}, {"n": 6, "sub": "Radiculopatia e cauda equina", "comp": "Reconhecer sinais de urgência na lombalgia com irradiação", "tags": ["osce"], "rel": [], "enun": "Mulher de 44 anos com dor lombar irradiada pela face posterior da perna direita há 5 dias, com parestesias. Hoje relata perda de sensibilidade na região perineal ('em sela') e dificuldade nova para urinar. Qual é a interpretação?", "ops": [["Radiculopatia com sinais de cauda equina, que é urgência.", "Correta: o material define sinais de cauda equina como urgência."], ["Radiculopatia simples; analgesia e reavaliação em 4 semanas.", "Errada: anestesia em sela e retenção nova são red flags."], ["Cistite associada à lombalgia; tratar com antibiótico.", "Errada: a dificuldade para urinar está associada a déficit sensitivo perineal, sugerindo causa neurológica."], ["Dor lombar mecânica; imagem não está indicada.", "Errada: há dor irradiada e sinais neurológicos de alarme."]], "conc": "Radiculopatia (ciática): dor irradiada por membro inferior, parestesias, possível fraqueza. Avaliar força, sensibilidade, reflexos e Lasègue. Sinais de cauda equina são urgência. Red flags da dor lombar: febre/sepse, hipotensão, dor abdominal ou dorsal súbita intensa, déficit neurológico progressivo, anestesia em sela, retenção urinária nova, trauma importante, história de câncer, emagrecimento, imunossupressão.", "rac": "1) Dor irradiada com parestesias: radiculopatia. 2) Anestesia em sela + retenção nova: cauda equina. 3) Urgência.", "pista": "'Em sela' + 'dificuldade nova para urinar'.", "mud": "Sem anestesia em sela, sem retenção e sem déficit progressivo, o quadro seria radiculopatia sem sinais de urgência.", "cmp": "Radiculopatia: dor e parestesia em trajeto de raiz. Cauda equina: compromete várias raízes sacrais, com alteração esfincteriana e sensitiva perineal.", "arm": "Atribuir a retenção urinária a causa urológica sem examinar a sensibilidade perineal.", "regra": "Anestesia em sela ou retenção urinária nova na lombalgia = urgência.", "cf": "O exame neurológico dirigido (força, sensibilidade, reflexos e Lasègue) deve ser verbalizado na estação de OSCE de dor lombar.", "fonte": "F2, Seção 07, p. 10 (tabela e quadro 'Red flags')"}, {"n": 7, "sub": "Dor lombar de origem vascular", "comp": "Identificar dor lombar com instabilidade como possível causa vascular", "tags": [], "rel": ["A11"], "enun": "Homem de 71 anos, hipertenso e tabagista, apresenta dor lombar súbita e muito intensa, seguida de mal-estar e quase desmaio. Chega com PA 84/52 mmHg e FC 120 bpm. Qual hipótese deve ser priorizada?", "ops": [["Causa vascular, como aneurisma roto, com investigação e abordagem urgentes.", "Correta: dor muito intensa com colapso sugere origem vascular, e hipotensão é red flag."], ["Dor lombar mecânica, pela idade e pela localização.", "Errada: não há gatilho mecânico, e a instabilidade hemodinâmica muda tudo."], ["Cólica ureteral, pela intensidade da dor.", "Errada: cólica renal não costuma causar choque; a hipotensão sugere hemorragia."], ["Radiculopatia, pela localização lombar.", "Errada: não há irradiação neurológica, e o quadro é de choque."]], "conc": "Origem vascular ou neoplásica: dor muito intensa com colapso, ou dor progressiva com perda de peso/câncer prévio. Achados úteis: sinais de choque, massa, exame neurológico e investigação urgente. No abdome agudo hemorrágico, aneurisma roto é exemplo clássico, com choque/instabilidade, dor súbita e sangramento.", "rac": "1) Idoso com fatores de risco vascular. 2) Dor súbita e muito intensa. 3) Colapso e hipotensão com taquicardia. 4) Prioridade: causa vascular hemorrágica.", "pista": "Dor lombar súbita + quase desmaio + hipotensão.", "mud": "Se a dor fosse progressiva há meses, com emagrecimento e câncer prévio, a hipótese seria neoplásica.", "cmp": "Vascular: súbita, intensa, com colapso. Neoplásica: progressiva, com emagrecimento.", "arm": "Rotular como 'cólica renal' um idoso hipotenso com dor lombar súbita.", "regra": "Dor lombar súbita + choque = pensar em causa vascular.", "cf": "O mesmo raciocínio aparece no abdome agudo hemorrágico: estabilidade e choque são avaliados antes de manobras dolorosas.", "fonte": "F2, Seção 07, p. 10 (tabela e red flags); Seção 08, p. 10 (abdome agudo hemorrágico)"}, {"n": 8, "sub": "Red flags e diferencial: neoplasia x pielonefrite", "comp": "Usar red flags para direcionar a investigação", "tags": [], "rel": ["A08"], "enun": "Duas pacientes com dor lombar: A, 68 anos, com câncer de mama tratado há 5 anos, dor lombar progressiva há 2 meses, pior à noite, e emagrecimento de 5 kg; B, 30 anos, com febre de 39 °C, calafrios, náuseas e dor em flanco esquerdo. Qual associação está correta?", "ops": [["A: red flags de neoplasia; B: provável pielonefrite.", "Correta: história de câncer e emagrecimento são red flags; febre e dor em flanco sugerem pielonefrite."], ["A: dor mecânica, sem imagem; B: dor mecânica, sem imagem.", "Errada: as duas têm sinais que afastam o padrão mecânico simples."], ["A: cólica ureteral; B: radiculopatia lombar.", "Errada: A não tem dor em ondas; B não tem dor irradiada para membro inferior."], ["A: pielonefrite crônica; B: causa neoplásica.", "Errada: as associações estão invertidas."]], "conc": "Pielonefrite: dor de flanco/lombar + febre e calafrios, náusea/vômito; Giordano, EAS, urocultura, função renal; imagem se complicação. Vascular ou neoplásica: dor progressiva com perda de peso/câncer prévio, ou dor muito intensa com colapso; investigação urgente. Red flags: febre/sepse, hipotensão, dor súbita intensa, déficit neurológico progressivo, anestesia em sela, retenção urinária nova, trauma importante, história de câncer, emagrecimento, imunossupressão.", "rac": "A: câncer prévio + emagrecimento + dor progressiva = red flags de neoplasia. B: febre + calafrios + dor em flanco = ITU alta.", "pista": "A tem 'câncer prévio' e 'emagrecimento'; B tem 'febre' e 'calafrios'.", "mud": "Se B tivesse cólica em ondas para a virilha sem febre, a hipótese seria cólica ureteral; com febre e cólica, obstrução infectada.", "cmp": "Red flags mudam a conduta: sem elas, a lombalgia mecânica dispensa imagem inicial; com elas, investiga-se a causa.", "arm": "Tratar lombalgia em paciente com câncer prévio como 'muscular' sem investigar.", "regra": "Câncer prévio ou emagrecimento: investigar neoplasia. Febre com dor em flanco: pielonefrite.", "cf": "Imunossupressão também é red flag e baixa o limiar para investigar infecção ou outras causas graves.", "fonte": "F2, Seção 07, p. 10 (tabela e red flags)"}]}, {"id": "A11", "titulo": "Abdome agudo: reconhecimento, sequência do exame, manobras e exames dirigidos", "arq": "F2", "pags": "10–15", "bloco": 5, "q": [{"n": 1, "sub": "Grupos de abdome agudo", "comp": "Classificar o abdome agudo pelo mecanismo", "tags": [], "rel": ["A03"], "enun": "Homem de 48 anos, usuário frequente de anti-inflamatório, tem dor epigástrica súbita, intensa, 'em facada', que logo se espalha por todo o abdome. Ao exame, o abdome está rígido e ele evita se mexer. Em qual grupo de abdome agudo o quadro se encaixa?", "ops": [["Perfurativo, como na perfuração de úlcera péptica.", "Correta: dor súbita com rigidez/peritonite é a pista do grupo perfurativo."], ["Obstrutivo, como volvo, bridas ou hérnia encarcerada.", "Errada: o obstrutivo cursa com distensão, dor em cólica, vômitos e parada de gases/fezes."], ["Vascular, como na isquemia mesentérica aguda.", "Errada: na isquemia, a dor é desproporcional ao exame, e aqui o exame está muito alterado."], ["Inflamatório, como na colecistite aguda.", "Errada: o inflamatório tem dor progressiva com defesa focal, não início súbito com rigidez difusa."]], "conc": "Grupos: inflamatório (apendicite, colecistite, diverticulite, pancreatite; dor progressiva, defesa focal, febre e náuseas variáveis); obstrutivo (obstrução intestinal, hérnia encarcerada, volvo; distensão, cólica, vômitos, parada de gases/fezes); perfurativo (úlcera/víscera oca; dor súbita + rigidez/peritonite, possível pneumoperitônio); vascular (isquemia mesentérica; dor desproporcional ao exame, fatores tromboembólicos); hemorrágico (aneurisma roto, gestação ectópica rota; choque, dor súbita, sangramento).", "rac": "1) Início súbito. 2) Rigidez (peritonite). 3) Fator de risco: AINE para úlcera. 4) Grupo perfurativo.", "pista": "Dor súbita + abdome rígido.", "mud": "Se a dor fosse em cólica, com distensão, vômitos e parada de eliminação de gases, o grupo seria obstrutivo.", "cmp": "Perfurativo: exame muito alterado. Vascular: exame pouco alterado para a dor relatada.", "arm": "Insistir em manobras dolorosas em paciente com rigidez evidente, sem antes avaliar estabilidade.", "regra": "Súbita + rigidez = perfurativo.", "cf": "Na peritonite/perfuração, a avaliação cirúrgica é urgente; a TC com contraste é feita quando o paciente está estável e é apropriada, sem atrasar a reanimação.", "fonte": "F2, Seção 08, p. 10 (tabela de grupos); Seção 10, p. 15 (peritonite/perfuração)"}, {"n": 2, "sub": "Isquemia mesentérica", "comp": "Reconhecer dor desproporcional ao exame e conduzir a investigação", "tags": [], "rel": [], "enun": "Mulher de 76 anos com fibrilação atrial sem anticoagulação apresenta dor abdominal intensa há 4 horas, que considera a pior da vida. O abdome está flácido, com dor apenas discreta à palpação. O lactato está normal. Qual é a conduta coerente com o material?", "ops": [["Manter alta suspeição de isquemia mesentérica e solicitar angio-TC, mesmo com lactato normal.", "Correta: é exatamente o que o material descreve para isquemia mesentérica."], ["Descartar isquemia porque o lactato está normal e o abdome está flácido.", "Errada: lactato normal não exclui, e o exame pouco alterado é justamente a pista."], ["Tratar como dispepsia funcional, pois o exame físico abdominal é pobre e inespecífico.", "Errada: dor súbita intensa em idosa com fibrilação atrial exige investigação urgente."], ["Pesquisar o sinal de Blumberg repetidas vezes até confirmar a presença de peritonite generalizada.", "Errada: a ausência de peritonite não exclui isquemia, e repetir manobras dolorosas não é recomendado."]], "conc": "Isquemia mesentérica: dor desproporcional ao exame, fatores tromboembólicos. Exames: alta suspeição clínica; o lactato pode elevar-se, mas normal não exclui; angio-TC na suspeita e avaliação imediata.", "rac": "1) Fibrilação atrial sem anticoagulação: fonte de êmbolo. 2) Dor intensa com abdome pouco alterado: desproporção. 3) Lactato normal não afasta. 4) Angio-TC.", "pista": "'A pior dor da vida' com abdome flácido.", "mud": "Se o abdome estivesse rígido com dor súbita, o quadro sugeriria perfuração.", "cmp": "Na isquemia, o exame é pobre no início; na perfuração, o exame é exuberante.", "arm": "Ser tranquilizado por exame físico benigno e lactato normal.", "regra": "Dor desproporcional ao exame + fator tromboembólico = isquemia mesentérica até prova em contrário.", "cf": "Com a evolução, a isquemia pode levar a necrose e peritonite; esperar o exame piorar atrasa o diagnóstico.", "fonte": "F2, Seção 08, p. 10 (tabela); Seção 10, p. 15 (isquemia mesentérica)"}, {"n": 3, "sub": "Ordem do exame abdominal no OSCE", "comp": "Executar o exame abdominal na sequência correta", "tags": ["osce"], "rel": [], "enun": "Na estação de abdome agudo, qual sequência de exame físico pontua corretamente segundo o material, após apresentação, consentimento, sinais vitais e anamnese?", "ops": [["Inspeção, ausculta, percussão e palpação (superficial e depois profunda), começando longe da dor.", "Correta: ausculta antes da palpação e início longe da dor são pontos do material."], ["Palpação profunda no ponto de maior dor → ausculta → inspeção → percussão.", "Errada: começar pela palpação profunda no ponto doloroso é o oposto do recomendado."], ["Inspeção → palpação → percussão → ausculta, começando pelo ponto de maior dor.", "Errada: a ausculta vem antes da palpação, e não se começa pelo ponto mais doloroso."], ["Manobras de Blumberg e Rovsing primeiro, para confirmar a hipótese, e depois o exame geral do abdome.", "Errada: manobras dirigidas são a última etapa."]], "conc": "Ordem certa: 1) apresentar-se, consentimento, sinais vitais e aparência, pesquisar choque/peritonite antes de manobras dolorosas; 2) anamnese (início, migração, caráter, irradiação, febre, vômito, evacuação, gases, urina, gravidez/menstruação); 3) inspeção (distensão, cicatrizes, hérnias, equimoses, movimentos respiratórios, imobilidade antálgica); 4) ausculta antes da palpação; 5) percussão suave (timpanismo, macicez, dor); 6) palpação superficial → profunda → órgãos/massas → manobras dirigidas, sempre começando longe do ponto de maior dor.", "rac": "Ausculta antes de palpar evita alterar os ruídos; começar longe da dor permite comparar e não provoca defesa precoce.", "pista": "'Ausculta antes da palpação' e 'começar longe do ponto de maior dor'.", "mud": "Em paciente instável ou com peritonite evidente, manobras dolorosas adicionais devem ser limitadas.", "cmp": "Palpação superficial: mão espalmada, pressão leve, todos os quadrantes, observa fácies e defesa. Profunda: pressão gradual na expiração, procura massas e órgãos; evitar se defesa intensa ou instabilidade.", "arm": "Ir direto à manobra 'famosa' (Blumberg, Murphy) sem o exame sistemático.", "regra": "Inspeção → ausculta → percussão → palpação (superficial, profunda) → manobras; começar longe da dor.", "cf": "Descrever no registro: abdome plano/globoso, flácido/tenso, ruídos, timpanismo/macicez, regiões dolorosas, defesa voluntária x involuntária, massas, descompressão/peritonismo.", "fonte": "F2, Seção 08, p. 11 (ordem certa no OSCE; palpação superficial e profunda)"}, {"n": 4, "sub": "Sinal de Murphy", "comp": "Executar e interpretar o sinal de Murphy", "tags": ["osce"], "rel": [], "enun": "Mulher de 45 anos com dor em hipocôndrio direito há 2 dias e febre baixa. Você apoia os dedos sob o rebordo costal direito, na linha hemiclavicular, pede expiração e depois inspiração profunda. A paciente interrompe abruptamente a inspiração por dor. Qual é a interpretação e o próximo exame?", "ops": [["Murphy positivo, sugestivo de colecistite, mas não definitivo; confirmar com US.", "Correta: o sinal sugere inflamação vesicular e o material indica US e exames conforme clínica."], ["Murphy positivo, que confirma colecistite e dispensa exames de imagem.", "Errada: o material diz que o sinal sugere, mas não é definitivo."], ["Sinal de Rovsing positivo, sugestivo de apendicite aguda e de irritação peritoneal.", "Errada: Rovsing é dor em FID ao comprimir a FIE."], ["Giordano positivo, sugestivo de pielonefrite aguda à direita.", "Errada: Giordano é pesquisado por percussão no ângulo costovertebral."]], "conc": "Murphy: paciente em decúbito dorsal; dedos sob o rebordo costal direito, na linha hemiclavicular; expiração e depois inspiração profunda mantendo pressão gentil. Positivo: interrupção abrupta da inspiração por dor localizada. Sugere inflamação vesicular, mas não é definitivo. Colecistite: hemograma, provas hepáticas quando indicadas e ultrassom (espessamento de parede, cálculo, líquido perivesicular, Murphy ultrassonográfico).", "rac": "1) Dor em hipocôndrio direito + febre. 2) Interrupção inspiratória à compressão subcostal. 3) Murphy positivo. 4) Confirmar com US.", "pista": "'Interrompe abruptamente a inspiração'.", "mud": "Sem interrupção da inspiração e com dor difusa, o sinal seria negativo e outras causas deveriam ser consideradas.", "cmp": "Murphy (vesícula, hipocôndrio direito) x Giordano (rim, ângulo costovertebral).", "arm": "Confundir dor à palpação com Murphy positivo; o critério é a parada da inspiração.", "regra": "Murphy positivo sugere colecistite; confirme com US.", "cf": "No ultrassom, o Murphy ultrassonográfico (dor com o transdutor sobre a vesícula) é um dos achados que apoiam colecistite.", "fonte": "F2, Seção 09, pp. 11–12 (Murphy); Seção 10, p. 14 (colecistite)"}, {"n": 5, "sub": "Blumberg e alternativas menos dolorosas", "comp": "Pesquisar irritação peritoneal com segurança", "tags": ["osce"], "rel": [], "enun": "Paciente com dor em FID tem defesa involuntária e dor importante ao tossir. O examinador pergunta se você vai pesquisar o sinal de Blumberg com força para 'ter certeza'. Qual é a resposta adequada?", "ops": [["Não repetir com força: defesa involuntária e dor à tosse já indicam peritonismo.", "Correta: é a orientação do material para o Blumberg."], ["Sim, a descompressão brusca vigorosa é obrigatória para confirmar peritonite.", "Errada: o material orienta não repetir com força e usar sinais menos dolorosos."], ["Não é necessário avaliar sinais de peritonismo em paciente com dor na FID.", "Errada: a irritação peritoneal é dado central na avaliação."], ["Pesquisar Blumberg sempre no ponto de maior dor, com pressão profunda e rápida, para não perder o sinal.", "Errada: deve-se pressionar lentamente, de preferência fora da região de maior dor."]], "conc": "Blumberg: pressionar lenta e delicadamente um ponto abdominal, de preferência fora da maior dor, e retirar a mão mais rápido. Positivo: dor maior na soltura do que na compressão. Não repetir com força; rigidez, dor à tosse/percussão ou defesa involuntária já podem orientar peritonismo. Sinal da tosse/percussão leve: exacerbação da dor localizada sugere irritação peritoneal com menos desconforto. Na FID pode ocorrer na apendicite, mas não é específico.", "rac": "1) Defesa involuntária e dor à tosse já indicam peritonismo. 2) Repetir descompressão com força só causa sofrimento. 3) Registrar os achados e limitar manobras.", "pista": "'Dor importante ao tossir' + 'defesa involuntária'.", "mud": "Se o abdome estivesse flácido e sem dor à tosse, uma pesquisa delicada do Blumberg poderia acrescentar informação.", "cmp": "Defesa voluntária: o paciente contrai, pode relaxar. Defesa involuntária (rigidez): contração reflexa, sinal de peritonite.", "arm": "Achar que a manobra mais dolorosa é a 'mais confiável'.", "regra": "Peritonismo evidente: não repita Blumberg com força; use tosse e percussão leve.", "cf": "Registro sugerido: 'Dor à palpação superficial e profunda em FID, com defesa involuntária e dor à tosse; manobras dolorosas adicionais limitadas.'", "fonte": "F2, Seção 09, pp. 12 e 14 (Blumberg; sinal da tosse); p. 15 (registro com peritonismo)"}, {"n": 6, "sub": "Rovsing e ponto de McBurney", "comp": "Executar Rovsing e localizar McBurney", "tags": ["osce"], "rel": [], "enun": "Jovem de 19 anos com dor que começou em torno do umbigo e migrou para a FID. Você comprime suavemente a fossa ilíaca ESQUERDA, e ele refere dor na fossa ilíaca DIREITA. Depois palpa o ponto na junção do terço lateral com o terço médio da linha entre a espinha ilíaca anterossuperior direita e o umbigo, que também é doloroso. Como descrever esses achados?", "ops": [["Rovsing positivo e dor no ponto de McBurney; reforçam a suspeita de apendicite, sem confirmá-la sozinhos.", "Correta: Rovsing é dor na FID ao comprimir a FIE; McBurney fica na junção do terço lateral com o médio da linha EIAS direita-umbigo."], ["Blumberg positivo e Murphy positivo; confirmam apendicite.", "Errada: Blumberg é dor à descompressão; Murphy é interrupção inspiratória no hipocôndrio direito."], ["Rovsing negativo, pois a dor não ocorreu no local comprimido.", "Errada: Rovsing positivo é exatamente dor referida na FID ao comprimir a FIE."], ["Sinal do obturador positivo e dor no ponto de McBurney; indicam apêndice pélvico.", "Errada: o obturador é pesquisado por rotação interna do quadril fletido."]], "conc": "Rovsing: compressão suave da FIE; positivo se provoca dor referida na FID. Dor só na FIE não caracteriza Rovsing positivo. McBurney: imaginar a linha entre a EIAS direita e o umbigo e palpar o ponto na junção do terço lateral com o terço médio; positivo é dor localizada. Migração da dor periumbilical para a FID é história clássica, não obrigatória. Ambos podem apoiar apendicite, mas não confirmam sozinhos; outras causas de dor em FID existem.", "rac": "1) Compressão na FIE com dor na FID = Rovsing positivo. 2) Ponto descrito = McBurney. 3) História de migração. 4) Suspeita de apendicite, que exige exames.", "pista": "'Comprime a esquerda e dói a direita'.", "mud": "Se a dor ocorresse apenas na FIE durante a compressão, o Rovsing seria negativo.", "cmp": "Rovsing: dor referida. McBurney: dor localizada no ponto. Blumberg: dor à descompressão.", "arm": "Registrar Rovsing positivo quando a dor é só no local comprimido.", "regra": "Rovsing: aperta FIE, dói FID. McBurney: terço lateral da linha EIAS direita-umbigo.", "cf": "Exames para apendicite: hemograma, PCR quando útil, beta-hCG quando pertinente, ultrassom ou TC conforme faixa etária, apresentação e disponibilidade.", "fonte": "F2, Seção 09, pp. 12–13 (Rovsing e McBurney); Seção 10, p. 14 (apendicite)"}, {"n": 7, "sub": "Sinais do psoas e do obturador", "comp": "Relacionar a manobra à posição do apêndice", "tags": ["osce"], "rel": [], "enun": "Na estação, você flexiona o quadril e o joelho DIREITOS do paciente a cerca de 90° e roda a coxa internamente, de forma suave. O paciente refere dor hipogástrica. Qual sinal foi pesquisado e o que ele sugere?", "ops": [["Sinal do obturador positivo, sugerindo irritação do obturador interno, como no apêndice pélvico.", "Correta: é a técnica e a interpretação do obturador."], ["Sinal do psoas positivo, sugerindo apêndice retrocecal.", "Errada: o psoas é pesquisado por extensão passiva do quadril direito (decúbito lateral esquerdo) ou flexão contra resistência."], ["Sinal de Rovsing positivo, sugerindo irritação peritoneal na FID.", "Errada: Rovsing é compressão da FIE."], ["Sinal de Murphy positivo, sugerindo colecistite.", "Errada: Murphy é compressão subcostal direita com inspiração."]], "conc": "Psoas (apêndice retrocecal/irritação do iliopsoas): decúbito lateral esquerdo com extensão passiva do quadril direito, ou decúbito dorsal com flexão do quadril direito contra resistência; positivo = dor em FID/abdome inferior direito, não mera tensão muscular. Obturador (apêndice pélvico): quadril e joelho direitos a ~90°, ro let storageOK=true;
function fresh(){return {v:1,favs:[],marks:[],tent:{},hist:[],session:null}}

  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}
  return fresh();}

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function maxRun(a){let m=1,c=1;for(let i=1;i<a.length;i++){c=a[i]===a[i-1]?c+1:1;if(c>m)m=c;}return a.length?m:0;}
function balancedLetters(n){const base=Math.floor(n/4),rest=n%4;const arr=[];for(let k=0;k<4;k++)for(let i=0;i<base;i++)arr.push(k);
  shuffle([0,1,2,3]).slice(0,rest).forEach(k=>arr.push(k));
  let best=shuffle(arr.slice());for(let t=0;t<800&&maxRun(best)>3;t++){const c=shuffle(arr.slice());if(maxRun(c)<maxRun(best))best=c;}return best;}
function letterCounts(sess){const c=[0,0,0,0];sess.qids.forEach(id=>{c[sess.ord[id].indexOf(QMAP[id].correct)]++;});return c;}
function say(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const pct=(a,b)=>b?Math.round(100*a/b):0;
function lastAttempt(id){const t=S.tent[id];return t&&t.length?t[t.length-1]:null;}
function everWrong(id){return (S.tent[id]||[]).some(x=>!x.ok);}

/* ---------- sessão ---------- */
function newSession(opts){
  let qids=opts.qids.slice();if(opts.shuffle)shuffle(qids);
  let sess;for(let tries=0;tries<20;tries++){
    const L=balancedLetters(qids.length),ord={};
    qids.forEach((id,i)=>{const q=QMAP[id];const d=shuffle(q.ops.filter(o=>o.id!==q.correct).map(o=>o.id));d.splice(L[i],0,q.correct);ord[id]=d;});
    sess={id:Date.now(),modo:opts.modo,label:opts.label,qids,ord,resp:{},conf:{},done:{},cur:0,finished:false,startedAt:Date.now()};
    const c=letterCounts(sess);if(Math.max(...c)-Math.min(...c)<=1)break;}
  S.session=sess;save();view='quiz';render();window.scrollTo(0,0);}
function record(sess,id){const r=sess.resp[id];if(!r)return;const ok=r===QMAP[id].correct;
  (S.tent[id]=S.tent[id]||[]).push({opt:r,ok,conf:sess.conf[id]||null,at:Date.now(),modo:sess.modo});}
function finishSession(){const s=S.session;if(!s||s.finished)return;
  if(s.modo==='prova')s.qids.forEach(id=>record(s,id));
  s.finished=true;s.finishedAt=Date.now();const r=summarize(s);
  S.hist.push({at:s.finishedAt,modo:s.modo,label:s.label,n:s.qids.length,ok:r.ok,bad:r.bad,blank:r.blank});
  save();view='result';render();window.scrollTo(0,0);}
function summarize(s){let ok=0,bad=0,blank=0;const byA={},byB={},byC={baixa:[0,0],media:[0,0],alta:[0,0],'sem registro':[0,0]};
  s.qids.forEach(id=>{const q=QMAP[id],r=s.resp[id],answered=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    const a=byA[q.aula]=byA[q.aula]||{ok:0,bad:0,blank:0},b=byB[AULA[q.aula].bloco]=byB[AULA[q.aula].bloco]||{ok:0,bad:0,blank:0};
    if(!answered){blank++;a.blank++;b.blank++;return;}
    const k=s.conf[id]||'sem registro';const good=r===q.correct;byC[k][1]++;if(good){ok++;a.ok++;b.ok++;byC[k][0]++;}else{bad++;a.bad++;b.bad++;}});
  return {ok,bad,blank,byA,byB,byC};}

function vQuiz(){const s=S.session;if(!s){view='home';return vHome();}
  const id=s.qids[s.cur],q=QMAP[id],a=AULA[q.aula];const ord=s.ord[id];const r=s.resp[id];
  const reveal=s.finished||(s.modo==='estudo'&&s.done[id]);const answeredN=Object.keys(s.modo==='prova'?s.resp:s.done).length;
  const marked=S.marks.includes(id),fav=S.favs.includes(id);
  const nav=s.qids.map((qid,i)=>{let c='nb';const rr=s.resp[qid];
    if(s.finished||(s.modo==='estudo'&&s.done[qid])){if(rr)c+=rr===QMAP[qid].correct?' ok':' bad';}else if(rr)c+=' ans';
    if(i===s.cur)c+=' cur';if(S.marks.includes(qid))c+=' mk';
    const st=(s.finished||(s.modo==='estudo'&&s.done[qid]))?(rr?(rr===QMAP[qid].correct?'correta':'errada'):'em branco'):(rr?'respondida':'pendente');
    return `<button class="${c}" data-act="jump" data-v="${i}" aria-label="Questão ${i+1}, ${st}${S.marks.includes(qid)?', marcada':''}">${i+1}</button>`;}).join('');
  return `<div class="qbar">
    <div class="toolbar"><button class="btn ghost" data-act="go" data-v="home">Início</button>
      <span class="small muted mono" style="align-self:center">${s.cur+1}/${s.qids.length} · ${answeredN} respondidas</span>
      <button class="btn ghost" data-act="nav" aria-expanded="${navOpen}">${navOpen?'Fechar mapa':'Mapa de questões'}</button></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${s.qids.length}" aria-valuenow="${answeredN}"><i style="width:${pct(answeredN,s.qids.length)}%"></i></div>
    ${navOpen?`<div class="navgrid">${nav}</div><p class="small muted">Legenda: ponto amarelo = marcada para rever${s.modo==='prova'&&!s.finished?'; azul = respondida':'; verde = correta; vermelho = errada'}.</p>`:''}
  </div>
  <article class="qcard" style="margin-top:14px">
    <div class="qmeta"><span class="chip acc mono">${id}</span><span class="chip">${esc(a.titulo)}</span>${q.tags.includes('osce')?'<span class="chip">Estação OSCE</span>':''}${q.tags.includes('calculo')?'<span class="chip">Cálculo</span>':''}${s.modo==='prova'?'<span class="chip">Modo prova</span>':''}</div>
    <p class="enun">${esc(q.enun)}</p>
    ${!reveal?`<div class="conf"><span class="small muted" id="conf-l">Confiança (opcional):</span><div class="seg" role="group" aria-labelledby="conf-l">${['baixa','media','alta'].map(c=>`<button data-act="conf" data-v="${c}" aria-pressed="${s.conf[id]===c}">${c==='media'?'média':c}</button>`).join('')}</div></div>`:''}
    <div class="opts" role="group" aria-label="Alternativas">
      ${ord.map((oid,i)=>{const o=q.ops.find(x=>x.id===oid);let cls='opt',tag='';
        if(reveal){if(oid===q.correct){cls+=' right';tag='Correta';}else if(oid===r){cls+=' wrong';tag='Sua resposta';}}
        return `<button class="${cls}" data-act="pick" data-v="${oid}" aria-pressed="${r===oid}" ${reveal?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o.t)}${tag?`<span class="tag">${tag}${tag==='Correta'&&oid===r?' · sua resposta':''}</span>`:''}</span></button>`;}).join('')}
    </div>
    <div class="toolbar">
      <div class="row"><button class="btn" data-act="mark" aria-pressed="${marked}">${marked?'Desmarcar revisão':'Marcar para rever'}</button>
        <button class="btn" data-act="fav" aria-pressed="${fav}">${fav?'Remover favorita':'Favoritar'}</button></div>
      ${s.modo==='estudo'&&!s.done[id]&&!s.finished?`<button class="btn primary" data-act="confirm" ${r?'':'disabled'}>Confirmar resposta</button>`:''}
    </div>
    ${reveal?correction(q,r,ord):''}
    <div class="toolbar"><button class="btn" data-act="prev" ${s.cur===0?'disabled':''}>Anterior</button>
      ${s.cur<s.qids.length-1?`<button class="btn primary" data-act="next">Próxima</button>`:(s.finished?`<button class="btn primary" data-act="go" data-v="result">Ver relatório</button>`:'')}</div>
    ${!s.finished?(confirmFinish?finishBox(s):`<div class="row"><button class="btn" data-act="finish">${s.modo==='prova'?'Finalizar prova':'Encerrar e ver relatório'}</button></div>`):''}
  </article>`;}
function finishBox(s){const pend=s.qids.filter(id=>!(s.modo==='prova'?s.resp[id]:s.done[id])).length;
  return `<div class="confirmbox"><strong>${s.modo==='prova'?'Finalizar a prova?':'Encerrar o simulado?'}</strong>
  <p class="small">${pend?`${pend} questão(ões) sem resposta ${s.modo==='prova'?'serão contadas como em branco':'ficarão em branco'}. `:''}Depois de finalizar, as respostas não podem ser alteradas.</p>
  <div class="row"><button class="btn primary" data-act="finishyes">Finalizar</button><button class="btn" data-act="finishno">Continuar respondendo</button></div></div>`;}

function correction(q,r,ord){const ci=ord.indexOf(q.correct),co=q.ops.find(o=>o.id===q.correct);
  const ban=!r?`<div class="banner blank">Em branco. A resposta correta é a ${LET[ci]}.</div>`:(r===q.correct?`<div class="banner ok">Você acertou: alternativa ${LET[ci]}.</div>`:`<div class="banner bad">Você marcou ${LET[ord.indexOf(r)]}; a correta é a ${LET[ci]}.</div>`);
  const fig=q.figc&&DATA.figs[q.figc]?figHtml(q.figc):'';
  const rel=q.rel.length?`<p class="small muted">Relaciona-se com: ${q.rel.map(x=>esc(UN(x)+' — '+AULA[x].titulo)).join('; ')}.</p>`:'';
  return `<div class="aula">${ban}
  <h3>Mini-aula</h3>
  <dl>
   <div><dt>Resposta</dt><dd><b>${LET[ci]}.</b> ${esc(co.t)} ${esc(cap(co.a.replace(/^Correta[^:]*:\s*/,'')))}</dd></div>
   <div><dt>Conceito</dt><dd>${esc(q.ma.conc)}</dd></div>
   <div><dt>Raciocínio passo a passo</dt><dd>${esc(q.ma.rac)}</dd></div>
   <div><dt>Análise das alternativas</dt><dd><ul class="alts">${ord.map((oid,i)=>{const o=q.ops.find(x=>x.id===oid);return `<li><b>${LET[i]}</b><span>${esc(o.a)}</span></li>`;}).join('')}</ul></dd></div>
   <div><dt>Pista decisiva</dt><dd>${esc(q.ma.pista)}</dd></div>
   <div><dt>O que mudaria a resposta</dt><dd>${esc(q.ma.mud)}</dd></div>
   <div><dt>Comparação principal</dt><dd>${esc(q.ma.cmp)}</dd></div>
   <div><dt>Armadilha</dt><dd>${esc(q.ma.arm)}</dd></div>
   <div><dt>Regra de ouro</dt><dd class="gold">${esc(q.ma.regra)}</dd></div>
   <div><dt>Aplicação</dt><dd>${esc(q.ma.cf)}</dd></div>
   <div><dt>Fonte</dt><dd class="small">${esc(q.fonte.replace(/\bF1\b/g,'F1 ('+ARQ.F1+')').replace(/\bF2\b/g,'F2 ('+ARQ.F2+')'))}</dd></div>
  </dl>${fig}${rel}</div>`;}
function figHtml(k){const f=DATA.figs[k];return `<figure><span class="eyebrow">Figura do material</span>${f.rot?`<canvas data-fig="${k}" role="img" aria-label="${esc(f.alt)}"></canvas><div class="row"><button class="btn" data-act="rotfig" data-v="${k}">Ver na orientação original</button></div>`:`<img src="${f.src}" alt="${esc(f.alt)}">`}<figcaption>${esc(f.cap)}</figcaption></figure>`;}
const figRot={};
function drawFigs(){document.querySelectorAll('canvas[data-fig]').forEach(cv=>{const k=cv.dataset.fig,f=DATA.figs[k];const img=new Image();img.onload=()=>{const rot=!figRot[k];
  const ctx=cv.getContext('2d');if(rot){cv.width=img.height;cv.height=img.width;ctx.translate(cv.width,0);ctx.rotate(Math.PI/2);}else{cv.width=img.width;cv.height=img.height;}ctx.drawImage(img,0,0);};img.src=f.src;});}

function vResult(){const s=S.session;if(!s||!s.finished){view='home';return vHome();}const r=summarize(s);const n=s.qids.length;
  const answered=r.ok+r.bad;
  const aulas=Object.keys(r.byA).sort();
  const weak=aulas.map(k=>({k,...r.byA[k],t:r.byA[k].ok+r.byA[k].bad+r.byA[k].blank})).filter(x=>x.bad+x.blank>0).sort((x,y)=>(y.bad+y.blank)/y.t-(x.bad+x.blank)/x.t);
  const strong=aulas.filter(k=>{const x=r.byA[k];return x.bad===0&&x.blank===0&&x.ok>0;});
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Relatório · ${s.modo==='prova'?'modo prova':'modo estudo'}</span><h1>${esc(s.label)}</h1>
   <p class="muted">${new Date(s.finishedAt).toLocaleString('pt-BR')}</p></header>
  <section><div class="grid2">
   <div class="stat"><span class="small muted">Acertos sobre o total</span><b>${r.ok}/${n} · ${pct(r.ok,n)}%</b></div>
   <div class="stat"><span class="small muted">Acertos sobre as respondidas</span><b>${r.ok}/${answered} · ${pct(r.ok,answered)}%</b></div>
   <div class="stat"><span class="small muted">Erros</span><b>${r.bad}</b></div>
   <div class="stat"><span class="small muted">Em branco</span><b>${r.blank}</b></div></div></section>
  <section><h2>Por aula</h2><div class="tbl"><table><thead><tr><th>Aula</th><th>Acertos</th><th>Erros</th><th>Branco</th><th>%</th></tr></thead><tbody>
   ${aulas.map(k=>{const x=r.byA[k],t=x.ok+x.bad+x.blank;return `<tr><td><b class="mono">${k}</b> ${esc(AULA[k].titulo)}</td><td class="n">${x.ok}</td><td class="n">${x.bad}</td><td class="n">${x.blank}</td><td class="n"><div class="bar" title="${pct(x.ok,t)}%"><i style="width:${pct(x.ok,t)}%"></i></div>${pct(x.ok,t)}% de ${t}</td></tr>`;}).join('')}
  </tbody></table></div></section>
  <section><h2>Por bloco</h2><div class="tbl"><table><thead><tr><th>Bloco</th><th>Acertos</th><th>Total</th></tr></thead><tbody>
   ${Object.keys(r.byB).map(b=>{const x=r.byB[b],t=x.ok+x.bad+x.blank;return `<tr><td>${esc(BLOCOS[b])}</td><td class="n">${x.ok} (${pct(x.ok,t)}%)</td><td class="n">${t}</td></tr>`;}).join('')}</tbody></table></div></section>
  <section><h2>Por confiança declarada</h2><div class="tbl"><table><thead><tr><th>Confiança</th><th>Acertos / respondidas</th></tr></thead><tbody>
   ${Object.entries(r.byC).filter(([k,v])=>v[1]).map(([k,v])=>`<tr><td>${k==='media'?'média':k}</td><td class="n">${v[0]}/${v[1]} (${pct(v[0],v[1])}%)</td></tr>`).join('')||'<tr><td colspan="2">Nenhuma resposta respondida.</td></tr>'}</tbody></table></div>
   ${r.byC.alta[1]-r.byC.alta[0]>0?`<p class="notice">${r.byC.alta[1]-r.byC.alta[0]} erro(s) com confiança alta: são os mais importantes para revisar, porque indicam um conceito aprendido de forma errada.</p>`:''}</section>
  <section><h2>Plano de revisão</h2>
   ${weak.length?`<ul class="plain">${weak.map(x=>`<li><b>${esc(AULA[x.k].titulo)}</b>: ${x.bad} erro(s) e ${x.blank} em branco de ${x.t}. Reler ${esc(AULA[x.k].arq)} (${esc(ARQ[AULA[x.k].arq])}), pp. ${esc(AULA[x.k].pags)}, e refazer pelo caderno de erros.</li>`).join('')}</ul>`:'<p>Nenhum erro nem questão em branco neste simulado.</p>'}
   ${strong.length?`<p class="small muted">Pontos fortes: ${strong.map(k=>esc(AULA[k].titulo)).join('; ')}.</p>`:''}</section>
  <section><h2>Próximos passos</h2><div class="row">
   <button class="btn primary" data-act="reviewsess">Ver correção questão a questão</button>
   <button class="btn" data-act="redo">Refazer as mesmas questões</button>
   <button class="btn" data-act="redraw">Novo sorteio das mesmas aulas</button>
   <button class="btn" data-act="go" data-v="erros">Caderno de erros</button></div></section>
  <section><h2>Exportar resultado</h2><p class="small muted">Gera uma tabela (CSV) com sua resposta, a correta e a confiança de cada questão. Nada é enviado a servidores.</p>
   <div class="row"><button class="btn" data-act="csvcopy">Copiar CSV</button><button class="btn" data-act="csvdl">Baixar CSV</button><button class="btn" data-act="csvshow">${csvShown?'Ocultar texto':'Mostrar texto'}</button></div>
   ${csvShown?`<label for="csvt" class="small muted">Selecione e copie o texto abaixo se os botões não funcionarem neste aplicativo.</label><textarea id="csvt" readonly>${esc(csv(s))}</textarea>`:''}</section>`;}
function csv(s){const rows=[['questao','aula','subtema','sua_resposta','resposta_correta','resultado','confianca']];
  s.qids.forEach(id=>{const q=QMAP[id],ord=s.ord[id],r=s.resp[id],ans=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    rows.push([id,AULA[q.aula].titulo,q.sub,ans?LET[ord.indexOf(r)]+') '+q.ops.find(o=>o.id===r).t:'',LET[ord.indexOf(q.correct)]+') '+q.ops.find(o=>o.id===q.correct).t,ans?(r===q.correct?'acerto':'erro'):'branco',s.conf[id]||'']);});
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');}

function vErros(){const ids=ALLQ.filter(everWrong);
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Caderno de erros</span><h1>Questões que você já errou</h1>
  <p class="muted">A primeira resposta fica registrada para sempre; refazer a questão cria uma nova tentativa. Uma questão passa a "revisada" quando a última tentativa está correta.</p></header>
  ${ids.length?`<div class="row"><button class="btn primary" data-act="rev" data-v="pend">Treinar as pendentes (${ids.filter(id=>!lastAttempt(id).ok).length})</button></div>
  <div class="stack">${ids.map(id=>{const q=QMAP[id],t=S.tent[id],first=t[0],firstWrong=t.find(x=>!x.ok),rev=lastAttempt(id).ok;
    const txt=o=>esc(q.ops.find(x=>x.id===o).t);
    return `<div class="card stack"><div class="qmeta"><span class="chip acc mono">${id}</span><span class="chip">${esc(AULA[q.aula].titulo)}</span><span class="chip">${rev?'Revisada':'Pendente'}</span><span class="chip mono">${t.length} tentativa(s)</span></div>
      <p>${esc(q.enun)}</p>
      <p class="small"><b>Primeira resposta:</b> ${txt(first.opt)} ${first.ok?'(acerto)':'(erro)'}${first.conf?` · confiança ${first.conf==='media'?'média':first.conf}`:''}</p>
      ${first.ok?`<p class="small"><b>Primeiro erro:</b> ${txt(firstWrong.opt)}</p>`:''}
      <p class="small"><b>Correta:</b> ${txt(q.correct)}</p>
      <details><summary>Ver explicação</summary><p class="small">${esc(q.ma.conc)}</p><p class="small gold">${esc(q.ma.regra)}</p><p class="small muted">${esc(q.fonte)}</p></details>
      <div class="row"><button class="btn" data-act="one" data-v="${id}">Refazer esta questão</button></div></div>`;}).join('')}</div>`
  :'<p class="card">Nenhum erro registrado ainda. Os erros dos simulados aparecem aqui automaticamente.</p>'}`;}

function vSobre(){return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Sobre o simulado</span><h1>Fontes, cobertura e critérios</h1></header>
  <section><h2>Material-base</h2><div class="tbl"><table><thead><tr><th>Código</th><th>Arquivo</th><th>Conteúdo</th></tr></thead><tbody>
   <tr><td class="n">F1</td><td>${esc(ARQ.F1)}</td><td>HAM Adulto, 4º período: Aulas 1–7 (pp. 3–19), revisão de véspera (p. 20) e figuras complementares (pp. 21–24)</td></tr>
   <tr><td class="n">F2</td><td>${esc(ARQ.F2)}</td><td>Guia OSCE HAM Adulto: seções 01–10 (pp. 1–15) e prancha visual (p. 16)</td></tr></tbody></table></div>
   <p class="small muted">As 7 aulas de F1 e 4 unidades temáticas de F2 (seções 01–03, 04–05A, 06–07 e 08–10): 11 unidades × 8 questões = 88 questões e 352 alternativas. A revisão de véspera e as figuras complementares não viraram unidades; foram usadas como complemento nas correções. As páginas citam o número impresso no rodapé de cada PDF.</p></section>
  <section><h2>Cobertura por aula</h2><div class="stack">${DATA.aulas.map(a=>`<details class="card"><summary>${a.id} · ${esc(a.titulo)} <span class="muted small">(${a.arq}, pp. ${esc(a.pags)})</span></summary><ul class="plain small">${a.q.map(q=>`<li><span class="mono">Q${String(q.n).padStart(2,'0')}</span> ${esc(q.sub)}: ${esc(q.comp)}</li>`).join('')}</ul></details>`).join('')}</div></section>
  <section><h2>Critérios adotados</h2><ul class="plain small">${DATA.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Gabarito</h2><p class="small muted">A posição da alternativa correta é sorteada a cada simulado, com quantidades equilibradas de A, B, C e D (diferença máxima de 1) e sem mais de três letras iguais seguidas sempre que possível. Ao retomar um simulado, a ordem salva é mantida.</p></section>
  <section><h2>Uso</h2><p class="small muted">Material de estudo para prova e OSCE de graduação. Não substitui protocolos institucionais nem a conferência de doses e condutas no atendimento real.</p></section>`;}

/* ---------- eventos ---------- */
function bind(){document.querySelectorAll('[data-act]').forEach(el=>{const ev=(el.type==='checkbox'||el.type==='range')?(el.type==='range'?'input':'change'):'click';el.addEventListener(ev,e=>act(el.dataset.act,el.dataset.v,el,e));});}
function startAula(aid){newSession({modo:'estudo',qids:ALLQ.filter(id=>QMAP[id].aula===aid),label:UN(aid)+' · '+AULA[aid].titulo,shuffle:false});}
function act(a,v,el){const s=S.session;
  switch(a){
  case 'go':view=v;confirmReset=false;render();window.scrollTo(0,0);break;
  case 'resume':view='quiz';render();break;
  case 'fullmodo':fullModo=v;render();break;
  case 'full':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · 88 questões',shuffle:false});break;
  case 'fullshuf':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · ordem embaralhada',shuffle:true});break;
  case 'aula':startAula(v);break;
  case 'custom':view='custom';render();window.scrollTo(0,0);break;
  case 'caula':el.checked?custom.aulas.add(v):custom.aulas.delete(v);custom.qtd=0;render();break;
  case 'call':DATA.aulas.forEach(x=>custom.aulas.add(x.id));custom.qtd=0;render();break;
  case 'cnone':custom.aulas.clear();custom.qtd=0;render();break;
  case 'cosce':custom.osce=el.checked;custom.qtd=0;render();break;
  case 'cqtd':custom.qtd=+el.value;document.getElementById('qtdv').textContent=custom.qtd;document.querySelector('[data-act="cstart"]').textContent='Começar '+custom.qtd+' questões';break;
  case 'cmodo':custom.modo=v;render();break;
  case 'cshuf':custom.shuf=el.checked;break;
  case 'cstart':{let pool=poolCustom();const n=custom.qtd||pool.length;if(n<pool.length){pool=shuffle(pool.slice()).slice(0,n);pool.sort((x,y)=>ALLQ.indexOf(x)-ALLQ.indexOf(y));}
    newSession({modo:custom.modo,qids:pool,label:'Personalizado · '+pool.length+' questões'+(custom.osce?' (OSCE)':''),shuffle:custom.shuf});break;}
  case 'rev':{let ids=[],label='';
    if(v==='erradas'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok;});label='Revisão das erradas';}
    if(v==='alta'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok&&l.conf==='alta';});label='Erros de alta confiança';}
    if(v==='marcadas'){ids=ALLQ.filter(id=>S.marks.includes(id));label='Questões marcadas';}
    if(v==='favs'){ids=ALLQ.filter(id=>S.favs.includes(id));label='Favoritas';}
    if(v==='pend'){ids=ALLQ.filter(id=>everWrong(id)&&!lastAttempt(id).ok);label='Caderno de erros · pendentes';}
    if(ids.length)newSession({modo:'estudo',qids:ids,label,shuffle:false});break;}
  case 'one':newSession({modo:'estudo',qids:[v],label:'Refazer '+v,shuffle:false});break;
  case 'reset':confirmReset=true;render();break;
  case 'resetno':confirmReset=false;render();break;
  case 'resetyes':S=fresh();save();confirmReset=false;render();say('Progresso apagado.');break;
  case 'nav':navOpen=!navOpen;render();break;
  case 'jump':s.cur=+v;confirmFinish=false;save();render();window.scrollTo(0,0);break;
  case 'prev':if(s.cur>0){s.cur--;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'next':if(s.cur<s.qids.length-1){s.cur++;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'pick':{const id=s.qids[s.cur];if(s.finished||(s.modo==='estudo'&&s.done[id]))break;s.resp[id]=v;save();render();
    if(s.modo==='prova')say('Resposta registrada.');break;}
  case 'conf':{const id=s.qids[s.cur];s.conf[id]=s.conf[id]===v?undefined:v;save();render();break;}
  case 'confirm':{const id=s.qids[s.cur];if(!s.resp[id])break;s.done[id]=true;record(s,id);save();render();
    say(s.resp[id]===QMAP[id].correct?'Resposta correta.':'Resposta incorreta. Veja a correção.');break;}
  case 'mark':{const id=s.qids[s.cur];const i=S.marks.indexOf(id);i>=0?S.marks.splice(i,1):S.marks.push(id);save();render();break;}
  case 'fav':{const id=s.qids[s.cur];const i=S.favs.indexOf(id);i>=0?S.favs.splice(i,1):S.favs.push(id);save();render();break;}
  case 'finish':confirmFinish=true;render();break;
  case 'finishno':confirmFinish=false;render();break;
  case 'finishyes':confirmFinish=false;finishSession();break;
  case 'reviewsess':s.cur=0;view='quiz';render();window.scrollTo(0,0);break;
  case 'redo':newSession({modo:s.modo,qids:s.qids.slice(),label:s.label+' (refeito)',shuffle:false});break;
  case 'redraw':{const aulas=new Set(s.qids.map(id=>QMAP[id].aula));const pool=ALLQ.filter(id=>aulas.has(QMAP[id].aula));
    newSession({modo:s.modo,qids:pool,label:'Novo sorteio · '+aulas.size+' aula(s)',shuffle:true});break;}
  case 'csvcopy':{const t=csv(s);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>say('CSV copiado.'),()=>{csvShown=true;render();say('Não foi possível copiar; o texto está na caixa abaixo.');});}else{csvShown=true;render();}break;}
  case 'csvdl':{try{const b=new Blob(['﻿'+csv(s)],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='resultado-simulado-hamped.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){}
    csvShown=true;render();say('Se o download não começou, copie o texto exibido.');break;}
  case 'csvshow':csvShown=!csvShown;render();break;
  case 'rotfig':figRot[v]=!figRot[v];el.textContent=figRot[v]?'Ver girada para leitura':'Ver na orientação original';drawFigs();break;
  }}
render();
</script>
