: [["Falha ao imunossupressor", "Anti-TNF", "Escalonamento"], ["RCU leve", "Mesalazina oral/retal", "Base"], ["Colite refratária a tudo", "Cirurgia", "Refratariedade"]], "arm": "Usar corticoide como manutenção.", "ouro": "Corticoide apaga o incêndio; imunossupressor impede que reacenda.", "m2": ["Qual a principal indicação da mesalazina?", "RCU leve a moderada (pouco benefício na Crohn)."], "n": ["Mesalazina: RCU leve–moderada.", "Corticoide: indução.", "Nunca manutenção com corticoide.", "Imunossupressores: manutenção.", "Anti-TNF: moderada–grave/refratária/fístulas."]}, {"id": "C10-Q07", "t": "C10", "sub": "Crohn fistulizante", "comp": "Tratamento", "rac": "Decisão", "dif": "difícil", "p": [33], "q": "Homem de 23 anos, tabagista, com Crohn ileocecal, perda ponderal, massa em FID e fístula perianal; PCR 68, albumina 2,9. Qual estratégia é coerente com o material?", "o": [["Corticoide para indução e anti-TNF (± imunossupressor), tratar a fístula com sedenho + biológico e cessar o tabagismo", "Doença moderada–grave fistulizante exige biológico; cirurgia se estenose obstrutiva, abscesso não drenável ou refratariedade."], ["Mesalazina oral isolada em dose alta, por ser o tratamento de base de todas as formas de DII", "Mesalazina tem pouco benefício na Crohn."], ["Ressecção ampla de todo o intestino doente, já que a cirurgia é curativa na Crohn", "Cirurgia não é curativa na Crohn; a regra é poupar intestino."], ["Fistulotomia imediata sem tratamento clínico associado, por ser lesão apenas local", "A fístula da Crohn exige tratamento sistêmico e cuidado com a continência."]], "pista": "Fistulizante = biológico; Crohn = poupar intestino.", "pp": ["Gravidade: moderada–grave, fistulizante.", "Indução: corticoide.", "Biológico: anti-TNF (± imunossupressor).", "Fístula perianal: sedenho + biológico.", "Cessar tabagismo; cirurgia conforme complicações."], "ap": "<p>No caso 10.1 do resumo, o esperado à colonoscopia é úlcera aftosa, pedra de calçamento e lesões salteadas; biópsia com granulomas; ASCA positivo; enterorressonância para estenoses e fístulas.<\/p>", "mud": [["Estenose obstrutiva fibrótica", "Cirurgia (ressecção econômica ou estricturoplastia)", "Complicação mecânica"], ["Abscesso não drenável", "Cirurgia", "Complicação"], ["Doença leve sem fístulas", "Escalonamento menor", "Gravidade"]], "arm": "Acreditar que a cirurgia cura a Crohn.", "ouro": "Crohn: biológico para fístula, cirurgia econômica para complicação.", "m2": ["Qual técnica permite tratar estenose curta de delgado na Crohn sem ressecar?", "Estricturoplastia."], "n": ["Fistulizante: anti-TNF.", "Fístula perianal: sedenho + biológico.", "Cessar tabagismo.", "Cirurgia não curativa.", "Poupar intestino."], "img": ["c-032-041"]}, {"id": "C10-Q08", "t": "C10", "sub": "Megacólon tóxico", "comp": "Conduta de urgência", "rac": "Priorização", "dif": "média", "p": [33, 34], "q": "Mulher de 31 anos com RCU extensa, 12 evacuações sanguinolentas por dia, recebeu loperamida e tramadol na UPA. Agora: T 39,1 °C, FC 126, PA 92 × 58, abdome distendido. Rx: transverso com 7,5 cm. Qual a conduta inicial?", "o": [["UTI, jejum, volume, correção HE, hidrocortisona EV, ATB e suspender opioides e antidiarreicos", "Megacólon tóxico é emergência clínica; cirurgia se perfuração, peritonite, instabilidade, piora ou falha em 24–72 h."], ["Manter a loperamida em dose maior para reduzir o número de evacuações e a desidratação da paciente", "Antidiarreicos e opioides precipitam e pioram o megacólon."], ["Colonoscopia descompressiva imediata com biópsias para confirmar atividade", "Risco de perfuração do cólon dilatado."], ["Alta com mesalazina oral e retorno em 7 dias para reavaliação ambulatorial", "Toxicidade sistêmica com dilatação exige internação em UTI."]], "pista": "Cólon > 6 cm + toxicidade + antidiarreico/opioide.", "pp": ["Critérios: dilatação > 6 cm + febre + taquicardia + leucocitose/anemia + hipotensão.", "Gatilhos: antidiarreico e opioide.", "Medidas: UTI, jejum, volume, HE, corticoide EV, ATB.", "Suspender opioides/antidiarreicos; Rx seriado.", "Falha/complicação → colectomia subtotal + ileostomia terminal."], "ap": "<p>Fisiopatologia: inflamação transmural grave → mediadores → paralisia da musculatura → dilatação → isquemia, necrose, perfuração, sepse. Complemento (Jalan): dilatação > 6 cm + ≥ 3 de febre > 38,6 °C, FC > 120, leucócitos > 10.500, anemia; + ≥ 1 de desidratação, alteração de consciência, distúrbio eletrolítico, hipotensão.<\/p>", "mud": [["Perfuração ou peritonite", "Colectomia subtotal + ileostomia terminal", "Complicação"], ["Piora da dilatação em 24–72 h", "Cirurgia", "Falha clínica"], ["Melhora clínica", "Manter tratamento clínico", "Resposta"]], "arm": "Tratar a diarreia com antidiarreico na colite grave.", "ouro": "Megacólon tóxico: tira opioide e antidiarreico, dá corticoide e antibiótico, vigia para operar.", "m2": ["Qual cirurgia é indicada no megacólon tóxico que falha ao clínico?", "Colectomia subtotal com ileostomia terminal (coto retal preservado para reconstrução futura)."], "n": ["Cólon > 6 cm + toxicidade.", "Gatilhos: opioides e antidiarreicos.", "UTI, corticoide EV, ATB.", "Falha 24–72 h → cirurgia.", "Colectomia subtotal + ileostomia."], "img": ["c-033-042"]}, {"id": "C10-Q09", "t": "C10", "sub": "Indicações cirúrgicas", "comp": "Indicação cirúrgica", "rac": "Comparação", "dif": "média", "p": [33], "q": "Qual afirmação sobre a cirurgia na DII é correta segundo a Aula 11?", "o": [["Na RCU, a proctocolectomia é curativa; na Crohn, a cirurgia não cura e deve poupar intestino", "RCU restringe-se a cólon e reto; Crohn pode acometer qualquer segmento e recidivar."], ["Na Crohn, a proctocolectomia total é curativa e deve ser indicada precocemente em todos os pacientes", "A Crohn recidiva em outros segmentos; cirurgia é econômica."], ["Na RCU, a cirurgia é contraindicada na presença de displasia por risco de disseminação", "Displasia/câncer é indicação de cirurgia na RCU."], ["Fístulas e estenoses são as principais indicações cirúrgicas na RCU", "São complicações típicas da Crohn."]], "pista": "Remover o órgão-alvo cura a RCU.", "pp": ["RCU: megacólon tóxico, perfuração, displasia/câncer, refratária, hemorragia grave.", "Crohn: estenose obstrutiva, fístulas, abscessos, refratariedade.", "RCU: proctocolectomia curativa.", "Crohn: ressecções econômicas, estricturoplastias."], "ap": "<p>A diferença de profundidade (transmural na Crohn) e de distribuição (salteada) explica por que a Crohn faz fístulas, estenoses e recidivas, enquanto a RCU sangra, dilata e evolui para displasia.<\/p>", "mud": [["RCU com displasia de alto grau", "Proctocolectomia", "Risco de câncer"], ["Crohn com estenose ileal curta", "Estricturoplastia ou ressecção econômica", "Poupar intestino"], ["RCU com hemorragia grave refratária", "Cirurgia", "Indicação de urgência"]], "arm": "Aplicar a lógica curativa da RCU à Crohn.", "ouro": "RCU: tirou cólon e reto, curou. Crohn: opera a complicação e poupa intestino.", "m2": ["Na colectomia de urgência por RCU grave, por que se preserva o coto retal?", "Para permitir reconstrução futura (ex.: bolsa ileal)."], "n": ["RCU: proctocolectomia curativa.", "RCU: megacólon, perfuração, displasia, refratária, hemorragia.", "Crohn: estenose, fístula, abscesso, refratariedade.", "Crohn: não curativa.", "Ressecções econômicas."]}, {"id": "C11-Q01", "t": "C11", "sub": "Reconhecimento clínico do Zenker", "comp": "Diagnóstico", "rac": "Reconhecimento de padrão", "dif": "fácil", "p": [35, 41, 42], "q": "Homem de 78 anos com disfagia “alta” há 2 anos, tosse ao deitar, regurgitação de alimentos ingeridos horas antes e halitose importante. Ao comprimir a região cervical esquerda, ouve-se gorgolejo. Teve pneumonia há 3 meses. Qual o diagnóstico e o exame de escolha?", "o": [["Divertículo de Zenker; esofagograma", "Idoso + disfagia alta + regurgitação de alimento não digerido + halitose + massa cervical = Zenker; o esofagograma mostra saco, colo e tamanho."], ["Megaesôfago chagásico; manometria", "Megaesôfago dá disfagia progressiva baixa e emagrecimento, em faixa etária menor."], ["DRGE com estenose péptica; prova com IBP", "Não há pirose; disfagia alta com regurgitação de alimento não digerido não é DRGE típica."], ["Câncer de esôfago distal; EDA isolada", "A EDA é recomendada para excluir neoplasia, mas o exame de escolha do Zenker é o esofagograma."]], "pista": "Regurgitação de alimento “de ontem” + massa cervical esquerda.", "pp": ["Perfil: homem > 70 anos.", "Disfagia alta, regurgitação tardia, halitose, gorgolejo cervical.", "Pneumonia = aspiração → divertículo sintomático.", "Esofagograma (tamanho define conduta); EDA cuidadosa para excluir malignidade."], "ap": "<p>O caso clínico 11.1 do resumo é este. O complemento lembra que, na EDA, o aparelho tende a entrar no divertículo em vez do esôfago, com risco de perfuração — exame cuidadoso. A manometria pode mostrar hipertonia do cricofaríngeo, mas não é necessária para o diagnóstico.<\/p>", "mud": [["Disfagia progressiva sólidos → líquidos, 46 anos, área endêmica", "Megaesôfago", "Outro padrão"], ["Pirose e regurgitação ácida", "DRGE", "Outro padrão"], ["Divertículo de 1,5 cm assintomático", "Sem indicação de tratamento", "< 2 cm assintomático"]], "arm": "Pedir manometria como exame inicial do Zenker.", "ouro": "Idoso que regurgita o almoço de ontem: Zenker → esofagograma.", "m2": ["O esofagograma mostra divertículo de 3 cm. Opções de tratamento?", "Endoscópico (diverticulotomia/Z-POEM) ou cirúrgico (miotomia + diverticulectomia/pexia)."], "n": ["Homem > 70 anos.", "Disfagia alta, regurgitação de alimento não digerido.", "Halitose, massa cervical esquerda, aspiração.", "Esofagograma: exame de escolha.", "EDA cuidadosa para excluir neoplasia."], "img": ["c-036-045"]}, {"id": "C11-Q02", "t": "C11", "sub": "Anatomia e mecanismo", "comp": "Fisiopatologia", "rac": "Compreensão", "dif": "média", "p": [35], "q": "Sobre a anatomia e o mecanismo de formação do divertículo de Zenker, assinale a correta.", "o": [["É pseudodivertículo de pulsão que hernia pelo triângulo de Killian, na parede posterior, entre o constritor inferior e o cricofaríngeo", "Incoordenação/hipertonia do cricofaríngeo eleva a pressão na hipofaringe e a mucosa hernia pela área de fraqueza."], ["É divertículo verdadeiro de tração, formado por linfonodos mediastinais inflamados no terço médio do esôfago", "Descreve divertículo de tração médio-esofágico, não o Zenker."], ["Forma-se na parede anterior do esôfago distal, acima do esfíncter inferior, por hipotonia do EEI", "Isso não corresponde ao Zenker (EES, parede posterior)."], ["Resulta do relaxamento excessivo do cricofaríngeo, que deixa a faringe sem resistência à deglutição", "O problema é o cricofaríngeo que não relaxa a tempo (hipertonia)."]], "pista": "Killian: fraqueza posterior entre constritor e cricofaríngeo.", "pp": ["Local: hipofaringe posterior (triângulo de Killian).", "Estrutura: mucosa + submucosa (pseudodivertículo).", "Mecanismo: pulsão — cricofaríngeo não relaxa.", "Consequência: herniação repetida."], "ap": "<p>O EES é formado pelo músculo cricofaríngeo. Na sequência da aula: (1) a faringe contrai, mas o cricofaríngeo não relaxa a tempo; (2) a pressão intraluminal na hipofaringe aumenta; (3) a mucosa hernia repetidamente pela área de fraqueza. Por isso a miotomia do cricofaríngeo é o centro de todas as técnicas.<\/p>", "mud": [["Pergunta sobre o esfíncter envolvido no megaesôfago", "EEI", "Outro esfíncter"], ["Pergunta sobre o tipo de divertículo de Meckel", "Verdadeiro", "Contraste"], ["Pergunta sobre por que tratar com miotomia", "Remover a causa (pressão alta)", "Evita recidiva"]], "arm": "Chamar o Zenker de divertículo verdadeiro ou de tração.", "ouro": "Zenker: pulsão pelo Killian por um cricofaríngeo que não relaxa.", "m2": ["Por que sem miotomia o divertículo recidiva?", "Porque a pressão na hipofaringe continua alta."], "n": ["Pseudodivertículo de pulsão.", "Triângulo de Killian (posterior).", "Entre constritor inferior e cricofaríngeo.", "Cricofaríngeo hipertônico/incoordenado.", "Mais comum dos divertículos esofágicos."], "img": ["c-035-043", "c-035-044"]}, {"id": "C11-Q03", "t": "C11", "sub": "Conduta por tamanho", "comp": "Decisão terapêutica", "rac": "Aplicação de critérios", "dif": "média", "p": [36], "q": "Homem de 74 anos, bom risco cirúrgico, com divertículo de Zenker sintomático de 5 cm ao esofagograma. Qual a conduta indicada na aula?", "o": [["Miotomia do cricofaríngeo + diverticulectomia", "Acima de 4 cm: miotomia associada à ressecção (sutura manual ou grampeador)."], ["Miotomia isolada do cricofaríngeo por cervicotomia", "Regressão após miotomia isolada é esperada nos < 2 cm."], ["Diverticulectomia isolada, sem miotomia", "Sem miotomia o divertículo recidiva."], ["Observação, pois só se trata acima de 6 cm", "Sintomático tem indicação; assintomático > 2 cm também."]], "pista": "> 4 cm: miotomia + ressecção.", "pp": ["Indicação: sintomático ou assintomático > 2 cm.", "< 2 cm: miotomia.", "2–4 cm: endoscópico ou cirúrgico.", "> 4 cm: miotomia + diverticulectomia.", "Alto risco e > 2 cm: miotomia + diverticulopexia."], "ap": "<p>A cricomiotomia isolada é feita por cervicotomia esquerda, na borda anterior do esternocleidomastoideo. A diverticulopexia fixa o saco à fáscia pré-vertebral, invertendo sua posição — mais rápida e sem risco de fístula da ressecção, por isso preferida no paciente de risco.<\/p>", "mud": [["Divertículo de 1,8 cm sintomático", "Miotomia isolada", "< 2 cm"], ["3 cm", "Endoscópico (Z-POEM) ou cirúrgico", "2–4 cm"], ["5 cm em paciente de alto risco", "Miotomia + diverticulopexia", "Menos risco"]], "arm": "Fazer diverticulectomia sem miotomia.", "ouro": "Zenker: a miotomia nunca falta; o tamanho decide o resto.", "m2": ["Divertículo de 2,5 cm assintomático em idoso. Há indicação?", "Sim: assintomático > 2 cm tem indicação de tratamento."], "n": ["Tratar: sintomático ou assintomático > 2 cm.", "< 2 cm: miotomia.", "2–4 cm: endoscópico ou cirúrgico.", "> 4 cm: miotomia + diverticulectomia.", "Alto risco: diverticulopexia."]}, {"id": "C11-Q04", "t": "C11", "sub": "Diverticulopexia e paciente de alto risco", "comp": "Escolha técnica", "rac": "Ponderação de risco", "dif": "difícil", "p": [36], "q": "Idosa de 86 anos, com cardiopatia grave e alto risco cirúrgico, tem Zenker de 3,5 cm com aspirações de repetição. Qual opção cirúrgica é destacada na aula para pacientes de risco aumentado?", "o": [["Cricomiotomia + diverticulopexia (fixação do divertículo à fáscia pré-vertebral)", "Menor tempo e risco, sem a fístula possível da ressecção."], ["Esofagectomia subtotal com tubo gástrico e anastomose cervical", "É tratamento do megaesôfago avançado, não do Zenker."], ["Cardiomiotomia a Heller com fundoplicatura de Pinotti por videolaparoscopia", "Heller trata o EEI no megaesôfago."], ["Fundoplicatura de Nissen para reduzir a regurgitação do conteúdo do divertículo", "Fundoplicatura trata DRGE, não o Zenker."]], "pista": "Fixar em vez de ressecar.", "pp": ["Indicação: sintomático com aspiração.", "Paciente de alto risco.", "Opção: cricomiotomia + diverticulopexia.", "Alternativa de menor agressão: via endoscópica (2–4 cm)."], "ap": "<p>Para 2–4 cm, a via endoscópica (diverticulotomia/Z-POEM) amplia a comunicação com o esôfago e impede o acúmulo de alimento — também é atraente no idoso de alto risco. Em todas, a miotomia está presente.<\/p>", "mud": [["Bom risco, 5 cm", "Miotomia + diverticulectomia", "Ressecção segura"], ["< 2 cm", "Miotomia isolada", "Regressão esperada"], ["2–4 cm com via endoscópica disponível", "Diverticulotomia/Z-POEM", "Menos invasivo"]], "arm": "Confundir técnicas do Zenker com as do megaesôfago e da DRGE.", "ouro": "Alto risco: miotomia + pexia.", "m2": ["Qual a vantagem da diverticulopexia sobre a diverticulectomia?", "Mais rápida, menos risco, evita fístula da linha de ressecção."], "n": ["Diverticulopexia: fixa à fáscia pré-vertebral.", "Para > 2 cm com alto risco.", "Sempre com miotomia.", "Evita fístula da ressecção.", "Z-POEM em 2–4 cm."]}, {"id": "C12-Q01", "t": "C12", "sub": "Classificação e conduta", "comp": "Classificação + decisão", "rac": "Aplicação de critérios", "dif": "média", "p": [37, 38, 42], "q": "Homem de 46 anos, de Montes Claros, com disfagia progressiva há 6 anos (sólidos e hoje líquidos), regurgitação noturna e perda de 12 kg. ELISA e IFI para Chagas reagentes. Esofagograma: esôfago com 6 cm, retenção de contraste e afilamento distal em “bico de pássaro”. Classificação de Mascarenhas e tratamento cirúrgico indicado?", "o": [["Mascarenhas II; cardiomiotomia a Heller + fundoplicatura de Pinotti (270°) laparoscópica", "4–7 cm = grau II; graus I–III são tratados com Heller + Pinotti."], ["Mascarenhas IV; esofagectomia subtotal com tubo gástrico e anastomose cervical", "Grau IV é > 10 cm; 6 cm é grau II."], ["Mascarenhas I; apenas nifedipina sublingual antes das refeições, sem nenhum procedimento", "Grau I é < 4 cm; tratamento clínico é paliativo e para casos selecionados."], ["Mascarenhas III; fundoplicatura de Nissen isolada para controlar a regurgitação", "Grau III é 7–10 cm; Nissen isolada não trata a acalasia."]], "pista": "6 cm = Mascarenhas II.", "pp": ["Tríade + área endêmica + 2 sorologias = megaesôfago chagásico.", "6 cm → Mascarenhas II; retenção moderada → Rezende II.", "EDA obrigatória (pseudoacalasia, carcinoma epidermoide); manometria confirma.", "Graus I–III → Heller + Pinotti laparoscópica."], "ap": "<p>Mascarenhas: I < 4 cm; II 4–7; III 7–10; IV > 10 cm. A esofagectomia fica para o grau IV (dolicomegaesôfago) ou recidiva/falha. Se o paciente estivesse muito desnutrido, dilatação ou toxina botulínica serviriam como ponte para a cirurgia.<\/p>", "mud": [["Esôfago de 11 cm, tortuoso", "Esofagectomia subtotal", "Grau IV"], ["Paciente idoso de alto risco", "Dilatação, toxina ou nitrato/nifedipina", "Paliativo"], ["Recidiva após Heller", "Esofagectomia", "Falha"]], "arm": "Classificar pelo tempo de doença em vez de pelo diâmetro.", "ouro": "Graus I–III: Heller + Pinotti. Grau IV: esofagectomia.", "m2": ["Esôfago de 3,5 cm, trânsito lento, sem dilatação, disfagia intensa. Grau e opções?", "Mascarenhas I; dilatação com balão ou Heller + Pinotti; clínico se alto risco."], "n": ["Mascarenhas: < 4 / 4–7 / 7–10 / > 10 cm.", "Rezende: radiológica I–IV.", "Bico de pássaro.", "I–III: Heller + Pinotti.", "IV ou recidiva: esofagectomia."], "img": ["c-037-048", "c-037-047"]}, {"id": "C12-Q02", "t": "C12", "sub": "Por que associar fundoplicatura", "comp": "Princípio cirúrgico", "rac": "Compreensão", "dif": "média", "p": [38, 39], "q": "Na cardiomiotomia a Heller para megaesôfago, por que se associa a fundoplicatura de Pinotti?", "o": [["Porque a miotomia abole a barreira do EEI e causaria refluxo; a válvula de 270° previne a DRGE", "A miotomia isolada causa refluxo; Pinotti é a válvula antirrefluxo associada."], ["Porque a fundoplicatura aumenta a pressão do EEI e completa o tratamento da acalasia", "O objetivo do Heller é reduzir a pressão do EEI; a válvula é só antirrefluxo."], ["Porque a miotomia é feita no estômago e a válvula fecha a gastrotomia resultante", "A miotomia é extramucosa, sem abertura da luz."], ["Para tratar o carcinoma epidermoide associado ao megaesôfago de longa data", "Fundoplicatura não trata neoplasia."]], "pista": "Miotomia isolada = refluxo.", "pp": ["Heller: miotomia extramucosa anterior do esôfago distal + cárdia.", "Consequência: EEI sem barreira.", "Pinotti 270°: válvula antirrefluxo parcial.", "Via laparoscópica preferencial."], "ap": "<p>Complemento (Sabiston): na via laparoscópica, a miotomia estende-se ~6 cm no esôfago e ~2 cm na cárdia. O esofagograma pré e pós-operatório documenta a melhora do esvaziamento.<\/p>", "mud": [["Dismotilidade importante", "Fundoplicatura parcial", "Menos disfagia pós-operatória"], ["Miotomia sem válvula", "DRGE pós-operatória", "Sem barreira"], ["Grau IV", "Esofagectomia", "Órgão sem função"]], "arm": "Achar que a fundoplicatura trata a acalasia.", "ouro": "Heller abre; Pinotti protege do refluxo.", "m2": ["Qual a extensão aproximada da miotomia laparoscópica?", "~6 cm no esôfago e ~2 cm na cárdia (complemento)."], "n": ["Heller: miotomia extramucosa anterior.", "Abole a barreira do EEI.", "Pinotti 270° previne refluxo.", "Laparoscópica preferencial.", "Graus I–III."], "img": ["c-039-050"]}, {"id": "C12-Q03", "t": "C12", "sub": "Manometria e Chicago", "comp": "Interpretação de exame", "rac": "Interpretação", "dif": "difícil", "p": [38], "q": "Na manometria do megaesôfago, qual é o achado-chave e como se define a acalasia tipo II de Chicago?", "o": [["Falha de relaxamento do EEI (IRP elevado); tipo II = panpressurização esofágica sem peristalse", "IRP elevado é comum aos três tipos; o II tem panpressurização."], ["Hipotonia do EEI com peristalse preservada; tipo II = contrações espásticas prematuras", "Hipotonia do EEI é achado de DRGE/esclerodermia; espástico é o tipo III."], ["Relaxamento normal do EEI com ondas de alta amplitude; tipo II = ausência de pressurização esofágica", "Relaxamento normal exclui acalasia; sem pressurização é o tipo I."], ["Hipertonia do EES (cricofaríngeo); tipo II = divertículo faringoesofágico associado", "Hipertonia do EES é do Zenker."]], "pista": "IRP elevado em todos; II = pan.", "pp": ["Achados clássicos: falha de relaxamento do EEI (chave), hipertonia do EEI, pressão intraesofágica alta, aperistalse, baixa amplitude.", "Chicago I: sem pressurização.", "II: panpressurização.", "III: espástica (contrações prematuras)."], "ap": "<p>A manometria é indicada na disfagia não esclarecida pelo esofagograma e pode mudar a cirurgia indicada. IRP = pressão de relaxamento integrada do EEI (Chicago v3.0).<\/p>", "mud": [["Contrações prematuras com IRP alto", "Tipo III", "Espástica"], ["Sem pressurização, IRP alto", "Tipo I", "Clássica"], ["IRP normal com hipotonia", "Não é acalasia", "Pensar em DRGE"]], "arm": "Confundir hipertonia do EES (Zenker) com a do EEI (acalasia).", "ouro": "Acalasia: EEI não relaxa. Chicago: I nada, II pan, III espasmo.", "m2": ["Qual exame diferencia acalasia de pseudoacalasia por tumor de cárdia?", "EDA com biópsia."], "n": ["Achado-chave: falha de relaxamento do EEI.", "Aperistalse.", "Chicago I: sem pressurização.", "II: panpressurização.", "III: espástica."], "img": ["c-038-049"]}, {"id": "C12-Q04", "t": "C12", "sub": "EDA e pseudoacalasia", "comp": "Propedêutica", "rac": "Raciocínio diagnóstico", "dif": "média", "p": [36, 38], "q": "Idoso de 72 anos com disfagia há 4 meses, perda de peso rápida e esofagograma com afilamento distal. Qual exame é indispensável e por quê?", "o": [["EDA com biópsias, para excluir neoplasia (pseudoacalasia) — estenose orgânica que dilata o esôfago não é megaesôfago", "Megaesôfago exige ausência de estenose orgânica; história curta e emagrecimento rápido sugerem tumor."], ["Sorologia para Chagas isolada, que confirma o diagnóstico e dispensa outros exames de imagem", "Sorologia positiva não exclui câncer associado."], ["Apenas manometria, que diferencia com segurança acalasia de câncer de cárdia em todos os casos", "Tumor da cárdia pode simular padrão manométrico; a EDA é essencial."], ["Nenhum exame adicional; indica-se Heller + Pinotti pelo padrão radiológico típico", "Operar sem excluir neoplasia é erro grave."]], "pista": "Velho + história curta + emagrecimento rápido = tumor até prova em contrário.", "pp": ["Megaesôfago = funcional, sem estenose orgânica.", "Pseudoacalasia: tumor que imita acalasia.", "EDA com biópsia exclui.", "Megaesôfago também é pré-maligno (~8% de carcinoma epidermoide em 20 anos)."], "ap": "<p>A EDA contribui pouco para diagnosticar acalasia, mas é fundamental para o diferencial com neoplasia e para rastrear o carcinoma epidermoide — sobretudo em idosos com longa história. Achados típicos: esôfago dilatado, estase alimentar, esofagite de estase.<\/p>", "mud": [["Jovem, área endêmica, história longa", "Megaesôfago chagásico provável", "Perfil típico"], ["Lesão vegetante na cárdia", "Pseudoacalasia", "Tratamento oncológico"], ["Megaesôfago de 20 anos", "Rastreamento endoscópico", "Risco de carcinoma"]], "arm": "Operar com base apenas no esofagograma.", "ouro": "Bico de pássaro no idoso emagrecido: biopsie antes de operar.", "m2": ["Qual o risco aproximado de carcinoma epidermoide no megaesôfago em 20 anos, segundo a aula?", "~8%."], "n": ["Megaesôfago é funcional.", "Pseudoacalasia: tumor.", "EDA com biópsia obrigatória.", "Pré-maligno (~8% em 20 anos).", "Rastreio endoscópico."]}, {"id": "C12-Q05", "t": "C12", "sub": "Tratamentos não cirúrgicos", "comp": "Indicações", "rac": "Comparação", "dif": "média", "p": [38], "q": "Paciente de 84 anos, com alto risco cirúrgico, megaesôfago grau I e disfagia intensa. Quais opções não cirúrgicas a aula apresenta e qual a característica da dilatação com balão?", "o": [["Nitrato/nifedipina, toxina botulínica ou dilatação com balão; a dilatação melhora 70–90% e perfura em 1–2%", "Opções para idosos/alto risco; dilatação é eficaz e repetível, com risco de perfuração."], ["Apenas esofagectomia, pois não existem alternativas para pacientes de alto risco", "Esofagectomia é para grau IV ou recidiva e tem maior morbimortalidade."], ["Toxina botulínica com efeito definitivo, que dispensa qualquer reaplicação", "Efeito dura meses a 1 ano; alta recidiva."], ["Dilatação com balão sem risco de perfuração e com efeito permanente garantido", "Risco de perfuração de 1–2%; pode ser repetida."]], "pista": "Paliativos e menos invasivos para o alto risco.", "pp": ["Clínico: nitrato, nifedipina — paliativo, não muda a história natural.", "Toxina botulínica: ~100 U em 4 quadrantes; meses a 1 ano.", "Dilatação com balão 30–40 mm: 70–90% de melhora; perfuração 1–2%.", "Cirurgia para graus I–III quando possível."], "ap": "<p>A toxina botulínica também serve de ponte em jovem desnutrido antes da cirurgia. A dilatação é indicada no grau I com disfagia intensa, nos desnutridos e na contraindicação cirúrgica.<\/p>", "mud": [["Jovem com grau II, bom risco", "Heller + Pinotti", "Tratamento eficaz e duradouro"], ["Jovem desnutrido", "Toxina/dilatação como ponte", "Preparar para cirurgia"], ["Grau IV", "Esofagectomia", "Órgão sem função"]], "arm": "Achar que a toxina botulínica é definitiva.", "ouro": "Idoso de alto risco: dilata, aplica toxina ou usa nifedipina; quem pode, opera.", "m2": ["Qual a dose aproximada de toxina botulínica citada?", "~100 U em 4 quadrantes do EEI."], "n": ["Nitrato/nifedipina: paliativo.", "Toxina: meses a 1 ano.", "Dilatação: 70–90% de melhora.", "Perfuração 1–2%.", "Ponte em desnutridos."]}, {"id": "C13-Q01", "t": "C13", "sub": "Prova terapêutica com IBP", "comp": "Diagnóstico", "rac": "Aplicação de critérios", "dif": "fácil", "p": [40, 42], "q": "Mulher de 32 anos com pirose 3 vezes por semana, pior após o jantar e ao deitar, sem disfagia, sem perda de peso e sem anemia. Qual a conduta inicial?", "o": [["Prova terapêutica com IBP em dose plena por 4 semanas + medidas comportamentais", "< 40 anos, sintomas típicos e sem alarme: resposta confirma DRGE; então manter 8–12 semanas."], ["EDA imediata para todos os pacientes com pirose, independentemente da idade e dos sinais de alarme", "EDA direta é para alarme, ≥ 40 anos, atípicos ou falha da prova."], ["pHmetria de 24 h como primeiro exame, por ser o padrão-ouro diagnóstico", "Padrão-ouro, mas reservado a situações específicas."], ["Fundoplicatura de Nissen laparoscópica, para evitar uso prolongado de IBP no futuro", "Cirurgia exige indicação e investigação pré-operatória."]], "pista": "< 40, típica, sem alarme.", "pp": ["Idade < 40.", "Sintomas típicos (pirose).", "Sem sinais de alarme.", "Prova terapêutica: IBP dose plena 4 semanas.", "Respondeu: DRGE, manter 8–12 semanas."], "ap": "<p>O caso 11.3A do resumo é idêntico. Medidas comportamentais: cabeceira elevada ~15 cm, não deitar até 2 h após refeições, refeições menores, moderar alimentos desencadeantes, rever fármacos que relaxam o EEI, cessar tabagismo e perder peso.<\/p>", "mud": [["55 anos com disfagia", "EDA", "Alarme + idade"], ["Sem resposta em 4 semanas", "EDA", "Falha da prova"], ["Tosse e rouquidão isoladas", "Investigação (atípicos)", "Sintomas extraesofágicos"]], "arm": "Pedir EDA para toda pirose.", "ouro": "Jovem com azia típica e sem alarme: IBP 4 semanas é o teste.", "m2": ["Paciente respondeu à prova terapêutica. Por quanto tempo manter o IBP?", "8–12 semanas."], "n": ["< 40, típicos, sem alarme → prova terapêutica.", "IBP dose plena 4 semanas.", "Medidas comportamentais.", "Resposta → manter 8–12 semanas.", "Sem resposta → EDA."]}, {"id": "C13-Q02", "t": "C13", "sub": "Sinais de alarme e EDA", "comp": "Indicação de exame", "rac": "Aplicação", "dif": "média", "p": [40, 42], "q": "Homem de 55 anos, obeso, com pirose há 10 anos em uso contínuo de omeprazol, agora com disfagia para sólidos. Qual o próximo passo?", "o": [["EDA com biópsias, para avaliar estenose péptica, Barrett, esofagite grave e neoplasia", "Idade > 40 e disfagia (alarme) indicam EDA direta."], ["Dobrar o omeprazol e reavaliar em 3 meses, sem exames, pois o diagnóstico de DRGE já é conhecido", "Disfagia é alarme; adiar a EDA é erro."], ["pHmetria de 24 h isolada, pois a EDA tem baixa sensibilidade para DRGE", "A EDA é a escolha diante de alarme; pHmetria tem outro papel."], ["Fundoplicatura imediata por dependência de IBP, sem investigação adicional", "Pré-operatório exige EDA + pHmetria + manometria."]], "pista": "Disfagia é alarme.", "pp": ["Alarme: disfagia (também odinofagia, perda de peso, anemia, sangramento, vômitos, história familiar).", "Idade > 40.", "EDA com biópsias.", "Tratar estenose (dilatação) e esofagite (IBP 8–12 semanas; dose dobrada se incompleto).", "Se candidato a cirurgia: pHmetria + manometria."], "ap": "<p>A EDA na DRGE mostra esofagite (50–60%), estenose (10%), Barrett (10–20%), exclui tumores e avalia hérnia e doença péptica. Sua sensibilidade para DRGE é baixa: EDA normal não exclui refluxo.<\/p>", "mud": [["EDA normal com sintomas persistentes", "pHmetria ± impedanciometria", "Confirmar refluxo"], ["Barrett", "Seguimento e discutir cirurgia", "Lesão grave"], ["Esofagite erosiva grave", "EDA de controle após tratamento", "Cicatrização"]], "arm": "Escalar o IBP sem investigar disfagia.", "ouro": "Azia + alarme ou > 40: EDA primeiro.", "m2": ["Quais são os achados mais frequentes na EDA de pacientes com DRGE?", "Esofagite (50–60%), Barrett (10–20%), estenose (10%)."], "n": ["Alarme: disfagia, odinofagia, perda de peso, anemia, sangramento.", "> 40–45 anos.", "EDA com biópsias.", "EDA normal não exclui DRGE.", "Estenose: dilatação."], "img": ["c-040-051"]}, {"id": "C13-Q03", "t": "C13", "sub": "pHmetria × impedanciometria", "comp": "Escolha de exame", "rac": "Comparação", "dif": "difícil", "p": [40], "q": "Paciente com sintomas típicos persistentes apesar de IBP em dose dobrada; EDA normal e pHmetria de 24 h sem refluxo ácido patológico. Qual exame pode demonstrar refluxo não ácido?", "o": [["Impedanciometria esofágica", "Detecta refluxo não ácido e caracteriza o tipo (líquido/gás), complementando a pHmetria."], ["Repetir a pHmetria convencional", "A pHmetria só detecta refluxo ácido (pH < 4)."], ["Manometria esofágica de alta resolução", "Manometria avalia motilidade e tônus, não refluxo."], ["Esofagograma baritado", "Não é o exame indicado para isso."]], "pista": "pHmetria vê ácido; impedância vê movimento de bolo.", "pp": ["EDA normal não exclui DRGE.", "pHmetria: padrão-ouro para refluxo ácido (pH < 4).", "Limitação: não detecta refluxo não ácido.", "Impedanciometria: detecta e caracteriza."], "ap": "<p>A pHmetria fornece número de episódios, episódio mais longo, refluxo em ortostatismo e decúbito e correlação com sintomas anotados. A impedanciometria é indicada quando sintomas persistem com EDA e pHmetria normais apesar do tratamento.<\/p>", "mud": [["Pré-operatório de fundoplicatura", "EDA + pHmetria + manometria", "Obrigatórios"], ["Disfagia sem lesão na EDA", "Manometria", "Motilidade"], ["Suspeita de acalasia", "Manometria", "Excluir antes de fundoplicar"]], "arm": "Achar que a pHmetria detecta refluxo não ácido.", "ouro": "Ácido: pHmetria. Não ácido: impedância. Motilidade: manometria.", "m2": ["Por que a manometria é essencial antes da fundoplicatura?", "Exclui acalasia e orienta a técnica (dismotilidade favorece fundoplicatura parcial)."], "n": ["pHmetria: padrão-ouro (ácido).", "pH < 4 = refluxo ácido.", "Impedância: não ácido.", "Manometria: motilidade.", "EDA normal não exclui."]}, {"id": "C13-Q04", "t": "C13", "sub": "Indicações e técnica cirúrgica", "comp": "Indicação cirúrgica", "rac": "Aplicação", "dif": "média", "p": [41, 42], "q": "Homem de 34 anos com DRGE confirmada, cujos sintomas voltam poucos dias após cada tentativa de suspender o IBP, deseja tratamento definitivo. Qual indicação e qual preparo pré-operatório são corretos?", "o": [["Indicação por dependência prolongada de IBP no jovem; pré-operatório com EDA, pHmetria e manometria", "Uso prolongado em jovem que dependeria de IBP a vida toda é indicação; os três exames são obrigatórios."], ["Não há indicação, pois a cirurgia na DRGE só existe para câncer de esôfago", "Indicações incluem intratabilidade, dependência e lesão grave."], ["Indicação existe, mas o pré-operatório exige apenas a EDA recente, sem outros exames", "pHmetria e manometria também são obrigatórias."], ["Indicação existe, e a técnica padrão é a cardiomiotomia a Heller sem válvula", "Heller é para acalasia; na DRGE faz-se hiatoplastia + fundoplicatura."]], "pista": "Jovem que dependeria de IBP para sempre.", "pp": ["Indicações: intratabilidade (6 meses), dependência prolongada de IBP, lesão grave (úlcera, estenose, Barrett, esofagite refratária).", "Pré-operatório: EDA + pHmetria + manometria.", "Técnica: hiatoplastia + fundoplicatura laparoscópica.", "Nissen 360°, Toupet 270°, Lind 240°."], "ap": "<p>Sequência técnica: dissecção do hiato e mobilização do esôfago → hiatoplastia (fechamento dos pilares) → fundoplicatura (válvula com o fundo gástrico). Hérnia hiatal grande desfavorece o tratamento exclusivamente clínico.<\/p>", "mud": [["Dismotilidade na manometria", "Fundoplicatura parcial (Toupet/Lind)", "Menos disfagia"], ["Manometria com acalasia", "Não fazer fundoplicatura isolada", "Diagnóstico diferente"], ["Recidiva pós-operatória", "pHmetria", "Reavaliação"]], "arm": "Operar sem manometria.", "ouro": "DRGE cirúrgica: EDA + pHmetria + manometria, depois hiatoplastia + válvula.", "m2": ["Quantos graus tem cada fundoplicatura?", "Nissen 360°, Toupet 270°, Lind 240°."], "n": ["Intratabilidade, dependência de IBP, lesão grave.", "EDA + pHmetria + manometria.", "Hiatoplastia + fundoplicatura.", "Nissen 360°.", "Toupet 270°; Lind 240°."], "img": ["c-041-052"]}, {"id": "C13-Q05", "t": "C13", "sub": "Causas e fisiopatologia", "comp": "Fisiopatologia", "rac": "Compreensão", "dif": "média", "p": [39], "q": "Sobre as causas da DRGE apresentadas na Aula 6, assinale a correta.", "o": [["O relaxamento transitório do EEI é a causa mais comum; a hérnia hiatal por deslizamento é fator de associação, não de obrigação", "Nem todo paciente com hérnia tem DRGE; o mecanismo principal é o relaxamento “na hora errada”."], ["A hérnia hiatal paraesofágica é a causa obrigatória de toda DRGE, presente em praticamente todos os casos", "A mais comum é a por deslizamento (tipo I); e ela não é obrigatória."], ["A esclerodermia causa DRGE por hipertonia do EEI e aumento da peristalse", "Esclerodermia e lúpus causam hipotonia do EEI e do corpo."], ["Obesidade e gestação protegem contra a DRGE por aumentarem a pressão intra-abdominal", "O aumento da pressão intra-abdominal favorece o refluxo."]], "pista": "Esfíncter que abre na hora errada.", "pp": ["1 Relaxamento transitório do EEI (mais comum).", "2 Hérnia por deslizamento (associação).", "3 Pressão intra-abdominal (obesidade, gestação).", "4 Cirurgias (sleeve).", "5 Esclerodermia e lúpus (hipotonia)."], "ap": "<p>Complemento (Sabiston): tipos de hérnia hiatal — I por deslizamento (~95%, associada à DRGE), II paraesofágica, III mista, IV com outros órgãos. Sintomas: pirose 80%, regurgitação 54%; atípicos incluem tosse, rouquidão, broncoaspiração, sibilância e globus.<\/p>", "mud": [["Paciente com esclerodermia e pirose", "DRGE por hipotonia", "Associação"], ["Pós-sleeve com pirose", "DRGE pós-cirúrgica", "Cirurgia prévia"], ["Hérnia paraesofágica", "Tipo II", "Outro mecanismo"]], "arm": "Achar que toda hérnia de hiato causa refluxo, ou vice-versa.", "ouro": "DRGE: o EEI relaxa na hora errada.", "m2": ["Quais fármacos relaxam o EEI e devem ser revistos?", "Anticolinérgicos, teofilina, tricíclicos, bloqueadores de canal de cálcio, β-agonistas, alendronato."], "n": ["Relaxamento transitório do EEI: mais comum.", "Hérnia por deslizamento: associação.", "Obesidade e gestação favorecem.", "Sleeve pode causar.", "Esclerodermia/lúpus: hipotonia."]}, {"id": "P01-Q01", "t": "P01", "sub": "Definição de perícia médica", "comp": "Conceito", "rac": "Compreensão conceitual", "dif": "fácil", "p": [3], "q": "Segundo a definição de Hermes Rodrigues de Alcântara apresentada em aula, o que caracteriza a perícia médica?", "o": [["Exame ou ato propedêutico feito por médico para auxiliar autoridade administrativa, policial ou judiciária a formar juízo", "É a definição citada: a finalidade é instruir a decisão de uma autoridade."], ["Qualquer consulta em que o médico emita atestado de afastamento, desde que assinado e com carimbo do CRM", "O atestado assistencial não tem, por si, a finalidade de colaborar com a autoridade na formação de juízo."], ["Exame realizado por qualquer profissional de saúde a pedido de um juiz, inclusive exames laboratoriais e de imagem", "A perícia médica é ato privativo de médico (com exceções laboratoriais específicas)."], ["Avaliação feita exclusivamente na Justiça criminal, no IML, para determinar causa de morte e natureza de lesões", "Há perícia previdenciária, trabalhista, cível, de tráfego, de inclusão e criminal."]], "pista": "Finalidade: colaborar com a autoridade na formação de juízo.", "pp": ["Ler a definição: ato propedêutico ou exame.", "Quem faz: médico.", "Para quê: colaborar com autoridade administrativa, policial ou judiciária.", "Eliminar alternativas que restringem a área ou o executor."], "ap": "<p>A finalidade separa perícia de assistência: o médico assistente trata; o perito informa a autoridade. Por isso o perito precisa conhecer a norma que vai aplicar (Lei 8.213, CC, protocolos do DETRAN etc.) e as exigências da função examinada. Os requisitos de boa prova (França): técnicas médico-legais reconhecidas, meios subsidiários adequados e protocolo com roteiros atualizados.<\/p>", "mud": [["A pergunta fosse sobre os requisitos da boa prova", "Técnica reconhecida, meios adequados, protocolo atualizado", "Genival Veloso de França"], ["O exame fosse laboratorial toxicológico", "Exceção à privatividade médica", "Lei 12.842/2013"], ["O médico fosse assistente emitindo atestado", "Não é perícia em sentido estrito", "Finalidade assistencial"]], "arm": "Restringir perícia ao IML ou ao INSS.", "ouro": "Perícia = exame médico a serviço da decisão de uma autoridade.", "m2": ["Médico do DETRAN avalia campo visual de candidato à CNH. É perícia?", "Sim: perícia de tráfego, administrativa, para a autoridade de trânsito."], "n": ["Definição de Alcântara.", "Finalidade: formação de juízo da autoridade.", "Autoridades administrativas, policiais, judiciárias.", "Ato privativo de médico.", "Requisitos de boa prova (França)."]}, {"id": "P01-Q02", "t": "P01", "sub": "Perícia judicial × administrativa", "comp": "Classificação", "rac": "Classificação", "dif": "fácil", "p": [2], "q": "Quais das perícias a seguir são classificadas, no mapa da disciplina, como administrativas?", "o": [["Previdenciária realizada no INSS e de tráfego realizada no DETRAN", "São avaliações feitas por órgãos da administração, fora de processo judicial."], ["Trabalhista e cível, por serem pedidas por advogados das partes", "Correm em processo judicial (Justiça do Trabalho e Estadual)."], ["Criminal no IML e previdenciária na Justiça Federal", "A previdenciária na Justiça Federal é judicial; a criminal vincula-se a inquérito/processo."], ["Todas as perícias médicas, já que o perito é um auxiliar administrativo do juiz", "Há perícias judiciais e administrativas."]], "pista": "Órgão administrativo, sem processo.", "pp": ["Judicial: criminal, cível, trabalhista, previdenciária judicial.", "Administrativa: INSS e DETRAN.", "Identificar o órgão que pede."], "ap": "<p>O mesmo tema pode mudar de natureza: o benefício por incapacidade é avaliado pelo perito do INSS (administrativa) e, se negado e judicializado, por perito nomeado pela Justiça Federal (judicial). A pergunta central (há incapacidade? DID/DII? nexo?) se mantém, mas as regras processuais mudam (CPC 465, 473 na judicial).<\/p>", "mud": [["Benefício negado e ação na Justiça Federal", "Perícia judicial", "Processo"], ["Candidato à CNH", "Perícia administrativa (DETRAN)", "Órgão administrativo"], ["Lesão corporal em inquérito", "Perícia criminal (IML)", "Esfera penal"]], "arm": "Classificar a previdenciária sempre como administrativa.", "ouro": "INSS e DETRAN: administrativa. Processo: judicial.", "m2": ["Pedido de isenção de IR judicializado na Justiça Federal: que tipo de perícia?", "Judicial (caso II da Aula 11)."], "n": ["Judicial: criminal, cível, trabalhista, previdenciária judicial.", "Administrativa: INSS, DETRAN.", "A natureza depende do órgão.", "Regras do CPC na judicial.", "Mesma pergunta técnica, contexto diferente."]}, {"id": "P01-Q03", "t": "P01", "sub": "Perícia direta × indireta", "comp": "Classificação", "rac": "Aplicação", "dif": "fácil", "p": [2, 18], "q": "Família processa hospital após óbito de paciente atendida na urgência. O perito analisará prontuário, ficha de triagem e registros. Como se classifica essa perícia?", "o": [["Indireta, pois não há exame do indivíduo, apenas de documentos e registros", "Perícia de óbito/paciente falecido é exemplo clássico de perícia indireta."], ["Direta, porque o perito examina pessoalmente o prontuário original do hospital réu", "Direta é o exame do próprio indivíduo."], ["Administrativa, porque o prontuário pertence à instituição hospitalar", "O processo é judicial cível; a classificação direta/indireta refere-se ao objeto examinado."], ["Criminal, já que todo óbito hospitalar exige necropsia no IML", "O pedido é de responsabilidade civil; não há indicação automática de perícia criminal."]], "pista": "Sem o examinado, só documentos.", "pp": ["Direta: exame do indivíduo.", "Indireta: documentos, prontuários, registros.", "Paciente falecida → indireta.", "Esfera: cível (responsabilidade civil)."], "ap": "<p>No caso IV da Aula 11 (DM1 classificada como verde), a perícia é indireta e precisa reconstruir: a classificação de risco correta, a evolução natural da CAD não tratada e a janela terapêutica — a partir do que ficou registrado.<\/p>", "mud": [["Autor vivo examinado pelo perito", "Perícia direta", "Exame do indivíduo"], ["Exame de óculos com grau errado", "Perícia direta no objeto + refração do autor", "Exame material"], ["Perícia sobre ambiente de trabalho", "Pode envolver documentos e vistoria", "Reconstrução do ambiente"]], "arm": "Achar que examinar o prontuário original torna a perícia direta.", "ouro": "Examinou a pessoa: direta. Só papéis: indireta.", "m2": ["Criança que morreu de meningite após liberação com Benzetacil. Que perícia se faz?", "Indireta, sobre a adequação do diagnóstico e da liberação."], "n": ["Direta: examina-se o indivíduo.", "Indireta: documentos e registros.", "Óbito → indireta.", "Prontuário é peça central.", "Quesitos dirigem a análise."]}, {"id": "P01-Q04", "t": "P01", "sub": "Tripé clínica → função → direito", "comp": "Método de raciocínio", "rac": "Sequência lógica", "dif": "média", "p": [2, 6], "q": "Ao avaliar um segurado com lombalgia crônica, o perito conclui: (1) há hérnia discal com radiculopatia; (2) ela impede carregar peso acima de 10 kg; (3) a função de estivador exige carga de 50 kg, configurando incapacidade para a atividade habitual. Qual sequência de raciocínio foi aplicada?", "o": [["Clínica → função → direito", "Diagnóstico e prognóstico, repercussão funcional e enquadramento normativo — o tripé do caso 48-F."], ["Direito → clínica → função", "O perito parte do achado clínico, não da norma."], ["Função → direito → clínica", "O diagnóstico é a base, mas não basta."], ["Clínica → direito, sem análise funcional", "Doença não é igual a incapacidade; a função é indispensável."]], "pista": "Primeiro o que ele tem, depois o que ele não consegue, por fim o que a lei diz.", "pp": ["CLÍNICA: hérnia discal com radiculopatia.", "FUNÇÃO: restrição de carga.", "DIREITO: incapacidade para a atividade habitual → benefício.", "Mesmo diagnóstico pode não incapacitar outra função."], "ap": "<p>O tripé evita dois erros clássicos: (a) conceder benefício só pelo diagnóstico (um bancário com a mesma hérnia pode não estar incapaz); (b) negar porque “não há doença ativa” quando há sequela incapacitante. No caso 48-F, a cronologia (sintomas anteriores ao vínculo) pesou no passo do DIREITO, limitando o nexo a, no máximo, concausa.<\/p>", "mud": [["Mesmo diagnóstico em bancário", "Possível capacidade preservada", "Exigência da função"], ["Sequela consolidada que reduz capacidade", "Auxílio-acidente", "Enquadramento distinto"], ["Sintomas anteriores ao vínculo", "Nexo causal enfraquecido; discutir concausa", "Cronologia"]], "arm": "Pular a etapa funcional.", "ouro": "Clínica, função, direito — nessa ordem.", "m2": ["Diabético controlado, motorista de ônibus, sem complicações. Há incapacidade?", "Não necessariamente: doença sem limitação funcional não é incapacidade."], "n": ["Tripé: clínica → função → direito.", "Diagnóstico é necessário, não suficiente.", "Função depende da ocupação concreta.", "Direito define a consequência.", "Cronologia pesa no nexo."]}, {"id": "P01-Q05", "t": "P01", "sub": "Área pericial e norma-mãe", "comp": "Associação", "rac": "Associação", "dif": "média", "p": [2], "q": "Qual associação entre área pericial e sua norma-mãe, segundo o mapa geral da disciplina, está correta?", "o": [["Cível — Código Civil (arts. 186, 187, 927, 949, 950) e CPC (arts. 156, 465, 473)", "A perícia cível investiga ato ilícito, dano, nexo e déficit com base no CC e no CPC."], ["Previdenciária — Lei 13.146/2015 (LBI) e Lei 12.764/2012, que regulam benefícios por incapacidade", "Previdenciária baseia-se na Lei 8.213/91, no Decreto 3.048/99 e na IN 31/2008."], ["Inclusão/PcD — Lei 8.080/90 e Lei 9.656/98, que regulam o SUS e os planos de saúde", "Inclusão baseia-se na LBI, Lei 8.213 art. 93 e leis específicas de deficiência."], ["Trabalhista — Código Penal e Código de Processo Penal, pois avalia culpa do empregador", "Trabalhista baseia-se na CF art. 7º, CLT cap. V, NRs e Lei 8.213 arts. 19–21."]], "pista": "Cível pergunta por ilícito, dano e nexo.", "pp": ["Previdenciária: Lei 8.213, Dec. 3.048, IN 31.", "Trabalhista: CF art. 7º, CLT, NRs, Lei 8.213 arts. 19–21.", "Cível: CC e CPC.", "Inclusão: LBI, Lei 8.213 art. 93, Leis 14.126, 14.768, 12.764."], "ap": "<p>Conhecer a norma-mãe permite responder à pergunta central de cada área: previdenciária (incapacidade, DID/DII, nexo, sequela), trabalhista (nexo causal/concausal, dano, culpa), cível (ilícito, dano, nexo, déficit), tráfego (aptidão psicofísica), inclusão (enquadramento como deficiência), criminal (natureza da lesão, causa da morte).<\/p>", "mud": [["Pergunta sobre a previdenciária", "Lei 8.213/91 e Decreto 3.048/99", "Norma do RGPS"], ["Pergunta sobre inclusão", "LBI e Lei 8.213 art. 93", "Deficiência e cotas"], ["Pergunta sobre tráfego", "Protocolos do exame de aptidão", "DETRAN"]], "arm": "Misturar a lei do SUS (8.080) com a lei de benefícios (8.213).", "ouro": "Cada área tem sua pergunta e sua lei: cível = CC + CPC.", "m2": ["Qual norma rege as cotas de PcD/reabilitados nas empresas?", "Lei 8.213/91, art. 93."], "n": ["Previdenciária: Lei 8.213, Dec. 3.048.", "Trabalhista: CF 7º, CLT, NRs.", "Cível: CC 186–950, CPC 156–473.", "Inclusão: LBI, 8.213 art. 93.", "Tráfego: protocolos DETRAN."]}, {"id": "P02-Q01", "t": "P02", "sub": "Três pilares do exercício da medicina", "comp": "Conceito", "rac": "Associação", "dif": "fácil", "p": [3], "q": "Médico recém-formado assume plantões em excesso sem reserva financeira, sem contribuição previdenciária e sem plano de carreira; em dois anos está endividado e com sintomas de burnout. Qual pilar do exercício da medicina falhou?", "o": [["Planejamento", "Planejamento abrange mundo do trabalho, impostos, previdência, carreira e gestão do tempo; sua falha gera endividamento e burnout."], ["Dia a dia", "O pilar do dia a dia trata de técnica, protocolos e literatura; a falha típica é erro diagnóstico ou de medicação."], ["Prevenção", "Prevenção trata de comunicação e normas básicas; a falha típica é conflito e processo."], ["Nenhum dos pilares", "A aula liga explicitamente a falha de planejamento ao adoecimento e ao endividamento."]], "pista": "Dinheiro, previdência, carreira e tempo.", "pp": ["Dia a dia → técnica, protocolos.", "Prevenção → comunicação, normas.", "Planejamento → trabalho, impostos, previdência, carreira, tempo.", "Consequências descritas → planejamento."], "ap": "<p>Os três pilares organizam a disciplina inteira: o dia a dia evita o erro técnico, a prevenção evita o conflito e o processo, o planejamento evita o adoecimento do próprio médico. A Aula 07 retoma o pilar do planejamento ao discutir CLT × PJ e recolhimento previdenciário.<\/p>", "mud": [["Erro de dose por não seguir protocolo", "Dia a dia", "Técnica"], ["Processo por falha de comunicação com a família", "Prevenção", "Comunicação/normas"], ["Inconformismo com a profissão", "Planejamento", "Falha listada"]], "arm": "Achar que os pilares se referem só ao cuidado do paciente.", "ouro": "Dia a dia evita erro; prevenção evita processo; planejamento evita adoecer.", "m2": ["Médico PJ que nunca recolheu INSS sofre acidente grave. Qual pilar falhou e qual a consequência?", "Planejamento; sem contribuição, não há cobertura do seguro social."], "n": ["Dia a dia: técnica e protocolos.", "Prevenção: comunicação e normas.", "Planejamento: carreira, impostos, previdência, tempo.", "Falha de planejamento: endividamento, burnout.", "Base de toda a disciplina."]}, {"id": "P02-Q02", "t": "P02", "sub": "Deontologia", "comp": "Conceito", "rac": "Compreensão", "dif": "fácil", "p": [3], "q": "Sobre a deontologia médica, conforme a Aula 01, assinale a correta.", "o": [["Estudo dos deveres, com autorregulação profissional: regra → dever; violação = punição", "Deontos (dever) + logos (estudo); autorregulação com consequência para a violação."], ["É o estudo dos direitos do médico frente ao paciente e à instituição, sem previsão de punição", "O foco são deveres, e há punição na violação."], ["É sinônimo de bioética e se resume aos princípios de autonomia, beneficência, não maleficência e justiça", "Bioética e deontologia se relacionam, mas não são sinônimos."], ["É a disciplina que estuda apenas a responsabilidade penal do médico por erro", "A deontologia trata dos deveres éticos; a esfera penal é independente."]], "pista": "Deontos = dever.", "pp": ["Etimologia: deontos + logos.", "Natureza: deveres profissionais.", "Autorregulação do grupo.", "Regra → dever → violação → punição."], "ap": "<p>Os quatro deveres deontológicos da aula: informação (consentimento, autonomia), atualização (aprimoramento continuado), vigilância (combate à inércia e ao descaso) e abstenção de abuso (não desviar do poder conferido pela profissão).<\/p>", "mud": [["Pergunta sobre os princípios bioéticos", "Autonomia, beneficência, não maleficência, justiça", "Outro conjunto"], ["Violação do dever de informação", "Consequência ética, e possivelmente civil", "Três esferas"], ["Pergunta sobre a esfera penal", "Independente da ética", "Esferas autônomas"]], "arm": "Confundir deontologia com bioética.", "ouro": "Deontologia: deveres que, violados, geram punição.", "m2": ["Quais são os quatro deveres deontológicos citados?", "Informação, atualização, vigilância e abstenção de abuso."], "n": ["Estudo dos deveres.", "Autorregulação profissional.", "Regra → dever → punição.", "Quatro deveres: informação, atualização, vigilância, abstenção de abuso.", "Distinta da bioética."]}, {"id": "P02-Q03", "t": "P02", "sub": "Dever de vigilância", "comp": "Aplicação dos deveres", "rac": "Aplicação a caso", "dif": "média", "p": [3], "q": "Durante cesárea, parte de um instrumento metálico fica retida. O obstetra diz que pediria radiografia para localizá-lo, mas não pede, e a paciente recebe alta. Qual dever deontológico foi mais diretamente violado?", "o": [["Vigilância — combate à inércia, passividade e descaso", "Saber do risco e não agir é inércia; é o exemplo dado na aula."], ["Atualização — por desconhecer a técnica cirúrgica mais recente de cesárea", "Não há indício de desatualização técnica."], ["Abstenção de abuso — por usar a posição de médico para obter vantagem", "Não houve obtenção de vantagem."], ["Justiça — por distribuição inadequada de recursos entre pacientes", "Justiça é princípio bioético, não o dever em questão."]], "pista": "Sabia e não agiu.", "pp": ["Fato: corpo estranho retido conhecido.", "Omissão: não pediu RX nem retirou.", "Dever violado: vigilância.", "Também: dever de informação (comunicar à paciente)."], "ap": "<p>Na Aula 08, o mesmo caso é usado para o perito: localizar o corpo estranho, verificar se houve retirada e consolidação (MMI), descrever dano estético e despesas (CC art. 949). Sem retirada, a avaliação do dano definitivo é prematura.<\/p>", "mud": [["Médico não conferiu a ampola", "Vigilância", "Inércia"], ["Não informou taxa de falha da vasectomia", "Informação", "Autonomia"], ["Usou protocolo abandonado", "Atualização", "Conhecimento"]], "arm": "Classificar toda falha como “imperícia” técnica.", "ouro": "Viu o risco e não agiu: falha de vigilância.", "m2": ["Técnica administra medicamento sem conferir o rótulo e o médico não confere a prescrição verbal. Que deveres/metas falharam?", "Vigilância; metas 2 (comunicação) e 3 (medicamentos de alta vigilância)."], "n": ["Vigilância: combate à inércia.", "Exemplos: ampola, RX não pedido.", "Informação: consentimento.", "Atualização: protocolos vigentes.", "Abstenção de abuso: poder profissional."]}, {"id": "P02-Q04", "t": "P02", "sub": "Princípios bioéticos", "comp": "Aplicação", "rac": "Aplicação a caso", "dif": "média", "p": [3], "q": "Paciente lúcido, devidamente informado sobre riscos e benefícios, recusa uma cirurgia eletiva. O médico registra a recusa e mantém o acompanhamento. Qual princípio bioético foi principalmente respeitado?", "o": [["Autonomia", "Poder de decidir sobre si, com decisão voluntária e informada."], ["Justiça", "Justiça trata da distribuição de deveres e benefícios sociais."], ["Beneficência", "O tratamento indicado não foi realizado; o que se respeitou foi a decisão do paciente."], ["Não maleficência", "Recusar também tem riscos; o centro do caso é a decisão do paciente."]], "pista": "Decisão voluntária e informada do próprio paciente.", "pp": ["Paciente capaz e informado.", "Decisão sobre si mesmo.", "Princípio: autonomia.", "Registro e seguimento: boa prática."], "ap": "<p>O dever deontológico de informação é o que torna a autonomia possível: sem informação adequada, a decisão não é realmente livre. Por isso o caso III da Aula 11 (vasectomia sem orientação sobre espermograma e taxa de falha) é tratado como violação do dever de informação.<\/p>", "mud": [["Médico indica o tratamento mais eficaz", "Beneficência", "Fazer o bem"], ["Confere alergias antes de prescrever", "Não maleficência", "Evitar dano"], ["Critérios equânimes de fila", "Justiça", "Distribuição"]], "arm": "Achar que respeitar a recusa viola a beneficência.", "ouro": "Decisão informada sobre o próprio corpo = autonomia.", "m2": ["Que dever deontológico sustenta a autonomia?", "O dever de informação."], "n": ["Autonomia: decidir sobre si.", "Beneficência: fazer o bem.", "Não maleficência: não causar dano.", "Justiça: distribuição coerente.", "Informação viabiliza autonomia."]}, {"id": "P02-Q05", "t": "P02", "sub": "Metas internacionais de segurança", "comp": "Segurança do paciente", "rac": "Aplicação a caso", "dif": "média", "p": [3, 4], "q": "Na enfermaria, uma técnica administra succinilcolina no lugar de cefalotina (frascos semelhantes), a partir de prescrição verbal não conferida pelo médico. Quais metas internacionais de segurança do paciente (JCI) falharam mais diretamente?", "o": [["Meta 2 (comunicação efetiva) e meta 3 (medicamentos de alta vigilância)", "Prescrição verbal sem conferência e troca de medicamento de alta vigilância."], ["Meta 4 (cirurgia segura) e meta 6 (prevenção de quedas), por se tratar de bloqueador neuromuscular", "Não houve procedimento cirúrgico nem queda."], ["Meta 5 (infecções), pois a cefalotina era antibiótico profilático", "A falha não é infecciosa."], ["Meta 1 (identificação) apenas, porque a paciente certa recebeu o medicamento errado", "A paciente estava correta; falharam comunicação e segurança do medicamento."]], "pista": "Ordem verbal + frasco parecido + droga de alto risco.", "pp": ["Prescrição verbal não conferida → meta 2.", "Succinilcolina (alta vigilância) trocada → meta 3.", "Falha do pilar do dia a dia e do dever de vigilância.", "Três esferas: ética, civil, penal."], "ap": "<p>No caso didático da Aula 01 (“A dor é sua?”), a responsabilidade se divide: o hospital responde de forma objetiva como prestador de serviço; o médico, de forma subjetiva (culpa: negligência, imprudência, imperícia). As esferas ética (CRM), civil (CC 927, 949, 950) e penal (lesão culposa) são independentes.<\/p>", "mud": [["Cirurgia no lado errado", "Meta 4", "Local/procedimento"], ["Paciente errado recebe exame", "Meta 1", "Identificação"], ["Queda do leito sem grade", "Meta 6", "Quedas"]], "arm": "Ver apenas a “culpa da técnica” e ignorar a falha de sistema.", "ouro": "Ordem verbal sem read-back + droga de alto risco = metas 2 e 3.", "m2": ["Liste as seis metas da JCI.", "1 identificação; 2 comunicação; 3 medicamentos de alta vigilância; 4 cirurgia segura; 5 infecções; 6 quedas."], "n": ["Meta 1: identificação.", "Meta 2: comunicação.", "Meta 3: alta vigilância.", "Meta 4: cirurgia segura.", "Metas 5 e 6: infecções e quedas."]}, {"id": "P02-Q06", "t": "P02", "sub": "Responsabilidade objetiva × subjetiva", "comp": "Responsabilidade civil", "rac": "Comparação", "dif": "difícil", "p": [4, 12, 17], "q": "Após erro de medicação com dano ao paciente em hospital privado, qual afirmação sobre a responsabilidade está de acordo com o material?", "o": [["O hospital responde objetivamente (prestador de serviço); o médico, subjetivamente (culpa)", "Para o médico: negligência, imprudência ou imperícia; o hospital responde como prestador (CDC; CC 927 parágrafo único)."], ["O médico responde objetivamente, sem necessidade de culpa, e o hospital responde apenas se houver dolo", "Inverte as regras."], ["Apenas uma esfera pode ser acionada: se houver processo ético no CRM, fica vedada a ação civil pelo mesmo fato", "Ética, civil e penal são esferas independentes."], ["Não há responsabilidade se a obrigação do médico é de meio", "Obrigação de meio não afasta a responsabilidade por culpa."]], "pista": "Prestador de serviço × profissional liberal.", "pp": ["Hospital: responsabilidade objetiva (prestador).", "Médico: subjetiva (culpa).", "Esferas independentes: ética, civil, penal.", "Obrigação de meio é a regra na medicina."], "ap": "<p>O CC art. 927, parágrafo único, prevê responsabilidade objetiva nos casos da lei ou quando a atividade implicar risco. Na perícia cível (Aula 11), o perito descreve tecnicamente conduta, dano e nexo; quem qualifica a culpa é o juiz.<\/p>", "mud": [["Cirurgia estética com promessa de resultado", "Discussão sobre obrigação de resultado", "Exceção à regra de meio"], ["Ausência de nexo entre conduta e dano", "Sem dever de indenizar", "Nexo é requisito"], ["Culpa exclusiva da vítima", "Rompe o nexo", "Excludente"]], "arm": "Atribuir responsabilidade objetiva ao médico.", "ouro": "Hospital: objetiva. Médico: subjetiva (culpa).", "m2": ["Quem qualifica juridicamente a culpa no processo?", "O juiz; o perito descreve tecnicamente a conduta."], "n": ["Hospital: objetiva.", "Médico: subjetiva.", "Culpa: negligência, imprudência, imperícia.", "Esferas independentes.", "Obrigação de meio."]}, {"id": "P02-Q07", "t": "P02", "sub": "Qualidade e má prática", "comp": "Conceito", "rac": "Compreensão", "dif": "fácil", "p": [3], "q": "Como a Aula 01 define má prática?", "o": [["Desvio do padrão de cuidado que resulta em prejuízo ao paciente", "Dois elementos: desvio do padrão e prejuízo."], ["Qualquer resultado desfavorável ao paciente, independentemente da conduta adotada", "Resultado ruim sem desvio do padrão não é má prática."], ["Qualquer desvio de protocolo, mesmo sem prejuízo, quando detectado em auditoria", "Sem prejuízo, não se configura a má prática conforme a definição."], ["A recusa do paciente em aderir ao tratamento prescrito pelo médico", "É conduta do paciente, não do profissional."]], "pista": "Desvio + prejuízo.", "pp": ["Elemento 1: desvio do padrão de cuidado.", "Elemento 2: prejuízo ao paciente.", "Sem um deles, não há má prática.", "Qualidade: aumentar a probabilidade de bons resultados dado o estado da arte."], "ap": "<p>A ideia de “estado da arte” é essencial na perícia: julga-se a conduta pelo padrão vigente à época, não pelo resultado. Teste de caráter do professor: “tudo que faria se pudesse ser invisível e impune”.<\/p>", "mud": [["Complicação conhecida apesar de conduta adequada", "Não é má prática", "Sem desvio"], ["Desvio sem dano", "Não configura má prática pela definição", "Falta prejuízo"], ["Desvio com dano", "Má prática", "Ambos os elementos"]], "arm": "Confundir resultado adverso com má prática.", "ouro": "Má prática = desvio do padrão + prejuízo.", "m2": ["Como a aula define qualidade em saúde?", "Grau em que os serviços aumentam a probabilidade de resultados favoráveis e diminuem a de desfavoráveis, dado o estado da arte."], "n": ["Má prática: desvio + prejuízo.", "Resultado ruim ≠ má prática.", "Padrão = estado da arte.", "Qualidade aumenta resultados favoráveis.", "Perícia julga conduta, não resultado."]}, {"id": "P02-Q08", "t": "P02", "sub": "Interfaces periciais do médico assistente", "comp": "Aplicação", "rac": "Reconhecimento", "dif": "média", "p": [3], "q": "Segundo a Aula 01, em quais situações o médico assistente atua em interface com a perícia, muitas vezes sem perceber?", "o": [["Isenção de IR e IPI, passe livre, seguros e incapacidade para AVDs", "São documentos assistenciais que alimentam decisões administrativas e legais."], ["Apenas quando é nomeado pelo juiz como perito em processo cível ou trabalhista", "A nomeação é perícia formal; a aula destaca as interfaces informais."], ["Somente ao preencher a declaração de óbito em casos de morte violenta", "Óbito violento é atribuição do IML; não é o exemplo da aula."], ["Exclusivamente ao emitir atestado de comparecimento para o empregador", "A aula cita isenções, passe livre, seguros e AVDs."]], "pista": "Documentos que geram direitos.", "pp": ["Isenção de IR.", "Isenção de IPI.", "Passe livre.", "Seguros.", "Incapacidade para AVDs."], "ap": "<p>Por isso a Aula 04 afirma que o médico assistente “não estava preparado”: para que seu relatório seja útil, precisa saber a lei, o que o instituto regula e as exigências da função. Um laudo que só diz o diagnóstico frequentemente não basta para o enquadramento.<\/p>", "mud": [["Relatório para isenção de IR por cegueira", "Precisa informar AV com melhor correção", "Critério objetivo"], ["Relatório para passe livre", "Descrever deficiência e limitação", "Critério do benefício"], ["Atestado para seguro", "Descrever sequela e consolidação", "Tabela do seguro"]], "arm": "Achar que só o perito nomeado lida com perícia.", "ouro": "Todo relatório que gera direito é um pedaço de perícia.", "m2": ["Relatório para isenção de IR em paciente com ceratocone: que dado é indispensável?", "Acuidade visual com melhor correção em cada olho (cegueira legal ≤ 0,05)."], "n": ["Isenção de IR.", "Isenção de IPI.", "Passe livre.", "Seguros.", "AVDs."]}, {"id": "P03-Q01", "t": "P03", "sub": "Princípio de Pareto", "comp": "Gestão da qualidade", "rac": "Aplicação", "dif": "média", "p": [4], "q": "Um serviço de radiologia percebe que uma pequena fração de tipos de exame concentra a maior parte dos atrasos de laudo. Como a Aula 02 propõe usar o princípio de Pareto nessa situação?", "o": [["Como guia de priorização: focar os ~20% de causas que geram ~80% dos atrasos", "Foi o uso descrito no estudo de radiologia (Pianykh, JACR 2017)."], ["Como lei matemática exata, que garante 80% de redução de atrasos ao corrigir 20% dos exames", "É heurística, não regra exata."], ["Como prova de que as falhas são predestinadas e não podem ser corrigidas pela equipe", "A aula ressalta que não descreve falhas predestinadas, mas oportunidades."], ["Como critério para excluir do serviço os 20% de pacientes mais complexos e demorados", "Não é critério de exclusão de pacientes."]], "pista": "Poucos fatores, muito efeito.", "pp": ["Origem: Pareto (1896), terras italianas.", "Princípio 80/20.", "Uso em saúde: priorizar alvos de alto impacto.", "Exemplo: ~20% dos exames → ~80% dos atrasos no PACS."], "ap": "<p>A aula também sugere aplicar Pareto ao próprio estudo: identificar os poucos temas que concentram a maior parte das questões e priorizá-los, sem abandonar o resto.<\/p>", "mud": [["Estudo para prova", "Priorizar temas de alto rendimento", "Mesma lógica"], ["Erros de medicação concentrados em poucos fármacos", "Focar alta vigilância", "Priorização"], ["Uso para punir profissionais", "Mau uso", "O princípio aponta oportunidades"]], "arm": "Tratar 80/20 como número exato.", "ouro": "Pareto: ache os poucos que causam muito.", "m2": ["Quem descreveu o princípio e com qual observação?", "Vilfredo Pareto (1896): 80% das terras italianas com 20% da população."], "n": ["Princípio 80/20.", "Heurística de priorização.", "Pianykh, JACR 2017.", "Oportunidade, não fatalidade.", "Aplicável ao estudo."]}, {"id": "P03-Q02", "t": "P03", "sub": "Elementos da comunicação", "comp": "Comunicação", "rac": "Classificação", "dif": "fácil", "p": [4], "q": "Durante a passagem de plantão em um pronto-socorro barulhento, o médico usa siglas que a enfermeira não conhece, e ela não confirma a informação recebida. No modelo apresentado em aula, o barulho e as siglas correspondem a qual elemento?", "o": [["Ruído", "Ruído é qualquer interferência que distorce a mensagem (barulho, linguagem inadequada)."], ["Canal", "Canal é o meio (fala, escrita, digital); a distorção é o ruído."], ["Feedback", "Feedback é o retorno do receptor; aqui ele faltou."], ["Receptor", "Receptor é quem recebe; a interferência é o ruído."]], "pista": "O que distorce a mensagem.", "pp": ["Emissor: médico.", "Receptor: enfermeira.", "Canal: fala.", "Ruído: barulho e siglas.", "Feedback ausente: falta de confirmação."], "ap": "<p>A falta de feedback (confirmação, “read-back”) é parte do que a meta 2 de segurança do paciente procura corrigir. A comunicação efetiva e ética é competência do perfil do egresso nas DCN-MEC.<\/p>", "mud": [["Enfermeira repete a ordem e o médico confirma", "Feedback adequado", "Fecha o ciclo"], ["Mensagem enviada por aplicativo", "Canal digital (registro permanente)", "Meio"], ["Médico que inicia a mensagem", "Emissor", "Origem"]], "arm": "Confundir canal com ruído.", "ouro": "Ruído distorce; feedback confirma.", "m2": ["Que meta internacional de segurança se relaciona à falha de confirmação de ordens?", "Meta 2 — melhorar a eficácia da comunicação."], "n": ["Emissor, receptor, mensagem.", "Canal: fala, escrita, gesto, digital.", "Feedback: retorno.", "Ruído: interferência.", "Ligação com meta 2."]}, {"id": "P03-Q03", "t": "P03", "sub": "Comunicação digital como prova", "comp": "Sigilo e compliance", "rac": "Aplicação a caso", "dif": "média", "p": [4], "q": "Interno publica story de plantão mostrando um abscesso, com tatuagem do paciente visível, e apaga após 1 hora. Um familiar reconhece, faz print e denuncia. Qual análise é correta?", "o": [["O print basta como prova: houve quebra de sigilo, de segurança e do regimento", "Canal digital gera registro permanente; apagar não elimina a prova."], ["Como o story foi apagado em menos de uma hora, não há prova nem infração disciplinar a apurar", "O print documenta o conteúdo."], ["Sem o nome do paciente na imagem, não há quebra de sigilo nem identificação possível", "Tatuagem, ambiente e prontuário identificam."], ["A conduta só seria infração se o interno já fosse médico com CRM ativo", "Estudantes respondem ao regimento e ao código de conduta da instituição."]], "pista": "O que se publica vira prova.", "pp": ["Canal digital → registro permanente.", "Identificação indireta (tatuagem) = identificação.", "Violações: sigilo (CEM), segurança do paciente, regimento (compliance).", "Prevenção: conhecer as regras antes de agir."], "ap": "<p>Regra de ouro da Aula 02: o que você comunica publicamente pode ser registrado e se tornar prova. Vlog do tipo “meu dia como estudante” com paciente, prontuário ou ambiente identificável configura quebra de sigilo e infração ao Regimento/Código de Conduta FELUMA, com potencial processo disciplinar.<\/p>", "mud": [["Imagem anonimizada com consentimento para ensino institucional", "Contexto diferente, com regras próprias", "Consentimento e finalidade"], ["Foto de prontuário em grupo privado", "Também é registro e pode ser prova", "Canal digital"], ["Médico formado", "Também responde ao CEM", "Sigilo profissional"]], "arm": "Achar que apagar ou omitir o nome resolve.", "ouro": "Publicou, registrou; registrou, pode virar prova.", "m2": ["Qual pilar falhou nesse caso?", "Prevenção — conhecer as regras mínimas antes de agir."], "n": ["Registro digital é permanente.", "Print é prova.", "Identificação indireta conta.", "Sigilo, segurança e regimento.", "Pilar da prevenção."]}, {"id": "P03-Q04", "t": "P03", "sub": "DCN-MEC e perfil do egresso", "comp": "Formação médica", "rac": "Memória com compreensão", "dif": "fácil", "p": [4], "q": "Quais características do perfil do egresso de Medicina nas DCN-MEC foram destacadas na Aula 02?", "o": [["Formação humanista, crítica e reflexiva; comunicação ética; segurança do paciente e inovação", "São os três eixos citados no slide."], ["Formação exclusivamente técnica e especializada desde o início do curso, com foco em procedimentos", "As DCN valorizam formação geral e humanista."], ["Atuação restrita ao hospital terciário, sem ênfase em comunicação com famílias", "Comunicação com pacientes, famílias e equipe é destacada."], ["Rejeição a novas tecnologias, para preservar o exame físico tradicional", "As DCN falam em incorporação de novas tecnologias."]], "pista": "Humanista, comunicador, seguro e inovador.", "pp": ["Formação geral, humanista, crítica e reflexiva.", "Comunicação efetiva e ética (verbal e não verbal).", "Segurança do paciente e inovação (tecnologias, padrões internacionais)."], "ap": "<p>Esses eixos conectam as aulas: comunicação (Aula 02), segurança do paciente (Aula 01) e tecnologia (Aula 10 — telessaúde, com o contraponto do exame físico e da responsabilidade).<\/p>", "mud": [["Pergunta sobre telessaúde", "Modelo híbrido", "Aula 10"], ["Pergunta sobre metas de segurança", "Seis metas JCI", "Aula 01"], ["Pergunta sobre comunicação", "Emissor, receptor, canal, feedback, ruído", "Aula 02"]], "arm": "Achar que as DCN privilegiam a especialização precoce.", "ouro": "Egresso: técnico, humano, comunicador e seguro.", "m2": ["Que tipo de comunicação as DCN destacam?", "Verbal e não verbal, com pacientes, famílias e equipe."], "n": ["Formação geral e humanista.", "Crítica e reflexiva.", "Comunicação efetiva e ética.", "Segurança do paciente.", "Inovação tecnológica."]}, {"id": "P03-Q05", "t": "P03", "sub": "Compliance em hospital de ensino", "comp": "Conceito", "rac": "Compreensão", "dif": "média", "p": [4], "q": "Como a Aula 02 caracteriza o compliance em hospitais de ensino?", "o": [["Conformidade com leis, normas, ética e protocolos, como compromisso institucional", "Vai além de “seguir regras”: é compromisso institucional."], ["Mera obediência a ordens hierárquicas, sem relação com segurança do paciente ou com ética", "A aula amplia o conceito para integridade e segurança."], ["Departamento jurídico que defende o hospital em processos de responsabilidade civil", "Compliance é cultura de conformidade, não só defesa jurídica."], ["Conjunto de regras que se aplica apenas aos funcionários contratados do hospital, não aos estudantes", "Estudantes estão sujeitos ao Regimento e ao Código de Conduta."]], "pista": "Mais que seguir regras.", "pp": ["Objeto: leis, regulamentos, políticas internas, diretrizes éticas, protocolos.", "Finalidade: integridade, segurança do paciente, excelência na formação.", "Instrumentos: Regimento Interno CMMG/FELUMA e Código de Conduta FELUMA.", "Lógica: causa → consequência das próprias escolhas."], "ap": "<p>O compliance se conecta à prevenção (pilar da Aula 01): quem conhece as regras antes de agir evita o conflito. O caso do story mostra violação simultânea de sigilo, segurança e regimento.<\/p>", "mud": [["Estudante descumpre o regimento", "Processo disciplinar", "Compliance alcança estudantes"], ["Hospital sem protocolo de alta vigilância", "Falha de compliance e segurança", "Protocolos"], ["Profissional que segue protocolos", "Conformidade", "Integridade"]], "arm": "Reduzir compliance a obediência.", "ouro": "Compliance é compromisso com integridade, segurança e formação.", "m2": ["Quais documentos institucionais foram citados?", "Regimento Interno CMMG/FELUMA e Código de Conduta FELUMA."], "n": ["Conformidade com normas e ética.", "Compromisso institucional.", "Integridade e segurança.", "Excelência na formação.", "Vale para estudantes."]}, {"id": "P03-Q06", "t": "P03", "sub": "Viés e mapa da empatia", "comp": "Postura pericial", "rac": "Aplicação de analogia", "dif": "média", "p": [4], "q": "A parábola dos sábios cegos que tocam partes do elefante foi usada na Aula 02. Qual a aplicação pericial correta?", "o": [["As partes veem pedaços; o perito precisa construir a visão do todo", "Cada parte toma o pedaço pelo todo; o perito busca a síntese pela evidência."], ["O perito deve adotar a versão do autor, que sente o dano", "Adotar uma parte reproduz o viés."], ["O perito deve seguir o assistente técnico do réu", "Também é tomar a parte pelo todo."], ["A verdade é inatingível e o laudo pode ser opinativo", "O CPC exige método aceito e veda opiniões pessoais (art. 473 §2º)."]], "pista": "Parte × todo.", "pp": ["Cada sábio generaliza a partir de uma parte.", "Na perícia, as partes têm visões parciais.", "O perito integra os dados (clínica, documentos, exame).", "Mapa da empatia: ferramenta de autocrítica."], "ap": "<p>Mapa da empatia (autocrítica): quem sou eu? o que preciso fazer? o que ouço? o que vejo e falo? o que faço? dores? alegrias? Na dialética processual da Aula 09, a tese do autor e a antítese do réu são sintetizadas pela evidência científica.<\/p>", "mud": [["Laudo baseado só na queixa do autor", "Viés de parte", "Falta o todo"], ["Laudo que integra exame, documentos e literatura", "Visão do todo", "Método"], ["Laudo com opinião pessoal", "Vedado (CPC 473 §2º)", "Limite"]], "arm": "Confundir empatia com adesão à versão de uma das partes.", "ouro": "Perito vê o elefante inteiro.", "m2": ["Qual dispositivo do CPC veda opinião pessoal no laudo?", "Art. 473, §2º."], "n": ["Sábios cegos: parte pelo todo.", "Partes têm visões parciais.", "Perito busca o todo.", "Mapa da empatia: autocrítica.", "Síntese pela evidência."]}, {"id": "P04-Q01", "t": "P04", "sub": "Os três braços da Seguridade", "comp": "Classificação", "rac": "Aplicação a caso", "dif": "média", "p": [5, 6], "q": "Idosa de 72 anos, lavradora a vida toda, nunca teve carteira assinada, não consegue mais trabalhar e não tem renda. Segundo a resposta da aula, a qual braço da Seguridade ela recorre e com qual benefício?", "o": [["Assistência social: BPC/LOAS de 1 salário mínimo, se comprovar não ter meios de subsistência", "Idosa ≥ 65 anos sem meios de subsistência; não contributivo, mas seletivo (Lei 8.742/93)."], ["Seguro social — aposentadoria por incapacidade permanente, pois trabalhou por toda a vida no campo", "Sem contribuição comprovada não há qualidade de segurada; a nuance é a prova de segurada especial."], ["Assistência médica — SUS, que paga benefício mensal aos idosos sem renda e sem previdência", "O SUS presta atendimento, não paga benefício."], ["Seguro social — auxílio-acidente, por sequelas de esforço repetitivo na lavoura ao longo da vida", "Auxílio-acidente exige segurado e sequela consolidada de acidente."]], "pista": "Não contribuiu + idosa + sem renda.", "pp": ["Contribuiu? Não (nunca teve CTPS) → fora do seguro social.", "Idade ≥ 65 e sem meios → assistência social.", "BPC: 1 salário mínimo, critério de miserabilidade.", "Nuance: provar trabalho rural em economia familiar = segurada especial → benefício previdenciário."], "ap": "<p>Nuance de prova destacada no resumo: o segurado especial contribui sobre a produção; se ela comprovar o trabalho rural em regime de economia familiar, acessa o benefício previdenciário. Sem essa prova, cai no assistencial, que exige critério de miserabilidade.<\/p>", "mud": [["Comprova trabalho rural em economia familiar", "Segurada especial — benefício previdenciário", "Contribuição sobre a produção"], ["Tem 60 anos e não é PcD", "Não preenche a idade do BPC idoso", "≥ 65 anos"], ["Família com renda suficiente", "Não preenche miserabilidade", "Seletividade"]], "arm": "Achar que “trabalhou a vida toda” basta para benefício previdenciário.", "ouro": "Sem contribuição: assistência social (BPC), se miserável e ≥ 65 ou PcD.", "m2": ["Pessoa com deficiência de 40 anos, sem renda e sem contribuição. Benefício possível?", "BPC/LOAS como PcD, se preencher o critério de renda."], "n": ["Seguro social: contributivo.", "Assistência social: não contributiva, seletiva.", "Assistência médica: universal e gratuita.", "BPC: 1 SM, idoso ≥ 65 ou PcD.", "Segurado especial: contribui sobre a produção."]}, {"id": "P04-Q02", "t": "P04", "sub": "Assistência médica e ausência de contribuição", "comp": "Classificação", "rac": "Aplicação a caso", "dif": "fácil", "p": [6], "q": "Estudante de medicina de 23 anos, que nunca contribuiu para o INSS, sofre trauma raquimedular após mergulho em água rasa e fica paraplégico. Qual o braço da Seguridade que o atende no momento e qual a situação previdenciária?", "o": [["Assistência médica (SUS); sem benefício previdenciário, por não ser segurado", "A lição da aula: o seguro só protege quem contribui; pode, em tese, buscar BPC como PcD se preencher a renda."], ["Seguro social, com aposentadoria por incapacidade permanente imediata, por se tratar de acidente", "Acidente dispensa carência, mas exige qualidade de segurado."], ["Assistência social, que custeia a internação no hospital de trauma e a reabilitação", "O atendimento hospitalar é do SUS (assistência médica)."], ["Seguro social, com auxílio-acidente vitalício, pois o acidente ocorreu durante o curso universitário", "Estudante não contribuinte não é segurado; auxílio-acidente exige categoria específica de segurado."]], "pista": "Atendimento: universal. Benefício: só para quem contribui.", "pp": ["Atendimento hospitalar → SUS (universal).", "Previdência → exige qualidade de segurado.", "Não contribuiu → sem benefício previdenciário.", "Possível BPC como PcD, se miserabilidade."], "ap": "<p>Frase do prof
