dos. A dor pode ser pleurítica à esquerda e referida no ombro esquerdo (sinal de Kehr).<\/p>", "mud": [["Paciente com risco cirúrgico proibitivo e coleção unilocular acessível", "Drenagem percutânea em caso selecionado", "Exceção, com risco maior de sangramento"], ["Imunossuprimido com microabscessos", "Considerar etiologia fúngica", "Agentes conforme imunidade"], ["Abscesso hepático no mesmo contexto", "Drenagem percutânea é padrão no fígado", "Menor risco hemorrágico"]], "arm": "Transpor a regra do fígado para o baço: no fígado a drenagem percutânea é padrão; no baço, exceção.", "ouro": "Baço infectado sai; vacinar depois.", "m2": ["Paciente com mononucleose tem dor súbita em HE, hipotensão e líquido livre. Diagnóstico e conduta?", "Rotura esplênica espontânea (Aula 10): estabilização e esplenectomia."], "n": ["Mecanismo principal: hematogênico (endocardite).", "Clínica: febre, dor em HE, esplenomegalia, Kehr.", "Tratamento definitivo: esplenectomia.", "Drenagem percutânea sangra mais no baço.", "Vacinar contra pneumococo, meningococo, Hib."], "img": ["c-006-003"]}, {"id": "C02-Q05", "t": "C02", "sub": "Ureterolitíase como diferencial", "comp": "Diagnóstico diferencial", "rac": "Comparação clínica", "dif": "fácil", "p": [6], "q": "Homem de 38 anos com dor lombar direita súbita, em cólica, irradiada para a bolsa escrotal; está agitado, muda de posição a todo momento. Giordano positivo; EAS com hematúria microscópica. Qual exame confirma e qual o mecanismo do alfa-bloqueador prescrito?", "o": [["TC sem contraste; a tansulosina relaxa a musculatura lisa ureteral e facilita a passagem do cálculo", "TC sem contraste mostra o cálculo; o alfa-bloqueador reduz espasmo e pressão intraluminal no ureter."], ["TC com contraste venoso; a tansulosina dissolve cálculos de oxalato de cálcio em poucos dias de uso contínuo", "O contraste não é necessário para ver o cálculo, e a tansulosina não dissolve cálculo."], ["US de abdome; a tansulosina é antibiótico de amplo espectro", "Tansulosina é alfa-bloqueador, não antibiótico."], ["Rx simples de abdome; a tansulosina reduz a produção de urina e, assim, a cólica", "Muitos cálculos não aparecem no Rx; a tansulosina não age sobre a diurese."]], "pista": "Paciente inquieto (no inflamatório ele fica imóvel) + Giordano + hematúria.", "pp": ["Dor em cólica lombar com irradiação genital.", "Comportamento: inquieto — distingue do peritonismo.", "Giordano e hematúria reforçam origem urinária.", "TC sem contraste; analgesia, hidratação e alfa-bloqueador."], "ap": "<p>A ureterolitíase é o grande imitador do abdome inflamatório e da apendicite quando o cálculo está no ureter distal direito. O comportamento do paciente ajuda: com irritação peritoneal ele evita se mover; na cólica nefrética não acha posição. A tabela de dor irradiada da Aula 9 associa a cólica nefrética à região escrotal e aos grandes lábios. Atenção ao idoso: dor lombar súbita com hipotensão é AAA roto até prova em contrário.<\/p>", "mud": [["Paciente de 72 anos com hipotensão e massa pulsátil", "AAA roto", "Erro clássico é chamar de cólica renal"], ["Febre e piúria com obstrução", "Urgência urológica (desobstrução)", "Infecção a montante de obstrução"], ["Dor em FID com Blumberg e imóvel", "Apendicite", "Irritação peritoneal"]], "arm": "Esquecer o AAA no idoso com “cólica renal” e hipotensão.", "ouro": "Inquieto com Giordano e hematúria = ureter; imóvel com descompressão = peritônio.", "m2": ["Mulher de 30 anos com dor em FID, inquieta, hematúria e β-hCG negativo. Próximo exame?", "TC sem contraste para cálculo ureteral distal."], "n": ["Ureterolitíase: cólica lombar, irradiação genital.", "Paciente inquieto.", "Giordano positivo e hematúria.", "TC sem contraste.", "Tansulosina relaxa o ureter."]}, {"id": "C02-Q06", "t": "C02", "sub": "Doença inflamatória pélvica", "comp": "Diagnóstico diferencial", "rac": "Aplicação", "dif": "fácil", "p": [6], "q": "Mulher de 24 anos com dor hipogástrica e em FID há 2 dias, febre, corrimento vaginal e dispareunia. Ao exame: dor à mobilização do colo e dor anexial bilateral. Qual exame é obrigatório antes de prosseguir e qual o tratamento-base?", "o": [["β-hCG; antibioticoterapia, abordando abscesso tubo-ovariano se presente", "Em mulher fértil o β-hCG é obrigatório; DIP trata-se com ATB e, se houver abscesso tubo-ovariano, aborda-se a coleção."], ["TC com contraste; apendicectomia laparoscópica de urgência", "O quadro bilateral com corrimento e dor à mobilização do colo aponta para DIP, que é tratada clinicamente."], ["Colonoscopia com ileoscopia e biópsias; mesalazina oral como tratamento de indução", "Nada sugere DII; corrimento e dor cervical são ginecológicos."], ["Cintilografia com tecnécio; ressecção ileal", "Cintilografia é o exame do Meckel sangrante, não da DIP."]], "pista": "Dor bilateral + corrimento + dor à mobilização do colo.", "pp": ["Perfil: mulher fértil.", "Achados: febre, corrimento, dispareunia, dor anexial bilateral, mobilização dolorosa.", "Exame obrigatório: β-hCG (exclui ectópica).", "US transvaginal; ATB; abordar abscesso tubo-ovariano."], "ap": "<p>DIP é diferencial clássico da apendicite em mulheres. Pistas favoráveis à DIP: dor bilateral, corrimento, sangramento uterino anormal e dor à mobilização do colo. A apendicite tende a ser unilateral, com migração da dor e anorexia. Toda mulher em idade fértil com dor abdominal faz β-hCG.<\/p>", "mud": [["β-hCG positivo com dor unilateral e choque", "Ectópica rota", "Hemoperitônio em mulher fértil"], ["Dor migratória periumbilical → FID, sem corrimento", "Apendicite", "Sequência de Murphy"], ["US com coleção anexial de 7 cm sem resposta ao ATB", "Drenagem/abordagem do abscesso", "Abscesso tubo-ovariano"]], "arm": "Ir direto para cirurgia em mulher com dor em FID sem β-hCG e sem considerar DIP.", "ouro": "Mulher fértil com dor abdominal: β-hCG sempre.", "m2": ["Jovem com dor em FID, β-hCG negativo, US transvaginal normal, Alvarado 7 e migração da dor. Hipótese?", "Apendicite aguda; seguir o fluxograma de probabilidade."], "n": ["DIP: dor hipogástrica, febre, corrimento.", "Dor à mobilização do colo e anexial bilateral.", "β-hCG obrigatório.", "Tratamento: antibiótico.", "Abscesso tubo-ovariano exige abordagem."]}, {"id": "C02-Q07", "t": "C02", "sub": "Dor irradiada — padrões clássicos", "comp": "Semiologia", "rac": "Associação", "dif": "fácil", "p": [4], "q": "Assinale a associação correta entre doença e padrão de irradiação da dor apresentada na Aula 9.", "o": [["Pancreatite aguda — dor lombar “em faixa”", "A tabela da Aula 9 associa a pancreatite à irradiação lombar em faixa."], ["Colecistite aguda — ombro esquerdo", "A colecistite irradia para o dorso e escápula direita; ombro esquerdo lembra o sinal de Kehr."], ["Cólica nefrética — escápula direita", "A cólica nefrética irradia para a região escrotal e os grandes lábios."], ["Úlcera perfurada — face medial da coxa", "Na úlcera perfurada o conteúdo escorre pela goteira parietocólica e dói no flanco, FID e mesogástrio."]], "pista": "Pâncreas é retroperitoneal.", "pp": ["Recordar a tabela de dor irradiada.", "Pancreatite → lombar em faixa.", "Conferir cada distrator contra a tabela."], "ap": "<p>As irradiações têm base anatômica. O pâncreas retroperitoneal irradia para o dorso; a vesícula, pela inervação compartilhada, para escápula direita; o ureter, pelo trajeto genitofemoral, para escroto e grandes lábios. Na úlcera perfurada, o líquido gástrico/duodenal escoa pela goteira parietocólica direita e pode imitar apendicite. O AAA roto também irradia para a região lombar.<\/p>", "mud": [["Dor lombar súbita em idoso hipotenso", "AAA roto", "Também irradia para a região lombar"], ["Dor em FID após perfuração duodenal", "Escoamento pela goteira parietocólica", "Imita apendicite"], ["Dor no ombro esquerdo com hemoperitônio", "Sinal de Kehr", "Irritação frênica"]], "arm": "Trocar irradiações da vesícula (escápula direita) com o sinal de Kehr (ombro esquerdo).", "ouro": "Pâncreas em faixa; vesícula na escápula direita; ureter no escroto.", "m2": ["Dor em FID 2 horas após dor epigástrica súbita em usuário de AINE. Por que a dor aparece na FID?", "Úlcera perfurada: conteúdo escorre pela goteira parietocólica direita."], "n": ["Colecistite → dorso/escápula direita.", "Cólica nefrética → escroto/grandes lábios.", "Pancreatite → lombar em faixa.", "AAA roto → lombar.", "Úlcera perfurada → flanco, FID e mesogástrio."]}, {"id": "C02-Q08", "t": "C02", "sub": "Semiologia do abdome inflamatório", "comp": "Interpretação do exame físico", "rac": "Compreensão", "dif": "média", "p": [4], "q": "Sobre a semiologia do abdome agudo inflamatório descrita na Aula 9, qual afirmativa é correta?", "o": [["O paciente tende a ficar imóvel, com ruídos hidroaéreos diminuídos", "A irritação peritoneal faz o paciente evitar movimento; o íleo reflexo reduz os RHA."], ["Os ruídos hidroaéreos ficam aumentados e metálicos, como na obstrução mecânica", "RHA aumentados e metálicos são característicos da obstrução mecânica, não do inflamatório."], ["A dor é tipicamente súbita e máxima desde o início", "Dor súbita e máxima é típica do perfurativo e do vascular; o inflamatório é progressivo."], ["A palpação é pouco dolorosa, sendo a febre o principal achado", "A palpação com dor localizada, defesa e descompressão dolorosa é o achado principal."]], "pista": "Peritônio irritado → movimento dói.", "pp": ["Recordar inspeção: paciente imóvel, respiração superficial.", "Ausculta: RHA diminuídos.", "Palpação: dor localizada, defesa, descompressão.", "Comparar com obstrutivo (RHA metálicos) e perfurativo (súbita)."], "ap": "<p>O inflamatório começa com dor progressiva, contínua e crescente, visceral que se torna somática. O paciente fica imóvel, com redução da movimentação respiratória do abdome; percussão com dor localizada, timpanismo se houver distensão gasosa e macicez localizada em coleções. Laboratório: leucocitose ou leucopenia, PCR, lactato, função renal, EAS, amilase/lipase, bilirrubinas.<\/p>", "mud": [["RHA metálicos e cólica", "Obstrução mecânica", "Luta peristáltica"], ["Dor súbita máxima e tábua", "Perfurativo", "Peritonite química súbita"], ["Dor intensa com abdome flácido", "Vascular", "Dissociação clínico-exame"]], "arm": "Associar RHA aumentados ao inflamatório: eles estão diminuídos.", "ouro": "Inflamatório: progressivo, imóvel, RHA diminuídos, dor localizada com descompressão.", "m2": ["Paciente com dor em HD há 2 dias, febre, imóvel, Murphy positivo e RHA diminuídos. Síndrome?", "Inflamatória (colecistite aguda); US é o exame inicial."], "n": ["Dor progressiva, contínua, crescente.", "Paciente imóvel.", "RHA diminuídos; íleo reflexo.", "Palpação: dor localizada, defesa, descompressão.", "Tratamento: suporte, ATB, intervenção por causa."]}, {"id": "C03-Q01", "t": "C03", "sub": "Escore de Alvarado — cálculo e conduta", "comp": "Aplicação de escore", "rac": "Cálculo + decisão", "dif": "média", "p": [8, 9], "q": "Homem de 19 anos, dor periumbilical há 18 h que migrou para a FID, inapetência e dois vômitos após a dor. T 37,9 °C. Defesa e descompressão dolorosa em FID. Leucócitos 15.200 com 8% de bastões. IMC 22. Qual o escore de Alvarado e a conduta?", "o": [["10 pontos; apendicectomia videolaparoscópica, sem necessidade obrigatória de imagem", "Todos os critérios estão presentes (1+1+1+2+1+1+2+1 = 10): alta probabilidade → operar; se houver dúvida, US seria o exame (IMC < 25)."], ["8 pontos; TC obrigatória antes da cirurgia", "A soma correta é 10, e no homem jovem com quadro típico a imagem não é obrigatória."], ["6 pontos; observação clínica e reavaliação em 24 h, sem necessidade de exame de imagem inicial", "Subestima o escore: defesa e leucocitose valem 2 pontos cada."], ["10 pontos; antibioticoterapia isolada como primeira escolha", "Antibiótico isolado é opção para casos não complicados selecionados; a apendicectomia laparoscópica é o tratamento definitivo de escolha."]], "pista": "Defesa em FID e leucocitose valem 2 pontos; os demais, 1.", "pp": ["Migração (1), anorexia (1), vômitos (1).", "Defesa em FID (2), descompressão (1).", "Temperatura > 37,3 °C (1).", "Leucocitose (2), desvio (1).", "Total 10 → alta probabilidade → apendicectomia laparoscópica."], "ap": "<p>Alvarado é teste de <b>triagem<\/b>: reduz falsos-negativos e indica quem precisa de imagem. Pontuação ≥ 7 = alta probabilidade (a aula escreve “> 7”); 5–6 = intermediária (imagem e reexame); 0–4 = baixa (observação/alta com reavaliação). No caso clássico do resumo, a conduta inclui ATB em dose única pré-operatória e nenhum ATB no pós-operatório se a apendicite for não complicada (fases I–II).<\/p>", "mud": [["Mulher de 26 anos com o mesmo quadro", "β-hCG e considerar US antes", "Diferenciais ginecológicos"], ["IMC 34", "TC se houver dúvida", "US perde acurácia em obesos"], ["Peritonite difusa", "Cirurgia de urgência e ATB terapêutico", "Apendicite complicada"]], "arm": "Contar 1 ponto para leucocitose ou para defesa; ambas valem 2.", "ouro": "MANTRELS: Tenderness e Leucocitose valem 2. ≥ 7 = operar.", "m2": ["Paciente com migração, náuseas, descompressão dolorosa e T 37,6 °C, sem defesa e leucócitos normais. Escore e conduta?", "1 + 1 + 1 + 1 = 4 → baixa probabilidade: observação ou alta com reavaliação em até 24 h se seguro e próximo."], "n": ["Alvarado = triagem.", "Defesa e leucocitose = 2 pontos.", "≥ 7 alta; 5–6 intermediária; 0–4 baixa.", "Alta probabilidade → operar.", "Não complicada: ATB dose única pré-operatória."]}, {"id": "C03-Q02", "t": "C03", "sub": "Escore de Alvarado — itens", "comp": "Conhecimento do escore", "rac": "Memória com compreensão", "dif": "fácil", "p": [8], "q": "No escore de Alvarado (MANTRELS), quais são os dois critérios que valem 2 pontos?", "o": [["Defesa de parede na FID e leucocitose", "Tenderness e Leukocytosis são os itens com peso 2; os demais valem 1."], ["Migração da dor e febre", "Ambos valem 1 ponto."], ["Descompressão dolorosa e desvio à esquerda", "Ambos valem 1 ponto."], ["Anorexia e náuseas/vômitos", "Ambos valem 1 ponto."]], "pista": "T e L de MANTRELS.", "pp": ["MANTRELS: Migration, Anorexia, Nausea, Tenderness, Rebound, Elevation, Leukocytosis, Shift.", "Peso 2: Tenderness e Leukocytosis.", "Total máximo 10."], "ap": "<p>O mnemônico ajuda a lembrar a ordem e os pesos. Atenção a dois detalhes de prova: “Rebound” (descompressão) é diferente de “Tenderness” (defesa à palpação) e vale 1; a temperatura considerada é > 37,3 °C; a leucocitose, > 10.000.<\/p>", "mud": [["Pergunta sobre o ponto de corte de febre", "> 37,3 °C", "Critério do escore"], ["Pergunta sobre o corte de leucocitose", "> 10.000", "Critério do escore"], ["Pergunta sobre pontuação máxima", "10", "Soma dos oito itens"]], "arm": "Confundir defesa (Tenderness, 2 pontos) com descompressão (Rebound, 1 ponto).", "ouro": "T e L valem dois.", "m2": ["Quantos pontos tem um paciente com apenas defesa em FID e leucocitose?", "4 pontos — baixa probabilidade isoladamente; o exame clínico seriado decide."], "n": ["M — migração (1).", "A — anorexia (1); N — náuseas/vômitos (1).", "T — defesa (2); R — descompressão (1).", "E — temperatura (1).", "L — leucocitose (2); S — desvio (1)."]}, {"id": "C03-Q03", "t": "C03", "sub": "US × TC na apendicite", "comp": "Escolha do exame de imagem", "rac": "Aplicação de critérios", "dif": "média", "p": [7], "q": "Homem de 42 anos, IMC 33, com dor em FID há 30 h e Alvarado 6. Qual exame de imagem é o mais adequado segundo a aula?", "o": [["Tomografia computadorizada de abdome", "IMC > 25 é indicação de TC; o exame tem S de 96% e mostra complicações e diagnósticos alternativos."], ["Ultrassonografia, por ser o exame de escolha em todos os adultos", "A US é preferida em IMC < 25, gestantes e crianças; perde acurácia em obesos."], ["Radiografia simples de abdome", "O Rx não confirma nem exclui apendicite."], ["Ressonância magnética", "A RM é reservada à gestante com US inconclusiva."]], "pista": "Obesidade reduz a janela acústica da US.", "pp": ["Probabilidade intermediária (5–6) → imagem + reexame.", "IMC 33 → TC.", "TC: apêndice > 6 mm, alvo, borramento, apendicolito, abscesso."], "ap": "<p>A tabela US × TC da Aula 8 lista as indicações de TC: IMC > 25, preditores de apendicite complicada, necessidade de diagnóstico diferencial, sintomas atípicos (comum em idosos) e alto risco cirúrgico. A US (S 75–90%) é escolha em IMC < 25 sem preditores, gestantes e crianças; US negativo não descarta apendicite.<\/p>", "mud": [["Criança de 9 anos", "US", "Sem radiação"], ["Gestante de 24 semanas", "US; RM se inconclusivo", "Evitar radiação"], ["Idoso com dor atípica", "TC", "Apresentação atípica e mais perfuração"]], "arm": "Achar que a US é sempre o primeiro exame: depende do perfil.", "ouro": "Magro, criança ou gestante: US. Obeso, idoso, atípico ou complicado: TC.", "m2": ["Mulher de 23 anos, IMC 21, Alvarado 5, β-hCG negativo. Primeiro exame?", "US de abdome (e transvaginal se dúvida ginecológica)."], "n": ["US: IMC < 25, gestantes, crianças.", "TC: IMC > 25, complicação, atípico, idoso, alto risco.", "US S 75–90%; TC S 96%.", "Apêndice > 6 mm não compressível.", "US negativo não descarta."], "img": ["c-008-005", "c-008-006"]}, {"id": "C03-Q04", "t": "C03", "sub": "Apendicite na gestante", "comp": "Particularidades clínicas e de imagem", "rac": "Aplicação", "dif": "média", "p": [11], "q": "Gestante de 28 semanas com dor em flanco direito, náuseas e febre baixa. Leucocitose discreta. Qual afirmativa é correta sobre a abordagem?", "o": [["US é o primeiro exame (RM se inconclusiva), e a dor pode ser mais alta pelo deslocamento cranial do apêndice", "O útero desloca o apêndice cranialmente; a sequência de imagem é US → RM."], ["A TC com contraste é o primeiro exame, pois a acurácia supera o risco fetal", "A aula prioriza US na gestante e RM se inconclusivo."], ["A dor em flanco direito afasta apendicite, que na gestante continua doendo sempre no ponto de McBurney e com Blumberg", "O deslocamento cranial explica dor em flanco ou hipocôndrio direito."], ["Leucocitose discreta exclui apendicite, pois a gestação não altera o leucograma", "A gestação pode cursar com leucocitose fisiológica; o leucograma tem limitação."]], "pista": "Útero gravídico empurra o apêndice para cima.", "pp": ["Gestante: evitar radiação.", "US primeiro; RM se inconclusivo.", "Dor atípica (flanco/HD) é esperada no 3º trimestre."], "ap": "<p>O quadro “Na prova” do capítulo de apendicite fixa: gestante → US primeiro, RM se inconclusivo; útero desloca o apêndice cranialmente e a dor pode ser em flanco ou hipocôndrio direito. Idoso → apresentação atípica e mais perfuração → TC.<\/p>", "mud": [["Gestante no 1º trimestre", "Dor mais próxima da FID", "Útero ainda pequeno"], ["RM confirma apendicite", "Apendicectomia", "Tratamento definitivo"], ["Idoso com dor vaga", "TC", "Atípico, mais perfuração"]], "arm": "Descartar apendicite porque a dor não está em McBurney.", "ouro": "Gestante: US → RM; a dor sobe com o útero.", "m2": ["Gestante de 10 semanas, dor em FID, US com apêndice de 9 mm não compressível. Conduta?", "Apendicite: apendicectomia (laparoscópica é a via preferencial em geral)."], "n": ["Gestante: US primeiro.", "RM se US inconclusiva.", "Apêndice desloca-se cranialmente.", "Dor em flanco/HD no fim da gestação.", "Idoso: TC."]}, {"id": "C03-Q05", "t": "C03", "sub": "Sinal do psoas", "comp": "Semiologia", "rac": "Correlação anatômica", "dif": "fácil", "p": [7], "q": "Paciente em decúbito lateral esquerdo refere dor quando o examinador hiperestende a coxa direita contra resistência. Esse sinal sugere apêndice em qual posição?", "o": [["Retrocecal", "O sinal do psoas indica inflamação em contato com o músculo psoas, típica do apêndice retrocecal."], ["Pélvico", "O apêndice pélvico é sugerido pelo sinal do obturador (rotação interna da coxa fletida)."], ["Pré-ileal anterior, junto à parede", "A posição anterior produz dor em McBurney e Blumberg precoces, não o sinal do psoas."], ["Subepático, por gestação avançada", "O deslocamento cranial na gestação muda a localização da dor, não define o sinal do psoas."]], "pista": "Psoas fica no retroperitônio, atrás do ceco.", "pp": ["Manobra: hiperextensão da coxa D em decúbito lateral E.", "Estira o psoas → dor se apêndice inflamado em contato.", "Posição: retrocecal."], "ap": "<p>Os sinais especiais ajudam quando a dor não está no ponto clássico. No apêndice retrocecal a dor pode irradiar para o dorso, e a irritação do peritônio anterior pode ser menor. O obturador (rotação interna da coxa fletida) sugere apêndice pélvico, que pode dar sintomas urinários ou retais.<\/p>", "mud": [["Dor à rotação interna da coxa fletida", "Pélvico (obturador)", "Contato com o obturador interno"], ["Dor na FID ao palpar a FIE", "Rovsing", "Deslocamento retrógrado de gás"], ["Dor na FID ao tossir", "Dunphy", "Irritação peritoneal"]], "arm": "Trocar psoas e obturador.", "ouro": "Psoas = retrocecal; Obturador = pélvico.", "m2": ["Paciente com dor suprapúbica, disúria e sinal do obturador positivo. Posição provável do apêndice?", "Pélvica; piócitos no EAS não excluem apendicite."], "n": ["Psoas: hiperextensão da coxa D.", "Indica apêndice retrocecal.", "Obturador: rotação interna da coxa D fletida.", "Indica apêndice pélvico.", "Rovsing e Dunphy completam a semiologia."]}, {"id": "C03-Q06", "t": "C03", "sub": "Sinal do obturador e EAS alterado", "comp": "Semiologia e laboratório", "rac": "Interpretação", "dif": "média", "p": [7, 8], "q": "Mulher de 22 anos, β-hCG negativo, com dor hipogástrica e em FID há 20 h, disúria discreta e febre baixa. A rotação interna da coxa direita fletida provoca dor. EAS: piócitos aumentados. Qual interpretação é correta?", "o": [["O sinal do obturador sugere apêndice pélvico, e piócitos no EAS não excluem apendicite", "Apêndice pélvico inflamado encostado na bexiga/ureter pode gerar piúria; o EAS alterado não afasta o diagnóstico."], ["O EAS com piócitos confirma infecção urinária e encerra a investigação", "Piúria pode ocorrer na apendicite; encerrar a investigação é erro clássico."], ["O sinal do obturador indica apêndice retrocecal, em contato com o psoas e o rim direito", "Retrocecal é sugerido pelo sinal do psoas."], ["Disúria exclui apendicite e indica pielonefrite", "Disúria pode ocorrer pela proximidade do apêndice pélvico com a bexiga."]], "pista": "Apêndice pélvico encosta na bexiga.", "pp": ["Obturador positivo → pélvico.", "Piócitos: inflamação de contato, não exclui.", "Seguir investigação (US/TC) e reexame."], "ap": "<p>A Aula 8 destaca no laboratório: leucocitose com desvio, PCR aumentada e EAS que pode ter piócitos — e isso não exclui apendicite. Na prova, o EAS alterado costuma ser usado como distrator para empurrar o diagnóstico para ITU.<\/p>", "mud": [["Hematúria e cólica com paciente inquieta", "Ureterolitíase", "Padrão de cólica"], ["Febre alta, Giordano positivo, bacteriúria", "Pielonefrite", "Diferencial urológico"], ["Dor à mobilização do colo e corrimento", "DIP", "Diferencial ginecológico"]], "arm": "Fechar diagnóstico de ITU com base apenas em piócitos.", "ouro": "Piúria não exclui apendicite.", "m2": ["Homem de 25 anos com apendicite pélvica tem diarreia e tenesmo. Por quê?", "Irritação do reto pelo apêndice pélvico inflamado."], "n": ["Obturador → pélvico.", "Piúria pode ocorrer na apendicite.", "EAS alterado não exclui.", "Diferenciais urológicos e ginecológicos.", "Seguir com imagem conforme perfil."]}, {"id": "C03-Q07", "t": "C03", "sub": "Probabilidade intermediária e US negativa", "comp": "Fluxograma de avaliação", "rac": "Decisão sob incerteza", "dif": "difícil", "p": [9], "q": "Mulher de 27 anos, IMC 22, β-hCG negativo, Alvarado 6. A US não visualizou o apêndice e não mostrou alterações. Persiste dor em FID. Segundo o fluxograma da aula, qual a melhor conduta?", "o": [["Tratar a US como inconclusiva: TC ou internação com reexame seriado (ou laparoscopia diagnóstica se a dúvida persistir)", "US negativa não descarta (S 75–90%); na probabilidade intermediária com resultado incerto, o fluxograma prevê TC, reexame ou laparoscopia."], ["Alta definitiva, pois a US normal com apêndice não visualizado praticamente exclui apendicite em paciente com IMC normal", "A sensibilidade limitada impede excluir com uma US negativa."], ["Antibioticoterapia empírica oral domiciliar sem diagnóstico confirmado", "O tratamento não operatório exige diagnóstico confirmado por imagem."], ["Colonoscopia para avaliar o ceco e o óstio apendicular antes de decidir", "Não é exame de investigação de apendicite aguda."]], "pista": "US negativa não descarta.", "pp": ["Alvarado 6 = intermediária.", "US não visualizou apêndice: resultado não conclusivo.", "Opções: TC, reexame seriado internada, laparoscopia diagnóstica.", "Nunca tratar com ATB sem diagnóstico confirmado."], "ap": "<p>O fluxograma 3 da Aula 8 (Sabiston) divide em alta (operar), intermediária (TC ou US + reexame) e baixa. Na intermediária: positivo → operar; negativo → alta/diagnóstico alternativo; incerto → laparoscopia diagnóstica ou internar e reexaminar. Na baixa, o paciente seguro e próximo recebe alta com reavaliação em até 24 h; o idoso, o duvidoso ou quem mora longe faz TC ou é internado.<\/p>", "mud": [["A TC subsequente fosse normal e a dor regredisse", "Alta com diagnóstico alternativo", "Exame negativo e boa evolução"], ["A TC mostrasse apêndice de 10 mm com borramento", "Apendicectomia", "Confirmação"], ["Alvarado 3, mora perto, segura", "Alta com reavaliação em 24 h", "Baixa probabilidade"]], "arm": "Tratar US negativa como exclusão.", "ouro": "US negativa com clínica suspeita = exame inconclusivo, não diagnóstico negativo.", "m2": ["Idoso de 78 anos, Alvarado 4, dor vaga em FID, mora a 80 km. Conduta?", "Baixa probabilidade, mas idoso e mora longe → TC ou internar e reexaminar."], "n": ["Intermediária: imagem + reexame.", "US negativa não descarta.", "Incerto → laparoscopia ou internação.", "Baixa e seguro: alta com reavaliação em 24 h.", "Idoso/duvidoso/longe: TC ou internar."]}, {"id": "C03-Q08", "t": "C03", "sub": "Fisiopatologia", "comp": "Mecanismo da doença", "rac": "Sequência causal", "dif": "fácil", "p": [7], "q": "Qual sequência representa corretamente a fisiopatologia da apendicite aguda apresentada na aula?", "o": [["Obstrução da luz → muco e bactérias → distensão e ↑ pressão → isquemia da mucosa → inflamação → gangrena → perfuração", "É a sequência do fluxograma 2 (Aula 8, slide 3)."], ["Isquemia arterial primária do apêndice → obstrução secundária da luz → secreção de muco → inflamação transmural → perfuração", "A isquemia é consequência da distensão, não evento inicial."], ["Perfuração inicial microscópica → abscesso → obstrução da luz → inflamação transmural → gangrena", "Inverte a ordem; a perfuração é a fase final."], ["Infecção viral sistêmica → gangrena imediata → obstrução", "Não há gangrena imediata; o processo começa pela obstrução luminal."]], "pista": "Começa pela obstrução (hiperplasia linfoide ou apendicolito).", "pp": ["Causas da obstrução: hiperplasia linfoide, apendicolito.", "Muco + bactérias distendem a luz.", "Pressão compromete o fluxo da parede → isquemia.", "Evolui para gangrena e perfuração."], "ap": "<p>Entender a sequência explica a clínica e o tempo: a distensão estimula fibras viscerais (dor periumbilical), a inflamação transmural atinge o peritônio (dor em FID) e a perfuração gera peritonite. Também explica as fases anatomopatológicas: catarral (I), fibrinosa (II), gangrenosa (III) e perfurada (IV).<\/p>", "mud": [["Criança com hiperplasia linfoide após virose", "Causa obstrutiva mais comum em jovens", "Tecido linfoide abundante"], ["Apendicolito na TC", "Maior risco de falha do ATB", "Obstrução mecânica persistente"], ["Quadro com > 72 h", "Maior risco de gangrena/perfuração", "Progressão temporal"]], "arm": "Achar que a infecção bacteriana inicia o processo; ela vem depois da obstrução.", "ouro": "Obstrução → distensão → isquemia → gangrena → perfuração.", "m2": ["Por que o apendicolito pesa a favor da cirurgia?", "Mantém a obstrução luminal; o ATB isolado tem mais falha, complicações e recorrência."], "n": ["Evento inicial: obstrução da luz.", "Hiperplasia linfoide e apendicolito.", "Distensão → isquemia da mucosa.", "Gangrena e perfuração são finais.", "Fases I–IV seguem essa progressão."], "img": ["c-008-007"]}, {"id": "C03-Q09", "t": "C03", "sub": "Fases anatomopatológicas", "comp": "Classificação", "rac": "Classificação", "dif": "fácil", "p": [8], "q": "Durante apendicectomia, o cirurgião encontra apêndice com áreas de necrose e pequena coleção periapendicular, sem perfuração livre. Como se classifica?", "o": [["Fase III — gangrenosa, apendicite complicada", "Necrose e abscesso caracterizam a fase III, que já é complicada."], ["Fase I — catarral, ainda não complicada, com edema", "A catarral tem apenas hiperemia e edema."], ["Fase II — fibrinosa, complicada", "A fibrinosa tem exsudato fibrinoso e é ainda não complicada."], ["Fase IV — perfurada, mas não complicada", "A fase IV é perfurada e é complicada."]], "pista": "Necrose = gangrena.", "pp": ["I catarral: hiperemia, edema.", "II fibrinosa: exsudato fibrinoso.", "III gangrenosa: necrose, abscesso.", "IV perfurada.", "I–II não complicadas; III–IV complicadas."], "ap": "<p>A classificação define a antibioticoterapia pós-operatória: nas fases I–II, ATB em dose única pré-operatória e nada no pós; nas fases III–IV, ATB terapêutico com curso curto de 2–3 dias após o controle adequado do foco (WSES 2025).<\/p>", "mud": [["Apenas hiperemia e edema", "Fase I", "Não complicada"], ["Exsudato fibrinoso", "Fase II", "Não complicada"], ["Orifício com saída de conteúdo", "Fase IV", "Complicada"]], "arm": "Achar que “complicada” exige perfuração; a gangrena já é complicada.", "ouro": "I–II não complicadas; III–IV complicadas.", "m2": ["Achado de fase II. Quanto tempo de ATB no pós-operatório?", "Nenhum — a dose única pré-operatória basta."], "n": ["I catarral.", "II fibrinosa.", "III gangrenosa (necrose, abscesso).", "IV perfurada.", "Complicada a partir da III."], "img": ["c-008-008", "c-008-009"]}, {"id": "C03-Q10", "t": "C03", "sub": "Antibiótico na apendicite não complicada operada", "comp": "Antibioticoterapia (WSES 2025)", "rac": "Aplicação de diretriz", "dif": "média", "p": [9], "q": "Paciente submetido a apendicectomia laparoscópica por apendicite catarral (fase I). Qual a recomendação de antibiótico segundo a WSES 2025 apresentada em aula?", "o": [["Dose única pré-operatória (Gram-negativos + anaeróbios), sem manter no pós-operatório", "Na não complicada operada, não há benefício em manter ATB no pós-operatório."], ["Manter antibiótico venoso por 7 dias no pós-operatório", "Prolongar ATB na não complicada operada não é recomendado."], ["Antibiótico por 2–3 dias após a cirurgia, como na complicada", "O curso de 2–3 dias é para a complicada após controle do foco."], ["Nenhum antibiótico em momento algum, nem mesmo profilático, por se tratar de apendicite em fase I", "A profilaxia em dose única pré-operatória está indicada."]], "pista": "Não complicada + cirurgia = foco resolvido.", "pp": ["Classificar: fase I = não complicada.", "Regra WSES 2025: dose única pré-operatória.", "Não manter no pós."], "ap": "<p>A tabela de ATB da aula diferencia cinco situações: não complicada operada (dose única), não complicada não operatória (Gram-negativos + anaeróbios, IV → VO), abscesso/plastrão (amplo espectro ± drenagem), complicada operada (terapêutico; 2–3 dias após controle) e falha/sepse (reavaliar foco, ajustar à microbiologia local).<\/p>", "mud": [["Fase IV com peritonite localizada", "ATB terapêutico, 2–3 dias após controle do foco", "Complicada"], ["Tratamento não operatório", "Gram− + anaeróbios IV → VO", "Sem controle cirúrgico do foco"], ["Plastrão com abscesso", "Amplo espectro ± drenagem", "Coleção"]], "arm": "Manter ATB “por segurança” após apendicectomia não complicada.", "ouro": "Não complicada operada: dose única e pronto.", "m2": ["Apendicite perfurada operada, foco controlado. Duração do ATB?", "Curso curto de 2–3 dias após o controle adequado do foco."], "n": ["Não complicada operada: dose única pré-operatória.", "Sem ATB no pós-operatório.", "Complicada: 2–3 dias após controle.", "Cobertura: Gram− + anaeróbios.", "Falha: reavaliar o foco."]}, {"id": "C03-Q11", "t": "C03", "sub": "Apendicite complicada e peritonite", "comp": "Conduta", "rac": "Decisão terapêutica", "dif": "média", "p": [9], "q": "Homem de 33 anos com dor abdominal há 4 dias, febre de 39 °C, taquicardia e peritonite generalizada. TC: apêndice perfurado com líquido livre difuso. Qual a conduta?", "o": [["Cirurgia de urgência para controle do foco, com ATB terapêutico por 2–3 dias após o controle", "Peritonite generalizada exige controle imediato do foco; após controle, ATB por 2–3 dias."], ["Antibioticoterapia isolada associada à drenagem percutânea guiada por TC de todo o líquido livre abdominal", "Abordagem não operatória serve para abscesso/plastrão localizado, não para peritonite generalizada."], ["Antibiótico e apendicectomia de intervalo em 6–10 semanas", "Intervalo é para plastrão com boa resposta, não para peritonite difusa."], ["Observação com reexame clínico seriado e hemograma a cada 6 horas", "Peritonite generalizada não admite observação."]], "pista": "Peritonite generalizada = cirurgia de urgência.", "pp": ["Perfuração com líquido difuso e peritonite.", "Indicação: controle imediato do foco.", "ATB terapêutico; curso curto após controle."], "ap": "<p>A peritonite generalizada é o divisor de águas: mesmo com evolução prolongada, se a inflamação não está bloqueada, o tratamento é cirúrgico. A lógica do plastrão (conservador) só vale quando o processo está contido e o paciente está estável.<\/p>", "mud": [["Massa em FID há 10 dias sem peritonite difusa", "Tratamento não operatório (plastrão)", "Processo bloqueado"], ["Abscesso localizado de 5 cm", "ATB + drenagem percutânea", "Coleção acessível"], ["Choque séptico", "Ressuscitação + cirurgia", "Controle de foco urgente"]], "arm": "Aplicar a conduta do plastrão a quem tem peritonite difusa.", "ouro": "Peritonite difusa: opera. Bloqueado: trata conservador.", "m2": ["Após cirurgia de apendicite perfurada, febre persiste no 5º dia com coleção pélvica. Conduta?", "Reavaliar o foco (drenagem da coleção) e ajustar o ATB."], "n": ["Peritonite generalizada → cirurgia de urgência.", "ATB terapêutico.", "2–3 dias após controle do foco.", "Plastrão só sem peritonite difusa.", "Falha → reavaliar o foco."]}, {"id": "C03-Q12", "t": "C03", "sub": "Tratamento não operatório e apendicolito", "comp": "Indicação terapêutica (WSES 2025)", "rac": "Aplicação de diretriz", "dif": "difícil", "p": [9], "q": "Paciente de 30 anos, estável, com apendicite não complicada confirmada por TC, deseja evitar cirurgia. A TC mostra apendicolito. Qual a melhor orientação?", "o": [["Preferir a cirurgia: o apendicolito aumenta falha, complicações e recorrência com ATB isolado", "A WSES 2025 (Aula 8) recomenda preferir cirurgia quando há apendicolito."], ["Antibiótico isolado é equivalente à cirurgia na presença de apendicolito", "Com apendicolito, o ATB isolado falha mais."], ["O apendicolito contraindica a via laparoscópica e exige laparotomia aberta pela incisão de McBurney", "Não há essa contraindicação; a laparoscopia é a via preferencial."], ["O apendicolito indica apendicectomia de intervalo após 6–10 semanas", "Intervalo é estratégia do plastrão, não da apendicite não complicada com apendicolito."]], "pista": "Apendicolito mantém a obstrução luminal.", "pp": ["Não operatório: estável, imagem confirmada, seguimento possível.", "Apendicolito: maior risco de falha.", "Recomendação: preferir cirurgia."], "ap": "<p>O tratamento não operatório com antibiótico é válido para paciente selecionado com apendicite não complicada confirmada por imagem e possibilidade de seguimento. A presença de apendicolito pesa contra essa estratégia, e a falha do não operatório leva à apendicectomia.<\/p>", "mud": [["Sem apendicolito, estável e com seguimento", "ATB não operatório é opção", "Paciente selecionado"], ["Falha clínica do ATB", "Apendicectomia", "Progressão"], ["Recorrência após ATB", "Apendicectomia", "Falha tardia"]], "arm": "Oferecer ATB isolado sem checar apendicolito.", "ouro": "Apendicolito puxa para o centro cirúrgico.", "m2": ["Paciente tratado com ATB, sem apendicolito, volta 8 meses depois com nova apendicite. Conduta?", "Apendicectomia — falha/recorrência do não operatório."], "n": ["ATB isolado: só não complicada, selecionada.", "Exige imagem confirmatória e seguimento.", "Apendicolito → preferir cirurgia.", "Falha/recorrência → apendicectomia.", "Laparoscopia é via preferencial."]}, {"id": "C03-Q13", "t": "C03", "sub": "Plastrão apendicular", "comp": "Conduta", "rac": "Decisão terapêutica", "dif": "difícil", "p": [10, 11], "q": "Mulher de 46 anos com dor em FID há 10 dias, febre baixa intermitente; hoje se alimenta. Massa dolorosa e mal delimitada em FID, sem peritonite difusa, estável. TC: plastrão com coleção de 5 cm. Qual a conduta mais adequada?", "o": [["ATB IV de amplo espectro + drenagem percutânea; depois, colonoscopia e discussão de apendicectomia de intervalo", "Plastrão sem peritonite difusa: tratamento não operatório; coleção volumosa é drenada; aos 46 anos, colonoscopia para excluir neoplasia de ceco."], ["Apendicectomia imediata com dissecção do bloqueio inflamatório", "Operar o bloqueio aumenta risco de lesão e de colectomia direita desnecessária."], ["Alta com antibiótico oral e retorno ambulatorial em 3 meses para apendicectomia eletiva por videolaparoscopia, sem drenagem", "Coleção de 5 cm requer internação, ATB IV e drenagem."], ["Colectomia direita de princípio, pela idade e pela possibilidade de neoplasia de ceco", "A suspeita de neoplasia é investigada com colonoscopia após resolução, não justifica colectomia de princípio."]], "pista": "Evolução > 1 semana + massa + sintomas atenuados.", "pp": ["Plastrão: evolução prolongada, massa, sintomas atenuados.", "Sem peritonite generalizada → não operatório.", "Coleção acessível e volumosa → drenagem.", "Seguimento: colonoscopia (> 40 anos), intervalo em casos selecionados.", "Falha → cirurgia."], "ap": "<p>O tratamento conservador do plastrão reduz complicações, colectomias direitas desnecessárias e tempo de internação. A apendicectomia de intervalo (6–10 semanas) é reservada a casos selecionados (WSES 2025). Em pacientes mais velhos, a massa pode ser neoplasia de ceco, por isso a colonoscopia faz parte do seguimento.<\/p>", "mud": [["Peritonite generalizada", "Cirurgia de urgência", "Processo não bloqueado"], ["Sepse e febre progressiva apesar do ATB", "Cirurgia", "Falha"], ["Paciente de 22 anos com boa resposta", "Seguimento; intervalo seletivo", "Baixa suspeita de neoplasia"]], "arm": "Operar o plastrão na fase aguda por reflexo.", "ouro": "Plastrão: esfria, drena, investiga e só depois decide.", "m2": ["Idoso de 70 anos, plastrão com boa resposta ao ATB. Qual exame antes da alta definitiva do seguimento?", "Colonoscopia/TC para excluir neoplasia de ceco."], "n": ["Plastrão: > 1 semana, massa, sintomas atenuados.", "TC confirma.", "ATB IV ± drenagem.", "Colonoscopia em idoso/suspeita de neoplasia.", "Intervalo em 6–10 semanas, seletivo."], "img": ["c-010-010"]}, {"id": "C04-Q01", "t": "C04", "sub": "Diverticulose: anatomia e Laplace", "comp": "Fisiopatologia", "rac": "Compreensão conceitual", "dif": "média", "p": [12], "q": "Sobre a formação dos divertículos colônicos apresentada na Aula 7, assinale a alternativa correta.", "o": [["São pseudodivertículos que herniam onde os vasa recta penetram a muscular, mais no sigmoide por seu menor raio", "Mucosa e submucosa herniam nos pontos de fraqueza onde os vasos penetram; pela lei de Laplace (P = T/R), o sigmoide, de menor raio, tem maior pressão."], ["São divertículos verdadeiros, com todas as camadas da parede, mais frequentes no ceco por causa de seu maior diâmetro", "Divertículo verdadeiro é o de Meckel; os colônicos são falsos, e 95% estão no sigmoide e descendente."], ["Formam-se na borda antimesentérica, longe dos vasos, o que explica por que raramente sangram", "Formam-se justamente onde o vaso penetra; por isso o vasa recta fica coberto por mucosa fina e pode sangrar."], ["São mais comuns em populações com dieta rica em fibras e diminuem de prevalência com a idade", "São mais comuns em regiões industrializadas (dieta pobre em fibras) e aumentam com a idade (5% aos 40, 65% aos 80)."]], "pista": "Ponto de fraqueza = entrada do vasa recta; maior pressão = menor raio.", "pp": ["Identificar o tipo: pseudodivertículo (mucosa + submucosa).", "Local de herniação: penetração dos vasa recta.", "Por que no sigmoide: P = T/R, menor raio → maior pressão.", "Epidemiologia: aumenta com a idade, dieta pobre em fibras."], "ap": "<p>A relação anatômica com o vasa recta explica as duas complicações principais: a microperfuração (diverticulite) e o sangramento arterial. Como o vaso fica estirado no colo do divertículo, coberto só por mucosa fina, ele pode romper e produzir sangramento volumoso e indolor. A predominância à esquerda vale para a doença e para a diverticulite; o sangramento, curiosamente, é mais comum à direita.<\/p>", "mud": [["A pergunta fosse sobre Meckel", "Divertículo verdadeiro, ileal, antimesentérico", "Persistência do ducto vitelino"], ["A pergunta fosse sobre o lado do sangramento", "Mais comum no cólon direito", "Achado das aulas"], ["A pergunta fosse sobre o Zenker", "Pseudodivertículo de pulsão no triângulo de Killian", "Outro mecanismo e local"]], "arm": "Chamar o divertículo colônico de verdadeiro e confundir sua localização com a do Meckel.", "ouro": "Colônico = falso, no vaso, no sigmoide (Laplace).", "m2": ["Por que um paciente com diverticulose pode sangrar muito sem dor?", "Ruptura do vasa recta exposto no colo do divertículo, sem inflamação — sangramento arterial indolor."], "n": ["Pseudodivertículos: mucosa + submucosa.", "Herniam onde os vasa recta penetram.", "95% no sigmoide e descendente.", "Laplace: menor raio, maior pressão.", "Aumentam com a idade; dieta pobre em fibras."], "img": ["c-012-011"]}, {"id": "C04-Q02", "t": "C04", "sub": "Diagnóstico da diverticulite e papel da colonoscopia", "comp": "Escolha de exames", "rac": "Aplicação", "dif": "fácil", "p": [12, 13], "q": "Homem de 64 anos com dor em FIE há 2 dias, febre de 38,2 °C e leucocitose. Estável, sem peritonite difusa. Qual exame confirma o diagnóstico e qual a orientação sobre colonoscopia?", "o": [["TC de abdome com contraste agora; colonoscopia 6–8 semanas após a fase aguda", "A TC confirma, estadia e permite drenagem guiada; a colonoscopia aguarda a resolução para excluir neoplasia e DII."], ["Colonoscopia imediata para confirmar a diverticulite e afastar câncer de sigmoide na mesma internação", "A insuflação na fase aguda pode perfurar o cólon inflamado; a colonoscopia fica para 6–8 semanas."], ["Enema baritado imediato, que delimita os divertículos e substitui a TC na urgência", "O bário não é exame de urgência para diverticulite e não substitui a TC."], ["Radiografia simples de abdome, suficiente para iniciar ATB, dispensando TC e colonoscopia futuras", "O Rx não confirma diverticulite nem mostra abscesso; a colonoscopia posterior continua indicada."]], "pista": "Insuflar cólon inflamado = risco de perfuração.", "pp": ["Quadro: dor em FIE, febre, leucocitose = suspeita de diverticulite.", "Exame: TC com contraste (S 93–97%, E ~100%).", "Colonoscopia: contraindicada na fase aguda.", "Fazer 6–8 semanas depois para excluir neoplasia e DII."], "ap": "<p>A TC mostra os achados (densificação da gordura pericólica em 98%, divertículos em 84%, espessamento em 70%), a extensão e as complicações (abscesso, peritonite, fístula, obstrução) — e ainda guia a drenagem. O alerta do resumo é direto: não fazer colonoscopia na diverticulite aguda; já no sangramento diverticular a colonoscopia é permitida e terapêutica.<\/p>", "mud": [["O quadro fosse sangramento volumoso indolor", "Colonoscopia após preparo", "Diagnóstica e terapêutica"], ["A TC mostrasse abscesso de 6 cm", "Drenagem percutânea + ATB", "Hinchey II"], ["Peritonite fecal com pneumoperitônio", "Cirurgia", "Hinchey IV"]], "arm": "Pedir colonoscopia na fase aguda “para afastar câncer”.", "ouro": "Diverticulite: TC agora, colonoscopia depois (6–8 semanas).", "m2": ["Paciente recuperado de diverticulite não complicada há 2 meses, nunca fez colonoscopia. Indicação?", "Sim: colonoscopia para excluir neoplasia e DII."], "n": ["TC com contraste confirma e estadia.", "Densificação da gordura pericólica: achado mais comum.", "Colonoscopia contraindicada na fase aguda.", "Colonoscopia 6–8 semanas depois.", "No sangramento, colonoscopia é permitida."], "img": ["c-013-013"]}, {"id": "C04-Q03", "t": "C04", "sub": "Hinchey II e drenagem", "comp": "Classificação e conduta", "rac": "Classificação + decisão", "dif": "média", "p": [13, 14, 15], "q": "Homem de 67 anos, estável, com dor em FIE há 4 dias, febre e leucocitose. TC: sigmoide espessado com divertículos e abscesso pélvico de 6 cm, sem pneumoperitônio difuso. Classificação e conduta?", "o": [["Hinchey II; ATB IV e drenagem percutânea guiada por TC", "Abscesso grande que se estende à pelve é Hinchey II; acima de 4–5 cm o ATB isolado tende a falhar, e o abscesso acessível deve ser drenado."], ["Hinchey I; ATB oral ambulatorial, sem drenagem", "Hinchey I é o abscesso pericólico confinado e pequeno; 6 cm na pelve é Hinchey II."], ["Hinchey III; laparotomia com Hartmann", "Hinchey III é peritonite purulenta generalizada, ausente aqui."], ["Hinchey IV; ressecção com anastomose primária", "Hinchey IV é peritonite fecal por perfuração livre."]], "pista": "Abscesso pélvico > 4–5 cm sem peritonite difusa.", "pp": ["Achado: abscesso pélvico de 6 cm.", "Classificar: Hinchey II.", "Tamanho > 4–5 cm → drenagem percutânea.", "Sem peritonite generalizada → sem cirurgia de urgência.", "Depois: colonoscopia 6–8 semanas e discutir sigmoidectomia eletiva individualizada."], "ap": "<p>Hinchey I e II têm mortalidade < 5%; III, 13%; IV, 43%. O caso clínico 4.1 do resumo traz exatamente este raciocínio e lembra que abscesso drenado é critério de doença complicada, o que leva a discutir sigmoidectomia eletiva de forma individualizada.<\/p>", "mud": [["Abscesso pericólico de 3 cm", "ATB isolado", "Hinchey I, < 4–5 cm"], ["Peritonite purulenta difusa", "Cirurgia", "Hinchey III"], ["Abscesso inacessível à punção", "ATB com vigilância ou cirurgia", "WSES 2020"]], "arm": "Classificar pela febre ou pela dor, e não pela extensão anatômica na TC.", "ouro": "Hinchey sobe com a extensão: confinado → pelve → purulenta → fecal.", "m2": ["Abscesso pericólico de 2,5 cm em imunocompetente estável. Conduta?", "Hinchey I: ATB isolado (Gram− + anaeróbios), sem drenagem."], "n": ["I: abscesso pericólico confinado.", "II: abscesso grande pélvico/distante.", "III: peritonite purulenta (13%).", "IV: peritonite fecal (43%).", "> 4–5 cm: drenagem percutânea + ATB."], "img": ["c-013-014", "c-013-012"]}, {"id": "C04-Q04", "t": "C04", "sub": "Abscesso pequeno (Hinchey I)", "comp": "Conduta", "rac": "Aplicação", "dif": "fácil", "p": [13, 14], "q": "Mulher de 58 anos, estável, com diverticulite de sigmoide e abscesso pericólico de 3 cm na TC. Qual a conduta preconizada pelas diretrizes da aula?", "o": [["Antibiótico isolado, cobrindo Gram-negativos e anaeróbios", "Abscesso < 4–5 cm responde a ATB isolado (AGA 2021 e WSES 2020)."], ["Drenagem percutânea obrigatória, qualquer que seja o tamanho", "A drenagem é reservada aos abscessos > 4–5 cm."], ["Sigmoidectomia de urgência com anastomose primária na mesma internação", "Sem peritonite difusa não há indicação de cirurgia de urgência."], ["Colonoscopia imediata para drenar por via endoluminal", "Colonoscopia é contraindicada na fase aguda."]], "pista": "Pequeno (< 4–5 cm) = ATB isolado.", "pp": ["Classificar: abscesso pericólico pequeno (Hinchey I).", "Tamanho 3 cm.", "Conduta: ATB isolado.", "Seguimento: colonoscopia 6–8 semanas."], "ap": "<p>As duas diretrizes convergem no abscesso pequeno: antibiótico. A diferença entre elas aparece na doença não complicada (AGA: ATB seletivo; WSES: não rotineiro). O ponto de corte de 4–5 cm separa ATB isolado de drenagem.<\/p>", "mud": [["Abscesso de 7 cm", "Drenagem + ATB", "Acima do corte"], ["Sem abscesso, imunocompetente", "Conservador; ATB seletivo", "Não complicada"], ["Peritonite difusa", "Cirurgia", "Complicada grave"]], "arm": "Drenar todo abscesso diverticular.", "ouro": "Abscesso < 4–5 cm: só antibiótico.", "m2": ["Após ATB, o abscesso de 3 cm não regride e a paciente segue febril. Próximo passo?", "Reavaliar: drenagem percutânea se acessível ou cirurgia — falha do tratamento."], "n": ["< 4–5 cm: ATB isolado.", "> 4–5 cm: drenagem + ATB.", "Cobertura: Gram− + anaeróbios.", "Colonoscopia depois.", "Falha → drenagem/cirurgia."]}, {"id": "C04-Q05", "t": "C04", "sub": "Diverticulite não complicada no imunocompetente", "comp": "Conduta (AGA × WSES)", "rac": "Comparação de diretrizes", "dif": "média", "p": [14], "q": "Homem de 52 anos, imunocompetente, sem comorbidades, com diverticulite não complicada na TC, tolerando dieta e estável. Qual conduta é compatível com AGA 2021 e WSES 2020?", "o": [["Tratamento conservador, com antibiótico usado de forma seletiva e não rotineira", "Ambas as diretrizes aceitam conservador sem ATB rotineiro no imunocompetente com doença não complicada."], ["Antibiótico venoso obrigatório por 14 dias em internação, para todos os pacientes com diverticulite", "Nenhuma das diretrizes torna o ATB obrigatório nesse perfil."], ["Sigmoidectomia eletiva já indicada após este primeiro episódio para evitar recorrência futura", "A cirurgia eletiva é individualizada e não decidida pelo número de episódios."], ["Drenagem percutânea profilática do sigmoide e da gordura pericólica", "Não há coleção a drenar."]], "pista": "Imunocompetente + não complicada = ATB seletivo.", "pp": ["Classificar: não complicada.", "Perfil: imunocompetente, sem risco.", "AGA: ATB seletivo; WSES: não rotineiro.", "Seguimento: colonoscopia 6–8 semanas."], "ap": "<p>A divergência entre as diretrizes é de ênfase, não de direção: AGA fala em ATB seletivo e WSES em não usar rotineiramente. Ambas indicam ATB em imunossuprimidos e alto risco, e na presença de gás pericólico (doença de maior risco). Quando usado, o ATB cobre Gram-negativos e anaeróbios, por via oral quando possível.<\/p>", "mud": [["Paciente transplantado renal", "ATB indicado", "Imunossuprimido"], ["Gás pericólico na TC", "ATB + vigilância", "Maior risco"], ["Não tolera dieta, sepse", "Internar e ATB", "Gravidade clínica"]], "arm": "Achar que toda diverticulite exige antibiótico.", "ouro": "Não complicada e imunocompetente: ATB não é obrigatório.", "m2": ["Mesmo quadro em paciente em quimioterapia. Conduta?", "ATB (Gram− + anaeróbios) — imunossupressão aumenta risco de falha do não operatório."], "n": ["Não complicada + imunocompetente: conservador.", "AGA: ATB seletivo; WSES: não rotineiro.", "Imunossuprimido/alto risco: ATB.", "Gás pericólico: ATB.", "Colonoscopia em 6–8 semanas."]}, {"id": "C04-Q06", "t": "C04", "sub": "Diverticulite no imunossuprimido", "comp": "Conduta", "rac": "Aplicação", "dif": "média", "p": [14], "q": "Paciente transplantado renal em uso de tacrolimo e micofenolato apresenta diverticulite não complicada de sigmoide. Qual a conduta e por quê?", "o": [["Antibiótico para Gram-negativos e anaeróbios, por maior risco de falha do tratamento não operatório", "Imunossupressão é indicação de ATB em ambas as diretrizes; o risco de falha do não operatório é maior."], ["Conduta sem antibiótico, igual à do imunocompetente, já que a TC não mostra complicações", "No imunossuprimido o ATB está indicado mesmo sem complicação."], ["Sigmoidectomia de urgência em todos os transplantados, sem nenhuma tentativa prévia de tratamento clínico", "A urgência depende de peritonite/perfuração; imunossupressão é critério para discutir cirurgia eletiva."], ["Colonoscopia na fase aguda para confirmar o diagnóstico antes de iniciar antibiótico", "Colonoscopia é contraindicada na fase aguda."]], "pista": "Imunossuprimido = ATB indicado.", "pp": ["Perfil: imunossuprimido.", "Doença: não complicada.", "Regra: ATB indicado (AGA e WSES).", "Após a fase aguda: discutir cirurgia eletiva (imunodeprimidos)."], "ap": "<p>Imunodeprimidos aparecem duas vezes no capítulo: como indicação de antibiótico na fase aguda e como uma das indicações de cirurgia eletiva após 6–8 semanas, porque a recorrência pode ser grave e com resposta inflamatória atenuada.<\/p>", "mud": [["Imunocompetente", "ATB seletivo", "Baixo risco"], ["Peritonite difusa", "Cirurgia de urgência", "Complicada grave"], ["Recuperado após 8 semanas", "Discutir sigmoidectomia eletiva", "Imunodeprimido"]], "arm": "Aplicar ao transplantado a conduta “sem ATB” do imunocompetente.", "ouro": "Imunossuprimido: ATB na fase aguda e cirurgia eletiva em pauta depois.", "m2": ["Paciente em corticoide crônico com diverticulite e mínima dor ao exame, mas TC com abscesso de 5 cm. Conduta?", "Drenagem percutânea + ATB; a resposta clínica atenuada não diminui a gravidade."], "n": ["Imunossupressão → ATB.", "Cobertura Gram− + anaeróbios.", "Maior risco de falha.", "Indicação de cirurgia eletiva depois.", "Colonoscopia só após a fase aguda."]}, {"id": "C04-Q07", "t": "C04", "sub": "Hinchey IV e cirurgia de Hartmann", "comp": "Conduta de urgência", "rac": "Decisão", "dif": "média", "p": [14, 15], "q": "Mulher de 79 anos, cardiopata, com 3 dias de dor em FIE, evolui com dor difusa súbita. PA 80 × 50 em noradrenalina, abdome em tábua. TC: pneumoperitônio e líquido livre com conteúdo fecal. Qual a classificação e a cirurgia mais adequada?", "o": [["Hinchey IV; cirurgia de Hartmann", "Peritonite fecal em paciente instável e com comorbidades: ressecção, colostomia terminal e fechamento do coto retal."], ["Hinchey III; anastomose primária sem estoma", "Conteúdo fecal define Hinchey IV; anastomose primária fica para o estável."], ["Hinchey II; drenagem percutânea e ATB", "Há perfuração livre com peritonite fecal; drenagem percutânea não controla o foco."], ["Hinchey IV; tratamento conservador em UTI", "Peritonite fecal exige controle cirúrgico do foco."]], "pista": "Fecal + instável + comorbidades.", "pp": ["Classificar: peritonite fecal → Hinchey IV (mortalidade ~43%).", "Paciente instável, cardiopata.", "Cirurgia de controle de danos: Hartmann.", "ATB de amplo espectro e suporte intensivo."], "ap": "<p>Hartmann = ressecção do segmento doente + colostomia terminal + fechamento do coto retal, com reconstrução em segundo tempo. Evita anastomose em campo contaminado num paciente que não toleraria uma deiscência. No paciente estável com peritonite, WSES 2020 prefere ressecção com anastomose primária ± ileostomia de proteção.<\/p>", "mud": [["Paciente estável, jovem, sem comorbidades", "Ressecção + anastomose primária ± ileostomia", "Tolera anastomose"], ["Peritonite purulenta, estável", "Ressecção + anastomose ± ileostomia", "Hinchey III estável"], ["Abscesso pélvico sem peritonite", "Drenagem percutânea", "Hinchey II"]], "arm": "Escolher anastomose primária em paciente em choque com contaminação fecal.", "ouro": "Instável e contaminado: Hartmann (controle de danos).", "m2": ["Homem de 50 anos, estável, Hinchey III. Opção cirúrgica preferida pela WSES 2020?", "Ressecção com anastomose primária ± ileostomia de proteção."], "n": ["Hinchey IV = peritonite fecal.", "Mortalidade ~43%.", "Instável/comorbidades: Hartmann.", "Estável: ressecção + anastomose ± ileostomia.", "Hartmann: colostomia terminal + coto retal."], "img": ["c-014-015", "c-014-016"]}, {"id": "C04-Q08", "t": "C04", "sub": "Cirurgia eletiva após diverticulite", "comp": "Indicação cirúrgica", "rac": "Aplicação de critérios", "dif": "difícil", "p": [14], "q": "Homem de 61 anos teve o segundo episódio de diverticulite não complicada, tratado clinicamente. Pergunta se a cirurgia é obrigatória “após dois episódios”. Qual a resposta coerente com a aula?", "o": [["A indicação é individualizada (idade, comorbidades, gravidade, sintomas), não pelo número de episódios", "AGA 2021 e WSES 2020 abandonaram o critério numérico; a decisão é individual."], ["Sim, a regra atual manda operar sempre após o segundo episódio, independentemente da gravidade dos quadros", "A regra numérica não é usada pelas diretrizes citadas."], ["Não, a cirurgia eletiva nunca é indicada na doença diverticular, mesmo com fístula ou estenose", "Fístula, estenose, imunossupressão e dúvida de neoplasia são indicações."], ["Sim, mas só se a colonoscopia na fase aguda tiver mostrado muitos divertículos no sigmoide", "Colonoscopia não se faz na fase aguda e o número de divertículos não define a cirurgia."]], "pista": "Não se conta episódio; avalia-se o paciente.", "pp": ["Critério antigo: número de episódios (abandonado).", "Critérios atuais: idade, comorbidades, frequência, gravidade, sintomas persistentes.", "Outras indicações: imunodeprimidos, impossibilidade de excluir câncer, fístula, estenose."], "ap": "<p>A lista do resumo para cirurgia eletiva (após 6–8 semanas): diverticulite recorrente com decisão individual; imunodeprimidos; impossibilidade de excluir adenocarcinoma; complicações crônicas (fístula, estenose). O abscesso drenado também leva a discutir sigmoidectomia eletiva.<\/p>", "mud": [["Fístula colovesical", "Cirurgia eletiva", "Complicação crônica"], ["Estenose com suspeita de câncer não excluída", "Cirurgia", "Não se exclui adenocarcinoma"], ["Episódios leves, bem controlados, paciente idoso frágil", "Conduta clínica", "Risco > benefício"]], "arm": "Repetir a regra antiga “dois episódios = operar”.", "ouro": "Diverticulite recorrente: decide-se pelo paciente, não pela contagem.", "m2": ["Mulher com sintomas persistentes que limitam a vida após vários episódios. Pode-se indicar cirurgia?", "Sim, de forma individualizada — sintomas persistentes e impacto são critérios."], "n": ["Eletiva após 6–8 semanas.", "Individualizada, não pelo número.", "Imunodeprimidos.", "Dúvida de neoplasia.", "Fístula e estenose."]}, {"id": "C04-Q09", "t": "C04", "sub": "Sangramento diverticular", "comp": "Diagnóstico e conduta", "rac": "Interpretação + decisão", "dif": "média", "p": [14, 15, 16], "q": "Homem de 81 anos com três episódios de grande volume de sangue vermelho-vivo pelo ânus, sem dor. FC 112, PA 100 × 60. Colonoscopia prévia: múltiplos divertículos. Qual afirmativa é correta?", "o": [["É sangramento diverticular, mais comum no cólon direito; após ressuscitação, a colonoscopia localiza e pode tratar", "HDB indolor volumosa no idoso com diverticulose = sangramento diverticular; a colonoscopia é permitida e terapêutica."], ["Por ser doença diverticular, a colonoscopia é contraindicada como na diverticulite, e deve-se ir direto à cirurgia de urgência", "A contraindicação vale para a diverticulite aguda, não para o sangramento."], ["Sangramento diverticular raramente cessa sozinho, por isso a colectomia de urgência é a primeira conduta", "Cessa espontaneamente em 70–80%; cirurgia só se persistência, instabilidade ou falha."], ["O sangramento vem quase sempre do sigmoide, onde há mais divertículos, então se resseca o sigmoide às cegas", "É mais comum à direita, e ressecção sem localização é a última alternativa (colectomia subtotal se fonte desconhecida)."]], "pista": "Indolor + volumoso + idoso + divertículos.", "pp": ["Diagnóstico: sangramento diverticular.", "Ressuscitação e hemoderivados.", "Colonoscopia após preparo (adrenalina, cautério, clipe).", "Sangramento ativo intenso: angioTC/angiografia com embolização.", "Persistência/instabilidade: colectomia (segmentar se localizado; subtotal se desconhecido)."], "ap": "<p>Números do resumo: ocorre em 4–17% dos pacientes com divertículos; cessa espontaneamente em 70–80%; ressangramento 25% após o 1º episódio e 50% após o 2º; fonte não identificada em 30–40%. A cintilografia detecta ≥ 0,1 mL/min e só localiza; a angiografia precisa de ≥ 1–1,3 mL/min, mas trata (embolização, vasopressina, marcação com azul de metileno).<\/p>", "mud": [["Sangramento lento e intermitente, colonoscopia negativa", "Cintilografia", "Detecta ≥ 0,1 mL/min"], ["Sangramento ativo maciço", "Angiografia/angioTC com embolização", "≥ 1–1,3 mL/min"], ["Instável após endoscopia e angiografia", "Cirurgia", "Falha"]], "arm": "Transportar a contraindicação de colonoscopia da diverticulite para o sangramento.", "ouro": "Diverticulite: esquerda e dolorosa (sem colonoscopia). Sangramento: direita e indolor (com colonoscopia).", "m2": ["Qual exame detecta menor fluxo de sangramento: cintilografia ou angiografia?", "Cintilografia (≥ 0,1 mL/min), mas só localiza; angiografia precisa de fluxo maior e trata."], "n": ["Principal causa de HDB no idoso.", "Indolor, volumosa, vermelho-viva.", "Mais comum à direita.", "Para sozinho em 70–80%.", "Colonoscopia → angiografia → cirurgia."]}, {"id": "C04-Q10", "t": "C04", "sub": "Limiares de detecção no sangramento", "comp": "Métodos diagnósticos", "rac": "Comparação", "dif": "difícil", "p": [15], "q": "Na investigação de hemorragia digestiva baixa de origem diverticular, qual comparação entre cintilografia com hemácias marcadas e angiografia é correta?", "o": [["Cintilografia detecta fluxos menores (≥ 0,1 mL/min) e só localiza; angiografia exige ≥ 1–1,3 mL/min, mas permite tratar", "Cintilografia é mais sensível; angiografia é menos sensível porém terapêutica (embolização)."], ["Angiografia detecta fluxos menores (≥ 0,1 mL/min) e cintilografia exige ≥ 1–1,3 mL/min, por isso a angiografia vem antes", "Os limiares estão invertidos."], ["Ambas detectam o mesmo limiar de fluxo e ambas permitem embolização terapêutica do vaso sangrante", "Só a angiografia é terapêutica; os limiares são diferentes."], ["Cintilografia é terapêutica por permitir marcação do vaso, e angiografia é apenas diagnóstica", "A marcação com azul de metileno, a embolização e a vasopressina são recursos da angiografia."]], "pista": "A cintilografia vê pouco sangue, mas não age.", "pp": ["Limiar da cintilografia: ≥ 0,1 mL/min.", "Limiar da angiografia: ≥ 1–1,3 mL/min (alguns autores 0,5).", "Função: cintilografia localiza; angiografia trata."], "ap": "<p>No fluxograma 6, a colonoscopia é a primeira linha; a cintilografia entra para sangramento lento (localiza); a angiografia seletiva entra para sangramento ativo e permite embolização, vasopressina, somatostatina e marcação do segmento com azul de metileno para guiar a cirurgia. A cirurgia de urgência fica para persistência após endoscopia/angiografia, instabilidade ou impossibilidade desses tratamentos.<\/p>", "mud": [["Pergunta sobre Meckel sangrante", "Angiografia ≥ 0,5 mL/min; artéria vitelina patognomônica", "Limiar citado na Aula 7"], ["Sangramento parou", "Colonoscopia eletiva após preparo", "Sem sangramento ativo"], ["Fonte desconhecida e instabilidade", "Colectomia subtotal", "Sem localização"]], "arm": "Inverter os limiares.", "ouro": "Cintilografia: sensível e só localiza. Angiografia: menos sensível e trata.", "m2": ["Angiografia localizou o vaso no ascendente, embolização falhou e paciente segue instável. Conduta?", "Colectomia segmentar direita (fonte localizada)."], "n": ["Cintilografia ≥ 0,1 mL/min.", "Angiografia ≥ 1–1,3 mL/min.", "Cintilografia localiza; angiografia trata.", "Azul de metileno guia a ressecção.", "Fonte desconhecida → colectomia subtotal."]}, {"id": "C04-Q11", "t": "C04", "sub": "Fístula colovesical", "comp": "Diagnóstico", "rac": "Interpretação", "dif": "média", "p": [15], "q": "Homem de 66 anos com diverticulose refere ITU de repetição e eliminação de “ar na urina” ao urinar, sem cateterismo vesical prévio. Qual o diagnóstico mais provável e o exame indicado?", "o": [["Fístula colovesical; TC com contraste oral e retal", "Pneumatúria é o achado mais frequente (90%) da fístula colovesical, a mais comum das fístulas diverticulares; a TC mostra ar na bexiga."], ["Cistite enfisematosa; urocultura e ATB oral prolongado", "Sem contexto de diabetes e com diverticulose, o diagnóstico mais provável é fístula."], ["Fístula colovaginal; exame especular", "Fístula colovaginal ocorre em mulheres histerectomizadas."], ["Fístula coloentérica; trânsito com bário", "Não explica pneumatúria e ITU de repetição."]], "pista": "Pneumatúria + diverticulose.", "pp": ["Sinal-chave: pneumatúria (90%).", "Também: fecalúria (70%), disúria, ITU de repetição.", "Mais comum: colovesical (65%).", "TC com contraste oral e retal: ar na bexiga sem cateterismo."], "ap": "<p>Fístulas ocorrem em ~2% da doença complicada; fatores: sexo masculino (2:1), cirurgia abdominal prévia, imunocomprometimento. Fístula é complicação crônica e indicação de cirurgia eletiva.<\/p>", "mud": [["Mulher histerectomizada com saída de fezes pela vagina", "Fístula colovaginal", "25%"], ["Ar na bexiga após sondagem", "Não é diagnóstico de fístula", "Ar iatrogênico"], ["Fístula confirmada", "Cirurgia eletiva", "Complicação crônica"]], "arm": "Interpretar ar na bexiga sem considerar cateterismo prévio.", "ouro": "Pneumatúria em quem tem divertículos = fístula colovesical.", "m2": ["Mulher de 70 anos, histerectomizada, com corrimento fecaloide vaginal e diverticulose. Diagnóstico?", "Fístula colovaginal."], "n": ["Fístulas: ~2% da doença complicada.", "Colovesical 65%; colovaginal 25%.", "Pneumatúria 90%; fecalúria 70%.", "TC com contraste oral e retal.", "Indicação de cirurgia eletiva."], "img": ["c-015-017"]}, {"id": "C05-Q01", "t": "C05", "sub": "Embriologia e anatomia", "comp": "Conceito", "rac": "Compreensão", "dif": "fácil", "p": [17], "q": "Sobre o divertículo de Meckel, assinale a alternativa correta.", "o": [["É divertículo verdadeiro, na borda antimesentérica do íleo, cerca de 60 cm da válvula ileocecal", "É a persistência do ducto onfalomesentérico; tem todas as camadas e fica na borda antimesentérica, ~60 cm da VIC."], ["É pseudodivertículo da borda mesentérica do jejuno proximal, formado por pulsão nos pontos de entrada dos vasos", "Essa descrição mistura conceitos dos divertículos colônicos; o Meckel é verdadeiro, ileal e antimesentérico."], ["Resulta da persistência do úraco e, por isso, comunica-se com a bexiga e causa infecção urinária", "Úraco é outra estrutura embrionária; o Meckel vem do ducto vitelino."], ["É revestido obrigatoriamente por mucosa gástrica, mais comum no sexo feminino e quase sempre sintomático", "O revestimento é ileal; ~20% têm tecido heterotópico; é mais comum em homens e a maioria é assintomática."]], "pista": "Ducto vitelino que não oblitera.", "pp": ["Origem: persistência do ducto onfalomesentérico (vitelino).", "Tipo: verdadeiro (todas as camadas).", "Local: borda antimesentérica do íleo, ~60 cm da VIC.", "Irrigação: ramo terminal da AMS (artéria vitelina)."], "ap": "<p>O ducto onfalomesentérico normalmente oblitera no 1º trimestre fetal. Quando persiste parcialmente, forma o divertículo; restos podem formar uma banda até o umbigo (ligamento vitelino), substrato de volvo e obstrução. A “regra dos 2” (complemento, Sabiston) ajuda a memorizar: 2% da população, 2 pés da VIC, 2 polegadas de comprimento, 2 mucosas ectópicas principais, complicações antes dos 2 anos, 2× mais em homens.<\/p>", "mud": [["A pergunta fosse sobre divertículo colônico", "Falso, no sigmoide", "Pulsão nos vasa recta"], ["Sobre a mucosa ectópica mais comum", "Gástrica, depois pancreática", "~20% têm heterotopia"], ["Sobre a irrigação", "Artéria vitelina (ramo terminal da AMS)", "Suprimento próprio"]], "arm": "Achar que todo Meckel tem mucosa gástrica: o revestimento é ileal; heterotopia em ~20%.", "ouro": "Meckel: verdadeiro, ileal, antimesentérico, 60 cm da VIC.", "m2": ["Na laparoscopia, encontra-se banda fibrosa do íleo ao umbigo com alça torcida ao redor. Qual a estrutura?", "Remanescente do ducto vitelino (ligamento vitelino) — causa de volvo/obstrução."], "n": ["Persistência do ducto onfalomesentérico.", "Verdadeiro (todas as camadas).", "Borda antimesentérica do íleo.", "~60 cm da válvula ileocecal.", "Mais comum em homens; maioria assintomática."], "img": ["c-017-018", "c-017-019"]}, {"id": "C05-Q02", "t": "C05", "sub": "Sangramento na criança: mecanismo", "comp": "Fisiopatologia", "rac": "Causa → efeito", "dif": "média", "p": [17], "q": "Menino de 2 anos e meio apresenta três evacuações com grande quantidade de sangue vermelho-escuro, sem dor. Endoscopia alta normal. Se a causa for divertículo de Meckel, qual é o mecanismo do sangramento?", "o": [["Mucosa gástrica ectópica secreta ácido e ulcera a mucosa ileal adjacente", "A úlcera péptica fica no íleo vizinho à mucosa gástrica heterotópica — por isso a hematoquezia é indolor e volumosa."], ["Ruptura de vasa recta no colo do divertículo", "Esse é o mecanismo do sangramento diverticular colônico."], ["Isquemia por intussuscepção, com fezes em “geleia de morango”", "Intussuscepção causa dor em cólica e fezes em geleia de morango, não sangramento indolor volumoso."], ["Carcinoide ulcerado invadindo vasos mesentéricos", "Malignização é rara e não é o mecanismo típico na criança."]], "pista": "Ácido produzido fora do estômago ulcera o íleo.", "pp": ["Criança + HDB volumosa e indolor = Meckel até prova em contrário.", "Heterotopia gástrica produz ácido.", "Úlcera na mucosa ileal adjacente.", "Implicação cirúrgica: ressecar o íleo adjacente."], "ap": "<p>O caso 5.1 do resumo usa exatamente esse raciocínio e lembra os diferenciais: intussuscepção (dor em cólica e “geleia de morango”) e pólipo juvenil (sangramento pequeno). O sangramento é a complicação mais comum em crianças; a obstrução, em adultos.<\/p>", "mud": [["Criança com cólica intermitente e fezes em geleia de morango", "Intussuscepção", "Isquemia da alça invaginada"], ["Sangramento pequeno e intermitente", "Pólipo juvenil", "Sangramento de baixo volume"], ["Adulto com obstrução", "Meckel como cabeça de intussuscepção ou banda", "Complicação típica do adulto"]], "arm": "Achar que a úlcera está dentro do divertículo, e por isso basta a diverticulectomia simples.", "ouro": "No Meckel que sangra, a úlcera está no íleo vizinho.", "m2": ["Por que a cintilografia com Tc-99m ajuda nesse caso?", "O pertecnetato é captado pela mucosa gástrica, inclusive a ectópica do divertículo."], "n": ["Sangramento: complicação mais comum na criança.", "Mucosa gástrica ectópica.", "Úlcera na mucosa ileal adjacente.", "HDB indolor e volumosa.", "Diferenciar de intussuscepção e pólipo juvenil."]}, {"id": "C05-Q03", "t": "C05", "sub": "Cintilografia com Tc-99m", "comp": "Escolha de exame", "rac": "Aplicação", "dif": "fácil", "p": [17, 18], "q": "Na criança com suspeita de divertículo de Meckel sangrante, qual é o exame mais utilizado e o que ele detecta?", "o": [["Cintilografia com Tc-99m (pertecnetato), que marca a mucosa gástrica ectópica", "É o método mais utilizado; S 85%, E 95–100%, acurácia ~90%, melhor em crianças."], ["Tomografia de abdome com contraste, que mostra o divertículo com alta sensibilidade em qualquer fase", "TC, US, RM e Rx têm baixa sensibilidade e especificidade para o divertículo em si."], ["Colonoscopia, que visualiza o óstio do divertículo no íleo terminal na maioria dos casos", "O divertículo está a ~60 cm da VIC, fora do alcance habitual da ileoscopia."], ["Angiografia mesentérica como primeiro exame, mesmo sem sangramento ativo no momento", "A angiografia exige sangramento ativo (≥ 0,5 mL/min); não é o primeiro exame."]], "pista": "Pertecnetato tem afinidade pela mucosa gástrica.", "pp": ["Suspeita: Meckel sangrante (criança).", "Exame: cintilografia com Tc-99m.", "Mecanismo: captação pela mucosa gástrica ectópica.", "Inconclusiva: angiografia, cápsula/enteroscopia ou laparoscopia diagnóstica."], "ap": "<p>A imagem do slide 15 mostra captação arredondada em mesogástrio que surge junto com o estômago e persiste: é a mucosa gástrica do divertículo. A sensibilidade é limitada (85%) porque só os divertículos com mucosa gástrica captam; especificidade é alta (95–100%).<\/p>", "mud": [["Cintilografia negativa com suspeita alta", "Angiografia, cápsula/enteroscopia ou laparoscopia", "Sensibilidade de 85%"], ["Adulto com obstrução", "US/TC", "Avaliar intussuscepção e obstrução"], ["Sangramento ativo intenso", "Angiografia (≥ 0,5 mL/min)", "Pode mostrar a artéria vitelina"]], "arm": "Achar que cintilografia negativa exclui Meckel.", "ouro": "Meckel que sangra: cintilografia com tecnécio (vê a mucosa gástrica).", "m2": ["Criança com cintilografia negativa e terceiro episódio de HDB volumosa. Próximo passo?", "Videolaparoscopia diagnóstica e terapêutica (ou angiografia/cápsula conforme estabilidade)."], "n": ["Cintilografia Tc-99m: método mais usado.", "Marca mucosa gástrica ectópica.", "S 85%, E 95–100%.", "Melhor em crianças.", "Negativa não exclui."], "img": ["c-017-020"]}, {"id": "C05-Q04", "t": "C05", "sub": "Escolha da técnica cirúrgica", "comp": "Conduta cirúrgica", "rac": "Decisão", "dif": "difícil", "p": [18], "q": "Criança com Meckel sangrante confirmado vai à videolaparoscopia. O divertículo tem base larga. Qual a cirurgia indicada e por quê?", "o": [["Ressecção ileal segmentar com anastomose, pois a úlcera está no íleo adjacente", "Base larga e sangramento indicam ressecção segmentar; a diverticulectomia simples pode deixar a úlcera."], ["Diverticulectomia simples, já que a fonte do sangramento está sempre dentro do divertículo", "A úlcera fica na mucosa ileal adjacente; ressecar só o divertículo pode manter a fonte."], ["Apenas ligadura da artéria vitelina, preservando o divertículo para evitar uma anastomose", "Não trata a mucosa ectópica nem a úlcera."], ["Hemicolectomia direita, para remover o íleo terminal, o ceco e eventuais divertículos colônicos", "Ressecção excessiva sem justificativa."]], "pista": "Sangramento ou base larga → ressecção segmentar.", "pp": ["Indicações de ressecção segmentar: base larga, sangramento, diverticulite, suspeita de neoplasia.", "Diverticulectomia simples: base estreita, sem alças acometidas.", "Aqui: sangramento + base larga → ressecção ileal segmentar + anastomose."], "ap": "<p>O fluxograma 7 encerra com essa bifurcação técnica. A lógica é anatômica: o tecido gástrico pode estar na base, e a úlcera está no íleo vizinho. Por isso, nas armadilhas clássicas: “Meckel que sangra → ressecção ileal”.<\/p>", "mud": [["Base estreita, sem sangramento nem alças acometidas", "Diverticulectomia simples", "Sem fonte no íleo adjacente"], ["Diverticulite com necrose da base", "Ressecção segmentar", "Inflamação da base"], ["Massa suspeita de neoplasia", "Ressecção segmentar", "Margem oncológica"]], "arm": "Fazer diverticulectomia simples no Meckel que sangra.", "ouro": "Sangrou? Tira o íleo junto.", "m2": ["Adulto operado por obstrução encontra Meckel de base estreita, sem sangramento e alças viáveis. Técnica?", "Diverticulectomia simples (e desfazer a causa da obstrução)."], "n": ["Base estreita, sem alças acometidas: diverticulectomia simples.", "Base larga: ressecção segmentar.", "Sangramento: ressecção segmentar.", "Diverticulite: ressecção segmentar.", "Suspeita de neoplasia: ressecção segmentar."]}, {"id": "C05-Q05", "t": "C05", "sub": "Obstrução no adulto", "comp": "Complicações por idade", "rac": "Associação", "dif": "média", "p": [17], "q": "Homem de 32 anos, sem cirurgias prévias, apresenta obstrução intestinal. A US sugere intussuscepção ileoileal com cabeça de invaginação. Considerando o divertículo de Meckel, qual afirmação é correta?", "o": [["Obstrução é a complicação mais comum do Meckel no adulto, e o divertículo pode ser a cabeça da intussuscepção", "Mecanismos de obstrução: intussuscepção, torção do pedículo, hérnia interna, enterólito, volvo em torno da banda, bridas."], ["No adulto a complicação mais comum é o sangramento volumoso e indolor, e a obstrução praticamente não ocorre", "Sangramento predomina em crianças; obstrução, em adultos."], ["A obstrução no Meckel decorre sempre de câncer do divertículo, que deve ser presumido em adultos", "Malignização é rara (carcinoide/TNE, GIST, adenocarcinoma)."], ["Intussuscepção no adulto é sempre idiopática e tratada com redução hidrostática por enema", "No adulto costuma haver uma cabeça patológica; o tratamento é cirúrgico."]], "pista": "Criança sangra; adulto obstrui.", "pp": ["Adulto + obstrução sem cirurgia prévia: pensar em causas como Meckel e hérnias.", "Intussuscepção com cabeça = lesão estrutural.", "Meckel é causa clássica.", "Tratamento: cirurgia (laparoscopia diagnóstica e terapêutica)."], "ap": "<p>Sem cirurgia prévia, a brida (causa mais comum de obstrução de delgado) fica menos provável e outras causas ganham peso — hérnias, neoplasias, Crohn, íleo biliar e, no jovem, Meckel. A banda vitelina pode servir de eixo para volvo.<\/p>", "mud": [["Criança com HDB volumosa indolor", "Sangramento por mucosa gástrica", "Complicação típica da criança"], ["Dor em FID simulando apendicite", "Diverticulite de Meckel", "Simula apendicite"], ["Meckel dentro de hérnia inguinal", "Hérnia de Littré", "Definição"]], "arm": "Inverter as complicações por idade.", "ouro": "Meckel: sangra na criança, obstrui no adulto.", "m2": ["Na apendicectomia por suspeita de apendicite, o apêndice está normal. O que examinar?", "O íleo, à procura de diverticulite de Meckel (diferencial de dor em FID)."], "n": ["Obstrução: mais comum no adulto.", "Intussuscepção com Meckel como cabeça.", "Torção, hérnia interna, volvo na banda.", "Diverticulite simula apendicite.", "Malignização rara."], "img": ["c-024-031"]}, {"id": "C05-Q06", "t": "C05", "sub": "Hérnia de Littré", "comp": "Conceito", "rac": "Memória com compreensão", "dif": "fácil", "p": [17], "q": "Durante herniorrafia inguinal de urgência, o cirurgião encontra no saco herniário um divertículo de Meckel encarcerado. Esse achado define:", "o": [["Hérnia de Littré", "Hérnia de Littré é o divertículo de Meckel dentro de um saco herniário (inguinal, femoral ou umbilical)."], ["Hérnia de Richter", "Richter é o pinçamento parcial da parede de uma alça, sem relação obrigatória com Meckel."], ["Hérnia de Spiegel", "Spiegel define o local anatômico da hérnia, não o conteúdo."], ["Hérnia de Amyand", "Amyand é o apêndice dentro de hérnia inguinal."]], "pista": "Conteúdo = Meckel.", "pp": ["Identificar o conteúdo do saco: Meckel.", "Nome: hérnia de Littré.", "Locais: inguinal, femoral, umbilical."], "ap": "<p>A hérnia de Littré entra na lista de complicações do Meckel da Aula 7, ao lado de sangramento, obstrução, diverticulite e malignização. As demais eponímias (Richter, Spiegel, Amyand) não constam do resumo e foram usadas apenas como distratores conceituais — confira no seu material de hérnias.<\/p>", "mud": [["Conteúdo fosse o apêndice", "Hérnia de Amyand", "Epônimo pelo conteúdo"], ["Apenas parte da parede da alça pinçada", "Hérnia de Richter", "Pinçamento parcial"], ["Meckel com sangramento", "Ressecção ileal segmentar", "Úlcera no íleo adjacente"]], "arm": "Confundir Littré (Meckel) com Amyand (apêndice).", "ouro": "Littré = Meckel no saco herniário.", "m2": ["Meckel encarcerado e necrótico em hérnia femoral. Conduta?", "Ressecção (segmentar se a base/alça estiver comprometida) e correção da hérnia."], "n": ["Littré: Meckel em saco herniário.", "Locais: inguinal, femoral, umbilical.", "Uma das complicações do Meckel.", "Amyand: apêndice na hérnia inguinal (distrator).", "Richter: pinçamento parcial (distrator)."]}, {"id": "C05-Q07", "t": "C05", "sub": "Achado incidental", "comp": "Decisão terapêutica", "rac": "Ponderação risco-benefício", "dif": "difícil", "p": [18], "q": "Mulher de 72 anos submetida a colecistectomia laparoscópica tem achado incidental de divertículo de Meckel de 1,5 cm, base estreita, sem alterações macroscópicas. Qual a conduta mais coerente com a aula?", "o": [["Acompanhar, sem ressecção: o risco de complicar cai com a idade e seriam necessárias muitas cirurgias para evitar uma complicação", "Soltero & Bill: ~800 diverticulectomias para evitar uma complicação; risco ~0 no
