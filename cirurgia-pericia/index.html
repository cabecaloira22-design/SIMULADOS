<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado — Clínica Cirúrgica e Perícia Médica (8º período FCMMG)</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#1d1f23;--mut:#5c6370;--line:#dedad3;--acc:#1f5f8b;--acc2:#e8f0f6;--ok:#1d6b3a;--okbg:#e6f3ea;--bad:#a12a2a;--badbg:#f8e7e7;--warn:#8a5a00;--warnbg:#fbf1dc;--cir:#1f5f8b;--per:#6a3d8f;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#e8e6e1;--mut:#a3a9b3;--line:#333842;--acc:#7db4dc;--acc2:#1f2b36;--ok:#7fd19b;--okbg:#17291e;--bad:#f19a9a;--badbg:#341c1c;--warn:#f0c46e;--warnbg:#33290f;--cir:#7db4dc;--per:#c7a1e6;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap,.modal .box,.navbar{overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 80px max(14px,env(safe-area-inset-right))}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:max(8px,env(safe-area-inset-top)) 14px 8px}
.toprow{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme=dark] .btn.pri{color:#0f1419}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
h1{font-size:22px;line-height:1.25;margin:8px 0 4px}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:16px;margin:16px 0 6px}
.mut{color:var(--mut)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
.tag.cir{color:var(--cir);border-color:var(--cir)}
.tag.per{color:var(--per);border-color:var(--per)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{position:sticky;top:var(--hh,57px);z-index:20;background:var(--acc2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:4px 16px;font-weight:600;font-size:15px}
.stem{font-size:17px;margin:6px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;min-height:48px;padding:12px;margin:8px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.sel{border-color:var(--acc)}
.opt.sel .L{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt .st{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.lesson{border-top:2px solid var(--line);margin-top:16px;padding-top:8px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.toc button{font-size:13px;min-height:34px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.blk{margin:14px 0;padding-top:4px;scroll-margin-top:120px}
.blk>h3{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px}
.blk>h3 .bl{font-size:12px;color:var(--mut);font-weight:700}
.note{border-left:4px solid var(--acc);background:var(--acc2);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.note.warn{border-color:var(--warn);background:var(--warnbg)}
.note.ok{border-color:var(--ok);background:var(--okbg)}
.tw{margin:10px 0}
.tw .cap{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:4px}
table.t{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.t th{background:var(--acc2)}
@media(max-width:640px){table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}table.t thead{display:none}table.t tr{border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:4px 0;background:var(--card)}table.t td{border:none;border-bottom:1px dashed var(--line);padding:6px 10px}table.t td:last-child{border-bottom:none}table.t td::before{content:attr(data-label);display:block;font-size:12px;font-weight:700;color:var(--mut)}}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:8px 0}
.flow .st{border:1.5px solid var(--acc);border-radius:10px;padding:8px 12px;background:var(--card);font-size:14px}
.flow .ar{text-align:center;color:var(--acc);font-weight:700;line-height:1.2}
figure{margin:10px 0}
figure img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
figcaption{font-size:13px;color:var(--mut);margin-top:4px}
ol.pp{padding-left:22px}ol.pp li{margin:4px 0}
.altan{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
.altan.c{border-color:var(--ok)}
.altan b.h{display:block}
details.m2{border:1px dashed var(--acc);border-radius:10px;padding:8px 12px}
details.m2 summary{cursor:pointer;font-weight:600;min-height:32px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.palette button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.palette .cur{outline:2px solid var(--acc)}
.palette .a{background:var(--acc2)}
.palette .ok{background:var(--okbg);border-color:var(--ok)}
.palette .bad{background:var(--badbg);border-color:var(--bad)}
.palette .mk{text-decoration:underline;font-weight:700}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.navbar .in{max-width:860px;margin:0 auto;display:flex;gap:8px}
.navbar .in .btn{flex:1}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:stretch;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:900px;margin:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 14px 24px}
.modal .bar{position:sticky;top:0;background:var(--card);display:flex;gap:8px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line);z-index:2}
.modal img.pg{width:100%;height:auto;border:1px solid var(--line);margin:8px 0;background:#fff}
.topics{display:grid;grid-template-columns:1fr;gap:8px}
.tp{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.tp .nm{flex:1;min-width:0}
.tp .ct{font-size:13px;color:var(--mut)}
label.ck{display:flex;gap:10px;align-items:center;min-height:44px;padding:4px 6px;border-radius:8px;cursor:pointer}
label.ck input{width:22px;height:22px;flex:0 0 22px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.conf{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.conf button{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:2px 12px;font-size:14px;cursor:pointer}
.conf button.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
</style>
</head>

<script id="DATA" type="application/json">{"topics": [{"id": "C01", "d": "cir", "n": "Abdome agudo: visão geral e as cinco síndromes", "short": "Abdome agudo — síndromes", "pages": [3, 43, 44], "aula": "Aulas 9 e 10", "rev": "<p><b>Abdome agudo<\/b> é a dor abdominal de instalação recente que exige decisão rápida, muitas vezes cirúrgica. O raciocínio cobrado em prova é <b>sindrômico e hierarquizado<\/b>: (1) o paciente está estável? Se não, o abdome é <b>hemorrágico até prova em contrário<\/b> — ABC, dois acessos calibrosos, cristaloide, tipagem e hemoderivados, FAST à beira-leito e β-hCG na mulher fértil; (2) se estável, o padrão da dor e do exame físico encaixa o caso em uma das cinco síndromes (inflamatória, perfurativa, obstrutiva, hemorrágica, vascular); (3) só então se pede o exame que confirma a causa.<\/p><p><b>Dor visceral × somática.<\/b> A dor visceral é conduzida por fibras autonômicas, mal localizada na linha média (epigástrio = intestino anterior; periumbilical = intestino médio; hipogástrio = intestino posterior) e acompanhada de náuseas. A dor somática (parietal) nasce do peritônio parietal inflamado: bem localizada, piora com movimento e tosse. Essa transição explica a migração da dor na apendicite e o sinal de Dunphy (complemento do resumo — Sabiston, 18ª ed.).<\/p><p><b>Frequência e gravidade.<\/b> O inflamatório é a causa mais frequente de abdome agudo não traumático; a apendicite é a principal causa de abdome agudo <i>cirúrgico<\/i> não traumático; o perfurativo é a 3ª causa, com mortalidade de cerca de 10%. Paciente instável não vai para a TC.<\/p>", "tab": [{"cap": "As cinco síndromes de abdome agudo (Aulas 9 e 10)", "h": ["Síndrome", "Dor", "Exame físico típico", "Exame-chave", "Causas que mais caem"], "r": [["Inflamatório", "Progressiva, contínua, crescente; visceral → somática", "Febre, dor localizada, descompressão dolorosa; paciente imóvel; RHA diminuídos", "US / TC; leucocitose, PCR", "Apendicite, colecistite, pancreatite, diverticulite, colangite, abscessos, DIP"], ["Perfurativo", "Súbita, intensa, “em punhalada”; localizada → difusa", "Abdome em tábua, sinal de Jobert, choque/sepse; RHA abolidos", "Rx de tórax PA ortostático; TC", "Úlcera péptica perfurada, diverticulite, corpo estranho, iatrogenia, Boerhaave"], ["Obstrutivo", "Cólica, intermitente", "Distensão, hipertimpanismo, RHA aumentados metálicos → silêncio; ampola vazia", "Rx de abdome; TC = padrão-ouro", "Delgado: bridas > hérnias. Cólon: câncer colorretal > volvo > diverticulite"], ["Hemorrágico", "Súbita, difusa", "Hipotensão, taquicardia, palidez, lipotimia; Kehr/Laffont; massa pulsátil", "FAST (instável); β-hCG; TC (estável)", "Gravidez ectópica rota, AAA roto, cisto ovariano roto, rotura hepática/esplênica"], ["Vascular", "Súbita, intensa, desproporcional ao exame", "Abdome inicialmente flácido; tardiamente peritonite e choque", "AngioTC; lactato, acidose", "Embolia (FA), trombose arterial, trombose venosa, isquemia não oclusiva"]]}], "cmp": {"cap": "Dor visceral × dor somática", "h": ["Aspecto", "Visceral", "Somática (parietal)"], "r": [["Via", "Fibras autonômicas", "Peritônio parietal (nervos somáticos)"], ["Localização", "Mal localizada, linha média", "Bem localizada sobre o órgão"], ["Associação", "Náuseas, sudorese", "Piora com movimento e tosse"], ["Exemplo", "Dor periumbilical inicial da apendicite", "Dor em FID com Blumberg/Dunphy"]]}, "flow": {"cap": "Fluxograma 1 — abordagem inicial do abdome agudo não traumático (síntese das Aulas 9 e 10)", "s": ["Dor abdominal aguda não traumática", "Instabilidade hemodinâmica? SIM → ABC, 2 acessos calibrosos, cristaloide, tipagem/hemoderivados, FAST + β-hCG → hemoperitônio = hemorrágico → cirurgia/hemostasia", "NÃO → caracterizar a dor e o exame físico", "Inflamatório (progressiva, febre, localizada) → US/TC · Perfurativo (súbita, tábua, Jobert) → Rx tórax PA ortostático/TC · Obstrutivo (cólica, vômitos, distensão, parada de eliminação) → Rx/TC · Vascular (dor desproporcional, FA, lactato) → angioTC"]}, "imgs": [], "refs": ["Portes M. Aulas 9 e 10 — Abdome agudo. FCMMG; 2026.", "Townsend CM et al. Sabiston — Tratado de Cirurgia. 18ª ed. Elsevier; 2010 (cap. Abdome agudo) — complemento citado no resumo."]}, {"id": "C02", "d": "cir", "n": "Abdome agudo inflamatório: semiologia, alça sentinela, abscessos e diferenciais", "short": "Abdome inflamatório e abscessos", "pages": [4, 5, 6], "aula": "Aula 9 (slides 1–27)", "rev": "<p><b>Definição:<\/b> inflamação aguda ou crônica do peritônio por agentes diversos, localizada ou generalizada; é a causa mais frequente de abdome agudo não traumático. A dor começa progressiva e contínua, de intensidade crescente; é inicialmente visceral e torna-se somática quando o peritônio parietal se inflama. O paciente fica <b>imóvel<\/b> no leito, com respiração superficial; os ruídos hidroaéreos ficam diminuídos e pode haver íleo paralítico reflexo. A palpação com dor localizada, defesa e descompressão dolorosa é o achado principal.<\/p><p><b>Alça sentinela<\/b>: segmento de alça fixa, edemaciada e distendida, <i>sem obstrução<\/i>, adjacente ao órgão inflamado (íleo reflexo localizado). A localização aponta o foco: hipocôndrio direito (colecistite), epigástrio/hipocôndrio esquerdo (pancreatite, úlcera), FID (apendicite), FIE (diverticulite), flancos (ureterolitíase).<\/p><p><b>Abscesso hepático<\/b>: o piogênico (mais comum) vem da via biliar, da circulação portal (diverticulite, apendicite), da via hematogênica ou de contaminação direta; cursa com febre prolongada, calafrios, dor em HD, leucocitose, PCR e fosfatase alcalina elevadas; o padrão de tratamento é antibiótico (Gram-negativos, anaeróbios e enterococos) + drenagem percutânea guiada quando > 3–5 cm, sepse ou falha clínica. O amebiano (<i>Entamoeba histolytica<\/i>, cólon → porta → fígado) é geralmente único, no lobo direito, com pus em “pasta de anchova”, sorologia sensível e cultura bacteriana negativa; trata-se com <b>metronidazol<\/b> e drena-se apenas em situações especiais (risco de ruptura, volumoso, lobo esquerdo, falha, dúvida diagnóstica).<\/p><p><b>Abscesso esplênico<\/b>: raro, principalmente hematogênico (endocardite, sepse); febre + dor em hipocôndrio esquerdo + esplenomegalia, dor pleurítica e sinal de Kehr. O tratamento definitivo clássico é a <b>esplenectomia<\/b> (a drenagem percutânea sangra mais que no fígado), seguida de vacinação contra pneumococo, meningococo e <i>H. influenzae<\/i>.<\/p><p><b>Diferenciais<\/b>: na ureterolitíase o paciente fica <i>inquieto<\/i> (no inflamatório, imóvel), com Giordano positivo, hematúria e cálculo na TC sem contraste; trata-se com analgesia, hidratação e alfa-bloqueador (tansulosina). Na DIP: mulher fértil, dor hipogástrica, corrimento, dor à mobilização do colo e anexial bilateral; β-hCG obrigatório.<\/p>", "tab": [{"cap": "Abscesso hepático: piogênico × amebiano (Aula 9)", "h": ["Aspecto", "Piogênico (bacteriano)", "Amebiano"], "r": [["Origem", "Via biliar; portal (diverticulite, apendicite); hematogênica; direta", "Entamoeba histolytica: cólon → porta → fígado"], ["Clínica", "Febre prolongada, calafrios, dor em HD, hepatomegalia dolorosa", "Febre + dor em HD; pode ocorrer sem diarreia"], ["Laboratório", "Leucocitose, PCR e FA elevadas", "Sorologia (alta sensibilidade); cultura bacteriana frequentemente negativa"], ["Imagem/aspecto", "Coleção hipoatenuante, pode conter gás", "Geralmente única, lobo direito; “pasta de anchova”"], ["Tratamento", "ATB (ceftriaxona + metronidazol ou piperacilina-tazobactam) + drenagem percutânea se > 3–5 cm, sepse, falha", "Metronidazol; drenar só se risco de ruptura, volumoso, lobo esquerdo, falha ou dúvida"]]}, {"cap": "Alça sentinela — onde aparece e o que sugere", "h": ["Localização", "Pensar em"], "r": [["Hipocôndrio direito", "Colecistite"], ["Epigástrio / hipocôndrio esquerdo", "Pancreatite, úlcera"], ["FID", "Apendicite"], ["FIE", "Diverticulite"], ["Flancos", "Ureterolitíase"]]}, {"cap": "Dor irradiada — padrões clássicos", "h": ["Doença", "Irradiação"], "r": [["Colecistite aguda", "Dorso / escápula direita"], ["Cólica nefrética", "Região escrotal e grandes lábios"], ["Pancreatite aguda", "Região lombar (“em faixa”)"], ["Aneurisma de aorta roto", "Região lombar"], ["Úlcera perfurada", "Flanco, FID (goteira parietocólica) e mesogástrio"], ["Apendicite", "Região umbilical; dorso/pelve nas posições atípicas"]]}], "cmp": {"cap": "Ureterolitíase × DIP × abdome inflamatório", "h": ["Aspecto", "Ureterolitíase", "DIP", "Inflamatório clássico"], "r": [["Comportamento", "Inquieto, agitado", "Variável", "Imóvel no leito"], ["Exame", "Giordano positivo", "Dor à mobilização do colo, anexial bilateral", "Dor localizada, defesa, descompressão"], ["Exame-chave", "EAS (hematúria), TC sem contraste", "β-hCG, US transvaginal", "US/TC conforme órgão"], ["Tratamento", "Analgesia, hidratação, tansulosina", "Antibioticoterapia; abordar abscesso tubo-ovariano", "Suporte + ATB + cirurgia conforme causa"]]}, "flow": {"cap": "Tratamento geral do abdome inflamatório (Aula 9)", "s": ["Corrigir distúrbios sistêmicos (volume, eletrólitos)", "Antibioticoterapia", "Intervenção (cirúrgica ou percutânea) conforme a causa determinante"]}, "imgs": ["c-004-000", "c-005-001", "c-005-002", "c-006-003"], "refs": ["Portes M. Aula 9 — Abdome agudo inflamatório. FCMMG; 2026.", "Pausch C et al. Int J Surg Case Rep 2017;41:180–183 (imagens do abscesso hepático citadas no slide 17).", "Abbasi S et al. J Curr Surg 2016;6 (abscesso esplênico, slide 23)."]}, {"id": "C03", "d": "cir", "n": "Apendicite aguda", "short": "Apendicite aguda", "pages": [7, 8, 9, 10, 11], "aula": "Aula 8 (slides 1–31)", "rev": "<p><b>Epidemiologia:<\/b> principal causa de abdome agudo cirúrgico não traumático; pico entre 10 e 30 anos; mais comum em homens.<\/p><p><b>Fisiopatologia (Aula 8, slide 3):<\/b> obstrução da luz (hiperplasia linfoide, apendicolito) → supercrescimento bacteriano + secreção contínua de muco → distensão e aumento da pressão na parede → isquemia da mucosa → inflamação → gangrena → perfuração. As fases anatomopatológicas são I catarral e II fibrinosa (não complicadas) e III gangrenosa e IV perfurada (complicadas).<\/p><p><b>Clínica (sequência de Murphy):<\/b> dor epigástrica/periumbilical (visceral) que migra para a FID (somática) em cerca de 24 h; anorexia, náuseas e vômitos <i>depois<\/i> da dor; febre baixa. Laboratório: leucocitose com desvio e PCR elevada; o EAS pode ter piócitos (apêndice encostado no ureter/bexiga) e isso <b>não exclui<\/b> apendicite.<\/p><p><b>Sinais:<\/b> Blumberg (descompressão em McBurney), Rovsing (palpar FIE → dor na FID), Psoas (hiperextensão da coxa direita em decúbito lateral esquerdo → apêndice retrocecal), Obturador (rotação interna da coxa direita fletida → apêndice pélvico), Dunphy (dor na FID ao tossir).<\/p><p><b>Escore de Alvarado (MANTRELS)<\/b>: teste de triagem que estratifica quem precisa de imagem. Valem 2 pontos a defesa na FID e a leucocitose; os demais, 1 ponto. 0–4 baixa; 5–6 intermediária (imagem + reexame); ≥7 alta.<\/p><p><b>Imagem:<\/b> US em IMC < 25 sem preditores de complicação, gestantes e crianças (S 75–90% — US negativo não descarta); TC em IMC > 25, preditores de complicação, diagnóstico diferencial, sintomas atípicos (idosos) e alto risco cirúrgico (S 96%). Achados: apêndice > 6 mm não compressível, imagem em alvo, borramento da gordura, apendicolito, abscesso. Na gestante: US primeiro e RM se inconclusivo; o útero desloca o apêndice cranialmente.<\/p><p><b>Tratamento (WSES Jerusalem 2025, Aula 8):<\/b> não complicada → apendicectomia laparoscópica (definitiva); antibioticoterapia isolada em paciente selecionado (estável, imagem confirmatória, seguimento possível); apendicolito → preferir cirurgia; peritonite generalizada → cirurgia de urgência; abscesso/plastrão localizado → ATB ± drenagem percutânea, apendicectomia de intervalo só em casos selecionados. ATB: dose única pré-operatória na não complicada operada, sem manter no pós; na complicada, ATB terapêutico e, após controle do foco, curso curto de 2–3 dias.<\/p><p><b>Plastrão<\/b>: evolução > 1 semana, bloqueio por omento/ceco/íleo, massa em FID com sintomas atenuados; TC confirma. Conservador (ATB, drenagem de abscesso volumoso), colonoscopia (excluir neoplasia, sobretudo em > 40 anos) e apendicectomia de intervalo (6–10 semanas) em casos selecionados; falha → cirurgia.<\/p>", "tab": [{"cap": "Escore de Alvarado (MANTRELS)", "h": ["Critério", "Pontos"], "r": [["Migração da dor para FID", "1"], ["Anorexia", "1"], ["Náuseas e/ou vômitos", "1"], ["Defesa de parede na FID (Tenderness)", "2"], ["Dor à descompressão (Rebound)", "1"], ["Elevação da temperatura (> 37,3 °C)", "1"], ["Leucocitose (> 10.000)", "2"], ["Desvio à esquerda (Shift)", "1"], ["Total", "10 — 0–4 baixa · 5–6 intermediária · ≥7 alta"]]}, {"cap": "US × TC na apendicite (Aula 8)", "h": ["Aspecto", "Ultrassonografia", "Tomografia"], "r": [["Escolha em", "IMC < 25 sem preditores de complicação; gestantes; crianças", "IMC > 25; preditores de complicação; diferencial; sintomas atípicos (idosos); alto risco cirúrgico"], ["Acurácia", "S 75–90% · E 86–95%", "S 96% · E 91–98%"], ["Achados", "Apêndice não compressível > 6 mm, imagem em alvo", "Apêndice > 6 mm, alvo, borramento da gordura, apendicolito, abscesso"]]}, {"cap": "Tratamento — WSES Jerusalem 2025 (Aula 8, slides 23–24)", "h": ["Apresentação", "Conduta", "ATB"], "r": [["Não complicada", "Apendicectomia laparoscópica", "Dose única pré-operatória; não manter no pós"], ["Não complicada, paciente selecionado", "Antibioticoterapia (não operatório)", "Gram-negativos + anaeróbios, IV → VO"], ["Apendicolito", "Preferir cirurgia", "—"], ["Peritonite generalizada", "Cirurgia de urgência", "Terapêutico; 2–3 dias após controle do foco"], ["Abscesso / plastrão", "ATB ± drenagem percutânea", "Amplo espectro"], ["Falha do não operatório", "Apendicectomia", "Individualizar"]]}], "cmp": {"cap": "Sinais semiológicos da apendicite", "h": ["Sinal", "Como pesquisar", "Significado"], "r": [["Blumberg", "Descompressão brusca em McBurney", "Irritação peritoneal localizada"], ["Rovsing", "Palpar FIE → dor na FID", "Apendicite (sensível, pouco específico)"], ["Psoas", "Hiperextensão da coxa D em decúbito lateral E", "Apêndice retrocecal"], ["Obturador", "Rotação interna da coxa D fletida", "Apêndice pélvico"], ["Dunphy", "Dor na FID ao tossir", "Irritação peritoneal"]]}, "flow": {"cap": "Fluxogramas 3 e 4 — avaliação por probabilidade e plastrão (Aula 8)", "s": ["Probabilidade clínica (Alvarado + exame)", "ALTA → operar (apendicectomia)", "INTERMEDIÁRIA → TC ou US + reexame seriado: positivo → operar; negativo → alta/diagnóstico alternativo; incerto → laparoscopia diagnóstica ou internar", "BAIXA → seguro e perto: alta com reavaliação em até 24 h; idoso, duvidoso ou mora longe: TC ou internar", "Massa em FID > 5–7 dias → TC → peritonite generalizada? sim: cirurgia · não: ATB IV ± drenagem → boa resposta: seguimento (colonoscopia, intervalo em casos selecionados); falha: cirurgia"]}, "imgs": ["c-007-004", "c-008-005", "c-008-006", "c-008-007", "c-008-008", "c-008-009", "c-010-010"], "refs": ["Portes M. Aula 8 — Apendicite aguda. FCMMG; 2026.", "Podda M et al. Diagnosis and treatment of acute appendicitis: 2025 edition of the WSES Jerusalem guidelines. JAMA Surg. 2026;161(3):283–295 (citado na aula).", "Sabiston, 18ª ed. (citado na aula)."]}, {"id": "C04", "d": "cir", "n": "Doença diverticular do cólon", "short": "Doença diverticular", "pages": [12, 13, 14, 15, 16], "aula": "Aula 7 (slides 21–52)", "rev": "<p><b>Diverticulose<\/b> é a presença de divertículos no cólon; aumenta com a idade (≈ 5% aos 40, 30% aos 60, 65% aos 80 anos), é mais comum em regiões industrializadas (dieta pobre em fibras) e 95% localizam-se no sigmoide e descendente. São <b>pseudodivertículos<\/b>: herniação de mucosa e submucosa pelos pontos onde os vasa recta penetram a muscular. Pela lei de Laplace (P = T/R), o sigmoide, de menor raio, tem maior pressão intraluminal.<\/p><p><b>Espectro:<\/b> assintomática (maioria); doença sintomática sem inflamação; complicada — diverticulite (10–25%), hemorragia digestiva baixa, fístulas, obstrução crônica.<\/p><p><b>Diverticulite aguda<\/b> = micro ou macroperfuração com inflamação pericólica, a “apendicite do lado esquerdo”: dor em FIE, febre, leucocitose. Diagnóstico por <b>TC com contraste<\/b> (S 93–97%, E ~100%), que também mostra complicações e permite drenagem guiada. Achado mais frequente: densificação da gordura pericólica (98%). <b>Colonoscopia é contraindicada na fase aguda<\/b> (risco de perfuração) e indicada 6–8 semanas depois para excluir neoplasia e DII.<\/p><p><b>Hinchey<\/b>: I abscesso pericólico confinado; II abscesso grande pélvico/distante; III peritonite purulenta (mortalidade 13%); IV peritonite fecal (43%). A versão modificada de Wasvary (complemento) acrescenta o grau 0 e subdivide Ia/Ib.<\/p><p><b>Tratamento (AGA 2021 × WSES 2020)<\/b>: não complicada em imunocompetente → conservador, ATB seletivo/não rotineiro; imunossuprimido ou alto risco → ATB (Gram-negativos + anaeróbios); abscesso < 4–5 cm → ATB isolado; > 4–5 cm → drenagem percutânea + ATB; peritonite difusa → cirurgia — ressecção com anastomose primária ± ileostomia no estável, <b>Hartmann<\/b> no instável/com comorbidades. Cirurgia eletiva é individualizada, <i>não<\/i> pelo número de episódios: recorrência com impacto, imunodeprimidos, impossibilidade de excluir câncer, fístula, estenose.<\/p><p><b>Sangramento diverticular<\/b>: vasa recta coberto por mucosa fina; principal causa de HDB no idoso; indolor, volumoso, vermelho-vivo; mais comum no <b>cólon direito<\/b>; cessa espontaneamente em 70–80%; ressangramento 25% após o 1º e 50% após o 2º episódio. Aqui a colonoscopia é permitida e terapêutica. Cintilografia detecta ≥ 0,1 mL/min (só localiza); angiografia precisa de ≥ 1–1,3 mL/min (trata: embolização). Cirurgia se persistência, instabilidade ou impossibilidade dos outros métodos.<\/p><p><b>Fístulas<\/b> (~2%): colovesical é a mais comum (65%) — pneumatúria (90%), fecalúria, ITU de repetição; colovaginal (25%) em histerectomizadas. Diagnóstico por TC com contraste oral e retal (ar na bexiga sem cateterismo prévio).<\/p>", "tab": [{"cap": "Classificação de Hinchey (Aula 7, slide 30)", "h": ["Estágio", "Achado", "Mortalidade"], "r": [["I", "Abscesso pericólico confinado", "< 5%"], ["II", "Grande abscesso que se estende para a pelve (ou distante)", "< 5%"], ["III", "Ruptura de abscesso → peritonite purulenta generalizada", "13%"], ["IV", "Peritonite fecal por perfuração livre", "43%"]]}, {"cap": "Conduta na diverticulite — AGA 2021 × WSES 2020 (Aula 7, slide 36)", "h": ["Situação", "AGA 2021", "WSES 2020"], "r": [["Não complicada, imunocompetente", "Conservador; ATB seletivo", "Conservador; ATB não rotineiro"], ["Alto risco / imunossuprimido", "ATB indicado", "ATB indicado"], ["Abscesso < 4–5 cm", "ATB", "ATB isolado"], ["Abscesso > 4–5 cm", "ATB ± drenagem", "Drenagem percutânea + ATB"], ["Peritonite, estável", "Avaliação cirúrgica", "Ressecção + anastomose primária ± ileostomia"], ["Peritonite, instável/comorbidades", "—", "Hartmann"], ["Cirurgia eletiva", "Individualizada, não pelo número de episódios", "Individualizada"]]}, {"cap": "Fístulas diverticulares", "h": ["Tipo", "Frequência / pistas"], "r": [["Colovesical", "65% — pneumatúria 90%, fecalúria 70%, disúria 50%, ITU de repetição 50%"], ["Colovaginal", "25% — mulheres histerectomizadas"], ["Colocutânea, coloentérica", "Menos comuns"]]}], "cmp": {"cap": "Diverticulite × sangramento diverticular", "h": ["Aspecto", "Diverticulite", "Sangramento diverticular"], "r": [["Lado mais comum", "Esquerdo (sigmoide)", "Direito"], ["Dor", "Presente (FIE)", "Ausente (indolor)"], ["Mecanismo", "Micro/macroperfuração com inflamação", "Ruptura do vasa recta no colo do divertículo"], ["Colonoscopia", "Contraindicada na fase aguda; 6–8 semanas depois", "Indicada e terapêutica"], ["Exame inicial", "TC com contraste", "Colonoscopia após preparo; angioTC se sangramento ativo intenso"]]}, "flow": {"cap": "Fluxogramas 5 e 6 — diverticulite e sangramento (Aula 7)", "s": ["Dor em FIE + febre + leucocitose → TC com contraste", "Não complicada: imunocompetente → conservador, ATB seletivo; imunossuprimido/alto risco/gás pericólico → ATB", "Abscesso < 4–5 cm → ATB isolado · > 4–5 cm → drenagem percutânea + ATB", "Peritonite difusa: estável → ressecção + anastomose primária ± ileostomia; instável → Hartmann", "Colonoscopia 6–8 semanas após (nunca na fase aguda)", "Sangramento: colonoscopia (adrenalina, cautério, clipe) → falha: angiografia (≥ 1–1,3 mL/min, embolização) → falha/instabilidade: cirurgia; cintilografia (≥ 0,1 mL/min) só localiza"]}, "imgs": ["c-012-011", "c-013-012", "c-013-013", "c-013-014", "c-014-015", "c-014-016", "c-015-017"], "refs": ["Portes M. Aula 7 — Divertículo de Meckel e doença diverticular. FCMMG; 2026.", "Peery AF, Shaukat A, Strate LL. AGA Clinical Practice Update. Gastroenterology. 2021;160(3):906–911.", "Sartelli M et al. 2020 update of the WSES guidelines for acute colonic diverticulitis. World J Emerg Surg. 2020;15:32.", "Wasvary H et al. Am Surg. 1999;65(7):632–635 (Hinchey modificado — complemento)."]}, {"id": "C05", "d": "cir", "n": "Divertículo de Meckel", "short": "Divertículo de Meckel", "pages": [17, 18], "aula": "Aula 7 (slides 2–20)", "rev": "<p><b>Embriologia:<\/b> o divertículo de Meckel é a persistência do <b>ducto onfalomesentérico (vitelino)<\/b>, que normalmente oblitera no 1º trimestre fetal. É um <b>divertículo verdadeiro<\/b> (contém todas as camadas da parede), curto, de base larga, na <b>borda antimesentérica do íleo<\/b>, a cerca de 60 cm da válvula ileocecal, com suprimento próprio por ramo terminal da AMS (artéria vitelina). É mais comum no sexo masculino e a maioria é assintomática.<\/p><p><b>Mucosa:<\/b> revestido por mucosa ileal; cerca de 20% têm tecido heterotópico — gástrico mais que pancreático (também duodenal e colônico) — e esses têm maior risco de complicação. “Regra dos 2” (complemento, Sabiston): ~2% da população, ~2 pés (60 cm) da VIC, ~2 polegadas (5 cm), 2 tipos de mucosa ectópica mais comuns, complicações mais frequentes antes dos 2 anos, 2× mais em homens.<\/p><p><b>Complicações:<\/b> o <b>sangramento<\/b> é a mais comum em <b>crianças<\/b> — a mucosa gástrica ectópica secreta ácido e ulcera a <i>mucosa ileal adjacente<\/i>, gerando hematoquezia volumosa e indolor. A <b>obstrução<\/b> é a mais comum em <b>adultos<\/b> — intussuscepção (o divertículo como cabeça), torção axial do pedículo, hérnias internas, enterólitos, volvo em torno da banda, bridas. Também: diverticulite (simula apendicite), <b>hérnia de Littré<\/b> (Meckel dentro de um saco herniário inguinal, femoral ou umbilical) e malignização rara (carcinoide/TNE, GIST, adenocarcinoma).<\/p><p><b>Diagnóstico difícil:<\/b> US, TC, RM e Rx têm baixa sensibilidade e especificidade, mas ajudam nas complicações. A <b>cintilografia com Tc-99m (pertecnetato)<\/b> marca a mucosa gástrica ectópica — é o método mais utilizado (S 85%, E 95–100%, acurácia ~90%, melhor em crianças). Angiografia em sangramento ativo (≥ 0,5 mL/min), sendo a identificação da artéria vitelina patognomônica; cápsula/enteroscopia quando a imagem é inconclusiva; videolaparoscopia diagnóstica e terapêutica.<\/p><p><b>Tratamento:<\/b> achado incidental assintomático → acompanhar (Soltero & Bill: ~800 diverticulectomias para evitar uma complicação; risco cai com a idade — 4,2% na infância, 3% no adulto, ~0 no idoso); revisões de 2018 e 2024 sugerem ressecção seletiva em jovens, homens, divertículo > 2 cm ou com alterações macroscópicas/tecido ectópico palpável. Sintomático: <b>diverticulectomia simples<\/b> se base estreita sem alças acometidas; <b>ressecção ileal segmentar + anastomose<\/b> se base larga, <b>sangramento<\/b> (a úlcera está no íleo adjacente), diverticulite ou suspeita de neoplasia.<\/p>", "tab": [{"cap": "Complicações do divertículo de Meckel (Aula 7)", "h": ["Complicação", "Quem / detalhe"], "r": [["Sangramento", "Mais comum em crianças; úlcera na mucosa ileal adjacente à mucosa gástrica ectópica → hematoquezia indolor, volumosa"], ["Obstrução", "Mais comum em adultos; intussuscepção, torção do pedículo, hérnia interna, enterólito, volvo em torno da banda, bridas"], ["Diverticulite", "Simula apendicite; pode necrosar e perfurar"], ["Hérnia de Littré", "Meckel dentro de saco herniário (inguinal, femoral, umbilical)"], ["Malignização", "Rara: carcinoide/TNE, GIST, adenocarcinoma"]]}, {"cap": "Métodos diagnósticos", "h": ["Método", "Papel"], "r": [["US, TC, RM, Rx", "Baixa S e E; úteis para complicações"], ["Cintilografia Tc-99m", "Marca mucosa gástrica ectópica; mais utilizado; S 85%, E 95–100%, acurácia 90% (melhor em crianças)"], ["Angiografia", "Sangramento ativo ≥ 0,5 mL/min; artéria vitelina = patognomônico"], ["Cápsula / enteroscopia", "Suspeita com imagem prévia inconclusiva"], ["Videolaparoscopia", "Diagnóstica e terapêutica"]]}, {"cap": "Qual cirurgia?", "h": ["Situação", "Técnica"], "r": [["Base estreita, sem alças acometidas", "Diverticulectomia simples"], ["Base larga, sangramento, diverticulite, suspeita de neoplasia", "Ressecção ileal segmentar + anastomose"], ["Achado incidental assintomático", "Acompanhar; ressecção seletiva (jovem, homem, > 2 cm, alteração macroscópica)"]]}], "cmp": {"cap": "Meckel × falso divertículo × HDB pediátrica", "h": ["Aspecto", "Meckel", "Divertículo colônico", "Intussuscepção idiopática", "Pólipo juvenil"], "r": [["Parede", "Verdadeiro (todas as camadas)", "Falso (mucosa + submucosa)", "—", "—"], ["Sangramento", "Volumoso, indolor, “cor de tijolo”", "Volumoso, indolor (idoso)", "“Geleia de morango”, com cólica", "Pequeno"], ["Dor", "Ausente no sangramento", "Ausente no sangramento", "Cólica intermitente", "Ausente"]]}, "flow": {"cap": "Fluxograma 7 — Meckel complicado (Aula 7, slides 8–18)", "s": ["Suspeita de Meckel complicado", "Sangramento (criança, hematoquezia indolor) → cintilografia com Tc-99m (S 85%, E 95–100%) → inconclusiva: angiografia, cápsula/enteroscopia", "Obstrução / dor (adulto) → US (intussuscepção, diverticulite) / TC", "Videolaparoscopia diagnóstica e terapêutica", "Base estreita sem alças acometidas → diverticulectomia simples · Base larga, sangramento, diverticulite, suspeita de neoplasia → ressecção ileal segmentar + anastomose"]}, "imgs": ["c-017-018", "c-017-019", "c-017-020"], "refs": ["Portes M. Aula 7 — Divertículo de Meckel. FCMMG; 2026.", "Soltero MJ, Bill AH. Am J Surg. 1976;132(2):168–173.", "Sabiston, 18ª ed., cap. Intestino delgado (regra dos 2 — complemento).", "EPOS/ESR — SERAM 2014 (imagem de cintilografia, slide 15)."]}, {"id": "C06", "d": "cir", "n": "Abdome agudo perfurativo", "short": "Abdome perfurativo", "pages": [19, 20, 21], "aula": "Aula 9 (slides 28–65)", "rev": "<p><b>Definição:<\/b> perfuração não traumática de víscera oca do TGI; 3ª causa de abdome agudo, mortalidade ~10%. Etiologias: inflamatórias, neoplásicas, obstrutivas, isquêmicas, corpo estranho e iatrogênicas. A gravidade depende do <b>tempo<\/b> até a intervenção, da <b>etiologia<\/b> (química — gástrica/duodenal, inicialmente estéril — × fecaloide — cólon, sepse precoce) e de a perfuração ser em peritônio livre ou <b>tamponada<\/b> por omento/órgãos.<\/p><p><b>Quadro:<\/b> dor súbita, intensa, “em punhalada”, inicialmente localizada e depois difusa; posição antálgica, sudorese, palidez; taquicardia, hipotensão; RHA diminuídos/abolidos; <b>abdome em tábua<\/b>; <b>sinal de Jobert<\/b> (timpanismo na linha hemiclavicular direita onde deveria haver macicez hepática — não é patognomônico).<\/p><p><b>Imagem do pneumoperitônio:<\/b> Rx de tórax PA ortostático (exame inicial; ar sob as cúpulas; detecta pequenos volumes se o paciente ficar 5–10 min em pé); Rx em decúbito lateral esquerdo com raios horizontais para quem não fica em pé (ar entre fígado e parede); <b>sinal de Rigler<\/b> (dupla parede) no decúbito dorsal; TC é o mais sensível e mostra local e etiologia.<\/p><p><b>Úlcera péptica perfurada<\/b> é a principal causa: úlceras da parede <i>anterior<\/i> perfuram (as posteriores sangram — artéria gastroduodenal); duodenal ≈ 60%; em 30% a perfuração é a primeira manifestação. Fatores: AINEs, AAS, corticoide, <i>H. pylori<\/i>, tabagismo, etilismo, idosos, sexo masculino. Tratamento: estabilização (volume, SNG, analgesia, IBP EV) + ATB + <b>ulcerorrafia com patch omental (Graham)<\/b>; no pós-operatório, IBP em dose plena, tratar <i>H. pylori<\/i>, suspender AINE, EDA em 6–8 semanas e <b>biópsia da borda<\/b> se úlcera gástrica.<\/p><p><b>Boerhaave:<\/b> ruptura espontânea transmural do esôfago por aumento súbito da pressão durante vômitos; tríade de Mackler (vômitos → dor torácica intensa → enfisema subcutâneo); pneumomediastino, derrame pleural frequentemente à esquerda; local mais comum: terço distal, parede póstero-lateral esquerda. Complemento: esofagograma com contraste hidrossolúvel ou TC; jejum, ATB, drenagem e reparo precoce (idealmente < 24 h). Diferencie de Mallory-Weiss (laceração só mucosa → hematêmese, sem enfisema).<\/p><p><b>Corpo estranho e iatrogenia:<\/b> a espinha de peixe perfura mais o íleo e o sigmoide (angulação/estreitamento); iatrogenias por endoscopia, colonoscopia, laparoscopia, lipoaspiração. Caso da aula: perfuração espontânea de GIST jejunal em paciente com emagrecimento — ressecção segmentar e imuno-histoquímica (CD117/DOG1).<\/p>", "tab": [{"cap": "Sinais radiológicos de pneumoperitônio (Aula 9)", "h": ["Exame", "Achado / quando usar"], "r": [["Rx tórax PA ortostático", "Ar livre sob as cúpulas; exame inicial; 5–10 min em pé aumenta sensibilidade"], ["Rx abdome decúbito lateral E (raios horizontais)", "Ar entre fígado e parede lateral; para quem não fica de pé"], ["Rx abdome decúbito dorsal", "Sinal de Rigler: as duas faces da parede intestinal visíveis"], ["TC de abdome", "Mais sensível; bolhas de gás, líquido livre, local e etiologia"]]}, {"cap": "Causas de perfuração por segmento (Aula 9, slide 31)", "h": ["Segmento", "Causas"], "r": [["Esôfago", "Iatrogenia (endoscopia), Boerhaave, corpo estranho, neoplasia"], ["Estômago e duodeno", "Úlcera péptica, neoplasia, corpo estranho"], ["Intestino delgado", "Crohn, tuberculose, Meckel, isquemia, corpo estranho, GIST"], ["Cólon", "Divertículo, neoplasia, DII, megacólon tóxico, isquemia, corpo estranho, Ogilvie"]]}], "cmp": {"cap": "Boerhaave × Mallory-Weiss (complemento — Sabiston)", "h": ["Aspecto", "Boerhaave", "Mallory-Weiss"], "r": [["Lesão", "Transmural", "Apenas mucosa"], ["Clínica", "Vômitos → dor torácica intensa → enfisema subcutâneo", "Hematêmese após vômitos"], ["Imagem", "Pneumomediastino, derrame pleural (esquerda)", "Sem enfisema"], ["Conduta", "Jejum, ATB, drenagem, reparo precoce (< 24 h)", "Geralmente conservador/endoscópico"]]}, "flow": {"cap": "Conduta na úlcera péptica perfurada (Aula 9)", "s": ["Dor súbita em punhalada + tábua + Jobert → Rx tórax PA ortostático (pneumoperitônio); TC se dúvida e estável", "Jejum, SNG, hidratação, IBP EV, ATB", "Laparotomia/laparoscopia: ulcerorrafia + patch omental (Graham)", "Pós-operatório: IBP dose plena, erradicar H. pylori, suspender AINE, EDA 6–8 semanas; biópsia da borda se úlcera gástrica"]}, "imgs": ["c-019-021", "c-019-022", "c-019-023", "c-020-024", "c-020-025"], "refs": ["Portes M. Aula 9 — Abdome agudo perfurativo. FCMMG; 2026.", "Sabiston, 18ª ed., cap. Esôfago (Boerhaave — complemento).", "Al-Swaiti GT et al. Int J Surg Case Rep (caso GIST, slides 62–65)."]}, {"id": "C07", "d": "cir", "n": "Abdome agudo obstrutivo", "short": "Abdome obstrutivo", "pages": [22, 23, 24, 25], "aula": "Aula 10 (slides 1–41)", "rev": "<p><b>Conceito:<\/b> impedimento à progressão do conteúdo do tubo digestivo; a evolução natural é distensão → isquemia → necrose → perfuração. Distingue-se o <b>íleo funcional<\/b> (falha do peristaltismo sem obstáculo: pós-operatório, sepse, pancreatite, distúrbios eletrolíticos, opioides; RHA diminuídos) da <b>obstrução mecânica<\/b> (bloqueio físico: intraluminal, volvo, intussuscepção, estenose, encarceramento em hérnias ou bridas; RHA aumentados, timbre metálico, e silêncio na fase tardia).<\/p><p><b>Alta × baixa:<\/b> na obstrução de delgado (75–85%), vômitos precoces e biliosos, distensão discreta, flatos podem persistir no início, Rx com alças centrais e “empilhamento de moedas” (válvulas coniventes). Na de cólon (25%), distensão importante e precoce, vômitos tardios/fecaloides, parada precoce de flatos, alças periféricas com haustrações. Em 15–20% a válvula ileocecal é incompetente e o quadro se assemelha ao de obstrução alta; com válvula <b>competente<\/b> forma-se <b>alça fechada<\/b> e o ceco (maior diâmetro — Laplace) sofre maior tensão: <b>ceco > 12 cm<\/b> = risco iminente de perfuração.<\/p><p><b>Causas:<\/b> delgado — <b>bridas/aderências<\/b> (principal), hérnias, neoplasias, íleo biliar, Crohn, volvo; cólon — <b>câncer colorretal<\/b> (até 60%), volvo (5–15%), diverticulite (10%); gastroduodenal — maligna em 50–80%. A história orienta: cirurgia prévia → bridas; neoplasia → recidiva/carcinomatose; Crohn → estenose; radioterapia → enterite actínica; doença psiquiátrica → corpo estranho/bezoar. Sempre examinar regiões inguinais e femorais.<\/p><p><b>Imagem:<\/b> o Rx mostra distensão e níveis hidroaéreos mas define mal causa e local; a <b>TC é o padrão-ouro<\/b> — ponto de transição, causa e sinais de sofrimento (redemoinho, fecalização do delgado, parede sem realce, pneumatose).<\/p><p><b>Tratamento:<\/b> jejum, SNG aberta, cristaloide, correção de Na+ e K+, sonda vesical, analgesia; TC. Sinais de sofrimento (febre, peritonite, taquicardia, leucocitose, lactato elevado, redemoinho, hérnia encarcerada, tumor, ceco > 12 cm) → <b>cirurgia<\/b>. Brida sem sofrimento → conservador com reavaliação seriada (complemento — Bologna/ASBO: até ~72 h; contraste hidrossolúvel no cólon em 24 h prediz resolução).<\/p><p><b>Obstrução intestinal maligna (paliativa):<\/b> dexametasona, octreotide/IBP, <b>haloperidol como antiemético de 1ª linha<\/b> (metoclopramida só se obstrução <i>parcial<\/i>), opioides; não operar com ECOG ≥ 3, carcinomatose difusa, ascite volumosa, múltiplos níveis, expectativa de vida limitada.<\/p><p><b>Volvo de sigmoide:<\/b> idoso, constipação crônica, <b>megacólon chagásico<\/b>; Rx em “grão de café”/U invertido; TC com redemoinho. Sem necrose → descompressão endoscópica e, pelo risco de recidiva (~50%), sigmoidectomia eletiva; falha, mucosa isquêmica ou peritonite → laparotomia + Hartmann.<\/p>", "tab": [{"cap": "Alta (delgado) × baixa (cólon) — Aula 10", "h": ["Aspecto", "Alta", "Baixa"], "r": [["Distensão", "Discreta / tardia", "Importante / precoce"], ["Vômitos", "Precoces, biliosos", "Tardios, fecaloides"], ["Flatos", "Podem persistir no início", "Parada precoce"], ["Rx", "Alças centrais, empilhamento de moedas", "Alças periféricas com haustrações"], ["Detalhe", "—", "15–20% com válvula ileocecal incompetente → quadro semelhante à obstrução alta"]]}, {"cap": "Funcional (íleo) × mecânica", "h": ["Aspecto", "Funcional", "Mecânica"], "r": [["Mecanismo", "Falha do peristaltismo, sem obstáculo", "Bloqueio físico da luz"], ["Causas", "Pós-operatório, sepse, pancreatite, uremia/HE, opioides, reflexo (trauma, litíase), isquemia não oclusiva", "Fecaloma, bezoar, íleo biliar, volvo, intussuscepção, tumor, hérnias, bridas"], ["Ausculta", "RHA diminuídos ou ausentes", "RHA aumentados, metálicos → silêncio tardio"]]}, {"cap": "Obstrução intestinal maligna — paliação (Aula 10)", "h": ["Classe", "Esquema", "Objetivo"], "r": [["Corticoide", "Dexametasona 8–16 mg/dia", "Reduzir edema tumoral"], ["Antissecretores", "Octreotide 100–600 mcg/dia; IBP", "Reduzir secreção e vômitos"], ["Antieméticos", "Haloperidol (1ª linha); metoclopramida só se parcial", "Náuseas"], ["Analgesia", "Opioides", "Dor e dispneia"]]}], "cmp": {"cap": "Volvo de sigmoide × brida", "h": ["Aspecto", "Volvo de sigmoide", "Brida / aderência"], "r": [["Paciente", "Idoso, constipado crônico, Chagas", "Cirurgia abdominal prévia"], ["Segmento", "Cólon (alça fechada)", "Delgado"], ["Imagem", "Grão de café / U invertido; redemoinho", "Empilhamento de moedas; ponto de transição único"], ["1ª conduta sem sofrimento", "Descompressão endoscópica", "Conservador (SNG, jejum, volume) com reavaliação"], ["Depois", "Sigmoidectomia eletiva (recidiva ~50%)", "Alta se resolve; cirurgia se não resolve/piora"]]}, "flow": {"cap": "Fluxogramas 8 e 9 — obstrução intestinal e volvo (Aula 10)", "s": ["Jejum, SNG aberta, SF/RL, corrigir Na+ e K+, sonda vesical, analgesia", "TC (ponto de transição, causa, sofrimento) — Rx se TC indisponível", "Sofrimento/complicação (febre, peritonite, taquicardia, leucocitose, lactato ↑, redemoinho, parede sem realce, pneumatose, hérnia encarcerada, tumor, ceco > 12 cm) → CIRURGIA", "Brida sem sofrimento → conservador com reavaliação seriada → não resolve/piora: cirurgia; resolve: alta", "Volvo de sigmoide sem necrose → descompressão endoscópica → sucesso: sigmoidectomia eletiva; falha/mucosa isquêmica/peritonite → laparotomia + Hartmann"]}, "imgs": ["c-022-026", "c-023-027", "c-023-028", "c-023-029", "c-024-030", "c-024-031"], "refs": ["Portes M. Aula 10 — Abdome agudo obstrutivo. FCMMG; 2026.", "Ten Broek RPG et al. Bologna guidelines (ASBO): 2017 update. World J Emerg Surg. 2018;13:24 (complemento).", "Sabiston, 18ª ed. (imagens dos slides 18–19)."]}, {"id": "C08", "d": "cir", "n": "Abdome agudo hemorrágico", "short": "Abdome hemorrágico", "pages": [26, 27, 28], "aula": "Aula 10 (slides 42–66)", "rev": "<p><b>Conceito:<\/b> hemorragia intra-abdominal espontânea ou secundária a doença não traumática, de instalação súbita, com instabilidade hemodinâmica e irritação peritoneal variável. O choque hemorrágico leva a hipovolemia, hipoperfusão, acidose metabólica e coagulopatia — com hipotermia, a “tríade letal”.<\/p><p><b>Causas:<\/b> ginecológicas (gravidez ectópica rota, corpo lúteo hemorrágico), vasculares (aneurisma de aorta e de artérias viscerais, vasculites), hepáticas/esplênicas (adenoma, hepatocarcinoma, rotura esplênica espontânea) e outras (anticoagulação, pancreatite hemorrágica). Propedêutica: hemograma, coagulograma, lactato, gasometria, β-hCG, tipagem; <b>FAST no instável<\/b> (Morison, esplenorrenal, pelve, subcostal), TC no estável, laparoscopia diagnóstica e terapêutica se estável.<\/p><p><b>AAA roto:<\/b> homens > 60 anos, tabagistas; mortalidade da rotura 32–95%. Tríade: dor abdominal/lombar intensa + massa pulsátil + hipotensão (presente em ~50%). Suspeitar em > 55 anos com dor súbita, hipotensão ou dor lombar inexplicada — <b>a confusão com cólica renal é o erro clássico<\/b>. Instável → clínica + US/FAST à beira-leito e centro cirúrgico (reparo aberto ou EVAR); estável → angioTC. Risco de ruptura: diâmetro > 5,5 cm, hipertensão, tabagismo. Rastreamento: US em homens de 65–75 anos com história de tabagismo. Complemento (ESVS 2024): hipotensão permissiva (PAS ~70–90 mmHg, consciente) até o controle proximal.<\/p><p><b>Gravidez ectópica rota:<\/b> tubas em 96%; principal causa de morte materna no 1º trimestre. Fatores: ectópica prévia, DIP, cirurgia tubária, DIU, FIV, tabagismo. Tríade: atraso menstrual + dor + sangramento vaginal. A rotura causa hemoperitônio com dor referida no ombro (<b>Kehr/Laffont<\/b>). Mulher fértil com hemoperitônio = ectópica rota até prova em contrário. Instável → cirurgia imediata; procedimento padrão = salpingectomia, via preferencial videolaparoscopia; imunoglobulina anti-D se Rh negativo.<\/p><p><b>Outras:<\/b> cisto ovariano roto (após exercício ou relação sexual; conservador se estável; preservar o ovário na jovem); rotura hepática espontânea (adenoma — associação com anticoncepcional oral e anabolizantes —, CHC, HELLP); rotura esplênica espontânea (mononucleose, linfoma, leucemia) → esplenectomia; aneurisma de artérias viscerais (esplênica 60%, 4× mais em mulheres, associado à gestação com alta mortalidade materna e fetal).<\/p>", "tab": [{"cap": "Causas de hemoperitônio espontâneo (Aula 10)", "h": ["Causa", "Pista", "Tratamento"], "r": [["Gravidez ectópica rota", "Mulher fértil, β-hCG +, dor no ombro", "Instável: cirurgia imediata (salpingectomia, VLP preferencial); anti-D se Rh −"], ["AAA roto", "Homem > 60, tabagista, dor lombar, massa pulsátil, hipotensão", "Reparo aberto ou EVAR; instável direto ao CC"], ["Cisto ovariano roto (corpo lúteo)", "Após exercício ou relação sexual; líquido livre pélvico", "Conservador se estável; VLP se instável — preservar ovário"], ["Rotura hepática espontânea", "Adenoma (ACO, anabolizantes), CHC, HELLP", "Controle hemodinâmico, embolização, ressecção"], ["Rotura esplênica espontânea", "Mononucleose, CMV, HIV, linfoma, leucemia", "Esplenectomia"], ["Aneurisma de artéria visceral", "Esplênica 60%; mulher, gestação; hipertensão portal", "Ligadura/aneurismectomia/embolização"]]}, {"cap": "Janelas do FAST (Aula 10, slide 50)", "h": ["Janela", "Espaço avaliado"], "r": [["1", "Quadrante superior direito (Morison)"], ["2", "Quadrante superior esquerdo (esplenorrenal)"], ["3", "Pelve"], ["4", "Subcostal (pericárdio)"]]}], "cmp": {"cap": "Hemorrágico × vascular (Aula 10)", "h": ["Aspecto", "Hemorrágico", "Vascular (isquêmico)"], "r": [["Conceito", "Hemorragia intra-abdominal espontânea", "Redução abrupta da perfusão visceral"], ["Instalação", "Súbita, com instabilidade", "Embolia, trombose, hipoperfusão não oclusiva"], ["Principal risco", "Choque hemorrágico", "Necrose intestinal"], ["Exame inicial", "FAST (instável)", "AngioTC"]]}, "flow": {"cap": "Abordagem do abdome hemorrágico (síntese Aula 10)", "s": ["Dor súbita + sinais de hipovolemia", "ABC, 2 acessos calibrosos, cristaloide/hemoderivados, tipagem, β-hCG", "Instável → FAST à beira-leito → hemoperitônio → centro cirúrgico (não ir à TC)", "Estável → TC/angioTC; laparoscopia diagnóstica e terapêutica", "AAA roto: hipotensão permissiva até controle proximal (complemento ESVS 2024)"]}, "imgs": ["c-026-032", "c-026-033"], "refs": ["Portes M. Aula 10 — Abdome agudo hemorrágico. FCMMG; 2026.", "Wanhainen A et al. ESVS 2024 Guidelines on AAA. Eur J Vasc Endovasc Surg. 2024;67(2):192–331 (complemento).", "Philips — guia rápido FAST (slide 50); eduardodale.com.br (slide 53)."]}, {"id": "C09", "d": "cir", "n": "Abdome agudo vascular — isquemia mesentérica aguda", "short": "Isquemia mesentérica", "pages": [29, 30], "aula": "Aula 10 (slides 67–80)", "rev": "<p><b>Conceito:<\/b> redução ou ausência de perfusão em vísceras ocas → isquemia → gangrena → perfuração → peritonite. Evolução rápida, <b>mortalidade de 50–100%<\/b> e diagnóstico frequentemente tardio.<\/p><p><b>Etiologias e pistas (Aula 10, slide 70):<\/b> <b>embolia arterial<\/b> (a mais comum) — fibrilação atrial, IAM recente, valvopatia mitral, aneurisma de VE, endocardite; <b>trombose arterial<\/b> — aterosclerose, história de “angina intestinal” (dor pós-prandial, medo de comer, emagrecimento); <b>isquemia não oclusiva<\/b> — insuficiência cardíaca, baixo fluxo, vasopressores, disfunção de múltiplos órgãos; <b>trombose venosa<\/b> — hipertensão portal, trombofilia, estrogênio/ACO, pancreatite, tromboembolismo prévio.<\/p><p><b>Clínica:<\/b> o sinal clássico é a <b>dor abdominal intensa, desproporcional ao exame físico<\/b>. Associam-se náuseas, vômitos, diarreia (esvaziamento), distensão. Na fase inicial o abdome é flácido, sem defesa e geralmente sem febre; na tardia surgem febre, taquicardia, oligúria, confusão, choque séptico e perfuração (12–24 h). Abdome flácido <b>não tranquiliza<\/b>; lactato normal no início não afasta.<\/p><p><b>Exames:<\/b> leucocitose elevada, PCR, lactato, acidose metabólica, amilase e CPK elevadas; D-dímero normal ajuda a afastar. <b>AngioTC é o exame de escolha<\/b> (trombo na AMS ou na veia porta-mesentérica, pneumatose, gás portal); arteriografia é diagnóstica e terapêutica.<\/p><p><b>Tratamento (WSES 2022):<\/b> ressuscitação, correção hidroeletrolítica, SNG, ATB de amplo espectro, <b>heparina plena<\/b> (se não houver contraindicação) e angioTC imediata. Peritonite, necrose, perfuração ou instabilidade → laparotomia com revascularização + ressecção do não viável e <b>second-look em 24–48 h<\/b> (“open-close” se inviável). Sem esses achados, tratamento por etiologia: embolia → embolectomia, trombólise, aspiração endovascular; trombose arterial → angioplastia com stent ou derivação aortomesentérica; trombose venosa → anticoagulação plena (fibrinólise selecionada); não oclusiva → suporte hemodinâmico e papaverina intra-arterial.<\/p><p><b>Complemento (WSES 2022):<\/b> o êmbolo impacta alguns centímetros após a origem da AMS (após a cólica média), poupando o jejuno proximal; a trombose ocorre na origem (ostial) e causa isquemia mais extensa, do duodeno ao transverso.<\/p>", "tab": [{"cap": "Fatores de risco por etiologia (Aula 10, slide 70 — Bala et al.)", "h": ["Etiologia", "Fatores de risco / pistas", "Tratamento específico"], "r": [["Embolia arterial (mais comum)", "FA, IAM recente, valvopatia mitral, aneurisma de VE, endocardite", "Embolectomia, trombólise, aspiração endovascular"], ["Trombose arterial", "Aterosclerose; dor pós-prandial e emagrecimento prévios", "Angioplastia com stent; derivação aortomesentérica"], ["Isquemia não oclusiva", "IC, baixo fluxo, vasopressores, disfunção de múltiplos órgãos", "Suporte hemodinâmico, papaverina intra-arterial"], ["Trombose venosa", "Hipertensão portal, trombofilia, estrogênio/ACO, pancreatite", "Anticoagulação plena; fibrinólise selecionada"]]}, {"cap": "Fase inicial × fase tardia", "h": ["Fase inicial", "Fase tardia"], "r": [["Dor intensa desproporcional; abdome flácido, sem defesa; febre geralmente ausente", "Febre, taquicardia, oligúria, confusão, choque séptico; perfuração em 12–24 h"]]}], "cmp": {"cap": "Embolia × trombose da AMS (complemento — WSES 2022)", "h": ["Aspecto", "Embolia", "Trombose"], "r": [["Início", "Abrupto", "Insidioso sobre doença crônica"], ["Fonte", "Cardíaca (FA)", "Placa aterosclerótica ostial"], ["Local na AMS", "Alguns cm após a origem (após a cólica média)", "Origem (ostial)"], ["Extensão", "Poupa jejuno proximal", "Duodeno ao cólon transverso"], ["História", "FA sem anticoagulação", "Angina intestinal, emagrecimento"]]}, "flow": {"cap": "Fluxograma 10 — isquemia mesentérica aguda (Aula 10; WSES 2022)", "s": ["Suspeita: dor desproporcional ao exame + fator de risco", "Ressuscitação, correção HE, SNG, ATB amplo espectro, HEPARINA plena, angioTC imediata", "Peritonite, necrose, perfuração ou instabilidade? SIM → laparotomia: revascularização + ressecção do não viável; second-look 24–48 h; open-close se inviável", "NÃO → tratamento conforme a etiologia (embolia, trombose arterial, trombose venosa, não oclusiva)"]}, "imgs": ["c-029-034", "c-029-035", "c-029-036"], "refs": ["Portes M. Aula 10 — Abdome agudo vascular. FCMMG; 2026.", "Bala M et al. Acute mesenteric ischemia: updated guidelines of the WSES. World J Emerg Surg. 2022;17:54."]}, {"id": "C10", "d": "cir", "n": "Doença inflamatória intestinal (Crohn × RCU)", "short": "DII — Crohn e RCU", "pages": [31, 32, 33, 34], "aula": "Aula 11 (slides 1–37)", "rev": "<p><b>Conceito:<\/b> doenças inflamatórias crônicas do TGI, imunomediadas, de curso recorrente com remissões e exacerbações; formas principais: doença de Crohn (DC) e retocolite ulcerativa (RCU). Pico entre 15 e 35 anos; história familiar em 15–20%. Fisiopatologia: predisposição genética + disbiose + alteração da barreira mucosa + resposta imune inadequada (TNF-α, IL-12, IL-23) + ambiente (dieta pobre em fibras, ultraprocessados, antibióticos, obesidade).<\/p><p><b>Tabagismo:<\/b> maléfico na Crohn (piora e aumenta recidiva pós-operatória); “efeito protetor” na RCU (ex-tabagistas têm risco maior). AINEs são fator de agudização.<\/p><p><b>Crohn<\/b>: qualquer segmento da boca ao ânus, predomínio ileocecal, <b>lesões salteadas<\/b>, <b>transmural<\/b>, dor em FID, diarreia crônica, perda ponderal, massa, doença perianal, fístulas e estenoses; úlceras aftosas e “pedra de calçamento”; <b>granulomas não caseosos<\/b>; ASCA. Cirurgia não é curativa — poupar intestino (ressecções econômicas, estricturoplastias). <b>RCU<\/b>: cólon e reto, <b>sempre acomete o reto<\/b>, contínua e ascendente, mucosa/submucosa; diarreia com sangue, tenesmo, urgência; mucosa friável, pseudopólipos; <b>abscessos de cripta<\/b>; p-ANCA; proctocolectomia é curativa.<\/p><p><b>Manifestações extraintestinais:<\/b> articulares (as mais frequentes, ambas), uveíte (ambas, independe da atividade), episclerite (acompanha a atividade), eritema nodoso (Crohn), pioderma gangrenoso (RCU), colangite esclerosante primária (RCU), nefrolitíase por oxalato (Crohn — má absorção ileal), tromboembolismo (ambas).<\/p><p><b>Diagnóstico:<\/b> não há exame único. PCR, VHS, anemia, hipoalbuminemia, ferropenia; <b>calprotectina fecal<\/b> (proteína de neutrófilos) separa doença orgânica de funcional, mas não é específica de DII (sobe em gastroenterite, C. difficile, neoplasia, diverticulite, AINEs). EnteroTC (abscessos, perfuração) e enterorressonância (delgado, estenoses, fístulas, sem radiação — preferível no jovem).<\/p><p><b>Tratamento escalonado:<\/b> mesalazina (RCU leve–moderada; pouco benefício na Crohn) → corticoide para <b>indução<\/b> (nunca manutenção) → azatioprina/6-MP/metotrexato para manutenção e poupar corticoide → anti-TNF (infliximabe, adalimumabe) na moderada–grave, refratária ou fistulizante → cirurgia. Operar a Crohn por estenose obstrutiva, fístulas, abscessos, refratariedade; a RCU por megacólon tóxico, perfuração, displasia/câncer, colite refratária, hemorragia grave.<\/p><p><b>Megacólon tóxico:<\/b> dilatação aguda do cólon (> 6 cm) com toxicidade sistêmica; critérios de Jalan (complemento). UTI, jejum, volume, correção HE, corticoide EV, ATB, <b>suspender opioides e antidiarreicos<\/b>; perfuração, peritonite, instabilidade, piora ou falha em 24–72 h → <b>colectomia subtotal + ileostomia terminal<\/b>.<\/p>", "tab": [{"cap": "Crohn × RCU — a tabela mais importante do capítulo (Aula 11)", "h": ["Aspecto", "Doença de Crohn", "Retocolite ulcerativa"], "r": [["Localização", "Boca ao ânus; predomínio ileocecal; pode poupar o reto", "Cólon e reto; sempre acomete o reto"], ["Distribuição", "Descontínua (skip lesions)", "Contínua, ascendente"], ["Profundidade", "Transmural", "Mucosa e submucosa"], ["Clínica", "Dor em FID, diarreia, perda ponderal, massa, doença perianal", "Diarreia com sangue, tenesmo, urgência, muco"], ["Fístulas/estenoses", "Frequentes", "Raras"], ["Endoscopia", "Úlceras aftosas, pedra de calçamento", "Mucosa friável contínua, pseudopólipos"], ["Histologia", "Granulomas não caseosos", "Abscessos de cripta"], ["Sorologia", "ASCA", "p-ANCA"], ["Tabagismo", "Piora", "“Protege”"], ["Cirurgia", "Não curativa — poupar intestino", "Proctocolectomia curativa"]]}, {"cap": "Manifestações extraintestinais", "h": ["Manifestação", "Mais associada"], "r": [["Articulares (as mais frequentes)", "Ambas"], ["Uveíte", "Ambas (independe da atividade)"], ["Episclerite", "Ambas (acompanha a atividade)"], ["Eritema nodoso", "Crohn"], ["Pioderma gangrenoso", "RCU"], ["Colangite esclerosante primária", "RCU"], ["Nefrolitíase por oxalato", "Crohn"], ["Tromboembolismo venoso", "Ambas"]]}, {"cap": "Classes terapêuticas", "h": ["Classe", "Fármacos", "Uso"], "r": [["Aminossalicilatos", "Mesalazina oral/retal", "RCU leve–moderada"], ["Corticoides", "Prednisona, hidrocortisona EV", "Indução; não para manutenção"], ["Imunossupressores", "Azatioprina, 6-MP, metotrexato", "Manutenção; poupar corticoide"], ["Biológicos", "Infliximabe, adalimumabe", "Moderada–grave, refratária, fístulas"]]}], "cmp": {"cap": "Quando operar?", "h": ["Crohn", "RCU"], "r": [["Estenose (obstrução), fístulas, abscessos, refratariedade", "Megacólon tóxico, perfuração, displasia/câncer, colite refratária, hemorragia grave"], ["Ressecções econômicas, estricturoplastias", "Proctocolectomia (curativa); na urgência colectomia subtotal + ileostomia"]]}, "flow": {"cap": "Fluxogramas 11 e 12 — tratamento escalonado e megacólon tóxico (Aula 11)", "s": ["Leve–moderada (RCU): mesalazina oral e/ou retal", "Crise moderada–grave: corticoide para indução (não manter)", "Manutenção / poupar corticoide: azatioprina, 6-MP, metotrexato", "Moderada–grave, refratária, fístulas: anti-TNF", "Complicação ou refratariedade: cirurgia", "Megacólon tóxico: UTI, jejum, volume, corticoide EV, ATB, suspender opioides/antidiarreicos → perfuração, peritonite, instabilidade, falha 24–72 h → colectomia subtotal + ileostomia terminal"]}, "imgs": ["c-031-037", "c-032-038", "c-032-039", "c-032-040", "c-032-041", "c-033-042"], "refs": ["Portes M. Aula 11 — Doença inflamatória intestinal. FCMMG; 2026.", "Jalan KN et al. Gastroenterology. 1969;57(1):68–82 (critérios — complemento).", "Burlin S et al. Radiol Bras 2017 (enteroTC, slide 26)."]}, {"id": "C11", "d": "cir", "n": "Divertículo de Zenker", "short": "Divertículo de Zenker", "pages": [35, 36], "aula": "Aula 6 (slides 2–19)", "rev": "<p><b>Conceito:<\/b> divertículo faringoesofágico; incidência baixa (~2/100.000/ano), mas é o mais comum dos divertículos do esôfago. Predomina em <b>homens > 70 anos<\/b>.<\/p><p><b>Anatomia e mecanismo:<\/b> é um <b>pseudodivertículo de pulsão<\/b> — herniação de mucosa e submucosa da hipofaringe pelo <b>triângulo de Killian<\/b>, área de fraqueza na parede posterior entre o constritor inferior da faringe e o músculo cricofaríngeo (que forma o esfíncter esofágico superior). A faringe contrai, mas o cricofaríngeo não relaxa a tempo (incoordenação/hipertonia) → aumento da pressão na hipofaringe → herniação repetida.<\/p><p><b>Clínica (slide 7):<\/b> disfagia alta, intermitente e progressiva; regurgitação de alimentos não digeridos horas depois; massa cervical à esquerda que se esvazia com tosse ou compressão; halitose, sialorreia, tosse crônica, rouquidão; <b>pneumonia aspirativa<\/b>. O sinal de Boyce (slide da aula: dor cervical esquerda à deglutição; classicamente, gorgolejo à compressão da massa — complemento).<\/p><p><b>Diagnóstico:<\/b> o <b>esofagograma<\/b> é o exame de escolha — mostra o saco, o colo e o tamanho, que define a conduta. A EDA não é necessária para confirmar, mas é recomendada para excluir malignidade; é feita com cuidado porque o aparelho tende a entrar no divertículo (risco de perfuração). A manometria mostra hipertonia do cricofaríngeo.<\/p><p><b>Tratamento:<\/b> indicado em todo divertículo <b>sintomático<\/b> ou <b>assintomático > 2 cm<\/b>. O ponto central de todas as técnicas é a <b>miotomia do cricofaríngeo<\/b> — sem ela, a pressão continua alta e o divertículo recidiva. < 2 cm: cricomiotomia por cervicotomia esquerda (o divertículo costuma regredir). 2–4 cm: endoscópico (diverticulotomia/Z-POEM) ou cirúrgico (miotomia + diverticulectomia ou diverticulopexia). > 4 cm: miotomia + diverticulectomia. Risco cirúrgico aumentado com > 2 cm: miotomia + <b>diverticulopexia<\/b> (fixação à fáscia pré-vertebral — mais rápida, evita fístula da ressecção).<\/p>", "tab": [{"cap": "Conduta no Zenker por tamanho (Aula 6, slides 12–19)", "h": ["Tamanho / situação", "Conduta"], "r": [["< 2 cm (sintomático)", "Miotomia do cricofaríngeo por cervicotomia esquerda; divertículo costuma regredir"], ["2 a 4 cm", "Endoscópico: diverticulotomia / Z-POEM; ou cirúrgico: miotomia + diverticulectomia/diverticulopexia"], ["> 4 cm", "Miotomia + diverticulectomia (sutura manual ou grampeador)"], ["> 2 cm, alto risco cirúrgico", "Miotomia + diverticulopexia (fixação à fáscia pré-vertebral)"]]}, {"cap": "Exames no Zenker", "h": ["Exame", "Papel"], "r": [["Esofagograma", "Exame de escolha: saco, colo, tamanho (define conduta)"], ["EDA", "Não precisa para confirmar; excluir malignidade; cuidado (perfuração)"], ["Manometria", "Hipertonia do cricofaríngeo; contração na hora errada"]]}], "cmp": {"cap": "Zenker × megaesôfago × DRGE (Aula 6)", "h": ["Aspecto", "Zenker", "Megaesôfago", "DRGE"], "r": [["Local", "EES / hipofaringe (Killian)", "EEI + corpo", "EEI / JEG"], ["Paciente típico", "Homem > 70 anos", "Homem 20–50, área endêmica", "Mulher > 45, obesa"], ["Sintoma-guia", "Disfagia alta, regurgitação de alimento não digerido, halitose, massa cervical", "Disfagia progressiva + regurgitação + emagrecimento", "Pirose + regurgitação ácida"], ["Exame-chave", "Esofagograma", "Esofagograma + manometria", "Prova terapêutica; pHmetria"], ["Cirurgia", "Cricomiotomia ± diverticulectomia/pexia", "Heller + Pinotti; esofagectomia grau IV", "Hiatoplastia + fundoplicatura"]]}, "flow": {"cap": "Fluxograma 13 — Zenker por tamanho (Aula 6)", "s": ["Divertículo de Zenker sintomático ou assintomático > 2 cm → esofagograma (tamanho)", "< 2 cm → miotomia do cricofaríngeo (cervicotomia esquerda)", "2–4 cm → endoscópico (Z-POEM) ou cirúrgico (miotomia + diverticulectomia/pexia)", "> 4 cm → miotomia + diverticulectomia", "Alto risco e > 2 cm → miotomia + diverticulopexia — a miotomia NUNCA pode faltar"]}, "imgs": ["c-035-043", "c-035-044", "c-036-045", "c-036-046"], "refs": ["Portes M. Aula 6 — Divertículo de Zenker, megaesôfago e DRGE. FCMMG; 2026.", "Sabiston, 18ª ed., cap. Esôfago (sinal de Boyce e cuidados na EDA — complemento)."]}, {"id": "C12", "d": "cir", "n": "Megaesôfago (acalasia chagásica)", "short": "Megaesôfago", "pages": [36, 37, 38, 39], "aula": "Aula 6 (slides 22–39)", "rev": "<p><b>Conceito:<\/b> síndrome de disfagia crônica e progressiva com dilatação e alongamento do esôfago <b>sem estenose orgânica<\/b> da junção esofagogástrica — o acometimento é funcional (acalasia e alteração da peristalse). Estenose anatômica (tumor, estenose péptica) que dilata o esôfago <b>não é megaesôfago<\/b>: sempre excluir câncer (<b>pseudoacalasia<\/b>).<\/p><p><b>Etiologia e epidemiologia:<\/b> congênita, adquirida (Chagas) ou idiopática (acalasia). No Brasil, <b>~90% associado à doença de Chagas<\/b>; homens 2:1; 20–50 anos; endêmico no norte de Minas e Bahia.<\/p><p><b>Patogênese (slide 24):<\/b> destruição dos plexos de Meissner e Auerbach → perda dos neurônios inibitórios (óxido nítrico e VIP) com colinérgicos poupados → aumento da pressão de repouso do EEI e falha de relaxamento → aperistalse (contrações simultâneas) → estase e dilatação.<\/p><p><b>Clínica:<\/b> tríade de disfagia progressiva (sólidos → pastosos → líquidos; come devagar e bebe água para “empurrar”), regurgitação e perda ponderal; dor retroesternal, sialorreia, halitose, pneumonia aspirativa.<\/p><p><b>Diagnóstico:<\/b> Chagas crônico por sorologia IgG com 2 testes de princípios diferentes (PCDT/MS). <b>Esofagograma<\/b>: esôfago dilatado com afilamento distal em <b>“bico de pássaro”<\/b>; classificações de Rezende (radiológica) e Mascarenhas (diâmetro: I < 4, II 4–7, III 7–10, IV > 10 cm). <b>Manometria<\/b>: falha de relaxamento do EEI (achado-chave), hipertonia do EEI, pressão intraesofágica aumentada, aperistalse e baixa amplitude; Chicago tipos I, II e III. <b>EDA<\/b>: pouco contribui para o diagnóstico de acalasia, mas é essencial para excluir neoplasia e rastrear o carcinoma epidermoide (~8% em 20 anos — condição pré-maligna).<\/p><p><b>Tratamento:<\/b> clínico paliativo (nitrato, nifedipina) para grau I sem transtornos, idosos ou alto risco; toxina botulínica no EEI (meses a 1 ano; ponte em jovem desnutrido); dilatação com balão (70–90% de melhora, perfuração 1–2%); <b>cardiomiotomia a Heller + fundoplicatura de Pinotti (270°)<\/b>, preferencialmente laparoscópica, nos graus I–III — a válvula é obrigatória porque a miotomia isolada causa refluxo (miotomia ~6 cm no esôfago e ~2 cm na cárdia); <b>esofagectomia subtotal<\/b> com tubo gástrico e anastomose cervical no grau IV ou recidiva/falha.<\/p>", "tab": [{"cap": "Classificações do megaesôfago (Aula 6, slide 29)", "h": ["Grau", "Rezende (radiológica)", "Mascarenhas (diâmetro)"], "r": [["I", "Diâmetro normal, trânsito lento, coluna de contraste retida de nível plano", "< 4 cm"], ["II", "Pequena/moderada dilatação, retenção evidente, contrações terciárias", "4–7 cm"], ["III", "Grande dilatação, grande retenção, hipotonia/atonia", "7–10 cm"], ["IV", "Grande dilatação com tortuosidade (dolicomegaesôfago)", "> 10 cm"]]}, {"cap": "Opções terapêuticas (Aula 6, slides 33–39)", "h": ["Modalidade", "Indicação", "Pontos-chave"], "r": [["Clínico (nitrato, nifedipina)", "Grau I sem transtornos; idosos; alto risco; recusa", "Paliativo; não muda a história natural"], ["Toxina botulínica (EDA)", "Idosos, alto risco, recusa; ponte", "~100 U em 4 quadrantes; dura meses a 1 ano"], ["Dilatação com balão", "Grau I com disfagia intensa; desnutridos; contraindicação cirúrgica", "70–90% de melhora; perfuração 1–2%"], ["Heller + Pinotti (270°)", "Graus I, II e III", "Miotomia extramucosa + válvula; preferência laparoscópica"], ["Esofagectomia subtotal", "Grau IV ou recidiva/falha", "Tubo gástrico, anastomose cervical; maior morbimortalidade"]]}, {"cap": "Chicago — manometria de alta resolução", "h": ["Tipo", "Achados"], "r": [["I — clássica", "Sem pressurização; IRP elevado; peristalse ausente"], ["II — panpressurização", "Panpressurização; IRP elevado; sem peristalse"], ["III — espástica", "Contrações prematuras; IRP elevado"]]}], "cmp": {"cap": "Acalasia verdadeira × pseudoacalasia", "h": ["Aspecto", "Megaesôfago (Chagas/acalasia)", "Pseudoacalasia"], "r": [["Causa", "Destruição neural funcional", "Estenose orgânica (tumor da cárdia, estenose)"], ["Paciente", "20–50 anos, área endêmica, longa história", "Idoso, história curta, emagrecimento rápido"], ["Exame que separa", "Manometria + EDA sem lesão", "EDA com lesão/biópsia"], ["Conduta", "Heller + Pinotti (I–III)", "Tratar a causa (oncológica)"]]}, "flow": {"cap": "Fluxograma 14 — megaesôfago (Aula 6)", "s": ["Megaesôfago (Chagas ~90%) → esofagograma + manometria + EDA (excluir câncer)", "Alto risco, idoso, recusa ou grau I sem transtorno → nitrato/nifedipina, toxina botulínica, dilatação com balão", "Grau I, II ou III → cardiomiotomia a Heller + fundoplicatura de Pinotti (270°), via laparoscópica", "Grau IV (dolicomegaesôfago) ou recidiva → esofagectomia subtotal com tubo gástrico"]}, "imgs": ["c-037-047", "c-037-048", "c-038-049", "c-039-050"], "refs": ["Portes M. Aula 6 — Megaesôfago. FCMMG; 2026.", "Rezende JM. Rev Goiana Med. 1982; Mascarenhas RS. Arq Gastroenterol. 1968 (citados no slide 29).", "Kahrilas PJ et al. Chicago Classification v3.0. Neurogastroenterol Motil. 2015;27(2):160–174.", "Brasil. Ministério da Saúde. PCDT Doença de Chagas. 2018."]}, {"id": "C13", "d": "cir", "n": "Doença do refluxo gastroesofágico (DRGE)", "short": "DRGE", "pages": [39, 40, 41, 42], "aula": "Aula 6 (slides 40–57)", "rev": "<p><b>Conceito:<\/b> afecção crônica decorrente do fluxo retrógrado de parte do conteúdo gastroduodenal para o esôfago e/ou órgãos adjacentes, com espectro variável de sintomas esofágicos e extraesofágicos, com ou sem lesão tecidual. Acomete 12–20% da população brasileira, com discreto predomínio em mulheres > 45 anos; incidência crescente com obesidade e hábitos ocidentais.<\/p><p><b>Causas (slide 42):<\/b> o <b>relaxamento transitório do EEI<\/b> é a mais comum; hérnia de hiato por deslizamento (fator de associação, não de obrigação); aumento da pressão intra-abdominal (obesidade, gestação); cirurgias (sleeve); esclerodermia e lúpus (hipotonia do EEI e do corpo).<\/p><p><b>Sintomas:<\/b> típicos — pirose (80%) e regurgitação (54%); atípicos/extraesofágicos — tosse, rouquidão, broncoaspiração, sibilância, globus.<\/p><p><b>Diagnóstico:<\/b> paciente < 40 anos, sintomas típicos e <b>sem sinais de alarme<\/b> → <b>prova terapêutica com IBP em dose plena por 4 semanas<\/b> + medidas comportamentais; respondeu = DRGE (manter 8–12 semanas). Sinais de alarme (complemento — consenso brasileiro): disfagia, odinofagia, perda ponderal, anemia, hemorragia, vômitos persistentes, história familiar de câncer, sintomas de longa duração ou início após 40–45 anos → <b>EDA<\/b>. A EDA mostra esofagite (50–60%), estenose (10%), Barrett (10–20%), exclui tumor e avalia hérnia — mas tem baixa sensibilidade (EDA normal não exclui DRGE). A <b>pHmetria de 24 h é o padrão-ouro<\/b> (EDA normal, sintomas atípicos, intratabilidade, pré-operatório, recidiva pós-operatória), mas não detecta refluxo não ácido — papel da <b>impedanciometria<\/b>. A <b>manometria<\/b> é essencial no pré-operatório (exclui acalasia e orienta a técnica).<\/p><p><b>Tratamento:<\/b> medidas comportamentais (cabeceira elevada ~15 cm, não deitar 2 h após refeições, refeições menores, rever fármacos que relaxam o EEI, cessar tabagismo, perder peso); IBP é 1ª linha por 8–12 semanas no mínimo; resposta incompleta → dose dobrada por mais 12 semanas; esofagite erosiva grave → EDA de controle. <b>Cirurgia<\/b>: intratabilidade (baixa resposta após 6 meses), dependência prolongada de IBP (jovem), lesão grave (úlcera, estenose, Barrett, esofagite refratária). Técnica: hiatoplastia + fundoplicatura laparoscópica (Nissen 360°, Toupet 270°, Lind 240°). Pré-operatório obrigatório: EDA + pHmetria + manometria.<\/p>", "tab": [{"cap": "Exames complementares na DRGE (Aula 6)", "h": ["Exame", "Indicações", "O que fornece"], "r": [["EDA", "Teste terapêutico negativo, atípicos, sinais de alarme", "Esofagite, estenose, Barrett; exclui tumor; baixa sensibilidade para DRGE"], ["pHmetria 24 h", "EDA normal, atípicos, intratabilidade, pré-operatório, recidiva", "Padrão-ouro; pH < 4 = refluxo ácido; não detecta não ácido"], ["Impedanciometria", "Sintomas persistentes com EDA e pHmetria normais", "Refluxo não ácido; tipo (líquido/gás)"], ["Manometria", "Dúvida, disfagia sem lesão, pré-operatório", "Tônus EES/EEI, peristalse → escolhe técnica; exclui acalasia"]]}, {"cap": "Fundoplicaturas e Los Angeles", "h": ["Item", "Valor"], "r": [["Nissen (total)", "360°"], ["Toupet (parcial posterior)", "270°"], ["Lind (parcial)", "240°"], ["Los Angeles A / B", "Erosões ≤ 5 mm / > 5 mm sem continuidade entre pregas"], ["Los Angeles C / D", "Contínuas < 75% / ≥ 75% da circunferência (graves)"]]}], "cmp": {"cap": "pHmetria × impedanciometria × manometria", "h": ["Exame", "Pergunta que responde", "Limite"], "r": [["pHmetria", "Há refluxo ácido patológico?", "Não vê refluxo não ácido"], ["Impedanciometria", "Há refluxo, inclusive não ácido?", "Complementa a pHmetria"], ["Manometria", "Como está a motilidade? Há acalasia?", "Não diagnostica refluxo"]]}, "flow": {"cap": "Fluxograma 15 — investigação da DRGE (Aula 6, slides 44–48)", "s": ["Pirose e/ou regurgitação", "< 40 anos, típicos, SEM alarme → IBP dose plena 4 semanas + medidas → responde: DRGE, manter 8–12 semanas", "Sem resposta, alarme, ≥ 40 anos ou atípicos → EDA", "EDA normal / dúvida / pré-operatório → pHmetria 24 h (padrão-ouro) ± impedanciometria + manometria", "Indicação cirúrgica → hiatoplastia + fundoplicatura (Nissen 360°, Toupet 270°, Lind 240°)"]}, "imgs": ["c-040-051", "c-041-052"], "refs": ["Portes M. Aula 6 — DRGE. FCMMG; 2026.", "Moraes-Filho JPP et al. Arq Gastroenterol. 2010;47(1):99–115 (sinais de alarme — complemento).", "Lundell LR et al. Gut. 1999;45(2):172–180 (Los Angeles — complemento)."]}, {"id": "P01", "d": "per", "n": "Mapa geral da perícia: áreas, conceitos e tipos de perícia", "short": "Mapa geral e conceitos de perícia", "pages": [2, 3], "aula": "Aulas 01 e 09 (mapa da disciplina)", "rev": "<p>Toda a disciplina gira em torno de uma pergunta: <b>qual é o enquadramento jurídico de um fato médico?<\/b> O perito traduz achado clínico em linguagem que a autoridade (juiz, INSS, DETRAN, empresa) consegue usar. O raciocínio segue a sequência <b>CLÍNICA → FUNÇÃO → DIREITO<\/b> (o tripé do caso “48-F” da Aula 03): primeiro o diagnóstico e o prognóstico, depois a repercussão funcional (o que a pessoa consegue ou não fazer), por fim o enquadramento normativo.<\/p><p><b>Definição de perícia médica (Hermes R. de Alcântara):<\/b> todo ato propedêutico ou exame feito por médico com a finalidade de colaborar com autoridades administrativas, policiais ou judiciárias na formação de juízo. <b>Requisitos de boa prova (Genival Veloso de França):<\/b> técnicas médico-legais reconhecidas, meios subsidiários adequados (tecnologia) e protocolo com roteiros atualizados.<\/p><p><b>Perícia judicial × administrativa:<\/b> criminal, cível, trabalhista e previdenciária judicial correm em processo; a previdenciária no INSS e a de tráfego no DETRAN são administrativas. <b>Perícia direta<\/b>: examina-se o indivíduo. <b>Perícia indireta<\/b>: sem exame, a partir de prontuários, documentos e registros (ex.: paciente já falecido).<\/p><p><b>Interfaces que o médico assistente toca sem perceber:<\/b> isenção de IR, isenção de IPI, passe livre, seguros, incapacidade para AVDs — todas exigem que o atestado ou relatório traduza a função, não só o diagnóstico.<\/p>", "tab": [{"cap": "Áreas periciais (mapa geral do resumo)", "h": ["Área", "Quem pede / onde", "Pergunta central", "Norma-mãe"], "r": [["Previdenciária", "INSS (administrativa) e Justiça Federal", "Há incapacidade? DID/DII? Nexo com o trabalho? Sequela?", "Lei 8.213/91; Decreto 3.048/99; IN 31/2008"], ["Trabalhista", "Justiça do Trabalho", "Nexo causal/concausal com o trabalho? Dano? Culpa do empregador?", "CF art. 7º; CLT cap. V; NRs; Lei 8.213 arts. 19–21"], ["Cível", "Justiça Estadual (e Federal)", "Ato ilícito/falha? Dano corporal/estético? Nexo? Déficit?", "CC arts. 186, 187, 927, 949, 950; CPC 156, 465, 473"], ["Tráfego", "DETRAN (administrativa)", "Aptidão psicofísica para dirigir?", "Protocolos do exame de aptidão"], ["Inclusão / PcD", "Empresa, concurso, Receita, INSS", "Enquadra-se como deficiência?", "LBI 13.146/2015; Lei 8.213 art. 93; Leis 14.126/2021, 14.768/2023, 12.764/2012"], ["Criminal", "IML / Polícia", "Natureza e gravidade da lesão; causa da morte", "CP / CPP"]]}], "cmp": {"cap": "Tipos de perícia", "h": ["Critério", "Uma ponta", "Outra ponta"], "r": [["Ambiente", "Judicial (processo: criminal, cível, trabalhista, previde
