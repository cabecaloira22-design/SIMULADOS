essor: “ainda que você empreenda, terá de recolher INSS”. Isenção de carência (acidente) não substitui a filiação: primeiro é preciso ser segurado.<\/p>", "mud": [["Estudante contribuinte facultativo", "Segurado: benefício por incapacidade sem carência (acidente)", "Qualidade de segurado"], ["Renda familiar muito baixa", "Avaliar BPC como PcD", "Assistência social"], ["Plano de saúde", "Atendimento pode ser pela saúde suplementar", "Lei 9.656/98"]], "arm": "Confundir isenção de carência com dispensa de filiação.", "ouro": "Saúde é para todos; previdência é para quem contribui.", "m2": ["Qual lei rege o SUS e qual rege os planos de saúde?", "Lei 8.080/90 (SUS) e Lei 9.656/98 (planos)."], "n": ["SUS: universal e gratuito.", "Previdência: contributiva.", "Acidente dispensa carência, não filiação.", "BPC possível se PcD e miserável.", "Recolher INSS mesmo empreendendo."]}, {"id": "P04-Q03", "t": "P04", "sub": "Atribuições do INSS", "comp": "Competências institucionais", "rac": "Discriminação", "dif": "fácil", "p": [5], "q": "Trabalhador acidentado pergunta ao médico quais despesas o INSS cobrirá. Qual é, de fato, atribuição do INSS?", "o": [["Pagar benefício por incapacidade ao segurado", "É a atribuição destacada; insalubridade, cirurgia e assistência médica são de outros responsáveis."], ["Custear a cirurgia e a internação do acidentado", "Assistência médica é do SUS ou do plano de saúde."], ["Pagar o adicional de insalubridade durante o afastamento", "Insalubridade é verba trabalhista paga pelo empregador."], ["Prestar atendimento odontológico e fisioterápico gratuito", "Assistência médica/odontológica não é atribuição do INSS."]], "pista": "INSS paga benefício; não presta assistência.", "pp": ["INSS: benefícios (incapacidade, aposentadorias, auxílio-acidente).", "Empregador: insalubridade, primeiros 15 dias.", "SUS/plano: atendimento e cirurgia."], "ap": "<p>Esse é um ponto clássico de prova (questão de residência comentada no resumo, aqui recriada de forma original): o candidato tende a atribuir ao INSS tudo o que envolve o acidentado. No fluxo do acidente do trabalho, o atendimento médico inicial é do SUS/plano, não do INSS.<\/p>", "mud": [["Pergunta sobre quem paga os 15 primeiros dias", "Empresa", "Regra operacional"], ["Pergunta sobre reabilitação profissional", "Benefício/serviço do RGPS", "Reabilitação"], ["Pergunta sobre cirurgia", "SUS ou plano", "Assistência médica"]], "arm": "Atribuir ao INSS a assistência médica.", "ouro": "INSS paga benefício; SUS trata; empregador paga insalubridade.", "m2": ["Quem paga o salário do 1º ao 15º dia de afastamento do empregado?", "A empresa."], "n": ["INSS: benefícios.", "Não paga insalubridade.", "Não custeia cirurgia.", "Não presta assistência médica.", "Empresa paga os 15 primeiros dias."]}, {"id": "P04-Q04", "t": "P04", "sub": "Espécies B31 × B91", "comp": "Classificação de benefícios", "rac": "Classificação", "dif": "fácil", "p": [5], "q": "Segurado celetista afastado por tendinite incapacitante reconhecidamente relacionada ao trabalho. Qual espécie de benefício temporário é devida?", "o": [["B91 — auxílio por incapacidade temporária acidentário", "Doença do trabalho equipara-se a acidente do trabalho; final 9 = acidentário."], ["B31 — auxílio por incapacidade temporária previdenciário", "B31 é para causa comum, não ocupacional."], ["B94 — auxílio-acidente acidentário", "Auxílio-acidente exige sequela consolidada; aqui há incapacidade temporária."], ["B92 — aposentadoria por incapacidade permanente acidentária", "Não há incapacidade definitiva nem insuscetibilidade de reabilitação."]], "pista": "Final 1 = comum; final 9 = acidentário.", "pp": ["Doença do trabalho (art. 20, II) = acidente do trabalho.", "Incapacidade temporária → auxílio por incapacidade.", "Acidentário → B91.", "Auxílio-acidente só após consolidação com sequela."], "ap": "<p>Resumo do professor: “B91, B31, B32, B92... B94, B36”. Pares: 31/91 temporário; 32/92 permanente; 36/94 auxílio-acidente. O pecúlio foi extinto e aparece como distrator frequente.<\/p>", "mud": [["Mesma tendinite sem relação com o trabalho", "B31", "Causa comum"], ["Sequela consolidada que reduz capacidade", "B94", "Auxílio-acidente acidentário"], ["Incapacidade definitiva, sem reabilitação", "B92", "Aposentadoria acidentária"]], "arm": "Escolher auxílio-acidente para incapacidade temporária.", "ouro": "Temporário: 31/91. Permanente: 32/92. Sequela: 36/94.", "m2": ["Qual o código do auxílio-acidente de causa comum?", "B36."], "n": ["B31 / B91: temporário.", "B32 / B92: permanente.", "B36 / B94: auxílio-acidente.", "Final 1 comum; 9 acidentário.", "Pecúlio extinto."]}, {"id": "P04-Q05", "t": "P04", "sub": "Auxílio-acidente", "comp": "Conceito e requisitos", "rac": "Compreensão", "dif": "média", "p": [5, 8], "q": "Qual característica define o auxílio-acidente no RGPS, segundo o material?", "o": [["Indenização por sequela definitiva consolidada que reduz a capacidade habitual", "Não exige incapacidade total; exige sequela consolidada com redução da capacidade."], ["Substituição integral do salário enquanto durar a incapacidade temporária do segurado", "Isso descreve o auxílio por incapacidade temporária."], ["Benefício pago apenas quando o segurado fica totalmente incapaz para qualquer trabalho", "Incapacidade total e definitiva é aposentadoria."], ["Indenização paga pelo empregador diretamente ao trabalhador acidentado, sem nenhuma participação do INSS", "É benefício previdenciário pago pelo INSS."]], "pista": "Sequela consolidada que reduz.", "pp": ["Fato gerador: acidente de qualquer natureza.", "Requisito: consolidação das lesões.", "Resultado: sequela definitiva que reduz a capacidade habitual.", "Natureza: indenizatória.", "Situações: Anexo III do Decreto 3.048 (9 quadros)."], "ap": "<p>Decreto 3.048, art. 104: concedido ao segurado empregado (inclusive doméstico), avulso e segurado especial. Por isso o PJ/contribuinte individual não tem auxílio-acidente (complemento do resumo: art. 18 §1º). Exemplo: olho com AV corrigida ≤ 0,2 após trauma (quadro 01, alínea a).<\/p>", "mud": [["Lesão ainda em tratamento", "Ainda não cabe auxílio-acidente", "Sem consolidação"], ["Contribuinte individual (PJ)", "Sem direito ao auxílio-acidente", "Categoria excluída"], ["Incapacidade total permanente", "Aposentadoria", "Outro benefício"]], "arm": "Achar que auxílio-acidente exige incapacidade total.", "ouro": "Auxílio-acidente: consolidou, ficou sequela, reduziu capacidade.", "m2": ["Segurado com perda de visão de um olho (AV 0,1) e outro olho normal. Qual benefício após consolidação?", "Auxílio-acidente (Anexo III, quadro 01, alínea a)."], "n": ["Indenização por sequela.", "Após consolidação.", "Reduz capacidade habitual.", "Anexo III: 9 quadros.", "Empregado, doméstico, avulso, segurado especial."]}, {"id": "P04-Q06", "t": "P04", "sub": "Aposentadoria por incapacidade permanente", "comp": "Requisitos", "rac": "Compreensão", "dif": "média", "p": [5], "q": "Sobre a aposentadoria por incapacidade permanente (ex-invalidez), assinale a correta.", "o": [["Exige incapacidade definitiva, sem possibilidade de reabilitação, e é revisável", "Pode haver reversão; o exame médico-pericial é obrigatório."], ["É definitiva e irreversível, não estando sujeita a revisões periódicas após a concessão pelo INSS", "Está sujeita a revisões e pode ser revertida."], ["Basta o diagnóstico de doença grave listada, sem avaliação da capacidade", "Doença ≠ incapacidade; a perícia é obrigatória."], ["Permite manter atividade remunerada em outra função compatível", "Exige afastamento de todas as atividades."]], "pista": "Definitiva + sem reabilitação.", "pp": ["Incapacidade definitiva.", "Insuscetível de reabilitação.", "Afastamento de todas as atividades.", "Revisões; possível reversão.", "Majoração de 25% se dependência de terceiros (Anexo I)."], "ap": "<p>Atenção à doença pré-existente: se a doença é anterior à filiação, não há direito, salvo se a incapacidade decorrer de progressão ou agravamento posterior. Por isso DID e DII são datas centrais no laudo.<\/p>", "mud": [["Possibilidade de reabilitação", "Reabilitação, não aposentadoria", "Insuscetibilidade ausente"], ["Dependência de terceiros", "Majoração de 25%", "Anexo I"], ["Melhora clínica", "Reversão possível", "Revisões"]], "arm": "Achar que a aposentadoria é irreversível.", "ouro": "Aposentadoria por incapacidade: definitiva, sem reabilitação, revisável.", "m2": ["Quais as espécies previdenciária e acidentária?", "B32 e B92."], "n": ["Definitiva e sem reabilitação.", "Afastamento total.", "Sujeita a revisões.", "Pode haver reversão.", "B32 / B92."]}, {"id": "P04-Q07", "t": "P04", "sub": "Carência e isenção", "comp": "Regras de acesso", "rac": "Aplicação", "dif": "média", "p": [5], "q": "Segurada com 5 contribuições recebe diagnóstico de neoplasia maligna e fica incapaz. Outro segurado, com 3 contribuições, fratura o fêmur em acidente doméstico. Quanto à carência do auxílio por incapacidade temporária:", "o": [["Ambos isentos: neoplasia maligna é listada e acidente de qualquer natureza dispensa", "A regra é 12 contribuições, com exceções para acidentes e doenças graves listadas."], ["Ambos precisam de 12 contribuições, pois a isenção de carência vale apenas para acidente do trabalho", "Acidente de qualquer natureza dispensa carência."], ["Só o acidentado está isento; neoplasia exige 12 contribuições como qualquer doença", "Neoplasia maligna está entre as doenças isentas."], ["Nenhum está isento, pois a carência foi elevada para 24 contribuições após a EC 103/2019", "A regra citada é de 12 contribuições."]], "pista": "Acidente qualquer + lista de doenças graves.", "pp": ["Regra: 12 contribuições.", "Exceção 1: acidente de qualquer natureza (inclusive do trabalho).", "Exceção 2: doenças graves listadas (neoplasia maligna, tuberculose ativa, hanseníase, cardiopatia grave, Parkinson, AIDS etc.).", "Ambos isentos."], "ap": "<p>Isenção de carência não dispensa a qualidade de segurado nem a perícia: é preciso estar filiado e ter incapacidade comprovada. A lista inclui também alienação mental, cegueira, paralisia irreversível e incapacitante, espondiloartrose anquilosante, nefropatia grave, Paget avançado, contaminação por radiação e hepatopatia grave.<\/p>", "mud": [["Hérnia discal com 5 contribuições", "Precisa de 12", "Fora da lista"], ["Não segurado com câncer", "Sem benefício previdenciário", "Falta filiação"], ["Tuberculose ativa", "Isenta", "Na lista"]], "arm": "Limitar a isenção ao acidente do trabalho.", "ouro": "Carência 12, salvo acidente de qualquer natureza e doenças graves listadas.", "m2": ["Cite três doenças da lista de isenção de carência.", "Exemplos: tuberculose ativa, neoplasia maligna, cardiopatia grave."], "n": ["Carência: 12 contribuições.", "Acidente de qualquer natureza: isento.", "Doenças graves listadas: isentas.", "Filiação continua necessária.", "Perícia obrigatória."]}, {"id": "P04-Q08", "t": "P04", "sub": "Dias 1–15 e 16º dia", "comp": "Regras operacionais", "rac": "Aplicação", "dif": "fácil", "p": [5], "q": "Empregado celetista recebe atestado de 30 dias por pneumonia. Como se divide a responsabilidade pelo afastamento?", "o": [["Empresa paga os primeiros 15 dias; do 16º em diante, perícia do INSS", "Regra operacional do auxílio por incapacidade temporária."], ["O INSS paga desde o primeiro dia, mediante simples apresentação do atestado", "Os 15 primeiros dias são da empresa."], ["A empresa paga todos os 30 dias, pois o INSS só atua após 60 dias de afastamento", "O marco é o 16º dia."], ["O SUS paga o afastamento, pois a pneumonia foi tratada na rede pública de saúde", "SUS não paga benefício."]], "pista": "15 + perícia.", "pp": ["Dias 1–15: empresa (atestado).", "16º dia em diante: perícia INSS.", "Benefício mantido enquanto persistir a incapacidade."], "ap": "<p>O benefício é mantido enquanto (a) persistir a incapacidade, (b) não houver reabilitação e (c) não for reconhecida invalidez. Números para fixar: “15 dias empresa paga / 16º dia INSS”.<\/p>", "mud": [["Afastamento de 10 dias", "Só a empresa paga", "Abaixo de 15"], ["Contribuinte individual", "Sem empresa pagadora", "Outra categoria"], ["Persistência após perícia", "Prorrogação/novo exame", "Incapacidade persiste"]], "arm": "Achar que o INSS paga desde o 1º dia para o empregado.", "ouro": "Empregado: 15 dias empresa, depois INSS com perícia.", "m2": ["Quais as três condições para manter o benefício?", "Persistir a incapacidade, não haver reabilitação e não ser reconhecida invalidez."], "n": ["Dias 1–15: empresa.", "16º: perícia INSS.", "Mantido enquanto incapaz.", "Atestado inicia o processo.", "Perícia decide."]}, {"id": "P04-Q09", "t": "P04", "sub": "Doença pré-existente à filiação", "comp": "Requisitos", "rac": "Raciocínio temporal", "dif": "difícil", "p": [5], "q": "Pessoa com cardiopatia diagnosticada antes de se filiar ao RGPS começa a contribuir e, anos depois, a doença progride e a torna incapaz. Qual a regra apresentada em aula?", "o": [["Não dá direito, salvo se a incapacidade decorrer de agravamento após a filiação", "A DII posterior à filiação, por agravamento, preserva o direito."], ["Doença pré-existente nunca gera direito, mesmo com agravamento posterior comprovado por perícia", "O agravamento é exceção expressa."], ["Qualquer doença pré-existente gera direito imediato desde a filiação, sem perícia", "Não; e a perícia é obrigatória."], ["A data de início da doença é irrelevante para o direito ao benefício", "DID e DII são centrais."]], "pista": "O que importa é quando começou a incapacidade.", "pp": ["DID: antes da filiação.", "DII: após a filiação, por progressão.", "Exceção do agravamento → direito preservado.", "Perito fixa DID e DII com documentos."], "ap": "<p>Daí a importância da cronologia na perícia (tripé clínica → função → direito). No caso 48-F, sintomas anteriores ao vínculo pesaram contra o nexo causal pleno com o trabalho — situação análoga de raciocínio temporal.<\/p>", "mud": [["Incapacidade já presente antes da filiação", "Sem direito", "DII anterior"], ["DII posterior por agravamento", "Com direito", "Exceção"], ["Falta de documentos da DID", "Perícia reconstrói pela história", "Prova"]], "arm": "Ignorar a exceção do agravamento.", "ouro": "Doença antiga não impede o direito se a incapacidade nasceu depois, por agravamento.", "m2": ["O que significam DID e DII?", "Data de início da doença e data de início da incapacidade."], "n": ["Pré-existente: regra é não ter direito.", "Exceção: progressão/agravamento.", "DID ≠ DII.", "Perito fixa as datas.", "Cronologia decide."]}, {"id": "P04-Q10", "t": "P04", "sub": "DER, DID e DII", "comp": "Conceitos operacionais", "rac": "Discriminação", "dif": "fácil", "p": [5], "q": "No laudo previdenciário, o perito registra que a doença começou em março de 2022, a incapacidade em agosto de 2024 e o pedido foi protocolado em setembro de 2024. Essas datas correspondem, respectivamente, a:", "o": [["DID, DII e DER", "Data de início da doença, de início da incapacidade e de entrada do requerimento."], ["DII, DID e DER", "A doença precede a incapacidade."], ["DER, DII e DID", "DER é o requerimento."], ["DID, DER e DII", "A ordem dos dados não confere."]], "pista": "Doença → Incapacidade → Entrada do Requerimento.", "pp": ["DID: início da doença (março/2022).", "DII: início da incapacidade (agosto/2024).", "DER: entrada do requerimento (setembro/2024)."], "ap": "<p>A perícia previdenciária, em cinco passos: analisa a situação do segurado (diagnóstico e prognóstico), estabelece ou não o nexo técnico, verifica se a doença é incapacitante, fixa a DID e fixa a DII.<\/p>", "mud": [["DII anterior à filiação", "Pode excluir o direito", "Doença/incapacidade pré-existente"], ["DII posterior por agravamento", "Direito preservado", "Exceção"], ["Sem incapacidade", "Sem benefício", "Doença ≠ incapacidade"]], "arm": "Trocar DID e DII.", "ouro": "DID (doença) → DII (incapacidade) → DER (pedido).", "m2": ["Quais os cinco passos da perícia previdenciária?", "Analisar a situação, estabelecer nexo, verificar se incapacita, fixar DID e fixar DII."], "n": ["DER: requerimento.", "DID: doença.", "DII: incapacidade.", "Nexo técnico.", "Doença incapacitante?"]}, {"id": "P04-Q11", "t": "P04", "sub": "Majoração de 25%", "comp": "Anexo I", "rac": "Aplicação", "dif": "média", "p": [6], "q": "Aposentado por incapacidade permanente com qual das situações abaixo faz jus ao acréscimo de 25% previsto no Anexo I do Decreto 3.048/99?", "o": [["Paralisia dos dois membros inferiores", "Está no Anexo I (dependência permanente de terceiros)."], ["Perda de três dedos da mão dominante", "O Anexo I exige perda de 9 dedos ou mais."], ["Visão monocular com o outro olho normal", "O Anexo I fala em cegueira total."], ["Hipertensão e diabetes sem complicações", "Não gera dependência de terceiros."]], "pista": "Dependência permanente de terceiros.", "pp": ["Fundamento: dependência de terceiros.", "Lista: cegueira total; perda de 9 dedos ou mais; paralisia de 2 MMSS ou 2 MMII; perda de MMII acima dos pés com prótese impossível; alteração mental grave; permanência contínua no leito; incapacidade permanente para AVDs; entre outras.", "Paralisia de 2 MMII → majoração."], "ap": "<p>Aqui entra o critério de AVDs: na Aula 04, “incapacidade é para a ocupação, não para AVDs” — a dependência para AVDs é o critério da majoração de 25%, não do benefício em si.<\/p>", "mud": [["Cegueira total bilateral", "Majoração", "Na lista"], ["Perda de 1 mão e 2 pés", "Majoração", "Na lista, mesmo com prótese possível"], ["Visão monocular", "Não", "Não é cegueira total"]], "arm": "Confundir a majoração com o auxílio-acidente.", "ouro": "25% a mais = precisa de alguém para viver.", "m2": ["Doença que exige permanência contínua no leito gera majoração?", "Sim, consta do Anexo I."], "n": ["Anexo I: majoração de 25%.", "Dependência permanente de terceiros.", "Cegueira total; 9 dedos; paralisias.", "Alteração mental grave.", "Incapacidade para AVDs."]}, {"id": "P04-Q12", "t": "P04", "sub": "Regimes previdenciários", "comp": "Classificação", "rac": "Discriminação", "dif": "fácil", "p": [5], "q": "Uma servidora pública estadual estatutária adoece e fica incapaz. Em qual regime previdenciário ela se enquadra, segundo a aula?", "o": [["Regime Próprio de Previdência Social (RPPS) do respectivo ente", "Servidores públicos têm seguridade própria de cada ente."], ["Regime Geral (RGPS), gerido pelo INSS, como todos os trabalhadores", "RGPS abrange celetistas, contribuintes individuais e segurados especiais."], ["Assistência social (BPC), por ser servidora pública", "BPC é assistencial, para PcD ou idoso sem meios."], ["Nenhum regime, pois servidores não têm previdência", "Têm regimes próprios."]], "pista": "Estatutária ≠ celetista.", "pp": ["RGPS: iniciativa privada, contribuintes individuais, segurados especiais (INSS).", "RPPS: servidores públicos federais, estaduais, municipais.", "Servidora estatutária → RPPS."], "ap": "<p>A distinção importa para o perito: as regras de benefício e de perícia do RPPS seguem a legislação do ente, enquanto o RGPS segue a Lei 8.213/91 e o Decreto 3.048/99.<\/p>", "mud": [["Empregada celetista de empresa pública", "RGPS", "Vínculo celetista"], ["Médico PJ", "RGPS (contribuinte individual)", "Recolhe como sócio"], ["Lavrador em economia familiar", "RGPS (segurado especial)", "Contribui sobre a produção"]], "arm": "Colocar todo trabalhador no INSS.", "ouro": "Estatutário: regime próprio. Celetista e autônomo: RGPS.", "m2": ["Quem gere o RGPS?", "O INSS."], "n": ["RGPS: INSS.", "Celetistas, contribuintes individuais, segurados especiais.", "RPPS: servidores estatutários.", "Cada ente gere o seu.", "Regras diferentes."]}, {"id": "P04-Q13", "t": "P04", "sub": "Fluxo do acidente do trabalho", "comp": "Sequência de benefícios", "rac": "Sequência", "dif": "difícil", "p": [6, 8], "q": "Trabalhador de 35 anos, com carteira assinada, amputa três dedos da mão dominante em acidente de trabalho. Qual sequência previdenciária é coerente com o caso da aula?", "o": [["CAT → 15 dias pela empresa → perícia → B91 sem carência → reabilitação → B94 após consolidação", "Fluxo resolvido na aula; a sequela de quirodáctilos enquadra-se no Anexo III, quadro 5."], ["B94 desde o primeiro dia, dispensando o período de auxílio temporário, pois a amputação é definitiva", "Primeiro há incapacidade temporária (B91); o auxílio-acidente vem após consolidação."], ["B31 com carência de 12 contribuições, por se tratar de lesão de mão e não de doença ocupacional", "É acidentário (B91) e isento de carência."], ["Aposentadoria por incapacidade permanente imediata, pela perda funcional da mão dominante", "Não há incapacidade total insuscetível de reabilitação."]], "pista": "Temporário primeiro, sequela depois.", "pp": ["CAT pelo empregador.", "Dias 1–15: empresa.", "Perícia INSS → B91 (acidente dispensa carência).", "Reabilitação profissional se necessário.", "Consolidação → sequela → B94 (Anexo III, quadro 5).", "Atendimento médico: SUS/plano."], "ap": "<p>O caso mostra a diferença entre incapacidade temporária (tratamento, cicatrização) e sequela definitiva (redução da capacidade). Ambos os benefícios podem aparecer na mesma história, em momentos distintos.<\/p>", "mud": [["Mesmo acidente em PJ", "Sem B94; auxílio por incapacidade comum se contribuinte", "Categoria"], ["Acidente fora do trabalho", "B31 → B36", "Causa comum"], ["Sem sequela após consolidação", "Sem auxílio-acidente", "Sem redução"]], "arm": "Pular a fase temporária e conceder auxílio-acidente de imediato.", "ouro": "Acidente: B91 enquanto trata; B94 quando a sequela consolida.", "m2": ["Qual quadro do Anexo III trata de perdas de segmentos de membros?", "Quadro 05."], "n": ["CAT pela empresa.", "B91 sem carência.", "Reabilitação profissional.", "B94 após consolidação.", "Anexo III, quadro 5 (segmentos)."]}, {"id": "P04-Q14", "t": "P04", "sub": "Dado epidemiológico da aula", "comp": "Dados da Previdência", "rac": "Memória com compreensão", "dif": "média", "p": [6], "q": "Sobre os benefícios por transtornos mentais e comportamentais concedidos pelo INSS em 2025, segundo o dado apresentado em aula, qual afirmação é correta?", "o": [["Foram 546.254 concessões, alta de 15,66% sobre 2024, lideradas por SP e MG", "Dados do Boletim Estatístico citado na aula (SP 149.375; MG 83.321; RS 46.738)."], ["Houve redução de cerca de 15% em relação a 2024, com predomínio na região Norte", "Houve aumento, com SP e MG à frente."], ["Os transtornos mentais deixaram de gerar benefícios após a EC 103/2019", "Continuam gerando benefícios."], ["A espécie mais concedida foi a aposentadoria por incapacidade permanente acidentária", "A aula cita o auxílio por incapacidade previdenciário como o mais concedido."]], "pista": "Mais de meio milhão, em alta.", "pp": ["Total: 546.254.", "Variação: +15,66%.", "Estados: SP, MG, RS.", "Espécie mais concedida: auxílio por incapacidade previdenciário."], "ap": "<p>O dado contextualiza o caso 48-F: sofrimento psíquico com dor crônica e sobreposição diagnóstica é um dos cenários mais frequentes e difíceis da perícia previdenciária.<\/p>", "mud": [["Pergunta sobre capítulo da CID", "Capítulo V (F00–F99)", "Transtornos mentais"], ["Pergunta sobre nexo com o trabalho", "Avaliar Schilling, Listas B e C", "Nexo técnico"], ["Pergunta sobre espécie", "B31 é a mais concedida", "Previdenciário"]], "arm": "Inverter a tendência (queda × alta).", "ouro": "Transtornos mentais: mais de 546 mil benefícios em 2025, em alta.", "m2": ["Qual a formulação mais defensável no caso 48-F?", "Síndrome dolorosa + transtornos psiquiátricos sobrepostos, com nexo no máximo concausal."], "n": ["546.254 em 2025.", "+15,66% vs 2024.", "SP, MG, RS lideram.", "Capítulo V da CID-10.", "Auxílio previdenciário é o mais concedido."]}, {"id": "P05-Q01", "t": "P05", "sub": "Doença × incapacidade", "comp": "Conceito", "rac": "Compreensão conceitual", "dif": "média", "p": [6], "q": "Um operário teve amputação traumática da mão dominante há dois anos; o coto está cicatrizado, sem dor e sem infecção. Ele não consegue mais operar a prensa que operava. Qual afirmação traduz corretamente o conceito da Aula 04?", "o": [["Há incapacidade para a função sem doença ativa", "Sequela consolidada pode impedir a função sem processo patológico em curso."], ["Não há incapacidade, porque não há doença ativa", "Confunde doença com incapacidade."], ["Só há incapacidade se houver dependência para AVDs", "AVD é critério da majoração de 25%, não da incapacidade laborativa."], ["Há doença ativa, pois toda amputação é doença em evolução", "Lesão consolidada não é doença ativa."]], "pista": "Sequela consolidada ≠ doença ativa.", "pp": ["Doença: perda da homeostasia (dano estrutural/funcional em curso).", "Incapacidade: impossibilidade de desempenhar a função específica.", "Amputação consolidada: sem doença ativa, com incapacidade para a prensa.", "Diabético controlado: doença sem incapacidade (exemplo inverso)."], "ap": "<p>A distinção é o coração da perícia previdenciária: <b>sem incapacidade, sem benefício<\/b>, mesmo com doença; e incapacidade pode existir sem doença ativa. Por isso o laudo precisa descrever a função concreta exigida na ocupação.<\/p>", "mud": [["Diabético controlado em função administrativa", "Doença sem incapacidade", "Função preservada"], ["Mesma amputação em telefonista", "Pode não haver incapacidade para a função", "Exigência diferente"], ["Sequela que reduz a capacidade, sem impedir", "Auxílio-acidente", "Redução, não impedimento"]], "arm": "Exigir doença ativa para reconhecer incapacidade.", "ouro": "Doença e incapacidade são coisas diferentes.", "m2": ["Diabético bem controlado pede benefício. Qual o raciocínio?", "Doença presente, mas sem limitação funcional não há incapacidade nem benefício."], "n": ["Doença ≠ incapacidade.", "Incapacidade sem doença ativa é possível.", "Doença sem incapacidade é comum.", "Incapacidade é para a ocupação.", "Sem incapacidade, sem benefício."]}, {"id": "P05-Q02", "t": "P05", "sub": "Risco incluído no conceito de incapacidade", "comp": "Conceito", "rac": "Aplicação", "dif": "difícil", "p": [6], "q": "Motorista de ônibus com epilepsia de crises frequentes, não controladas, está fisicamente apto a dirigir entre as crises. Pela definição oficial apresentada em aula, há incapacidade para a função?", "o": [["Sim: o risco palpável para si ou para terceiros integra o conceito de incapacidade", "O conceito inclui implicitamente o risco, quando palpável e indiscutível."], ["Não: só existe incapacidade quando o déficit está presente no exato momento do exame pericial", "A definição incorpora o risco da permanência na atividade."], ["Não: risco a terceiros é assunto do DETRAN e não interessa à perícia previdenciária", "O risco a terceiros integra o conceito de incapacidade."], ["Sim, mas apenas se houver também dependência para as atividades da vida diária", "AVD não é requisito da incapacidade laborativa."]], "pista": "Risco palpável da permanência.", "pp": ["Função: dirigir ônibus com passageiros.", "Crises frequentes não controladas → risco palpável.", "Definição inclui risco para si/terceiros e de agravamento.", "Conclusão: incapacidade para a função."], "ap": "<p>Definição: impossibilidade de desempenhar as funções específicas de uma atividade, em consequência de alterações morfopsicofisiológicas por doença ou acidente; o risco de vida, para si ou terceiros, ou de agravamento, que a permanência na atividade possa acarretar, está implicitamente incluído, desde que palpável e indiscutível.<\/p>", "mud": [["Crises controladas há anos", "Risco não palpável", "Pode haver capacidade"], ["Mesmo paciente em função administrativa", "Possível capacidade", "Risco menor na função"], ["Risco apenas teórico", "Não basta", "Precisa ser palpável e indiscutível"]], "arm": "Ignorar o risco a terceiros no conceito de incapacidade.", "ouro": "Se trabalhar coloca vidas em risco palpável, há incapacidade.", "m2": ["Um cardiopata grave sem sintomas em repouso pode ser incapaz para trabalho pesado?", "Sim, se o risco de agravamento/morte com o esforço for palpável e indiscutível."], "n": ["Risco para si incluído.", "Risco para terceiros incluído.", "Risco de agravamento incluído.", "Precisa ser palpável e indiscutível.", "Avaliar a função concreta."]}, {"id": "P05-Q03", "t": "P05", "sub": "Doença profissional (art. 20, I)", "comp": "Classificação legal", "rac": "Classificação", "dif": "média", "p": [7], "q": "Trabalhador de pedreira há 20 anos desenvolve silicose. Pela Lei 8.213/91, como se classifica?", "o": [["Doença profissional (art. 20, I), peculiar à atividade", "Silicose na pedreira é o exemplo da aula."], ["Doença do trabalho (art. 20, II), por condições do ambiente", "É a categoria de PAIR e LER/DORT."], ["Acidente típico (art. 19), por ser evento no trabalho", "Silicose é processo crônico."], ["Doença comum, sem relação com o trabalho, pela longa latência", "A exposição à sílica é a causa."]], "pista": "Peculiar à atividade.", "pp": ["Agente: sílica livre (Lista A → silicose).", "Exposição inerente à atividade.", "Art. 20, I: doença profissional.", "Schilling I: trabalho é causa necessária."], "ap": "<p>Diferença sutil: doença profissional (art. 20, I) é típica da atividade (a profissão “produz” a doença); doença do trabalho (art. 20, II) decorre das condições em que o trabalho é realizado. Ambas equiparam-se a acidente do trabalho.<\/p>", "mud": [["PAIR em ambiente ruidoso", "Doença do trabalho (art. 20, II)", "Condição especial"], ["Queda de andaime", "Acidente típico (art. 19)", "Evento"], ["Assalto ao caixa", "Equiparado (art. 21)", "Agressão no trabalho"]], "arm": "Trocar art. 20, I por art. 20, II.", "ouro": "Profissional: a profissão produz. Do trabalho: o ambiente produz.", "m2": ["Em que grupo de Schilling se enquadra a silicose?", "Grupo I — trabalho como causa necessária (nexo causal)."], "n": ["Art. 19: acidente típico.", "Art. 20, I: doença profissional.", "Art. 20, II: doença do trabalho.", "Art. 21: equiparados.", "Silicose: Schilling I."]}, {"id": "P05-Q04", "t": "P05", "sub": "Doença do trabalho (art. 20, II)", "comp": "Classificação legal", "rac": "Classificação", "dif": "média", "p": [7], "q": "Operadora de telemarketing em ambiente com ruído intenso e sem pausas desenvolve perda auditiva induzida por ruído (PAIR). Como se classifica?", "o": [["Doença do trabalho (art. 20, II), por condições especiais do ambiente", "PAIR em ambiente ruidoso é o exemplo da aula, assim como LER/DORT."], ["Doença profissional (art. 20, I), por ser peculiar a toda a atividade de telemarketing", "Ruído decorre do ambiente, não da natureza da profissão."], ["Acidente típico, por ter sido percebida subitamente em um dia de trabalho", "A PAIR é progressiva."], ["Doença degenerativa, que a Lei 8.213 exclui do conceito de doença do trabalho", "Não se trata de doença degenerativa."]], "pista": "Condição ambiental especial.", "pp": ["Fator: ruído do ambiente.", "Não é peculiar a toda a profissão.", "Art. 20, II: doença do trabalho.", "Equipara-se a acidente do trabalho."], "ap": "<p>Na prova, o par mais cobrado é: silicose = profissional; PAIR e LER/DORT = do trabalho. A empresa responde pelas medidas coletivas e individuais de proteção (art. 19, §1º).<\/p>", "mud": [["Silicose", "Doença profissional", "Art. 20, I"], ["Perda auditiva sem exposição", "Doença comum", "Sem nexo"], ["Tendinite por movimentos repetitivos", "Doença do trabalho", "LER/DORT"]], "arm": "Classificar PAIR como profissional.", "ouro": "PAIR e LER/DORT: doença do trabalho.", "m2": ["Quem responde pela adoção de EPIs e medidas coletivas?", "A empresa (Lei 8.213, art. 19, §1º)."], "n": ["Art. 20, II: condições especiais.", "PAIR.", "LER/DORT.", "Equipara-se a acidente.", "Empresa responde pela proteção."]}, {"id": "P05-Q05", "t": "P05", "sub": "Comunicação de Acidente de Trabalho", "comp": "Obrigações legais", "rac": "Aplicação", "dif": "média", "p": [7], "q": "Em uma siderúrgica, explosão causa a morte de um trabalhador celetista e fere outros dois. Sobre a CAT, segundo o art. 22 da Lei 8.213/91 apresentado em aula:", "o": [["Feridos: até o 1º dia útil seguinte; morte: comunicação imediata", "Prazos do art. 22."], ["Em todos os casos o prazo é de 30 dias, após conclusão da investigação interna", "Não há prazo de 30 dias."], ["Só a empresa pode emitir; se ela se omitir, não há mais como comunicar", "Na omissão, podem emitir o acidentado, dependentes, sindicato, médico assistente ou autoridade pública."], ["A CAT é dispensada quando há óbito, pois o caso segue direto para a esfera penal e o inquérito policial", "Na morte, a comunicação é imediata."]], "pista": "1º dia útil; morte: imediato.", "pp": ["Prazo geral: 1º dia útil seguinte.", "Morte: imediato à autoridade.", "Omissão: acidentado, dependentes, sindicato, médico, autoridade pública.", "Benefício em caso de morte: pensão (pecúlio foi extinto)."], "ap": "<p>O médico assistente também pode emitir a CAT — ponto pouco lembrado. A indenização civil por morte depende de ação judicial própria; não decorre automaticamente da investigação.<\/p>", "mud": [["Empresa se recusa a emitir", "Médico assistente ou sindicato emitem", "Omissão"], ["Acidente de trajeto", "Também gera CAT", "Equiparado"], ["Doença do trabalho", "CAT também", "Equipara-se a acidente"]], "arm": "Achar que só a empresa pode emitir a CAT.", "ouro": "CAT: 1º dia útil; morte, imediato; omissão, qualquer legitimado emite.", "m2": ["O médico que atendeu o acidentado pode emitir a CAT?", "Sim, se a empresa se omitir."], "n": ["Até o 1º dia útil.", "Morte: imediato.", "Omissão: acidentado, dependentes, sindicato, médico, autoridade.", "Pecúlio extinto.", "Indenização civil exige ação."]}, {"id": "P05-Q06", "t": "P05", "sub": "Acidentes equiparados", "comp": "Classificação legal", "rac": "Aplicação", "dif": "média", "p": [7, 9], "q": "Caixa de supermercado é agredida durante assalto no local de trabalho e desenvolve transtorno de estresse pós-traumático incapacitante. Qual o enquadramento e o benefício?", "o": [["Acidente equiparado, com nexo; auxílio por incapacidade acidentário (B91)", "Agressão no trabalho é equiparada; TEPT após assalto consta da Lista B."], ["Doença comum psiquiátrica, sem nexo, com auxílio previdenciário B31", "O evento ocorreu no trabalho e há nexo pela Lista B."], ["Reserva de vaga em cota de PcD, por ser deficiência psicossocial permanente", "TEPT incapacitante não é, por si, deficiência permanente para cota."], ["Pecúlio por acidente, pago de uma só vez ao trabalhador, mais o salário integral pelo empregador", "Pecúlio foi extinto."]], "pista": "Agressão no trabalho = equiparado.", "pp": ["Evento: assalto com agressão no trabalho.", "Art. 21: equiparado a acidente.", "Lista B: TEPT (F43.1) ← assalto no trabalho (Z56.6).", "Incapaz → auxílio acidentário (B91)."], "ap": "<p>Erros frequentes neste tipo de questão (recriados a partir do banco comentado): afirmar que o TEPT “dura só 6 meses” por definição, oferecer pecúlio (extinto) ou cota de PcD (não se trata de deficiência permanente).<\/p>", "mud": [["Agressão fora do trabalho, sem relação", "Doença comum", "Sem nexo"], ["Acidente no trajeto casa–trabalho", "Equiparado", "Art. 21"], ["Sequela consolidada que reduz capacidade", "Auxílio-acidente", "Após consolidação"]], "arm": "Dar ao TEPT um prazo fixo de duração ou indicar pecúlio.", "ouro": "Assalto no trabalho → TEPT → nexo (Lista B) → B91.", "m2": ["Em qual lista do Anexo II o TEPT aparece ligado ao assalto no trabalho?", "Lista B (doença → agentes)."], "n": ["Art. 21: equiparados.", "Agressão no trabalho.", "Trajeto.", "TEPT na Lista B.", "B91 se incapaz."]}, {"id": "P05-Q07", "t": "P05", "sub": "Schilling III — agravamento", "comp": "Nexo", "rac": "Classificação", "dif": "média", "p": [7], "q": "Trabalhadora com asma desde a infância, bem controlada, passa a ter crises graves após ser transferida para setor com exposição a poeira irritante. Na classificação de Schilling, como se enquadra o papel do trabalho?", "o": [["Schilling III — agravamento de doença já estabelecida", "A asma pré-existe; o trabalho a descompensou."], ["Schilling I — causa necessária", "A asma existia antes da exposição."], ["Schilling II — fator contributivo de doença nova", "No II, o trabalho contribui para doença que surge; aqui é agravamento de doença prévia."], ["Sem nexo, porque a doença é anterior ao vínculo", "Agravamento configura concausa."]], "pista": "Já existia e piorou.", "pp": ["Doença prévia: asma.", "Exposição: poeira irritante.", "Efeito: descompensação.", "Schilling III: concausa por agravamento."], "ap": "<p>Schilling: I — causa necessária (silicose, asbestose, chumbo) → causal; II — contributivo, não principal (coronariopatia, varizes) → concausal; III — desperta distúrbio latente ou agrava doença estabelecida (asma, transtorno mental pré-existente) → concausal por agravamento.<\/p>", "mud": [["Silicose em pedreira", "Schilling I", "Causa necessária"], ["Coronariopatia em motorista estressado", "Schilling II", "Multicausal"], ["Transtorno mental prévio que descompensa", "Schilling III", "Agravamento"]], "arm": "Negar nexo porque a doença é anterior.", "ouro": "Já tinha e o trabalho piorou: Schilling III.", "m2": ["Varizes em balconista que trabalha em pé e tem história familiar. Grupo?", "Schilling II."], "n": ["I: causa necessária.", "II: contributivo.", "III: agravamento/latente.", "I = causal; II e III = concausal.", "Doença prévia não exclui concausa."]}, {"id": "P05-Q08", "t": "P05", "sub": "Schilling II — multicausal", "comp": "Nexo", "rac": "Classificação", "dif": "média", "p": [7], "q": "Motorista de caminhão com hipertensão, tabagismo e dislipidemia, submetido a jornadas extenuantes, sofre infarto. O trabalho é apontado como um dos fatores. Em que grupo de Schilling se enquadra?", "o": [["Schilling II — fator contributivo de doença multicausal", "Doença coronariana é exemplo clássico de Schilling II."], ["Schilling I — o trabalho é causa necessária da doença coronariana", "Sem o trabalho, a doença poderia existir pelos outros fatores."], ["Schilling III — o trabalho agrava doença psiquiátrica latente", "O caso é cardiovascular multicausal."], ["Fora de Schilling, pois infarto é sempre doença comum", "Pode haver concausa."]], "pista": "Vários fatores, o trabalho é um deles.", "pp": ["Fatores extralaborais fortes.", "Trabalho contribui, mas não é necessário.", "Schilling II → concausal.", "Perícia descreve o peso relativo."], "ap": "<p>O modelo de Dahlgren & Whitehead ajuda a contextualizar: camadas de idade/sexo/hereditariedade, estilo de vida, redes sociais e comunitárias, condições de vida e trabalho e condições socioeconômicas/culturais/ambientais. O trabalho é uma camada, não a única.<\/p>", "mud": [["Intoxicação por chumbo", "Schilling I", "Causa necessária"], ["Asma prévia agravada", "Schilling III", "Agravamento"], ["Sem relação com o trabalho", "Sem nexo", "Doença comum"]], "arm": "Classificar como I tudo o que tem algum componente laboral.", "ouro": "Multicausal com trabalho no meio: Schilling II.", "m2": ["Qual a camada do modelo de Dahlgren & Whitehead que inclui hábitos como tabagismo?", "Estilo de vida dos indivíduos."], "n": ["Schilling II: contributivo.", "Doenças multicausais.", "Coronariopatia, varizes.", "Concausal.", "Dahlgren & Whitehead contextualiza."]}, {"id": "P05-Q09", "t": "P05", "sub": "Listas A e B do Anexo II", "comp": "Referencial técnico", "rac": "Discriminação", "dif": "difícil", "p": [7], "q": "O perito parte do diagnóstico de leucemia em um trabalhador e procura, no Decreto 3.048/99, quais agentes podem causá-la, encontrando o benzeno. Qual lista ele consultou?", "o": [["Lista B — leitura doença → agentes", "Lista B parte da doença para os agentes (exemplificativa e complementar)."], ["Lista A — leitura doença → agentes", "Lista A é agente → doenças."], ["Lista C — intervalo CID × CNAE", "Lista C cruza CID com atividade econômica."], ["Anexo IV — agentes nocivos", "Anexo IV classifica agentes para aposentadoria especial."]], "pista": "Começou pela doença.", "pp": ["Ponto de partida: doença (leucemia).", "Busca: agentes (benzeno).", "Sentido doença → agente = Lista B.", "Lista A: agente → doenças (ex.: sílica → silicose)."], "ap": "<p>Exemplos da aula: Lista A — sílica → silicose; arsênio → angiossarcoma hepático; mercúrio → dermatite de contato e episódios depressivos. Lista B — leucemias ← benzeno; TEPT ← assalto no trabalho. Lista C (Dec. 6.957/2009) — CID × CNAE → NTEP.<\/p>", "mud": [["Partir do agente sílica", "Lista A", "Agente → doença"], ["Cruzar CID com CNAE da empresa", "Lista C (NTEP)", "Estatístico"], ["Agente nocivo para aposentadoria especial", "Anexo IV", "Outra finalidade"]], "arm": "Inverter A e B.", "ouro": "A: do agente à doença. B: da doença ao agente. C: estatística CID × CNAE.", "m2": ["Qual doença a Lista A associa ao arsênio, conforme a aula?", "Angiossarcoma hepático (C22.3), entre outras."], "n": ["Lista A: agente → doença.", "Lista B: doença → agente.", "Lista C: CID × CNAE.", "A e B: nexo técnico profissional.", "C: NTEP."]}, {"id": "P05-Q10", "t": "P05", "sub": "NTEP", "comp": "Nexo técnico epidemiológico", "rac": "Compreensão", "dif": "difícil", "p": [8], "q": "Sobre o nexo técnico epidemiológico previdenciário (NTEP), assinale a correta.", "o": [["Presunção estatística CID × CNAE (Lista C), que a empresa pode contestar", "Decreto 3.048, art. 337, §3º; é uma das três espécies de nexo da IN 31/2008."], ["É prova absoluta de nexo causal, que não admite contestação pela empresa", "É presunção relativa."], ["Depende obrigatoriamente de vistoria do posto de trabalho pelo perito", "É estatístico, independente de vistoria."], ["Aplica-se somente a acidentes típicos com lesão traumática, nunca a doenças ocupacionais", "Aplica-se a doenças conforme cruzamento CID × CNAE."]], "pista": "Estatística, presunção, contestável.", "pp": ["Espécies (IN 31/2008): profissional/do trabalho; individual (equiparado); epidemiológico.", "NTEP: Lista C, CID × CNAE.", "Considera-se estabelecido o nexo (art. 337, §3º).", "Presunção relativa: empresa contesta."], "ap": "<p>Exemplo da aula: F40–F48 (transtornos ansiosos) cruzados com determinados CNAE. O NTEP inverte o ônus: o nexo é presumido e cabe à empresa demonstrar o contrário.<\/p>", "mud": [["Silicose em pedreira", "Nexo profissional (Lista A)", "Não estatístico"], ["Acidente de trajeto", "Nexo individual (equiparado)", "Evento"], ["Empresa prova ausência de exposição", "Presunção afastada", "Contestação"]], "arm": "Tratar NTEP como prova absoluta.", "ouro": "NTEP: presunção estatística, contestável.", "m2": ["Quais são as três espécies de nexo técnico?", "Profissional/do trabalho, individual (equiparado) e epidemiológico."], "n": ["NTEP: Lista C.", "CID × CNAE.", "Presunção relativa.", "Empresa pode contestar.", "IN 31/2008, art. 3º."]}, {"id": "P05-Q11", "t": "P05", "sub": "Auxílio-acidente visual", "comp": "Anexo III, quadro 01", "rac": "Aplicação de critério", "dif": "média", "p": [8], "q": "Após trauma ocular perfurante no trabalho, já consolidado, segurado tem olho esquerdo com acuidade corrigida 0,1 e olho direito 1,0. Qual o enquadramento?", "o": [["Auxílio-acidente (B94): AV corrigida ≤ 0,2 no olho acidentado (Anexo III, quadro 01)", "Sequela definitiva que reduz a capacidade; não há incapacidade total."], ["Aposentadoria por incapacidade permanente, pela perda da visão de um olho", "O olho direito normal afasta incapacidade total."], ["Nenhum benefício, pois a visão binocular não é exigida em nenhuma atividade", "Há sequela enquadrável; e funções com binocularidade exigem reabilitação."], ["Majoração de 25% na aposentadoria, por cegueira de um olho após acidente", "Majoração é para cegueira total e aposentados."]], "pista": "≤ 0,2 no olho acidentado.", "pp": ["Lesão consolidada.", "OE 0,1 ≤ 0,2 → quadro 01, alínea (a).", "OD normal → sem incapacidade total.", "Acidente do trabalho → B94.", "Função com binocularidade (motorista) → discutir reabilitação."], "ap": "<p>Alíneas do quadro 01: (a) AV corrigida ≤ 0,2 no olho acidentado; (b) ≤ 0,5 em ambos, quando ambos acidentados; (c) ≤ 0,5 no acidentado quando o outro já é ≤ 0,5; (d) lesão da musculatura extrínseca com paresia/paralisia; (e) lesão bilateral das vias lacrimais ou unilateral com fístula. AV pela escala de Wecker, em décimos, após correção.<\/p>", "mud": [["OE corrigido 0,4 e OD 1,0", "Não preenche a alínea (a)", "Acima de 0,2"], ["Ambos os olhos acidentados com 0,4", "Alínea (b)", "≤ 0,5 em ambos"], ["Paralisia de músculo extrínseco", "Alínea (d)", "Motilidade"]], "arm": "Conceder aposentadoria por perda de um olho com o outro normal.", "ouro": "Olho acidentado ≤ 0,2 com correção: auxílio-acidente.", "m2": ["Em que escala a AV é medida para o Anexo III?", "Escala de Wecker, em décimos, após correção."], "n": ["Quadro 01: aparelho visual.", "(a) ≤ 0,2 no olho acidentado.", "Após consolidação.", "B94 se acidente do trabalho.", "Binocularidade: reabilitação."]}, {"id": "P05-Q12", "t": "P05", "sub": "Cotas do art. 93", "comp": "Inclusão no trabalho", "rac": "Cálculo", "dif": "fácil", "p": [8], "q": "Empresa com 480 empregados deve reservar qual percentual de seus cargos para beneficiários reabilitados ou pessoas com deficiência habilitadas (Lei 8.213/91, art. 93)?", "o": [["3%", "Faixa de 201 a 500 empregados."], ["2%", "2% é a faixa de 100 a 200."], ["4%", "4% é a faixa de 501 a 1.000."], ["5%", "5% vale para 1.001 ou mais."]], "pista": "201 a 500 = 3%.", "pp": ["Obrigatório a partir de 100 empregados.", "100–200: 2%.", "201–500: 3%.", "501–1.000: 4%.", "≥ 1.001: 5%."], "ap": "<p>§1º do art. 93: a dispensa imotivada de PcD/reabilitado (contrato por prazo indeterminado, ou fim de contrato determinado > 90 dias) só pode ocorrer após a contratação de substituto em condição semelhante. A Lei 13.146/2015 é o Estatuto da Pessoa com Deficiência (LBI).<\/p>", "mud": [["150 empregados", "2%", "Faixa inicial"], ["900 empregados", "4%", "501–1.000"], ["80 empregados", "Sem obrigação legal de cota", "Abaixo de 100"]], "arm": "Errar a faixa por arredondamento.", "ouro": "2–3–4–5%: até 200, até 500, até 1.000, acima.", "m2": ["Empresa quer demitir sem justa causa um empregado PcD. O que a lei exige antes?", "Contratação de substituto em condição semelhante."], "n": ["≥ 100 empregados.", "2% / 3% / 4% / 5%.", "Faixas 200, 500, 1.000.", "Dispensa só com substituto.", "LBI = Lei 13.146/2015."]}, {"id": "P05-Q13", "t": "P05", "sub": "Cronologia e concausa (caso 48-F)", "comp": "Nexo", "rac": "Integração clínica–função–direito", "dif": "difícil", "p": [6], "q": "Monitora de cães (escala 12×36) voltou ao mercado após 20 anos. Tinha dor difusa e sintomas intestinais 4 anos antes do vínculo; depois recebeu diagnóstico de fibromialgia e tem depressão e pânico. Qual conclusão sobre nexo é mais defensável?", "o": [["Sem nexo causal pleno pela cronologia; no máximo, concausa (Schilling III)", "Sintomas anteriores ao vínculo pesam contra causa; agravamento pode ser discutido."], ["Nexo causal pleno, porque os sintomas pioraram durante o período de trabalho na empresa", "Piora não equivale a causa; a cronologia é anterior."], ["Nexo pelo NTEP, que se aplica automaticamente a toda fibromialgia", "NTEP depende de CID × CNAE e é presunção contestável."], ["Ausência absoluta de qualquer relação, porque fibromialgia nunca se relaciona ao trabalho", "O agravamento pode ser discutido."]], "pista": "Começou antes do vínculo.", "pp": ["CLÍNICA: síndrome dolorosa + transtornos psiquiátricos sobrepostos.", "FUNÇÃO: incapacidade resulta da soma.", "DIREITO: cronologia anterior ao vínculo.", "Conclusão: sem causa; discutir concausa (agravamento)."], "ap": "<p>A formulação clínica mais defensável na aula foi “síndrome dolorosa + transtornos psiquiátricos sobrepostos”, porque nenhum diagnóstico isolado explica todo o quadro. Esse cuidado na formulação é que permite enquadrar corretamente o nexo.<\/p>", "mud": [["Sintomas iniciados após o vínculo, com exposição relevante", "Nexo pode ser discutido como causal/concausal", "Cronologia favorável"], ["Sem agravamento laboral demonstrável", "Sem nexo", "Falta relação"], ["Diagnóstico único bem definido", "Formulação mais simples", "Sem sobreposição"]], "arm": "Confundir piora durante o trabalho com causa.", "ouro": "Cronologia antes do vínculo: concausa no máximo.", "m2": ["Qual o tripé usado no caso 48-F?", "Clínica → função → direito."], "n": ["Cronologia é decisiva.", "Piora ≠ causa.", "Schilling III: agravamento.", "Formulação sobreposta.", "Tripé clínica–função–direito."]}, {"id": "P05-Q14", "t": "P05", "sub": "Tendinite relacionada ao trabalho", "comp": "Enquadramento", "rac": "Aplicação", "dif": "média", "p": [8], "q": "Trabalhadora de 50 anos de uma indústria de móveis, celetista e com contribuições regulares, desenvolve tendinite de flexores relacionada ao trabalho repetitivo e fica temporariamente incapaz. Qual o benefício adequado?", "o": [["Auxílio por incapacidade temporária acidentário (B91)", "Doença do trabalho equipara-se a acidente; há incapacidade temporária."], ["Auxílio-acidente (B94), pois a lesão decorre do trabalho repetitivo", "Exige sequela consolidada."], ["Auxílio por incapacidade temporária previdenciário (B31), por ser doença e não acidente", "Há nexo laboral; o benefício é acidentário."], ["Pecúlio por doença ocupacional, pago em parcela única", "Pecúlio foi extinto."]], "pista": "Incapacidade temporária + nexo laboral.", "pp": ["Doença do trabalho (art. 20, II) → acidente do trabalho.", "Incapacidade temporária.", "Benefício: B91.", "B94 só após consolidação com sequela."], "ap": "<p>Essa é uma versão original de questão clássica de residência (PSU-MG), em que os distratores habituais são auxílio-acidente (precoce), B31 (sem nexo) e pecúlio (extinto).<\/p>", "mud": [["Sequela consolidada com perda de força", "B94 (Anexo III, quadro 8)", "Redução da capacidade"], ["Tendinite sem relação com o trabalho", "B31", "Causa comum"], ["Incapacidade definitiva e sem reabilitação", "B92", "Permanente acidentária"]], "arm": "Antecipar o auxílio-acidente.", "ouro": "Incapaz agora por doença do trabalho: B91.", "m2": ["Qual quadro do Anexo III trata de redução da força ou da capacidade funcional dos membros?", "Quadro 08."], "n": ["LER/DORT = doença do trabalho.", "Equipara-se a acidente.", "Incapacidade temporária: B91.", "Sequela: B94.", "Pecúlio extinto."]}, {"id": "P06-Q01", "t": "P06", "sub": "Notação de Snellen", "comp": "Interpretação", "rac": "Compreensão", "dif": "fácil", "p": [9], "q": "No exame de acuidade visual, um olho é registrado como 20/200. O que essa notação significa?", "o": [["O examinado lê a 20 pés o que uma pessoa com visão normal leria a 200 pés", "Numerador = distância do examinado; denominador = distância em que o normal lê a menor linha lida."], ["O examinado lê a 200 pés o que o normal leria a 20 pés, indicando visão superior à média", "Inverte a lógica."], ["O examinado acertou 20 de 200 letras apresentadas na tabela", "Não é proporção de acertos."], ["A acuidade corresponde a 20% de cegueira, segundo a tabela de Wecker", "20/200 ≈ 0,1 decimal; eficácia ~20% — não é “20% de cegueira”."]], "pista": "Numerador: onde o examinado está.", "pp": ["Tabela a 20 pés (6 m).", "Denominador: distância em que o normal leria.", "20/200 = decimal 0,1.", "Testar cada olho, direita para esquerda."], "ap": "<p>Abreviaturas: AV, AO, OD, OE, SC (sem correção), CC (com correção), CD (conta dedos), PL (percebe luz), SPL/NPL (não percebe luz). Abaixo de conta dedos a ±2 m registra-se PL ou SPL.<\/p>", "mud": [["20/20", "Normal (1,0)", "Referência"], ["20/400", "0,05 — cegueira legal", "Limite"], ["Conta dedos a 2 m", "Abaixo da tabela", "Registro especial"]], "arm": "Inverter numerador e denominador.", "ouro": "20/X: X é onde o normal leria.", "m2": ["Qual a distância padrão da tabela de Snellen?", "20 pés (cerca de 6 metros)."], "n": ["Numerador: 20 pés.", "Denominador: distância do normal.", "20/200 = 0,1.", "Cada olho separado.", "SC, CC, CD, PL, SPL."]}, {"id": "P06-Q02", "t": "P06", "sub": "Conversão 20/30", "comp": "Conversão", "rac": "Cálculo", "dif": "fácil", "p": [9], "q": "Qual a conversão de 20/30 em decimal e em eficácia visual, conforme o “ponto de fixação” da Aula 05?", "o": [["≈ 0,6 e 91%", "20/30 = 0,6 = 91% foi destacado pelo professor."], ["0,3 e 60%", "0,3 é 20/60."], ["0,8 e 95%", "0,8 corresponde a 20/25."], ["0,1 e 20%", "0,1 é 20/200."]], "pista": "20/30 = 0,6 = 91%.", "pp": ["20/20 = 1,0 = 100%.", "20/25 = 0,8 = 95%.", "20/30 ≈ 0,6 = 91%.", "20/200 = 0,1 = 20%."], "ap": "<p>Essa conversão foi decisiva no Caso I da Aula 11: candidato com 20/30 em cada olho sem correção (≈ 0,6) atendia ao edital que exigia ≥ 0,5 sem correção (com correção atingindo 1,0) e foi considerado APTO.<\/p>", "mud": [["20/60", "0,3", "Limite superior de baixa visão"], ["20/400", "0,05", "Cegueira legal"], ["Edital exige ≥ 0,5 SC", "20/30 atende", "0,6 ≥ 0,5"]], "arm": "Confundir 20/30 com 20/60.", "ouro": "20/30 = 0,6 = 91%.", "m2": ["Candidato com 20/40 em cada olho sem correção. Atende edital de ≥ 0,5?", "Sim: 20/40 = 0,5."], "n": ["20/20 = 1,0.", "20/25 = 0,8.", "20/30 ≈ 0,6 (91%).", "20/60 = 0,3.", "20/400 = 0,05."]}, {"id": "P06-Q03", "t": "P06", "sub": "Cegueira legal", "comp": "Critério de deficiência", "rac": "Aplicação de critério", "dif": "média", "p": [10, 17], "q": "Aposentada com ceratocone pede isenção de IR por cegueira. Com melhor correção: OD 20/80 e OE 20/200. Qual a conclusão pericial correta?", "o": [["Não há cegueira: o corte é ≤ 0,05 com melhor correção; 20/200 = 0,1", "Também não há cegueira monocular; OD é visão subnormal."], ["Há cegueira monocular, pois 20/200 já é considerado cegueira em qualquer contexto", "Cegueira legal é ≤ 0,05."], ["Há cegueira bilateral, pela soma das duas acuidades reduzidas", "Não se somam acuidades."], ["A conclusão depende apenas da opinião do perito sobre o sofrimento da paciente", "O critério legal é objetivo."]], "pista": "Cegueira legal: ≤ 0,05.", "pp": ["Converter: 20/200 = 0,1; 20/80 ≈ 0,25.", "Critério: ≤ 0,05 com melhor correção.", "Nenhum olho preenche.", "Sem enquadramento para isenção por cegueira."], "ap": "<p>Caso II da Aula 11: além da conclusão técnica, o perito não responde a quesitos fora do pleito (“há incapacidade para o trabalho?”) — limite da designação. E o argumento “a diferença foi pouca” não altera um critério objetivo.<\/p>", "mud": [["OE 20/400 com melhor correção", "Cegueira monocular", "Preenche ≤ 0,05"], ["Ambos ≤ 0,05", "Cegueira", "Critério"], ["AV entre 0,3 e 0,05 no melhor olho", "Baixa visão", "Outra categoria"]], "arm": "Chamar 20/200 de cegueira.", "ouro": "Cegueira legal começa em 20/400 (0,05), com a melhor correção.", "m2": ["O que a OMS/CID-10 considera cegueira?", "AV < 20/400 ou campo visual < 10° no melhor olho."], "n": ["Cegueira: ≤ 0,05.", "Melhor correção.", "20/200 = 0,1.", "Critério objetivo.", "Limite da designação."]}, {"id": "P06-Q04", "t": "P06", "sub": "Baixa visão", "comp": "Critério de deficiência", "rac": "Classificação", "dif": "média", "p": [10], "q": "No laudo de caracterização de deficiência visual, candidata apresenta, com a melhor correção, AV de 0,2 no melhor olho e campo visual normal. Como se classifica?", "o": [["Baixa visão — AV entre 0,3 e 0,05 no melhor olho", "0,2 está na faixa de baixa visão."], ["Cegueira, pois toda AV abaixo de 0,3 é cegueira legal", "Cegueira é ≤ 0,05."], ["Visão normal, já que o campo visual está preservado", "O critério de AV é independente."], ["Visão monocular, pela Lei 14.126/2021", "Visão monocular exige cegueira legal em um olho."]], "pista": "Entre 0,3 e 0,05.", "pp": ["Melhor olho, melhor correção.", "0,2 entre 0,3 e 0,05.", "Classificação: baixa visão.", "Deficiência visual para fins de inclusão."], "ap": "<p>Categorias do laudo: cegueira (≤ 0,05), baixa visão (0,3 a 0,05), campo visual somado ≤ 60° e visão monocular. Cuidado: os critérios da OMS/CID-10 usam cortes ligeiramente diferentes (baixa visão < 20/60 ou CV < 20°).<\/p>", "mud": [["AV 0,04", "Cegueira", "≤ 0,05"], ["AV 0,5 com CV somado de 50°", "Deficiência pelo campo", "CV ≤ 60°"], ["Um olho cego e outro normal", "Visão monocular", "Lei 14.126/2021"]], "arm": "Esquecer que o critério usa o melhor olho com a melhor correção.", "ouro": "Baixa visão: 0,3 a 0,05 no melhor olho.", "m2": ["Qual o critério de campo visual para deficiência?", "Somatória do campo em ambos os olhos ≤ 60°."], "n": ["Cegueira ≤ 0,05.", "Baixa visão 0,3–0,05.", "CV somado ≤ 60°.", "Visão monocular.", "Melhor olho, melhor correção."]}, {"id": "P06-Q05", "t": "P06", "sub": "Campo visual e glaucoma", "comp": "Aptidão funcional", "rac": "Aplicação", "dif": "difícil", "p": [10], "q": "Candidato à renovação de CNH profissional tem AV 20/25 em ambos os olhos, mas campimetria com escotomas arqueados e campo residual tubular bilateral por glaucoma avançado. Qual raciocínio é correto?", "o": [["AV normal não garante aptidão: o campo periférico é crítico para dirigir", "Visão é função, não só número; glaucoma compromete o campo periférico primeiro."], ["Está apto, pois a acuidade de 20/25 supera qualquer exigência de edital ou de protocolo de trânsito", "A acuidade isolada não basta."], ["O campo visual não é avaliado no exame de aptidão, apenas a acuidade e as cores", "Campo visual integra o protocolo."], ["Deve ser considerado cego legal pela presença de glaucoma", "Cegueira legal é critério de AV ≤ 0,05 ou de campo, não do diagnóstico."]], "pista": "Visão é função.", "pp": ["AV preservada.", "Campo tubular bilateral.", "Direção exige campo periférico.", "Inapto ou restrito conforme protocolo.", "Se CV somado ≤ 60°, também enquadra como deficiência para inclusão."], "ap": "<p>Ponto 1 da Aula 05: “visão é função, não só número”. Componentes do exame: acuidade, campo, motilidade, cores, estereopsia, ofuscamento e visão noturna. Condições que limitam o campo: glaucoma, neurite óptica.<\/p>", "mud": [["Campo normal e AV normal", "Apto", "Sem limitação"], ["Discromatopsia vermelho/verde", "Avaliar segundo o protocolo (semáforo)", "Visão de cores"], ["Visão monocular", "Perda de estereopsia; restrição conforme protocolo", "Binocularidade"]], "arm": "Liberar pelo número de acuidade.", "ouro": "Glaucoma: o campo reprova antes da acuidade.", "m2": ["Que teste de visão de cores foi citado e quantas placas tem?", "Ishihara, 32 placas."], "n": ["Visão é função.", "Glaucoma: campo periférico.", "Direção profissional exige campo.", "CV ≤ 60° = deficiência.", "Protocolo completo."]}, {"id": "P06-Q06", "t": "P06", "sub": "Visão monocular", "comp": "Legislação de inclusão", "rac": "Aplicação", "dif": "média", "p": [10], "q": "Candidato a concurso tem cegueira legal no olho direito (AV ≤ 0,05 com melhor correção) e olho esquerdo normal. Segundo a Lei 14.126/2021 citada em aula:", "o": [["É deficiência sensorial visual (visão monocular)", "A lei reconhece a visão monocular como deficiência."], ["Não é deficiência, porque o olho esquerdo é normal", "A lei passou a reconhecê-la."], ["É deficiência física, pela perda funcional de um órgão", "É sensorial visual."], ["Só é deficiência se houver também perda auditiva associada", "Não há essa exigência."]], "pista": "Um olho cego = monocular.", "pp": ["Critério: cegueira legal em um olho (≤ 0,05).", "Ou cegueira declarada por oftalmologista.", "Classificação: deficiência sensorial visual.", "Laudo oftalmológico."], "ap": "<p>A visão monocular aparece em dois lugares: no laudo de PcD (categoria IIIa) e na lista de isenção de IR (“cegueira, inclusive monocular”). A perda de estereopsia é a principal repercussão funcional.<\/p>", "mud": [["Olho com 0,1", "Não é cegueira legal", "Acima de 0,05"], ["Ambos ≤ 0,05", "Cegueira", "Bilateral"], ["Isenção de IR", "Cegueira monocular entra", "Lista de moléstias graves"]], "arm": "Exigir comprometimento bilateral.", "ouro": "Visão monocular é deficiência visual (Lei 14.126/2021).", "m2": ["Qual função visual se perde na visão monocular?", "A estereopsia (visão binocular de profundidade)."], "n": ["Lei 14.126/2021.", "Cegueira legal em um olho.", "Deficiência sensorial visual.", "Laudo oftalmológico.", "Perda de estereopsia."]}, {"id": "P06-Q07", "t": "P06", "sub": "Músculos extraoculares", "comp": "Anatomia funcional", "rac": "Associação", "dif": "média", "p": [9, 10], "q": "Paciente após trauma craniano tem dificuldade de abduzir o olho direito, com diplopia horizontal. Qual músculo e qual nervo estão provavelmente comprometidos?", "o": [["Reto lateral — nervo abducente (VI)", "Abdução é ação primária do reto lateral, inervado pelo VI."], ["Reto medial — nervo oculomotor (III)", "Reto medial aduz."], ["Oblíquo superior — nervo troclear (IV)", "Ação primária: intorção (secundária depressão e abdução), não a abdução pura."], ["Reto superior — nervo oculomotor (III)", "Ação primária: elevação."]], "pista": "Abduzir = reto lateral = VI.", "pp": ["Ação perdida: abdução.", "Músculo: reto lateral.", "Nervo: VI (abducente).", "Repercussão pericial: motilidade (Anexo III, quadro 01, alínea d)."], "ap": "<p>Tabela da aula: reto medial (adução, III); reto lateral (abdução, VI); reto superior (elevação; adução, intorção; III); reto inferior (depressão; adução, extorção; III); oblíquo superior (intorção; depressão, abdução; IV); oblíquo inferior (extorção; elevação, abdução; III).<\/p>", "mud": [["Dificuldade de aduzir", "Reto medial (III)", "Adução"], ["Intorção comprometida", "Oblíquo superior (IV)", "Troclear"], ["Paresia após acidente do trabalho, consolidada", "Anexo III, quadro 01, alínea (d)", "Musculatura extrínseca"]], "arm": "Associar o IV à abdução.", "ouro": "LR6 SO4, o resto é III.", "m2": ["Qual a ação primária do oblíquo inferior?", "Extorção (secundárias: elevação e abdução)."], "n": ["Reto lateral: abdução, VI.", "Oblíquo superior: intorção, IV.", "Demais: III.", "Motilidade intrínseca: pupila.", "Paresia consolidada → quadro 01 (d)."]}, {"id": "P06-Q08", "t": "P06", "sub": "Componentes do exame visual", "comp": "Protocolo", "rac": "Associação", "dif": "fácil", "p": [9], "q": "Qual associação entre teste do exame oftalmológico-legal e o que ele avalia está correta?", "o": [["Ishihara — visão de cores", "32 placas; detecta discromatopsias."], ["Campimetria — acuidade visual central", "Campimetria avalia campo visual."], ["Snellen — estereopsia", "Snellen mede acuidade."], ["Ofuscamento — motilidade ocular", "Ofuscamento avalia recuperação após flash."]], "pista": "Cores = Ishihara.", "pp": ["Acuidade: Snellen.", "Campo: isópteras, confrontação, campimetria.", "Motilidade: intrínseca e extrínseca.", "Cores: Ishihara.", "Estereopsia: binocularidade.", "Ofuscamento e visão noturna."], "ap": "<p>O ofuscamento e a visão noturna são cronometrados e, segundo a aula, não há parâmetro normativo fixo. Catarata e cegueira noturna são as condições que mais os afetam.<\/p>", "mud": [["Escotomas no campo", "Campimetria", "Campo visual"], ["Diplopia", "Motilidade", "Músculos"], ["Recuperação lenta após flash", "Ofuscamento", "Catarata"]], "arm": "Trocar campo por acuidade.", "ouro": "Cada teste, uma função: acuidade, campo, motilidade, cores, profundidade, ofuscamento.", "m2": ["Qual condição compromete a estereopsia?", "Visão monocular."], "n": ["Snellen: acuidade.", "Campimetria: campo.", "Ishihara: cores.", "Estereopsia: binocularidade.", "Ofuscamento: recuperação."]}, {"id": "P06-Q09", "t": "P06", "sub": "Bases fisiológicas da visão", "comp": "Fisiologia", "rac": "Memória com compreensão", "dif": "média", "p": [9], "q": "Sobre as bases fisiológicas apresentadas na Aula 05, assinale a correta.", "o": [["A córnea tem 40–45 D, e o diabetes pode oscilar a refração", "O cristalino responde por 12–14 D (acomodação); o diabetes altera índices refrativos."], ["O cristalino tem 40–45 D e a córnea apenas 12–14 D de poder dióptrico", "Inverte os valores."], ["A luz visível vai de 100 nm a 370 nm, no ultravioleta", "Vai de ~370 nm (violeta) a ~750 nm (vermelho)."], ["O diabetes não altera a refração, apenas a retina em fases tardias", "O diabetes oscila a refração."]], "pista": "Córnea é a lente mais forte.", "pp": ["Córnea: 40–45 D.", "Cristalino: 12–14 D (acomodação).", "Luz visível: 370–750 nm.", "Visão ≈ 80% da cognição do ambiente.", "Diabetes oscila a refração."], "ap": "<p>Implicação pericial: um diabético descompensado pode ter acuidade flutuante; o laudo deve registrar a condição metabólica e, se necessário, repetir a medida. A acuidade depende de fatores dióptricos, do estímulo (contraste, iluminação, tempo) e neurais (cones e bastonetes).<\/p>", "mud": [["Diabético com glicemia instável", "Repetir AV após controle", "Refração oscila"], ["Pergunta sobre acomodação", "Cristalino", "12–14 D"], ["Pergunta sobre fatores da acuidade", "Dióptricos, estímulo, neurais", "Multifatorial"]], "arm": "Inverter córnea e cristalino.", "ouro": "Córnea 40–45 D; cristalino 12–14 D.", "m2": ["Que tipos de fatores influenciam a acuidade visual?", "Dióptricos, do estímulo e neurais."], "n": ["Córnea 40–45 D.", "Cristalino 12–14 D.", "370–750 nm.", "Diabetes oscila a refração.", "Acuidade multifatorial."]}, {"id": "P06-Q10", "t": "P06", "sub": "Critério de edital (caso PMMG)", "comp": "Aplicação de critério normativo", "rac": "Cálculo + decisão", "dif": "difícil", "p": [17], "q": "Edital exige AV ≥ 0,5 em cada olho, separadamente, sem correção, desde que com correção atinja 1,0 em cada olho. O perito encontra: sem correção OD 20/30 e OE 20/30; com correção, 20/20 em ambos. Conclusão?", "o": [["Apto: 20/30 ≈ 0,6 ≥ 0,5 sem correção e 1,0 com correção", "Cumpre os dois requisitos do dispositivo legispericial."], ["Inapto: qualquer necessidade de correção óptica elimina o candidato", "O edital admite correção para atingir 1,0."], ["Inapto: 20/30 é inferior a 0,5 sem correção", "20/30 ≈ 0,6."], ["O perito deve declarar o critério do edital cientificamente inadequado e decidir por outro", "Não cabe ao perito julgar a norma (critério legispericial)."]], "pista": "0,6 ≥ 0,5 e corrige para 1,0.", "pp": ["Converter: 20/30 ≈ 0,6.", "Requisito 1: ≥ 0,5 SC em cada olho → cumpre.", "Requisito 2: CC 1,0 em cada olho → cumpre.", "Conclusão: APTO.", "Quesitos fora do meio probatório: responder com o limite (art. 473 §2º)."], "ap": "<p>Caso I da Aula 11: astigmatismo corrigível (−2,75 × 180). Quesitos ensinam limites: “o ambiente do exame do réu obedeceu ao edital?” — foge ao meio probatório, o perito não estava lá; “o índice é adequado cientificamente?” — critério legispericial; “a AV vai progredir?” — não há evidência; a perícia retrata o momento.<\/p>", "mud": [["SC 20/50 (0,4)", "Inapto", "Abaixo de 0,5"], ["CC só atinge 0,8", "Inapto", "Não atinge 1,0"], ["Quesito sobre progressão futura", "Sem evidência; retrata o momento", "Limite técnico"]], "arm": "Achar que o perito pode trocar o critério do edital.", "ouro": "Aplica-se o edital: 0,6 ≥ 0,5 e 1,0 corrigido = apto.", "m2": ["O perito pode afirmar que o exame feito pelo réu foi mal conduzido se não o presenciou?", "Não: foge ao meio probatório e aos limites da designação."], "n": ["Converter Snellen.", "Aplicar o critério do edital.", "Critério legispericial.", "Não opinar fora da designação.", "Perícia retrata o momento."]}, {"id": "P07-Q01", "t": "P07", "sub": "Deficiência auditiva: cálculo", "comp": "Aplicação de critério legal", "rac": "Cálculo", "dif": "média", "p": [10, 11], "q": "Candidata a vaga de PcD apresenta audiometria tonal (via aérea): OD 500 = 50, 1.000 = 45, 2.000 = 40, 3.000 = 40 dB; OE 500 = 45, 1.000 = 45, 2.000 = 40, 3.000 = 45 dB. Pela Lei 14.768/2023, ela se enquadra?", "o": [["Sim: médias de 43,75 dB em cada orelha, perda bilateral ≥ 41 dB", "OD (50+45+40+40)/4 = 43,75; OE (45+45+40+45)/4 = 43,75."], ["Não: a média deve ser calculada só em 500, 1.000 e 2.000 Hz, resultando abaixo de 41 dB", "A lei usa quatro frequências (500 a 3.000 Hz); e mesmo a tritonal daria ≥ 41 dB aqui."], ["Não: exige perda total bilateral para enquadrar", "Bilateral parcial ≥ 41 dB enquadra."], ["Sim, mas apenas pelo cálculo ponderado 2-4-3-1 da Tabela Brasileira", "O cálculo ponderado é do dano corporal, não da caracterização de PcD."]], "pista": "Média de 4 frequências, ≥ 41 dB bilateral.", "pp": ["Frequências: 500, 1.000, 2.000, 3.000 Hz.", "OD: 175/4 = 43,75 dB.", "OE: 175/4 = 43,75 dB.", "Bilateral ≥ 41 dB → enquadra."], "ap": "<p>O resumo observa que o slide ilustra a média tritonal (500/1.000/2.000), mas a regra legal atual usa as quatro frequências. Anexo obrigatório: audiometria tonal + vocal. Sequência do exame: prova da voz coloquial (triagem) → audiometria.<\/p>", "mud": [["Uma orelha com 43 dB e outra com 30 dB", "Não enquadra", "Unilateral só conta se total"], ["Perda total de uma orelha, outra normal", "Enquadra", "Unilateral total"], ["Avaliação de dano corporal", "Pesos 2-4-3-1 e 4.000 Hz", "Outro quadro jurídico"]], "arm": "Usar o cálculo do dano corporal no laudo de PcD.", "ouro": "PcD auditiva: média de 500–3.000 Hz ≥ 41 dB bilateral, ou perda total unilateral.", "m2": ["Qual exame deve ser anexado ao laudo de deficiência auditiva?", "Audiometria tonal e vocal."], "n": ["Lei 14.768/2023.", "500, 1.000, 2.000, 3.000 Hz.", "≥ 41 dB bilateral.", "Ou perda unilateral total.", "Audiometria tonal + vocal."]}, {"id": "P07-Q02", "t": "P07", "sub": "Perda unilateral parcial", "comp": "Aplicação de critério legal", "rac": "Discriminação", "dif": "difícil", "p": [10, 11], "q": "Candidato tem média de 62 dB na orelha esquerda e 20 dB na direita (audição normal). Ele se enquadra como deficiente auditivo pela Lei 14.768/2023?", "o": [["Não: a perda unilateral só caracteriza deficiência se for total", "Unilateral parcial não preenche; bilateral exigiria ambas ≥ 41 dB."], ["Sim: basta uma orelha com média ≥ 41 dB, independentemente da outra", "O critério é bilateral ≥ 41 dB ou unilateral total."], ["Sim, porque a soma das perdas das duas orelhas ultrapassa 80 dB", "Não se somam as orelhas."], ["Não, porque a lei só considera perdas acima de 90 dB", "O corte é 41 dB (bilateral) ou perda total (unilateral)."]], "pista": "Unilateral precisa ser total.", "pp": ["Critério bilateral: ≥ 41 dB em ambas.", "Critério unilateral: perda total.", "Caso: unilateral parcial (62 dB) com outra normal.", "Não enquadra."], "ap": "<p>O mesmo achado pode ter relevância em outro quadro jurídico: se a perda decorreu de acidente e reduz a capacidade, discute-se auxílio-acidente pelo Anexo III, quadro 2 (direito pela perda no ouvido acidentado); no dano corporal, usa-se a Tabela A.<\/p>", "mud": [["Perda total à esquerda", "Enquadra", "Unilateral total"], ["Ambas com 45 dB", "Enquadra", "Bilateral ≥ 41"], ["Perda por trauma acústico no trabalho", "Avaliar auxílio-acidente", "Outro quadro"]], "arm": "Aceitar unilateral parcial como deficiência.", "ouro": "Uma orelha só conta se for perda total.", "m2": ["Na Tabela Brasileira, quais frequências e pesos são usados?", "500, 1.000, 2.000 e 4.000 Hz com pesos 2, 4, 3 e 1; soma ÷ 10."], "n": ["Bilateral ≥ 41 dB.", "Unilateral: só total.", "Média de 4 frequências.", "Quadro jurídico muda o cálculo.", "Laudo com audiometria."]}, {"id": "P07-Q03", "t": "P07", "sub": "Três cálculos auditivos", "comp": "Comparação de quadros jurídicos", "rac": "Comparação", "dif": "difícil", "p": [10, 11, 13], "q": "Para avaliar perda auditiva, qual associação entre contexto e método está correta segundo as Aulas 06 e 08?", "o": [["Dano corporal: 500, 1.000, 2.000 e 4.000 Hz, pesos 2-4-3-1, cruzando na Tabela A", "É o cálculo ponderado do dano corporal."], ["PcD (Lei 14.768/2023): pesos 2-4-3-1 incluindo 4.000 Hz, com corte em 25 dB por orelha", "PcD usa média simples de 500–3.000 Hz, corte 41 dB."], ["Auxílio-acidente: média tritonal com corte de 41 dB para qualquer perda unilateral", "Usa 500–3.000 Hz e graus de Davis & Silverman adaptado."], ["Os três contextos usam exatamente o mesmo cálculo e o mesmo ponto de corte", "São cálculos distintos."]], "pista": "Pesos 2-4-3-1 = dano corporal.", "pp": ["PcD: média 500–3.000 Hz, ≥ 41 dB.", "Auxílio-acidente: 500–3.000 Hz; normal ≤ 25; mínimo 26–40; médio 41–70; máximo 71–90.", "Dano corporal: 500/1k/2k/4k × 2/4/3/1 ÷ 10; Tabela A."], "ap": "<p>Lição transversal das Aulas 06 e 08: o número depende do quadro jurídico. O mesmo audiograma pode enquadrar em um contexto e não em outro. No auxílio-acidente, o direito existe pela perda no ouvido acidentado ou por redução ≥ grau médio em ambos.<\/p>", "mud": [["Laudo de PcD", "Média simples, ≥ 41 dB", "Lei 14.768/2023"], ["Auxílio-acidente por trauma acústico", "Graus de Davis & Silverman", "Anexo III, quadro 2"], ["Ação cível", "Tabela A", "Dano corporal"]], "arm": "Usar um cálculo único para tudo.", "ouro": "Cada quadro jurídico, seu cálculo auditivo.", "m2": ["Qual o grau de perda “médio” na classificação usada no auxílio-acidente?", "41–70 dB."], "n": ["PcD: média 4 frequências, ≥ 41.", "Auxílio-acidente: graus 26–40/41–70/71–90.", "Dano: pesos 2-4-3-1 até 4 kHz.", "Tabela A cruza as orelhas.", "O quadro jurídico manda."]}, {"id": "P07-Q04", "t": "P07", "sub": "Deficiência física e função", "comp": "Avaliação funcional", "rac": "Aplicação", "dif": "média", "p": [11], "q": "Trabalhador com artroplastia total de quadril bem-sucedida, marcha normal e sem limitação nas atividades, solicita laudo de deficiência física. Qual princípio orienta o perito?", "o": [["O diagnóstico não basta: o que define é o comprometimento da função", "Prótese, amputação ou sequela só caracterizam deficiência se houver comprometimento funcional."], ["Toda prótese articular caracteriza deficiência física automaticamente", "O critério é funcional."], ["Deficiência física exige obrigatoriamente amputação ou ausência de membro", "A categoria inclui plegias, paresias, ostomia, nanismo, PC etc."], ["Só o médico assistente pode emitir laudo de deficiência", "O laudo de caracterização é avaliação pericial."]], "pista": "Função, não rótulo.", "pp": ["Categoria I: alteração de segmentos com comprometimento da função física.", "Avaliar marcha, força, amplitude, atividades.", "Sem comprometimento → não enquadra.", "Registrar origem da condição."], "ap": "<p>Conexão com a saúde ocupacional: NR-7/PCMSO, item 7.3.2 — detectar exposições excessivas, definir aptidão para a função e acompanhar de forma diferenciada quem pode ser especialmente afetado pelos riscos; subsidiar a readaptação.<\/p>", "mud": [["Prótese com claudicação e limitação de marcha", "Pode enquadrar", "Comprometimento funcional"], ["Ostomia", "Listada na categoria física", "Critério"], ["Nanismo", "Listado", "Critério"]], "arm": "Enquadrar pelo diagnóstico.", "ouro": "Deficiência física = segmento alterado + função comprometida.", "m2": ["Qual item da NR-7 trata do acompanhamento diferenciado do empregado especialmente sensível aos riscos?", "Item 7.3.2 (PCMSO)."], "n": ["Diagnóstico não basta.", "Repercussão funcional define.", "Plegias, ostomia, amputação, PC, nanismo.", "NR-7/PCMSO.", "Registrar origem."]}, {"id": "P07-Q05", "t": "P07", "sub": "Inclusão e adaptação razoável", "comp": "Nexo e inclusão", "rac": "Integração de dados", "dif": "difícil", "p": [11], "q": "Trabalhadora com deficiência física, contratada pela cota, precisava percorrer quase 200 m para chegar ao refeitório e ao banheiro, sem adaptação da prótese, em ciclos repetitivos. A sequela agravou. Qual a análise pericial apresentada em aula?", "o": [["A falta de inclusão e de adaptação razoável foi concausa do agravamento", "Inclusão não é só contratar para a cota — é adaptar."], ["Não há relação com o trabalho, pois a deficiência é anterior à contratação", "Deficiência prévia não exclui concausa por agravamento."], ["A empresa cumpriu sua obrigação ao classificar a trabalhadora como deficiente no ASO admissional", "O ASO sem evidência de inclusão no PCMSO não basta."], ["O agravamento decorre apenas da evolução natural, sem papel do ambiente", "O laudo de engenharia registrou barreiras e falta de adaptação."]], "pista": "Contratar não é incluir.", "pp": ["A empresa não comprovou planejamento de inclusão nem adaptação.", "ASO apenas classificava como deficiente.", "Barreiras físicas e ciclos repetitivos.", "Concausa do agravamento (Schilling III)."], "ap": "<p>O caso une três aulas: Schilling (agravamento), NR-7/PCMSO (acompanhamento diferenciado) e inclusão (cotas do art. 93 e LBI). A perícia descreve o nexo; a responsabilização é jurídica.<\/p>", "mud": [["Empresa com rampas e trajetos adaptados", "Concausa menos provável", "Ambiente adequado"], ["PCMSO com acompanhamento diferenciado", "Inclusão demonstrada", "NR-7"], ["Sem agravamento", "Sem dano", "Falta o resultado"]], "arm": "Ver a cota como cumprimento suficiente.", "ouro": "Inclusão é adaptar; não adaptar pode ser concausa.", "m2": ["Que documento de saúde ocupacional deveria evidenciar a inclusão?", "O PCMSO (NR-7), não apenas o ASO."], "n": ["Cota não basta.", "Adaptação razoável.", "Concausa por agravamento.", "PCMSO deve evidenciar inclusão.", "Laudo de engenharia ajuda."]}, {"id": "P07-Q06", "t": "P07", "sub": "Deficiência intelectual", "comp": "Critério", "rac": "Aplicação", "dif": "média", "p": [11], "q": "Qual o critério de deficiência intelectual no laudo de caracterização apresentado na Aula 06?", "o": [["Funcionamento intelectual inferior à média + limitação em ≥ 2 habilidades adaptativas", "Habilidades: comunicação, cuidado pessoal, sociais, recursos da comunidade, saúde e segurança, acadêmicas, lazer, trabalho."], ["Apenas um QI abaixo da média em teste padronizado, sem necessidade de avaliar habilidades adaptativas", "Exige-se também a limitação adaptativa."], ["Diagnóstico de qualquer transtorno psiquiátrico em tratamento", "Transtorno psiquiátrico grave é outra categoria (psicossocial)."], ["Baixa escolaridade com dificuldade de leitura, mesmo sem avaliação especializada", "Escolaridade não define deficiência intelectual."]], "pista": "QI baixo + 2 habilidades.", "pp": ["Critério cognitivo: inferior à média.", "Critério adaptativo: ≥ 2 habilidades limitadas.", "Laudo do especialista.", "Registrar origem."], "ap": "<p>Categorias mentais distintas no laudo: IV intelectual; V mental (TEA, Lei 12.764/2012); VI psicossocial grave (Convenção da ONU, 2008 — transtornos psicóticos e limitações graves que impeçam participação plena), com data de início e limitações adaptativas.<\/p>", "mud": [["QI baixo sem limitação adaptativa", "Não enquadra", "Falta critério"], ["TEA", "Categoria V", "Lei 12.764"], ["Esquizofrenia com limitação grave", "Psicossocial (VI)", "Convenção ONU"]], "arm": "Usar só o QI.", "ouro": "Intelectual: cognição + adaptação (≥ 2).", "m2": ["Cite quatro habilidades adaptativas.", "Comunicação, cuidado pessoal, habilidades sociais, trabalho (entre outras)."], "n": ["Cognição inferior à média.", "≥ 2 habilidades adaptativas.", "Laudo do especialista.", "Psicossocial é outra categoria.", "TEA é categoria própria."]}, {"id": "P07-Q07", "t": "P07", "sub": "TEA", "comp": "Legislação e classificação", "rac": "Compreensão", "dif": "fácil", "p": [11], "q": "Sobre o transtorno do espectro autista (TEA) apresentado na Aula 06, assinale a correta.", "o": [["Por lei, a pessoa com TEA é PcD; o DSM-5 classifica por nível de apoio", "Nível 1 “precisa de apoio”; 2 “apoio substancial”; 3 “apoio muito substancial”."], ["O TEA só é deficiência legal no nível 3, com fala muito restrita", "Por lei, a pessoa com TEA é PcD para todos os efeitos."], ["O DSM-5 classifica o TEA em tipos desatento e hiperativo", "Esses são tipos de TDAH."], ["O TEA dispensa avaliação biopsicossocial, bastando o diagnóstico em relatório do neurologista", "A aula destaca avaliação biopsicossocial."]], "pista": "Lei 12.764.", "pp": ["Núcleo: comunicação, interação social, comportamento repetitivo/interesses restritos.", "Níveis de apoio 1, 2, 3.", "Lei 12.764/2012: PcD para todos os efeitos.", "Avaliação biopsicossocial."], "ap": "<p>Contraste com o TDAH: núcleo de desatenção e/ou hiperatividade-i
