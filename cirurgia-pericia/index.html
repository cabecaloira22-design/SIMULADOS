nciária judicial)", "Administrativa (INSS, DETRAN)"], ["Objeto examinado", "Direta: exame do indivíduo", "Indireta: prontuários, documentos, registros (ex.: falecido)"]]}, "flow": {"cap": "Tripé do raciocínio pericial", "s": ["CLÍNICA — diagnóstico, prognóstico, cronologia", "FUNÇÃO — o que a condição impede de fazer na atividade concreta", "DIREITO — qual norma enquadra o fato e qual a consequência (benefício, indenização, aptidão, isenção)"]}, "imgs": [], "refs": ["Carvalho LD. Aulas 01–11 — Exercício Profissional III. FCMMG; 2026.", "Alcântara HR. Perícia Médica Judicial. 2ª ed.", "França GV. Medicina Legal. 11ª ed."]}, {"id": "P02", "d": "per", "n": "Boas práticas, deontologia, bioética e segurança do paciente", "short": "Deontologia, bioética e segurança", "pages": [3, 4], "aula": "Aula 01", "rev": "<p><b>Os três pilares do exercício da medicina:<\/b> <b>dia a dia<\/b> (habilidade, técnica, ética, protocolos, literatura atualizada — falha típica: erro diagnóstico ou de medicação); <b>prevenção<\/b> (comunicação assertiva, empatia, conhecimento de normas básicas — CDC, CC, CPC, CP — falha típica: conflitos e processos civis, penais e éticos); <b>planejamento<\/b> (mundo do trabalho, impostos, previdência, carreira, gestão do tempo — falha típica: endividamento, burnout, família afetada).<\/p><p><b>Deontologia<\/b> (deontos + logos) é o estudo dos deveres: princípios éticos que regem a conduta, com autorregulação do grupo profissional. Lógica: <b>regra → dever de conduta; violação = punição<\/b>. Deveres: <b>informação<\/b> (consentimento, autonomia), <b>atualização<\/b>, <b>vigilância<\/b> (combate à inércia e ao descaso — ex.: não checar a ampola, não pedir o RX após perder instrumental) e <b>abstenção de abuso<\/b> (não desviar do poder conferido pela profissão).<\/p><p><b>Princípios bioéticos:<\/b> autonomia (decidir sobre si), beneficência (fazer o bem), não maleficência (não causar dano, avaliar riscos), justiça (distribuição coerente de deveres e benefícios).<\/p><p><b>Seis metas internacionais de segurança do paciente (JCI):<\/b> 1 identificar corretamente o paciente; 2 melhorar a comunicação; 3 segurança dos medicamentos de alta vigilância; 4 cirurgia segura (local, procedimento e paciente corretos); 5 reduzir infecções; 6 reduzir danos por quedas.<\/p><p><b>Qualidade em saúde<\/b>: grau em que os serviços aumentam a probabilidade de resultados favoráveis dado o estado da arte. <b>Má prática<\/b>: desvio do padrão de cuidado que resulta em prejuízo ao paciente. Teste de caráter do professor: “tudo que faria se pudesse ser invisível e impune”.<\/p><p><b>Três esferas independentes de responsabilidade:<\/b> ética (CRM), civil (indenização — CC 927, 949, 950) e penal. Para o hospital, responsabilidade <b>objetiva<\/b> como prestador de serviço; para o médico, <b>subjetiva<\/b> (culpa: negligência, imprudência, imperícia).<\/p>", "tab": [{"cap": "Três pilares do exercício da medicina (Aula 01)", "h": ["Pilar", "Conteúdo", "Falha típica → consequência"], "r": [["Dia a dia", "Habilidade, técnica, ética, protocolos, literatura", "Falha diagnóstica, erro de medicação"], ["Prevenção", "Comunicação, empatia, normas básicas (CDC, CC, CPC, CP)", "Conflitos, processos civil, penal e ético"], ["Planejamento", "Mundo do trabalho, impostos, previdência, carreira, tempo", "Endividamento, burnout, família afetada"]]}, {"cap": "Deveres deontológicos", "h": ["Dever", "Significado", "Violação típica"], "r": [["Informação", "Consentimento, autonomia", "Vasectomia sem orientar espermograma e taxa de falha"], ["Atualização", "Aprimoramento continuado", "Protocolo abandonado"], ["Vigilância", "Combate à inércia, passividade, descaso", "Não checar ampola; não pedir RX após perder instrumental"], ["Abstenção de abuso", "Não desviar do poder profissional", "Obter vantagem do paciente"]]}, {"cap": "Metas internacionais de segurança do paciente (JCI)", "h": ["Meta", "Conteúdo"], "r": [["1", "Identificar o paciente corretamente"], ["2", "Melhorar a eficácia da comunicação"], ["3", "Segurança dos medicamentos de alta vigilância"], ["4", "Cirurgia segura: local, procedimento e paciente corretos"], ["5", "Reduzir infecções associadas aos cuidados"], ["6", "Reduzir dano decorrente de quedas"]]}], "cmp": {"cap": "Princípios bioéticos", "h": ["Princípio", "Núcleo", "Exemplo"], "r": [["Autonomia", "Decisão voluntária sobre si", "Consentimento informado"], ["Beneficência", "Fazer o bem", "Indicar o tratamento eficaz"], ["Não maleficência", "Não causar dano; avaliar riscos", "Conferir alergias e dose"], ["Justiça", "Distribuição coerente de deveres e benefícios", "Critérios equânimes de acesso"]]}, "flow": {"cap": "Lógica deontológica", "s": ["Regra (código, protocolo, norma)", "Dever de conduta", "Violação", "Punição/consequência em três esferas independentes: ética (CRM), civil (indenização), penal"]}, "imgs": [], "refs": ["Carvalho LD. Aula 01 — Introdução: boas práticas. FCMMG; 2026.", "Joint Commission International — metas internacionais de segurança do paciente (citadas na aula)."]}, {"id": "P03", "d": "per", "n": "Comunicação, comportamento, compliance e mapa da empatia", "short": "Comunicação e compliance", "pages": [4], "aula": "Aula 02", "rev": "<p><b>Princípio de Pareto (80/20):<\/b> Vilfredo Pareto (1896) observou que ~80% das terras italianas pertenciam a ~20% da população; generalizando, ~80% dos resultados vêm de ~20% das causas. Em saúde, no estudo de radiologia de Pianykh (JACR 2017), ~20% dos exames atrasados geravam ~80% dos atrasos. Uso: <b>guia de priorização<\/b> — identificar alvos de alto impacto para melhoria (não descreve falhas “predestinadas”, mas oportunidades).<\/p><p><b>Elementos da comunicação:<\/b> emissor, receptor, mensagem, canal (fala, escrita, gesto, mídia digital), feedback (retorno do receptor) e <b>ruído<\/b> (interferência que distorce). Regra de ouro: <b>o que você comunica publicamente pode ser registrado e se tornar prova<\/b>; vídeo ou story com paciente, prontuário ou ambiente identificável = quebra de sigilo, infração ao Regimento/Código de Conduta FELUMA e potencial processo disciplinar — mesmo apagado, o print basta.<\/p><p><b>DCN-MEC — perfil do egresso:<\/b> formação geral, humanista, crítica e reflexiva; comunicação efetiva e ética (verbal e não verbal, com pacientes, famílias e equipe); segurança do paciente e inovação.<\/p><p><b>Compliance:<\/b> conformidade com leis, regulamentos, políticas internas, diretrizes éticas e protocolos; em hospitais de ensino é compromisso institucional com integridade, segurança do paciente e excelência na formação (Regimento Interno CMMG/FELUMA, Código de Conduta FELUMA).<\/p><p><b>Mapa da empatia e viés (os sábios cegos e o elefante):<\/b> cada sábio toca uma parte e toma a parte pelo todo. Na perícia, autor, réu e assistentes técnicos veem um pedaço; o perito precisa da visão do todo. Mapa da empatia (autocrítica): quem sou eu, o que preciso fazer, o que ouço, o que vejo e falo, o que faço, dores e alegrias.<\/p>", "tab": [{"cap": "Elementos da comunicação (Aula 02)", "h": ["Elemento", "Definição", "Exemplo de falha"], "r": [["Emissor", "Quem envia", "Prescrição verbal ambígua"], ["Receptor", "Quem recebe", "Técnica que não confere a ordem"], ["Mensagem", "Conteúdo", "Dose sem unidade"], ["Canal", "Fala, escrita, gesto, mídia digital", "Story em rede social (registro permanente)"], ["Feedback", "Retorno do receptor", "Ausência de read-back"], ["Ruído", "Interferência que distorce", "Barulho, jargão, linguagem inadequada"]]}], "cmp": {"cap": "Compliance × mera obediência", "h": ["Aspecto", "Compliance institucional", "Seguir regras isoladamente"], "r": [["Escopo", "Leis, políticas internas, ética, protocolos", "Regra pontual"], ["Finalidade", "Integridade, segurança do paciente, formação", "Evitar punição"], ["Instrumentos citados", "Regimento Interno CMMG/FELUMA; Código de Conduta FELUMA", "—"]]}, "flow": {"cap": "Do post à prova", "s": ["Conteúdo publicado em canal digital", "Registro permanente (print, compartilhamento)", "Identificação do paciente (tatuagem, rosto, prontuário, ambiente)", "Violação de sigilo (CEM), da segurança do paciente e do regimento → processo disciplinar/ético"]}, "imgs": [], "refs": ["Carvalho LD. Aula 02 — Comunicação formativa. FCMMG; 2026.", "Pianykh OS et al. J Am Coll Radiol. 2017;14:937–943.", "Pareto V. Cours d'économie politique. 1896."]}, {"id": "P04", "d": "per", "n": "Seguridade social: seguro social, assistência social, assistência médica e benefícios do RGPS", "short": "Seguridade social e benefícios", "pages": [5, 6], "aula": "Aula 03", "rev": "<p><b>A Seguridade Social tem três braços<\/b> — a diferença que mais cai. <b>Seguro social (Previdência)<\/b>: contributivo — só tem direito quem contribui (segurado); INSS/RGPS ou regimes próprios; Lei 8.213/91 e Decreto 3.048/99. <b>Assistência social<\/b>: não contributiva, mas seletiva — para quem precisa e se classifica; LOAS/BPC (Lei 8.742/93), operacionalizado pelo INSS; BPC = 1 salário mínimo à PcD ou ao idoso ≥ 65 anos sem meios de prover a subsistência. <b>Assistência médica (saúde)<\/b>: universal e gratuita — SUS (Lei 8.080/90) e saúde suplementar (Lei 9.656/98).<\/p><p><b>Atribuição do INSS<\/b>: pagar benefícios por incapacidade. Não paga insalubridade (empregador), não custeia cirurgia do acidentado (SUS/plano), não presta assistência médica/odontológica.<\/p><p><b>Regimes:<\/b> RGPS (celetistas, contribuintes individuais, segurados especiais — gestão INSS) e RPPS (servidores públicos de cada ente).<\/p><p><b>Benefícios (após EC 103/2019) e espécies:<\/b> auxílio por incapacidade temporária (B31 previdenciário / B91 acidentário); aposentadoria por incapacidade permanente (B32 / B92) — incapaz definitivamente e insuscetível de reabilitação; auxílio-acidente (B36 / B94) — indenização por sequela definitiva após consolidação que reduz a capacidade para o trabalho habitual. Final 1 = causa comum; 9 = acidentária.<\/p><p><b>Auxílio por incapacidade temporária:<\/b> carência de 12 contribuições, salvo exceções; dias 1–15 pagos pela empresa; a partir do 16º dia, perícia do INSS; mantido enquanto persistir a incapacidade, sem reabilitação ou reconhecimento de invalidez. <b>Isenção de carência<\/b>: acidente de qualquer natureza (inclusive do trabalho) e doenças graves listadas (tuberculose ativa, hanseníase, alienação mental, neoplasia maligna, cegueira, paralisia irreversível, cardiopatia grave, Parkinson, espondiloartrose anquilosante, nefropatia grave, Paget avançado, AIDS, contaminação por radiação, hepatopatia grave).<\/p><p><b>Aposentadoria por incapacidade permanente:<\/b> doença pré-existente à filiação não dá direito, <b>salvo se a incapacidade decorrer de progressão/agravamento<\/b>; exige afastamento de todas as atividades, sujeita a revisões e reversão. O perito fixa DER, DID e DII. <b>Majoração de 25%<\/b> (Anexo I do Decreto 3.048/99) quando há dependência permanente de terceiros: cegueira total, perda de 9 dedos ou mais, paralisia dos 2 MMSS ou 2 MMII, alteração mental grave, permanência contínua no leito, incapacidade permanente para as AVDs, entre outras.<\/p><p><b>Dado da aula:<\/b> em 2025 o INSS concedeu 546.254 benefícios por transtornos mentais e comportamentais (+15,66% vs 2024).<\/p>", "tab": [{"cap": "Os três braços da Seguridade Social (Aula 03)", "h": ["Aspecto", "Seguro social", "Assistência social", "Assistência médica"], "r": [["Princípio", "Contributivo", "Não contributivo, seletivo", "Universal e gratuito"], ["Órgão", "INSS (RGPS) ou RPPS", "LOAS/BPC (operado pelo INSS)", "SUS + saúde suplementar"], ["Lei", "8.213/91; Decreto 3.048/99", "8.742/93", "8.080/90; 9.656/98"], ["Exemplo", "Auxílio por incapacidade, aposentadorias, auxílio-acidente", "BPC: 1 SM a PcD ou idoso ≥ 65 sem meios", "Atendimento no hospital de trauma"]]}, {"cap": "Benefícios por incapacidade do RGPS", "h": ["Benefício", "Essência", "Espécie"], "r": [["Auxílio por incapacidade temporária", "Incapacidade temporária por doença ou acidente", "B31 / B91"], ["Aposentadoria por incapacidade permanente", "Incapaz definitivamente, insuscetível de reabilitação", "B32 / B92"], ["Auxílio-acidente", "Sequela definitiva consolidada que reduz a capacidade habitual (indenização)", "B36 / B94"]]}, {"cap": "Regras operacionais do auxílio por incapacidade temporária", "h": ["Item", "Regra"], "r": [["Carência", "12 contribuições, salvo exceções"], ["Dias 1–15", "Empresa paga (atestado)"], ["A partir do 16º dia", "Perícia médica do INSS"], ["Isenção de carência", "Acidente de qualquer natureza; doenças graves listadas"]]}], "cmp": {"cap": "Datas fixadas pelo perito", "h": ["Sigla", "Significado", "Por que importa"], "r": [["DER", "Data de entrada do requerimento", "Marco administrativo do pedido"], ["DID", "Data de início da doença", "Doença anterior à filiação pode excluir o direito"], ["DII", "Data de início da incapacidade", "Se posterior à filiação por agravamento, o direito se mantém"]]}, "flow": {"cap": "Qual braço? — triagem rápida", "s": ["Contribui para a Previdência (segurado) e tem incapacidade/sequela? → SEGURO SOCIAL (INSS)", "Não contribui, é PcD ou idoso ≥ 65 e sem meios de subsistência? → ASSISTÊNCIA SOCIAL (BPC/LOAS)", "Precisa de atendimento, cirurgia, internação? → ASSISTÊNCIA MÉDICA (SUS/plano), para todos"]}, "imgs": [], "refs": ["Carvalho LD. Aula 03 — Seguro social, assistência social e assistência médica. FCMMG; 2026.", "Brasil. Lei 8.213/1991; Decreto 3.048/1999 (Anexo I); Lei 8.742/1993; Lei 8.080/1990; EC 103/2019.", "Boletim Estatístico da Previdência Social, dez/2025 (dado da aula)."]}, {"id": "P05", "d": "per", "n": "Nexo causal e concausal, doença × incapacidade, acidente do trabalho e anexos do Decreto 3.048/99", "short": "Nexo, incapacidade e acidente do trabalho", "pages": [6, 7, 8, 9], "aula": "Aula 04", "rev": "<p><b>Doença × incapacidade.<\/b> Doença é o estado resultante da consciência da perda da homeostasia (dano estrutural ou funcional). <b>Incapacidade<\/b> é a impossibilidade de desempenhar as funções específicas de uma atividade ou ocupação, em consequência de alterações morfopsicofisiológicas por doença ou acidente; <b>o risco de vida, para si ou para terceiros, ou de agravamento que a permanência na atividade possa acarretar está implicitamente incluído no conceito<\/b>, desde que palpável e indiscutível. Logo, <b>a incapacidade nem sempre implica doença ativa<\/b> (amputado consolidado) e doença não implica incapacidade (diabético controlado). Incapacidade é para a <i>ocupação<\/i>; dependência para AVDs é critério da majoração de 25%.<\/p><p><b>A perícia previdenciária<\/b> analisa a situação do segurado, estabelece ou não o nexo técnico, verifica se a doença é incapacitante e fixa DID e DII.<\/p><p><b>Acidente do trabalho (Lei 8.213/91):<\/b> acidente típico (art. 19) — pelo exercício do trabalho, provocando lesão ou perturbação funcional; <b>doença profissional<\/b> (art. 20, I) — produzida pelo trabalho peculiar a determinada atividade (silicose na pedreira); <b>doença do trabalho<\/b> (art. 20, II) — adquirida em função de condições especiais em que o trabalho é realizado (PAIR, LER/DORT); equiparados (art. 21) — trajeto, concausas, agressões no local de trabalho. <b>CAT<\/b> (art. 22): até o 1º dia útil seguinte; em caso de morte, de imediato; na omissão, podem emitir o acidentado, dependentes, sindicato, médico assistente ou autoridade pública.<\/p><p><b>Schilling:<\/b> I — trabalho é causa necessária (silicose, asbestose, chumbo) → nexo causal; II — fator contributivo, não principal (coronariopatia, varizes) → concausal; III — provoca distúrbio latente ou agrava doença estabelecida (asma, transtorno mental pré-existente) → concausal por agravamento.<\/p><p><b>Anexos do Decreto 3.048/99:<\/b> I — majoração de 25%; II — agentes patogênicos (Listas A, B e C); III — auxílio-acidente (9 quadros); IV — agentes nocivos para aposentadoria especial. <b>Lista A<\/b>: agente → doenças (sílica → silicose). <b>Lista B<\/b>: doença → agentes (leucemia ← benzeno; TEPT ← assalto no trabalho). <b>Lista C<\/b> (Decreto 6.957/2009): intervalo CID × CNAE → <b>NTEP<\/b>, presunção estatística que a empresa pode contestar. Espécies de nexo técnico (IN 31/2008): profissional/do trabalho, individual (equiparado) e epidemiológico.<\/p><p><b>Auxílio-acidente (art. 104):<\/b> sequela definitiva após consolidação que reduz a capacidade habitual; segurado empregado (inclusive doméstico), avulso e segurado especial. Quadro 01 (visual): AV corrigida ≤ 0,2 no olho acidentado, entre outras alíneas; quadro 05: perdas de segmentos. <b>Cotas (art. 93)<\/b>: empresas com ≥ 100 empregados — até 200: 2%; 201–500: 3%; 501–1.000: 4%; ≥ 1.001: 5%.<\/p>", "tab": [{"cap": "Classificação de Schilling (Aula 04)", "h": ["Grupo", "Papel do trabalho", "Exemplos", "Nexo"], "r": [["I", "Causa necessária", "Silicose, asbestose, intoxicação por chumbo", "Causal"], ["II", "Fator contributivo, não principal", "Doença coronariana, varizes, LER com fator extralaboral", "Concausal"], ["III", "Provoca distúrbio latente ou agrava doença estabelecida", "Asma agravada, transtorno mental que descompensa", "Concausal (agravamento)"]]}, {"cap": "Anexos do Decreto 3.048/99 e Listas do Anexo II", "h": ["Item", "Conteúdo", "Uso"], "r": [["Anexo I", "Majoração de 25%", "Dependência permanente de terceiros"], ["Anexo II — Lista A", "Agente → doenças", "Nexo técnico profissional/do trabalho"], ["Anexo II — Lista B", "Doença → agentes", "Nexo técnico profissional/do trabalho"], ["Anexo II — Lista C", "CID × CNAE (Dec. 6.957/2009)", "NTEP — presunção estatística contestável"], ["Anexo III", "9 quadros de sequelas", "Auxílio-acidente"], ["Anexo IV", "Agentes nocivos", "Aposentadoria especial"]]}, {"cap": "Cotas para reabilitados/PcD — Lei 8.213, art. 93", "h": ["Empregados", "Cota"], "r": [["100 a 200", "2%"], ["201 a 500", "3%"], ["501 a 1.000", "4%"], ["≥ 1.001", "5%"]]}], "cmp": {"cap": "Doença profissional × doença do trabalho × acidente típico", "h": ["Figura", "Base legal", "Essência", "Exemplo"], "r": [["Acidente típico", "Art. 19", "Evento pelo exercício do trabalho", "Queda no plantão"], ["Doença profissional", "Art. 20, I", "Peculiar a determinada atividade", "Silicose na pedreira"], ["Doença do trabalho", "Art. 20, II", "Condições especiais em que o trabalho é feito", "PAIR, LER/DORT"], ["Equiparados", "Art. 21", "Trajeto, concausas, agressões", "Assalto ao caixa"]]}, "flow": {"cap": "Fluxo do acidentado (Aula 04)", "s": ["CAT (empregador; 1º dia útil; morte: imediato)", "Atestado médico — dias 1–15 pagos pela empresa", "Perícia INSS → auxílio por incapacidade acidentário (B91), sem carência", "Reabilitação profissional (art. 89)", "Consolidação com sequela que reduz a capacidade → auxílio-acidente (B94, Anexo III)", "Retorno ao trabalho"]}, "imgs": [], "refs": ["Carvalho LD. Aula 04 — Nexo causal/concausal × incapacidades. FCMMG; 2026.", "Brasil. Lei 8.213/1991 (arts. 19–22, 89, 93); Decreto 3.048/1999 (Anexos I–IV; arts. 104, 337); Decreto 6.957/2009; IN INSS 31/2008.", "Schilling RSF, 1984.", "Manual do Médico-Perito da Previdência Social. 3ª ed. MPS/INSS; 1993."]}, {"id": "P06", "d": "per", "n": "Inclusão I — exame oftalmológico-legal", "short": "Oftalmológico-legal", "pages": [9, 10], "aula": "Aula 05", "rev": "<p><b>Visão é função, não só número.<\/b> O protocolo de aptidão avalia: <b>acuidade visual<\/b> (ângulo mínimo de resolução; Snellen a 20 pés = 6 m); <b>campo visual<\/b> (isópteras, confrontação, campimetria — glaucoma compromete primeiro o campo periférico); <b>motilidade ocular<\/b> intrínseca (pupila) e extrínseca (6 músculos); <b>visão de cores<\/b> (Ishihara, 32 placas; semáforo); <b>visão estereoscópica<\/b> (binocularidade → fusão → estereopsia; perdida na visão monocular); <b>ofuscamento e visão noturna<\/b>.<\/p><p><b>Bases fisiológicas:<\/b> visão ≈ 80% da cognição do ambiente; luz visível 370–750 nm; poder dióptrico da córnea 40–45 D e do cristalino 12–14 D; o diabetes oscila a refração.<\/p><p><b>Notação de Snellen:<\/b> numerador = distância do examinado à tabela (20 pés); denominador = distância em que uma pessoa normal leria a menor linha lida. 20/200 = lê a 20 pés o que o normal lê a 200. Cada olho separadamente, da direita para a esquerda. Conversões: 20/20 = 1,0 (100%); 20/25 = 0,8 (95%); <b>20/30 ≈ 0,6 = 91%<\/b>; 20/60 = 0,3 (limite superior de baixa visão); 20/200 = 0,1 (20%); 20/400 = 0,05 (cegueira legal).<\/p><p><b>Músculos extraoculares:<\/b> reto medial (adução, III), reto lateral (abdução, VI), reto superior (elevação, III), reto inferior (depressão, III), oblíquo superior (intorção; depressão e abdução, IV), oblíquo inferior (extorção; elevação e abdução, III).<\/p><p><b>Deficiência visual (laudo PcD)<\/b>, sempre com a melhor correção no melhor olho: cegueira — AV ≤ 0,05 (20/400); baixa visão — AV entre 0,3 e 0,05; campo visual somado ≤ 60°; <b>visão monocular<\/b> (Lei 14.126/2021) — cegueira legal em um olho (AV ≤ 0,05 com melhor correção), classificada como deficiência sensorial visual. Na previdência, o auxílio-acidente visual (Anexo III, quadro 01) exige, entre outras alíneas, AV corrigida ≤ 0,2 no olho acidentado.<\/p>", "tab": [{"cap": "Conversão de Snellen (Aula 05)", "h": ["Snellen", "Decimal", "Eficácia", "Leitura pericial"], "r": [["20/20", "1,00", "100%", "Normal"], ["20/25", "0,80", "95%", "—"], ["20/30", "≈ 0,6", "91%", "Ponto de fixação da aula"], ["20/60", "0,30", "—", "Limite superior de baixa visão"], ["20/200", "0,10", "20%", "Faixa do auxílio-acidente (≤ 0,2 no olho acidentado)"], ["20/400", "0,05", "10%", "Cegueira legal"]]}, {"cap": "Deficiência visual — critérios do laudo de caracterização", "h": ["Categoria", "Critério (melhor correção, melhor olho)"], "r": [["Cegueira", "AV ≤ 0,05 (20/400)"], ["Baixa visão", "AV entre 0,3 (20/60) e 0,05 (20/400)"], ["Campo visual", "Somatória em ambos os olhos ≤ 60°"], ["Visão monocular (Lei 14.126/2021)", "Cegueira legal em um olho (AV ≤ 0,05) — deficiência sensorial visual"]]}, {"cap": "Músculos extraoculares", "h": ["Músculo", "Ação primária", "Nervo"], "r": [["Reto medial", "Adução", "III"], ["Reto lateral", "Abdução", "VI"], ["Reto superior", "Elevação", "III"], ["Reto inferior", "Depressão", "III"], ["Oblíquo superior", "Intorção (depressão, abdução)", "IV"], ["Oblíquo inferior", "Extorção (elevação, abdução)", "III"]]}], "cmp": {"cap": "Componentes do exame e o que reprovam", "h": ["Teste", "Avalia", "Condições que limitam"], "r": [["Acuidade", "Resolução", "Ametropias, catarata, retinopatia, ambliopia"], ["Campo visual", "Periferia", "Glaucoma, neurites"], ["Motilidade", "Pupila e 6 músculos", "Estrabismo, paresias III, IV, VI"], ["Cores", "Ishihara", "Discromatopsias"], ["Estereopsia", "Binocularidade", "Visão monocular"], ["Ofuscamento/noturna", "Recuperação após flash", "Cegueira noturna, catarata"]]}, "flow": {"cap": "Raciocínio do laudo visual", "s": ["Medir AV de cada olho, sem e com a melhor correção", "Converter para decimal e identificar o melhor olho", "Avaliar campo visual (somatória), motilidade, cores, estereopsia", "Aplicar o critério do QUADRO JURÍDICO em jogo (PcD, auxílio-acidente, edital, isenção de IR, CNH)"]}, "imgs": [], "refs": ["Carvalho LD. Aula 05 — Inclusão: oftalmológico-legal. FCMMG; 2026.", "Brasil. Lei 14.126/2021 (visão monocular); Decreto 3.048/1999, Anexo III, quadro 01."]}, {"id": "P07", "d": "per", "n": "Inclusão II — deficiência auditiva, física e intelectual/mental", "short": "Inclusão: auditiva, física, mental", "pages": [10, 11], "aula": "Aula 06", "rev": "<p><b>Laudo de caracterização de deficiência — categorias:<\/b> I física (alteração de segmentos com comprometimento da função: plegias/paresias, ostomia, amputação, paralisia cerebral, deformidade congênita, nanismo); II <b>auditiva<\/b> (Lei 14.768/2023): perda unilateral total, ou bilateral parcial ou total, <b>≥ 41 dB<\/b> aferida por audiograma em <b>500, 1.000, 2.000 e 3.000 Hz<\/b>, com audiometria tonal + vocal anexada; III visual; IIIa visão monocular; IV <b>intelectual<\/b>: funcionamento intelectual significativamente inferior à média + limitação em <b>≥ 2 habilidades adaptativas<\/b>; V mental (<b>TEA<\/b> — Lei 12.764/2012 considera a pessoa com TEA PcD para todos os efeitos legais); VI psicossocial grave (Convenção da ONU, 2008); VII múltipla. Registra-se também a origem (congênita, acidente/doença do trabalho, acidente comum, doença comum, pós-operatória).<\/p><p><b>Auditiva — exame:<\/b> prova da voz coloquial (triagem) → audiometria tonal (via aérea) + vocal. Três contextos com cálculos diferentes: PcD (média de 500/1k/2k/3k, ≥ 41 dB bilateral ou perda total unilateral); auxílio-acidente (Anexo III, quadro 2 — mesma faixa de frequências, graus de Davis & Silverman adaptado: normal ≤ 25; mínimo 26–40; médio 41–70; máximo 71–90); dano corporal na Tabela Brasileira (500, 1.000, 2.000, 4.000 Hz com pesos 2, 4, 3, 1; soma ÷ 10).<\/p><p><b>Física:<\/b> diagnóstico isolado não basta — o que define é a <b>repercussão funcional<\/b>. Ligação com a NR-7/PCMSO (item 7.3.2): detectar exposições, definir aptidão para a função e acompanhar de forma diferenciada quem pode ser especialmente afetado; subsidiar readaptação. No caso da loja (trabalhadora com deficiência física percorrendo quase 200 m até refeitório/banheiro, sem adaptação), a falta de ajuste razoável funcionou como <b>concausa<\/b> do agravamento: <b>inclusão não é só contratar para a cota — é adaptar<\/b>.<\/p><p><b>TEA × TDAH:<\/b> TEA — comunicação, interação social, comportamento repetitivo/interesses restritos; DSM-5 por nível de apoio (1 “precisa de apoio”, 2 “apoio substancial”, 3 “apoio muito substancial”); é deficiência por lei com avaliação biopsicossocial. TDAH — desatenção e/ou hiperatividade/impulsividade (desatento, hiperativo/impulsivo, combinado); <b>não é, por si, deficiência legal<\/b>; depende de repercussão funcional grave e avaliação biopsicossocial.<\/p>", "tab": [{"cap": "Laudo de caracterização de deficiência (Aula 06)", "h": ["Categoria", "Critério", "Anexo"], "r": [["I — Física", "Alteração de segmentos com comprometimento da função (plegias, ostomia, amputação, PC, nanismo)", "—"], ["II — Auditiva (Lei 14.768/2023)", "Unilateral total ou bilateral ≥ 41 dB (500/1k/2k/3k Hz)", "Audiometria tonal + vocal"], ["III / IIIa — Visual / monocular", "Ver Aula 05; Lei 14.126/2021", "Laudo oftalmológico"], ["IV — Intelectual", "QI significativamente inferior + limitação em ≥ 2 habilidades adaptativas", "Laudo do especialista"], ["V — Mental (TEA)", "Lei 12.764/2012: PcD para todos os efeitos", "Laudo do especialista"], ["VI — Psicossocial grave", "Convenção ONU 2008", "Laudo do especialista"], ["VII — Múltipla", "Duas ou mais deficiências", "Assinalar cada uma"]]}, {"cap": "Audiometria: três quadros jurídicos, três cálculos", "h": ["Contexto", "Frequências e cálculo", "Corte"], "r": [["PcD (Lei 14.768/2023)", "Média de 500, 1.000, 2.000 e 3.000 Hz", "≥ 41 dB bilateral ou perda total unilateral"], ["Auxílio-acidente (Anexo III, quadro 2)", "500–3.000 Hz, média aritmética", "Normal ≤ 25; mínimo 26–40; médio 41–70; máximo 71–90"], ["Dano corporal (Tabela Brasileira)", "500, 1.000, 2.000, 4.000 Hz × 2, 4, 3, 1; ÷ 10", "Cruza OD × OE na Tabela A"]]}], "cmp": {"cap": "TEA × TDAH (Aula 06)", "h": ["Aspecto", "TEA", "TDAH"], "r": [["Núcleo", "Comunicação, interação social, comportamento repetitivo", "Desatenção; hiperatividade/impulsividade"], ["Classificação", "Níveis de apoio 1, 2, 3 (DSM-5)", "Desatento, hiperativo/impulsivo, combinado"], ["Status legal", "Deficiência por lei (12.764/2012)", "Não é, por si, deficiência legal"]]}, "flow": {"cap": "Raciocínio do laudo PcD", "s": ["Identificar a categoria (física, auditiva, visual, intelectual, mental, psicossocial, múltipla)", "Aplicar o critério objetivo da categoria (ex.: ≥ 41 dB; AV ≤ 0,05; ≥ 2 habilidades adaptativas)", "Descrever a repercussão funcional (não só o diagnóstico)", "Registrar origem e anexar exames obrigatórios → concluir enquadramento ou não"]}, "imgs": [], "refs": ["Carvalho LD. Aula 06 — Inclusão: audição, físico, mental. FCMMG; 2026.", "Brasil. Lei 14.768/2023; Lei 12.764/2012; Lei 13.146/2015 (LBI); NR-7 (PCMSO).", "APA. DSM-5 (níveis de apoio citados na aula)."]}, {"id": "P08", "d": "per", "n": "Mundo do trabalho: ordenamento jurídico, NRs, CLT × PJ e Código de Ética", "short": "Mundo do trabalho: CLT × PJ e NRs", "pages": [11, 12], "aula": "Aula 07", "rev": "<p><b>Ordenamento jurídico:<\/b> CF/88 art. 1º (dignidade da pessoa humana; valores sociais do trabalho e da livre iniciativa); art. 5º, II (<b>legalidade<\/b>: ninguém é obrigado a fazer ou deixar de fazer senão em virtude de lei); art. 7º, XXII (redução dos riscos do trabalho por normas de saúde, higiene e segurança) e XXIII (adicional para atividades penosas, insalubres ou perigosas). CLT cap. V (Segurança e Medicina do Trabalho), art. 157: cabe às empresas cumprir e fazer cumprir as normas, instruir empregados e adotar as medidas determinadas. Lei 8.213, art. 19 §1º: a empresa responde pelas medidas coletivas e individuais de proteção. As <b>NRs<\/b> complementam o cap. V da CLT.<\/p><p><b>NRs mais cobradas:<\/b> 01 disposições gerais e gerenciamento de riscos; 04 SESMT; 05 CIPA; 06 EPI; <b>07 PCMSO<\/b> (ASO admissional, periódico, retorno, mudança de risco, demissional); 09 riscos ambientais; 12 máquinas; 15 insalubridade; 16 periculosidade; 17 ergonomia; <b>32 segurança e saúde em serviços de saúde<\/b> (vale para qualquer serviço de saúde).<\/p><p><b>CLT × PJ:<\/b> o vínculo CLT tem subordinação, habitualidade, onerosidade e pessoalidade, com férias + 1/3, 13º, FGTS, aviso prévio, adicionais e <b>cobertura acidentária completa<\/b> (B91, B94, estabilidade). O PJ é contrato entre empresas: direitos negociados; recolhe INSS como sócio/contribuinte individual; <b>sem auxílio-acidente<\/b> (art. 18 §1º restringe a empregado, doméstico, avulso e segurado especial); tributação geralmente menor; risco de “pejotização”. Abertura de PJ: definir CNAE → configurar a empresa → análise prévia de localidade → contrato social → registro na Junta/Cartório → CNPJ.<\/p><p><b>Estabilidade acidentária<\/b> (complemento do resumo — Lei 8.213, art. 118): 12 meses após cessar o auxílio acidentário, para o empregado.<\/p><p><b>Código de Ética Médica e saúde ocupacional:<\/b> Princípios I e II (a serviço da saúde, sem discriminação); XII (melhor adequação do trabalho ao ser humano, eliminação e controle dos riscos); XIII (comunicar às autoridades a deterioração do ecossistema); art. 12 (vedado deixar de esclarecer o trabalhador sobre condições de risco, devendo comunicar aos empregadores); art. 13 (vedado deixar de esclarecer o paciente sobre determinantes sociais, ambientais ou profissionais de sua doença).<\/p><p><b>Mercado (dados da aula, observatório CFM):<\/b> 358 faculdades, 35.977 vagas; 64 novas só em 2024.<\/p>", "tab": [{"cap": "NRs mais cobradas (Aula 07)", "h": ["NR", "Assunto"], "r": [["01", "Disposições gerais e gerenciamento de riscos"], ["04", "SESMT"], ["05", "CIPA"], ["06", "EPI"], ["07", "PCMSO — ASO admissional, periódico, retorno, mudança de risco, demissional"], ["09", "Riscos ambientais (antigo PPRA)"], ["12", "Máquinas e equipamentos"], ["15", "Insalubridade"], ["16", "Periculosidade"], ["17", "Ergonomia"], ["32", "Segurança e saúde em serviços de saúde"]]}, {"cap": "CLT × PJ para o médico", "h": ["Aspecto", "CLT", "PJ"], "r": [["Vínculo", "Subordinação, habitualidade, onerosidade, pessoalidade", "Contrato de prestação de serviços"], ["Direitos", "Férias + 1/3, 13º, FGTS, aviso, adicionais", "Negociados; nenhum automático"], ["Previdência", "Cobertura acidentária completa (B91, B94, estabilidade)", "Contribuinte individual; sem auxílio-acidente"], ["Tributação", "IRPF na fonte (progressiva)", "Simples/lucro presumido — menor carga nominal"], ["Risco", "Menor flexibilidade, maior proteção", "Pejotização"]]}], "cmp": {"cap": "Código de Ética Médica e saúde ocupacional", "h": ["Dispositivo", "Conteúdo"], "r": [["Princ. I e II", "Medicina a serviço da saúde, sem discriminação; máximo zelo"], ["Princ. XII", "Adequação do trabalho ao ser humano; controle de riscos"], ["Princ. XIII", "Comunicar deterioração do ecossistema"], ["Art. 12 (vedado)", "Deixar de esclarecer o trabalhador sobre condições de risco"], ["Art. 13 (vedado)", "Deixar de esclarecer determinantes sociais, ambientais ou profissionais da doença"]]}, "flow": {"cap": "Hierarquia normativa em saúde do trabalhador", "s": ["Constituição (arts. 1º, 5º, 7º)", "CLT — cap. V (art. 157)", "Lei 8.213/91 (art. 19 §1º)", "Normas Regulamentadoras (NR-01 a NR-32)", "Código de Ética Médica (deveres do médico do trabalho e do assistente)"]}, "imgs": [], "refs": ["Carvalho LD. Aula 07 — Introdução ao mundo do trabalho. FCMMG; 2026.", "Brasil. CF/1988; CLT (DL 5.452/1943); Lei 8.213/1991 (arts. 18, 19, 118 — este último complemento do resumo); NRs do MTE; Código de Ética Médica."]}, {"id": "P09", "d": "per", "n": "Dano corporal: história, baremas, reparação integral e tabelas", "short": "Dano corporal e baremas", "pages": [12, 13, 14], "aula": "Aula 08", "rev": "<p><b>Origem histórica:<\/b> Código de Hamurábi (282 leis; Lei de Talião — proporcionalidade retributiva); <b>François Barrême<\/b> (1640–1703), matemático francês do “Livre des Comptes Faits”, origem do termo <b>barema<\/b> — tabela de correspondência entre situações e cifras; Hôtel des Invalides (1670, Luís XIV); baremas franceses (1887/1919/1939); Guia AMA (1971); Tabela Indicativa portuguesa; Tabela Brasileira para Apuração do Dano Corporal.<\/p><p><b>Avaliação do dano corporal:<\/b> definir e valorar, em termos técnicos e num quadro jurídico determinado, as lesões e elementos do dano suscetíveis de sanção penal e/ou de pensão, indenização, benefícios sociais ou fiscais. <b>Reparação integral<\/b>: recolocar a vítima, às expensas do responsável, na situação em que estaria se o fato não tivesse ocorrido.<\/p><p><b>Base legal:<\/b> CC/2002 art. 927 — ato ilícito (arts. 186 e 187) que causa dano obriga a reparar; parágrafo único — <b>responsabilidade objetiva<\/b> nos casos da lei ou quando a atividade implicar risco. <b>Art. 949<\/b> — lesão à saúde: despesas do tratamento + lucros cessantes até o fim da convalescença + outro prejuízo provado. <b>Art. 950<\/b> — defeito que impede o ofício ou diminui a capacidade: além do anterior, <b>pensão<\/b> correspondente à importância do trabalho para que se inabilitou ou à depreciação sofrida (pode ser paga de uma só vez). Res. CFM 2.056/2013: princípio <i>visum et repertum<\/i> (ver e registrar).<\/p><p><b>Baremas<\/b> padronizam e traduzem em número o déficit funcional permanente, mas são <b>puramente indicativos<\/b>: não têm valor absoluto nem são norma; servem de referência ao magistrado. A CIF não é barema, mas descreve a funcionalidade (CID = estrutura/etiologia; CIF = função).<\/p><p><b>Mesmo dano, valores diferentes:<\/b> perda total da visão de um olho — SUSEP 30%, DPVAT 50%, Tabela Brasileira 25% (60% se já havia perda do contralateral). O percentual depende do quadro jurídico; não existe “valor do olho” universal. DPVAT (Lei 11.945/2009) — exemplos: perda total do uso de uma perna 70%; perda de um pé 50%; anquilose total de joelho/tornozelo 20%; amputação do hálux 10%; encurtamento ≥ 5 cm 15%, 4 cm 10%, 3 cm 6%, < 3 cm sem indenização.<\/p><p><b>Dano auditivo (Tabela Brasileira):<\/b> limiares em 500, 1.000, 2.000 e 4.000 Hz × 2, 4, 3, 1; soma ÷ 10 por orelha; cruza OD × OE na Tabela A.<\/p><p><b>Conceitos finais:<\/b> <b>MMI<\/b> (Maximum Medical Improvement) — só se fala em dano quando há sequela, com tratamento esgotado (consolidação); dano × incapacidade; repercussão nas AVDs liga-se à majoração de 25%; <b>dano estético<\/b> — toda alteração morfológica permanente e aparente, para pior; não admite danos mínimos nem exige “aleijões”; escala de 7 graus.<\/p>", "tab": [{"cap": "Mesmo dano, valores diferentes (Aula 08)", "h": ["Dano", "SUSEP", "DPVAT", "Tabela Brasileira"], "r": [["Perda total da visão de um olho", "30%", "50%", "25% (60% se perda prévia do contralateral)"], ["Surdez total bilateral", "40%", "50%", "Tabela A (ponderado)"], ["Surdez total de um ouvido", "20%", "—", "Tabela A"], ["Amputação total do pênis", "—", "—", "30%"]]}, {"cap": "DPVAT — membros inferiores (exemplos da aula)", "h": ["Dano", "%"], "r": [["Perda total do uso de uma perna", "70%"], ["Fratura não consolidada do fêmur", "50%"], ["Perda total de um pé", "50%"], ["Fratura não consolidada de uma perna", "25%"], ["Anquilose total de joelho/tornozelo", "20%"], ["Amputação do 1º pododáctilo", "10%"], ["Encurtamento ≥ 5 / 4 / 3 cm", "15% / 10% / 6%"], ["Encurtamento < 3 cm", "Sem indenização"]]}, {"cap": "Tabela A (recorte da aula) — dano auditivo", "h": ["Média (dB) uma orelha", "outra 0–19", "outra 20–29", "outra 30–39"], "r": [["0–19", "0%", "2%", "4%"], ["20–29", "2%", "4%", "6%"], ["30–39", "4%", "6%", "8%"], ["40–49", "6%", "8%", "10%"], ["50–59", "8%", "10%", "12%"]]}], "cmp": {"cap": "CC art. 949 × art. 950", "h": ["Aspecto", "Art. 949", "Art. 950"], "r": [["Situação", "Lesão ou ofensa à saúde", "Defeito que impede o ofício ou diminui a capacidade"], ["Verbas", "Tratamento + lucros cessantes até fim da convalescença + outro prejuízo", "Tudo do 949 + pensão pela inabilitação/depreciação"], ["Pagamento", "—", "Pode ser de uma só vez"]]}, "flow": {"cap": "Sequência da avaliação do dano", "s": ["Houve consolidação (MMI)? Se não, avaliação definitiva é prematura", "Descrever a sequela: estrutural, funcional, estética (escala de 7 graus)", "Identificar o QUADRO JURÍDICO (seguro privado, DPVAT, cível, previdenciário)", "Aplicar o barema daquele quadro como referência indicativa", "Descrever restrições concretas (fundamentam a pensão do art. 950)"]}, "imgs": [], "refs": ["Carvalho LD. Aula 08 — O dano corporal. FCMMG; 2026.", "Brasil. Código Civil (arts. 186, 187, 927, 949, 950); Lei 11.945/2009 (DPVAT); DL 73/1966 (SUSEP); Res. CFM 2.056/2013.", "Alcântara HR (dano estético)."]}, {"id": "P10", "d": "per", "n": "Metodologia médico-pericial e o laudo", "short": "Metodologia pericial e laudo", "pages": [14, 15, 16], "aula": "Aula 09", "rev": "<p><b>Perícia médico-legal<\/b>: conjunto de procedimentos médicos e técnicos com finalidade de esclarecer um fato de interesse da Justiça. <b>Prova<\/b>: elemento demonstrativo da autenticidade de um fato; objetivo: formar a convicção do juiz. “<b>Se há dúvida, a prova não foi feita.<\/b>”<\/p><p><b>Ato privativo:<\/b> a perícia médica é exame médico e ato privativo de médico (Lei 12.842/2013, art. 4º XII e XIII; art. 5º II), exceto exames laboratoriais de análises clínicas, toxicológicas, genéticas e de biologia molecular. Res. CFM 1.718/2004: vedado ensinar atos médicos privativos a não médicos.<\/p><p><b>Perícia × consulta:<\/b> a perícia acrescenta ao roteiro clínico o estudo do local de trabalho/documentação, a documentação médico-legal, protocolos periciais e doutrina, o argumento técnico (nexo, dano, potencial laborativo residual), a conclusão e a resposta aos quesitos e impugnações. A consulta termina em diagnóstico, tratamento e retorno.<\/p><p><b>Roteiro do laudo — Res. CFM 2.056/2013, art. 58 (4 blocos):<\/b> 1 Identificação (preâmbulo, individualização, circunstâncias do exame, identificação do examinando); 2 Anamnese (HDA, história pessoal, psiquiátrica prévia, médica, familiar); 3 Exame (físico, estado mental, complementares); 4 Fundamentação (diagnóstico positivo pela CID, comentários médico-legais, <b>conclusão<\/b> — frase curta e direta —, resposta aos quesitos).<\/p><p><b>CPC art. 473:<\/b> I exposição do objeto; II análise técnica/científica; III método, demonstrando ser predominantemente aceito pelos especialistas; IV resposta conclusiva a todos os quesitos; §1º linguagem simples e coerência lógica; <b>§2º vedado ultrapassar os limites da designação ou emitir opiniões pessoais<\/b>; §3º perito e assistentes podem usar todos os meios (testemunhas, documentos, planilhas, fotografias).<\/p><p><b>Atores:<\/b> autor, réu, juiz, MP, assistentes técnicos (das partes) e perito (do juízo). Dialética: tese × antítese → síntese pela evidência científica.<\/p><p><b>Phineas Gage (1848):<\/b> barra de ferro atravessa o lobo frontal; o exame físico pode estar “bom”, mas a personalidade muda — só a história pessoal (antes × depois), o exame do estado mental e informantes revelam o dano. <b>Ambliopia<\/b>: a perícia precisa do diagnóstico atual, da janela terapêutica (infância), do responsável à época e do nexo; inconformismo não é prova.<\/p>", "tab": [{"cap": "Roteiro do laudo — Res. CFM 2.056/2013, art. 58", "h": ["Bloco", "Itens"], "r": [["1 — Identificação", "Preâmbulo; individualização; circunstâncias do exame; identificação do examinando"], ["2 — Anamnese", "HDA; história pessoal; psiquiátrica prévia; médica; familiar"], ["3 — Exame", "Físico; estado mental; exames complementares"], ["4 — Fundamentação", "Diagnóstico positivo (CID); comentários médico-legais; conclusão; resposta aos quesitos"]]}, {"cap": "CPC art. 473 — o laudo", "h": ["Dispositivo", "Conteúdo"], "r": [["I a IV", "Objeto; análise técnica; método aceito pelos especialistas; resposta conclusiva a todos os quesitos"], ["§1º", "Linguagem simples, coerência lógica, como chegou às conclusões"], ["§2º", "Vedado ultrapassar a designação ou emitir opiniões pessoais"], ["§3º", "Todos os meios: testemunhas, documentos, planilhas, mapas, fotografias"]]}], "cmp": {"cap": "Perícia × consulta (Aula 09)", "h": ["Etapa", "Perícia", "Consulta"], "r": [["Entrevista", "Anamnese clínico-pericial", "Anamnese clínica"], ["Exame", "Físico-forense", "Físico/mental"], ["Contexto", "Local de trabalho; documentação médico-legal", "—"], ["Referencial", "Protocolos periciais e doutrina", "Diagnóstico"], ["Produto", "Argumento técnico, conclusão, quesitos", "Tratamento e retorno"]]}, "flow": {"cap": "Do processo ao laudo", "s": ["Nomeação pelo juiz (CPC 465) — partes indicam assistentes e quesitos em 15 dias", "Exame (direto ou indireto) + documentos + local de trabalho", "Laudo em 4 blocos (Res. CFM 2.056/2013)", "Conteúdo mínimo do CPC 473 — sem opiniões pessoais (§2º)", "Respostas a quesitos e impugnações"]}, "imgs": [], "refs": ["Carvalho LD. Aula 09 — Metodologia médico-pericial. FCMMG; 2026.", "Brasil. Lei 12.842/2013; CPC (arts. 156, 465, 473); Res. CFM 2.056/2013 e 1.718/2004.", "Maranhão-Filho P. Rev Bras Neurol. 2014;50(2):33–35 (Phineas Gage)."]}, {"id": "P11", "d": "per", "n": "Telessaúde no ensino e na prática", "short": "Telessaúde", "pages": [16], "aula": "Aula 10", "rev": "<p><b>Definições:<\/b> TDICs são tecnologias digitais de informação e comunicação (dispositivos, e-mail, redes, videoconferência, LMS, simuladores, RA/RV, internet). <b>Telemedicina<\/b> (Res. CFM 2.314/2022): prática médica mediada por TDICs — atendimento, diagnóstico, monitoramento, troca de informações e relatórios a distância. <b>Telessaúde<\/b>: uso das TDICs para apoiar assistência, <b>educação e gestão<\/b> em saúde a distância — <b>escopo mais amplo<\/b> que a telemedicina.<\/p><p><b>Modalidades e evidências citadas:<\/b> <b>teleconsulta<\/b> (amplia acesso rural/mobilidade reduzida, reduz custo; eficaz em IC, DII, AR em remissão); <b>tele-educação<\/b> (revisão de Rush 2018: em 11 de 16 estudos a educação virtual foi superior ao cuidado usual e nos outros 5 equivalente; no DM melhora HbA1c e adesão); <b>telemonitoramento<\/b> (wearables, arritmias; estudo com 3.896 pacientes: menos chamadas de resposta rápida e menos UTI não planejada); <b>telerregulação<\/b> (e-consultas evitam presencial em 34–92%; triagem por imagem reduz até 89% em dermatologia, oftalmologia, ORL); <b>teleconsultoria<\/b> (suporte entre profissionais).<\/p><p><b>Triplo objetivo do IHI:<\/b> melhorar a experiência do paciente, melhorar a saúde das populações e reduzir o custo per capita. Tendência: agentes inteligentes e educacionais adaptativos.<\/p><p><b>Contraponto:<\/b> o exame físico continua insubstituível em muitos cenários; sigilo e segurança de dados; registro em prontuário; <b>a responsabilidade do médico é a mesma do atendimento presencial<\/b>; a exclusão digital pode ampliar a desigualdade. Conclusão do professor: <b>modelo híbrido<\/b> — tecnologia + zelo da prática clínica.<\/p>", "tab": [{"cap": "Modalidades de telessaúde (Aula 10)", "h": ["Modalidade", "O que é", "Evidência destacada"], "r": [["Teleconsulta", "Consulta, diagnóstico e prescrição remotos", "Amplia acesso; eficaz em IC, DII, AR em remissão"], ["Tele-educação", "Capacitação de profissionais e educação de pacientes", "Rush 2018: superior em 11/16 estudos, equivalente em 5"], ["Telemonitoramento", "Acompanhamento remoto, wearables", "3.896 pacientes: menos resposta rápida e UTI não planejada"], ["Telerregulação", "Triagem, encaminhamento, filas", "E-consultas evitam presencial em 34–92%"], ["Teleconsultoria", "Suporte entre profissionais", "Evita visitas desnecessárias"]]}], "cmp": {"cap": "Telessaúde × telemedicina", "h": ["Aspecto", "Telemedicina", "Telessaúde"], "r": [["Definição", "Prática médica mediada por TDICs (Res. CFM 2.314/2022)", "Uso de TDICs para assistência, educação e gestão"], ["Escopo", "Ato médico", "Mais amplo (inclui educação e gestão, outros profissionais)"]]}, "flow": {"cap": "Ponto e contraponto", "s": ["Ponto: acesso, custo, eficiência de filas, continuidade, capacitação", "Contraponto: exame físico, sigilo/dados, prontuário, mesma responsabilidade, exclusão digital", "Síntese: modelo híbrido"]}, "imgs": [], "refs": ["Carvalho LD. Aula 10 — Telessaúde. FCMMG; 2026.", "CFM. Resolução 2.314/2022.", "Rush KL et al. Patient Educ Couns. 2018;101(8):1310–1321.", "Varma N et al. J Am Coll Cardiol. 2020;76(11):1363–1374."]}, {"id": "P12", "d": "per", "n": "Perícia médica cível — responsabilidade civil e os casos da aula", "short": "Perícia cível e responsabilidade civil", "pages": [17, 18], "aula": "Aula 11", "rev": "<p><b>Bases processuais:<\/b> CPC art. 156 — o juiz será assistido por perito quando a prova depender de conhecimento técnico (peritos de cadastro do tribunal); art. 465 — o juiz nomeia perito especializado e fixa prazo; <b>em 15 dias da intimação<\/b> as partes podem arguir impedimento ou suspeição, indicar assistente técnico e apresentar quesitos; art. 473 — conteúdo do laudo.<\/p><p><b>Estrutura da responsabilidade civil médica:<\/b> <b>conduta<\/b> (dentro do padrão?), <b>culpa<\/b> (negligência, imprudência, imperícia — o perito descreve tecnicamente; quem qualifica a culpa é o juiz), <b>dano<\/b> (definitivo? MMI) e <b>nexo causal<\/b> (o dano decorre da conduta, da doença de base ou da conduta da própria vítima?). A <b>obrigação de meio<\/b> é a regra na medicina; hospitais e clínicas respondem como prestadores de serviço (CDC; CC 927 parágrafo único).<\/p><p><b>Caso I (PMMG):<\/b> candidato eliminado por acuidade visual; edital exige AV ≥ 0,5 em cada olho sem correção, desde que com correção atinja 1,0. Achado: 20/30 (≈ 0,6) em cada olho sem correção e 1,0 com correção → <b>APTO<\/b>. Quesitos sobre o ambiente do exame do réu fogem ao meio probatório (art. 473 §2º); a adequação científica do índice não cabe ao perito (critério legispericial); prognóstico sem evidência não se afirma.<\/p><p><b>Caso II (isenção de IR):<\/b> ceratocone; OD 20/80, OE 20/200 com melhor correção → não é cegueira legal (≤ 0,05) nem monocular → <b>sem enquadramento<\/b>; critério legal é objetivo.<\/p><p><b>Caso III (vasectomia):<\/b> falha 0,9–2,0%; espermograma é absolutamente necessário para confirmar azoospermia. Falha do dever de <b>informação<\/b> (“sem erro”) e de <b>vigilância<\/b> (sem espermograma) → nexo plausível com a gestação pós-procedimento; a filha extraconjugal concebida sabendo-se fértil → <b>culpa exclusiva da vítima<\/b>, rompe o nexo; o divórcio não tem nexo com o ato médico.<\/p><p><b>Caso IV (triagem):<\/b> DM1, glicemia 345, vômitos, dor abdominal, FC 117 classificada “verde” e não atendida por plano inativo → óbito. Suspeita de CAD (glicemia > 250, pH < 7,3, HCO₃ < 18, cetose); classificação inadequada e recusa administrativa diante de urgência; nexo por <b>perda de chance<\/b>; perícia indireta (prontuário, ficha de triagem).<\/p>", "tab": [{"cap": "Estrutura da responsabilidade civil médica (Aula 11)", "h": ["Elemento", "Pergunta do perito"], "r": [["Conduta", "O que foi feito? Dentro do padrão?"], ["Culpa (subjetiva)", "Negligência, imprudência, imperícia? (o juiz qualifica)"], ["Dano", "Existe? É definitivo (MMI)?"], ["Nexo causal", "Decorre da conduta, da doença de base ou da conduta da vítima?"]]}, {"cap": "Os quatro casos da aula", "h": ["Caso", "Ponto técnico", "Conclusão"], "r": [["I — PMMG", "0,6 sem correção, 1,0 com correção vs edital ≥ 0,5 e 1,0", "Apto"], ["II — IR por cegueira", "OE 20/200 (0,1), OD 20/80 com melhor correção", "Sem enquadramento (cegueira ≤ 0,05)"], ["III — vasectomia", "Sem espermograma; “sem erro”", "Falha de informação e vigilância; culpa da vítima rompe nexo da filha extraconjugal"], ["IV — triagem DM1", "Glicemia 345, vômitos, taquicardia, classificada verde", "Suspeita de CAD; perda de chance; perícia indireta"]]}], "cmp": {"cap": "CAD × EHH (doutrina do Caso IV)", "h": ["Critério", "CAD", "EHH"], "r": [["Glicemia", "> 250", "> 600"], ["pH / HCO₃", "< 7,3 / < 18", "Sem acidose significativa"], ["Cetose", "Presente", "Ausente/discreta"], ["Osmolaridade", "Variável", "Efetiva > 320"], ["Clínica", "Kussmaul, hálito cetônico, vômitos, dor abdominal", "Mais comum o coma"]]}, "flow": {"cap": "Prazos e atos no processo (CPC)", "s": ["Art. 156 — juiz assistido por perito", "Art. 465 — nomeação e prazo; 15 dias para impedimento/suspeição, assistente técnico e quesitos", "Exame direto ou indireto", "Art. 473 — laudo; §2º sem opinião pessoal", "Juiz decide (culpa é qualificação jurídica)"]}, "imgs": [], "refs": ["Carvalho LD. Aula 11 — Responsabilidade civil. FCMMG; 2026.", "Brasil. CPC (arts. 156, 465, 473); Código Civil (art. 927); CDC.", "Resolução Conjunta 4.278/2013 PMMG/CBMMG (caso I)."]}], "questions": [{"id": "C01-Q01", "t": "C01", "sub": "Paciente instável: prioridade da abordagem", "comp": "Conduta inicial no abdome agudo", "rac": "Aplicação / priorização", "dif": "média", "p": [3], "q": "Mulher de 29 anos chega ao pronto-socorro com dor abdominal difusa de início súbito há 1 hora, seguida de lipotimia. PA 80 × 50 mmHg, FC 128 bpm, pele fria e pálida. O abdome é doloroso difusamente, com descompressão dolorosa. Qual é a sequência mais adequada nos primeiros minutos?", "o": [["Ressuscitação (ABC, dois acessos, cristaloide, tipagem e hemoderivados), FAST e β-hCG à beira-leito, sem aguardar TC", "Paciente instável é tratada como abdome hemorrágico até prova em contrário: estabiliza-se e investiga-se à beira-leito; hemoperitônio no FAST em mulher fértil leva ao centro cirúrgico."], ["Analgesia, hidratação e TC de abdome com contraste para definir a etiologia antes de qualquer decisão cirúrgica", "A TC é o exame do paciente estável. Levar uma paciente em choque para a sala de tomografia atrasa a hemostasia e é erro clássico de conduta."], ["Rx de tórax PA ortostático para pesquisar pneumoperitônio, já que a dor foi súbita, difusa e com descompressão dolorosa", "Dor súbita também ocorre no perfurativo, mas a hipotensão com lipotimia aponta para hemorragia; além disso, a paciente não tem condição de ficar em pé por minutos."], ["US transvaginal eletiva após estabilização em enfermaria e dosagem seriada de β-hCG quantitativo", "A US transvaginal e o β-hCG seriado servem à paciente estável com suspeita de ectópica íntegra; na instável, a conduta é imediata."]], "pista": "Hipotensão + taquicardia + lipotimia definem instabilidade: o raciocínio sindrômico começa pela hemodinâmica, não pela etiologia.", "pp": ["Pergunta: o que fazer nos primeiros minutos, não qual é o diagnóstico final.", "Dados decisivos: PA 80 × 50, FC 128, lipotimia, pele fria — choque.", "Regra das aulas 9 e 10: instável = hemorrágico até prova em contrário.", "Ação: ABC, dois acessos calibrosos, cristaloide, tipagem e hemoderivados.", "Investigação compatível com instabilidade: FAST e β-hCG à beira-leito (mulher fértil).", "Hemoperitônio → centro cirúrgico; não há espaço para TC."], "ap": "<p>O fluxograma 1 do resumo inicia com uma única pergunta — <b>instabilidade hemodinâmica?<\/b> — porque ela muda a ordem de tudo. No paciente estável, caracteriza-se a dor e escolhe-se o exame que confirma a síndrome; no instável, a investigação precisa caber na sala de emergência. O FAST avalia quatro janelas (Morison, esplenorrenal, pelve e subcostal) em poucos minutos e responde à pergunta que importa: há sangue livre? Na mulher em idade fértil, o β-hCG é obrigatório, e a associação β-hCG positivo + hemoperitônio + choque é gravidez ectópica rota até prova em contrário. Em homem idoso, a mesma lógica levaria a pensar em AAA roto, também sem passar pela TC.<\/p>", "mud": [["A paciente estivesse com PA 120 × 80 e FC 88", "Caracterizar a dor e solicitar US/TC conforme a síndrome", "Estabilidade permite a investigação completa"], ["Fosse homem de 72 anos, tabagista, com massa pulsátil", "Mesma ressuscitação; acionar cirurgia vascular, hipotensão permissiva, centro cirúrgico", "AAA roto instável não vai à TC"], ["O FAST fosse negativo e a paciente respondesse ao volume", "Reavaliar e, estável, prosseguir para TC", "A estabilidade recuperada reabre a investigação"]], "arm": "O erro mais comum é tratar a TC como etapa obrigatória do abdome agudo. Outra armadilha é perseguir o pneumoperitônio só porque a dor foi súbita: dor súbita é comum a perfurativo, hemorrágico e vascular — é a hemodinâmica que separa o hemorrágico.", "ouro": "Instável não viaja: estabilize, faça FAST (e β-hCG na mulher fértil) e leve ao centro cirúrgico.", "m2": ["Homem de 68 anos, hipertenso, dor lombar súbita, PA 84 × 50, FC 120, massa pulsátil periumbilical. Qual o próximo passo?", "Ressuscitação com hipotensão permissiva, US/FAST à beira-leito e centro cirúrgico para reparo aberto ou EVAR — sem TC, porque está instável (Aula 10; complemento ESVS 2024)."], "n": ["O primeiro passo do abdome agudo é avaliar a estabilidade.", "Instável = hemorrágico até prova em contrário.", "FAST e β-hCG à beira-leito; TC é para o estável.", "Mulher fértil + hemoperitônio = ectópica rota até prova em contrário.", "Dor súbita não é exclusiva do perfurativo."]}, {"id": "C01-Q02", "t": "C01", "sub": "Reconhecimento da síndrome perfurativa", "comp": "Classificação sindrômica e exame inicial", "rac": "Interpretação de quadro clínico", "dif": "fácil", "p": [3, 19], "q": "Homem de 55 anos refere dor epigástrica súbita, “como uma facada”, há 4 horas, que se espalhou para todo o abdome. Está imóvel, FC 112 bpm, PA 110 × 70 mmHg. O abdome está rígido difusamente e há timpanismo na linha hemiclavicular direita, onde deveria haver macicez hepática. Qual síndrome e qual exame inicial?", "o": [["Perfurativa; radiografia de tórax PA ortostática", "Dor em punhalada, abdome em tábua e sinal de Jobert configuram o perfurativo; o Rx de tórax PA em pé é o exame inicial para pneumoperitônio."], ["Obstrutiva; radiografia simples de abdome em pé e deitado", "O obstrutivo cursa com cólica intermitente, vômitos e distensão com RHA aumentados, não com rigidez súbita e perda da macicez hepática."], ["Vascular; angiotomografia de abdome", "Na isquemia o abdome é inicialmente flácido, com dor desproporcional ao exame; aqui o exame físico é exuberante desde o início."], ["Inflamatória; ultrassonografia de abdome total", "O inflamatório tem início progressivo, febre e dor localizada; não explica dor súbita com timpanismo hepático."]], "pista": "Timpanismo na área de macicez hepática (sinal de Jobert) sugere ar livre na cavidade.", "pp": ["Identificar o tipo de dor: súbita, em punhalada, generalizando.", "Exame: abdome em tábua e Jobert.", "Paciente estável: pode-se fazer imagem.", "Síndrome: perfurativa.", "Exame inicial: Rx de tórax PA ortostático; TC se dúvida."], "ap": "<p>O sinal de Jobert não é patognomônico, mas, junto com a rigidez difusa e a dor em punhalada, fecha o padrão perfurativo. O Rx de tórax PA ortostático é preferido como exame inicial porque o ar sobe e se acumula sob as cúpulas; a sensibilidade melhora se o paciente permanecer 5–10 minutos em pé. Quem não consegue ficar de pé faz Rx de abdome em decúbito lateral esquerdo com raios horizontais; no decúbito dorsal, procura-se o sinal de Rigler. A TC é o exame mais sensível e mostra local e etiologia, ficando para a dúvida diagnóstica no paciente estável.<\/p>", "mud": [["A dor fosse em cólica, com vômitos e distensão", "Síndrome obstrutiva; Rx de abdome e TC", "Padrão de dor intermitente e distensão"], ["O paciente não conseguisse ficar em pé", "Rx em decúbito lateral esquerdo com raios horizontais", "Ar entre fígado e parede lateral"], ["Houvesse hipotensão refratária", "Ressuscitação e cirurgia sem atrasar por exames", "Instabilidade muda a prioridade"]], "arm": "Confundir “dor súbita” com vascular: no vascular o abdome começa flácido; no perfurativo, rígido. Outra armadilha é pedir US para pneumoperitônio — o exame inicial é o Rx de tórax em pé.", "ouro": "Punhalada + tábua + Jobert = perfurativo → Rx de tórax PA em pé.", "m2": ["Idosa acamada, dor súbita e rigidez abdominal, não consegue sentar. Rx em decúbito dorsal mostra as duas faces da parede intestinal. O que é?", "Sinal de Rigler (dupla parede): gás dentro e fora da alça — pneumoperitônio. Confirmar com TC se estável."], "n": ["Perfurativo: dor súbita, em punhalada, localizada → difusa.", "Abdome em tábua e Jobert (não patognomônico).", "Rx de tórax PA ortostático é o exame inicial.", "Decúbito lateral esquerdo para quem não fica em pé.", "Rigler no decúbito dorsal; TC é o mais sensível."], "img": ["c-019-021"]}, {"id": "C01-Q03", "t": "C01", "sub": "Reconhecimento da síndrome vascular", "comp": "Classificação sindrômica", "rac": "Interpretação de quadro clínico", "dif": "média", "p": [3, 29], "q": "Idoso de 81 anos, com fibrilação atrial sem anticoagulação, refere dor periumbilical intensa iniciada há 3 horas. Está agitado, gritando de dor, mas o abdome é flácido, pouco doloroso à palpação e sem defesa. Qual é a síndrome mais provável e o exame de escolha?", "o": [["Vascular (isquemia mesentérica); angiotomografia", "Dor desproporcional ao exame físico em paciente com fonte embólica é o sinal clássico da isquemia mesentérica; a angioTC é o exame de escolha."], ["Obstrutiva; radiografia simples de abdome", "A obstrução se manifesta com cólica, vômitos, distensão e parada de eliminação, ausentes no enunciado."], ["Inflamatória; ultrassonografia de abdome", "Inflamatório produz dor localizada com defesa; aqui o exame é pobre, o que não combina com peritonite localizada."], ["Funcional; observação clínica, pois o exame físico é normal", "Abdome flácido não tranquiliza: na isquemia a fase inicial é pobre ao exame e o diagnóstico tardio é a regra."]], "pista": "Dor intensa que “não bate” com o exame + fibrilação atrial.", "pp": ["Dor intensa com abdome flácido = dissociação clínico-exame.", "Fator de risco: FA sem anticoagulação (fonte embólica).", "Síndrome vascular; etiologia provável embólica.", "Exame: angioTC imediata, sem esperar peritonite."], "ap": "<p>A isquemia mesentérica tem mortalidade de 50–100% justamente porque a fase inicial engana: o intestino isquêmico dói muito antes de o peritônio parietal se inflamar. Quando surgem defesa, febre e choque, a necrose já pode estar instalada (perfuração em 12–24 h). Por isso o resumo frisa que abdome flácido não tranquiliza e lactato normal no início não afasta. A conduta parte de ressuscitação, ATB, heparina plena e angioTC imediata.<\/p>", "mud": [["Houvesse peritonite difusa e choque", "Laparotomia com revascularização e ressecção do não viável", "Necrose/perfuração já instalada"], ["O paciente relatasse dor pós-prandial e emagrecimento há meses", "Pensar em trombose arterial", "“Angina intestinal” sugere placa ostial"], ["Fosse mulher jovem usando ACO com dor insidiosa", "Pensar em trombose venosa mesentérica", "Estrogênio é fator de risco"]], "arm": "Liberar o paciente porque “o abdome está bom” é o erro que mata. Pedir só Rx simples também atrasa: o Rx é inespecífico na fase inicial.", "ouro": "Dor desproporcional ao exame + FA = isquemia mesentérica até prova em contrário → angioTC já.", "m2": ["Paciente em UTI, em choque séptico com noradrenalina em dose alta, desenvolve distensão e acidose láctica sem oclusão na angioTC. Qual etiologia?", "Isquemia não oclusiva (baixo fluxo, vasopressores); tratamento: suporte hemodinâmico e papaverina intra-arterial."], "n": ["Sinal clássico: dor desproporcional ao exame físico.", "Embolia é a etiologia mais comum (FA).", "Fase inicial: abdome flácido, sem febre.", "AngioTC é o exame de escolha.", "Mortalidade 50–100%; tempo é intestino."]}, {"id": "C01-Q04", "t": "C01", "sub": "Dor visceral × somática", "comp": "Fisiopatologia da dor abdominal", "rac": "Compreensão conceitual", "dif": "média", "p": [3], "q": "Na apendicite aguda, a dor costuma começar mal localizada na região periumbilical e, horas depois, fixar-se na fossa ilíaca direita, piorando com a tosse. Qual explicação fisiopatológica é correta?", "o": [["A dor inicial é visceral (intestino médio, fibras autonômicas); a fixação na FID é somática, por irritação do peritônio parietal", "O apêndice deriva do intestino médio, cuja dor visceral se projeta na região periumbilical; quando a inflamação atinge o peritônio parietal, a dor passa a ser somática e bem localizada."], ["A dor inicial é somática por distensão da parede abdominal; a dor na FID é visceral por isquemia do apêndice", "Inverte os conceitos: a dor mal localizada na linha média é visceral; a bem localizada e que piora com tosse é somática."], ["A migração ocorre porque o apêndice muda de posição à medida que se distende e se aproxima da parede abdominal anterior direita, na FID", "O apêndice não migra; o que muda é a via de condução da dor, conforme o peritônio parietal é atingido."], ["A dor periumbilical resulta de irritação do nervo obturador; a dor em FID, do músculo psoas", "Psoas e obturador indicam posições do apêndice (retrocecal e pélvico), não explicam a sequência periumbilical → FID."]], "pista": "Dor visceral é mal localizada na linha média e segue a origem embriológica do órgão.", "pp": ["Fase 1: distensão do apêndice → fibras viscerais → periumbilical (intestino médio).", "Fase 2: inflamação atinge o peritônio parietal → dor somática localizada em FID.", "Piora com tosse = sinal de Dunphy (irritação peritoneal)."], "ap": "<p>O complemento do resumo (Sabiston) organiza a dor visceral por segmento embriológico: intestino anterior → epigástrio; intestino médio → periumbilical; intestino posterior → hipogástrio. A dor visceral vem com náuseas e sudorese. Já a dor somática nasce do peritônio parietal inflamado, é localizada e piora com movimento e tosse — base dos sinais de Blumberg e Dunphy.<\/p>", "mud": [["O apêndice fosse retrocecal", "Dor pode irradiar para o dorso; psoas positivo", "Peritônio parietal anterior pouco irritado"], ["A paciente estivesse no 3º trimestre", "Dor em flanco/hipocôndrio direito", "Útero desloca o apêndice cranialmente"], ["Houvesse peritonite difusa", "Dor generalizada, abdome em tábua", "Irritação parietal difusa"]], "arm": "Inverter visceral e somática é a confusão mais comum. Outra é achar que ausência de dor em FID exclui apendicite — posições atípicas mudam a projeção.", "ouro": "Visceral = linha média e mal localizada; somática = sobre o órgão e piora com movimento.", "m2": ["Paciente com colecistite aguda inicia dor epigástrica que depois se fixa no hipocôndrio direito. Por quê?", "Vesícula deriva do intestino anterior (dor visceral epigástrica); a inflamação do peritônio parietal adjacente localiza a dor no HD."], "n": ["Dor visceral: autonômica, linha média, com náuseas.", "Epigástrio, periumbilical e hipogástrio = intestino anterior, médio, posterior.", "Dor somática: peritônio parietal, localizada.", "Migração da dor na apendicite = visceral → somática.", "Dunphy: dor ao tossir = irritação peritoneal."]}, {"id": "C01-Q05", "t": "C01", "sub": "Síndrome obstrutiva: exame padrão-ouro", "comp": "Escolha de exame", "rac": "Aplicação", "dif": "fácil", "p": [3, 23], "q": "Mulher de 66 anos, com laparotomia prévia, apresenta dor em cólica, vômitos e distensão abdominal há 1 dia. RHA aumentados com timbre metálico. Está estável. O Rx mostrou níveis hidroaéreos. Para definir ponto de transição, causa e sinais de sofrimento de alça, qual exame é o padrão-ouro?", "o": [["Tomografia computadorizada de abdome", "A TC define o ponto de transição, a causa (aderência, tumor, hérnia, volvo) e sinais de sofrimento como redemoinho e parede sem realce."], ["Radiografia contrastada com bário por via oral", "O bário pode impactar e piorar a obstrução; o contraste usado com valor prognóstico na brida é hidrossolúvel, e não substitui a TC."], ["Ultrassonografia de abdome total", "Útil em gestantes e pacientes graves, mas tem baixa acurácia para víscera oca e não define bem a causa."], ["Colonoscopia", "A obstrução descrita é provavelmente de delgado; a colonoscopia não avalia o ponto de transição no delgado."]], "pista": "Rx sugere obstrução, mas não define bem causa nem local.", "pp": ["Síndrome: obstrutiva (cólica, vômitos, distensão, RHA metálicos).", "Rx confirmou o padrão, mas tem limitação.", "Pergunta pede ponto de transição, causa e sofrimento.", "Resposta: TC (padrão-ouro)."], "ap": "<p>Na Aula 10, o Rx de abdome mostra distensão e níveis hidroaéreos — alças centrais com empilhamento de moedas no delgado e periféricas com haustrações no cólon — mas não identifica bem a causa nem o local exato. A TC mostra o ponto de transição (alças dilatadas a montante e colabadas a jusante), a causa e os sinais de sofrimento que mudam a conduta: redemoinho do mesentério, fecalização do delgado, espessamento/edema, ausência de realce da parede e pneumatose.<\/p>", "mud": [["A paciente fosse gestante", "US à beira-leito como apoio", "Evitar radiação"], ["A TC mostrasse redemoinho e parede sem realce", "Cirurgia", "Sinais de estrangulamento"], ["TC indisponível", "Rx de abdome", "Alternativa quando a TC não está disponível"]], "arm": "Achar que o Rx basta para decidir conduta: ele não mostra sofrimento de alça com segurança.", "ouro": "Obstrução: Rx sugere, TC define (local, causa e sofrimento).", "m2": ["Na TC de obstrução de delgado aparecem conteúdo fecaloide dentro de alças ileais dilatadas. O que significa?", "Sinal da fecalização do delgado: obstrução de evolução mais arrastada, sinal descrito na Aula 10 entre os achados tomográficos."], "n": ["TC é o padrão-ouro na obstrução.", "Rx: níveis hidroaéreos, empilhamento de moedas no delgado.", "TC mostra ponto de transição e causa.", "Sinais de sofrimento indicam cirurgia.", "US útil em gestante e à beira-leito."], "img": ["c-023-029"]}, {"id": "C01-Q06", "t": "C01", "sub": "Epidemiologia do abdome agudo", "comp": "Conhecimento de frequências", "rac": "Memória com compreensão", "dif": "fácil", "p": [3], "q": "Sobre a epidemiologia do abdome agudo não traumático apresentada nas aulas, assinale a afirmativa correta.", "o": [["O inflamatório é a síndrome mais frequente, e a apendicite é a principal causa de abdome agudo cirúrgico", "Ambas as afirmações constam do quadro “Na prova” do capítulo 1: inflamatório é o mais frequente e apendicite é a principal causa cirúrgica não traumática."], ["O perfurativo é a síndrome mais frequente, com mortalidade inferior a 1% quando operado nas primeiras horas", "O perfurativo é a 3ª causa, com mortalidade de cerca de 10%."], ["O obstrutivo é o mais frequente, e o câncer colorretal é sua principal causa no delgado", "No delgado a principal causa é a brida; o câncer colorretal é a causa mais comum de obstrução colônica."], ["O hemorrágico é o mais frequente, e o AAA roto é sua principal causa em mulheres jovens", "Em mulher jovem com hemoperitônio, a principal hipótese é gravidez ectópica rota; o AAA é doença de homens idosos."]], "pista": "Lembre o quadro “Na prova” do capítulo 1.", "pp": ["Recordar a frequência: inflamatório é o mais comum.", "Recordar a principal causa cirúrgica: apendicite.", "Recordar gravidade: perfurativo é a 3ª causa, ~10% de mortalidade.", "Eliminar trocas de causa por segmento e por perfil de paciente."], "ap": "<p>Saber as frequências ajuda a montar a lista de hipóteses na ordem certa. Além da sequência inflamatório > outros, as aulas fixam associações por segmento: obstrução de delgado → bridas > hérnias; de cólon → câncer colorretal > volvo > diverticulite. No hemorrágico, a etiologia depende do perfil: mulher fértil → ectópica; homem idoso tabagista → AAA.<\/p>", "mud": [["A pergunta fosse sobre obstrução de cólon", "Câncer colorretal é a principal causa", "Até 60% dos casos"], ["Fosse sobre mortalidade da isquemia mesentérica", "50–100%", "Diagnóstico tardio"], ["Fosse sobre hemorrágico em homem > 60 anos", "AAA roto", "Perfil epidemiológico"]], "arm": "Trocar “mais frequente” por “mais grave”: o vascular é o mais letal, não o mais frequente.", "ouro": "Mais frequente = inflamatório; mais operado = apendicite; perfurativo = 3º e mata ~10%.", "m2": ["Qual a principal causa de abdome agudo perfurativo?", "Úlcera péptica perfurada (Aula 9)."], "n": ["Inflamatório: síndrome mais frequente.", "Apendicite: principal causa de abdome agudo cirúrgico não traumático.", "Perfurativo: 3ª causa, ~10% de mortalidade.", "Delgado: bridas; cólon: câncer colorretal.", "Hemorrágico: ectópica (mulher fértil), AAA (homem idoso)."]}, {"id": "C02-Q01", "t": "C02", "sub": "Alça sentinela", "comp": "Interpretação radiológica", "rac": "Associação topográfica", "dif": "fácil", "p": [4], "q": "Homem de 70 anos com dor em fossa ilíaca esquerda há 3 dias, febre e leucocitose. O Rx simples mostra uma alça fixa, distendida e edemaciada no quadrante inferior esquerdo, sem distensão a montante nem níveis hidroaéreos difusos. Esse achado sugere principalmente:", "o": [["Diverticulite aguda, com alça sentinela adjacente ao foco inflamatório", "Alça sentinela é íleo reflexo localizado ao lado do órgão inflamado; na FIE, aponta para diverticulite."], ["Obstrução mecânica do cólon esquerdo por neoplasia", "Obstrução mecânica dá distensão a montante e níveis hidroaéreos; a alça sentinela, por definição, não tem sinais de obstrução."], ["Volvo de sigmoide em fase inicial", "O volvo produz alça muito distendida em “grão de café”, com distensão maciça, não uma alça isolada e edemaciada."], ["Ureterolitíase esquerda, com alça sentinela típica junto ao ureter distal na pelve", "A alça sentinela da ureterolitíase aparece nos flancos, e o quadro seria de cólica com paciente inquieto, sem febre e leucocitose típicas."]], "pista": "Alça fixa, edemaciada, sem obstrução, ao lado do órgão inflamado.", "pp": ["Ler a definição: alça fixa, edemaciada e distendida sem obstrução = alça sentinela.", "Localizar: FIE.", "Correlacionar com clínica: febre, leucocitose, dor em FIE.", "Hipótese: diverticulite; confirmar com TC com contraste."], "ap": "<p>A alça sentinela é um íleo paralítico localizado: o segmento vizinho ao foco inflamatório perde o peristaltismo e acumula gás. Ela não indica a gravidade nem substitui a TC, mas orienta a localização do processo. A tabela da Aula 9 associa: HD → colecistite; epigástrio/HE → pancreatite e úlcera; FID → apendicite; FIE → diverticulite; flancos → ureterolitíase.<\/p>", "mud": [["A alça estivesse no hipocôndrio direito", "Pensar em colecistite", "Topografia do foco"], ["Houvesse alças centrais dilatadas com empilhamento de moedas", "Obstrução de delgado", "Padrão obstrutivo, não sentinela"], ["Fosse epigástrica em etilista com dor em faixa", "Pancreatite", "Alça sentinela epigástrica/HE"]], "arm": "Confundir alça sentinela com obstrução: a sentinela é focal e sem distensão a montante.", "ouro": "Alça sentinela aponta onde está o fogo — não é obstrução.", "m2": ["Etilista com dor epigástrica em faixa e alça distendida em hipocôndrio esquerdo no Rx. Hipótese?", "Pancreatite aguda com alça sentinela; confirmar com lipase/amilase e imagem."], "n": ["Alça sentinela = íleo reflexo localizado.", "Sem sinais de obstrução.", "FID apendicite; FIE diverticulite.", "HD colecistite; epigástrio/HE pancreatite.", "Flancos ureterolitíase."], "img": ["c-004-000"]}, {"id": "C02-Q02", "t": "C02", "sub": "Abscesso hepático piogênico", "comp": "Conduta", "rac": "Aplicação de critérios", "dif": "média", "p": [5, 6], "q": "Mulher de 63 anos, diabética, operada de colecistectomia há 5 semanas, apresenta febre diária de 39 °C, calafrios e dor em hipocôndrio direito. Leucócitos 19.800, PCR e fosfatase alcalina elevadas. TC: coleção hipoatenuante de 7 cm, com gás, no lobo direito. Qual a conduta mais adequada?", "o": [["Hemoculturas, antibiótico para Gram-negativos e anaeróbios e drenagem percutânea guiada por imagem", "Abscesso piogênico > 3–5 cm em paciente toxemiada: ATB + drenagem percutânea é o padrão; cirurgia fica para falha, ruptura ou abscesso complexo."], ["Metronidazol isolado, sem drenagem, por se tratar de abscesso amebiano", "Gás na coleção e manipulação biliar recente apontam para etiologia piogênica; metronidazol isolado é o tratamento do amebiano."], ["Hepatectomia direita de urgência para remover o parênquima necrótico e toda a cavidade do abscesso hepático", "Ressecção hepática não é a primeira linha; cirurgia é reservada à falha da drenagem, ruptura ou abscessos complexos."], ["Antibiótico oral ambulatorial e nova TC em 4 semanas para documentar a regressão", "Paciente séptica com coleção volumosa precisa de internação, ATB venoso e drenagem."]], "pista": "Gás na coleção + via biliar manipulada + toxemia = piogênico; > 3–5 cm = drenar.", "pp": ["Febre prolongada + dor em HD + FA elevada + coleção = abscesso hepático.", "Gás e origem biliar → piogênico.", "Tamanho 7 cm e sepse → critério de drenagem.", "Conduta: ATB (Gram−, anaeróbios, enterococos) + drenagem percutânea; investigar foco biliar."], "ap": "<p>As vias do piogênico são biliar (a mais frequente), portal (diverticulite, apendicite), hematogênica e direta (pós-operatório). Esquemas citados: ceftriaxona + metronidazol ou piperacilina-tazobactam. A drenagem percutânea guiada por TC/US é o padrão quando o abscesso mede mais de 3–5 cm, há sepse ou falha clínica; o material vai para cultura. A cirurgia é reservada para falha da drenagem, ruptura, etiologia cirúrgica associada e abscessos complexos/multiloculados.<\/p>", "mud": [["Coleção única de 4 cm, sem gás, sorologia para ameba positiva, paciente estável", "Metronidazol sem drenagem", "Amebiano drena-se só em situações especiais"], ["Abscesso multiloculado sem resposta à drenagem", "Cirurgia", "Falha da drenagem"], ["Abscesso de 2 cm, estável", "ATB isolado com vigilância", "Abaixo do critério de tamanho"]], "arm": "Tratar todo abscesso hepático como amebiano, ou drenar todo amebiano. O contexto (gás, via biliar, cultura) decide.", "ouro": "Piogênico grande ou séptico: antibiótico + drenagem percutânea.", "m2": ["Homem de 70 anos com diverticulite recente desenvolve febre e abscesso hepático de 6 cm. Por que via chegou ao fígado?", "Via portal; conduta: ATB + drenagem percutânea e tratamento do foco."], "n": ["Piogênico é o mais comum.", "Via biliar é a origem mais frequente.", "Drenar se > 3–5 cm, sepse ou falha.", "ATB cobre Gram−, anaeróbios e enterococos.", "Cirurgia: falha da drenagem, ruptura, complexos."], "img": ["c-005-002"]}, {"id": "C02-Q03", "t": "C02", "sub": "Abscesso hepático amebiano", "comp": "Diagnóstico diferencial e tratamento", "rac": "Comparação", "dif": "média", "p": [5], "q": "Homem de 34 anos, estável, com febre e dor em hipocôndrio direito há 10 dias. TC: lesão única de 4 cm no lobo direito, sem gás. Sorologia para Entamoeba histolytica positiva; hemoculturas negativas. Qual a conduta inicial?", "o": [["Metronidazol, sem drenagem de rotina", "No amebiano, metronidazol é o tratamento; drenagem fica restrita a risco de ruptura, abscesso volumoso, lobo esquerdo, falha clínica ou dúvida."], ["Drenagem percutânea imediata associada a ceftriaxona", "Drenagem rotineira é a lógica do piogênico; aqui a lesão é pequena, no lobo direito, e o paciente está estável."], ["Laparotomia com drenagem cirúrgica", "Cirurgia não é a abordagem inicial do abscesso amebiano não complicado."], ["Punção para confirmar “pasta de anchova” antes de qualquer tratamento", "A sorologia tem alta sensibilidade; a punção diagnóstica só se justifica em dúvida diagnóstica."]], "pista": "Lesão única, lobo direito, sorologia positiva e cultura negativa: amebiano não complicado.", "pp": ["Perfil: jovem, lesão única, lobo direito, sem gás.", "Sorologia positiva, culturas negativas.", "Sem critérios de drenagem (não volumoso, não lobo esquerdo, sem falha).", "Conduta: metronidazol."], "ap": "<p>O abscesso amebiano resulta da invasão do cólon pela <i>E. histolytica<\/i>, que alcança o fígado pela circulação portal; pode ocorrer sem diarreia. O conteúdo é marrom-avermelhado (“pasta de anchova”) e a cultura bacteriana costuma ser negativa. A resposta ao metronidazol costuma ser rápida. Indicações de drenagem: risco de ruptura, abscesso volumoso, lobo esquerdo (risco de ruptura para o pericárdio), falha clínica ou dúvida diagnóstica.<\/p>", "mud": [["Lesão no lobo esquerdo", "Considerar drenagem", "Risco de ruptura para o pericárdio"], ["Sem melhora após dias de metronidazol", "Drenagem", "Falha clínica"], ["Gás na coleção e cultura positiva", "Tratar como piogênico", "Etiologia bacteriana"]], "arm": "Drenar todo abscesso hepático. A conduta depende da etiologia.", "ouro": "Amebiano: metronidazol; drena-se a exceção.", "m2": ["Mesma etiologia, mas lesão de 9 cm no lobo esquerdo. Conduta?", "Metronidazol + drenagem, por volume e localização (risco de ruptura pericárdica)."], "n": ["Ameba: cólon → porta → fígado.", "Lesão única, lobo direito, pasta de anchova.", "Sorologia sensível; cultura negativa.", "Tratamento: metronidazol.", "Drenar: ruptura iminente, volumoso, lobo esquerdo, falha, dúvida."]}, {"id": "C02-Q04", "t": "C02", "sub": "Abscesso esplênico", "comp": "Tratamento definitivo", "rac": "Aplicação", "dif": "média", "p": [6], "q": "Homem de 45 anos em tratamento de endocardite infecciosa evolui com febre persistente, dor em hipocôndrio esquerdo irradiada para o ombro esquerdo e esplenomegalia. TC: coleção hipoatenuante no baço. Qual o tratamento definitivo clássico e o cuidado associado?", "o": [["Esplenectomia, seguida de vacinação contra pneumococo, meningococo e Haemophilus influenzae", "Esplenectomia é o tratamento definitivo clássico; a asplenia exige vacinação contra germes encapsulados."], ["Drenagem percutânea como rotina, pois no baço o risco de sangramento do procedimento é menor que no fígado", "É o inverso: no baço a drenagem percutânea tem maior risco de sangramento e fica para casos selecionados."], ["Antibiótico isolado por 6 semanas, sem procedimento", "Abscesso esplênico tem alta morbimortalidade; o controle do foco é necessário."], ["Esplenectomia sem necessidade de vacinação, pois o paciente já usa antibiótico", "Antibiótico atual não protege contra sepse pós-esplenectomia futura por germes encapsulados."]], "pista": "Mecanismo hematogênico (endocardite) + Kehr + coleção esplênica.", "pp": ["Endocardite = principal mecanismo (hematogênico).", "Febre + dor em HE + esplenomegalia + Kehr.", "Tratamento definitivo: esplenectomia.", "Pós-operatório: vacinas contra encapsulados."], "ap": "<p>O abscesso esplênico é raro, mas grave. Mecanismos: hematogênico (principal), imunossupressão, infarto esplênico infectado (falciforme, embolia séptica) e trauma/pós-operatório. Agentes: <i>S. aureus<\/i>, estreptococos, enterobactérias, anaeróbios e fungos em imunossuprimi
