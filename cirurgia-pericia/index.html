 idoso."], ["Diverticulectomia sempre, pois todo Meckel encontrado acaba complicando ao longo da vida", "A maioria é assintomática, e o risco cai com a idade."], ["Ressecção ileal segmentar profilática com anastomose, pelo risco de mucosa gástrica ectópica", "Ressecção sem indicação aumenta morbidade sem benefício."], ["Converter para laparotomia para explorar todo o delgado em busca de outros divertículos", "Não há indicação."]], "pista": "Idosa, pequeno, sem alterações.", "pp": ["Achado incidental assintomático.", "Risco de complicar: 4,2% infância, 3% adulto, ~0 idoso.", "Soltero & Bill: ~800 cirurgias para evitar 1 complicação.", "Revisões 2018/2024: ressecção seletiva em jovem, homem, > 2 cm, alteração macroscópica.", "Idosa, 1,5 cm, sem alterações → acompanhar."], "ap": "<p>A discussão do incidental é de risco-benefício. O estudo de Soltero & Bill (202 casos de Meckel doente) sustentou a não ressecção rotineira. Revisões mais recentes citadas na aula sugerem ressecção seletiva em perfis de maior risco: jovens, homens, divertículo > 2 cm, alterações macroscópicas ou tecido ectópico palpável.<\/p>", "mud": [["Homem de 20 anos, divertículo de 3 cm com tecido ectópico palpável", "Considerar ressecção seletiva", "Perfil de maior risco"], ["Divertículo sintomático", "Cirurgia conforme base e complicação", "Indicação clara"], ["Base estreita e sintomático", "Diverticulectomia simples", "Sem alças acometidas"]], "arm": "Ressecar todo Meckel encontrado.", "ouro": "Incidental no idoso: deixa; no jovem de risco: considera.", "m2": ["Menino de 15 anos, achado incidental de Meckel de 4 cm com área endurecida na base. Conduta?", "Considerar ressecção seletiva (jovem, homem, > 2 cm, tecido ectópico palpável)."], "n": ["Maioria assintomática.", "Risco cai com a idade.", "~800 cirurgias para evitar 1 complicação.", "Ressecção seletiva: jovem, homem, > 2 cm, alteração macroscópica.", "Idoso: acompanhar."]}, {"id": "C05-Q08", "t": "C05", "sub": "Investigação após cintilografia negativa", "comp": "Propedêutica", "rac": "Decisão sob incerteza", "dif": "difícil", "p": [17, 18], "q": "Criança de 3 anos com dois episódios de hematoquezia volumosa indolor e cintilografia com Tc-99m negativa. No momento, há sangramento ativo com instabilidade leve, responsiva a volume. Qual exame pode identificar um achado considerado patognomônico do Meckel?", "o": [["Angiografia mesentérica, ao identificar a artéria vitelina", "Com sangramento ativo (≥ 0,5 mL/min), a angiografia pode mostrar a artéria vitelina, achado patognomônico."], ["Repetir a cintilografia, que exclui o diagnóstico se negativa", "Cintilografia tem S 85%; não exclui mesmo repetida."], ["US de abdome, que mostra a mucosa gástrica ectópica", "US tem baixa S e E para o divertículo em si."], ["Retossigmoidoscopia com biópsia do divertículo", "Não alcança o íleo a 60 cm da VIC."]], "pista": "Sangramento ativo permite angiografia; artéria vitelina é o achado-chave.", "pp": ["Cintilografia negativa não exclui (S 85%).", "Sangramento ativo: angiografia (≥ 0,5 mL/min).", "Artéria vitelina = patognomônico.", "Alternativas: cápsula/enteroscopia; videolaparoscopia diagnóstica e terapêutica."], "ap": "<p>O fluxograma 7 lista, para cintilografia inconclusiva: angiografia, cápsula/enteroscopia e videolaparoscopia (diagnóstica e terapêutica). Em criança com sangramento recorrente e alta suspeita, a laparoscopia frequentemente resolve o diagnóstico e o tratamento no mesmo tempo.<\/p>", "mud": [["Sem sangramento ativo", "Cápsula/enteroscopia ou laparoscopia", "Angiografia exige fluxo"], ["Instabilidade refratária", "Cirurgia", "Controle do sangramento"], ["Cintilografia positiva", "Laparoscopia com ressecção segmentar", "Diagnóstico confirmado"]], "arm": "Tratar cintilografia negativa como exclusão.", "ouro": "Artéria vitelina na angiografia = Meckel.", "m2": ["Qual o limiar de fluxo para a angiografia no Meckel, segundo a aula?", "≥ 0,5 mL/min."], "n": ["Cintilografia negativa não exclui.", "Angiografia: sangramento ativo ≥ 0,5 mL/min.", "Artéria vitelina = patognomônico.", "Cápsula/enteroscopia se imagem inconclusiva.", "Laparoscopia: diagnóstica e terapêutica."]}, {"id": "C06-Q01", "t": "C06", "sub": "Úlcera péptica: perfurar × sangrar", "comp": "Anatomia aplicada", "rac": "Correlação anatômica", "dif": "média", "p": [20], "q": "Sobre a úlcera péptica complicada, segundo a Aula 9, qual afirmação é correta?", "o": [["Úlceras da parede anterior tendem a perfurar; as da parede posterior duodenal tendem a sangrar (artéria gastroduodenal)", "A parede anterior é livre para a cavidade; a posterior do bulbo repousa sobre a artéria gastroduodenal."], ["Úlceras da parede posterior tendem a perfurar para a cavidade livre, e as anteriores sangram pela artéria gástrica esquerda", "Inverte a regra: anterior perfura; posterior sangra (gastroduodenal)."], ["A perfuração nunca é a primeira manifestação, pois todos os pacientes têm história longa de dispepsia", "Em ~30% a perfuração é a primeira manifestação."], ["A localização gástrica responde por cerca de 90% das perfurações, sendo a duodenal rara", "Duodenal ≈ 60% das perfurações."]], "pista": "Anterior perfura, posterior sangra.", "pp": ["Anatomia: parede anterior voltada à cavidade peritoneal.", "Parede posterior do bulbo sobre a gastroduodenal.", "Logo: anterior → perfuração; posterior → hemorragia.", "Dados: duodenal ≈ 60%; 30% sem história prévia."], "ap": "<p>Fatores de risco destacados: AINEs, AAS, corticoterapia, <i>H. pylori<\/i>, tabagismo, etilismo, idade avançada, sexo masculino e tumor maligno. A úlcera perfurada é a principal causa de abdome agudo perfurativo; o caso 6.1 do resumo (usuário de diclofenaco, tabagista e etilista) reúne vários desses fatores.<\/p>", "mud": [["Hematêmese volumosa por úlcera bulbar posterior", "Hemorragia (gastroduodenal)", "Parede posterior"], ["Dor súbita, tábua e pneumoperitônio", "Perfuração (parede anterior)", "Comunicação com a cavidade"], ["Úlcera gástrica perfurada", "Biópsia da borda", "Excluir câncer"]], "arm": "Inverter anterior/posterior.", "ouro": "Anterior perfura; posterior sangra.", "m2": ["Paciente com melena e úlcera bulbar posterior com vaso visível. Qual artéria?", "Artéria gastroduodenal."], "n": ["Principal causa de perfurativo.", "Anterior perfura; posterior sangra.", "Duodenal ≈ 60%.", "30%: perfuração como primeira manifestação.", "AINE, H. pylori, tabagismo, etilismo."]}, {"id": "C06-Q02", "t": "C06", "sub": "Imagem do pneumoperitônio", "comp": "Escolha de exame", "rac": "Aplicação", "dif": "média", "p": [19], "q": "Idoso acamado, com sequela de AVC, apresenta dor abdominal súbita e rigidez. Não consegue ficar em pé nem sentado. Qual radiografia é a melhor alternativa para pesquisar pneumoperitônio?", "o": [["Abdome em decúbito lateral esquerdo com raios horizontais", "O ar livre sobe e se interpõe entre o fígado e a parede lateral, visível com raios horizontais."], ["Tórax PA ortostático, após 10 minutos em pé com apoio", "Paciente não consegue ficar em pé; é o exame inicial apenas para quem fica."], ["Abdome em decúbito ventral com raios verticais", "Raios verticais não mostram nível de ar; decúbito ventral não é a técnica descrita."], ["Tórax em perfil deitado com raios verticais", "Não é a técnica indicada nas aulas."]], "pista": "Ar sobe para o ponto mais alto: com o paciente de lado esquerdo, é o flanco direito.", "pp": ["Exame inicial ideal: Rx de tórax PA ortostático.", "Paciente não fica em pé → decúbito lateral esquerdo com raios horizontais.", "Decúbito dorsal: procurar Rigler.", "TC é o mais sensível se estável."], "ap": "<p>Com o paciente em decúbito lateral esquerdo, o flanco direito fica para cima; o ar livre se acumula entre o fígado e a parede, onde normalmente não há gás. Os raios horizontais permitem ver a interface. No decúbito dorsal, o sinal de Rigler (dupla parede) aparece quando há ar dentro e fora da alça.<\/p>", "mud": [["Paciente deambulando", "Rx de tórax PA ortostático", "Exame inicial"], ["Rx em decúbito dorsal com paredes da alça visíveis dos dois lados", "Sinal de Rigler", "Gás dentro e fora"], ["Dúvida e paciente estável", "TC", "Mais sensível"]], "arm": "Insistir no Rx em pé em quem não consegue ficar em pé.", "ouro": "Não fica em pé: decúbito lateral esquerdo com raios horizontais.", "m2": ["Paciente fica em pé apenas 1 minuto e o Rx é negativo. O que pode ter faltado?", "Tempo: 5–10 min em pé aumentam a sensibilidade para pequenos volumes."], "n": ["Rx de tórax PA ortostático: inicial.", "Ficar 5–10 min em pé.", "Decúbito lateral E: quem não fica em pé.", "Rigler no decúbito dorsal.", "TC: mais sensível."], "img": ["c-019-022", "c-019-023"]}, {"id": "C06-Q03", "t": "C06", "sub": "Ulcerorrafia e pós-operatório", "comp": "Conduta cirúrgica e seguimento", "rac": "Sequência terapêutica", "dif": "média", "p": [20, 21], "q": "Paciente operado por úlcera gástrica pré-pilórica perfurada, submetido a ulcerorrafia com patch omental de Graham. Qual conjunto de medidas pós-operatórias é o adequado?", "o": [["IBP em dose plena, tratar H. pylori, suspender AINE, EDA em 6–8 semanas e biópsia da borda da úlcera", "Na úlcera gástrica a biópsia exclui câncer; IBP, erradicação e EDA de controle completam o seguimento."], ["Suspender o IBP após a alta, pois a sutura resolveu a úlcera e o patch omental impede qualquer recidiva futura", "A sutura trata a perfuração, não a doença ulcerosa."], ["Gastrectomia total eletiva em 30 dias para prevenir nova perfuração em todos os casos", "Não há indicação rotineira de gastrectomia."], ["Manter o AINE em dose menor e repetir a EDA apenas se houver novo sangramento digestivo", "AINE deve ser suspenso; EDA de controle é programada."]], "pista": "Gástrica → biópsia; todas → IBP, H. pylori, sem AINE, EDA.", "pp": ["Cirurgia: ulcerorrafia + patch omental (Graham).", "IBP em dose plena.", "Pesquisar e erradicar H. pylori.", "Suspender AINE.", "EDA em 6–8 semanas; biópsia da borda se gástrica."], "ap": "<p>O patch de Graham consiste em pontos através da perfuração amarrados sobre um retalho pediculado de omento, que sela o orifício. A doença de base continua: o pós-operatório trata a causa (ácido, H. pylori, AINE) e investiga malignidade nas úlceras gástricas.<\/p>", "mud": [["Úlcera duodenal", "Mesmas medidas, sem necessidade obrigatória de biópsia", "Câncer duodenal é raro"], ["Perfuração com grande destruição/suspeita de câncer", "Ressecção", "Rafia inviável"], ["Paciente instável no pré-operatório", "Ressuscitação e cirurgia sem atraso", "Prioridade"]], "arm": "Esquecer a biópsia na úlcera gástrica.", "ouro": "Gástrica perfurada: costura, trata a causa e biopsia.", "m2": ["Qual a cirurgia padrão da úlcera péptica perfurada nas aulas?", "Ulcerorrafia com patch omental (Graham)."], "n": ["Graham: sutura + retalho de omento.", "IBP dose plena.", "Erradicar H. pylori; suspender AINE.", "EDA em 6–8 semanas.", "Biópsia na úlcera gástrica."], "img": ["c-020-024"]}, {"id": "C06-Q04", "t": "C06", "sub": "Síndrome de Boerhaave", "comp": "Diagnóstico", "rac": "Reconhecimento de padrão", "dif": "média", "p": [20], "q": "Homem de 48 anos, após episódios de vômitos intensos por ingestão alcoólica, desenvolve dor torácica intensa e crepitação subcutânea cervical. TC: pneumomediastino e derrame pleural à esquerda. Qual o diagnóstico e o local mais comum da lesão?", "o": [["Síndrome de Boerhaave; terço distal do esôfago, parede póstero-lateral esquerda", "Tríade de Mackler (vômitos → dor torácica → enfisema subcutâneo) com ruptura transmural distal."], ["Síndrome de Mallory-Weiss; laceração mucosa na junção esofagogástrica com hematêmese", "Mallory-Weiss é laceração só da mucosa, sem enfisema nem pneumomediastino."], ["Divertículo de Zenker perfurado; parede posterior da hipofaringe no triângulo de Killian", "Zenker é crônico e cursa com disfagia alta; não explica o quadro após vômitos."], ["Perfuração iatrogênica pós-endoscopia; terço proximal, na altura do cricofaríngeo", "Não houve endoscopia."]], "pista": "Vômitos → dor torácica → enfisema subcutâneo.", "pp": ["Tríade de Mackler.", "Pneumomediastino, enfisema cervical, derrame à esquerda.", "Mecanismo: aumento súbito da pressão intraluminal.", "Local: terço distal, póstero-lateral esquerdo."], "ap": "<p>Complemento do resumo (Sabiston): diagnóstico por esofagograma com contraste hidrossolúvel ou TC com contraste oral; tratamento com jejum, antibiótico de amplo espectro, drenagem e reparo cirúrgico precoce, idealmente em menos de 24 horas.<\/p>", "mud": [["Hematêmese após vômitos, sem enfisema", "Mallory-Weiss", "Lesão só mucosa"], ["Perfuração após dilatação endoscópica", "Iatrogenia", "Causa mais comum de perfuração esofágica"], ["Diagnóstico após 48 h", "Pior prognóstico", "Tempo determina gravidade"]], "arm": "Confundir Boerhaave com Mallory-Weiss porque ambos ocorrem após vômitos.", "ouro": "Vômito + dor torácica + enfisema = Boerhaave (transmural).", "m2": ["Qual exame contrastado é preferido se suspeita de Boerhaave?", "Esofagograma com contraste hidrossolúvel (ou TC com contraste oral)."], "n": ["Ruptura espontânea transmural.", "Tríade de Mackler.", "Pneumomediastino, derrame à esquerda.", "Terço distal, póstero-lateral E.", "Reparo precoce (< 24 h)."], "img": ["c-020-025"]}, {"id": "C06-Q05", "t": "C06", "sub": "Determinantes de gravidade", "comp": "Prognóstico", "rac": "Compreensão", "dif": "média", "p": [19], "q": "Dois pacientes têm perfuração de víscera oca há 8 horas: um com úlcera duodenal e outro com perfuração de sigmoide em peritônio livre. Por que o segundo tende a evoluir com sepse mais precoce?", "o": [["A contaminação colônica é fecaloide; a gastroduodenal é química e inicialmente estéril", "A etiologia (química × fecaloide) é um dos determinantes de gravidade, ao lado do tempo e do tamponamento."], ["Porque úlceras duodenais sempre ficam tamponadas pelo fígado e nunca extravasam conteúdo", "Podem extravasar livremente; tamponamento é possível, não obrigatório."], ["Porque o cólon não produz pneumoperitônio, o que atrasa o diagnóstico e a cirurgia", "Perfuração colônica também produz pneumoperitônio."], ["Porque o tempo não interfere na gravidade da perfuração duodenal, apenas na colônica", "O tempo até a intervenção é determinante em todas."]], "pista": "Conteúdo: ácido estéril × fezes.", "pp": ["Determinantes: tempo, etiologia, peritônio livre × tamponada.", "Gastroduodenal: química, inicialmente estéril.", "Cólon: fecaloide, sepse precoce.", "Conduta: estabilização, ATB, cirurgia (rafia ou ressecção)."], "ap": "<p>O tratamento geral do perfurativo é estabilização (volume, SNG, analgesia), antibioticoterapia e cirurgia — rafia ou ressecção conforme local, tamanho, viabilidade e contaminação. No cólon, a contaminação fecal pesa a favor de ressecção e, no instável, de estomia (lógica do Hartmann).<\/p>", "mud": [["Perfuração bloqueada por omento", "Quadro mais localizado", "Tamponamento"], ["Intervenção após 48 h", "Pior prognóstico", "Tempo"], ["Perfuração colônica em instável", "Ressecção com estomia", "Controle de danos"]], "arm": "Achar que a perfuração duodenal é infectada desde o início.", "ouro": "Tempo, conteúdo e bloqueio decidem a gravidade.", "m2": ["Perfuração de úlcera há 3 dias sem tratamento. Ainda é “química estéril”?", "Não: com o tempo há contaminação bacteriana e peritonite infecciosa."], "n": ["Mortalidade do perfurativo ~10%.", "Tempo até intervenção.", "Química (gastroduodenal) × fecaloide (cólon).", "Livre × tamponada.", "Rafia ou ressecção conforme cenário."]}, {"id": "C06-Q06", "t": "C06", "sub": "Corpo estranho", "comp": "Associação clínica", "rac": "Associação", "dif": "fácil", "p": [21], "q": "Paciente com dor abdominal localizada e sinais de peritonite após refeição com peixe. Segundo a aula, quais segmentos são mais perfurados por espinha de peixe?", "o": [["Íleo e sigmoide, por angulação e estreitamento", "Pontos de angulação/estreitamento favorecem a impactação e a perfuração."], ["Esôfago cervical e estômago, primeiros pontos de contato", "Podem ocorrer, mas a aula destaca íleo e sigmoide."], ["Duodeno e ceco, segmentos de maior diâmetro", "Diâmetro maior não favorece impactação."], ["Jejuno proximal e reto, de parede mais fina", "Não é o mecanismo nem os locais destacados."]], "pista": "Onde o trânsito faz curva ou estreita.", "pp": ["Corpo estranho clássico: espinha de peixe.", "Locais: íleo e sigmoide.", "Mecanismo: angulação/estreitamento.", "Diagnóstico: TC; tratamento conforme local e contaminação."], "ap": "<p>Os slides 49–61 mostram exemplos de perfuração por corpo estranho e iatrogenia (endoscopias, colonoscopias, laparoscopia, lipoaspiração), além de perfuração cecal após íleo paralítico pós-cesárea e Meckel perfurado.<\/p>", "mud": [["Perfuração após colonoscopia", "Iatrogenia", "Causa listada"], ["Ceco distendido após íleo pós-cesárea", "Perfuração cecal (Laplace)", "Exemplo dos slides"], ["Paciente psiquiátrico com obstrução", "Bezoar/corpo estranho", "História direciona"]], "arm": "Escolher locais de maior diâmetro.", "ouro": "Espinha de peixe: íleo e sigmoide.", "m2": ["Qual exame identifica melhor o corpo estranho e a perfuração?", "TC de abdome."], "n": ["Espinha de peixe é o corpo estranho clássico.", "Íleo e sigmoide.", "Angulação e estreitamento.", "Iatrogenias: endoscopia, colonoscopia, laparoscopia.", "TC define local e complicação."]}, {"id": "C06-Q07", "t": "C06", "sub": "Perfuração neoplásica (caso da aula)", "comp": "Raciocínio etiológico", "rac": "Integração de dados", "dif": "difícil", "p": [21], "q": "Homem de 59 anos com perda ponderal há 3 meses evolui com dor abdominal difusa progressiva e choque. TC: pneumoperitônio, líquido livre e espessamento focal hipoatenuante de alça jejunal com bolhas de gás. Após ressecção, qual exame orienta o tratamento adjuvante?", "o": [["Imuno-histoquímica (CD117/DOG1), pela suspeita de GIST jejunal perfurado", "No caso da aula, a imuno-histoquímica confirma GIST e define adjuvância."], ["Cultura do líquido peritoneal, que define todo o tratamento posterior", "A cultura orienta ATB, não o tratamento oncológico."], ["Pesquisa de H. pylori na peça, pela suspeita de úlcera jejunal perfurada", "Úlcera péptica jejunal não explica massa com emagrecimento."], ["Sorologia para Crohn (ASCA), já que perfuração de delgado é sempre doença de Crohn", "Crohn é uma causa possível, mas a massa focal e o emagrecimento apontam neoplasia."]], "pista": "Emagrecimento + massa de delgado perfurada.", "pp": ["Peritonite difusa + choque = perfuração com contaminação extensa.", "Emagrecimento prévio sugere neoplasia.", "TC: lesão focal jejunal perfurada.", "Conduta: ressuscitação, ATB, ressecção segmentar, lavagem.", "Imuno-histoquímica (CD117/DOG1) define adjuvância."], "ap": "<p>O caso dos slides 62–65 (Al-Swaiti et al.) ilustra que, no delgado, as causas de perfuração incluem Crohn, tuberculose, Meckel, isquemia, corpo estranho e GIST. O dado de emagrecimento reorienta o raciocínio para neoplasia.<\/p>", "mud": [["Jovem com dor em FID, fístula perianal", "Crohn", "Perfil clínico"], ["Paciente com FA e necrose de alça", "Isquemia", "Etiologia vascular"], ["Divertículo ileal perfurado", "Meckel", "Causa citada"]], "arm": "Assumir úlcera péptica para qualquer pneumoperitônio.", "ouro": "Perfuração + emagrecimento: pense em tumor.", "m2": ["Quais marcadores imuno-histoquímicos foram citados para GIST?", "CD117 e DOG1."], "n": ["Perfuração de delgado: Crohn, TB, Meckel, isquemia, GIST.", "Emagrecimento sugere neoplasia.", "Ressecção segmentar + lavagem.", "CD117/DOG1 confirmam GIST.", "Anatomopatológico define adjuvância."]}, {"id": "C06-Q08", "t": "C06", "sub": "Conduta inicial na úlcera perfurada", "comp": "Sequência terapêutica", "rac": "Priorização", "dif": "fácil", "p": [20, 21], "q": "Homem de 52 anos, usuário diário de diclofenaco, com dor epigástrica súbita há 5 h, abdome em tábua e pneumoperitônio ao Rx. FC 118, PA 112 × 70. Qual sequência é correta?", "o": [["Jejum, SNG, hidratação, IBP EV e antibiótico, seguidos de ulcerorrafia com patch omental", "É a conduta do caso clínico 6.1: estabilizar, ATB e controlar o foco cirurgicamente."], ["IBP oral, dieta leve e observação ambulatorial, já que a úlcera perfurada pode cicatrizar sozinha", "Perfuração em peritônio livre exige internação e cirurgia."], ["EDA imediata para localizar e clipar a perfuração antes de qualquer outra medida", "A EDA não é o tratamento padrão da úlcera perfurada nas aulas e insufla gás na cavidade."], ["Gastrectomia subtotal de urgência como procedimento padrão em toda úlcera perfurada", "A rafia com patch omental é o padrão; ressecção é exceção."]], "pista": "Estabiliza, cobre, opera.", "pp": ["Diagnóstico: úlcera perfurada (AINE, punhalada, tábua, pneumoperitônio).", "Medidas: jejum, SNG, volume, IBP EV, ATB.", "Cirurgia: ulcerorrafia + patch omental (laparotomia ou laparoscopia).", "Pós-operatório: IBP, H. pylori, suspender AINE, EDA 6–8 semanas."], "ap": "<p>A estabilização não substitui o controle do foco: ela prepara o paciente para a cirurgia. A via pode ser laparotômica ou laparoscópica, conforme condição e disponibilidade.<\/p>", "mud": [["Paciente em choque", "Ressuscitação concomitante e cirurgia sem atraso", "Prioridade"], ["Úlcera gástrica", "Biópsia da borda", "Excluir câncer"], ["Dúvida diagnóstica e estável", "TC", "Mais sensível"]], "arm": "Tratar a perfuração como úlcera não complicada.", "ouro": "Pneumoperitônio por úlcera: estabiliza e opera.", "m2": ["Após a cirurgia, quando repetir a EDA?", "Em 6–8 semanas."], "n": ["Jejum, SNG, hidratação.", "IBP EV e ATB.", "Ulcerorrafia + patch omental.", "Suspender AINE; tratar H. pylori.", "EDA em 6–8 semanas."]}, {"id": "C07-Q01", "t": "C07", "sub": "Obstrução alta × baixa", "comp": "Localização clínica", "rac": "Comparação", "dif": "fácil", "p": [22], "q": "Mulher de 64 anos com histerectomia há 15 anos: dor em cólica periumbilical há 30 h, vômitos biliosos frequentes e precoces, distensão leve; eliminou flatos no início. Rx: alças centrais com “empilhamento de moedas”. Qual o nível e a causa mais provável?", "o": [["Obstrução de delgado por brida", "Vômitos precoces e biliosos, distensão discreta e alças centrais com válvulas coniventes indicam obstrução alta; cirurgia prévia → brida."], ["Obstrução de cólon por câncer colorretal", "No cólon a distensão é precoce e importante, os vômitos são tardios e as alças periféricas têm haustrações."], ["Íleo funcional pós-operatório tardio", "Íleo funcional cursa com RHA diminuídos e sem cólica; a cirurgia foi há 15 anos."], ["Volvo de sigmoide", "Volvo produz distensão maciça e assimétrica com grão de café."]], "pista": "Vômitos precoces + distensão leve + empilhamento de moedas.", "pp": ["Vômitos precoces, biliosos → alta.", "Distensão discreta → alta.", "Flatos persistiram no início → alta.", "Rx: alças centrais, válvulas coniventes.", "Cirurgia prévia → brida (principal causa no delgado)."], "ap": "<p>Delgado responde por 75–85% das obstruções, com idade média de 64 anos; bridas são a principal causa (20–30% têm cirurgia prévia), seguidas de hérnias (30%), neoplasias, íleo biliar, Crohn e volvo. É obrigatório examinar regiões inguinais e femorais.<\/p>", "mud": [["Distensão importante, vômitos tardios fecaloides, haustrações", "Obstrução de cólon", "Padrão baixo"], ["Hérnia inguinal encarcerada", "Cirurgia", "Indicação direta"], ["RHA ausentes no pós-operatório recente", "Íleo funcional", "Sem obstáculo"]], "arm": "Esquecer de examinar as regiões inguinais e femorais.", "ouro": "Vomita cedo e distende pouco: delgado. Distende cedo e vomita tarde: cólon.", "m2": ["Idoso de 76 anos com distensão maciça, sem flatos há 3 dias, vômitos só hoje e haustrações no Rx. Nível e causa provável?", "Obstrução de cólon; câncer colorretal é a causa mais comum."], "n": ["Delgado 75–85%; cólon 25%.", "Alta: vômitos precoces, distensão discreta.", "Baixa: distensão precoce, vômitos tardios.", "Rx: moedas (delgado) × haustrações (cólon).", "Brida: principal causa no delgado."], "img": ["c-023-027"]}, {"id": "C07-Q02", "t": "C07", "sub": "Brida sem sofrimento: conservador", "comp": "Conduta", "rac": "Decisão", "dif": "média", "p": [23, 24], "q": "Paciente com obstrução de delgado por brida, afebril, FC 92, lactato normal, sem peritonite. TC: ponto de transição único, sem redemoinho, parede com realce normal. Qual a conduta inicial?", "o": [["Jejum, SNG aberta, cristaloide, correção de Na e K, sonda vesical e reavaliação", "Brida sem sinais de sofrimento permite tratamento conservador com reavaliação; piora ou não resolução levam à cirurgia."], ["Laparotomia imediata para lise da brida, porque toda obstrução mecânica exige cirurgia", "Sem sofrimento, a brida admite conservador."], ["Procinético (metoclopramida) em dose plena para vencer o obstáculo e liberar o trânsito", "Procinético piora cólica na obstrução mecânica completa."], ["Colonoscopia descompressiva para aliviar a distensão do delgado a montante", "Não alcança nem descomprime o delgado."]], "pista": "Sem sinal de sofrimento = conservador.", "pp": ["Confirmar ausência de sofrimento (clínico, lab, TC).", "Medidas: jejum, SNG, volume, eletrólitos, diurese.", "Reavaliação seriada.", "Falha ou piora → cirurgia (lise; ressecção se inviável)."], "ap": "<p>Complemento (Bologna/ASBO, 2018): o não operatório pode ser mantido por até ~72 h na ausência de estrangulamento; contraste hidrossolúvel chegando ao cólon em 24 h prediz resolução e pode ter efeito terapêutico. A cada reavaliação, procura-se febre, taquicardia, peritonite, leucocitose crescente e lactato em elevação.<\/p>", "mud": [["Febre, peritonite e lactato elevado", "Cirurgia", "Sofrimento de alça"], ["TC com redemoinho", "Cirurgia", "Volvo/hérnia interna"], ["Sem resolução após observação", "Cirurgia", "Falha do conservador"]], "arm": "Operar toda brida, ou manter conservador apesar de sinais de sofrimento.", "ouro": "Brida: conserva enquanto não sofre; sofreu ou não resolveu, opera.", "m2": ["Após 48 h de conservador, paciente fica febril com leucocitose crescente. Conduta?", "Cirurgia — sinal de sofrimento/complicação."], "n": ["Brida sem sofrimento: conservador.", "Jejum, SNG, volume, eletrólitos.", "Reavaliação seriada.", "Sofrimento → cirurgia.", "Gastrografina tem valor prognóstico (complemento)."]}, {"id": "C07-Q03", "t": "C07", "sub": "Sinais de sofrimento de alça", "comp": "Indicação cirúrgica", "rac": "Reconhecimento de critérios", "dif": "média", "p": [23], "q": "Em paciente com obstrução intestinal, qual conjunto de achados indica cirurgia, segundo o fluxograma da Aula 10?", "o": [["Febre, peritonite, taquicardia, lactato elevado e sinal do redemoinho", "São sinais de sofrimento/complicação que indicam cirurgia."], ["RHA aumentados com timbre metálico, vômitos biliosos e níveis hidroaéreos ao Rx", "São achados de obstrução mecânica, não de sofrimento."], ["Distensão leve, eliminação inicial de flatos e cirurgia prévia há muitos anos", "Sugerem brida, sem indicar sofrimento."], ["Dor em cólica, empilhamento de moedas e ponto de transição único sem outros achados", "Também descrevem obstrução sem complicação."]], "pista": "Sofrimento = inflamação/isquemia sistêmica ou na TC.", "pp": ["Clínicos: febre, peritonite, taquicardia.", "Laboratoriais: leucocitose, lactato elevado.", "TC: redemoinho, parede sem realce, pneumatose.", "Causas cirúrgicas por si: hérnia encarcerada, tumor, ceco > 12 cm."], "ap": "<p>O fluxograma 8 lista os gatilhos: febre, peritonite, taquicardia, leucocitose, lactato elevado, redemoinho, parede sem realce, pneumatose, hérnia encarcerada, tumor, ceco > 12 cm. Febre em obstrução sugere isquemia/necrose.<\/p>", "mud": [["Ceco de 13 cm", "Descompressão/cirurgia de urgência", "Risco de perfuração"], ["Hérnia inguinal encarcerada", "Cirurgia", "Indicação direta"], ["Nenhum sinal de sofrimento", "Conservador", "Brida simples"]], "arm": "Confundir sinais de obstrução (metálicos, moedas) com sinais de sofrimento.", "ouro": "Obstrução + febre/peritonite/lactato/redemoinho = centro cirúrgico.", "m2": ["TC mostra pneumatose intestinal em obstrução de delgado. Significado?", "Sofrimento/isquemia de parede — indicação cirúrgica."], "n": ["Febre e peritonite.", "Taquicardia e leucocitose.", "Lactato elevado.", "Redemoinho, parede sem realce, pneumatose.", "Hérnia encarcerada, tumor, ceco > 12 cm."], "img": ["c-024-030"]}, {"id": "C07-Q04", "t": "C07", "sub": "Válvula ileocecal e alça fechada", "comp": "Fisiopatologia", "rac": "Causa → efeito", "dif": "difícil", "p": [22], "q": "Idoso com câncer obstrutivo de sigmoide e válvula ileocecal competente. A TC mostra ceco com 13 cm. Qual o raciocínio correto?", "o": [["Forma-se alça fechada; o ceco sofre a maior tensão (Laplace) e > 12 cm indica risco iminente de perfuração", "Com válvula competente, o gás entra no cólon mas não reflui; o ceco, de maior diâmetro, distende mais."], ["A válvula competente protege o ceco, pois permite o refluxo de gás para o delgado e descomprime", "Competente significa que impede o refluxo; por isso forma alça fechada."], ["O sigmoide, por ser o local do tumor, é o segmento com maior risco de perfuração isquêmica", "A maior tensão de parede ocorre no ceco, de maior raio."], ["Ceco de 13 cm é achado esperado e permite tratamento conservador prolongado", "Ceco > 12 cm exige descompressão/cirurgia de urgência."]], "pista": "T = P × R: maior raio, maior tensão.", "pp": ["Válvula competente → gás não reflui → alça fechada entre válvula e tumor.", "Lei de Laplace: o ceco tem maior raio → maior tensão.", "Ceco > 12 cm → isquemia, necrose, perfuração iminentes.", "Conduta: descompressão/cirurgia de urgência."], "ap": "<p>Em 15–20% a válvula é incompetente: o gás reflui para o delgado e o quadro lembra obstrução alta, com menor risco de perfuração cecal. No cólon, a obstrução tem evolução potencialmente mais grave; idade média de 73 anos; câncer colorretal responde por até 60%, e 30% dos cânceres são diagnosticados na urgência.<\/p>", "mud": [["Válvula incompetente", "Distensão também do delgado; quadro tipo obstrução alta", "Gás reflui"], ["Ceco de 8 cm sem sofrimento", "Preparar cirurgia oncológica com menos urgência", "Abaixo do limiar"], ["Perfuração cecal", "Cirurgia de urgência com controle de danos", "Peritonite fecal"]], "arm": "Achar que a perfuração ocorre no local do tumor.", "ouro": "Válvula competente + tumor = alça fechada; ceco > 12 cm = urgência.", "m2": ["Por que a lei de Laplace explica também os divertículos no sigmoide?", "Lá o raio é menor, logo a pressão intraluminal é maior (P = T/R)."], "n": ["Válvula competente → alça fechada.", "Ceco sofre maior tensão.", "Ceco > 12 cm = risco iminente.", "15–20% incompetente → parece obstrução alta.", "Câncer colorretal: principal causa no cólon."], "img": ["c-022-026"]}, {"id": "C07-Q05", "t": "C07", "sub": "Causas de obstrução por nível", "comp": "Epidemiologia", "rac": "Associação", "dif": "fácil", "p": [22], "q": "Qual associação entre nível da obstrução e causa mais comum está correta segundo a Aula 10?", "o": [["Cólon — câncer colorretal", "Câncer colorretal responde por até 60% das obstruções colônicas."], ["Delgado — câncer colorretal", "Delgado: bridas > hérnias."], ["Gastroduodenal — úlcera péptica benigna", "Gastroduodenal é maligna em 50–80%; péptica ~5%."], ["Cólon — bridas pós-operatórias", "Bridas são a principal causa no delgado."]], "pista": "Cólon obstrui por tumor; delgado por brida.", "pp": ["Delgado: bridas > hérnias > neoplasias, íleo biliar, Crohn, volvo.", "Cólon: câncer > volvo (5–15%) > diverticulite (10%).", "Gastroduodenal: maligna 50–80%."], "ap": "<p>A história orienta: cirurgia prévia → bridas; neoplasia → recidiva/carcinomatose; Crohn → estenoses; radioterapia → enterite actínica; doença psiquiátrica → corpo estranho/bezoar. Causas raras gastroduodenais: síndrome de Bouveret (cálculo impactado no duodeno/piloro), volvo gástrico, bezoar.<\/p>", "mud": [["Paciente com Crohn", "Estenose", "Doença de base"], ["Radioterapia pélvica prévia", "Enterite actínica", "Doença de base"], ["Idoso chagásico com distensão maciça", "Volvo de sigmoide", "Megacólon"]], "arm": "Trocar as causas de delgado e cólon.", "ouro": "Delgado: brida. Cólon: câncer.", "m2": ["Idosa com cálculo biliar impactado no piloro causando vômitos. Nome da síndrome?", "Síndrome de Bouveret."], "n": ["Delgado: bridas > hérnias.", "Cólon: câncer colorretal (até 60%).", "Volvo 5–15%; diverticulite 10%.", "Gastroduodenal: maligna 50–80%.", "História direciona a causa."]}, {"id": "C07-Q06", "t": "C07", "sub": "Íleo funcional × obstrução mecânica", "comp": "Diagnóstico diferencial", "rac": "Comparação", "dif": "média", "p": [22], "q": "Paciente no 4º dia pós-operatório de colectomia, em uso de opioides e com hipocalemia, apresenta distensão difusa e ausência de flatos. RHA diminuídos, sem cólica. Qual a interpretação mais provável?", "o": [["Íleo funcional (paralítico), por falha do peristaltismo sem obstáculo", "Pós-operatório, opioides e distúrbio eletrolítico são causas de íleo funcional, com RHA diminuídos."], ["Obstrução mecânica por brida precoce, que exige reoperação imediata", "Mecânica cursa com cólica e RHA aumentados metálicos (até a fase tardia)."], ["Volvo de sigmoide, típico do pós-operatório imediato", "Volvo é associado a constipação crônica e Chagas."], ["Isquemia mesentérica oclusiva, pois RHA diminuídos excluem íleo", "RHA diminuídos são típicos do íleo funcional."]], "pista": "Sem cólica, RHA diminuídos, opioide e potássio baixo.", "pp": ["Contexto: pós-operatório, opioide, hipocalemia.", "Exame: RHA diminuídos, sem cólica.", "Mecanismo: falha do peristaltismo.", "Conduta: corrigir eletrólitos, reduzir opioides, suporte."], "ap": "<p>Causas de íleo funcional listadas: pós-operatório, sepse, pancreatite, queimados, uremia/distúrbios HE, opioides, QT intraperitoneal, reflexo (trauma, litíase ureteral), isquemia não oclusiva. Na mecânica: fecaloma, bezoar, íleo biliar, volvo, intussuscepção, estenose, hérnias e bridas.<\/p>", "mud": [["Cólica com RHA metálicos", "Obstrução mecânica", "Luta contra obstáculo"], ["Sepse abdominal", "Íleo funcional secundário", "Inflamação"], ["TC com ponto de transição", "Mecânica", "Obstáculo físico"]], "arm": "Confundir silêncio abdominal tardio da mecânica com íleo funcional — o contexto e a TC resolvem.", "ouro": "Funcional: sem obstáculo, RHA baixos. Mecânica: obstáculo, RHA altos (até cansar).", "m2": ["Paciente com pancreatite grave tem distensão e RHA ausentes. Diagnóstico?", "Íleo funcional reflexo/inflamatório."], "n": ["Funcional: sem obstáculo.", "Causas: pós-op, opioides, HE, sepse.", "RHA diminuídos.", "Mecânica: RHA aumentados → silêncio tardio.", "TC mostra ponto de transição na mecânica."]}, {"id": "C07-Q07", "t": "C07", "sub": "Obstrução intestinal maligna", "comp": "Cuidados paliativos", "rac": "Aplicação", "dif": "difícil", "p": [24], "q": "Paciente com carcinomatose peritoneal, ECOG 3, ascite volumosa e obstrução intestinal maligna completa em múltiplos níveis. Qual conduta está de acordo com a aula?", "o": [["Tratamento paliativo sem cirurgia: haloperidol como antiemético, dexametasona, octreotide e opioides", "Critérios de não operar presentes; haloperidol é 1ª linha; metoclopramida só se parcial."], ["Laparotomia com ressecção de todos os segmentos obstruídos e anastomoses múltiplas", "ECOG ≥ 3, carcinomatose difusa, ascite volumosa e múltiplos níveis contraindicam cirurgia."], ["Metoclopramida em dose alta como antiemético de primeira linha na obstrução completa", "Procinético piora a cólica na obstrução completa."], ["Suspender toda analgesia opioide para não piorar o trânsito intestinal", "Opioides controlam dor e dispneia e fazem parte da paliação."]], "pista": "Obstrução completa: nada de procinético.", "pp": ["Identificar critérios de não operar: ECOG ≥ 3, carcinomatose, ascite, múltiplos níveis.", "Paliação: dexametasona (edema), octreotide/IBP (secreção).", "Antiemético: haloperidol 1ª linha.", "Opioides para dor; SNG temporária, hidratação individualizada."], "ap": "<p>Quadro da Aula 10: dexametasona 8–16 mg/dia; octreotide 100–600 mcg/dia SC; haloperidol 1ª linha; metoclopramida apenas na obstrução parcial; opioides (morfina, metadona); SNG temporária, hidratação parenteral individualizada, dieta oral conforme tolerância.<\/p>", "mud": [["Obstrução parcial", "Metoclopramida pode ser usada", "Não piora a cólica como na completa"], ["Bom performance status e ponto único", "Considerar cirurgia/derivação", "Fora dos critérios de não operar"], ["Vômitos refratários", "SNG temporária", "Conforto"]], "arm": "Prescrever metoclopramida na obstrução completa.", "ouro": "OIM completa: haloperidol, não metoclopramida.", "m2": ["Qual o objetivo do octreotide na OIM?", "Reduzir secreção intestinal e vômitos."], "n": ["Não operar: ECOG ≥ 3, carcinomatose, ascite, múltiplos níveis.", "Dexametasona reduz edema.", "Octreotide/IBP reduzem secreção.", "Haloperidol 1ª linha.", "Metoclopramida só se parcial."]}, {"id": "C07-Q08", "t": "C07", "sub": "Volvo de sigmoide", "comp": "Conduta", "rac": "Decisão sequencial", "dif": "média", "p": [24, 25], "q": "Homem de 76 anos, do norte de Minas, chagásico, com constipação crônica, apresenta distensão abdominal volumosa e assimétrica há 2 dias, sem flatos e sem peritonite. Rx: alça sigmoide em “grão de café”. Qual a sequência adequada?", "o": [["Descompressão endoscópica com avaliação da mucosa; se sucesso, sigmoidectomia eletiva na mesma internação", "Sem necrose: distorção endoscópica; como a recidiva é ~50%, programa-se cirurgia eletiva."], ["Laparotomia imediata com Hartmann em todos os casos de volvo de sigmoide, mesmo sem necrose", "Hartmann é para falha, mucosa isquêmica ou peritonite."], ["Enema baritado terapêutico e alta sem seguimento cirúrgico, já que a distorção é definitiva", "A recidiva é de cerca de 50%."], ["Observação com SNG por 72 horas, como na obstrução por brida sem sofrimento", "Volvo é alça fechada com risco de isquemia; exige descompressão."]], "pista": "Chagas + idoso + grão de café, sem necrose.", "pp": ["Diagnóstico: volvo de sigmoide (megacólon chagásico).", "Sem peritonite → descompressão endoscópica (retossigmoidoscopia/colonoscopia).", "Avaliar mucosa: isquemia → cirurgia.", "Sucesso → sigmoidectomia eletiva (recidiva ~50%)."], "ap": "<p>O volvo é torção da alça em torno do eixo mesentérico, com obstrução em alça fechada e risco de isquemia. Fatores: constipação crônica, idade 70–80 anos e megacólon chagásico (muito cobrado no Brasil). Na TC, sinal do redemoinho.<\/p>", "mud": [["Peritonite ou mucosa isquêmica", "Laparotomia + Hartmann", "Necrose"], ["Falha da descompressão", "Laparotomia + ressecção", "Sem distorção"], ["Sucesso da descompressão", "Sigmoidectomia eletiva", "Recidiva ~50%"]], "arm": "Dar alta após a distorção sem programar cirurgia.", "ouro": "Volvo: desfaz por endoscopia e depois tira o sigmoide.", "m2": ["Na retossigmoidoscopia descompressiva, a mucosa está escura e necrótica. Conduta?", "Laparotomia com ressecção do sigmoide (Hartmann)."], "n": ["Fatores: idoso, constipação, Chagas.", "Rx: grão de café/U invertido.", "TC: redemoinho.", "Sem necrose: descompressão endoscópica.", "Recidiva ~50% → sigmoidectomia eletiva."], "img": ["c-023-028"]}, {"id": "C07-Q09", "t": "C07", "sub": "Contraste hidrossolúvel na brida (complemento)", "comp": "Propedêutica", "rac": "Interpretação", "dif": "difícil", "p": [24], "q": "Na obstrução de delgado por aderência sem sinais de estrangulamento, o complemento do resumo (Bologna guidelines) cita o uso de contraste hidrossolúvel. Qual o significado de o contraste alcançar o cólon em 24 horas?", "o": [["Prediz resolução com tratamento não operatório", "O contraste no cólon em 24 h indica trânsito preservado e boa chance de resolução."], ["Indica estrangulamento e obriga laparotomia", "Estrangulamento é avaliado por sinais clínicos, laboratoriais e TC."], ["Confirma obstrução completa e indica ressecção", "Contraste no cólon sugere obstrução parcial."], ["Não tem valor diagnóstico nem prognóstico", "Tem valor diagnóstico/prognóstico e possivelmente terapêutico."]], "pista": "Se o contraste passa, o intestino está passando.", "pp": ["Contexto: brida sem estrangulamento.", "Gastrografina VO/SNG.", "Contraste no cólon em 24 h → resolução provável.", "Conservador até ~72 h na ausência de estrangulamento."], "ap": "<p>Este ponto é <b>complemento<\/b> do resumo (Ten Broek et al., Bologna guidelines, World J Emerg Surg 2018), não dos slides. Use-o como reforço da conduta conservadora na brida, sempre com reavaliação seriada.<\/p>", "mud": [["Contraste não chega ao cólon em 24 h", "Maior chance de falha do conservador", "Obstrução persistente"], ["Sinais de estrangulamento", "Cirurgia, sem esperar contraste", "Urgência"], ["Resolução clínica", "Alta", "Tratamento eficaz"]], "arm": "Usar o teste de contraste para adiar cirurgia em quem já tem sinais de sofrimento.", "ouro": "Gastrografina no cólon em 24 h: provável resolução.", "m2": ["Até quanto tempo o resumo admite manter o conservador na brida sem estrangulamento?", "Até ~72 h (complemento — Bologna)."], "n": ["Complemento, não slide.", "Contraste hidrossolúvel.", "No cólon em 24 h → resolução provável.", "Conservador até ~72 h.", "Sofrimento → cirurgia sempre."]}, {"id": "C08-Q01", "t": "C08", "sub": "Gravidez ectópica rota instável", "comp": "Conduta de urgência", "rac": "Priorização", "dif": "média", "p": [27, 28], "q": "Mulher de 27 anos, DUM há 7 semanas, com dor súbita em fossa ilíaca esquerda seguida de síncope e dor no ombro direito. PA 78 × 45, FC 132. β-hCG positivo; FAST com líquido livre em Morison e pelve. Qual a conduta?", "o": [["Ressuscitação com hemoderivados e cirurgia imediata (salpingectomia), com anti-D se Rh negativo", "Instável com hemoperitônio: não há espaço para metotrexato nem conduta expectante."], ["Metotrexato intramuscular e β-hCG seriado, por ser tratamento conservador que preserva a trompa", "Metotrexato é para paciente estável, com ectópica íntegra e critérios específicos."], ["US transvaginal eletiva e reavaliação em 48 h para confirmar a localização da gestação", "A paciente está em choque com hemoperitônio."], ["TC de abdome para localizar a origem do sangramento antes de decidir a via de acesso", "Instável não vai à TC."]], "pista": "Mulher fértil + β-hCG positivo + hemoperitônio + choque.", "pp": ["Diagnóstico: ectópica rota.", "Dor no ombro: irritação frênica (Laffont/Kehr).", "Instável → cirurgia imediata.", "Procedimento padrão: salpingectomia; VLP se possível, laparotomia se instabilidade refratária.", "Imunoglobulina anti-D se Rh negativo."], "ap": "<p>A ectópica é a principal causa de morte materna no 1º trimestre; 96% são tubárias. Fatores: ectópica prévia, DIP, cirurgia tubária, DIU, FIV, tabagismo, idade. Objetivos da cirurgia: controlar o sangramento, retirar a gestação, estabilizar e evitar aloimunização.<\/p>", "mud": [["Paciente estável, massa anexial pequena, sem líquido livre", "Discutir tratamento conservador/clínico", "Estabilidade abre opções"], ["Rh negativo", "Imunoglobulina anti-D", "Evitar aloimunização"], ["Instabilidade refratária", "Laparotomia", "Rapidez"]], "arm": "Oferecer metotrexato à paciente instável.", "ouro": "Ectópica rota instável: centro cirúrgico, salpingectomia, anti-D se Rh −.", "m2": ["Qual a tríade clássica da gravidez ectópica?", "Atraso menstrual + dor abdominal + sangramento vaginal."], "n": ["Mulher fértil + hemoperitônio = ectópica rota.", "96% tubárias.", "Instável: cirurgia imediata.", "Salpingectomia; VLP preferencial.", "Anti-D se Rh negativo."], "img": ["c-026-033"]}, {"id": "C08-Q02", "t": "C08", "sub": "Dor referida no ombro", "comp": "Semiologia", "rac": "Correlação anatômica", "dif": "fácil", "p": [27, 43], "q": "Na rotura de gravidez ectópica, a paciente pode referir dor no ombro. Qual o mecanismo e qual o nome do sinal na revisão de véspera?", "o": [["Irritação do diafragma pelo sangue (irritação frênica); sinal de Laffont", "O hemoperitônio irrita o diafragma; a dor é referida ao ombro."], ["Compressão do plexo braquial pela trompa distendida; sinal de Murphy", "Murphy é sinal de colecistite."], ["Pneumoperitônio sob o diafragma; sinal de Jobert", "Jobert é timpanismo hepático do pneumoperitônio."], ["Irritação do psoas pelo hematoma pélvico; sinal do psoas", "O psoas indica apêndice retrocecal."]], "pista": "Sangue sob o diafragma.", "pp": ["Hemoperitônio sobe pelas goteiras.", "Irrita o diafragma (nervo frênico, C3–C5).", "Dor referida no ombro.", "Laffont (ectópica); Kehr (ombro esquerdo — baço)."], "ap": "<p>A revisão de véspera diferencia: Kehr = dor referida no ombro esquerdo (hemoperitônio, rotura/abscesso esplênico); Laffont = dor referida no ombro por irritação frênica (gravidez ectópica rota).<\/p>", "mud": [["Dor no ombro esquerdo após trauma esplênico", "Kehr", "Irritação frênica esquerda"], ["Timpanismo na área hepática", "Jobert", "Pneumoperitônio"], ["Massa pulsátil", "AAA", "Outra causa hemorrágica"]], "arm": "Confundir Kehr, Laffont e Jobert.", "ouro": "Ombro dolorido + hemoperitônio = sangue no diafragma.", "m2": ["Paciente com mononucleose e dor no ombro esquerdo após esforço. Sinal e hipótese?", "Kehr; rotura esplênica espontânea."], "n": ["Dor referida pelo nervo frênico.", "Laffont: ectópica rota.", "Kehr: ombro esquerdo (baço).", "Jobert: pneumoperitônio.", "Hemoperitônio irrita o diafragma."]}, {"id": "C08-Q03", "t": "C08", "sub": "AAA roto × cólica renal", "comp": "Diagnóstico diferencial", "rac": "Reconhecimento de armadilha", "dif": "média", "p": [26, 28], "q": "Homem de 71 anos, tabagista de 50 maços-ano e hipertenso, com dor lombar esquerda súbita há 1 hora irradiada para a virilha. PA 86 × 50, FC 118, sudoreico; massa pulsátil periumbilical dolorosa. Qual a conduta?", "o": [["Tratar como AAA roto: acionar vascular, hipotensão permissiva e centro cirúrgico, sem passar pela TC", "> 55 anos + dor lombar súbita + hipotensão + massa pulsátil = AAA roto; instável não vai à TC."], ["Analgesia, hidratação vigorosa e TC sem contraste para cálculo ureteral, pela irradiação para a virilha", "Chamar de cólica renal é o erro clássico."], ["Angiotomografia imediata para planejar o EVAR antes de qualquer decisão", "AngioTC é para o estável."], ["Reposição volêmica agressiva até normalizar a PA e só depois decidir", "Volume agressivo aumenta o sangramento (complemento ESVS 2024)."]], "pista": "Idoso + dor lombar súbita + hipotensão + massa pulsátil.", "pp": ["Tríade: dor lombar/abdominal, massa pulsátil, hipotensão (~50%).", "Perfil: homem > 60, tabagista, hipertenso.", "Instável → US/FAST à beira-leito, centro cirúrgico.", "Hipotensão permissiva (PAS ~70–90, consciente) até controle proximal.", "Reparo aberto ou EVAR."], "ap": "<p>A mortalidade da rotura é de 32–95%, com muitos casos de morte súbita. Fatores de risco para aneurisma: idade, sexo masculino, raça branca, história familiar, tabagismo, outros aneurismas, Marfan, Ehlers-Danlos, aterosclerose; para ruptura: diâmetro > 5,5 cm, hipertensão, tabagismo.<\/p>", "mud": [["Estável", "AngioTC para planejar EVAR", "Há tempo"], ["Jovem inquieto com hematúria", "Ureterolitíase", "Perfil diferente"], ["Instabilidade refratária", "Reparo aberto de urgência", "Controle proximal"]], "arm": "Diagnosticar cólica renal no idoso hipotenso.", "ouro": "Idoso com “cólica renal” e hipotensão: AAA roto até prova em contrário.", "m2": ["Qual meta pressórica a ESVS 2024 sugere até o controle proximal?", "Hipotensão permissiva com PAS ~70–90 mmHg, paciente consciente (complemento)."], "n": ["Tríade: dor, massa pulsátil, hipotensão.", "Suspeitar em > 55 anos.", "Instável: direto ao centro cirúrgico.", "Estável: angioTC.", "Hipotensão permissiva."]}, {"id": "C08-Q04", "t": "C08", "sub": "Rastreamento e risco de ruptura do AAA", "comp": "Prevenção", "rac": "Memória com compreensão", "dif": "fácil", "p": [26, 27], "q": "Segundo a Aula 10, qual afirmação sobre aneurisma de aorta abdominal é correta?", "o": [["Rastreia-se com US abdominal homens de 65–75 anos com história de tabagismo; diâmetro > 5,5 cm aumenta o risco de ruptura", "Ambos os dados constam do material."], ["O rastreamento é feito com TC anual em todas as mulheres acima de 50 anos, por serem o grupo de maior risco", "Sexo feminino é fator de proteção; o rastreio é em homens tabagistas."], ["O diâmetro não influencia o risco de ruptura, que depende apenas da pressão arterial do paciente", "Diâmetro > 5,5 cm é fator de risco de ruptura."], ["A hipotensão está presente em praticamente todos os casos de rotura no momento da chegada", "Hipotensão ocorre em ~50%."]], "pista": "Homem, 65–75 anos, tabagista.", "pp": ["Rastreio: US em homens 65–75 tabagistas.", "Risco de ruptura: > 5,5 cm, HAS, tabagismo, transplante.", "Proteção: sexo feminino, raça não branca."], "ap": "<p>O tratamento eletivo ou de urgência é reparo aberto (enxerto) ou endovascular (EVAR), conforme anatomia e disponibilidade.<\/p>", "mud": [["AAA de 6 cm assintomático", "Indicação de reparo", "Risco de ruptura"], ["Mulher de 70 anos não tabagista", "Fora do grupo de rastreio citado", "Proteção"], ["AAA roto instável", "Centro cirúrgico", "Urgência"]], "arm": "Esquecer que a hipotensão falta em metade dos casos de rotura.", "ouro": "Rastreia homem tabagista 65–75; > 5,5 cm rompe mais.", "m2": ["Quais são as duas opções de reparo citadas?", "Reparo aberto (enxerto) e EVAR."], "n": ["US para rastreio.", "Homens 65–75 tabagistas.", "> 5,5 cm: risco de ruptura.", "Hipotensão em ~50% das roturas.", "Aberto ou EVAR."]}, {"id": "C08-Q05", "t": "C08", "sub": "Cisto ovariano roto", "comp": "Conduta", "rac": "Decisão", "dif": "média", "p": [27], "q": "Jovem de 22 anos com dor súbita em quadrante inferior direito após relação sexual. β-hCG negativo, hemodinamicamente estável, US pélvica com massa anexial e pequena quantidade de líquido livre. Hb estável em controle. Qual a conduta?", "o": [["Conservadora, com observação; cirurgia (VLP) só se instabilidade, sangramento importante, infecção ou suspeita de malignidade", "Cisto de corpo lúteo roto em paciente estável é autolimitado; na cirurgia, preserva-se o ovário."], ["Salpingectomia de urgência por suspeita de ectópica, já que há líquido livre na pelve", "β-hCG negativo afasta ectópica."], ["Ooforectomia laparoscópica para evitar recorrência em toda rotura de cisto", "Na jovem, preserva-se o ovário."], ["Laparotomia exploradora obrigatória em toda dor pélvica com líquido livre", "Estabilidade permite conduta conservadora."]], "pista": "Após relação/exercício, β-hCG negativo, estável.", "pp": ["Etiologia: corpo lúteo hemorrágico.", "Exames: β-hCG, hemograma, US pélvica (escolha).", "Estável e autolimitado → conservador.", "Cirurgia: instabilidade, sangramento importante, infecção, suspeita de malignidade.", "Preservar o ovário na jovem."], "ap": "<p>O cisto ovariano roto entra na lista de hemoperitônio espontâneo ao lado de rotura hepática (adenoma, CHC, HELLP), rotura esplênica e aneurismas viscerais. Pode também causar dor no ombro por irritação frênica.<\/p>", "mud": [["β-hCG positivo", "Pensar em ectópica", "Mulher fértil"], ["Queda progressiva da Hb e hipotensão", "VLP", "Sangramento importante"], ["Massa complexa suspeita", "Cirurgia", "Malignidade"]], "arm": "Operar toda paciente com líquido livre pélvico.", "ouro": "Cisto roto estável: observa; opera só se sangra muito, infecta ou suspeita de câncer.", "m2": ["Na VLP por cisto roto com sangramento ativo em jovem, qual o princípio técnico?", "Hemostasia preservando o ovário."], "n": ["Após exercício ou relação sexual.", "β-hCG obrigatório.", "US pélvica é o exame de escolha.", "Estável: conservador.", "Preservar ovário na jovem."]}, {"id": "C08-Q06", "t": "C08", "sub": "Rotura hepática espontânea", "comp": "Associação etiológica", "rac": "Associação", "dif": "média", "p": [27, 44], "q": "Mulher de 30 anos, em uso prolongado de anticoncepcional oral, apresenta dor súbita em hipocôndrio direito, distensão e hipotensão. TC: hemoperitônio a partir de lesão hepática. Qual a causa mais provável?", "o": [["Adenoma hepático roto", "Associação clássica: ACO (e anabolizantes) + hemoperitônio por lesão hepática = adenoma roto."], ["Abscesso hepático amebiano roto", "Abscesso amebiano causa febre e dor, não hemoperitônio súbito com choque."], ["Rotura esplênica por mononucleose", "A lesão descrita é hepática."], ["Aneurisma da artéria mesentérica superior", "Aneurisma de AMS é raro (10% dos viscerais) e não se associa a ACO."]], "pista": "ACO + hemoperitônio hepático.", "pp": ["Hemoperitônio espontâneo de origem hepática.", "Perfil: mulher jovem em uso de ACO.", "Causa: adenoma hepático.", "Conduta: controle hemodinâmico, embolização arterial, ressecção."], "ap": "<p>Outras causas de rotura hepática espontânea listadas: hemangioma, CHC, metástases, síndrome HELLP, esteatose aguda da gestação, vasculites; fatores de risco: ACO, anabolizantes, cirrose. Diagnóstico por US e TC contrastada.<\/p>", "mud": [["Gestante com HELLP", "Rotura hepática na gestação", "Outra causa listada"], ["Cirrótico com nódulo", "Hepatocarcinoma roto", "Outra causa"], ["Mononucleose e dor em HCE", "Rotura esplênica", "Outra víscera"]], "arm": "Esquecer a associação adenoma–ACO.", "ouro": "ACO + hemoperitônio = adenoma hepático roto.", "m2": ["Qual procedimento pode controlar o sangramento sem laparotomia em paciente que estabiliza?", "Embolização arterial."], "n": ["Adenoma: ACO e anabolizantes.", "Outras: CHC, HELLP, hemangioma.", "US e TC contrastada.", "Embolização arterial.", "Ressecção quando necessário."]}, {"id": "C08-Q07", "t": "C08", "sub": "Aneurismas de artérias viscerais", "comp": "Epidemiologia", "rac": "Memória com compreensão", "dif": "difícil", "p": [27], "q": "Sobre aneurismas de artérias viscerais apresentados na Aula 10, assinale a correta.", "o": [["O esplênico é o mais comum (60%), 4× mais frequente em mulheres e associado à gestação, com alta mortalidade materna e fetal na rotura", "Dados do quadro da aula; arteriografia é o padrão-ouro."], ["O hepático é o mais comum (60%) e predomina em homens tabagistas, sem relação com a gestação", "Hepático corresponde a ~20%."], ["O de AMS é o mais comum e a rotura na gestação tem baixa mortalidade materna", "AMS ~10%; na gestação, o esplênico tem mortalidade materna de até 65%."], ["São tratados sempre com observação, pois raramente rompem e a laparotomia nunca é necessária", "Instáveis: volume + laparotomia; opções incluem ligadura, aneurismectomia, esplenectomia ou embolização."]], "pista": "Baço, mulher, gestação.", "pp": ["Frequência: esplênica 60%, hepática 20%, AMS 10%.", "Esplênico: 4× mais em mulheres; gestação.", "FR: hipertensão portal, fibrodisplasia, gravidez.", "Instável: volume + laparotomia."], "ap": "<p>Na gestação, a rotura do aneurisma esplênico tem mortalidade materna de até 65% e fetal de até 95%. A arteriografia é o padrão-ouro; em centros com hemodinâmica, a embolização é opção; se o aneurisma for hilar, pode ser necessária esplenectomia.<\/p>", "mud": [["Gestante com dor epigástrica súbita e choque", "Pensar em aneurisma esplênico roto", "Associação"], ["Paciente estável", "AngioTC/arteriografia", "Planejamento"], ["Aneurisma hilar", "Esplenectomia ou embolização", "Localização"]], "arm": "Achar que o aneurisma visceral mais comum é o hepático.", "ouro": "Aneurisma visceral: baço, mulher, gravidez.", "m2": ["Qual exame é padrão-ouro para aneurismas viscerais?", "Arteriografia."], "n": ["Esplênica 60%, hepática 20%, AMS 10%.", "Esplênico 4× em mulheres.", "Gestação: mortalidade materna até 65%.", "Arteriografia padrão-ouro.", "Instável: laparotomia."]}, {"id": "C08-Q08", "t": "C08", "sub": "Rotura esplênica espontânea", "comp": "Associação e conduta", "rac": "Associação", "dif": "fácil", "p": [27], "q": "Estudante de 19 anos com mononucleose infecciosa apresenta dor súbita em hipocôndrio esquerdo, dor no ombro esquerdo e hipotensão. FAST com líquido livre. Qual o diagnóstico e o tratamento citados na aula?", "o": [["Rotura esplênica espontânea; esplenectomia", "Mononucleose é causa infecciosa clássica de rotura esplênica espontânea."], ["Abscesso esplênico; drenagem percutânea guiada por TC e antibiótico", "Abscesso cursa com febre prolongada, não com hemoperitônio súbito."], ["Gravidez ectópica rota; salpingectomia", "Paciente sem dados de gestação; o quadro é esplênico."], ["Pancreatite hemorrágica; tratamento clínico em UTI", "Não explica dor no ombro esquerdo e hemoperitônio súbito."]], "pista": "Mononucleose + Kehr + hemoperitônio.", "pp": ["Causa: infecciosa (mononucleose, CMV, HIV) ou neoplásica (linfoma, leucemia).", "Clínica: dor em HCE, hipotensão, esplenomegalia, Kehr.", "Diagnóstico: FAST, TC (se estável).", "Tratamento: esplenectomia."], "ap": "<p>Após esplenectomia, valem as vacinas contra germes encapsulados (pneumococo, meningococo, <i>H. influenzae<\/i>), lembradas no tópico de abscesso esplênico.<\/p>", "mud": [["Febre prolongada e coleção esplênica", "Abscesso esplênico", "Outra entidade"], ["Linfoma conhecido", "Rotura neoplásica", "Outra causa"], ["Paciente estável", "TC", "Tempo para imagem"]], "arm": "Esquecer que esforço mínimo pode romper o baço aumentado na mononucleose.", "ouro": "Mononucleose + dor no ombro esquerdo + choque = baço roto.", "m2": ["Que vacinas são indicadas após esplenectomia?", "Pneumococo, meningococo e Haemophilus influenzae."], "n": ["Causas: mononucleose, CMV, HIV, linfoma, leucemia.", "Dor em HCE e Kehr.", "FAST no instável.", "Esplenectomia.", "Vacinar contra encapsulados."]}, {"id": "C09-Q01", "t": "C09", "sub": "Embolia da AMS: conduta inicial", "comp": "Conduta", "rac": "Priorização", "dif": "média", "p": [29, 30], "q": "Mulher de 78 anos com fibrilação atrial, que suspendeu a varfarina há 1 mês, refere dor periumbilical lancinante há 4 h e evacuação diarreica. Abdome flácido, sem defesa. Lactato 5,1 mmol/L, pH 7,28. Qual a conduta inicial?", "o": [["Ressuscitação, SNG, ATB de amplo espectro, heparina plena e angioTC imediata", "É a conduta do fluxograma 10; com embolia confirmada, segue-se para revascularização."], ["Observação com analgesia e reavaliação em 12 h, pois o abdome está flácido e sem peritonite", "Esperar peritonite é esperar necrose."], ["Colonoscopia de urgência para avaliar isquemia colônica e a extensão da lesão de mucosa", "Não é o exame da isquemia mesentérica aguda por embolia da AMS."], ["Trombólise sistêmica empírica antes de qualquer exame de imagem para não perder tempo", "A trombólise é estratégia endovascular dirigida, após diagnóstico."]], "pista": "FA sem anticoagulação + dor desproporcional + lactato elevado.", "pp": ["Dor desproporcional + FA = embolia da AMS.", "Lactato e acidose: isquemia instalada.", "Ressuscitação, SNG, ATB, heparina plena.", "AngioTC imediata.", "Revascularização (embolectomia aberta/endovascular); laparotomia se necrose; second-look 24–48 h."], "ap": "<p>O caso clínico 9.1 traz exatamente esse cenário e a frase-chave: “o tempo é intestino”. A heparina plena entra antes mesmo da confirmação, salvo contraindicação, porque limita a propagação do trombo.<\/p>", "mud": [["Peritonite e choque", "Laparotomia: revascularização + ressecção", "Necrose"], ["Necrose incompatível com a vida", "Open-close e cuidados paliativos", "Inviabilidade"], ["Sem necrose, embolia confirmada", "Embolectomia, trombólise ou aspiração endovascular", "Tratamento por etiologia"]], "arm": "Ser tranquilizado pelo abdome flácido.", "ouro": "Dor desproporcional: heparina e angioTC já.", "m2": ["Mesma paciente, mas na laparotomia há necrose de todo o delgado e cólon direito. Conduta?", "Open-close e cuidados paliativos (necrose incompatível com a vida)."], "n": ["Embolia é a causa mais comum.", "FA, IAM recente, valvopatia.", "Heparina plena precoce.", "AngioTC imediata.", "Second-look 24–48 h."]}, {"id": "C09-Q02", "t": "C09", "sub": "Trombose arterial e angina intestinal", "comp": "Etiologia", "rac": "Associação clínica", "dif": "média", "p": [29, 30], "q": "Homem de 70 anos, tabagista, com doença arterial periférica, relata há meses dor abdominal após as refeições, medo de comer e perda de 8 kg. Hoje tem dor intensa e difusa. Qual etiologia é mais provável e qual tratamento específico?", "o": [["Trombose arterial da AMS; angioplastia com stent ou derivação aortomesentérica", "História de angina intestinal sobre aterosclerose sugere trombose arterial ostial."], ["Embolia arterial de origem cardíaca; embolectomia com cateter de Fogarty e anticoagulação", "A embolia é abrupta, sem pródromo de angina intestinal."], ["Trombose venosa mesentérica; anticoagulação plena isolada por tempo prolongado", "Trombose venosa associa-se a trombofilia, ACO, hipertensão portal e pancreatite."], ["Isquemia não oclusiva; papaverina intra-arterial e suporte hemodinâmico em UTI", "Associada a baixo fluxo e vasopressores."]], "pista": "Dor pós-prandial + medo de comer + emagrecimento.", "pp": ["Pródromo: angina intestinal.", "Base: aterosclerose.", "Etiologia: trombose arterial (placa ostial).", "Tratamento: angioplastia com stent ou derivação aortomesentérica."], "ap": "<p>Complemento (WSES 2022): a trombose ocorre na origem da AMS e por isso a isquemia é mais extensa — do duodeno ao cólon transverso —, ao contrário da embolia, que impacta após a cólica média e poupa o jejuno proximal.<\/p>", "mud": [["FA sem anticoagulação, início abrupto", "Embolia", "Fonte cardíaca"], ["Trombofilia ou ACO", "Trombose venosa", "Fator protrombótico"], ["Choque em vasopressor", "Não oclusiva", "Baixo fluxo"]], "arm": "Atribuir toda isquemia mesentérica a embolia.", "ouro": "Angina intestinal prévia = trombose arterial.", "m2": ["Qual é a extensão típica da isquemia na trombose ostial da AMS?", "Do duodeno ao cólon transverso (complemento)."], "n": ["Aterosclerose.", "Angina intestinal: dor pós-prandial, medo de comer.", "Emagrecimento.", "Placa ostial: isquemia extensa.", "Stent ou derivação aortomesentérica."]}, {"id": "C09-Q03", "t": "C09", "sub": "Trombose venosa mesentérica", "comp": "Etiologia e tratamento", "rac": "Associação", "dif": "média", "p": [29, 30], "q": "Mulher de 34 anos, usuária de anticoncepcional oral, com trombofilia conhecida, apresenta dor abdominal progressiva há 3 dias. AngioTC: trombo na veia mesentérica superior, sem peritonite. Qual o tratamento de base?", "o": [["Anticoagulação plena, com fibrinólise em casos selecionados", "Trombose venosa trata-se com anticoagulação; laparotomia se necrose/peritonite."], ["Embolectomia arterial de urgência por via aberta", "Não há êmbolo arterial."], ["Derivação aortomesentérica com enxerto venoso", "É opção para trombose arterial."], ["Papaverina intra-arterial e suspensão de vasopressores", "Tratamento da isquemia não oclusiva."]], "pista": "Trombo na veia + estrogênio + trombofilia.", "pp": ["FR: ACO, trombofilia, hipertensão portal, pancreatite, TEV prévio.", "AngioTC: trombo venoso.", "Sem peritonite: anticoagulação plena.", "Fibrinólise selecionada; cirurgia se necrose."], "ap": "<p>A trombose venosa tende a ter curso mais insidioso que a embolia. O fluxograma mantém a mesma bifurcação: se houver peritonite, necrose, perfuração ou instabilidade, laparotomia com ressecção do não viável e second-look.<\/p>", "mud": [["Peritonite", "Laparotomia", "Necrose"], ["Hipertensão portal", "Fator de risco", "Estase"], ["Pancreatite grave", "Fator de risco", "Inflamação local"]], "arm": "Aplicar tratamento arterial à trombose venosa.", "ouro": "Veia trombosada: anticoagula.", "m2": ["Qual achado da angioTC pode indicar sofrimento grave da parede intestinal?", "Pneumatose e gás portal."], "n": ["FR: estrogênio, trombofilia, hipertensão portal.", "Curso mais insidioso.", "Anticoagulação plena.", "Fibrinólise selecionada.", "Cirurgia se necrose."]}, {"id": "C09-Q04", "t": "C09", "sub": "Isquemia não oclusiva", "comp": "Etiologia e tratamento", "rac": "Associação", "dif": "difícil", "p": [29, 30], "q": "Paciente em UTI com choque cardiogênico, em noradrenalina em dose alta, desenvolve distensão abdominal e lactato crescente. AngioTC sem oclusão arterial ou venosa. Qual a hipótese e o tratamento?", "o": [["Isquemia não oclusiva; suporte hemodinâmico e papaverina intra-arterial", "Baixo fluxo e vasopressores causam vasoespasmo mesentérico sem oclusão."], ["Embolia arterial; embolectomia aberta imediata, mesmo sem êmbolo na angioTC", "Não há êmbolo."], ["Trombose venosa; anticoagulação plena isolada e observação", "AngioTC sem trombo venoso."], ["Íleo funcional benigno; procinéticos e retirada da SNG", "Lactato crescente e choque sugerem isquemia, não íleo benigno."]], "pista": "Sem oclusão + baixo fluxo + vasopressor.", "pp": ["Contexto: IC/baixo fluxo, vasopressores, disfunção de múltiplos órgãos.", "AngioTC sem oclusão.", "Hipótese: isquemia não oclusiva.", "Tratamento: otimizar perfusão + papaverina intra-arterial; cirurgia se necrose."], "ap": "<p>A isquemia não oclusiva é a etiologia que mais depende do tratamento da causa sistêmica. A papaverina intra-arterial é vasodilatadora e atua no vasoespasmo.<\/p>", "mud": [["Oclusão embólica", "Embolectomia", "Etiologia embólica"], ["Peritonite", "Laparotomia", "Necrose"], ["Melhora hemodinâmica", "Reavaliar perfusão e lactato", "Causa sistêmica controlada"]], "arm": "Descartar isquemia porque a angioTC não mostrou trombo.", "ouro": "Choque + vasopressor + intestino sofrendo = não oclusiva.", "m2": ["Que medicação intra-arterial é citada para a isquemia não oclusiva?", "Papaverina."], "n": ["IC, baixo fluxo, vasopressores.", "Sem oclusão na angioTC.", "Suporte hemodinâmico.", "Papaverina intra-arterial.", "Cirurgia se necrose."]}, {"id": "C09-Q05", "t": "C09", "sub": "Second-look", "comp": "Estratégia cirúrgica", "rac": "Compreensão", "dif": "média", "p": [30], "q": "Após revascularização e ressecção de alças necróticas por isquemia mesentérica, o cirurgião deixa o abdome programado para reabordagem. Qual o objetivo e o prazo dessa estratégia?", "o": [["Second-look em 24–48 h, para reavaliar a viabilidade das alças remanescentes", "Áreas de viabilidade duvidosa podem necrosar após a primeira cirurgia."], ["Reoperação em 7 dias para fechar a parede com tela e tratar a hérnia incisional", "Não é o objetivo do second-look."], ["Laparotomia em 6–8 semanas para reconstruir o trânsito intestinal", "Reconstrução não é o second-look."], ["Reabordagem somente se houver febre persistente após 10 dias", "O second-look é programado, não condicionado à febre."]], "pista": "Viabilidade duvidosa muda nas primeiras horas.", "pp": ["Revascularizar e ressecar o claramente inviável.", "Deixar alças duvidosas.", "Reabordar em 24–48 h.", "Se necrose incompatível com a vida: open-close."], "ap": "<p>A estratégia poupa intestino: em vez de ressecar amplamente tudo que parece duvidoso, reavalia-se após a reperfusão. Mortalidade de 50–100% justifica o raciocínio de controle de danos.<\/p>", "mud": [["Necrose de todo o intestino", "Open-close", "Inviável"], ["Alças claramente viáveis", "Sem second-look obrigatório", "Sem dúvida"], ["Piora clínica antes de 24 h", "Reabordar antes", "Indicação clínica"]], "arm": "Confundir second-look com cirurgia tardia de reconstrução.", "ouro": "Isquemia: revasculariza, resseca o morto e volta em 24–48 h.", "m2": ["O que significa “open-close”?", "Abrir, constatar necrose incompatível com a vida e fechar, encaminhando a cuidados paliativos."], "n": ["Second-look em 24–48 h.", "Reavaliar viabilidade.", "Poupar intestino.", "Open-close se inviável.", "Mortalidade 50–100%."], "img": ["c-029-036"]}, {"id": "C09-Q06", "t": "C09", "sub": "Exames na isquemia", "comp": "Propedêutica", "rac": "Interpretação", "dif": "média", "p": [29], "q": "Sobre os exames na isquemia mesentérica aguda segundo a Aula 10, assinale a correta.", "o": [["AngioTC é o exame de escolha, e D-dímero normal ajuda a afastar o diagnóstico", "AngioTC mostra trombo, pneumatose e gás portal; D-dímero normal reduz a probabilidade."], ["Lactato normal na admissão exclui o diagnóstico com segurança e dispensa a angioTC", "Lactato normal no início não afasta."], ["O Rx simples de abdome é o exame de escolha por mostrar o trombo na AMS", "O Rx não mostra o trombo."], ["Leucocitose e acidose estão ausentes mesmo nas fases tardias da doença", "Leucocitose elevada e acidose metabólica são esperadas."]], "pista": "Imagem vascular é a chave.", "pp": ["Laboratório: leucocitose, PCR, lactato, acidose, amilase e CPK elevadas.", "D-dímero normal ajuda a afastar.", "AngioTC: exame de escolha.", "Arteriografia: diagnóstica e terapêutica."], "ap": "<p>A ênfase das armadilhas é clara: abdome flácido não tranquiliza e lactato normal no início não afasta. O exame que muda conduta é a angioTC imediata.<\/p>", "mud": [["Gás portal na TC", "Sinal de gravidade", "Necrose avançada"], ["Arteriografia com êmbolo", "Pode tratar no mesmo tempo", "Diagnóstica e terapêutica"], ["D-dímero elevado", "Inespecífico", "Não confirma sozinho"]], "arm": "Usar lactato normal como critério de exclusão.", "ouro": "Suspeitou: angioTC. D-dímero normal ajuda; lactato normal não basta.", "m2": ["Qual exame é ao mesmo tempo diagnóstico e terapêutico?", "Arteriografia."], "n": ["AngioTC: escolha.", "D-dímero normal ajuda a afastar.", "Lactato normal não afasta.", "Leucocitose e acidose.", "Arteriografia trata."], "img": ["c-029-035"]}, {"id": "C10-Q01", "t": "C10", "sub": "Crohn × RCU: distribuição", "comp": "Diagnóstico diferencial", "rac": "Comparação", "dif": "fácil", "p": [31], "q": "Mulher de 26 anos com diarreia sanguinolenta, tenesmo e urgência. Colonoscopia: inflamação contínua, ascendente a partir do reto, mucosa friável e pseudopólipos, sem áreas de mucosa normal. Qual o diagnóstico mais provável?", "o": [["Retocolite ulcerativa", "Acometimento contínuo a partir do reto, superficial e com sangramento é típico da RCU."], ["Doença de Crohn colônica", "Crohn tem lesões salteadas, pode poupar o reto e é transmural."], ["Tuberculose intestinal", "O padrão retal contínuo não é o da tuberculose."], ["Síndrome do intestino irritável", "Doença funcional não produz inflamação endoscópica."]], "pista": "Contínua desde o reto.", "pp": ["Reto acometido → RCU sempre acomete o reto.", "Contínua, ascendente → RCU.", "Sangramento, tenesmo, urgência → RCU.", "Confirmar com histologia (abscessos de cripta) e p-ANCA."], "ap": "<p>Na tabela mais importante do capítulo, o par de contrastes é: Crohn — qualquer segmento, salteada, transmural, fístulas/estenoses, granulomas, ASCA, tabagismo piora; RCU — cólon e reto, contínua, superficial, sangramento, abscessos de cripta, p-ANCA, tabagismo “protege”.<\/p>", "mud": [["Lesões salteadas com pedra de calçamento", "Crohn", "Distribuição descontínua"], ["Fístula perianal", "Crohn", "Doença transmural"], ["Reto poupado", "Crohn", "RCU sempre pega o reto"]], "arm": "Achar que pseudopólipos indicam Crohn.", "ouro": "RCU começa no reto e sobe sem pular.", "m2": ["Jovem com dor em FID, perda de peso e fístula perianal. Diagnóstico mais provável?", "Doença de Crohn ileocecal."], "n": ["RCU: sempre o reto.", "Contínua, ascendente.", "Mucosa e submucosa.", "Sangramento, tenesmo, urgência.", "Pseudopólipos e mucosa friável."], "img": ["c-031-037"]}, {"id": "C10-Q02", "t": "C10", "sub": "Histologia e sorologia", "comp": "Diagnóstico", "rac": "Associação", "dif": "média", "p": [31], "q": "Biópsia de íleo terminal de paciente com dor em FID e perda ponderal mostra inflamação transmural com granulomas não caseosos. Qual sorologia é esperada e qual o diagnóstico?", "o": [["ASCA positivo; doença de Crohn", "Granulomas não caseosos e inflamação transmural são da Crohn; ASCA se associa a ela."], ["p-ANCA positivo; retocolite ulcerativa", "p-ANCA associa-se à RCU, cuja histologia mostra abscessos de cripta."], ["Anti-transglutaminase positivo; doença celíaca", "Celíaca não produz granulomas transmurais."], ["ASCA positivo; tuberculose intestinal", "Tuberculose tem granulomas caseosos; ASCA não é seu marcador."]], "pista": "Granuloma não caseoso.", "pp": ["Transmural + granuloma não caseoso → Crohn.", "Sorologia associada: ASCA.", "Diferencial: tuberculose (caseoso), linfoma."], "ap": "<p>No caso clínico 10.1 do resumo, o diferencial lembrado para Crohn ileocecal é tuberculose intestinal e linfoma. Não há exame único para DII: o diagnóstico integra história, exame, laboratório, endoscopia, histologia e imagem.<\/p>", "mud": [["Abscessos de cripta", "RCU", "Inflamação superficial"], ["Granuloma caseoso", "Tuberculose", "Necrose caseosa"], ["p-ANCA", "RCU", "Sorologia associada"]], "arm": "Trocar ASCA e p-ANCA.", "ouro": "Crohn: granuloma não caseoso + ASCA. RCU: abscesso de cripta + p-ANCA.", "m2": ["Qual exame de imagem é preferível no jovem para avaliar estenoses e fístulas de delgado?", "Enterorressonância (sem radiação)."], "n": ["Crohn: transmural, granulomas não caseosos.", "ASCA na Crohn.", "RCU: abscessos de cripta.", "p-ANCA na RCU.", "Diferencial: tuberculose, linfoma."], "img": ["c-032-040"]}, {"id": "C10-Q03", "t": "C10", "sub": "Tabagismo na DII", "comp": "Fatores ambientais", "rac": "Compreensão", "dif": "fácil", "p": [31], "q": "Sobre o tabagismo e a doença inflamatória intestinal, segundo a Aula 11, qual afirmação é correta?", "o": [["Na Crohn, o tabagismo piora a doença e aumenta a recidiva pós-operatória; na RCU, há “efeito protetor”", "Ex-tabagistas têm risco maior de RCU; na Crohn, cessar o tabagismo é parte do tratamento."], ["O tabagismo protege na Crohn e piora a RCU, por reduzir a inflamação transmural", "Inverte os efeitos."], ["O tabagismo não interfere em nenhuma das duas formas de DII, segundo as aulas", "Há efeitos opostos bem descritos."], ["Na RCU, o tabagismo deve ser recomendado como tratamento adjuvante para induzir remissão", "Efeito protetor epidemiológico não autoriza recomendar fumar."]], "pista": "Crohn piora; RCU “protege”.", "pp": ["Crohn: tabagismo piora e aumenta recidiva.", "RCU: efeito protetor; ex-tabagistas com maior risco.", "Conduta: cessar tabagismo sempre (especialmente na Crohn)."], "ap": "<p>AINEs também são citados como fator de risco/agudização. Na associação rápida da revisão: “tabagista + Crohn → piora”; “ex-tabagista + diarreia sanguinolenta → RCU”.<\/p>", "mud": [["Ex-tabagista com diarreia sanguinolenta", "Pensar em RCU", "Associação epidemiológica"], ["Crohn operado que segue fumando", "Maior recidiva pós-operatória", "Fator de risco"], ["Uso de AINE", "Agudização", "Fator de risco"]], "arm": "Recomendar tabagismo por “proteção” na RCU.", "ouro": "Cigarro: inimigo da Crohn.", "m2": ["Paciente com Crohn fumante pergunta qual medida mais reduz recidiva após ressecção. Resposta?", "Cessar o tabagismo."], "n": ["Tabagismo piora a Crohn.", "Aumenta recidiva pós-operatória.", "“Protege” na RCU.", "Ex-tabagistas: maior risco de RCU.", "AINEs agudizam."]}, {"id": "C10-Q04", "t": "C10", "sub": "Manifestações extraintestinais", "comp": "Associação clínica", "rac": "Associação", "dif": "média", "p": [32], "q": "Qual associação entre manifestação extraintestinal e forma de DII está correta segundo a Aula 11?", "o": [["Colangite esclerosante primária — RCU", "CEP associa-se à RCU, assim como o pioderma gangrenoso."], ["Eritema nodoso — RCU", "Eritema nodoso associa-se à Crohn."], ["Nefrolitíase por oxalato — RCU", "Associa-se à Crohn, por má absorção ileal."], ["Uveíte — exclusiva da Crohn", "Uveíte ocorre em ambas e independe da atividade."]], "pista": "Fígado/vias biliares e pele ulcerada: RCU.", "pp": ["CEP → RCU.", "Pioderma gangrenoso → RCU.", "Eritema nodoso → Crohn.", "Nefrolitíase por oxalato, aftas, osteoporose → Crohn.", "Articulares, uveíte, episclerite, TEV → ambas."], "ap": "<p>Detalhe cobrado: uveíte independe da atividade intestinal; episclerite acompanha a atividade. As articulares são as manifestações extraintestinais mais frequentes.<\/p>", "mud": [["Úlcera necrótica de bordas violáceas na perna", "Pioderma gangrenoso (RCU)", "Associação"], ["Nódulos dolorosos pré-tibiais", "Eritema nodoso (Crohn)", "Associação"], ["Cálculos renais após ressecção ileal", "Oxalato (Crohn)", "Má absorção ileal"]], "arm": "Trocar eritema nodoso e pioderma.", "ouro": "CEP e pioderma: RCU. Eritema nodoso e oxalato: Crohn.", "m2": ["Qual manifestação ocular independe da atividade intestinal?", "Uveíte."], "n": ["Articulares: mais frequentes (ambas).", "Uveíte: ambas, independe da atividade.", "Episclerite: acompanha a atividade.", "CEP e pioderma: RCU.", "Eritema nodoso e oxalato: Crohn."], "img": ["c-032-038", "c-032-039"]}, {"id": "C10-Q05", "t": "C10", "sub": "Calprotectina fecal", "comp": "Interpretação de exame", "rac": "Interpretação", "dif": "média", "p": [32], "q": "Jovem de 24 anos com dor abdominal e diarreia crônica sem sangue tem calprotectina fecal elevada. Qual a interpretação correta?", "o": [["Indica inflamação orgânica da mucosa e afasta doença funcional, mas não é específica de DII", "Sobe também em gastroenterite, C. difficile, neoplasia, diverticulite, AINEs, celíaca e isquemia."], ["Confirma doença de Crohn e dispensa colonoscopia com biópsias para o diagnóstico", "Não é específica e não substitui endoscopia/histologia."], ["Indica síndrome do intestino irritável com componente inflamatório leve", "Calprotectina elevada favorece doença orgânica, não SII."], ["Só se eleva na RCU e, portanto, exclui Crohn quando positiva", "Eleva-se nas duas e em várias outras condições."]], "pista": "Proteína de neutrófilos.", "pp": ["Calprotectina: neutrófilos migrando para a luz.", "Alta → inflamação orgânica.", "Separa orgânico de funcional (SII).", "Não específica de DII → seguir investigação."], "ap": "<p>O laboratório da DII inclui PCR e VHS elevados, anemia, hipoalbuminemia e ferropenia; a calprotectina é útil como triagem e seguimento, mas o diagnóstico exige endoscopia com histologia e imagem.<\/p>", "mud": [["Calprotectina normal com sintomas crônicos", "Favorece funcional", "Sem inflamação de mucosa"], ["Uso crônico de AINE", "Calprotectina pode subir", "Falso positivo para DII"], ["Infecção por C. difficile", "Calprotectina sobe", "Inflamação infecciosa"]], "arm": "Tratar calprotectina alta como diagnóstico de DII.", "ouro": "Calprotectina diz “há inflamação”, não “é DII”.", "m2": ["Calprotectina elevada em idoso com sangramento oculto. O que excluir?", "Neoplasia colorretal (entre outras causas)."], "n": ["Marcador de neutrófilos.", "Separa orgânico de funcional.", "Não é específica de DII.", "Sobe em infecção, neoplasia, AINE, diverticulite.", "Diagnóstico exige endoscopia e histologia."]}, {"id": "C10-Q06", "t": "C10", "sub": "Corticoide e manutenção", "comp": "Tratamento escalonado", "rac": "Aplicação", "dif": "média", "p": [32, 33], "q": "Paciente com RCU em crise moderada entrou em remissão com prednisona. Sempre que reduz a dose abaixo de 15 mg, os sintomas voltam. Qual a conduta mais adequada?", "o": [["Introduzir imunossupressor (azatioprina, 6-MP ou metotrexato) para manutenção e poupar corticoide", "Corticoide serve para indução; dependência indica imunossupressor (ou biológico se refratário)."], ["Manter prednisona indefinidamente em dose baixa como terapia de manutenção", "Corticoide não deve ser usado para manutenção prolongada."], ["Suspender todo tratamento e reavaliar apenas em nova crise", "Não trata a dependência."], ["Indicar proctocolectomia imediatamente por corticodependência", "Cirurgia é para refratariedade e complicações, após opções clínicas."]], "pista": "Corticoide induz; não mantém.", "pp": ["Mesalazina: RCU leve–moderada.", "Corticoide: indução em crise moderada–grave.", "Manutenção/poupar corticoide: azatioprina, 6-MP, metotrexato.", "Refratário/fistulizante: anti-TNF.", "Complicação/refratariedade: cirurgia."], "ap": "<p>Objetivos do tratamento: induzir e manter remissão, cicatrizar mucosa, reduzir internações e cirurgias, melhorar qualidade de vida. A armadilha clássica da revisão: “corticoide na DII: só indução, nunca manutenção”.<\/p>", "mud"
