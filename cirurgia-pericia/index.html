mpulsividade; tipos desatento, hiperativo/impulsivo e combinado; não é, por si, deficiência legal — depende de repercussão funcional grave e avaliação biopsicossocial.<\/p>", "mud": [["TDAH", "Não é deficiência por si", "Depende de repercussão grave"], ["TEA nível 2", "Apoio substancial", "Rotinas rígidas"], ["TEA nível 1", "Precisa de apoio", "Leve"]], "arm": "Restringir a condição de PcD ao TEA grave.", "ouro": "TEA é deficiência por lei; o nível define o apoio.", "m2": ["O que caracteriza o nível 3 do TEA?", "Apoio muito substancial; fala e interação muito restritas."], "n": ["Lei 12.764/2012.", "PcD para todos os efeitos.", "Níveis 1, 2, 3.", "Avaliação biopsicossocial.", "Diferente do TDAH."]}, {"id": "P07-Q08", "t": "P07", "sub": "TDAH", "comp": "Enquadramento legal", "rac": "Discriminação", "dif": "média", "p": [11], "q": "Adulto com TDAH do tipo combinado, em tratamento, trabalhando e estudando com adaptações mínimas, solicita laudo de PcD. Qual a orientação da aula?", "o": [["Não é deficiência por si; depende de repercussão funcional grave", "Sem repercussão grave, não há enquadramento automático."], ["O TDAH é deficiência para todos os efeitos legais, exatamente como o TEA pela Lei 12.764", "A previsão legal expressa da aula é para o TEA."], ["O TDAH é sempre deficiência intelectual", "Não há déficit intelectual necessário."], ["O TDAH nunca pode ser considerado em avaliação de deficiência", "Pode, se houver repercussão funcional grave."]], "pista": "TEA por lei; TDAH pela repercussão.", "pp": ["TDAH: desatento, hiperativo/impulsivo, combinado.", "Gravidade: leve, moderada, grave.", "Não é deficiência por si.", "Avaliar repercussão funcional grave (biopsicossocial)."], "ap": "<p>O mesmo raciocínio funcional vale para a deficiência física (Aula 06): diagnóstico isolado não define; o que pesa é a limitação para participação em igualdade de condições.<\/p>", "mud": [["TDAH grave com limitação importante", "Avaliação biopsicossocial pode enquadrar", "Repercussão"], ["TEA", "Deficiência por lei", "Lei 12.764"], ["TDAH controlado", "Não enquadra", "Sem repercussão grave"]], "arm": "Equiparar TDAH a TEA quanto ao enquadramento legal.", "ouro": "TDAH: depende da repercussão; não é automático.", "m2": ["Quais os três tipos de TDAH citados?", "Desatento, hiperativo/impulsivo e combinado."], "n": ["TDAH não é deficiência por si.", "Repercussão funcional grave.", "Avaliação biopsicossocial.", "Tipos: desatento, hiperativo, combinado.", "TEA é diferente."]}, {"id": "P07-Q09", "t": "P07", "sub": "Categorias e registro do laudo", "comp": "Estrutura do laudo de PcD", "rac": "Compreensão", "dif": "fácil", "p": [10, 11], "q": "No laudo de caracterização de deficiência, além da categoria, o que deve ser registrado segundo a Aula 06?", "o": [["A origem da condição e a conclusão sobre o enquadramento como PcD", "O laudo registra origem e conclui pelo enquadramento ou não como PcD."], ["Apenas o CID principal, sem necessidade de descrever a repercussão funcional", "Diagnóstico isolado não basta."], ["A renda familiar do avaliado, para fins de cota", "Renda é critério do BPC, não do laudo de deficiência."], ["A recomendação de aposentadoria por incapacidade", "O laudo de PcD não é laudo previdenciário de incapacidade."]], "pista": "Origem + conclusão.", "pp": ["Categoria (I a VII).", "Critérios objetivos e anexos.", "Origem da condição.", "Conclusão: enquadra ou não como PCD/PNE."], "ap": "<p>Deficiência múltipla (VII) exige assinalar cada uma. Para a psicossocial grave, informar data de início e limitações adaptativas. Anexos obrigatórios: audiometria (auditiva), laudo oftalmológico (visual), laudo do especialista (intelectual, mental, psicossocial).<\/p>", "mud": [["Duas deficiências", "Categoria múltipla, assinalar cada uma", "VII"], ["Deficiência adquirida em acidente de trabalho", "Registrar a origem", "Pode ter repercussão previdenciária"], ["Sem critério preenchido", "Conclusão: não enquadra", "Objetividade"]], "arm": "Laudar só pelo CID.", "ouro": "Laudo PcD: categoria, critério, origem e conclusão.", "m2": ["Que anexo é obrigatório para a deficiência visual?", "Laudo oftalmológico."], "n": ["Sete categorias.", "Critérios objetivos.", "Origem da condição.", "Anexos obrigatórios.", "Conclusão de enquadramento."]}, {"id": "P08-Q01", "t": "P08", "sub": "Princípio da legalidade", "comp": "Ordenamento jurídico", "rac": "Associação", "dif": "fácil", "p": [11], "q": "Qual dispositivo constitucional estabelece que “ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei”, citado na Aula 07?", "o": [["CF/88, art. 5º, II — princípio da legalidade", "É a base para entender por que obrigações em saúde do trabalho precisam de lastro normativo."], ["CF/88, art. 1º, III — dignidade da pessoa humana", "Art. 1º traz os fundamentos (dignidade, valores sociais do trabalho)."], ["CF/88, art. 7º, XXII — redução dos riscos do trabalho", "Art. 7º trata de direitos dos trabalhadores."], ["CLT, art. 157 — deveres das empresas", "Art. 157 trata dos deveres das empresas."]], "pista": "Legalidade = art. 5º, II.", "pp": ["Art. 1º: fundamentos (III dignidade; IV valores sociais do trabalho e livre iniciativa).", "Art. 5º, II: legalidade.", "Art. 7º: direitos (XXII riscos; XXIII adicionais).", "CLT 157: deveres da empresa."], "ap": "<p>A hierarquia vai da Constituição à CLT (cap. V), à Lei 8.213 (art. 19 §1º) e às NRs, que são disposições complementares ao cap. V da CLT. A legalidade explica por que uma exigência de exame admissional ou de EPI precisa estar prevista em norma.<\/p>", "mud": [["Pergunta sobre adicional de insalubridade", "Art. 7º, XXIII", "Direito do trabalhador"], ["Pergunta sobre redução de riscos", "Art. 7º, XXII", "Normas de saúde e segurança"], ["Pergunta sobre deveres da empresa", "CLT art. 157", "Cumprir e fazer cumprir"]], "arm": "Trocar fundamentos (art. 1º) por direitos (art. 7º).", "ouro": "Legalidade: art. 5º, II.", "m2": ["Quais incisos do art. 1º foram destacados?", "III (dignidade da pessoa humana) e IV (valores sociais do trabalho e da livre iniciativa)."], "n": ["Art. 1º: fundamentos.", "Art. 5º, II: legalidade.", "Art. 7º, XXII e XXIII.", "CLT cap. V, art. 157.", "NRs complementam a CLT."]}, {"id": "P08-Q02", "t": "P08", "sub": "Responsabilidades da empresa", "comp": "Normas de saúde do trabalhador", "rac": "Aplicação", "dif": "média", "p": [11], "q": "Uma empresa entrega EPIs, mas não instrui os empregados sobre o uso nem fiscaliza. Segundo as normas citadas na Aula 07, qual a obrigação descumprida?", "o": [["Cumprir e fazer cumprir as normas, instruindo e fiscalizando (CLT 157; Lei 8.213, art. 19 §1º)", "A obrigação não se esgota na entrega do equipamento."], ["Nenhuma, pois a entrega do EPI transfere toda a responsabilidade pelo uso ao empregado", "A empresa deve instruir e fazer cumprir."], ["Apenas a de pagar adicional de periculosidade, previsto na NR-16", "Periculosidade não substitui o dever de proteção e instrução."], ["Somente a de emitir CAT mensal preventiva ao INSS", "CAT é comunicação de acidente, não preventiva."]], "pista": "Cumprir e fazer cumprir.", "pp": ["CLT 157: cumprir/fazer cumprir normas, instruir (ordens de serviço), adotar medidas.", "Lei 8.213, art. 19 §1º: empresa responde pelas medidas coletivas e individuais.", "NR-06: EPI.", "Omissão pode pesar no nexo e na culpa."], "ap": "<p>Na perícia trabalhista, o descumprimento dessas obrigações é avaliado junto do nexo causal/concausal e do dano; a qualificação da culpa do empregador é jurídica.<\/p>", "mud": [["Empresa instrui e fiscaliza", "Cumpre a norma", "Dever atendido"], ["Ambiente insalubre", "Adicional (art. 7º, XXIII) + medidas de proteção", "Não substitui proteção"], ["Acidente com EPI não usado", "Avaliar instrução e fiscalização", "Dever de fazer cumprir"]], "arm": "Achar que entregar o EPI basta.", "ouro": "Empresa entrega, instrui e fiscaliza.", "m2": ["Qual NR trata do EPI?", "NR-06."], "n": ["CLT 157.", "Lei 8.213, art. 19 §1º.", "Instruir com ordens de serviço.", "Medidas coletivas e individuais.", "NR-06: EPI."]}, {"id": "P08-Q03", "t": "P08", "sub": "NR-7 e ASO", "comp": "Normas regulamentadoras", "rac": "Associação", "dif": "fácil", "p": [11, 12], "q": "Qual NR institui o PCMSO e quais são os tipos de ASO listados em aula?", "o": [["NR-07 — admissional, periódico, retorno, mudança de risco e demissional", "São os cinco momentos do ASO no PCMSO."], ["NR-15 — admissional, de insalubridade e demissional", "NR-15 trata de atividades insalubres."], ["NR-32 — admissional e periódico apenas para profissionais de saúde", "NR-32 trata de segurança em serviços de saúde."], ["NR-17 — exames de ergonomia admissional e demissional", "NR-17 é ergonomia."]], "pista": "PCMSO = NR-7.", "pp": ["NR-07: PCMSO.", "ASO: admissional, periódico, retorno, mudança de risco, demissional.", "Outras: NR-15 insalubridade; NR-16 periculosidade; NR-17 ergonomia; NR-32 serviços de saúde."], "ap": "<p>O PCMSO (item 7.3.2) também deve acompanhar de forma diferenciada quem pode ser especialmente afetado pelos riscos e subsidiar a readaptação — ponto central no caso da trabalhadora com deficiência física da Aula 06.<\/p>", "mud": [["Pergunta sobre CIPA", "NR-05", "Comissão"], ["Pergunta sobre SESMT", "NR-04", "Serviço especializado"], ["Pergunta sobre máquinas", "NR-12", "Equipamentos"]], "arm": "Confundir NR-7 com NR-17.", "ouro": "NR-7: PCMSO e ASO em cinco momentos.", "m2": ["Qual NR vale para qualquer serviço de saúde, inclusive segurança do paciente?", "NR-32."], "n": ["NR-07: PCMSO.", "Cinco ASOs.", "NR-15 insalubridade; NR-16 periculosidade.", "NR-17 ergonomia.", "NR-32 serviços de saúde."]}, {"id": "P08-Q04", "t": "P08", "sub": "NR-32", "comp": "Normas regulamentadoras", "rac": "Aplicação", "dif": "fácil", "p": [12], "q": "Um hospital elabora seu programa de prevenção de acidentes com perfurocortantes e de segurança dos trabalhadores. Qual NR rege especificamente a segurança e saúde no trabalho em serviços de saúde?", "o": [["NR-32", "Vale para qualquer serviço de saúde e dialoga com a segurança do paciente."], ["NR-12", "NR-12 trata de máquinas em geral."], ["NR-05", "CIPA não é a norma específica de serviços de saúde."], ["NR-16", "Periculosidade é outro tema."]], "pista": "Serviços de saúde = 32.", "pp": ["NR-32: segurança e saúde em serviços de saúde.", "Aplica-se a qualquer serviço de saúde.", "Conecta-se à segurança do paciente (Aula 01)."], "ap": "<p>Pontos para fixar da Aula 07: acidente do trabalho (arts. 19–21), responsabilidades previdenciária, trabalhista e ética, NR-7 e NR-32, CLT × PJ, CEM e saúde ocupacional.<\/p>", "mud": [["Tema: ergonomia do posto", "NR-17", "Ergonomia"], ["Tema: insalubridade", "NR-15", "Insalubridade"], ["Tema: riscos ambientais", "NR-09", "Antigo PPRA"]], "arm": "Escolher NR genérica em vez da específica.", "ouro": "Serviço de saúde: NR-32.", "m2": ["Quais as duas NRs mais destacadas na revisão da Aula 07?", "NR-7 e NR-32."], "n": ["NR-32: serviços de saúde.", "Qualquer serviço de saúde.", "Segurança do trabalhador e do paciente.", "NR-7: PCMSO.", "NR-9: riscos ambientais."]}, {"id": "P08-Q05", "t": "P08", "sub": "CLT × PJ diante de acidente", "comp": "Consequências previdenciárias", "rac": "Comparação", "dif": "difícil", "p": [12], "q": "Dois médicos escorregam no pronto-socorro e ficam com sequela de fratura de punho (perda parcial de força). Um é CLT; o outro presta serviço como PJ e recolhe INSS como contribuinte individual. Qual comparação é correta?", "o": [["CLT: B91, estabilidade e auxílio-acidente; PJ: no máximo auxílio comum, sem B94 nem estabilidade", "Auxílio-acidente é restrito a empregado, doméstico, avulso e segurado especial."], ["Ambos têm direito idêntico a auxílio-acidente, por serem contribuintes do RGPS", "O contribuinte individual não tem auxílio-acidente."], ["O PJ tem direito a estabilidade de 12 meses, pois o acidente ocorreu no local de trabalho", "Estabilidade é do empregado."], ["Nenhum tem direito a benefício, pois acidente por queda não é acidente de trabalho", "Para o CLT é acidente típico; para o PJ, acidente de qualquer natureza."]], "pista": "Auxílio-acidente e estabilidade: só empregado (entre os dois).", "pp": ["CLT: acidente típico (art. 19) → CAT → B91 sem carência.", "Estabilidade de 12 meses (art. 118 — complemento do resumo).", "Sequela → B94 (Anexo III, quadro 8).", "PJ: auxílio por incapacidade comum (acidente dispensa carência); sem B94 nem estabilidade.", "Reparação civil contra o hospital: via judicial."], "ap": "<p>O resumo marca como complemento (conferir na legislação vigente) a estabilidade do art. 118 e a exclusão do contribuinte individual do auxílio-acidente (art. 18 §1º). O ponto da aula: a escolha CLT × PJ muda a proteção previdenciária, não só a tributação.<\/p>", "mud": [["PJ que nunca recolheu INSS", "Sem benefício previdenciário", "Sem filiação"], ["CLT sem sequela", "Sem B94", "Sem redução"], ["Ação contra o hospital", "Depende de culpa/risco (cível)", "Outra esfera"]], "arm": "Achar que todo segurado tem auxílio-acidente.", "ouro": "PJ ganha flexibilidade e perde proteção acidentária.", "m2": ["Qual quadro do Anexo III trata de redução de força dos membros?", "Quadro 08."], "n": ["CLT: B91, estabilidade, B94.", "PJ: auxílio comum se contribuinte.", "PJ sem auxílio-acidente.", "PJ sem estabilidade.", "Reparação civil é outra via."]}, {"id": "P08-Q06", "t": "P08", "sub": "Vínculo empregatício e pejotização", "comp": "Mundo do trabalho", "rac": "Reconhecimento", "dif": "média", "p": [12], "q": "Médico contratado como PJ cumpre escala fixa definida pelo hospital, não pode se fazer substituir, recebe valor mensal fixo e obedece a ordens da chefia. Qual risco a aula aponta nesse arranjo?", "o": [["Pejotização: há subordinação, habitualidade, onerosidade e pessoalidade", "São os elementos do vínculo CLT."], ["Nenhum risco, pois o contrato de PJ prevalece sobre a realidade", "O que caracteriza o vínculo é a realidade da relação."], ["Risco apenas tributário, por pagar menos imposto que no CLT", "O risco destacado é o vínculo disfarçado."], ["Risco de perder o registro no CRM por exercer a medicina por meio de pessoa jurídica", "Não é o ponto da aula."]], "pista": "Subordinação + habitualidade + onerosidade + pessoalidade.", "pp": ["Elementos do vínculo CLT: subordinação, habitualidade, onerosidade, pessoalidade.", "Todos presentes.", "PJ formal com realidade de emprego = pejotização."], "ap": "<p>Vantagens do PJ citadas: maior flexibilidade e renda líquida, tributação geralmente menor (Simples Nacional/lucro presumido). Desvantagens: nenhum direito automático (férias, 13º, FGTS), menor proteção previdenciária.<\/p>", "mud": [["Médico define a própria agenda e pode ser substituído", "Indício de autonomia", "Sem pessoalidade/subordinação"], ["Empregado CLT", "Direitos trabalhistas automáticos", "Vínculo"], ["PJ com vários contratantes", "Autonomia mais plausível", "Sem exclusividade"]], "arm": "Achar que o contrato escrito define sozinho a natureza do vínculo.", "ouro": "Se tem cara de emprego, é risco de pejotização.", "m2": ["Quais direitos são automáticos no CLT e ausentes no PJ?", "Férias + 1/3, 13º, FGTS, aviso prévio, adicionais."], "n": ["Subordinação.", "Habitualidade.", "Onerosidade.", "Pessoalidade.", "Pejotização = vínculo disfarçado."]}, {"id": "P08-Q07", "t": "P08", "sub": "Código de Ética e saúde ocupacional", "comp": "Deveres éticos", "rac": "Aplicação", "dif": "média", "p": [12], "q": "Médico assistente atende trabalhador com intoxicação por solvente e não explica a relação entre a doença e o ambiente de trabalho. Qual dispositivo do Código de Ética Médica citado em aula é violado?", "o": [["Art. 13 — esclarecer determinantes sociais, ambientais ou profissionais da doença", "O médico assistente deve informar os determinantes profissionais."], ["Princípio XIII — dever de comunicar às autoridades a deterioração do ecossistema", "Trata de danos ambientais à coletividade."], ["Art. 12 — esclarecer o trabalhador sobre condições de risco e comunicar ao empregador", "É o dever do médico do trabalho em relação aos riscos."], ["Princípio I — medicina a serviço da saúde, sem discriminação", "Princípio geral; o dispositivo específico é o art. 13."]], "pista": "Determinantes da doença do paciente.", "pp": ["Art. 12: condições de trabalho de risco (esclarecer o trabalhador e comunicar ao empregador).", "Art. 13: determinantes sociais, ambientais ou profissionais da doença.", "Caso: médico assistente e doença já instalada → art. 13."], "ap": "<p>Princípios relacionados: XII (melhor adequação do trabalho ao ser humano, eliminação e controle dos riscos) e XIII (comunicar às autoridades deterioração do ecossistema prejudicial à saúde).<\/p>", "mud": [["Médico do trabalho omite risco do posto", "Art. 12", "Condições de risco"], ["Contaminação de rio por indústria", "Princípio XIII", "Ecossistema"], ["Adequação do trabalho ao ser humano", "Princípio XII", "Ergonomia/controle de riscos"]], "arm": "Trocar art. 12 e art. 13.", "ouro": "Art. 12: risco do trabalho. Art. 13: causa da doença.", "m2": ["Quem o médico deve comunicar segundo o art. 12?", "Os empregadores (além de esclarecer o trabalhador)."], "n": ["Princ. I e II: saúde sem discriminação.", "Princ. XII: adequar o trabalho.", "Princ. XIII: ecossistema.", "Art. 12: riscos do trabalho.", "Art. 13: determinantes da doença."]}, {"id": "P08-Q08", "t": "P08", "sub": "Abertura de PJ", "comp": "Planejamento profissional", "rac": "Sequência", "dif": "média", "p": [12], "q": "Qual sequência de etapas para abrir uma pessoa jurídica médica foi apresentada na Aula 07?", "o": [["CNAE → configuração → localidade → contrato social → Junta/Cartório → CNPJ", "É a ordem do slide."], ["Emitir o CNPJ → definir o CNAE → registrar no CRM → contrato social → alvará de funcionamento", "O CNPJ é a última etapa."], ["Contrato social → CNPJ → definir CNAE → análise de localidade → Junta Comercial", "Inverte etapas iniciais."], ["Registro na Junta → CNPJ → contrato social → CNAE, sem análise de localidade", "Omite a análise prévia e inverte a ordem."]], "pista": "Começa pelo CNAE, termina no CNPJ.", "pp": ["1 CNAE.", "2 Configurar a empresa.", "3 Análise prévia de localidade (prefeitura).", "4 Contrato social.", "5 Registro na Junta Comercial/Cartório.", "6 CNPJ."], "ap": "<p>O tema pertence ao pilar do planejamento (Aula 01): impostos, previdência e carreira. Ser PJ não dispensa recolher INSS — como sócio (pró-labore) ou contribuinte individual.<\/p>", "mud": [["Pergunta sobre tributação do PJ", "Simples Nacional ou lucro presumido", "Geralmente menor carga nominal"], ["Pergunta sobre previdência do PJ", "Recolher como sócio/contribuinte individual", "Proteção previdenciária"], ["Pergunta sobre risco", "Pejotização", "Vínculo disfarçado"]], "arm": "Achar que o CNPJ vem antes do contrato social.", "ouro": "CNAE primeiro, CNPJ por último.", "m2": ["Por que o CNAE importa também na perícia?", "A Lista C cruza CID com CNAE para o NTEP."], "n": ["CNAE.", "Configuração.", "Localidade.", "Contrato social.", "Junta/Cartório → CNPJ."]}, {"id": "P09-Q01", "t": "P09", "sub": "Origem do termo barema", "comp": "História do dano corporal", "rac": "Memória com compreensão", "dif": "fácil", "p": [12], "q": "O termo “barema”, usado para tabelas de avaliação do dano corporal, tem origem em:", "o": [["François Barrême, matemático francês do “Livre des Comptes Faits”", "É a origem citada na Aula 08."], ["Código de Hamurábi e sua Lei de Talião", "Hamurábi trouxe a proporcionalidade retributiva, não o termo."], ["Hôtel des Invalides, hospital de Luís XIV", "Associou “lesado” a “inválido”, mas não originou o termo."], ["Guia da American Medical Association, de 1971", "O Guia AMA é posterior e não originou o termo."]], "pista": "Matemático francês do século XVII.", "pp": ["Barrême (1640–1703).", "Livre des Comptes Faits.", "Tabela situação → cifra.", "Daí “barema”."], "ap": "<p>Linha do tempo da aula: Hamurábi (282 leis; Talião — proporcionalidade); Barrême; Hôtel des Invalides (1670); baremas franceses de 1887, 1919 e 1939; Guia AMA (1950/1971); Le Concours Médical; Tabela Indicativa portuguesa; Tabela Brasileira para Apuração do Dano Corporal.<\/p>", "mud": [["Pergunta sobre a Lei de Talião", "Proporcionalidade retributiva", "Hamurábi"], ["Pergunta sobre “lésé” e “invalide”", "Hôtel des Invalides", "Luís XIV"], ["Pergunta sobre o Guia AMA", "1ª edição 1971", "EUA"]], "arm": "Atribuir o termo a Hamurábi.", "ouro": "Barema vem de Barrême.", "m2": ["Qual o sentido da Lei de Talião segundo a aula?", "Proporcionalidade retributiva, não vingança."], "n": ["Barrême, matemático francês.", "Livre des Comptes Faits.", "Hamurábi: Talião.", "Invalides: lesado ↔ inválido.", "Guia AMA, 1971."]}, {"id": "P09-Q02", "t": "P09", "sub": "Natureza dos baremas", "comp": "Conceito", "rac": "Compreensão", "dif": "média", "p": [13], "q": "Qual afirmação sobre os baremas de avaliação do dano corporal está de acordo com a Aula 08?", "o": [["São indicativos: não têm valor absoluto nem força de norma", "Padronizam e homogeneízam, mas não vinculam."], ["Têm força de lei e vinculam o juiz ao percentual tabelado para cada lesão", "Não são norma."], ["Substituem a descrição funcional, bastando informar o percentual", "O perito descreve função e restrições."], ["São iguais em todos os quadros jurídicos, com o mesmo valor para cada lesão", "Valores variam por quadro jurídico."]], "pista": "Indicativo, não vinculante.", "pp": ["Função: padronizar situação → cifra.", "Homogeneizar resultados.", "Traduzir em número o déficit funcional permanente.", "Natureza: indicativa, referência ao juiz."], "ap": "<p>A CIF não é barema, mas ajuda a descrever a funcionalidade: CID descreve estrutura/etiologia; CIF descreve função. Dois diabéticos com a mesma CID podem ter funcionalidades muito diferentes.<\/p>", "mud": [["Pergunta sobre a CIF", "Descreve funcionalidade", "Não é barema"], ["Pergunta sobre DPVAT", "Percentuais legais próprios", "Quadro jurídico específico"], ["Juiz diverge do barema", "Pode, pois é indicativo", "Livre convencimento"]], "arm": "Tratar barema como norma.", "ouro": "Barema orienta; o juiz decide.", "m2": ["Qual a diferença entre CID e CIF?", "CID: estrutura/etiologia. CIF: funcionalidade."], "n": ["Padroniza e homogeneíza.", "Indicativo.", "Sem força de norma.", "Referência ao magistrado.", "CIF descreve função."]}, {"id": "P09-Q03", "t": "P09", "sub": "Mesmo dano, valores diferentes", "comp": "Comparação de tabelas", "rac": "Comparação", "dif": "média", "p": [13], "q": "Para a perda total da visão de um olho, quais percentuais foram apresentados para SUSEP, DPVAT e Tabela Brasileira, respectivamente?", "o": [["30%, 50% e 25% (60% na TB se já havia perda do contralateral)", "Mostra que o valor depende do quadro jurídico."], ["50%, 30% e 60%, pois a TB sempre dobra o valor do seguro privado", "Os números estão trocados."], ["25% em todas as tabelas, já que o órgão é o mesmo", "Não há valor universal."], ["100% em todas, por tratar-se de perda total de um órgão", "Perda de um olho não é 100%."]], "pista": "Não existe “valor do olho” universal.", "pp": ["SUSEP (seguro privado): 30%.", "DPVAT (Lei 11.945/2009): 50%.", "Tabela Brasileira: 25% (60% se perda prévia do outro olho).", "Lição: o percentual depende do quadro jurídico."], "ap": "<p>Outros exemplos da tabela: surdez total bilateral — SUSEP 40%, DPVAT 50%, TB pela Tabela A; surdez total de um ouvido — SUSEP 20%; amputação total do pênis — TB 30% (perda incompleta 10–25%), Tabela Portuguesa 40 pontos.<\/p>", "mud": [["Surdez total bilateral no DPVAT", "50%", "Tabela DPVAT"], ["Mesmo olho, com contralateral já perdido, na TB", "60%", "Agravamento funcional"], ["Surdez de um ouvido na SUSEP", "20%", "Seguro privado"]], "arm": "Achar que há um percentual único por órgão.", "ouro": "Olho: SUSEP 30, DPVAT 50, TB 25.", "m2": ["Por que a TB eleva para 60% se o outro olho já estava perdido?", "Porque a perda passa a significar cegueira funcional."], "n": ["SUSEP 30%.", "DPVAT 50%.", "TB 25% (60%).", "Quadro jurídico decide.", "Não há valor universal."]}, {"id": "P09-Q04", "t": "P09", "sub": "CC arts. 949 e 950", "comp": "Base legal da reparação", "rac": "Comparação", "dif": "média", "p": [13], "q": "Vítima de erro com sequela que a impede de exercer sua profissão de pianista pede indenização. Qual dispositivo prevê, além das despesas e lucros cessantes, pensão pela inabilitação?", "o": [["Código Civil, art. 950", "Defeito que impede o ofício ou diminui a capacidade: pensão correspondente, podendo ser paga de uma só vez."], ["Código Civil, art. 949", "O art. 949 não prevê pensão pela inabilitação."], ["Código Civil, art. 186", "Art. 186 define ato ilícito; não fixa pensão."], ["Lei 8.213/91, art. 104", "É norma previdenciária, não de reparação civil."]], "pista": "Impede o ofício → pensão.", "pp": ["Art. 927: ilícito causador de dano obriga a reparar.", "Art. 949: tratamento + lucros cessantes + outro prejuízo.", "Art. 950: tudo do 949 + pensão pela inabilitação/depreciação.", "Pode ser paga de uma só vez."], "ap": "<p>Reparação integral: recolocar a vítima, às expensas do responsável, na situação em que estaria se o fato não tivesse ocorrido. O perito descreve as restrições concretas porque é isso que fundamenta a pensão do art. 950 — não o simples diagnóstico.<\/p>", "mud": [["Lesão sem sequela permanente", "Art. 949", "Sem inabilitação"], ["Responsabilidade objetiva por risco", "Art. 927, parágrafo único", "Independe de culpa"], ["Pensão de uma só vez", "Prevista no 950", "Opção do lesado"]], "arm": "Achar que o 949 inclui pensão.", "ouro": "949 trata; 950 pensiona.", "m2": ["O que diz o parágrafo único do art. 927?", "Responsabilidade objetiva nos casos da lei ou quando a atividade implicar risco."], "n": ["927: dever de reparar.", "949: tratamento e lucros cessantes.", "950: pensão por inabilitação.", "Reparação integral.", "Perito descreve restrições."]}, {"id": "P09-Q05", "t": "P09", "sub": "Cálculo do dano auditivo (Tabela Brasileira)", "comp": "Cálculo pericial", "rac": "Cálculo", "dif": "difícil", "p": [13, 14], "q": "Audiometria: OD 500 = 20, 1.000 = 30, 2.000 = 40, 4.000 = 50 dB; OE 500 = 10, 1.000 = 15, 2.000 = 15, 4.000 = 20 dB. Pela Tabela Brasileira (pesos 2, 4, 3, 1; soma ÷ 10) e o recorte da Tabela A, qual o déficit funcional?", "o": [["4%", "OD = (40+120+120+50)/10 = 33 dB (faixa 30–39); OE = (20+60+45+20)/10 = 14,5 dB (0–19); cruzamento = 4%."], ["6%", "A OE resulta em 14,5 dB (faixa 0–19)."], ["8%", "A OD resulta em 33 dB."], ["0%", "0% só ocorreria com as duas orelhas na faixa 0–19 dB; a OD resulta em 33 dB."]], "pista": "Calcule cada orelha separadamente.", "pp": ["OD: 20×2 = 40; 30×4 = 120; 40×3 = 120; 50×1 = 50 → 330 ÷ 10 = 33 dB.", "OE: 10×2 = 20; 15×4 = 60; 15×3 = 45; 20×1 = 20 → 145 ÷ 10 = 14,5 dB.", "Tabela A: 30–39 × 0–19 = 4%."], "ap": "<p>Erros comuns: usar 3.000 Hz (que é da caracterização de PcD) em vez de 4.000 Hz; esquecer os pesos; somar as orelhas. O cálculo é da via aérea; cruza-se OD × OE na Tabela A.<\/p>", "mud": [["OE fosse 25 dB", "6%", "Faixa 20–29"], ["OD fosse 45 dB e OE 15", "6%", "Faixa 40–49 × 0–19"], ["Avaliação para PcD", "Média simples de 500–3.000 Hz", "Outro método"]], "arm": "Usar a frequência de 3.000 Hz ou média simples.", "ouro": "TB auditiva: 2-4-3-1 até 4 kHz, ÷10, cruza na Tabela A.", "m2": ["OD resulta em 52 dB e OE em 12 dB. Déficit pela Tabela A?", "8% (faixa 50–59 × 0–19)."], "n": ["500, 1.000, 2.000, 4.000 Hz.", "Pesos 2, 4, 3, 1.", "Soma ÷ 10 por orelha.", "Cruza OD × OE na Tabela A.", "Via aérea."]}, {"id": "P09-Q06", "t": "P09", "sub": "DPVAT — membros inferiores", "comp": "Aplicação de tabela", "rac": "Aplicação", "dif": "média", "p": [13], "q": "Vítima de trânsito ficou com encurtamento consolidado de 4 cm do membro inferior direito. Pela tabela DPVAT apresentada em aula, qual o percentual?", "o": [["10%", "Encurtamento ≥ 5 cm = 15%; 4 cm = 10%; 3 cm = 6%; < 3 cm sem indenização."], ["15%", "15% é para ≥ 5 cm."], ["6%", "6% é para 3 cm."], ["Sem indenização", "Indeniza-se a partir de 3 cm."]], "pista": "5 → 15%; 4 → 10%; 3 → 6%.", "pp": ["Identificar o dano: encurtamento de 4 cm.", "Tabela DPVAT: 4 cm → 10%.", "< 3 cm → sem indenização."], "ap": "<p>Outros valores DPVAT de membros inferiores: perda total do uso de uma perna 70%; fratura não consolidada do fêmur 50%; perda total de um pé 50%; fratura não consolidada de uma perna 25%; anquilose total de joelho/tornozelo 20%; fratura não consolidada da rótula ou de um pé 20%; amputação do 1º pododáctilo 10%; de outro pododáctilo 3%.<\/p>", "mud": [["Encurtamento de 2 cm", "Sem indenização", "< 3 cm"], ["Encurtamento de 6 cm", "15%", "≥ 5 cm"], ["Anquilose total de joelho", "20%", "Outro item"]], "arm": "Aplicar 15% a qualquer encurtamento acima de 3 cm.", "ouro": "Encurtamento DPVAT: 3 = 6, 4 = 10, ≥ 5 = 15; < 3 = zero.", "m2": ["Qual o percentual DPVAT para amputação do hálux?", "10%."], "n": ["≥ 5 cm: 15%.", "4 cm: 10%.", "3 cm: 6%.", "< 3 cm: zero.", "Perda total do uso de uma perna: 70%."]}, {"id": "P09-Q07", "t": "P09", "sub": "MMI e avaliação prematura", "comp": "Pressupostos do dano", "rac": "Aplicação", "dif": "difícil", "p": [14], "q": "Parturiente teve fragmento metálico retido após cesárea; ainda não fez radiografia nem retirada. O juiz pede o percentual de dano definitivo. Qual a resposta técnica coerente com a aula?", "o": [["É prematura: sem localização, retirada e consolidação (MMI) não há sequela definida", "Só se fala em dano quando o horizonte de tratamento se esgotou."], ["Fixar 100% de dano, pois há corpo estranho metálico retido no organismo", "Sem consolidação, não se fixa dano definitivo."], ["Fixar 0%, pois sem dor atual não há dano", "Pode haver sofrimento, despesas e dano futuro; apenas não é definitivo."], ["Dispensar exame de imagem e avaliar só pela cicatriz", "Localizar o corpo estranho é essencial."]], "pista": "MMI = tratamento esgotado.", "pp": ["Violação de vigilância e informação (nexo direto).", "Perito deve localizar o corpo estranho (imagem).", "Verificar retirada e consolidação (MMI).", "Registrar sofrimento, dano estético, despesas (art. 949).", "Dano definitivo só após MMI."], "ap": "<p>MMI (Maximum Medical Improvement): só se fala em dano quando há sequela, com o horizonte de tratamento clínico/cirúrgico esgotado. Dano: significante alteração, perda ou perda de uso de parte estrutural ou funcional do corpo; incapacidade: limitação/restrição para realizar uma atividade.<\/p>", "mud": [["Fragmento retirado, cicatriz consolidada", "Avaliar dano estético e sequelas", "MMI atingido"], ["Complicação persistente após retirada", "Descrever sequela definitiva", "Consolidação"], ["Despesas já realizadas", "Art. 949", "Reparação"]], "arm": "Fixar percentual antes da consolidação.", "ouro": "Sem MMI, sem dano definitivo.", "m2": ["Que deveres deontológicos o obstetra violou?", "Vigilância e informação."], "n": ["MMI = consolidação.", "Antes disso, avaliação prematura.", "Localizar o corpo estranho.", "Art. 949 para despesas.", "Dano estético após consolidação."]}, {"id": "P09-Q08", "t": "P09", "sub": "Dano estético", "comp": "Conceito", "rac": "Compreensão", "dif": "média", "p": [14], "q": "Segundo Hermes de Alcântara, citado na Aula 08, como se define o dano estético?", "o": [["Alteração morfológica permanente, aparente e para pior; não exige “aleijões”", "Graduado em escala de 7 graus (muito leve a muito importante)."], ["Apenas deformidades graves e visíveis a distância, como amputações e grandes queimaduras", "Não exige “aleijões”."], ["Qualquer cicatriz, mesmo transitória e que desaparecerá com o tempo", "Exige permanência."], ["Somente alterações faciais, excluindo outras regiões do corpo", "Não se restringe à face."]], "pista": "Permanente, aparente e para pior.", "pp": ["Permanente.", "Aparente.", "Para pior.", "Sem danos mínimos; sem exigir aleijão.", "Escala de 7 graus."], "ap": "<p>Escala: 1 muito leve, 2 leve, 3 moderado, 4 médio, 5 relevante, 6 importante, 7 muito importante. Como os demais danos, só se avalia após a consolidação.<\/p>", "mud": [["Cicatriz que ainda está remodelando", "Aguardar consolidação", "MMI"], ["Cicatriz discreta permanente", "Grau baixo na escala", "Não admite danos mínimos, mas gradua"], ["Deformidade extensa", "Grau alto", "Gradação"]], "arm": "Exigir deformidade grave para reconhecer dano estético.", "ouro": "Dano estético: permanente, aparente, para pior — gradue em 7.", "m2": ["Quantos graus tem a escala de dano estético citada?", "Sete."], "n": ["Alteração morfológica.", "Permanente e aparente.", "Para pior.", "Não exige aleijão.", "Escala de 7 graus."]}, {"id": "P09-Q09", "t": "P09", "sub": "Descrição de restrições (caso do rim)", "comp": "Fundamentação da pensão", "rac": "Integração", "dif": "difícil", "p": [14], "q": "Trabalhador perdeu um rim esmagado por prensa; a função renal global é normal. Por que, segundo a aula, o perito deve descrever restrições como evitar trauma abdominal e moderar proteína e sal?", "o": [["Porque as restrições fundamentam a pensão do art. 950, não o diagnóstico", "O diagnóstico isolado não mostra a perda funcional que justifica a reparação."], ["Porque, com função renal normal, não há dano a reparar e as restrições são irrelevantes ao processo", "Há restrições reais à atividade."], ["Porque a perda de um rim sempre gera aposentadoria por incapacidade permanente", "Não há incapacidade total."], ["Porque a Tabela Brasileira proíbe valorar a perda renal unilateral", "A TB valora conforme a preservação da função."]], "pista": "Restrição concreta = depreciação.", "pp": ["Dano estrutural: perda de um rim.", "Função global preservada.", "Restrições: atividades com risco de trauma abdominal, esportes de contato, dieta.", "Restrições → depreciação da capacidade → art. 950."], "ap": "<p>A Tabela Brasileira valora a perda renal unilateral conforme a preservação da função; o laudo que descreve o que a pessoa deixou de poder fazer dá base objetiva ao juiz.<\/p>", "mud": [["Função renal reduzida", "Valoração maior", "Comprometimento funcional"], ["Atividade sem risco de trauma", "Menor depreciação", "Contexto da função"], ["Necessidade de diálise", "Dano muito maior", "Perda funcional"]], "arm": "Concluir que não há dano porque a creatinina é normal.", "ouro": "Descreva o que a pessoa não pode mais fazer.", "m2": ["Qual o princípio da Res. CFM 2.056/2013 citado na Aula 08?", "Visum et repertum — ver e registrar, para permitir análise futura."], "n": ["Diagnóstico não basta.", "Descrever restrições.", "Restrições fundamentam a pensão.", "TB valora pela função.", "Visum et repertum."]}, {"id": "P10-Q01", "t": "P10", "sub": "Prova e perícia", "comp": "Conceito", "rac": "Compreensão", "dif": "fácil", "p": [14], "q": "Qual afirmação sintetiza o conceito de prova pericial apresentado na Aula 09?", "o": [["A prova forma a convicção do juiz; “se há dúvida, a prova não foi feita”", "A perícia é conjunto de procedimentos para esclarecer fato de interesse da Justiça."], ["A prova serve para convencer o perito, que então decide a causa como auxiliar do juízo", "Quem decide é o juiz."], ["A dúvida do perito deve ser resolvida sempre a favor do autor", "Não há presunção a favor de parte; a dúvida significa prova não feita."], ["A prova pericial é dispensável quando o juiz conhece medicina", "O juiz é assistido por perito quando a prova depende de conhecimento técnico (CPC 156)."]], "pista": "Prova forma a convicção do juiz.", "pp": ["Perícia: procedimentos médicos e técnicos para esclarecer fato.", "Prova: demonstra autenticidade/veracidade.", "Objetivo: convicção do juiz.", "Dúvida = prova não feita."], "ap": "<p>Na dialética processual: tese (autor) × antítese (réu) → síntese pela evidência científica. O perito do juízo é imparcial; os assistentes técnicos representam as partes.<\/p>", "mud": [["Laudo inconclusivo por falta de exame", "Prova não feita", "Dúvida"], ["Laudo com método aceito e conclusão clara", "Prova útil", "Convicção"], ["Juiz discorda do laudo", "Pode, fundamentadamente", "Juiz não está vinculado"]], "arm": "Achar que o perito decide.", "ouro": "Perito prova; juiz decide.", "m2": ["Quem são os atores do processo citados na aula?", "Autor, réu, juiz, MP, assistentes técnicos e perito."], "n": ["Perícia esclarece fato.", "Prova forma convicção.", "Se há dúvida, não houve prova.", "Dialética tese × antítese.", "Juiz decide."]}, {"id": "P10-Q02", "t": "P10", "sub": "Ato privativo de médico", "comp": "Legislação profissional", "rac": "Aplicação", "dif": "média", "p": [14], "q": "Segundo a Lei 12.842/2013 citada em aula, a perícia médica é ato privativo de médico. Qual é a exceção mencionada?", "o": [["Exames de análises clínicas, toxicológicas, genéticas e de biologia molecular", "Esses exames não são privativos de médico."], ["Perícias previdenciárias do INSS, que podem ser feitas por qualquer profissional de saúde", "São atos médicos."], ["Perícias psiquiátricas, que podem ser feitas exclusivamente por psicólogos", "A perícia médica psiquiátrica é ato médico."], ["Exames de imagem, que podem ser laudados por técnicos em radiologia", "Laudo de imagem é ato médico."]], "pista": "Laboratório é a exceção.", "pp": ["Lei 12.842/2013: perícia é ato privativo (art. 4º XII e XIII; art. 5º II).", "Exceção: análises clínicas, toxicológicas, genéticas, biologia molecular.", "Res. CFM 1.718/2004: vedado ensinar atos privativos a não médicos."], "ap": "<p>A privatividade decorre de a perícia ser, antes de tudo, um exame médico: anamnese, exame físico-forense, análise de exames, raciocínio diagnóstico — acrescidos do enquadramento legal.<\/p>", "mud": [["Exame toxicológico", "Não privativo", "Exceção"], ["Avaliação de nexo causal", "Ato médico", "Raciocínio clínico-pericial"], ["Ensinar perícia a não médico", "Vedado (Res. CFM 1.718/2004)", "Atos privativos"]], "arm": "Achar que qualquer profissional de saúde pode fazer perícia médica.", "ouro": "Perícia médica é do médico; laboratório é exceção.", "m2": ["Qual resolução do CFM veda ensinar atos médicos privativos a não médicos?", "Resolução CFM 1.718/2004."], "n": ["Lei 12.842/2013.", "Perícia é privativa.", "Exceção laboratorial.", "Res. CFM 1.718/2004.", "Perícia é exame médico."]}, {"id": "P10-Q03", "t": "P10", "sub": "Roteiro do laudo (Res. CFM 2.056/2013)", "comp": "Estrutura do laudo", "rac": "Classificação", "dif": "média", "p": [15], "q": "No roteiro do laudo da Res. CFM 2.056/2013 (art. 58), em qual bloco ficam os comentários médico-legais, a conclusão e a resposta aos quesitos?", "o": [["Bloco 4 — Fundamentação", "Inclui diagnóstico positivo (CID), comentários médico-legais, conclusão e quesitos."], ["Bloco 1 — Identificação", "Identificação traz preâmbulo, individualização, circunstâncias e identificação do examinando."], ["Bloco 2 — Anamnese", "Anamnese traz HDA e histórias."], ["Bloco 3 — Exame", "Exame traz físico, estado mental e complementares."]], "pista": "Conclusão fica na fundamentação.", "pp": ["1 Identificação: preâmbulo, individualização, circunstâncias do exame, identificação do examinando.", "2 Anamnese: HDA, pessoal, psiquiátrica, médica, familiar.", "3 Exame: físico, estado mental, complementares.", "4 Fundamentação: diagnóstico (CID), comentários médico-legais, conclusão, quesitos."], "ap": "<p>A conclusão deve ser uma frase curta e direta que sintetiza o pensamento do perito; a resposta aos quesitos, clara, concisa e objetiva. Os comentários médico-legais relacionam a conclusão médica às normas legais.<\/p>", "mud": [["Pergunta sobre quem foi entrevistado e por quanto tempo", "Circunstâncias do exame (bloco 1)", "Identificação"], ["Pergunta sobre exame do estado mental", "Bloco 3", "Exame"], ["Pergunta sobre história familiar", "Bloco 2", "Anamnese"]], "arm": "Colocar a conclusão no bloco de exame.", "ouro": "Identificação → Anamnese → Exame → Fundamentação.", "m2": ["Como deve ser a conclusão do laudo?", "Frase curta e direta que sintetiza o pensamento do perito."], "n": ["4 blocos.", "Identificação.", "Anamnese.", "Exame.", "Fundamentação (conclusão e quesitos)."]}, {"id": "P10-Q04", "t": "P10", "sub": "CPC art. 473, §2º", "comp": "Limites do perito", "rac": "Aplicação", "dif": "média", "p": [15, 17], "q": "Em perícia de concurso público, um quesito pergunta se o ambiente de exame do órgão réu obedeceu ao edital; o perito não presenciou aquele exame. Qual a resposta adequada?", "o": [["Dizer que foge ao meio probatório e à designação (CPC 473, §2º)", "O perito não pode afirmar o que não examinou."], ["Afirmar que o ambiente foi inadequado, já que o candidato foi reprovado no exame oftalmológico", "Seria opinião sem base técnica."], ["Afirmar que o ambiente foi adequado, presumindo a boa-fé do órgão", "Também seria afirmação sem exame."], ["Deixar o quesito sem resposta, sem justificativa", "O CPC exige resposta conclusiva a todos os quesitos — a resposta pode ser a demonstração do limite."]], "pista": "Não estava lá.", "pp": ["CPC 473, IV: responder a todos os quesitos.", "§2º: vedado ultrapassar a designação ou opinar pessoalmente.", "Resposta: explicar que foge ao meio probatório."], "ap": "<p>No Caso I da Aula 11, outros quesitos ensinam o mesmo: “o índice do edital é cientificamente adequado?” — critério legispericial, não cabe ao perito julgar a norma; “a AV vai progredir?” — não há evidência; a perícia retrata o momento.<\/p>", "mud": [["Quesito sobre a AV atual do autor", "Responder com o exame", "Dentro da designação"], ["Quesito sobre adequação do edital", "Critério legispericial", "Não julgar a norma"], ["Quesito sobre prognóstico sem evidência", "Declarar a limitação", "Momento do exame"]], "arm": "Responder com suposições para “ajudar” uma parte.", "ouro": "Perito responde a todos os quesitos — inclusive dizendo “isso foge da perícia”.", "m2": ["O que diz o §1º do art. 473?", "Linguagem simples e coerência lógica, indicando como alcançou as conclusões."], "n": ["473, I a IV: conteúdo.", "§1º: linguagem simples.", "§2º: limites, sem opinião pessoal.", "§3º: todos os meios de prova.", "Responder a todos os quesitos."]}, {"id": "P10-Q05", "t": "P10", "sub": "CPC art. 473 — método", "comp": "Conteúdo do laudo", "rac": "Compreensão", "dif": "média", "p": [15], "q": "Segundo o CPC, art. 473, III, o laudo deve indicar o método utilizado. Qual a exigência específica?", "o": [["Demonstrar que o método é predominantemente aceito pelos especialistas", "O método deve ter aceitação técnica."], ["Usar sempre o método preferido do perito, ainda que isolado na literatura", "Exige-se aceitação pelos especialistas."], ["Adotar o método indicado pelo assistente técnico do autor", "O perito do juízo é imparcial."], ["Dispensar a descrição do método quando a conclusão for clara", "O método deve ser exposto."]], "pista": "Método aceito pela comunidade.", "pp": ["I: exposição do objeto.", "II: análise técnica/científica.", "III: método predominantemente aceito.", "IV: resposta conclusiva a todos os quesitos."], "ap": "<p>Requisitos de boa prova (França) dialogam com o art. 473: técnicas médico-legais reconhecidas, meios subsidiários adequados e protocolo com roteiros atualizados. O §3º permite ouvir testemunhas, obter informações, requisitar documentos e instruir com planilhas, mapas, desenhos e fotografias.<\/p>", "mud": [["Laudo sem descrição de método", "Vulnerável a impugnação", "Falta requisito"], ["Método isolado e não aceito", "Contestável", "Falta aceitação"], ["Uso de fotografias", "Permitido (§3º)", "Meios de prova"]], "arm": "Achar que basta a conclusão.", "ouro": "Mostre o caminho: método aceito, análise e conclusão.", "m2": ["O perito pode ouvir testemunhas?", "Sim (CPC 473, §3º)."], "n": ["Objeto.", "Análise técnica.", "Método aceito.", "Quesitos respondidos.", "Meios de prova amplos."]}, {"id": "P10-Q06", "t": "P10", "sub": "Perícia × consulta", "comp": "Metodologia", "rac": "Comparação", "dif": "fácil", "p": [14, 15], "q": "Qual etapa está presente na perícia médica, mas não na consulta médica, segundo a tabela da Aula 09?", "o": [["Estudo do local de trabalho", "Também: documentação médico-legal, protocolos periciais, argumento técnico, conclusão e quesitos."], ["Anamnese com queixa e história da doença atual", "Ambas têm anamnese (clínico-pericial × clínica)."], ["Exame físico do examinado", "Ambas têm exame (físico-forense × físico/mental)."], ["Análise de exames complementares", "Ambas analisam exames."]], "pista": "Ambiente e documentos.", "pp": ["Comuns: anamnese, exame físico, exames.", "Exclusivos da perícia: local de trabalho, documentação médico-legal, protocolos/doutrina, argumento técnico, conclusão, quesitos.", "Consulta termina em diagnóstico, tratamento, retorno."], "ap": "<p>O argumento técnico é o “diálogo com o magistrado”: nexo causal/concausal, existência de dano corporal e potencial laborativo residual.<\/p>", "mud": [["Perícia trabalhista", "Vistoria do posto/laudos ambientais", "Reconstrução do ambiente"], ["Perícia indireta", "Só documentos", "Sem exame"], ["Consulta", "Tratamento e retorno", "Objetivo assistencial"]], "arm": "Tratar a perícia como consulta com laudo.", "ouro": "Perícia = consulta + ambiente + documentos + norma + quesitos.", "m2": ["Quais elementos compõem o argumento técnico?", "Nexo causal/concausal, existência de dano corporal e potencial laborativo residual."], "n": ["Anamnese clínico-pericial.", "Exame físico-forense.", "Local de trabalho.", "Documentação médico-legal.", "Argumento técnico e quesitos."]}, {"id": "P10-Q07", "t": "P10", "sub": "Phineas Gage e a anamnese pericial", "comp": "Metodologia", "rac": "Aplicação de caso histórico", "dif": "média", "p": [16], "q": "Phineas Gage sobreviveu à barra de ferro que atravessou seu lobo frontal e manteve exame físico razoável, mas mudou de personalidade. Qual lição pericial a aula extrai do caso?", "o": [["História antes × depois, estado mental e informantes revelam o dano", "O lobo frontal modula planejamento, atenção e personalidade."], ["O exame físico normal comprova ausência de dano e encerra a perícia com segurança", "O dano neuropsiquiátrico pode não aparecer no exame físico."], ["Lesões frontais não geram repercussão laboral relevante", "Hoje seria acidente típico com sequela incapacitante para chefia."], ["A perícia deve basear-se apenas em exames de imagem cerebral", "A imagem não substitui a história e o exame mental."]], "pista": "Antes × depois.", "pp": ["Lesão frontal.", "Exame físico pode estar “bom”.", "Mudança de personalidade, atenção, planejamento.", "Ferramentas: história pessoal, estado mental, informantes.", "Enquadramento atual: acidente típico com sequela neuropsiquiátrica."], "ap": "<p>Dados do caso: capataz de 25 anos, ferrovia em Vermont (1848), barra de 1 m, 3,5 cm e 5,8 kg, entrando abaixo do olho esquerdo e saindo no topo da cabeça.<\/p>", "mud": [["Função manual simples", "Repercussão diferente", "Exigência da função"], ["Função de chefia", "Incapacidade para a função", "Planejamento e julgamento"], ["Sem informantes", "Laudo mais limitado", "Fonte de dados"]], "arm": "Encerrar a perícia com exame físico normal.", "ouro": "Dano frontal se vê na biografia, não no reflexo.", "m2": ["Que item do laudo (Res. CFM 2.056) é essencial em perícias psiquiátricas?", "História psiquiátrica prévia e exame do estado mental."], "n": ["Lobo frontal.", "Personalidade e planejamento.", "História antes × depois.", "Estado mental e informantes.", "Acidente típico hoje."]}, {"id": "P10-Q08", "t": "P10", "sub": "Inconformismo não é prova (ambliopia)", "comp": "Raciocínio pericial", "rac": "Análise de nexo", "dif": "difícil", "p": [16], "q": "Autora descobre na vida adulta que tem ambliopia e processa o médico que operou seu estrabismo na infância, alegando que “algo poderia ter sido feito”. Quais elementos a perícia precisa estabelecer?", "o": [["Diagnóstico atual, janela terapêutica, responsável à época e nexo, sem opinião pessoal", "Inconformismo não é prova; a dúvida não resolvida é prova não feita."], ["Apenas o grau de insatisfação da autora, que comprova o dano", "Sentimento não substitui nexo técnico."], ["Somente a AV atual, que basta para fixar a culpa do cirurgião", "Falta janela terapêutica e nexo."], ["A opinião pessoal do perito sobre a conduta, que dispensa a literatura quando o perito é experiente", "§2º veda opinião pessoal."]], "pista": "Janela terapêutica e nexo.", "pp": ["Diagnóstico atual (AV, estrabismo).", "Janela terapêutica da ambliopia: infância.", "Quem era responsável à época pelo tratamento.", "Nexo entre a conduta questionada e o dano.", "Sem opinião pessoal (CPC 473 §2º)."], "ap": "<p>Segundo o caso da aula, um especialista teria dito que a cirurgia de estrabismo não determinou o quadro. O perito precisa reconstruir a cronologia e o padrão de cuidado da época — o “estado da arte” —, não o resultado.<\/p>", "mud": [["Conduta da época fora do padrão e dentro da janela", "Nexo plausível", "Falha comprovada"], ["Ambliopia por causa não relacionada à cirurgia", "Sem nexo", "Causa diversa"], ["Dados insuficientes", "Declarar limitação", "Prova não feita"]], "arm": "Considerar o inconformismo como evidência.", "ouro": "Inconformismo não é prova; nexo é.", "m2": ["Por que a idade importa na ambliopia?", "Porque a janela terapêutica é a infância."], "n": ["Diagnóstico atual.", "Janela terapêutica.", "Responsável à época.", "Nexo conduta–dano.", "Sem opinião pessoal."]}, {"id": "P11-Q01", "t": "P11", "sub": "Telessaúde × telemedicina", "comp": "Conceito", "rac": "Comparação", "dif": "fácil", "p": [16], "q": "Qual afirmação sobre telessaúde e telemedicina está de acordo com a Aula 10?", "o": [["Telessaúde é mais ampla (assistência, educação, gestão); telemedicina é o ato médico a distância", "Toda telemedicina está dentro da telessaúde, não o contrário."], ["Telemedicina é mais ampla e inclui a educação de todos os profissionais de saúde e a gestão", "A mais ampla é a telessaúde."], ["São sinônimos regulados pela mesma resolução, sem diferença de escopo", "Há diferença de escopo."], ["Telessaúde se restringe à teleconsulta médica com prescrição", "Inclui educação e gestão."]], "pista": "Saúde > medicina.", "pp": ["TDICs: dispositivos, comunicação, software educacional, internet.", "Telemedicina: prática médica a distância (CFM 2.314/2022).", "Telessaúde: assistência, educação e gestão.", "Relação: telessaúde contém telemedicina."], "ap": "<p>Modalidades: teleconsulta, tele-educação, telemonitoramento, telerregulação e teleconsultoria. Tendência: agentes inteligentes (IA generativa, aprendizado contínuo, autonomia) e agentes educacionais adaptativos.<\/p>", "mud": [["Curso a distância para enfermeiros", "Telessaúde (tele-educação)", "Não é ato médico"], ["Teleconsulta com prescrição", "Telemedicina", "Ato médico"], ["Gestão de filas por regulação remota", "Telessaúde (telerregulação)", "Gestão"]], "arm": "Inverter o escopo.", "ouro": "Telessaúde abraça a telemedicina.", "m2": ["Qual resolução do CFM define a telemedicina citada em aula?", "Resolução CFM 2.314/2022."], "n": ["TDICs.", "Telemedicina: ato médico remoto.", "Telessaúde: assistência, educação, gestão.", "Res. CFM 2.314/2022.", "Cinco modalidades."]}, {"id": "P11-Q02", "t": "P11", "sub": "Modalidades e evidências", "comp": "Evidências", "rac": "Associação", "dif": "média", "p": [16], "q": "Qual associação entre modalidade de telessaúde e evidência destacada na Aula 10 está correta?", "o": [["Telerregulação — e-consultas evitam atendimento presencial em 34–92% dos casos", "Triagem por imagem reduz até 89% em dermatologia, oftalmologia e ORL."], ["Tele-educação — inferior ao cuidado usual em todos os estudos da revisão de Rush (2018)", "Foi superior em 11 de 16 estudos e equivalente nos outros 5."], ["Telemonitoramento — aumentou chamadas de resposta rápida e UTIs não planejadas", "Reduziu ambos no estudo de 3.896 pacientes."], ["Teleconsulta — ineficaz em insuficiência cardíaca e DII", "A aula cita eficácia em IC, DII e AR em remissão."]], "pista": "Regulação evita deslocamento.", "pp": ["Teleconsulta: acesso, custo; IC, DII, AR.", "Tele-educação: Rush 2018 — superior em 11/16.", "Telemonitoramento: menos resposta rápida e UTI não planejada.", "Telerregulação: 34–92% de presenciais evitados.", "Teleconsultoria: apoio entre profissionais."], "ap": "<p>No diabetes, a tele-educação melhora HbA1c e adesão. No estudo de telemonitoramento, as chamadas de resposta rápida caíram de 107 para 71 (p = 0,022) e as admissões não planejadas em UTI de 84 para 54 (p = 0,029).<\/p>", "mud": [["Pergunta sobre tele-educação", "Rush 2018: 11 de 16 superiores", "Revisão sistemática"], ["Pergunta sobre wearables", "Telemonitoramento", "Arritmias"], ["Pergunta sobre filas", "Telerregulação", "Estudo brasileiro reduziu filas"]], "arm": "Inverter os resultados do telemonitoramento.", "ouro": "Regulação remota evita viagens; monitoramento remoto evita UTI.", "m2": ["Em quais especialidades a triagem por imagem reduziu até 89% dos encaminhamentos?", "Dermatologia, oftalmologia e otorrinolaringologia."], "n": ["Teleconsulta: IC, DII, AR.", "Tele-educação: Rush 2018.", "Telemonitoramento: menos UTI.", "Telerregulação: 34–92%.", "Teleconsultoria: apoio."]}, {"id": "P11-Q03", "t": "P11", "sub": "Triplo objetivo do IHI", "comp": "Qualidade em saúde", "rac": "Memória com compreensão", "dif": "fácil", "p": [16], "q": "Quais são os três componentes do triplo objetivo (Triple Aim) do IHI citado na Aula 10?", "o": [["Melhor experiência do paciente, melhor saúde da população, menor custo per capita", "São os três pilares citados."], ["Aumentar o número de consultas, reduzir salários e ampliar a rede hospitalar", "Não correspondem ao modelo."], ["Substituir o exame físico, eliminar o presencial e digitalizar prontuários", "A aula defende modelo híbrido."], ["Ampliar o lucro, reduzir o tempo de consulta e aumentar exames", "Não correspondem ao modelo."]], "pista": "Paciente, população, custo.", "pp": ["Experiência do paciente.", "Saúde da população.", "Custo per capita."], "ap": "<p>Benefícios-síntese da telessaúde: acesso, redução de custos, eficiência (filas), continuidade do cuidado e capacitação contínua.<\/p>", "mud": [["Pergunta sobre benefícios", "Acesso, custo, eficiência, continuidade, capacitação", "Síntese"], ["Pergunta sobre contraponto", "Exame físico, sigilo, prontuário, responsabilidade, exclusão", "Limites"], ["Pergunta sobre conclusão", "Modelo híbrido", "Síntese do professor"]], "arm": "Confundir com metas de produtividade.", "ouro": "IHI: melhor experiência, melhor saúde, menor custo.", "m2": ["Qual a conclusão do professor sobre telessaúde?", "Modelo híbrido: tecnologia + zelo da prática clínica."], "n": ["Experiência do paciente.", "Saúde da população.", "Custo per capita.", "Benefícios da telessaúde.", "Modelo híbrido."]}, {"id": "P11-Q04", "t": "P11", "sub": "Contraponto e responsabilidade", "comp": "Ética e responsabilidade", "rac": "Aplicação", "dif": "média", "p": [16], "q": "Médico realiza teleconsulta, não registra em prontuário e deixa de indicar avaliação presencial em quadro que exigia exame físico. Qual afirmação é coerente com o “contraponto” da Aula 10?", "o": [["A responsabilidade é a mesma do presencial, e o prontuário é obrigatório", "O meio digital não reduz deveres."], ["Na telemedicina, a responsabilidade é transferida para a plataforma digital que hospeda o atendimento", "Não há transferência de responsabilidade ao meio."], ["A teleconsulta dispensa registro em prontuário por ter gravação", "O registro em prontuário é exigência."], ["O exame físico nunca é necessário quando há vídeo de boa qualidade", "O exame físico continua insubstituível em muitos cenários."]], "pista": "Mudou o canal, não o dever.", "pp": ["Exame físico insubstituível em muitos cenários.", "Sigilo e segurança de dados.", "Registro em prontuário.", "Mesma responsabilidade do presencial.", "Exclusão digital pode ampliar desigualdade."], "ap": "<p>O tema conecta-se à Aula 02 (comunicação digital vira registro e prova) e à Aula 01 (dever de vigilância: indicar avaliação presencial quando necessária).<\/p>", "mud": [["Indicou presencial e registrou", "Conduta adequada", "Deveres cumpridos"], ["Vazamento de dados da teleconsulta", "Violação de sigilo", "Segurança de dados"], ["Paciente sem acesso à internet", "Exclusão digital", "Desigualdade"]], "arm": "Achar que a tela reduz a responsabilidade.", "ouro": "Telemedicina: mesmo dever, mesmo prontuário, mesma responsabilidade.", "m2": ["Cite dois pontos do contraponto à telessaúde.", "Exame físico insubstituível e risco de exclusão digital (também sigilo e prontuário)."], "n": ["Exame físico insubstituível.", "Sigilo e dados.", "Prontuário obrigatório.", "Mesma responsabilidade.", "Exclusão digital."]}, {"id": "P12-Q01", "t": "P12", "sub": "CPC art. 465 — prazos e atos das partes", "comp": "Processo", "rac": "Aplicação", "dif": "média", "p": [17], "q": "O juiz nomeia perito em ação de responsabilidade civil médica. Segundo o CPC, art. 465, o que as partes podem fazer e em que prazo?", "o": [["Em 15 dias: arguir impedimento/suspeição, indicar assistente técnico e apresentar quesitos", "São os três atos previstos no art. 465."], ["Em 5 dias: apenas apresentar quesitos, pois o assistente técnico é escolhido pelo juiz", "O assistente é indicado pela parte."], ["Em 30 dias: substituir o perito por outro de sua preferência", "A parte pode arguir impedimento/suspeição, não escolher o perito."], ["A qualquer momento: apresentar novos quesitos sem limite, mesmo após o laudo", "O prazo para quesitos iniciais é de 15 dias."]], "pista": "15 dias, três atos.", "pp": ["Art. 156: juiz assistido por perito.", "Art. 465: nomeia perito especializado e fixa prazo.", "Partes, em 15 dias: impedimento/suspeição; assistente técnico; quesitos.", "Art. 473: conteúdo do laudo."], "ap": "<p>Onde há perícia: DETRAN, INSS, Justiça Federal, Estadual (cível e criminal), do Trabalho, planos de saúde/tratamentos. O perito é escolhido em cadastro do tribunal.<\/p>", "mud": [["Perito com vínculo com o réu", "Arguir impedimento/suspeição", "Imparcialidade"], ["Parte quer acompanhar a perícia", "Indicar assistente técnico", "Direito da parte"], ["Parte quer dirigir perguntas", "Apresentar quesitos", "Direito da parte"]], "arm": "Achar que a parte escolhe o perito.", "ouro": "CPC 465: 15 dias para suspeição, assistente e quesitos.", "m2": ["Qual artigo do CPC prevê que o juiz será assistido por perito?", "Art. 156."], "n": ["CPC 156.", "CPC 465: 15 dias.", "Impedimento/suspeição.", "Assistente técnico.", "Quesitos."]}, {"id": "P12-Q02", "t": "P12", "sub": "Elementos da responsabilidade civil", "comp": "Responsabilidade civil", "rac": "Discriminação de papéis", "dif": "média", "p": [17], "q": "Na perícia cível de suposto erro médico, qual divisão de papéis está correta segundo a Aula 11?", "o": [["O perito descreve conduta, dano e nexo; quem qualifica a culpa é o juiz", "O perito não declara “culpa” como categoria jurídica."], ["O perito declara a culpa do médico e fixa o valor da indenização por dano material e moral", "Valor e culpa são decisões judiciais."], ["O assistente técnico do autor decide o nexo, e o perito apenas o homologa", "O perito do juízo é imparcial e independente."], ["A obrigação do médico é de resultado, por isso basta provar o resultado ruim", "A regra é obrigação de meio."]], "pista": "Técnica × qualificação jurídica.", "pp": ["Conduta: dentro do padrão?", "Culpa: negligência, imprudência, imperícia — o perito descreve, o juiz qualifica.", "Dano: existe? definitivo (MMI)?", "Nexo: conduta × doença de base × conduta da vítima.", "Obrigação de meio é a regra."], "ap": "<p>Hospitais e clínicas respondem como prestadores de serviço (CDC; CC 927, parágrafo único). O médico responde subjetivamente.<\/p>", "mud": [["Dano decorre da doença de base", "Sem nexo com a conduta", "Causa diversa"], ["Dano decorre de conduta da vítima", "Culpa exclusiva rompe o nexo", "Excludente"], ["Conduta fora do padrão e dano", "Nexo plausível", "Elementos presentes"]], "arm": "Escrever no laudo “o médico foi culpado”.", "ouro": "Perito: conduta, dano, nexo. Juiz: culpa.", "m2": ["Qual a regra na medicina: obrigação de meio ou de resultado?", "De meio."], "n": ["Conduta.", "Culpa (juiz qualifica).", "Dano (MMI).", "Nexo.", "Obrigação de meio."]}, {"id": "P12-Q03", "t": "P12", "sub": "Vasectomia — dever de informação", "comp": "Análise de caso", "rac": "Integração", "dif": "difícil", "p": [18], "q": "Homem de 23 anos fez vasectomia e foi orientado apenas a “aguardar 20 ejaculações”, sem pedido de espermograma; disseram-lhe que era “processo simples, sem erro”. A esposa engravidou meses depois. Qual a análise pericial coerente com a aula?", "o": [["Falha de informação e de vigilância (sem espermograma), com nexo plausível", "Literatura: falha de 0,9–2,0%; espermograma é absolutamente necessário para confirmar azoospermia."], ["Não há falha: a vasectomia é obrigação de resultado e a gravidez prova apenas má sorte do casal", "É obrigação de meio, mas com dever de informar a taxa de falha."], ["A culpa é exclusiva do paciente, que deveria saber que o método falha", "A informação não foi dada pelo médico."], ["A gravidez prova necessariamente erro técnico na cirurgia", "Pode haver recanalização ou não uso de outro método até azoospermia; o ponto é a falta de informação e controle."]], "pista": "“Sem erro” + sem espermograma.", "pp": ["Literatura: falha 0,9–2,0% (oclusão inadequada, recanalização, não usar outro método).", "1º espermograma em ~2 meses ou 15–20 ejaculações (95% azoospérmicos).", "Espermograma é absolutamente necessário.", "Falha de informação e vigilância → nexo plausível."], "ap": "<p>O caso completo da aula evolui com segunda vasectomia (esposa já grávida), nova gravidez, explicação de “mutação”, filha extraconjugal e divórcio — cada desfecho exige análise de nexo própria.<\/p>", "mud": [["Espermograma pedido, azoospermia confirmada e informação dada", "Falha rara sem culpa provável", "Deveres cumpridos"], ["Paciente orientado e não usou outro método", "Culpa concorrente/da vítima", "Conduta do paciente"], ["Nova gravidez após 2ª cirurgia sem controle", "Mesma análise", "Repetição da falha"]], "arm": "Tratar vasectomia como obrigação de resultado.", "ouro": "Vasectomia: informar a falha e confirmar com espermograma.", "m2": ["Quando se faz o primeiro espermograma após vasectomia, segundo a literatura citada?", "Em ~2 meses ou após 15–20 ejaculações."], "n": ["Falha 0,9–2,0%.", "Espermograma obrigatório.", "Dever de informação.", "Dever de vigilância.", "Obrigação de meio."]}, {"id": "P12-Q04", "t": "P12", "sub": "Culpa exclusiva da vítima", "comp": "Nexo causal", "rac": "Análise de nexo", "dif": "difícil", "p": [18], "q": "No mesmo caso da vasectomia, o autor teve uma filha em relação extraconjugal sabendo que estava fértil, e depois se divorciou. Como o perito deve analisar o nexo desses dois desfechos com o ato médico?", "o": [["A filha: culpa exclusiva da vítima (rompe o nexo); o divórcio: sem nexo", "Conhecendo a fertilidade, a decisão foi do autor; o divórcio deveu-se à relação extraconjugal."], ["Ambos os desfechos decorrem diretamente da vasectomia e devem ser indenizados", "O nexo é rompido pela conduta do autor."], ["Apenas o divórcio tem nexo, porque foi consequência direta da primeira gravidez não planejada", "O divórcio decorreu da relação extraconjugal."], ["O perito deve emitir opinião moral sobre a relação extraconjugal", "Opiniões pessoais são vedadas (CPC 473 §2º)."]], "pista": "Sabia que estava fértil.", "pp": ["Gestação pós-1ª cirurgia: nexo plausível (falha de informação/vigilância).", "Filha extraconjugal: autor sabia estar fértil → culpa exclusiva da vítima.", "Divórcio: causa = relação extraconjugal → sem nexo com o ato médico.", "Sem juízo moral no laudo."], "ap": "<p>A análise de nexo é feita desfecho por desfecho. A mesma conduta médica pode ter nexo com um resultado e não com outro; condutas do próprio autor podem romper a cadeia causal.<\/p>", "mud": [["Autor não sabia da fertilidade", "Nexo pode persistir", "Sem conhecimento"], ["Desfecho por doença de base", "Sem nexo", "Causa diversa"], ["Desfecho por conduta médica comprovada", "Nexo", "Cadeia causal"]], "arm": "Atribuir todos os desfechos ao ato médico.", "ouro": "Culpa exclusiva da vítima rompe o nexo.", "m2": ["Quantos filhos e quantos divórcios resultaram no caso da aula?", "Cinco filhos e um divórcio."], "n": ["Nexo por desfecho.", "Culpa exclusiva da vítima.", "Rompe o nexo.", "Sem juízo moral.", "Laudo técnico."]}, {"id": "P12-Q05", "t": "P12", "sub": "Triagem inadequada e perda de chance", "comp": "Análise de caso", "rac": "Integração clínica e jurídica", "dif": "difícil", "p": [18], "q": "Paciente com DM1, vômitos, dor abdominal, disúria e dor lombar tem glicemia capilar de 345 mg/dL e FC 117 na triagem; é classificada como “verde” e, por plano inativo, não é atendida; morre à noite. Qual a análise pericial apresentada em aula?", "o": [["Suspeita de CAD mal classificada e recusa em urgência; nexo por perda de chance (perícia indireta)", "DM1 + hiperglicemia + vômitos + dor abdominal + taquicardia = suspeita de CAD; foco urinário provável desencadeante."], ["Classificação correta, pois glicemia abaixo de 600 mg/dL exclui emergência hiperglicêmica no adulto", "CAD ocorre com glicemia > 250; > 600 é critério do EHH."], ["Não há nexo, porque a causa do óbito foi a doença de base", "A perda da chance de tratamento oportuno configura o nexo discutido."], ["Perícia direta, com exame físico da paciente por junta médica", "A paciente faleceu: perícia indireta."]], "pista": "DM1 + 345 + vômitos + taquicardia.", "pp": ["CAD: glicemia > 250, cetonemia/cetonúria, HCO₃ < 18, pH < 7,3, ânion gap elevado; Kussmaul, vômitos, dor abdominal.", "Classificação “verde”: tecnicamente inadequada.", "Recusa por questão administrativa viola o dever de atendimento de urgência.", "Disúria e dor lombar: foco infeccioso desencadeante.", "Nexo: perda de chance; perícia indireta (prontuário, ficha de triagem)."], "ap": "<p>Diferença CAD × EHH (doutrina do caso): EHH tem glicemia > 600, osmolaridade efetiva > 320, sem cetose significativa, com coma mais frequente. Ao perito cabe esclarecer a classificação de risco correta, a evolução natural da CAD não tratada e a janela terapêutica.<\/p>", "mud": [["Paciente atendida e tratada a tempo", "Sem perda de chance", "Janela respeitada"], ["Glicemia 650, osmolaridade 340, sem cetose", "EHH", "Outro quadro"], ["Classificação correta e atendimento adequado", "Sem falha", "Padrão cumprido"]], "arm": "Usar o corte de 600 mg/dL para afastar emergência em DM1.", "ouro": "DM1 com hiperglicemia, vômitos e taquicardia não é verde.", "m2": ["Qual o tipo de perícia em paciente falecida?", "Indireta (prontuário, ficha de triagem, registros)."], "n": ["CAD: glicemia > 250, pH < 7,3, HCO₃ < 18.", "EHH: > 600, osm > 320.", "Triagem inadequada.", "Recusa administrativa em urgência.", "Perda de chance; perícia indireta."]}], "images": {"c-004-000": ["Alça sentinela. Segmento de alça fixa, edemaciada e distendida, sem sinais de obstrução, adjacente ao órgão inflamado (íleo reflexo localizado). Aula 9, slide 9 — UFMG, Imagem da Semana, caso 114.", 4], "c-005-001": ["Abscesso hepático — US. Lesão de 7 × 6 cm envolta por ar no lobo direito (estrela). Aula 9, slide 17 — Pausch C et al., Int J Surg Case Rep 2017;41:180–183.", 5], "c-005-002": ["Abscesso hepático — TC coronal. Área hipoatenuante de 7 × 6 cm contendo gás no lobo direito (estrela). Mesmo caso (Clostridium perfringens e Klebsiella oxytoca).", 5], "c-006-003": ["Abscesso esplênico — TC. Coleção hipoatenuante no baço. Aula 9, slide 23 — Abbasi S et al., J Curr Surg 2016;6.", 6], "c-007-004": ["Ponto de McBurney. Junção do terço lateral com os dois terços mediais da linha entre a cicatriz umbilical e a espinha ilíaca anterossuperior direita. Aula 8, slide 5.", 7], "c-008-005": ["US — apendicite: corte transversal com imagem em alvo (A). Aula 8, slide 14 — Sabiston, 18ª ed.", 8], "c-008-006": ["TC na apendicite: (a) apendicolito; (b) espessamento; (c) borramento da gordura; (d) abscesso. Aula 8, slide 16.", 8], "c-008-007": ["TC axial: apêndice espessado com apendicolito em FID (seta). Aula 8, slide 16.", 8], "c-008-008": ["Apendicite fase I — catarral. Aula 8, slide 20.", 8], "c-008-009": ["Apendicite fase III — gangrenosa. Aula 8, slide 20 (joseasilis.com).", 8], "c-010-010": ["Plastrão apendicular — TC. Massa inflamatória em FID envolvendo ceco e alças ileais. Aula 8, slide 28 — Sessões Clínicas Unimed-BH, caso 74.", 10], "c-012-011": ["Formação do divertículo colônico. Herniação da mucosa no ponto de penetração da artéria (vasa recta) — explica o sangramento arterial. Aula 7, slide 24.", 12], "c-013-012": ["Estágios de Hinchey. 1: abscesso pericólico pequeno confinado; 2: abscesso grande na pelve; 3: purulenta; 4: descarga fecal. Aula 7, slide 30 — Acta Méd Grupo Ángeles 2016;14(2).", 13], "c-013-013": ["Diverticulite não complicada — TC. Espessamento do sigmoide com divertículo (cabeça de seta) e densificação da gordura (seta). Aula 7, slide 33.", 13], "c-013-014": ["Hinchey II — TC. Abscesso pélvico (seta) adjacente ao sigmoide inflamado. Aula 7, slide 34 — Acta Méd Grupo Ángeles 2016;14(2).", 13], "c-014-015": ["Hartmann: colostomia terminal + coto retal. Aula 7, slide 40.", 14], "c-014-016": ["Colectomia com anastomose primária + ileostomia de proteção. Aula 7, slide 40.", 14], "c-015-017": ["Fístula colovesical — TC. (A) gás na bexiga e espessamento da parede vesical adjacente ao sigmoide; (B) trajeto fistuloso. Aula 7, slide 52 — Sessões Clínicas Unimed-BH.", 15], "c-017-018": ["Embriologia do divertículo de Meckel. Ligamento vitelino entre o íleo e o umbigo. Aula 7, slide 5.", 17], "c-017-019": ["Verdadeiro × falso divertículo. O Meckel tem todas as camadas da parede. Aula 7, slide 3.", 17], "c-017-020": ["Cintilografia com Tc-99m. Criança de 4 anos com retorragia há 72 h e Hb 9 g/dL: captação arredondada em mesogástrio que surge com o estômago e persiste — mucosa gástrica ectópica em Meckel. Aula 7, slide 15 — EPOS/ESR, SERAM 2014.", 17], "c-019-021": ["Rx de tórax: pneumoperitônio sob as cúpulas diafragmáticas. Aula 9, slide 35.", 19], "c-019-022": ["Rx em decúbito lateral: ar livre entre o fígado e a parede. Aula 9, slide 36.", 19], "c-019-023": ["Sinal de Rigler (setas): parede intestinal delineada por gás dos dois lados. Aula 9, slide 37 — SVUH Radiology.", 19], "c-020-024": ["Ulcerorrafia com patch omental. Pontos através da perfuração, amarrados sobre o retalho de omento. Aula 9, slide 43 — Sabiston, Atlas de técnicas cirúrgicas, 2012.", 20], "c-020-025": ["Boerhaave — TC. Pneumomediastino e coleção periesofágica, derrame pleural. Aula 9, slide 40.", 20], "c-022-026": ["Obstrução colônica com ceco muito distendido — TC. Nível hidroaéreo e grande dilatação cecal. Aula 10, slide 13.", 22], "c-023-027": ["Obstrução de delgado — Rx. Alças centrais dilatadas, empilhamento de moedas, níveis hidroaéreos, sem ar no reto. Aula 10, slide 18 — Sabiston, 18ª ed.", 23], "c-023-028": ["Volvo de sigmoide — Rx. Sinal do “grão de café” (alça em U invertido). Aula 10, slide 19 — Sabiston, 18ª ed.", 23], "c-023-029": ["Brida — TC coronal. Alças de delgado dilatadas a montante e alças ileais colabadas após o ponto de transição. Aula 10, slide 21.", 23], "c-024-030": ["Brida: alça estrangulada com sofrimento vascular. Aula 10, slide 25 (arquivo pessoal).", 24], "c-024-031": ["Intussuscepção intestinal (achado intraoperatório). Aula 10, slide 28.", 24], "c-026-032": ["Janelas do FAST: 1 quadrante superior direito (Morison), 2 quadrante superior esquerdo (esplenorrenal), 3 pelve, 4 subcostal (pericárdio). Aula 10, slide 50 — Philips, guia rápido FAST.", 26], "c-026-033": ["Laparoscopia: hemoperitônio por gestação tubária direita. Aula 10, slide 53 — eduardodale.com.br.", 26], "c-029-034": ["Causas de isquemia mese function balancedLetters(n){var base=Math.floor(n/4),rem=n%4,arr=[];for(var k=0;k<4;k++)for(var i=0;i<base;i++)arr.push(k);var ex=shuffle([0,1,2,3]).slice(0,rem);arr=arr.concat(ex);

 if(n>=total){var all=[];topicIds.forEach(function(t){all=all.concat(pools[t])});return all}
 var alloc={},sum=0,fr=[];topicIds.forEach(function(t){var x=pools[t].length*n/total;alloc[t]=Math.floor(x);sum+=alloc[t];fr.push([x-alloc[t],t])});
 fr.sort(function(a,b){return b[0]-a[0]||Math.random()-.5});for(var i=0;sum<n&&i<fr.length;i++){var t=fr[i][1];if(alloc[t]<pools[t].length){alloc[t]++;sum++}}

 h+='<div class="card"><h2>Como as mini-aulas foram construídas</h2><p class="small">Cada correção segue os blocos A–O: identificação e página real; resposta e pista decisiva; revisão teórica; tabelas; passo a passo; análise de todas as alternativas; comparação; fluxograma; imagens das aulas; o que mudaria a resposta; armadilhas; regra de ouro; segundo cenário (fora do placar); pontos para guardar; fontes. A revisão teórica tem um núcleo comum por tema (para garantir consistência entre as questões do mesmo assunto) seguido de um aprofundamento próprio de cada questão; os blocos B, E, F, J, K, L, M e N são individuais.</p><p class="small">Alternativas: quatro por questão, uma correta; a letra da correta é distribuída de forma equilibrada em cada sessão (diferença máxima de uma letra entre A–D, evitando mais de três iguais seguidas), e cada análise fica ligada ao conteúdo da alternativa, não à letra.</p></div>';
 var lg=0,sh=0;D.questions.forEach(function(q){var L=q.o.map(function(o){return o[0].length});var mx=Math.max.apply(null,L),mn=Math.min.apply(null,L);if(L[0]===mx)lg++;if(L[0]===mn)sh++});h+='<div class="card"><h2>Auditoria das alternativas</h2><p class="small">A alternativa correta é a mais longa em '+lg+' de '+D.questions.length+' questões ('+pct(lg,D.questions.length)+'%) e a mais curta em '+sh+' ('+pct(sh,D.questions.length)+'%) — próximo do esperado ao acaso (25%), sem pista sistemática de tamanho. Em cada sessão o gabarito é sorteado de forma equilibrada entre A, B, C e D.</p></div>';
 h+='<div class="card"><h2>Fontes, divergências e atualização</h2><ul class="small"><li>Fonte principal: os dois resumos enviados, baseados nos slides dos professores. Itens marcados no material como “complemento” (por exemplo, Hinchey modificado, critérios de Jalan, regra dos 2 do Meckel, hipotensão permissiva no AAA, estabilidade de 12 meses do art. 118) foram identificados como complementares nas mini-aulas.</li><li>Diverticulite: o material compara AGA 2021 e WSES 2020 (ATB seletivo × não rotineiro). As questões só cobram pontos em que ambas convergem ou pedem explicitamente uma delas.</li><li>Apendicite: tratamento conforme WSES Jerusalem 2025 citada na aula. Alvarado: a aula escreve “> 7” para alta probabilidade e o resumo usa “≥ 7”; nenhuma questão depende do valor exato 7.</li><li>Perícia: textos legais conforme reproduzidos em aula; o próprio resumo recomenda conferir a redação vigente. A deficiência auditiva segue a Lei 14.768/2023 (quatro frequências), embora o slide ilustre a média tritonal.</li><li>Nenhuma pesquisa externa foi incorporada como conteúdo novo; as referências listadas são as citadas no próprio material.</li></ul></div>';
