 abundância. 2) Risco metabólico e cardiovascular. 3) Mulher com doença placentária: risco cardiovascular. 4) Próxima gestação: AAS e vigilância.","pista":"Pergunta sobre riscos futuros para os dois.","mud":"Se a causa fosse cromossômica, o aconselhamento genético seria o foco.","cmp":"Precoces: metabólicas e hematológicas. Médio prazo: neurodesenvolvimento. Tardias: metabólicas e cardiovasculares.","arm":"Esquecer que a mãe também tem risco futuro.","regra":"CIUR é marcador de risco para a vida toda.","cf":"O anatomopatológico da placenta ajuda a estimar a recorrência.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulos 7.3 (complicações tardias) e 7.16 (pós-natal e seguimento), slide 5 do material da disciplina."}]},{"id":"M03","titulo":"Propedêutica fetal: Doppler, PBF e CTG","bloco":1,"grupo":"C","q":[{"n":1,"sub":"Categoria III da CTG","eixo":"Cardiotocografia","comp":"Classificar o traçado pelo sistema NICHD/ACOG de três categorias","enun":"Parturiente de 39 semanas, 6 cm de dilatação, sob ocitocina. Cardiotocografia em 20 minutos: linha de base de 150 bpm, variabilidade ausente, desacelerações de início gradual com nadir após o pico em 4 de 5 contrações. Pelo sistema NICHD/ACOG, como classificar o traçado e qual é a conduta?","ops":[["Categoria III; ressuscitação intrauterina e, sem melhora rápida, parto.","Correta: variabilidade ausente com desacelerações tardias recorrentes define categoria III."],["Categoria II; manter a ocitocina e reavaliar o traçado em uma hora.","Errada: com variabilidade ausente e tardias recorrentes, o traçado é categoria III, e manter a ocitocina agrava a hipóxia."],["Categoria I; desacelerações que acompanham as contrações são esperadas na fase ativa.","Errada: desacelerações tardias recorrentes nunca cabem na categoria I."],["Categoria III; aguardar o período expulsivo e indicar fórceps para abreviar o parto.","Errada: a classificação está certa, mas a conduta não; com 6 cm, aguardar a dilatação total é inadequado."]],"conc":"Categoria III exige variabilidade ausente associada a desacelerações tardias recorrentes, variáveis recorrentes ou bradicardia, ou padrão sinusoidal. Associa-se a estado ácido-base anormal.","rac":"1) Variabilidade ausente. 2) Início gradual com nadir após o pico: tardias. 3) Em mais de 50% das contrações: recorrentes. 4) Categoria III. 5) Suspender ocitocina, lateralizar, corrigir hipotensão e preparar parto.","pista":"Variabilidade ausente somada a tardias recorrentes.","mud":"Com variabilidade moderada, as mesmas desacelerações tardias recorrentes seriam categoria II.","cmp":"Categoria II: tudo que não é I nem III. Categoria III: variabilidade ausente com desacelerações recorrentes ou bradicardia, ou sinusoidal.","arm":"Classificar pela gravidade aparente das desacelerações, ignorando a variabilidade.","regra":"Sem variabilidade ausente, não é categoria III (exceto sinusoidal).","cf":"Pela FIGO, o mesmo traçado seria chamado de patológico.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (cardiotocografia: desacelerações e classificação em três categorias); ACOG Practice Bulletin 106 (NICHD 2008)."},{"n":2,"sub":"Categoria II com tardias e variabilidade moderada","eixo":"Cardiotocografia","comp":"Aplicar a regra da variabilidade na separação entre categoria II e III","enun":"Parturiente de 40 semanas, 8 cm, sem ocitocina. CTG: linha de base de 140 bpm, variabilidade de 10 bpm, sem acelerações, desacelerações tardias em 3 de 5 contrações nos últimos 20 minutos. Pelo NICHD, qual é a classificação?","ops":[["Categoria II, porque a variabilidade moderada impede a classificação como III.","Correta: desacelerações tardias recorrentes com variabilidade moderada são categoria II."],["Categoria III, porque as desacelerações tardias são recorrentes.","Errada: a categoria III exige variabilidade ausente, salvo o padrão sinusoidal."],["Categoria I, porque a linha de base e a variabilidade estão normais.","Errada: desacelerações tardias recorrentes excluem a categoria I."],["Traçado não classificável, pela ausência de acelerações.","Errada: a ausência de acelerações não impede a classificação e, sozinha, não define categoria."]],"conc":"A variabilidade moderada (6 a 25 bpm) é o melhor indicador isolado de SNC oxigenado e não acidótico. Por isso, mesmo com tardias recorrentes, o traçado é categoria II, que exige avaliação continuada e ressuscitação intrauterina.","rac":"1) Linha de base normal. 2) Variabilidade de 10: moderada. 3) Tardias em mais de 50% das contrações: recorrentes. 4) Não é I (há tardias). 5) Não é III (variabilidade presente). 6) Categoria II.","pista":"Variabilidade de 10 bpm.","mud":"Se a variabilidade ficasse ausente mantendo as tardias, o traçado passaria a categoria III.","cmp":"Categoria II: não prediz nem exclui acidemia. Categoria III: associada a acidemia.","arm":"Achar que tardias recorrentes, por si sós, já são categoria III.","regra":"Olhe a variabilidade antes de rotular o traçado.","cf":"Na categoria II preocupante, inicia-se ressuscitação intrauterina e reavaliação seriada, sem cesárea automática.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (parâmetro isolado mais importante e 'a chave para nunca errar categoria III') e tabela de erros frequentes."},{"n":3,"sub":"Desaceleração precoce","eixo":"Cardiotocografia","comp":"Reconhecer a desaceleração precoce e seu mecanismo","enun":"Parturiente de 39 semanas, 9 cm, apresentação cefálica baixa. CTG com linha de base de 135 bpm, variabilidade moderada e desacelerações de início gradual, cujo nadir coincide com o pico de cada contração, retornando à linha de base com o fim dela. Qual é o mecanismo e a conduta?","ops":[["Compressão do polo cefálico com reflexo vagal; nenhuma conduta específica.","Correta: são desacelerações precoces (DIP I), benignas, típicas da descida do polo cefálico."],["Compressão do cordão umbilical; amnioinfusão imediata.","Errada: a compressão do cordão gera desacelerações variáveis, de início abrupto."],["Insuficiência uteroplacentária; cesárea pela via mais rápida.","Errada: a insuficiência uteroplacentária gera desacelerações tardias, com nadir após o pico."],["Hipotensão materna pós-analgesia; vasopressor e expansão volêmica.","Errada: a hipotensão tende a causar desaceleração prolongada, não desacelerações que espelham cada contração."]],"conc":"A desaceleração precoce (DIP I, cefálico) tem início gradual, espelha a contração com nadir coincidente com o pico e decorre de compressão cefálica com reflexo vagal. É benigna e compatível com categoria I.","rac":"1) Início gradual. 2) Nadir coincide com o pico. 3) Desaceleração precoce. 4) Mecanismo vagal por compressão do polo cefálico. 5) Nenhuma intervenção.","pista":"Nadir coincidente com o pico da contração.","mud":"Se o nadir ocorresse depois do pico, seria tardia (insuficiência uteroplacentária); se o início fosse abrupto, variável (cordão).","cmp":"Precoce: nadir no pico. Tardia: nadir após o pico. Variável: início abrupto, menos de 30 s.","arm":"Intervir diante de desacelerações precoces.","regra":"DIP I é cabeça; DIP II é placenta; DIP III é cordão.","cf":"Desacelerações variáveis recorrentes por oligoâmnio podem melhorar com amnioinfusão.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (tabela de desacelerações, nomenclatura NICHD e DIP) e tabela 'Vocabulário: antigo x atual'."},{"n":4,"sub":"CTG anteparto não reativa","eixo":"Cardiotocografia","comp":"Reduzir o falso-positivo da CTG não reativa","enun":"Gestante de 34 semanas com hipertensão crônica controlada faz CTG anteparto de rotina. Após 20 minutos, linha de base de 140 bpm, variabilidade de 4 bpm e nenhuma aceleração; não houve desacelerações. Qual é o melhor próximo passo?","ops":[["Prolongar até 40 minutos, estimular e, se persistir, fazer PBF ou Doppler.","Correta: a causa mais comum de CTG não reativa é o sono fetal; prolongar e estimular resolve a maioria dos casos."],["Indicar cesárea imediata, porque a CTG não reativa indica sofrimento fetal agudo.","Errada: a CTG não reativa tem alto falso-positivo; antes de qualquer decisão, prolonga-se e complementa-se."],["Repetir a CTG em uma semana, sem nenhuma outra avaliação, por se tratar de achado comum.","Errada: o traçado não reativo precisa ser esclarecido no mesmo atendimento."],["Administrar oxigênio materno e repetir o exame no dia seguinte, sem outras medidas.","Errada: o oxigênio materno não tem benefício sem hipoxemia e não esclarece o achado."]],"conc":"A CTG anteparto tem ótimo valor preditivo negativo e alto falso-positivo. Diante de traçado não reativo, prolonga-se para 40 minutos, usa-se estímulo vibroacústico e, se persistir, complementa-se com PBF ou Doppler.","rac":"1) 20 minutos sem acelerações. 2) Sono fetal dura 20 a 40 minutos. 3) Prolongar e estimular. 4) Persistindo, PBF ou Doppler. 5) Só então decidir.","pista":"Traçado não reativo sem desacelerações, após apenas 20 minutos.","mud":"Em um traçado categoria III intraparto, o tempo seria curto e a resolução viria antes.","cmp":"Causa mais comum de CTG não reativa: sono fetal. Melhor próximo passo: prolongar e estimular.","arm":"Indicar parto por CTG não reativa isolada.","regra":"CTG não reativa: prolongue, estimule e complemente.","cf":"Se a gestante tivesse recebido betametasona no dia anterior, a variabilidade reduzida poderia ser efeito transitório do corticoide.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (recursos para reduzir falso-positivo) e tabela 'mais comum, primeiro exame e melhor próximo passo'; FEBRASGO, Protocolo de cardiotocografia anteparto."},{"n":5,"sub":"Ressuscitação intrauterina","eixo":"Cardiotocografia","comp":"Priorizar as medidas de ressuscitação intrauterina","enun":"Parturiente de 38 semanas em indução com ocitocina apresenta 6 contrações em 10 minutos e desaceleração prolongada da FCF para 90 bpm há 3 minutos. PA de 118 x 72 mmHg. Qual é a medida inicial mais eficaz?","ops":[["Suspender a ocitocina, lateralizar e excluir prolapso de cordão ao toque.","Correta: a taquissistolia é a causa provável, e suspender a ocitocina é frequentemente a medida mais eficaz."],["Aumentar a ocitocina para acelerar o parto e encurtar a exposição fetal à hipóxia.","Errada: aumentar a ocitocina agrava a taquissistolia e a hipóxia."],["Administrar efedrina endovenosa para elevar a pressão arterial materna.","Errada: a pressão materna está normal; vasopressor é para hipotensão, como após raquianestesia."],["Aguardar mais 10 minutos para caracterizar bradicardia antes de qualquer intervenção.","Errada: a desaceleração prolongada exige busca ativa e imediata da causa."]],"conc":"Diante de traçado preocupante: decúbito lateral, suspender ocitocina ou retirar prostaglandina, exame vaginal para excluir prolapso, corrigir hipotensão, tocólise aguda se taquissistolia persistente, amnioinfusão em variáveis por oligoâmnio e preparar o parto se não houver melhora.","rac":"1) Mais de 5 contrações em 10 minutos: taquissistolia. 2) Desaceleração prolongada. 3) Causa reversível. 4) Suspender ocitocina e lateralizar. 5) Toque para excluir prolapso.","pista":"Seis contrações em 10 minutos sob ocitocina.","mud":"Se a desaceleração ocorresse logo após raquianestesia com PA de 80 x 40, o foco seria corrigir a hipotensão.","cmp":"Desaceleração prolongada: 2 a 10 minutos. Bradicardia: 10 minutos ou mais (nova linha de base).","arm":"Esquecer que a ocitocina é causa reversível.","regra":"Taquissistolia com desaceleração: desligue a ocitocina.","cf":"Se a taquissistolia persistir após a suspensão, pode-se usar tocólise aguda com terbutalina subcutânea.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (ressuscitação intrauterina e tabela de desacelerações: prolongada)."},{"n":6,"sub":"Padrão sinusoidal","eixo":"Cardiotocografia","comp":"Associar o padrão sinusoidal à anemia fetal","enun":"Gestante de 33 semanas, Rh negativo com Coombs indireto positivo em título crescente, faz CTG com ondulação suave e regular de 3 a 5 ciclos por minuto, por mais de 20 minutos, com variabilidade ausente. Qual exame deve ser priorizado?","ops":[["Doppler da cerebral média com pico de velocidade sistólica, para avaliar anemia fetal.","Correta: o padrão sinusoidal sugere anemia fetal grave; PVS da ACM acima de 1,5 MoM prediz anemia moderada a grave."],["Doppler das artérias uterinas, para avaliar a placentação materna.","Errada: a artéria uterina avalia placentação e não diagnostica anemia fetal."],["Teste de tolerância às contrações com ocitocina, para medir a reserva placentária.","Errada: diante de categoria III, provocar contrações é inadequado."],["Repetir a CTG em 24 horas após estímulo vibroacústico.","Errada: o padrão sinusoidal é categoria III e não aguarda 24 horas."]],"conc":"O padrão sinusoidal (ondulação regular de 3 a 5 ciclos por minuto por 20 minutos ou mais, com variabilidade ausente) é categoria III e sugere anemia fetal grave, hemorragia fetomaterna ou hipóxia grave.","rac":"1) Padrão sinusoidal. 2) Aloimunização Rh. 3) Anemia fetal. 4) PVS da ACM. 5) Se acima de 1,5 MoM, cordocentese com transfusão ou resolução.","pista":"Aloimunização com padrão sinusoidal.","mud":"Sem aloimunização, considerar hemorragia fetomaterna, mas o PVS da ACM continuaria útil.","cmp":"IP da ACM baixo: centralização (hipóxia). PVS da ACM alto: anemia.","arm":"Confundir as duas medidas da cerebral média.","regra":"Sinusoidal: pense em anemia.","cf":"O PVS da ACM substituiu a amniocentese seriada com espectrofotometria (curva de Liley).","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (desacelerações: sinusoidal) e módulo 7.5 (ACM: pico de velocidade sistólica), seção de populações especiais (aloimunização Rh)."},{"n":7,"sub":"Ordem de perda no PBF","eixo":"Perfil biofísico fetal","comp":"Aplicar o conceito de hipóxia gradual","enun":"Pelo conceito de hipóxia gradual (Vintzileos), um feto submetido a hipóxia progressiva perde as variáveis biofísicas em ordem previsível. Qual é a última a desaparecer e por quê?","ops":[["O tônus fetal, porque seu centro no SNC é o primeiro a surgir na embriogênese.","Correta: o que surge por último se perde primeiro; o tônus (cerca de 7,5 a 8,5 semanas) é o mais resistente."],["A reatividade da FCF, porque o centro cardíaco é o mais protegido na centralização.","Errada: a reatividade é a primeira a se perder, por ter o centro mais tardio."],["Os movimentos respiratórios, porque dependem do tronco cerebral, poupado na hipóxia.","Errada: os movimentos respiratórios se perdem logo após a reatividade."],["O líquido amniótico, porque ele é o último marcador agudo a se alterar.","Errada: o líquido não é variável aguda; reflete perfusão renal crônica."]],"conc":"Ordem de perda: reatividade da FCF, movimentos respiratórios, movimentos corporais e, por último, tônus. É o inverso da ordem de aparecimento dos centros no SNC.","rac":"1) Centros que surgem mais tarde são mais sensíveis à hipóxia. 2) Reatividade surge no terceiro trimestre: perde primeiro. 3) Tônus surge com cerca de 8 semanas: perde por último.","pista":"A ideia de que 'o que nasce por último morre primeiro'.","mud":"Se a pergunta fosse sobre a variável crônica, a resposta seria o líquido amniótico.","cmp":"Variáveis agudas: reatividade, respiração, movimento, tônus. Crônica: líquido.","arm":"Achar que a reatividade é a última a sumir.","regra":"Feto sem tônus já perdeu todo o resto.","cf":"PBF de 0 ou 2 indica asfixia quase certa e resolução imediata em idade viável.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.4 (perfil biofísico: o conceito de hipóxia gradual) e tabela de vocabulário de prova."},{"n":8,"sub":"PBF modificado","eixo":"Perfil biofísico fetal","comp":"Definir e interpretar o PBF modificado","enun":"No ambulatório de alto risco, gestante de 39 semanas em pós-datismo faz o 'perfil biofísico modificado'. Quais componentes ele inclui e quando é considerado anormal?","ops":[["CTG e líquido amniótico; anormal se a CTG for não reativa ou o ILA for de 5 cm ou menos.","Correta: o PBF modificado combina o marcador agudo (CTG) com o crônico (líquido)."],["Movimentos respiratórios e tônus; anormal se qualquer um estiver ausente por 30 minutos.","Errada: esses componentes pertencem ao PBF completo, e não ao modificado."],["Doppler umbilical e CTG; anormal se houver diástole zero ou CTG não reativa.","Errada: o Doppler não faz parte do PBF modificado."],["Líquido amniótico isolado; anormal se o maior bolsão for inferior a 4 cm.","Errada: o líquido sozinho não é o PBF modificado, e o corte do maior bolsão é 2 cm."]],"conc":"PBF modificado = CTG (agudo) + líquido amniótico (crônico). Normal com CTG reativa e ILA acima de 5 cm (ou maior bolsão de 2 cm ou mais). É mais rápido que o PBF completo, com desempenho comparável.","rac":"1) Pergunta sobre o modificado. 2) Dois componentes. 3) Um agudo e um crônico. 4) Anormal se qualquer um falhar.","pista":"A palavra 'modificado'.","mud":"No PBF completo, acrescentam-se movimentos respiratórios, corporais e tônus.","cmp":"ILA: soma de 4 quadrantes (normal 5 a 24 cm). Maior bolsão vertical: normal 2 a 8 cm.","arm":"Confundir o PBF modificado com o completo.","regra":"PBF modificado = CTG + líquido.","cf":"No pós-datismo, o oligoâmnio é o achado que mais frequentemente antecipa a indução.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.4 (PBF modificado) e módulo 7.6 (pós-datismo e gestação prolongada)."},{"n":9,"sub":"Corticoide e falso-positivo do PBF","eixo":"Perfil biofísico fetal","comp":"Reconhecer causas medicamentosas de PBF e CTG falsamente alterados","enun":"Gestante de 31 semanas internada por pré-eclâmpsia recebeu betametasona há 30 horas e está em sulfato de magnésio. PBF: CTG não reativa com variabilidade reduzida, movimentos respiratórios ausentes, movimentos corporais e tônus presentes, líquido normal. Doppler umbilical normal. Qual é a interpretação mais adequada?","ops":[["Possível efeito transitório do corticoide e do magnésio; manter vigilância e reavaliar.","Correta: betametasona e MgSO4 reduzem transitoriamente variabilidade, respiração e escore do PBF."],["Hipóxia aguda inequívoca, com indicação de cesárea imediata.","Errada: com causas medicamentosas conhecidas e Doppler normal, não se conclui hipóxia sem reavaliar."],["Exame normal, que dispensa qualquer nova avaliação até o parto.","Errada: o efeito é transitório, mas não se descarta hipóxia; a vigilância continua."],["Suspender o sulfato de magnésio para que o PBF possa ser interpretado corretamente.","Errada: o MgSO4 é necessário para a mãe e não deve ser retirado para melhorar o exame."]],"conc":"Corticoide antenatal (efeito de 24 a 48 horas), sulfato de magnésio, opioides e benzodiazepínicos reduzem variabilidade, movimentos respiratórios e o escore do PBF. Não se interpreta como hipóxia isoladamente, mas mantém-se a vigilância.","rac":"1) Betametasona há 30 horas. 2) MgSO4 em curso. 3) Perda das variáveis agudas mais sensíveis a fármacos. 4) Líquido e Doppler normais. 5) Reavaliar.","pista":"Betametasona recente e sulfato de magnésio.","mud":"Com Doppler alterado ou líquido reduzido, a hipótese de hipóxia ganharia peso.","cmp":"Falso-positivo: sono, fármacos, tabagismo. Falso-negativo: descolamento, acidente de cordão, hemorragia fetomaterna após exame normal.","arm":"Indicar parto por PBF reduzido logo após corticoide.","regra":"Antes de culpar a hipóxia, verifique os fármacos.","cf":"Pela tabela da aula de propedêutica, PBF 6 com líquido normal é resultado duvidoso, com repetição em 24 horas.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.3 (causas de variabilidade reduzida e armadilha do corticoide) e módulo 7.4 (limitações do PBF)."},{"n":10,"sub":"Doppler e redução de mortalidade","eixo":"Doppler obstétrico","comp":"Conhecer a evidência de cada método de vigilância","enun":"Entre os métodos de avaliação fetal anteparto, qual demonstrou em revisão sistemática redução da mortalidade perinatal, e em qual população?","ops":[["O Doppler de artéria umbilical, em gestações de alto risco.","Correta: reduz a mortalidade perinatal em cerca de um terço no alto risco, com menos induções e internações."],["A cardiotocografia anteparto, em todas as gestantes no terceiro trimestre.","Errada: a CTG anteparto não demonstrou redução de mortalidade e tem falso-positivo alto."],["O perfil biofísico fetal, em gestações de alto risco.","Errada: a revisão Cochrane não mostrou redução de mortalidade com o PBF."],["O Doppler de artéria umbilical, como rotina em gestações de risco habitual.","Errada: no risco habitual o Doppler de rotina não traz benefício e aumenta intervenções."]],"conc":"Apenas o Doppler de artéria umbilical em gestações de alto risco reduziu a mortalidade perinatal em revisão sistemática. CTG e PBF não têm essa demonstração, e o Doppler de rotina no risco habitual não traz benefício.","rac":"1) Pergunta sobre evidência de desfecho duro. 2) Só o Doppler de AU. 3) Só no alto risco.","pista":"Combinação de método e população.","mud":"Se a pergunta fosse sobre o melhor valor preditivo negativo para bem-estar agudo, a resposta seria a CTG.","cmp":"Doppler: precoce, reduz mortalidade no alto risco. CTG: agudo, ótimo VPN. PBF: refina CTG não reativa.","arm":"Generalizar o benefício do Doppler para o risco habitual.","regra":"Doppler umbilical salva vidas no alto risco, não no risco habitual.","cf":"Por isso o Doppler não é 'exame de rotina do terceiro trimestre' em toda gestante.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), seção 'Os 5 métodos em uma página' (o achado de evidência mais importante) e módulo 7.5 (quando pedir Doppler)."},{"n":11,"sub":"Artérias uterinas no primeiro trimestre","eixo":"Doppler obstétrico","comp":"Situar o Doppler das uterinas na predição de pré-eclâmpsia","enun":"Primigesta de 12 semanas faz rastreamento combinado de pré-eclâmpsia: pressão arterial média elevada, PlGF baixo e IP médio das artérias uterinas acima do P95. Qual decisão esse resultado muda?","ops":[["Indicar AAS em baixa dose, iniciado precocemente, para prevenir pré-eclâmpsia.","Correta: o Doppler das uterinas entra na predição, e o que muda a conduta é a indicação de AAS."],["Indicar o momento do parto, programado para 34 semanas.","Errada: as artérias uterinas não servem para decidir o momento do parto."],["Confirmar sofrimento fetal crônico e iniciar vigilância com PBF semanal desde já.","Errada: a artéria uterina não avalia o feto, e PBF com 12 semanas não tem utilidade."],["Diagnosticar restrição de crescimento fetal precoce e solicitar cariótipo.","Errada: não há feto pequeno; o achado indica risco, não diagnóstico."]],"conc":"As artérias uterinas refletem a qualidade da invasão trofoblástica. No primeiro trimestre (11 a 13+6 semanas), integram o rastreamento combinado de pré-eclâmpsia com PAM, PlGF e fatores maternos; o que muda a conduta é o AAS em baixa dose.","rac":"1) Rastreamento combinado positivo. 2) Alto risco de pré-eclâmpsia. 3) Conduta: AAS em baixa dose antes de 16 semanas.","pista":"Rastreamento combinado no primeiro trimestre.","mud":"Se o rastreamento fosse negativo, sem outros fatores de risco, não haveria indicação de AAS por esse motivo.","cmp":"Artéria uterina: predição. Artéria umbilical: gravidade e momento do parto.","arm":"Usar as uterinas para decidir parto.","regra":"Uterinas predizem; umbilical decide.","cf":"Incisura protodiastólica bilateral persistente após 24 a 26 semanas também indica placentação deficiente.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.5 (território 1: artérias uterinas) e tabela 'Doppler: o que é normal em cada território'."},{"n":12,"sub":"Pseudonormalização da ACM","eixo":"Doppler obstétrico","comp":"Interpretar a evolução do IP da artéria cerebral média","enun":"Feto de 29 semanas com CIUR grave, acompanhado com Doppler seriado. Há uma semana, o IP da artéria cerebral média estava abaixo do P5 com diástole zero na umbilical. Hoje, o IP da cerebral média está no P30, a umbilical tem diástole reversa e o ducto venoso tem onda 'a' ausente. Como interpretar a cerebral média?","ops":[["Pseudonormalização por edema cerebral e falha da autorregulação, sinal de piora.","Correta: um IP da ACM que normaliza num feto que estava piorando é sinal ruim, não melhora."],["Recuperação da oxigenação cerebral, que permite adiar o parto.","Errada: os demais achados (diástole reversa e DV alterado) mostram deterioração."],["Erro técnico de medida, que deve ser ignorado na decisão.","Errada: a normalização num contexto de piora tem significado fisiopatológico conhecido."],["Efeito do corticoide antenatal, que normaliza o fluxo cerebral fetal.","Errada: não é a explicação esperada; o quadro é de falência da autorregulação."]],"conc":"Na hipóxia, o IP da ACM cai abaixo do P5 (brain sparing). Em fases muito avançadas pode haver pseudonormalização, quando surgem edema cerebral e falha da autorregulação.","rac":"1) Piora de diástole zero para reversa. 2) DV com onda a ausente. 3) ACM 'normaliza'. 4) Incoerente com melhora. 5) Pseudonormalização, sinal de gravidade.","pista":"ACM normalizando enquanto AU e DV pioram.","mud":"Se AU e DV também melhorassem, a normalização da ACM poderia indicar real melhora.","cmp":"ACM baixa: centralização. ACM normalizando com piora global: falência.","arm":"Ler a ACM isolada como melhora.","regra":"Doppler se lê em conjunto.","cf":"Com onda a ausente no DV, a decisão de parto é imediata a partir da viabilidade, com corticoide e MgSO4 quando possível.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.5 (território 3: índice de pulsatilidade e pseudonormalização; território 4: ducto venoso)."},{"n":13,"sub":"Diástole zero e diástole reversa","eixo":"Doppler obstétrico","comp":"Reconhecer na descrição da onda a diástole zero e a reversa","enun":"O laudo de Doppler da artéria umbilical de um feto de 30 semanas descreve: 'ao final de cada ciclo, a velocidade diastólica cruza abaixo da linha de base'. Qual é o achado e seu significado?","ops":[["Diástole reversa, com obliteração muito extensa e risco elevado de acidemia.","Correta: quando o traçado cruza abaixo da linha de base, a diástole é reversa, achado muito grave."],["Diástole zero, achado intermediário que permite aguardar até 37 semanas.","Errada: na diástole zero a onda toca a linha de base sem cruzá-la, e não se aguarda até 37 semanas."],["Índice de pulsatilidade elevado com diástole presente, achado inicial.","Errada: com diástole presente a onda fica acima da linha de base."],["Padrão normal do terceiro trimestre, pela maior resistência placentária com a idade.","Errada: a resistência placentária cai com a idade gestacional; diástole reversa é sempre patológica."]],"conc":"Na diástole zero, o traçado toca a linha de base; na reversa, cruza abaixo dela. A reversa é pior, corresponde a obliteração muito extensa e frequentemente precede a alteração do ducto venoso.","rac":"1) Velocidade diastólica abaixo de zero. 2) Diástole reversa. 3) Estágio III de Barcelona. 4) Internar e programar parto por volta de 30 semanas por cesárea.","pista":"A palavra 'cruza abaixo da linha de base'.","mud":"Se a onda apenas tocasse a linha de base, seria diástole zero.","cmp":"Zero: toca a linha. Reversa: cruza a linha.","arm":"Confundir diástole zero com reversa.","regra":"Reversa é pior que zero.","cf":"Medir sempre no mesmo sítio do cordão, em alça livre, permite comparar exames seriados.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.5 (território 2: progressão dos achados da artéria umbilical) e tabela de erros frequentes."},{"n":14,"sub":"Redução dos movimentos fetais","eixo":"Indicações e limitações","comp":"Conduzir a queixa de redução de movimentos fetais","enun":"Gestante de 35 semanas, risco habitual, liga para a unidade dizendo que contou 4 movimentos fetais em 2 horas desde a manhã. Qual é a orientação adequada?","ops":[["Avaliação no mesmo dia, com confirmação dos batimentos e cardiotocografia como primeiro exame.","Correta: menos de seis movimentos em duas horas exige avaliação imediata; o primeiro exame é a CTG."],["Observar por mais 24 horas em casa e retornar se não houver melhora.","Errada: a queda dos movimentos pode preceder o óbito em horas a dias; não se aguarda."],["Agendar Doppler de rotina na próxima semana, pois a gestação é de risco habitual.","Errada: o Doppler não avalia hipóxia aguda e não é o primeiro exame."],["Tranquilizar, explicando que no terceiro trimestre o feto se movimenta menos por falta de espaço.","Errada: a percepção de redução é sinal de alerta e não deve ser atribuída ao espaço."]],"conc":"A FEBRASGO orienta que a gestante procure assistência se contar menos de seis movimentos em duas horas. A queixa exige avaliação no mesmo dia: batimentos, CTG e, se não reativa ou se houver fator de risco, ultrassonografia com líquido e crescimento.","rac":"1) Quatro movimentos em duas horas: abaixo do esperado. 2) Avaliar no mesmo dia. 3) Confirmar batimentos. 4) CTG. 5) USG se necessário.","pista":"Menos de seis movimentos em duas horas.","mud":"Obesidade, placenta anterior e sedativos reduzem a percepção, mas não dispensam a avaliação.","cmp":"Primeiro exame: CTG. Método com redução de mortalidade no alto risco: Doppler umbilical.","arm":"Mandar observar em casa.","regra":"Bebê mexendo menos: avaliação hoje.","cf":"Pelo método de Cardiff, espera-se atingir 10 movimentos em até 1 a 2 horas.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.2 (percepção de movimentos fetais e conduta); FEBRASGO, Protocolo de cardiotocografia anteparto."},{"n":15,"sub":"Colestase gravídica","eixo":"Indicações e limitações","comp":"Escolher a vigilância conforme o mecanismo da doença","enun":"Gestante de 35 semanas com colestase intra-hepática da gravidez e ácidos biliares de 112 µmol/L. CTG, PBF e Doppler estão normais. A equipe pergunta se pode aguardar o termo com vigilância biofísica semanal. Qual é a resposta mais adequada?","ops":[["Não; na colestase, o óbito é arrítmico e a vigilância biofísica não o prediz.","Correta: a conduta se baseia no nível de ácidos biliares e na antecipação do parto, não nos exames de vitalidade."],["Sim; com Doppler umbilical normal, o risco de óbito fetal fica abaixo do da população geral.","Errada: o óbito na colestase não decorre de insuficiência placentária progressiva."],["Sim, desde que se troque a vigilância por PBF diário até 40 semanas.","Errada: aumentar a frequência não resolve, porque o traçado pode ser normal horas antes do óbito."],["Não; deve-se indicar cesárea imediata, independentemente da idade gestacional.","Errada: a antecipação é programada conforme os ácidos biliares, sem cesárea obrigatória."]],"conc":"Na colestase gravídica, o óbito fetal é atribuído a arritmia por efeito direto dos ácidos biliares. CTG, PBF e Doppler não predizem bem o desfecho. O exame certo depende do mecanismo da doença.","rac":"1) Colestase com ácidos biliares muito elevados. 2) Mecanismo arrítmico. 3) Exames biofísicos normais não tranquilizam. 4) Planejar antecipação do parto.","pista":"Colestase com vitalidade normal.","mud":"Na insuficiência placentária, ao contrário, o Doppler é o método central de vigilância.","cmp":"Insuficiência placentária: Doppler prediz. Colestase: não prediz.","arm":"Confiar em exames normais numa doença de mecanismo arrítmico.","regra":"O exame certo depende do mecanismo da doença.","cf":"No diabetes com macrossomia, o óbito pode ocorrer com Doppler umbilical normal; a vigilância se apoia em CTG, PBF e controle glicêmico.","fonte":"Aula HTML Propedêutica Fetal (Aulas-GO, aula 04), módulo 7.6 (populações e situações especiais: colestase gravídica e diabetes)."}]},{"id":"M04","titulo":"Amenorreias","bloco":2,"grupo":"C","q":[{"n":1,"sub":"Ausência de telarca aos 13 anos","eixo":"Primária versus secundária","comp":"Saber quando investigar a amenorreia primária","enun":"Menina de 13 anos e 4 meses é trazida pela mãe porque 'ainda não menstruou'. Ao exame: Tanner M1 P2, estatura no percentil 25, sem estigmas. Nega dor pélvica. Qual é a conduta mais adequada?","ops":[["Iniciar a investigação agora: sem telarca aos 13 anos já se investiga.","Correta: sem caracteres sexuais secundários, investiga-se aos 13 anos (FEBRASGO 2021 e ASRM 2024)."],["Aguardar até os 15 anos, que é a idade limite para investigar qualquer amenorreia primária.","Errada: 15 anos vale para quem já tem caracteres sexuais secundários."],["Aguardar 3 anos após a telarca, como recomenda o protocolo brasileiro para atraso puberal.","Errada: a regra dos 3 anos após a telarca se aplica à telarca precoce; aqui não há telarca."],["Prescrever estrogênio em baixa dose para induzir a puberdade antes de qualquer exame.","Errada: a indução puberal vem depois do diagnóstico etiológico."]],"conc":"Amenorreia primária: investigar aos 13 anos sem caracteres sexuais secundários e aos 15 anos com caracteres presentes. Após telarca precoce, 3 anos (FEBRASGO) ou 5 anos (ASRM).","rac":"1) 13 anos. 2) Mama M1: sem telarca. 3) Critério de investigação preenchido. 4) Exame físico, ultrassonografia (útero presente?) e FSH; cariótipo se FSH alto.","pista":"Tanner M1 aos 13 anos.","mud":"Com telarca presente aos 13 anos, aguardar-se-ia até os 15 anos, salvo dor cíclica ou estigmas.","cmp":"Sem caracteres: 13 anos. Com caracteres: 15 anos.","arm":"Aplicar o corte de 15 anos a todas as adolescentes.","regra":"Sem mama aos 13, investigue.","cf":"Na investigação, pergunte sobre olfato: anosmia com hipogonadismo hipogonadotrófico sugere síndrome de Kallmann.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.1 (definições e quando investigar); FEBRASGO, Protocolo de Amenorreia nº 25 (2021); ASRM, Current evaluation of amenorrhea (2024)."},{"n":2,"sub":"Criptomenorreia","eixo":"Primária versus secundária","comp":"Reconhecer a obstrução do trato de saída como urgência de investigação","enun":"Adolescente de 14 anos, telarca aos 11 e pubarca aos 12, sem menarca, procura o pronto atendimento com dor pélvica cíclica há 4 meses, agora com dificuldade para urinar. À inspeção vulvar, abaulamento violáceo que aumenta à manobra de Valsalva. Qual é o diagnóstico e a conduta?","ops":[["Hímen imperfurado com hematocolpo; sondagem de alívio se necessário e correção cirúrgica.","Correta: dor cíclica progressiva com abaulamento azulado é típica de hímen imperfurado, que exige himenotomia ou himenectomia."],["Septo vaginal transverso; ressonância e ressecção eletiva em serviço especializado.","Errada: no septo não há abaulamento visível à inspeção vulvar."],["Atraso constitucional da menarca; tranquilizar e reavaliar aos 15 anos.","Errada: dor cíclica e abaulamento indicam obstrução, que se investiga imediatamente."],["Abscesso de glândula de Bartholin; drenagem e antibiótico no consultório.","Errada: o abaulamento central que aumenta ao Valsalva em adolescente sem menarca indica hematocolpo, não abscesso."]],"conc":"Na criptomenorreia, a menstruação ocorre mas não se exterioriza. Dor pélvica cíclica progressiva com caracteres sexuais presentes e sem menarca exige investigação imediata, independentemente da idade.","rac":"1) Caracteres sexuais presentes. 2) Sem menarca. 3) Dor cíclica: endométrio funciona. 4) Abaulamento azulado: hímen imperfurado. 5) Retenção urinária: urgência. 6) Correção cirúrgica.","pista":"Abaulamento azulado que aumenta ao Valsalva.","mud":"Sem abaulamento e com vagina curta, a hipótese seria septo transverso, com RM antes da cirurgia.","cmp":"Hímen imperfurado: visível à inspeção. Septo transverso: não visível, precisa de RM.","arm":"Aguardar os 15 anos diante de dor cíclica.","regra":"Dor cíclica sem menarca é obstrução até prova em contrário.","cf":"Não se punciona o hematocolpo às cegas no consultório; a drenagem é cirúrgica.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulos 7.1 (investigue imediatamente), 7.4 (obstruções com útero funcionante) e 7.13 (emergências)."},{"n":3,"sub":"Painel inicial da amenorreia secundária","eixo":"Investigação em etapas","comp":"Solicitar os exames iniciais corretos","enun":"Mulher de 27 anos, ciclos regulares até 5 meses atrás, está sem menstruar desde então. Vida sexual ativa, usa preservativo de forma irregular. Sem galactorreia, sem hirsutismo, IMC 23 kg/m². Qual conjunto de exames deve ser solicitado primeiro?","ops":[["Beta-hCG, FSH com estradiol, prolactina e TSH.","Correta: é o painel inicial de toda amenorreia secundária (ASRM 2024, Femina 2025), com o beta-hCG antes de tudo."],["Cariótipo, AMH e ressonância de sela túrcica.","Errada: cariótipo e RM são etapas dirigidas, não o painel inicial."],["Teste da progesterona isolado, deixando os hormônios para quem não sangrar.","Errada: a FEBRASGO 2021 não recomenda o teste de rotina, e a gestação deve ser excluída primeiro."],["Testosterona, DHEA-S e 17-hidroxiprogesterona.","Errada: são indicados se houver hiperandrogenismo clínico, ausente aqui."]],"conc":"Na amenorreia secundária, a primeira hipótese é sempre gestação. O painel inicial inclui beta-hCG, FSH com estradiol, prolactina e TSH, além da ultrassonografia quando disponível.","rac":"1) Amenorreia secundária há 5 meses com ciclos prévios regulares. 2) Excluir gestação. 3) FSH e estradiol separam ovário de causa central. 4) Prolactina e TSH separam hipófise e tireoide.","pista":"Atividade sexual com contracepção irregular.","mud":"Com hirsutismo, acrescentam-se testosterona, DHEA-S e 17-OH-progesterona.","cmp":"Secundária: painel hormonal mais ultrassonografia. Primária: exame físico, útero presente e FSH, com cariótipo precoce.","arm":"Pular o beta-hCG.","regra":"Amenorreia: beta-hCG primeiro.","cf":"Em usuária de SIU de levonorgestrel, a amenorreia é efeito esperado e não deve ser investigada como doença.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulos 7.11 (exames complementares, painel inicial) e 9.4 (algoritmo de 6 passos); ASRM 2024."},{"n":4,"sub":"Leitura do quadro da aula","eixo":"Investigação em etapas","comp":"Interpretar o padrão laboratorial da amenorreia secundária pelo quadro da aula","enun":"Pelo quadro de padrões laboratoriais apresentado em aula, uma mulher de 29 anos com amenorreia secundária tem FSH normal, LH discretamente elevado, estradiol normal, prolactina e TSH normais, endométrio de 9 mm e teste da progesterona positivo. Qual é o diagnóstico?","ops":[["Anovulação, com estrogênio presente sem oposição da progesterona.","Correta: endométrio espesso com teste positivo indica estrogênio agindo sem progesterona."],["Hipogonadismo hipogonadotrófico, pelo LH alterado e ausência de ciclo.","Errada: no hipogonadismo o estradiol é baixo, o endométrio é fino e o teste é negativo."],["Aderências uterinas (Asherman), pois todos os hormônios estão normais.","Errada: no Asherman o endométrio é fino e o teste é negativo."],["Insuficiência ovariana prematura em fase inicial, pela elevação do LH.","Errada: na IOP o FSH está elevado e o estradiol baixo."]],"conc":"No quadro da aula, as colunas-chave são espessura endometrial e teste da progesterona. Endométrio normal ou espesso com teste positivo indica anovulação. A FEBRASGO 2021 desaconselha o teste de rotina; use a coluna como raciocínio fisiopatológico.","rac":"1) Estradiol normal. 2) Endométrio de 9 mm. 3) Teste positivo. 4) Há estrogênio, falta progesterona. 5) Anovulação (como na SOP).","pista":"Endométrio espesso com sangramento após progesterona.","mud":"Endométrio abaixo de 5 mm com teste negativo apontaria hipoestrogenismo ou cicatriz endometrial.","cmp":"Teste positivo: anovulação. Teste negativo: falta de estrogênio ou endométrio que não responde.","arm":"Usar o teste da progesterona como exame de rotina na prática atual.","regra":"Endométrio espesso que sangra com progesterona = anovulação.","cf":"Se a pergunta fosse a conduta atual recomendada, o caminho seria dosagem hormonal e ultrassonografia, e não o teste.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 9.3 (quadro da aula: padrões laboratoriais, material da disciplina, capturas de 07/08/2026) e módulo 7.11 (aula x diretriz: teste da progesterona); FEBRASGO 2021."},{"n":5,"sub":"Síndrome de Asherman","eixo":"Causas uterinas e anatômicas","comp":"Reconhecer sinéquias uterinas e seu padrão-ouro diagnóstico","enun":"Mulher de 32 anos está sem menstruar há 7 meses, desde uma curetagem por aborto retido complicada por endometrite. Beta-hCG negativo; FSH, estradiol, prolactina e TSH normais. Ultrassonografia: endométrio fino e hiperecogênico. Qual é o diagnóstico e o exame padrão-ouro?","ops":[["Síndrome de Asherman; histeroscopia diagnóstica e terapêutica.","Correta: hormônios normais com antecedente de instrumentação e endométrio fino sugerem sinéquias; a histeroscopia é o padrão-ouro."],["Insuficiência ovariana prematura; dosagem de AMH e cariótipo.","Errada: na IOP o FSH está elevado e o estradiol baixo."],["Amenorreia hipotalâmica funcional; ressonância de sela túrcica.","Errada: na AHF o estradiol é baixo; aqui os hormônios são normais."],["Síndrome de Sheehan; dosagem de T4 livre e cortisol.","Errada: Sheehan ocorre após hemorragia pós-parto e cursa com hipopituitarismo."]],"conc":"Sinéquias intrauterinas surgem após curetagem, instrumentação, endometrite ou tuberculose genital. É a única linha do quadro da aula com todos os hormônios normais e sem sangramento. A histeroscopia diagnostica e trata (lise, depois DIU ou balão, com ou sem estrogênio).","rac":"1) Curetagem com endometrite. 2) Hormônios normais. 3) Endométrio fino. 4) Causa uterina. 5) Histeroscopia.","pista":"Antecedente de curetagem com hormônios normais.","mud":"FSH elevado mudaria para IOP, mesmo com antecedente de curetagem.","cmp":"Asherman x IOP: ambas não sangram após progesterona; FSH alto só na IOP.","arm":"Pedir RM ou cariótipo antes de valorizar o antecedente uterino.","regra":"Na amenorreia com hormônios normais, procure o útero.","cf":"A investigação costuma começar por ultrassonografia ou histerossonografia; a histeroscopia é o padrão-ouro.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.4 (sinéquias intrauterinas), módulo 9.3 (linha das aderências uterinas) e tabela 8.4 (Asherman x IOP)."},{"n":6,"sub":"MRKH versus insensibilidade androgênica","eixo":"Mayer-Rokitansky e insensibilidade androgênica","comp":"Diferenciar MRKH de SIAC à beira do leito e no laboratório","enun":"Jovem de 17 anos com amenorreia primária. Mamas Tanner M5, pelos pubianos e axilares ausentes, estatura de 1,74 m, vagina curta em fundo cego. Ultrassonografia sem útero, com massas ovaladas nos canais inguinais. Qual é o exame mais simples para confirmar a suspeita principal?","ops":[["Testosterona sérica, que estará em faixa masculina na insensibilidade androgênica.","Correta: pelos ausentes com mamas desenvolvidas e gônadas inguinais sugerem SIAC; a testosterona separa de MRKH e o cariótipo confirma."],["FSH sérico, que estará elevado pela falência das gônadas.","Errada: na SIAC os testículos funcionam e o FSH não define o diagnóstico."],["Histerossalpingografia, para confirmar a ausência de útero.","Errada: a ausência de útero já foi vista e o exame não separa as duas condições."],["Teste da progesterona, que será negativo pela ausência de endométrio.","Errada: seria negativo em ambas e não discrimina."]],"conc":"MRKH (46,XX) e SIAC (46,XY) têm vagina curta e ausência de útero. Na SIAC, o AMH funcionou (sem útero), os androgênios não agiram (pelos ausentes) e a aromatização forma mamas. Testosterona em faixa masculina e cariótipo 46,XY confirmam.","rac":"1) Sem útero e vagina curta. 2) Pelos ausentes: androgênio não age. 3) Mamas M5 e estatura alta. 4) Gônadas inguinais. 5) Testosterona masculina: SIAC.","pista":"Ausência de pelos pubianos com mamas normais.","mud":"Com pelos pubianos normais e testosterona feminina, o diagnóstico seria MRKH.","cmp":"MRKH: pelos normais, testosterona feminina, malformação renal. SIAC: pelos escassos, testosterona masculina, risco de neoplasia gonadal.","arm":"Responder cariótipo quando a pergunta é o exame mais simples.","regra":"Sem útero: olhe os pelos e dose a testosterona.","cf":"Na SIAC, a gonadectomia é oferecida por decisão compartilhada após o desenvolvimento mamário e a estatura adulta.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.4 (o discriminador de ouro) e tabela 8.1 (MRKH x SIAC); ASRM 2024."},{"n":7,"sub":"Seguimento na MRKH","eixo":"Mayer-Rokitansky e insensibilidade androgênica","comp":"Rastrear associações e indicar a primeira linha de tratamento na MRKH","enun":"Jovem de 16 anos recebe diagnóstico de agenesia mülleriana (cariótipo 46,XX, ovários normais, sem útero, vagina em fundo cego). Qual conduta deve integrar o plano inicial?","ops":[["Avaliar o trato urinário e indicar dilatadores vaginais.","Correta: cerca de 1/3 tem malformação renal, e dilatadores são preferíveis à neovagina cirúrgica."],["Indicar gonadectomia precoce pelo risco de neoplasia gonadal.","Errada: os ovários são normais e não têm risco aumentado; a gonadectomia é questão da SIAC e do Y."],["Iniciar terapia estroprogestativa contínua para induzir menstruação.","Errada: os ovários funcionam e não há útero; não há menstruação a induzir."],["Programar neovagina cirúrgica imediata como tratamento de escolha.","Errada: a cirurgia fica para casos selecionados; a primeira linha é a dilatação."]],"conc":"Na MRKH, há associação com malformações urogenitais (agenesia renal, rim pélvico ou em ferradura) e esqueléticas. Dilatadores são primeira linha, apoio psicológico é parte do tratamento, e os ovários permitem maternidade biológica por gestação de substituição onde permitido.","rac":"1) MRKH confirmada. 2) Rastrear rins. 3) Tratar a vagina curta com dilatadores. 4) Apoio psicológico. 5) Aconselhamento reprodutivo.","pista":"Associação de agenesia mülleriana com malformações renais.","mud":"Se o cariótipo fosse 46,XY, a discussão passaria a incluir gonadectomia.","cmp":"MRKH: ovários normais. SIAC: testículos com risco de neoplasia.","arm":"Esquecer o trato urinário.","regra":"MRKH: olhe os rins.","cf":"O transplante uterino ainda é considerado experimental.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.4 (agenesia mülleriana) e módulo 7.12 (tratamento por etiologia); FEBRASGO 2021."},{"n":8,"sub":"Síndrome de Swyer","eixo":"Turner e disgenesias gonadais","comp":"Indicar gonadectomia na disgenesia gonadal com cromossomo Y","enun":"Jovem de 16 anos sem telarca, estatura de 1,72 m, sem estigmas somáticos. Ultrassonografia com útero infantil e gônadas em fita. FSH de 92 UI/L. Cariótipo 46,XY. Qual conduta é obrigatória?","ops":[["Gonadectomia ao diagnóstico, pelo alto risco de gonadoblastoma ou disgerminoma.","Correta: na disgenesia gonadal pura 46,XY (Swyer), o risco tumoral chega a cerca de 25% e a gonadectomia é indicada já."],["Aguardar o fim da puberdade espontânea para decidir sobre a gonadectomia.","Errada: não haverá puberdade espontânea, e o adiamento só se aplica à SIAC."],["Retirar o útero, porque o cariótipo 46,XY impede gestação.","Errada: o útero está presente e pode permitir gestação com oócito doado."],["Dispensar a terapia hormonal, já que a paciente não tem ovários funcionantes.","Errada: a falta de estrogênio exige indução puberal e terapia hormonal."]],"conc":"Na síndrome de Swyer (46,XY), a gônada em fita não produziu AMH, por isso há útero. A presença do Y indica gonadectomia ao diagnóstico; depois, indução puberal e terapia hormonal.","rac":"1) Sem telarca, FSH alto: hipergonadotrófico. 2) Útero presente. 3) Estatura normal sem estigmas. 4) 46,XY: Swyer. 5) Gonadectomia já.","pista":"Cariótipo 46,XY com útero presente e gônadas em fita.","mud":"Com cariótipo 45,X sem material Y, não haveria indicação de gonadectomia.","cmp":"Turner: baixa estatura e estigmas. Swyer: estatura normal e Y. SIAC: sem útero e mamas desenvolvidas.","arm":"Adiar a gonadectomia como na SIAC.","regra":"Gônada disgenética com Y: retirar.","cf":"A revelação do cariótipo deve ser gradual, por equipe preparada, sem expressões como 'geneticamente homem'.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.5 (tabela Turner x Swyer x 46,XX) e módulo 7.15 (comunicação e ética)."},{"n":9,"sub":"Síndrome de Turner","eixo":"Turner e disgenesias gonadais","comp":"Reconhecer Turner e rastrear comorbidades","enun":"Adolescente de 15 anos, estatura de 1,42 m, sem telarca, com pescoço alado, tórax em escudo e implantação baixa dos cabelos. FSH elevado. Cariótipo 45,X. Além da indução puberal, qual avaliação é prioritária?","ops":[["Avaliação cardiovascular (valva bicúspide e coarctação).","Correta: as comorbidades de Turner incluem cardiovasculares, renais, tireoidite autoimune e disacusia."],["Gonadectomia imediata, pois toda disgenesia gonadal tem risco de tumor.","Errada: em Turner, a gonadectomia só é indicada se houver material do cromossomo Y."],["Ressonância de sela túrcica, pela suspeita de hipogonadismo central.","Errada: o FSH alto indica causa ovariana, não central."],["Teste da progesterona, para avaliar a resposta endometrial antes da indução.","Errada: sem estrogênio, o teste seria negativo e não acrescenta informação."]],"conc":"Turner (45,X): baixa estatura, estigmas e gônada em fita com FSH elevado. Útero presente infantil. Rastrear cardiopatias (bicúspide, coarctação), malformações renais, tireoidite e disacusia. Gonadectomia só se houver Y.","rac":"1) Baixa estatura com estigmas. 2) FSH alto. 3) 45,X. 4) Sem Y. 5) Prioridade: coração e demais comorbidades.","pista":"Estigmas somáticos com baixa estatura.","mud":"Mosaicismo com material Y indicaria gonadectomia.","cmp":"Turner: baixa estatura. Swyer: estatura normal ou alta.","arm":"Indicar gonadectomia em todo Turner.","regra":"Turner: pense no coração.","cf":"A indução puberal começa com estrogênio em dose baixa, crescente, e só depois se associa o progestagênio.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.5 (tabela das disgenesias) e módulo 7.12 (indução da puberdade)."},{"n":10,"sub":"Hiperprolactinemia por antipsicótico","eixo":"Hiperprolactinemia","comp":"Conduzir a hiperprolactinemia medicamentosa","enun":"Mulher de 24 anos com esquizofrenia estável em uso de risperidona há 1 ano, com amenorreia há 8 meses e galactorreia. Beta-hCG negativo, TSH normal, prolactina de 96 ng/mL. Qual é a conduta mais adequada?","ops":[["Discutir a troca do antipsicótico com a psiquiatria.","Correta: a causa é medicamentosa, e agonista dopaminérgico com antipsicótico é problemático."],["Iniciar cabergolina 0,5 mg por semana e manter a risperidona na mesma dose.","Errada: o agonista dopaminérgico pode antagonizar o antipsicótico e descompensar a doença psiquiátrica."],["Solicitar ressonância de sela túrcica antes de qualquer outra medida.","Errada: a história farmacológica explica o quadro; a RM fica para hiperprolactinemia persistente sem fármaco."],["Suspender a risperidona por conta própria e repetir a prolactina em 30 dias.","Errada: a troca deve ser decidida com a psiquiatria, sem interromper o tratamento por iniciativa ginecológica."]],"conc":"Excluídos gestação e hipotireoidismo, fármacos são a causa mais evitável de hiperprolactinemia. Na causa medicamentosa, discute-se a troca com quem prescreveu; se não for possível, trata-se o hipoestrogenismo com reposição estroprogestativa.","rac":"1) Risperidona eleva prolactina. 2) Amenorreia e galactorreia. 3) Causa medicamentosa provável. 4) Discutir troca. 5) Repor estrogênio se mantiver.","pista":"Uso de risperidona com prolactina elevada.","mud":"Se a prolactina persistisse alta após a troca do fármaco, a RM de sela passaria a ser indicada.","cmp":"Tumoral: cabergolina. Medicamentosa: troca do fármaco ou reposição hormonal.","arm":"Prescrever cabergolina para hiperprolactinemia por antipsicótico.","regra":"Prolactina alta: pergunte pelos remédios antes da RM.","cf":"Metoclopramida, antidepressivos, opioides e verapamil também elevam a prolactina.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.6 (causas hipofisárias) e módulo 7.12 (tratamento por etiologia); FEBRASGO 2021."},{"n":11,"sub":"Prolactinoma","eixo":"Hiperprolactinemia","comp":"Tratar a hiperprolactinemia por adenoma","enun":"Mulher de 28 anos com amenorreia secundária e galactorreia, sem uso de medicamentos, TSH normal, prolactina persistentemente de 145 ng/mL e ressonância com microadenoma hipofisário de 6 mm. Deseja engravidar no futuro. Qual é o tratamento de escolha?","ops":[["Cabergolina, iniciando com 0,5 mg por semana e ajustando conforme clínica e prolactina.","Correta: a cabergolina é preferida pela eficácia, meia-vida longa e tolerância."],["Cirurgia transesfenoidal, por ser o único tratamento definitivo do microadenoma.","Errada: a cirurgia ficou reservada a resistência, intolerância, apoplexia ou compressão progressiva."],["Anticoncepcional combinado isolado, para regular o ciclo e suprimir a galactorreia.","Errada: o contraceptivo não trata o adenoma nem restaura a ovulação."],["Radioterapia hipofisária, pela chance de crescimento tumoral na gestação futura.","Errada: a radioterapia não é tratamento inicial do microprolactinoma."]],"conc":"No prolactinoma, o agonista dopaminérgico é o tratamento de escolha. Cabergolina 0,5 mg/semana inicial, com reavaliação a cada 4 a 8 semanas; ecocardiograma se dose acima de 2 mg/semana. A normalização costuma restaurar a ovulação.","rac":"1) Hiperprolactinemia persistente sem fármaco e TSH normal. 2) Microadenoma. 3) Agonista dopaminérgico. 4) Cabergolina.","pista":"Microadenoma sem causa medicamentosa.","mud":"Com compressão quiasmática progressiva ou apoplexia, a cirurgia seria considerada.","cmp":"Cabergolina: preferida. Bromocriptina: alternativa, 1,25 mg/dia inicial.","arm":"Indicar cirurgia como primeira linha.","regra":"Prolactinoma: remédio antes de bisturi.","cf":"Prolactina levemente elevada em mulher assintomática deve ser repetida e pode ser macroprolactina, biologicamente inerte.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.6 (tratamento da hiperprolactinemia) e tabela 7.12; Pituitary Society Consensus 2023; FEBRASGO 2021."},{"n":12,"sub":"Diagnóstico e manejo da IOP","eixo":"Insuficiência ovariana prematura","comp":"Aplicar os critérios de IOP e orientar terapia hormonal e contracepção","enun":"Pelo critério da diretriz ESHRE/ASRM 2024, mulher de 34 anos com amenorreia há 6 meses, fogachos e secura vaginal, tem FSH de 68 UI/L, estradiol baixo, TSH e prolactina normais. Não deseja gestar agora. Qual orientação está correta?","ops":[["IOP; terapia hormonal até cerca de 50 anos e contracepção, porque pode haver ovulação esporádica.","Correta: há gravidez espontânea em cerca de 5%; a terapia hormonal protege osso e coração até a idade média da menopausa."],["Menopausa precoce irreversível; não há indicação de contracepção nem de reposição hormonal.","Errada: a IOP não é contracepção, e a terapia hormonal é indicada para osso e coração."],["IOP; terapia hormonal apenas se os fogachos forem intensos, suspendendo-a em 2 anos.","Errada: a terapia não é opcional nem curta; mantém-se até cerca de 50 a 51 anos."],["Diagnóstico ainda impossível sem duas dosagens de FSH e uma de AMH.","Errada: pela ESHRE 2024, uma FSH acima de 25 UI/L no contexto clínico basta; AMH só na incerteza."]],"conc":"IOP: menos de 40 anos, oligo ou amenorreia por 4 meses ou mais e FSH acima de 25 UI/L. A ESHRE 2024 aceita uma dosagem; a Femina/FEBRASGO 2025 prefere repetir após 4 semanas. Terapia hormonal até cerca de 50 a 51 anos; investigar cariótipo, X frágil e autoimunidade.","rac":"1) Menos de 40 anos. 2) Amenorreia acima de 4 meses. 3) FSH 68. 4) IOP. 5) TH até cerca de 50 anos e contracepção se não deseja gestar.","pista":"FSH muito elevado com sintomas de hipoestrogenismo antes dos 40 anos.","mud":"Pela conduta brasileira (Femina 2025), repetir o FSH após 4 semanas seria defensável antes de firmar o diagnóstico.","cmp":"IOP: FSH alto, AMH baixa. AHF: FSH normal ou baixo, LH desproporcionalmente baixo.","arm":"Tratar IOP como contracepção natural.","regra":"IOP: hormônio até os 50 e método se não quer engravidar.","cf":"Se desejar gestar, a doação de oócitos é o caminho com maior taxa de sucesso.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.5 (insuficiência ovariana prematura e divergência entre fontes) e tabela 8.2; ESHRE/ASRM/CREWHiRL/IMS 2024."},{"n":13,"sub":"Amenorreia hipotalâmica funcional","eixo":"Causas hipotalâmicas e hipofisárias","comp":"Tratar a amenorreia hipotalâmica funcional pela causa","enun":"Corredora de 22 anos, treina 90 km por semana, IMC de 17,8 kg/m², amenorreia há 10 meses e fratura por estresse no metatarso. Beta-hCG negativo, FSH 4 UI/L, LH 1,2 UI/L, estradiol 18 pg/mL, prolactina e TSH normais. Qual é a conduta principal?","ops":[["Restaurar o balanço energético com nutrição, redução do treino e apoio multiprofissional.","Correta: a AHF se trata corrigindo a baixa disponibilidade energética, e a DXA está indicada."],["Prescrever anticoncepcional combinado para proteger o osso e regular os ciclos.","Errada: o COC mascara o retorno dos ciclos e não corrige o déficit energético; não é estratégia primária para o osso."],["Iniciar bisfosfonato pela fratura por estresse e pela baixa massa óssea.","Errada: bisfosfonatos não são recomendados na idade reprodutiva."],["Induzir a ovulação com citrato de clomifeno para restabelecer os ciclos rapidamente.","Errada: induzir ovulação em desnutrição não trata a causa e exige cautela."]],"conc":"Na AHF, baixa disponibilidade energética, estresse e exercício reduzem os pulsos de GnRH; o LH cai mais que o FSH e o estradiol fica abaixo de 30. É diagnóstico de exclusão. Trata-se o balanço energético; se o hipoestrogenismo persistir, estradiol transdérmico com progesterona cíclica.","rac":"1) Treino intenso e baixo peso. 2) FSH normal, LH baixo, estradiol baixo. 3) Hipogonadismo hipogonadotrófico funcional. 4) Fratura: osso comprometido. 5) Restaurar energia e avaliar DXA.","pista":"LH desproporcionalmente baixo em atleta com IMC baixo.","mud":"Se houvesse cefaleia e alteração visual, a RM do SNC seria obrigatória antes do rótulo de AHF.","cmp":"AHF: LH baixo, estradiol baixo, endométrio fino. SOP: LH alto, estradiol normal.","arm":"Usar COC para 'proteger o osso'.","regra":"Amenorreia da atleta é sinal de risco, não adaptação ao treino.","cf":"Na tríade da mulher atleta (RED-S), a amenorreia acompanha baixa energia e baixa densidade óssea.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.7 (amenorreia hipotalâmica funcional) e módulo 7.14 (atletas); Endocrine Society, Functional Hypothalamic Amenorrhea, 2017."},{"n":14,"sub":"Síndrome de Sheehan","eixo":"Causas hipotalâmicas e hipofisárias","comp":"Reconhecer Sheehan e a ordem segura de reposição hormonal","enun":"Mulher de 30 anos, 5 meses após parto complicado por hemorragia grave com transfusão, não conseguiu amamentar e não voltou a menstruar. Refere fadiga, hipotensão postural e intolerância ao frio. TSH de 1,1 mUI/L e T4 livre baixo; cortisol matinal baixo. Qual é a conduta inicial?","ops":[["Repor glicocorticoide antes de iniciar a levotiroxina.","Correta: no hipopituitarismo, iniciar levotiroxina com insuficiência adrenal não tratada pode precipitar crise adrenal."],["Iniciar levotiroxina isolada, porque o T4 livre está baixo.","Errada: sem corticoide prévio, a levotiroxina acelera o metabolismo do cortisol e pode causar crise adrenal."],["Considerar a tireoide normal, porque o TSH está dentro da referência.","Errada: no hipotireoidismo central o TSH pode ser normal ou baixo; o T4 livre define."],["Iniciar cabergolina, pela falha da lactação causada por excesso de prolactina.","Errada: na necrose hipofisária a prolactina cai; a agalactia é por deficiência, não excesso."]],"conc":"Síndrome de Sheehan: necrose hipofisária após hemorragia obstétrica. Tríade: hemorragia pós-parto, agalactia e amenorreia, com pan-hipopituitarismo variável. TSH pode ser normal; dosa-se T4 livre. Repõe-se glicocorticoide antes da levotiroxina.","rac":"1) Hemorragia pós-parto. 2) Agalactia e amenorreia. 3) T4 livre baixo com TSH normal: central. 4) Cortisol baixo. 5) Corticoide primeiro.","pista":"Agalactia após hemorragia pós-parto.","mud":"Se o cortisol fosse normal, a levotiroxina poderia ser iniciada sem risco de crise adrenal.","cmp":"Hipotireoidismo primário: TSH alto. Central: TSH normal ou baixo com T4 livre baixo.","arm":"Confiar no TSH normal ou iniciar levotiroxina antes do corticoide.","regra":"Hipopituitarismo: cortisol antes da tiroxina.","cf":"Hipotensão grave com vômitos nessa paciente seria crise adrenal, emergência que exige hidrocortisona imediata.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.6 (síndrome de Sheehan e segurança medicamentosa) e módulo 7.13 (emergências)."},{"n":15,"sub":"Síndrome de Kallmann","eixo":"Causas hipotalâmicas e hipofisárias","comp":"Reconhecer a deficiência congênita de GnRH com anosmia","enun":"Jovem de 16 anos sem telarca, estatura normal, útero presente pequeno na ultrassonografia, FSH e LH baixos, estradiol baixo. Ao ser questionada, relata nunca ter sentido cheiro de comida ou perfume. Qual é a principal hipótese?","ops":[["Síndrome de Kallmann (deficiência congênita de GnRH com anosmia).","Correta: hipogonadismo hipogonadotrófico com anosmia é típico de Kallmann."],["Síndrome de Turner, pela ausência de telarca e útero pequeno.","Errada: Turner é hipergonadotrófica (FSH alto) e cursa com baixa estatura e estigmas."],["Insensibilidade androgênica completa, pela ausência de desenvolvimento puberal.","Errada: na SIAC as mamas se desenvolvem e não há útero."],["Síndrome dos ovários policísticos, pelo padrão anovulatório da adolescência.","Errada: na SOP há estrogênio, desenvolvimento puberal e LH normal ou alto."]],"conc":"A deficiência congênita de GnRH causa hipogonadismo hipogonadotrófico; quando associada a defeito do bulbo olfatório, há anosmia ou hiposmia (Kallmann). Pergunte sobre olfato em toda amenorreia primária sem telarca.","rac":"1) Sem telarca. 2) FSH e LH baixos: central. 3) Útero presente. 4) Anosmia. 5) Kallmann.","pista":"Anosmia desde sempre.","mud":"Sem anosmia, as hipóteses seriam atraso constitucional, mutação do receptor de GnRH ou lesão do SNC.","cmp":"FSH alto sem telarca: disgenesia gonadal. FSH baixo sem telarca: causa central.","arm":"Não perguntar sobre o olfato.","regra":"Sem mama, FSH baixo e sem olfato: Kallmann.","cf":"O tratamento envolve indução puberal com estrogênio em dose crescente e, para fertilidade futura, gonadotrofinas ou GnRH pulsátil.","fonte":"Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.7 (deficiência congênita de GnRH e síndrome de Kallmann) e tabela 8.3 (mama, útero e FSH)."}]},{"id":"M05","titulo":"Neoplasia do colo uterino","bloco":2,"grupo":"P","q":[{"n":1,"sub":"Oncoproteínas E6 e E7","eixo":"HPV e história natural","comp":"Explicar a carcinogênese pelo HPV","enun":"Em discussão sobre carcinogênese cervical, pergunta-se qual mecanismo molecular explica a transformação celular pelo HPV de alto risco. Qual alternativa está correta?","ops":[["A E6 degrada a p53 e a E7 inativa a pRb, levando à perda de apoptose e à proliferação descontrolada.","Correta: é o mecanismo central; a p16 superexpressa é marcador de infecção transformante."],["A E6 ativa a pRb e a E7 estimula a p53, bloqueando o ciclo celular do epitélio metaplásico.","Errada: o efeito é o oposto; as oncoproteínas inativam os supressores tumorais."],["O HPV é um vírus de RNA que se integra por transcriptase reversa ao genoma da célula basal.","Errada: o HPV é vírus de DNA; a integração do DNA viral é que favorece a progressão."],["A transformação depende apenas dos tipos 6 e 11, que causam verrugas e evoluem para carcinoma.","Errada: 6 e 11 são de baixo risco e não têm papel no rastreamento do câncer."]],"conc":"O HPV é vírus de DNA responsável por cerca de 95% das neoplasias cervicais. As oncoproteínas E6 (degrada p53) e E7 (inativa pRb) dos tipos de alto risco, somadas à integração viral e a cofatores como tabagismo e imunossupressão, levam à transformação.","rac":"1) Tipos de alto risco. 2) E6 contra p53: perde apoptose. 3) E7 contra pRb: libera E2F e proliferação. 4) Integração viral e cofatores. 5) Lesão precursora e câncer.","pista":"Pares E6-p53 e E7-pRb.","mud":"Se a pergunta fosse sobre verrugas genitais, a resposta envolveria os tipos 6 e 11.","cmp":"Alto risco (16, 18, 31, 33, 45...): câncer. Baixo risco (6, 11): verrugas.","arm":"Inverter as proteínas-alvo de E6 e E7.","regra":"E6 come p53; E7 tira a pRb.","cf":"A p16 positiva na imuno-histoquímica ajuda a classificar lesões duvidosas como de alto grau.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.2 (HPV e zona de transformação, complemento rotulado), slide 5 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":2,"sub":"Infecção transitória na jovem","eixo":"HPV e história natural","comp":"Aplicar a história natural do HPV ao aconselhamento","enun":"Uma mulher de 26 anos, com DNA-HPV positivo para tipo não 16/18 e citologia reflexa negativa, pergunta se 'vai ter câncer' e se o parceiro a traiu. Qual orientação reflete a história natural do HPV?","ops":[["É comum e quase sempre transitória; o risco está na persistência, que se acompanha.","Correta: o clareamento viral ocorre na maioria; 10 a 20% persistem, e só essas podem progredir."],["O resultado indica lesão pré-maligna que exige conização para impedir a evolução para câncer.","Errada: um teste positivo não é lesão; com citologia reflexa negativa, repete-se o DNA-HPV em 12 meses."],["O teste prova infecção recente e indica que houve contato sexual fora da relação atual.","Errada: a incubação vai de 3 meses a tempo indefinido e o vírus pode ficar indetectável; não indica infidelidade."],["A infecção é permanente e a vacina, aplicada agora, eliminará o vírus já presente.","Errada: a vacina não trata infecção existente e a maioria das infecções é transitória."]],"conc":"Colo normal, infecção, lesão precursora e câncer formam um processo com idas e vindas: clareamento em 80 a 90%, persistência em 10 a 20%. HPV não é sinal de promiscuidade ou infidelidade.","rac":"1) DNA-HPV positivo para outros tipos. 2) Citologia reflexa negativa. 3) Não há lesão. 4) Explicar transitoriedade. 5) Repetir o teste em 12 meses.","pista":"Pergunta sobre câncer e infidelidade diante de teste positivo.","mud":"Se a citologia reflexa mostrasse ASC-US ou mais, a conduta seria colposcopia.","cmp":"Infecção transitória: maioria. Persistente: minoria, mas é a que importa.","arm":"Comunicar teste positivo como diagnóstico de câncer ou como prova de traição.","regra":"HPV positivo é rastreamento, não diagnóstico.","cf":"Frases como 'você está com câncer' ou 'não deu nada' devem ser evitadas, como destaca o caso clínico da disciplina.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.3 (história natural) e 7.14 (comunicação), slides 5 e 9 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025), recomendação 8."},{"n":3,"sub":"Zona de transformação na pós-menopausa","eixo":"HPV e história natural","comp":"Relacionar a posição da JEC à visibilidade da zona de transformação","enun":"Mulher de 61 anos, menopausa aos 50, tem indicação de colposcopia. A junção escamocolunar não é vista e a zona de transformação tem componente endocervical não totalmente visível. Qual explicação e classificação são corretas?","ops":[["Interiorização fisiológica da JEC após a menopausa; zona de transformação tipo 3.","Correta: após a menopausa a JEC se interioriza no canal e a ZT pode ficar invisível (tipo 3)."],["Exteriorização da JEC por estímulo estrogênico; zona de transformação tipo 1.","Errada: a exteriorização (ectopia) ocorre na menacme, gestação e uso de contraceptivo."],["Lesão invasora obstruindo o canal; zona de transformação tipo 2.","Errada: a não visualização é fisiológica nessa idade, e tipo 2 significa componente endocervical totalmente visível."],["Erro de técnica colposcópica; repetir o exame sem preparo em 1 ano.","Errada: o achado é esperado; se necessário, estrogênio tópico prévio melhora a avaliação."]],"conc":"A zona de transformação é onde o HPV alcança a camada basal, pela metaplasia ativa. A JEC se exterioriza na menacme e gestação e se interioriza após a menopausa. Classificação IFCPC 2011: ZT1 ectocervical; ZT2 endocervical totalmente visível; ZT3 não totalmente visível.","rac":"1) Pós-menopausa. 2) JEC no canal. 3) Componente endocervical não visível. 4) ZT tipo 3. 5) Se houver lesão de alto grau, excisão tipo 3.","pista":"Componente endocervical não totalmente visível.","mud":"Numa mulher de 25 anos com ectopia, a ZT costuma ser tipo 1.","cmp":"ZT1: EZT tipo 1 (7 a 10 mm). ZT2: tipo 2 (10 a 15 mm). ZT3: tipo 3 (15 a 25 mm).","arm":"Atribuir à doença a interiorização fisiológica da JEC.","regra":"Menopausa: JEC entra no canal.","cf":"Na citologia reflexa insatisfatória por atrofia, indica-se colposcopia após estrogênio tópico.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.2, 7.8 (tipos de ZT, complemento IFCPC 2011) e 7.6 (pós-menopausa), slides 7 e 8 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":4,"sub":"DNA-HPV positivo para 16 ou 18","eixo":"Rastreio com DNA-HPV","comp":"Conduzir resultado de HPV 16/18 no rastreamento organizado","enun":"Mulher de 35 anos, risco-padrão, assintomática, faz rastreamento com teste de DNA-HPV oncogênico com genotipagem parcial: positivo para HPV 16. Pela diretriz do INCA de 2025, qual é a conduta?","ops":[["Encaminhar diretamente para colposcopia, sem necessidade de citologia.","Correta: HPV 16 e/ou 18 leva à colposcopia direta."],["Realizar citologia reflexa na mesma amostra e só encaminhar se houver ASC-US ou mais.","Errada: a citologia reflexa é a triagem para os outros tipos, não para 16/18."],["Repetir o DNA-HPV em 12 meses, porque a maioria das infecções é transitória.","Errada: 16 e 18 têm risco alto o suficiente para colposcopia imediata."],["Indicar conização diagnóstica, pelo alto potencial oncogênico do HPV 16.","Errada: o tratamento depende da colposcopia e da histologia, não do tipo viral."]],"conc":"No rastreamento organizado (INCA 2025), o teste primário é o DNA-HPV oncogênico com genotipagem. HPV 16/18: colposcopia direta. Outros tipos: citologia reflexa. Não detectado: repetir em 5 anos.","rac":"1) Risco-padrão, 35 anos. 2) HPV 16. 3) Colposcopia direta.","pista":"Genotipagem com HPV 16.","mud":"Se o resultado fosse HPV 31, a conduta seria citologia reflexa.","cmp":"16/18: colposcopia. Outros: citologia reflexa. Negativo: 5 anos.","arm":"Triar com citologia um resultado 16/18.","regra":"16 ou 18: vá à colposcopia.","cf":"Se a colposcopia não mostrar doença, repete-se o DNA-HPV em 12 meses.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (conduta pelo resultado; Figura 1 da diretriz = slide 31) da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":5,"sub":"HPV não 16/18 com citologia prévia normal","eixo":"Rastreio com DNA-HPV","comp":"Aplicar a triagem por citologia reflexa mesmo com citologia anterior normal","enun":"Mulher de 46 anos, assintomática, risco-padrão, faz rastreamento com DNA-HPV: positivo para HPV 51. Mostra uma citologia normal feita há 1 ano em outro serviço. Qual é a conduta inicial?","ops":[["Citologia reflexa na mesma amostra do DNA-HPV.","Correta: o resultado atual precisa de triagem; a citologia anterior não a substitui (questão ENAMED 2026 do caso da disciplina)."],["Colposcopia direta, porque o HPV 51 é de alto risco oncogênico.","Errada: colposcopia direta é para 16/18 ou para imunossuprimidas."],["Repetir o DNA-HPV em 12 meses, porque a citologia do último ano foi normal.","Errada: repetir em 12 meses só depois de uma citologia reflexa negativa."],["Vacinar contra HPV e repetir o rastreamento em 5 anos.","Errada: a vacina não trata infecção existente nem altera o rastreamento."]],"conc":"Para HPV de alto risco não 16/18, o laboratório realiza citologia reflexa na mesma amostra. ASC-US ou mais (ou insatisfatória): colposcopia. Negativa: repetir DNA-HPV em 12 meses.","rac":"1) HPV 51: outros tipos. 2) Triagem: citologia reflexa. 3) Citologia antiga não vale para o resultado atual. 4) Conduta depende da reflexa.","pista":"HPV 51 com citologia antiga normal.","mud":"Se a mulher fosse imunossuprimida, o HPV 51 já indicaria colposcopia direta.","cmp":"Citologia como rastreamento primário (modelo antigo) x citologia como triagem reflexa (modelo DNA-HPV).","arm":"Usar a citologia do ano anterior para dispensar a triagem.","regra":"HPV não 16/18: citologia reflexa.","cf":"Se a reflexa vier ASC-US, a conduta passa a ser colposcopia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (padrão de prova e conduta pelo resultado) e erros frequentes; caso clínico da disciplina (rastreamento de neoplasia de colo uterino, questão ENAMED 2026); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":6,"sub":"Outros tipos com citologia reflexa negativa","eixo":"Rastreio com DNA-HPV","comp":"Conduzir o seguimento após triagem negativa","enun":"Mulher de 38 anos, risco-padrão, DNA-HPV positivo para outros tipos (não 16/18), com citologia reflexa negativa. Qual é a conduta segundo o INCA 2025?","ops":[["Repetir o DNA-HPV em 12 meses.","Correta: com citologia reflexa negativa, repete-se o teste molecular em 12 meses."],["Colposcopia imediata, pela positividade para HPV oncogênico.","Errada: a colposcopia só é indicada se a reflexa for ASC-US ou mais, insatisfatória ou se houver persistência de 24 meses."],["Voltar ao intervalo de 5 anos, já que a citologia foi normal.","Errada: o intervalo de 5 anos é para teste não detectado ou repetição negativa."],["Repetir a citologia em 6 meses e manter o rastreamento citológico trienal.","Errada: onde o DNA-HPV foi implantado, a citologia como rastreamento primário é interrompida."]],"conc":"Após citologia reflexa negativa, repete-se o DNA-HPV em 12 meses. Se negativo, volta-se ao intervalo de 5 anos; se positivo para 16/18, colposcopia; se ainda positivo para outros com citologia negativa, repetir mais 12 meses.","rac":"1) Outros tipos. 2) Reflexa negativa. 3) Repetir em 12 meses. 4) Decidir pelo novo resultado.","pista":"Citologia reflexa negativa.","mud":"Se a reflexa fosse insatisfatória, a conduta seria colposcopia.","cmp":"Reflexa negativa: DNA-HPV em 12 meses. Reflexa ASC-US+: colposcopia.","arm":"Encaminhar à colposcopia todo HPV positivo.","regra":"Reflexa negativa: novo DNA-HPV em 1 ano.","cf":"Persistência de outros tipos aos 24 meses leva à colposcopia independentemente da citologia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (tabela de conduta pelo resultado; slide 31) da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":7,"sub":"Persistência de 24 meses","eixo":"Rastreio com DNA-HPV","comp":"Reconhecer a persistência como indicação de colposcopia","enun":"Mulher de 41 anos, risco-padrão, teve DNA-HPV positivo para outros tipos há 24 meses e há 12 meses, ambos com citologia reflexa negativa. O teste atual é novamente positivo para outros tipos, com citologia reflexa negativa. Qual é a conduta?","ops":[["Colposcopia, pela persistência do HPV por 24 meses, independentemente da citologia.","Correta: positivo para outros tipos aos 24 meses indica colposcopia."],["Repetir o DNA-HPV em mais 12 meses, porque a citologia segue negativa.","Errada: a repetição em 12 meses acontece só uma vez antes dos 24 meses."],["Voltar ao rastreamento de 5 anos, porque três citologias foram negativas.","Errada: a persistência viral é o fator de risco que define a conduta."],["Indicar EZT tipo 1 sem biópsia prévia, pelo risco acumulado.","Errada: o tratamento exige colposcopia e confirmação histológica."]],"conc":"A persistência do HPV é o que leva à lesão. No fluxo do INCA, a positividade para outros tipos que persiste aos 24 meses indica colposcopia mesmo com citologias negativas.","rac":"1) Três testes positivos em 24 meses. 2) Persistência. 3) Colposcopia.","pista":"Positividade mantida aos 24 meses.","mud":"Se o teste atual fosse negativo, ela voltaria ao intervalo de 5 anos.","cmp":"Persistência de 12 meses com citologia negativa: repetir. Persistência de 24 meses: colposcopia.","arm":"Confiar indefinidamente na citologia negativa.","regra":"HPV que não vai embora em 2 anos merece colposcopia.","cf":"Se a persistência fosse do HPV 18, a colposcopia já teria sido indicada no primeiro teste.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (repetição positiva para outros tipos) e algoritmo 9.1 (nota 7, persistência de 24 meses); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":8,"sub":"Encerramento do rastreamento","eixo":"Rastreio com DNA-HPV","comp":"Saber quando encerrar o rastreamento com DNA-HPV","enun":"Mulher de 61 anos, risco-padrão, sem história de NIC de alto grau, faz DNA-HPV com resultado não detectado. Qual é a orientação sobre o rastreamento?","ops":[["Encerrar o rastreamento, pois um teste negativo após os 60 anos libera a mulher.","Correta: o próximo teste cairia após os 64 anos; o teste negativo após os 60 encerra o rastreamento."],["Repetir o DNA-HPV aos 66 anos, mantendo o intervalo de 5 anos.","Errada: a população-alvo vai até 64 anos e o teste negativo após os 60 encerra."],["Manter citologia anual até os 70 anos, pela maior incidência após a menopausa.","Errada: não há indicação de citologia anual e o rastreamento não segue até os 70 anos."],["Fazer coteste com citologia agora para confirmar o resultado negativo.","Errada: o coteste não é recomendado no novo modelo."]],"conc":"População-alvo de risco-padrão: 25 a 64 anos, intervalo de 5 anos após teste negativo. Encerra-se quando o último teste após os 60 anos é negativo. Tratadas por NIC 2, NIC 3 ou AIS seguem por 25 anos após o tratamento.","rac":"1) 61 anos. 2) Teste negativo. 3) Próximo seria aos 66. 4) Fora da faixa. 5) Encerrar.","pista":"Teste negativo depois dos 60 anos.","mud":"Se ela tivesse sido tratada por NIC 3 aos 50 anos, o rastreamento seguiria até os 75.","cmp":"Modelo DNA-HPV: encerra com teste negativo após os 60. Modelo citológico 2016: aos 64 com 2 exames negativos nos últimos 5 anos.","arm":"Parar o rastreamento automaticamente aos 60 sem teste.","regra":"Negativo depois dos 60: encerra.","cf":"Uma mulher de 62 anos que nunca fez rastreamento deve fazer um teste e, se negativo, encerrar.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (quando parar), slide 33 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":9,"sub":"Rastreamento na mulher com HIV","eixo":"Rastreio: populações especiais","comp":"Adaptar o rastreamento à imunossupressão","enun":"Mulher de 22 anos vivendo com HIV, em terapia antirretroviral, com início da vida sexual aos 16 anos, nunca foi rastreada. Faz DNA-HPV: positivo para HPV 39. Qual é a conduta?","ops":[["Colposcopia direta, como para qualquer HPV oncogênico na imunossupressão.","Correta: em HIV e outras
