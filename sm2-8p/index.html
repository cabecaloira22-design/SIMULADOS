imunossupressões não há triagem por citologia reflexa."],["Desconsiderar o resultado e iniciar o rastreamento aos 25 anos, como no risco-padrão.","Errada: a imunossuprimida inicia o rastreamento após o início da atividade sexual, sem idade mínima."],["Citologia reflexa e colposcopia só se houver ASC-US ou mais.","Errada: essa triagem vale para a imunocompetente."],["Repetir o DNA-HPV em 5 anos, se a citologia reflexa for negativa.","Errada: o intervalo da imunossuprimida é de 3 anos após teste negativo, e o resultado positivo exige colposcopia."]],"conc":"Na mulher com HIV ou outra imunossupressão: iniciar após o início da atividade sexual, intervalo de 3 anos após teste negativo, qualquer tipo de HPV leva à colposcopia e não se encerra o rastreamento.","rac":"1) Imunossuprimida. 2) Já tem atividade sexual. 3) HPV 39 positivo. 4) Colposcopia direta.","pista":"Mulher vivendo com HIV.","mud":"Numa imunocompetente de 22 anos, o teste seria desconsiderado e o rastreamento iniciaria aos 25.","cmp":"Risco-padrão: 25 a 64, 5 anos. HIV: após sexarca, 3 anos, sem término.","arm":"Aplicar o protocolo da população geral à imunossuprimida.","regra":"Imunossuprimida: qualquer HPV vai à colposcopia.","cf":"Essa paciente também tem indicação de vacina HPV em 3 doses (9 a 45 anos).","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.6 (situações especiais) e tabela 8.2; Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025)."},{"n":10,"sub":"Teste antes dos 25 anos","eixo":"Rastreio: populações especiais","comp":"Evitar o rastreamento e o tratamento desnecessários na jovem","enun":"Mulher de 21 anos, risco-padrão, assintomática, fez DNA-HPV por iniciativa própria: positivo para HPV 16. Exame especular normal. Segundo o INCA 2025, qual é a conduta?","ops":[["Desconsiderar o resultado e iniciar o rastreamento aos 25 anos.","Correta: antes dos 25 anos o resultado é desconsiderado no risco-padrão."],["Colposcopia imediata, porque o HPV 16 leva à colposcopia direta em qualquer idade.","Errada: a regra do HPV 16/18 vale dentro da população-alvo, a partir dos 25 anos."],["Citologia reflexa e, se negativa, repetir o DNA-HPV em 12 meses.","Errada: o rastreamento não é feito antes dos 25 anos no risco-padrão."],["Conização diagnóstica, pelo risco de lesão glandular oculta associada ao HPV 16.","Errada: o tratamento excisional desnecessário aumenta o risco de parto prematuro."]],"conc":"Não se rastreia antes dos 25 anos no risco-padrão: a infecção é muito frequente e transitória, e tratar lesões que regrediriam aumenta prematuridade, rotura prematura de membranas e mortalidade perinatal. Testes feitos por engano são desconsiderados.","rac":"1) 21 anos, risco-padrão. 2) Fora da população-alvo. 3) Desconsiderar. 4) Orientar. 5) Iniciar aos 25.","pista":"Idade abaixo de 25 anos sem imunossupressão.","mud":"Se a jovem tivesse sinusorragia ou lesão visível, não seria rastreamento: examinar e biopsiar.","cmp":"Rastreamento (assintomática): segue o fluxo. Sintomática ou lesão visível: investigação diagnóstica.","arm":"Aplicar a regra do HPV 16 fora da faixa etária.","regra":"Antes dos 25 (risco-padrão), não rastreie e não trate por rastreamento.","cf":"A excisão do colo aumenta o risco de parto pré-termo (RR em torno de 1,8 antes de 37 semanas).","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.6 (menores de 25 testadas por engano) e módulo 7.9 (por que não tratar demais); Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero, INCA, 2025 (Portaria Conjunta SAES/SECTICS nº 13/2025), recomendação 9."},{"n":11,"sub":"ASC-US no modelo citológico","eixo":"Conduta por resultado citológico","comp":"Aplicar a conduta por idade no ASC-US","enun":"Em município onde o DNA-HPV ainda não foi implantado (rastreamento citológico pelas Diretrizes INCA 2016), mulher de 34 anos tem citologia com ASC-US. Qual é a conduta inicial?","ops":[["Repetir a citologia em 6 meses.","Correta: a partir dos 30 anos, ASC-US leva à repetição em 6 meses."],["Repetir a citologia em 12 meses.","Errada: 12 meses é a conduta entre 25 e 29 anos."],["Encaminhar para colposcopia imediata.","Errada: a colposcopia é indicada se a repetição persistir alterada."],["Repetir a citologia em 3 anos.","Errada: 3 anos é a conduta para menores de 25 anos."]],"conc":"No modelo citológico (INCA 2016): ASC-US repete em 3 anos se menor de 25, em 12 meses entre 25 e 29 e em 6 meses a partir de 30. Persistindo alterada, colposcopia; dois exames negativos consecutivos, rotina.","rac":"1) Modelo citológico declarado. 2) ASC-US. 3) 34 anos. 4) Repetir em 6 meses.","pista":"Idade acima de 30 anos no ASC-US.","mud":"No modelo DNA-HPV, ASC-US na citologia reflexa já indica colposcopia.","cmp":"ASC-US: menor de 25, 3 anos; 25 a 29, 12 meses; 30 ou mais, 6 meses.","arm":"Misturar as regras do modelo citológico e do DNA-HPV.","regra":"No ASC-US, o tempo de repetição encurta com a idade.","cf":"Na mesma mulher, uma segunda citologia com ASC-US em 6 meses levaria à colposcopia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.7 (tabela de conduta no modelo citológico, Diretrizes INCA 2016, complemento rotulado e marcado para conferência), slides 19 a 24 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":12,"sub":"LSIL na adolescente e na jovem","eixo":"Conduta por resultado citológico","comp":"Conduzir LSIL conforme a idade","enun":"Pelas Diretrizes INCA 2016 (modelo citológico), mulher de 23 anos, iniciada no rastreamento por erro de agendamento, tem citologia com LSIL. Qual é a conduta?","ops":[["Repetir a citologia em 3 anos.","Correta: abaixo de 25 anos, LSIL é acompanhado com repetição em 3 anos, pela alta taxa de regressão."],["Repetir a citologia em 6 meses.","Errada: 6 meses é a conduta para LSIL a partir dos 25 anos."],["Encaminhar para colposcopia com biópsia.","Errada: na jovem, o LSIL reflete infecção transitória e não exige colposcopia inicial."],["Realizar EZT tipo 1 pela técnica 'ver e tratar'.","Errada: 'ver e tratar' se aplica a HSIL a partir dos 25 anos, nunca a LSIL na jovem."]],"conc":"LSIL expressa infecção pelo HPV com alta chance de regressão. No modelo citológico: menor de 25, repetir em 3 anos; 25 anos ou mais, repetir em 6 meses.","rac":"1) LSIL. 2) 23 anos. 3) Alta regressão. 4) Repetir em 3 anos.","pista":"LSIL antes dos 25 anos.","mud":"Com 27 anos, a repetição seria em 6 meses.","cmp":"LSIL: acompanhar. HSIL: colposcopia.","arm":"Tratar LSIL de jovem.","regra":"LSIL em jovem: paciência.","cf":"Se a biópsia de uma lesão de baixo grau mostrar NIC 1, também se acompanha, pois cerca de 60% regride.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.7 (tabela do modelo citológico, Diretrizes INCA 2016, complemento rotulado) e módulo 7.3 (história natural)."},{"n":13,"sub":"ASC-H","eixo":"Conduta por resultado citológico","comp":"Reconhecer ASC-H como indicação de colposcopia","enun":"Pelas Diretrizes INCA 2016 (modelo citológico), mulher de 28 anos tem citologia com células escamosas atípicas, não sendo possível excluir lesão de alto grau (ASC-H). Qual é a conduta?","ops":[["Encaminhar para colposcopia.","Correta: ASC-H leva à colposcopia em qualquer idade, por não excluir lesão de alto grau."],["Repetir a citologia em 12 meses.","Errada: repetir é conduta de ASC-US entre 25 e 29 anos, não de ASC-H."],["Repetir a citologia em 6 meses após tratar a inflamação.","Errada: o risco de lesão de alto grau impede a simples repetição."],["Realizar histerectomia simples por risco de lesão oculta.","Errada: a conduta é diagnóstica, não terapêutica radical."]],"conc":"ASC-H significa que não se pode excluir lesão de alto grau. A conduta é colposcopia, independentemente da idade, como no HSIL.","rac":"1) ASC-H. 2) Pode haver HSIL. 3) Colposcopia com biópsia dirigida.","pista":"A letra H de 'high grade' no laudo.","mud":"ASC-US no mesmo contexto levaria à repetição em 12 meses.","cmp":"ASC-US: indeterminado, provavelmente baixo grau. ASC-H: não exclui alto grau.","arm":"Tratar ASC-H como ASC-US.","regra":"ASC-H vai à colposcopia.","cf":"No modelo DNA-HPV, qualquer ASC-US ou mais na citologia reflexa já leva à colposcopia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.7 (tabela do modelo citológico, Diretrizes INCA 2016, complemento rotulado), slides 23 e 24 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":14,"sub":"Atipias glandulares","eixo":"Conduta por resultado citológico","comp":"Investigar canal e endométrio na AGC","enun":"Pelas Diretrizes INCA 2016 (modelo citológico), mulher de 44 anos com sangramento intermenstrual tem citologia com células glandulares atípicas de significado indeterminado. Qual investigação é a adequada?","ops":[["Colposcopia com avaliação do canal endocervical e investigação do endométrio.","Correta: AGC exige colposcopia e avaliação do canal; a partir dos 35 anos ou com sangramento anormal, também do endométrio."],["Repetir a citologia em 6 meses, como no ASC-US após os 30 anos.","Errada: atipias glandulares nunca são conduzidas com repetição simples."],["Colposcopia isolada, sem investigação endometrial, por se tratar de lesão cervical.","Errada: a origem pode ser endometrial; com 44 anos e sangramento, o endométrio deve ser avaliado."],["Conização a frio imediata, sem colposcopia prévia.","Errada: a investigação começa pela colposcopia e avaliação do canal e do endométrio."]],"conc":"Atipias glandulares podem vir do endocérvix, do endométrio ou de fora do útero. A investigação inclui colposcopia, avaliação do canal e, a partir dos 35 anos ou com sangramento anormal, do endométrio por ultrassonografia ou biópsia.","rac":"1) AGC. 2) Origem possível cervical ou endometrial. 3) 44 anos com sangramento. 4) Colposcopia, canal e endométrio.","pista":"Atipia glandular com sangramento em mulher acima de 35 anos.","mud":"Numa mulher de 28 anos sem sangramento, a avaliação endometrial não seria obrigatória.","cmp":"Lesão escamosa: foco no colo. Lesão glandular: colo, canal e endométrio.","arm":"Avaliar só o colo diante de atipia glandular.","regra":"AGC: olhe também o canal e o endométrio.","cf":"O DNA-HPV detecta mais precursores de adenocarcinoma que a citologia, uma das vantagens do novo modelo.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.7 (tabela do modelo citológico, Diretrizes INCA 2016, complemento rotulado) e tabela 8.1."},{"n":15,"sub":"Teste de Schiller","eixo":"Colposcopia","comp":"Interpretar a nomenclatura do teste de Schiller","enun":"Na colposcopia, após aplicação de lugol, uma área do colo permanece amarelo-mostarda enquanto o restante do epitélio cora em castanho. Como esse achado é nomeado e interpretado?","ops":[["Teste de Schiller positivo: área iodo-negativa, sem glicogênio, suspeita de lesão.","Correta: o iodo cora o glicogênio do epitélio maduro; a área que não cora é Schiller positivo."],["Teste de Schiller negativo: área iodo-negativa, padrão normal do epitélio escamoso.","Errada: o epitélio normal cora em castanho; o achado é positivo, não negativo."],["Epitélio acetobranco denso, típico de lesão de alto grau.","Errada: acetobranco é efeito do ácido acético, não do lugol."],["Vasos atípicos, sugestivos de carcinoma invasor.","Errada: vasos atípicos são achado vascular, não reação ao iodo."]],"conc":"O lugol cora o glicogênio do epitélio escamoso maduro. Lesões têm pouco glicogênio e ficam iodo-negativas: Schiller positivo. O ácido acético torna brancas as áreas de alta densidade nuclear (acetobranco).","rac":"1) Lugol aplicado. 2) Área não cora. 3) Sem glicogênio. 4) Schiller positivo. 5) Suspeita: biopsiar.","pista":"Área amarelo-mostarda após o lugol.","mud":"Se a pergunta fosse sobre o ácido acético, o achado seria o epitélio acetobranco.","cmp":"Ácido acético: acetobranco (densidade nuclear). Lugol: iodo-negativo (falta de glicogênio).","arm":"Achar que Schiller positivo é a área que cora bem.","regra":"Schiller positivo = não corou = suspeito.","cf":"Quanto mais denso, rápido e persistente o acetobranco, maior o grau da lesão.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.8 (colposcopia: ácido acético e lugol) e erros frequentes, slides 36 a 41 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":16,"sub":"Achados colposcópicos e histologia","eixo":"Colposcopia","comp":"Correlacionar achados colposcópicos com a histologia provável","enun":"Colposcopia de mulher de 36 anos encaminhada por HPV 18: após ácido acético, epitélio acetobranco denso de aparecimento rápido com mosaico grosseiro e pontilhado grosseiro; não há vasos atípicos. Qual é a histologia mais provável?","ops":[["Lesão intraepitelial de alto grau (NIC 2/3).","Correta: acetobranco denso com mosaico e pontilhado grosseiros correspondem a HSIL."],["Metaplasia escamosa imatura.","Errada: a metaplasia dá acetobranco tênue e mosaico regular."],["Lesão de baixo grau (NIC 1).","Errada: a LSIL tem mosaico fino e regular."],["Carcinoma invasor.","Errada: o achado típico do invasor são os vasos atípicos, ausentes aqui."]],"conc":"Achados colposcópicos: acetobranco tênue e mosaico regular (metaplasia); mosaico fino (LSIL); acetobranco denso, mosaico e pontilhado grosseiros (HSIL); vasos atípicos (carcinoma invasor). O diagnóstico definitivo é histológico.","rac":"1) Acetobranco denso. 2) Mosaico e pontilhado grosseiros. 3) Sem vasos atípicos. 4) HSIL provável. 5) Biópsia dirigida.","pista":"Padrões grosseiros sem vasos atípicos.","mud":"Vasos atípicos mudariam a hipótese para carcinoma invasor.","cmp":"Fino e regular: baixo grau. Grosseiro: alto grau. Vasos atípicos: invasão.","arm":"Fechar diagnóstico sem histologia.","regra":"Grosseiro é alto grau.","cf":"Se a ZT for tipo 1 ou 2 com achado compatível e sem suspeita de invasão, pode-se considerar 'ver e tratar' com EZT.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.8 (tabela de achados colposcópicos), slides 39 a 41 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":17,"sub":"Tipos de zona de transformação","eixo":"Colposcopia","comp":"Classificar a ZT e escolher a profundidade da excisão","enun":"Mulher de 39 anos com biópsia de NIC 3. Na colposcopia, a zona de transformação tem componente endocervical, mas o limite superior é totalmente visível com o espéculo endocervical. Qual é o tipo de ZT e de excisão?","ops":[["ZT tipo 2; EZT tipo 2, com profundidade de 10 a 15 mm.","Correta: componente endocervical totalmente visível define ZT 2, tratada com EZT tipo 2."],["ZT tipo 1; EZT tipo 1, com profundidade de 7 a 10 mm.","Errada: a ZT 1 é totalmente ectocervical."],["ZT tipo 3; conização, com profundidade de 15 a 25 mm.","Errada: a ZT 3 tem componente endocervical não totalmente visível."],["ZT tipo 2; histerectomia simples, por se tratar de NIC 3.","Errada: NIC 3 se trata com excisão da zona de transformação, preservando o útero."]],"conc":"IFCPC 2011: ZT1 ectocervical (EZT 1, 7 a 10 mm); ZT2 endocervical totalmente visível (EZT 2, 10 a 15 mm); ZT3 endocervical não totalmente visível (EZT 3 = conização, 15 a 25 mm).","rac":"1) Componente endocervical. 2) Totalmente visível. 3) ZT 2. 4) EZT 2.","pista":"Componente endocervical totalmente visível.","mud":"Se o limite superior não fosse visto, seria ZT 3, com EZT tipo 3.","cmp":"Quanto mais profunda a ZT, mais profunda a excisão e maior o impacto obstétrico.","arm":"Usar a mesma profundidade para todas as ZT.","regra":"O tipo de ZT define o tipo de excisão.","cf":"Excisões mais profundas aumentam o risco de parto prematuro em gestações futuras.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.8 (tipos de ZT, IFCPC 2011) e 7.9 (tabela EZT), slides 43 e 44 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":18,"sub":"NIC 1 na biópsia","eixo":"NIC e tratamento","comp":"Conduzir a NIC 1 de forma conservadora","enun":"Mulher de 29 anos, encaminhada por HPV 18, tem colposcopia com mosaico fino e biópsia dirigida mostrando NIC 1. Qual é a conduta?","ops":[["Seguimento, sem tratamento excisional, pela alta taxa de regressão.","Correta: a NIC 1 regride em cerca de 60% e é, na prática, marcador de infecção."],["EZT tipo 1, porque o HPV 18 associa-se a adenocarcinoma.","Errada: o tipo viral não muda a conduta diante de NIC 1 na histologia."],["Conização a frio, para avaliar as margens endocervicais.","Errada: a NIC 1 não exige excisão."],["Histerectomia simples, se não houver desejo reprodutivo.","Errada: é tratamento desproporcional para lesão que regride espontaneamente."]],"conc":"História natural: NIC 1 regride em cerca de 60%, persiste em 25% e progride em cerca de 11% para NIC 2/3. Acompanha-se. NIC 2 é zona cinzenta (conservadora em jovens selecionadas); NIC 3 é precursor verdadeiro e se trata.","rac":"1) Biópsia NIC 1. 2) Alta regressão. 3) Seguimento. 4) Evitar dano ao colo.","pista":"Histologia de NIC 1.","mud":"NIC 3 na biópsia indicaria excisão da zona de transformação.","cmp":"NIC 1: acompanhar. NIC 2: zona cinzenta. NIC 3: tratar.","arm":"Excisar NIC 1.","regra":"NIC 1 se acompanha.","cf":"Na NIC 2 em mulher de 24 anos com desejo de gestar, a conduta conservadora pode ser considerada.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.3 (história natural das lesões precursoras) e erros frequentes, slides 11 a 13 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":19,"sub":"Ver e tratar","eixo":"NIC e tratamento","comp":"Identificar as condições para 'ver e tratar' com EZT","enun":"Mulher de 32 anos com citologia de HSIL. Na colposcopia, ZT tipo 1, achado maior compatível com a citologia, sem vasos atípicos nem achados glandulares. Qual é a conduta possível no mesmo atendimento?","ops":[["EZT ('ver e tratar'), dispensando a biópsia prévia.","Correta: a partir dos 25 anos, com ZT 1 ou 2, achado compatível e sem suspeita de invasão ou doença glandular, pode-se 'ver e tratar'."],["Repetir a citologia em 6 meses para confirmar o laudo.","Errada: HSIL não se conduz com repetição."],["Histerectomia radical, pelo risco de lesão invasora oculta.","Errada: não há suspeita de invasão; a cirurgia radical é para câncer."],["Aguardar a regressão espontânea por 2 anos, como na NIC 1.","Errada: HSIL tem risco real de progressão e deve ser tratado."]],"conc":"No HSIL, a colposcopia é obrigatória. Com 25 anos ou mais, ZT 1 ou 2, achado compatível e sem suspeita de invasão ou doença glandular, a EZT pode ser feita no mesmo ato. A excisão é preferida à destruição porque fornece diagnóstico.","rac":"1) HSIL na citologia. 2) Idade acima de 25. 3) ZT 1. 4) Achado compatível, sem suspeita de invasão. 5) Ver e tratar.","pista":"HSIL com ZT 1 e achado compatível.","mud":"Com vasos atípicos, a conduta seria biópsia e investigação de câncer invasor, não EZT.","cmp":"Excisão: trata e diagnostica. Destruição: trata, sem peça para histologia.","arm":"Fazer 'ver e tratar' em menores de 25 anos ou com suspeita de invasão.","regra":"HSIL com colposcopia compatível: pode tratar no mesmo ato.","cf":"Após a excisão por NIC 2 ou mais, a mulher tem indicação de vacina HPV em 3 doses.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.7 (HSIL: ver e tratar) e 7.9 (objetivos do tratamento), slide 42 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":20,"sub":"Impacto obstétrico da excisão","eixo":"NIC e tratamento","comp":"Pesar o risco obstétrico ao indicar excisão","enun":"Mulher de 24 anos, nuligesta, desejo de engravidar em breve, tem biópsia de NIC 2 com ZT tipo 1, sem suspeita de invasão. Por que a conduta conservadora pode ser considerada nesse caso?","ops":[["Regressão frequente da NIC 2 na jovem e risco obstétrico da excisão.","Correta: a NIC 2 regride em cerca de 66% abaixo dos 30 anos, e a excisão eleva o risco de prematuridade."],["NIC 2 nunca progride para câncer, portanto não exige seguimento.","Errada: cerca de 19% progride; por isso a conduta conservadora exige seguimento estreito."],["A conização trata a NIC 2 sem nenhum efeito sobre gestações futuras.","Errada: a excisão aumenta risco de parto pré-termo e rotura prematura de membranas."],["A vacina HPV aplicada agora cura a NIC 2 e substitui o tratamento.","Errada: a vacina não trata lesão existente."]],"conc":"NIC 2 é zona cinzenta: regride em cerca de 55% (66% abaixo de 30 anos). A excisão aumenta o risco de parto prematuro (RR cerca de 1,8 abaixo de 37 semanas), rotura prematura de membranas e mortalidade perinatal. Em jovens selecionadas, o seguimento pode ser preferido.","rac":"1) NIC 2. 2) 24 anos. 3) Desejo reprodutivo. 4) Alta regressão. 5) Excisão com custo obstétrico. 6) Conduta conservadora com seguimento.","pista":"NIC 2 em jovem que deseja engravidar.","mud":"Com NIC 3, o tratamento excisional seria indicado mesmo na jovem.","cmp":"NIC 2 em jovem: conservadora possível. NIC 3: tratar.","arm":"Indicar excisão automática de toda NIC 2.","regra":"Em jovem, poupe o colo quando a histologia permite.","cf":"Esse cuidado também justifica não rastrear antes dos 25 anos no risco-padrão.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.3 (história natural: NIC 2) e 7.9 (por que não tratar demais); Diretrizes INCA 2025, fundamentação da recomendação 9."},{"n":21,"sub":"Seguimento após tratamento de NIC 3","eixo":"Seguimento pós-tratamento","comp":"Manter o rastreamento após tratamento de lesão de alto grau","enun":"Mulher de 62 anos foi tratada com EZT por NIC 3 aos 49 anos, com seguimento posterior negativo. Pergunta se pode parar o rastreamento, já que passou dos 60 anos. Qual é a orientação segundo o INCA 2025?","ops":[["Manter o rastreamento por 25 anos após o tratamento.","Correta: tratadas por NIC 2, NIC 3 ou AIS mantêm o rastreamento por 25 anos após o tratamento."],["Encerrar, porque um teste negativo após os 60 anos libera qualquer mulher.","Errada: essa regra vale para o risco-padrão sem história de NIC de alto grau."],["Encerrar, porque o tratamento excisional elimina o risco futuro.","Errada: o risco persiste por décadas após o tratamento de lesão de alto grau."],["Fazer citologia anual por toda a vida, em vez do DNA-HPV.","Errada: o seguimento é feito com o teste molecular, sem citologia anual indefinida."]],"conc":"Histórico de HSIL ou mais grave mantém o rastreamento por 25 anos após o tratamento, mesmo depois dos 60. Para risco-padrão, encerra-se com teste negativo após os 60.","rac":"1) NIC 3 tratada aos 49. 2) 25 anos depois: 74. 3) Manter até lá.","pista":"Antecedente de NIC 3 tratada.","mud":"Sem antecedente de NIC 2+, um teste negativo aos 62 encerraria o rastreamento.","cmp":"Risco-padrão: até 64 anos. Tratada por NIC 2+: 25 anos após o tratamento.","arm":"Aplicar o encerramento aos 60 anos a quem teve lesão de alto grau.","regra":"Teve NIC 2+? Mais 25 anos de rastreamento.","cf":"Se essa mulher fosse histerectomizada por NIC 3, o rastreamento seria feito por coleta vaginal pelo mesmo período.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.5 (quando parar), slide 33 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes INCA 2025."},{"n":22,"sub":"Histerectomia e rastreamento","eixo":"Seguimento pós-tratamento","comp":"Decidir o rastreamento após histerectomia conforme a indicação","enun":"Duas mulheres de 50 anos foram histerectomizadas (histerectomia total). A primeira por miomatose, com exames de rastreamento sempre normais; a segunda por NIC 3 persistente. Qual orientação está correta?","ops":[["A primeira pode parar; a segunda segue com coleta vaginal por 25 anos.","Correta: histerectomia por doença benigna sem NIC de alto grau permite sair; por lesão precursora exige seguimento prolongado."],["Ambas podem sair do rastreamento, porque não têm mais colo uterino.","Errada: a lesão do HPV pode recidivar na cúpula vaginal de quem teve NIC 3."],["Ambas devem manter o rastreamento de 5 em 5 anos até os 64 anos.","Errada: a primeira não precisa de rastreamento, e a segunda tem seguimento mais longo que 64 anos."],["A primeira deve manter citologia anual e a segunda, apenas exame clínico.","Errada: a lógica é a inversa."]],"conc":"Histerectomia total por doença benigna, sem história de NIC de alto grau e com exames normais, permite sair do rastreamento. Histerectomia por lesão precursora ou câncer exige rastreamento por coleta vaginal por 25 anos ou mais.","rac":"1) Separar a indicação da histerectomia. 2) Benigna sem NIC: sai. 3) Por NIC 3: mantém coleta vaginal.","pista":"Indicação da histerectomia.","mud":"Se a histerectomia por mioma tivesse sido subtotal, com colo preservado, o rastreamento continuaria.","cmp":"Sem colo e sem história de alto grau: sai. Com história de alto grau: segue.","arm":"Liberar toda histerectomizada.","regra":"Histerectomia por NIC: o rastreamento continua na vagina.","cf":"Mulheres sem história de atividade sexual também não são rastreadas.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.6 (tabela de situações especiais); Diretrizes INCA 2025."},{"n":23,"sub":"Esquema de rotina no PNI","eixo":"Vacinação contra HPV","comp":"Conhecer a indicação de rotina da vacina HPV no SUS","enun":"Mãe leva o filho de 11 anos à unidade de saúde e pergunta sobre a vacina contra HPV. Segundo o PNI 2026 apresentado em aula, qual é a orientação?","ops":[["Vacina quadrivalente em dose única, indicada para meninas e meninos de 9 a 14 anos.","Correta: desde 2024 o Brasil adota dose única na rotina de 9 a 14 anos, para ambos os sexos."],["Duas doses com intervalo de 6 meses, só para meninas de 9 a 14 anos.","Errada: a rotina inclui meninos, em dose única."],["Três doses aos 0, 2 e 6 meses, a partir dos 15 anos.","Errada: três doses são para grupos especiais, como imunodeprimidos."],["Vacina nonavalente em duas doses, disponível no SUS para todas as idades.","Errada: a vacina do SUS é a quadrivalente (6, 11, 16 e 18)."]],"conc":"A vacina do SUS é a quadrivalente (HPV 6, 11, 16, 18), idealmente antes do início da vida sexual. Rotina: 9 a 14 anos, dose única, meninas e meninos. Resgate de 15 a 19 anos nunca vacinados (até 31/12/2026, segundo o slide).","rac":"1) Menino de 11 anos. 2) Faixa de rotina. 3) Dose única quadrivalente.","pista":"Idade de 11 anos.","mud":"Se o menino fosse imunodeprimido, o esquema seria de 3 doses.","cmp":"Rotina: 1 dose. Imunodeprimidos, PrEP, violência sexual a partir de 15 anos: 3 doses.","arm":"Excluir meninos ou manter esquema de 2 doses.","regra":"9 a 14 anos: uma dose, meninas e meninos.","cf":"A vacina reduz cerca de 90% das infecções e 70% das lesões pré-neoplásicas.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.4 (tabela de indicações do PNI 2026), slide 15 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":24,"sub":"Vacina em imunodeprimidas","eixo":"Vacinação contra HPV","comp":"Indicar o esquema de 3 doses em grupos especiais","enun":"Mulher de 30 anos, transplantada renal em uso de imunossupressores, nunca vacinada contra HPV, pergunta se pode receber a vacina pelo SUS. Segundo o PNI 2026 apresentado em aula, qual é a resposta?","ops":[["Sim, 3 doses (0, 2 e 6 meses), pois imunodeprimidos têm indicação de 9 a 45 anos.","Correta: transplantados, pessoas com HIV, neoplasia ou em uso de imunossupressores recebem 3 doses de 9 a 45 anos."],["Não, porque a vacina é de vírus vivo e é contraindicada na imunossupressão.","Errada: a vacina HPV é de partículas semelhantes a vírus, não de vírus vivo."],["Sim, em dose única, como na rotina dos adolescentes.","Errada: a dose única vale para a rotina de 9 a 14 anos e o resgate até 19."],["Não, porque após os 19 anos a vacina só é oferecida a vítimas de violência sexual.","Errada: imunodeprimidos têm indicação até 45 anos."]],"conc":"No PNI 2026: imunodeprimidos (HIV, transplante, neoplasia, imunossupressores) de 9 a 45 anos recebem 3 doses (0, 2, 6 meses). PrEP de 15 a 45 anos, 3 doses. Vítimas de violência sexual: 2 doses (9 a 14) ou 3 doses (15 a 45).","rac":"1) Transplantada. 2) 30 anos, dentro de 9 a 45. 3) Três doses.","pista":"Uso de imunossupressores.","mud":"Uma mulher de 30 anos imunocompetente e sem indicação especial não teria a vacina no SUS.","cmp":"Rotina: 1 dose. Imunodeprimidos: 3 doses.","arm":"Contraindicar a vacina por imunossupressão.","regra":"Imunodeprimida até 45 anos: 3 doses.","cf":"O rastreamento dessa paciente segue o protocolo da imunossuprimida: a cada 3 anos e qualquer HPV leva à colposcopia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.4 (indicações no PNI 2026), slide 15 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":25,"sub":"Vacina após tratamento de NIC 3","eixo":"Vacinação contra HPV","comp":"Indicar a vacina HPV após tratamento excisional","enun":"Mulher de 38 anos, nunca vacinada contra HPV, será submetida a EZT por NIC 3. Segundo a tabela do PNI 2026 apresentada em aula e a Nota Técnica 32/2026, qual é a recomendação vacinal?","ops":[["Quadrivalente em 3 doses (0, 2 e 6 meses), até 12 meses após a EZT.","Correta: a vacinação após tratamento de NIC 2+ ou AIS reduz a recidiva."],["Nenhuma vacina, porque a infecção já está estabelecida e a vacina não trata lesões.","Errada: embora não trate a lesão, a vacina reduz a recorrência após o tratamento."],["Dose única, como no resgate de adolescentes e adultos jovens.","Errada: para mulheres tratadas por NIC 2+, o esquema é de 3 doses."],["Duas doses com intervalo de 6 meses, iniciadas só 2 anos após a EZT.","Errada: o esquema é de 3 doses e deve ser feito no perioperatório ou até 12 meses."]],"conc":"Mulheres tratadas por NIC 2+, NIC 3 ou AIS recebem 3 doses (0, 2, 6 meses), no perioperatório ou até 12 meses. O slide traz a faixa de 9 a 45 anos; a Nota Técnica 32/2026 recomenda independentemente da idade.","rac":"1) NIC 3 com EZT. 2) Grupo com indicação. 3) Três doses. 4) Perioperatório ou até 12 meses.","pista":"Tratamento excisional por NIC 3.","mud":"Se a mulher tivesse 50 anos, o slide limitaria a 45, mas a nota técnica indicaria a vacina mesmo assim.","cmp":"Rotina: dose única. Pós-tratamento de NIC 2+: 3 doses.","arm":"Achar que a vacina não tem papel após a lesão.","regra":"Tratou NIC 2+: vacine em 3 doses.","cf":"O risco de persistência ou recorrência após o tratamento é estimado em até 17%.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.4 (tabela PNI 2026 e nota 'Conferir') e 7.9, slide 15 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); MS/DPNI, Nota Técnica 32/2026."},{"n":26,"sub":"Lesão visível e sangramento pós-coito","eixo":"Carcinoma invasor e estadiamento","comp":"Diferenciar rastreamento de investigação diagnóstica","enun":"Mulher de 47 anos, sem rastreamento há 9 anos, relata sangramento após as relações há 3 meses. Ao exame especular, lesão exofítica friável de 2,5 cm no colo. Qual é o próximo passo?","ops":[["Biópsia direta da lesão, sem aguardar citologia ou DNA-HPV.","Correta: lesão visível em paciente sintomática se biopsia; o rastreamento é para assintomáticas."],["Coletar DNA-HPV e decidir pela genotipagem.","Errada: a paciente é sintomática e tem lesão visível; o fluxo de rastreamento não se aplica."],["Coletar citologia e repetir em 6 meses se houver ASC-US.","Errada: atrasa o diagnóstico de provável câncer invasor."],["Tratar cervicite com antibiótico e reavaliar em 30 dias.","Errada: lesão friável com sinusorragia exige histologia imediata."]],"conc":"O carcinoma inicial costuma ser assintomático; sintomas incluem sinusorragia, sangramento intermenstrual ou pós-menopausa e corrimento. Lesão visível: biópsia direta. Depois, estadiamento com toque vaginal e retal e imagem (RM de pelve).","rac":"1) Sinusorragia. 2) Lesão exofítica friável. 3) Sintomática: não é rastreamento. 4) Biópsia.","pista":"Sangramento pós-coito com lesão visível.","mud":"Sem lesão visível e com suspeita, a investigação seguiria por colposcopia ou conização.","cmp":"Assintomática: rastreamento. Sintomática ou lesão visível: diagnóstico.","arm":"Pedir preventivo diante de lesão visível.","regra":"Viu lesão? Biopsie.","cf":"Confirmado o carcinoma, o tipo histológico mais comum é o epidermoide (escamoso).","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.10 (quadro clínico e diagnóstico, complemento rotulado), tabela 8.6 e erros frequentes, slide 46 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":27,"sub":"Hidronefrose no estadiamento","eixo":"Carcinoma invasor e estadiamento","comp":"Aplicar a FIGO 2018 com hidronefrose","enun":"Mulher de 52 anos com carcinoma escamoso do colo de 3 cm, sem acometimento vaginal, com paramétrio direito endurecido que não alcança a parede pélvica. A tomografia mostra hidronefrose à direita, sem linfonodos aumentados. Pela FIGO 2018, qual é o estádio?","ops":[["IIIB.","Correta: hidronefrose ou rim excluso classifica como IIIB, independentemente do tamanho e do paramétrio."],["IB2.","Errada: o tumor restrito ao colo de 2 a 4 cm seria IB2, mas a hidronefrose muda o estádio."],["IIB.","Errada: o paramétrio sem parede seria IIB, mas a hidronefrose é critério de IIIB."],["IVA.","Errada: IVA exige invasão comprovada da mucosa de bexiga ou reto."]],"conc":"FIGO 2018: IIIB = extensão à parede pélvica e/ou hidronefrose ou rim excluso. A hidronefrose 'pula' estádios. IIIC = linfonodos retroperitoneais (pélvicos IIIC1, para-aórticos IIIC2).","rac":"1) Tumor de 3 cm. 2) Paramétrio sem parede: seria IIB. 3) Hidronefrose: IIIB. 4) Prevalece o achado de maior estádio.","pista":"Hidronefrose.","mud":"Sem hidronefrose, o estádio seria IIB.","cmp":"IIB: paramétrio sem parede. IIIB: parede pélvica ou hidronefrose.","arm":"Classificar pelo tamanho ignorando a hidronefrose.","regra":"Hidronefrose = IIIB.","cf":"O tratamento passa a ser quimiorradiação com cisplatina e braquiterapia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.11 (estadiamento FIGO 2018 e padrão de prova) e tabela 8.3, slides 60 a 67 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Bhatla et al., Int J Gynecol Obstet 2019."},{"n":28,"sub":"Linfonodo pélvico positivo","eixo":"Carcinoma invasor e estadiamento","comp":"Estadiar o acometimento linfonodal pela FIGO 2018","enun":"Mulher de 41 anos com carcinoma do colo de 3,5 cm restrito ao colo, paramétrios e vagina livres. A ressonância mostra linfonodo ilíaco externo de 1,8 cm com aspecto suspeito, sem linfonodos para-aórticos. Pela FIGO 2018, qual é o estádio?","ops":[["IIIC1r.","Correta: linfonodo pélvico positivo por imagem é IIIC1, com a notação r."],["IB2.","Errada: o tamanho seria IB2, mas o linfonodo pélvico muda para IIIC1."],["IIIC2r.","Errada: IIIC2 corresponde aos linfonodos para-aórticos."],["IVB.","Errada: linfonodo pélvico não é metástase à distância."]],"conc":"Na FIGO 2018, linfonodo positivo passou a ser IIIC, qualquer que seja o tamanho do tumor: IIIC1 pélvicos e IIIC2 para-aórticos, com notação r (imagem) ou p (patologia).","rac":"1) Tumor de 3,5 cm restrito: seria IB2. 2) Linfonodo pélvico suspeito na RM. 3) IIIC1r.","pista":"Linfonodo ilíaco suspeito na imagem.","mud":"Se o linfonodo fosse para-aórtico, o estádio seria IIIC2r.","cmp":"IIIC1: pélvicos. IIIC2: para-aórticos. r: imagem. p: patologia.","arm":"Manter o estádio pelo tamanho do tumor.","regra":"Linfonodo positivo = IIIC.","cf":"No tratamento, os linfonodos acometidos devem ser incluídos no campo de radioterapia.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.11 (FIGO 2018: IIIC e padrão de prova) e tabela 8.3, slides 60 a 67 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":29,"sub":"Estádio IA2","eixo":"Carcinoma invasor e estadiamento","comp":"Diferenciar IA1, IA2 e IB1","enun":"Peça de conização de mulher de 34 anos mostra carcinoma escamoso com invasão estromal de 4 mm de profundidade e 9 mm de extensão horizontal, margens livres, sem lesão visível previamente. Pela FIGO 2018, qual é o estádio?","ops":[["IA2.","Correta: invasão de 3 mm ou mais e menor que 5 mm, diagnóstico microscópico, é IA2; a extensão horizontal não conta mais."],["IA1.","Errada: IA1 exige invasão menor que 3 mm."],["IB1.","Errada: IB1 exige invasão de 5 mm ou mais; a extensão horizontal de 9 mm não muda o estádio na FIGO 2018."],["IB2.","Errada: IB2 corresponde a tumor de 2 a 4 cm."]],"conc":"FIGO 2018: IA (diagnóstico microscópico, invasão menor que 5 mm): IA1 abaixo de 3 mm; IA2 de 3 a menos de 5 mm. A extensão horizontal deixou de contar. IB1: invasão de 5 mm ou mais e até 2 cm.","rac":"1) Diagnóstico microscópico. 2) Invasão de 4 mm. 3) Entre 3 e 5 mm. 4) IA2.","pista":"Profundidade de 4 mm.","mud":"Com invasão de 2 mm, seria IA1.","cmp":"IA1: menor que 3 mm. IA2: 3 a menos de 5 mm. IB1: 5 mm ou mais, até 2 cm.","arm":"Usar a extensão horizontal para subir o estádio.","regra":"No IA, só a profundidade conta.","cf":"No IA2, a cirurgia inclui avaliação linfonodal (biópsia do linfonodo sentinela).","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.11 (FIGO 2018) e tabela 8.3, slides 60 a 67 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Bhatla et al., 2019."},{"n":30,"sub":"Tratamento do IB3","eixo":"Tratamento por estádio","comp":"Indicar quimiorradiação no tumor localmente avançado","enun":"Mulher de 39 anos com carcinoma do colo de 5 cm restrito ao colo, paramétrios livres e sem linfonodos suspeitos na imagem. Quer muito 'tirar o útero'. Qual é o tratamento padrão segundo a aula?","ops":[["Radioterapia pélvica com quimioterapia sensibilizante (cisplatina) e braquiterapia.","Correta: IB3 é doença localmente avançada, tratada com quimiorradiação e braquiterapia."],["Histerectomia radical com linfadenectomia, seguida de radioterapia adjuvante.","Errada: associar cirurgia e radioterapia soma toxicidades; no IB3, o padrão é quimiorradiação primária."],["Traquelectomia radical, para preservar a fertilidade.","Errada: a preservação de fertilidade vai até IB1 com critérios."],["Quimioterapia sistêmica isolada, como no estádio IVB.","Errada: a doença é locorregional e potencialmente curável com quimiorradiação."]],"conc":"Regra do professor: tumor inicial (IA, IB1, IB2 e, em geral, IIA1) é cirúrgico; localmente avançado (IB3, IIA2, IIB a IVA) recebe radioterapia, quimioterapia sensibilizante e braquiterapia; metastático (IVB), quimioterapia sistêmica.","rac":"1) Tumor maior que 4 cm. 2) IB3. 3) Localmente avançado. 4) Quimiorradiação e braquiterapia.","pista":"Tumor de 5 cm.","mud":"Com tumor de 3,5 cm, IB2, a histerectomia radical seria opção.","cmp":"Até 4 cm: cirurgia e RT equivalentes, decide a morbidade. Acima de 4 cm: quimiorradiação.","arm":"Operar e depois irradiar.","regra":"Mais de 4 cm: quimiorradiação.","cf":"A radioterapia causa falência ovariana, estenose vaginal e cistite ou retite actínicas.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulos 7.12 (princípios cirurgia x radioterapia) e 7.13, slides 51 a 55 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":31,"sub":"Estádio IIB na mulher jovem","eixo":"Tratamento por estádio","comp":"Reconhecer que o acometimento parametrial contraindica cirurgia primária","enun":"Mulher de 33 anos com carcinoma do colo de 3,5 cm e paramétrio esquerdo acometido sem alcançar a parede pélvica, sem hidronefrose e sem linfonodos suspeitos. A família pergunta se a histerectomia radical preservaria os ovários. Qual é o tratamento indicado?","ops":[["Quimiorradiação com cisplatina e braquiterapia.","Correta: IIB é doença localmente avançada; a partir daqui não há cirurgia primária."],["Histerectomia radical com preservação ovariana, pela idade jovem.","Errada: o paramétrio acometido define doença localmente avançada, que não é tratada com cirurgia primária."],["Conização ampla com margens livres e seguimento.","Errada: a conização serve para doença microinvasora selecionada."],["Quimioterapia neoadjuvante seguida de traquelectomia.","Errada: a preservação de fertilidade não se aplica ao IIB."]],"conc":"Doença localmente avançada inclui tumor maior que 4 cm, acometimento parametrial, do terço inferior da vagina ou de órgãos adjacentes. IIB é tratado com quimiorradiação e braquiterapia, mesmo em mulheres jovens.","rac":"1) Paramétrio acometido sem parede: IIB. 2) Localmente avançado. 3) Quimiorradiação.","pista":"Paramétrio acometido.","mud":"Sem paramétrio, com tumor de 3,5 cm restrito ao colo (IB2), a cirurgia seria opção.","cmp":"IB2/IIA1: cirurgia ou quimiorradiação. IIB em diante: quimiorradiação.","arm":"Operar IIB jovem para preservar ovários.","regra":"Paramétrio tomado: nada de cirurgia primária.","cf":"Para preservar parte da função ovariana, pode-se discutir transposição ovariana antes da radioterapia, em centro especializado.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.12 (doença localmente avançada), tabela 8.3 e erros frequentes, slides 54 e 55 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":32,"sub":"IA1 com desejo reprodutivo","eixo":"Tratamento por estádio","comp":"Indicar tratamento conservador no microcarcinoma","enun":"Mulher de 29 anos, nuligesta, deseja gestar. Conização por HSIL mostrou carcinoma escamoso com invasão de 1,5 mm, sem invasão do espaço linfovascular, margens livres. Pela tabela da aula (NCCN 2026, segundo o professor), qual é a conduta?","ops":[["A própria conização com margens livres, seguida de seguimento.","Correta: IA1 sem invasão linfovascular, com desejo de fertilidade, é tratado com conização com margens livres."],["Traquelectomia radical com linfadenectomia pélvica.","Errada: é tratamento de IB1 sem critérios de cirurgia conservadora."],["Histerectomia simples com biópsia do linfonodo sentinela.","Errada: é opção para quem tem prole constituída, e o linfonodo sentinela é para IA1 com IEVL ou IA2."],["Quimiorradiação com braquiterapia.","Errada: tratamento desproporcional para doença microinvasora."]],"conc":"Estádio I (slides 62 a 64): IA1 sem IEVL, conização (fertilidade) ou histerectomia simples; IA1 com IEVL e IA2, traquelectomia simples ou conização com linfonodo sentinela (fertilidade) ou histerectomia simples com linfonodo sentinela.","rac":"1) Invasão de 1,5 mm: IA1. 2) Sem IEVL. 3) Margens livres. 4) Deseja gestar. 5) Conização já tratou.","pista":"IA1 sem invasão linfovascular com margens livres.","mud":"Com invasão linfovascular, seria necessária a avaliação linfonodal (linfonodo sentinela).","cmp":"IA1 sem IEVL: sem linfonodos. IA1 com IEVL ou IA2: linfonodo sentinela.","arm":"Supertratar microcarcinoma em jovem.","regra":"IA1 sem IEVL, margem livre: conização basta.","cf":"A invasão linfovascular não muda o estádio, mas muda o tratamento.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.13 (tabela do estádio I segundo os slides 62 a 64, NCCN 2026 conforme o professor) e tabela 8.4 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026)."},{"n":33,"sub":"SHAPE trial","eixo":"Tratamento por estádio","comp":"Aplicar os critérios de cirurgia conservadora no IB1","enun":"Mulher de 45 anos, prole constituída, com carcinoma escamoso IB1 de 1,6 cm, invasão estromal de 7 mm, sem invasão linfovascular, ressonância sem doença locorregional. Com base no SHAPE trial apresentado em aula, qual é a cirurgia adequada?","ops":[["Histerectomia simples com avaliação linfonodal pélvica.","Correta: no câncer de baixo risco, a histerectomia simples foi não inferior à radical, com menos disfunção urinária."],["Histerectomia radical (Wertheim-Meigs) obrigatória para todo IB1.","Errada: após o SHAPE, a radicalidade é reservada ao IB1 sem critérios de cirurgia conservadora."],["Quimiorradiação primária, por ser o padrão para tumores de até 2 cm.","Errada: tumores iniciais são preferencialmente cirúrgicos."],["Conização isolada, sem avaliação linfonodal.","Errada: no IB1 a avaliação linfonodal é necessária."]],"conc":"SHAPE (Plante, NEJM 2024): em câncer de baixo risco (tumor de até 2 cm, invasão estromal limitada), histerectomia simples com avaliação linfonodal foi não inferior à radical em recidiva pélvica em 3 anos, com menos incontinência e retenção urinária. Critérios: tumor de até 2 cm, invasão de até 10 mm, CEC ou adeno grau 1 ou 2, sem ILV preferencialmente, RM negativa.","rac":"1) IB1 de 1,6 cm. 2) Invasão de 7 mm. 3) Sem ILV. 4) RM negativa. 5) Critérios de baixo risco. 6) Histerectomia simples com linfonodos.","pista":"Tumor de até 2 cm com invasão menor que 10 mm e sem ILV.","mud":"Com invasão de 14 mm, a indicação seria histerectomia radical com linfadenectomia.","cmp":"IB1 baixo risco: simples. IB1 sem critério: radical.","arm":"Indicar radicalidade automática.","regra":"Precisamos sempre ser radicais? No baixo risco, não.","cf":"Se ela desejasse gestar, a opção seria traquelectomia simples com avaliação linfonodal.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.13 (SHAPE trial e critérios de cirurgia conservadora), slides 56 a 59 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Plante et al., N Engl J Med 2024."},{"n":34,"sub":"Rastreamento na gestante","eixo":"Gestante com lesão de colo","comp":"Realizar o rastreamento na gestação com segurança","enun":"Gestante de 31 anos, 18 semanas, nunca rastreada. A enfermeira hesita em coletar o material para DNA-HPV, temendo provocar aborto com a coleta endocervical. Segundo o INCA 2025, qual é a orientação?","ops":[["Coletar normalmente, inclusive da endocérvice.","Correta: gestantes seguem o mesmo rastreamento, e o pré-natal é oportunidade de coleta."],["Adiar a coleta para 12 semanas após o parto, pelo risco de sangramento.","Errada: adiar perde a oportunidade de rastrear quem nunca foi rastreada."],["Coletar apenas da ectocérvice, sem tocar no canal endocervical.","Errada: a coleta endocervical é segura e faz parte da técnica."],["Substituir o teste por exame visual com ácido acético, mais seguro na gestação.","Errada: não há indicação de trocar o método; o rastreamento é o mesmo."]],"conc":"Gestantes seguem o mesmo rastreamento das não gestantes; a coleta, inclusive endocervical, é segura em qualquer idade gestacional, e o pré-natal é oportunidade importante para quem está atrasada.","rac":"1) Gestante nunca rastreada. 2) Mesmo protocolo. 3) Coleta segura. 4) Coletar.","pista":"Gestante nunca rastreada.","mud":"Se houvesse lesão visível, a conduta seria investigação diagnóstica, também possível na gestação.","cmp":"Rastreamento na gestante: igual. Tratamento de lesão precursora na gestante: adiado para o pós-parto.","arm":"Evitar coleta endocervical na gestação.","regra":"Gestante também se rastreia.","cf":"Mulheres vacinadas contra HPV também seguem o mesmo rastreamento.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.6 (situações especiais: gestantes) e erros frequentes, slide 34 da aula 'Câncer de Colo Uterino' (Prof. Márcio C. Gomes, FCMMG, 2026); Diretrizes INCA 2025."},{"n":35,"sub":"HSIL na gestação","eixo":"Gestante com lesão de colo","comp":"Conduzir lesão de alto grau durante a gestação","enun":"Gestante de 27 anos, 16 semanas, tem citologia reflexa com HSIL. Na colposcopia, acetobranco denso com mosaico grosseiro, sem vasos atípicos nem outros sinais de invasão. Qual é a conduta?","ops":[["Vigiar com colposcopia e tratar a lesão após o puerpério.","Correta: sem suspeita de invasão, o objetivo na gestação é excluir câncer; o tratamento da lesão precursora é adiado."],["EZT imediata, para evitar progressão da lesão durante a gestação.","Errada: a excisão na gestação aumenta sangramento e perda gestacional e não é necessária sem suspeita de invasão."],["Interromper a gestação para tratar a lesão de alto grau.","Errada: lesão precursora não justifica interrupção."],["Cesárea programada, para evitar a disseminação da lesão no parto vaginal.","Errada: a lesão precursora não contraindica parto vaginal."]],"conc":"Na gestação, a colposcopia serve para excluir invasão; biópsia só se houver suspeita de invasão; o tratamento da lesão precursora é feito após o puerpério (cerca de 12 semanas). O câncer invasor na gestação exige decisão multiprofissional conforme estádio e idade gestacional.","rac":"1) HSIL na gestação. 2) Colposcopia sem sinais de invasão. 3) Não tratar agora. 4) Reavaliar após o puerpério.","pista":"Ausência de vasos atípicos e de suspeita de invasão.","mud":"Com vasos atípicos ou suspeita de invasão, a biópsia seria feita durante a gestação.","cmp":"Lesão precursora na gestação: vigiar. Câncer invasor: decisão multiprofissional por estádio e idade gestacional.","arm":"Tratar a lesão precursora durante a gestação.","regra":"Gestante com HSIL: exclua invasão e trate depois do parto.","cf":"Tumores invasores iniciais podem, em centros de referência, aguardar a maturidade fetal.","fonte":"Aula HTML Neoplasia do Colo Uterino (Aulas-GO, aula 08), módulo 7.14 (seguimento, gestação; itens da Parte II em consulta pública rotulados) e módulo 7.9."}]},{"id":"M06","titulo":"Doenças benignas e malignas do corpo uterino","bloco":2,"grupo":"P","q":[{"n":1,"sub":"Mioma submucoso FIGO 1","eixo":"Miomas","comp":"Classificar o mioma pela FIGO e escolher a via cirúrgica","enun":"Mulher de 34 anos, nuligesta, com fluxo menstrual intenso e anemia (Hb 9,8 g/dL), deseja gestar. Histerossonografia: mioma de 2,5 cm com cerca de 70% do volume projetado na cavidade e o restante intramural. Qual é a classificação FIGO e o tratamento mais adequado?","ops":[["FIGO tipo 1; miomectomia histeroscópica.","Correta: menos de 50% intramural é tipo 1, submucoso, tratado por histeroscopia com preservação da fertilidade."],["FIGO tipo 3; miomectomia laparoscópica, por ser mioma que apenas toca o endométrio sem projeção na cavidade.","Errada: o tipo 3 é 100% intramural e só contata o endométrio; aqui a maior parte está na cavidade."],["FIGO tipo 6; observação clínica até completar a prole, já que miomas subserosos não causam sangramento.","Errada: o tipo 6 é subseroso; este mioma é intracavitário."],["FIGO tipo 0; histerectomia total, pelo risco de recidiva dos miomas pediculados.","Errada: o tipo 0 é pediculado totalmente intracavitário, e a histerectomia não atende ao desejo de gestar."]],"conc":"FIGO: 0 pediculado intracavitário; 1 menos de 50% intramural; 2 50% ou mais intramural; 3 contata o endométrio, 100% intramural; 4 intramural; 5 e 6 subserosos; 7 subseroso pediculado; 8 outros. Tipos 0 a 2 são submucosos (L-SM), os que mais sangram e afetam a fertilidade.","rac":"1) 70% na cavidade, 30% intramural. 2) Menos de 50% intramural: tipo 1. 3) Submucoso sintomático. 4) Deseja gestar. 5) Miomectomia histeroscópica.","pista":"Maior parte do mioma dentro da cavidade.","mud":"Um mioma tipo 4 intramural sintomático com desejo de gestar seria abordado por miomectomia laparoscópica ou aberta.","cmp":"Submucosos (0 a 2): histeroscopia. Intramurais e subserosos: laparoscopia ou laparotomia.","arm":"Confundir tipo 1 (maior parte intracavitária) com tipo 2 (maior parte intramural).","regra":"Mioma que sangra e impede gestação costuma ser submucoso: histeroscopia.","cf":"Se a anemia fosse grave antes da cirurgia, o análogo de GnRH por 3 a 6 meses poderia reduzir o volume e corrigir a anemia.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.2 (classificação FIGO 0 a 8) e módulo 3.3 (tabela de tratamento: miomectomia histeroscópica)."},{"n":2,"sub":"Mioma assintomático","eixo":"Miomas","comp":"Indicar conduta expectante no mioma assintomático","enun":"Mulher de 41 anos, assintomática, com ciclos regulares e fluxo normal, tem ultrassonografia de rotina mostrando mioma intramural (FIGO 4) de 3,8 cm. Hemoglobina normal. Pergunta se precisa operar 'por segurança'. Qual é a conduta?","ops":[["Conduta expectante com controle clínico e ultrassonográfico.","Correta: mioma assintomático não deve ser operado; a conduta depende de sintoma, localização e desejo reprodutivo."],["Miomectomia laparoscópica preventiva, para evitar a transformação em sarcoma.","Errada: o sarcoma é raro e, em geral, surge de novo; o mioma não 'degenera' em sarcoma."],["Análogo de GnRH contínuo até a menopausa, para impedir o crescimento do mioma.","Errada: o uso prolongado causa perda óssea e não há indicação em assintomática."],["Embolização das artérias uterinas, por ser procedimento minimamente invasivo.","Errada: a embolização é para miomas sintomáticos."]],"conc":"O leiomioma é o tumor benigno mais frequente do trato genital feminino. A maioria é assintomática. Mioma assintomático tem conduta expectante; não se opera 'por segurança'.","rac":"1) Mioma intramural. 2) Sem sintomas. 3) Sem anemia. 4) Expectante.","pista":"Ausência de sintomas.","mud":"Fluxo intenso com anemia ou sintomas compressivos indicariam tratamento.","cmp":"Mioma assintomático: observar. Crescimento rápido na pós-menopausa: investigar sarcoma.","arm":"Operar mioma assintomático.","regra":"Mioma sem sintoma não se opera.","cf":"Após a menopausa, o mioma tende a regredir, por depender de estrogênio e progesterona.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.3 (princípio do tratamento), algoritmo 9.3 e erros frequentes 17.2."},{"n":3,"sub":"Mioma na gestação","eixo":"Miomas","comp":"Reconhecer e conduzir a degeneração vermelha do mioma na gestação","enun":"Gestante de 22 semanas com mioma intramural de 6 cm conhecido apresenta dor abdominal localizada intensa sobre o mioma, febrícula de 37,8 °C e leucocitose discreta, sem sangramento, contrações ou sinais de infecção urinária. Vitalidade fetal normal. Qual é a hipótese e a conduta?","ops":[["Degeneração vermelha (necrobiose); tratamento conservador com analgesia e observação.","Correta: é a degeneração típica da gestação, de manejo clínico."],["Torção de mioma pediculado; miomectomia de urgência por laparotomia.","Errada: o mioma é intramural, e a miomectomia na gestação aumenta muito o risco de sangramento e perda gestacional."],["Corioamnionite; antibiótico e indução imediata do parto.","Errada: não há perda de líquido nem quadro infeccioso intra-amniótico, e a dor é localizada sobre o mioma."],["Transformação sarcomatosa; histerectomia com o feto in situ.","Errada: o quadro agudo na gestação é de degeneração, não de sarcoma."]],"conc":"Degenerações do mioma: hialina (mais comum), cística, calcificação (pós-menopausa), vermelha ou necrobiose (gestação, com dor aguda e febrícula) e mixoide. A degeneração vermelha se trata de forma conservadora.","rac":"1) Gestação. 2) Mioma conhecido. 3) Dor localizada e febrícula. 4) Necrobiose. 5) Analgesia e observação.","pista":"Dor sobre o mioma com febrícula na gestação.","mud":"Sangramento vaginal com hipertonia sugeriria descolamento prematuro de placenta.","cmp":"Na gestação: degeneração vermelha. Na pós-menopausa: calcificação.","arm":"Operar mioma na gestação por dor.","regra":"Mioma doendo na gestação: necrobiose, trate clinicamente.","cf":"Após miomectomia prévia com abertura da cavidade, a via de parto precisa ser discutida pelo risco de ruptura.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.2 (degenerações) e módulo 3.3 (miomectomia: risco de ruptura na gestação)."},{"n":4,"sub":"Análogo de GnRH pré-operatório","eixo":"Miomas","comp":"Usar o análogo de GnRH no preparo cirúrgico","enun":"Mulher de 45 anos, prole completa, com miomatose volumosa (útero de 16 semanas), fluxo intenso e hemoglobina de 7,9 g/dL, tem histerectomia programada para daqui a 4 meses. Qual é o papel do análogo de GnRH nesse caso?","ops":[["Uso por 3 a 6 meses antes da cirurgia, para reduzir o volume e corrigir a anemia.","Correta: é indicação pré-operatória clássica, de uso curto, pelos efeitos hipoestrogênicos."],["Tratamento definitivo, mantido até a menopausa, para dispensar a cirurgia.","Errada: o uso prolongado sem add-back causa perda óssea, e o efeito regride ao suspender."],["Contraindicado, porque o hipoestrogenismo aumenta o sangramento intraoperatório.","Errada: o objetivo é reduzir volume e sangramento."],["Indicado apenas após a histerectomia, para prevenir recidiva dos miomas.","Errada: sem útero, não há mioma a recidivar."]],"conc":"O análogo de GnRH por 3 a 6 meses é usado no pré-operatório para reduzir o volume e corrigir a anemia. Uso prolongado sem add-back causa perda óssea.","rac":"1) Anemia importante. 2) Cirurgia programada. 3) Janela de 4 meses. 4) GnRH análogo, curto.","pista":"Anemia com cirurgia já programada.","mud":"Se ela recusasse cirurgia e não desejasse gestar, a embolização seria opção.","cmp":"Pré-operatório: GnRH análogo curto. Longo prazo: SIU-LNG, combinado, ácido tranexâmico.","arm":"Usar análogo de GnRH por anos.","regra":"Análogo de GnRH: ponte curta para a cirurgia.","cf":"Ácido tranexâmico de 1,5 a 4 g/dia na menstruação reduz o fluxo sem hormônio, com cuidado em quem teve trombose.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.3 (tabela de opções: GnRH análogo) e erros frequentes 17.2."},{"n":5,"sub":"Embolização das artérias uterinas","eixo":"Miomas","comp":"Escolher o tratamento do mioma conforme o desejo da paciente","enun":"Mulher de 43 anos, laqueada, com miomas intramurais múltiplos e fluxo intenso refratário a ácido tranexâmico e SIU de levonorgestrel. Deseja tratamento eficaz, mas quer evitar cirurgia com retirada do útero. Qual opção atende melhor a esse perfil?","ops":[["Embolização das artérias uterinas.","Correta: é opção para sintomática sem desejo de gestar que quer evitar cirurgia."],["Miomectomia histeroscópica, por ser procedimento sem incisão abdominal.","Errada: a via histeroscópica serve para miomas submucosos, não para intramurais múltiplos."],["Conduta expectante, já que o SIU de levonorgestrel ainda pode fazer efeito após anos.","Errada: a paciente é sintomática e já falhou ao tratamento clínico."],["Análogo de GnRH contínuo por 5 anos.","Errada: o uso prolongado causa perda óssea e o efeito não se mantém."]],"conc":"Opções para o mioma sintomático: ácido tranexâmico, AINEs, SIU-LNG, combinados, análogo de GnRH no pré-operatório, miomectomia histeroscópica (0 a 2), miomectomia laparoscópica ou aberta, embolização e histerectomia. A escolha depende de sintoma, localização, desejo reprodutivo e preferência.","rac":"1) Sintomática. 2) Falha clínica. 3) Sem desejo reprodutivo. 4) Quer evitar histerectomia. 5) Embolização.","pista":"Desejo de evitar cirurgia sem projeto reprodutivo.","mud":"Se desejasse gestar, a miomectomia seria preferida, pois o efeito da embolização sobre a fertilidade é menos seguro.","cmp":"Embolização: sem desejo de gestar. Miomectomia: com desejo de gestar. Histerectomia: definitiva.","arm":"Indicar via histeroscópica para miomas intramurais.","regra":"No mioma, a conduta segue a mulher: sintoma, local e projeto de vida.","cf":"A histerectomia segue como tratamento definitivo se as demais opções falharem ou por escolha da paciente.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.3 (tabela de tratamento do SUA e do leiomioma) e algoritmo 9.3."},{"n":6,"sub":"Fatores de risco do mioma","eixo":"Miomas","comp":"Reconhecer os fatores de risco e de proteção do mioma","enun":"Sobre os fatores associados ao leiomioma uterino, qual afirmação está de acordo com a aula?","ops":[["Raça negra, nuliparidade e obesidade aumentam o risco; o combinado não é fator de risco.","Correta: é a lista da aula; o combinado não aumenta o risco de mioma."],["O anticoncepcional combinado é o principal fator de risco, por fornecer estrogênio exógeno contínuo.","Errada: o combinado não é fator de risco para mioma."],["A multiparidade aumenta o risco, pela exposição prolongada à progesterona gestacional.","Errada: a nuliparidade é que se associa a mais miomas."],["O mioma é mais frequente após a menopausa, quando o estrogênio periférico aumenta.","Errada: o mioma regride após a menopausa."]],"conc":"O leiomioma é monoclonal, do músculo liso, e cresce com estrogênio e progesterona. Fatores: raça negra, nuliparidade, obesidade, menarca precoce, história familiar. Regride após a menopausa.","rac":"1) Mioma é hormônio-dependente. 2) Fatores que aumentam exposição e predisposição. 3) Combinado não é fator.","pista":"Inclusão do anticoncepcional combinado entre os fatores.","mud":"Se a pergunta fosse sobre câncer de endométrio, o combinado apareceria como fator protetor.","cmp":"Mioma: cresce na menacme e regride na menopausa. Sarcoma: suspeitar se cresce na pós-menopausa.","arm":"Atribuir ao combinado o surgimento de miomas.","regra":"Mioma é doença da menacme.","cf":"Crescimento de 'mioma' após a menopausa deve levantar suspeita de sarcoma.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.2 (leiomioma: fatores) e tabela 8.1."},{"n":7,"sub":"Adenomiose: quadro clínico","eixo":"Adenomiose","comp":"Diferenciar adenomiose de mioma pelo exame","enun":"Mulher de 42 anos, G3P3, com dismenorreia progressiva há 3 anos, fluxo intenso e dispareunia. Ao toque, útero globoso, simétrico, amolecido, doloroso, com volume de cerca de 10 semanas. Qual é a principal hipótese e o achado de imagem que a apoia?","ops":[["Adenomiose; zona juncional espessada (acima de 12 mm) na ressonância.","Correta: útero globoso, doloroso, em multípara com dismenorreia progressiva sugere adenomiose."],["Leiomiomatose; nódulos bem delimitados com sombra em leque na ultrassonografia.","Errada: o mioma costuma dar útero irregular e indolor."],["Carcinoma de endométrio; espessamento endometrial heterogêneo.","Errada: o quadro não sugere câncer, e o útero doloroso com dismenorreia é típico de adenomiose."],["Sarcoma uterino; massa única com necrose e hipercaptação irregular.","Errada: não há crescimento rápido nem perfil de sarcoma."]],"conc":"Adenomiose: glândulas e estroma endometriais no miométrio. Multíparas, 35 a 50 anos, com cirurgia uterina prévia. Fluxo intenso, dismenorreia progressiva, dispareunia. Útero globoso, simétrico, doloroso, geralmente menor que 12 semanas. RM: zona juncional acima de 12 mm.","rac":"1) Multípara de 42 anos. 2) Dismenorreia progressiva e fluxo intenso. 3) Útero globoso e doloroso. 4) Adenomiose.","pista":"Útero globoso e doloroso.","mud":"Útero aumentado, irregular e indolor levaria a pensar em mioma.","cmp":"Mioma: irregular e indolor. Adenomiose: globoso e doloroso.","arm":"Chamar de mioma todo útero aumentado com fluxo intenso.","regra":"Globoso e doloroso: adenomiose.","cf":"Na ultrassonografia, a adenomiose mostra assimetria da parede, cistos miometriais, estrias lineares e margem endometrial mal definida.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.3 (adenomiose), tabela 8.1 e erros frequentes 17.1; FEBRASGO, Protocolo nº 77 (Adenomiose)."},{"n":8,"sub":"Tratamento da adenomiose","eixo":"Adenomiose","comp":"Escolher o tratamento da adenomiose conforme o projeto reprodutivo","enun":"Mulher de 38 anos com adenomiose difusa por imagem, dismenorreia e fluxo intenso. Não deseja mais gestar no momento, mas não quer cirurgia. Qual opção é de primeira linha adequada?","ops":[["SIU de levonorgestrel.","Correta: reduz fluxo e dor e está entre as opções clínicas de primeira linha."],["Histerectomia total imediata, por ser o único tratamento eficaz.","Errada: a histerectomia é definitiva, mas não é a única opção e a paciente não quer cirurgia."],["Miomectomia histeroscópica do adenomioma difuso.","Errada: a doença difusa não se trata por ressecção histeroscópica."],["Observação sem tratamento, porque a adenomiose regride com a idade fértil.","Errada: a paciente é sintomática e merece tratamento."]],"conc":"Tratamento da adenomiose: AINEs, ácido tranexâmico, contraceptivos hormonais, SIU-LNG, dienogeste; análogo de GnRH em casos selecionados. Histerectomia é definitiva para prole completa. Com desejo gestacional, individualizar.","rac":"1) Adenomiose sintomática. 2) Sem desejo de cirurgia. 3) Opção clínica eficaz. 4) SIU-LNG.","pista":"Recusa de cirurgia com sintomas hormônio-dependentes.","mud":"Se a prole estivesse completa e ela preferisse tratamento definitivo, a histerectomia seria opção.","cmp":"Adenomiose: SIU-LNG, dienogeste, combinados. Mioma submucoso: histeroscopia.","arm":"Indicar histerectomia a toda adenomiose.","regra":"Adenomiose: comece pelo hormônio.","cf":"O diagnóstico definitivo da adenomiose é histológico, na peça de histerectomia.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.3 (conduta na adenomiose) e tabela 8.1; FEBRASGO, Protocolo nº 77."},{"n":9,"sub":"Diagnóstico definitivo da adenomiose","eixo":"Adenomiose","comp":"Saber o método diagnóstico definitivo da adenomiose","enun":"Uma residente afirma que a ultrassonografia transvaginal com cistos miometriais 'fecha' o diagnóstico de adenomiose. Qual afirmação corrige essa ideia?","ops":[["O diagnóstico definitivo é histológico; a imagem só sugere.","Correta: a imagem sugere; a confirmação é histológica, em geral na peça de histerectomia."],["O diagnóstico definitivo é feito pela dosagem de CA-125 acima de 35 U/mL.","Errada: o CA-125 não diagnostica adenomiose."],["O diagnóstico definitivo exige laparoscopia com visualização de implantes peritoneais.","Errada: implantes peritoneais caracterizam endometriose, não adenomiose."],["O diagnóstico definitivo é feito pela histerossalpingografia com falha de enchimento.","Errada: a histerossalpingografia não é o método diagnóstico da adenomiose."]],"conc":"Adenomiose: presença de glândulas e estroma endometriais no miométrio, mais de 2,5 mm abaixo da camada basal, com hiperplasia muscular reacional. USTV e RM fazem o diagnóstico presuntivo; o definitivo é histológico.","rac":"1) Imagem sugere. 2) Definição é histológica. 3) Confirmação na peça.","pista":"A palavra 'definitivo'.","mud":"Se a pergunta fosse o melhor exame de imagem, a resposta seria a RM com zona juncional acima de 12 mm.","cmp":"Adenomiose: no miométrio. Endometriose: fora do útero.","arm":"Confundir adenomiose com endometriose.","regra":"Imagem sugere, histologia confirma.","cf":"Adenomiose frequentemente coexiste com endometriose e miomas.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.3 (definição e imagem); FEBRASGO, Protocolo nº 77."},{"n":10,"sub":"Pólipo na pós-menopausa","eixo":"Pólipos endometriais","comp":"Indicar a ressecção do pólipo endometrial","enun":"Mulher de 63 anos, assintomática, tem ultrassonografia transvaginal com lesão ecogênica focal intracavitária de 1,6 cm, com vaso nutridor ao Doppler. Qual é a conduta?","ops":[["Polipectomia histeroscópica com envio do material à histologia.","Correta: pólipo grande na pós-menopausa deve ser removido, e a histeroscopia é padrão-ouro diagnóstico e terapêutico."],["Curetagem uterina às cegas para retirar o pólipo.","Errada: a curetagem às cegas pode fragmentar o pólipo e deixá-lo."],["Observação com nova ultrassonografia em 2 anos, por ser assintomática.","Errada: na pós-menopausa, pólipo de 1 a 1,5 cm ou mais deve ser removido."],["Histerectomia total com salpingo-ooforectomia, pelo risco de câncer.","Errada: o pólipo é quase sempre benigno; a ressecção histeroscópica basta."]],"conc":"Pólipo endometrial: projeção de glândulas e estroma em torno de um eixo vascular. Diagnóstico por USTV (foco ecogênico com vaso nutridor). Remover se sintomático, na pós-menopausa, grande (1 a 1,5 cm ou mais), com fatores de risco ou em uso de tamoxifeno. Sempre histologia.","rac":"1) Pós-menopausa. 2) Foco ecogênico com vaso nutridor: pólipo. 3) 1,6 cm. 4) Remover por histeroscopia.","pista":"Vaso nutridor com lesão focal na pós-menopausa.","mud":"Um pólipo de 6 mm assintomático na pré-menopausa poderia ser observado.","cmp":"Pipelle: cega, pode perder lesão focal. Histeroscopia: vê e trata.","arm":"Fazer curetagem às cegas para pólipo.","regra":"Pólipo se tira vendo.","cf":"O pólipo pode conter hiperplasia ou carcinoma, mais em pós-menopausa sintomática.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.1 (pólipo endometrial) e tabela 8.1."},{"n":11,"sub":"Pólipo pequeno na menacme","eixo":"Pólipos endometriais","comp":"Reconhecer quando o pólipo pode ser observado","enun":"Mulher de 33 anos, ciclos regulares, sem sangramento intermenstrual e sem fatores de risco, tem ultrassonografia com pólipo endometrial de 6 mm. Não está tentando engravidar. Qual conduta é aceitável?","ops":[["Observação, por ser pequeno e assintomático na pré-menopausa.","Correta: na pré-menopausa, pólipo pequeno e assintomático pode ser observado."],["Histerectomia, para prevenir a evolução do pólipo para carcinoma.","Errada: o pólipo é quase sempre benigno; a histerectomia é desproporcional."],["Curetagem uterina às cegas, por ser mais simples que a histeroscopia.","Errada: a curetagem às cegas não é adequada para pólipos."],["Análogo de GnRH por 6 meses para fazer o pólipo regredir.","Errada: não é tratamento de pólipo endometrial."]],"conc":"Pólipos assintomáticos pequenos na pré-menopausa podem ser observados. Indicações de remoção: sintomas, pós-menopausa, tamanho de 1 a 1,5 cm ou mais, fatores de risco, tamoxifeno ou infertilidade.","rac":"1) 33 anos. 2) Assintomática. 3) 6 mm. 4) Sem fatores. 5) Observar.","pista":"Pólipo pequeno, assintomático, na menacme.","mud":"Sangramento intermenstrual levaria à polipectomia histeroscópica.","cmp":"Pré-menopausa assintomática pequena: observar. Pós-menopausa ou sintomática: remover.","arm":"Remover todos os pólipos indiscriminadamente ou por curetagem.","regra":"Pólipo pequeno e mudo na jovem pode esperar.","cf":"Se ela passar a ter dificuldade para engravidar, a ressecção histeroscópica deve ser discutida.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.1 (conduta no pólipo)."},{"n":12,"sub":"Coagulopatia no PALM-COEIN","eixo":"SUA e PALM-COEIN","comp":"Reconhecer a coagulopatia como causa de SUA","enun":"Adolescente de 16 anos com fluxo menstrual intenso desde a menarca, equimoses fáceis e sangramento prolongado após extração dentária; a mãe tem história semelhante. Ultrassonografia pélvica normal. Pelo sistema PALM-COEIN, qual categoria e investigação são as mais adequadas?","ops":[["C (coagulopatia); investigar doença de von Willebrand e coagulograma.","Correta: fluxo intenso desde a menarca, equimoses e história familiar sugerem coagulopatia."],["O (disfunção ovulatória); iniciar progestagênio cíclico sem exames adicionais.","Errada: o padrão desde a menarca com sangramentos em outros locais aponta coagulopatia."],["E (endometrial primária); diagnóstico de exclusão sem investigar hemostasia.","Errada: só se chega à causa endometrial após excluir as outras, inclusive a coagulopatia."],["M (malignidade); biópsia endometrial por pipelle.","Errada: não há perfil de risco para malignidade nessa idade."]],"conc":"PALM-COEIN: PALM estruturais (pólipo, adenomiose, leiomioma, malignidade e hiperplasia); COEIN não estruturais (coagulopatia, disfunção ovulatória, endometrial, iatrogênica, não classificada). Coagulopatia: fluxo intenso desde a menarca, equimoses e história familiar.","rac":"1) Fluxo intenso desde a menarca. 2) Equimoses e sangramento dentário. 3) História familiar. 4) Coagulopatia. 5) Coagulograma e von Willebrand.","pista":"Sangramento em vários sítios desde a menarca, com história familiar.","mud":"Ciclos irregulares com SOP apontariam para disfunção ovulatória.","cmp":"C: desde a menarca e sistêmico. O: irregular, anovulatório. E: regular, fluxo intenso, por exclusão.","arm":"Atribuir todo sangramento da adolescente à anovulação.","regra":"Sangra muito desde a menarca e em outros lugares: pense em coagulopatia.","cf":"O ácido tranexâmico é opção não hormonal útil nesse grupo.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 1.2 (terminologia e PALM-COEIN) e módulo 3.1 (investigação do SUA)."},{"n":13,"sub":"Biópsia endometrial a partir dos 45 anos","eixo":"SUA e PALM-COEIN","comp":"Indicar amostragem endometrial no SUA","enun":"Mulher de 47 anos, IMC 33 kg/m², com sangramento intermenstrual e ciclos irregulares há 6 meses. Beta-hCG negativo, hemoglobina de 11,4 g/dL. Ultrassonografia transvaginal com endométrio de 11 mm, homogêneo, sem lesão focal. Qual é o próximo passo?","ops":[["Amostragem endometrial (pipelle) antes de iniciar o tratamento.","Correta: SUA a partir dos 45 anos indica amostragem endometrial; a obesidade reforça a indicação."],["Iniciar anticoncepcional combinado e reavaliar em 6 meses sem biópsia.","Errada: tratar sem amostrar o endométrio pode atrasar o diagnóstico de hiperplasia ou câncer."],["Repetir a ultrassonografia em 3 meses para ver se o endométrio afina.","Errada: a idade e o risco já indicam histologia."],["Solicitar CA-125 e só biopsiar se o marcador estiver elevado.","Errada: o CA-125 não rastreia nem diagnostica doença endometrial."]],"conc":"Amostragem endometrial no SUA: idade de 45 anos ou mais, ou menos de 45 com fatores de risco (obesidade, anovulação crônica, tamoxifeno, Lynch), falha do tratamento clínico ou sangramento persistente.","rac":"1) 47 anos com SUA. 2) Obesa e anovuladora. 3) Excluída gestação. 4) Pipelle. 5) Histeroscopia se lesão focal ou biópsia inconclusiva.","pista":"Idade acima de 45 anos com sangramento anormal.","mud":"Uma mulher de 30 anos sem fatores de risco poderia ser tratada clinicamente sem biópsia inicial.","cmp":"Pipelle: boa para doença difusa. Histeroscopia: lesão focal.","arm":"Tratar SUA de mulher acima de 45 anos sem histologia.","regra":"SUA com 45 anos ou mais: biopsie.","cf":"Se o sangramento persistir com pipelle negativa, faz-se histeroscopia.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.1 (investigação do SUA; ACOG/FEBRASGO) e algoritmo 9.1."},{"n":14,"sub":"Primeiro passo no sangramento uterino","eixo":"SUA e PALM-COEIN","comp":"Priorizar estabilidade e gestação no SUA","enun":"Mulher de 29 anos chega ao pronto atendimento com sangramento vaginal volumoso há 6 horas, tontura, FC 118 bpm e PA 92 x 58 mmHg. Diz que a menstruação 'atrasou e veio forte'. Qual é a prioridade?","ops":[["Estabilização hemodinâmica e dosagem de beta-hCG.","Correta: no SUA, primeiro avaliam-se estabilidade e possibilidade de gestação."],["Ultrassonografia para classificar a causa pelo PALM-COEIN antes de qualquer outra medida.","Errada: a classificação vem depois da estabilização e da exclusão de gestação."],["Iniciar anticoncepcional combinado em altas doses e liberar para casa.","Errada: há instabilidade e o atraso menstrual exige excluir gestação."],["Biópsia endometrial ambulatorial para excluir hiperplasia.","Errada: não é prioridade numa paciente instável e possivelmente gestante."]],"conc":"No SUA, o primeiro passo é avaliar estabilidade hemodinâmica e descartar gestação em mulher em idade reprodutiva. Instável: acesso, volume, hemoderivados. Beta-hCG positivo: fluxo obstétrico.","rac":"1) Taquicardia e hipotensão. 2) Atraso menstrual. 3) Estabilizar. 4) Beta-hCG. 5) Depois, investigar a causa.","pista":"Instabilidade com atraso menstrual.","mud":"Com beta-hCG positivo, a investigação seguiria para abortamento ou gestação ectópica.","cmp":"Instável: estabilizar primeiro. Estável: investigar a causa.","arm":"Ir direto à classificação PALM-COEIN.","regra":"Sangrando: estabilidade e beta-hCG antes de tudo.","cf":"Não pedir beta-hCG no SUA é erro que pode deixar passar uma gestação ectópica.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 1.2 (primeiro passo, sempre), algoritmo 9.1 e erros frequentes 17.2."},{"n":15,"sub":"Pipelle negativa com sangramento persistente","eixo":"SUA e PALM-COEIN","comp":"Reconhecer a limitação da biópsia às cegas","enun":"Mulher de 50 anos com sangramento intermenstrual persistente há 5 meses, já com pipelle mostrando endométrio proliferativo sem atipias. A ultrassonografia sugere área focal mal definida. Qual é o próximo passo?","ops":[["Histeroscopia com biópsia dirigida.","Correta: a pipelle é cega e pode perder lesões focais; sangramento persistente com biópsia negativa exige histeroscopia."],["Encerrar a investigação, porque a biópsia excluiu doença endometrial.","Errada: a pipelle não exclui lesões focais, como pólipos."],["Repetir a pipelle a cada 3 meses até que o sangramento pare.","Errada: repetir o mesmo método cego não resolve a limitação."],["Iniciar terapia hormonal combinada, atribuindo o sangramento à perimenopausa.","Errada: a persistência do sintoma não deve ser minimizada após biópsia negativa."]],"conc":"A pipelle tem alta sensibilidade para câncer difuso, mas pode perder lesões focais. Sangramento persistente com biópsia negativa, ou lesão focal na imagem, indica histeroscopia.","rac":"1) Sangramento persistente. 2) Pipelle negativa. 3) Área focal. 4) Histeroscopia.","pista":"Persistência com suspeita de lesão focal.","mud":"Com pipelle negativa e cessação do sangramento, o seguimento clínico seria aceitável.","cmp":"Pipelle: cega. Histeroscopia: dirigida.","arm":"Tranquilizar a paciente pela biópsia negativa apesar do sintoma persistente.","regra":"Sangramento que persiste com biópsia negativa: histeroscopia.","cf":"O mesmo raciocínio vale para o sangramento pós-menopausa recorrente com endométrio fino.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.1 (sensibilidade da pipelle), tabela 8.4 e erros frequentes 17.1."},{"n":16,"sub":"Endométrio de 3 mm no primeiro episódio","eixo":"Espessamento endometrial na pós-menopausa","comp":"Aplicar o limiar de 4 mm no sangramento pós-menopausa","enun":"Mulher de 60 anos, menopausa aos 51, sem terapia hormonal, teve um episódio de sangramento vaginal discreto há 10 dias, que cessou. Exame especular sem lesões. Ultrassonografia transvaginal: endométrio de 3 mm, homogêneo. Qual é a conduta?","ops":[["Conduta expectante com orientação de retorno se houver novo sangramento.","Correta: endométrio de até 4 mm no primeiro episódio, sem fatores de risco, tem risco de câncer menor que 1%."],["Biópsia endometrial obrigatória, porque todo sangramento pós-menopausa exige histologia.","Errada: com endométrio fino no primeiro episódio, a conduta expectante é aceitável."],["Histerectomia total pelo risco de câncer de endométrio.","Errada: não há indicação cirúrgica com risco tão baixo."],["Iniciar terapia hormonal estroprogestativa para tratar a atrofia.","Errada: a atrofia vaginal se trata com estrogênio tópico, e não é preciso terapia sistêmica."]],"conc":"Sangramento pós-menopausa nunca é normal: exame especular e USTV. Endométrio de até 4 mm: baixo risco (menor que 1%); conduta expectante se cessou. Acima de 4 mm, heterogêneo ou foco: pipelle ou histeroscopia. Persistente ou recorrente: histeroscopia.","rac":"1) Primeiro episódio. 2) Sem TH. 3) Endométrio de 3 mm. 4) Sangramento cessou. 5) Expectante com retorno.","pista":"Endométrio de até 4 mm em primeiro episódio.","mud":"Recorrência do sangramento levaria à histeroscopia mesmo com endométrio fino.","cmp":"Até 4 mm: expectante. Acima de 4 mm: biópsia.","arm":"Aplicar o limiar de 4 mm em usuária de tamoxifeno ou com sangramento recorrente.","regra":"Primeiro sangramento, endométrio fino: observar com retorno.","cf":"A causa mais comum de sangramento pós-menopausa é a atrofia endomet
