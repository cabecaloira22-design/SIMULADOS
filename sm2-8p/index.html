<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Simulado Saúde da Mulher II</title>

<style>
/* Layout: coluna única de leitura (máx. 760px), barra fixa de progresso no simulado, cartões só para a questão e a correção */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14232B; --muted:#56666E; --line:#D3DDE1;
  --accent:#1C5A72; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2;
  --ok:#276E49; --ok-soft:#E2F1E8; --bad:#A33C2B; --bad-soft:#F8E5E0; --warn:#8A5D0B; --warn-soft:#F7EED9;
  --display:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.3rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile strong{font-size:1.02rem}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.stat b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--muted)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.checks input{margin-top:4px;width:18px;height:18px;flex:none}
.bloco{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
/* topo do simulado */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:40vh;overflow:auto;padding:2px}
.nb{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.85rem;position:relative}
.nb.ans{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{outline:2px solid var(--ink)}
.nb.ok{background:var(--ok-soft);border-color:var(--ok)}
.nb.bad{background:var(--bad-soft);border-color:var(--bad)}
.nb.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enun{font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.opt .L{font-family:var(--mono);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .tag{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.banner{padding:12px 14px;border-radius:8px;font-weight:600}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.blank{background:var(--warn-soft);color:var(--warn)}
.aula{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.aula dl{margin:0;display:flex;flex-direction:column;gap:10px}
.aula dt{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.aula dd{margin:2px 0 0}
.alts{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.alts li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.alts li b{font-family:var(--mono)}
.gold{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:600}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img,figure canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;font-size:.9rem}
.confirmbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.78rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.placar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent-soft);font-weight:600}
.placar .pl-main{font-size:1rem}
.placar .pl-side{font-size:.85rem;color:var(--muted);font-weight:500}
.placar.good{border-color:var(--ok);background:var(--ok-soft)}
.placar.mid{border-color:var(--warn);background:var(--warn-soft)}
.placar.low{border-color:var(--bad);background:var(--bad-soft)}
</style>
</head>

<script>
document.documentElement.lang='pt-BR';
const DATA={"aulas":[{"id":"M01","titulo":"Diabetes na gestação","bloco":1,"grupo":"P","q":[{"n":1,"sub":"Glicemia de jejum de 1º trimestre entre 92 e 125","eixo":"Rastreio e diagnóstico","comp":"Diagnosticar DMG pela glicemia de jejum inicial sem exigir TOTG","enun":"Primigesta de 27 anos, 10 semanas pela ultrassonografia, sem diabetes conhecido, faz os exames da primeira consulta. Glicemia plasmática de jejum: 98 mg/dL. Assintomática, IMC 29 kg/m². Pelo critério brasileiro (OPAS/MS/FEBRASGO/SBD), qual é a interpretação e a conduta?","ops":[["Diabetes gestacional; iniciar tratamento sem TOTG confirmatório.","Correta: na gestação, jejum de 92 a 125 mg/dL em qualquer idade gestacional já define DMG e dispensa o TOTG."],["Glicemia limítrofe; repetir a glicemia de jejum em 4 semanas antes de qualquer diagnóstico.","Errada: não há zona de repetição no critério brasileiro; 92 a 125 mg/dL já é diagnóstico de DMG."],["Resultado normal para a gestação; solicitar TOTG 75 g entre 24 e 28 semanas, como na rotina.","Errada: aplica o corte de não gestante (100 mg/dL). Na gestação o corte é 92 mg/dL."],["Solicitar TOTG 75 g agora para confirmar ou afastar o diabetes gestacional suspeito.","Errada: o TOTG serve para quem tem jejum abaixo de 92; com 92 a 125 o diagnóstico já está feito."]],"conc":"A glicemia de jejum da primeira consulta classifica a gestante em três faixas: abaixo de 92 (normal, segue para TOTG com 24 a 28 semanas), 92 a 125 (DMG) e 126 ou mais (DM diagnosticado na gestação).","rac":"1) Gestante sem DM prévio na primeira consulta. 2) Jejum de 98 mg/dL. 3) Está entre 92 e 125. 4) Logo, DMG; não se repete nem se confirma com TOTG. 5) Inicia-se terapia nutricional, atividade física e perfil glicêmico capilar.","pista":"Valor de jejum entre 92 e 125 mg/dL em gestante, em qualquer trimestre.","mud":"Jejum de 126 mg/dL ou mais mudaria para DM diagnosticado na gestação; jejum abaixo de 92 mudaria para TOTG 75 g com 24 a 28 semanas.","cmp":"Fora da gestação, 100 a 125 é glicemia de jejum alterada; na gestação, 92 a 125 já é DMG.","arm":"Usar os cortes de não gestante (100/126) ou pedir TOTG para confirmar um jejum já diagnóstico.","regra":"Jejum na gestação: menor que 92 normal; 92 a 125 DMG; 126 ou mais DM diagnosticado na gestação.","cf":"Se a mesma gestante tivesse jejum de 88 mg/dL, o próximo passo seria o TOTG 75 g com jejum, 1 h e 2 h entre 24 e 28 semanas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 6 (tabela de glicemia de jejum), com base no slide 24 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); SBD, Rastreamento e diagnóstico da hiperglicemia na gestação, R1 e R3."},{"n":2,"sub":"TOTG com um único valor alterado","eixo":"Rastreio e diagnóstico","comp":"Aplicar o critério IADPSG de um valor alterado no TOTG 75 g","enun":"Gestante de 31 anos, 26 semanas, jejum inicial de 84 mg/dL. Realiza TOTG 75 g com preparo adequado: jejum 84 mg/dL, 1 hora 186 mg/dL, 2 horas 141 mg/dL. Qual é o diagnóstico segundo o critério adotado no Brasil?","ops":[["Diabetes gestacional, pois basta um valor alterado no TOTG 75 g.","Correta: pelo IADPSG/SBD, 1 h de 180 mg/dL ou mais isoladamente define DMG."],["Teste normal, porque o critério exige pelo menos dois valores acima dos cortes.","Errada: dois valores alterados é o critério do TOTG 100 g de 3 horas (Carpenter-Coustan), usado pelo ACOG."],["Diabetes diagnosticado na gestação, porque o valor de 1 hora superou 180 mg/dL.","Errada: não existe corte de 1 hora para DM diagnosticado na gestação; esse diagnóstico usa jejum de 126 ou 2 h de 200."],["Teste inconclusivo; repetir o TOTG em duas semanas mantendo a dieta habitual.","Errada: o TOTG 75 g não tem resultado limítrofe nem exige repetição; um valor alterado já fecha o diagnóstico."]],"conc":"No TOTG 75 g de uma etapa (IADPSG, OMS, SBD, FEBRASGO), os cortes são 92 (jejum), 180 (1 h) e 153 (2 h), e um único valor igual ou acima basta para DMG.","rac":"1) Jejum 84: abaixo de 92. 2) 1 h 186: acima de 180, alterado. 3) 2 h 141: abaixo de 153. 4) Um valor alterado. 5) DMG.","pista":"Glicemia de 1 hora de 186 mg/dL no TOTG 75 g.","mud":"Se o valor de 2 horas fosse 200 mg/dL ou mais, o diagnóstico seria DM diagnosticado na gestação.","cmp":"TOTG 75 g (Brasil): um valor alterado. TOTG 100 g (ACOG): dois valores alterados após rastreio com 50 g.","arm":"Transportar a regra de dois valores do TOTG 100 g para o TOTG 75 g.","regra":"TOTG 75 g na gestação: 92, 180 e 153; um valor basta.","cf":"Uma gestante com jejum 90, 1 h 170 e 2 h 155 também tem DMG, agora pelo valor de 2 horas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 6 (TOTG 75 g e divergência internacional), slide 24 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); SBD, Rastreamento e diagnóstico, R4 a R6."},{"n":3,"sub":"Diabetes franco diagnosticado na gestação","eixo":"Rastreio e diagnóstico","comp":"Separar DM diagnosticado na gestação de DMG e reconhecer suas implicações","enun":"Gestante de 36 anos, G3P2, 9 semanas, obesa, sem diagnóstico prévio de diabetes. Glicemia de jejum na primeira consulta: 134 mg/dL, confirmada em segunda amostra. Qual é a classificação correta e a implicação mais importante?","ops":[["DM diagnosticado na gestação, com rastreio de complicações crônicas.","Correta: jejum de 126 ou mais define DM diagnosticado na gestação, que provavelmente já existia na concepção."],["Diabetes gestacional; iniciar dieta e reavaliar a necessidade de insulina após duas semanas de terapia nutricional.","Errada: DMG é a faixa de 92 a 125; acima de 126 a classificação é DM diagnosticado na gestação (overt diabetes)."],["Glicemia alterada transitória do primeiro trimestre; aguardar o TOTG 75 g de 24 a 28 semanas para classificar.","Errada: com 126 ou mais o diagnóstico está feito e o TOTG não acrescenta informação útil."],["Pré-diabetes gestacional; orientar mudanças de estilo de vida e repetir a glicemia de jejum no segundo trimestre.","Errada: não existe pré-diabetes gestacional; a gestante com jejum de 134 tem DM."]],"conc":"A SBD/OMS separa a hiperglicemia detectada na gestação em DMG e DM diagnosticado na gestação. O segundo atinge critérios de diabetes fora da gestação e se comporta como DM pré-gestacional.","rac":"1) Jejum confirmado de 134 mg/dL. 2) Igual ou acima de 126. 3) Classifica-se como DM diagnosticado na gestação. 4) Como a hiperglicemia já existia na organogênese, há risco de malformação e de lesão de órgão-alvo. 5) Trata-se e rastreiam-se retinopatia, nefropatia e outras complicações.","pista":"Jejum de 126 mg/dL ou mais em qualquer fase da gestação.","mud":"Um jejum de 110 mg/dL mudaria a classificação para DMG.","cmp":"DMG: hiperglicemia que surge na segunda metade, sem efeito na organogênese. DM diagnosticado na gestação: hiperglicemia presente na concepção, com risco malformativo.","arm":"Chamar de DMG todo diabetes descoberto no pré-natal, como fazia a definição antiga do slide 2.","regra":"Jejum de 126 ou mais, 2 h de 200 ou mais, HbA1c de 6,5% ou mais no 1º trimestre ou glicemia ao acaso de 200 ou mais: DM diagnosticado na gestação.","cf":"Uma gestante com glicemia ao acaso de 230 mg/dL e polidipsia também recebe o diagnóstico de DM diagnosticado na gestação, sem necessidade de TOTG.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 1 (definição) e seção 6, slides 2 e 24 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); SBD/OMS 2013 (classificação da hiperglicemia na gestação)."},{"n":4,"sub":"Pré-natal iniciado após 28 semanas","eixo":"Rastreio e diagnóstico","comp":"Definir o momento do TOTG conforme a idade gestacional de início do pré-natal","enun":"Gestante de 24 anos inicia o pré-natal com 31 semanas, sem exames prévios e sem diabetes conhecido. Exame físico normal, altura uterina compatível. Em serviço com viabilidade técnica total, qual é a conduta para o rastreio de hiperglicemia?","ops":[["Realizar o TOTG 75 g imediatamente, com jejum, 1 hora e 2 horas.","Correta: no início após 28 semanas o TOTG é feito de imediato, sem aguardar janela."],["Solicitar apenas glicemia de jejum, pois a janela do TOTG de 24 a 28 semanas já passou.","Errada: a janela perdida não dispensa o TOTG; ele é indicado logo, pois ainda é a forma de detectar quase todos os casos."],["Dispensar o rastreio, já que o diagnóstico tardio não mudaria mais o desfecho perinatal.","Errada: o tratamento após o diagnóstico ainda reduz macrossomia e complicações; o rastreio é universal."],["Dosar HbA1c e só pedir o TOTG se o valor estiver entre 5,7% e 6,4%.","Errada: a HbA1c é opcional na primeira consulta e tem baixa sensibilidade para DMG; não substitui o TOTG."]],"conc":"O TOTG 75 g é feito entre 24 e 28 semanas para quem começou cedo; quem inicia entre 20 e 28 faz o quanto antes dentro da janela, e quem inicia depois de 28 semanas faz imediatamente.","rac":"1) Início com 31 semanas. 2) Rastreio é universal. 3) Viabilidade total permite TOTG. 4) Fora da janela, a regra é fazer já. 5) TOTG 75 g imediato.","pista":"Primeira consulta após 28 semanas em serviço com TOTG disponível.","mud":"Em viabilidade parcial (sem TOTG), a conduta seria a glicemia de jejum isolada, com os mesmos cortes de 92 e 126.","cmp":"Início antes de 20 semanas: jejum já e TOTG com 24 a 28. Início entre 20 e 28: TOTG o quanto antes. Início após 28: TOTG imediato.","arm":"Achar que o rastreio perde o sentido no terceiro trimestre.","regra":"Pré-natal após 28 semanas: TOTG 75 g imediato.","cf":"Uma gestante que chega com 22 semanas faz glicemia de jejum na consulta e TOTG assim que completar 24 semanas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 6 (quando fazer o TOTG conforme o início do pré-natal), slide 24 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); OPAS/MS/FEBRASGO/SBD 2017."},{"n":5,"sub":"Rastreio em viabilidade parcial","eixo":"Rastreio e diagnóstico","comp":"Aplicar a estratégia de viabilidade parcial quando o TOTG não está disponível","enun":"Em município sem acesso ao TOTG 75 g, uma gestante de 29 anos com 12 semanas tem glicemia de jejum inicial de 86 mg/dL. Segundo o consenso OPAS/MS/FEBRASGO/SBD, qual deve ser o próximo passo do rastreio?","ops":[["Repetir a glicemia de jejum entre 24 e 28 semanas, com os mesmos cortes de 92 e 126 mg/dL.","Correta: na viabilidade parcial, a glicemia de jejum é repetida entre 24 e 28 semanas e detecta cerca de 86% dos casos."],["Encerrar o rastreio, já que a glicemia inicial foi normal e não há TOTG disponível na rede.","Errada: o rastreio continua com a segunda glicemia de jejum; encerrar deixaria de detectar o DMG da segunda metade."],["Solicitar glicemia capilar pós-prandial semanal até o parto como substituta do TOTG.","Errada: essa estratégia não é a recomendada; a substituta validada é a glicemia de jejum entre 24 e 28 semanas."],["Encaminhar ao pré-natal de alto risco só para realizar o TOTG em outro município.","Errada: o consenso criou a estratégia de viabilidade parcial justamente para que a gestante não fique sem rastreio nem precise ser referenciada."]],"conc":"A estratégia de viabilidade parcial usa só a glicemia de jejum: na primeira consulta e, se menor que 92 antes de 24 semanas, novamente entre 24 e 28 semanas.","rac":"1) Sem TOTG: viabilidade parcial. 2) Jejum inicial de 86, abaixo de 92. 3) Repetir o jejum entre 24 e 28 semanas. 4) 92 ou mais será DMG; 126 ou mais, DM.","pista":"Ausência de TOTG na rede com glicemia de jejum inicial normal.","mud":"Se o TOTG estivesse disponível, o próximo passo seria o TOTG 75 g entre 24 e 28 semanas, que detecta quase 100% dos casos.","cmp":"Viabilidade total: jejum mais TOTG (cerca de 100% de detecção). Viabilidade parcial: dois jejuns (cerca de 86%).","arm":"Concluir que, sem TOTG, não há como rastrear.","regra":"Sem TOTG: repetir a glicemia de jejum entre 24 e 28 semanas.","cf":"Se a segunda glicemia de jejum com 26 semanas for 95 mg/dL, a gestante tem DMG e inicia terapia nutricional.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 6 (viabilidade parcial); OPAS/MS/FEBRASGO/SBD, Rastreamento e diagnóstico de DMG no Brasil, 2017."},{"n":6,"sub":"Hormônio diabetogênico da placenta","eixo":"Fisiopatologia","comp":"Relacionar a resistência insulínica ao lactogênio placentário e à massa placentária","enun":"Uma estudante pergunta por que o TOTG de rotina é feito entre 24 e 28 semanas, e não no primeiro trimestre. Qual explicação fisiopatológica é a mais adequada?","ops":[["A resistência à insulina cresce com a massa placentária e o lactogênio placentário, ficando evidente na segunda metade.","Correta: o hPL, principal hormônio diabetogênico, aumenta com a placenta e torna a resistência insulínica marcante a partir do segundo trimestre."],["No primeiro trimestre o pâncreas fetal ainda não produz insulina, e por isso a glicemia materna não se altera.","Errada: a resistência materna não depende da insulina fetal; o fator dominante é hormonal placentário."],["A gonadotrofina coriônica, que atinge o pico no primeiro trimestre, é o principal hormônio que causa resistência insulínica.","Errada: o hCG não é o hormônio diabetogênico central; o principal é o lactogênio placentário."],["A progesterona aumenta a sensibilidade à insulina durante toda a gestação, e por isso o teste precoce sairia falsamente alterado.","Errada: na primeira metade estrogênio e progesterona estimulam a célula beta, mas depois participam da resistência; o teste precoce tende a subdiagnosticar, não a superdiagnosticar."]],"conc":"A primeira metade da gestação é anabólica, com sensibilidade à insulina preservada; a segunda é catabólica, com resistência crescente induzida por hPL, GH placentário, cortisol e prolactina.","rac":"1) O hPL é produzido pelo sinciciotrofoblasto. 2) Sobe com a massa placentária. 3) A resistência se torna máxima no terceiro trimestre. 4) Entre 24 e 28 semanas já é possível detectar quem não compensa. 5) Daí a janela do TOTG.","pista":"Relação entre massa placentária, lactogênio placentário e momento do teste.","mud":"Se a pergunta fosse sobre a hiperglicemia já presente no primeiro trimestre, a explicação seria DM pré-existente, e não DMG.","cmp":"Primeira metade: anabolismo e sensibilidade à insulina. Segunda metade: catabolismo, lipólise e resistência.","arm":"Atribuir ao hCG ou à progesterona isolada o papel do lactogênio placentário.","regra":"Principal hormônio da resistência insulínica gestacional: lactogênio placentário.","cf":"O mesmo raciocínio explica por que a dose de insulina costuma subir entre 28 e 32 semanas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seções 2 e 3 (fisiologia e fisiopatologia), slides 4 a 6 e 8 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026)."},{"n":7,"sub":"Reserva da célula beta","eixo":"Fisiopatologia","comp":"Explicar por que nem toda gestante resistente à insulina desenvolve DMG","enun":"Duas gestantes de 28 semanas têm o mesmo grau de resistência insulínica fisiológica. Uma tem TOTG normal e a outra desenvolve DMG. A segunda tem síndrome dos ovários policísticos e acantose nigricans. Qual fator melhor explica a diferença?","ops":[["Menor reserva secretória da célula beta, já consumida pela resistência insulínica prévia.","Correta: o que separa os grupos é a capacidade da célula beta de compensar; quem já era resistente tem menos reserva."],["Maior passagem de insulina materna para o feto, que reduz a insulina disponível para a mãe.","Errada: a insulina é molécula grande e praticamente não atravessa a placenta."],["Produção excessiva de insulina pelo feto, que eleva a glicemia materna por contrarregulação.","Errada: a insulina fetal age no feto e não eleva a glicemia materna."],["Ausência de lactogênio placentário na gestante com SOP, que inverte a fisiologia do terceiro trimestre.","Errada: toda placenta produz hPL; a SOP não suprime o hormônio."]],"conc":"O DMG resulta de resistência insulínica (hormonal e prévia) somada à disfunção da célula beta. A resistência é universal; a falha de compensação, não.","rac":"1) Resistência igual nas duas. 2) Diferença está na resposta pancreática. 3) SOP e acantose indicam resistência prévia. 4) A reserva beta já estava em uso antes da gestação. 5) Com o hPL, falta reserva: DMG.","pista":"SOP e acantose nigricans como marcadores de resistência insulínica pré-gestacional.","mud":"Se a pergunta fosse sobre o fator comum às duas, a resposta seria o aumento dos hormônios contrarreguladores placentários.","cmp":"Resistência insulínica: presente em toda gestante. Disfunção beta: presente só em quem desenvolve DMG.","arm":"Pensar que o DMG é causado apenas por excesso alimentar.","regra":"DMG = resistência gestacional mais célula beta sem reserva.","cf":"Essa é a base para a comunicação sem culpa: o diagnóstico decorre de hormônios placentários e predisposição, não de 'comer errado'.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 3 (o elo que a prova cobra) e seção 16, slides 8 e 9 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026)."},{"n":8,"sub":"Perfil glicêmico dentro da meta","eixo":"Metas e automonitorização","comp":"Interpretar o perfil capilar e manter terapia não farmacológica quando as metas são atingidas","enun":"Gestante de 30 semanas com DMG, há 2 semanas em dieta fracionada e caminhadas, traz perfil diário de 4 pontos: jejum entre 84 e 93 mg/dL e 1 hora pós-prandial entre 122 e 137 mg/dL. Ultrassonografia: circunferência abdominal fetal no percentil 55. Qual é a conduta?","ops":[["Manter terapia nutricional e atividade física, com o mesmo perfil de automonitorização.","Correta: jejum abaixo de 95 e 1 h abaixo de 140 estão na meta, e a CA fetal está abaixo do p75."],["Iniciar insulina NPH noturna, porque alguns valores de jejum passaram de 90 mg/dL.","Errada: a meta de jejum é abaixo de 95 mg/dL; valores de 90 a 93 estão adequados."],["Iniciar metformina, que é indicada em todas as gestantes com DMG após 28 semanas.","Errada: o tratamento farmacológico só é indicado quando as metas não são atingidas ou a CA fetal é de p75 ou mais."],["Restringir os carboidratos para menos de 30% do valor calórico para manter a glicemia mais baixa.","Errada: a restrição excessiva gera cetonúria; a dieta recomendada tem 40 a 50% de carboidratos."]],"conc":"As metas são jejum abaixo de 95 mg/dL, 1 h pós-prandial abaixo de 140 e 2 h abaixo de 120. Atingidas as metas e com CA fetal abaixo de p75, mantém-se a terapia não farmacológica.","rac":"1) Jejum máximo de 93: na meta. 2) 1 h máxima de 137: na meta. 3) CA fetal p55: sem crescimento acelerado. 4) Não há indicação de fármaco. 5) Manter.","pista":"Todos os valores abaixo de 95 (jejum) e de 140 (1 h), com CA fetal abaixo de p75.","mud":"CA fetal de p75 ou mais entre 29 e 33 semanas indicaria insulina mesmo com glicemias na meta.","cmp":"Metas: jejum menor que 95; 1 h menor que 140; 2 h menor que 120.","arm":"Usar metas de jejum mais baixas que as diretrizes e iniciar insulina sem necessidade.","regra":"Meta atingida e CA abaixo de p75: manter dieta e exercício.","cf":"Se a mesma gestante passasse a ter três jejuns de 104 mg/dL na semana, haveria indicação de insulina NPH ao deitar.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 8 (metas glicêmicas) e seção 9 (quando iniciar), slides 32 e 33 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); SBD, Planejamento, metas e monitorização, R8."},{"n":9,"sub":"Frequência da automonitorização","eixo":"Metas e automonitorização","comp":"Prescrever o perfil capilar adequado ao tipo de tratamento","enun":"Gestante de 27 semanas recebe o diagnóstico de DMG pelo TOTG e iniciará apenas terapia nutricional e atividade física. O serviço tem viabilidade total de glicosímetro e fitas. Qual esquema de automonitorização é o recomendado?","ops":[["Perfil diário de 4 pontos: jejum e após café, almoço e jantar.","Correta: no tratamento não farmacológico com viabilidade total, o perfil é de 4 pontos diários (OPAS 2019 e SBD)."],["Perfil diário de 6 pontos, incluindo glicemias antes do almoço e antes do jantar.","Errada: o perfil de 6 pontos é o indicado para quem usa tratamento farmacológico."],["Glicemia de jejum semanal no laboratório e HbA1c mensal para acompanhar a resposta.","Errada: o ajuste é feito pelo perfil capilar; HbA1c não é validada para conduzir o DMG."],["Frutosamina quinzenal, que substitui a glicemia capilar por refletir as últimas semanas.","Errada: a frutosamina não é superior à curva de glicemia capilar e não a substitui."]],"conc":"Com tratamento não farmacológico, o perfil é de 4 pontos (jejum e pós-prandiais); com insulina, de 6 pontos (acrescentando pré-prandiais), podendo incluir 3 h da manhã.","rac":"1) Tratamento: só dieta e exercício. 2) Viabilidade total. 3) Quadro 19 da OPAS: 4 pontos diários. 4) Pré-prandiais ficam para quem usa insulina.","pista":"Tratamento não farmacológico com recurso disponível.","mud":"Se iniciasse insulina, o perfil passaria a 6 pontos; em viabilidade parcial, 4 pontos três vezes por semana.","cmp":"Não farmacológico: 4 pontos. Farmacológico: 6 pontos.","arm":"Pedir HbA1c ou frutosamina como guia do tratamento.","regra":"O perfil capilar é o exame que conduz o tratamento do DMG.","cf":"Uma gestante em insulina com suspeita de hipoglicemia noturna acrescenta a medida das 3 h da manhã.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 8 (frequência da automonitorização e exames laboratoriais), slides 37 a 39 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); OPAS 2019, Quadro 19."},{"n":10,"sub":"Exame que ajusta o tratamento","eixo":"Metas e automonitorização","comp":"Reconhecer as limitações da HbA1c no DMG","enun":"Gestante de 33 semanas com DMG em uso de insulina NPH e regular apresenta HbA1c de 5,4%, mas o diário mostra glicemias de 1 hora pós-almoço entre 158 e 172 mg/dL em 5 dos últimos 7 dias. Qual é a interpretação correta?","ops":[["O controle está inadequado e a dose prandial do almoço deve ser ajustada pelo perfil capilar.","Correta: o perfil capilar conduz o tratamento; a HbA1c cai fisiologicamente na gestação e não foi validada com desfechos no DMG."],["O controle está adequado, porque a HbA1c abaixo de 6% é o principal alvo no diabetes gestacional.","Errada: a HbA1c não é o parâmetro de ajuste no DMG e pode estar falsamente baixa."],["É necessário dosar a frutosamina para decidir qual dos dois exames está correto.","Errada: a frutosamina não é superior ao perfil capilar; a decisão já está dada pelas glicemias."],["O diário deve estar incorreto, e o mais seguro é manter a dose até repetir a HbA1c em 4 semanas.","Errada: postergar ajuste com glicemias persistentemente altas expõe o feto à hiperinsulinemia."]],"conc":"A HbA1c cai na gestação pelo maior turnover de hemácias e não tem validação com desfechos fetais no DMG. O ajuste é feito pelo perfil glicêmico capilar.","rac":"1) 1 h pós-almoço acima de 140 na maioria dos dias. 2) Controle inadequado nessa refeição. 3) HbA1c normal não invalida o perfil. 4) Ajustar a insulina regular antes do almoço.","pista":"Discordância entre HbA1c baixa e glicemias pós-prandiais altas.","mud":"Se as glicemias estivessem na meta, a conduta seria manter a dose, independentemente da HbA1c.","cmp":"HbA1c: útil para diagnóstico no 1º trimestre e no planejamento pré-concepcional do DM prévio. Perfil capilar: guia do tratamento do DMG.","arm":"Confiar na HbA1c normal e ignorar as glicemias capilares.","regra":"Ajuste no DMG = perfil capilar, nunca HbA1c.","cf":"Se só o jejum estivesse alto, o ajuste seria na NPH noturna.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 8 (exames laboratoriais), slide 39 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026)."},{"n":11,"sub":"Valor calórico na gestante obesa","eixo":"Dieta e atividade física","comp":"Prescrever o valor calórico e a distribuição da dieta no DMG","enun":"Gestante de 29 semanas, IMC pré-gestacional de 34 kg/m², recebe diagnóstico de DMG. Qual prescrição nutricional está de acordo com o material da disciplina?","ops":[["25 kcal/kg de peso ideal, em 6 refeições, com 40 a 50% de carboidratos e ceia.","Correta: obesas recebem 25 kcal/kg de peso ideal, fracionado em seis refeições, sem restrição que gere cetonúria."],["35 kcal/kg de peso ideal, em 3 refeições grandes para reduzir o número de picos pós-prandiais.","Errada: 35 kcal/kg é para IMC baixo; e o fracionamento em 6 refeições reduz os picos."],["Dieta de 1.000 kcal/dia com menos de 20% de carboidratos, até perder 5% do peso.","Errada: dieta muito restritiva causa cetonúria por jejum acelerado e não é recomendada na gestação."],["30 kcal/kg do peso atual, sem ceia, para evitar hiperglicemia de jejum na manhã seguinte.","Errada: o cálculo usa o peso ideal, 30 kcal/kg é para IMC adequado, e a ceia previne cetose noturna."]],"conc":"O valor calórico é calculado por peso ideal: 35 kcal/kg (IMC baixo), 30 kcal/kg (adequado) e 25 kcal/kg (obesas), em 6 refeições com 40 a 50% de carboidratos.","rac":"1) IMC 34: obesidade. 2) 25 kcal/kg de peso ideal. 3) Distribuição em 6 refeições (café 15%, lanches 10%, almoço 30%, jantar 25%, ceia 10%). 4) Evitar cetonúria.","pista":"IMC acima de 30 define a faixa de 25 kcal/kg.","mud":"Com IMC de 22, a prescrição seria 30 kcal/kg de peso ideal.","cmp":"IMC baixo 35, adequado 30, obesidade 25 kcal/kg de peso ideal.","arm":"Prescrever dieta restritiva 'para não precisar de insulina', provocando cetose.","regra":"No DMG, carboidrato é distribuído, não proibido.","cf":"Uma gestante com DMG e IMC 18 recebe 35 kcal/kg de peso ideal e o mesmo fracionamento.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 7 (terapia nutricional), slides 26 e 27 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026)."},{"n":12,"sub":"Contraindicações à atividade física","eixo":"Dieta e atividade física","comp":"Identificar contraindicações ao exercício no DMG","enun":"No ambulatório de pré-natal de alto risco, quatro gestantes com DMG recebem orientações. Em qual delas a prescrição de atividade física aeróbica diária deve ser evitada?","ops":[["Gestante de 32 semanas com feto em restrição de crescimento.","Correta: CIUR está entre as contraindicações listadas no material, ao lado de TPPT, sangramento, DHEG e retinopatia ou nefropatia."],["Gestante de 28 semanas com IMC de 36 kg/m² e sedentária antes da gravidez.","Errada: obesidade e sedentarismo prévio não contraindicam; o exercício leve a moderado é recomendado."],["Gestante de 30 semanas em uso de insulina NPH e regular com bom controle.","Errada: o uso de insulina não contraindica; orienta-se apenas atenção à hipoglicemia."],["Gestante de 26 semanas com glicemias pós-prandiais discretamente acima da meta.","Errada: nesse caso o exercício ajuda, pois o músculo capta glicose por GLUT4 sem depender de insulina."]],"conc":"A atividade física aeróbica leve a moderada, 30 a 40 minutos por dia, é recomendada (grau A). Antes, avaliam-se contraindicações: TPPT, sangramento, CIUR, DHEG e retinopatias ou nefropatias.","rac":"1) Verificar cada gestante contra a lista de contraindicações. 2) Apenas a com CIUR se enquadra. 3) Nas demais, o exercício é benéfico.","pista":"Restrição de crescimento fetal é contraindicação explícita.","mud":"Se a gestante de 28 semanas apresentasse sangramento vaginal, ela também teria contraindicação.","cmp":"Benefício: captação de glicose por GLUT4 e redução do pico pós-prandial. Limite: condições com risco materno ou fetal.","arm":"Contraindicar exercício para obesas ou insulinizadas.","regra":"Exercício no DMG: Borg 13 a 14, 30 a 40 min por dia, salvo TPPT, sangramento, CIUR, DHEG ou vasculopatia.","cf":"Uma gestante com DMG e pré-eclâmpsia também não deve receber prescrição de exercício.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 7 (atividade física), slides 29 e 30 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026)."},{"n":13,"sub":"Critério para iniciar insulina","eixo":"Insulinoterapia","comp":"Reconhecer falha da terapia não farmacológica","enun":"Gestante de 29 semanas com DMG, há 14 dias em dieta e exercício, apresenta no perfil de 4 pontos glicemias de jejum entre 101 e 108 mg/dL em 6 dos 14 dias; as pós-prandiais estão todas na meta. Qual é a melhor conduta?","ops":[["Iniciar insulina, com prioridade para a NPH ao deitar, pois o jejum está persistentemente acima da meta.","Correta: duas ou mais medidas acima da meta após 7 a 14 dias de terapia não farmacológica indicam fármaco, e o padrão de jejum isolado orienta a NPH noturna."],["Prolongar a dieta por mais 4 semanas antes de considerar fármaco, porque as pós-prandiais estão adequadas.","Errada: a resposta à dieta não deve ser avaliada por mais de duas semanas; prolongar expõe o feto à hiperglicemia."],["Iniciar glibenclamida antes de dormir, por ser via oral e agir na produção hepática noturna de glicose.","Errada: a glibenclamida não é recomendada na gestação (SBD R9) por mais hipoglicemia neonatal e macrossomia."],["Reduzir os carboidratos do jantar e da ceia, eliminando a ceia para não elevar a glicemia de jejum.","Errada: retirar a ceia prolonga o jejum noturno e favorece cetose; o problema exige fármaco."]],"conc":"Inicia-se tratamento farmacológico quando duas ou mais medidas estão acima da meta após 7 a 14 dias de dieta (ou 30 a 50% das medidas em uma semana). A insulina é a primeira escolha.","rac":"1) Duas semanas de terapia não farmacológica. 2) Jejum acima de 95 em 6 de 14 dias. 3) Critério de falha preenchido. 4) Fármaco de escolha: insulina. 5) Padrão só de jejum: NPH noturna em dose inicial menor.","pista":"Jejum acima de 95 mg/dL repetidamente após 2 semanas de dieta.","mud":"Se as alterações fossem só após o café, a escolha seria insulina prandial antes do café.","cmp":"Falha de dieta: 2 medidas alteradas na mesma refeição em 2 semanas ou mais de 50% em 1 semana (slide 32-33) / 30 a 50% (SBD).","arm":"Esperar o fim do mês para decidir, ou trocar insulina por hipoglicemiante oral.","regra":"Dieta falhou em até 2 semanas: insulina.","cf":"Uma gestante com perfil normal, mas CA fetal no p82 com 31 semanas, também tem indicação de insulina.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (quando iniciar e ajuste dirigido pelo perfil), slides 32 e 33 do material da disciplina 'Gestação e Diabetes' (Profa. Jacqueline Braga Pereira, 2026); SBD, Tratamento farmacológico do diabetes na gestação, R1 e R2."},{"n":14,"sub":"Cálculo da dose inicial de insulina","eixo":"Insulinoterapia","comp":"Calcular a dose total e a distribuição da insulina no DMG","enun":"Gestante de 80 kg, 30 semanas, com DMG e glicemias alteradas em jejum e após as três refeições, iniciará esquema de insulina segundo o slide da aula (0,5 UI/kg/dia). Qual distribuição é coerente com esse esquema?","ops":[["40 UI/dia: cerca de 27 UI antes do café e almoço e 13 UI antes do jantar, cada bloco com 2/3 NPH e 1/3 regular.","Correta: 0,5 x 80 = 40 UI; 2/3 (cerca de 27 UI) no bloco da manhã e 1/3 (cerca de 13 UI) no jantar, com 2/3 NPH e 1/3 regular em cada."],["80 UI/dia: metade NPH ao deitar e metade regular dividida igualmente antes das três refeições principais.","Errada: 80 UI corresponde a 1 UI/kg, o dobro da dose inicial recomendada, com risco de hipoglicemia."],["20 UI/dia: tudo como NPH pela manhã, sem insulina rápida, para reduzir o risco de hipoglicemia.","Errada: 20 UI seria 0,25 UI/kg e não cobre as pós-prandiais alteradas; esquemas só com NPH matinal não controlam as refeições."],["40 UI/dia: toda a dose como regular, dividida em quatro aplicações iguais antes das refeições e ao deitar.","Errada: a regular ao deitar causa hipoglicemia noturna e não substitui a insulina basal."]],"conc":"A dose inicial no DMG é de 0,5 UI/kg/dia, distribuída 2/3 antes do café e almoço e 1/3 antes do jantar, cada bloco com 2/3 de NPH e 1/3 de regular, ajustada a cada 1 a 2 semanas.","rac":"1) 0,5 x 80 = 40 UI. 2) 2/3 de 40 = cerca de 27 UI (manhã/almoço). 3) 1/3 = cerca de 13 UI (jantar). 4) Em cada bloco, 2/3 NPH e 1/3 regular.","pista":"Dose por peso de 0,5 UI/kg e frações 2/3 e 1/3.","mud":"Se só o jejum estivesse alterado, a dose inicial seria menor (0,1 a 0,2 UI/kg/dia) e só de NPH noturna.","cmp":"Esquema completo: 0,5 UI/kg/dia. Alteração isolada: 0,1 a 0,2 UI/kg/dia na refeição ou no período alterado.","arm":"Errar o peso (usar 1 UI/kg) ou concentrar regular ao deitar.","regra":"Peso x 0,5, depois 2/3 manhã e 1/3 noite; em cada bloco, 2/3 NPH e 1/3 regular.","cf":"Uma gestante de 60 kg começaria com cerca de 30 UI/dia (20 UI no bloco da manhã e 10 UI no jantar).","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (dose inicial e exemplo resolvido), slide 34 do material da disciplina (Zugaib); SBD, Tratamento farmacológico, R4."},{"n":15,"sub":"Hiperglicemia isolada de jejum","eixo":"Insulinoterapia","comp":"Ajustar a insulina conforme o padrão do perfil glicêmico","enun":"Gestante de 31 semanas, 68 kg, com DMG. Após 2 semanas de dieta, as pós-prandiais estão na meta, mas o jejum varia de 99 a 106 mg/dL. Qual é o esquema inicial mais adequado?","ops":[["NPH ao deitar em dose baixa, de 0,1 a 0,2 UI/kg/dia, com ajuste pelo jejum.","Correta: alteração isolada de jejum se trata com NPH noturna em dose inicial menor (SBD, nota 3)."],["Esquema completo de 0,5 UI/kg/dia com NPH e regular antes do café, almoço e jantar.","Errada: as pós-prandiais estão na meta; o esquema completo aumentaria o risco de hipoglicemia diurna."],["Insulina regular antes do jantar, para reduzir a glicemia da madrugada e do jejum.","Errada: a regular age por poucas horas e não cobre a produção hepática noturna que eleva o jejum."],["Insulina ultrarrápida ao acordar, aplicada logo após a medida de jejum, todos os dias.","Errada: a correção após a medida não trata a causa; o jejum alto reflete falta de insulina basal noturna."]],"conc":"O perfil capilar indica onde falta insulina: jejum alto pede basal noturna (NPH ao deitar); pós-prandial alto pede insulina prandial antes da refeição correspondente.","rac":"1) Pós-prandiais na meta. 2) Jejum acima de 95. 3) Falta insulina basal noturna. 4) NPH ao deitar, 0,1 a 0,2 UI/kg/dia (7 a 14 UI). 5) Ajustar pelo jejum.","pista":"Só o jejum está alterado.","mud":"Se só o pós-café estivesse alto, a escolha seria insulina prandial antes do café.","cmp":"Jejum alto: NPH noturna. Pós-prandial alto: regular ou ultrarrápida antes da refeição.","arm":"Iniciar o esquema completo para toda gestante que precise de insulina.","regra":"O padrão do perfil escolhe a insulina.","cf":"Se a mesma gestante passar a ter hipoglicemia de madrugada, mede-se a glicemia das 3 h e ajusta-se a NPH.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (ajuste dirigido pelo perfil); SBD, Tratamento farmacológico, nota 3."},{"n":16,"sub":"Circunferência abdominal fetal acima de p75","eixo":"Insulinoterapia","comp":"Indicar insulina por critério ultrassonográfico fetal","enun":"Gestante de 30 semanas com DMG em dieta tem perfil glicêmico dentro das metas. Ultrassonografia: peso fetal estimado no percentil 70, circunferência abdominal no percentil 88, circunferência cefálica no percentil 50, líquido amniótico normal. Qual é a conduta?","ops":[["Iniciar insulina, pois a circunferência abdominal fetal está acima do percentil 75 entre 29 e 33 semanas.","Correta: CA fetal de p75 ou mais entre 29 e 33 semanas indica insulina independentemente das glicemias (SBD R3; slide 33)."],["Manter a dieta, pois as metas glicêmicas maternas estão sendo atingidas e o peso fetal é menor que p90.","Errada: a CA aumentada revela hiperinsulinemia fetal mesmo com glicemias maternas aparentemente controladas."],["Indicar resolução da gestação com 34 semanas, porque o feto já é macrossômico.","Errada: o feto não é macrossômico (PFE p70) e não há indicação de parto pré-termo."],["Repetir a ultrassonografia apenas com 36 semanas para confirmar o crescimento acelerado.","Errada: a janela de 29 a 33 semanas serve justamente para agir; esperar perde a oportunidade."]],"conc":"A CA fetal reflete o crescimento insulinodependente (fígado e tecido adiposo). CA de p75 ou mais entre 29 e 33 semanas é critério de insulina mesmo com glicemias na meta.","rac":"1) Glicemias na meta. 2) CA p88 com 30 semanas. 3) Critério ultrassonográfico preenchido. 4) CC normal: crescimento assimétrico pró-abdome. 5) Iniciar insulina.","pista":"CA fetal no p88 com cabeça no p50 e 30 semanas.","mud":"Se a CA estivesse no p60, a conduta seria manter dieta e exercício.","cmp":"Critério materno: perfil glicêmico. Critério fetal: CA de p75 ou mais entre 29 e 33 semanas.","arm":"Olhar só a glicemia materna e ignorar o sinal fetal de hiperinsulinemia.","regra":"Feto com abdome grande entre 29 e 33 semanas: insulina.","cf":"A relação CC/CA reduzida reforça o padrão que predispõe à distócia de ombro.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seções 9 e 10 (macrossomia na USG), slides 33 e 41 do material da disciplina; SBD, Tratamento farmacológico, R3."},{"n":17,"sub":"Quando usar metformina","eixo":"Metformina e glibenclamida","comp":"Indicar metformina quando a insulina é inviável","enun":"Gestante de 32 semanas com DMG fora da meta após dieta. Mora sozinha, tem tremor essencial importante e baixa acuidade visual, e não consegue aspirar nem aplicar insulina; não há familiar disponível. Feto com crescimento no percentil 60. Qual é a conduta farmacológica mais adequada?","ops":[["Metformina, iniciando com 500 mg às refeições e titulando até o controle.","Correta: a dificuldade de autoadministração da insulina é indicação de hipoglicemiante oral, e a metformina é a alternativa preferida (SBD R7)."],["Glibenclamida, por ter menor passagem placentária que a metformina e dose única diária.","Errada: apesar da menor passagem, a glibenclamida aumenta hipoglicemia neonatal e macrossomia e não é recomendada (SBD R9)."],["Manter apenas dieta mais restrita, porque nenhuma medicação oral é permitida na gestação.","Errada: a metformina é aceita como alternativa quando a insulina é inviável; restringir mais a dieta gera cetose."],["Insulina glargina em dose única, aplicada pela própria paciente uma vez por semana.","Errada: a glargina é diária e não resolve a impossibilidade de autoaplicação."]],"conc":"Indicações de hipoglicemiante oral (OPAS 2019): falta de acesso à insulina, dificuldade de autoadministração, estresse com a insulina que leva à restrição alimentar e necessidade de doses muito altas. A metformina é superior à glibenclamida.","rac":"1) Falha da dieta. 2) Insulina indicada, mas inviável pela autoaplicação. 3) Alternativa: metformina. 4) Feto sem restrição de crescimento, sem contraindicação. 5) Iniciar e titular.","pista":"Impossibilidade prática de autoaplicação de insulina.","mud":"Se o feto tivesse restrição de crescimento, a metformina não deveria ser iniciada.","cmp":"Metformina: alternativa aceita, atravessa a placenta. Glibenclamida: não recomendada.","arm":"Escolher glibenclamida por ter menor passagem placentária.","regra":"Insulina inviável: metformina; glibenclamida, não.","cf":"Uma gestante com mais de 2 UI/kg/dia de insulina sem controle pode receber metformina associada (SBD R8).","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (antidiabéticos orais), slide 36 do material da disciplina (OPAS 2019); SBD, Tratamento farmacológico, R7 a R9."},{"n":18,"sub":"Glibenclamida na gestação","eixo":"Metformina e glibenclamida","comp":"Justificar por que a glibenclamida não é recomendada","enun":"Um colega sugere glibenclamida para uma gestante de 30 semanas com DMG que recusa insulina, alegando que o fármaco 'quase não chega ao feto'. Qual argumento científico contraria essa escolha?","ops":[["Metanálises mostram mais hipoglicemia neonatal e recém-nascidos mais pesados com glibenclamida.","Correta: a glibenclamida está associada a mais hipoglicemia neonatal (RR em torno de 2,3) e macrossomia; a SBD não a recomenda."],["A glibenclamida é teratogênica no terceiro trimestre e causa fechamento precoce do ducto arterioso.","Errada: o fechamento do ducto é efeito dos AINEs; a crítica à glibenclamida é metabólica neonatal."],["A glibenclamida não reduz a glicemia materna na gestação, porque a placenta inativa sulfonilureias.","Errada: ela reduz a glicemia materna; o problema são os desfechos neonatais e a passagem placentária relevante (70 a 77% no cordão)."],["A glibenclamida só pode ser usada antes de 20 semanas, quando a resistência insulínica ainda é baixa.","Errada: não existe essa janela; o fármaco não é recomendado em nenhuma fase."]],"conc":"A glibenclamida atravessa a placenta em níveis de 70 a 77% dos maternos no cordão e se associa a mais hipoglicemia neonatal e macrossomia. A SBD a classifica como não recomendada (R9, classe III).","rac":"1) O argumento do colega é falso: há passagem relevante. 2) O desfecho que importa é neonatal. 3) Mais hipoglicemia e RN mais pesados. 4) Logo, não usar.","pista":"Desfechos neonatais desfavoráveis nas metanálises.","mud":"Se a pergunta fosse sobre a alternativa aceita, a resposta seria a metformina.","cmp":"Metformina: passagem livre, menos hipoglicemia neonatal grave que insulina no MiG. Glibenclamida: passagem parcial, mais hipoglicemia neonatal.","arm":"Confundir menor passagem placentária com maior segurança.","regra":"Na gestação, glibenclamida não.","cf":"Diante de recusa da insulina por medo, a primeira medida é trabalhar o medo e ensinar a aplicação; só depois considerar metformina.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (tabela metformina x glibenclamida) e seção 17 de erros frequentes; SBD, Tratamento farmacológico, R9."},{"n":19,"sub":"Metformina com feto pequeno","eixo":"Metformina e glibenclamida","comp":"Reconhecer a contraindicação prática da metformina na restrição de crescimento","enun":"Gestante de 31 semanas com DMG fora da meta, que não consegue usar insulina por motivo social. Ultrassonografia: peso fetal estimado no percentil 4, Doppler de artéria umbilical com índice de pulsatilidade acima do p95. Qual é a conduta mais adequada?","ops":[["Não iniciar metformina; resolver a barreira à insulina e internar se preciso para controle.","Correta: metformina não deve ser iniciada com feto em restrição de crescimento; a insulina, se necessário com internação, é o caminho."],["Iniciar metformina em dose máxima de 2.500 mg/dia, porque o crescimento fetal reduzido indica bom controle.","Errada: feto pequeno não indica bom controle e é contraindicação prática à metformina."],["Iniciar glibenclamida, que não interfere no metabolismo mitocondrial fetal como a metformina.","Errada: a glibenclamida não é recomendada na gestação."],["Suspender a dieta para acelerar o crescimento fetal e aceitar glicemias acima da meta.","Errada: liberar a dieta não trata a restrição placentária e expõe a mãe e o feto à hiperglicemia."]],"conc":"A metformina atravessa livremente a placenta. Em feto com baixo peso ou restrição de crescimento ela não deve ser iniciada ou deve ser suspensa, pela supressão da respiração mitocondrial.","rac":"1) DMG fora da meta: fármaco indicado. 2) Insulina inviável por motivo social. 3) Mas o feto é pequeno com Doppler alterado. 4) Metformina contraindicada. 5) Viabilizar insulina, inclusive com internação.","pista":"PFE abaixo do p10 com Doppler umbilical alterado.","mud":"Com feto adequado para a idade gestacional, a metformina seria aceitável.","cmp":"Feto adequado: metformina possível. Feto com RCF: metformina não.","arm":"Usar metformina sem olhar o crescimento fetal.","regra":"Feto pequeno: não iniciar metformina.","cf":"A internação também permite vigilância fetal diária e corticoide se houver indicação de parto.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 9 (tabela de antidiabéticos orais, contraindicação prática) e seção 11 (internação), slide 42 do material da disciplina."},{"n":20,"sub":"Planejamento no DM pré-gestacional","eixo":"DM pré-gestacional","comp":"Orientar o planejamento pré-concepcional da mulher com diabetes","enun":"Mulher de 30 anos com DM1 há 14 anos deseja engravidar. HbA1c atual de 9,6%, usa enalapril por microalbuminúria e atorvastatina. Qual é a orientação adequada?","ops":[["Adiar a gestação até melhor controle, buscando HbA1c próxima de 6%, e trocar o enalapril e a estatina.","Correta: HbA1c acima de 9% justifica adiar (SBD R3); meta ideal em torno de 6%; IECA e estatina devem ser suspensos antes da concepção."],["Engravidar já, porque a gestação melhora a sensibilidade à insulina e facilita o controle no 1º trimestre.","Errada: a hiperglicemia na organogênese aumenta malformações e abortamento; a melhora da sensibilidade traz risco de hipoglicemia, não benefício."],["Manter enalapril e estatina durante toda a gestação para proteger os rins e o coração.","Errada: IECA e estatina são teratogênicos ou contraindicados; devem ser trocados antes de engravidar."],["Trocar a insulina por metformina antes da concepção para reduzir o risco de malformações.","Errada: no DM1 a insulina é obrigatória; a metformina não a substitui."]],"conc":"No DM pré-gestacional, o planejamento busca HbA1c em torno de 6% antes da concepção, ácido fólico até 12 semanas, avaliação de retina, rins, tireoide e coração e suspensão de teratogênicos.","rac":"1) DM1 com HbA1c de 9,6%. 2) Acima de 9%: adiar. 3) Usa IECA e estatina: suspender e trocar. 4) Rastrear complicações. 5) Engravidar com controle adequado.","pista":"HbA1c acima de 9% e uso de IECA e estatina.","mud":"Com HbA1c de 6,1% e fármacos ajustados, a gestação poderia ser liberada com seguimento especializado.","cmp":"Pré-concepção: HbA1c ideal cerca de 6%; acima de 9%, adiar.","arm":"Liberar a gestação sem otimizar o controle nem revisar medicamentos.","regra":"No DM pré-gestacional, a gravidez se planeja pelo controle glicêmico.","cf":"Na mesma paciente, o AAS em baixa dose deve ser iniciado entre 12 e 16 semanas para prevenir pré-eclâmpsia.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 14 (DM pré-gestacional); SBD, Tratamento farmacológico, R2, R3 e R17."},{"n":21,"sub":"Malformações no diabetes prévio","eixo":"DM pré-gestacional","comp":"Relacionar hiperglicemia na organogênese a malformações típicas","enun":"Gestante de 34 anos com DM2 mal controlado desde antes da concepção (HbA1c de 10% com 8 semanas). Na ultrassonografia morfológica, qual achado é o mais específico da embriopatia diabética?","ops":[["Síndrome de regressão caudal.","Correta: é a malformação mais específica do diabetes, embora as cardiopatias sejam as mais frequentes."],["Fenda labial isolada.","Errada: pode ocorrer em várias condições e não é marcador específico da hiperglicemia."],["Gastrosquise.","Errada: associa-se a mãe jovem e a fatores ambientais, não especificamente ao diabetes."],["Pé torto congênito.","Errada: é malformação comum e inespecífica, frequentemente posicional."]],"conc":"A hiperglicemia no primeiro trimestre (organogênese) causa malformações: cardiopatias (mais frequentes), defeitos de tubo neural e síndrome de regressão caudal (mais específica).","rac":"1) Hiperglicemia presente na organogênese. 2) Risco malformativo. 3) Pergunta pede o mais específico, não o mais frequente. 4) Regressão caudal.","pista":"A palavra 'específico' no enunciado.","mud":"Se a pergunta pedisse a malformação mais frequente, a resposta seria cardíaca.","cmp":"Mais frequente: cardiopatia. Mais específica: regressão caudal.","arm":"Atribuir ao DMG típico o mesmo risco malformativo do diabetes prévio.","regra":"DMG da segunda metade não causa malformação; DM prévio mal controlado, sim.","cf":"Por isso a mulher com DM prévio deve fazer ecocardiografia fetal no segundo trimestre.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 5 (mecanismo das complicações) e seção 14, slide 22 do material da disciplina."},{"n":22,"sub":"DM1 no primeiro trimestre","eixo":"DM pré-gestacional","comp":"Antecipar hipoglicemia no início da gestação em mulher com DM1","enun":"Gestante de 26 anos com DM1, 9 semanas, em esquema basal-bolus estável antes da gravidez, refere náuseas e três episódios de tremor e sudorese pela manhã, com glicemias capilares de 52 a 61 mg/dL. Qual é a explicação e a conduta?","ops":[["Maior sensibilidade à insulina no 1º trimestre; reduzir a dose de insulina.","Correta: no primeiro trimestre a sensibilidade à insulina aumenta e a ingestão cai, favorecendo hipoglicemia; reduz-se a dose."],["Resistência insulínica induzida pelo lactogênio placentário; aumentar a dose basal em 20%.","Errada: a resistência pelo hPL predomina na segunda metade; no primeiro trimestre o risco é hipoglicemia."],["Cetoacidose euglicêmica da gestação; iniciar insulina regular endovenosa.","Errada: as glicemias baixas com sintomas adrenérgicos indicam hipoglicemia, não cetoacidose."],["Hiperêmese gravídica com hipertireoidismo transitório; iniciar propiltiouracil.","Errada: o quadro é explicado pela insulina; não há dados de tireotoxicose."]],"conc":"No DM1, o primeiro trimestre combina maior sensibilidade à insulina e menor ingestão por náuseas, com risco de hipoglicemia grave; a dose costuma ser reduzida e sobe depois, na segunda metade.","rac":"1) DM1 com 9 semanas. 2) Glicemias abaixo de 70 com sintomas. 3) Primeiro trimestre: sensibilidade aumentada. 4) Náuseas reduzem ingestão. 5) Reduzir dose, corrigir com 15 g de carboidrato.","pista":"Hipoglicemias recorrentes no primeiro trimestre com náuseas.","mud":"Com 30 semanas, glicemias subindo levariam a aumentar a dose, pela resistência do hPL.","cmp":"DM1 no 1º trimestre: hipoglicemia. DM1 no 3º trimestre: necessidade de insulina crescente.","arm":"Aumentar a insulina por raciocínio de resistência gestacional em qualquer fase.","regra":"DM1 no início da gestação: atenção à hipoglicemia.","cf":"Logo após o parto, a mesma paciente precisará de cerca de 50% da dose pré-gestacional.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 14 (tabela DM pré-gestacional x DMG) e seção 15 (hipoglicemia materna)."},{"n":23,"sub":"Cetoacidose após corticoide antenatal","eixo":"Complicações maternas","comp":"Reconhecer cetoacidose na gestante e priorizar a estabilização materna","enun":"Gestante de 32 semanas com DM1 internada por ameaça de parto pré-termo recebeu betametasona há 24 horas sem ajuste de insulina. Apresenta vômitos, taquipneia e dor abdominal; glicemia de 238 mg/dL, pH 7,18, bicarbonato 11 mEq/L e cetonemia positiva. A cardiotocografia mostra desacelerações tardias. Qual é a prioridade?","ops":[["Tratar a cetoacidose com hidratação, insulina IV e potássio, reavaliando o feto após a correção materna.","Correta: as alterações da CTG costumam melhorar com a correção da acidose materna; estabilizar a mãe vem antes de decidir o parto."],["Cesárea de emergência, porque as desacelerações tardias indicam sofrimento fetal que não aguarda correção.","Errada: operar uma mãe em cetoacidose aumenta o risco materno e o traçado tende a normalizar com a correção."],["Suspender a insulina, pois a glicemia está abaixo de 250 e o quadro não preenche critério de cetoacidose.","Errada: na gestação a cetoacidose ocorre com glicemias mais baixas, até euglicêmicas; o pH e o bicarbonato confirmam o quadro."],["Repetir a betametasona e iniciar terbutalina para inibir as contrações antes de tratar a acidose.","Errada: beta-agonistas e corticoide são gatilhos de cetoacidose; não são prioridade aqui."]],"conc":"A cetoacidose na gestação ocorre com glicemias mais baixas pelo jejum acelerado; gatilhos incluem infecção, vômitos, corticoide antenatal e beta-agonistas. Ao fazer corticoide, deve-se aumentar a insulina e monitorizar por até 72 horas (SBD R13).","rac":"1) Acidose metabólica com cetonemia: cetoacidose. 2) Gatilho: betametasona sem ajuste. 3) Mãe instável: prioridade. 4) Hidratação, insulina, potássio. 5) Reavaliar CTG após a correção.","pista":"Desacelerações tardias em mãe acidótica.","mud":"Se o traçado persistisse alterado após a correção completa da acidose, a resolução fetal passaria a ser discutida.","cmp":"Cetoacidose fora da gestação: glicemia geralmente acima de 250. Na gestação: pode ocorrer com glicemia normal ou pouco elevada.","arm":"Decidir o parto pela CTG antes de estabilizar a mãe.","regra":"Corticoide antenatal em diabética: mais insulina e mais glicemias por 72 horas.","cf":"Uma gestante com DMG em insulina que recebe betametasona também precisa de ajuste preventivo da dose.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 15 (cetoacidose) e seção 11; SBD, Tratamento farmacológico, R13."},{"n":24,"sub":"DMG e pré-eclâmpsia","eixo":"Complicações maternas","comp":"Relacionar hiperglicemia, disfunção endotelial e benefício do tratamento","enun":"Sobre a relação entre diabetes gestacional e síndromes hipertensivas, qual afirmação é sustentada pelo material da disciplina e pelas evidências citadas?","ops":[["Tratar o DMG reduz pré-eclâmpsia, pela via comum de disfunção endotelial.","Correta: a hiperglicemia causa estresse oxidativo e menor óxido nítrico; o ensaio de Landon mostrou menos pré-eclâmpsia e hipertensão gestacional com tratamento."],["O DMG protege contra pré-eclâmpsia, porque a hiperinsulinemia materna causa vasodilatação periférica.","Errada: o DMG aumenta, e não reduz, o risco de pré-eclâmpsia."],["A pré-eclâmpsia no DMG só ocorre quando há nefropatia diabética prévia, o que é raro nesse grupo.","Errada: o aumento de risco existe no DMG sem nefropatia, pela disfunção endotelial."],["O tratamento do DMG não altera desfechos maternos e se justifica apenas pela macrossomia fetal.","Errada: ACHOIS e Landon mostraram benefício também materno, incluindo menos pré-eclâmpsia."]],"conc":"DMG e pré-eclâmpsia compartilham disfunção endotelial. Os ensaios ACHOIS e Landon/MFMU mostraram que tratar o DMG reduz macrossomia, distocia, cesárea e pré-eclâmpsia, sem aumentar PIG.","rac":"1) Hiperglicemia lesa o endotélio. 2) Endotélio é a via final da pré-eclâmpsia. 3) Tratar reduz o insulto. 4) Ensaios clínicos confirmam benefício materno.","pista":"Relação entre estresse oxidativo, óxido nítrico e resistência vascular.","mud":"Se a pergunta fosse sobre o DM pré-gestacional, acrescentaria a indicação de AAS 75 a 100 mg/dia de 12 a 28 semanas.","cmp":"DMG: risco de pré-eclâmpsia por disfunção endotelial. DM prévio: risco maior, com AAS profilático (SBD R17).","arm":"Pensar que o tratamento do DMG beneficia só o feto.","regra":"Tratar DMG reduz pré-eclâmpsia.","cf":"Por isso a gestante com DMG deve ter pressão arterial e proteinúria monitorizadas no pré-natal.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 3 (elo com a hipertensão), slide 12 do material da disciplina; ensaios ACHOIS (2005) e Landon (2009), citados pela SBD."},{"n":25,"sub":"Hipótese de Pedersen","eixo":"Complicações fetais e neonatais","comp":"Explicar o mecanismo da macrossomia no diabetes","enun":"Recém-nascido de mãe com DMG mal controlado pesa 4.380 g, com tronco e ombros desproporcionalmente grandes em relação ao polo cefálico. Qual mecanismo explica esse padrão de crescimento?","ops":[["Hiperinsulinemia fetal secundária à hiperglicemia materna (hipótese de Pedersen).","Correta: é a hipótese de Pedersen; a insulina fetal promove lipogênese, glicogênese e síntese proteica em tecidos insulinossensíveis."],["A insulina usada pela mãe atravessa a placenta e estimula diretamente o crescimento do tronco fetal.","Errada: a insulina terapêutica é molécula grande e praticamente não atravessa a placenta."],["O lactogênio placentário cruza para o feto e age como fator de crescimento muscular.","Errada: o hPL atua na resistência insulínica materna; o crescimento fetal excessivo decorre da insulina fetal."],["O excesso de líquido amniótico permite maior movimentação fetal e crescimento compensatório do tórax.","Errada: o polidrâmnio é consequência da diurese osmótica fetal, não causa da macrossomia."]],"conc":"A glicose atravessa a placenta por difusão facilitada; a insulina materna, não. O feto responde à hiperglicemia com hiperinsulinemia, que estimula crescimento de fígado, tecido adiposo e tronco, poupando a cabeça.","rac":"1) Mau controle materno. 2) Mais glicose ao feto. 3) Pâncreas fetal hipertrofia e secreta mais insulina. 4) Insulina fetal é anabólica. 5) Crescimento desproporcional de tronco e ombros.","pista":"Crescimento desproporcional do tronco em relação à cabeça.","mud":"Se a mãe tivesse diabetes com vasculopatia, o resultado esperado poderia ser restrição de crescimento por insuficiência placentária.","cmp":"Macrossomia diabética: assimétrica (tronco maior). Macrossomia constitucional: proporcional.","arm":"Culpar a insulina materna pela macrossomia.","regra":"Quem engorda o feto é a insulina fetal.","cf":"O mesmo mecanismo explica a hipoglicemia neonatal: o hiperinsulinismo persiste após o clampeamento.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 5 (cada complicação tem um mecanismo) e seção 2 (transferência placentária), slides 7, 18 e 19 do material da disciplina."},{"n":26,"sub":"Desconforto respiratório no filho de diabética","eixo":"Complicações fetais e neonatais","comp":"Relacionar hiperinsulinemia fetal ao atraso da maturação pulmonar","enun":"Recém-nascido de 38 semanas, filho de mãe com DM1 mal controlado, evolui com desconforto respiratório progressivo nas primeiras horas, padrão radiológico de doença de membrana hialina. Qual é o mecanismo mais provável?","ops":[["A hiperinsulinemia fetal antagoniza o cortisol no pneumócito II e reduz a produção de surfactante.","Correta: a insulina fetal reduz a síntese de lecitina, com menos surfactante e alvéolos instáveis mesmo a termo."],["A hipoglicemia neonatal provoca edema pulmonar por falência do ventrículo esquerdo.","Errada: a hipoglicemia não explica o padrão de deficiência de surfactante."],["A policitemia aumenta a viscosidade e causa hipertensão pulmonar com padrão de membrana hialina.","Errada: a policitemia pode piorar a oxigenação, mas não causa deficiência de surfactante."],["A cardiomiopatia hipertrófica reduz o débito pulmonar e impede a reabsorção do líquido alveolar.","Errada: a hipertrofia septal costuma regredir e não é a causa da deficiência de surfactante."]],"conc":"No diabetes mal controlado, a maturação pulmonar atrasa: a insulina fetal antagoniza o cortisol, que estimula o pneumócito II a produzir lecitina, levando a síndrome do desconforto respiratório mesmo perto do termo.","rac":"1) Mãe mal controlada. 2) Hiperinsulinemia fetal. 3) Antagonismo ao cortisol pulmonar. 4) Menos surfactante. 5) Membrana hialina mesmo com 38 semanas.","pista":"Membrana hialina em RN a termo de mãe diabética.","mud":"Em RN de 30 semanas de mãe não diabética, a causa seria prematuridade isolada.","cmp":"SDR do prematuro: imaturidade por idade. SDR do filho de diabética: atraso de maturação por insulina.","arm":"Atribuir o desconforto à hipoglicemia ou à policitemia.","regra":"Filho de diabética mal controlada pode ter pulmão imaturo a termo.","cf":"Por isso, em mau controle com indicação de parto antes do termo, considera-se corticoide antenatal, com ajuste da insulina materna.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 5 (tabela de mecanismos) e tabela do recém-nascido de mãe diabética, slide 16 do material da disciplina."},{"n":27,"sub":"Polidrâmnio e hipoglicemia neonatal","eixo":"Complicações fetais e neonatais","comp":"Prever as complicações neonatais e seu momento","enun":"Gestante com DMG mal controlado tem ultrassonografia com 34 semanas mostrando maior bolsão vertical de 9,5 cm. O casal pergunta o que será vigiado no bebê nas primeiras horas de vida. Qual é a resposta mais adequada?","ops":[["Glicemia nas primeiras horas, pelo hiperinsulinismo fetal persistente.","Correta: a hipoglicemia neonatal aparece nas primeiras horas e é a complicação metabólica precoce mais típica."],["Bilirrubina nas primeiras duas horas, pois a icterícia do filho de diabética surge logo ao nascer.","Errada: a policitemia e a icterícia aparecem entre o primeiro e o terceiro dia."],["Cálcio e magnésio apenas após a primeira semana, quando surge o hipoparatireoidismo transitório.","Errada: a hipocalcemia surge entre 24 e 72 horas, não após uma semana."],["Função tireoidiana imediata, porque o polidrâmnio indica hipotireoidismo fetal associado ao DMG.","Errada: o polidrâmnio no DMG resulta da diurese osmótica fetal por hiperglicemia, não de hipotireoidismo."]],"conc":"O polidrâmnio no diabetes resulta da poliúria fetal por diurese osmótica. No RN, a hipoglicemia aparece nas primeiras horas; hipocalcemia e hipomagnesemia entre 24 e 72 horas; policitemia e icterícia entre o primeiro e o terceiro dia.","rac":"1) Polidrâmnio sinaliza hiperglicemia fetal. 2) Hiperinsulinismo fetal. 3) Ao clampear, cessa o aporte de glicose. 4) Insulina continua alta. 5) Hipoglicemia precoce.","pista":"Pergunta sobre as primeiras horas de vida.","mud":"Se a pergunta fosse sobre o segundo dia de vida, a resposta incluiria hipocalcemia e icterícia.","cmp":"Primeiras horas: hipoglicemia. 24 a 72 h: hipocalcemia. 1º a 3º dia: policitemia e icterícia.","arm":"Trocar a cronologia das complicações neonatais.","regra":"Filho de diabética: glicemia nas primeiras horas e alimentação precoce.","cf":"O mesmo bebê deve ser examinado para lesão de plexo braquial e fratura de clavícula se houve distocia de ombro.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 5 e tabela 'Recém-nascido de mãe diabética', slides 15 e 21 do material da disciplina."},{"n":28,"sub":"Vigilância fetal no DMG","eixo":"Vigilância fetal","comp":"Aplicar o protocolo de seguimento pré-natal e de vitalidade da aula","enun":"Gestante de 28 semanas com DMG em insulina, bem controlada, inicia acompanhamento no pré-natal de alto risco. Segundo o protocolo da aula, qual esquema de seguimento é o adequado?","ops":[["Consultas quinzenais até 30 semanas e semanais depois; ultrassonografia a cada 4 semanas e CTG semanal desde 28 semanas.","Correta: é o esquema dos slides 38 e 40 para o PNAR do DMG."],["Consultas mensais até 36 semanas; ultrassonografia apenas com 36 semanas e CTG somente se houver redução de movimentos.","Errada: o diabetes exige seguimento mais próximo e vigilância fetal programada."],["Consultas semanais desde 28 semanas, ultrassonografia semanal e cardiotocografia diária ambulatorial.","Errada: CTG diária é reservada à internação por mau controle; USG semanal não é rotina sem alteração."],["Consultas quinzenais, Doppler semanal das artérias uterinas e perfil biofísico duas vezes por semana desde 24 semanas.","Errada: o Doppler das uterinas não guia o seguimento do DMG controlado e esse esquema não está no protocolo."]],"conc":"No PNAR do DMG: consultas quinzenais até 30 semanas e semanais depois; USG de crescimento, líquido e Doppler a cada 4 semanas desde 28 (a cada 2 se houver piora); CTG semanal desde 28 semanas.","rac":"1) DMG em insulina no PNAR. 2) Consultas: quinzenais e depois semanais. 3) USG 4/4 semanas. 4) CTG semanal desde 28 semanas.","pista":"Protocolo do slide 40 para crescimento e vitalidade.","mud":"Internação por mau controle mudaria para CTG diária; alterações progressivas na USG, para USG a cada 2 semanas.","cmp":"Protocolo da aula: CTG semanal desde 28 semanas para todas no PNAR. ACOG: DMG só com dieta (A1) muitas vezes dispensa vigilância precoce.","arm":"Aplicar CTG diária no ambulatório ou nenhuma vigilância programada.","regra":"DMG no PNAR: USG 4/4 semanas e CTG semanal desde 28 semanas.","cf":"Se a gestante quiser aguardar o parto até 40 semanas em DMG só com dieta, acrescenta-se PBF completo com 39 semanas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 10 (seguimento pré-natal e vigilância fetal), slides 38 e 40 do material da disciplina."},{"n":29,"sub":"Internação por mau controle","eixo":"Vigilância fetal","comp":"Indicar internação e suas medidas no controle inadequado","enun":"Gestante de 33 semanas com DMG em insulina, em doses crescentes há 3 semanas, mantém jejum de 120 a 130 mg/dL e pós-prandiais de 180 a 200 mg/dL apesar de boa adesão. Feto com PFE no p92 e polidrâmnio moderado. Qual é a conduta?","ops":[["Internar para ajuste da insulina, CTG diária, corticoide e decisão sobre o parto.","Correta: controle inadequado é indicação de internação com essas medidas (slide 42)."],["Manter o seguimento ambulatorial e trocar a insulina por metformina em dose máxima.","Errada: substituir a insulina por metformina não resolve mau controle grave; a metformina, se usada, é associada, não substituta."],["Indicar cesárea imediata com 33 semanas pela macrossomia e pelo polidrâmnio.","Errada: não há indicação de parto imediato sem antes estabilizar o controle e avaliar a vitalidade; corticoide primeiro."],["Suspender a insulina por 48 horas para avaliar se a hiperglicemia é efeito da própria medicação.","Errada: suspender a insulina agrava a hiperglicemia e o risco de cetoacidose."]],"conc":"Diante de controle inadequado, a gestante é internada para monitorização glicêmica, otimização da insulina, CTG diária, corticoide para maturação e avaliação da interrupção.","rac":"1) Mau controle persistente apesar de adesão. 2) Repercussão fetal (GIG e polidrâmnio). 3) Internar. 4) CTG diária e corticoide (com ajuste de insulina). 5) Planejar o parto, idealmente com 37 semanas.","pista":"Doses crescentes sem controle e repercussão fetal.","mud":"Se o controle melhorasse com ajustes ambulatoriais, o seguimento seria mantido com programação de parto entre 38 e 39 semanas.","cmp":"Ambulatório: CTG semanal. Internação: CTG diária.","arm":"Ir direto para cesárea pré-termo ou trocar a insulina por oral.","regra":"Mau controle: internar, otimizar, vigiar diariamente e planejar o parto.","cf":"Ao fazer o corticoide, a dose de insulina deve ser aumentada e as glicemias intensificadas por até 72 horas.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 11 (internação hospitalar), slide 42 do material da disciplina; SBD R13."},{"n":30,"sub":"DMG em dieta bem controlado: momento do parto","eixo":"Momento e via do parto","comp":"Definir o momento do parto no DMG controlado com dieta","enun":"Gestante de 39 semanas com DMG controlado apenas com dieta, glicemias sempre na meta, feto com PFE no p60 e CTG semanais normais. Deseja aguardar o trabalho de parto espontâneo. Segundo o material da disciplina, qual é a conduta?","ops":[["Aguardar o trabalho de parto até 40 semanas, com perfil biofísico completo com 39 semanas.","Correta: no DMG controlado com dieta, aguarda-se até 39 a 40 semanas, com PBF completo com 39 se for aguardar até 40."],["Indicar indução imediata com 39 semanas, porque todo DMG deve nascer antes de 40 semanas por protocolo fixo.","Errada: no controle com dieta é aceitável aguardar até 40 semanas com vigilância."],["Indicar cesárea eletiva com 39 semanas pelo risco de distocia de ombro.","Errada: a via é obstétrica; cesárea por macrossomia só com PFE acima de 4.500 g."],["Aguardar até 42 semanas, já que a gestante não usa medicação e a gestação é de risco habitual.","Errada: DMG é gestação de risco; não se ultrapassa 40 semanas sem motivo, e a aula limita a espera."]],"conc":"Momento do parto no DMG (slide 43): mau controle, 37 semanas; controle com insulina, 38 a 39; controle com dieta, aguardar até 39 a 40, com PBF completo com 39 se for esperar até 40.","rac":"1) DMG só com dieta. 2) Bem controlado. 3) Feto sem macrossomia. 4) Expectante até 40 semanas. 5) PBF com 39 semanas.","pista":"Controle exclusivamente dietético e feto adequado.","mud":"Se usasse insulina, a programação seria 38 a 39 semanas; se mal controlada, 37 semanas.","cmp":"Aula: dieta até 40 semanas; ACOG CO 831: A1 entre 39 0/7 e 40 6/7 semanas.","arm":"Aplicar a mesma data de parto a todas as diabéticas.","regra":"Quanto pior o controle e maior a necessidade de fármaco, mais cedo o parto.","cf":"Se nesse seguimento surgisse PFE de 4.700 g, a via passaria a ser cesárea.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 11 (quando interromper e tabela comparativa), slides 43 e 48 do material da disciplina; ACOG Committee Opinion 831 (2021)."},{"n":31,"sub":"Controle adequado com insulina","eixo":"Momento e via do parto","comp":"Programar o parto no DMG controlado com insulina","enun":"Gestante de 36 semanas com DMG controlado com insulina NPH e regular desde 30 semanas, glicemias na meta e feto com PFE no p55. Pergunta quando o bebê deve nascer. Segundo o slide 43, qual é a orientação?","ops":[["Programar o parto entre 38 e 39 semanas, com via de parto por indicação obstétrica.","Correta: DMG bem controlado com insulina tem parto programado entre 38 e 39 semanas."],["Programar o parto com 37 semanas, pois todo DMG em insulina é tratado como mal controlado.","Errada: 37 semanas é para mau controle; o uso de insulina com boa resposta não antecipa tanto."],["Aguardar o trabalho de parto espontâneo até 41 semanas, desde que a CTG siga normal.","Errada: no DMG em insulina não se aguarda até 41 semanas."],["Programar cesárea com 39 semanas, porque a insulina materna aumenta o risco de distocia.","Errada: a via é obstétrica e a insulina materna não atravessa a placenta nem causa distocia."]],"conc":"No DMG em insulina com bom controle, o parto é programado entre 38 e 39 semanas (aula) ou entre 39 0/7 e 39 6/7 semanas (ACOG), com via obstétrica.","rac":"1) Usa insulina. 2) Controle adequado. 3) Feto normal. 4) Programar entre 38 e 39 semanas. 5) Via obstétrica.","pista":"Uso de insulina com glicemias na meta.","mud":
