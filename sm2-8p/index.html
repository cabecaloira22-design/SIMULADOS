rial e vaginal.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.2 (sangramento pós-menopausa e pergunta que cai), tabela 8.4 e módulo 4.1 (limite de 4 mm)."},{"n":17,"sub":"Endométrio espessado na pós-menopausa","eixo":"Espessamento endometrial na pós-menopausa","comp":"Indicar amostragem endometrial no endométrio acima de 4 mm","enun":"Mulher de 66 anos, diabética e obesa, com sangramento pós-menopausa há 3 semanas. Exame especular normal. Ultrassonografia transvaginal: endométrio de 10 mm, heterogêneo. Qual é a conduta?","ops":[["Amostragem endometrial por pipelle ou histeroscopia com biópsia.","Correta: endométrio acima de 4 mm ou heterogêneo no sangramento pós-menopausa exige histologia."],["Estrogênio vaginal tópico e nova ultrassonografia em 3 meses.","Errada: atribuir à atrofia sem histologia atrasa o diagnóstico de câncer."],["Conduta expectante, já que o sangramento é pequeno e a paciente está assintomática hoje.","Errada: o espessamento exige investigação independentemente da intensidade."],["Dosagem de CA-125 para decidir se a biópsia é necessária.","Errada: o CA-125 não decide a indicação de biópsia."]],"conc":"No sangramento pós-menopausa, espessura acima de 4 mm, endométrio heterogêneo ou foco indicam pipelle ou histeroscopia com biópsia. Câncer de endométrio responde por 5 a 10% dos sangramentos pós-menopausa.","rac":"1) Sangramento pós-menopausa. 2) Endométrio de 10 mm heterogêneo. 3) Fatores de risco. 4) Biópsia.","pista":"Endométrio de 10 mm com sangramento.","mud":"Com 3 mm no primeiro episódio e sem fatores de risco, poderia ser expectante.","cmp":"Atrofia: causa mais comum. Câncer: 5 a 10%, mas é o que não se pode perder.","arm":"Rotular como atrofia sem avaliar.","regra":"Pós-menopausa, sangrou e endométrio grosso: histologia.","cf":"Nunca se atribui sangramento pós-menopausa à atrofia sem avaliação.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 3.2 e 3.6 (segurança), tabela 8.4."},{"n":18,"sub":"Sangramento recorrente com endométrio fino","eixo":"Espessamento endometrial na pós-menopausa","comp":"Reconhecer quando o limiar de 4 mm deixa de valer","enun":"Mulher de 62 anos, sem terapia hormonal, teve sangramento pós-menopausa há 4 meses com endométrio de 3 mm e conduta expectante. Agora tem novo episódio de sangramento. Nova ultrassonografia: endométrio de 3,5 mm. Qual é a conduta?","ops":[["Histeroscopia com biópsia, porque o sangramento recorreu.","Correta: sangramento persistente ou recorrente exige histeroscopia, mesmo com endométrio fino."],["Manter conduta expectante, porque o endométrio continua abaixo de 4 mm.","Errada: o limiar de 4 mm vale para o primeiro episódio."],["Biópsia por pipelle e encerrar a investigação se vier insuficiente.","Errada: amostra insuficiente em sangramento recorrente não encerra a investigação."],["Estrogênio tópico isolado, sem investigação adicional.","Errada: a recorrência obriga a avaliar a cavidade."]],"conc":"O limiar de 4 mm foi validado para o primeiro episódio de sangramento pós-menopausa, sem terapia hormonal combinada e sem tamoxifeno. Recorrência ou persistência leva à histeroscopia.","rac":"1) Segundo episódio. 2) Endométrio fino. 3) Limiar não se aplica. 4) Histeroscopia.","pista":"Novo episódio de sangramento.","mud":"Se fosse o primeiro episódio, a conduta expectante seria aceitável.","cmp":"Primeiro episódio e fino: observar. Recorrente: histeroscopia.","arm":"Aplicar o limiar de 4 mm ao sangramento recorrente.","regra":"Recorreu: histeroscopia.","cf":"Pólipos pequenos podem causar sangramento recorrente com endométrio aparentemente fino.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 3.2 e 4.1 (controvérsias: limite de 4 mm) e tabela 8.4."},{"n":19,"sub":"Sangramento em terapia hormonal","eixo":"Espessamento endometrial na pós-menopausa","comp":"Diferenciar sangramento esperado de inesperado na terapia hormonal","enun":"Mulher de 54 anos com útero usa terapia hormonal em esquema sequencial (estrogênio contínuo com progestagênio 12 dias por mês) e apresenta sangramento regular logo após a pausa do progestagênio, sempre no mesmo período do mês. Qual é a interpretação?","ops":[["Sangramento programado do esquema sequencial, esperado.","Correta: no esquema sequencial o sangramento após o progestagênio é esperado."],["Sinal de câncer de endométrio, que exige histeroscopia imediata.","Errada: o sangramento previsível após o progestagênio é fisiológico nesse esquema."],["Indicação de suspender a terapia hormonal definitivamente.","Errada: não há motivo para suspender por sangramento programado."],["Sinal de hiperplasia, que obriga trocar por estrogênio isolado contínuo.","Errada: estrogênio isolado em mulher com útero aumenta o risco de hiperplasia."]],"conc":"Em uso de terapia hormonal, o sangramento programado do esquema sequencial é esperado; o sangramento inesperado (fora do padrão, ou no esquema contínuo após adaptação) exige investigação.","rac":"1) Esquema sequencial. 2) Sangramento após o progestagênio. 3) Previsível. 4) Esperado.","pista":"Sangramento regular logo após o progestagênio.","mud":"Sangramento irregular fora do período previsto exigiria investigação.","cmp":"Esperado: sequencial, previsível. Inesperado: fora do padrão.","arm":"Investigar todo sangramento de quem usa terapia hormonal sequencial.","regra":"No sequencial, sangrar depois do progestagênio é o combinado.","cf":"Em mulher com útero, o progestagênio é obrigatório na terapia estrogênica (exceto estrogênio vaginal em baixa dose).","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.2 (em uso de terapia hormonal) e erros frequentes 17.2."},{"n":20,"sub":"Hiperplasia sem atipia","eixo":"Hiperplasia endometrial","comp":"Tratar a hiperplasia sem atipia","enun":"Mulher de 39 anos com SOP, IMC 34 kg/m², ciclos irregulares, tem biópsia endometrial com hiperplasia sem atipia. Não deseja gestar no momento. Qual é a conduta de primeira linha?","ops":[["SIU de levonorgestrel e perda de peso, com biópsia de controle a cada 6 meses.","Correta: SIU-LNG é a primeira linha, com correção do fator de risco e controle até 2 biópsias negativas."],["Histerectomia total, pelo risco elevado de câncer coexistente.","Errada: na hiperplasia sem atipia o risco de câncer é baixo (menos de 5% em 20 anos)."],["Estrogênio isolado para regularizar o ciclo menstrual.","Errada: estrogênio sem oposição é a causa da hiperplasia."],["Ablação endometrial por ser definitiva e preservar o útero.","Errada: a ablação dificulta o seguimento histológico e não é o tratamento indicado."]],"conc":"Hiperplasia sem atipia: corrigir o fator de risco, SIU-LNG como primeira linha (alternativa: progestagênio oral), biópsia a cada 6 meses até 2 negativas consecutivas; histerectomia se persistência ou progressão após 12 meses ou por escolha.","rac":"1) Hiperplasia sem atipia. 2) Baixo risco. 3) SIU-LNG. 4) Perda de peso. 5) Controle semestral.","pista":"Ausência de atipia.","mud":"Com atipia, a conduta passaria a histerectomia total.","cmp":"Sem atipia: SIU-LNG. Com atipia: histerectomia.","arm":"Operar hiperplasia sem atipia.","regra":"Sem atipia: progestagênio, não bisturi.","cf":"Se persistir após 12 meses de tratamento, a histerectomia passa a ser indicada.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 2.4 e 3.4 (hiperplasia sem atipia) e tabela 8.2; RCOG/BSGE Green-top nº 67 (2016)."},{"n":21,"sub":"Hiperplasia atípica com prole completa","eixo":"Hiperplasia endometrial","comp":"Indicar histerectomia na hiperplasia atípica","enun":"Mulher de 51 anos, prole completa, com sangramento irregular e biópsia de hiperplasia endometrial com atipia (EIN). Sem contraindicação cirúrgica. Qual é a conduta e a justificativa?","ops":[["Histerectomia total, pelo alto risco de carcinoma coexistente.","Correta: na hiperplasia atípica, a histerectomia é indicada após excluir câncer e avaliar risco cirúrgico."],["SIU de levonorgestrel com biópsia anual, pela baixa progressão.","Errada: a baixa progressão vale para a hiperplasia sem atipia."],["Progestagênio oral por 3 meses e alta se o sangramento cessar.","Errada: o tratamento conservador exige seguimento estreito e só se justifica com desejo de gestar ou alto risco cirúrgico."],["Observação clínica, já que a hiperplasia regride após a menopausa.","Errada: a atipia tem alto risco de câncer oculto."]],"conc":"Hiperplasia atípica (EIN): progressão de cerca de 8% em 4 anos e até 27% em 19 anos; 25 a 43% já têm carcinoma coexistente na peça. Tratamento: histerectomia total (com salpingectomia; ooforectomia conforme a idade).","rac":"1) Atipia. 2) Alto risco de câncer coexistente. 3) Prole completa. 4) Histerectomia total.","pista":"Presença de atipia com prole completa.","mud":"Com desejo de gestar, a opção seria SIU-LNG com ou sem análogo de GnRH e biópsia a cada 3 meses.","cmp":"Sem atipia: menos de 5% em 20 anos. Atípica: até 27% em 19 anos e câncer coexistente frequente.","arm":"Tratar atipia como hiperplasia comum.","regra":"Atipia: tire o útero, se a prole está completa.","cf":"Hiperplasia atípica e EIN são, na prática clínica, equivalentes.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 2.4 e 3.4 (com atipia/EIN) e tabela 8.2; RCOG/BSGE 2016."},{"n":22,"sub":"Hiperplasia atípica com desejo de gestar","eixo":"Hiperplasia endometrial","comp":"Conduzir a hiperplasia atípica com tratamento conservador","enun":"Mulher de 31 anos com SOP, nuligesta, deseja gestar, tem biópsia de hiperplasia atípica. Ressonância sem sinais de invasão miometrial. Qual é a conduta conservadora adequada?","ops":[["SIU-LNG (com ou sem análogo de GnRH) e biópsia a cada 3 meses.","Correta: é o esquema conservador para quem deseja gestar."],["SIU de levonorgestrel com biópsia a cada 2 anos, como na hiperplasia sem atipia.","Errada: o seguimento da atípica conservadora é trimestral."],["Indução de ovulação imediata, sem tratar o endométrio, para aproveitar a fertilidade.","Errada: é preciso tratar a atipia antes."],["Ablação endometrial seguida de tentativa de gestação.","Errada: a ablação compromete a gestação e o seguimento."]],"conc":"Na hiperplasia atípica, sem prole completa ou com alto risco cirúrgico: SIU-LNG com ou sem análogo de GnRH, biópsia a cada 3 meses, histerectomia ao final da prole ou se falha em 6 a 12 meses. Aconselhar sobre risco de câncer oculto e de recidiva.","rac":"1) Atipia. 2) Deseja gestar. 3) Tratamento conservador. 4) Seguimento trimestral. 5) Histerectomia depois.","pista":"Desejo reprodutivo com atipia.","mud":"Com prole completa, a conduta seria histerectomia total.","cmp":"Sem atipia conservadora: biópsia semestral. Com atipia conservadora: trimestral.","arm":"Seguir a atípica como a sem atipia.","regra":"Atipia conservadora: biópsia a cada 3 meses.","cf":"A decisão deve ser compartilhada, registrando o risco de câncer oculto.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.4 (com atipia/EIN), tabela 8.2 e algoritmo 9.4."},{"n":23,"sub":"Hiperplasia sem atipia persistente","eixo":"Hiperplasia endometrial","comp":"Saber quando indicar histerectomia na hiperplasia sem atipia","enun":"Mulher de 46 anos com hiperplasia sem atipia, em uso de SIU de levonorgestrel há 13 meses com boa adesão, mantém hiperplasia sem atipia nas biópsias de controle e sangramento irregular. Não deseja gestar. Qual é a conduta?","ops":[["Histerectomia, pela persistência após 12 meses de tratamento.","Correta: persistência ou progressão após 12 meses indica histerectomia."],["Manter o SIU indefinidamente com biópsias anuais.","Errada: a persistência após 12 meses com sintomas indica tratamento definitivo."],["Retirar o SIU e associar estrogênio para estabilizar o endométrio.","Errada: estrogênio sem oposição piora a hiperplasia."],["Trocar por anticoncepcional combinado e encerrar o seguimento histológico.","Errada: a persistência não permite encerrar o seguimento."]],"conc":"Na hiperplasia sem atipia, faz-se biópsia de controle a cada 6 meses até 2 negativas consecutivas. Persistência ou progressão após 12 meses, ou escolha da paciente, indica histerectomia.","rac":"1) Sem atipia. 2) Tratamento adequado por 13 meses. 3) Persistência. 4) Histerectomia.","pista":"Persistência após 12 meses de tratamento.","mud":"Com duas biópsias negativas consecutivas, passaria a vigilância anual.","cmp":"Resposta: vigilância. Persistência após 12 meses: histerectomia.","arm":"Manter tratamento conservador indefinidamente.","regra":"Doze meses sem resposta: cirurgia.","cf":"Se a biópsia mostrasse atipia em qualquer controle, a histerectomia seria indicada antes.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.4 (sem atipia: histerectomia se persistência após 12 meses) e algoritmo 9.4."},{"n":24,"sub":"Carcinoma tipo II","eixo":"Câncer de endométrio","comp":"Diferenciar os tipos I e II do carcinoma de endométrio","enun":"Mulher de 72 anos, IMC 21 kg/m², multípara, sem uso de hormônios, com sangramento pós-menopausa. A biópsia mostra carcinoma seroso de endométrio sobre endométrio atrófico. Qual característica é esperada nesse tumor?","ops":[["Mutação de TP53, independência de estrogênio e disseminação peritoneal precoce.","Correta: é o perfil do tipo II (seroso, células claras, carcinossarcoma)."],["Precursor de hiperplasia atípica e forte dependência de estrogênio.","Errada: esse é o perfil do tipo I (endometrioide)."],["Mutação de PTEN e prognóstico geralmente favorável.","Errada: PTEN e bom prognóstico caracterizam o tipo I."],["Associação com obesidade e anovulação crônica na pré-menopausa.","Errada: esses fatores se ligam ao tipo I."]],"conc":"Tipo I (80 a 85%): endometrioide G1 a 2, estrogênio-dependente, precedido por hiperplasia, obesas, PTEN, PIK3CA, MMRd; bom prognóstico. Tipo II (10 a 15%): seroso, células claras, carcinossarcoma, endometrioide G3; pós-menopausa, magras, endométrio atrófico, TP53; agressivo.","rac":"1) Idosa e magra. 2) Endométrio atrófico. 3) Seroso. 4) Tipo II. 5) TP53 e agressividade.","pista":"Histologia serosa sobre endométrio atrófico.","mud":"Endometrioide G1 em obesa com hiperplasia seria tipo I.","cmp":"Tipo I: estrogênio e hiperplasia. Tipo II: atrofia e TP53.","arm":"Atribuir estrogênio aos dois tipos.","regra":"Seroso é tipo II: TP53 e peritônio.","cf":"No seroso, o estadiamento inclui omentectomia e biópsias peritoneais.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.5 (tipos I e II) e tabela 8.3."},{"n":25,"sub":"Fatores de risco e proteção","eixo":"Câncer de endométrio","comp":"Relacionar fatores de risco e de proteção ao ambiente hormonal","enun":"Em uma consulta de prevenção, quatro mulheres de 50 anos perguntam sobre o risco de câncer de endométrio. Qual delas tem um fator que reduz esse risco?","ops":[["A que usou anticoncepcional combinado e depois SIU-LNG.","Correta: combinados e SIU-LNG fornecem progestagênio e protegem o endométrio."],["A que tem SOP com anovulação crônica desde a adolescência.","Errada: a anovulação expõe o endométrio a estrogênio sem oposição."],["A que usou estrogênio isolado por 5 anos tendo útero.","Errada: o estrogênio sem progestagênio aumenta o risco de hiperplasia e câncer."],["A que é nuligesta, obesa e teve menopausa aos 56 anos.","Errada: nuliparidade, obesidade e menopausa tardia aumentam o risco."]],"conc":"O ambiente hormonal explica a maior parte dos fatores: estrogênio sem oposição (anovulação, obesidade, estrogenioterapia isolada, tamoxifeno, menopausa tardia) aumenta o risco; progestagênio (multiparidade, combinado, SIU-LNG) e atividade física reduzem. Lynch e Cowden são fatores genéticos.","rac":"1) Pergunte qual é o ambiente hormonal. 2) Progestagênio protege. 3) Combinado e SIU-LNG protegem.","pista":"Exposição prolongada a progestagênio.","mud":"Se a pergunta fosse sobre risco de câncer de mama, o raciocínio seria diferente.","cmp":"Risco: estrogênio sem oposição. Proteção: progestagênio.","arm":"Achar que todo contraceptivo hormonal aumenta o risco de câncer de endométrio.","regra":"Qual o ambiente hormonal dela? A resposta prediz o risco.","cf":"Cirurgia bariátrica e atividade física também são citadas como fatores de proteção.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 1.3 (estrogênio sem oposição) e módulo 2.5 (fatores de risco e de proteção)."},{"n":26,"sub":"Grupo POLE mutado","eixo":"Câncer de endométrio","comp":"Interpretar a classificação molecular do carcinoma de endométrio","enun":"Mulher de 58 anos com carcinoma endometrioide grau 3, estágio I. O painel molecular mostra mutação patogênica na exonuclease de POLE. Segundo a classificação molecular (TCGA/ProMisE, ESGO 2025), como esse achado altera o prognóstico?","ops":[["Prognóstico excelente, mesmo sendo grau 3, podendo reduzir a necessidade de adjuvância.","Correta: o grupo POLEmut tem prognóstico excelente independentemente do grau."],["Prognóstico pior, devendo ser tratado como alto risco com quimioterapia.","Errada: o pior prognóstico é do grupo p53abn."],["Prognóstico intermediário, com indicação de imunoterapia na doença inicial.","Errada: a imunoterapia tem benefício estabelecido na doença MMRd avançada ou recorrente."],["Sem valor prognóstico, já que o estadiamento depende só do grau histológico.","Errada: a classificação molecular reordena o prognóstico e entra na FIGO 2023."]],"conc":"Quatro grupos moleculares: POLEmut (excelente, mesmo G3), MMRd (intermediário, responde a imunoterapia), NSMP (intermediário, depende de grau e estágio), p53abn (pior; tratar como alto risco).","rac":"1) Grau 3 isolado sugeriria risco alto. 2) POLEmut sobrepõe-se ao grau. 3) Prognóstico excelente. 4) Pode desescalar adjuvância.","pista":"Mutação de POLE.","mud":"Se o painel mostrasse p53 anormal, o tumor seria tratado como alto risco.","cmp":"POLEmut: excelente. p53abn: pior.","arm":"Classificar pelo grau e ignorar o molecular.","regra":"POLE salva; p53 pesa.","cf":"Muitos serviços brasileiros têm acesso limitado ao teste de POLE; usa-se IHQ de MMR e p53 e discute-se em comitê.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.5 (classificação molecular) e módulo 4.1; ESGO-ESTRO-ESP guidelines for endometrial carcinoma, 2025 (pocket guidelines)."},{"n":27,"sub":"Grupo p53 anormal","eixo":"Câncer de endométrio","comp":"Reconhecer o grupo de pior prognóstico","enun":"Mulher de 69 anos com carcinoma de endométrio estágio inicial cuja imuno-histoquímica mostra padrão aberrante de p53 (p53abn), sem mutação de POLE. Qual é a implicação para o tratamento adjuvante?","ops":[["Tratar como alto risco, com quimioterapia, com ou sem radioterapia.","Correta: o grupo p53abn tem o pior prognóstico e recebe adjuvância de alto risco."],["Apenas observação, por se tratar de doença em estágio inicial.","Errada: a observação cabe ao baixo risco (POLEmut ou IA G1 a 2 NSMP ou MMRd sem invasão linfovascular substancial)."],["Braquiterapia vaginal isolada, como no risco intermediário.","Errada: o perfil p53abn eleva o risco acima do intermediário."],["Imunoterapia isolada, pelo excelente resultado nos tumores p53 anormais.","Errada: a imunoterapia se destaca no grupo MMRd avançado ou recorrente."]],"conc":"A ESGO 2025 integra o molecular aos grupos de risco: baixo risco, observação; intermediário, braquiterapia vaginal; alto-intermediário e alto, radioterapia e/ou quimioterapia; p53abn, quimioterapia com ou sem radioterapia; MMRd avançado, imunoterapia com quimioterapia.","rac":"1) p53abn. 2) Pior prognóstico. 3) Mesmo inicial, tratar como alto risco.","pista":"p53 aberrante.","mud":"Com POLEmut, o mesmo estágio poderia ser apenas observado.","cmp":"p53abn: escalar. POLEmut: desescalar.","arm":"Olhar só o estágio e indicar observação.","regra":"p53 anormal: trate como alto risco.","cf":"O tumor p53abn costuma ter histologia serosa, típica do tipo II.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 2.5 e 3.5 (adjuvância por grupos de risco, síntese rotulada como inferência didática); ESGO-ESTRO-ESP 2025."},{"n":28,"sub":"Triagem de Lynch no tumor","eixo":"Síndrome de Lynch","comp":"Conduzir a investigação de Lynch a partir do tumor","enun":"Mulher de 48 anos com carcinoma endometrioide. A imuno-histoquímica do tumor mostra perda de expressão de MLH1 e PMS2. Qual é o próximo passo na investigação de síndrome de Lynch?","ops":[["Testar a metilação do promotor de MLH1 no tumor.","Correta: a metilação indica causa esporádica; se não metilado, segue-se para aconselhamento e teste germinativo."],["Confirmar Lynch e indicar colectomia profilática imediata.","Errada: a perda de MLH1 pode ser esporádica por metilação; ainda não há diagnóstico."],["Encerrar a investigação, porque Lynch só se associa a perda de MSH2.","Errada: Lynch envolve MLH1, MSH2, MSH6, PMS2 e EPCAM."],["Solicitar CA-125 seriado para rastrear câncer de ovário.","Errada: não é o próximo passo diagnóstico de Lynch."]],"conc":"Fluxo de Lynch: IHQ de MMR no tumor (todo câncer de endométrio ou abaixo de 60 anos); perda de MLH1/PMS2 leva ao teste de metilação de MLH1 (metilado: esporádico); não metilado, aconselhamento genético e teste germinativo.","rac":"1) Perda de MLH1 e PMS2. 2) Pode ser metilação esporádica. 3) Testar metilação. 4) Depois, genética se necessário.","pista":"Perda combinada de MLH1 e PMS2.","mud":"Perda isolada de MSH2/MSH6 levaria diretamente a aconselhamento e teste germinativo.","cmp":"Metilado: esporádico. Não metilado: suspeita de Lynch germinativo.","arm":"Confundir deficiência de MMR no tumor com diagnóstico de Lynch.","regra":"Perdeu MLH1: cheque a metilação.","cf":"Tumores MMRd respondem a imunoterapia na doença avançada ou recorrente.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.6 (síndrome de Lynch: fluxo) e módulo 3.6."},{"n":29,"sub":"Prevenção na síndrome de Lynch","eixo":"Síndrome de Lynch","comp":"Orientar a cirurgia redutora de risco na síndrome de Lynch","enun":"Mulher de 39 anos com variante patogênica germinativa em MSH2 confirmada, dois filhos, sem desejo de mais gestações. Pergunta como reduzir o risco ginecológico. Qual é a orientação?","ops":[["Histerectomia com salpingo-ooforectomia redutora de risco.","Correta: Lynch aumenta o risco de câncer de endométrio (40 a 60% em MLH1/MSH2) e de ovário."],["Papanicolaou anual, que rastreia adequadamente o endométrio.","Errada: o Papanicolaou não rastreia o câncer de endométrio."],["Apenas salpingectomia, porque o risco é exclusivamente ovariano.","Errada: o maior risco ginecológico em Lynch é endometrial."],["Nenhuma conduta até os 60 anos, quando o risco começa a aumentar.","Errada: o câncer em Lynch é mais precoce, e a cirurgia é proposta após a prole, por volta de 35 a 40 anos."]],"conc":"Lynch: herança autossômica dominante (MLH1, MSH2, MSH6, PMS2, EPCAM). Risco vitalício de câncer de endométrio de 40 a 60% (MLH1/MSH2), além de colorretal e ovário. Prevenção: histerectomia com salpingo-ooforectomia bilateral após a prole, por volta de 35 a 40 anos; biópsia anual é opção de benefício menos comprovado.","rac":"1) Lynch confirmado. 2) Prole completa. 3) 39 anos. 4) Cirurgia redutora de risco.","pista":"Variante germinativa com prole completa.","mud":"Se ainda desejasse gestar, a vigilância endometrial seria discutida até completar a prole.","cmp":"Lynch: endométrio, cólon e ovário. BRCA: mama e ovário.","arm":"Achar que o Papanicolaou rastreia endométrio.","regra":"Lynch com prole completa: útero e anexos fora.","cf":"Não existe rastreamento populacional do câncer de endométrio; Lynch é exceção com conduta específica.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 2.6 (Lynch) e 3.5 (não há rastreamento populacional) e erros frequentes 17.1."},{"n":30,"sub":"Cirurgia no câncer de endométrio inicial","eixo":"Estadiamento e tratamento do câncer","comp":"Indicar a cirurgia padrão no carcinoma confinado ao útero","enun":"Mulher de 61 anos com carcinoma endometrioide grau 1 confinado ao útero na ressonância, sem doença à distância na tomografia. Qual cirurgia é a padrão?","ops":[["Histerectomia total, anexectomia bilateral e linfonodo sentinela, sem morcelar.","Correta: é a base do tratamento da doença inicial."],["Histerectomia subtotal laparoscópica com morcelamento para reduzir o tempo cirúrgico.","Errada: o colo deve ser retirado e o morcelamento intraperitoneal é contraindicado."],["Radioterapia exclusiva, por ser equivalente à cirurgia no estádio inicial.","Errada: a cirurgia é a base do tratamento; a radioterapia é adjuvante conforme o risco."],["Histerectomia radical com parametrectomia e linfadenectomia para-aórtica sistemática.","Errada: a cirurgia radical não é padrão no endométrio inicial, e o sentinela substitui a linfadenectomia sistemática."]],"conc":"Tratamento do câncer de endométrio inicial: histerectomia total com salpingo-ooforectomia bilateral, preferencialmente minimamente invasiva, sem morcelamento intraperitoneal; estadiamento linfonodal por linfonodo sentinela. Omentectomia e biópsias peritoneais no seroso e no carcinossarcoma.","rac":"1) Doença confinada ao útero. 2) Histerectomia total com anexos. 3) Via minimamente invasiva. 4) Sentinela. 5) Adjuvância pelo risco final.","pista":"Doença inicial confinada ao útero.","mud":"Num carcinoma seroso, acrescentam-se omentectomia e biópsias peritoneais.","cmp":"Colo do útero inicial: histerectomia por via aberta (LACC). Endométrio inicial: minimamente invasiva preferida.","arm":"Morcelar o útero com câncer.","regra":"Endométrio inicial: útero, anexos e sentinela, sem morcelar.","cf":"Em candidata muito selecionada que deseja gestar, a preservação de fertilidade com progestagênio pode ser discutida.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.5 (cirurgia) e algoritmo 9.5; ESGO-ESTRO-ESP 2025."},{"n":31,"sub":"Estádio II na FIGO 2023","eixo":"Estadiamento e tratamento do câncer","comp":"Aplicar o estadiamento cirúrgico-patológico do endométrio","enun":"A peça de histerectomia de uma mulher de 64 anos com carcinoma endometrioide mostra invasão do estroma do colo uterino, com serosa, anexos e linfonodos livres. Pela FIGO, em qual estádio ela se enquadra?","ops":[["Estádio II.","Correta: a invasão estromal do colo define o estádio II."],["Estádio I.","Errada: o estádio I é limitado ao corpo uterino."],["Estádio III.","Errada: o estádio III corresponde a disseminação regional (serosa, anexos, vagina, paramétrio, linfonodos)."],["Estádio IV.","Errada: o estádio IV envolve bexiga, reto ou doença à distância."]],"conc":"FIGO 2023 para endométrio é cirúrgico-patológico-molecular: I limitado ao corpo; II invasão estromal do colo; III disseminação regional (serosa, anexos, vagina, paramétrio, linfonodos); IV bexiga, reto ou distância. Inclui subtipo histológico, invasão linfovascular e molecular.","rac":"1) Invasão do estroma cervical. 2) Sem doença extrauterina. 3) Estádio II.","pista":"Invasão do estroma do colo sem doença fora do útero.","mud":"Linfonodo pélvico positivo mudaria para estádio III.","cmp":"Endométrio: estadiamento cirúrgico. Colo: estadiamento com clínica, imagem e patologia (FIGO 2018).","arm":"Confundir o estadiamento do colo com o do endométrio.","regra":"Endométrio que invade o estroma do colo: estádio II.","cf":"A classificação molecular (POLEmut ou p53abn) pode modificar a subclassificação na FIGO 2023.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.5 (estadiamento FIGO 2023)."},{"n":32,"sub":"Preservação de fertilidade no endométrio","eixo":"Estadiamento e tratamento do câncer","comp":"Selecionar candidatas a tratamento conservador do câncer de endométrio","enun":"Mulher de 32 anos, nuligesta, com SOP, tem carcinoma endometrioide grau 1, sem invasão miometrial na ressonância e sem doença extrauterina. Deseja engravidar. Qual conduta pode ser oferecida após aconselhamento?","ops":[["Progestagênio (SIU-LNG com ou sem MPA) e histeroscopia com biópsia seriada.","Correta: é o tratamento conservador para candidata muito selecionada."],["Conização uterina com margens livres, como no câncer do colo inicial.","Errada: não existe conização para o endométrio."],["Radioterapia pélvica com transposição ovariana para preservar o útero.","Errada: a radioterapia compromete a gestação."],["Indução de ovulação imediata, adiando o tratamento oncológico para depois do parto.","Errada: é preciso tratar e confirmar resposta antes de liberar a gestação."]],"conc":"Preservação de fertilidade: endometrioide G1, confinado ao endométrio, sem invasão miometrial por RM, sem metástase. Progestagênio (SIU-LNG com ou sem MPA ou megestrol) e histeroscopia com biópsia a cada 3 a 6 meses; histerectomia após a prole ou se falha.","rac":"1) Jovem com desejo de gestar. 2) G1 sem invasão miometrial. 3) Candidata selecionada. 4) Progestagênio com vigilância histológica.","pista":"Grau 1 sem invasão miometrial e desejo reprodutivo.","mud":"Com invasão miometrial ou grau 3, o tratamento conservador não seria indicado.","cmp":"Hiperplasia atípica conservadora: biópsia a cada 3 meses. Câncer G1 conservador: a cada 3 a 6 meses.","arm":"Oferecer tratamento conservador a qualquer câncer de endométrio.","regra":"Fertilidade no câncer de endométrio: só G1 sem invasão.","cf":"O seguimento após o tratamento inclui consultas a cada 3 a 6 meses nos primeiros 2 a 3 anos.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 3.5 (preservação de fertilidade e seguimento)."},{"n":33,"sub":"Suspeita de sarcoma","eixo":"Sarcomas uterinos","comp":"Suspeitar de sarcoma e evitar o morcelamento","enun":"Mulher de 58 anos, menopausa aos 51, com 'mioma' conhecido de 4 cm que cresceu para 9 cm em 8 meses, dor pélvica e sangramento pós-menopausa. Ressonância: massa única heterogênea com áreas de necrose. Qual é a conduta adequada?","ops":[["Histerectomia total sem morcelamento, com estadiamento, pela suspeita de sarcoma.","Correta: crescimento na pós-menopausa com necrose sugere sarcoma; o morcelamento disseminaria o tumor."],["Miomectomia laparoscópica com morcelamento eletromecânico para preservar o útero.","Errada: o morcelamento sem contenção dissemina um sarcoma oculto."],["Conduta expectante, porque miomas podem crescer por degeneração na pós-menopausa.","Errada: miomas regridem após a menopausa; crescimento rápido é sinal de alerta."],["Embolização das artérias uterinas, por ser menos invasiva.","Errada: a embolização não trata nem diagnostica o sarcoma."]],"conc":"Sarcomas uterinos são 3 a 5% das neoplasias uterinas; o leiomiossarcoma é o mais comum. Suspeitar com crescimento rápido, pós-menopausa, sangramento, dor e massa única com necrose. Nenhuma imagem exclui com segurança. Tratamento: histerectomia sem morcelamento.","rac":"1) Pós-menopausa. 2) Crescimento rápido. 3) Necrose na RM. 4) Suspeita de sarcoma. 5) Cirurgia sem morcelamento.","pista":"Crescimento de 'mioma' após a menopausa.","mud":"Mioma estável que regride após a menopausa não exigiria cirurgia.","cmp":"Mioma: regride na menopausa. Sarcoma: cresce.","arm":"Morcelar massa uterina em pós-menopausa.","regra":"Mioma que cresce depois da menopausa: pense em sarcoma, não morcele.","cf":"O alerta da FDA de 2014 estimou sarcoma inesperado em cerca de 1 a cada 350 a 500 cirurgias por mioma.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.6 (sarcomas uterinos), módulo 3.3 (morcelamento) e algoritmo 9.3."},{"n":34,"sub":"Origem e diagnóstico do sarcoma","eixo":"Sarcomas uterinos","comp":"Corrigir conceitos errados sobre sarcoma uterino","enun":"Sobre os sarcomas uterinos, qual afirmação está correta segundo a aula?","ops":[["O diagnóstico final é histológico; a imagem não exclui sarcoma.","Correta: a RM ajuda a suspeitar, mas não exclui; a confirmação é histológica."],["O sarcoma surge quase sempre da degeneração de um mioma antigo.","Errada: o sarcoma é raro e, em geral, surge de novo."],["O carcinossarcoma é hoje tratado como sarcoma de baixo grau.","Errada: o carcinossarcoma é tratado como carcinoma de alto grau."],["A ressonância normal autoriza o morcelamento sem contenção em qualquer idade.","Errada: como a imagem não exclui sarcoma, o morcelamento exige decisão informada e contenção."]],"conc":"Sarcomas: leiomiossarcoma (mais comum), sarcoma do estroma endometrial, adenossarcoma; carcinossarcoma é tratado como carcinoma de alto grau. Fatores: tamoxifeno, radioterapia pélvica prévia. Diagnóstico histológico.","rac":"1) Imagem sugere. 2) Não exclui. 3) Histologia define.","pista":"Limite dos exames de imagem.","mud":"Se a pergunta fosse o sarcoma mais comum, a resposta seria o leiomiossarcoma.","cmp":"Mioma: não vira sarcoma. Sarcoma: de novo.","arm":"Achar que mioma 'degenera' em sarcoma.","regra":"Sarcoma se confirma no microscópio.","cf":"O tamoxifeno é fator de risco tanto para carcinoma quanto para sarcoma uterino.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulo 2.6 (sarcomas) e erros frequentes 17.1."},{"n":35,"sub":"Tamoxifeno e endométrio","eixo":"Tamoxifeno e endométrio","comp":"Orientar a vigilância endometrial em usuárias de tamoxifeno","enun":"Mulher de 56 anos, pós-menopausa, em uso de tamoxifeno há 2 anos por câncer de mama, assintomática. Pergunta se deve fazer ultrassonografia transvaginal anual para 'vigiar o útero'. Qual é a orientação?","ops":[["Não; orientar a relatar sangramento, que se investiga com baixo limiar.","Correta: o tamoxifeno é agonista endometrial, mas o rastreamento por imagem em assintomáticas não é recomendado."],["Ultrassonografia semestral com biópsia sempre que o endométrio passar de 4 mm.","Errada: o tamoxifeno espessa o endométrio sem doença, gerando biópsias desnecessárias; o limiar de 4 mm não se aplica."],["Suspender o tamoxifeno, porque o risco endometrial supera o benefício oncológico.","Errada: o benefício na mama supera o risco endometrial; a suspensão não é indicada por isso."],["Histerectomia profilática, pelo risco de carcinoma e sarcoma associado ao fármaco.","Errada: não há indicação de cirurgia profilática por uso de tamoxifeno."]],"conc":"O tamoxifeno é agonista no endométrio e aumenta pólipos, hiperplasia, carcinoma e sarcoma. Não se faz ultrassonografia de rotina em assintomáticas; orienta-se relatar sangramento, investigado com baixo limiar.","rac":"1) Tamoxifeno. 2) Assintomática. 3) Rastreamento por imagem não indicado. 4) Educar sobre sangramento.","pista":"Usuária de tamoxifeno assintomática.","mud":"Se ela tivesse sangramento, a investigação seria imediata e com baixo limiar.","cmp":"Tamoxifeno: agonista endometrial. Inibidor de aromatase: não estimula o endométrio.","arm":"Aplicar o limiar de 4 mm em usuária de tamoxifeno.","regra":"Tamoxifeno: não vigie com ultrassom, vigie o sangramento.","cf":"Pólipos associados ao tamoxifeno devem ser removidos.","fonte":"Aula HTML Doenças Benignas e Malignas do Corpo Uterino (Aulas-GO, aula 09), módulos 1.3, 2.1, 3.6 (prevenção: vigilância em uso de tamoxifeno) e 4.1 (limite de 4 mm)."}]},{"id":"M07","titulo":"Doenças benignas e malignas da mama","bloco":2,"grupo":"P","q":[{"n":1,"sub":"Fibroadenoma típico","eixo":"Alterações benignas","comp":"Conduzir o nódulo com características típicas de fibroadenoma","enun":"Mulher de 23 anos palpou nódulo na mama direita há 2 meses. Ao exame, nódulo de 2 cm, móvel, indolor, elástico e bem delimitado. Ultrassonografia: nódulo oval, paralelo à pele, de margens circunscritas, hipoecoico e homogêneo, classificado como BI-RADS 3. Qual é a conduta?","ops":[["Seguimento clínico e ultrassonográfico de curto intervalo.","Correta: nódulo típico de fibroadenoma em jovem, com clínica e imagem concordantes, pode ser seguido como BI-RADS 3."],["Mastectomia simples pela possibilidade de transformação maligna.","Errada: fibroadenoma simples não aumenta de forma relevante o risco de câncer."],["Mamografia bilateral como primeiro exame complementar antes de qualquer decisão.","Errada: em menores de 30 a 35 anos, a ultrassonografia é o primeiro exame."],["Quadrantectomia com biópsia do linfonodo sentinela.","Errada: é cirurgia oncológica, desproporcional a lesão benigna."]],"conc":"O fibroadenoma é o tumor benigno fibroepitelial mais comum, com pico entre 20 e 35 anos, móvel, indolor e elástico. Se típico e concordante, segue-se; exérese se dúvida, crescimento, mais de 3 cm, sintomas, achados atípicos ou desejo da paciente.","rac":"1) Jovem. 2) Nódulo móvel e elástico. 3) US típica. 4) BI-RADS 3. 5) Seguimento.","pista":"Concordância entre clínica e imagem típicas.","mud":"Crescimento rápido ou tamanho acima de 3 a 4 cm levaria à exérese e à suspeita de tumor filoides.","cmp":"Fibroadenoma: oval e paralelo à pele. Carcinoma: irregular e 'mais alto que largo'.","arm":"Indicar cirurgia oncológica para nódulo benigno típico.","regra":"Jovem com nódulo típico e US típica: seguir.","cf":"No seguimento BI-RADS 3, o controle é feito aos 6, 12 e 24 meses.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.2 (fibroadenoma), módulo 3.2 (regra do nódulo palpável) e tabela de lesões benignas; Patologia da mama 2025 (material da disciplina, Drive)."},{"n":2,"sub":"Mastalgia cíclica","eixo":"Alterações benignas","comp":"Abordar a mastalgia cíclica sem exames desnecessários","enun":"Mulher de 32 anos refere dor nas duas mamas que piora na semana anterior à menstruação e melhora com ela, há 1 ano. Exame clínico das mamas e axilas normal. Qual é a conduta mais adequada?","ops":[["Tranquilizar, orientar sutiã adequado e analgésico simples ou AINE se necessário.","Correta: mastalgia cíclica bilateral com exame normal raramente é câncer e se trata com medidas simples."],["Mamografia bilateral e ressonância para excluir câncer antes de qualquer orientação.","Errada: aos 32 anos com exame normal e dor cíclica, não há indicação de mamografia ou ressonância."],["Tamoxifeno por 6 meses como primeira linha de tratamento.","Errada: o tamoxifeno fica para casos graves e refratários, em serviço especializado."],["Biópsia com agulha grossa da região mais dolorosa.","Errada: não há lesão a biopsiar."]],"conc":"Mastalgia cíclica é bilateral, piora na fase lútea e melhora com a menstruação. Tratamento: tranquilizar (após exame; mamografia atualizada se 40 anos ou mais), sutiã adequado, analgésico simples ou AINE. Tamoxifeno ou danazol só em casos graves refratários.","rac":"1) Dor bilateral cíclica. 2) Exame normal. 3) Menos de 40 anos. 4) Tranquilizar e tratar sintomas.","pista":"Relação com o ciclo menstrual e exame normal.","mud":"Dor focal unilateral não cíclica levaria a investigar cisto, mastite ou causa torácica.","cmp":"Cíclica: hormonal, bilateral. Não cíclica: focal, investigar.","arm":"Pedir exames de imagem para toda dor mamária.","regra":"Dor cíclica com exame normal: acolher e tratar.","cf":"Isoladamente, a dor tem risco de malignidade de cerca de 1% ou menos.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 1.2 (queixas mamárias) e 2.1 (mastalgia e alterações funcionais benignas)."},{"n":3,"sub":"Descarga papilar fisiológica","eixo":"Alterações benignas","comp":"Diferenciar descarga fisiológica de patológica","enun":"Mulher de 29 anos refere saída de secreção esbranquiçada pelos mamilos ao comprimir as mamas há 3 meses. Ao exame, descarga bilateral, multiductal, só à expressão. Ciclos irregulares. Usa metoclopramida com frequência. Qual é a conduta?","ops":[["Dosar prolactina, TSH e beta-hCG e revisar medicamentos.","Correta: descarga bilateral, multiductal e provocada é fisiológica; se láctea, investiga-se a galactorreia."],["Excisão dos ductos retroareolares, pelo risco de papiloma.","Errada: a excisão é indicada na descarga patológica, unilateral, uniductal e espontânea."],["Mamografia e ductografia para afastar carcinoma.","Errada: o padrão é fisiológico; a investigação é endócrina e medicamentosa."],["Citologia do derrame como exame decisivo para excluir câncer.","Errada: a citologia do derrame tem baixa sensibilidade e não é o caminho aqui."]],"conc":"Descarga fisiológica: bilateral, multiductal, provocada, cores variadas. Galactorreia: prolactina, TSH, beta-hCG e revisão de fármacos (antipsicóticos, metoclopramida, antidepressivos). Descarga patológica: unilateral, uniductal, espontânea, sanguinolenta ou cristalina.","rac":"1) Bilateral. 2) Multiductal. 3) Provocada. 4) Láctea com ciclos irregulares e metoclopramida. 5) Galactorreia: investigar causa.","pista":"Bilateral, multiductal e provocada.","mud":"Se fosse unilateral, uniductal, espontânea e sanguinolenta, a conduta seria imagem e excisão do ducto.","cmp":"Fisiológica: endócrina. Patológica: papiloma (mais comum) ou carcinoma.","arm":"Operar descarga fisiológica.","regra":"Bilateral e provocada: procure hormônio e remédio.","cf":"A metoclopramida eleva a prolactina, e a troca do fármaco pode resolver o quadro.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.7 (descarga papilar) e algoritmo B."},{"n":4,"sub":"Descarga papilar sanguinolenta","eixo":"Alterações benignas","comp":"Conduzir a descarga papilar patológica","enun":"Mulher de 46 anos apresenta saída espontânea de secreção sanguinolenta por um único ducto da mama esquerda. Sem nódulo palpável. Mamografia e ultrassonografia sem alterações. Qual é a causa mais provável e a conduta?","ops":[["Papiloma intraductal; excisão do ducto acometido, mesmo com imagens normais.","Correta: o papiloma é a causa mais comum de descarga sanguinolenta uniductal; a excisão afasta atipia ou carcinoma."],["Alteração funcional benigna; tranquilizar e repetir a mamografia em 2 anos.","Errada: descarga uniductal, espontânea e sanguinolenta é patológica e exige investigação e excisão."],["Hiperprolactinemia; dosar prolactina e iniciar cabergolina.","Errada: a descarga da hiperprolactinemia é láctea, bilateral e multiductal."],["Carcinoma inflamatório; quimioterapia neoadjuvante imediata.","Errada: não há sinais inflamatórios cutâneos nem diagnóstico histológico."]],"conc":"Descarga patológica: unilateral, uniductal, espontânea, sanguinolenta ou 'água de rocha'. Causas: papiloma intraductal (mais comum), ectasia, carcinoma (5 a 10%). Conduta: mamografia e US (com RM ou ductografia se necessário) e excisão do ducto, em geral mesmo com imagem normal.","rac":"1) Uniductal, espontânea, sanguinolenta. 2) Patológica. 3) Papiloma mais provável. 4) Excisão do ducto.","pista":"Descarga sanguinolenta uniductal espontânea.","mud":"Bilateral, multiductal e provocada sugeriria descarga fisiológica.","cmp":"Papiloma solitário: retroareolar, 35 a 55 anos. Papilomatose múltipla: jovens, bilateral, maior risco.","arm":"Tranquilizar pela imagem normal.","regra":"Descarga sanguinolenta uniductal: retire o ducto.","cf":"A ectasia ductal em tabagistas cursa com secreção espessa, retração mamilar e mastite recorrente.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.4 (papiloma intraductal) e 2.7 (descarga patológica) e algoritmo B."},{"n":5,"sub":"Mastite lactacional","eixo":"Alterações benignas","comp":"Tratar a mastite puerperal mantendo a amamentação","enun":"Puérpera de 26 anos, 3 semanas pós-parto, amamentando, com febre de 38,7 °C, mal-estar e área eritematosa, quente e dolorosa no quadrante superior externo da mama direita há 36 horas, sem flutuação. Fissura mamilar à direita. Qual é a conduta?","ops":[["Manter a amamentação, analgesia e antibiótico antiestafilocócico.","Correta: mastite lactacional com sintomas há mais de 24 horas exige antibiótico, sem interromper a amamentação."],["Suspender a amamentação na mama afetada até o fim do antibiótico.","Errada: interromper a amamentação aumenta a estase de leite e piora o quadro."],["Inibir a lactação com cabergolina e iniciar antibiótico de amplo espectro.","Errada: não há indicação de suprimir a lactação."],["Drenagem cirúrgica imediata, pela febre alta.","Errada: não há coleção; a drenagem é para abscesso."]],"conc":"Mastite lactacional: estase de leite e fissura mamilar levam à infecção, em geral por Staphylococcus aureus. Manter amamentação ou esvaziamento, analgesia e antibiótico antiestafilocócico (cefalexina ou dicloxacilina) se sintomas por mais de 24 horas ou piora.","rac":"1) Puérpera amamentando. 2) Área inflamada com febre. 3) Sem flutuação: sem abscesso. 4) Mais de 24 horas de sintomas. 5) Antibiótico e manter amamentação.","pista":"Ausência de flutuação em quadro com mais de 24 horas.","mud":"Flutuação ou coleção à US indicaria abscesso, com punção guiada por US.","cmp":"Mastite: antibiótico e esvaziamento. Abscesso: drenagem por punção ou cirurgia mais antibiótico.","arm":"Interromper a amamentação.","regra":"Mastite: o leite tem que sair.","cf":"Mastite que não responde ao antibiótico deve levantar suspeita de abscesso ou de carcinoma inflamatório.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.5 (mastite lactacional) e tabela mastite x abscesso x carcinoma inflamatório x Paget."},{"n":6,"sub":"Abscesso mamário","eixo":"Alterações benignas","comp":"Tratar o abscesso mamário","enun":"Puérpera de 30 anos em tratamento de mastite há 5 dias com cefalexina mantém febre e apresenta área endurecida e flutuante de 3 cm na mama esquerda. Ultrassonografia: coleção de 3,2 cm. Qual é a conduta preferida?","ops":[["Punção aspirativa guiada por ultrassonografia e manutenção do antibiótico.","Correta: a punção guiada por US é preferida para o abscesso, com antibiótico, mantendo a amamentação quando possível."],["Trocar o antibiótico por via oral de amplo espectro sem abordar a coleção.","Errada: a coleção precisa ser drenada."],["Mastectomia pela falha do tratamento clínico.","Errada: é intervenção desproporcional para abscesso."],["Suspender a amamentação definitivamente e aguardar a reabsorção espontânea.","Errada: o abscesso não se reabsorve com segurança e a amamentação pode ser mantida."]],"conc":"Abscesso mamário: coleção flutuante ou vista à US. Tratamento por punção aspirativa guiada por US (preferida) ou drenagem cirúrgica, mais antibiótico; manter a amamentação quando possível.","rac":"1) Mastite sem resposta. 2) Coleção à US. 3) Abscesso. 4) Punção guiada. 5) Antibiótico.","pista":"Coleção flutuante confirmada à US.","mud":"Sem coleção, a conduta seria manter o antibiótico e o esvaziamento.","cmp":"Mastite: celulite do parênquima. Abscesso: coleção.","arm":"Apenas trocar antibiótico sem drenar.","regra":"Pus se drena.","cf":"Se, após a drenagem, persistir lesão endurecida, a biópsia deve ser considerada.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.5 (abscesso mamário) e erros comuns."},{"n":7,"sub":"BI-RADS 0","eixo":"BI-RADS","comp":"Interpretar o BI-RADS 0","enun":"Mulher de 55 anos, assintomática, faz mamografia de rastreamento com laudo: 'assimetria focal no quadrante superior externo da mama esquerda, BI-RADS 0'. Qual é a conduta?","ops":[["Complementar a avaliação por imagem.","Correta: BI-RADS 0 é inconclusivo e exige avaliação adicional."],["Repetir a mamografia no próximo rastreamento de rotina.","Errada: BI-RADS 0 não é normal."],["Biópsia com agulha grossa imediata da assimetria.","Errada: a biópsia vem depois da complementação, se a lesão for classificada como suspeita."],["Controle mamográfico em 6 meses, como no BI-RADS 3.","Errada: o seguimento curto é conduta da categoria 3, não da 0."]],"conc":"BI-RADS 0: inconclusivo, precisa de avaliação adicional. 1: negativo. 2: benigno. 3: provavelmente benigno (2% ou menos), seguimento curto. 4: suspeito, biópsia. 5: 95% ou mais, biópsia. 6: malignidade comprovada.","rac":"1) Laudo inconclusivo. 2) Complementar. 3) Reclassificar em 1 a 5.","pista":"Categoria 0.","mud":"Se a assimetria fosse nova e em evolução após a complementação, poderia ser classificada como suspeita.","cmp":"BI-RADS 0: falta informação. BI-RADS 3: há informação, achado provavelmente benigno.","arm":"Ler BI-RADS 0 como normal.","regra":"BI-RADS 0: complete o exame.","cf":"Comparar com mamografias antigas pode reclassificar uma assimetria estável como benigna.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.3 (BI-RADS: categorias e condutas) e erros comuns; ACR BI-RADS Atlas."},{"n":8,"sub":"BI-RADS 3","eixo":"BI-RADS","comp":"Conduzir o achado provavelmente benigno","enun":"Mulher de 44 anos com nódulo não palpável de 9 mm, oval, circunscrito, à ultrassonografia, sem exame prévio para comparação, classificado como BI-RADS 3. Qual é a conduta?","ops":[["Seguimento curto, com controle aos 6 meses e depois aos 12 e 24 meses.","Correta: BI-RADS 3 tem malignidade de até 2% e exige seguimento curto."],["Rastreamento de rotina, porque o achado é benigno.","Errada: BI-RADS 3 não é 'não precisa fazer nada'."],["Biópsia obrigatória, pois todo nódulo sólido exige histologia.","Errada: a biópsia no BI-RADS 3 se faz se houver crescimento, mudança ou desejo da paciente."],["Mastectomia profilática pelo risco de crescimento.","Errada: conduta desproporcional para lesão provavelmente benigna."]],"conc":"BI-RADS 3: provavelmente benigno (2% ou menos). Seguimento curto aos 6, 12 e 24 meses (unilateral inicial aos 6); biópsia se crescer, mudar ou por desejo ou ansiedade da paciente.","rac":"1) BI-RADS 3. 2) Probabilidade de até 2%. 3) Seguimento curto. 4) Biópsia se mudar.","pista":"Categoria 3.","mud":"Se no controle de 6 meses o nódulo crescesse, seria reclassificado e biopsiado.","cmp":"BI-RADS 2: rotina. BI-RADS 3: seguimento curto. BI-RADS 4: biópsia.","arm":"Tratar BI-RADS 3 como BI-RADS 2.","regra":"BI-RADS 3: 6, 12 e 24 meses.","cf":"A ansiedade importante da paciente é motivo aceito para biopsiar um BI-RADS 3.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.3 (tabela BI-RADS) e erros comuns; ACR BI-RADS Atlas."},{"n":9,"sub":"Microcalcificações suspeitas","eixo":"BI-RADS","comp":"Indicar o método de biópsia para microcalcificações","enun":"Mulher de 58 anos, rastreamento mamográfico com microcalcificações pleomórficas finas, agrupadas, em distribuição segmentar, sem nódulo palpável nem visível à ultrassonografia. Laudo: BI-RADS 4C. Qual é a conduta?","ops":[["Biópsia por mamotomia (vácuo) guiada por estereotaxia.","Correta: lesões não palpáveis com microcalcificações são biopsiadas a vácuo com guia estereotáxico."],["Punção aspirativa por agulha fina guiada por ultrassonografia.","Errada: a lesão não é vista à US, e a PAAF não diferencia in situ de invasivo."],["Controle mamográfico em 6 meses.","Errada: BI-RADS 4 exige biópsia."],["Ressonância magnética para decidir se a biópsia é necessária.","Errada: a RM não substitui a biópsia de achado suspeito."]],"conc":"Microcalcificações pleomórficas finas, lineares ou ramificadas, agrupadas ou segmentares, são suspeitas (muitas vezes CDIS). BI-RADS 4C (mais de 50 até menos de 95%) exige biópsia; para lesões não palpáveis com microcalcificações, mamotomia guiada por estereotaxia.","rac":"1) Microcalcificações suspeitas. 2) BI-RADS 4C. 3) Não palpáveis nem vistas à US. 4) Estereotaxia a vácuo.","pista":"Microcalcificações sem correspondente ultrassonográfico.","mud":"Um nódulo suspeito visível à US seria biopsiado por core guiada por US.","cmp":"Core por US: nódulos. Vácuo por estereotaxia: microcalcificações.","arm":"Usar PAAF para lesão suspeita sólida ou calcificada.","regra":"Calcificação suspeita: vácuo com estereotaxia.","cf":"O CDIS responde por cerca de 25% dos diagnósticos mamográficos e costuma se apresentar como microcalcificações.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 3.3 (achados suspeitos) e 3.4 (tabela de biópsias) e 2.10 (CDIS)."},{"n":10,"sub":"Cisto simples","eixo":"BI-RADS","comp":"Classificar e conduzir o cisto simples","enun":"Mulher de 42 anos com nódulo palpável doloroso discreto na mama esquerda. Ultrassonografia: imagem anecoica, de parede fina, com reforço acústico posterior, 2 cm. Qual é a classificação e a conduta?","ops":[["BI-RADS 2; observar e puncionar só se sintomático.","Correta: cisto simples é benigno; punciona-se se sintomático ou duvidoso."],["BI-RADS 4A; biópsia com agulha grossa.","Errada: o cisto simples não tem componente sólido nem critério de suspeição."],["BI-RADS 3; controle em 6 meses obrigatório.","Errada: o cisto simples é categoria 2, sem necessidade de seguimento curto."],["BI-RADS 0; ressonância magnética para complementar.","Errada: o achado está bem caracterizado."]],"conc":"Cistos são frequentes entre 35 e 50 anos. O cisto simples (anecoico, parede fina, reforço posterior) é BI-RADS 2. O cisto complicado ou complexo (septos, componente sólido) segue biópsia ou seguimento conforme BI-RADS.","rac":"1) Anecoico. 2) Parede fina. 3) Reforço posterior. 4) Cisto simples. 5) BI-RADS 2.","pista":"Imagem anecoica com reforço posterior.","mud":"Componente sólido intracístico levaria à biópsia.","cmp":"Cisto simples: BI-RADS 2. Cisto complexo: avaliar biópsia.","arm":"Biopsiar cisto simples.","regra":"Anecoico e liso: benigno.","cf":"Se ela desejar alívio da dor, a punção aspirativa esvazia o cisto.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.1 (cistos) e tabela de lesões benignas; ACR BI-RADS Atlas."},{"n":11,"sub":"Rastreamento pelo Ministério da Saúde","eixo":"Rastreamento","comp":"Conhecer a orientação atual do Ministério da Saúde e do INCA","enun":"Segundo a nota técnica do Ministério da Saúde e do INCA divulgada em 2025, qual é a faixa etária em que o rastreamento mamográfico é recomendado para mulheres de risco habitual no SUS?","ops":[["Dos 50 aos 74 anos, com acesso garantido às de 40 a 49 por demanda, após orientação.","Correta: a nota de 2025 estendeu a recomendação até 74 anos e não restringe o acesso de 40 a 49 anos."],["Dos 50 aos 69 anos, sem acesso para mulheres de 40 a 49 anos no SUS.","Errada: essa era a diretriz de 2015, atualizada em 2025."],["Dos 25 aos 64 anos, a cada 3 anos.","Errada: essa faixa e esse intervalo pertencem ao rastreamento do colo uterino."],["Dos 35 aos 80 anos, com mamografia semestral.","Errada: não há recomendação de mamografia semestral nem início aos 35 anos para risco habitual."]],"conc":"O MS/INCA recomendava mamografia bienal de 50 a 69 anos (2015). A nota técnica de 2025 ampliou a recomendação até os 74 anos e não restringe o acesso de mulheres de 40 a 49 (e acima de 74) que desejem o exame, após aconselhamento. As sociedades brasileiras recomendam mamografia anual de 40 a 74 anos.","rac":"1) Referência declarada: MS/INCA 2025. 2) Faixa recomendada: 50 a 74. 3) 40 a 49: acesso por demanda com decisão informada.","pista":"A expressão 'nota técnica de 2025'.","mud":"Se o enunciado adotasse as sociedades brasileiras (SBM, CBR, FEBRASGO), a resposta seria anual de 40 a 74 anos.","cmp":"MS/INCA 2015: 50 a 69, bienal. MS/INCA 2025: 50 a 74, com 40 a 49 por demanda. Sociedades: 40 a 74, anual.","arm":"Cobrar a faixa de 2015 como vigente.","regra":"Sempre leia qual referência o enunciado adota.","cf":"Para mulheres de 40 a 49, a decisão deve considerar benefícios e danos, como falso-positivos e sobrediagnóstico.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.7 (rastreamento: comparação das fontes, marcado para conferência); INCA, Informe de outubro de 2025 sobre a nota técnica de acesso à mamografia no SUS (ninho.inca.gov.br), conferido em 09/11/2026."},{"n":12,"sub":"Rastreamento pelas sociedades","eixo":"Rastreamento","comp":"Aplicar a recomendação das sociedades brasileiras","enun":"Pela recomendação conjunta das sociedades brasileiras (SBM, CBR e FEBRASGO), mulher de 43 anos, risco habitual, assintomática, pergunta quando fazer mamografia. Qual é a orientação?","ops":[["Mamografia anual a partir dos 40 anos, até 74 anos.","Correta: é a recomendação das sociedades para risco habitual."],["Mamografia bienal somente a partir dos 50 anos.","Errada: corresponde à recomendação histórica do Ministério da Saúde, não às sociedades."],["Ultrassonografia anual em substituição à mamografia até os 50 anos.","Errada: a US não é método de rastreamento isolado."],["Autoexame mensal, sem mamografia até os 50 anos.","Errada: o autoexame não substitui o rastreamento."]],"conc":"Sociedades brasileiras: mamografia anual de 40 a 74 anos; individualizar a partir de 75. USPSTF 2024: bienal de 40 a 74. MS/INCA 2025: recomendação de 50 a 74, com acesso por demanda de 40 a 49.","rac":"1) Referência: sociedades. 2) 43 anos, risco habitual. 3) Anual desde os 40.","pista":"A referência às sociedades brasileiras.","mud":"Pela referência do MS/INCA, aos 43 anos a mamografia seria oferecida por demanda, após decisão compartilhada.","cmp":"Sociedades: anual 40 a 74. USPSTF: bienal 40 a 74. MS 2025: 50 a 74.","arm":"Responder sem considerar a referência pedida.","regra":"Sociedades: 40, anual.","cf":"Mama densa (categorias C e D) reduz a sensibilidade da mamografia e pode motivar US ou RM complementar.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 3.7 e 4.1 (controvérsias sobre início e periodicidade; texto conjunto das sociedades não reaberto, marcado como inferência didática)."},{"n":13,"sub":"Rastreamento no alto risco","eixo":"Rastreamento","comp":"Indicar o rastreamento intensificado em alto risco","enun":"Mulher de 31 anos, portadora de variante patogênica em BRCA1, assintomática, exame clínico normal. Qual é o rastreamento recomendado?","ops":[["Mamografia anual com ressonância magnética anual, com aconselhamento genético.","Correta: no alto risco o rastreamento começa por volta dos 30 anos, com mamografia e RM anuais."],["Mamografia bienal a partir dos 50 anos, como no risco habitual.","Errada: portadoras de BRCA têm risco vitalício muito maior e iniciam antes."],["Ultrassonografia isolada a cada 2 anos até os 40 anos.","Errada: a US isolada não é o método de rastreamento do alto risco."],["Autoexame mensal e exame clínico anual, sem exames de imagem até os 40 anos.","Errada: o exame clínico e o autoexame não substituem a imagem no alto risco."]],"conc":"Alto risco (BRCA1/2 ou outras variantes, parente de 1º grau portador, RT torácica antes dos 30, risco vitalício de 20 a 25% ou mais): iniciar por volta dos 30 anos (ou 10 anos antes do caso mais jovem), com mamografia e RM anuais e aconselhamento genético.","rac":"1) BRCA1. 2) Alto risco. 3) 31 anos. 4) Mamografia e RM anuais.","pista":"Portadora de BRCA1.","mud":"Sem variante patogênica nem história relevante, ela seguiria o rastreamento de risco habitual.","cmp":"Risco habitual: mamografia. Alto risco: mamografia e RM.","arm":"Aplicar o rastreamento populacional a portadoras de BRCA.","regra":"BRCA: RM e mamografia anuais, cedo.","cf":"Cirurgias redutoras de risco (mastectomia e salpingo-ooforectomia) podem ser discutidas após aconselhamento.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.9 (variantes germinativas) e 3.7 (alto risco, idades variáveis por diretriz, marcado como inferência didática) e tabela de imagem 3.2."},{"n":14,"sub":"Mulher de 40 a 49 anos no SUS","eixo":"Rastreamento","comp":"Aplicar a decisão compartilhada na faixa de 40 a 49 anos","enun":"Pela nota técnica do Ministério da Saúde e do INCA de 2025, mulher de 44 anos, risco habitual, sem sinais ou sintomas, pede mamografia na unidade básica. Qual é a conduta adequada?","ops":[["Informar benefícios e riscos e pedir a mamografia, se ela desejar.","Correta: a nota não restringe o acesso de 40 a 49 anos por demanda, após aconselhamento."],["Negar o exame, porque o SUS só realiza mamografia a partir dos 50 anos.","Errada: o acesso por demanda na faixa de 40 a 49 é garantido pela nota de 2025."],["Solicitar ressonância magnética, mais sensível em mulheres jovens.","Errada: a RM é para alto risco ou situações específicas."],["Orientar apenas o autoexame mensal como substituto da mamografia.","Errada: o autoexame não substitui o rastreamento."]],"conc":"Na faixa de 40 a 49 anos, o SUS não restringe o acesso à mamografia para quem a deseja, após orientação sobre benefícios e danos (falso-positivos, biópsias desnecessárias, sobrediagnóstico). A decisão compartilhada é central.","rac":"1) Referência: MS/INCA 2025. 2) 44 anos, risco habitual. 3) Acesso por demanda. 4) Aconselhar e solicitar se ela quiser.","pista":"Pedido da própria mulher na faixa de 40 a 49 anos.","mud":"Pelas sociedades brasileiras, a mamografia anual já seria recomendada aos 44 anos.","cmp":"Benefício: redução de mortalidade. Danos: falso-positivos, sobrediagnóstico, ansiedade.","arm":"Negar o exame com base na diretriz de 2015.","regra":"De 40 a 49: informar e respeitar a escolha.","cf":"A estratégia de conscientização (conhecer as próprias mamas e procurar atendimento diante de alteração) complementa o rastreamento.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.7 (benefícios e danos; autoexame); INCA, Informe de outubro de 2025 sobre a nota técnica de acesso à mamografia no SUS, conferido em 09/11/2026."},{"n":15,"sub":"Sinais de câncer hereditário","eixo":"Fatores de risco e hereditariedade","comp":"Reconhecer quem deve receber avaliação genética","enun":"Mulher de 38 anos recebe diagnóstico de carcinoma invasivo triplo-negativo. A mãe teve câncer de ovário aos 52 anos. Qual conduta é indicada além do tratamento oncológico?","ops":[["Aconselhamento genético e teste germinativo para BRCA e outros genes.","Correta: triplo-negativo até 60 anos, início antes de 45 a 50 e câncer de ovário na família são sinais de hereditariedade."],["Nenhuma avaliação genética, porque apenas 5 a 10% dos cânceres de mama são hereditários.","Errada: a raridade geral não afasta a suspeita diante de vários sinais de alerta."],["Teste genético apenas se uma irmã também tiver câncer de mama.","Errada: os sinais presentes já indicam avaliação."],["Dosagem de CA-15-3 nos familiares de primeiro grau.","Errada: marcadores tumorais não rastreiam risco hereditário."]],"conc":"Hereditários são 5 a 10%, cerca de 90% por BRCA1/2. Sinais de alerta: início antes de 45 a 50 anos, triplo-negativo até 60, bilateral, 3 ou mais casos na família, câncer de ovário, câncer de mama masculino, ancestralidade asquenaze.","rac":"1) 38 anos. 2) Triplo-negativo. 3) Mãe com câncer de ovário. 4) Suspeita de BRCA. 5) Aconselhamento e teste.","pista":"Triplo-negativo jovem com câncer de ovário na família.","mud":"Mulher de 72 anos com luminal A e sem história familiar não teria indicação de teste.","cmp":"Esporádico: 90 a 95%. Hereditário: 5 a 10%.","arm":"Ignorar a história familiar de câncer de ovário.","regra":"Ovário na família ou triplo-negativo jovem: teste genético.","cf":"Portadoras de BRCA com tumor de alto risco podem se beneficiar de inibidores de PARP.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.9 (hereditário x esporádico e sinais de alerta)."},{"n":16,"sub":"Fatores de risco e proteção","eixo":"Fatores de risco e hereditariedade","comp":"Identificar fatores de risco modificáveis e de proteção","enun":"Qual das situações abaixo representa fator de proteção contra o câncer de mama?","ops":[["Amamentação prolongada.","Correta: a amamentação prolongada é fator de proteção."],["Terapia hormonal combinada de estrogênio e progestagênio por mais de 5 anos.","Errada: a terapia combinada prolongada aumenta o risco."],["Primeira gestação após os 30 anos.","Errada: a primeira gestação tardia aumenta o risco."],["Consumo diário de álcool.","Errada: o álcool é fator de risco modificável."]],"conc":"Risco aumentado: idade, história familiar, variantes germinativas, RT torácica jovem, menarca precoce, menopausa tardia, nuliparidade ou 1ª gestação após 30, não amamentar, TH combinada prolongada, obesidade na pós-menopausa, álcool, sedentarismo, mama densa, atipia. Proteção: amamentação, atividade física, peso saudável, gestação antes dos 30.","rac":"1) Avaliar cada exposição. 2) Amamentação reduz o risco. 3) As demais aumentam.","pista":"A única exposição que reduz o tempo de estímulo hormonal e diferencia o epitélio.","mud":"Se a pergunta fosse sobre o câncer de endométrio, o progestagênio associado seria protetor.","cmp":"Mama: TH combinada aumenta. Endométrio: progestagênio protege.","arm":"Transportar a proteção do progestagênio no endométrio para a mama.","regra":"Amamentar protege a mama.","cf":"A quimioprevenção (tamoxifeno, raloxifeno, inibidores de aromatase) é opção em alto risco selecionado.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.9 (fatores de risco e proteção)."},{"n":17,"sub":"Lesões de risco","eixo":"Fatores de risco e hereditariedade","comp":"Conduzir a hiperplasia ductal atípica na core biopsy","enun":"Mulher de 51 anos com microcalcificações BI-RADS 4B tem biópsia a vácuo mostrando hiperplasia ductal atípica. Qual é a conduta?","ops":[["Exérese cirúrgica, pelo risco de subestimação.","Correta: HDA na biópsia percutânea leva à exérese e confere risco relativo de 4 a 5."],["Alta com rastreamento de rotina, porque a lesão é benigna.","Errada: a atipia é lesão de risco e pode coexistir com carcinoma."],["Mastectomia bilateral imediata.","Errada: conduta desproporcional para lesão de risco."],["Quimioterapia preventiva com antracíclico.","Errada: não existe quimioterapia para lesão de risco."]],"conc":"Histologia benigna por risco: não proliferativa (sem aumento), proliferativa sem atipia (RR 1,5 a 2), proliferativa com atipia (HDA, hiperplasia lobular atípica, CLIS; RR 4 a 5). HDA na core leva à exérese; lesões B3 costumam exigir exérese.","rac":"1) HDA na biópsia percutânea. 2) Pode haver CDIS não amostrado. 3) Exérese. 4) Aconselhamento de risco.","pista":"Atipia em biópsia percutânea.","mud":"Alteração não proliferativa (cistos, fibrose) não exigiria exérese.","cmp":"Sem atipia: seguimento. Com atipia: exérese e redução de risco.","arm":"Tratar atipia como benignidade comum.","regra":"Atipia na agulha: exérese.","cf":"Após a exérese, discute-se quimioprevenção em alto risco selecionado.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.6 (lesões proliferativas e de risco)."},{"n":18,"sub":"Nódulo palpável na jovem","eixo":"Propedêutica do nódulo palpável","comp":"Escolher o primeiro exame conforme a idade","enun":"Mulher de 27 anos palpou nódulo na mama esquerda. Exame: nódulo de 1,8 cm, móvel, sem linfonodos palpáveis. Qual é o primeiro exame de imagem?","ops":[["Ultrassonografia mamária.","Correta: em menores de 30 a 35 anos, a US é o primeiro exame."],["Mamografia bilateral.","Errada: em mamas jovens e densas a mamografia é menos sensível."],["Ressonância magnética das mamas.","Errada: a RM é para situações específicas, não primeiro exame."],["Cintilografia mamária.","Errada: não é exame de primeira linha."]],"conc":"Regra do nódulo palpável: abaixo de 30 a 35 anos, US primeiro; a partir de 35 a 40, mamografia e US. Nódulo suspeito com imagem normal deve ser biopsiado.","rac":"1) 27 anos. 2) Mama densa. 3) US primeiro.","pista":"Idade abaixo de 30 anos.","mud":"Com 52 anos, a investigação incluiria mamografia e US.","cmp":"Jovem: US. Acima de 35 a 40: mamografia e US.","arm":"Pedir mamografia como primeiro exame em jovem.","regra":"Jovem com nódulo: ultrassom primeiro.","cf":"A US também é o primeiro exame em gestantes e lactantes.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.2 (regra de ouro no nódulo palpável, limites de idade variáveis) e algoritmo A; Patologia da mama 2025."},{"n":19,"sub":"Nódulo suspeito com imagem normal","eixo":"Propedêutica do nódulo palpável","comp":"Não tranquilizar diante de discordância clínico-radiológica","enun":"Mulher de 48 anos com nódulo palpável endurecido, irregular, pouco móvel, de 2,5 cm, no quadrante superior externo da mama direita. Mamografia com mama densa sem achados e ultrassonografia sem alteração focal. Qual é a conduta?","ops":[["Biópsia do nódulo palpável, apesar dos exames de imagem normais.","Correta: nódulo clinicamente suspeito com imagem normal exige biópsia."],["Tranquilizar e repetir a mamografia em 1 ano.","Errada: nunca se tranquiliza 'por imagem normal' diante de nódulo suspeito."],["Classificar como BI-RADS 1 e manter o rastreamento de rotina.","Errada: o BI-RADS descreve a imagem, mas a clínica suspeita impõe investigação."],["Iniciar tamoxifeno por 3 meses e reavaliar.","Errada: não se trata sem diagnóstico."]],"conc":"Sinais suspeitos: nódulo duro, irregular, fixo; retração; casca de laranja; eczema persistente do mamilo; descarga uniductal sanguinolenta; linfonodo duro e fixo. Discordância entre clínica e imagem: biopsiar.","rac":"1) Nódulo duro, irregular e fixo. 2) Imagem negativa em mama densa. 3) Discordância. 4) Biópsia.","pista":"Exame físico suspeito com imagem normal.","mud":"Nódulo móvel e elástico com US típica de fibroadenoma em jovem permitiria seguimento.","cmp":"Concordância benigna: seguir. Discordância: biopsiar.","arm":"Confiar na imagem negativa.","regra":"Nódulo suspeito se biopsia, mesmo com imagem normal.","cf":"Se a biópsia vier benigna e discordante, repete-se a biópsia ou faz-se exérese.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 3.1 (sinais suspeitos), 3.2 e 3.8 (segurança), algoritmo A e erros comuns."},{"n":20,"sub":"Core biopsy versus PAAF","eixo":"Propedêutica do nódulo palpável","comp":"Escolher o método de biópsia do nódulo sólido suspeito","enun":"Mulher de 61 anos com nódulo sólido espiculado de 1,8 cm, BI-RADS 5. Qual método de biópsia é o padrão atual e por quê?","ops":[["Biópsia por agulha grossa (core), que fornece histologia e imuno-histoquímica.","Correta: a core é o padrão atual para nódulos suspeitos e permite RE, RP, HER2 e Ki-67."],["Punção aspirativa por agulha fina, que diferencia carcinoma in situ de invasivo.","Errada: a PAAF fornece citologia e não diferencia in situ de invasivo."],["Biópsia excisional como primeira escolha, para retirar toda a lesão.","Errada: a excisional fica para falha ou impossibilidade das percutâneas."],["Dosagem de CA-15-3, que dispensa a biópsia quando elevado.","Errada: marcadores não substituem o diagnóstico histológico."]],"conc":"Biópsias: PAAF (citologia; cistos e linfonodos), core (histologia e IHQ; padrão para BI-RADS 4 e 5), mamotomia (lesões não palpáveis, microcalcificações), excisional (após falha das percutâneas). Core negativa não exclui malignidade se houver discordância.","rac":"1) Nódulo BI-RADS 5. 2) Precisa de histologia. 3) Precisa de IHQ. 4) Core.","pista":"Necessidade de imuno-histoquímica para o tratamento.","mud":"Para esvaziar e analisar um cisto, a PAAF seria adequada.","cmp":"PAAF: citologia. Core: histologia e IHQ.","arm":"Usar PAAF para tumor sólido suspeito.","regra":"Nódulo suspeito: core.","cf":"Resultado benigno discordante numa lesão BI-RADS 5 exige nova biópsia ou exérese.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.4 (tabela de biópsias e questão clássica) e erros comuns."},{"n":21,"sub":"Nódulo palpável após os 40 anos","eixo":"Propedêutica do nódulo palpável","comp":"Conduzir a propedêutica do nódulo palpável na mulher mais velha","enun":"Mulher de 54 anos procura a unidade por nódulo palpável de 2 cm na mama esquerda, notado há 1 mês. Exame com nódulo de limites pouco definidos e linfonodo axilar móvel de 1 cm. Qual é a sequência adequada?","ops":[["Mamografia e ultrassonografia, seguidas de biópsia por agulha grossa se suspeito.","Correta: acima de 35 a 40 anos, mamografia e US; BI-RADS 4 ou 5, ou clínica suspeita, levam à core."],["Ultrassonografia isolada e, se o nódulo for sólido, seguimento em 6 meses.","Errada: a mamografia é necessária nessa idade, e nódulo de limites mal definidos não se acompanha."],["Estadiamento sistêmico com tomografia antes de qualquer biópsia.","Errada: o diagnóstico histológico vem antes do estadiamento."],["Mastectomia diagnóstica e terapêutica.","Errada: o diagnóstico é percutâneo; a cirurgia é planejada depois."]],"conc":"Nódulo palpável a partir de 35 a 40 anos: mamografia e US. BI-RADS 4 a 5 ou clínica suspeita: core. Resultado discordante: repetir ou excisar. Confirmado câncer: IHQ e estadiamento clínico.","rac":"1) 54 anos. 2) Nódulo de limites mal definidos. 3) Mamografia e US. 4) Core. 5) Depois, IHQ e estadiamento.","pista":"Idade acima de 40 anos com nódulo suspeito.","mud":"Com 25 anos, a US seria o exame inicial.","cmp":"Diagnóstico: imagem e core. Estadiamento: depois do diagnóstico, conforme o estádio.","arm":"Estadiar antes de diagnosticar.","regra":"Imagem, core e só depois estadiamento.","cf":"O linfonodo axilar suspeito também pode ser puncionado para confirmar comprometimento.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 3.2 a 3.5 e algoritmos A e C."},{"n":22,"sub":"Subtipo luminal A","eixo":"Tipos histológicos e subtipos moleculares","comp":"Classificar o subtipo pela imuno-histoquímica","enun":"Mulher de 66 anos com carcinoma invasivo de tipo não especial, grau 1. Imuno-histoquímica: RE positivo 90%, RP positivo 60%, HER2 negativo, Ki-67 de 8%. Qual é o subtipo e o tratamento sistêmico central?","ops":[["Luminal A; hormonioterapia, com quimioterapia raramente necessária.","Correta: RE e RP altos, HER2 negativo e Ki-67 baixo definem luminal A."],["Luminal B HER2 positivo; quimioterapia com trastuzumabe.","Errada: o HER2 é negativo."],["HER2 puro; quimioterapia com duplo bloqueio anti-HER2.","Errada: o tumor é RE e RP positivo e HER2 negativo."],["Triplo-negativo; quimioterapia com antracíclico e taxano.","Errada: os receptores hormonais são positivos."]],"conc":"Subtipos (St. Gallen): luminal A (RE e RP de 20% ou mais, HER2 negativo, Ki-67 baixo, G1 a 2) hormonioterapia; luminal B HER2 negativo (RP baixo, Ki-67 alto) hormonioterapia com ou sem quimioterapia; luminal B HER2 positivo; HER2 puro; triplo-negativo.","rac":"1) RE e RP altos. 2) HER2 negativo. 3) Ki-67 baixo. 4) Luminal A. 5) Hormonioterapia.","pista":"Ki-67 baixo com receptores altos e HER2 negativo.","mud":"Ki-67 alto e RP baixo levariam a luminal B, com possível quimioterapia.","cmp":"Luminal A: endócrino. Luminal B: endócrino com ou sem químio.","arm":"Indicar quimioterapia a todo câncer de mama.","regra":"Luminal A: o hormônio é o tratamento.","cf":"Na pós-menopausa, o inibidor de aromatase é a hormonioterapia preferida.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.10 (tabela de subtipos por imuno-histoquímica, consenso de St. Gallen)."},{"n":23,"sub":"Luminal B HER2 negativo","eixo":"Tipos histológicos e subtipos moleculares","comp":"Reconhecer o luminal B HER2 negativo","enun":"Mulher de 49 anos com carcinoma invasivo grau 3. Imuno-histoquímica: RE positivo 70%, RP positivo 5%, HER2 negativo (score 1+), Ki-67 de 40%. Qual é o subtipo?","ops":[["Luminal B HER2 negativo.","Correta: RE positivo com RP baixo, HER2 negativo e Ki-67 alto caracterizam o luminal B HER2 negativo."],["Luminal A.","Errada: o luminal A tem RP de 20% ou mais e Ki-67 baixo."],["HER2 puro.","Errada: o HER2 é negativo e os receptores hormonais são positivos."],["Triplo-negativo.","Errada: há receptor de estrogênio positivo."]],"conc":"Luminal B HER2 negativo: RE positivo, RP baixo ou negativo, HER2 negativo, Ki-67 alto ou grau 2 a 3. Tratamento: hormonioterapia com ou sem quimioterapia conforme risco clínico-patológico ou assinatura genômica.","rac":"1) RE positivo. 2) RP de 5%: baixo. 3) HER2 1+: negativo. 4) Ki-67 de 40%. 5) Luminal B HER2 negativo.","pista":"RP baixo com Ki-67 alto.","mud":"HER2 3+ mudaria para luminal B HER2 positivo.","cmp":"Luminal A: Ki-67 baixo. Luminal B: Ki-67 alto ou RP baixo.","arm":"Classificar como luminal A só por ter RE positivo.","regra":"RE positivo com proliferação alta: luminal B.","cf":"Assinaturas genômicas ajudam a decidir quimioterapia em luminal HER2 negativo com 0 a 3 linfonodos.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.10 (tabela de subtipos) e módulo 4.1 (assinaturas genômicas)."},{"n":24,"sub":"Carcinoma lobular","eixo":"Tipos histológicos e subtipos moleculares","comp":"Reconhecer as características do carcinoma lobular","enun":"Sobre o carcinoma lobular invasivo da mama, qual característica está correta segundo a aula?","ops":[["Perda de E-caderina, crescimento em 'fila indiana' e maior tendência a ser multicêntrico e bilateral.","Correta: são as marcas do lobular."],["Representa cerca de 75% dos carcinomas invasivos.","Errada: 75% corresponde ao tipo não especial (ductal); o lobular é 5 a 15%."],["Costuma se apresentar como microcalcificações agrupadas.","Errada: microcalcificações agrupadas são típicas do CDIS."],["Metastatiza preferencialmente para linfonodos supraclaviculares e raramente para serosas.","Errada: o lobular tem predileção por serosas e trato gastrintestinal."]],"conc":"Invasivo: tipo não especial cerca de 75%; lobular 5 a 15% (perda de E-caderina, fila indiana, bilateral ou multicêntrico, metástases em serosas e TGI); tipos especiais (tubular, mucinoso, medular) em geral com melhor prognóstico. CLIS é marcador de risco bilateral.","rac":"1) Lobular. 2) E-caderina negativa. 3) Padrão em fila indiana. 4) Multicentricidade e bilateralidade.","pista":"E-caderina.","mud":"Se a pergunta fosse sobre o tipo mais comum, a resposta seria o tipo não especial.","cmp":"Ductal (NST): mais comum. Lobular: E-caderina negativa, multicêntrico.","arm":"Trocar as proporções entre ductal e lobular.","regra":"Lobular perdeu a E-caderina.","cf":"A multicentricidade pode contraindicar a cirurgia conservadora.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.10 (carcinoma in situ e invasivo); Patologia da mama 2025."},{"n":25,"sub":"Triplo-negativo","eixo":"Tipos histológicos e subtipos moleculares","comp":"Reconhecer o triplo-negativo e suas implicações","enun":"Mulher de 36 anos com carcinoma invasivo grau 3, imuno-histoquímica com RE negativo, RP negativo, HER2 negativo (score 0) e Ki-67 de 70%. Qual afirmação sobre esse subtipo está correta?","ops":[["Triplo-negativo; quimioterapia e avaliação genética.","Correta: triplo-negativo em mulher jovem trata-se com quimioterapia e sugere investigar BRCA."],["É luminal A, pois o Ki-67 alto reflete apenas a idade jovem.","Errada: sem receptores hormonais não é luminal."],["É HER2 puro, com indicação de trastuzumabe.","Errada: o HER2 é negativo."],["É de bom prognóstico e dispensa tratamento sistêmico se o tumor for pequeno.","Errada: o triplo-negativo é agressivo e o tratamento sistêmico é a base."]],"conc":"Triplo-negativo (basal): RE, RP e HER2 negativos, Ki-67 alto, G3. Quimioterapia (antracíclico e taxano; platina em selecionados) com ou sem imunoterapia em estádios II a III de maior risco; portadoras de BRCA de alto risco podem receber PARP. Triplo-negativo até 60 anos é sinal de alerta de hereditariedade.","rac":"1) Três marcadores negativos. 2) Triplo-negativo. 3) Quimioterapia. 4) Jovem: avaliação genética.","pista":"RE, RP e HER2 negativos.","mud":"HER2 3+ mudaria para HER2 puro.","cmp":"Triplo-negativo: químio e imuno. HER2: químio e anti-HER2. Luminal: hormônio.","arm":"Omitir a avaliação genética no triplo-negativo jovem.","regra":"Triplo-negativo jovem: químio e genética.","cf":"Com tumor de 2 cm ou mais ou linfonodo positivo, o trip
