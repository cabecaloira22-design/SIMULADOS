"Com mau controle apesar da insulina, a programação seria com 37 semanas, após internação.","cmp":"Dieta: até 40 semanas. Insulina bem controlado: 38 a 39. Mau controle: 37.","arm":"Confundir 'usa insulina' com 'mal controlada'.","regra":"DMG em insulina e controlada: 38 a 39 semanas.","cf":"Uma gestante com DM pré-gestacional e vasculopatia teria parto mais precoce, em torno de 37 semanas (ACOG: 36 0/7 a 38 6/7).","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 11 (quando interromper), slide 43 do material da disciplina; ACOG CO 831."},{"n":32,"sub":"Via de parto e peso fetal estimado","eixo":"Momento e via do parto","comp":"Indicar cesárea por macrossomia no diabetes","enun":"Gestante de 39 semanas com DMG em insulina, bem controlada. Ultrassonografia recente com PFE de 4.680 g e CA acima do p97. Colo desfavorável. Qual é a via de parto recomendada pelo material da disciplina?","ops":[["Cesárea, porque o peso fetal estimado ultrapassa 4.500 g.","Correta: no Brasil, a aula indica cesárea quando o PFE é maior que 4.500 g."],["Indução com misoprostol e parto vaginal, pois o diabetes não altera a via de parto.","Errada: com PFE acima de 4.500 g o risco de distocia de ombro justifica cesárea."],["Parto vaginal com fórceps de alívio programado para reduzir o período expulsivo.","Errada: o fórceps não previne a distocia de ombro e pode aumentar o trauma."],["Aguardar o trabalho de parto espontâneo e decidir a via apenas se houver parada de progressão.","Errada: a decisão é antecipada pelo peso estimado acima do limiar."]],"conc":"No diabetes, a via é obstétrica; a cesárea é indicada quando o PFE é maior que 4.500 g, pelo risco de distocia de ombro e lesão de plexo braquial.","rac":"1) Termo. 2) PFE de 4.680 g. 3) Acima de 4.500 g. 4) Cesárea.","pista":"PFE acima de 4.500 g.","mud":"Com PFE de 4.100 g, a via seria obstétrica, com parto vaginal possível.","cmp":"Macrossomia (definição mais comum): 4.000 g ou mais. Limiar para cesárea no diabetes: acima de 4.500 g.","arm":"Indicar cesárea para todo feto acima de 4.000 g ou para todo DMG.","regra":"Diabetes com PFE acima de 4.500 g: cesárea.","cf":"Em um parto vaginal de feto grande com distocia de ombro, faz-se McRoberts com pressão suprapúbica, sem tracionar a cabeça nem empurrar o fundo.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 11 (cesárea apenas se PFE acima de 4.500 g), seção 5 (definições de crescimento) e seção 15 (distocia de ombro), slides 19, 41 e 43 do material da disciplina."},{"n":33,"sub":"Glicemia durante o trabalho de parto","eixo":"Manejo intraparto","comp":"Manter a meta glicêmica intraparto para prevenir hipoglicemia neonatal","enun":"Gestante de 38 semanas com DMG em insulina entra em trabalho de parto ativo. Glicemia capilar de 162 mg/dL na admissão. Segundo o slide da aula, qual é a conduta?","ops":[["Manter glicemia entre 100 e 125 mg/dL, com capilar de 2/2 ou 4/4 horas e correção com insulina regular.","Correta: é o alvo do slide 44; a hiperglicemia intraparto aumenta a hipoglicemia neonatal."],["Suspender toda monitorização durante o trabalho de parto, pois o esforço muscular normaliza a glicemia.","Errada: o controle intraparto é necessário; a hiperglicemia materna eleva a insulina fetal."],["Manter a dose habitual de NPH e regular e não corrigir glicemias até 250 mg/dL.","Errada: tolerar 250 mg/dL aumenta o hiperinsulinismo fetal e a hipoglicemia do RN."],["Infundir solução glicosada a 10% sem insulina, para evitar cetose pelo jejum do trabalho de parto.","Errada: glicose sem controle agrava a hiperglicemia já presente."]],"conc":"No trabalho de parto, mantém-se a glicemia entre 100 e 125 mg/dL (aula), com glicemia capilar a cada 2 ou 4 horas e correção com insulina regular. ACOG usa 70 a 110 e NICE 72 a 126.","rac":"1) Gestante em insulina em trabalho de parto. 2) Glicemia 162: acima do alvo. 3) Corrigir com regular. 4) Monitorar 2/2 ou 4/4 horas.","pista":"Alvo intraparto do slide 44.","mud":"Em uma gestante com DMG só com dieta e glicemia de 105, bastaria monitorar.","cmp":"Aula: 100 a 125. ACOG: 70 a 110. NICE: 72 a 126.","arm":"Liberar hiperglicemia intraparto por achar que só importa o pré-natal.","regra":"Hiperglicemia no parto vira hipoglicemia no bebê.","cf":"Após a dequitação, a resistência insulínica cai bruscamente e a insulina do DMG é suspensa.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 12 (parto e pós-parto imediato), slide 44 do material da disciplina; divergência ACOG PB 201 e NICE registrada na aula."},{"n":34,"sub":"Insulina após a dequitação","eixo":"Puerpério e reclassificação","comp":"Ajustar o tratamento após o parto conforme o tipo de diabetes","enun":"Puérpera de 6 horas, parto vaginal, com DMG controlado com 34 UI/dia de insulina na gestação. Glicemia capilar de 104 mg/dL. Qual é a conduta adequada para a glicemia?","ops":[["Suspender a insulina e manter glicemias capilares nas primeiras 24 a 48 horas.","Correta: com a saída da placenta o hPL desaparece e a resistência cai; no DMG a insulina é suspensa."],["Manter metade da dose de insulina por 6 semanas até o TOTG de reclassificação.","Errada: reduzir à metade é a orientação para DM1; no DMG suspende-se."],["Manter a dose integral até a alta, pois a resistência insulínica persiste por várias semanas.","Errada: a resistência cai em horas; manter a dose causa hipoglicemia."],["Trocar a insulina por metformina por 3 meses para prevenir a evolução para DM2.","Errada: não há indicação de fármaco no puerpério com glicemia normal; a prevenção é por estilo de vida e reclassificação."]],"conc":"Após a dequitação, o lactogênio placentário desaparece em horas. No DMG, suspende-se a insulina e mantêm-se glicemias por 24 a 48 horas; hiperglicemia persistente sugere DM prévio. No DM1, reduz-se para cerca de 50% da dose pré-gestacional.","rac":"1) DMG. 2) Placenta saiu. 3) Resistência cai. 4) Glicemia normal. 5) Suspender a insulina e monitorar.","pista":"Diagnóstico de DMG e glicemia normal no pós-parto.","mud":"Se fosse DM1, a dose seria reduzida para cerca de 50% da pré-gestacional, e não suspensa.","cmp":"DMG: suspender. DM1: reduzir a cerca de 50% da dose pré-gestacional. DM2: retomar o esquema prévio ajustado.","arm":"Manter a insulina por inércia após o parto.","regra":"Saiu a placenta, sai a insulina do DMG.","cf":"Se a mesma puérpera mantivesse jejum de 140 mg/dL no segundo dia, levantaria a suspeita de DM prévio não diagnosticado.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 12 (o que muda após a dequitação); SBD, Tratamento farmacológico, R12."},{"n":35,"sub":"Reclassificação pós-parto","eixo":"Puerpério e reclassificação","comp":"Interpretar o TOTG pós-parto com critérios de não gestante","enun":"Mulher de 33 anos teve DMG controlado com dieta. Sete semanas após o parto, amamentando, faz TOTG 75 g: jejum de 94 mg/dL e 2 horas de 168 mg/dL. Qual é a classificação e a orientação?","ops":[["Tolerância diminuída à glicose; mudança de estilo de vida e rastreamento periódico de DM2.","Correta: com critérios de não gestante, jejum abaixo de 100 e 2 h entre 140 e 199 definem tolerância diminuída."],["Diabetes gestacional persistente; reiniciar insulina e repetir o teste em 3 meses.","Errada: no pós-parto não se usam critérios gestacionais nem o termo DMG; 2 h abaixo de 200 não é DM."],["Diabetes mellitus tipo 2, porque a glicemia de 2 horas ultrapassou 153 mg/dL.","Errada: 153 é corte gestacional; para DM fora da gestação, 2 h de 200 ou mais."],["Normoglicemia, pois o jejum ficou abaixo de 100 mg/dL e a amamentação invalida a curva.","Errada: a 2 h de 168 está alterada, e a amamentação não invalida o teste."]],"conc":"A reclassificação é feita 6 a 8 semanas após o parto (aula) ou entre 4 e 12 semanas (ADA/ACOG), com TOTG 75 g e critérios de não gestante. Depois, rastreia-se por toda a vida a cada 1 a 3 anos.","rac":"1) TOTG pós-parto. 2) Critérios de não gestante. 3) Jejum 94: normal (abaixo de 100). 4) 2 h 168: entre 140 e 199. 5) Tolerância diminuída.","pista":"Uso de critérios de não gestante no puerpério.","mud":"2 h de 205 mg/dL ou jejum de 128 mg/dL mudariam para diabetes mellitus.","cmp":"Gestação: 92/180/153. Fora da gestação: jejum 100 a 125 = alterado; 2 h 140 a 199 = tolerância diminuída; DM com 126 ou 200.","arm":"Aplicar cortes gestacionais no puerpério.","regra":"Depois do parto, valem os critérios de não gestante.","cf":"A amamentação melhora a sensibilidade à insulina e se associa a menor progressão para DM2, devendo ser estimulada.","fonte":"Aula HTML Diabetes na Gestação (Aulas-GO, aula 06), seção 13 (seguimento no puerpério), slides 45 e 46 do material da disciplina; ADA, Standards of Care 2026, seção 15."}]},{"id":"M02","titulo":"CIUR (crescimento intrauterino restrito)","bloco":1,"grupo":"P","q":[{"n":1,"sub":"PIG versus CIUR pelo critério da aula","eixo":"Definições","comp":"Diferenciar PIG de CIUR pela regra operacional da aula (Zugaib)","enun":"Gestante de 30 anos, 33 semanas, datação por ultrassonografia de 8 semanas. Ultrassonografia: peso fetal estimado no percentil 7, crescendo no mesmo percentil desde 28 semanas; Doppler de artéria umbilical, cerebral média e relação cerebroplacentária normais; líquido amniótico normal. Pela regra operacional da aula (Zugaib, 2020), como classificar o feto?","ops":[["Pequeno para a idade gestacional, porque está entre P3 e P10 com Doppler normal.","Correta: pela aula, P3 a P10 com Doppler normal é PIG; só seria CIUR com Doppler alterado ou PFE abaixo de P3."],["CIUR tardio, porque todo peso fetal estimado abaixo de P10 após 32 semanas define restrição.","Errada: esse é o critério SMFM/ACOG; a aula e o Delphi exigem Doppler alterado ou P3 para chamar de CIUR."],["CIUR precoce, porque o feto já estava pequeno antes de 32 semanas de gestação.","Errada: crescer no próprio percentil com Doppler normal não preenche critério de CIUR precoce."],["Erro de datação, devendo-se recalcular a idade gestacional pela biometria atual.","Errada: a datação foi feita no primeiro trimestre, que é a mais confiável e não deve ser refeita pela biometria tardia."]],"conc":"A aula define CIUR como crescimento patologicamente inferior ao potencial genético. Na regra operacional: P3 a P10 com Doppler normal é PIG; P3 a P10 com Doppler alterado é CIUR; abaixo de P3 é CIUR independentemente do Doppler.","rac":"1) Datação confiável. 2) PFE p7: entre P3 e P10. 3) Doppler normal e LA normal. 4) Crescimento no próprio percentil. 5) PIG constitucional.","pista":"Percentil 7 estável com Doppler normal.","mud":"Se a relação cerebroplacentária ficasse abaixo de P5, o mesmo feto passaria a CIUR.","cmp":"Aula e Delphi: P3 a P10 precisa de Doppler alterado. SMFM/ACOG: abaixo de P10 já é RCF.","arm":"Rotular todo feto abaixo de P10 como CIUR sem dizer qual referência está sendo usada.","regra":"P3 a P10 com Doppler normal: PIG. Abaixo de P3: CIUR.","cf":"Pelo critério SMFM, o mesmo feto seria chamado de RCF; por isso a prova deve declarar a referência.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.1 (conceito e terminologia) e tabela 8.1, slide 15 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II) (Zugaib, 2020)."},{"n":2,"sub":"Critério isolado abaixo de P3","eixo":"Definições","comp":"Reconhecer o peso abaixo de P3 como critério isolado de restrição","enun":"Gestante de 27 anos, 36 semanas, sem comorbidades. Ultrassonografia: peso fetal estimado de 2.050 g, abaixo do percentil 3 da curva da aula; artéria umbilical e cerebral média com índices normais; líquido amniótico normal. Qual é a classificação?","ops":[["CIUR, pois o peso abaixo do P3 basta para o diagnóstico, independentemente do Doppler.","Correta: abaixo de P3 é CIUR pela aula e é critério isolado no consenso Delphi."],["PIG constitucional, porque o Doppler normal afasta a insuficiência placentária nessa idade.","Errada: abaixo de P3 a chance de doença é alta e o feto é classificado como CIUR mesmo com Doppler normal."],["Feto adequado, porque 2.050 g é peso compatível com viabilidade sem morbidade.","Errada: a classificação depende do percentil para a idade gestacional, não do peso absoluto."],["Classificação impossível sem repetir a biometria uma semana depois.","Errada: o diagnóstico já está feito; repetir em menos de 2 semanas confunde erro de medida com mudança real."]],"conc":"Quanto menor o percentil, maior a especificidade para doença. O PFE abaixo de P3 é critério suficiente de CIUR na aula e no Delphi, mesmo com Doppler normal.","rac":"1) 36 semanas. 2) PFE abaixo de P3 (a âncora da aula é cerca de 2.110 g). 3) Critério isolado. 4) CIUR, com programação de parto em torno de 37 semanas.","pista":"Peso fetal estimado abaixo do percentil 3.","mud":"Com PFE no p6 e Doppler normal, o feto seria PIG.","cmp":"Abaixo de P3: CIUR. P3 a P10: depende do Doppler.","arm":"Usar o Doppler normal para descartar CIUR em feto abaixo de P3.","regra":"Abaixo de P3 é sempre CIUR.","cf":"No CIUR por PFE abaixo de P3 isolado, a maioria dos protocolos programa o parto em torno de 37 semanas.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.1, 7.6 (Delphi) e 7.8 (âncoras da tabela de percentis), slide 15 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II); Gordijn et al., Ultrasound Obstet Gynecol 2016."},{"n":3,"sub":"Consenso Delphi no CIUR tardio","eixo":"Definições","comp":"Aplicar a regra de 2 de 3 critérios contributivos do Delphi para o CIUR tardio","enun":"Pelo consenso Delphi (Gordijn, 2016), adotado pela ISUOG, uma gestante de 35 semanas tem feto com circunferência abdominal no P8 (no P50 com 28 semanas), artéria umbilical normal e relação cerebroplacentária no P20. Como classificar?","ops":[["CIUR tardio, pois há CA abaixo de P10 e queda de mais de dois quartis.","Correta: no tardio bastam 2 de 3 critérios contributivos; CA abaixo de P10 e queda de mais de 2 quartis estão presentes."],["PIG, porque a artéria umbilical e a relação cerebroplacentária estão normais.","Errada: no Delphi tardio, o Doppler é apenas um dos três critérios; dois biométricos já bastam."],["CIUR precoce, porque a queda do crescimento começou antes de 32 semanas.","Errada: a classificação precoce ou tardia usa a idade no diagnóstico; aqui o diagnóstico é com 35 semanas."],["Sem restrição, porque só a circunferência abdominal está baixa e o PFE não foi informado.","Errada: o Delphi aceita CA ou PFE; a CA abaixo de P10 é critério válido."]],"conc":"No Delphi tardio (32 semanas ou mais), o critério isolado é CA ou PFE abaixo de P3; os contributivos exigem 2 de 3: CA ou PFE abaixo de P10, queda de mais de 2 quartis, RCP abaixo de P5 ou IP da AU acima de P95.","rac":"1) Diagnóstico com 35 semanas: tardio. 2) CA P8: abaixo de P10 (critério 1). 3) De P50 para P8: queda de mais de 2 quartis (critério 2). 4) Dois critérios. 5) CIUR tardio.","pista":"Queda de percentil de P50 para P8.","mud":"Se a CA estivesse no P8 desde 28 semanas, sem queda, e a RCP fosse normal, seria PIG.","cmp":"Delphi precoce: P3, diástole zero, ou P10 com Doppler de AUt/AU alterado. Delphi tardio: P3, ou 2 de 3 contributivos.","arm":"Exigir Doppler alterado para diagnosticar CIUR tardio.","regra":"No tardio, queda de percentil é critério.","cf":"Pelo critério da aula (slide 11), a queda acima de 2 quartis também aparece entre os critérios do CIUR tardio.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.6 (tabela do consenso Delphi e comparação com a aula), slide 11 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II); Gordijn et al., 2016; ISUOG 2020."},{"n":4,"sub":"Primeiro parâmetro a alterar e o mais preditivo","eixo":"Definições","comp":"Distinguir sensibilidade e valor preditivo dos parâmetros biométricos","enun":"Em um feto que começa a sofrer insuficiência placentária no terceiro trimestre, qual parâmetro biométrico costuma alterar primeiro, e qual tem o melhor valor preditivo para o diagnóstico de CIUR, segundo a aula?","ops":[["Primeiro altera a circunferência abdominal; o peso fetal estimado tem o melhor valor preditivo.","Correta: a CA reflete glicogênio hepático e gordura e é o mais sensível; o PFE é o mais preditivo."],["Primeiro altera o diâmetro biparietal; a circunferência cefálica tem o melhor valor preditivo.","Errada: a cabeça é poupada na restrição assimétrica e o DBP sofre influência do formato do crânio."],["Primeiro altera o comprimento do fêmur; a relação CF/CA tem o melhor valor preditivo.","Errada: o fêmur é relativamente preservado na restrição placentária; as relações são complementares."],["Primeiro altera o peso fetal estimado; a circunferência abdominal tem o melhor valor preditivo.","Errada: a ordem está invertida em relação ao que a aula ensina."]],"conc":"Na restrição placentária, o feto mobiliza glicogênio hepático e gordura subcutânea antes de reduzir o crescimento cerebral; por isso a CA cai primeiro. O PFE, que integra CC, CA e CF (Hadlock), tem o melhor valor preditivo.","rac":"1) Insuficiência placentária reduz substrato. 2) Fígado perde glicogênio. 3) CA diminui. 4) Cabeça poupada. 5) PFE consolida o diagnóstico.","pista":"Relação entre CA, fígado e gordura subcutânea.","mud":"Em displasia esquelética, o fêmur curto seria o achado dominante.","cmp":"CA: mais sensível, primeira a alterar. PFE: melhor valor preditivo.","arm":"Achar que o PFE é o primeiro a cair.","regra":"CA cai primeiro; PFE prediz melhor.","cf":"Por isso uma CA que cruza percentis para baixo já merece Doppler, mesmo com PFE ainda acima de P10.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.8 (parâmetros biométricos) e erros frequentes, slides 15 e 16 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":5,"sub":"Perfil do CIUR precoce","eixo":"CIUR precoce versus tardio","comp":"Reconhecer as características do CIUR precoce","enun":"Gestante de 29 semanas com hipertensão e proteinúria recém-diagnosticadas. Feto com PFE no P4, IP da artéria uterina acima do P95 e IP da artéria umbilical acima do P95. Qual característica é esperada nesse tipo de restrição?","ops":[["Deterioração sequencial e previsível do Doppler, com forte associação à pré-eclâmpsia.","Correta: o CIUR precoce (antes de 32 semanas) tem Doppler de AU alterado com progressão típica e associação com pré-eclâmpsia em cerca de 50%."],["Artéria umbilical geralmente normal, sendo a relação cerebroplacentária o único marcador útil.","Errada: AU frequentemente normal e RCP como marcador-chave são do CIUR tardio."],["Baixa associação com pré-eclâmpsia, sendo o grande desafio o diagnóstico e não o manejo.","Errada: no precoce o desafio é o manejo (prematuridade versus óbito) e a associação com pré-eclâmpsia é alta."],["Óbito súbito sem cascata de Doppler, como é típico das restrições diagnosticadas antes de 32 semanas.","Errada: o óbito súbito sem sequência previsível é característica do tardio."]],"conc":"O divisor é 32 semanas no diagnóstico. O precoce corresponde a 20 a 30% dos casos, associa-se a pré-eclâmpsia, tem Doppler de AU alterado e deterioração em cascata; o tardio, 70 a 80%, tem AU frequentemente normal e marcador-chave na RCP e ACM.","rac":"1) 29 semanas: precoce. 2) AUt e AU alteradas. 3) Hipertensão com proteinúria: pré-eclâmpsia. 4) Esperar progressão sequencial do Doppler.","pista":"Diagnóstico antes de 32 semanas com AU alterada e pré-eclâmpsia.","mud":"Um diagnóstico com 36 semanas e AU normal mudaria o perfil para tardio.","cmp":"Precoce: manejo difícil, AU e DV. Tardio: diagnóstico difícil, RCP e ACM.","arm":"Trocar as características dos dois tipos.","regra":"CIUR precoce é a face fetal da pré-eclâmpsia.","cf":"Nessa gestante, o momento do parto será o mais precoce entre a indicação materna e a fetal.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.6 e tabela 8.2 (precoce x tardio), slide 11 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II); RBGO 2023 (Leal et al.)."},{"n":6,"sub":"CIUR tardio com artéria umbilical normal","eixo":"CIUR precoce versus tardio","comp":"Usar a relação cerebroplacentária no CIUR tardio","enun":"Gestante de 36 semanas, feto com PFE no P6, IP da artéria umbilical normal e IP da artéria cerebral média abaixo do P5, com relação cerebroplacentária abaixo do P5. Qual é a interpretação?","ops":[["CIUR tardio com centralização, mesmo com artéria umbilical normal.","Correta: no tardio, a AU costuma ser normal e a vasodilatação cerebral (RCP abaixo de P5) revela a hipóxia."],["PIG constitucional, pois a artéria umbilical normal exclui insuficiência placentária.","Errada: a AU só se altera com cerca de 30% das vilosidades comprometidas; normal não exclui doença placentária leve."],["Doppler cerebral normal, porque o índice baixo na cerebral média indica baixa resistência fisiológica.","Errada: IP baixo na ACM é vasodilatação por hipóxia, um achado patológico."],["CIUR precoce em estágio avançado, com indicação de parto imediato pela diástole zero.","Errada: não há diástole zero, e a idade gestacional caracteriza o tardio."]],"conc":"A ACM avalia redistribuição: IP abaixo de P5 indica vasodilatação cerebral por hipóxia. A RCP (IP ACM dividido por IP AU) abaixo de P5 é mais sensível que cada vaso e é o marcador-chave do CIUR tardio.","rac":"1) 36 semanas: tardio. 2) PFE P6 com Doppler: precisa de alteração. 3) AU normal. 4) ACM e RCP abaixo de P5: centralização. 5) CIUR tardio.","pista":"RCP abaixo de P5 com AU normal.","mud":"Com ACM e RCP normais, o feto P6 seria PIG.","cmp":"AU: resistência placentária. ACM: resposta cerebral do feto. RCP: integra os dois.","arm":"Achar que AU normal afasta comprometimento fetal no tardio.","regra":"No tardio, olhe a RCP.","cf":"Esse feto tem programação de parto em torno de 37 semanas, e a indução é possível com monitorização contínua.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulos 7.6 e 7.10 (cerebral média e RCP) e erros frequentes, slides 11 e 26 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":7,"sub":"Tolerância à hipóxia no tardio","eixo":"CIUR precoce versus tardio","comp":"Antecipar o risco intraparto no CIUR tardio","enun":"Gestante de 38 semanas com CIUR tardio (RCP abaixo de P5, artéria umbilical normal) entra em trabalho de parto espontâneo. Qual é o principal cuidado esperado nesse tipo de restrição?","ops":[["Monitorização fetal contínua, pois o feto tolera mal a hipóxia e pode ter sofrimento intraparto.","Correta: o CIUR tardio tolera pouco a hipóxia; o trabalho de parto exige monitorização contínua e prontidão para cesárea."],["Ausculta intermitente, porque a artéria umbilical normal garante reserva para todo o trabalho de parto.","Errada: AU normal no tardio não garante reserva; a RCP alterada indica adaptação ao limite."],["Cesárea imediata, pois todo CIUR tardio em trabalho de parto tem contraindicação a parto vaginal.","Errada: a via vaginal é possível no estágio inicial, com monitorização contínua."],["Inibir o trabalho de parto para estender a gestação até 40 semanas e permitir ganho de peso.","Errada: com 38 semanas e restrição, não há benefício em prolongar; o feto já tinha indicação de nascer."]],"conc":"O feto do CIUR tardio tolera pouco a hipóxia e pode descompensar de forma súbita, inclusive durante as contrações. A indução é possível nos estágios iniciais, com monitorização contínua.","rac":"1) CIUR tardio. 2) Pouca reserva. 3) Contrações reduzem a perfusão. 4) Monitorização contínua e prontidão para cesárea.","pista":"Restrição tardia com reserva limitada no trabalho de parto.","mud":"Com diástole zero ou reversa, a via indicada seria cesárea.","cmp":"Precoce: tolera hipóxia por semanas. Tardio: tolera pouco; sofrimento intraparto.","arm":"Confiar na AU normal durante o trabalho de parto.","regra":"CIUR em trabalho de parto: monitorização contínua.","cf":"Na indução de um CIUR tardio, preferem-se métodos mecânicos ou doses baixas de prostaglandina.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), tabela 8.2 (hipóxia tolerada) e módulo 7.12 (via de parto), slide 36 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":8,"sub":"Principal causa de CIUR","eixo":"Etiologia","comp":"Identificar a insuficiência placentária e seu principal fator materno","enun":"Em uma prova, pergunta-se qual é a principal causa de CIUR e qual condição materna é o fator mais associado a ela. Qual alternativa responde corretamente?","ops":[["Insuficiência placentária, com as síndromes hipertensivas como principal fator materno.","Correta: a causa mais comum é placentária, e a pré-eclâmpsia é o fator materno mais associado."],["Cromossomopatias, com a idade materna avançada como principal fator materno.","Errada: as cromossomopatias causam restrição simétrica e precoce, mas não são a causa mais comum."],["Infecções congênitas, com a toxoplasmose como principal fator materno.","Errada: infecções são causa intrínseca menos frequente; o CMV é a mais associada entre elas."],["Gestação múltipla, com a reprodução assistida como principal fator materno.","Errada: a gemelaridade é fator fetal, mas não a principal causa geral de CIUR."]],"conc":"A aula agrupa as causas em fetais, maternas, placentárias e ambientais. A mais comum é a insuficiência placentária; as síndromes hipertensivas são o principal fator materno.","rac":"1) Pergunta sobre a causa mais comum. 2) Restrição assimétrica de origem placentária domina. 3) Fator materno principal: pré-eclâmpsia e hipertensão.","pista":"A expressão 'principal causa'.","mud":"Se o enunciado trouxesse CIUR precoce simétrico com malformação ou polidrâmnio, a hipótese seria cromossomopatia ou infecção.","cmp":"Mais comum: placentária. Mais típica de restrição simétrica precoce: cromossomopatia e infecção.","arm":"Confundir causa mais grave com causa mais comum.","regra":"CIUR mais comum: placenta; fator materno: hipertensão.","cf":"Uma gestante com lúpus e SAAF também tem risco de restrição placentária.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.4 (etiologia e padrão de prova), slide 6 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":9,"sub":"Restrição simétrica precoce com polidrâmnio","eixo":"Etiologia","comp":"Direcionar a investigação etiológica no CIUR simétrico","enun":"Gestante de 38 anos, 24 semanas. Feto com todas as medidas abaixo do P3, proporcionais, artéria umbilical normal, polidrâmnio e cardiopatia na ultrassonografia morfológica. Qual é a hipótese etiológica principal e o exame indicado?","ops":[["Cromossomopatia; oferecer diagnóstico invasivo com microarray cromossômico.","Correta: restrição simétrica precoce com malformação e polidrâmnio sugere causa genética; a SMFM recomenda diagnóstico invasivo com microarray."],["Insuficiência placentária; solicitar Doppler de ducto venoso semanal e programar o parto.","Errada: a restrição placentária é assimétrica, com oligoâmnio e AU alterada, o oposto deste quadro."],["Desnutrição materna; prescrever suplementação proteica e repouso relativo.","Errada: não há dado de desnutrição, e repouso e suplementos não tratam restrição."],["Pré-eclâmpsia em fase inicial; iniciar AAS 150 mg e repetir a biometria em uma semana.","Errada: o quadro sugere causa intrínseca, e o AAS não tem papel com 24 semanas para esse fim."]],"conc":"A agressão precoce atinge a fase de hiperplasia e produz restrição simétrica (tipo I), com causas intrínsecas: cromossomopatias, malformações, infecções. Polidrâmnio sugere síndrome genética.","rac":"1) 24 semanas: agressão precoce. 2) Proporcional: simétrico. 3) Malformação e polidrâmnio. 4) AU normal: não é placentária. 5) Cromossomopatia; microarray.","pista":"Restrição simétrica com malformação e polidrâmnio.","mud":"Restrição assimétrica com oligoâmnio e AU alterada apontaria insuficiência placentária.","cmp":"Simétrico: hiperplasia, intrínseco, prognóstico mais reservado. Assimétrico: hipertrofia, extrínseco, cérebro poupado.","arm":"Fazer vigilância placentária sem investigar a causa genética.","regra":"Restrição simétrica com malformação: pense em genética.","cf":"Se a amniocentese for feita, também se pesquisa CMV por PCR, a infecção mais associada à restrição.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulos 7.4, 7.5 (simétrico x assimétrico) e 7.9 (investigação genética), slides 8 a 10 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II); SMFM Consult Series 52."},{"n":10,"sub":"Restrição assimétrica e líquido amniótico","eixo":"Etiologia","comp":"Relacionar centralização, isquemia renal e oligoâmnio","enun":"Gestante de 34 semanas com hipertensão crônica. Feto com CA no P2, circunferência cefálica no P30, relação CC/CA aumentada e maior bolsão vertical de 1,8 cm. Qual mecanismo explica o líquido amniótico?","ops":[["A centralização desvia fluxo dos rins, com oligúria fetal e oligoâmnio.","Correta: na hipóxia crônica o fluxo é redistribuído para cérebro, coração e adrenais, com isquemia renal e menor diurese fetal."],["A hipertensão materna reduz diretamente a produção de líquido pelo âmnio.","Errada: o líquido do terceiro trimestre depende sobretudo da urina fetal; o mecanismo é a oligúria."],["A restrição assimétrica cursa com polidrâmnio por deglutição fetal reduzida.","Errada: o polidrâmnio sugere síndrome genética; a restrição placentária cursa com oligoâmnio."],["A ruptura de membranas é a causa mais provável, pois a restrição não altera o líquido.","Errada: a restrição placentária altera o líquido por isquemia renal; não há dado de ruptura."]],"conc":"A hipóxia leva à centralização para proteger SNC, coração e suprarrenais. O preço é isquemia renal e pulmonar: oligúria, oligoâmnio, compressão funicular e mecônio.","rac":"1) Restrição assimétrica (CC preservada, CA pequena). 2) Causa placentária (hipertensão). 3) Centralização. 4) Rim recebe menos sangue. 5) Oligoâmnio.","pista":"Assimetria com bolsão abaixo de 2 cm.","mud":"Polidrâmnio com restrição simétrica levaria a pensar em síndrome genética.","cmp":"Oligoâmnio: marcador de sofrimento crônico. CTG alterada: marcador agudo.","arm":"Desvincular o líquido amniótico da perfusão renal fetal.","regra":"Oligoâmnio no CIUR = hipóxia crônica.","cf":"Por isso, no PBF, 8 pontos com líquido alterado já indicam hipóxia crônica.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulos 7.5 e 7.10 (mecanismos defensivos), slides 17, 22 e 23 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":11,"sub":"Prognóstico simétrico versus assimétrico","eixo":"Etiologia","comp":"Comparar o prognóstico pela proporcionalidade","enun":"Sobre o prognóstico da restrição de crescimento segundo a proporcionalidade, qual afirmação está correta pela aula?","ops":[["O assimétrico tende a ter melhor prognóstico, porque a agressão é tardia e o cérebro é poupado.","Correta: o tipo II atinge a fase de hipertrofia e preserva o crescimento cerebral pela centralização."],["O simétrico tende a ter melhor prognóstico, porque o feto é proporcional e apenas constitucionalmente pequeno.","Errada: a restrição simétrica decorre de agressão precoce e sistêmica, com prognóstico mais reservado."],["Os dois têm o mesmo prognóstico, pois a proporcionalidade não tem qualquer relação com a causa.","Errada: a proporcionalidade sugere a etiologia, que influencia o prognóstico."],["O misto tem o melhor prognóstico, porque combina fases e por isso compensa melhor a hipóxia.","Errada: o misto tem prognóstico intermediário."]],"conc":"Simétrico: agressão na fase de hiperplasia, menor população celular, causas intrínsecas, prognóstico mais reservado. Assimétrico: agressão na fase de hipertrofia, cérebro poupado, causas extrínsecas, prognóstico geralmente melhor.","rac":"1) Momento da agressão define o tipo. 2) Precoce atinge a multiplicação celular de todos os órgãos. 3) Tardia atinge o tamanho celular e permite poupar o cérebro. 4) Assimétrico, melhor.","pista":"Cérebro poupado pela centralização no assimétrico.","mud":"A SMFM ressalva que a relação CC/CA não é preditor independente; a gravidade é medida pelo Doppler e pela IG.","cmp":"Simétrico: hiperplasia, intrínseco. Assimétrico: hipertrofia, placentário.","arm":"Achar que proporcional significa saudável.","regra":"Assimétrico, cérebro poupado, prognóstico melhor.","cf":"Nas provas de residência, as diretrizes modernas privilegiam a classificação precoce x tardio em vez da proporcionalidade.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.5 (tabela simétrico x assimétrico x misto e nota da SMFM), slides 8 a 10 e 18 a 20 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II)."},{"n":12,"sub":"Altura uterina abaixo do esperado","eixo":"Datação e rastreio","comp":"Conduzir a altura uterina abaixo do esperado como rastreio","enun":"Gestante de 22 anos, 32 semanas pela ultrassonografia de 10 semanas, tem altura uterina de 27 cm medida com técnica correta (decúbito dorsal, bexiga vazia, fita inelástica). Nega perdas. Qual é o próximo passo?","ops":[["Ultrassonografia com biometria fetal, acrescentando Doppler se o feto for pequeno.","Correta: diferença de 3 cm ou mais justifica ultrassonografia; a altura uterina é rastreio, não diagnóstico."],["Indicar resolução da gestação, pois a altura uterina confirma a restrição de crescimento.","Errada: a altura uterina tem sensibilidade e especificidade limitadas e não autoriza interromper a gestação."],["Recalcular a idade gestacional pela altura uterina, considerando 27 semanas.","Errada: a datação de primeiro trimestre não se refaz pela altura uterina."],["Repetir a altura uterina em 4 semanas antes de qualquer exame complementar.","Errada: a diferença de 5 cm já exige investigação ultrassonográfica."]],"conc":"Entre 24 e 38 semanas, a altura uterina em centímetros se aproxima da idade gestacional. Diferença de 3 cm ou mais (ou abaixo de P10 na curva) leva à ultrassonografia, e não à interrupção.","rac":"1) 32 semanas com AU de 27 cm. 2) Diferença de 5 cm. 3) Suspeita clínica. 4) USG com biometria. 5) Doppler se confirmado feto pequeno.","pista":"Altura uterina 5 cm abaixo da idade gestacional.","mud":"Obesidade, miomas ou polidrâmnio prejudicariam a medida e reforçariam o uso da ultrassonografia.","cmp":"Altura uterina: rastreio (sensibilidade de cerca de 58%). Ultrassonografia: diagnóstico.","arm":"Tratar a altura uterina como diagnóstico.","regra":"AU baixa: ultrassonografia, não parto.","cf":"Em gestantes de risco (hipertensão crônica, RCF prévia), indica-se biometria seriada no terceiro trimestre em vez de só a altura uterina.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.7 (diagnóstico clínico e acurácia), slides 12 e 13 do material da disciplina '7. CIUR 2026.pdf' (FCMMG, Saúde da Mulher II) (FEBRASGO, 2018); RBGO 2023."},{"n":13,"sub":"Feto pequeno sem datação confiável","eixo":"Datação e rastreio","comp":"Abordar o feto pequeno quando a idade gestacional é incerta","enun":"Gestante de 19 anos inicia o pré-natal com data da última menstruação incerta e sem ultrassonografia prévia. Pela DUM provável estaria com 33 semanas; a biometria mostra medidas compatíveis com 30 semanas, proporcionais, Doppler normal e líquido normal. Qual é a melhor conduta?","ops":[["Repetir a biometria em 2 a 3 semanas e julgar pela velocidade de crescimento.","Correta: sem datação confiável, a primeira pergunta é se a IG está certa; a velocidade de crescimento distingue erro de data de restrição."],["Diagnosticar CIUR simétrico e solicitar cariótipo fetal por amniocentese imediatamente.","Errada: sem datação confiável não se pode afirmar que o feto é pequeno para a idade gestacional."],["Programar o parto com 34 semanas, pois o atraso de 3 semanas indica insuficiência placentária grave.","Errada: com Doppler normal e IG incerta, não há base para parto pré-termo."],["Redefinir a idade gestacional para 30 semanas pela biometria atual e encerrar a investigação.","Errada: a biometria do terceiro trimestre tem erro grande para datar; não se encerra a avaliação."]],"conc":"Diante de um feto pequeno, a sequência mental é: a IG está certa? É PIG ou CIUR? Qual a causa? Quão comprometido está? Quando e como nascer? Sem datação de primeiro trimestre, repete-se a biometria em 2 a 3 semanas.","rac":"1) DUM incerta e sem USG precoce. 2) Medidas proporcionais com Doppler normal. 3) Pode ser erro de data. 4) Biometria seriada. 5) Crescimento adequado sugere data errada; crescimento lento sugere restrição.","pista":"Ausência de ultrassonografia de primeiro trimestre.","mud":"Com datação de primeiro trimestre confirmando 33 semanas, o feto seria pequeno e a investigação seguiria para classificação e causa.","cmp":"Datação confiável: comparar com a curva. Datação incerta: comparar com a própria velocidade de crescimento.","arm":"Diagnosticar restrição sem confirmar a idade gestacional.","regra":"Feto pequeno: primeiro confira a data.","cf":"Exames de crescimento devem ter intervalo mínimo de 2 semanas para não confundir erro de medida com mudança real.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.9 (propedêutica básica: revisar a datação) e módulo 7.8 (curvas e intervalo mínimo)."},{"n":14,"sub":"Intervalo entre biometrias","eixo":"Datação e rastreio","comp":"Respeitar o intervalo mínimo entre exames de crescimento","enun":"Gestante de 34 semanas com feto PIG (P6, Doppler normal) pede para repetir a ultrassonografia de crescimento a cada semana 'para ver se ele cresceu'. Segundo a aula, qual é a orientação correta para a biometria?","ops":[["Repetir a biometria a cada 2 semanas, no mínimo.","Correta: a aula indica biometria a cada 2 semanas, que é o mínimo aceito entre os protocolos."],["Repetir a biometria semanalmente, pois o feto pequeno pode parar de crescer em poucos dias.","Errada: com intervalo de uma semana, o erro de cerca de 10% do PFE supera o ganho real esperado."],["Repetir a biometria só com 39 semanas, já que o feto é PIG e não precisa de vigilância.","Errada: o PIG ainda merece vigilância do crescimento e do Doppler até o parto programado."],["Substituir a biometria por altura uterina semanal, que é mais precisa nessa fase.","Errada: a altura uterina é rastreio de baixa acurácia e não substitui a ultrassonografia."]],"conc":"O PFE tem erro em torno de 10%, maior nos extremos. Por isso o intervalo mínimo entre biometrias é de 2 semanas; a SMFM prefere 3 a 4 semanas.","rac":"1) Feto PIG em seguimento. 2) Erro de medida em torno de 10%. 3) Ganho real em 1 semana é menor que o erro. 4) Intervalo de 2 semanas (aula).","pista":"Pedido de biometria semanal.","mud":"O Doppler, ao contrário da biometria, pode ser repetido semanalmente ou com mais frequência conforme a gravidade.","cmp":"Biometria: a cada 2 semanas (aula) ou 3 a 4 (SMFM). Doppler arterial: semanal ou mais.","arm":"Repetir biometria toda semana e interpretar oscilações de medida como mudança real.","regra":"Biometria: nunca com menos de 2 semanas de intervalo.","cf":"Na prova da faculdade, a resposta para a biometria é 2 semanas; em residência, reconheça os 3 a 4 semanas da SMFM.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulos 7.8 e 7.11 (frequência dos testes) e erros frequentes, slide 31 do material da disciplina (Corrêa Jr, 2004); SMFM Consult Series 52."},{"n":15,"sub":"Diástole zero na artéria umbilical","eixo":"Doppler","comp":"Interpretar a diástole zero e o grau de comprometimento placentário","enun":"Gestante de 31 semanas com CIUR. O Doppler da artéria umbilical mostra fluxo diastólico ausente em todo o traçado; ducto venoso com IP normal. Qual é a interpretação correta?","ops":[["Obliteração de cerca de 60 a 70% da vasculatura placentária, com indicação de internação.","Correta: diástole zero corresponde a 60 a 70% de comprometimento vascular, risco de óbito em torno de 6,8% antes de 34 semanas, e indica internação."],["Achado fisiológico do terceiro trimestre, que se corrige com a hidratação materna.","Errada: a diástole na AU aumenta com a idade gestacional; diástole ausente com 31 semanas é patológica."],["Comprometimento inferior a 30% das vilosidades, sem impacto na conduta.","Errada: abaixo de 30% a AU ainda é normal; diástole zero indica comprometimento muito maior."],["Disfunção cardíaca fetal terminal, com indicação de parto imediato em qualquer idade viável.","Errada: o marcador de disfunção cardíaca terminal é o ducto venoso, que está normal."]],"conc":"A AU é o principal método de avaliação da insuficiência placentária. Diástole normal: menos de 30% de comprometimento; reduzida: 30 a 60%; zero: 60 a 70%; reversa: mais de 60 a 70%, com risco crescente de óbito.","rac":"1) AU com diástole ausente. 2) Grande comprometimento vascular placentário. 3) DV normal: ainda sem falência cardíaca. 4) Internar, vigiar com frequência, corticoide, programar parto por volta de 32 a 34 semanas.","pista":"Diástole ausente com DV normal.","mud":"Se surgisse onda a reversa no DV, o parto passaria a ser imediato a partir da viabilidade.","cmp":"Diástole zero: estágio II de Barcelona. Diástole reversa: estágio III.","arm":"Confundir o marcador placentário (AU) com o cardíaco (DV).","regra":"AU mede a placenta; DV mede o coração fetal.","cf":"Com diástole zero, a via de parto recomendada é a cesárea.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (tabela da artéria umbilical), slide 25 do material da disciplina; RBGO 2023 (Caradeux 2018)."},{"n":16,"sub":"Ducto venoso alterado","eixo":"Doppler","comp":"Reconhecer o ducto venoso como marcador de estágio final","enun":"Gestante de 28 semanas com CIUR precoce e diástole reversa na artéria umbilical. No Doppler do ducto venoso, a onda 'a' está reversa. O que esse achado indica?","ops":[["Disfunção cardíaca com acidose, estágio final da deterioração e alto risco de óbito.","Correta: onda a ausente ou reversa no DV indica falência cardíaca e comprometimento metabólico, com risco de óbito em torno de 20%."],["Adaptação fetal compensada, que permite aguardar até 34 semanas com Doppler semanal.","Errada: o DV alterado marca a fase descompensada; aguardar até 34 semanas é inaceitável."],["Aumento da resistência placentária, o mesmo significado da diástole reduzida na artéria umbilical.","Errada: o DV avalia a função cardíaca fetal, e não a resistência placentária."],["Vasodilatação cerebral protetora, sinal precoce de centralização a ser vigiado.","Errada: vasodilatação cerebral é avaliada na ACM e é um sinal mais precoce."]],"conc":"A alteração do ducto venoso segue a sequência IP acima de P95, onda a ausente e onda a reversa; é o estágio final da deterioração, com disfunção cardíaca e acidose.","rac":"1) Diástole reversa na AU: grave. 2) DV com onda a reversa. 3) Falência cardíaca fetal. 4) Parto, a partir da viabilidade, por cesárea.","pista":"Onda a reversa no ducto venoso.","mud":"Se o DV estivesse normal com diástole reversa, a programação seria em torno de 30 a 32 semanas.","cmp":"ACM baixa: centralização. AU sem diástole: placenta muito comprometida. DV alterado: coração falhando.","arm":"Considerar o DV um sinal precoce.","regra":"DV alterado é o último degrau antes do óbito.","cf":"Antes do parto, se abaixo de 32 semanas, administra-se corticoide e sulfato de magnésio, sem atrasar a resolução.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (ducto venoso e sequência de deterioração), slide 28 do material da disciplina; RBGO 2023."},{"n":17,"sub":"Doppler das artérias uterinas","eixo":"Doppler","comp":"Interpretar o que a artéria uterina avalia","enun":"Gestante de 24 semanas, primigesta, faz Doppler de artérias uterinas com IP médio acima do P95 e incisura protodiastólica bilateral. Feto com biometria no P45 e artéria umbilical normal. Qual é a interpretação?","ops":[["Placentação deficiente, com risco futuro de CIUR e pré-eclâmpsia.","Correta: a artéria uterina avalia o lado materno da placentação; não mede o estado do feto."],["Sofrimento fetal crônico, com indicação de parto antes de 28 semanas.","Errada: a artéria uterina não avalia o bem-estar fetal; o feto está adequado e a AU é normal."],["Achado normal, porque a incisura protodiastólica persiste em todas as gestações até o termo.","Errada: a persistência da incisura após 26 semanas e o IP elevado indicam placentação deficiente."],["CIUR precoce já estabelecido, pois o Doppler uterino é critério isolado de restrição.","Errada: o feto está no P45; a artéria uterina só entra como critério contributivo junto a um feto abaixo de P10."]],"conc":"A artéria uterina responde se a placentação foi adequada. IP elevado e incisura persistente indicam maior risco de CIUR e pré-eclâmpsia, mas não comprometimento fetal.","rac":"1) AUt alterada. 2) Feto adequado e AU normal. 3) Risco aumentado, sem doença fetal atual. 4) Intensificar vigilância de crescimento e pressão arterial.","pista":"Feto no P45 com AU normal.","mud":"Com feto abaixo de P10 antes de 32 semanas, a AUt alterada passaria a critério contributivo do Delphi precoce.","cmp":"AUt: lado materno, risco. AU: lado fetal, gravidade.","arm":"Indicar parto por Doppler uterino alterado.","regra":"Artéria uterina mede placentação, não o feto.","cf":"Na mesma gestante, biometria seriada e aferição de pressão arterial passam a ser prioridade.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (artéria uterina), tabela 8.3 e erros frequentes, slide 27 do material da disciplina."},{"n":18,"sub":"Limite de sensibilidade da artéria umbilical","eixo":"Doppler","comp":"Explicar por que a AU normal não exclui doença placentária","enun":"Uma interna afirma que, como o Doppler da artéria umbilical está normal, o feto de 37 semanas com PFE no P5 não pode ter insuficiência placentária. Qual informação da aula contesta essa afirmação?","ops":[["A AU só se altera quando cerca de 30% das vilosidades terciárias já estão obliteradas.","Correta: a AU normal não exclui doença placentária leve, especialmente no CIUR tardio."],["A AU perde validade após 36 semanas e deve ser substituída pela artéria uterina.","Errada: a AU continua útil; o complemento no tardio é a ACM e a RCP, não a artéria uterina."],["A AU avalia apenas o fluxo materno, não o placentário, e por isso é sempre normal no tardio.","Errada: a AU avalia a resistência da circulação fetoplacentária."],["A AU normal indica, na verdade, maturação placentária avançada e risco de óbito iminente.","Errada: não existe essa interpretação; maturidade placentária é avaliada pela classificação de Grannum."]],"conc":"Diástole normal na AU corresponde a menos de 30% de comprometimento vascular. Por isso, no CIUR tardio, a doença placentária leve se manifesta pela ACM e RCP antes da AU.","rac":"1) Feto P5 com 37 semanas. 2) AU normal. 3) AU tem limiar de 30%. 4) Avaliar ACM e RCP antes de concluir.","pista":"A afirmação de que AU normal exclui doença.","mud":"Se ACM e RCP também fossem normais e o feto crescesse no próprio percentil, a hipótese de PIG ganharia força.","cmp":"AU: sensível para doença grave. RCP: sensível para doença leve no tardio.","arm":"Usar a AU normal como prova de saúde fetal.","regra":"AU normal não exclui placenta doente.","cf":"Uma placenta grau 3 de Grannum antes de 34 a 36 semanas também é sinal de alerta para insuficiência placentária.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (leitura do 'menos de 30%') e tabela 8.4, slide 25 do material da disciplina."},{"n":19,"sub":"Cronologia da deterioração","eixo":"Doppler","comp":"Ordenar a sequência típica de deterioração do CIUR precoce","enun":"Em um CIUR precoce de origem placentária acompanhado sem intervenção, qual sequência de alterações do Doppler é a mais típica?","ops":[["IP da AU elevado, queda da ACM, diástole zero, diástole reversa e alteração do ducto venoso.","Correta: é a cascata descrita na aula para o CIUR precoce."],["Alteração do ducto venoso, diástole reversa, diástole zero e, por último, queda da ACM.","Errada: a ordem está invertida; o DV é o marcador final."],["Diástole reversa, queda da ACM, IP da AU elevado e normalização do ducto venoso.","Errada: a diástole reversa é tardia e o DV não normaliza na deterioração."],["Queda da ACM isolada e, em seguida, óbito súbito, sem alteração da AU nem do ducto.","Errada: esse padrão sem cascata é mais típico do CIUR tardio."]],"conc":"No precoce, a progressão costuma seguir: AUt alterada, IP da AU aumentado, ACM e RCP reduzidas, diástole zero, diástole reversa, DV alterado e CTG com variabilidade reduzida, até o óbito.","rac":"1) Placenta falha. 2) Resistência na AU sobe. 3) Feto centraliza (ACM). 4) Diástole some e inverte. 5) Coração falha (DV).","pista":"Ordem de placenta, cérebro, placenta grave e coração.","mud":"No tardio, a cascata geralmente não ocorre e o alerta é a RCP e a ACM.","cmp":"Intervalos medianos: IP aumentado para diástole zero, cerca de 2 semanas; diástole zero para deterioração, cerca de 5 dias; reversa para deterioração grave, cerca de 2 dias.","arm":"Colocar o DV como primeira alteração.","regra":"Placenta, cérebro, placenta grave, coração.","cf":"Conhecer os intervalos ajuda a definir a frequência do Doppler conforme o estágio.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (sequência de deterioração); RBGO 2023 (Leal et al.)."},{"n":20,"sub":"Estágio I de Barcelona","eixo":"Estágios e classificação","comp":"Classificar pelo estadiamento de Figueras e Gratacós","enun":"Pelo estadiamento de Barcelona (Figueras e Gratacós, 2014), uma gestante de 34 semanas tem feto com PFE no P2, artéria umbilical com IP acima do P95 e diástole presente, ACM normal e ducto venoso normal. Qual é o estágio e a programação do parto?","ops":[["Estágio I, com parto em torno de 37 semanas e indução possível.","Correta: PFE abaixo de P3 ou IP da AU acima de P95 com diástole presente definem o estágio I, com parto por volta de 37 semanas."],["Estágio II, com cesárea programada com 34 semanas.","Errada: o estágio II exige diástole zero na AU."],["Estágio III, com cesárea com 30 semanas.","Errada: o estágio III exige diástole reversa na AU ou IP do DV acima de P95."],["Estágio IV, com cesárea imediata a partir da viabilidade.","Errada: o estágio IV exige onda a reversa no DV, desacelerações espontâneas ou variabilidade de curto prazo baixa."]],"conc":"Barcelona: estágio I (PFE abaixo de P3, IP da AU acima de P95, ACM ou RCP abaixo de P5, AUt alterada) parto com 37 semanas; II (diástole zero) 34 semanas; III (diástole reversa ou IP do DV acima de P95) 30 semanas; IV (onda a reversa, desacelerações, variabilidade baixa) 26 semanas.","rac":"1) PFE P2 e AU com IP alto, diástole presente. 2) Sem diástole zero ou reversa. 3) DV normal. 4) Estágio I. 5) Parto com 37 semanas.","pista":"Diástole presente apesar do IP elevado.","mud":"Se a diástole ficasse ausente, o estágio seria II, com cesárea por volta de 34 semanas.","cmp":"I: 37 sem, indução possível. II: 34 sem, cesárea. III: 30 sem, cesárea. IV: 26 sem, cesárea.","arm":"Confundir IP elevado com diástole zero.","regra":"No estadiamento, o achado mais grave define o estágio.","cf":"Pela FIGO, o mesmo achado inicial teria parto entre 34 e 37 semanas; por isso o enunciado precisa declarar a referência.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), tabelas 8.5 e 9.2 (momento do parto por protocolo e estágio); Figueras F, Gratacós E, Fetal Diagn Ther 2014;36:86-98 (conferido como sinalizado na aula)."},{"n":21,"sub":"Estágio II de Barcelona","eixo":"Estágios e classificação","comp":"Conduzir o CIUR com diástole zero","enun":"Pelo estadiamento de Barcelona, gestante de 32 semanas com CIUR e diástole zero na artéria umbilical, ducto venoso normal e cardiotocografia com variabilidade normal. Qual conduta é a mais adequada?","ops":[["Internar, fazer corticoide e programar cesárea em torno de 34 semanas.","Correta: diástole zero com DV normal é estágio II, com parto por volta de 34 semanas por cesárea."],["Indução imediata do parto com prostaglandina e monitorização contínua.","Errada: com diástole zero a via é cesárea, e o parto imediato não é obrigatório com DV normal."],["Seguimento ambulatorial com Doppler quinzenal até 37 semanas.","Errada: diástole zero exige internação e vigilância frequente, e não se aguarda até 37 semanas."],["Cesárea imediata, porque a diástole zero equivale ao estágio IV.","Errada: o estágio IV exige onda a reversa no DV ou alterações graves da CTG."]],"conc":"No estágio II (diástole zero), internação, Doppler 2 a 3 vezes por semana, CTG diária, corticoide se abaixo de 34 semanas, sulfato de magnésio se abaixo de 32, e cesárea em torno de 34 semanas (SMFM 33 a 34; FIGO 32).","rac":"1) Diástole zero. 2) DV e CTG normais. 3) Estágio II. 4) Internar e preparar. 5) Cesárea com 34 semanas, salvo piora.","pista":"Diástole zero com DV normal.","mud":"Diástole reversa mudaria para estágio III, com parto em torno de 30 a 32 semanas.","cmp":"Diástole presente com IP alto: indução possível. Diástole zero ou reversa: cesárea.","arm":"Induzir parto com diástole zero.","regra":"Diástole zero ou reversa: cesárea.","cf":"Se essa gestante tivesse 31 semanas no momento do parto, receberia também sulfato de magnésio para neuroproteção.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), tabela 9.2 (vigilância e momento do parto por gravidade) e módulo 7.12 (via de parto), slide 36 do material da disciplina; SMFM Consult Series 52."},{"n":22,"sub":"Estágio IV","eixo":"Estágios e classificação","comp":"Reconhecer a indicação de parto imediato","enun":"Pelo estadiamento de Barcelona, gestante de 27 semanas, internada por CIUR com diástole reversa, evolui com onda 'a' reversa no ducto venoso e cardiotocografia com desacelerações espontâneas repetidas. Qual é a conduta?","ops":[["Parto imediato por cesárea, após corticoide e sulfato de magnésio sem atrasar a resolução.","Correta: é o estágio IV; a resolução é imediata a partir da viabilidade, por cesárea."],["Aguardar até 30 semanas com Doppler diário, pois o feto ainda é muito prematuro.","Errada: no estágio IV o risco de óbito iminente supera o da prematuridade."],["Indução do parto vaginal para evitar a morbidade materna da cesárea pré-termo.","Errada: o feto não tolera trabalho de parto nesse estágio; a via é cesárea."],["Repetir o Doppler em 48 horas para confirmar o achado antes de decidir.","Errada: com desacelerações espontâneas e onda a reversa, a demora aumenta o risco de óbito."]],"conc":"Estágio IV: onda a reversa no DV, desacelerações espontâneas repetidas ou variabilidade de curto prazo baixa. Indica parto imediato a partir da viabilidade (cerca de 26 semanas), por cesárea.","rac":"1) 27 semanas, viável. 2) DV com onda a reversa e CTG com desacelerações. 3) Estágio IV. 4) Parto imediato por cesárea. 5) Corticoide e MgSO4 se possível sem atraso.","pista":"Onda a reversa somada a desacelerações espontâneas.","mud":"Antes da viabilidade, a decisão seria compartilhada com a família e a neonatologia, considerando a periviabilidade.","cmp":"Estágio III: 30 semanas. Estágio IV: imediato a partir de cerca de 26 semanas.","arm":"Adiar o parto no estágio IV por medo da prematuridade.","regra":"DV com onda a reversa: tirar o feto.","cf":"A decisão deve envolver a neonatologia e ser registrada como decisão compartilhada com a gestante.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), tabelas 8.5 e 9.2 e módulo 7.15 (comunicação), slide 34 do material da disciplina (viabilidade); Figueras e Gratacós, 2014."},{"n":23,"sub":"Periodicidade da vigilância","eixo":"Vigilância e periodicidade","comp":"Aplicar a periodicidade de exames da aula","enun":"Gestante de 33 semanas com CIUR e IP da artéria umbilical acima do P95, diástole presente, internada em centro de referência. Segundo a tabela da aula (Corrêa Jr, 2004), qual periodicidade está correta?","ops":[["Biometria quinzenal, Doppler arterial semanal e mobilograma diário.","Correta: é a periodicidade da tabela do slide 31."],["Biometria semanal, Doppler arterial mensal e cardiotocografia só no parto.","Errada: a biometria é a cada 2 semanas e o Doppler arterial é semanal."],["Doppler venoso semanal desde o diagnóstico, mesmo com Doppler arterial normal.","Errada: o Doppler venoso é indicado quando o Doppler arterial está alterado."],["Perfil biofísico completo diário e biometria diária durante a internação.","Errada: biometria diária não tem sentido pelo erro de medida."]],"conc":"Tabela da aula: biometria a cada 2 semanas; Doppler arterial semanal; Doppler venoso se o arterial estiver alterado; CTG individualizada (1 a 7 dias); PBF modificado semanal; movimentos fetais diários. A frequência aumenta com a gravidade.","rac":"1) Feto com restrição e AU alterada. 2) Biometria a cada 2 semanas. 3) Doppler arterial semanal. 4) Doppler venoso, pois o arterial está alterado. 5) Movimentos fetais diários.","pista":"Tabela de periodicidade do slide 31.","mud":"Com diástole zero, o Doppler passaria a 2 a 3 vezes por semana e a CTG a diária (SMFM).","cmp":"Biometria: 2 semanas. Doppler arterial: semanal. Movimentos fetais: diários.","arm":"Repetir biometria com intervalo curto.","regra":"Quanto mais grave, mais frequente o Doppler, nunca a biometria.","cf":"A contagem de movimentos é feita pela própria gestante, que deve procurar o serviço se eles diminuírem.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.11 (frequência dos testes), slide 31 do material da disciplina (Corrêa Jr MD, 2004)."},{"n":24,"sub":"PBF 8 com líquido alterado","eixo":"Vigilância e periodicidade","comp":"Interpretar o PBF considerando o peso do líquido amniótico","enun":"Gestante de 35 semanas com CIUR. Perfil biofísico fetal: CTG reativa, movimentos respiratórios presentes, movimentos corporais presentes, tônus normal e maior bolsão de 1,5 cm. Pontuação de 8. Qual é a interpretação pela tabela da aula?","ops":[["Hipóxia crônica, porque o líquido alterado reflete oligúria de dias a semanas.","Correta: pela aula, PBF 8 com líquido alterado indica hipóxia crônica."],["Feto normal, com repetição do perfil em 48 horas, porque 8 pontos é resultado tranquilizador.","Errada: 8 com repetição em 48 horas vale para líquido normal."],["Hipóxia aguda, porque as variáveis biofísicas agudas estão todas presentes.","Errada: as variáveis agudas normais excluem hipóxia aguda; o líquido indica processo crônico."],["Risco iminente de óbito fetal, com indicação de parto imediato por qualquer via.","Errada: risco iminente corresponde a PBF de 4 ou menos."]],"conc":"No PBF, as variáveis agudas (CTG, respiração, movimento, tônus) somem em horas; o líquido reflete dias a semanas de perfusão renal. Por isso 8 com líquido alterado já indica hipóxia crônica.","rac":"1) Quatro variáveis agudas normais. 2) Líquido alterado (bolsão abaixo de 2 cm). 3) Pontuação 8. 4) Pela tabela: hipóxia crônica.","pista":"Oito pontos perdendo exatamente o líquido amniótico.","mud":"Se os 2 pontos perdidos fossem da respiração, com líquido normal, a conduta seria repetir em 48 horas.","cmp":"8 com líquido normal: repetir em 48 h. 8 com líquido alterado: hipóxia crônica.","arm":"Olhar só a soma e ignorar qual variável foi perdida.","regra":"No PBF, o líquido pesa mais.","cf":"Com 35 semanas, hipóxia crônica no CIUR é indicação de discutir a resolução da gestação.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (perfil biofísico e interpretação), slides 29 e 30 do material da disciplina."},{"n":25,"sub":"PBF 6 com líquido normal","eixo":"Vigilância e periodicidade","comp":"Diferenciar hipóxia aguda de crônica pelo PBF","enun":"Gestante de 36 semanas com CIUR. Perfil biofísico: cardiotocografia não reativa, movimentos respiratórios ausentes, movimentos corporais e tônus presentes, maior bolsão de 4 cm. Qual é a interpretação pela tabela da aula?","ops":[["Pontuação 6 com líquido normal, sugerindo hipóxia aguda.","Correta: perderam-se CTG e respiração (variáveis agudas), com líquido normal: 6 pontos, hipóxia aguda."],["Pontuação 6 com líquido alterado, sugerindo hipóxia crônica.","Errada: o bolsão de 4 cm é normal, e o líquido não foi pontuado como alterado."],["Pontuação 8, com repetição do exame em 48 horas.","Errada: duas variáveis estão ausentes, o que dá 6 pontos, não 8."],["Pontuação 4, com risco iminente de óbito fetal.","Errada: tônus, movimentos e líquido somam 6 pontos."]],"conc":"PBF: cada variável vale 2 pontos (tônus, movimentos corporais, movimentos respiratórios, líquido, CTG reativa). 6 com líquido normal: hipóxia aguda; 6 com líquido alterado: crônica; 4 ou menos: risco iminente de óbito.","rac":"1) Tônus 2, movimentos 2, líquido 2. 2) CTG 0, respiração 0. 3) Total 6. 4) Líquido normal. 5) Hipóxia aguda.","pista":"Perda das variáveis agudas com líquido preservado.","mud":"Se o bolsão fosse de 1,5 cm, os mesmos 6 pontos indicariam hipóxia crônica.","cmp":"Variáveis agudas: CTG, respiração, movimento, tônus. Variável crônica: líquido.","arm":"Tratar todo PBF 6 da mesma forma.","regra":"Mesmo número, significado diferente conforme o líquido.","cf":"Na hipóxia, a ordem de desaparecimento costuma ser CTG reativa e respiração primeiro, tônus por último.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.10 (perfil biofísico) e tabela 8.4, slides 29 e 30 do material da disciplina."},{"n":26,"sub":"Sulfato de magnésio para neuroproteção","eixo":"Corticoide e neuroproteção","comp":"Indicar MgSO4 para neuroproteção conforme a idade gestacional","enun":"Gestante de 30 semanas com CIUR e diástole reversa na artéria umbilical terá cesárea indicada nas próximas horas. Já recebeu a primeira dose de betametasona. Qual medida adicional é recomendada para o recém-nascido?","ops":[["Sulfato de magnésio para neuroproteção, 4 g IV em 20 a 30 min e 1 g/h até o parto.","Correta: com parto provável antes de 32 semanas, o MgSO4 reduz paralisia cerebral."],["Sildenafil oral para melhorar o fluxo uteroplacentário antes da cesárea.","Errada: a SMFM recomenda não usar sildenafil na restrição de crescimento."],["Oxigênio materno contínuo por 24 horas antes do parto para melhorar a oxigenação fetal.","Errada: o oxigênio materno não tem benefício demonstrado e não deve atrasar o parto."],["Hiper-hidratação materna com 3 litros de cristaloide para expandir o volume placentário.","Errada: a hiper-hidratação não tem benefício e pode causar edema pulmonar materno."]],"conc":"O sulfato de magnésio para neuroproteção é indicado quando o parto é provável antes de 32 semanas (SMFM/ACOG), com 4 g IV em 20 a 30 min e 1 g/h até o parto, por no máximo cerca de 24 horas.","rac":"1) 30 semanas. 2) Parto iminente. 3) Abaixo de 32 semanas: neuroproteção. 4) MgSO4. 5) Não atrasar a resolução para completar esquemas.","pista":"Parto previsto antes de 32 semanas.","mud":"Com 33 semanas, o MgSO4 para neuroproteção não seria indicado, mas o corticoide sim.","cmp":"Corticoide: abaixo de 34 semanas (padrão nacional). MgSO4 neuroproteção: abaixo de 32 semanas.","arm":"Confundir os limites de idade gestacional das duas medidas.","regra":"Abaixo de 32 semanas: magnésio. Abaixo de 34: corticoide.","cf":"A mesma dose é usada na prevenção de eclâmpsia, mas com objetivo e duração diferentes.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (preparo para o nascimento prematuro e o que não fazer); SMFM Consult Series 52."},{"n":27,"sub":"Corticoide antenatal","eixo":"Corticoide e neuroproteção","comp":"Prescrever corticoide antenatal no CIUR com parto previsto","enun":"Gestante de 33 semanas com CIUR e diástole zero será internada com programação de parto em cerca de uma semana. Nunca recebeu corticoide. Qual esquema está de acordo com a aula?","ops":[["Betametasona 12 mg IM, duas doses com 24 horas de intervalo.","Correta: o corticoide é indicado se o parto puder ocorrer antes de 34 semanas."],["Dexametasona 12 mg IM em dose única, repetida semanalmente até o parto.","Errada: o esquema de dexametasona é 6 mg IM de 12/12 h em 4 doses, e ciclos semanais não são rotina."],["Hidrocortisona 100 mg IV de 8/8 horas até o nascimento.","Errada: a hidrocortisona não é o corticoide de maturação pulmonar fetal."],["Prednisona 40 mg via oral por 5 dias antes da cesárea.","Errada: a prednisona é metabolizada pela placenta e não é usada para maturação fetal."]],"conc":"O corticoide antenatal é indicado se o parto pode ocorrer antes de 34 semanas: betametasona 12 mg IM, 2 doses com 24 h de intervalo, ou dexametasona 6 mg IM de 12/12 h em 4 doses. No pré-termo tardio, individualizar.","rac":"1) 33 semanas. 2) Parto previsto antes de 34. 3) Sem curso prévio. 4) Betametasona 12 mg, 2 doses.","pista":"Parto previsto antes de 34 semanas.","mud":"No pré-termo tardio, a decisão é individualizada, lembrando que a hipoglicemia neonatal já é mais provável no CIUR.","cmp":"Betametasona: 12 mg, 2 doses, 24 h. Dexametasona: 6 mg, 4 doses, 12/12 h.","arm":"Usar corticoides que não atravessam a placenta em forma ativa.","regra":"Parto antes de 34 semanas: corticoide.","cf":"Se a gestante fosse diabética em insulina, a dose deveria ser aumentada por até 72 horas após o corticoide.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (corticoide antenatal) e limitações declaradas na seção de fontes."},{"n":28,"sub":"Momento do parto no PIG","eixo":"Momento e via do parto","comp":"Programar o parto do feto PIG","enun":"Gestante de 36 semanas com feto PIG (PFE no P7, Doppler normal, líquido normal), crescendo no próprio percentil. Qual é a programação do parto pela síntese da aula?","ops":[["Parto entre 38 e 39 semanas, preferencialmente por via vaginal.","Correta: o PIG com Doppler normal vai a 38 a 39 semanas, com via vaginal."],["Parto imediato com 36 semanas, porque todo feto abaixo do P10 deve nascer no diagnóstico.","Errada: não se interrompe antes do termo apenas por PFE abaixo de P10 com Doppler e vitalidade normais."],["Cesárea com 37 semanas, porque o feto pequeno não tolera o trabalho de parto.","Errada: o PIG com Doppler normal tolera o trabalho de parto; a via é vaginal."],["Aguardar até 42 semanas, porque o PIG tem risco perinatal igual ao do feto adequado.","Errada: o PIG ainda merece programação até 39 semanas, sem ultrapassar o termo completo."]],"conc":"Resumo didático entre os protocolos: PIG, 38 a 39 semanas (FIGO 37 a 39); PFE abaixo de P3, cerca de 37; IP da AU ou RCP alterados, cerca de 37; diástole zero, 32 a 34; diástole reversa, 30 a 32; DV alterado, imediato a partir da viabilidade.","rac":"1) P7 com Doppler normal. 2) PIG. 3) Sem indicação de antecipar. 4) 38 a 39 semanas. 5) Via vaginal.","pista":"Feto P3 a P10 com Doppler normal.","mud":"PFE abaixo de P3 ou RCP abaixo de P5 levaria a programar por volta de 37 semanas.","cmp":"PIG: 38 a 39 semanas. CIUR estágio I: 37 semanas.","arm":"Interromper no diagnóstico.","regra":"PIG vai a 38 a 39 semanas.","cf":"O estudo DIGITAT mostrou que induzir a partir de 36 semanas no feto pequeno a termo não piora os desfechos.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (resumo didático e o que não fazer), tabela 8.5 e módulo 7.14 (DIGITAT)."},{"n":29,"sub":"Via de parto com diástole zero","eixo":"Momento e via do parto","comp":"Escolher a via de parto conforme o Doppler","enun":"Gestante de 34 semanas, primigesta, com CIUR, diástole zero na artéria umbilical e ducto venoso normal, completou o corticoide. Colo com Bishop 8. A equipe discute a via de parto. Qual é a recomendação?","ops":[["Cesárea, pela baixa reserva de oxigênio fetal frente às contrações.","Correta: com diástole zero ou reversa, o consenso indica cesárea, independentemente do colo favorável."],["Indução com ocitocina, porque o colo favorável garante parto rápido e seguro.","Errada: o colo favorável não compensa a baixa reserva fetal; a via recomendada é cesárea."],["Fórceps eletivo no período expulsivo para abreviar a exposição às contrações.","Errada: o problema é a tolerância ao trabalho de parto como um todo."],["Parto vaginal espontâneo, com cesárea apenas se surgir desaceleração tardia.","Errada: aguardar a desaceleração expõe um feto sem reserva a acidose."]],"conc":"A cesárea é indicada mais liberalmente no CIUR: diástole zero ou reversa, DV alterado, CTG ou PBF alterados ou indicação materna. Nos demais, indução com monitorização contínua.","rac":"1) Diástole zero. 2) Feto com pouca reserva. 3) Contrações reduzem a perfusão. 4) Cesárea.","pista":"Diástole ausente na artéria umbilical.","mud":"Com diástole presente e só IP elevado, a indução com monitorização contínua seria aceitável.","cmp":"Estágio I: indução possível. Estágios II a IV: cesárea.","arm":"Escolher a via pelo colo e não pela reserva fetal.","regra":"Sem diástole, sem trabalho de parto.","cf":"No CIUR estágio I induzido, preferem-se métodos mecânicos ou doses baixas de prostaglandina, com prontidão para cesárea.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (via de parto) e erros frequentes, slide 36 do material da disciplina."},{"n":30,"sub":"Diástole reversa e idade gestacional","eixo":"Momento e via do parto","comp":"Programar o parto na diástole reversa","enun":"Pelo estadiamento de Barcelona, gestante de 29 semanas internada por CIUR apresenta diástole reversa na artéria umbilical, com IP do ducto venoso normal e CTG com variabilidade normal. Já recebeu corticoide. Qual é o momento previsto para o parto?","ops":[["Em torno de 30 semanas, por cesárea, com vigilância diária até lá.","Correta: diástole reversa é estágio III, com parto em torno de 30 semanas (SMFM 30 a 32), por cesárea."],["Com 34 semanas, por indução, mantendo Doppler semanal.","Errada: 34 semanas é o alvo do estágio II, e a via no estágio III é cesárea."],["Com 37 semanas, como no estágio I, se a CTG continuar normal.","Errada: diástole reversa tem risco de óbito em torno de 19%; não se aguarda até o termo."],["Imediatamente, mesmo sem nova alteração, porque a diástole reversa equivale ao estágio IV.","Errada: o estágio IV exige alteração do DV com onda a reversa ou CTG grave."]],"conc":"No estágio III (diástole reversa ou IP do DV acima de P95), o paciente fica internado com Doppler diário e CTG 1 a 2 vezes por dia, e o parto ocorre por volta de 30 a 32 semanas, por cesárea.","rac":"1) 29 semanas. 2) Diástole reversa. 3) DV e CTG normais. 4) Estágio III. 5) Parto em torno de 30 semanas, cesárea, com MgSO4.","pista":"Diástole reversa com DV ainda normal.","mud":"Se a onda a do DV se tornasse reversa, o parto seria imediato.","cmp":"Diástole zero: 32 a 34 semanas. Diástole reversa: 30 a 32 semanas.","arm":"Tratar a diástole reversa como a zero.","regra":"Reversa: internado, diário, cerca de 30 semanas, cesárea.","cf":"Como o parto será antes de 32 semanas, o sulfato de magnésio para neuroproteção também está indicado.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), tabelas 8.5 e 9.2; Figueras e Gratacós, 2014; SMFM Consult Series 52."},{"n":31,"sub":"Indicação materna","eixo":"Momento e via do parto","comp":"Priorizar a indicação materna sobre o estágio fetal","enun":"Gestante de 31 semanas com CIUR estágio I (IP da artéria umbilical acima do P95, diástole presente) evolui com plaquetas de 72.000/mm³, TGO de 210 U/L e LDH de 840 U/L, PA 162 x 108 mmHg. Qual é a conduta?","ops":[["Estabilizar a mãe e resolver a gestação, independentemente do estágio fetal.","Correta: síndrome HELLP é indicação materna de parto, que se sobrepõe à programação fetal."],["Manter a programação de parto com 37 semanas, porque o feto ainda está no estágio I.","Errada: o estágio fetal não define o parto quando há indicação materna grave."],["Programar o parto para 34 semanas, após completar o corticoide e aguardar o estágio II.","Errada: a HELLP exige resolução após estabilização, não espera por critério fetal."],["Iniciar sildenafil para melhorar o fluxo placentário e adiar o parto.","Errada: não há indicação de sildenafil, e adiar o parto agrava o risco materno."]],"conc":"A indicação materna (pré-eclâmpsia com sinais de gravidade, HELLP, eclâmpsia, descolamento) antecipa o parto em qualquer estágio do CIUR. O momento é o mais precoce entre a indicação materna e a fetal, com estabilização materna primeiro.","rac":"1) Plaquetopenia, transaminases e LDH elevados com hipertensão: HELLP. 2) Indicação materna. 3) Estabilizar (anti-hipertensivo, MgSO4). 4) Resolver a gestação.","pista":"Laboratório de HELLP.","mud":"Sem a complicação materna, o parto seria programado por volta de 37 semanas.","cmp":"Indicação fetal: segue o estágio. Indicação materna: prevalece em qualquer estágio.","arm":"Olhar só o Doppler fetal e esquecer a mãe.","regra":"Mãe grave: estabilizar e resolver.","cf":"Com 31 semanas, a resolução virá acompanhada de sulfato de magnésio, que serve à mãe e à neuroproteção.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (qualquer IG viável: indicação materna), módulo 7.14 (pré-eclâmpsia associada) e regra de segurança da tabela 9.2."},{"n":32,"sub":"AAS na prevenção","eixo":"Prevenção","comp":"Indicar AAS em baixa dose para prevenção em gestantes de risco","enun":"Gestante de 11 semanas teve pré-eclâmpsia com CIUR na gestação anterior. Segundo o padrão do Ministério da Saúde e da FEBRASGO citado na aula, qual é a profilaxia indicada?","ops":[["AAS 100 mg à noite, iniciado entre 12 e 16 semanas e mantido até 36 semanas.","Correta: é o padrão nacional citado na aula; FIGO e ISUOG favorecem 150 mg."],["Heparina de baixo peso molecular profilática desde já até o parto.","Errada: a heparina se reserva à SAAF obstétrica com indicação própria, não à prevenção de RCF isolada."],["Sildenafil 25 mg três vezes ao dia a partir de 20 semanas.","Errada: o sildenafil não é recomendado na restrição de crescimento."],["AAS 500 mg ao dia a partir de 28 semanas, até o parto.","Errada: a dose é baixa e o início é precoce (12 a 16 semanas), com suspensão em 36 semanas."]],"conc":"O AAS em baixa dose, iniciado entre 12 e 16 semanas à noite e mantido até 36 semanas, reduz a RCF associada à pré-eclâmpsia em gestantes de alto risco. MS/FEBRASGO usam 100 mg (100 a 150); FIGO/ISUOG favorecem 150 mg.","rac":"1) Pré-eclâmpsia e CIUR prévios: alto risco. 2) 11 semanas: dentro da janela de início. 3) AAS em baixa dose à noite. 4) Até 36 semanas.","pista":"História de pré-eclâmpsia com CIUR na gestação anterior.","mud":"Se a pergunta adotasse a FIGO ou a ISUOG como referência, a dose favorecida seria 150 mg.","cmp":"MS/FEBRASGO: 100 mg. FIGO/ISUOG: 150 mg. Janela: 12 a 16 semanas.","arm":"Iniciar o AAS tardiamente ou em dose analgésica.","regra":"AAS de baixa dose, cedo e à noite.","cf":"Em população com baixa ingestão de cálcio, a suplementação de cálcio também integra a prevenção de pré-eclâmpsia.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.13 (prevenção, divergência de dose) e módulo 7.16 (gestação seguinte)."},{"n":33,"sub":"Intervenções sem benefício","eixo":"Prevenção","comp":"Evitar condutas sem benefício na restrição de crescimento","enun":"Gestante de 30 semanas com CIUR estágio I recebe de um colega a prescrição de repouso absoluto, suplemento proteico e sildenafil 'para o bebê crescer'. Qual é a avaliação correta dessa prescrição?","ops":[["Inadequada; a SMFM recomenda contra repouso e sildenafil, e suplementos não têm benefício.","Correta: nenhuma dessas medidas melhora o crescimento ou o prognóstico fetal."],["Adequada, pois o repouso aumenta o fluxo uteroplacentário e evita a progressão do estágio.","Errada: o repouso não tem benefício demonstrado e aumenta o risco tromboembólico materno."],["Parcialmente adequada; o sildenafil é recomendado, mas o repouso deve ser apenas relativo.","Errada: o sildenafil tem recomendação contrária (GRADE 1B)."],["Adequada apenas se associada a oxigênio materno contínuo e hiper-hidratação venosa.","Errada: oxigênio e hiper-hidratação também não têm benefício."]],"conc":"A aula adverte que a maioria das intervenções clínicas não melhora o prognóstico perinatal: vigia-se para escolher o momento certo do parto. Repouso, sildenafil, suplementos, oxigênio materno e hiper-hidratação não são recomendados.","rac":"1) CIUR estágio I. 2) Não há tratamento in utero eficaz. 3) O manejo é vigilância e parto oportuno. 4) A prescrição não tem base.","pista":"Tentativa de 'tratar' o crescimento fetal.","mud":"Se a gestante fosse tabagista, cessar o tabagismo seria medida útil.","cmp":"Útil: vigilância, corticoide, MgSO4, parto oportuno, AAS antes de 16 semanas em risco. Inútil: repouso, sildenafil, suplementos.","arm":"Acreditar que se trata o CIUR fazendo o feto crescer.","regra":"No CIUR, vigiar e escolher a hora de tirar o feto.","cf":"A comunicação deve explicar que o seguimento serve para escolher o melhor momento do parto, sem culpar a gestante.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.12 (o que não fazer) e módulo 7.10, slide 21 do material da disciplina; SMFM Consult Series 52."},{"n":34,"sub":"Complicações neonatais precoces","eixo":"Complicações","comp":"Relacionar as complicações neonatais à fisiopatologia da restrição","enun":"Recém-nascido de 36 semanas com CIUR assimétrico, peso de 1.780 g, apresenta nas primeiras horas glicemia de 32 mg/dL, temperatura de 35,6 °C e hematócrito de 69%. Qual associação entre achado e mecanismo está correta?","ops":[["Policitemia pelo estímulo da eritropoetina na hipóxia crônica fetal.","Correta: a hipóxia crônica estimula a eritropoetina, causando policitemia e hiperviscosidade."],["Hipoglicemia por hiperinsulinismo fetal, como no filho de mãe diabética.","Errada: no CIUR a hipoglicemia decorre de pouco glicogênio hepático, não de hiperinsulinismo."],["Hipotermia por excesso de gordura marrom consumida no parto.","Errada: a hipotermia ocorre por pouca gordura marrom e subcutânea."],["Policitemia pela transfusão de sangue materno no clampeamento tardio.","Errada: o mecanismo principal é a eritropoetina elevada pela hipóxia crônica."]],"conc":"As complicações precoces se explicam pela fisiopatologia: hipoglicemia (pouco glicogênio), hipotermia (pouca gordura marrom), policitemia (eritropoetina pela hipóxia crônica), enterocolite (isquemia mesentérica da centralização).","rac":"1) Hematócrito de 69%: policitemia. 2) Hipóxia crônica in utero. 3) Mais eritropoetina. 4) Mais hemácias.","pista":"Hematócrito acima de 65% em RN restrito.","mud":"Num filho de mãe diabética, a hipoglicemia teria como mecanismo o hiperinsulinismo.","cmp":"Hipoglicemia no CIUR: falta de reserva. No filho de diabética: excesso de insulina.","arm":"Transportar o mecanismo do filho de diabética para o CIUR.","regra":"No CIUR, faltam reservas e sobra eritropoetina.","cf":"A centralização também explica a maior incidência de enterocolite necrosante nesses recém-nascidos.","fonte":"Aula HTML CIUR (Aulas-GO, aula 07), módulo 7.3 (complicações precoces e inferência didática), slide 5 do material da disciplina."},{"n":35,"sub":"Repercussões tardias e seguimento","eixo":"Complicações","comp":"Orientar riscos de longo prazo para a criança e a mãe","enun":"Puérpera de 30 anos teve parto com 34 semanas por CIUR placentário e pré-eclâmpsia. Pergunta quais são as implicações futuras para o filho e para ela. Qual orientação está de acordo com a aula?","ops":[["Maior risco de síndrome metabólica e DM2 na criança e de doença cardiovascular na mulher.","Correta: a hipótese DOHaD explica riscos tardios na criança, e a mulher com RCF placentária ou pré-eclâmpsia tem maior risco cardiovascular futuro."],["Nenhum risco para a criança após recuperar o peso no primeiro ano de vida.","Errada: a aula lista riscos de médio e longo prazo, mesmo com recuperação ponderal."],["Risco futuro apenas para a criança, já que a doença era exclusivamente placentária.","Errada: a mulher também tem maior risco cardiovascular futuro e deve ser orientada."],["Contraindicação a nova gestação, pela recorrência obrigatória do CIUR.","Errada: não há contraindicação; na próxima gestação, discutem-se AAS precoce e vigilância do crescimento."]],"conc":"As complicações tardias apoiam a hipótese das origens desenvolvimentistas da saúde e da doença (DOHaD): hipertensão, DM2, dislipidemia e obesidade. A mulher com RCF placentária e/ou pré-eclâmpsia tem maior risco cardiovascular futuro.","rac":"1) Criança programada para escassez reage mal à
