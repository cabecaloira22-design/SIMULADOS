ta-se estrogênio."],["Trocar o nifedipino por losartana, preferida na amamentação.","Errada: BRA deve ser evitado na amamentação; IECA é que fica liberado no puerpério."]],"conc":"Puerpério (RBEHG 2025): PA a cada 4 horas; meta abaixo de 140 x 90; reduzir se abaixo de 110 x 70; IECA liberados; evitar BRA e clonidina na amamentação; MgSO4 por 24 horas; tromboprofilaxia; contracepção sem estrogênio se hipertensa; avaliação entre 7 e 10 dias e consulta de 6 a 8 semanas. A PE aumenta o risco cardiovascular por toda a vida.","rac":"1) PA acima da meta. 2) Ajustar fármaco compatível com amamentação. 3) Reavaliar precocemente. 4) Orientar risco futuro.","pista":"Pergunta se a doença acabou com o parto.","mud":"Se a PA ficasse abaixo de 110 x 70, a medicação seria reduzida ou retirada.","cmp":"Na gestação: IECA proibido. No puerpério: IECA liberado.","arm":"Dar alta sem seguimento por achar que o parto cura a doença.","regra":"Pré-eclâmpsia é evento cardiovascular para a vida toda.","cf":"A amamentação associa-se a redução do risco cardiovascular materno futuro.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulos 7.11 (riscos de longo prazo) e 7.13 (puerpério e seguimento), slides 10 e 13 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."}]},{"id":"M10","titulo":"SOMP (síndrome dos ovários policísticos)","bloco":2,"grupo":"C","q":[{"n":1,"sub":"Diagnóstico em adulta sem ultrassom","eixo":"Critérios diagnósticos","comp":"Aplicar os critérios da diretriz internacional de 2023","enun":"Pela diretriz internacional de 2023, mulher de 26 anos, menarca aos 12, tem ciclos de 45 a 70 dias desde a adolescência e hirsutismo com Ferriman-Gallwey modificado de 12. TSH, prolactina e 17-OH-progesterona normais. Qual é a conduta diagnóstica?","ops":[["Diagnosticar SOMP sem ultrassonografia, porque já há disfunção ovulatória e hiperandrogenismo clínico.","Correta: com ciclos irregulares e hiperandrogenismo, o ultrassom e o HAM são dispensáveis."],["Solicitar ultrassonografia transvaginal obrigatória para confirmar ovários policísticos.","Errada: dois critérios já estão presentes; o ultrassom é desnecessário para o diagnóstico."],["Dosar HAM e fazer ultrassonografia, exigindo ambos alterados para confirmar.","Errada: nunca se usam os dois, e nenhum é necessário aqui."],["Dosar insulina e calcular o HOMA-IR, que confirma a doença se alterado.","Errada: índices de resistência insulínica não são critério e não são recomendados de rotina."]],"conc":"Adulta: 2 de 3 critérios (hiperandrogenismo clínico ou bioquímico; disfunção ovulatória; ovários policísticos ao ultrassom ou HAM elevado), após exclusão de outras causas. Com ciclos irregulares e hiperandrogenismo, ultrassom e HAM são dispensáveis.","rac":"1) Mais de 8 anos pós-menarca: critérios de adulta. 2) Ciclos acima de 35 dias. 3) Hirsutismo. 4) Exclusões normais. 5) SOMP, sem ultrassom.","pista":"Dois critérios clínicos já presentes.","mud":"Se ela tivesse só ciclos irregulares, sem hiperandrogenismo, seria necessário ultrassom ou HAM.","cmp":"Diretriz 2023: ultrassom dispensável com 2 critérios clínicos. Prática brasileira tradicional: pedir ultrassom em quase toda suspeita.","arm":"Exigir ultrassom em todos os casos.","regra":"Ciclo irregular com hiperandrogenismo: já é SOMP, após excluir outras causas.","cf":"Ferriman-Gallwey modificado de 4 a 6 ou mais, conforme a etnia, define hirsutismo.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 3.1 (critérios diagnósticos), módulo 3.2C (padrão de prova) e módulo 2.3 (Ferriman-Gallwey); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":2,"sub":"Adolescente no primeiro ano pós-menarca","eixo":"Critérios diagnósticos","comp":"Evitar o sobrediagnóstico na adolescência","enun":"Adolescente de 13 anos, menarca há 10 meses, com ciclos irregulares (intervalos de 40 a 80 dias) e acne leve. Ultrassonografia pélvica feita em outro serviço descreve 'ovários multifoliculares'. Sem hirsutismo. Qual é a conduta?","ops":[["Não diagnosticar: irregularidade no 1º ano é fisiológica e o ultrassom não vale.","Correta: no primeiro ano pós-menarca não se diagnostica irregularidade, e ovários multifoliculares são comuns nessa fase."],["Diagnosticar SOMP pelos ciclos irregulares associados aos ovários multifoliculares.","Errada: na adolescência, o ultrassom não é critério e a irregularidade do primeiro ano é esperada."],["Iniciar metformina para evitar a progressão para diabetes.","Errada: não há diagnóstico nem indicação metabólica."],["Dosar HAM para confirmar a doença antes de completar 2 anos de menarca.","Errada: o HAM não é usado na adolescência."]],"conc":"Adolescente (até 8 anos pós-menarca): exige hiperandrogenismo e disfunção ovulatória; ultrassom e HAM não são recomendados. Ciclos: 1º ano pós-menarca, irregularidade normal; de 1 a 3 anos, abaixo de 21 ou acima de 45 dias; após 3 anos, abaixo de 21 ou acima de 35 dias; qualquer ciclo acima de 90 dias após o 1º ano conta. Quem não preenche pode ser 'em risco', com reavaliação.","rac":"1) Menarca há menos de 1 ano. 2) Irregularidade esperada. 3) Acne leve não é hiperandrogenismo relevante. 4) Ultrassom não vale. 5) Não diagnosticar.","pista":"Menos de 1 ano de menarca.","mud":"Três anos após a menarca, com hirsutismo e ciclos acima de 35 dias, o diagnóstico seria possível sem ultrassom.","cmp":"Adulta: 2 de 3. Adolescente: hiperandrogenismo e disfunção ovulatória obrigatórios.","arm":"Rotular SOMP em adolescente por ultrassom.","regra":"Adolescente: sem ultrassom e sem HAM para diagnosticar.","cf":"O sobrediagnóstico cria rótulo, ansiedade e medicalização; a categoria 'em risco' com reavaliação é a saída.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulos 3.1 (definição operacional de ciclo irregular) e 4.2 (a adolescente); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":3,"sub":"HAM como critério","eixo":"Critérios diagnósticos","comp":"Usar corretamente o HAM no diagnóstico","enun":"Mulher de 28 anos com ciclos de 50 a 90 dias, sem hirsutismo, acne ou alopecia, com testosterona total e livre normais por LC-MS/MS. Exclusões normais. Não aceita ultrassonografia transvaginal. Pela diretriz de 2023, como avaliar o terceiro critério?","ops":[["Dosar HAM, que pode substituir o ultrassom em adultas, sem usar os dois exames.","Correta: o HAM é alternativa ao ultrassom para definir morfologia policística em adultas."],["Fechar o diagnóstico de SOMP só pela disfunção ovulatória.","Errada: é preciso um segundo critério; a disfunção ovulatória isolada não basta."],["Dosar HAM e, se alterado, repetir a ultrassonografia transvaginal obrigatoriamente.","Errada: usa-se um ou outro, nunca os dois, para limitar o sobrediagnóstico."],["Dispensar o terceiro critério, porque basta excluir tireoide e prolactina.","Errada: a exclusão de outras causas não substitui o segundo critério."]],"conc":"HAM (2023): pode definir morfologia ovariana policística em adultas como alternativa ao ultrassom; nunca os dois; nunca como teste isolado da doença; nunca em adolescentes. Confundidores: idade, IMC alto (reduz), uso de AHC (suprime), variação no ciclo.","rac":"1) Disfunção ovulatória presente. 2) Sem hiperandrogenismo. 3) Falta um critério. 4) Recusa o transvaginal. 5) HAM como alternativa.","pista":"Recusa do ultrassom transvaginal em adulta com um critério.","mud":"Numa adolescente, o HAM não seria usado.","cmp":"Ultrassom: FNPO de 20 ou mais. HAM: ponto de corte do laboratório e do ensaio.","arm":"Usar HAM isolado para diagnosticar ou somar HAM e ultrassom.","regra":"HAM ou ultrassom, nunca os dois.","cf":"Se ela usar anticoncepcional, o HAM estará suprimido e perde valor.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 3.2D (HAM, a novidade de 2023) e 4.5 (controvérsias de ponto de corte); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":4,"sub":"Contagem folicular","eixo":"Critérios diagnósticos","comp":"Aplicar o critério ultrassonográfico conforme a referência","enun":"Pela diretriz internacional de 2023, com aparelho transvaginal moderno, qual achado define morfologia ovariana policística em adulta?","ops":[["20 ou mais folículos em pelo menos um ovário (FNPO).","Correta: FNPO de 20 ou mais é o marcador mais eficaz em adultas."],["12 ou mais folículos de 2 a 9 mm em cada ovário.","Errada: esse é o critério de Roterdã 2003 usado no PCDT/MS 2019; a diretriz de 2023 elevou o limiar."],["Cistos ovarianos maiores que 3 cm bilaterais.","Errada: a SOMP não cursa com cistos patológicos; o achado são pequenos folículos antrais."],["Espessura endometrial acima de 10 mm.","Errada: o endométrio não define morfologia ovariana."]],"conc":"Morfologia policística (2023): FNPO de 20 ou mais em pelo menos um ovário; se tecnologia antiga, volume de 10 mL ou mais ou FNPS de 10 ou mais. Não contar corpo lúteo, cistos ou folículo dominante. PCDT/MS 2019 (Roterdã 2003): 12 ou mais folículos e/ou volume de 10 mL ou mais.","rac":"1) Referência: diretriz 2023. 2) Aparelho moderno. 3) FNPO de 20 ou mais.","pista":"Referência à diretriz de 2023 com aparelho moderno.","mud":"Se o enunciado citasse o PCDT do Ministério da Saúde, o corte seria de 12 folículos.","cmp":"Roterdã 2003: 12. Diretriz 2023: 20.","arm":"Usar o corte antigo sem declarar a referência.","regra":"Em 2023, a contagem subiu para 20.","cf":"O limiar de 12 gerava sobrediagnóstico com os aparelhos de alta resolução.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulos 3.2C (morfologia ovariana) e 4.1 (divergência PCDT 2019 x diretriz 2023); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023); Ministério da Saúde, PCDT da SOP, Portaria Conjunta nº 6/2019."},{"n":5,"sub":"Exames de exclusão","eixo":"Diagnósticos diferenciais","comp":"Solicitar os exames de exclusão obrigatórios","enun":"Mulher de 24 anos com ciclos irregulares e hirsutismo moderado de evolução lenta desde a adolescência, sem sinais de virilização ou de Cushing. Quais exames de exclusão são obrigatórios antes de firmar o diagnóstico de SOMP?","ops":[["TSH, prolactina e 17-OH-progesterona.","Correta: excluem doença tireoidiana, hiperprolactinemia e hiperplasia adrenal congênita não clássica."],["Insulina de jejum, HOMA-IR e relação LH/FSH.","Errada: não são critérios nem exames de exclusão recomendados."],["Cortisol livre urinário, ressonância de sela túrcica e cariótipo.","Errada: são investigações dirigidas, sem indicação na ausência de sinais."],["CA-125, ultrassonografia de abdome e densitometria.","Errada: não fazem parte da exclusão da SOMP."]],"conc":"Exclusão obrigatória: TSH, prolactina e 17-OH-progesterona; FSH e LH se amenorreia; Cushing ou tumor androgênico quando clinicamente indicado. Não pedir de rotina: insulina, HOMA-IR, relação LH/FSH.","rac":"1) Quadro compatível. 2) SOMP é diagnóstico de exclusão. 3) Tireoide, prolactina e HAC não clássica.","pista":"Necessidade de excluir antes de diagnosticar.","mud":"Com amenorreia, acrescentar-se-iam FSH e LH.","cmp":"Exclusão: TSH, PRL, 17-OHP. Não pedir: HOMA-IR, LH/FSH.","arm":"Usar a relação LH/FSH como critério.","regra":"SOMP só depois de excluir tireoide, prolactina e HAC.","cf":"Em usuária de anticoncepcional, a dosagem de androgênios não é confiável.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulos 3.2A (exclusão obrigatória) e 'o que não pedir de rotina'; International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":6,"sub":"Virilização rápida","eixo":"Diagnósticos diferenciais","comp":"Reconhecer sinais de alarme de tumor androgênico","enun":"Mulher de 31 anos, ciclos regulares até 5 meses atrás, evolui com amenorreia, hirsutismo intenso de surgimento rápido, engrossamento da voz, clitoromegalia e calvície frontal. Qual é a principal hipótese?","ops":[["Tumor produtor de androgênio, ovariano ou suprarrenal.","Correta: virilização e progressão rápida são incompatíveis com SOMP e apontam tumor."],["SOMP de fenótipo clássico, pela combinação de amenorreia e hirsutismo.","Errada: a SOMP tem evolução lenta e não cursa com virilização franca."],["Hiperprolactinemia, pela amenorreia secundária.","Errada: a hiperprolactinemia não causa virilização."],["Hipotireoidismo, pela queda de cabelo e irregularidade menstrual.","Errada: não explica clitoromegalia e voz grave."]],"conc":"Sinais de alarme: virilização (clitoromegalia, voz grossa, calvície masculina, aumento de massa muscular), início abrupto ou progressão rápida do hiperandrogenismo, androgênios muito elevados. A velocidade é o dado mais crítico.","rac":"1) Ciclos regulares antes. 2) Instalação em meses. 3) Virilização. 4) Tumor androgênico.","pista":"Velocidade de instalação com virilização.","mud":"Hirsutismo leve desde a adolescência, sem virilização, sugeriria SOMP.","cmp":"SOMP: lenta, sem virilização. Tumor: rápida, com virilização.","arm":"Valorizar o grau de hirsutismo e não a velocidade.","regra":"Rápido e virilizante: tumor até prova em contrário.","cf":"Na pós-menopausa, hiperandrogenismo novo e grave leva a pensar em tumor ou hipertecose ovariana.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 2.2 (sinais de alarme) e tabela 2 (diagnóstico diferencial)."},{"n":7,"sub":"Hiperplasia adrenal congênita não clássica","eixo":"Diagnósticos diferenciais","comp":"Diferenciar SOMP de HAC não clássica","enun":"Mulher de 22 anos com hirsutismo e ciclos irregulares desde a menarca, quadro indistinguível de SOMP. A 17-OH-progesterona matinal na fase folicular está elevada. Qual é o próximo passo?","ops":[["Teste de estímulo com ACTH para confirmar hiperplasia adrenal congênita não clássica.","Correta: a 17-OHP rastreia, e o teste com ACTH confirma a deficiência de 21-hidroxilase."],["Confirmar SOMP e iniciar anticoncepcional, porque o fenótipo é típico.","Errada: SOMP exige exclusão da HAC não clássica, que tem fenótipo quase idêntico."],["Ressonância de sela túrcica pela suspeita de adenoma.","Errada: a 17-OHP aponta para a suprarrenal, não para a hipófise."],["Dosar HAM, que diferencia SOMP de HAC.","Errada: o HAM não é o exame que separa as duas."]],"conc":"HAC não clássica (deficiência de 21-hidroxilase): fenótipo semelhante ao da SOMP; rastreio com 17-OH-progesterona matinal em fase folicular; confirmação com teste de ACTH; tratamento com baixas doses de glicocorticoide.","rac":"1) Fenótipo de SOMP. 2) 17-OHP elevada. 3) Suspeita de HAC não clássica. 4) Teste com ACTH.","pista":"17-OH-progesterona elevada.","mud":"Com 17-OHP normal, a hipótese de SOMP se manteria após as demais exclusões.","cmp":"SOMP: 17-OHP normal. HAC não clássica: 17-OHP alta, confirmada por ACTH.","arm":"Diagnosticar SOMP sem dosar 17-OHP.","regra":"SOMP e HAC são quase gêmeas; a 17-OHP separa.","cf":"Confirmada a HAC não clássica, o aconselhamento genético faz parte do cuidado.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), tabela 2 (diagnóstico diferencial); Aula HTML Amenorreias (Aulas-GO, aula 01), módulo 7.8 (HAC não clássica); FEBRASGO, Amenorreia, 2021."},{"n":8,"sub":"Avaliação glicêmica","eixo":"Repercussões metabólicas","comp":"Rastrear alterações glicêmicas na SOMP","enun":"Mulher de 27 anos, IMC 22 kg/m², recebe diagnóstico de SOMP. Qual avaliação metabólica é recomendada pela diretriz de 2023 ao diagnóstico?","ops":[["TOTG 75 g, independentemente do IMC, além de perfil lipídico.","Correta: a resistência insulínica afeta também as magras, e o TOTG é o teste mais acurado."],["Nenhuma avaliação, porque a paciente é magra.","Errada: a resistência insulínica está presente em cerca de 75% das magras."],["Insulina de jejum e HOMA-IR, para decidir se trata a resistência.","Errada: esses índices não são recomendados de rotina."],["Apenas HbA1c, que é mais acurada que o TOTG nessa população.","Errada: glicemia de jejum e HbA1c são segunda linha, com acurácia menor."]],"conc":"Status glicêmico ao diagnóstico em todas (TOTG 75 g é o mais acurado), repetido a cada 1 a 3 anos; perfil lipídico em todas; PA anual; rastreio de apneia, depressão e ansiedade; transtornos alimentares independentemente do peso.","rac":"1) SOMP confirmada. 2) Rastreio metabólico universal. 3) TOTG e lipídios. 4) Independe do IMC.","pista":"Paciente magra com SOMP.","mud":"Mulher com fatores de risco adicionais teria repetição mais frequente do TOTG.","cmp":"Mais acurado: TOTG. Segunda linha: glicemia de jejum e HbA1c. Não recomendado: HOMA-IR.","arm":"Dispensar rastreio metabólico em magras.","regra":"SOMP: TOTG em todas, magras inclusive.","cf":"Ao planejar gestação, o TOTG deve ser oferecido antes e repetido na gestação.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulos 2.1 (motor da insulina) e 3.3 (rastreamento de comorbidades); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":9,"sub":"Saúde mental e sono","eixo":"Repercussões metabólicas","comp":"Incluir o rastreio de depressão, ansiedade e apneia","enun":"Mulher de 30 anos com SOMP há 5 anos refere sono não reparador, ronco alto e sonolência diurna, além de tristeza persistente. Qual conduta está de acordo com a diretriz de 2023?","ops":[["Rastrear apneia do sono, depressão e ansiedade.","Correta: apneia do sono é mais prevalente na SOMP independentemente do IMC, e o rastreio de saúde mental é parte do cuidado."],["Atribuir os sintomas apenas ao excesso de peso e orientar dieta.","Errada: a apneia é mais prevalente independentemente do IMC, e o sofrimento psíquico é característica central."],["Prescrever benzodiazepínico para o sono e reavaliar em 6 meses.","Errada: pode piorar a apneia e não rastreia os transtornos de humor."],["Dosar testosterona livre, que explica o sono não reparador.","Errada: a dosagem não esclarece apneia nem depressão."]],"conc":"Na SOMP: rastrear apneia (ronco, sono não reparador, sonolência; ferramenta validada; polissonografia), depressão e ansiedade em todas, transtornos alimentares independentemente do peso e risco de autolesão. Terapia psicológica é primeira linha.","rac":"1) Sinais de apneia. 2) Sintomas depressivos. 3) Rastreio validado. 4) Encaminhar conforme resultado.","pista":"Ronco com sonolência e tristeza persistente.","mud":"Sem sintomas de sono, o rastreio de apneia não seria necessário.","cmp":"Repercussões: metabólicas, reprodutivas, dermatológicas e psicológicas.","arm":"Reduzir a SOMP a uma doença ovariana.","regra":"SOMP é poliendócrina, metabólica e também psicológica.","cf":"O estigma de peso é dano clínico: peça permissão antes de abordar peso e IMC.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulos 2.2 (apresentação clínica), 3.3 (rastreamento de comorbidades) e 4.4 (comunicação); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":10,"sub":"Gestação na SOMP","eixo":"Repercussões metabólicas","comp":"Conhecer os riscos obstétricos da SOMP","enun":"Gestante de 29 anos com SOMP, 8 semanas, pergunta quais riscos a doença traz para a gestação. Segundo a diretriz de 2023, qual afirmação está correta?","ops":[["Há maior risco de diabetes gestacional, pré-eclâmpsia, abortamento, parto pré-termo e recém-nascido pequeno.","Correta: são os riscos aumentados listados pela diretriz."],["Há maior risco de recém-nascido grande e de macrossomia, pela resistência insulínica materna.","Errada: a diretriz destaca que não há aumento de GIG nem de macrossomia."],["A metformina na gestação previne diabetes gestacional e pré-eclâmpsia e deve ser iniciada já.","Errada: a metformina não demonstrou prevenir esses desfechos."],["Não há qualquer risco adicional, desde que a gravidez tenha sido espontânea.","Errada: os riscos existem independentemente da forma de concepção."]],"conc":"Gestação na SOMP: maior ganho de peso, abortamento, DMG, hipertensão e pré-eclâmpsia, restrição de crescimento e PIG, parto pré-termo e cesariana. Não há aumento de GIG, macrossomia ou parto instrumental. TOTG na primeira consulta e entre 24 e 28 semanas se não feito antes.","rac":"1) SOMP na gestação. 2) Riscos listados. 3) Armadilha: não aumenta GIG.","pista":"A armadilha do recém-nascido grande.","mud":"Se a pergunta fosse sobre a metformina, a resposta seria que ela não previne DMG nem pré-eclâmpsia.","cmp":"Aumenta: DMG, PE, PIG, prematuridade. Não aumenta: GIG, macrossomia.","arm":"Supor macrossomia por causa da resistência insulínica.","regra":"SOMP na gestação: mais DMG e PE, não mais macrossomia.","cf":"Na gestante com SOMP, o rastreio de DMG deve ser feito cedo e repetido entre 24 e 28 semanas.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 3.6 (gestação em mulher com SOMP e duas armadilhas de prova); International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":11,"sub":"Primeira linha sem desejo gestacional","eixo":"Tratamento conforme o objetivo","comp":"Escolher o tratamento de ciclos irregulares e hirsutismo","enun":"Mulher de 23 anos com SOMP, ciclos irregulares e hirsutismo leve a moderado, sem desejo de gestar, sem contraindicação a estrogênio, IMC 23 kg/m². Pela diretriz de 2023, qual é a primeira linha farmacológica, além de estilo de vida?","ops":[["Anticoncepcional combinado em baixa dose.","Correta: o AHC é primeira linha para hirsutismo e ciclos irregulares, na menor dose efetiva."],["Etinilestradiol 35 µg com acetato de ciproterona como primeira escolha.","Errada: pela diretriz de 2023, é segunda linha pelo risco tromboembólico."],["Metformina isolada, por ser superior ao AHC para hirsutismo.","Errada: o AHC é superior para hirsutismo e ciclos; a metformina, para desfechos metabólicos."],["Flutamida, pela maior potência antiandrogênica.","Errada: a flutamida tem risco de hepatotoxicidade grave."]],"conc":"Sem desejo gestacional: estilo de vida para todas; AHC como primeira linha para hirsutismo e ciclos (nenhuma formulação superior; menor dose efetiva); EE 35 µg com ciproterona como segunda linha; metformina para metabólico; antiandrogênios após 6 meses de resposta subótima.","rac":"1) Objetivo: ciclos e hirsutismo. 2) Sem contraindicação. 3) AHC em baixa dose.","pista":"Objetivo de regular ciclos e tratar hirsutismo sem desejo de gestar.","mud":"Se o objetivo fosse metabólico em mulher com IMC acima de 25, a metformina ganharia espaço.","cmp":"AHC: ciclos e hirsutismo. Metformina: metabólico.","arm":"Escolher ciproterona 35 como primeira linha pela diretriz de 2023.","regra":"AHC para pele e ciclo; metformina para metabolismo.","cf":"Pelo PCDT/MS 2019, o acetato de ciproterona é o antiandrogênio com indicação em bula no Brasil.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 3.4 (passo 1: AHC) e tabelas 4 e 5; International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":12,"sub":"Hirsutismo refratário","eixo":"Tratamento conforme o objetivo","comp":"Indicar antiandrogênio com segurança","enun":"Mulher de 27 anos com SOMP usa anticoncepcional combinado há 8 meses com melhora insuficiente do hirsutismo, apesar de medidas cosméticas. Qual é a conduta segundo a diretriz de 2023?","ops":[["Associar espironolactona 25 a 100 mg/dia, mantendo contracepção eficaz.","Correta: após 6 meses de resposta subótima, o antiandrogênio de menor risco é a espironolactona, sempre com contracepção."],["Trocar por acetato de ciproterona 50 mg/dia, por ser o antiandrogênio mais seguro.","Errada: ciproterona em doses de 10 mg ou mais não é aconselhada, pelo risco de meningioma."],["Suspender o anticoncepcional e iniciar flutamida isolada.","Errada: a flutamida tem hepatotoxicidade grave, e a contracepção é obrigatória com antiandrogênio."],["Iniciar finasterida e suspender a contracepção.","Errada: o risco de subvirilização de feto masculino exige contracepção eficaz."]],"conc":"Antiandrogênios: após pelo menos 6 meses de AHC e/ou terapia cosmética com resposta subótima, sempre com contracepção eficaz. Espironolactona 25 a 100 mg/dia tem menor risco; ciproterona de 10 mg ou mais não aconselhada (meningioma); finasterida, flutamida e bicalutamida com hepatotoxicidade.","rac":"1) AHC há mais de 6 meses. 2) Resposta subótima. 3) Antiandrogênio. 4) Espironolactona. 5) Contracepção.","pista":"Falha após mais de 6 meses de AHC.","mud":"Com 2 meses de uso, a conduta seria aguardar a resposta do AHC.","cmp":"Espironolactona: menor risco. Ciproterona alta dose: meningioma. Flutamida: fígado.","arm":"Usar antiandrogênio sem contracepção.","regra":"Antiandrogênio só com contracepção.","cf":"Laser e luz pulsada podem ser associados para o hirsutismo facial.","fonte":"Aula HTML SOMP (Aulas-GO, aula 02), módulo 3.4 (passo 3: antiandrogênios) e tabela 4; International Evidence-based Guideline for the Assessment and Management of PCOS 2023 (Teede et al., J Clin Endocrinol Metab 2023)."},{"n":13,"sub":"Indução de ovulação","eixo":"Tratamento conforme o objetivo","comp":"Escolher o indutor de ovulação de primeira linha","enun":"Pela diretriz internacional de 2023, casal com infertilidade há 18 meses: mulher de 30 anos com SOMP anovulatória, permeabilidade tubária normal e espermograma normal. Qual é a primeira linha de indução de ovulação?","ops":[["Letrozol, com ajuste de dose conforme a resposta.","Correta: o letrozol deve ser usado em vez do clomifeno, pela maior taxa de ovulação, gestação e nascido vivo."],["Citrato de clomifeno isolado, por ser a primeira linha clássica.","Errada: na diretriz de 2023 o clomifeno é alternativa; ele é primeira linha no PCDT de 2019."],["Fertilização in vitro i rreção traz mini-aula com resposta, conceito, raciocínio, análise das quatro alternativas, pista decisiva, o que mudaria a resposta, comparação, armadilha, regra de ouro, aplicação e fonte.","Doses e esquemas aparecem como nas aulas e diretrizes e servem ao raciocínio de prova; confira o protocolo vigente antes de prescrever."],"fontes":["Fonte principal: as 10 aulas HTML de Saúde da Mulher II publicadas em cabecaloira22-design.github.io/Aulas-GO (aulas 01 a 10), construídas a partir dos materiais da disciplina disponíveis no Drive e no projeto. Cada correção cita a aula, o módulo ou seção e, quando a aula se baseou em slides, o número do slide.","Materiais da disciplina citados pelas aulas: Gestação e Diabetes (Profa. Jacqueline Braga Pereira, 2026); 7. CIUR 2026.pdf; 280826 HIPERTENSÃO NA GRAVIDEZ.pptx; CA COLO UTERINO 2026 (Prof. Márcio C. Gomes); capturas da aula de Amenorreias (07/08/2026); Guia de Orientações SM2; Patologia da mama 2025; FEBRASGO Amenorreia 2021 e ASRM 2024 (arquivos do projeto); FEBRASGO Propedêutica mínima no climatério 2022 e Diretriz SBC/FEBRASGO/SOBRAC 2024 (arquivos do projeto).","Aulas sem slides da disciplina (conteúdo construído com diretrizes e declarado nas próprias aulas): Propedêutica fetal, Doenças do corpo uterino, Doenças da mama e SOMP. Nessas matérias, as questões seguem as diretrizes citadas pela aula.","Diretrizes complementares citadas questão a questão: SBD (hiperglicemia na gestação), OPAS/MS/FEBRASGO/SBD 2017, ADA 2026, ACOG; ISUOG 2020, SMFM 52, Delphi 2016, Figueras e Gratacós 2014; ACOG PB 106 e 229, FEBRASGO (cardiotocografia), FIGO 2015; ESHRE/ASRM 2024 (IOP), Pituitary Society 2023, Endocrine Society 2017; Diretrizes INCA 2025 (DNA-HPV), Nota Técnica MS 32/2026, FIGO 2018, SHAPE 2024; ESGO-ESTRO-ESP 2025, RCOG/BSGE 2016, FEBRASGO nº 77; ACR BI-RADS, nota técnica MS/INCA 2025 de mamografia, St. Gallen, ACOSOG Z0011; RBEHG 2025; diretriz internacional de PCOS 2023 e PCDT/MS 2019.","Conferido na web em 09/11/2026: a 2 a 126); momento do parto (aula x ACOG CO 831).","SOMP: Roterdã 2003 e PCDT/MS 2019 (12 folículos, clomifeno, ciproterona) versus diretriz internacional de 2023 (FNPO de 20 ou mais, HAM como alternativa em adultas, letrozol, espironolactona, ciproterona 35 como segunda linha). As questões declaram a referência.","Amenorreia: investigação após telarca precoce (FEBRASGO 3 anos x ASRM 5 anos); diagnóstico de IOP com uma dosagem de FSH (ESHRE 2024) ou com repetição (Femina/FEBRASGO 2025); teste da progesterona (quadro da aula x FEBRASGO 2021, que não o recomenda de rotina).","Climatério: a remoção da tarja preta da terapia hormonal pela FDA (2025-2026) e a aprovação do fezolinetanto pela Anvisa (2026) são posteriores às diretrizes brasileiras; as questões seguem as diretrizes brasileiras."]};
const KEY='simulado-sm2-8p-v1';

DATA.aulas.forEach(a=>{AULA[a.id]=a;a.q.forEach(q=>{const id=a.id+'-Q'+String(q.n).padStart(2,'0');
  const o={id,aula:a.id,n:q.n,sub:q.sub,eixo:q.eixo,comp:q.comp,tags:q.tags||[],rel:q.rel||[],enun:q.enun,
    ops:q.ops.map((x,i)=>({id:'o'+(i+1),t:x[0],a:x[1]})),correct:'o1',

let storageOK=true;
function fresh(){return {v:1,favs:[],marks:[],tent:{},hist:[],session:null}}
function load(){try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);}catch(e){storageOK=false;return fresh();}
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}
  return fresh();}
let S=load();

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function maxRun(a){let m=1,c=1;for(let i=1;i<a.length;i++){c=a[i]===a[i-1]?c+1:1;if(c>m)m=c;}return a.length?m:0;}
function balancedLetters(n){const base=Math.floor(n/4),rest=n%4;const arr=[];for(let k=0;k<4;k++)for(let i=0;i<base;i++)arr.push(k);
  shuffle([0,1,2,3]).slice(0,rest).forEach(k=>arr.push(k));
  let best=shuffle(arr.slice());for(let t=0;t<800&&maxRun(best)>3;t++){const c=shuffle(arr.slice());if(maxRun(c)<maxRun(best))best=c;}return best;}
function letterCounts(sess){const c=[0,0,0,0];sess.qids.forEach(id=>{c[sess.ord[id].indexOf(QMAP[id].correct)]++;});return c;}
function say(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const pct=(a,b)=>b?Math.round(100*a/b):0;
function lastAttempt(id){const t=S.tent[id];return t&&t.length?t[t.length-1]:null;}
function everWrong(id){return (S.tent[id]||[]).some(x=>!x.ok);}

/* ---------- sessão ---------- */
function newSession(opts){
  let qids=opts.qids.slice();if(opts.shuffle)shuffle(qids);
  let sess;for(let tries=0;tries<20;tries++){
    const L=balancedLetters(qids.length),ord={};
    qids.forEach((id,i)=>{const q=QMAP[id];const d=shuffle(q.ops.filter(o=>o.id!==q.correct).map(o=>o.id));d.splice(L[i],0,q.correct);ord[id]=d;});
    sess={id:Date.now(),modo:opts.modo,label:opts.label,qids,ord,resp:{},conf:{},done:{},cur:0,finished:false,startedAt:Date.now()};
    const c=letterCounts(sess);if(Math.max(...c)-Math.min(...c)<=1)break;}
  S.session=sess;save();view='quiz';render();window.scrollTo(0,0);}
function record(sess,id){const r=sess.resp[id];if(!r)return;const ok=r===QMAP[id].correct;
  (S.tent[id]=S.tent[id]||[]).push({opt:r,ok,conf:sess.conf[id]||null,at:Date.now(),modo:sess.modo});}
function finishSession(){const s=S.session;if(!s||s.finished)return;
  if(s.modo==='prova')s.qids.forEach(id=>record(s,id));
  s.finished=true;s.finishedAt=Date.now();const r=summarize(s);
  S.hist.push({at:s.finishedAt,modo:s.modo,label:s.label,n:s.qids.length,ok:r.ok,bad:r.bad,blank:r.blank});
  save();view='result';render();window.scrollTo(0,0);}
function summarize(s){let ok=0,bad=0,blank=0;const byA={},byB={},byG={},byC={baixa:[0,0],media:[0,0],alta:[0,0],'sem registro':[0,0]};
  s.qids.forEach(id=>{const q=QMAP[id],r=s.resp[id],answered=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    const a=byA[q.aula]=byA[q.aula]||{ok:0,bad:0,blank:0},b=byB[AULA[q.aula].bloco]=byB[AULA[q.aula].bloco]||{ok:0,bad:0,blank:0},g=byG[AULA[q.aula].grupo]=byG[AULA[q.aula].grupo]||{ok:0,bad:0,blank:0};
    if(!answered){blank++;a.blank++;b.blank++;g.blank++;return;}
    const k=s.conf[id]||'sem registro';const good=r===q.correct;byC[k][1]++;if(good){ok++;a.ok++;b.ok++;g.ok++;byC[k][0]++;}else{bad++;a.bad++;b.bad++;g.bad++;}});
  return {ok,bad,blank,byA,byB,byG,byC};}

  <section>

/* sorteio proporcional ao peso de cada matéria no banco (maiores restos) */
function sampleProportional(pool,n){const by={};pool.forEach(id=>(by[QMAP[id].aula]=by[QMAP[id].aula]||[]).push(id));
  const keys=Object.keys(by).sort(),tot=pool.length;const quota=keys.map(k=>{const e=n*by[k].length/tot;return {k,b:Math.floor(e),r:e-Math.floor(e)};});
  let left=n-quota.reduce((x,q)=>x+q.b,0);shuffle(quota.slice()).sort((a,b)=>b.r-a.r).slice(0,left).forEach(q=>q.b++);
  const out=[];quota.forEach(q=>{out.push(...shuffle(by[q.k].slice()).slice(0,Math.min(q.b,by[q.k].length)));});
  return out.sort((x,y)=>ALLQ.indexOf(x)-ALLQ.indexOf(y));}

function liveScore(s){const ids=s.qids.filter(id=>s.done[id]&&s.resp[id]);const ok=ids.filter(id=>s.resp[id]===QMAP[id].correct).length;return {ok,n:ids.length};}
function placar(s){if(s.modo==='prova'&&!s.finished){const a=Object.keys(s.resp).filter(id=>s.resp[id]).length;return `<div class="placar" id="placar" role="status" aria-live="polite"><span class="pl-main">${a}/${s.qids.length} respondidas</span></div>`;}
  const {ok,n}=liveScore(s);const p=n?Math.round(100*ok/n):null;const cls=p===null?'':(p>=70?' good':(p>=50?' mid':' low'));
  return `<div class="placar${cls}" id="placar" role="status" aria-live="polite"><span class="pl-main">${n?`Acertos: ${ok} de ${n} respondidas (${p}%)`:'Acertos: — (nenhuma respondida)'}</span><span class="pl-side mono">${n}/${s.qids.length} questões</span></div>`;}

function correction(q,r,ord){const ci=ord.indexOf(q.correct),co=q.ops.find(o=>o.id===q.correct);

   <div><dt>Fonte</dt><dd class="small">${esc(q.fonte)}</dd></div>
  </dl>${fig}${rel}</div>`;}
function figHtml(k){const f=DATA.figs[k];return `<figure><span class="eyebrow">Figura do material</span>${f.rot?`<canvas data-fig="${k}" role="img" aria-label="${esc(f.alt)}"></canvas><div class="row"><button class="btn" data-act="rotfig" data-v="${k}">Ver na orientação original</button></div>`:`<img src="${f.src}" alt="${esc(f.alt)}">`}<figcaption>${esc(f.cap)}</figcaption></figure>`;}

function drawFigs(){document.querySelectorAll('canvas[data-fig]').forEach(cv=>{const k=cv.dataset.fig,f=DATA.figs[k];const img=new Image();img.onload=()=>{const rot=!figRot[k];
  const ctx=cv.getContext('2d');if(rot){cv.width=img.height;cv.height=img.width;ctx.translate(cv.width,0);ctx.rotate(Math.PI/2);}else{cv.width=img.width;cv.height=img.height;}ctx.drawImage(img,0,0);};img.src=f.src;});}

function csv(s){const rows=[['questao','materia','grupo','eixo','subtema','sua_resposta','resposta_correta','resultado','confianca']];

  <div class="stack">${ids.map(id=>{const q=QMAP[id],t=S.tent[id],first=t[0],firstWrong=t.find(x=>!x.ok),rev=lastAttempt(id).ok;
    const txt=o=>esc(q.ops.find(x=>x.id===o).t);
    return `<div class="card stack"><div class="qmeta"><span class="chip acc mono">${id}</span><span class="chip">${esc(AULA[q.aula].titulo)}</span><span class="chip">${rev?'Revisada':'Pendente'}</span><span class="chip mono">${t.length} tentativa(s)</span></div>
      <p>${esc(q.enun)}</p>
      <p class="small"><b>Primeira resposta:</b> ${txt(first.opt)} ${first.ok?'(acerto)':'(erro)'}${first.conf?` · confiança ${first.conf==='media'?'média':first.conf}`:''}</p>
      ${first.ok?`<p class="small"><b>Primeiro erro:</b> ${txt(firstWrong.opt)}</p>`:''}
      <p class="small"><b>Correta:</b> ${txt(q.correct)}</p>
      <details><summary>Ver explicação</summary><p class="small">${esc(q.ma.conc)}</p><p class="small gold">${esc(q.ma.regra)}</p><p class="small muted">${esc(q.fonte)}</p></details>
      <div class="row"><button class="btn" data-act="one" data-v="${id}">Refazer esta questão</button></div></div>`;}).join('')}</div>`
  :'<p class="card">Nenhum erro registrado ainda. Os erros dos simulados aparecem aqui automaticamente.</p>'}`;}

function vSobre(){const byB={};DATA.aulas.forEach(a=>(byB[a.bloco]=byB[a.bloco]||[]).push(a));
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Sobre o simulado</span><h1>Estrutura, fontes e cobertura</h1></header>
  <section><h2>Estrutura e pesos</h2><p class="small muted">${DATA.aulas.length} matérias e ${NTOT} questões (${NTOT*4} alternativas, cada uma com análise própria). Prioritárias: 5 × 35 = 175 questões (70%). Complementares: 5 × 15 = 75 questões (30%). O simulado completo segue a ordem abaixo; o personalizado sorteia de cada matéria em proporção ao seu peso no banco (com todas marcadas e 100 questões: 70 prioritárias e 30 complementares).</p>
   <div class="tbl"><table><thead><tr><th>ID</th><th>Matéria</th><th>Bloco</th><th>Grupo</th><th>Questões</th></tr></thead><tbody>
   ${DATA.aulas.map(a=>`<tr><td class="n">${a.id}</td><td>${esc(a.titulo)}</td><td>${esc(BLOCOS[a.bloco])}</td><td>${a.grupo==='P'?'Prioritária':'Complementar'}</td><td class="n">${a.q.length}</td></tr>`).join('')}</tbody></table></div></section>
  <section><h2>Fontes</h2><ul class="plain small">${DATA.fontes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Matriz de cobertura</h2><p class="small muted">Um subtema por questão, agrupado pelos eixos da prova. Nas prioritárias, nenhum eixo tem mais de 6 questões.</p>
   <div class="stack">${DATA.aulas.map(a=>{const ex={};a.q.forEach(q=>(ex[q.eixo]=ex[q.eixo]||[]).push(q));
     return `<details class="card"><summary>${a.id} · ${esc(a.titulo)} (${a.q.length})</summary>${Object.keys(ex).map(e=>`<p class="bloco">${esc(e)} · ${ex[e].length}</p><ul class="plain small">${ex[e].map(q=>`<li><span class="mono">Q${String(q.n).padStart(2,'0')}</span> ${esc(q.sub)}: ${esc(q.comp)}</li>`).join('')}</ul>`).join('')}</details>`;}).join('')}</div></section>
  <section><h2>Divergências entre fontes</h2><p class="small muted">Quando as fontes divergem, o enunciado declara qual referência vale e a mini-aula mostra as duas posições.</p><ul class="plain small">${DATA.divergencias.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Critérios adotados</h2><ul class="plain small">${DATA.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Gabarito</h2><p class="small muted">A posição da alternativa correta é sorteada a cada simulado, com quantidades equilibradas de A, B, C e D (diferença máxima de 1; no simulado completo, 63, 63, 62 e 62) e sem mais de três letras iguais seguidas sempre que possível. O tamanho das alternativas foi auditado para que a correta não seja, com frequência, a mais longa. Ao retomar um simulado, a ordem salva é mantida.</p></section>
  <section><h2>Uso</h2><p class="small muted">Material de estudo para a prova e para residência. Não substitui protocolos institucionais nem a conferência de doses e condutas no atendimento real. Vinhetas e nomes são fictícios.</p></section>`;}

/* ---------- eventos ---------- */
function bind(){document.querySelectorAll('[data-act]').forEach(el=>{const ev=(el.type==='checkbox'||el.type==='range')?(el.type==='range'?'input':'change'):'click';el.addEventListener(ev,e=>act(el.dataset.act,el.dataset.v,el,e));});}
function startAula(aid){newSession({modo:'estudo',qids:ALLQ.filter(id=>QMAP[id].aula===aid),label:UN(aid)+' · '+AULA[aid].titulo,shuffle:false});}
function act(a,v,el){const s=S.session;
  switch(a){
  case 'go':view=v;confirmReset=false;render();window.scrollTo(0,0);break;
  case 'resume':view='quiz';render();break;
  case 'fullmodo':fullModo=v;render();break;
  case 'full':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · '+NTOT+' questões',shuffle:false});break;
  case 'fullshuf':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · ordem embaralhada',shuffle:true});break;
  case 'aula':startAula(v);break;
  case 'custom':view='custom';render();window.scrollTo(0,0);break;
  case 'caula':el.checked?custom.aulas.add(v):custom.aulas.delete(v);custom.qtd=0;render();break;
  case 'call':DATA.aulas.forEach(x=>custom.aulas.add(x.id));custom.qtd=0;render();break;
  case 'cnone':custom.aulas.clear();custom.qtd=0;render();break;
  case 'cqtd':custom.qtd=+el.value;document.getElementById('qtdv').textContent=custom.qtd;document.querySelector('[data-act="cstart"]').textContent='Começar '+custom.qtd+' questões';break;
  case 'cmodo':custom.modo=v;render();break;
  case 'cshuf':custom.shuf=el.checked;break;
  case 'cstart':{let pool=poolCustom();const n=custom.qtd||pool.length;if(n<pool.length){pool=sampleProportional(pool,n);}
    newSession({modo:custom.modo,qids:pool,label:'Personalizado · '+pool.length+' questões',shuffle:custom.shuf});break;}
  case 'rev':{let ids=[],label='';
    if(v==='erradas'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok;});label='Revisão das erradas';}
    if(v==='alta'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok&&l.conf==='alta';});label='Erros de alta confiança';}
    if(v==='marcadas'){ids=ALLQ.filter(id=>S.marks.includes(id));label='Questões marcadas';}
    if(v==='favs'){ids=ALLQ.filter(id=>S.favs.includes(id));label='Favoritas';}
    if(v==='pend'){ids=ALLQ.filter(id=>everWrong(id)&&!lastAttempt(id).ok);label='Caderno de erros · pendentes';}
    if(ids.length)newSession({modo:'estudo',qids:ids,label,shuffle:false});break;}
  case 'one':newSession({modo:'estudo',qids:[v],label:'Refazer '+v,shuffle:false});break;
  case 'reset':confirmReset=true;render();break;
  case 'resetno':confirmReset=false;render();break;
  case 'resetyes':S=fresh();save();confirmReset=false;render();say('Progresso apagado.');break;
  case 'nav':navOpen=!navOpen;render();break;
  case 'jump':s.cur=+v;confirmFinish=false;save();render();window.scrollTo(0,0);break;
  case 'prev':if(s.cur>0){s.cur--;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'next':if(s.cur<s.qids.length-1){s.cur++;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'pick':{const id=s.qids[s.cur];if(s.finished||(s.modo==='estudo'&&s.done[id]))break;s.resp[id]=v;save();render();
    if(s.modo==='prova')say('Resposta registrada.');break;}
  case 'conf':{const id=s.qids[s.cur];s.conf[id]=s.conf[id]===v?undefined:v;save();render();break;}
  case 'confirm':{const id=s.qids[s.cur];if(!s.resp[id])break;s.done[id]=true;record(s,id);save();render();
    say(s.resp[id]===QMAP[id].correct?'Resposta correta.':'Resposta incorreta. Veja a correção.');break;}
  case 'mark':{const id=s.qids[s.cur];const i=S.marks.indexOf(id);i>=0?S.marks.splice(i,1):S.marks.push(id);save();render();break;}
  case 'fav':{const id=s.qids[s.cur];const i=S.favs.indexOf(id);i>=0?S.favs.splice(i,1):S.favs.push(id);save();render();break;}
  case 'finish':confirmFinish=true;render();break;
  case 'finishno':confirmFinish=false;render();break;
  case 'finishyes':confirmFinish=false;finishSession();break;
  case 'reviewsess':s.cur=0;view='quiz';render();window.scrollTo(0,0);break;
  case 'redo':newSession({modo:s.modo,qids:s.qids.slice(),label:s.label+' (refeito)',shuffle:false});break;
  case 'redraw':{const aulas=new Set(s.qids.map(id=>QMAP[id].aula));const pool=ALLQ.filter(id=>aulas.has(QMAP[id].aula));
    newSession({modo:s.modo,qids:pool,label:'Novo sorteio · '+aulas.size+' matéria(s)',shuffle:true});break;}
  case 'csvcopy':{const t=csv(s);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>say('CSV copiado.'),()=>{csvShown=true;render();say('Não foi possível copiar; o texto está na caixa abaixo.');});}else{csvShown=true;render();}break;}
  case 'csvdl':{try{const b=new Blob(['﻿'+csv(s)],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='resultado-simulado-sm2.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){}
    csvShown=true;render();say('Se o download não começou, copie o texto exibido.');break;}
  case 'csvshow':csvShown=!csvShown;render();break;
  case 'rotfig':figRot[v]=!figRot[v];el.textContent=figRot[v]?'Ver girada para leitura':'Ver na orientação original';drawFigs();break;
  }}
render();
</script>
