lo-negativo recebe neoadjuvância.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.9 e 2.10 (subtipos) e 3.6 (tratamento sistêmico, síntese rotulada)."},{"n":26,"sub":"Carcinoma inflamatório","eixo":"Estadiamento","comp":"Diferenciar carcinoma inflamatório de mastite e estadiá-lo","enun":"Mulher de 47 anos, não lactante, com eritema, edema e aspecto em 'casca de laranja' em mais de um terço da mama direita há 2 meses, sem febre, sem melhora após 10 dias de cefalexina. Não há nódulo palpável. Qual é a hipótese, o estadiamento T e o próximo passo?","ops":[["Carcinoma inflamatório, T4d; biópsia de pele e do parênquima.","Correta: quadro inflamatório extenso, rápido e sem resposta a antibiótico em não lactante sugere carcinoma inflamatório."],["Mastite não puerperal, T0; trocar o antibiótico por clindamicina.","Errada: mastite sem resposta deve levantar suspeita de carcinoma inflamatório, que exige biópsia."],["Abscesso subareolar, sem estadiamento; drenagem cirúrgica.","Errada: não há coleção nem flutuação."],["Doença de Paget, T4b; biópsia do mamilo.","Errada: Paget é eczema do complexo areolopapilar, não eritema difuso da mama."]],"conc":"Carcinoma inflamatório: eritema, edema, casca de laranja, calor, um terço ou mais da mama, evolução rápida (menos de 6 meses), com ou sem massa; T4d, pior prognóstico (êmbolos linfáticos dérmicos). Confunde-se com mastite; biópsia de pele e tumor. Tratamento começa por neoadjuvância.","rac":"1) Não lactante. 2) Casca de laranja extensa. 3) Sem resposta ao antibiótico. 4) Carcinoma inflamatório. 5) T4d. 6) Biópsia.","pista":"Mastite que não responde, em não lactante.","mud":"Puérpera com febre e resposta ao antibiótico sugeriria mastite lactacional.","cmp":"Mastite: puérpera, febre, responde. Inflamatório: não lactante, rápido, não responde.","arm":"Trocar antibióticos repetidamente sem biopsiar.","regra":"Mastite que não melhora: biopsie.","cf":"No TNM, T4b é edema ou ulceração de pele sem o quadro inflamatório difuso.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.11 (carcinoma inflamatório) e 3.5 (TNM), tabela mastite x carcinoma inflamatório e erros comuns."},{"n":27,"sub":"TNM do tumor primário e da axila","eixo":"Estadiamento","comp":"Aplicar o TNM e indicar o estadiamento sistêmico","enun":"Mulher de 58 anos com carcinoma invasivo de 3,5 cm na mama esquerda e linfonodo axilar ipsilateral de nível I, móvel, com punção positiva para carcinoma. Sem sintomas sistêmicos. Qual é a classificação TNM clínica e a conduta quanto ao estadiamento sistêmico?","ops":[["T2 N1; estadiamento sistêmico indicado.","Correta: tumor de mais de 2 até 5 cm é T2, axila nível I a II móvel é N1, e N positivo indica estadiamento."],["T1 N0; estadiamento sistêmico dispensável.","Errada: o tumor tem mais de 2 cm e a axila é positiva."],["T3 N2; estadiamento apenas se houver dor óssea.","Errada: T3 exige tumor de mais de 5 cm e N2 axila fixa ou mamária interna."],["T2 N3; estadiamento com PET-TC obrigatório.","Errada: N3 envolve infraclavicular, supraclavicular ou N2 com mamária interna."]],"conc":"T1 até 2 cm; T2 de mais de 2 até 5 cm; T3 mais de 5 cm; T4 parede, pele ou inflamatório. N1 axilar I a II móvel; N2 axilar fixo ou mamária interna; N3 infraclavicular, supraclavicular. Estadiamento sistêmico: não necessário em I a IIA assintomáticas; indicado em localmente avançado, N positivo ou sintomas.","rac":"1) 3,5 cm: T2. 2) Axila nível I móvel positiva: N1. 3) N positivo: estadiamento sistêmico.","pista":"Linfonodo axilar móvel positivo.","mud":"Com axila negativa e tumor de 1,5 cm (T1N0, estádio I) em assintomática, o estadiamento sistêmico seria dispensável.","cmp":"I a IIA assintomática: sem estadiamento. N positivo ou localmente avançado: estadiar.","arm":"Estadiar sistemicamente todas ou nenhuma paciente.","regra":"Axila positiva: procure doença à distância.","cf":"O número de linfonodos axilares comprometidos é o fator prognóstico clássico mais importante.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 1.1 (drenagem linfática) e 3.5 (TNM resumido, AJCC 8ª edição, síntese rotulada)."},{"n":28,"sub":"Contraindicação à cirurgia conservadora","eixo":"Tratamento cirúrgico","comp":"Indicar mastectomia quando a conservadora é contraindicada","enun":"Mulher de 52 anos com carcinoma invasivo e microcalcificações suspeitas difusas ocupando três quadrantes da mama direita, confirmadas como multicêntricas na ressonância. Qual é a abordagem cirúrgica da mama?","ops":[["Mastectomia, pela doença multicêntrica com calcificações difusas.","Correta: multicentricidade e microcalcificações difusas suspeitas são contraindicações à conservadora."],["Quadrantectomia com radioterapia, que tem sobrevida igual em qualquer situação.","Errada: a equivalência vale para estádios iniciais elegíveis, não para doença multicêntrica."],["Setorectomia apenas do maior foco, deixando os demais para radioterapia.","Errada: deixar focos sabidamente doentes não é tratamento adequado."],["Nenhuma cirurgia, apenas hormonioterapia exclusiva.","Errada: doença operável deve receber tratamento locorregional."]],"conc":"Cirurgia conservadora com radioterapia tem sobrevida equivalente à mastectomia em estádios iniciais. Contraindicações: multicentricidade, microcalcificações difusas suspeitas, relação tumor e mama desfavorável, margens persistentemente positivas, impossibilidade de radioterapia, preferência da paciente. Reconstrução é direito garantido.","rac":"1) Doença multicêntrica. 2) Calcificações difusas. 3) Conservadora contraindicada. 4) Mastectomia, com reconstrução.","pista":"Doença em três quadrantes.","mud":"Com tumor único de 2 cm em mama de bom volume, a cirurgia conservadora seria opção.","cmp":"Conservadora: exige radioterapia. Mastectomia: radioterapia conforme critérios.","arm":"Indicar conservadora em doença multicêntrica.","regra":"Doença espalhada pela mama: mastectomia.","cf":"A reconstrução mamária, imediata ou tardia, deve ser oferecida.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.6 (doença local: cirurgia conservadora e contraindicações)."},{"n":29,"sub":"Linfonodo sentinela e Z0011","eixo":"Tratamento cirúrgico","comp":"Conduzir a axila clinicamente negativa","enun":"Mulher de 57 anos com carcinoma invasivo de 2,2 cm (T2), axila clinicamente negativa, submetida a cirurgia conservadora com biópsia do linfonodo sentinela: 2 linfonodos sentinelas, 1 com macrometástase. Fará radioterapia de mama total. Segundo o estudo ACOSOG Z0011, qual é a conduta axilar?","ops":[["Dispensar o esvaziamento axilar.","Correta: em T1 a T2, cirurgia conservadora com RT e 1 a 2 sentinelas positivos, o esvaziamento pode ser dispensado."],["Esvaziamento axilar obrigatório, porque o sentinela foi positivo.","Errada: o Z0011 mostrou que o esvaziamento não acrescenta benefício nesse perfil."],["Mastectomia, pela positividade axilar.","Errada: a positividade axilar não muda a cirurgia da mama."],["Repetir a biópsia do linfonodo sentinela na mama contralateral.","Errada: não há indicação."]],"conc":"Axila clinicamente negativa: biópsia do linfonodo sentinela. Negativo: não se esvazia. Positivo com conservadora, RT, T1 a T2 e 1 a 2 sentinelas: dispensa o esvaziamento (Z0011). Esvaziamento causa linfedema, parestesias e limitação do ombro.","rac":"1) cN0. 2) Sentinela: 1 de 2 positivo. 3) Conservadora com RT, T2. 4) Critérios Z0011. 5) Sem esvaziamento.","pista":"Um a dois sentinelas positivos em cirurgia conservadora com radioterapia.","mud":"Com 3 sentinelas positivos ou mastectomia sem RT, discutir-se-ia esvaziamento ou RT axilar.","cmp":"cN0: sentinela. cN positivo: esvaziamento ou neoadjuvância com reavaliação.","arm":"Esvaziar toda axila com sentinela positivo.","regra":"Z0011: poucos sentinelas positivos, conservadora e RT, não esvazie.","cf":"No CDIS, não se faz esvaziamento axilar.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.6 (axila; estudo ACOSOG Z0011) e tabela CDIS x invasivo x CLIS."},{"n":30,"sub":"Tumor filoides","eixo":"Tratamento cirúrgico","comp":"Tratar o tumor filoides","enun":"Mulher de 44 anos com nódulo mamário que cresceu de 3 para 7 cm em 4 meses, bem delimitado, móvel, sem linfonodos palpáveis. A core biopsy mostra lesão fibroepitelial com estroma hipercelular, sugestiva de tumor filoides. Qual é o tratamento?","ops":[["Exérese ampla com margens livres de pelo menos 1 cm, sem esvaziamento axilar.","Correta: o filoides exige margens amplas; a disseminação é hematogênica e a axila raramente é acometida."],["Enucleação simples, como no fibroadenoma, sem preocupação com margens.","Errada: a recidiva local é frequente com margens exíguas."],["Mastectomia com esvaziamento axilar de rotina.","Errada: o esvaziamento não é rotina no filoides."],["Seguimento ultrassonográfico semestral, por ser lesão fibroepitelial.","Errada: crescimento rápido e tamanho grande exigem exérese."]],"conc":"Tumor filoides: fibroepitelial com estroma hipercelular; benigno, borderline ou maligno (metástases hematogênicas, pulmões). Pico na 5ª década; crescimento rápido; maior que 4 cm. Exérese ampla com margem de 1 cm ou mais; sem esvaziamento axilar; mastectomia se tumor grande sem margem.","rac":"1) Crescimento rápido. 2) 7 cm. 3) Estroma hipercelular. 4) Filoides. 5) Exérese ampla.","pista":"Nódulo semelhante a fibroadenoma, porém grande e de crescimento rápido aos 44 anos.","mud":"Nódulo de 2 cm estável em mulher de 22 anos sugeriria fibroadenoma.","cmp":"Fibroadenoma: 20 a 35 anos, estável. Filoides: 40 a 50 anos, cresce rápido.","arm":"Fazer esvaziamento axilar no filoides.","regra":"Filoides: margem larga, axila quieta.","cf":"Pela recidiva local frequente, o seguimento é necessário.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 2.3 (tumor filoides), tabela de lesões benignas e erros comuns."},{"n":31,"sub":"Hormonioterapia na pré-menopausa","eixo":"Tratamento sistêmico","comp":"Escolher a hormonioterapia conforme o status menopausal","enun":"Mulher de 39 anos, pré-menopausa, com carcinoma luminal A estádio I, operada. Qual hormonioterapia adjuvante é a padrão?","ops":[["Tamoxifeno por 5 a 10 anos.","Correta: na pré-menopausa o padrão é o tamoxifeno."],["Inibidor de aromatase isolado, sem supressão ovariana.","Errada: na pré-menopausa, o inibidor de aromatase só pode ser usado com supressão ovariana."],["Trastuzumabe por 1 ano.","Errada: o trastuzumabe é para tumores HER2 positivos."],["Megestrol contínuo por 2 anos.","Errada: não é a hormonioterapia adjuvante padrão."]],"conc":"Hormonioterapia por 5 a 10 anos nos luminais: tamoxifeno na pré-menopausa; inibidor de aromatase na pós-menopausa (na pré, só com supressão ovariana). Inibidores de aromatase exigem cuidado com a saúde óssea.","rac":"1) Luminal. 2) Pré-menopausa. 3) Ovários funcionantes. 4) Tamoxifeno.","pista":"Pré-menopausa.","mud":"Na pós-menopausa, o inibidor de aromatase seria a escolha.","cmp":"Pré-menopausa: tamoxifeno. Pós-menopausa: inibidor de aromatase.","arm":"Usar inibidor de aromatase isolado em mulher que menstrua.","regra":"Ovário funcionando: tamoxifeno ou supressão.","cf":"Com o tamoxifeno, sangramento uterino anormal deve ser investigado, pelo efeito agonista no endométrio.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.6 (tratamento sistêmico por subtipo, síntese rotulada)."},{"n":32,"sub":"Neoadjuvância","eixo":"Tratamento sistêmico","comp":"Indicar tratamento sistêmico neoadjuvante","enun":"Mulher de 45 anos com carcinoma invasivo HER2 positivo (RE negativo, RP negativo, HER2 3+) de 3 cm, com linfonodo axilar positivo. Qual sequência é a mais indicada?","ops":[["Quimioterapia neoadjuvante com anti-HER2, seguida de cirurgia.","Correta: HER2 positivo com T2 ou N positivo tem indicação de neoadjuvância, que testa a resposta e pode viabilizar conservadora."],["Cirurgia imediata e hormonioterapia adjuvante por 5 anos.","Errada: o tumor é receptor hormonal negativo e tem indicação de neoadjuvância."],["Radioterapia exclusiva da mama e da axila.","Errada: o tratamento sistêmico é essencial no HER2 positivo."],["Observação até o surgimento de metástase, por ser doença agressiva.","Errada: é doença potencialmente curável."]],"conc":"Neoadjuvância é indicada em triplo-negativo e HER2 positivo de 2 cm ou mais ou N positivo, e em tumores localmente avançados ou inflamatórios. Viabiliza conservadora e testa a resposta; a resposta patológica completa tem valor prognóstico e orienta a terapia pós-operatória.","rac":"1) HER2 positivo. 2) T2 N1. 3) Neoadjuvância com anti-HER2. 4) Cirurgia depois.","pista":"HER2 positivo com tumor maior que 2 cm e axila positiva.","mud":"Um luminal A de 1,5 cm cN0 iria primeiro à cirurgia.","cmp":"Neoadjuvância: HER2 positivo e triplo-negativo maiores, localmente avançados. Cirurgia primeiro: iniciais luminais.","arm":"Operar primeiro todo HER2 positivo.","regra":"HER2 ou triplo-negativo grande: sistêmico antes.","cf":"O anti-HER2 (trastuzumabe, com ou sem pertuzumabe) é mantido por 1 ano no total.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulo 3.6 (neoadjuvância e tratamento sistêmico por subtipo) e algoritmo C."},{"n":33,"sub":"Terapia anti-HER2","eixo":"Tratamento sistêmico","comp":"Indicar trastuzumabe nos tumores HER2 positivos","enun":"Mulher de 62 anos com carcinoma invasivo luminal B HER2 positivo (RE positivo 80%, HER2 3+), 1,8 cm, axila negativa, operada. Qual componente do tratamento sistêmico é indispensável por causa do HER2?","ops":[["Trastuzumabe associado à quimioterapia, por 1 ano.","Correta: tumores HER2 positivos recebem anti-HER2 com quimioterapia; sendo RE positivo, também hormonioterapia."],["Apenas inibidor de aromatase, já que o tumor é RE positivo.","Errada: o HER2 positivo exige terapia anti-HER2."],["Inibidor de PARP, por ser tratamento-alvo do HER2.","Errada: o PARP é para portadoras de BRCA em subgrupos de alto risco."],["Inibidor de CDK4/6 adjuvante isolado.","Errada: os inibidores de CDK4/6 são usados principalmente em luminais avançados ou de alto risco, não como terapia anti-HER2."]],"conc":"HER2 positivo: quimioterapia com anti-HER2 (trastuzumabe com ou sem pertuzumabe, por 1 ano). Luminal B HER2 positivo: quimioterapia, anti-HER2 e hormonioterapia.","rac":"1) HER2 3+. 2) Anti-HER2 indispensável. 3) RE positivo: soma hormonioterapia.","pista":"HER2 3+.","mud":"Com HER2 negativo, a decisão seria entre hormonioterapia isolada e associação com quimioterapia.","cmp":"Anti-HER2: trastuzumabe. BRCA: PARP. Luminal avançado: CDK4/6.","arm":"Tratar só pelo RE positivo e esquecer o HER2.","regra":"HER2 positivo pede anti-HER2.","cf":"O trastuzumabe é contraindicado na gestação.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.10 (luminal B HER2 positivo) e 3.6 (tratamento sistêmico, síntese rotulada)."},{"n":34,"sub":"Câncer de mama na gestação","eixo":"Câncer de mama na gestação e no homem","comp":"Conduzir o nódulo e o câncer de mama na gestação","enun":"Gestante de 33 anos, 18 semanas, com nódulo endurecido de 2,5 cm na mama direita notado há 6 semanas, atribuído inicialmente às alterações da gravidez. Qual é a conduta adequada?","ops":[["Ultrassonografia e core biopsy, sem adiar a investigação.","Correta: a US é o primeiro exame, a core é segura e a cirurgia pode ser feita em qualquer trimestre."],["Aguardar o parto para investigar, pelo risco fetal dos exames.","Errada: o atraso diagnóstico é o principal problema do câncer na gestação."],["Interromper a gestação para iniciar o tratamento oncológico com segurança.","Errada: a interrupção em geral não melhora o desfecho."],["Iniciar trastuzumabe e tamoxifeno até o parto.","Errada: trastuzumabe e hormonioterapia são contraindicados na gestação."]],"conc":"Câncer na gestação: diagnóstico costuma ser tardio. US é o 1º exame; mamografia com proteção abdominal é segura; core é segura. Cirurgia em qualquer trimestre; quimioterapia contraindicada no 1º trimestre; radioterapia adiada para o pós-parto; trastuzumabe e hormonioterapia contraindicados.","rac":"1) Nódulo persistente na gestação. 2) Investigar já. 3) US e core. 4) Tratamento adaptado ao trimestre.","pista":"Nódulo atribuído à gravidez sem investigação.","mud":"No primeiro trimestre, a quimioterapia não poderia ser iniciada.","cmp":"Permitido: cirurgia, químio após o 1º trimestre. Contraindicado: RT, trastuzumabe, hormonioterapia.","arm":"Adiar a investigação para depois do parto.","regra":"Nódulo na gestação se investiga na gestação.","cf":"Na gestação, a radioterapia obrigatória da cirurgia conservadora pode favorecer a mastectomia no 1º e 2º trimestres.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.11 (câncer na gestação, inferência didática) e 3.6 (contraindicações à conservadora) e erros comuns."},{"n":35,"sub":"Câncer de mama no homem","eixo":"Câncer de mama na gestação e no homem","comp":"Reconhecer o câncer de mama masculino e sua relação genética","enun":"Homem de 63 anos com nódulo duro, excêntrico ao mamilo, de 2 cm, com retração mamilar na mama esquerda. A biópsia confirma carcinoma invasivo. Qual afirmação está correta?","ops":[["Associa-se a BRCA2 e à síndrome de Klinefelter, e o teste genético é recomendado.","Correta: o câncer de mama masculino tem forte relação com BRCA2 e Klinefelter."],["É ginecomastia senescente, que pode ser apenas observada.","Errada: a ginecomastia é subareolar e concêntrica, não excêntrica e dura com retração."],["É tratado de forma totalmente diferente da mulher, sem hormonioterapia.","Errada: o tratamento segue os mesmos princípios, incluindo hormonioterapia quando RE positivo."],["Corresponde a cerca de 20% dos casos de câncer de mama.","Errada: o câncer masculino corresponde a cerca de 1% dos casos."]],"conc":"Câncer de mama masculino: cerca de 1% dos casos; nódulo duro excêntrico, retração ou ulceração mamilar; BRCA2 e Klinefelter são fatores; tratamento como na mulher; teste genético recomendado. Ginecomastia é subareolar e concêntrica.","rac":"1) Nódulo excêntrico com retração. 2) Carcinoma. 3) Associação com BRCA2. 4) Teste genético.","pista":"Nódulo excêntrico, duro, com retração em homem idoso.","mud":"Aumento subareolar concêntrico e doloroso em usuário de espironolactona sugeriria ginecomastia.","cmp":"Ginecomastia: subareolar, concêntrica. Câncer: excêntrico, duro, fixo.","arm":"Rotular como ginecomastia sem biópsia.","regra":"Câncer de mama no homem: pense em BRCA2.","cf":"Câncer de mama masculino na família é sinal de alerta de hereditariedade para as mulheres da família.","fonte":"Aula HTML Doenças Benignas e Malignas da Mama (Aulas-GO, aula 10), módulos 2.8 (ginecomastia e câncer masculino) e 2.9 (sinais de alerta)."}]},{"id":"M08","titulo":"Climatério","bloco":2,"grupo":"C","q":[{"n":1,"sub":"Diagnóstico clínico da menopausa","eixo":"Definições e diagnóstico","comp":"Diagnosticar a menopausa sem exames desnecessários","enun":"Mulher de 51 anos, sem menstruar há 13 meses, refere ondas de calor típicas em face e tórax e sudorese noturna. Sem uso de hormônios, sem histerectomia. Ela pede dosagem de FSH e estradiol 'para confirmar a menopausa'. Qual é a orientação correta?","ops":[["O diagnóstico é clínico e retrospectivo, sem necessidade de dosagens hormonais.","Correta: acima de 45 anos com sintomas típicos, a síndrome do climatério é diagnóstico clínico; a menopausa se define após 12 meses de amenorreia."],["Dosar FSH e estradiol, porque só o FSH acima de 40 mUI/mL confirma a menopausa.","Errada: dosagens de rotina não mudam a conduta e podem confundir pela oscilação hormonal."],["Dosar FSH duas vezes com intervalo de 4 a 6 semanas, obrigatório em todas as mulheres.","Errada: essa estratégia só se usa se houver dúvida sobre a origem dos sintomas."],["Pedir ultrassonografia transvaginal para medir o endométrio e confirmar a menopausa.","Errada: a ultrassonografia não é exame diagnóstico de menopausa nem rastreamento em assintomática."]],"conc":"Para mulheres acima de 45 anos com queixas típicas de hipoestrogenismo, o diagnóstico é clínico e não precisa de exames. A menopausa é definida retrospectivamente após 12 meses de amenorreia. FSH duplo só se houver dúvida; abaixo de 45 anos com irregularidade, propedêutica obrigatória.","rac":"1) 51 anos. 2) 13 meses sem menstruar. 3) Sintomas típicos. 4) Diagnóstico clínico. 5) Sem dosagens.","pista":"Idade acima de 45 anos com sintomas típicos.","mud":"Se ela fosse histerectomizada ou usuária de SIU-LNG, sem critério menstrual, o FSH poderia ajudar.","cmp":"Acima de 45 com sintomas típicos: clínico. Abaixo de 45 com irregularidade: investigar outras causas.","arm":"Dosar FSH e estradiol de rotina na perimenopausa.","regra":"Climatério típico depois dos 45: diagnóstico clínico.","cf":"Na perimenopausa, um FSH normal não exclui a transição, porque ele oscila dia a dia.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulo 2.4 (a regra central e erro caro e frequente); FEBRASGO, Propedêutica mínima no climatério (Position Statement nº 5, 2022)."},{"n":2,"sub":"Menopausa precoce","eixo":"Definições e diagnóstico","comp":"Diferenciar IOP, menopausa precoce e habitual","enun":"Mulher de 43 anos teve a última menstruação há 14 meses, com fogachos. Gestação excluída, TSH e prolactina normais, FSH elevado em duas dosagens. Como classificar e qual implicação clínica é a mais importante?","ops":[["Menopausa precoce, marcador de maior risco cardiovascular e ósseo.","Correta: a menopausa entre 40 e 45 anos é precoce e se associa a maior risco cardiovascular e ósseo."],["Insuficiência ovariana prematura, porque ocorreu antes dos 45 anos.","Errada: a IOP é definida antes dos 40 anos."],["Menopausa habitual, sem implicações além dos sintomas vasomotores.","Errada: a habitual ocorre entre 45 e 55 anos, com média de 51."],["Hipogonadismo hipogonadotrófico, pela amenorreia antes dos 45 anos.","Errada: o FSH elevado indica causa ovariana, não central."]],"conc":"IOP: antes de 40 anos (cerca de 1%), terapia hormonal formal até cerca de 50. Menopausa precoce: 40 a 45 (cerca de 5%), marcador de risco cardiovascular, ósseo e de mortalidade. Habitual: 45 a 55 (média 51). Tardia: após 55.","rac":"1) 43 anos. 2) 12 meses ou mais de amenorreia. 3) FSH alto. 4) Entre 40 e 45: precoce. 5) Atenção a coração e osso.","pista":"Idade entre 40 e 45 anos.","mud":"Com 38 anos, a classificação seria IOP, com terapia hormonal até cerca de 50 anos.","cmp":"IOP: menos de 40. Precoce: 40 a 45. Habitual: 45 a 55.","arm":"Chamar de IOP qualquer menopausa antes dos 45.","regra":"Antes dos 40: IOP. Entre 40 e 45: precoce.","cf":"A menopausa antes dos 45 anos é fator de risco que indica densitometria antes dos 65 anos.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), tabela 8.1 (os quatro tempos do envelhecimento ovariano) e módulo 4.2 (populações especiais)."},{"n":3,"sub":"Discriminador de ouro do hipoestrogenismo","eixo":"Sintomas vasomotores e síndrome geniturinária","comp":"Distinguir hipoestrogenismo ovariano de central","enun":"Mulher de 47 anos com amenorreia há 8 meses, fogachos e secura vaginal. Beta-hCG negativo. FSH de 3,1 mUI/mL, estradiol baixo, prolactina de 112 ng/mL. Qual é a interpretação?","ops":[["Causa central, não climatério; investigar a hiperprolactinemia.","Correta: hipoestrogenismo com FSH baixo ou normal indica causa central, não ovariana."],["Síndrome do climatério típica, sem necessidade de outra investigação.","Errada: na menopausa o FSH é alto; FSH baixo afasta a causa ovariana."],["Insuficiência ovariana prematura, pela amenorreia antes dos 50 anos.","Errada: a IOP é antes de 40 anos e cursa com FSH elevado."],["Perimenopausa com FSH em oscilação, devendo-se iniciar terapia hormonal.","Errada: a prolactina muito elevada aponta outra causa a investigar antes de qualquer hormônio."]],"conc":"Na menopausa, o hipoestrogenismo vem com FSH alto (hipergonadotrófico). Amenorreia e sintomas hipoestrogênicos com FSH baixo ou normal indicam causa central (hipotálamo ou hipófise), investigada como amenorreia.","rac":"1) Sintomas hipoestrogênicos. 2) FSH baixo. 3) Prolactina alta. 4) Causa central: hiperprolactinemia. 5) Investigar.","pista":"FSH baixo com estradiol baixo.","mud":"Com FSH de 68 mUI/mL e prolactina normal, o quadro seria de transição menopausal.","cmp":"Menopausa: FSH alto. Causa central: FSH baixo ou normal.","arm":"Atribuir ao climatério todo fogacho na meia-idade.","regra":"Hipoestrogenismo com FSH baixo não é menopausa.","cf":"Hipertireoidismo, feocromocitoma e medicamentos também entram no diagnóstico diferencial do fogacho.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulo 2.5 (diagnóstico diferencial do fogacho e discriminador de ouro)."},{"n":4,"sub":"Síndrome geniturinária com doença cardiovascular","eixo":"Sintomas vasomotores e síndrome geniturinária","comp":"Tratar a síndrome geniturinária em mulher com contraindicação à terapia sistêmica","enun":"Mulher de 61 anos, com infarto agudo do miocárdio há 2 anos, refere secura vaginal, ardor e dispareunia que prejudicam a vida sexual; sem fogachos. Exame com mucosa pálida, adelgaçada e com petéquias. Lubrificantes não resolveram. Qual é a conduta?","ops":[["Estrogênio vaginal em baixa dose, sem necessidade de progestagênio.","Correta: o estrogênio vaginal de baixa dose pode ser usado mesmo com doença cardiovascular estabelecida."],["Terapia hormonal sistêmica transdérmica, que não aumenta o risco cardiovascular.","Errada: com DCV manifesta, não se recomenda THM sistêmica."],["Nenhum tratamento hormonal, porque o infarto prévio contraindica qualquer estrogênio.","Errada: a via vaginal em baixa dose é exceção importante."],["Estrogênio vaginal associado obrigatoriamente a progestagênio oral contínuo.","Errada: a dose vaginal baixa tem efeito local e dispensa progestagênio."]],"conc":"Síndrome geniturinária: primeira linha não hormonal com hidratantes regulares e lubrificantes; estrogênio vaginal em baixa dose é o pilar, com efeito local, sem necessidade de progestagênio e utilizável mesmo com fatores de risco ou DCV estabelecida.","rac":"1) SGM sintomática. 2) Sem fogachos. 3) IAM prévio: THM sistêmica contraindicada. 4) Estrogênio vaginal em baixa dose. 5) Sem progestagênio.","pista":"Doença cardiovascular com sintomas só geniturinários.","mud":"Se houvesse sangramento uterino em uso de estrogênio vaginal, seria necessária investigação endometrial imediata.","cmp":"Terapia vaginal: trata só SGM. Terapia sistêmica: trata fogacho e osso, contraindicada na DCV.","arm":"Negar estrogênio vaginal por risco cardiovascular.","regra":"Coração doente não condena à dispareunia.","cf":"Em sobrevivente de câncer de mama, o estrogênio vaginal deve ser decidido com a oncologia.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.2c (exceção importantíssima) e 3.5 (síndrome geniturinária); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":5,"sub":"Janela de oportunidade","eixo":"Terapia hormonal","comp":"Aplicar a janela de oportunidade da terapia hormonal","enun":"Mulher de 66 anos, menopausa aos 50, procura tratamento por fogachos intensos que voltaram há 6 meses. Hipertensa controlada, dislipidêmica. Nunca usou terapia hormonal. Qual é a conduta mais adequada?","ops":[["Não iniciar terapia hormonal sistêmica e oferecer tratamento não hormonal eficaz.","Correta: ela está fora da janela (mais de 10 anos de menopausa e mais de 60 anos), quando iniciar THM eleva o risco absoluto cardiovascular e de TEV."],["Iniciar terapia hormonal oral combinada na menor dose, porque a hipertensão está controlada.","Errada: o problema é o início fora da janela de oportunidade."],["Iniciar estrogênio transdérmico isolado, porque a via transdérmica anula o risco.","Errada: a via não resolve o início tardio, e ela tem útero, exigindo progestagênio."],["Iniciar tibolona, que não tem restrição de janela por ser progestagênio.","Errada: a tibolona tem ação estrogênica e segue a mesma lógica de risco."]],"conc":"A THM deve ser iniciada nos primeiros 10 anos após a menopausa e/ou antes dos 60 anos. Depois disso, iniciar pode elevar o risco absoluto de doença coronariana, TEV e AVC. Matriz: menos de 10 anos e risco baixo, liberada; menos de 10 e intermediário, preferir transdérmica; mais de 10 anos ou risco alto, não recomendada.","rac":"1) 66 anos. 2) 16 anos de menopausa. 3) Fora da janela. 4) Não iniciar THM sistêmica. 5) Opções não hormonais.","pista":"Mais de 10 anos de menopausa e mais de 60 anos.","mud":"Com 53 anos e 3 anos de menopausa, risco cardiovascular baixo, a THM poderia ser iniciada.","cmp":"Dentro da janela: liberada conforme risco. Fora da janela: não iniciar.","arm":"Achar que a via transdérmica autoriza iniciar fora da janela.","regra":"Janela: menos de 10 anos de menopausa ou menos de 60 anos.","cf":"Não há duração máxima pré-estabelecida para quem iniciou dentro da janela; reavalia-se a cada consulta.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulo 3.2b (janela de oportunidade e matriz de Kaunitz e Manson/NAMS); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":6,"sub":"Fogacho em sobrevivente de câncer de mama","eixo":"Alternativas não hormonais","comp":"Escolher terapia não hormonal compatível com o tamoxifeno","enun":"Mulher de 49 anos, em uso de tamoxifeno há 1 ano após câncer de mama luminal, tem fogachos intensos que prejudicam o sono. Qual é a melhor opção terapêutica?","ops":[["Venlafaxina ou desvenlafaxina, evitando paroxetina e fluoxetina.","Correta: a THM sistêmica é contraindicada; venlafaxina não inibe a CYP2D6 de forma relevante."],["Terapia hormonal combinada em baixa dose por até 2 anos.","Errada: câncer de mama é contraindicação formal à THM sistêmica."],["Paroxetina 7,5 mg, por ser o ISRS com melhor resposta nos fogachos.","Errada: a paroxetina inibe a CYP2D6 e reduz a conversão de tamoxifeno em endoxifeno."],["Implante hormonal manipulado de gestrinona, por não conter estrogênio.","Errada: implantes manipulados não são recomendados pelas sociedades brasileiras."]],"conc":"Com contraindicação à THM, terapias não hormonais com eficácia comprovada: ISRS/IRSN (paroxetina, escitalopram, citalopram, venlafaxina, desvenlafaxina), gabapentina e fezolinetanto. Com tamoxifeno, evitar paroxetina e fluoxetina (inibidores potentes da CYP2D6).","rac":"1) Câncer de mama: THM sistêmica contraindicada. 2) Tamoxifeno: atenção à CYP2D6. 3) Venlafaxina ou desvenlafaxina.","pista":"Uso de tamoxifeno.","mud":"Sem tamoxifeno, a paroxetina seria opção aceitável.","cmp":"Com tamoxifeno: venlafaxina. Sintoma noturno predominante: gabapentina.","arm":"Prescrever paroxetina com tamoxifeno.","regra":"Tamoxifeno: fuja da paroxetina e da fluoxetina.","cf":"O fogacho dessas pacientes é frequentemente iatrogênico, causado pelo próprio tamoxifeno ou pelo inibidor de aromatase.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.4 (terapias não hormonais, com a ressalva farmacológica rotulada como inferência didática) e 4.2 (sobrevivente de câncer de mama); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":7,"sub":"Escolha da via","eixo":"Terapia hormonal","comp":"Escolher a via de administração do estrogênio","enun":"Mulher de 52 anos, menopausa há 2 anos, com fogachos intensos, IMC 33 kg/m², triglicérides de 460 mg/dL, sem doença cardiovascular, risco cardiovascular calculado de 4% em 10 anos. Útero presente. Qual é a melhor prescrição?","ops":[["Estradiol transdérmico associado a progestagênio.","Correta: obesidade e triglicérides acima de 400 tornam a via transdérmica mais adequada, e o útero exige progestagênio."],["Estradiol oral isolado, já que o risco cardiovascular é baixo.","Errada: o estrogênio oral eleva triglicérides e, com útero, o progestagênio é obrigatório."],["Estrogênios conjugados orais com acetato de medroxiprogesterona.","Errada: a via oral é pior com hipertrigliceridemia e obesidade."],["Nenhuma terapia hormonal, porque a obesidade é contraindicação formal.","Errada: a obesidade não contraindica a THM, apenas favorece a via transdérmica."]],"conc":"O estrogênio oral sofre primeira passagem hepática: eleva triglicérides e fatores de coagulação, com maior risco de TEV (RR cerca de 1,40); o transdérmico não aumenta o TEV (RR cerca de 0,96). Prefere-se a transdérmica em obesidade, dislipidemia, diabetes, síndrome metabólica, risco intermediário, triglicérides acima de 400 e hipertensão controlada.","rac":"1) Dentro da janela, risco baixo. 2) Obesidade e TG 460. 3) Via transdérmica. 4) Útero: progestagênio.","pista":"Triglicérides acima de 400 mg/dL.","mud":"Mulher magra, sem comorbidades e com risco baixo poderia usar a via oral por preferência.","cmp":"Oral: primeira passagem, mais TG e TEV. Transdérmica: sem primeira passagem.","arm":"Usar via oral em hipertrigliceridemia.","regra":"Metabolismo complicado: estrogênio pela pele.","cf":"Na via oral, recomenda-se perfil lipídico anual.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.2d (detalhe dos triglicérides), 3.2e (primeira passagem hepática) e tabela 8.3; Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":8,"sub":"Regra do progestagênio","eixo":"Terapia hormonal","comp":"Indicar o progestagênio conforme a presença do útero","enun":"Duas mulheres de 53 anos, ambas com fogachos intensos e dentro da janela de oportunidade, iniciarão estrogênio sistêmico. A primeira tem útero; a segunda fez histerectomia total por miomas. Qual prescrição está correta?","ops":[["Primeira: estrogênio com progestagênio. Segunda: estrogênio isolado.","Correta: útero presente com estrogênio sistêmico exige progestagênio; histerectomizada usa estrogênio isolado."],["Ambas: estrogênio isolado, porque o progestagênio aumenta o risco de câncer de mama.","Errada: omitir o progestagênio com útero aumenta o risco de câncer de endométrio."],["Ambas: estrogênio com progestagênio, para proteger as mamas.","Errada: o progestagênio protege o endométrio; na histerectomizada não é necessário."],["Primeira: progestagênio isolado. Segunda: tibolona.","Errada: o progestagênio isolado não é a THM padrão para fogachos."]],"conc":"Regra do progestagênio: útero presente com estrogênio sistêmico exige progestagênio (impede a proliferação endometrial); histerectomizada usa estrogênio isolado; estrogênio vaginal em baixa dose dispensa progestagênio.","rac":"1) Separar pela presença do útero. 2) Útero: progestagênio. 3) Sem útero: estrogênio isolado.","pista":"Presença ou ausência de útero.","mud":"Com estrogênio vaginal em baixa dose, nenhuma das duas precisaria de progestagênio.","cmp":"Com útero: combinado. Sem útero: isolado. Vaginal baixa dose: isolado.","arm":"Omitir o progestagênio em quem tem útero.","regra":"Tem útero, tem progestagênio.","cf":"No esquema contínuo combinado, sangramento irregular persistente exige avaliação endometrial.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulo 3.2f (regra do progestagênio e regimes) e módulo 3.3."},{"n":9,"sub":"Exames antes de prescrever","eixo":"Terapia hormonal","comp":"Solicitar a propedêutica mínima antes da terapia hormonal","enun":"Mulher de 50 anos, menopausa há 1 ano, com fogachos intensos, sem comorbidades, deseja iniciar terapia hormonal. Exame físico normal. Segundo a FEBRASGO 2022 e a diretriz de 2024, quais exames são necessários antes da prescrição?","ops":[["Mamografia nos últimos 12 meses, perfil lipídico e glicemia de jejum.","Correta: a mamografia exclui contraindicação, e lipídios e glicemia alimentam o cálculo do risco cardiovascular que define a via."],["FSH, estradiol, ultrassonografia transvaginal e densitometria.","Errada: são exames sem função definida antes de iniciar a THM nessa paciente."],["Ressonância das mamas, coagulograma completo e pesquisa de trombofilias.","Errada: não fazem parte da propedêutica mínima de rotina."],["Nenhum exame, porque a paciente é jovem e saudável.","Errada: a mamografia recente e o risco cardiovascular são necessários."]],"conc":"Antes da THM: mamografia há menos de 12 meses, perfil lipídico e glicemia de jejum. Não são check-up: a mamografia exclui contraindicação e os demais alimentam a calculadora de risco cardiovascular. Outros exames só conforme achados.","rac":"1) Candidata à THM. 2) Excluir câncer de mama. 3) Calcular risco cardiovascular. 4) Mamografia, lipídios e glicemia.","pista":"Propedêutica com função definida.","mud":"Com sangramento uterino anormal, a ultrassonografia transvaginal passaria a ser indicada.","cmp":"Exame com função: mamografia, lipídios, glicemia. Exame sem função: FSH, USG de rotina.","arm":"Fazer bateria de exames amplos antes da THM.","regra":"Peça o exame que muda a decisão.","cf":"A ultrassonografia pélvica não é rastreamento em assintomáticas de risco habitual.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.1 (princípio que organiza tudo) e 3.2d (exames antes de prescrever); FEBRASGO, Propedêutica mínima no climatério (Position Statement nº 5, 2022); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":10,"sub":"O que não é indicação","eixo":"Terapia hormonal","comp":"Reconhecer o que não é indicação de terapia hormonal","enun":"Mulher de 55 anos, menopausa há 4 anos, assintomática, com densitometria normal, pede terapia hormonal 'para prevenir infarto e demência', após ler uma reportagem. Qual é a orientação?","ops":[["Não indicar: terapia hormonal não serve para prevenção primária.","Correta: não se prescreve THM para prevenir infarto, AVC ou demência."],["Indicar, porque iniciada na janela de oportunidade ela reduz infarto.","Errada: mesmo com possíveis efeitos favoráveis na janela, a THM não é ferramenta de prevenção cardiovascular primária."],["Indicar estrogênio isolado, que tem menor risco de câncer de mama.","Errada: ela tem útero e não tem indicação."],["Indicar tibolona, específica para prevenção de demência.","Errada: não há indicação de hormônio para prevenir demência."]],"conc":"Indicações de THM: SVM moderados a intensos (padrão-ouro), SGM (preferir via vaginal), prevenção de perda óssea e fraturas (especialmente com SVM) e IOP. Não se recomenda THM para prevenção primária de condições crônicas em assintomáticas.","rac":"1) Assintomática. 2) Sem osteopenia. 3) Pedido por prevenção cardiovascular e cognitiva. 4) Não é indicação.","pista":"Ausência de sintomas.","mud":"Fogachos moderados a intensos tornariam a THM indicada, dentro da janela.","cmp":"Indicação: sintoma, osso, IOP. Não indicação: prevenção de infarto e demência.","arm":"Prescrever hormônio 'para o coração'.","regra":"THM trata sintoma, não previne infarto.","cf":"A remoção da tarja preta pela FDA em 2025 e 2026 é decisão norte-americana e não muda as indicações das diretrizes brasileiras.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.2a (o que não é indicação) e 4.3 (atualizações 2025-2026); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":11,"sub":"Risco de câncer de mama com terapia hormonal","eixo":"Terapia hormonal","comp":"Comunicar a magnitude do risco mamário da terapia hormonal","enun":"Mulher de 51 anos com útero, fogachos intensos, pergunta qual é o risco de câncer de mama com a terapia hormonal combinada. Segundo os dados do WHI reproduzidos na diretriz brasileira de 2024, qual é a informação correta?","ops":[["Aumento pequeno (menos de 1 caso por 1.000 mulheres/ano), ligado ao progestagênio.","Correta: o braço combinado teve aumento discreto, e o braço de estrogênio isolado teve risco menor que o placebo."],["O risco triplica já no primeiro ano de uso, independentemente do esquema.","Errada: o aumento é pequeno e depende do componente progestagênico."],["Não há nenhuma associação entre terapia hormonal e câncer de mama.","Errada: há aumento discreto no esquema combinado."],["O risco é maior com estrogênio isolado, por isso o progestagênio é protetor para a mama.","Errada: o progestagênio protege o endométrio; o estrogênio isolado teve risco mamário menor."]],"conc":"WHI: câncer de mama no esquema combinado 2,4% x 1,9% (HR 1,24), menos de 1 caso adicional por 1.000 mulheres-ano; estrogênio isolado com risco menor que placebo. AVC e TEV aumentam; doença coronariana sem diferença significativa. O progestagênio não pode ser omitido em quem tem útero.","rac":"1) Pergunta sobre magnitude. 2) Aumento pequeno. 3) Associado ao progestagênio. 4) Informar em números absolutos.","pista":"Pedido de número absoluto de risco.","mud":"Se ela fosse histerectomizada, o estrogênio isolado não aumentaria o risco mamário no WHI.","cmp":"Combinado: risco mamário discreto. Estrogênio isolado: risco menor que placebo.","arm":"Superestimar o risco ou omitir o progestagênio para 'proteger a mama'.","regra":"Risco de mama da THM: pequeno, absoluto e ligado ao progestagênio.","cf":"O WHI incluiu mulheres mais velhas, longe da menopausa e com acetato de medroxiprogesterona, o que explica parte dos riscos observados.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.3 (riscos da THM: os números reais) e 4.1 (WHI); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":12,"sub":"Terapias sem eficácia","eixo":"Alternativas não hormonais","comp":"Orientar sobre terapias sem eficácia e manipulados","enun":"Mulher de 54 anos com fogachos moderados e contraindicação à terapia hormonal pergunta sobre fitoestrógenos de soja, black cohosh e implantes hormonais manipulados 'bioidênticos'. Segundo a diretriz brasileira de 2024, qual é a orientação?","ops":[["Fitoterápicos não superam o placebo, e manipulados não são recomendados.","Correta: as sociedades brasileiras posicionam-se contra implantes e hormônios manipulados."],["Implantes manipulados são preferíveis por serem 'naturais' e sem riscos.","Errada: não há evidência de eficácia e segurança, e a rotulagem é inadequada."],["Fitoestrógenos têm eficácia igual à terapia hormonal e podem substituí-la.","Errada: não são significativamente melhores que placebo."],["Black cohosh é a primeira linha não hormonal recomendada pela diretriz.","Errada: as opções com eficácia comprovada são ISRS/IRSN, gabapentina e fezolinetante."]],"conc":"Sem eficácia superior ao placebo: acupuntura, relaxamento, fitoestrógenos, exercícios e black cohosh (até 50% respondem ao placebo nos ensaios). Contra: implantes hormonais manipulados e 'modulação hormonal'. Com eficácia: ISRS/IRSN, gabapentina, fezolinetante.","rac":"1) Contraindicação à THM. 2) Opções sem eficácia ou inseguras. 3) Orientar e oferecer opções com eficácia.","pista":"Produtos naturais e manipulados.","mud":"Se ela perguntasse por opção eficaz, seriam ISRS/IRSN, gabapentina ou fezolinetante.","cmp":"Estradiol e progesterona aprovados: não são o alvo da crítica. Manipulados e implantes: não recomendados.","arm":"Confundir hormônio industrializado idêntico ao endógeno com manipulado 'bioidêntico'.","regra":"Manipulado não é sinônimo de seguro.","cf":"O fezolinetanto foi aprovado pela Anvisa em junho de 2026, posterior às diretrizes da disciplina.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.4 (sem eficácia superior ao placebo e posição contra) e 4.3; Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":13,"sub":"Gabapentina","eixo":"Alternativas não hormonais","comp":"Escolher a opção não hormonal pelo perfil de sintomas","enun":"Mulher de 57 anos com trombose venosa profunda prévia, que recusa terapia hormonal, tem fogachos predominantemente noturnos que a acordam várias vezes. Já usa antidepressivo tricíclico para dor, sem possibilidade de troca. Qual opção não hormonal é especialmente útil nesse perfil?","ops":[["Gabapentina à noite.","Correta: a gabapentina tem eficácia comprovada e é útil quando o sintoma predominante é noturno."],["Estrogênio transdérmico, porque não aumenta o risco de TEV.","Errada: ela recusa terapia hormonal; a via transdérmica só seria considerada se a decisão fosse pela THM."],["Black cohosh em dose alta.","Errada: não é superior ao placebo."],["Implante de testosterona manipulado.","Errada: implantes manipulados não são recomendados."]],"conc":"Gabapentina, ISRS/IRSN e fezolinetante são terapias não hormonais com eficácia comprovada para SVM. A gabapentina é útil sobretudo quando o sintoma predominante é noturno.","rac":"1) Recusa hormônio. 2) Sintomas noturnos. 3) Já usa antidepressivo. 4) Gabapentina à noite.","pista":"Fogachos que acordam à noite.","mud":"Sem antidepressivo em uso, um IRSN também seria opção.","cmp":"Noturno: gabapentina. Com tamoxifeno: venlafaxina.","arm":"Indicar fitoterápicos sem eficácia.","regra":"Fogacho da madrugada: lembre da gabapentina.","cf":"História de TEV torna a THM em geral não recomendada; se indicada, a via transdérmica é a de menor risco.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 3.2c (contraindicações relativas: TEV) e 3.4 (com eficácia comprovada); Diretriz Brasileira sobre a Saúde Cardiovascular no Climatério e na Menopausa (SBC/FEBRASGO/SOBRAC, 2024)."},{"n":14,"sub":"Indicação de densitometria","eixo":"Osteoporose","comp":"Indicar a densitometria óssea","enun":"Mulher de 58 anos, menopausa aos 49, tabagista atual de 20 cigarros por dia, sem fraturas, IMC 24 kg/m². Segundo a FEBRASGO 2022, ela tem indicação de densitometria óssea?","ops":[["Sim: tabagismo atual é fator de risco que antecipa a densitometria.","Correta: o tabagismo atual é fator de risco que antecipa a densitometria."],["Não, porque a densitometria só é indicada a partir dos 65 anos em todas as mulheres.","Errada: abaixo de 65 anos, um fator de risco já indica o exame."],["Não, porque a menopausa ocorreu depois dos 45 anos.","Errada: a menopausa antes de 45 é um dos fatores, mas o tabagismo atual já basta."],["Sim, mas apenas se o cálcio sérico estiver baixo.","Errada: o cálcio sérico não define a indicação de densitometria."]],"conc":"Densitometria: todas as mulheres de 65 anos ou mais; abaixo de 65 com ao menos um fator de risco (corticoide acima de 5 mg/dia por 3 meses ou mais, baixo peso, tabagismo atual, artrite reumatoide, menopausa antes dos 45, fratura por fragilidade, pai ou mãe com fratura de quadril, etilismo). Na dúvida, FRAX-Brasil com NOGG.","rac":"1) 58 anos. 2) Tabagismo atual. 3) Um fator de risco. 4) Densitometria.","pista":"Tabagismo atual.","mud":"Sem fatores de risco, aos 58 anos, a densitometria esperaria os 65 ou se guiaria pelo FRAX.","cmp":"65 anos ou mais: todas. Menos de 65: se houver fator de risco.","arm":"Esperar os 65 anos em quem já tem fator de risco.","regra":"Fator de risco antes dos 65: densitometria.","cf":"Pelo NOGG, quem fica acima do limiar superior do FRAX é candidata a tratamento independentemente da densitometria.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulo 3.6 (quem faz densitometria e FRAX/NOGG) e algoritmo 9.4; FEBRASGO, Propedêutica mínima no climatério (Position Statement nº 5, 2022)."},{"n":15,"sub":"Fratura vertebral assintomática","eixo":"Osteoporose","comp":"Indicar radiografia toracolombar em assintomáticas","enun":"Mulher de 68 anos, assintomática, mede hoje 1,58 m; refere que a maior estatura da vida adulta foi 1,63 m. Qual exame está indicado para investigar fratura vertebral?","ops":[["Radiografia da coluna toracolombar, pela perda de estatura de 4 cm ou mais.","Correta: perda histórica de 4 cm ou mais é critério para buscar fratura vertebral assintomática."],["Nenhum exame, porque fraturas vertebrais sempre causam dor.","Errada: até 70% das fraturas vertebrais podem ser assintomáticas."],["Ressonância magnética da coluna total como primeiro exame.","Errada: a radiografia toracolombar é o exame indicado nesse cenário."],["Cintilografia óssea para excluir metástases.","Errada: não há indicação de cintilografia."]],"conc":"Fraturas por fragilidade ocorrem sem trauma ou com trauma menor e podem ser assintomáticas em até 70%. Radiografia toracolombar em assintomáticas: fratura por baixo impacto após os 50, corticoide prolongado, perda de estatura histórica de 4 cm ou mais ou prospectiva de 2 cm ou mais, idade acima de 70 com T-score de -1,0 ou menos, ou entre 65 e 69 com T-score de -1,5 ou menos.","rac":"1) Perda de 5 cm da estatura máxima. 2) Critério de 4 cm ou mais. 3) Radiografia toracolombar.","pista":"Perda de estatura de 5 cm.","mud":"Perda histórica de 2 cm sem outros critérios não indicaria a radiografia.","cmp":"Histórica: 4 cm ou mais. Prospectiva entre consultas: 2 cm ou mais.","arm":"Achar que fratura vertebral sempre dói.","regra":"Encolheu 4 cm: radiografe a coluna.","cf":"Uma fratura vertebral por fragilidade muda a classificação e a conduta, mesmo com densitometria pouco alterada.","fonte":"Aula HTML Climatério (Aulas-GO, aula 03), módulos 2.3 (estatura no exame físico) e 3.6 (quando pedir radiografia toracolombar); FEBRASGO, Propedêutica mínima no climatério (Position Statement nº 5, 2022)."}]},{"id":"M09","titulo":"Síndromes hipertensivas na gestação","bloco":1,"grupo":"C","q":[{"n":1,"sub":"Hipertensão antes de 20 semanas","eixo":"Classificação","comp":"Diagnosticar hipertensão arterial crônica na gestação","enun":"Gestante de 34 anos, G2P1, na primeira consulta com 11 semanas, tem PA de 148 x 94 mmHg, confirmada após 4 horas e novamente em outra consulta. Sem proteinúria, sem sintomas, nunca mediu a pressão antes. Como classificar?","ops":[["Hipertensão arterial crônica, por estar presente antes de 20 semanas.","Correta: hipertensão antes de 20 semanas (ou prévia à gestação) define HAC."],["Hipertensão gestacional, porque nunca havia sido diagnosticada antes.","Errada: a hipertensão gestacional surge após 20 semanas."],["Pré-eclâmpsia precoce, pela idade gestacional inferior a 34 semanas.","Errada: a pré-eclâmpsia ocorre após 20 semanas e exige proteinúria ou disfunção de órgão-alvo."],["Pressão normal para a gestação, pois o corte diagnóstico na gravidez é 150 x 100 mmHg.","Errada: o corte é 140 x 90 mmHg em duas ocasiões com 4 horas de intervalo."]],"conc":"Hipertensão na gestação: PAS de 140 ou mais e/ou PAD de 90 ou mais em duas ocasiões com 4 horas de intervalo. Cinco quadros (ACOG 2013): HAC (antes de 20 semanas ou persistente 12 semanas após o parto), HG (após 20 semanas sem proteinúria nem lesão de órgão-alvo), PE, HAC com PE sobreposta e eclâmpsia.","rac":"1) PA de 148 x 94 confirmada. 2) 11 semanas. 3) Antes de 20 semanas. 4) HAC.","pista":"Hipertensão detectada no primeiro trimestre.","mud":"Se a mesma PA surgisse com 30 semanas em gestante antes normotensa, sem proteinúria, seria hipertensão gestacional.","cmp":"HAC: antes de 20 semanas. HG e PE: após 20 semanas.","arm":"Usar o corte de 130 x 80 do ACC/AHA para diagnosticar hipertensão na gestação.","regra":"Antes de 20 semanas, hipertensão é crônica.","cf":"Na HAC, solicita-se proteinúria de 24 horas basal, que servirá de régua para diagnosticar pré-eclâmpsia sobreposta.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulos 7.1 (definição e os cinco quadros) e 7.3 (propedêutica da HAC), slides 4 e 7 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":2,"sub":"Hipertensão gestacional","eixo":"Classificação","comp":"Classificar a hipertensão gestacional e reconhecer seu caráter provisório","enun":"Primigesta de 25 anos, 33 semanas, previamente normotensa, tem PA de 146 x 92 mmHg confirmada. Relação proteína/creatinina urinária de 0,12, plaquetas, creatinina e transaminases normais, sem sintomas. Feto com crescimento adequado. Qual é o diagnóstico e o cuidado principal?","ops":[["Hipertensão gestacional, diagnóstico provisório que exige vigilância.","Correta: hipertensão após 20 semanas sem proteinúria nem lesão de órgão-alvo; até 25% evoluem para PE."],["Pré-eclâmpsia sem sinais de gravidade, porque a PA está acima de 140 x 90.","Errada: sem proteinúria e sem disfunção de órgão-alvo, não há critério de pré-eclâmpsia."],["Hipertensão arterial crônica, porque a pressão persistirá após o parto.","Errada: a HAC é definida antes de 20 semanas ou pela persistência após 12 semanas do parto."],["Pré-eclâmpsia sobreposta, pela idade gestacional abaixo de 34 semanas.","Errada: a sobreposição exige hipertensão crônica prévia."]],"conc":"Hipertensão gestacional: PA de 140 x 90 ou mais após 20 semanas, sem proteinúria e sem lesão de órgão-alvo, em previamente normotensa, que normaliza até 12 semanas após o parto. Até 25% evoluem para PE (sobretudo se surge antes de 34 semanas): diagnóstico provisório.","rac":"1) Normotensa antes. 2) Hipertensão após 20 semanas. 3) P/C de 0,12, abaixo de 0,3. 4) Exames normais. 5) Hipertensão gestacional com vigilância.","pista":"Relação P/C abaixo de 0,3 com exames normais.","mud":"P/C de 0,3 ou mais ou plaquetas abaixo de 100.000 mudariam para pré-eclâmpsia.","cmp":"HG: sem proteinúria nem órgão-alvo. PE: com proteinúria e/ou disfunção de órgão-alvo.","arm":"Rotular como pré-eclâmpsia só pela pressão alta.","regra":"Hipertensão gestacional é diagnóstico provisório.","cf":"Pela RBEHG, a resolução da hipertensão gestacional é oferecida a partir de 37 semanas, com decisão compartilhada.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulos 7.1 (os cinco quadros) e 7.12 (momento do parto: hipertensão gestacional); Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":3,"sub":"Pré-eclâmpsia sobreposta por disfunção uteroplacentária","eixo":"Classificação","comp":"Reconhecer as três portas de entrada da pré-eclâmpsia sobreposta","enun":"Gestante de 36 anos com hipertensão crônica em uso de metildopa, PA estável em torno de 132 x 84 mmHg, proteinúria de 24 horas basal de 180 mg que se mantém estável. Com 30 semanas, a ultrassonografia mostra PFE no P2 com IP da artéria umbilical acima do P95. Pelo Protocolo RBEHG 2025, como classificar?","ops":[["Pré-eclâmpsia sobreposta, pela disfunção uteroplacentária com restrição de crescimento e Doppler alterado.","Correta: a RBEHG inclui a disfunção uteroplacentária como critério de sobreposição, mesmo com PA e proteinúria estáveis."],["Hipertensão crônica isolada, porque a PA e a proteinúria não pioraram.","Errada: esse é o critério mais fácil de esquecer; a restrição fetal com Doppler alterado já define sobreposição."],["Hipertensão gestacional, por surgir alteração após 20 semanas.","Errada: ela já era hipertensa antes da gestação."],["Pré-eclâmpsia sobreposta apenas se a proteinúria triplicar em relação ao valor basal.","Errada: a proteinúria é uma das três portas de entrada, não a única."]],"conc":"Na hipertensa crônica, após 20 semanas, a PE sobreposta é diagnosticada por: proteinúria nova ou aumento acima de 3 vezes do valor inicial; disfunção de órgão-alvo; ou disfunção uteroplacentária (restrição de crescimento, Doppler alterado, descolamento ou óbito fetal).","rac":"1) HAC. 2) PA e proteinúria estáveis. 3) Restrição fetal com Doppler alterado. 4) Disfunção uteroplacentária. 5) PE sobreposta.","pista":"Feto restrito com Doppler alterado em hipertensa crônica.","mud":"Com crescimento fetal normal e exames estáveis, seria hipertensão crônica sem sobreposição.","cmp":"Sobreposição por proteinúria, por órgão-alvo ou pela placenta.","arm":"Exigir piora pressórica ou proteinúrica para diagnosticar sobreposição.","regra":"Placenta doente em hipertensa crônica já é pré-eclâmpsia sobreposta.","cf":"A PE sobreposta ocorre em 20 a 50% das hipertensas crônicas.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.1 (critérios de pré-eclâmpsia sobreposta: três portas de entrada), slide 11 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":4,"sub":"Proteinúria significativa","eixo":"Critérios diagnósticos e de gravidade","comp":"Interpretar os métodos de detecção de proteinúria","enun":"Gestante de 31 semanas, previamente normotensa, com PA de 150 x 96 mmHg confirmada. Fita urinária negativa para proteína. Relação proteína/creatinina em amostra isolada de 0,42. Qual é a interpretação?","ops":[["Há proteinúria significativa; o diagnóstico é de pré-eclâmpsia.","Correta: a relação P/C de 0,3 ou mais define proteinúria significativa, e a fita tem alto falso-negativo."],["Não há proteinúria, porque a fita negativa exclui o diagnóstico.","Errada: a fita detecta só albumina e tem alta taxa de falso-negativo."],["É preciso confirmar com proteinúria de 24 horas antes de qualquer conclusão.","Errada: a relação P/C é o método preferencial e já confirma o diagnóstico."],["O resultado é limítrofe e exige repetir a relação P/C semanalmente.","Errada: depois de confirmada, a proteinúria não precisa ser repetida."]],"conc":"Proteinúria significativa (RBEHG 2025, ordem de preferência): relação P/C de 0,3 ou mais (preferida); proteinúria de 24 horas de 300 mg ou mais; fita de 2+ ou mais só na indisponibilidade dos demais. Fita negativa não exclui. Não repetir proteinúria depois de confirmada.","rac":"1) Hipertensão após 20 semanas. 2) P/C de 0,42. 3) Proteinúria significativa. 4) Pré-eclâmpsia.","pista":"P/C acima de 0,3 apesar da fita negativa.","mud":"Com P/C de 0,2 e exames normais, o diagnóstico seria hipertensão gestacional.","cmp":"P/C: preferido. 24 h: alternativa. Fita: último recurso.","arm":"Confiar na fita negativa.","regra":"Proteinúria se mede pela relação P/C; a fita engana.","cf":"A proteinúria faz o diagnóstico, não o prognóstico; o seguimento se apoia em plaquetas, creatinina e transaminases.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.3 (proteinúria significativa: três métodos e duas regras); Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":5,"sub":"Critérios laboratoriais de deterioração","eixo":"Critérios diagnósticos e de gravidade","comp":"Aplicar os critérios clássicos de gravidade","enun":"Pelos critérios clássicos de gravidade apresentados no slide 24 (linhagem ACOG), gestante de 32 semanas com pré-eclâmpsia, PA de 150 x 98 mmHg, assintomática, tem plaquetas de 88.000/mm³, creatinina de 0,8 mg/dL e TGO de 52 U/L (referência até 40). Como classificar?","ops":[["Pré-eclâmpsia com sinais de deterioração, pela plaquetopenia abaixo de 100.000/mm³.","Correta: plaquetas abaixo de 100.000 são critério laboratorial de gravidade pelos cortes clássicos."],["Pré-eclâmpsia sem sinais de gravidade, porque a paciente está assintomática e a PA está abaixo de 160 x 110.","Errada: um único critério laboratorial já define deterioração."],["Pré-eclâmpsia com gravidade, pela TGO acima de 40 U/L.","Errada: pelos cortes clássicos, a elevação de enzimas precisa ser de 2 vezes o normal; o achado decisivo é a plaquetopenia."],["Síndrome HELLP completa, pela combinação de plaquetopenia e TGO elevada.","Errada: a HELLP completa exige hemólise e enzimas elevadas, além de plaquetas abaixo de 100.000."]],"conc":"Critérios clássicos de gravidade (slide 24): PAS de 160 ou mais ou PAD de 110 ou mais, sintomas (cefaleia, distúrbios visuais, epigastralgia), plaquetas abaixo de 100.000, creatinina acima de 1,1, enzimas 2 vezes o normal, edema pulmonar, oligúria. A ISSHP 2022 (slide 30) usa cortes mais sensíveis: creatinina de 1,0 ou mais, plaquetas abaixo de 150.000, TGO ou TGP acima de 40.","rac":"1) Referência clássica. 2) Plaquetas de 88.000. 3) Abaixo de 100.000. 4) Com sinais de deterioração.","pista":"Plaquetas abaixo de 100.000.","mud":"Pela ISSHP 2022, a TGO de 52 também já seria critério.","cmp":"Clássico: plaquetas abaixo de 100.000, creatinina acima de 1,1. ISSHP: abaixo de 150.000, creatinina de 1,0 ou mais.","arm":"Exigir sintomas para classificar deterioração.","regra":"Um critério laboratorial basta.","cf":"A RBEHG recomenda falar em 'com ou sem sinais de deterioração' em vez de 'leve' e 'grave'.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.2 (critérios de gravidade e controvérsia entre os slides 24 e 30) e tabela 8.2 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":6,"sub":"Quem recebe profilaxia","eixo":"Predição e prevenção","comp":"Identificar a indicação de prevenção da pré-eclâmpsia por fatores clínicos","enun":"Primigesta de 37 anos, IMC 33 kg/m², 11 semanas, sem outras doenças. Pela regra do slide 17 e do Protocolo RBEHG 2025, ela tem indicação de prevenção de pré-eclâmpsia?","ops":[["Sim: tem dois ou mais fatores moderados, o que indica AAS e cálcio.","Correta: 1 fator alto ou pelo menos 2 moderados definem quem recebe prevenção."],["Não, porque nenhum fator de alto risco está presente.","Errada: dois ou mais fatores moderados também indicam prevenção."],["Só depois de um Doppler de artérias uterinas alterado.","Errada: o Doppler isolado não é método de rastreio, e o marcador clínico já basta."],["Só se a pressão arterial estiver acima de 130 x 80 mmHg no primeiro trimestre.","Errada: a indicação é pelos fatores de risco, não pela PA atual."]],"conc":"Regra (RBEHG 2025): 1 fator alto (PE prévia, HAC, DM pré-gestacional, DRC, LES/SAAF, gestação múltipla) ou 2 moderados (nuliparidade, obesidade, idade de 35 a 40 anos ou mais, história familiar, intervalo acima de 10 anos, FIV, afrodescendência, novo parceiro) indicam prevenção.","rac":"1) Nulípara. 2) Obesa. 3) 37 anos. 4) Três fatores moderados. 5) Prevenção indicada.","pista":"Soma de fatores moderados.","mud":"Uma primigesta de 26 anos com IMC normal e sem outros fatores não teria indicação por marcador clínico.","cmp":"Alto: basta 1. Moderado: precisa de 2.","arm":"Exigir fator alto ou Doppler alterado.","regra":"Um alto ou dois moderados: previna.","cf":"Se o rastreamento combinado fosse negativo, a prevenção seria mantida pelos marcadores clínicos.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.5 (estratificação alto x moderado e duas regras que a prova adora), slide 17 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":7,"sub":"Esquema do AAS e do cálcio","eixo":"Predição e prevenção","comp":"Prescrever corretamente o AAS e o cálcio na prevenção","enun":"Gestante de 12 semanas com pré-eclâmpsia na gestação anterior. Pelo Protocolo RBEHG 2025, qual prescrição preventiva está correta?","ops":[["AAS 100 mg à noite até 36 semanas e cálcio de 0,5 a 1 g/dia.","Correta: é o esquema brasileiro de AAS e de cálcio em população de baixa ingesta."],["AAS 500 mg pela manhã até o parto e vitamina C com vitamina E.","Errada: a dose é baixa e noturna, suspensa com 36 semanas, e vitaminas antioxidantes não previnem."],["Enoxaparina profilática e restrição de sal desde já.","Errada: enoxaparina e restrição de sal não previnem pré-eclâmpsia."],["AAS 100 mg a partir de 28 semanas e repouso no leito.","Errada: o início é na 12ª semana, e o repouso absoluto é contraindicado."]],"conc":"AAS (RBEHG 2025): 100 mg à noite, início na 12ª semana (ideal 12 a 16, benefício até 20), suspenso com 36 semanas ou se surgir PE. Cálcio: carbonato 500 mg a 1 g/dia em população de baixa ingesta, junto às refeições e longe do ferro. Não previnem: vitaminas C, E, D, ômega-3, ácido fólico, heparina, dipiridamol, restrição de sal, repouso.","rac":"1) PE prévia: alto risco. 2) 12 semanas: janela ideal. 3) AAS 100 mg à noite. 4) Cálcio. 5) Até 36 semanas.","pista":"Dose brasileira e horário noturno.","mud":"Pela FMF (ASPRE), a dose seria 150 mg à noite; nos EUA, 81 mg.","cmp":"RBEHG: 100 mg. ASPRE: 150 mg. ACOG: 81 mg.","arm":"Usar vitaminas antioxidantes ou heparina como prevenção.","regra":"AAS 100 mg à noite, de 12 a 36 semanas.","cf":"O racional do AAS em baixa dose é inibir o tromboxano plaquetário, poupando a prostaciclina endotelial.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.6 (AAS, cálcio e o que não previne) e módulo 7.4 (racional do AAS), slide 18 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":8,"sub":"Losartana no início da gestação","eixo":"Anti-hipertensivos","comp":"Conduzir o uso de fármacos contraindicados e escolher o anti-hipertensivo","enun":"Mulher de 33 anos com hipertensão crônica em uso de losartana descobre gestação de 7 semanas e está angustiada com medo de malformação. Qual é a conduta e a orientação?","ops":[["Trocar por metildopa e tranquilizar: não é teratogênico.","Correta: BRA e IECA lesam o rim fetal a partir do 2º trimestre, sem risco de malformação no 1º."],["Manter a losartana até 20 semanas, quando o risco fetal começa.","Errada: deve ser suspensa assim que a gestação é confirmada."],["Indicar interrupção da gestação pelo alto risco de malformações.","Errada: não há risco de malformação pelo uso no primeiro trimestre."],["Trocar por enalapril, que é seguro na gestação.","Errada: o IECA também é contraindicado na gestação."]],"conc":"Proibidos na gestação: IECA, BRA e inibidores diretos da renina (disgenesia tubular, oligoâmnio, hipoplasia pulmonar a partir do 2º trimestre). São fetotóxicos, não teratogênicos. Primeira escolha no Brasil: metildopa e nifedipino; betabloqueadores e hidralazina oral como 3ª linha; labetalol indisponível no Brasil.","rac":"1) BRA em uso. 2) Gestação de 7 semanas. 3) Suspender e trocar. 4) Tranquilizar: não teratogênico.","pista":"Uso de BRA descoberto no primeiro trimestre.","mud":"Uso continuado no 2º ou 3º trimestre exigiria vigiar líquido amniótico e rim fetal.","cmp":"Proibidos: IECA, BRA, alisquireno. Liberados: metildopa, nifedipino, anlodipino.","arm":"Indicar interrupção por uso precoce de BRA.","regra":"IECA e BRA: fetotóxicos, não teratogênicos.","cf":"No puerpério, os IECA voltam a ser permitidos.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.7 (fármacos liberados e contraindicados), slides 8, 9, 28 e 29 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":9,"sub":"Tratamento da crise hipertensiva","eixo":"Anti-hipertensivos","comp":"Tratar a crise hipertensiva na gestação","enun":"Gestante de 35 semanas com pré-eclâmpsia chega com PA de 172 x 114 mmHg, confirmada em 15 minutos. Sem acesso venoso ainda disponível. Qual é a medicação inicial adequada pelo slide 34?","ops":[["Nifedipino 10 mg via oral, sem via sublingual, repetindo se necessário.","Correta: o nifedipino oral é primeira linha; a via sublingual é conduta ultrapassada."],["Nifedipino 10 mg por via sublingual, para queda rápida da pressão.","Errada: a via sublingual provoca queda pressórica muito rápida e não deve ser usada."],["Captopril 25 mg sublingual, como na urgência hipertensiva fora da gestação.","Errada: o IECA é contraindicado na gestação."],["Furosemida 40 mg IV, para reduzir a volemia.","Errada: a pré-eclâmpsia já cursa com contração volêmica; diurético só em edema pulmonar."]],"conc":"Crise hipertensiva: PAS de 160 ou mais ou PAD de 110 ou mais, confirmada em 15 minutos e tratada em 30 a 60 minutos. Objetivo: reduzir 15 a 25%, evitando quedas bruscas. Hidralazina 5 mg IV a cada 20 min (máximo 30 mg) ou nifedipino 10 mg VO, depois 20 mg a cada 20 min (máximo 120 mg); nitroprussiato em edema pulmonar.","rac":"1) Crise confirmada. 2) Sem acesso venoso. 3) Nifedipino oral. 4) Reduzir 15 a 25%. 5) Associar MgSO4.","pista":"Ausência de acesso venoso.","mud":"Com acesso venoso disponível, a hidralazina 5 mg IV também seria primeira linha.","cmp":"Hidralazina: IV, ação máxima em 20 min. Nifedipino: VO, ação máxima em 30 a 40 min.","arm":"Usar nifedipino sublingual ou captopril.","regra":"Crise: nifedipino oral ou hidralazina IV, sem derrubar a pressão.","cf":"Toda gestante com pré-eclâmpsia em crise hipertensiva também deve receber sulfato de magnésio.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.8 (crise hipertensiva), slide 34 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":10,"sub":"Magnésio na crise assintomática","eixo":"Sulfato de magnésio e eclâmpsia","comp":"Indicar MgSO4 na crise hipertensiva mesmo sem sintomas","enun":"Gestante de 34 semanas com pré-eclâmpsia apresenta PA de 164 x 112 mmHg, sem cefaleia, alterações visuais ou epigastralgia, reflexos normais. Após nifedipino a PA cai para 148 x 96. Pelo Protocolo RBEHG 2025, qual medida adicional é indicada?","ops":[["Sulfato de magnésio, mesmo sem sintomas, pela crise hipertensiva.","Correta: toda PE em crise hipertensiva deve receber MgSO4, mesmo assintomática."],["Nenhuma; como está assintomática e a PA caiu, basta manter o anti-hipertensivo.","Errada: a eclâmpsia pode ocorrer sem pródromos, e a crise é janela de prevenção."],["Diazepam 10 mg IV como profilaxia de convulsão.","Errada: o diazepam é inferior ao MgSO4 para prevenção e tratamento da eclâmpsia."],["Fenitoína profilática, por ter menos efeitos colaterais que o magnésio.","Errada: o MgSO4 é superior à fenitoína."]],"conc":"Indicações de MgSO4: eclâmpsia, iminência de eclâmpsia, HELLP, PE com deterioração, crise hipertensiva ou PA de difícil controle (mesmo assintomática, RBEHG 2025) e neuroproteção fetal entre 23 e 32 semanas. É superior a diazepam e fenitoína.","rac":"1) PE. 2) Crise hipertensiva. 3) Assintomática. 4) MgSO4 indicado mesmo assim.","pista":"Crise hipertensiva em pré-eclâmpsia, ainda que sem sintomas.","mud":"Uma PE com PA de 146 x 94, sem sintomas e sem alteração laboratorial, não teria indicação de MgSO4.","cmp":"Iminência: cefaleia, alterações visuais, hiperreflexia, epigastralgia. Crise: PA de 160 x 110 ou mais.","arm":"Deixar de sulfatar por ausência de sintomas.","regra":"PE em crise: magnésio.","cf":"O MgSO4 é mantido por 24 horas após o parto ou após a última crise convulsiva.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulos 7.8 (ponto novo do RBEHG 2025) e 7.9 (indicações), slides 38 e 39 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":11,"sub":"Esquema de Pritchard","eixo":"Sulfato de magnésio e eclâmpsia","comp":"Escolher o esquema de MgSO4 conforme o recurso","enun":"Em hospital de pequeno porte sem bomba de infusão, gestante de 36 semanas com iminência de eclâmpsia precisa ser sulfatada e transferida em ambulância não equipada. Qual esquema é o mais adequado?","ops":[["Pritchard: 4 g IV com 10 g IM (5 g em cada glúteo), depois 5 g IM a cada 4 horas.","Correta: dispensa bomba de infusão e garante 4 horas de nível terapêutico no transporte."],["Zuspan: 4 g IV seguidos de 1 a 2 g por hora em bomba de infusão contínua.","Errada: exige bomba de infusão, indisponível no cenário."],["4 g IV em bolus único e transferência sem manutenção.","Errada: sem manutenção, o nível terapêutico cai e a paciente fica desprotegida."],["10 mL de MgSO4 a 10% IV como dose de ataque.","Errada: 10 mL a 10% contém só 1 g; a dose de ataque é 4 g."]],"conc":"Esquemas de igual eficácia: Zuspan (4 g IV lento e 1 a 2 g/h em bomba) e Pritchard (4 g IV mais 10 g IM e depois 5 g IM a cada 4 h). MgSO4 a 50%: 1 mL = 500 mg; a 10%: 1 mL = 100 mg. Ataque de 4 g = 8 mL a 50% ou 40 mL a 10%.","rac":"1) Sem bomba. 2) Transporte. 3) Pritchard.","pista":"Ausência de bomba de infusão e transferência.","mud":"Em serviço com bomba de infusão, o Zuspan seria adequado.","cmp":"Zuspan: IV contínuo. Pritchard: IM a cada 4 horas.","arm":"Confundir as concentrações a 50% e a 10%.","regra":"Sem bomba ou em transporte: Pritchard.","cf":"Para reduzir necrose muscular, a dose IM de 10 g pode ser dividida em quatro grupamentos de 2,5 g.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.9 (esquemas de administração e concentrações; doses do Quadro 11 rotuladas como inferência didática); Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":12,"sub":"Intoxicação por magnésio","eixo":"Sulfato de magnésio e eclâmpsia","comp":"Reconhecer e tratar a intoxicação por MgSO4","enun":"Puérpera de 4 horas, em uso de MgSO4 por pré-eclâmpsia com deterioração (esquema de Zuspan), está sonolenta, com reflexo patelar abolido, frequência respiratória de 10 irpm e diurese de 15 mL/h. Qual é a conduta imediata?","ops":[["Suspender a infusão e administrar gluconato de cálcio 10%, 1 g IV lentamente.","Correta: são sinais de intoxicação; o gluconato de cálcio é o antídoto."],["Aumentar a infusão para 3 g por hora, pela sonolência sugerir iminência de eclâmpsia.","Errada: os sinais são de intoxicação, não de iminência."],["Manter a infusão e apenas reavaliar os reflexos em 4 horas.","Errada: a depressão respiratória exige suspensão e antídoto imediatos."],["Trocar o magnésio por fenitoína e manter sem monitorização.","Errada: a prioridade é reverter a intoxicação e manter vigilância."]],"conc":"Vigilância antes de cada dose IM e periodicamente na infusão: reflexo patelar presente, FR de 16 irpm ou mais, diurese de 25 mL/h ou mais. Intoxicação: suspender; antídoto gluconato de cálcio 10%, 1 g IV lento. Sequência: reflexo, respiração, coração. Creatinina acima de 1,2: metade da manutenção.","rac":"1) Reflexo abolido. 2) FR 10. 3) Oligúria. 4) Intoxicação. 5) Suspender e gluconato de cálcio.","pista":"Reflexo abolido com depressão respiratória e oligúria.","mud":"Reflexo presente, FR de 18 e diurese de 40 mL/h permitiriam manter a infusão.","cmp":"Faixa terapêutica: 4 a 7 mEq/L. Reflexo abolido: 8 a 10. Parada respiratória: 12 ou mais.","arm":"Interpretar intoxicação como piora neurológica da pré-eclâmpsia.","regra":"Sem reflexo, com respiração lenta: pare o magnésio e dê cálcio.","cf":"A oligúria favorece o acúmulo; com função renal comprometida, a manutenção é reduzida à metade.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.9 (vigilância da intoxicação, antídoto e insuficiência renal), slides 40 e 41 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":13,"sub":"Eclâmpsia e bradicardia fetal","eixo":"Sulfato de magnésio e eclâmpsia","comp":"Priorizar a estabilização materna na eclâmpsia","enun":"Gestante de 37 semanas convulsiona na enfermaria. Após a crise, PA de 168 x 112 mmHg, saturação de 90%, e a cardiotocografia mostra bradicardia fetal de 90 bpm há 3 minutos. Qual é a sequência correta?","ops":[["Estabilizar a mãe com MgSO4 e só depois decidir a via.","Correta: a bradicardia pós-convulsão costuma reverter em 3 a 5 minutos com a estabilização materna."],["Cesárea de emergência imediata pela bradicardia fetal.","Errada: operar mãe hipoxêmica e hipertensa durante ou logo após a convulsão é erro grave."],["Diazepam IV e fórceps de alívio imediato.","Errada: o diazepam é inferior ao MgSO4, e não há condições para parto instrumental."],["Aguardar nova convulsão para iniciar o MgSO4, se ela se repetir.","Errada: o MgSO4 deve ser iniciado já, para prevenir recorrência."]],"conc":"Eclâmpsia: prevenir hipóxia e trauma (decúbito lateral, O2, aspiração, acesso), MgSO4, anti-hipertensivo parenteral se necessário, monitorização, propedêutica, vaga em CTI e parto após estabilização. A bradicardia fetal transitória decorre da hipoxemia materna. Eclâmpsia é indicação de resolução, não de cesárea imediata.","rac":"1) Convulsão. 2) Mãe hipoxêmica e hipertensa. 3) Estabilizar. 4) MgSO4. 5) Reavaliar o feto. 6) Decidir a via.","pista":"Bradicardia fetal logo após a convulsão.","mud":"Bradicardia persistente apesar da estabilização materna completa justificaria a resolução de urgência.","cmp":"Eclâmpsia: indicação de resolver a gestação. Cesárea: só por indicação obstétrica.","arm":"Indicar cesárea durante a convulsão.","regra":"Na eclâmpsia, estabilize a mãe e o feto melhora.","cf":"Convulsão em uso de MgSO4 recebe meia dose de ataque (2 g IV) e manutenção de 2 g/h.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.10 (eclâmpsia: conduta imediata e a armadilha mais clássica), slides 42 e 43 do material da disciplina '280826 HIPERTENSÃO NA GRAVIDEZ.pptx'; Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":14,"sub":"Pré-eclâmpsia sem deterioração no termo","eixo":"Momento do parto","comp":"Definir o momento do parto na pré-eclâmpsia","enun":"Gestante de 37 semanas e 2 dias com pré-eclâmpsia sem sinais de deterioração, PA controlada com metildopa, exames estáveis e vitalidade fetal normal. Colo com Bishop 4. Pelo Protocolo RBEHG 2025, qual é a conduta?","ops":[["Resolver a gestação agora, com preparo do colo e preferência pela via vaginal.","Correta: na PE sem deterioração, a conduta expectante vai só até 37 semanas."],["Manter conduta expectante até 40 semanas, já que não há deterioração.","Errada: a partir do termo, resolver reduz riscos maternos sem piorar resultados perinatais (HYPITAT)."],["Cesárea eletiva imediata, porque a pré-eclâmpsia indica cesárea.","Errada: PE não é, por si só, indicação de cesárea."],["Aguardar até 39 semanas e repetir a proteinúria semanalmente para decidir.","Errada: não se aguarda além de 37 semanas, e a proteinúria não se repete."]],"conc":"Momento do parto (RBEHG 2025): HG, oferecer a partir de 37 semanas; PE sem deterioração, expectante até 37 e resolver; PE com deterioração abaixo de 23 semanas, interromper; de 23 a 34, expectante internada; de 34 a 37, individualizar; HELLP, eclâmpsia, descolamento, refratariedade e outras, resolver em qualquer IG. Via obstétrica; colo desfavorável: Foley e/ou misoprostol.","rac":"1) PE sem deterioração. 2) 37 semanas. 3) Resolver. 4) Colo desfavorável: preparar. 5) Via vaginal preferida.","pista":"Idade gestacional de 37 semanas.","mud":"Com 31 semanas e sem deterioração, a conduta seria expectante com vigilância.","cmp":"PE sem deterioração: 37 semanas. HG: oferecer a partir de 37.","arm":"Indicar cesárea pela pré-eclâmpsia em si.","regra":"Pré-eclâmpsia no termo: resolva.","cf":"Ao usar ocitocina, preferir solução concentrada em soro fisiológico, pelo risco de retenção hídrica e hiponatremia.","fonte":"Aula HTML Síndromes Hipertensivas na Gestação (Aulas-GO, aula 05), módulo 7.12 (tabela de momento da resolução e via de parto); Protocolo RBEHG 2025 (Rede Brasileira de Estudos sobre Hipertensão na Gravidez)."},{"n":15,"sub":"Puerpério da pré-eclâmpsia","eixo":"Puerpério","comp":"Conduzir o puerpério e o seguimento após pré-eclâmpsia","enun":"Puérpera de 2 dias, após pré-eclâmpsia com deterioração, amamentando, mantém PA de 152 x 98 mmHg com nifedipino. Pergunta se o problema 'acabou com o parto'. Qual conduta e orientação estão corretas?","ops":[["Ajustar a medicação, rever em 7 a 10 dias e orientar o risco futuro.","Correta: o puerpério é período de alto risco e a pré-eclâmpsia é marcador de risco cardiovascular futuro."],["Suspender o anti-hipertensivo, porque a doença é curada pela saída da placenta.","Errada: a maioria das mortes por doença hipertensiva ocorre após o parto."],["Iniciar anticoncepcional combinado para regular a pressão.","Errada: em quem permanece hipertensa, evi
