ão mais vigorosa e monitorização em terapia intensiva.","cmp":"Ringer lactato: preferido. Agressiva fixa: abandonada.","arm":"Prescrever volume excessivo de forma protocolar.","regra":"Pancreatite: hidrate de forma moderada e reavalie.","cf":"Ureia em queda e hematócrito estável indicam resposta adequada.","fonte":"de-Madaria E et al. Aggressive or moderate fluid resuscitation in acute pancreatitis (WATERFALL). N Engl J Med 2022;387:989-1000; ACG Guideline (Tenner S et al., 2024)."},{"n":5,"sub":"Nutrição","comp":"Iniciar dieta na pancreatite leve","tags":[],"rel":[],"enun":"Paciente com pancreatite aguda leve no segundo dia, com dor controlada, sem vômitos e com fome. Qual é a conduta nutricional?","ops":[["Reintroduzir dieta oral precoce conforme tolerância.","Correta: na pancreatite leve, a dieta oral precoce (em até 24 a 72 horas) é segura e reduz o tempo de internação."],["Manter jejum até normalização completa da lipase.","Errada: a lipase não guia a reintrodução da dieta, e o jejum prolongado não traz benefício."],["Iniciar nutrição parenteral total para repouso pancreático.","Errada: a parenteral não é indicada na forma leve e aumenta complicações infecciosas."],["Dieta líquida clara obrigatória por 5 dias antes de qualquer sólido.","Errada: não é necessário escalonar com dieta líquida; dieta sólida branda pode ser iniciada diretamente."]],"conc":"A alimentação precoce mantém a barreira intestinal e reduz translocação bacteriana. Na pancreatite leve, a dieta oral é reiniciada assim que tolerada; na grave, prefere-se nutrição enteral (gástrica ou pós-pilórica) à parenteral.","rac":"Dor controlada e fome no segundo dia: liberar dieta oral branda. Não é preciso esperar enzimas normais.","pista":"Tolerância clínica (fome, sem vômitos, dor controlada).","mud":"Na pancreatite grave sem tolerância oral, inicia-se nutrição enteral por sonda em até 72 horas.","cmp":"Enteral: preferida. Parenteral: só se a enteral for impossível ou insuficiente.","arm":"Guiar a dieta pela lipase.","regra":"Pancreatite leve: comer cedo.","cf":"A sonda nasogástrica é tão segura quanto a nasojejunal na maioria dos pacientes graves.","fonte":"ACG Guideline (Tenner S et al., Am J Gastroenterol 2024); AGA Guideline on Initial Management of Acute Pancreatitis (Crockett SD et al., Gastroenterology 2018)."},{"n":6,"sub":"Antibiótico profilático","comp":"Evitar antibiótico na necrose estéril","tags":[],"rel":[],"enun":"Paciente com pancreatite aguda grave tem TC no quinto dia com necrose de 40% do pâncreas, sem gás, estável e afebril. Qual é a conduta em relação aos antibióticos?","ops":[["Não usar antibiótico profilático na necrose estéril.","Correta: antibiótico profilático na necrose estéril não reduz mortalidade nem infecção e favorece resistência e fungos."],["Iniciar carbapenêmico profilático em toda necrose acima de 30%.","Errada: essa prática foi abandonada por falta de benefício."],["Iniciar fluconazol profilático para prevenir infecção fúngica.","Errada: não há indicação de antifúngico profilático."],["Realizar punção diagnóstica da necrose em todos os pacientes, mesmo estáveis.","Errada: a punção é reservada à dúvida diagnóstica de infecção, não à rotina."]],"conc":"A necrose pancreática pode infectar, geralmente após a primeira semana. O antibiótico é indicado na necrose infectada (gás na TC, piora clínica, bacteremia) ou em infecções extrapancreáticas, não como profilaxia.","rac":"Necrose estéril, paciente estável: sem antibiótico. Monitorar febre, leucocitose e piora após 7 a 10 dias.","pista":"Necrose sem gás em paciente estável.","mud":"Gás na necrose ou deterioração clínica após a segunda semana indicaria necrose infectada e antibiótico com boa penetração (carbapenêmico, quinolona, metronidazol).","cmp":"Necrose estéril: sem antibiótico. Necrose infectada: antibiótico e abordagem step-up.","arm":"Prescrever carbapenêmico para toda necrose.","regra":"Necrose estéril não leva antibiótico.","cf":"Colangite associada é indicação de antibiótico independentemente da necrose.","fonte":"ACG Guideline (Tenner S et al., 2024); AGA Guideline (Crockett SD et al., 2018)."},{"n":7,"sub":"CPRE na pancreatite biliar","comp":"Indicar CPRE de urgência","tags":[],"rel":[],"enun":"Mulher de 60 anos com pancreatite aguda biliar apresenta, no segundo dia, febre de 39 °C, icterícia, bilirrubina total de 6 mg/dL e colédoco dilatado na ultrassonografia. Qual é a conduta?","ops":[["CPRE com papilotomia em até 24 horas, associada a antibiótico, por colangite.","Correta: pancreatite biliar com colangite é indicação de CPRE de urgência."],["CPRE de rotina em toda pancreatite biliar, mesmo sem colangite ou obstrução.","Errada: sem colangite ou obstrução persistente, a CPRE precoce não traz benefício."],["Colecistectomia de urgência no mesmo dia.","Errada: na colangite, primeiro se desobstrui a via biliar; a colecistectomia é feita depois."],["Apenas antibiótico e observação por 7 dias.","Errada: colangite com obstrução exige drenagem biliar, não só antibiótico."]],"conc":"Na pancreatite biliar, a CPRE urgente (em até 24 horas) é indicada na colangite. Em obstrução biliar persistente sem colangite, a CPRE pode ser feita com menor urgência. Na ausência de ambas, não há benefício.","rac":"Febre, icterícia e dor (tríade de Charcot) com colédoco dilatado: colangite. Antibiótico e CPRE em até 24 horas.","pista":"Febre com icterícia e colédoco dilatado.","mud":"Pancreatite biliar sem colangite e com bilirrubina em queda não exigiria CPRE.","cmp":"Com colangite: CPRE urgente. Sem colangite: CPRE não rotineira.","arm":"Indicar CPRE para todos com pancreatite biliar.","regra":"Colangite na pancreatite: CPRE em 24 horas.","cf":"Em dúvida sobre cálculo residual no colédoco, a colangiorressonância ou a ecoendoscopia evitam CPRE desnecessária.","fonte":"ACG Guideline (Tenner S et al., 2024); Tokyo Guidelines 2018 (Miura F et al., J Hepatobiliary Pancreat Sci 2018)."},{"n":8,"sub":"Colecistectomia","comp":"Definir o momento da colecistectomia","tags":[],"rel":[],"enun":"Paciente com pancreatite aguda biliar leve melhora em 3 dias, aceita dieta e está sem dor. Quando deve ser feita a colecistectomia?","ops":[["Na mesma internação, antes da alta.","Correta: na pancreatite biliar leve, a colecistectomia na mesma internação reduz recorrência e readmissões."],["Após 6 meses, para permitir resolução completa da inflamação.","Errada: adiar aumenta o risco de novos episódios de pancreatite, colecistite e colangite."],["Apenas se houver novo episódio de pancreatite.","Errada: a recorrência é frequente; a colecistectomia é indicada após o primeiro episódio."],["Não é necessária, pois o cálculo já foi eliminado.","Errada: a vesícula com cálculos continua sendo fonte de recorrência."]],"conc":"A pancreatite biliar tende a recorrer se a vesícula com cálculos for mantida. Na forma leve, recomenda-se colecistectomia na mesma internação. Na forma grave com coleções, ela é adiada até a resolução da inflamação (geralmente mais de 6 semanas).","rac":"Leve, recuperado: colecistectomia antes da alta.","pista":"Pancreatite biliar leve já resolvida.","mud":"Pancreatite necrosante com coleções levaria a adiar a cirurgia.","cmp":"Leve: mesma internação. Grave com coleções: adiar.","arm":"Dar alta e marcar a cirurgia para meses depois.","regra":"Pancreatite biliar leve: tire a vesícula antes da alta.","cf":"Em pacientes sem condições cirúrgicas, a papilotomia endoscópica reduz a recorrência.","fonte":"ACG Guideline (Tenner S et al., 2024); da Costa DW et al. PONCHO trial. Lancet 2015;386:1261-1268."},{"n":9,"sub":"Necrose infectada","comp":"Aplicar a abordagem step-up","tags":[],"rel":[],"enun":"Paciente na quarta semana de pancreatite necrosante apresenta febre, piora clínica e TC com coleção necrótica encapsulada contendo bolhas de gás. Qual é a conduta mais adequada?","ops":[["Antibiótico e abordagem step-up minimamente invasiva.","Correta: necrose infectada encapsulada é tratada com antibiótico e intervenção escalonada, adiada idealmente até o encapsulamento."],["Necrosectomia aberta imediata por laparotomia.","Errada: a necrosectomia aberta precoce tem maior morbimortalidade que a abordagem step-up."],["Manter apenas observação, pois toda necrose se resolve sozinha.","Errada: a necrose infectada com piora clínica exige antibiótico e drenagem."],["Pancreatectomia total de urgência.","Errada: a pancreatectomia não é tratamento da necrose infectada."]],"conc":"Gás em coleção necrótica sugere infecção. O tratamento é antibiótico e, se necessário, drenagem. A abordagem step-up (drenagem percutânea ou endoscópica e necrosectomia minimamente invasiva se preciso) reduz complicações em comparação à cirurgia aberta.","rac":"Quarta semana, necrose encapsulada com gás e piora: necrose infectada. Antibiótico e drenagem escalonada.","pista":"Gás na coleção necrótica após encapsulamento.","mud":"Necrose estéril assintomática não exigiria drenagem.","cmp":"Coleção necrótica aguda: antes de 4 semanas. Necrose encapsulada: após 4 semanas, melhor momento para intervir.","arm":"Operar cedo e de forma aberta.","regra":"Necrose infectada: antibiótico e step-up, de preferência após 4 semanas.","cf":"Pseudocisto (coleção líquida sem necrose após 4 semanas) só é drenado se sintomático ou complicado.","fonte":"van Santvoort HC et al. A step-up approach or open necrosectomy (PANTER). N Engl J Med 2010;362:1491-1502; ACG Guideline (Tenner S et al., 2024)."},{"n":10,"sub":"Hipertrigliceridemia","comp":"Reconhecer e tratar a pancreatite por hipertrigliceridemia","tags":[],"rel":[],"enun":"Homem de 38 anos, diabético mal controlado, com pancreatite aguda. Ultrassonografia sem cálculos, nega álcool. Soro lactescente; triglicerídeos de 2.800 mg/dL. Qual é a conduta específica?","ops":[["Insulina intravenosa para reduzir os triglicerídeos e, depois, fibrato.","Correta: triglicerídeos acima de 1.000 mg/dL causam pancreatite; insulina intravenosa reduz rapidamente os triglicerídeos, e o fibrato previne recorrência."],["Colecistectomia, pois toda pancreatite sem álcool é biliar.","Errada: não há cálculos, e a causa evidente é a hipertrigliceridemia."],["Estatina isolada em dose alta na fase aguda.","Errada: estatinas reduzem pouco os triglicerídeos; o fibrato é a classe de escolha a longo prazo."],["Dieta rica em gorduras para corrigir a desnutrição.","Errada: gorduras na dieta elevam os quilomícrons e os triglicerídeos."]],"conc":"Hipertrigliceridemia acima de 1.000 mg/dL (risco maior acima de 2.000) é a terceira causa de pancreatite aguda. Fatores: diabetes descompensado, álcool, obesidade, gestação, fármacos e dislipidemias genéticas.","rac":"Triglicerídeos de 2.800 em diabético descompensado: pancreatite por hipertrigliceridemia. Insulina intravenosa reduz triglicerídeos; plasmaférese em casos selecionados. Depois, fibrato, dieta e controle glicêmico.","pista":"Triglicerídeos acima de 1.000 mg/dL e soro lactescente.","mud":"Triglicerídeos de 400 mg/dL não explicariam a pancreatite; buscar outras causas.","cmp":"Hipertrigliceridemia: acima de 1.000 mg/dL. Hipercalcemia: outra causa metabólica a pesquisar.","arm":"Interpretar a lipase falsamente baixa no soro lactescente como ausência de pancreatite.","regra":"Soro leitoso e pancreatite: dose os triglicerídeos.","cf":"A amilase pode vir falsamente normal na hipertrigliceridemia grave.","fonte":"ACG Guideline (Tenner S et al., 2024); Endocrine Society Guideline on Hypertriglyceridemia (Berglund L et al., J Clin Endocrinol Metab 2012)."}]},{"id":"M13","titulo":"Abdome agudo","bloco":1,"q":[{"n":1,"sub":"Apendicite: semiologia","comp":"Reconhecer os sinais clássicos","tags":[],"rel":[],"enun":"Rapaz de 19 anos com dor periumbilical há 18 horas que migrou para a fossa ilíaca direita, anorexia e febre de 37,9 °C. A palpação profunda da fossa ilíaca esquerda provoca dor na fossa ilíaca direita. Como se chama esse sinal?","ops":[["Sinal de Rovsing.","Correta: dor na fossa ilíaca direita à compressão da fossa ilíaca esquerda é o sinal de Rovsing, sugestivo de apendicite."],["Sinal de Blumberg.","Errada: Blumberg é a dor à descompressão brusca, indicando irritação peritoneal, não a dor referida pela compressão contralateral."],["Sinal de Murphy.","Errada: Murphy é a parada da inspiração à palpação do hipocôndrio direito, típica da colecistite."],["Sinal do psoas.","Errada: o sinal do psoas é a dor à extensão do quadril, sugerindo apêndice retrocecal."]],"conc":"Na apendicite, a dor costuma começar periumbilical (visceral) e migrar para a fossa ilíaca direita (somática), com anorexia, náuseas e febre baixa. Sinais: Blumberg, Rovsing, psoas, obturador e dor no ponto de McBurney.","rac":"Compressão à esquerda, dor à direita: deslocamento de gás e conteúdo que distende o ceco inflamado. É o sinal de Rovsing.","pista":"Dor referida no lado oposto ao comprimido.","mud":"Dor à rotação interna do quadril flexionado (sinal do obturador) sugeriria apêndice pélvico.","cmp":"Rovsing: dor contralateral. Blumberg: descompressão. Psoas: retrocecal. Obturador: pélvico.","arm":"Confundir Rovsing com Blumberg.","regra":"Comprimiu à esquerda e doeu à direita: Rovsing.","cf":"O escore de Alvarado combina sintomas, sinais e leucograma para estratificar a probabilidade de apendicite.","fonte":"WSES Jerusalem Guidelines on Acute Appendicitis (Di Saverio S et al., World J Emerg Surg 2020;15:27); Sabiston Textbook of Surgery, 21ª ed."},{"n":2,"sub":"Apendicite na gestação","comp":"Escolher o exame de imagem","tags":[],"rel":[],"enun":"Gestante de 24 semanas com dor em flanco direito, náuseas e febre baixa. O exame é duvidoso, e a hipótese de apendicite precisa ser confirmada. Qual é a sequência de imagem recomendada?","ops":[["Ultrassonografia e, se inconclusiva, ressonância sem gadolínio.","Correta: na gestante, a ultrassonografia é o primeiro exame e a ressonância sem contraste, a segunda linha, evitando radiação."],["Tomografia com contraste como primeira escolha, pela maior acurácia.","Errada: a TC expõe o feto à radiação e fica reservada a casos em que a ressonância não está disponível."],["Radiografia simples de abdome, suficiente para o diagnóstico.","Errada: a radiografia tem baixa acurácia para apendicite."],["Nenhum exame, indicando laparotomia diagnóstica em toda gestante com dor.","Errada: a imagem reduz apendicectomias negativas, que também trazem risco fetal."]],"conc":"A apendicite é a causa cirúrgica não obstétrica mais comum na gestação. O útero desloca o apêndice para cima, tornando a dor atípica (flanco ou hipocôndrio direito). A perfuração aumenta o risco de perda fetal.","rac":"Gestante com suspeita de apendicite: ultrassonografia primeiro; se inconclusiva, ressonância sem gadolínio. Confirmada, apendicectomia (laparoscópica é segura).","pista":"Gestação no segundo trimestre.","mud":"Fora da gestação, em adulto com apresentação duvidosa, a TC seria o exame de maior acurácia.","cmp":"Gestante: ultrassonografia e ressonância. Criança: ultrassonografia primeiro. Adulto: TC.","arm":"Pedir TC como primeiro exame na gestante.","regra":"Gestante com dor à direita: ultrassonografia, depois ressonância.","cf":"A leucocitose é fisiológica na gestação e tem menor valor diagnóstico.","fonte":"WSES Jerusalem Guidelines (Di Saverio S et al., 2020); ACR Appropriateness Criteria — Right Lower Quadrant Pain."},{"n":3,"sub":"Colecistite aguda","comp":"Definir o momento da colecistectomia","tags":[],"rel":[],"enun":"Mulher de 45 anos com dor em hipocôndrio direito há 36 horas, febre e sinal de Murphy. Ultrassonografia com vesícula distendida, parede espessada e cálculo impactado no infundíbulo. Sem disfunção orgânica. Qual é a conduta?","ops":[["Antibiótico e colecistectomia laparoscópica precoce.","Correta: colecistite aguda leve a moderada em paciente apto deve ser operada precocemente, com menos complicações e internação mais curta."],["Antibiótico por 6 semanas e colecistectomia eletiva depois.","Errada: a cirurgia tardia aumenta recorrência e não reduz complicações."],["Colangiopancreatografia retrógrada endoscópica de urgência.","Errada: a CPRE é indicada em coledocolitíase ou colangite, não na colecistite isolada."],["Colecistostomia percutânea como primeira opção em todos os casos.","Errada: a colecistostomia é reservada a pacientes graves ou sem condições cirúrgicas."]],"conc":"Colecistite aguda: dor em hipocôndrio direito, febre, Murphy positivo e ultrassonografia com espessamento parietal, distensão e cálculo impactado. As diretrizes de Tóquio classificam a gravidade em graus I, II e III.","rac":"Grau I ou II em paciente apto: colecistectomia laparoscópica precoce. Grau III: suporte e, conforme a resposta e o risco, cirurgia ou drenagem.","pista":"Ausência de disfunção orgânica com início recente.","mud":"Disfunção orgânica (grau III) ou alto risco cirúrgico poderia levar à drenagem percutânea.","cmp":"Colecistite: Murphy, cirurgia precoce. Colangite: Charcot, drenagem biliar.","arm":"Adiar a cirurgia por semanas em paciente apto.","regra":"Colecistite em paciente apto: opere cedo.","cf":"O sinal de Murphy ultrassonográfico é mais confiável que o clínico em idosos.","fonte":"Tokyo Guidelines 2018 (Okamoto K et al., J Hepatobiliary Pancreat Sci 2018;25:55-72); WSES Guidelines on Acute Calculous Cholecystitis (Pisano M et al., 2020)."},{"n":4,"sub":"Diverticulite com abscesso","comp":"Conduzir diverticulite complicada","tags":[],"rel":[],"enun":"Homem de 64 anos com dor em fossa ilíaca esquerda, febre e leucocitose. A TC mostra diverticulite de sigmoide com abscesso pericólico de 5 cm, sem ar livre difuso e sem peritonite generalizada. Qual é a conduta?","ops":[["Antibiótico intravenoso e drenagem percutânea do abscesso.","Correta: abscessos maiores que 3 a 4 cm são drenados percutaneamente, associando antibiótico."],["Cirurgia de Hartmann de urgência.","Errada: Hartmann é indicado na peritonite purulenta ou fecal (Hinchey III e IV) ou falha do tratamento."],["Tratamento ambulatorial sem antibiótico.","Errada: a diverticulite complicada com abscesso exige internação e antibiótico."],["Colonoscopia imediata para avaliar o segmento acometido.","Errada: a colonoscopia é evitada na fase aguda pelo risco de perfuração; é feita após 6 a 8 semanas."]],"conc":"Classificação de Hinchey: I (abscesso pericólico), II (abscesso pélvico ou distante), III (peritonite purulenta) e IV (peritonite fecal). Abscessos pequenos (menores que 3 cm) respondem ao antibiótico; maiores são drenados.","rac":"Abscesso de 5 cm sem peritonite: Hinchey I ou II. Antibiótico e drenagem percutânea. Após a recuperação, colonoscopia para excluir neoplasia.","pista":"Abscesso maior que 4 cm sem peritonite generalizada.","mud":"Pneumoperitônio difuso e peritonite fecal indicariam cirurgia de urgência (Hartmann ou ressecção com anastomose).","cmp":"Hinchey I e II: drenagem. Hinchey III e IV: cirurgia.","arm":"Operar toda diverticulite com abscesso.","regra":"Abscesso grande sem peritonite: drene pela pele.","cf":"Na diverticulite não complicada em imunocompetente sem sinais sistêmicos, o antibiótico pode ser dispensado.","fonte":"WSES Guidelines for Acute Left-Sided Colonic Diverticulitis (Sartelli M et al., World J Emerg Surg 2020;15:32)."},{"n":5,"sub":"Obstrução por bridas","comp":"Tratar obstrução de delgado sem estrangulamento","tags":[],"rel":[],"enun":"Mulher de 55 anos, com histerectomia prévia, tem vômitos, cólicas e distensão há 24 horas, sem eliminação de gases. Sem febre, sem dor contínua, sem peritonite. TC com obstrução de delgado por bridas, sem sinais de isquemia. Qual é a conduta inicial?","ops":[["Sonda nasogástrica, hidratação e contraste hidrossolúvel.","Correta: obstrução por bridas sem sinais de estrangulamento é tratada inicialmente de forma conservadora; o contraste hidrossolúvel prediz resolução."],["Laparotomia imediata em toda obstrução intestinal.","Errada: sem sinais de isquemia, a maioria resolve com tratamento conservador."],["Colonoscopia descompressiva.","Errada: a colonoscopia descomprime o cólon, não o delgado obstruído por bridas."],["Procinético em dose alta para estimular o trânsito.","Errada: procinéticos são contraindicados na obstrução mecânica."]],"conc":"As bridas são a principal causa de obstrução de delgado em pacientes com cirurgia abdominal prévia. Sinais de estrangulamento (dor contínua, febre, taquicardia, leucocitose, lactato elevado, peritonite, achados de isquemia na TC) exigem cirurgia.","rac":"Bridas sem estrangulamento: conservador. Contraste hidrossolúvel que chega ao cólon em 24 horas prediz resolução. Sem melhora em 48 a 72 horas, cirurgia.","pista":"Ausência de sinais de isquemia na clínica e na TC.","mud":"Dor contínua, peritonite ou isquemia na TC indicariam cirurgia de urgência.","cmp":"Obstrução simples: conservador. Estrangulada: cirurgia.","arm":"Operar toda obstrução ou insistir no conservador diante de isquemia.","regra":"Brida sem isquemia: sonda, hidratação e contraste.","cf":"Hérnia encarcerada também é causa importante de obstrução e deve ser procurada no exame físico.","fonte":"Bologna Guidelines for Adhesive Small Bowel Obstruction (ten Broek RPG et al., World J Emerg Surg 2018;13:24)."},{"n":6,"sub":"Volvo de sigmoide","comp":"Conduzir o volvo sem complicações","tags":[],"rel":[],"enun":"Homem de 78 anos, institucionalizado, com constipação crônica, tem distensão abdominal acentuada e parada de eliminação de fezes e gases. A radiografia mostra alça em grão de café partindo da pelve. Sem peritonite e com mucosa viável. Qual é a conduta?","ops":[["Distorção endoscópica e sigmoidectomia na mesma internação.","Correta: sem peritonite ou isquemia, faz-se a distorção endoscópica e, pela alta recorrência, a sigmoidectomia na mesma internação."],["Laparotomia de urgência com colectomia total.","Errada: sem sinais de isquemia ou perfuração, a distorção endoscópica é a primeira escolha."],["Enema baritado terapêutico como tratamento definitivo.","Errada: o enema não é recomendado como tratamento padrão e há risco de perfuração."],["Apenas descompressão endoscópica e alta, sem cirurgia.","Errada: a recorrência após distorção isolada é alta; a ressecção eletiva é indicada."]],"conc":"O volvo de sigmoide ocorre em idosos com constipação crônica e sigmoide redundante. Radiografia: sinal do grão de café. Sem complicações, distorção endoscópica; com isquemia, perfuração ou falha, cirurgia (Hartmann).","rac":"Idoso com grão de café, sem peritonite: retossigmoidoscopia descompressiva com sonda retal e sigmoidectomia eletiva na mesma internação.","pista":"Ausência de peritonite e mucosa viável.","mud":"Mucosa necrótica na endoscopia ou peritonite indicariam cirurgia de urgência.","cmp":"Volvo de sigmoide: idoso, endoscopia. Volvo de ceco: mais jovem, cirurgia.","arm":"Dar alta após a distorção sem planejar a ressecção.","regra":"Grão de café sem peritonite: distorça por endoscopia e opere depois.","cf":"No volvo de ceco, a distorção endoscópica raramente funciona, e o tratamento é cirúrgico.","fonte":"ASCRS Clinical Practice Guidelines for Colonic Volvulus and Acute Colonic Pseudo-Obstruction (Alavi K et al., Dis Colon Rectum 2021;64:1046-1057)."},{"n":7,"sub":"Isquemia mesentérica aguda","comp":"Reconhecer dor desproporcional ao exame","tags":[],"rel":[],"enun":"Mulher de 76 anos com fibrilação atrial sem anticoagulação apresenta dor abdominal intensa e súbita há 4 horas, com abdome flácido e pouco doloroso à palpação. Lactato 4,8 mmol/L. Qual é o exame de escolha?","ops":[["Angiotomografia de abdome com fase arterial e venosa.","Correta: dor desproporcional ao exame em paciente com fibrilação atrial sugere embolia da artéria mesentérica superior; a angio-TC é o exame de escolha."],["Radiografia simples de abdome, que mostra pneumatose precocemente.","Errada: a radiografia é normal no início e os achados aparecem tarde, quando já há necrose."],["Colonoscopia de urgência para avaliar a mucosa.","Errada: a colonoscopia avalia colite isquêmica, não a oclusão aguda da mesentérica superior."],["Ultrassonografia de abdome para pesquisar colecistite.","Errada: a ultrassonografia tem baixa acurácia para isquemia mesentérica aguda."]],"conc":"Na isquemia mesentérica aguda, a dor é intensa e desproporcional aos achados do exame físico nas fases iniciais. Causas: embolia (fibrilação atrial), trombose arterial, trombose venosa e isquemia não oclusiva. O lactato elevado é tardio e inespecífico.","rac":"Fibrilação atrial, dor súbita intensa e abdome pouco doloroso: embolia de mesentérica superior. Angio-TC, heparina e revascularização (embolectomia ou endovascular), com ressecção de alças inviáveis.","pista":"Dor desproporcional ao exame físico em paciente com fibrilação atrial.","mud":"Diarreia sanguinolenta com dor leve em idoso sugeriria colite isquêmica, de melhor prognóstico.","cmp":"Isquemia mesentérica aguda: delgado, dor desproporcional. Colite isquêmica: cólon, sangue, geralmente benigna.","arm":"Esperar sinais de peritonite para pensar em isquemia.","regra":"Dor forte, barriga mole e fibrilação atrial: isquemia mesentérica.","cf":"O tempo até a revascularização determina a viabilidade intestinal.","fonte":"ESVS 2017 Clinical Practice Guidelines on the Management of Diseases of Mesenteric Arteries and Veins (Björck M et al., Eur J Vasc Endovasc Surg 2017); WSES 2022 (Bala M et al.)."},{"n":8,"sub":"Aneurisma de aorta roto","comp":"Conduzir o abdome agudo vascular hemorrágico","tags":[],"rel":[],"enun":"Homem de 72 anos, hipertenso e tabagista, com dor lombar e abdominal súbita, síncope, PA 78/40 mmHg e massa pulsátil periumbilical. Qual é a conduta?","ops":[["Levar direto ao reparo cirúrgico ou endovascular, com hipotensão permissiva.","Correta: suspeita de aneurisma roto com instabilidade exige reparo imediato, sem atrasos, mantendo hipotensão permissiva."],["Realizar TC com contraste antes de acionar a cirurgia vascular, mesmo instável.","Errada: em paciente instável com quadro típico, a TC não deve atrasar o tratamento."],["Infundir cristaloide em grande volume até PA sistólica de 130 mmHg.","Errada: a reposição agressiva aumenta o sangramento; o alvo é hipotensão permissiva."],["Tratar como cólica renal com analgesia e ultrassonografia de vias urinárias.","Errada: dor lombar com hipotensão e massa pulsátil em idoso é aneurisma roto até prova em contrário."]],"conc":"A tríade clássica do aneurisma de aorta abdominal roto é dor abdominal ou lombar, hipotensão e massa pulsátil. A mortalidade é muito alta, e o tratamento é o reparo imediato (aberto ou endovascular).","rac":"Idoso tabagista com dor lombar, síncope, choque e massa pulsátil: aneurisma roto. Acionar a equipe vascular, hipotensão permissiva (PA sistólica em torno de 70 a 90 mmHg com consciência preservada) e reparo imediato.","pista":"Massa pulsátil com choque.","mud":"Paciente estável com suspeita de ruptura permitiria angio-TC para planejar o reparo endovascular.","cmp":"Instável: centro cirúrgico. Estável: angio-TC e reparo.","arm":"Diagnosticar cólica renal em idoso com dor lombar e hipotensão.","regra":"Dor lombar, choque e massa pulsátil: aorta rota, vá para a sala.","cf":"O rastreio com ultrassonografia em homens tabagistas de 65 a 75 anos reduz a mortalidade por ruptura.","fonte":"ESVS 2024 Clinical Practice Guidelines on Abdominal Aorto-Iliac Artery Aneurysms (Wanhainen A et al., Eur J Vasc Endovasc Surg 2024;67:192-331)."},{"n":9,"sub":"Gravidez ectópica rota","comp":"Reconhecer o abdome agudo hemorrágico na mulher","tags":[],"rel":[],"enun":"Mulher de 27 anos com atraso menstrual de 7 semanas, dor súbita em fossa ilíaca esquerda, irritação peritoneal, PA 82/50 mmHg e FC 126 bpm. Qual é a conduta?","ops":[["Beta-hCG, reanimação e cirurgia de urgência por provável ectópica rota.","Correta: mulher em idade fértil com atraso, dor e choque hemorrágico sugere ectópica rota; a cirurgia é imediata."],["Metotrexato intramuscular e observação.","Errada: o metotrexato é contraindicado na instabilidade hemodinâmica e na ruptura."],["Ultrassonografia transvaginal ambulatorial em 48 horas para confirmar a localização.","Errada: a instabilidade exige conduta imediata; a ultrassonografia, se feita, é à beira do leito e não deve atrasar a cirurgia."],["Tratar como apendicite com antibiótico e observação.","Errada: a localização à esquerda, o atraso e o choque apontam para hemoperitônio por ectópica."]],"conc":"Toda mulher em idade fértil com dor abdominal deve fazer teste de gravidez. A gravidez ectópica rota causa hemoperitônio e choque, sendo causa de abdome agudo hemorrágico.","rac":"Atraso, dor súbita, peritonite e choque: ectópica rota. Beta-hCG, reanimação, tipagem sanguínea e cirurgia (salpingectomia, geralmente).","pista":"Choque hemorrágico em mulher com atraso menstrual.","mud":"Paciente estável, massa anexial pequena, beta-hCG baixo e sem batimento cardíaco embrionário poderia receber metotrexato.","cmp":"Instável: cirurgia. Estável e critérios favoráveis: metotrexato ou conduta expectante.","arm":"Esquecer o beta-hCG na mulher com dor abdominal.","regra":"Mulher fértil com dor e choque: pense em ectópica rota.","cf":"Gestante Rh negativo com ectópica deve receber imunoglobulina anti-D.","fonte":"ACOG Practice Bulletin nº 193: Tubal Ectopic Pregnancy (Obstet Gynecol 2018;131:e91-e103)."},{"n":10,"sub":"Analgesia no abdome agudo","comp":"Conduta antes da avaliação cirúrgica","tags":[],"rel":[],"enun":"Paciente de 35 anos com dor abdominal intensa em investigação no pronto-socorro aguarda avaliação do cirurgião. O residente hesita em prescrever analgésico para não mascarar o diagnóstico. Qual é a conduta correta?","ops":[["Prescrever analgesia adequada, inclusive opioide.","Correta: as evidências mostram que a analgesia precoce não atrasa nem prejudica o diagnóstico do abdome agudo."],["Evitar qualquer analgésico até que o cirurgião examine o paciente.","Errada: essa prática não tem respaldo e prolonga o sofrimento desnecessariamente."],["Usar apenas antiespasmódico, nunca opioide.","Errada: o opioide é seguro e eficaz no abdome agudo e não mascara os sinais."],["Indicar laparotomia diagnóstica para não precisar de analgesia.","Errada: a conduta cirúrgica depende do diagnóstico, não da dor."]],"conc":"Estudos e revisões sistemáticas mostram que a analgesia com opioides em pacientes com dor abdominal aguda não aumenta erros diagnósticos nem atrasa a decisão cirúrgica.","rac":"Dor intensa em investigação: analgesia adequada, inclusive opioide, enquanto se completa a avaliação.","pista":"Preocupação com mascarar o diagnóstico.","mud":"Não há situação comum em que a analgesia deva ser negada por esse motivo.","cmp":"Analgesia precoce: humana e segura. Retenção de analgésico: prática ultrapassada.","arm":"Manter o paciente com dor esperando o cirurgião.","regra":"Abdome agudo dói: trate a dor.","cf":"O exame físico seriado continua sendo fundamental, com ou sem analgesia.","fonte":"Manterola C et al. Analgesia in patients with acute abdominal pain. Cochrane Database Syst Rev 2011;(1):CD005660."}]},{"id":"M14","titulo":"Infecção do trato urinário","bloco":2,"q":[{"n":1,"sub":"Cistite não complicada","comp":"Tratar cistite em mulher sem fatores de complicação","tags":[],"rel":[],"enun":"Mulher de 26 anos, não gestante, com disúria, polaciúria e urgência há 2 dias, sem febre, dor lombar ou corrimento vaginal. Sem comorbidades e sem ITU recente. Qual é a conduta?","ops":[["Tratamento empírico com nitrofurantoína por 5 dias ou fosfomicina em dose única, sem urocultura obrigatória.","Correta: cistite não complicada em mulher jovem é diagnóstico clínico e tratada empiricamente com nitrofurantoína ou fosfomicina."],["Solicitar urocultura e aguardar o resultado antes de qualquer antibiótico, para evitar tratamento desnecessário.","Errada: na cistite típica não complicada, a urocultura não é necessária e o tratamento é empírico."],["Ciprofloxacino por 14 dias, por ser o antibiótico com maior espectro e melhor penetração urinária.","Errada: quinolonas devem ser poupadas na cistite pelo perfil de eventos adversos e resistência; 14 dias é excessivo."],["Ultrassonografia de rins e vias urinárias antes do tratamento para excluir malformações.","Errada: imagem não é indicada em cistite não complicada isolada."]],"conc":"Cistite não complicada é a infecção da bexiga em mulher não gestante, sem alterações anatômicas ou funcionais do trato urinário e sem comorbidades relevantes. O diagnóstico é clínico; a E. coli é o agente mais comum.","rac":"Disúria, polaciúria e urgência sem febre ou dor lombar e sem corrimento: alta probabilidade de cistite. Nitrofurantoína 100 mg de 6 em 6 horas (ou macrocristais 12 em 12 horas) por 5 dias, ou fosfomicina 3 g em dose única.","pista":"Sintomas irritativos típicos sem sinais sistêmicos nem fatores de complicação.","mud":"Febre, dor lombar, gestação, sexo masculino, sintomas recorrentes ou falha terapêutica exigiriam urocultura.","cmp":"Cistite: nitrofurantoína ou fosfomicina. Pielonefrite: quinolona ou ceftriaxona, com urocultura.","arm":"Pedir urocultura para toda cistite simples ou usar quinolona como primeira linha.","regra":"Cistite simples na mulher: trate empiricamente, sem urocultura.","cf":"Corrimento vaginal associado a disúria sugere vulvovaginite ou cervicite, que mudam o diagnóstico.","fonte":"IDSA/ESCMID Guidelines for Acute Uncomplicated Cystitis and Pyelonephritis in Women (Gupta K et al., Clin Infect Dis 2011;52:e103-e120); EAU Guidelines on Urological Infections, 2024."},{"n":2,"sub":"Pielonefrite ambulatorial","comp":"Tratar pielonefrite aguda não complicada","tags":[],"rel":[],"enun":"Mulher de 32 anos com febre de 38,8 °C, dor lombar direita, Giordano positivo e náuseas leves, tolerando via oral e hemodinamicamente estável. Não está grávida. Qual é a conduta?","ops":[["Urocultura e quinolona oral ambulatorial por 7 dias.","Correta: pielonefrite não complicada em paciente estável que tolera via oral pode ser tratada ambulatorialmente, com urocultura antes do antibiótico."],["Nitrofurantoína por 5 dias, como na cistite.","Errada: a nitrofurantoína não atinge níveis teciduais renais adequados e não deve ser usada na pielonefrite."],["Fosfomicina em dose única e reavaliação em 7 dias.","Errada: a fosfomicina em dose única não é adequada para pielonefrite."],["Internação obrigatória para antibiótico intravenoso por 14 dias em todos os casos.","Errada: a internação é reservada a instabilidade, vômitos, gestação, obstrução ou falha do tratamento oral."]],"conc":"Pielonefrite é infecção do parênquima renal: febre, dor lombar, Giordano positivo, com ou sem sintomas de cistite. Sempre se colhe urocultura. Em pacientes estáveis, o tratamento ambulatorial é seguro.","rac":"Pielonefrite sem sinais de gravidade e tolerando via oral: urocultura e ciprofloxacino por 7 dias ou levofloxacino por 5 dias, se a resistência local for baixa; senão, ceftriaxona inicial.","pista":"Paciente estável, tolerando via oral.","mud":"Vômitos incoercíveis, sepse, gestação ou suspeita de obstrução levariam a internação e ultrassonografia.","cmp":"Pielonefrite: quinolona, betalactâmico ou sulfametoxazol-trimetoprima guiado por cultura. Nitrofurantoína e fosfomicina: só cistite.","arm":"Usar nitrofurantoína na pielonefrite.","regra":"Febre e dor lombar: urocultura e antibiótico com ação tecidual.","cf":"Sem melhora em 48 a 72 horas, investiga-se obstrução ou abscesso com imagem.","fonte":"IDSA/ESCMID (Gupta K et al., 2011); EAU Guidelines on Urological Infections, 2024."},{"n":3,"sub":"Bacteriúria assintomática","comp":"Evitar tratamento desnecessário","tags":[],"rel":[],"enun":"Idosa de 82 anos, institucionalizada, sem queixas urinárias, sem febre e com estado mental habitual. Urocultura de rotina com 10⁵ UFC/mL de E. coli. Qual é a conduta?","ops":[["Não tratar a bacteriúria assintomática nessa idosa.","Correta: o tratamento não traz benefício e aumenta resistência, efeitos adversos e infecção por C. difficile."],["Tratar com nitrofurantoína por 5 dias para prevenir pielonefrite.","Errada: o tratamento não reduz pielonefrite nem mortalidade em idosos."],["Tratar com ciprofloxacino por 7 dias pelo risco de sepse urinária.","Errada: não há benefício em tratar, e a quinolona aumenta riscos em idosos."],["Repetir a urocultura semanalmente até negativar.","Errada: a bacteriúria assintomática não precisa ser monitorada nem erradicada."]],"conc":"Bacteriúria assintomática é a presença de bactérias em cultura significativa sem sintomas de ITU. Deve ser rastreada e tratada apenas na gestante e antes de procedimentos urológicos com sangramento de mucosa.","rac":"Idosa sem sintomas, sem febre e sem alteração do estado mental: bacteriúria assintomática. Não tratar.","pista":"Ausência de sintomas urinários ou sistêmicos.","mud":"Gestação ou procedimento urológico com lesão de mucosa programado mudariam a conduta para tratar.","cmp":"Tratar: gestante e pré-procedimento urológico. Não tratar: idosos, diabéticos, sondados, lesados medulares.","arm":"Tratar urocultura positiva sem sintomas.","regra":"Sem sintomas, sem antibiótico (exceto gestante e pré-procedimento urológico).","cf":"Urina turva ou com odor forte, isoladamente, não é indicação de tratamento.","fonte":"IDSA Clinical Practice Guideline for Asymptomatic Bacteriuria (Nicolle LE et al., Clin Infect Dis 2019;68:e83-e110)."},{"n":4,"sub":"Bacteriúria na gestação","comp":"Tratar bacteriúria assintomática na gestante","tags":[],"rel":[],"enun":"Gestante de 14 semanas, assintomática, tem urocultura de pré-natal com 10⁵ UFC/mL de E. coli sensível a cefalexina, nitrofurantoína e amoxicilina. Qual é a conduta?","ops":[["Tratar guiado pelo antibiograma e repetir a urocultura.","Correta: na gestante, a bacteriúria assintomática deve ser tratada para prevenir pielonefrite, com urocultura de controle."],["Não tratar, pois a paciente é assintomática.","Errada: na gestação, a bacteriúria não tratada aumenta muito o risco de pielonefrite."],["Tratar com ciprofloxacino por 3 dias.","Errada: quinolonas são evitadas na gestação."],["Tratar apenas se surgir febre ou dor lombar.","Errada: o objetivo é justamente prevenir a pielonefrite; o tratamento é feito antes dos sintomas."]],"conc":"As alterações fisiológicas da gestação (dilatação ureteral pela progesterona e compressão uterina) favorecem a ascensão da infecção. A bacteriúria assintomática não tratada leva a pielonefrite em parcela importante das gestantes, com risco de parto prematuro.","rac":"Gestante com urocultura positiva sem sintomas: tratar conforme antibiograma (cefalexina, amoxicilina, nitrofurantoína) e repetir urocultura de controle.","pista":"Gestação com urocultura significativa.","mud":"Fora da gestação, a mesma bacteriúria não seria tratada.","cmp":"Seguras na gestação: cefalosporinas, amoxicilina, nitrofurantoína (evitar no termo), fosfomicina. Evitar: quinolonas, tetraciclinas.","arm":"Não rastrear ou não tratar a bacteriúria na gestante.","regra":"Na gestante, bacteriúria se trata mesmo sem sintomas.","cf":"A nitrofurantoína é evitada próximo ao termo pelo risco de hemólise neonatal na deficiência de G6PD.","fonte":"IDSA ASB Guideline (Nicolle LE et al., 2019); Brasil. MS. Manual de Gestação de Alto Risco, 2022."},{"n":5,"sub":"Pielonefrite na gestação","comp":"Conduzir pielonefrite em gestante","tags":[],"rel":[],"enun":"Gestante de 26 semanas com febre de 39 °C, calafrios, dor lombar esquerda e Giordano positivo. Qual é a conduta?","ops":[["Internar, colher culturas e iniciar ceftriaxona intravenosa.","Correta: pielonefrite na gestação exige internação e antibiótico intravenoso pelo risco de sepse e parto prematuro."],["Tratamento ambulatorial com nitrofurantoína por 7 dias.","Errada: a nitrofurantoína não trata pielonefrite, e a gestante com pielonefrite deve ser internada."],["Ciprofloxacino oral ambulatorial por 7 dias.","Errada: quinolonas são evitadas na gestação, e o tratamento inicial deve ser hospitalar."],["Indicar resolução imediata da gestação.","Errada: a pielonefrite é tratada clinicamente; não há indicação de interromper a gestação."]],"conc":"A pielonefrite na gestação associa-se a sepse, síndrome do desconforto respiratório agudo, anemia e trabalho de parto prematuro. Por isso, o tratamento inicial é hospitalar e intravenoso.","rac":"Gestante febril com dor lombar: internar, colher culturas, ceftriaxona intravenosa até 48 horas afebril, completar 10 a 14 dias por via oral guiado pela cultura e manter vigilância ou profilaxia até o parto.","pista":"Febre e dor lombar em gestante.","mud":"Ausência de febre com sintomas irritativos apenas seria cistite, tratada ambulatorialmente.","cmp":"Gestante: cistite ambulatorial; pielonefrite internada.","arm":"Tratar a pielonefrite gestacional em casa.","regra":"Pielonefrite na gestante: interne e use betalactâmico intravenoso.","cf":"A recorrência é frequente, justificando urocultura mensal ou profilaxia com nitrofurantoína ou cefalexina.","fonte":"Brasil. MS. Manual de Gestação de Alto Risco, 2022; FEBRASGO. Infecção urinária na gestação (Protocolo FEBRASGO)."},{"n":6,"sub":"Pielonefrite enfisematosa","comp":"Reconhecer a infecção urinária grave do diabético","tags":[],"rel":[],"enun":"Mulher de 60 anos, diabética descompensada (glicemia 480 mg/dL), com febre, dor lombar, confusão e hipotensão. A TC mostra gás no parênquima renal esquerdo. Qual é a conduta?","ops":[["Antibiótico intravenoso, controle glicêmico e controle do foco.","Correta: pielonefrite enfisematosa é infecção necrosante grave que exige antibiótico e controle do foco (drenagem ou nefrectomia)."],["Antibiótico oral ambulatorial por 14 dias com retorno em 1 semana.","Errada: há sepse e infecção necrosante; o tratamento é hospitalar e intensivo."],["Apenas insulina e hidratação, pois o gás é artefato da hiperglicemia.","Errada: o gás no parênquima indica infecção por germes formadores de gás, não artefato."],["Litotripsia extracorpórea de urgência.","Errada: não há cálculo descrito e a litotripsia é contraindicada na infecção ativa."]],"conc":"A pielonefrite enfisematosa é infecção necrosante com gás no parênquima renal, quase sempre em diabéticos mal controlados ou com obstrução. Agentes: E. coli e Klebsiella. A mortalidade é elevada.","rac":"Diabética com sepse e gás renal na TC: pielonefrite enfisematosa. Antibiótico de amplo espectro, controle glicêmico, desobstrução se houver e drenagem percutânea; nefrectomia nas formas extensas ou refratárias.","pista":"Gás no parênquima renal na TC.","mud":"Gás restrito ao sistema coletor (pielite enfisematosa) tem melhor prognóstico e responde a antibiótico e drenagem da via urinária.","cmp":"Pielonefrite simples: antibiótico. Enfisematosa ou abscesso: antibiótico e controle do foco.","arm":"Tratar como pielonefrite simples o diabético séptico sem imagem.","regra":"Diabético séptico com dor lombar: faça TC e procure gás.","cf":"Abscesso renal maior que 5 cm também exige drenagem.","fonte":"EAU Guidelines on Urological Infections, 2024; Huang JJ, Tseng CC. Arch Intern Med 2000;160:797-805."},{"n":7,"sub":"Prostatite bacteriana aguda","comp":"Conduzir ITU febril no homem","tags":[],"rel":[],"enun":"Homem de 52 anos com febre, disúria, polaciúria, dor perineal e jato fraco. Ao toque retal, próstata aumentada, quente e muito dolorosa. Qual é a conduta?","ops":[["Culturas e quinolona por 2 a 4 semanas, sem massagem prostática.","Correta: prostatite bacteriana aguda exige antibiótico prolongado com boa penetração prostática; a massagem pode causar bacteremia."],["Nitrofurantoína por 5 dias, como na cistite feminina.","Errada: a nitrofurantoína não atinge o tecido prostático e a duração é insuficiente."],["Massagem prostática vigorosa para coletar secreção antes do antibiótico.","Errada: a massagem é contraindicada na prostatite aguda pelo risco de bacteremia."],["Biópsia prostática de urgência para excluir câncer.","Errada: biópsia na infecção aguda é contraindicada; o quadro é infeccioso."]],"conc":"A ITU no homem é considerada complicada. A prostatite bacteriana aguda causa febre, sintomas urinários, dor perineal e próstata dolorosa ao toque. Pode evoluir com retenção urinária e abscesso.","rac":"Febre, sintomas irritativos e obstrutivos e próstata dolorosa: prostatite aguda. Culturas, antibiótico por 2 a 4 semanas e sondagem suprapúbica se houver retenção.","pista":"Próstata quente e dolorosa ao toque.","mud":"Ausência de melhora em 48 horas levaria a investigar abscesso prostático com ultrassonografia transretal ou TC.","cmp":"Prostatite aguda: 2 a 4 semanas. Crônica bacteriana: 4 a 6 semanas.","arm":"Massagear a próstata na fase aguda.","regra":"ITU febril no homem: pense na próstata e trate por semanas.","cf":"PSA pode se elevar na prostatite e não deve ser dosado para rastreio na fase aguda.","fonte":"EAU Guidelines on Urological Infections, 2024."},{"n":8,"sub":"ITU de repetição","comp":"Definir e prevenir ITU recorrente","tags":[],"rel":[],"enun":"Mulher de 58 anos, pós-menopausa, teve 4 episódios de cistite confirmados por urocultura no último ano. Ultrassonografia normal. Qual é a estratégia preventiva mais adequada inicialmente?","ops":[["Estrogênio vaginal tópico e medidas comportamentais.","Correta: na pós-menopausa, o estrogênio vaginal restaura a flora e reduz recorrências; a profilaxia antibiótica é reservada a falha."],["Ciprofloxacino contínuo por 12 meses como primeira medida.","Errada: a profilaxia antibiótica não é a primeira opção, e as quinolonas devem ser evitadas para esse fim."],["Cistoscopia obrigatória antes de qualquer medida preventiva.","Errada: em mulher com ultrassonografia normal e sem hematúria, a cistoscopia não é rotina."],["Terapia de reposição hormonal sistêmica, por ser mais eficaz que a tópica.","Errada: o estrogênio sistêmico não demonstrou redução de ITU; a via vaginal é a indicada."]],"conc":"ITU de repetição: 2 ou mais episódios em 6 meses ou 3 ou mais em 12 meses. Estratégias: hidratação, micção pós-coito, evitar espermicidas, estrogênio vaginal na pós-menopausa, profilaxia antibiótica contínua ou pós-coital e outras opções como metenamina.","rac":"Quatro episódios em 1 ano: ITU de repetição. Pós-menopausa: estrogênio vaginal é a primeira medida, com medidas comportamentais.","pista":"Pós-menopausa com atrofia urogenital como fator.","mud":"Episódios relacionados ao coito em mulher jovem levariam a considerar profilaxia pós-coital.","cmp":"Estrogênio vaginal: eficaz. Estrogênio sistêmico: sem benefício para ITU.","arm":"Iniciar quinolona contínua como primeira medida.","regra":"ITU de repetição na pós-menopausa: estrogênio vaginal.","cf":"Sempre confirmar cada episódio com urocultura antes de rotular como ITU de repetição.","fonte":"AUA/CUA/SUFU Guideline: Recurrent Uncomplicated UTI in Women (Anger J et al., J Urol 2019;202:282-289); EAU Guidelines, 2024."},{"n":9,"sub":"ITU associada a cateter","comp":"Coletar e tratar ITU em paciente sondado","tags":[],"rel":[],"enun":"Homem de 70 anos com sonda vesical de demora há 3 semanas apresenta febre de 38,7 °C sem outro foco. Qual é a conduta correta para coleta da urocultura e tratamento?","ops":[["Trocar a sonda e colher a urocultura da nova sonda antes de iniciar o antibiótico.","Correta: a sonda antiga tem biofilme e a cultura colhida dela pode não refletir a infecção; troca-se a sonda e colhe-se da nova."],["Colher a urina da bolsa coletora, que representa melhor a infecção.","Errada: a urina da bolsa é contaminada e não deve ser usada para cultura."],["Iniciar antibiótico e manter a mesma sonda, sem colher cultura.","Errada: a cultura orienta o tratamento, e a sonda colonizada deve ser trocada ou retirada."],["Tratar todos os pacientes sondados com urocultura positiva, mesmo sem sintomas.","Errada: a bacteriúria assintomática em sondados não deve ser tratada."]],"conc":"A bacteriúria é quase universal em sondas de longa permanência. A ITU associada a cateter é diagnosticada quando há sintomas (febre, dor suprapúbica, instabilidade) com cultura significativa, na ausência de outro foco.","rac":"Sonda há mais de 2 semanas com febre: trocar a sonda (ou retirar, se possível), colher a cultura da nova sonda e iniciar antibiótico, com duração de 7 dias se boa resposta.","pista":"Sonda de longa permanência com febre sem outro foco.","mud":"Sem febre ou outros sintomas, a urocultura positiva no sondado não seria tratada.","cmp":"Sondado sintomático: tratar. Sondado assintomático: não tratar.","arm":"Colher urina da bolsa coletora.","regra":"ITU no sondado: troque a sonda antes de colher.","cf":"A principal prevenção é retirar a sonda assim que possível.","fonte":"IDSA Guidelines for Catheter-Associated UTI (Hooton TM et al., Clin Infect Dis 2010;50:625-663)."},{"n":10,"sub":"ITU febril no lactente","comp":"Escolher o método de coleta de urina","tags":[],"rel":[],"enun":"Lactente de 8 meses com febre de 39 °C há 2 dias, sem foco aparente, irritado. Suspeita-se de ITU. Qual método de coleta de urina é adequado para a urocultura?","ops":[["Cateterismo vesical ou punção suprapúbica.","Correta: em lactentes sem controle esfincteriano, a urocultura deve ser colhida por cateterismo ou punção suprapúbica."],["Saco coletor adesivo, por ser menos invasivo e igualmente confiável.","Errada: o saco coletor tem alta taxa de contaminação; só tem valor se negativo."],["Coleta de jato médio espontâneo, como no adulto.","Errada: lactente sem controle esfincteriano não consegue colher jato médio de forma confiável."],["Fralda absorvente com urina espremida.","Errada: é método inadequado, com alta contaminação."]],"conc":"Na criança febril sem controle esfincteriano, a urocultura deve ser obtida por cateterismo ou punção suprapúbica. O saco coletor tem muitos falso-positivos; uma cultura positiva por saco não confirma ITU.","rac":"Lactente febril sem foco: urina tipo I e urocultura por cateterismo. Confirmada a ITU, tratar e investigar com ultrassonografia de rins e vias urinárias.","pista":"Lactente sem controle esfincteriano.","mud":"Criança com controle esfincteriano poderia colher jato médio após higiene.","cmp":"Saco coletor: só serve se negativo. Cateterismo ou punção: diagnóstico confiável.","arm":"Confirmar ITU com urocultura de saco coletor.","regra":"Lactente febril: urina por sonda ou punção.","cf":"Após a primeira ITU febril, a ultrassonografia é indicada; a uretrocistografia fica para ultrassonografia alterada ou recorrência.","fonte":"AAP Clinical Practice Guideline: UTI in Febrile Infants and Children 2–24 Months (Roberts KB, Pediatrics 2011;128:595-610; reafirmado 2016)."}]},{"id":"M15","titulo":"Cálculo renal","bloco":2,"q":[{"n":1,"sub":"Exame de imagem","comp":"Escolher o padrão-ouro na cólica renal","tags":[],"rel":[],"enun":"Homem de 38 anos com dor lombar esquerda súbita, em cólica, irradiada para a região inguinal, com hematúria microscópica. Qual é o exame de imagem de maior acurácia para confirmar urolitíase?","ops":[["Tomografia de abdome e pelve sem contraste, preferencialmente de baixa dose.","Correta: a TC sem contraste tem a maior sensibilidade e especificidade para cálculos, mostrando tamanho, localização e obstrução."],["Radiografia simples de abdome, suficiente por mostrar todos os cálculos.","Errada: a radiografia não mostra cálculos radiotransparentes (ácido úrico) e tem baixa sensibilidade."],["Urografia excretora com contraste iodado como primeira escolha.","Errada: a urografia foi substituída pela TC sem contraste e expõe a contraste sem necessidade."],["Ressonância magnética de abdome como primeira escolha.","Errada: a ressonância tem baixa sensibilidade para cálculos e é reservada a situações específicas, como gestação."]],"conc":"A cólica nefrética típica é dor lombar súbita e intensa, em cólica, que irradia para flanco, região inguinal e genitália, com náuseas e hematúria. A TC sem contraste é o padrão-ouro diagnóstico.","rac":"Adulto não gestante com suspeita de cálculo: TC sem contraste de baixa dose. A ultrassonografia é opção inicial em gestantes, crianças e para reduzir radiação.","pista":"Paciente adulto, não gestante, sem contraindicação à radiação.","mud":"Gestante ou criança levariam a usar ultrassonografia como primeiro exame.","cmp":"TC sem contraste: padrão-ouro. Ultrassonografia: gestantes, crianças, acompanhamento.","arm":"Usar radiografia simples para excluir cálculo.","regra":"Cólica renal: TC sem contraste.","cf":"Cálculos de indinavir são radiotransparentes até na TC, uma exceção clássica.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., EAU 2024)."},{"n":2,"sub":"Analgesia","comp":"Escolher a analgesia de primeira linha","tags":[],"rel":[],"enun":"Paciente com cólica renal confirmada, função renal normal, sem úlcera ou sangramento. Qual é a analgesia de primeira linha?","ops":[["Anti-inflamatório não esteroide, como diclofenaco ou cetorolaco.","Correta: os AINE são a primeira linha na cólica renal, reduzem a pressão intrarrenal e a necessidade de analgesia de resgate."],["Opioide intravenoso como primeira escolha em todos os casos.","Errada: opioides são opção de segunda linha ou associados, com mais efeitos adversos."],["Hidratação venosa vigorosa para empurrar o cálculo.","Errada: a hiper-hidratação não acelera a expulsão e pode aumentar a dor."],["Antiespasmódico isolado, como escopolamina.","Errada: antiespasmódicos isolados não demonstraram eficácia superior aos AINE."]],"conc":"A dor da cólica renal decorre do aumento da pressão no sistema coletor e da liberação de prostaglandinas. Os AINE reduzem a filtração e a pressão intrarrenal, sendo a primeira linha quando não há contraindicação.","rac":"Função renal normal, sem contraindicações: AINE. Se insuficiente ou contraindicado, opioide ou dipirona.","pista":"Ausência de contraindicações aos AINE.","mud":"Doença renal crônica ou gestação levariam a evitar AINE e preferir dipirona ou opioide.","cmp":"AINE: primeira linha. Opioide: resgate ou contraindicação ao AINE.","arm":"Hidratar vigorosamente para eliminar o cálculo.","regra":"Cólica renal: AINE primeiro.","cf":"Paracetamol intravenoso também é opção eficaz.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024)."},{"n":3,"sub":"Terapia médica expulsiva","comp":"Indicar alfabloqueador","tags":[],"rel":[],"enun":"Homem de 45 anos com cálculo de 6 mm no ureter distal, dor controlada, sem febre e com função renal normal. Qual é a conduta mais adequada?","ops":[["Analgesia e tansulosina, com reavaliação por imagem.","Correta: cálculos distais de 5 a 10 mm sem complicações podem ser tratados com terapia médica expulsiva com alfabloqueador."],["Ureteroscopia de urgência em todo cálculo ureteral.","Errada: sem infecção, dor refratária ou lesão renal, o tratamento conservador é a primeira opção."],["Nefrolitotripsia percutânea imediata.","Errada: a nefrolitotripsia percutânea é para cálculos renais grandes, não para cálculo ureteral distal pequeno."],["Diurético de alça em dose alta para acelerar a expulsão.","Errada: diuréticos não aumentam a eliminação e podem piorar a dor."]],"conc":"Cálculos menores que 5 mm são eliminados espontaneamente na maioria dos casos. Entre 5 e 10 mm, no ureter distal, o alfabloqueador (tansulosina) aumenta a taxa e reduz o tempo de expulsão.","rac":"Cálculo distal de 6 mm, dor controlada, sem infecção e com função renal normal: tansulosina e analgesia, reavaliando em até 4 a 6 semanas.","pista":"Cálculo distal de 5 a 10 mm sem complicações.","mud":"Febre, rim único obstruído, dor refratária ou lesão renal exigiriam intervenção.","cmp":"Menor que 5 mm: expectante. 5 a 10 mm distal: tansulosina. Maior que 10 mm ou complicações: intervenção.","arm":"Indicar cirurgia para todo cálculo ureteral.","regra":"Cálculo distal pequeno sem complicações: tansulosina e paciência.","cf":"Se não houver expulsão em 4 a 6 semanas, indica-se intervenção (ureteroscopia ou litotripsia).","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024); AUA/Endourological Society Guideline on Surgical Management of Stones (Assimos D et al., J Urol 2016)."},{"n":4,"sub":"Rim obstruído e infectado","comp":"Indicar desobstrução de urgência","tags":[],"rel":[],"enun":"Mulher de 50 anos com cálculo de 8 mm no ureter proximal direito, hidronefrose, febre de 39 °C, calafrios e PA 92/60 mmHg. Qual é a conduta?","ops":[["Antibiótico e desobstrução urgente com duplo J ou nefrostomia.","Correta: rim obstruído e infectado é emergência urológica; a drenagem urgente é obrigatória e a retirada do cálculo é feita depois."],["Ureteroscopia com litotripsia imediata para retirar o cálculo no mesmo procedimento.","Errada: na infecção ativa, manipular o cálculo aumenta o risco de sepse; apenas se drena."],["Antibiótico intravenoso isolado e tansulosina, sem drenagem.","Errada: o antibiótico não penetra adequadamente um sistema obstruído; a drenagem é essencial."],["Litotripsia extracorpórea por ondas de choque de urgência.","Errada: a litotripsia é contraindicada na infecção ativa."]],"conc":"A obstrução urinária com infecção (pionefrose) pode evoluir rapidamente para choque séptico. O tratamento é antibiótico e descompressão urgente (duplo J ou nefrostomia percutânea).","rac":"Febre, hipotensão e cálculo obstrutivo: sepse urinária obstrutiva. Culturas, antibiótico, drenagem imediata. O cálculo é tratado após a resolução da infecção.","pista":"Febre com hidronefrose por cálculo.","mud":"Sem febre e com dor controlada, o mesmo cálculo poderia receber tratamento conservador ou ureteroscopia eletiva.","cmp":"Obstrução com infecção: drenar. Obstrução sem infecção: tratar o cálculo conforme tamanho e sintomas.","arm":"Tentar retirar o cálculo durante a sepse.","regra":"Cálculo com febre: drene primeiro.","cf":"Duplo J e nefrostomia têm eficácia semelhante na drenagem.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024)."},{"n":5,"sub":"Cálculo de ácido úrico","comp":"Reconhecer e tratar o cálculo radiotransparente","tags":[],"rel":[],"enun":"Homem de 58 anos, obeso, diabético e com gota, apresenta cólica renal. A radiografia simples não mostra cálculo, mas a TC sem contraste mostra cálculo renal de 9 mm. pH urinário 5,0. Qual é o tipo provável e o tratamento clínico?","ops":[["Ácido úrico; alcalinização com citrato de potássio.","Correta: cálculos de ácido úrico são radiotransparentes na radiografia, visíveis na TC, formam-se em urina ácida e podem ser dissolvidos com alcalinização."],["Oxalato de cálcio; restrição rigorosa de cálcio na dieta.","Errada: oxalato de cálcio é radiopaco, e restringir cálcio aumenta a absorção de oxalato."],["Estruvita; antibiótico prolongado isolado.","Errada: estruvita forma-se em urina alcalina por germes produtores de urease, não em urina ácida."],["Cistina; acidificação urinária com vitamina C.","Errada: a cistina tem cristais hexagonais e forma-se em urina ácida; acidificar piora a cistinúria."]],"conc":"O ácido úrico precipita em urina ácida (pH abaixo de 5,5). Fatores: gota, síndrome metabólica, diabetes, diarreia crônica e quimioterapia. É radiotransparente na radiografia e visível na TC.","rac":"Radiografia negativa, TC positiva, pH urinário baixo e gota: ácido úrico. Citrato de potássio para pH entre 6,5 e 7,0, hidratação e alopurinol se hiperuricosúria.","pista":"Cálculo invisível na radiografia e visível na TC, com pH urinário ácido.","mud":"Cálculo radiopaco com urina alcalina e infecção por Proteus sugeriria estruvita.","cmp":"Ácido úrico: urina ácida, alcalinizar. Estruvita: urina alcalina, remover e tratar a infecção.","arm":"Restringir cálcio para todo paciente com cálculo.","regra":"Cálculo que some na radiografia e aparece na TC: ácido úrico.","cf":"O ácido úrico é o único tipo comum que pode ser dissolvido clinicamente.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024); AUA Medical Management of Kidney Stones (Pearle MS et al., J Urol 2014;192:316-324)."},{"n":6,"sub":"Cálculo de estruvita","comp":"Conduzir cálculo coraliforme infeccioso","tags":[],"rel":[],"enun":"Mulher de 55 anos com ITU de repetição por Proteus mirabilis tem cálculo coraliforme ocupando a pelve e os cálices do rim direito. pH urinário 7,8. Qual é a conduta?","ops":[["Remoção completa por nefrolitotripsia percutânea e antibiótico.","Correta: cálculos de estruvita abrigam bactérias; sem remoção completa, a infecção e o crescimento do cálculo recidivam."],["Alcalinização urinária com citrato de potássio para dissolver o cálculo.","Errada: a estruvita forma-se em urina alcalina; alcalinizar piora o problema."],["Antibiótico prolongado isolado, sem intervenção.","Errada: o antibiótico não esteriliza o cálculo; a remoção é necessária."],["Observação, pois cálculos coraliformes raramente causam complicações.","Errada: coraliformes não tratados levam a perda da função renal e sepse."]],"conc":"A estruvita (fosfato amoníaco magnesiano) forma-se em urina alcalina por bactérias produtoras de urease (Proteus, Klebsiella). Cresce rapidamente e frequentemente assume forma coraliforme.","rac":"ITU por Proteus, urina alcalina e coraliforme: estruvita. Nefrolitotripsia percutânea com remoção completa e antibiótico.","pista":"Proteus mirabilis e pH urinário alcalino.","mud":"Coraliforme em urina ácida, sem infecção, sugeriria outro tipo, como cistina ou ácido úrico.","cmp":"Urease: estruvita, urina alcalina. Sem urease: oxalato, ácido úrico, cistina.","arm":"Tratar apenas com antibiótico.","regra":"Coraliforme com Proteus: tire tudo e trate a infecção.","cf":"O ácido aceto-hidroxâmico, inibidor da urease, é opção adjuvante pouco usada.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024); AUA/Endourological Society Surgical Management (Assimos D et al., 2016)."},{"n":7,"sub":"Cistinúria","comp":"Reconhecer o cálculo de causa genética","tags":[],"rel":[],"enun":"Rapaz de 17 anos com terceiro episódio de cálculo renal. O irmão também tem cálculos. O sedimento urinário mostra cristais hexagonais. Qual é o diagnóstico mais provável?","ops":[["Cistinúria, defeito tubular autossômico recessivo.","Correta: cristais hexagonais, início jovem, recorrência e história familiar são típicos de cistinúria."],["Hipercalciúria idiopática, que forma cristais hexagonais.","Errada: a hipercalciúria forma cálculos de cálcio, com cristais de oxalato em envelope ou halteres."],["Cálculo de estruvita, por infecção de repetição.","Errada: a estruvita tem cristais em forma de tampa de caixão e se associa a infecção por urease."],["Hiperuricosúria, pela idade jovem.","Errada: os cristais de ácido úrico são romboides ou em roseta, não hexagonais."]],"conc":"A cistinúria é defeito de reabsorção tubular de cistina, ornitina, lisina e arginina. A cistina é pouco solúvel em urina ácida e forma cálculos recorrentes desde a juventude.","rac":"Cálculos recorrentes em adolescente, irmão afetado e cristais hexagonais: cistinúria. Tratamento com hidratação intensa, alcalinização e quelantes (tiopronina, penicilamina).","pista":"Cristais hexagonais no sedimento.","mud":"Cristais em envelope sugeririam oxalato de cálcio di-hidratado.","cmp":"Hexagonal: cistina. Tampa de caixão: estruvita. Envelope: oxalato di-hidratado.","arm":"Não pensar em causa genética em jovem com cálculos recorrentes.","regra":"Cristal hexagonal: cistina.","cf":"O teste do nitroprussiato de cianeto é um rastreio qualitativo para cistinúria.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024)."},{"n":8,"sub":"Prevenção de cálculo de cálcio","comp":"Orientar medidas de prevenção","tags":[],"rel":[],"enun":"Homem de 40 anos teve cálculo de oxalato de cálcio e quer evitar recorrência. A investigação mostrou hipercalciúria idiopática. Qual orientação é correta?","ops":[["Muita água, cálcio normal, pouco sódio e pouca proteína animal.","Correta: hidratação, cálcio dietético normal, restrição de sódio e de proteína animal reduzem recorrência; o tiazídico reduz a calciúria."],["Restrição rigorosa de cálcio na dieta, abaixo de 400 mg por dia.","Errada: dieta pobre em cálcio aumenta a absorção intestinal de oxalato e o risco de cálculo, além de prejudicar o osso."],["Dieta rica em sódio para aumentar a diurese.","Errada: o sódio aumenta a excreção urinária de cálcio e piora a hipercalciúria."],["Furosemida para aumentar o volume urinário.","Errada: a furosemida aumenta a calciúria; o diurético indicado é o tiazídico."]],"conc":"A prevenção do cálculo de cálcio baseia-se em volume urinário alto, cálcio dietético normal (1.000 a 1.200 mg por dia), restrição de sódio e de proteína animal, aumento de frutas e vegetais e tratamento das alterações metabólicas.","rac":"Hipercalciúria idiopática: hidratação, cálcio normal, pouco sódio e pouca proteína animal, tiazídico se persistir. Hipocitratúria: citrato de potássio.","pista":"Hipercalciúria com cálculo de oxalato de cálcio.","mud":"Hiperparatireoidismo primário como causa levaria a paratireoidectomia.","cmp":"Tiazídico: reduz calciúria. Furosemida: aumenta calciúria.","arm":"Restringir cálcio para prevenir cálculo de cálcio.","regra":"Cálculo de cálcio: água, pouco sal, cálcio normal.","cf":"A meta é volume urinário de pelo menos 2,5 litros por dia.","fonte":"AUA Medical Management of Kidney Stones (Pearle MS et al., J Urol 2014); EAU Guidelines on Urolithiasis, 2024."},{"n":9,"sub":"Escolha do tratamento intervencionista","comp":"Indicar o método conforme o tamanho","tags":[],"rel":[],"enun":"Mulher de 48 anos com cálculo de 2,6 cm na pelve renal esquerda, sintomático, sem infecção ativa. Qual é o tratamento de primeira escolha?","ops":[["Nefrolitotripsia percutânea.","Correta: cálculos renais maiores que 2 cm são tratados preferencialmente por nefrolitotripsia percutânea."],["Litotripsia extracorpórea.","Errada: a litotripsia extracorpórea é menos eficaz para cálculos maiores que 2 cm."],["Tansulosina e observação.","Errada: a terapia expulsiva é para cálculos ureterais distais pequenos."],["Observação clínica.","Errada: o cálculo é sintomático e grande; tem indicação de tratamento."]],"conc":"A escolha do tratamento depende do tamanho, localização e composição do cálculo. Renais menores que 2 cm: litotripsia extracorpórea ou ureteroscopia flexível. Maiores que 2 cm: nefrolitotripsia percutânea.","rac":"Cálculo renal de 2,6 cm, sintomático: nefrolitotripsia percutânea.","pista":"Tamanho maior que 2 cm.","mud":"Cálculo de 1 cm na pelve renal permitiria litotripsia extracorpórea ou ureteroscopia flexível.","cmp":"Menor que 2 cm: litotripsia extracorpórea ou ureteroscopia. Maior que 2 cm: percutânea.","arm":"Indicar litotripsia extracorpórea para cálculos grandes.","regra":"Cálculo renal acima de 2 cm: percutânea.","cf":"Gestação, obesidade importante e coagulopatia não corrigida são contraindicações à litotripsia extracorpórea.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., 2024); AUA/Endourological Society Surgical Management (Assimos D et al., 2016)."},{"n":10,"sub":"Investigação metabólica","comp":"Identificar hiperparatireoidismo como causa de cálculo","tags":[],"rel":[],"enun":"Mulher de 52 anos com cálculos renais de cálcio recorrentes, osteopenia e constipação. Cálcio sérico 11,2 mg/dL, fósforo baixo e PTH elevado. Qual é o diagnóstico e o tratamento?","ops":[["Hiperparatireoidismo primário; paratireoidectomia.","Correta: hipercalcemia com PTH elevado define hiperparatireoidismo primário; a nefrolitíase é indicação de cirurgia."],["Hipercalciúria idiopática; tiazídico isolado.","Errada: na hipercalciúria idiopática o cálcio sérico e o PTH são normais."],["Hiperparatireoidismo secundário à doença renal crônica; quelante de fósforo.","Errada: no secundário o cálcio sérico é normal ou baixo e o fósforo alto."],["Sarcoidose; corticoide.","Errada: na sarcoidose o PTH é suprimido, pois a hipercalcemia é mediada por calcitriol."]],"conc":"O hiperparatireoidismo primário é causa importante de nefrolitíase recorrente. A investigação metabólica inclui cálcio sérico, PTH, ácido úrico e urina de 24 horas (cálcio, oxalato, citrato, ácido úrico, sódio e volume).","rac":"Hipercalcemia, hipofosfatemia e PTH elevado: hiperparatireoidismo primário, geralmente por adenoma. Nefrolitíase, osteoporose ou idade abaixo de 50 anos indicam paratireoidectomia.","pista":"PTH elevado com hipercalcemia.","mud":"PTH suprimido com hipercalcemia faria pensar em malignidade, sarcoidose ou intoxicação por vitamina D.","cmp":"Primário: cálcio alto e PTH alto. Secundário: cálcio normal ou baixo e PTH alto. Hipercalcemia não PTH: PTH baixo.","arm":"Investigar cálculos recorrentes sem dosar cálcio e PTH.","regra":"Cálculo recorrente com cálcio alto: dose o PTH.","cf":"A cintilografia com sestamibi e a ultrassonografia localizam o adenoma antes da cirurgia.","fonte":"AUA Medical Management of Kidney Stones (Pearle MS et al., 2014); Fifth International Workshop on Primary Hyperparathyroidism (Bilezikian JP et al., J Bone Miner Res 2022)."}]},{"id":"M16","titulo":"Injúria renal aguda","bloco":2,"q":[{"n":1,"sub":"Definição KDIGO","comp":"Aplicar o critério diagnóstico de IRA","tags":[],"rel":[],"enun":"Paciente internado tem creatinina de 0,9 mg/dL na admissão e 1,3 mg/dL 36 horas depois, com diurese preservada. Segundo o KDIGO, como interpretar?","ops":[["Há IRA, pois a creatinina subiu pelo menos 0,3 mg/dL em 48 horas.","Correta: aumento de pelo menos 0,3 mg/dL em 48 horas já define IRA pelo KDIGO."],["Não há IRA, pois a creatinina ainda está dentro do valor de referência do laboratório.","Errada: a IRA é definida pela variação em relação ao basal, não pelo valor absoluto dentro da referência."],["Não há IRA, pois seria necessário dobrar a creatinina basal.","Errada: dobrar a creatinina define estádio 2; o diagnóstico exige aumento de 0,3 em 48 horas ou 1,5 vez em 7 dias."],["Só haveria IRA se a diurese fosse menor que 400 mL por dia.","Errada: a oligúria é critério alternativo, não obrigatório."]],"conc":"KDIGO define IRA como aumento da creatinina de pelo menos 0,3 mg/dL em 48 horas, ou aumento para 1,5 vez o basal em 7 dias, ou diurese abaixo de 0,5 mL/kg/h por 6 horas.","rac":"De 0,9 para 1,3 em 36 horas: aumento de 0,4 em menos de 48 horas. Há IRA, estádio 1. Investigar a causa.","pista":"Variação absoluta de 0,4 mg/dL em 36 horas.","mud":"Aumento lento, de 0,2 mg/dL em 5 dias, não preencheria critério de IRA.","cmp":"Critério de creatinina: variação. Critério de diurese: abaixo de 0,5 mL/kg/h por 6 horas.","arm":"Esperar a creatinina sair da faixa de referência para diagnosticar IRA.","regra":"0,3 em 48 horas ou 1,5 vez em 7 dias: IRA.","cf":"A creatinina é marcador tardio: pode subir horas a dias depois da lesão.","fonte":"KDIGO Clinical Practice Guideline for Acute Kidney Injury (Kidney Int Suppl 2012;2:1-138)."},{"n":2,"sub":"Estadiamento KDIGO","comp":"Classificar a gravidade da IRA","tags":[],"rel":[],"enun":"Paciente com creatinina basal de 1,0 mg/dL apresenta creatinina de 2,4 mg/dL após quadro séptico, com diurese de 0,4 mL/kg/h por 14 horas. Qual é o estádio KDIGO?","ops":[["Estádio 2.","Correta: creatinina entre 2,0 e 2,9 vezes o basal ou diurese abaixo de 0,5 mL/kg/h por 12 horas ou mais definem estádio 2."],["Estádio 1.","Errada: o critério de creatinina (2,4 vezes) e a diurese baixa por mais de 12 horas já classificam como estádio 2."],["Estádio 3.","Errada: estádio 3 exige 3 vezes o basal, creatinina de pelo menos 4,0 mg/dL, diálise ou diurese abaixo de 0,3 mL/kg/h por 24 horas ou anúria por 12 horas."],["Não é possível estadiar.","Errada: o estadiamento usa a maior alteração já observada."]],"conc":"KDIGO: estádio 1 (1,5 a 1,9 vez ou aumento de 0,3; diurese abaixo de 0,5 por 6 a 12 horas); estádio 2 (2,0 a 2,9 vezes; abaixo de 0,5 por 12 horas ou mais); estádio 3 (3 vezes, creatinina de 4,0 ou mais, diálise; abaixo de 0,3 por 24 horas ou anúria por 12 horas).","rac":"2,4 vezes o basal e diurese abaixo de 0,5 por 14 horas: os dois critérios apontam estádio 2. Usa-se sempre o pior critério.","pista":"Creatinina 2,4 vezes o basal.","mud":"Creatinina de 3,2 ou necessidade de diálise mudaria para estádio 3.","cmp":"Usa-se o critério (creatinina ou diurese) que resultar no estádio mais grave.","arm":"Usar o valor absoluto de 2,0 mg/dL como corte de estádio.","regra":"Duas vezes o basal: estádio 2; três vezes ou diálise: estádio 3.","cf":"O estádio se associa a mortalidade e necessidade de diálise.","fonte":"KDIGO AKI Guideline (Kidney Int Suppl 2012)."},{"n":3,"sub":"Pré-renal com diurético","comp":"Usar a fração de excreção de ureia","tags":[],"rel":[],"enun":"Paciente com insuficiência cardíaca em uso de furosemida apresenta IRA. FENa 2,1% e FEUreia 25%. Sedimento urinário sem cilindros granulosos. Qual é a interpretação?","ops":[["Pré-renal; a FEUreia baixa vale mais que a FENa com diurético.","Correta: o diurético eleva a FENa; a FEUreia abaixo de 35% sugere causa pré-renal mesmo com diurético."],["Necrose tubular aguda, pois a FENa está acima de 2%.","Errada: em uso de diurético, a FENa perde valor; a FEUreia baixa e o sedimento sem cilindros apontam pré-renal."],["Nefrite intersticial aguda pela furosemida.","Errada: não há febre, rash, eosinofilia ou leucocitúria descritos; a interpretação é pré-renal."],["IRA pós-renal por obstrução.","Errada: os índices urinários não indicam obstrução; seria necessária ultrassonografia para essa hipótese."]],"conc":"Na IRA pré-renal, o túbulo funciona e reabsorve sódio e ureia avidamente (FENa abaixo de 1%, FEUreia abaixo de 35%, sódio urinário abaixo de 20, osmolaridade urinária acima de 500). Diuréticos aumentam a FENa, mas pouco alteram a FEUreia.","rac":"Usuário de furosemida com FENa de 2,1%: pouco confiável. FEUreia 25%: pré-renal. Sedimento sem cilindros granulosos reforça.","pista":"Uso de diurético com FEUreia abaixo de 35%.","mud":"FEUreia acima de 50% e cilindros granulosos pigmentados sugeririam necrose tubular aguda.","cmp":"Sem diurético: FENa. Com diurético: FEUreia.","arm":"Confiar na FENa em pacientes com diurético.","regra":"Diurético na história: olhe a FEUreia.","cf":"No contexto de insuficiência cardíaca, a IRA pode ser por congestão venosa renal, não apenas hipoperfusão.","fonte":"KDIGO AKI Guideline (2012); Carvounis CP et al. Kidney Int 2002;62:2223-2229."},{"n":4,"sub":"Necrose tubular aguda","comp":"Reconhecer o sedimento da NTA","tags":[],"rel":[],"enun":"Paciente com choque séptico há 3 dias tem creatinina de 3,8 mg/dL, oligúria e sedimento urinário com numerosos cilindros granulosos pigmentados (cor de barro). FENa 4%. Qual é o diagnóstico?","ops":[["Necrose tubular aguda isquêmica.","Correta: cilindros granulosos cor de barro e FENa elevada após choque caracterizam necrose tubular aguda."],["IRA pré-renal que responderá a hidratação.","Errada: a pré-renal tem sedimento sem cilindros granulosos e FENa baixa."],["Glomerulonefrite rapidamente progressiva.","Errada: a glomerulonefrite tem hematúria dismórfica e cilindros hemáticos."],["Nefrite intersticial aguda por antibiótico.","Errada: a nefrite intersticial tem leucocitúria e cilindros leucocitários, às vezes eosinofilúria."]],"conc":"A NTA é a causa mais comum de IRA intrínseca em pacientes internados, por isquemia (choque, sepse) ou nefrotoxicidade (aminoglicosídeos, contraste, rabdomiólise). O sedimento mostra células epiteliais tubulares e cilindros granulosos.","rac":"Choque, oligúria, FENa acima de 2% e cilindros granulosos: NTA. Tratamento de suporte, retirada de nefrotóxicos, ajuste de doses e diálise se indicada.","pista":"Cilindros granulosos cor de barro.","mud":"Cilindros hemáticos e hematúria dismórfica apontariam para glomerulonefrite.","cmp":"NTA: cilindros granulosos. Glomerulonefrite: cilindros hemáticos. Nefrite intersticial: cilindros leucocitários.","arm":"Insistir em volume em NTA estabelecida, causando sobrecarga.","regra":"Cilindro granuloso cor de barro: necrose tubular.","cf":"A recuperação ocorre em dias a semanas, muitas vezes com fase poliúrica.","fonte":"KDIGO AKI Guideline (2012); Perazella MA. Clin J Am Soc Nephrol 2015;10:1468-1477."},{"n":5,"sub":"IRA pós-renal","comp":"Identificar e tratar obstrução urinária","tags":[],"rel":[],"enun":"Homem de 78 anos com prostatismo há anos apresenta confusão, dor suprapúbica e oligúria. Creatinina 4,1 mg/dL (basal 1,1). Palpa-se massa em hipogástrio, maciça à percussão. Qual é a primeira medida?","ops":[["Sondagem vesical de alívio e ultrassonografia.","Correta: globo vesical em idoso com prostatismo sugere obstrução infravesical; a sondagem desobstrui e a ultrassonografia avalia hidronefrose."],["Hemodiálise de urgência pela creatinina elevada.","Errada: a causa obstrutiva deve ser corrigida primeiro; a desobstrução frequentemente reverte a IRA."],["Hidratação vigorosa para tratar IRA pré-renal.","Errada: o quadro é obstrutivo; volume sem desobstruir não resolve."],["Biópsia renal para definir a causa.","Errada: a biópsia não é indicada quando há causa obstrutiva evidente."]],"conc":"A IRA pós-renal decorre de obstrução bilateral (ou unilateral em rim único). Em homens idosos, a hiperplasia prostática é causa frequente. A ultrassonografia mostra hidronefrose.","rac":"Globo vesical palpável, prostatismo e IRA: obstrução infravesical. Sondagem vesical e ultrassonografia. Monitorar a poliúria pós-obstrutiva e os eletrólitos.","pista":"Massa hipogástrica maciça em idoso com prostatismo.","mud":"Ultrassonografia sem hidronefrose afastaria obstrução como causa principal.","cmp":"Pós-renal: hidronefrose. Pré-renal: índices de avidez por sódio. Intrínseca: alterações do sedimento.","arm":"Indicar diálise antes de desobstruir.","regra":"IRA em idoso com bexiga cheia: passe a sonda.","cf":"Após a desobstrução, pode haver poliúria importante, que exige reposição cuidadosa.","fonte":"KDIGO AKI Guideline (2012); Harrison's Principles of Internal Medicine, 21ª ed. (Acute Kidney Injury)."},{"n":6,"sub":"Indicação de diálise","comp":"Reconhecer indicação de diálise de urgência","tags":[],"rel":[],"enun":"Paciente com IRA estádio 3 apresenta dor torácica, atrito pericárdico, ureia de 260 mg/dL e sonolência. Potássio 5,4 mEq/L, bicarbonato 17 mEq/L, sem congestão. Qual é a conduta?","ops":[["Diálise de urgência por complicações urêmicas.","Correta: pericardite e encefalopatia urêmicas são indicações de diálise de urgência."],["Bicarbonato de sódio e observação, pois o potássio está pouco elevado.","Errada: o motivo da diálise aqui são as complicações urêmicas, não o potássio."],["Anti-inflamatório não esteroide para a pericardite.","Errada: a pericardite urêmica é tratada com diálise; AINE pioraria a função renal."],["Aguardar a ureia passar de 300 mg/dL para indicar diálise.","Errada: não há valor fixo de ureia; complicações urêmicas já indicam diálise."]],"conc":"Indicações clássicas de diálise urgente na IRA: acidose metabólica refratária, hipercalemia refratária, intoxicações dialisáveis, sobrecarga de volume refratária e complicações urêmicas (pericardite, encefalopatia, sangramento).","rac":"Pericardite e sonolência com ureia muito alta: uremia sintomática. Diálise de urgência.","pista":"Atrito pericárdico e alteração de consciência na uremia.","mud":"Sem complicações e com eletrólitos controlados, a diálise poderia ser adiada com monitorização.","cmp":"Mnemônico AEIOU: acidose, eletrólitos, intoxicação, sobrecarga (overload), uremia.","arm":"Esperar um número de ureia para dialisar paciente sintomático.","regra":"Uremia com pericardite ou encefalopatia: dialise.","cf":"Intoxicações por lítio, metanol, etilenoglicol e salicilatos são dialisáveis.","fonte":"KDIGO AKI Guideline (2012)."},{"n":7,"sub":"Hipercalemia","comp":"Tratar hipercalemia com alteração eletrocardiográfica","tags":[],"rel":[],"enun":"Paciente com IRA tem potássio de 7,2 mEq/L e ECG com ondas T apiculadas e alargamento do QRS. Qual é a primeira medida?","ops":[["Gluconato de cálcio intravenoso para estabilizar a membrana do miocárdio.","Correta: com alteração eletrocardiográfica, o cálcio é o primeiro passo, pois protege o coração em minutos; não reduz o potássio."],["Furosemida intravenosa para aumentar a excreção renal de potássio.","Errada: a furosemida tem efeito
