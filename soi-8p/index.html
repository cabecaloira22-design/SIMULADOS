lento e depende de função renal; não protege o coração."],["Resina de troca (poliestirenossulfonato) por via oral como primeira medida.","Errada: a resina age em horas; não é tratamento de emergência."],["Repetir o potássio para confirmar antes de tratar.","Errada: com alteração no ECG, o tratamento deve ser imediato."]],"conc":"O tratamento da hipercalemia tem três etapas: estabilizar a membrana (cálcio), deslocar o potássio para dentro das células (insulina com glicose, beta-2-agonista, bicarbonato se acidose) e remover o potássio do corpo (diurético, resinas, diálise).","rac":"Potássio de 7,2 com QRS alargado: risco iminente de arritmia. Gluconato de cálcio, depois insulina regular com glicose e salbutamol, e remoção (diálise se refratária).","pista":"Alterações eletrocardiográficas.","mud":"Hipercalemia leve sem alteração no ECG poderia ser tratada apenas com remoção e ajuste de medicações.","cmp":"Cálcio: protege. Insulina e beta-2-agonista: deslocam. Diálise, diurético e resina: removem.","arm":"Achar que o cálcio reduz o potássio sérico.","regra":"Hipercalemia com ECG alterado: cálcio primeiro.","cf":"O cálcio pode ser repetido se as alterações eletrocardiográficas persistirem após 5 a 10 minutos.","fonte":"KDIGO Controversies Conference on Potassium Homeostasis (Clase CM et al., Kidney Int 2020;97:42-61); UK Kidney Association. Clinical Practice Guideline: Treatment of Acute Hyperkalaemia in Adults, 2023."},{"n":8,"sub":"Rabdomiólise","comp":"Prevenir IRA por mioglobinúria","tags":[],"rel":[],"enun":"Homem de 25 anos após maratona sob calor intenso tem urina escura, mialgia intensa e CK de 85.000 U/L. A fita urinária é positiva para sangue, mas o sedimento mostra poucas hemácias. Qual é a conduta mais importante?","ops":[["Cristaloide isotônico em volume, visando diurese elevada.","Correta: a reposição volêmica precoce é a principal medida para prevenir IRA por mioglobina."],["Furosemida em dose alta como primeira medida.","Errada: diurético sem volume pode piorar a hipovolemia; não é a primeira medida."],["Restrição hídrica para evitar sobrecarga.","Errada: a hipovolemia agrava a lesão tubular por mioglobina."],["Biópsia muscular de urgência.","Errada: o diagnóstico é clínico e laboratorial; a biópsia não muda a conduta aguda."]],"conc":"Na rabdomiólise, a mioglobina liberada é tóxica ao túbulo, sobretudo em hipovolemia e urina ácida. A fita urinária detecta o heme (positiva para sangue), mas o sedimento não mostra hemácias proporcionalmente.","rac":"CK muito elevada, urina escura, fita positiva sem hemácias: mioglobinúria. Cristaloide isotônico em volume, buscando diurese de cerca de 200 a 300 mL/h, com monitorização de potássio, cálcio e fósforo.","pista":"Fita positiva para sangue com poucas hemácias no sedimento.","mud":"Muitas hemácias no sedimento indicariam hematúria verdadeira, não mioglobinúria.","cmp":"Mioglobinúria: fita positiva, sedimento sem hemácias. Hematúria: fita e sedimento positivos.","arm":"Usar diurético antes de repor volume.","regra":"Urina escura com CK alta: muito soro.","cf":"Hipocalcemia precoce não deve ser corrigida, salvo sintomas ou hipercalemia grave, pelo risco de deposição de cálcio no músculo.","fonte":"Bosch X, Poch E, Grau JM. Rhabdomyolysis and acute kidney injury. N Engl J Med 2009;361:62-72."},{"n":9,"sub":"Nefropatia por contraste","comp":"Prevenir IRA associada a contraste","tags":[],"rel":[],"enun":"Diabético com TFGe de 28 mL/min/1,73 m² precisa de TC com contraste iodado intravenoso por suspeita de abscesso abdominal. Qual medida preventiva tem melhor respaldo?","ops":[["Hidratação isotônica e menor dose de contraste, sem negar o exame.","Correta: em pacientes de alto risco, a hidratação isotônica é a medida recomendada, sem deixar de fazer o exame necessário."],["N-acetilcisteína oral em dose alta como medida principal.","Errada: a N-acetilcisteína não demonstrou benefício consistente e não é recomendada."],["Contraindicar a TC, pois a TFGe abaixo de 30 proíbe contraste.","Errada: o exame necessário não deve ser negado; avaliam-se riscos e benefícios com profilaxia."],["Hemodiálise profilática logo após o exame.","Errada: a diálise profilática não previne a lesão e não é recomendada."]],"conc":"O risco de IRA associada a contraste intravenoso é maior com TFGe abaixo de 30 mL/min/1,73 m². A prevenção inclui hidratação isotônica, menor volume de contraste, evitar exames repetidos em curto intervalo e suspender nefrotóxicos.","rac":"TFGe 28 e exame necessário: realizar com hidratação isotônica e menor dose de contraste. Avaliar suspensão de metformina e AINE.","pista":"TFGe abaixo de 30 com exame imprescindível.","mud":"TFGe acima de 45 sem fatores de risco dispensaria profilaxia específica.","cmp":"Profilaxia: hidratação isotônica. Sem benefício: N-acetilcisteína, diálise profilática.","arm":"Negar um exame necessário por medo do contraste.","regra":"Contraste em rim doente: hidrate e faça o exame que precisa ser feito.","cf":"A metformina deve ser suspensa temporariamente em pacientes com TFGe abaixo de 30 ou IRA.","fonte":"ACR–NKF Consensus on Use of IV Iodinated Contrast in Patients with Kidney Disease (Davenport MS et al., Radiology 2020;294:660-668)."},{"n":10,"sub":"Nefrite intersticial aguda","comp":"Reconhecer IRA por hipersensibilidade a fármaco","tags":[],"rel":[],"enun":"Mulher de 40 anos em uso de amoxicilina há 10 dias apresenta febre, exantema maculopapular e creatinina de 2,6 mg/dL (basal 0,8). Exames: eosinofilia, urina com leucocitúria estéril e cilindros leucocitários. Qual é a conduta?","ops":[["Suspender a amoxicilina e considerar corticoide.","Correta: nefrite intersticial aguda por fármaco é tratada com suspensão do agente; o corticoide pode acelerar a recuperação."],["Manter a amoxicilina e acrescentar anti-histamínico.","Errada: manter o fármaco perpetua a lesão renal."],["Iniciar ciprofloxacino para tratar pielonefrite.","Errada: a leucocitúria é estéril, e as quinolonas também podem causar nefrite intersticial."],["Indicar pulsoterapia e ciclofosfamida como na glomerulonefrite.","Errada: a nefrite intersticial por fármaco não exige imunossupressão intensa."]],"conc":"A nefrite intersticial aguda é reação de hipersensibilidade no interstício renal, causada sobretudo por fármacos (betalactâmicos, IBP, AINE, quinolonas, alopurinol). A tríade de febre, rash e eosinofilia ocorre em minoria dos casos.","rac":"IRA após antibiótico com febre, exantema, eosinofilia e cilindros leucocitários: nefrite intersticial. Suspender o fármaco; corticoide em casos sem melhora em poucos dias ou graves.","pista":"Cilindros leucocitários com leucocitúria estéril após betalactâmico.","mud":"Hematúria dismórfica com cilindros hemáticos sugeriria glomerulonefrite.","cmp":"Nefrite intersticial por AINE pode vir com síndrome nefrótica e sem febre ou rash.","arm":"Manter o fármaco suspeito.","regra":"IRA com rash após antibiótico: suspenda o fármaco.","cf":"O IBP é causa frequente e subestimada de nefrite intersticial em idosos.","fonte":"Perazella MA, Markowitz GS. Drug-induced acute interstitial nephritis. Nat Rev Nephrol 2010;6:461-470; KDIGO AKI Guideline (2012)."}]},{"id":"M17","titulo":"Doença renal crônica","bloco":2,"q":[{"n":1,"sub":"Definição","comp":"Aplicar o critério de cronicidade","tags":[],"rel":[],"enun":"Mulher de 60 anos, hipertensa, tem TFGe de 52 mL/min/1,73 m² em exame isolado de rotina, sem exames anteriores. Albuminúria não dosada. O que é necessário para diagnosticar DRC?","ops":[["Confirmar TFGe baixa ou albuminúria por mais de 3 meses.","Correta: a DRC exige TFGe abaixo de 60 ou marcadores de lesão renal persistentes por mais de 3 meses."],["O exame isolado já confirma DRC estádio G3a, sem necessidade de repetição.","Errada: um valor isolado pode refletir IRA ou variação; a cronicidade precisa ser confirmada."],["É necessária biópsia renal para firmar o diagnóstico de DRC.","Errada: a DRC é diagnosticada por TFGe e marcadores de lesão; a biópsia tem indicações específicas."],["A DRC só é diagnosticada com TFGe abaixo de 30 mL/min/1,73 m².","Errada: o limiar diagnóstico é TFGe abaixo de 60 ou presença de marcador de lesão."]],"conc":"KDIGO: DRC é alteração de estrutura ou função renal presente por mais de 3 meses, com implicações para a saúde: TFG abaixo de 60 mL/min/1,73 m² ou marcadores de lesão (albuminúria de pelo menos 30 mg/g, alterações de sedimento, alterações estruturais em imagem, histológicas ou tubulares).","rac":"Valor isolado de 52: repetir TFGe e dosar a relação albumina/creatinina urinária; se persistir por mais de 3 meses, há DRC.","pista":"Exame isolado, sem histórico.","mud":"Duas TFGe abaixo de 60 com intervalo maior que 3 meses confirmariam DRC.","cmp":"IRA: alteração em dias. DRC: alteração por mais de 3 meses.","arm":"Diagnosticar DRC com um único exame.","regra":"DRC: mais de 3 meses de TFGe abaixo de 60 ou lesão renal.","cf":"A TFGe pela equação CKD-EPI 2021 sem coeficiente racial é a recomendada.","fonte":"KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314)."},{"n":2,"sub":"Estadiamento GA","comp":"Classificar a DRC por TFG e albuminúria","tags":[],"rel":[],"enun":"Homem de 64 anos, diabético, com TFGe de 38 mL/min/1,73 m² e relação albumina/creatinina urinária de 450 mg/g, ambas persistentes há 1 ano. Qual é o estadiamento KDIGO?","ops":[["G3b A3.","Correta: TFGe de 30 a 44 é G3b, e relação albumina/creatinina acima de 300 mg/g é A3."],["G3a A2.","Errada: G3a é TFGe de 45 a 59, e A2 é albuminúria de 30 a 300 mg/g."],["G4 A3.","Errada: G4 corresponde a TFGe de 15 a 29."],["G3b A2.","Errada: 450 mg/g está acima de 300, portanto A3."]],"conc":"Estadiamento KDIGO: G1 (90 ou mais), G2 (60 a 89), G3a (45 a 59), G3b (30 a 44), G4 (15 a 29), G5 (abaixo de 15). Albuminúria: A1 (abaixo de 30 mg/g), A2 (30 a 300), A3 (acima de 300).","rac":"TFGe 38: G3b. Relação albumina/creatinina 450: A3. Risco muito alto de progressão e eventos cardiovasculares.","pista":"TFGe entre 30 e 44 e albuminúria acima de 300.","mud":"TFGe de 48 com relação de 150 seria G3a A2.","cmp":"G3a: 45 a 59. G3b: 30 a 44. A2: 30 a 300. A3: acima de 300.","arm":"Esquecer a albuminúria no estadiamento.","regra":"DRC se classifica por G e por A.","cf":"O mapa de calor do KDIGO usa G e A para estimar risco e frequência de acompanhamento.","fonte":"KDIGO 2024 CKD Guideline (Kidney Int 2024)."},{"n":3,"sub":"Nefroproteção","comp":"Prescrever terapia que reduz a progressão","tags":[],"rel":[],"enun":"Diabético tipo 2 com DRC G3a A3, PA 142/88 mmHg, em uso de metformina. Sem uso de IECA ou BRA. Potássio 4,6 mEq/L. Qual combinação reduz a progressão da doença renal?","ops":[["IECA ou BRA em dose máxima tolerada associado a inibidor de SGLT2.","Correta: o bloqueio do sistema renina-angiotensina e o iSGLT2 reduzem a progressão da DRC com albuminúria e o risco cardiovascular."],["IECA associado a BRA em dose plena (duplo bloqueio).","Errada: o duplo bloqueio aumenta hipercalemia e IRA sem benefício renal."],["Bloqueador de canal de cálcio isolado como primeira escolha.","Errada: na DRC com albuminúria, o IECA ou BRA é a primeira escolha."],["Restrição proteica rigorosa de 0,4 g/kg por dia como medida principal.","Errada: a meta proteica recomendada é cerca de 0,8 g/kg por dia; restrição extrema aumenta desnutrição."]],"conc":"Pilares da nefroproteção na DRC com albuminúria: IECA ou BRA em dose máxima tolerada, iSGLT2 (iniciado com TFGe de pelo menos 20), controle pressórico e glicêmico, e, no diabetes tipo 2 com albuminúria persistente, finerenona como adicional.","rac":"DRC diabética com albuminúria: IECA ou BRA titulado e iSGLT2 (dapagliflozina ou empagliflozina). Monitorar potássio e creatinina em 2 a 4 semanas.","pista":"Albuminúria A3 sem bloqueio do sistema renina-angiotensina.","mud":"Potássio acima de 5,5 mEq/L exigiria correção ou uso de quelante de potássio antes de titular o IECA.","cmp":"IECA ou BRA: reduz albuminúria. iSGLT2: reduz progressão e insuficiência cardíaca. Finerenona: adicional no DM2.","arm":"Associar IECA e BRA.","regra":"DRC com albuminúria: bloqueio do sistema renina-angiotensina mais iSGLT2.","cf":"Os iSGLT2 também reduzem a progressão em DRC não diabética com albuminúria.","fonte":"KDIGO 2024 CKD Guideline; KDIGO 2022 Clinical Practice Guideline for Diabetes Management in CKD (Kidney Int 2022;102(5S):S1-S127)."},{"n":4,"sub":"Creatinina após IECA","comp":"Interpretar a elevação da creatinina","tags":[],"rel":[],"enun":"Paciente com DRC iniciou enalapril. Após 2 semanas, a creatinina subiu de 1,6 para 1,9 mg/dL (aumento de 19%) e o potássio está em 5,0 mEq/L. Qual é a conduta?","ops":[["Manter o IECA, pois aumento de até 30% é esperado.","Correta: elevação de até 30% sem hipercalemia significativa não justifica suspender o IECA."],["Suspender o IECA, pois qualquer aumento de creatinina indica lesão renal.","Errada: a elevação moderada é hemodinâmica e esperada; o benefício renal a longo prazo se mantém."],["Associar um BRA para potencializar a proteção renal.","Errada: o duplo bloqueio aumenta efeitos adversos sem benefício."],["Solicitar biópsia renal pela piora da função.","Errada: o aumento esperado após IECA não é indicação de biópsia."]],"conc":"IECA e BRA dilatam a arteríola eferente e reduzem a pressão intraglomerular, o que diminui a TFG de forma hemodinâmica e reversível. Esse efeito se associa a proteção renal a longo prazo.","rac":"Aumento de 19%, potássio 5,0: manter e reavaliar. Se o aumento ultrapassar 30%, investigar hipovolemia, estenose de artéria renal ou nefrotóxicos.","pista":"Aumento menor que 30% com potássio aceitável.","mud":"Aumento acima de 30% ou potássio acima de 5,5 mEq/L levariam a reduzir a dose e investigar causas.","cmp":"Até 30%: manter. Acima de 30%: investigar e ajustar.","arm":"Suspender o IECA por elevação pequena da creatinina.","regra":"Creatinina subiu menos de 30% com IECA: siga em frente.","cf":"Estenose bilateral de artéria renal pode causar IRA importante após IECA.","fonte":"KDIGO 2024 CKD Guideline; KDIGO 2021 Clinical Practice Guideline for Blood Pressure in CKD (Kidney Int 2021;99(3S):S1-S87)."},{"n":5,"sub":"Anemia da DRC","comp":"Conduzir a anemia antes do agente estimulador","tags":[],"rel":[],"enun":"Paciente com DRC G4 tem hemoglobina de 9,2 g/dL, normocítica. Saturação de transferrina 16% e ferritina 80 ng/mL. Qual é a primeira conduta?","ops":[["Repor ferro antes de considerar eritropoetina.","Correta: com saturação de transferrina baixa e ferritina baixa, a reposição de ferro é o primeiro passo."],["Iniciar eritropoetina imediatamente, com meta de hemoglobina de 13 g/dL.","Errada: deve-se corrigir o ferro antes, e metas acima de 11,5 g/dL aumentam eventos cardiovasculares."],["Transfundir concentrado de hemácias para hemoglobina de 12 g/dL.","Errada: a transfusão é reservada a anemia sintomática grave ou urgências."],["Investigar apenas com mielograma, pois a anemia da DRC é medular.","Errada: a investigação inicial inclui ferro, B12, folato e perdas; o mielograma não é rotina."]],"conc":"A anemia da DRC decorre principalmente de deficiência relativa de eritropoetina, mas a deficiência de ferro é frequente e deve ser corrigida primeiro. Também se investigam B12, folato, perdas e inflamação.","rac":"Saturação abaixo de 20% e ferritina abaixo de 100 (não dialítico): deficiência de ferro. Repor ferro (oral ou intravenoso). Persistindo a anemia, iniciar agente estimulador sem ultrapassar hemoglobina de 11,5 g/dL.","pista":"Saturação de transferrina e ferritina baixas.","mud":"Com estoques de ferro adequados, a próxima etapa seria agente estimulador da eritropoese.","cmp":"Primeiro ferro, depois eritropoetina. Meta de hemoglobina: sem passar de 11,5 g/dL.","arm":"Mirar hemoglobina normal com eritropoetina.","regra":"Anemia na DRC: corrija o ferro primeiro.","cf":"Na hemodiálise, o ferro intravenoso é preferido.","fonte":"KDIGO Clinical Practice Guideline for Anemia in CKD (Kidney Int Suppl 2012;2:279-335)."},{"n":6,"sub":"Distúrbio mineral e ósseo","comp":"Interpretar alterações de cálcio, fósforo e PTH","tags":[],"rel":[],"enun":"Paciente com DRC G4 tem fósforo de 6,1 mg/dL, cálcio de 8,4 mg/dL, PTH de 420 pg/mL e 25-OH vitamina D baixa. Qual é a interpretação e a conduta inicial?","ops":[["Hiperparatireoidismo secundário; controlar fósforo e repor vitamina D.","Correta: retenção de fósforo, redução de calcitriol e hipocalcemia estimulam o PTH; o tratamento começa pelo controle do fósforo e da vitamina D."],["Hiperparatireoidismo primário; paratireoidectomia imediata.","Errada: no primário o cálcio está alto; aqui o cálcio é baixo e o fósforo alto, típico de secundário."],["Hipoparatireoidismo; reposição de cálcio em dose alta.","Errada: o PTH está elevado, não baixo."],["Osteoporose pós-menopausa; bifosfonato.","Errada: o quadro é distúrbio mineral da DRC, e bifosfonatos exigem cautela na DRC avançada."]],"conc":"Na DRC, a perda de néfrons reduz a excreção de fósforo e a síntese de calcitriol. O FGF-23 sobe, o cálcio tende a cair e o PTH aumenta (hiperparatireoidismo secundário), com doença óssea e calcificação vascular.","rac":"Fósforo alto, cálcio baixo e PTH alto: hiperparatireoidismo secundário. Dieta pobre em fósforo, quelante, vitamina D nativa; calcitriol ou calcimimético conforme evolução.","pista":"Fósforo alto com cálcio baixo e PTH alto.","mud":"Hipercalcemia com PTH alto em paciente sem DRC indicaria hiperparatireoidismo primário.","cmp":"Secundário: cálcio baixo ou normal, fósforo alto. Terciário: PTH autônomo com cálcio alto após longa DRC.","arm":"Tratar o PTH alto sem controlar o fósforo.","regra":"DRC com fósforo alto: dieta, quelante e vitamina D.","cf":"Hiperparatireoidismo terciário após transplante ou DRC prolongada pode exigir paratireoidectomia.","fonte":"KDIGO 2017 Clinical Practice Guideline Update for CKD-MBD (Kidney Int Suppl 2017;7:1-59)."},{"n":7,"sub":"Metformina na DRC","comp":"Ajustar antidiabético conforme a TFGe","tags":[],"rel":[],"enun":"Diabético tipo 2 com TFGe de 38 mL/min/1,73 m², estável, usa metformina 2.550 mg por dia. Qual é a conduta?","ops":[["Reduzir para até 1.000 mg/dia e suspender se TFGe abaixo de 30.","Correta: com TFGe de 30 a 44, a metformina pode ser mantida em dose reduzida; abaixo de 30 é contraindicada."],["Manter a dose atual, pois a metformina não depende da função renal.","Errada: a metformina é eliminada pelo rim, e o acúmulo aumenta o risco de acidose lática."],["Suspender imediatamente a metformina, pois toda DRC a contraindica.","Errada: a metformina é permitida, com ajuste, até TFGe de 30."],["Trocar por glibenclamida, mais segura na DRC.","Errada: a glibenclamida tem alto risco de hipoglicemia na DRC e deve ser evitada."]],"conc":"A metformina é eliminada pelos rins. Com TFGe de 45 ou mais, dose plena; de 30 a 44, dose máxima de cerca de 1.000 mg por dia; abaixo de 30, suspender.","rac":"TFGe 38: faixa de 30 a 44. Reduzir a dose. Considerar iSGLT2 (benefício renal) e agonista de GLP-1 para o controle glicêmico.","pista":"TFGe entre 30 e 44.","mud":"TFGe de 25 obrigaria à suspensão.","cmp":"Metformina: plena com TFGe de 45 ou mais, reduzida de 30 a 44, suspensa abaixo de 30. Sulfonilureias de longa ação: evitar.","arm":"Manter dose plena ou suspender sem necessidade.","regra":"Metformina: corta pela metade abaixo de 45, para abaixo de 30.","cf":"A metformina deve ser suspensa temporariamente em situações de risco, como IRA, sepse ou contraste em TFGe baixa.","fonte":"KDIGO 2022 Clinical Practice Guideline for Diabetes Management in CKD (Kidney Int 2022)."},{"n":8,"sub":"Encaminhamento e preparo para terapia renal substitutiva","comp":"Planejar o acesso e o início da diálise","tags":[],"rel":[],"enun":"Paciente de 58 anos com DRC G4 (TFGe 22 mL/min/1,73 m²) com queda progressiva da TFGe nos últimos anos, assintomático. Qual é a conduta mais adequada?","ops":[["Nefrologista, decisão sobre terapia renal e fístula arteriovenosa.","Correta: com TFGe abaixo de 30, deve-se encaminhar, informar e preparar o acesso com antecedência."],["Iniciar hemodiálise imediatamente, pois a TFGe está abaixo de 25.","Errada: o início da diálise é guiado por sintomas e complicações, não por um valor isolado de TFGe."],["Aguardar sintomas urêmicos para encaminhar ao nefrologista.","Errada: o encaminhamento tardio aumenta o início de diálise por cateter e a mortalidade."],["Puncionar as veias dos dois braços para exames frequentes.","Errada: deve-se preservar as veias do membro não dominante para futura fístula."]],"conc":"Na DRC G4, o nefrologista conduz o preparo para terapia renal substitutiva: educação, decisão compartilhada, inscrição para transplante preemptivo quando possível e confecção de fístula com antecedência (meses antes da necessidade).","rac":"TFGe 22 com progressão: encaminhar, discutir modalidades, preservar veias e confeccionar fístula. Iniciar diálise quando houver sintomas, sobrecarga refratária, distúrbios eletrolíticos ou desnutrição.","pista":"TFGe abaixo de 30 em progressão.","mud":"Pericardite, encefalopatia ou hipercalemia refratária levariam ao início imediato da diálise.","cmp":"Fístula: acesso preferido. Cateter: temporário, mais infecções.","arm":"Iniciar diálise por número isolado.","regra":"DRC G4: prepare o acesso antes de precisar dele.","cf":"O transplante renal preemptivo, antes da diálise, é a modalidade de melhor sobrevida.","fonte":"KDIGO 2024 CKD Guideline; Brasil. MS. Diretrizes Clínicas para o Cuidado ao Paciente com DRC no SUS, 2014."},{"n":9,"sub":"Rastreio da DRC","comp":"Identificar o grupo e os exames de rastreio","tags":[],"rel":[],"enun":"Na atenção primária, qual estratégia de rastreio da DRC é recomendada para pacientes com hipertensão ou diabetes?","ops":[["TFGe e relação albumina/creatinina urinária ao menos anualmente.","Correta: TFGe e albuminúria são os dois pilares do rastreio em grupos de risco."],["Ultrassonografia renal anual como exame isolado de rastreio.","Errada: a ultrassonografia não substitui TFGe e albuminúria e não é exame de rastreio."],["Urina de 24 horas para clearance de creatinina em todos os pacientes, a cada 3 meses.","Errada: a coleta de 24 horas é trabalhosa e não é método de rastreio; usa-se TFGe e relação albumina/creatinina."],["Biópsia renal nos diabéticos com mais de 10 anos de doença.","Errada: biópsia não é método de rastreio."]],"conc":"Os principais grupos de risco para DRC são diabetes, hipertensão, doença cardiovascular, história familiar de DRC, obesidade e idade avançada. O rastreio usa creatinina com TFGe e relação albumina/creatinina urinária.","rac":"Hipertensos e diabéticos: TFGe e relação albumina/creatinina pelo menos uma vez por ano; frequência maior conforme o estádio.","pista":"Grupos de risco na atenção primária.","mud":"Com DRC já diagnosticada, a frequência dos exames é ajustada pela categoria G e A.","cmp":"Rastreio: TFGe e relação albumina/creatinina. Ultrassonografia: avaliação estrutural complementar.","arm":"Rastrear só com creatinina, sem albuminúria.","regra":"Diabético e hipertenso: TFGe e albuminúria todo ano.","cf":"Diabetes e hipertensão são as principais causas de DRC em diálise no Brasil.","fonte":"KDIGO 2024 CKD Guideline; Brasil. MS. Diretrizes Clínicas para o Cuidado ao Paciente com DRC no SUS, 2014."},{"n":10,"sub":"Acidose metabólica","comp":"Tratar acidose da DRC","tags":[],"rel":[],"enun":"Paciente com DRC G4 tem bicarbonato sérico de 16 mEq/L, persistente em dois exames, sem outras causas de acidose. Qual é a conduta recomendada?","ops":[["Bicarbonato de sódio por via oral.","Correta: na DRC com bicarbonato abaixo de 18 mEq/L, a reposição oral é recomendada para reduzir perda óssea, catabolismo muscular e progressão."],["Não tratar, pois a acidose da DRC é compensada e inofensiva.","Errada: a acidose crônica piora a doença óssea, o catabolismo proteico e pode acelerar a progressão."],["Hemodiálise imediata para corrigir a acidose.","Errada: acidose leve a moderada crônica é tratada com bicarbonato oral, não com diálise."],["Dieta hiperproteica de origem animal.","Errada: a proteína animal aumenta a carga ácida; frutas e vegetais ajudam a reduzir a acidose."]],"conc":"A redução da excreção de ácido pelos rins causa acidose metabólica na DRC avançada. A acidose crônica favorece desmineralização óssea, catabolismo muscular e progressão da DRC.","rac":"Bicarbonato de 16 persistente: repor bicarbonato oral, sem ultrapassar o limite superior da normalidade. Dieta rica em frutas e vegetais ajuda.","pista":"Bicarbonato abaixo de 18 mEq/L persistente.","mud":"Bicarbonato de 21 mEq/L dispensaria reposição medicamentosa, com medidas dietéticas.","cmp":"DRC: acidose com ânion gap normal no início, aumentado na fase avançada.","arm":"Ignorar a acidose crônica da DRC.","regra":"Bicarbonato abaixo de 18 na DRC: reponha por via oral.","cf":"Atenção à sobrecarga de sódio com o bicarbonato em pacientes com edema ou hipertensão de difícil controle.","fonte":"KDIGO 2024 CKD Guideline (Kidney Int 2024)."}]},{"id":"M18","titulo":"Síndrome nefrítica e nefrótica","bloco":2,"q":[{"n":1,"sub":"Nefrítica versus nefrótica","comp":"Diferenciar as síndromes glomerulares","tags":[],"rel":[],"enun":"Paciente A: edema generalizado, proteinúria de 6 g/24 h, albumina 2,1 g/dL, colesterol 380 mg/dL e sedimento sem hemácias. Paciente B: edema leve, hipertensão, oligúria, urina cor de coca-cola, hematúria dismórfica com cilindros hemáticos e proteinúria de 1,2 g/24 h. Como classificar?","ops":[["A tem síndrome nefrótica; B tem síndrome nefrítica.","Correta: proteinúria maciça, hipoalbuminemia e dislipidemia definem nefrótica; hematúria glomerular, hipertensão, oligúria e proteinúria não nefrótica definem nefrítica."],["A tem síndrome nefrítica; B tem síndrome nefrótica.","Errada: inverte as síndromes."],["Ambos têm síndrome nefrótica, pois os dois têm edema.","Errada: o edema ocorre nas duas; o que diferencia é a proteinúria e o sedimento."],["Ambos têm IRA pré-renal por hipovolemia.","Errada: os achados urinários indicam doença glomerular, não pré-renal."]],"conc":"Síndrome nefrótica: proteinúria acima de 3,5 g/24 h (em criança, acima de 40 mg/m²/h), hipoalbuminemia, edema e dislipidemia, com sedimento pouco ativo. Síndrome nefrítica: hematúria glomerular (dismórfica, cilindros hemáticos), hipertensão, edema, oligúria e proteinúria geralmente abaixo de 3,5 g.","rac":"A: proteinúria de 6 g, albumina 2,1, dislipidemia, sedimento limpo: nefrótica. B: hematúria dismórfica, cilindros hemáticos, hipertensão, oligúria: nefrítica.","pista":"Cilindros hemáticos e hematúria dismórfica no paciente B.","mud":"Quadros mistos (nefrítica com proteinúria nefrótica) ocorrem, por exemplo, na nefrite lúpica e na glomerulonefrite membranoproliferativa.","cmp":"Nefrótica: barreira à proteína rompida. Nefrítica: inflamação glomerular com hematúria.","arm":"Classificar pela presença de edema.","regra":"Proteína demais: nefrótica. Sangue e pressão alta: nefrítica.","cf":"Cilindros hemáticos são patognomônicos de origem glomerular da hematúria.","fonte":"KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases (Kidney Int 2021;100(4S):S1-S276)."},{"n":2,"sub":"Lesão mínima na criança","comp":"Tratar síndrome nefrótica idiopática infantil","tags":[],"rel":[],"enun":"Menino de 4 anos com edema palpebral e de membros inferiores há 1 semana. PA normal, sem hematúria, função renal normal, complemento normal. Proteinúria nefrótica e albumina de 1,8 g/dL. Qual é a conduta?","ops":[["Prednisona sem biópsia, por provável lesão mínima.","Correta: em criança de 1 a 10 anos com quadro típico, a lesão mínima é a causa mais comum e o tratamento empírico com corticoide é o padrão."],["Biópsia renal antes de qualquer tratamento.","Errada: a biópsia é reservada a casos atípicos (idade fora da faixa, hematúria, hipertensão, complemento baixo, IRA) ou corticorresistência."],["Ciclofosfamida como primeira linha.","Errada: imunossupressores são usados em recidivas frequentes, corticodependência ou resistência."],["Apenas diurético e restrição de sal, sem imunossupressão.","Errada: a lesão mínima responde ao corticoide, que é o tratamento principal."]],"conc":"A doença de lesão mínima é a principal causa de síndrome nefrótica na infância. A microscopia óptica é normal, e a eletrônica mostra fusão de podócitos. Responde ao corticoide na grande maioria dos casos.","rac":"Criança de 4 anos, nefrótica pura, sem hematúria, hipertensão ou complemento baixo: lesão mínima presumida. Prednisona e acompanhamento da resposta.","pista":"Faixa etária típica com síndrome nefrótica pura.","mud":"Hematúria, hipertensão, complemento baixo ou ausência de resposta ao corticoide em 4 a 6 semanas indicariam biópsia.","cmp":"Criança: lesão mínima, corticoide sem biópsia. Adulto: biópsia antes de tratar.","arm":"Biopsiar toda criança com síndrome nefrótica.","regra":"Criança com nefrótica pura: prednisona.","cf":"A resposta ao corticoide é o fator prognóstico mais importante na infância.","fonte":"KDIGO 2021 Glomerular Diseases Guideline; Sociedade Brasileira de Pediatria/Sociedade Brasileira de Nefrologia — síndrome nefrótica na infância."},{"n":3,"sub":"Nefropatia membranosa","comp":"Identificar o marcador da forma primária","tags":[],"rel":[],"enun":"Homem de 55 anos com síndrome nefrótica, sem hematúria significativa e com função renal normal. A biópsia mostra espessamento difuso da membrana basal com depósitos subepiteliais. Qual anticorpo é característico da forma primária?","ops":[["Anticorpo anti-receptor da fosfolipase A2 (anti-PLA2R).","Correta: o anti-PLA2R está presente na maioria dos casos de nefropatia membranosa primária."],["ANCA anti-proteinase 3.","Errada: o ANCA se associa a vasculites com glomerulonefrite pauci-imune."],["Anticorpo antimembrana basal glomerular (anti-MBG) circulante.","Errada: o anti-MBG causa glomerulonefrite crescêntica com depósito linear, não membranosa."],["Anti-DNA de dupla hélice.","Errada: o anti-DNA sugere lúpus; a membranosa lúpica (classe V) é forma secundária."]],"conc":"A nefropatia membranosa é causa comum de síndrome nefrótica em adultos. A forma primária é autoimune, com anti-PLA2R na maioria. Formas secundárias: neoplasias (sobretudo em idosos), lúpus, hepatite B, fármacos.","rac":"Adulto nefrótico com depósitos subepiteliais e espessamento da membrana basal: membranosa. Dosar anti-PLA2R e investigar causas secundárias, como câncer conforme idade.","pista":"Depósitos subepiteliais com espessamento difuso da membrana basal.","mud":"Anti-PLA2R negativo em idoso levaria a investigar neoplasia de forma mais ativa.","cmp":"Membranosa: adulto, nefrótica, anti-PLA2R, risco de trombose de veia renal. Lesão mínima: criança, corticoide.","arm":"Não investigar causas secundárias na membranosa.","regra":"Membranosa primária: anti-PLA2R.","cf":"Os títulos de anti-PLA2R acompanham a atividade e ajudam a monitorar a resposta.","fonte":"KDIGO 2021 Glomerular Diseases Guideline."},{"n":4,"sub":"Trombose na síndrome nefrótica","comp":"Reconhecer complicação tromboembólica","tags":[],"rel":[],"enun":"Mulher de 48 anos com nefropatia membranosa e albumina de 1,9 g/dL apresenta dor lombar esquerda súbita, hematúria macroscópica e piora da função renal. Qual é a hipótese e o mecanismo?","ops":[["Trombose de veia renal, por hipercoagulabilidade nefrótica.","Correta: a síndrome nefrótica, sobretudo membranosa com albumina muito baixa, é estado pró-trombótico."],["Cólica renal por cálculo de cálcio pela hipercalciúria nefrótica.","Errada: a hipocalcemia total na nefrótica não causa hipercalciúria relevante; o quadro sugere trombose."],["Pielonefrite aguda por imunossupressão.","Errada: não há febre nem sintomas infecciosos descritos."],["Infarto renal por embolia de origem cardíaca.","Errada: o contexto de nefropatia membranosa com hipoalbuminemia grave aponta para trombose venosa."]],"conc":"Na síndrome nefrótica, há perda urinária de anticoagulantes naturais (antitrombina III, proteínas C e S) e aumento hepático de fibrinogênio e fatores pró-coagulantes. A trombose de veia renal é mais associada à membranosa.","rac":"Dor lombar súbita, hematúria e piora renal em membranosa com albumina baixa: trombose de veia renal. Angio-TC ou Doppler e anticoagulação.","pista":"Nefropatia membranosa com albumina abaixo de 2,0 a 2,5 g/dL.","mud":"Febre, disúria e leucocitúria apontariam para infecção urinária.","cmp":"Complicações da nefrótica: trombose, infecções (pneumococo), dislipidemia, desnutrição proteica.","arm":"Esquecer o risco trombótico da síndrome nefrótica.","regra":"Membranosa com albumina muito baixa: cuidado com trombose.","cf":"Anticoagulação profilática pode ser considerada na membranosa com albumina muito baixa e baixo risco de sangramento.","fonte":"KDIGO 2021 Glomerular Diseases Guideline."},{"n":5,"sub":"Glomeruloesclerose segmentar e focal","comp":"Associar a lesão a causas secundárias","tags":[],"rel":[],"enun":"Homem de 35 anos, com infecção por HIV não tratada, apresenta síndrome nefrótica grave e piora rápida da função renal. Os rins são aumentados de tamanho na ultrassonografia. Qual lesão é a mais provável na biópsia?","ops":[["GESF colapsante (nefropatia associada ao HIV).","Correta: a nefropatia associada ao HIV é forma colapsante de GESF, com proteinúria maciça, rins aumentados e progressão rápida."],["Doença de lesão mínima, por ser a causa mais comum em adultos.","Errada: a lesão mínima é causa importante em crianças e não cursa com rins aumentados e piora rápida típica do HIV."],["Nefropatia por IgA, pela hematúria pós-infecciosa.","Errada: não há hematúria sinfaringítica, e a apresentação é nefrótica grave."],["Glomerulonefrite pós-estreptocócica.","Errada: não há infecção estreptocócica prévia, e o quadro não é nefrítico."]],"conc":"A GESF pode ser primária ou secundária (HIV, obesidade, redução de massa renal, refluxo, fármacos como heroína e pamidronato, variantes do APOL1 em pessoas de ascendência africana). A variante colapsante tem pior prognóstico.","rac":"HIV não tratado com nefrótica grave, rins aumentados e piora rápida: nefropatia associada ao HIV (GESF colapsante). Tratamento com terapia antirretroviral e bloqueio do sistema renina-angiotensina.","pista":"HIV não tratado com rins aumentados.","mud":"Em obeso sem outros fatores, a GESF secundária adaptativa cursa com proteinúria geralmente sem hipoalbuminemia intensa.","cmp":"GESF primária: corticoide. GESF secundária: tratar a causa.","arm":"Imunossuprimir GESF secundária sem tratar a causa.","regra":"HIV com nefrótica e rim grande: GESF colapsante.","cf":"Rins aumentados na DRC também ocorrem no diabetes, na amiloidose e na doença policística.","fonte":"KDIGO 2021 Glomerular Diseases Guideline; KDIGO Controversies Conference on HIV-related kidney disease (Swanepoel CR et al., Kidney Int 2018)."},{"n":6,"sub":"Glomerulonefrite pós-estreptocócica","comp":"Conduzir a GNPE típica","tags":[],"rel":[],"enun":"Menino de 7 anos com urina escura, edema palpebral e PA de 130/85 mmHg, 2 semanas após faringoamigdalite. Exames: hematúria dismórfica, cilindros hemáticos, C3 baixo, C4 normal e ASLO elevada. Qual é a conduta?","ops":[["Suporte com restrição de sal e água e furosemida.","Correta: a GNPE é geralmente autolimitada; trata-se a hipertensão e a hipervolemia, e o C3 normaliza em 6 a 8 semanas."],["Biópsia renal imediata em todos os casos.","Errada: a biópsia fica para casos atípicos, como C3 baixo por mais de 8 semanas, IRA progressiva ou proteinúria nefrótica persistente."],["Pulsoterapia com metilprednisolona e ciclofosfamida.","Errada: a GNPE típica não exige imunossupressão."],["Penicilina benzatina mensal por 5 anos.","Errada: a profilaxia prolongada é para febre reumática, não para GNPE."]],"conc":"A GNPE ocorre 1 a 3 semanas após faringite ou 3 a 6 semanas após impetigo por estreptococo nefritogênico. Imunocomplexos ativam o complemento pela via alternativa, com C3 baixo e C4 normal.","rac":"Latência de 2 semanas após faringite, síndrome nefrítica, C3 baixo, ASLO alta: GNPE. Suporte: sal e água restritos, furosemida para hipertensão e edema. Antibiótico se infecção ativa.","pista":"C3 baixo com C4 normal após faringite.","mud":"C3 que permanece baixo após 8 semanas sugeriria glomerulonefrite membranoproliferativa ou glomerulopatia C3, exigindo biópsia.","cmp":"GNPE: latência de semanas, C3 baixo. IgA: hematúria em 1 a 3 dias após infecção, complemento normal.","arm":"Biopsiar ou imunossuprimir a GNPE típica.","regra":"Nefrítica 2 semanas após faringite com C3 baixo: GNPE, suporte.","cf":"A hipertensão e a hipervolemia são as principais causas de complicações, como encefalopatia hipertensiva e edema agudo de pulmão.","fonte":"KDIGO 2021 Glomerular Diseases Guideline (Infection-related GN); Rodriguez-Iturbe B, Musser JM. J Am Soc Nephrol 2008;19:1855-1864."},{"n":7,"sub":"Nefropatia por IgA","comp":"Reconhecer a hematúria sinfaringítica","tags":[],"rel":[],"enun":"Homem de 23 anos apresenta hematúria macroscópica 2 dias após início de infecção de vias aéreas superiores, pela terceira vez em 1 ano. PA normal, função renal normal, complemento normal. Qual é o diagnóstico mais provável?","ops":[["Nefropatia por IgA (doença de Berger).","Correta: hematúria macroscópica recorrente concomitante à infecção respiratória (1 a 3 dias), com complemento normal, é típica de nefropatia por IgA."],["Glomerulonefrite pós-estreptocócica.","Errada: a GNPE tem latência de 1 a 3 semanas e C3 baixo."],["Doença de lesão mínima.","Errada: a lesão mínima causa síndrome nefrótica, não hematúria macroscópica recorrente."],["Glomerulonefrite membranoproliferativa.","Errada: a membranoproliferativa costuma cursar com complemento baixo persistente."]],"conc":"A nefropatia por IgA é a glomerulonefrite primária mais comum no mundo. Caracteriza-se por depósitos mesangiais de IgA. A apresentação clássica é hematúria macroscópica que coincide com infecções de mucosa.","rac":"Hematúria 1 a 3 dias após infecção, recorrente, complemento normal: IgA. Confirmação por biópsia (depósitos mesangiais de IgA) quando há proteinúria ou alteração de função.","pista":"Intervalo curto entre infecção e hematúria, com complemento normal.","mud":"Latência longa e C3 baixo fariam pensar em GNPE.","cmp":"IgA: sinfaringítica, complemento normal. GNPE: pós-infecciosa, C3 baixo.","arm":"Confundir IgA com GNPE pelo antecedente infeccioso.","regra":"Hematúria junto com a gripe: IgA.","cf":"A púrpura de Henoch-Schönlein (vasculite por IgA) é a forma sistêmica, com púrpura, artralgia e dor abdominal.","fonte":"KDIGO 2021 Glomerular Diseases Guideline (IgA Nephropathy)."},{"n":8,"sub":"Síndrome de Goodpasture","comp":"Conduzir doença antimembrana basal","tags":[],"rel":[],"enun":"Homem de 28 anos, tabagista, com hemoptise, dispneia, infiltrado alveolar bilateral e creatinina de 4,2 mg/dL que subiu em 1 semana. Hematúria dismórfica e cilindros hemáticos. Anti-MBG positivo. Qual é o tratamento?","ops":[["Plasmaférese, corticoide em pulso e ciclofosfamida.","Correta: a doença anti-MBG exige plasmaférese para remover anticorpos, com corticoide e ciclofosfamida."],["Corticoide oral em dose baixa e observação.","Errada: a doença é grave e rapidamente progressiva; o tratamento deve ser intensivo e imediato."],["Antibiótico para pneumonia e hidratação.","Errada: a hemorragia alveolar com glomerulonefrite e anti-MBG positivo é doença autoimune."],["Hemodiálise isolada, sem imunossupressão, até a recuperação.","Errada: a diálise não trata a hemorragia pulmonar nem a doença de base."]],"conc":"A doença anti-MBG ataca o colágeno tipo IV das membranas basais glomerular e alveolar. Causa glomerulonefrite rapidamente progressiva crescêntica e, na síndrome de Goodpasture, hemorragia alveolar. A imunofluorescência mostra depósito linear de IgG.","rac":"Hemorragia alveolar, GNRP e anti-MBG positivo: Goodpasture. Plasmaférese, metilprednisolona e ciclofosfamida, sem atrasar à espera da biópsia.","pista":"Anti-MBG positivo com hemorragia alveolar.","mud":"ANCA positivo com o mesmo quadro sugeriria vasculite (granulomatose com poliangiite ou poliangiite microscópica).","cmp":"Anti-MBG: linear. Imunocomplexos: granular. ANCA: pauci-imune.","arm":"Esperar a biópsia para iniciar o tratamento com quadro grave e sorologia positiva.","regra":"Hemoptise com rim parando e anti-MBG positivo: plasmaférese já.","cf":"O tabagismo e a exposição a hidrocarbonetos favorecem a hemorragia pulmonar.","fonte":"KDIGO 2021 Glomerular Diseases Guideline (Anti-GBM disease)."},{"n":9,"sub":"Glomerulonefrite rapidamente progressiva","comp":"Classificar pela imunofluorescência","tags":[],"rel":[],"enun":"Paciente com sinusite crônica, nódulos pulmonares e glomerulonefrite rapidamente progressiva. A biópsia renal mostra crescentes em 70% dos glomérulos com imunofluorescência negativa ou mínima. O c-ANCA (anti-PR3) é positivo. Qual é o diagnóstico?","ops":[["Glomerulonefrite pauci-imune por granulomatose com poliangiite.","Correta: crescentes com imunofluorescência pauci-imune, ANCA anti-PR3, sinusite e nódulos pulmonares caracterizam granulomatose com poliangiite."],["Doença anti-MBG com depósito linear.","Errada: a imunofluorescência seria linear, e o anti-MBG positivo."],["Nefrite lúpica classe IV com depósitos granulares.","Errada: o lúpus tem depósitos granulares de imunocomplexos (padrão full house) e complemento baixo."],["Glomerulonefrite pós-estreptocócica com crescentes e depósitos granulares.","Errada: a GNPE tem depósitos granulares e C3 baixo, sem ANCA."]],"conc":"A GNRP é classificada pela imunofluorescência: tipo I (anti-MBG, linear), tipo II (imunocomplexos, granular: lúpus, IgA, pós-infecciosa) e tipo III (pauci-imune, ANCA: granulomatose com poliangiite, poliangiite microscópica, granulomatose eosinofílica).","rac":"Crescentes, imunofluorescência pobre, c-ANCA anti-PR3 com acometimento de vias aéreas: granulomatose com poliangiite. Indução com corticoide e rituximabe ou ciclofosfamida.","pista":"Imunofluorescência pauci-imune com c-ANCA.","mud":"p-ANCA anti-MPO sem acometimento de vias aéreas superiores sugeriria poliangiite microscópica.","cmp":"Tipo I: linear. Tipo II: granular. Tipo III: pauci-imune.","arm":"Esperar ANCA negativo para excluir vasculite quando a biópsia é pauci-imune.","regra":"Crescentes sem depósitos e ANCA positivo: vasculite.","cf":"A plasmaférese é considerada na vasculite ANCA com creatinina muito alta ou hemorragia alveolar, conforme a avaliação individual.","fonte":"KDIGO 2024 Clinical Practice Guideline for ANCA-Associated Vasculitis (Kidney Int 2024;105(3S):S71-S116)."},{"n":10,"sub":"Nefrite lúpica","comp":"Indicar biópsia e tratamento","tags":[],"rel":[],"enun":"Mulher de 24 anos com lúpus eritematoso sistêmico tem proteinúria de 2,8 g/24 h, hematúria dismórfica, cilindros hemáticos, C3 e C4 baixos e anti-DNA elevado. Creatinina 1,4 mg/dL. Qual é a conduta?","ops":[["Biópsia renal e, se classe III ou IV, indução imunossupressora.","Correta: a biópsia define a classe e o tratamento; as classes proliferativas exigem imunossupressão de indução."],["Apenas aumentar a dose de hidroxicloroquina.","Errada: a hidroxicloroquina é recomendada para todos, mas não trata isoladamente a nefrite proliferativa."],["Iniciar diálise, pois a creatinina está elevada.","Errada: a creatinina de 1,4 não indica diálise; trata-se a atividade inflamatória."],["Prescrever AINE para controlar a inflamação.","Errada: AINE pioram a função renal na nefrite lúpica."]],"conc":"A nefrite lúpica é classificada (ISN/RPS) em classes I a VI. As classes III e IV (proliferativas) são as mais graves e exigem indução com corticoide associado a micofenolato ou ciclofosfamida, podendo associar belimumabe ou inibidor de calcineurina.","rac":"Lúpus com sedimento ativo, proteinúria, consumo de complemento e anti-DNA alto: nefrite ativa. Biópsia, depois indução conforme a classe; hidroxicloroquina para todos e bloqueio do sistema renina-angiotensina.","pista":"Sedimento ativo com complemento baixo e anti-DNA alto.","mud":"Classe V isolada (membranosa) com proteinúria nefrótica teria tratamento distinto, com ênfase em antiproteinúricos e imunossupressão menos intensa.","cmp":"Classe IV: mais comum e mais grave. Classe V: membranosa, nefrótica.","arm":"Tratar nefrite lúpica sem biópsia ou com AINE.","regra":"Lúpus com sedimento ativo: biópsia e indução.","cf":"A gestação deve ser planejada com a doença em remissão por pelo menos 6 meses, evitando micofenolato.","fonte":"KDIGO 2024 Clinical Practice Guideline for Lupus Nephritis (Kidney Int 2024;105(1S):S1-S69)."}]},{"id":"M19","titulo":"Neoplasia renal","bloco":2,"q":[{"n":1,"sub":"Carcinoma de células renais","comp":"Reconhecer a apresentação atual do CCR","tags":[],"rel":[],"enun":"Homem de 62 anos, tabagista e obeso, faz ultrassonografia de abdome por dispepsia, que mostra massa sólida de 5 cm no polo superior do rim direito. Não tem hematúria nem dor lombar. Qual é a interpretação mais adequada?","ops":[["Massa renal sólida no adulto é CCR até prova em contrário.","Correta: o CCR é o tumor renal sólido mais comum em adultos, e a maioria é diagnosticada como achado incidental de imagem."],["Ausência da tríade dor, hematúria e massa palpável exclui carcinoma renal.","Errada: a tríade clássica ocorre em menos de 10% dos casos e indica doença avançada."],["Massa sólida renal em adulto costuma ser cisto simples e não precisa de investigação.","Errada: cisto simples é anecoico e sem componente sólido; massa sólida exige investigação."],["O tumor mais provável é o de Wilms, pela localização no polo superior.","Errada: o tumor de Wilms é da infância; em adultos, a principal hipótese é CCR."]],"conc":"O carcinoma de células renais, sobretudo o subtipo de células claras (alteração do VHL no cromossomo 3p), é o tumor renal maligno mais comum em adultos. Fatores de risco: tabagismo, obesidade, hipertensão, DRC em diálise e síndromes hereditárias.","rac":"Massa sólida renal em adulto com fatores de risco: CCR provável. Estadiar com TC ou ressonância de abdome e tórax.","pista":"Massa sólida em tabagista obeso.","mud":"Massa com densidade de gordura macroscópica sugeriria angiomiolipoma.","cmp":"Tríade clássica: rara e tardia. Achado incidental: forma atual mais comum.","arm":"Descartar câncer renal pela ausência de hematúria.","regra":"Massa renal sólida no adulto: carcinoma até prova em contrário.","cf":"O subtipo de células claras é o mais comum, seguido do papilífero e do cromófobo.","fonte":"EAU Guidelines on Renal Cell Carcinoma (Ljungberg B et al., EAU 2024)."},{"n":2,"sub":"Síndromes paraneoplásicas","comp":"Associar achados laboratoriais ao CCR","tags":[],"rel":[],"enun":"Homem de 59 anos com massa renal sólida tem hemoglobina de 18,5 g/dL, cálcio de 11,8 mg/dL com PTH suprimido e elevação de fosfatase alcalina sem metástases hepáticas. Quais mecanismos explicam esses achados?","ops":[["Eritropoetina, PTHrP e síndrome de Stauffer.","Correta: o CCR pode secretar eritropoetina (policitemia), PTHrP (hipercalcemia) e causar disfunção hepática sem metástases (Stauffer)."],["Desidratação e metástases ósseas difusas como causas exclusivas.","Errada: a hipercalcemia com PTH suprimido pode ocorrer sem metástases, por PTHrP; a policitemia não se deve à desidratação aqui."],["Hiperparatireoidismo primário associado.","Errada: no hiperparatireoidismo primário o PTH estaria elevado."],["Policitemia vera concomitante e hepatite viral.","Errada: o conjunto é explicado por síndromes paraneoplásicas do CCR."]],"conc":"O CCR é conhecido por síndromes paraneoplásicas: policitemia (eritropoetina), hipercalcemia (PTHrP), hipertensão (renina), síndrome de Stauffer (disfunção hepática não metastática), febre, caquexia e amiloidose.","rac":"Policitemia, hipercalcemia com PTH baixo e alteração hepática sem metástases em paciente com massa renal: síndromes paraneoplásicas do CCR.","pista":"PTH suprimido com hipercalcemia e fosfatase alcalina elevada sem metástases.","mud":"PTH elevado indicaria hiperparatireoidismo primário concomitante.","cmp":"Eritropoetina: policitemia. PTHrP: hipercalcemia. Stauffer: fígado.","arm":"Atribuir a policitemia a doença hematológica primária sem avaliar o rim.","regra":"CCR imita muitas doenças: pense nas paraneoplásicas.","cf":"A síndrome de Stauffer costuma regredir após a nefrectomia.","fonte":"EAU Guidelines on RCC, 2024; Harrison's Principles of Internal Medicine, 21ª ed. (Bladder and Renal Cell Carcinomas)."},{"n":3,"sub":"Varicocele esquerda","comp":"Reconhecer sinal de invasão da veia renal","tags":[],"rel":[],"enun":"Homem de 60 anos apresenta varicocele esquerda de início recente, que não diminui com o decúbito dorsal. Qual exame deve ser solicitado e por quê?","ops":[["TC ou ressonância para pesquisar tumor renal com trombo venoso.","Correta: a veia gonadal esquerda drena na veia renal esquerda; obstrução por tumor ou trombo causa varicocele que não esvazia no decúbito."],["Apenas ultrassonografia escrotal e tratamento cirúrgico da varicocele.","Errada: a varicocele de início súbito no idoso, sem esvaziar no decúbito, exige investigação de causa retroperitoneal."],["Espermograma, pois a principal preocupação é infertilidade.","Errada: no idoso com varicocele nova, a preocupação é causa obstrutiva, como neoplasia."],["Nenhum exame, pois varicocele é comum e benigna.","Errada: varicocele idiopática é comum em jovens e esvazia no decúbito; esta tem características de alarme."]],"conc":"A veia gonadal esquerda drena na veia renal esquerda em ângulo reto; a direita drena na veia cava. Por isso, tumor renal esquerdo com trombo na veia renal pode causar varicocele esquerda que não esvazia no decúbito.","rac":"Varicocele nova em homem de 60 anos, que não esvazia deitado: investigar massa renal e trombo venoso com TC ou ressonância.","pista":"Varicocele de início tardio que não esvazia no decúbito.","mud":"Varicocele esquerda em adolescente que esvazia no decúbito é, em geral, idiopática.","cmp":"Varicocele idiopática: jovem, esquerda, esvazia deitado. Secundária: idoso, não esvazia, investigar retroperitônio.","arm":"Tratar a varicocele sem procurar a causa.","regra":"Varicocele nova no idoso que não esvazia deitado: olhe o rim.","cf":"O CCR tem tendência a invadir a veia renal e a veia cava inferior.","fonte":"EAU Guidelines on RCC, 2024; Campbell-Walsh-Wein Urology, 12ª ed."},{"n":4,"sub":"Classificação de Bosniak","comp":"Conduzir cisto renal complexo","tags":[],"rel":[],"enun":"Mulher de 50 anos tem cisto renal de 4 cm à TC com contraste, com paredes espessadas, septos irregulares e componente nodular sólido que realça com contraste. Qual é a classificação e a conduta?","ops":[["Bosniak IV; tratamento cirúrgico, geralmente nefrectomia parcial.","Correta: cisto com componente nodular realçante é Bosniak IV, com alta probabilidade de malignidade, e tem indicação cirúrgica."],["Bosniak I; sem necessidade de seguimento.","Errada: Bosniak I é cisto simples, de paredes finas, sem septos nem realce."],["Bosniak II; seguimento não necessário.","Errada: Bosniak II tem poucos septos finos ou calcificações finas, sem nódulos realçantes."],["Bosniak IIF; seguimento por imagem em 6 a 12 meses, sem cirurgia.","Errada: a presença de nódulo realçante classifica como IV, não IIF."]],"conc":"A classificação de Bosniak estratifica cistos renais por TC ou ressonância: I e II (benignos, sem seguimento), IIF (seguimento por imagem), III (paredes ou septos espessados e realçantes) e IV (componente nodular realçante), estes com risco elevado de malignidade.","rac":"Nódulo sólido realçante em cisto: Bosniak IV. Conduta cirúrgica (nefrectomia parcial quando possível). Na versão 2019, o III também pode ser acompanhado em casos selecionados.","pista":"Componente nodular com realce ao contraste.","mud":"Septo fino único sem realce mensurável seria Bosniak II.","cmp":"I e II: benignos. IIF: seguir. III e IV: cirurgia ou vigilância ativa em casos selecionados.","arm":"Acompanhar cisto com nódulo realçante como se fosse benigno.","regra":"Nódulo que realça dentro do cisto: Bosniak IV.","cf":"A ultrassonografia não classifica Bosniak; usa-se TC ou ressonância com contraste.","fonte":"Silverman SG et al. Bosniak Classification of Cystic Renal Masses, Version 2019. Radiology 2019;292:475-488; EAU Guidelines on RCC, 2024."},{"n":5,"sub":"Pequena massa renal","comp":"Indicar nefrectomia parcial","tags":[],"rel":[],"enun":"Homem de 55 anos com massa renal sólida de 3,2 cm, cortical, sem invasão de gordura ou veia, sem metástases (T1a N0 M0). Função renal normal e rim contralateral normal. Qual é o tratamento preferido?","ops":[["Nefrectomia parcial, preservando néfrons.","Correta: tumores T1a são tratados preferencialmente com nefrectomia parcial, que tem controle oncológico semelhante e preserva a função renal."],["Nefrectomia radical com adrenalectomia de rotina.","Errada: para T1a, a radical retira néfrons desnecessariamente; a adrenalectomia não é rotina."],["Quimioterapia citotóxica neoadjuvante.","Errada: o CCR não responde à quimioterapia citotóxica convencional."],["Radioterapia exclusiva como primeira escolha.","Errada: a radioterapia não é tratamento padrão do tumor renal localizado."]],"conc":"Massas renais pequenas (até 4 cm, T1a) têm bom prognóstico. A nefrectomia parcial é o padrão, com controle oncológico equivalente à radical e menor risco de DRC. Ablação e vigilância ativa são opções em pacientes selecionados.","rac":"T1a, paciente saudável: nefrectomia parcial. Em idosos com comorbidades, considerar ablação térmica ou vigilância ativa.","pista":"Tumor de até 4 cm sem invasão.","mud":"Tumor de 9 cm com invasão da veia renal levaria a nefrectomia radical com trombectomia.","cmp":"T1a: parcial. Tumores grandes ou centrais complexos: radical.","arm":"Fazer nefrectomia radical em toda massa renal.","regra":"Pequena massa renal: tire o tumor e preserve o rim.","cf":"A biópsia renal pode ser útil antes de ablação ou vigilância ativa.","fonte":"AUA Guideline: Renal Mass and Localized Renal Cancer (Campbell SC et al., J Urol 2021;206:199-208); EAU Guidelines on RCC, 2024."},{"n":6,"sub":"Angiomiolipoma","comp":"Reconhecer e conduzir o angiomiolipoma","tags":[],"rel":[],"enun":"Mulher de 35 anos com esclerose tuberosa tem massa renal de 6 cm com densidade de gordura (valores negativos de unidades Hounsfield) na TC. Está assintomática. Qual é a conduta?","ops":[["Angiomiolipoma; considerar embolização ou everolimo.","Correta: angiomiolipomas maiores que 4 cm têm maior risco de hemorragia; na esclerose tuberosa, o everolimo é opção."],["Nefrectomia radical de urgência por suspeita de CCR.","Errada: gordura macroscópica na TC é típica de angiomiolipoma, lesão benigna."],["Biópsia obrigatória para excluir carcinoma.","Errada: a gordura macroscópica é diagnóstica na maioria dos casos, dispensando biópsia."],["Apenas observar, sem relação com o tamanho.","Errada: o tamanho maior que 4 cm aumenta o risco de sangramento e justifica tratamento preventivo em alguns casos."]],"conc":"O angiomiolipoma é tumor benigno composto de vasos, músculo liso e gordura. Associa-se à esclerose tuberosa (bilaterais e múltiplos). O principal risco é hemorragia retroperitoneal (síndrome de Wunderlich).","rac":"Gordura macroscópica na TC: angiomiolipoma. Maior que 4 cm ou com aneurismas, na esclerose tuberosa: everolimo ou embolização seletiva.","pista":"Densidade negativa de gordura na TC.","mud":"Massa sólida sem gordura, realçante, seria tratada como CCR.","cmp":"Angiomiolipoma: gordura, benigno, sangra. CCR: sólido, realça, maligno.","arm":"Operar angiomiolipoma como se fosse câncer.","regra":"Gordura na massa renal: angiomiolipoma.","cf":"Dor lombar súbita e choque em paciente com angiomiolipoma sugerem ruptura e exigem embolização de urgência.","fonte":"EAU Guidelines on RCC, 2024 (seção de angiomiolipoma); International Tuberous Sclerosis Complex Consensus (Northrup H et al., Pediatr Neurol 2021)."},{"n":7,"sub":"Tumor de Wilms","comp":"Diferenciar Wilms de neuroblastoma","tags":[],"rel":[],"enun":"Menino de 3 anos, em bom estado geral, tem massa abdominal no flanco esquerdo percebida pela mãe durante o banho, lisa, que não ultrapassa a linha média. PA elevada e hematúria microscópica. Qual é a hipótese e o cuidado ao exame?","ops":[["Wilms; evitar palpação repetida e vigorosa.","Correta: massa renal unilateral, lisa, sem cruzar a linha média, em criança bem, é típica de Wilms; a palpação excessiva pode romper a cápsula."],["Neuroblastoma; palpar diariamente para monitorar o crescimento.","Errada: o neuroblastoma costuma cruzar a linha média, ter calcificações e criança em mau estado geral."],["Hidronefrose congênita; aguardar resolução espontânea.","Errada: hipertensão e hematúria com massa sólida apontam para tumor."],["Linfoma de Burkitt; iniciar quimioterapia sem imagem.","Errada: o quadro é de massa renal; a imagem e a avaliação oncológica vêm antes."]],"conc":"O tumor de Wilms (nefroblastoma) é o tumor renal mais comum na infância, com pico entre 2 e 5 anos. Associa-se a síndromes como WAGR, Denys-Drash e Beckwith-Wiedemann.","rac":"Massa de flanco lisa, que não cruza a linha média, em criança em bom estado, com hipertensão e hematúria: Wilms. Imagem (ultrassonografia, TC), evitar palpação repetida e encaminhar à oncologia pediátrica.","pista":"Massa que não cruza a linha média em criança bem.","mud":"Massa que cruza a linha média, com calcificações, criança em mau estado e catecolaminas urinárias elevadas sugeriria neuroblastoma.","cmp":"Wilms: renal, lisa, não cruza, criança bem. Neuroblastoma: adrenal, irregular, cruza, calcifica, criança doente.","arm":"Palpar vigorosamente a massa repetidas vezes.","regra":"Massa lisa que não cruza a linha média na criança: Wilms.","cf":"O prognóstico do Wilms é favorável com tratamento multimodal.","fonte":"Nelson Textbook of Pediatrics, 22ª ed. (Wilms Tumor); Children's Oncology Group / SIOP-RTSG protocols."},{"n":8,"sub":"CCR metastático","comp":"Escolher a terapia sistêmica","tags":[],"rel":[],"enun":"Paciente de 58 anos com CCR de células claras com metástases pulmonares múltiplas, bom desempenho funcional, risco intermediário. Qual é a terapia sistêmica de primeira linha?","ops":[["Imunoterapia combinada.","Correta: combinações como pembrolizumabe com axitinibe ou nivolumabe com ipilimumabe são a primeira linha no CCR metastático."],["Quimioterapia citotóxica com cisplatina e gencitabina.","Errada: o CCR de células claras é resistente à quimioterapia citotóxica convencional."],["Radioterapia de corpo inteiro como tratamento principal.","Errada: a radioterapia tem papel paliativo ou em metástases selecionadas, não como tratamento sistêmico."],["Hormonioterapia com tamoxifeno.","Errada: a hormonioterapia não tem papel no CCR."]],"conc":"O CCR metastático é tratado com imunoterapia e terapias-alvo antiangiogênicas. A quimioterapia citotóxica convencional tem pouca eficácia. A nefrectomia citorredutora é considerada em casos selecionados.","rac":"Células claras, metastático, risco intermediário: imunoterapia combinada (inibidor de PD-1 com inibidor de tirosina-quinase ou com anti-CTLA-4).","pista":"Doença metastática de células claras.","mud":"Doença oligometastática pode se beneficiar de tratamento local (metastasectomia ou radioterapia estereotáxica) associado.","cmp":"CCR: imunoterapia e antiangiogênicos. Câncer urotelial: platina.","arm":"Tratar CCR metastático com quimioterapia convencional.","regra":"CCR metastático: imunoterapia combinada.","cf":"Os escores IMDC classificam o risco e orientam a terapia.","fonte":"EAU Guidelines on RCC, 2024; NCCN Guidelines Kidney Cancer, 2025."},{"n":9,"sub":"Hematúria macroscópica","comp":"Investigar hematúria indolor no adulto","tags":[],"rel":[],"enun":"Homem de 64 anos, tabagista há 40 anos, apresenta hematúria macroscópica indolor, sem infecção urinária e sem uso de anticoagulante. Qual investigação é indicada?","ops":[["Urotomografia (TC com fase excretora) e cistoscopia.","Correta: a hematúria macroscópica em adulto exige avaliação do trato superior (urotomografia) e da bexiga (cistoscopia)."],["Apenas urina tipo I de controle em 3 meses.","Errada: hematúria macroscópica indolor em tabagista é neoplasia até prova em contrário."],["Ultrassonografia de rins isolada, que exclui neoplasia.","Errada: a ultrassonografia não avalia bem o urotélio nem a bexiga; é necessária cistoscopia."],["Citologia urinária isolada como exame definitivo.","Errada: a citologia tem baixa sensibilidade para tumores de baixo grau e não substitui a cistoscopia."]],"conc":"Hematúria macroscópica em adulto, especialmente tabagista, sugere neoplasia urotelial (bexiga, ureter, pelve renal) ou renal. A investigação inclui imagem do trato superior e cistoscopia.","rac":"Tabagista com hematúria macroscópica indolor: urotomografia e cistoscopia. Se houver hematúria dismórfica com proteinúria, considerar origem glomerular.","pista":"Hematúria indolor em tabagista.","mud":"Hematúria dismórfica com cilindros hemáticos e proteinúria apontaria para glomerulopatia, com investigação nefrológica.","cmp":"Hematúria urológica: isomórfica, coágulos. Glomerular: dismórfica, cilindros hemáticos.","arm":"Atribuir hematúria ao anticoagulante ou infecção sem investigar.","regra":"Hematúria indolor no tabagista: imagem do trato superior e cistoscopia.","cf":"Mesmo em uso de anticoagulante, a hematúria macroscópica deve ser investigada.","fonte":"AUA/SUFU Guideline on Microhematuria (Barocas DA et al., J Urol 2020;204:778-786); EAU Guidelines on Non-muscle-invasive Bladder Cancer, 2024."},{"n":10,"sub":"Síndrome de von Hippel-Lindau","comp":"Reconhecer síndrome hereditária de CCR","tags":[],"rel":[],"enun":"Mulher de 30 anos com carcinomas de células claras bilaterais e múltiplos, hemangioblastoma cerebelar e cistos pancreáticos. O pai teve feocromocitoma. Qual é o diagnóstico?","ops":[["Síndrome de von Hippel-Lindau, por mutação germinativa do gene VHL.","Correta: CCR de células claras bilateral e precoce, hemangioblastomas, cistos pancreáticos e feocromocitoma caracterizam VHL."],["Esclerose tuberosa, pela presença de tumores renais múltiplos e bilaterais.","Errada: a esclerose tuberosa se associa mais a angiomiolipomas e a lesões cutâneas e neurológicas próprias."],["Neoplasia endócrina múltipla tipo 1.","Errada: a NEM 1 envolve paratireoide, hipófise e pâncreas endócrino, não CCR e hemangioblastoma."],["Síndrome de Lynch.","Errada: a Lynch se associa a câncer colorretal, endométrio e urotélio, não a hemangioblastomas."]],"conc":"A síndrome de von Hippel-Lindau é autossômica dominante, com mutação germinativa no VHL (cromossomo 3p). Causa CCR de células claras múltiplo e bilateral, hemangioblastomas de sistema nervoso central e retina, feocromocitoma, cistos e tumores neuroendócrinos pancreáticos.","rac":"CCR bilateral jovem, hemangioblastoma e feocromocitoma familiar: VHL. Aconselhamento genético e vigilância multissistêmica.","pista":"CCR bilateral jovem com hemangioblastoma.","mud":"Angiomiolipomas múltiplos com lesões cutâneas sugeririam esclerose tuberosa.","cmp":"VHL: CCR, hemangioblastoma, feocromocitoma. Esclerose tuberosa: angiomiolipoma.","arm":"Não pensar em síndrome hereditária em CCR bilateral e jovem.","regra":"CCR bilateral e jovem: pense em VHL.","cf":"O belzutifano, inibidor de HIF-2α, é opção para tumores associados ao VHL.","fonte":"EAU Guidelines on RCC, 2024 (hereditary kidney cancer); NCCN Kidney Cancer, 2025."}]},{"id":"M20","titulo":"Gravidez: diagnóstico e adaptações fisiológicas","bloco":3,"q":[{"n":1,"sub":"Beta-hCG","comp":"Conhecer a cinética do hCG","tags":[],"rel":[],"enun":"Gestante de 6 semanas pergunta como evolui o beta-hCG ao longo da gestação. Qual descrição é correta?","ops":[["Duplica a cada 48 a 72 h, com pico entre 8 e 10 semanas.","Correta: o hCG sobe rapidamente no início, com pico entre 8 e 10 semanas (cerca de 60 a 90 dias), e depois declina."],["Sobe de forma linear até o termo, quando atinge o pico, perto do parto.","Errada: o pico ocorre no primeiro trimestre, não no termo."],["Só se torna detectável no sangue após 6 semanas de amenorreia.","Errada: o hCG sérico é detectável cerca de 8 a 11 dias após a concepção, antes do atraso menstrual."],["Atinge o pico na 20ª semana e se correlaciona com o tamanho fetal.","Errada: o pico é no primeiro trimestre e não reflete o tamanho fetal."]],"conc":"O hCG é produzido pelo sinciciotrofoblasto e mantém o corpo lúteo até a placenta assumir a produção de progesterona. A fração beta é específica e detectável no sangue cerca de 8 a 11 dias após a fecundação.","rac":"Início: duplicação a cada 48 a 72 horas. Pico: 8 a 10 semanas. Depois: queda e platô no segundo e terceiro trimestres. Valores muito altos sugerem gemelaridade, mola ou erro de datação.","pista":"Pico no primeiro trimestre.","mud":"Ascensão insuficiente (menos de 35% a 50% em 48 horas) em gestação inicial sugere gravidez ectópica ou inviável.","cmp":"hCG: pico no primeiro trimestre. hPL (lactogênio placentário): sobe até o termo e causa resistência à insulina.","arm":"Esperar o atraso menstrual para pedir beta-hCG sérico.","regra":"hCG dobra em 2 dias e tem pico entre 8 e 10 semanas.","cf":"O hCG tem subunidade alfa idêntica à do TSH, o que explica o TSH baixo no primeiro trimestre.","fonte":"Zugaib M. Obstetrícia, 5ª ed., 2023 (Fisiologia da gestação); Williams Obstetrics, 26ª ed., 2022."},{"n":2,"sub":"Zona discriminatória","comp":"Correlacionar beta-hCG e ultrassonografia","tags":[],"rel":[],"enun":"Mulher com atraso menstrual, sem dor ou sangramento, tem beta-hCG de 3.800 mUI/mL. A ultrassonografia transvaginal não mostra saco gestacional intrauterino nem massas anexiais. Qual é a interpretação?","ops":[["Suspeita de ectópica ou perda; repetir beta-hCG e ultrassonografia.","Correta: acima de cerca de 3.500 mUI/mL, espera-se ver o saco intrauterino na ultrassonografia transvaginal; sua ausência exige investigação."],["A gestação é tópica e normal, pois o saco só aparece após 10.000 mUI/mL.","Errada: o saco gestacional costuma ser visível na ultrassonografia transvaginal com valores muito menores."],["O exame confirma gravidez molar, que não forma saco gestacional.","Errada: a mola tem aspecto típico na ultrassonografia (vesículas) e valores muito altos de hCG; não é a conclusão aqui."],["Deve-se iniciar metotrexato imediatamente, pois o diagnóstico de ectópica está confirmado.","Errada: sem massa anexial e com paciente estável, o diagnóstico ainda não está confirmado; repete-se o hCG em 48 horas."]],"conc":"A zona discriminatória é o valor de beta-hCG acima do qual o saco gestacional intrauterino deveria ser visível na ultrassonografia transvaginal. Hoje se usa valor conservador de até cerca de 3.500 mUI/mL para evitar intervir em gestação desejada viável.","rac":"Beta-hCG de 3.800 sem saco intrauterino: gestação de localização desconhecida com suspeita de ectópica ou perda. Paciente estável: beta-hCG seriado e nova ultrassonografia.","pista":"hCG acima da zona discriminatória sem imagem intrauterina.","mud":"hCG de 800 sem saco intrauterino seria compatível com gestação muito inicial e exigiria apenas seguimento.","cmp":"Abaixo da zona: cedo demais para ver. Acima: o saco deveria estar lá.","arm":"Concluir gestação ectópica com uma única dosagem e iniciar metotrexato.","regra":"hCG alto e útero vazio: pense em ectópica e repita os exames.","cf":"Gemelaridade eleva o hCG e pode atrasar a visualização em relação ao valor esperado.","fonte":"ACOG Practice Bulletin nº 193: Tubal Ectopic Pregnancy (2018); Doubilet PM et al. N Engl J Med 2013;369:1443-1451."},{"n":3,"sub":"Sinais de certeza","comp":"Diferenciar sinais de presunção, probabilidade e certeza","tags":[],"rel":[],"enun":"Na avaliação de uma mulher com suspeita de gravidez, qual achado é considerado sinal de certeza?","ops":[["Batimentos cardíacos fetais ou embrionários detectados.","Correta: a detecção de batimentos cardíacos fetais ou da atividade cardíaca embrionária comprova a gestação."],["Sinal de Hegar (amolecimento do istmo uterino ao toque bimanual).","Errada: o sinal de Hegar é sinal de probabilidade, não de certeza."],["Coloração violácea da mucosa vulvar e vaginal (sinal de Jacquemier ou Chadwick).","Errada: é sinal de probabilidade, ligado à congestão pélvica."],["Amenorreia, náuseas e mastalgia.","Errada: são sinais de presunção, que podem ter outras causas."]],"conc":"Sinais de presunção: amenorreia, náuseas, mastalgia, polaciúria. Probabilidade: Hegar, Goodell (amolecimento do colo), Jacquemier ou Chadwick (coloração violácea), Piskacek (assimetria uterina), Nobile-Budin, aumento uterino, hCG positivo. Certeza: batimentos cardíacos fetais, movimentos fetais percebidos pelo examinador, imagem do embrião ou feto.","rac":"Somente achados que demonstram diretamente o concepto são sinais de certeza: BCF (sonar a partir de 10 a 12 semanas; Pinard a partir de cerca de 20) e ultrassonografia.","pista":"Detecção dos batimentos cardíacos fetais.","mud":"O beta-hCG positivo, embora muito sensível, é classificado como sinal de probabilidade nos livros clássicos.","cmp":"Presunção: queixas da mulher. Probabilidade: alterações do útero e da vagina. Certeza: o feto.","arm":"Chamar Hegar de sinal de certeza.","regra":"Certeza é ver ou ouvir o concepto.","cf":"O sinal de Puzos (rechaço fetal) também é considerado de certeza no segundo trimestre.","fonte":"Zugaib M. Obstetrícia, 5ª ed., 2023 (Diagnóstico de gravidez); Rezende J. Obstetrícia, 14ª ed."},{"n":4,"sub":"Ultrassonografia inicial","comp":"Conhecer a cronologia ultrassonográfica","tags":[],"rel":[],"enun":"Na ultrassonografia transvaginal do primeiro trimestre, qual é a sequência esperada de estruturas, em idade gestacional aproximada?","ops":[["Saco (4,5 a 5 sem), vesícula (5,5 sem) e embrião com batimento (6 sem).","Correta: essa é a cronologia habitual na ultrassonografia transvaginal."],["Embrião com atividade cardíaca às 4 semanas, antes do saco gestacional.","Errada: o saco gestacional é a primeira estrutura visível; o embrião aparece depois."],["Vesícula vitelina visível apenas após 10 semanas.","Errada: a vesícula vitelina surge por volta de 5,5 semanas."],["Batimentos cardíacos só visíveis após 12 semanas na transvaginal.","Errada: a atividade cardíaca é vista a partir de 6 a 6,5 semanas."]],"conc":"A ultrassonografia transvaginal precoce segue uma sequência: saco gestacional, vesícula vitelina, embrião e atividade cardíaca. A medida do comprimento cabeça-nádega no primeiro trimestre é o método mais preciso de datação.","rac":"Saco aos 4,5 a 5 semanas, vesícula aos 5,5, embrião com batimento aos 6 a 6,5. CCN de 7 mm ou mais sem batimento indica gestação inviável.","pista":"Ordem de aparecimento das estruturas.","mud":"Saco médio de 25 mm ou mais sem embrião também caracteriza gestação inviável.","cmp":"Datação: CCN no primeiro trimestre é o padrão. DUM incerta: usar a ultrassonografia.","arm":"Diagnosticar perda gestacional cedo demais, antes dos critérios.","regra":"Saco, vesícula, embrião com coração: 5, 5,5 e 6 semanas.","cf":"Diante de dúvida, repete-se a ultrassonografia em 7 a 14 dias antes de concluir inviabilidade.","fonte":"Doubilet PM et al. Diagnostic criteria for nonviable pregnancy early in the first trimester. N Engl J Med 2013;369:1443-1451."},{"n":5,"sub":"Alterações hematológicas","comp":"Interpretar o hemograma da gestante","tags":[],"rel":[],"enun":"Gestante de 28 semanas, assintomática, tem hemoglobina de 11,3 g/dL, leucócitos de 12.500/mm³ sem desvio e plaquetas de 190.000/mm³. Qual é a interpretação?","ops":[["Adaptações fisiológicas esperadas da gestação.","Correta: o aumento do volume plasmático supera o da massa eritrocitária, e leucocitose leve é comum na gestação."],["Anemia grave por hemodiluição, que exige transfusão.","Errada: hemoglobina de 11,3 está acima do limite para anemia na gestação."],["Leucocitose que indica infecção e exige antibiótico empírico.","Errada: leucocitose leve sem desvio é fisiológica na gestação."],["Plaquetopenia grave que indica síndrome HELLP.","Errada: 190.000 plaquetas é valor normal; não há sinais de HELLP."]],"conc":"Na gestação, o volume plasmático aumenta cerca de 40% a 50% e a massa eritrocitária, 20% a 30%, gerando hemodiluição. Há leucocitose fisiológica, leve redução das plaquetas e estado de hipercoagulabilidade (aumento de fibrinogênio e fatores de coagulação).","rac":"Hemoglobina de 11,3: acima do corte (11 g/dL, segundo a OMS). Leucocitose de 12.500 sem desvio: fisiológica. Plaquetas normais.","pista":"Valores levemente alterados sem sintomas.","mud":"Hemoglobina de 9,5 g/dL caracterizaria anemia e exigiria investigação e reposição de ferro.","cmp":"Hipercoagulabilidade: fisiológica e aumenta o risco de tromboembolismo.","arm":"Tratar a leucocitose fisiológica como infecção.","regra":"Gestação dilui o sangue e aumenta os leucócitos.","cf":"O fibrinogênio elevado é esperado; fibrinogênio normal ou baixo no terceiro trimestre pode sinalizar coagulopatia.","fonte":"Williams Obstetrics, 26ª ed., 2022 (Maternal Physiology); OMS. Recomendações sobre cuidados pré-natais, 2016."},{"n":6,"sub":"Alterações renais","comp":"Interpretar a creatinina na gestação","tags":[],"rel":[],"enun":"Gestante de 24 semanas tem creatinina sérica de 1,1 mg/dL em exame de rotina. Qual é a interpretação?","ops":[["Anormal, pois a creatinina cai com a hiperfiltração da gestação.","Correta: com o aumento da filtração glomerular, creatinina próxima de 1,0 mg/dL ou mais já sugere disfunção renal na gestante."],["Valor normal, pois a referência é a mesma de mulheres não gestantes.","Errada: a creatinina normal na gestação é menor que fora dela."],["Valor esperado, pois a TFG diminui na gestação.","Errada: a TFG aumenta, não diminui."],["Valor sem importância, pois a creatinina não se altera na gestação.","Errada: a creatinina cai pela hiperfiltração."]],"conc":"Na gestação, o fluxo plasmático renal e a TFG aumentam cerca de 50%. A creatinina e a ureia caem. Também há glicosúria fisiológica, leve proteinúria e dilatação do sistema coletor (hidronefrose fisiológica, mais à direita).","rac":"Creatinina de 1,1 em gestante: elevada. Investigar doença renal, pré-eclâmpsia ou outras causas.","pista":"Creatinina acima de 0,9 mg/dL na gestação.","mud":"Creatinina de 0,6 seria esperada.","cmp":"Hidronefrose à direita: fisiológica. Glicosúria: pode ser fisiológica, mas não substitui o rastreio de diabetes.","arm":"Usar valores de referência de não gestantes.","regra":"Gestante filtra mais: creatinina perto de 1 já é alta.","cf":"A dilatação ureteral pela progesterona e pela compressão uterina favorece a pielonefrite.","fonte":"Williams Obstetrics, 26ª ed., 2022 (Maternal Physiology); Zugaib M. Obstetrícia, 5ª ed., 2023."},{"n":7,"sub":"Alterações respiratórias","comp":"Interpretar a gasometria da gestante","tags":[],"rel":[],"enun":"Gestante de 32 semanas, assintomática, tem gasometria arterial com pH 7,44, PaCO2 30 mmHg e bicarbonato 20 mEq/L. Qual é a interpretação?","ops":[["Alcalose respiratória compensada, fisiológica.","Correta: a progesterona aumenta o volume corrente e a ventilação minuto, reduzindo a PaCO2, com compensação renal pela queda do bicarbonato."],["Acidose metabólica grave, que exige investigação imediata.","Errada: o pH é levemente alcalino e o bicarbonato baixo é compensatório."],["Insuficiência respiratória hipercápnica.","Errada: a PaCO2 está baixa, não alta."],["Alcalose metabólica por vômitos.","Errada: na alcalose metabólica o bicarbonato estaria elevado."]],"conc":"Na gestação, a progesterona estimula o centro respiratório: aumenta o volume corrente e a ventilação minuto, a PaCO2 cai para cerca de 28 a 32 mmHg, e o rim compensa reduzindo o bicarbonato. A capacidade residual funcional diminui pela elevação do diafragma.","rac":"pH discretamente alto, PaCO2 baixa e bicarbonato baixo: alcalose respiratória crônica compensada, fisiológica.","pista":"PaCO2 de 30 com bicarbonato reduzido em gestante assintomática.","mud":"PaCO2 de 40 mmHg numa gestante em crise asmática indicaria fadiga e insuficiência respiratória iminente.","cmp":"Volume corrente e ventilação minuto: aumentam. Capacidade residual funcional: diminui.","arm":"Achar que PaCO2 de 40 é normal em gestante com dispneia aguda.","regra":"Gestante hiperventila: PaCO2 cai.","cf":"O gradiente de CO2 entre mãe e feto facilita a eliminação do CO2 fetal.","fonte":"Williams Obstetrics, 26ª ed., 2022 (Maternal Physiology)."},{"n":8,"sub":"Síndrome da hipotensão supina","comp":"Reconhecer a compressão aortocava","tags":[],"rel":[],"enun":"Gestante de 34 semanas, deitada em decúbito dorsal para ultrassonografia, apresenta tontura, palidez, sudorese e queda da PA. Qual é a explicação e a conduta?","ops":[["Compressão aortocava; decúbito lateral esquerdo.","Correta: a síndrome da hipotensão supina melhora com o decúbito lateral esquerdo, que alivia a compressão aortocava."],["Hipoglicemia de jejum; oferecer glicose oral.","Errada: o quadro está relacionado à posição, não ao jejum."],["Pré-eclâmpsia grave; sulfato de magnésio.","Errada: a pré-eclâmpsia cursa com hipertensão, não hipotensão."],["Embolia pulmonar; anticoagulação imediata.","Errada: o quadro é postural e reversível com a mudança de decúbito."]],"conc":"Na gestação, o débito cardíaco aumenta 30% a 50%, a frequência cardíaca sobe 10 a 20 bpm, a resistência vascular periférica diminui e a PA cai no segundo trimestre. No decúbito dorsal, o útero comprime a veia cava inferior e reduz o retorno venoso.","rac":"Sintomas ao deitar de costas no terceiro trimestre, que se resolvem ao virar: síndrome da hipotensão supina. Decúbito lateral esquerdo ou deslocamento uterino manual para a esquerda.","pista":"Relação com o decúbito dorsal no terceiro trimestre.","mud":"Hipotensão que persiste em decúbito lateral levaria a investigar hemorragia, sepse ou outras causas.","cmp":"Sopro sistólico suave: fisiológico. Sopro diastólico: patológico.","arm":"Atender gestante em parada sem deslocar o útero para a esquerda.","regra":"Gestante passou mal deitada de costas: vire para a esquerda.","cf":"Na reanimação da gestante, o deslocamento uterino manual para a esquerda é parte do protocolo.","fonte":"Williams Obstetrics, 26ª ed., 2022 (Maternal Physiology); AHA Scientific Statement: Cardiac Arrest in Pregnancy (Jeejeebhoy FM et al., Circulation 2015)."},{"n":9,"sub":"Tireoide na gestação","comp":"Interpretar TSH baixo no primeiro trimestre","tags":[],"rel":[],"enun":"Gestante de 9 semanas, com náuseas leves, sem bócio nem sintomas de hipertireoidismo, tem TSH de 0,08 mUI/L e T4 livre no limite superior da normalidade. Qual é a interpretação?","ops":[["Efeito do hCG sobre a tireoide, sem tratamento.","Correta: o hCG estimula o receptor do TSH no primeiro trimestre, reduzindo o TSH; o quadro é transitório."],["Doença de Graves, com indicação imediata de metimazol.","Errada: sem sintomas, bócio ou T4 livre muito elevado, não há indicação de antitireoidiano; na dúvida, dosa-se TRAb."],["Hipotireoidismo central, que exige levotiroxina.","Errada: o T4 livre está normal-alto, não baixo."],["Erro laboratorial, pois o TSH não se altera na gestação.","Errada: a queda do TSH no primeiro trimestre é fisiológica."]],"conc":"O hCG compartilha a subunidade alfa com o TSH e estimula o receptor tireoidiano, principalmente no pico do primeiro trimestre. O TSH cai e o T4 livre pode subir levemente. O aumento do estrogênio eleva a TBG e o T4 total.","rac":"TSH baixo com T4 livre normal no primeiro trimestre, sem sinais clínicos: efeito do hCG. Repetir ao longo da gestação; investigar Graves se sintomas, bócio ou T4 livre alto (TRAb).","pista":"Primeiro trimestre, sem sinais clínicos e com T4 livre normal.","mud":"Hiperêmese grave pode intensificar a supressão do TSH; T4 livre muito alto com bócio e oftalmopatia sugeriria Graves.","cmp":"TSH baixo no primeiro trimestre: hCG. TBG alta: T4 total alto.","arm":"Iniciar antitir
