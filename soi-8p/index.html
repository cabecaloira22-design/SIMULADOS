eoidiano por TSH baixo isolado no primeiro trimestre.","regra":"Primeiro trimestre com TSH baixo: lembre do hCG.","cf":"A partir da segunda metade da gestação, o lactogênio placentário aumenta a resistência à insulina, o que explica o diabetes gestacional.","fonte":"American Thyroid Association Guidelines for Thyroid Disease During Pregnancy (Alexander EK et al., Thyroid 2017;27:315-389)."},{"n":10,"sub":"Datação da gestação","comp":"Aplicar a regra de Naegele e a altura uterina","tags":[],"rel":[],"enun":"Mulher com ciclos regulares tem data da última menstruação em 10/03/2026. Qual é a data provável do parto pela regra de Naegele e onde se espera palpar o fundo uterino com 20 semanas?","ops":[["17/12/2026; fundo uterino na altura da cicatriz umbilical.","Correta: somam-se 7 dias e subtraem-se 3 meses (com ajuste do ano); com cerca de 20 semanas, o fundo uterino está na cicatriz umbilical."],["03/12/2026; fundo uterino na sínfise púbica.","Errada: subtrair 7 dias está errado, e o fundo uterino na sínfise ocorre por volta de 12 semanas."],["17/01/2027; fundo uterino no apêndice xifoide.","Errada: há erro na conta dos meses, e o fundo no apêndice xifoide ocorre perto de 36 semanas."],["10/12/2026; fundo uterino entre a sínfise e a cicatriz umbilical.","Errada: faltou somar os 7 dias, e entre a sínfise e a cicatriz corresponde a cerca de 16 semanas."]],"conc":"Regra de Naegele: DUM + 7 dias − 3 meses (+1 ano quando necessário). Altura uterina: sínfise com cerca de 12 semanas, entre sínfise e cicatriz com 16, cicatriz umbilical com 20, e, a partir daí, a altura em centímetros acompanha aproximadamente a idade gestacional até cerca de 32 semanas.","rac":"10/03 + 7 dias = 17/03; − 3 meses = 17/12 do mesmo ano civil da gestação. Com 20 semanas, fundo uterino na cicatriz umbilical.","pista":"DUM em março, com ajuste de mês e ano.","mud":"DUM incerta ou ciclos irregulares levariam a datar pela ultrassonografia do primeiro trimestre (comprimento cabeça-nádega).","cmp":"Naegele: + 7 dias, − 3 meses. Altura uterina: 12 sínfise, 16 meio, 20 umbigo.","arm":"Subtrair os 7 dias em vez de somá-los.","regra":"DPP: some 7 dias e volte 3 meses.","cf":"A ultrassonografia do primeiro trimestre redefine a data quando a diferença em relação à DUM é maior que cerca de 5 a 7 dias.","fonte":"Brasil. Ministério da Saúde. Caderno de Atenção Básica nº 32: Atenção ao pré-natal de baixo risco, 2012; ACOG Committee Opinion nº 700: Methods for Estimating the Due Date (2017)."}]},{"id":"M21","titulo":"Métodos contraceptivos","bloco":3,"q":[{"n":1,"sub":"Enxaqueca com aura","comp":"Aplicar os critérios de elegibilidade da OMS","tags":[],"rel":[],"enun":"Mulher de 24 anos, não tabagista, com enxaqueca com aura visual, deseja iniciar contracepção oral combinada. Segundo os critérios de elegibilidade da OMS, qual é a orientação?","ops":[["Combinado é categoria 4; oferecer progestagênio isolado ou DIU.","Correta: enxaqueca com aura, em qualquer idade, é categoria 4 para métodos combinados pelo risco de AVC isquêmico."],["Contraceptivo combinado é categoria 2, podendo ser usado com acompanhamento.","Errada: categoria 2 se aplica à enxaqueca sem aura em mulher jovem, não com aura."],["Contraceptivo combinado em dose baixa de etinilestradiol é seguro nesse caso.","Errada: a contraindicação vale para todas as doses de estrogênio."],["Nenhum método hormonal pode ser usado, inclusive o DIU hormonal.","Errada: métodos só de progestagênio são aceitáveis na enxaqueca com aura."]],"conc":"Critérios de elegibilidade da OMS: categoria 1 (sem restrição), 2 (benefícios superam riscos), 3 (riscos geralmente superam benefícios) e 4 (risco inaceitável). Métodos com estrogênio aumentam risco trombótico e de AVC.","rac":"Enxaqueca com aura: categoria 4 para combinados (pílula, anel, adesivo, injetável mensal). Alternativas: pílula de progestagênio, implante, DIU de levonorgestrel, DIU de cobre, injetável trimestral.","pista":"Presença de aura.","mud":"Enxaqueca sem aura em mulher abaixo de 35 anos permitiria o combinado como categoria 2.","cmp":"Estrogênio: evitar em risco trombótico ou vascular. Progestagênio isolado e DIU de cobre: alternativas seguras.","arm":"Prescrever pílula combinada para enxaqueca com aura.","regra":"Enxaqueca com aura: nada de estrogênio.","cf":"Hipertensão com PA de 160/100 mmHg ou mais e história de tromboembolismo também são categoria 4 para combinados.","fonte":"OMS. Medical eligibility criteria for contraceptive use, 5ª ed., 2015; CDC. U.S. Medical Eligibility Criteria for Contraceptive Use, 2024 (MMWR Recomm Rep 2024;73(4))."},{"n":2,"sub":"Tabagismo e idade","comp":"Identificar contraindicação absoluta aos combinados","tags":[],"rel":[],"enun":"Mulher de 37 anos fuma 20 cigarros por dia e usa pílula combinada há anos. Qual é a conduta?","ops":[["Suspender o combinado e oferecer DIU ou progestagênio isolado.","Correta: tabagismo de 15 ou mais cigarros por dia em mulheres com 35 anos ou mais é categoria 4 para combinados."],["Manter a pílula, pois o uso prolongado sem complicações demonstra segurança.","Errada: o risco cardiovascular aumenta com a idade e o tabagismo, independentemente do uso prévio sem eventos."],["Trocar para adesivo combinado, que não tem risco cardiovascular.","Errada: o adesivo também contém estrogênio e tem a mesma restrição."],["Reduzir para pílula com 15 µg de etinilestradiol e manter.","Errada: a restrição vale para qualquer dose de estrogênio."]],"conc":"Mulheres com 35 anos ou mais que fumam têm risco aumentado de infarto e AVC com métodos combinados. Até 15 cigarros por dia: categoria 3; 15 ou mais: categoria 4. Abaixo de 35 anos, o tabagismo é categoria 2.","rac":"37 anos e 20 cigarros por dia: categoria 4. Trocar para DIU de cobre, DIU de levonorgestrel, implante ou pílula de progestagênio.","pista":"Idade de 35 anos ou mais com tabagismo intenso.","mud":"Mulher de 28 anos tabagista poderia usar combinado (categoria 2), com aconselhamento para parar de fumar.","cmp":"Tabagista com 35 anos ou mais: menos de 15 cigarros, categoria 3; 15 ou mais, categoria 4.","arm":"Achar que o adesivo ou o anel resolvem o risco.","regra":"35 anos ou mais e fumante pesada: tire o estrogênio.","cf":"O injetável trimestral e o implante não têm a restrição do estrogênio.","fonte":"OMS. Medical eligibility criteria for contraceptive use, 5ª ed., 2015."},{"n":3,"sub":"Pós-parto e amamentação","comp":"Escolher método no puerpério de lactante","tags":[],"rel":[],"enun":"Puérpera de 3 semanas, em aleitamento materno exclusivo, deseja um método contraceptivo hormonal. Qual opção é a mais adequada?","ops":[["Pílula só de progestagênio (desogestrel) ou implante de etonogestrel.","Correta: métodos só de progestagênio não prejudicam a lactação e podem ser usados no puerpério."],["Pílula combinada com etinilestradiol, por ser mais eficaz no puerpério.","Errada: o combinado antes de 6 semanas pós-parto em lactante é categoria 4 (risco trombótico e redução da produção de leite)."],["Anel vaginal combinado, que não interfere na amamentação.","Errada: o anel contém estrogênio e tem as mesmas restrições do combinado oral."],["Injetável mensal combinado.","Errada: o injetável mensal contém estrogênio e é contraindicado nesse período."]],"conc":"No puerpério há hipercoagulabilidade, e o estrogênio pode reduzir a produção de leite. Métodos só de progestagênio são preferidos na lactante. O método da lactação e amenorreia (LAM) é eficaz se amamentação exclusiva, amenorreia e menos de 6 meses pós-parto.","rac":"Lactante com 3 semanas: evitar estrogênio. Progestagênio isolado (pílula, implante) é adequado; DIU pode ser inserido até 48 horas pós-parto ou após 4 semanas.","pista":"Menos de 6 semanas pós-parto em aleitamento.","mud":"Mulher que não amamenta poderia iniciar combinado após 21 a 42 dias, conforme os fatores de risco para tromboembolismo.","cmp":"Lactante: progestagênio isolado ou DIU. Combinado: evitar antes de 6 semanas (OMS).","arm":"Prescrever pílula combinada para puérpera lactante.","regra":"Amamentando: progestagênio sim, estrogênio não.","cf":"O DIU de cobre também pode ser inserido logo após a dequitação, durante a cesárea ou o parto vaginal.","fonte":"OMS. Medical eligibility criteria for contraceptive use, 5ª ed., 2015; OMS/Johns Hopkins. Planejamento familiar: manual global para profissionais e serviços de saúde, 2022."},{"n":4,"sub":"DIU de cobre","comp":"Reconhecer contraindicação à inserção","tags":[],"rel":[],"enun":"Em qual das situações abaixo a inserção do DIU de cobre está contraindicada (categoria 4) no momento?","ops":[["Cervicite purulenta ou doença inflamatória pélvica atual.","Correta: infecção pélvica ativa contraindica a inserção, pelo risco de piora da infecção."],["Nuliparidade em mulher de 22 anos.","Errada: nuliparidade e idade jovem não contraindicam o DIU (categoria 2 em menores de 20 anos pelo risco de expulsão)."],["História de gravidez ectópica prévia.","Errada: o DIU reduz o risco absoluto de gravidez, inclusive ectópica; não é contraindicação."],["Mulher HIV positiva, clinicamente bem, em terapia antirretroviral.","Errada: HIV controlado não contraindica o DIU."]],"conc":"O DIU de cobre é método de longa ação, sem hormônio, eficaz por 10 anos ou mais. Contraindicações (categoria 4 para inserção): gestação, sepse puerperal, aborto séptico recente, DIP ou cervicite purulenta atual, sangramento vaginal inexplicado, câncer de colo ou endométrio aguardando tratamento e distorção da cavidade uterina.","rac":"Infecção pélvica ativa: adiar a inserção até o tratamento. Nuliparidade, ectópica prévia e HIV controlado não contraindicam.","pista":"Infecção ativa do trato genital superior ou cervicite purulenta.","mud":"Após tratar a cervicite e com a paciente assintomática, a inserção poderia ser feita.","cmp":"Contraindicações do DIU: infecção, gestação, sangramento inexplicado, cavidade distorcida, câncer genital.","arm":"Negar DIU a nulíparas ou adolescentes.","regra":"DIU: não insira com infecção pélvica ativa.","cf":"Mulher que desenvolve DIP com DIU in situ pode mantê-lo durante o tratamento, se houver boa resposta.","fonte":"OMS. Medical eligibility criteria for contraceptive use, 5ª ed., 2015."},{"n":5,"sub":"Contracepção de emergência","comp":"Prescrever o método mais eficaz","tags":[],"rel":[],"enun":"Mulher de 26 anos teve relação desprotegida há 4 dias (96 horas) e deseja evitar a gravidez. Qual método de emergência é o mais eficaz nesse momento?","ops":[["Inserção do DIU de cobre, eficaz até 5 dias após a relação.","Correta: o DIU de cobre é o método de emergência mais eficaz e pode ser inserido até 5 dias após a relação, mantendo-se como contracepção."],["Levonorgestrel 1,5 mg, que tem a mesma eficácia em qualquer momento até 5 dias.","Errada: a eficácia do levonorgestrel diminui com o tempo; é maior nas primeiras 72 horas."],["Pílula combinada em dose dobrada todos os dias por 1 mês.","Errada: não é esquema de contracepção de emergência."],["Não há mais opção após 72 horas.","Errada: o DIU de cobre (e o levonorgestrel, com menor eficácia) podem ser usados até 5 dias."]],"conc":"Contracepção de emergência: levonorgestrel 1,5 mg em dose única, o mais cedo possível (até 72 horas, com eficácia menor até 120 horas); acetato de ulipristal até 120 horas (não disponível em todos os serviços); DIU de cobre até 5 dias, com maior eficácia.","rac":"Quatro dias após a relação: o DIU de cobre é o mais eficaz. Se não for aceito ou disponível, levonorgestrel ainda pode ser usado, com eficácia reduzida.","pista":"Intervalo de 96 horas após a relação.","mud":"Relação há 12 horas permitiria levonorgestrel com boa eficácia.","cmp":"Levonorgestrel: quanto antes melhor. DIU de cobre: mais eficaz, até 5 dias.","arm":"Dizer que não há opção após 72 horas.","regra":"Emergência após 3 dias: pense no DIU de cobre.","cf":"A contracepção de emergência não é abortiva e não interrompe gestação já implantada.","fonte":"OMS. Planejamento familiar: manual global, 2022; CDC. U.S. Selected Practice Recommendations for Contraceptive Use, 2024."},{"n":6,"sub":"Interações medicamentosas","comp":"Escolher método em uso de indutor enzimático","tags":[],"rel":[],"enun":"Mulher de 30 anos com epilepsia em uso de carbamazepina deseja contracepção. Qual método é mais adequado?","ops":[["DIU (cobre ou levonorgestrel) ou injetável trimestral.","Correta: indutores enzimáticos reduzem a eficácia de pílulas e implante; DIUs e injetável trimestral não são afetados significativamente."],["Pílula combinada de baixa dose.","Errada: a carbamazepina acelera o metabolismo hepático dos hormônios e reduz a eficácia da pílula."],["Pílula só de progestagênio.","Errada: a pílula de progestagênio também tem eficácia reduzida com indutores enzimáticos."],["Implante de etonogestrel, por ser o método mais eficaz.","Errada: o implante tem eficácia reduzida com indutores enzimáticos (categoria 2 com recomendação de método alternativo ou adicional)."]],"conc":"Fármacos indutores do citocromo P450 (carbamazepina, fenitoína, fenobarbital, topiramato em dose alta, rifampicina) reduzem os níveis dos hormônios contraceptivos orais e do implante. DIUs e o injetável trimestral não sofrem essa interferência relevante.","rac":"Carbamazepina: indutor enzimático. Preferir DIU (cobre ou levonorgestrel) ou acetato de medroxiprogesterona injetável.","pista":"Uso de anticonvulsivante indutor enzimático.","mud":"Uso de lamotrigina isolada traz outra interação: o estrogênio reduz os níveis de lamotrigina.","cmp":"Indutores: rifampicina, carbamazepina, fenitoína. Métodos não afetados: DIU e injetável trimestral.","arm":"Manter pílula com indutor enzimático sem orientar.","regra":"Indutor enzimático: DIU ou injetável trimestral.","cf":"Antibióticos comuns, exceto rifampicina e rifabutina, não reduzem a eficácia da pílula.","fonte":"OMS. Medical eligibility criteria, 5ª ed., 2015; CDC. U.S. MEC, 2024."},{"n":7,"sub":"Acetato de medroxiprogesterona","comp":"Orientar sobre o retorno da fertilidade","tags":[],"rel":[],"enun":"Mulher de 29 anos usa injetável trimestral de medroxiprogesterona há 2 anos e planeja engravidar dentro de 3 a 6 meses. Qual orientação é correta?","ops":[["O retorno da fertilidade pode levar cerca de 10 meses.","Correta: o injetável trimestral tem retorno da fertilidade mais lento que outros métodos."],["A fertilidade retorna no ciclo seguinte à última injeção, como na pílula.","Errada: o retorno após o injetável trimestral é mais demorado."],["O injetável causa infertilidade definitiva após 2 anos de uso.","Errada: o efeito é reversível; não causa infertilidade permanente."],["Deve trocar para o DIU de cobre e mantê-lo até engravidar.","Errada: o DIU impede a gestação; deve ser retirado quando se deseja engravidar."]],"conc":"O acetato de medroxiprogesterona de depósito (150 mg intramuscular a cada 3 meses) é muito eficaz e não contém estrogênio. Efeitos: amenorreia, ganho de peso em algumas usuárias, redução reversível da densidade mineral óssea e retorno da fertilidade mais lento (em média cerca de 10 meses).","rac":"Desejo de engravidar em 3 a 6 meses: suspender o injetável e usar método de barreira se ainda não quiser engravidar, iniciando ácido fólico.","pista":"Planejamento de gestação a curto prazo.","mud":"Mulher que deseja evitar gestação por longo período e tem dificuldade de adesão à pílula se beneficiaria do injetável.","cmp":"Retorno rápido: pílula, DIU, implante. Retorno lento: injetável trimestral.","arm":"Prometer retorno imediato da fertilidade após o injetável.","regra":"Quer engravidar logo: o trimestral demora a sair do corpo.","cf":"A redução da densidade óssea é reversível após a suspensão, e o método pode ser usado em adolescentes.","fonte":"OMS. Planejamento familiar: manual global, 2022."},{"n":8,"sub":"Métodos de longa duração","comp":"Indicar o método reversível mais eficaz","tags":[],"rel":[],"enun":"Adolescente de 17 anos, sexualmente ativa, com dificuldade de lembrar a pílula, deseja o método reversível mais eficaz. Qual é a melhor orientação?","ops":[["Implante ou DIU, permitidos na adolescência.","Correta: implante e DIU têm as menores taxas de falha e não dependem da usuária; a adolescência não os contraindica."],["Preservativo isolado, por proteger também contra infecções.","Errada: o preservativo protege contra infecções, mas tem taxa de falha no uso típico muito maior; o ideal é associá-lo a um método eficaz."],["Pílula combinada com aplicativo de lembrete, por ser mais eficaz que o implante.","Errada: a pílula tem taxa de falha no uso típico bem maior que a do implante."],["Tabelinha associada ao coito interrompido.","Errada: são métodos de baixa eficácia."]],"conc":"Métodos reversíveis de longa duração (implante e DIU) têm taxa de falha inferior a 1% ao ano no uso típico, pois não dependem da adesão. São recomendados também para adolescentes e nulíparas.","rac":"Adolescente com baixa adesão à pílula: implante ou DIU. Orientar dupla proteção com preservativo.","pista":"Dificuldade de adesão e desejo de alta eficácia.","mud":"Desejo de proteção contra ISTs reforçaria o uso associado do preservativo.","cmp":"Uso perfeito versus uso típico: a diferença é grande na pílula e mínima no implante e no DIU.","arm":"Achar que adolescentes não podem usar DIU ou implante.","regra":"Quer o mais eficaz e esquece a pílula: implante ou DIU.","cf":"O implante de etonogestrel tem a menor taxa de falha entre todos os métodos reversíveis.","fonte":"OMS. Planejamento familiar: manual global, 2022; ACOG Committee Opinion nº 735: Adolescents and Long-Acting Reversible Contraception (2018)."},{"n":9,"sub":"Laqueadura e vasectomia","comp":"Aplicar a Lei nº 14.443/2022","tags":[],"rel":[],"enun":"Mulher de 23 anos, com um filho vivo, casada, deseja laqueadura tubária. O marido discorda. Segundo a legislação brasileira atual, qual é a situação?","ops":[["Pode realizar, sem consentimento do cônjuge, após 60 dias.","Correta: a Lei nº 14.443/2022 reduziu a idade mínima para 21 anos (ou 2 filhos vivos) e retirou a exigência de consentimento do cônjuge."],["Não pode, pois a lei exige 25 anos ou 2 filhos vivos.","Errada: esse era o critério da lei antiga; a lei atual reduziu para 21 anos ou 2 filhos vivos."],["Só pode com autorização escrita do marido.","Errada: a exigência de consentimento do cônjuge foi revogada."],["Só pode se realizada durante uma cesárea.","Errada: a laqueadura pode ser feita fora do parto; a lei também passou a permiti-la durante o parto, respeitados os prazos."]],"conc":"A Lei nº 14.443/2022 alterou a Lei de Planejamento Familiar: esterilização voluntária para pessoas com capacidade civil plena, maiores de 21 anos ou com pelo menos 2 filhos vivos, com prazo mínimo de 60 dias entre a manifestação da vontade e a cirurgia, sem exigência de consentimento do cônjuge. Permite laqueadura no parto, respeitado o prazo.","rac":"23 anos (mais de 21) e manifestação de vontade: pode realizar após 60 dias, com aconselhamento sobre métodos reversíveis e irreversibilidade.","pista":"Idade acima de 21 anos.","mud":"Uma mulher de 19 anos com um filho não preencheria os critérios.","cmp":"Lei antiga: 25 anos ou 2 filhos e consentimento do cônjuge. Lei atual: 21 anos ou 2 filhos, sem consentimento do cônjuge.","arm":"Exigir autorização do marido.","regra":"Laqueadura hoje: 21 anos ou 2 filhos, 60 dias de prazo, sem aval do cônjuge.","cf":"O aconselhamento deve abordar métodos reversíveis de longa duração e o risco de arrependimento.","fonte":"Brasil. Lei nº 14.443, de 2 de setembro de 2022 (altera a Lei nº 9.263/1996)."},{"n":10,"sub":"Esquecimento da pílula","comp":"Orientar o esquecimento de um comprimido","tags":[],"rel":[],"enun":"Usuária de pílula combinada esqueceu de tomar o comprimido de ontem, no meio da cartela, e lembrou hoje no horário habitual. Qual é a orientação?","ops":[["Tomar o esquecido agora e o de hoje no horário, sem método extra.","Correta: esquecimento de um comprimido (menos de 48 horas de atraso) não exige proteção adicional."],["Suspender a cartela e iniciar nova cartela após 7 dias de pausa.","Errada: interromper a cartela aumenta o risco de ovulação."],["Tomar contracepção de emergência imediatamente em todos os casos.","Errada: com um comprimido esquecido no meio da cartela, a emergência não é necessária."],["Usar preservativo por 30 dias e trocar o método.","Errada: não é necessário método adicional nem troca do método."]],"conc":"Esquecimento de um comprimido combinado (atraso de menos de 48 horas): tomar o esquecido assim que lembrar e continuar. Dois ou mais comprimidos (48 horas ou mais): tomar o mais recente, continuar, usar preservativo por 7 dias; se na última semana de comprimidos ativos, emendar a cartela sem pausa; se na primeira semana com relação desprotegida, considerar emergência.","rac":"Um comprimido no meio da cartela: tomar dois hoje e seguir. Sem preservativo adicional.","pista":"Apenas um comprimido esquecido.","mud":"Dois comprimidos esquecidos na primeira semana, com relação nos últimos 5 dias, levariam a considerar contracepção de emergência.","cmp":"Um esquecido: tome e siga. Dois ou mais: tome, use preservativo por 7 dias e avalie a emergência.","arm":"Mandar parar a cartela.","regra":"Esqueceu uma: tome assim que lembrar e siga em frente.","cf":"Com pílula só de progestagênio tradicional (minipílula), atraso de mais de 3 horas já exige proteção adicional por 2 dias.","fonte":"CDC. U.S. Selected Practice Recommendations for Contraceptive Use, 2024 (MMWR Recomm Rep 2024;73(3)); OMS. Planejamento familiar: manual global, 2022."}]},{"id":"M22","titulo":"Pré-natal","bloco":3,"q":[{"n":1,"sub":"Número e calendário de consultas","comp":"Planejar o calendário do pré-natal","tags":[],"rel":[],"enun":"Gestante de risco habitual inicia o pré-natal com 9 semanas na UBS. Segundo a Rede Alyne e o Ministério da Saúde, qual é o planejamento adequado?","ops":[["Captação até 12 semanas e no mínimo 7 consultas.","Correta: a Rede Alyne fixou o mínimo de 7 consultas com captação até 12 semanas, mantendo o calendário mensal, quinzenal e semanal."],["Três consultas, uma em cada trimestre, são suficientes para gestação de risco habitual.","Errada: o mínimo é de 7 consultas, e o acompanhamento fica mais frequente no terceiro trimestre."],["Consultas semanais desde o início, independentemente do risco.","Errada: a frequência aumenta com a idade gestacional; semanais só a partir de 36 semanas."],["O pré-natal termina com 37 semanas, e a gestante é encaminhada à maternidade sem novas consultas.","Errada: o acompanhamento continua até o parto, com consultas semanais até 41 semanas e avaliação de pós-datismo."]],"conc":"A Rede Alyne (Portaria GM/MS nº 5.350/2024) reestruturou a rede de cuidado materno-infantil, com captação até 12 semanas e no mínimo 7 consultas de pré-natal na APS, intercaladas entre médico e enfermeiro, além de visita domiciliar até o 7º dia pós-parto. A OMS recomenda ao menos 8 contatos.","rac":"Início com 9 semanas: captação oportuna. Calendário: mensal até 28 semanas, quinzenal de 28 a 36, semanal de 36 até o parto; não há alta do pré-natal.","pista":"Gestante de risco habitual iniciando antes de 12 semanas.","mud":"Gestação de alto risco teria, além disso, acompanhamento especializado, com no mínimo 12 consultas no ambulatório de alto risco, segundo a Rede Alyne.","cmp":"Mínimo de consultas: 6 no modelo anterior; 7 na Rede Alyne; 8 contatos na OMS 2016.","arm":"Dar alta do pré-natal com 37 semanas.","regra":"Pré-natal: começar até 12 semanas e no mínimo 7 consultas.","cf":"Na 1ª consulta, solicita-se a bateria de exames do primeiro trimestre e se faz a estratificação de risco.","fonte":"Brasil. Ministério da Saúde. Portaria GM/MS nº 5.350/2024 (Rede Alyne); Caderno de Atenção Básica nº 32, 2012; OMS. Recomendações sobre cuidados pré-natais, 2016."},{"n":2,"sub":"Glicemia de jejum no primeiro trimestre","comp":"Interpretar o rastreio de diabetes","tags":[],"rel":[],"enun":"Gestante de 10 semanas, sem diagnóstico prévio de diabetes, tem glicemia de jejum de 98 mg/dL na primeira consulta. Qual é a interpretação?","ops":[["Diabetes mellitus gestacional, pois a glicemia de jejum está entre 92 e 125 mg/dL.","Correta: no primeiro trimestre, glicemia de jejum de 92 a 125 mg/dL define diabetes gestacional."],["Glicemia normal.","Errada: na gestação, os pontos de corte são menores; 92 mg/dL já define DMG."],["Diabetes pré-gestacional.","Errada: diabetes franco exige glicemia de jejum de 126 mg/dL ou mais."],["Repetir com 28 semanas.","Errada: com 98 mg/dL o diagnóstico já está feito; não é necessário TOTG."]],"conc":"O rastreio do diabetes na gestação (OPAS, MS, FEBRASGO, SBD) começa com glicemia de jejum na primeira consulta: menor que 92 é normal (TOTG com 24 a 28 semanas); de 92 a 125 é DMG; 126 ou mais é diabetes franco (pré-gestacional).","rac":"98 mg/dL no primeiro trimestre: entre 92 e 125. Diagnóstico de DMG; iniciar orientação nutricional, atividade física e monitorização glicêmica.","pista":"Glicemia de jejum entre 92 e 125 mg/dL.","mud":"Glicemia de jejum de 128 mg/dL indicaria diabetes franco, com seguimento como diabetes pré-gestacional.","cmp":"Menor que 92: normal. 92 a 125: DMG. 126 ou mais: diabetes franco.","arm":"Usar os pontos de corte de não gestantes.","regra":"Na gestante, 92 já é diabetes gestacional.","cf":"Em locais com recursos, a gestante com jejum normal faz TOTG 75 g entre 24 e 28 semanas.","fonte":"OPAS/MS/FEBRASGO/SBD. Rastreamento e diagnóstico de diabetes mellitus gestacional no Brasil, 2016."},{"n":3,"sub":"TOTG 75 g","comp":"Interpretar o teste oral de tolerância à glicose","tags":[],"rel":[],"enun":"Gestante de 26 semanas com glicemia de jejum inicial normal faz TOTG com 75 g: jejum 88 mg/dL, 1 hora 184 mg/dL e 2 horas 140 mg/dL. Qual é a interpretação?","ops":[["Diabetes gestacional, pois o valor de 1 hora está acima de 180 mg/dL.","Correta: basta um valor alterado (jejum de 92 ou mais, 1 hora de 180 ou mais, 2 horas de 153 ou mais) para o diagnóstico."],["Normal, pois são necessários dois valores alterados.","Errada: os critérios atuais (IADPSG) exigem apenas um valor alterado."],["Intolerância à glicose, que só exige repetir o teste em 4 semanas.","Errada: o diagnóstico já está firmado; não se repete o teste."],["Diabetes franco, pela glicemia de 1 hora acima de 180 mg/dL.","Errada: diabetes franco exige jejum de 126 ou mais ou 2 horas de 200 ou mais."]],"conc":"TOTG 75 g entre 24 e 28 semanas (IADPSG, adotado no Brasil): jejum de 92 ou mais, 1 hora de 180 ou mais ou 2 horas de 153 ou mais. Um único valor alterado define DMG.","rac":"1 hora com 184: acima de 180. DMG. Iniciar dieta, atividade física e automonitorização; insulina se metas não forem atingidas.","pista":"Valor de 1 hora acima do corte.","mud":"Valores de 88, 175 e 150 mg/dL seriam normais.","cmp":"Cortes: 92, 180, 153. Um basta.","arm":"Exigir dois valores alterados, como em critérios antigos.","regra":"TOTG: 92, 180, 153; um alterado é DMG.","cf":"A insulina é a primeira escolha farmacológica no DMG; a metformina é alternativa em situações específicas.","fonte":"OPAS/MS/FEBRASGO/SBD. Rastreamento e diagnóstico de DMG no Brasil, 2016."},{"n":4,"sub":"Gestante Rh negativo","comp":"Prevenir a aloimunização Rh","tags":[],"rel":[],"enun":"Gestante O negativo, parceiro Rh positivo, tem Coombs indireto negativo na primeira consulta. Qual é a conduta durante a gestação e após o parto?","ops":[["Coombs seriado e anti-D com 28 semanas e no pós-parto.","Correta: a profilaxia com anti-D com 28 semanas e no pós-parto previne a aloimunização."],["Não há conduta, pois o Coombs indireto foi negativo.","Errada: a gestante não sensibilizada deve receber profilaxia para não se sensibilizar."],["Aplicar anti-D apenas se o Coombs indireto se tornar positivo.","Errada: com Coombs positivo a mulher já está sensibilizada, e a anti-D não tem mais efeito."],["Indicar amniocentese para tipagem fetal em todas as gestantes Rh negativo.","Errada: procedimento invasivo não é indicado para isso; a profilaxia é universal ou guiada por genotipagem fetal não invasiva, onde disponível."]],"conc":"A aloimunização Rh ocorre quando hemácias fetais Rh positivas entram na circulação materna Rh negativa. A imunoglobulina anti-D previne a sensibilização. Indicações: 28 semanas, pós-parto (até 72 horas) se RN Rh positivo, e após eventos sensibilizantes (sangramento, aborto, ectópica, procedimentos invasivos, trauma).","rac":"Rh negativo com Coombs negativo: não sensibilizada. Coombs indireto periódico, anti-D com 28 semanas e no pós-parto se RN Rh positivo.","pista":"Coombs indireto negativo em gestante Rh negativo.","mud":"Coombs indireto positivo indicaria aloimunização, com seguimento por Doppler da artéria cerebral média fetal em centro de referência.","cmp":"Coombs negativo: prevenir com anti-D. Coombs positivo: sensibilizada, monitorar anemia fetal.","arm":"Dar anti-D só depois que o Coombs positivar.","regra":"Rh negativo não sensibilizada: anti-D com 28 semanas e pós-parto.","cf":"Sangramento no primeiro trimestre ou aborto em Rh negativo também exigem anti-D.","fonte":"Brasil. Ministério da Saúde. Manual de Gestação de Alto Risco, 2022; FEBRASGO. Protocolo de aloimunização Rh."},{"n":5,"sub":"Sífilis na gestação","comp":"Tratar sífilis no pré-natal","tags":[],"rel":[],"enun":"Gestante de 16 semanas tem teste rápido treponêmico reagente na primeira consulta; não sabe quando se infectou e não tem lesões. Qual é a conduta?","ops":[["Penicilina benzatina semanal por 3 semanas e tratar a parceria.","Correta: com teste rápido reagente na gestante, o tratamento é imediato; sífilis de duração ignorada é tratada como latente tardia."],["Aguardar o VDRL para decidir se trata, pois o teste rápido pode ser cicatriz sorológica.","Errada: na gestante, o teste rápido reagente justifica tratamento imediato, sem esperar o não treponêmico."],["Penicilina benzatina em dose única de 2,4 milhões UI.","Errada: dose única é para sífilis recente (primária, secundária ou latente recente); a de duração ignorada exige 3 doses."],["Azitromicina por via oral, por ser mais cômoda.","Errada: só a penicilina trata adequadamente o feto; alternativas não previnem a sífilis congênita."]],"conc":"Na gestação, o tratamento da sífilis com penicilina benzatina é a única forma eficaz de prevenir a sífilis congênita. Sífilis latente tardia ou de duração ignorada: 7,2 milhões UI (3 doses semanais de 2,4 milhões UI). Considera-se tratamento adequado na gestante quando iniciado pelo menos 30 dias antes do parto, com esquema completo.","rac":"Teste rápido reagente: primeira dose de penicilina na hora, coleta de VDRL, tratamento da parceria e VDRL mensal para seguimento.","pista":"Teste rápido treponêmico reagente com duração desconhecida.","mud":"Cancro duro atual (sífilis primária) permitiria dose única de 2,4 milhões UI.","cmp":"Recente: 2,4 milhões UI dose única. Tardia ou ignorada: 2,4 milhões UI por 3 semanas.","arm":"Esperar o VDRL para tratar a gestante.","regra":"Gestante com teste rápido reagente: penicilina benzatina no mesmo dia.","cf":"Na alergia à penicilina, a gestante deve ser dessensibilizada; não há alternativa segura para o feto.","fonte":"Brasil. Ministério da Saúde. PCDT para Prevenção da Transmissão Vertical de HIV, Sífilis e Hepatites Virais (versão vigente)."},{"n":6,"sub":"Toxoplasmose","comp":"Interpretar a sorologia no primeiro trimestre","tags":[],"rel":[],"enun":"Gestante de 11 semanas tem IgG e IgM para toxoplasmose reagentes. Qual é a próxima etapa?","ops":[["Solicitar teste de avidez de IgG; se baixa avidez, iniciar espiramicina e encaminhar para investigação fetal.","Correta: antes de 16 semanas, a avidez alta indica infecção há mais de 3 a 4 meses (antes da gestação); avidez baixa sugere infecção recente."],["Indicar interrupção da gestação.","Errada: IgM positiva pode persistir por meses; a avidez define o momento da infecção, e não há indicação de interrupção."],["Considerar imune e não fazer nada.","Errada: com IgM também positiva, não é possível excluir infecção recente sem a avidez."],["Sulfadiazina e pirimetamina já.","Errada: esse esquema é usado quando há infecção fetal confirmada ou suspeita após 18 semanas, não como primeira medida."]],"conc":"Na toxoplasmose gestacional, IgG positiva e IgM negativa indicam imunidade; ambas negativas, suscetível (orientar prevenção e repetir); IgG e IgM positivas exigem avidez de IgG (útil até cerca de 16 semanas). Infecção aguda: espiramicina para reduzir a transmissão; investigação fetal com PCR no líquido amniótico após 18 semanas.","rac":"IgG e IgM positivas com 11 semanas: avidez. Alta: infecção antiga, sem tratamento. Baixa: possível infecção recente, espiramicina e seguimento especializado.","pista":"IgG e IgM reagentes antes de 16 semanas.","mud":"IgG positiva e IgM negativa indicariam imunidade, sem necessidade de repetir.","cmp":"Espiramicina: reduz a transmissão. Sulfadiazina, pirimetamina e ácido folínico: tratam o feto infectado.","arm":"Interpretar IgM positiva isolada como infecção aguda certa.","regra":"IgG e IgM positivas no início: peça avidez.","cf":"Gestantes suscetíveis devem evitar carne crua, lavar bem os vegetais e evitar contato com fezes de gato.","fonte":"Brasil. Ministério da Saúde. Manual de Gestação de Alto Risco, 2022; Caderno de Atenção Básica nº 32, 2012."},{"n":7,"sub":"Vacinação da gestante","comp":"Indicar vacinas no pré-natal","tags":[],"rel":[],"enun":"Gestante de 22 semanas, sem registro de vacinas na gestação atual, comparece à UBS em época de campanha de influenza. Quais vacinas são indicadas e qual é contraindicada?","ops":[["Indicadas: dTpa, influenza, hepatite B e covid-19; contraindicada: tríplice viral.","Correta: vacinas inativadas são seguras na gestação; vacinas de vírus vivo, como a tríplice viral e a varicela, são contraindicadas."],["Indicadas: tríplice viral e varicela, para proteger o recém-nascido.","Errada: vacinas de vírus vivo atenuado são contraindicadas na gestação."],["Nenhuma vacina deve ser aplicada antes do parto.","Errada: várias vacinas inativadas são recomendadas na gestação, protegendo mãe e bebê."],["A dTpa deve ser feita apenas se a gestante nunca a recebeu na vida.","Errada: a dTpa é recomendada em toda gestação, a partir de 20 semanas, para transferir anticorpos contra coqueluche."]],"conc":"Calendário da gestante no SUS: dTpa em toda gestação a partir de 20 semanas; hepatite B (3 doses se não vacinada); influenza em qualquer idade gestacional na campanha; covid-19; e, desde a incorporação ao SUS, vacina contra o vírus sincicial respiratório a partir de 28 semanas. Contraindicadas: tríplice viral, varicela e, em geral, febre amarela (salvo risco epidemiológico).","rac":"22 semanas: dTpa, influenza (campanha), hepatite B conforme a situação vacinal e covid-19; agendar VSR para 28 semanas. Tríplice viral só no puerpério, se suscetível.","pista":"Idade gestacional acima de 20 semanas e campanha de influenza.","mud":"Gestante suscetível à rubéola deve ser vacinada no puerpério, não durante a gestação.","cmp":"Inativadas: permitidas. Vírus vivo atenuado: contraindicadas.","arm":"Aplicar tríplice viral ou varicela na gestante.","regra":"Gestante: dTpa a partir de 20 semanas em toda gestação; nada de vírus vivo.","cf":"A vacinação inadvertida com tríplice viral na gestação não é indicação de interrupção.","fonte":"Brasil. Ministério da Saúde. Calendário Nacional de Vacinação da Gestante (PNI, vigente); SESA-PR. Vacina para gestantes contra o VSR é incorporada ao SUS, 2025."},{"n":8,"sub":"Suplementação e prevenção da pré-eclâmpsia","comp":"Prescrever suplementos e AAS","tags":[],"rel":[],"enun":"Gestante de 12 semanas teve pré-eclâmpsia na gestação anterior. Além da suplementação de rotina, o que está indicado?","ops":[["AAS em baixa dose até 36 semanas e cálcio.","Correta: pré-eclâmpsia prévia é fator de alto risco; o AAS iniciado entre 12 e 16 semanas e o cálcio reduzem a recorrência."],["Apenas ácido fólico, pois o AAS aumenta o risco de sangramento fetal.","Errada: o AAS em baixa dose é seguro e eficaz para prevenção da pré-eclâmpsia em gestantes de alto risco."],["AAS em dose plena de 500 mg a partir de 30 semanas.","Errada: a dose é baixa e o início deve ser precoce, de preferência antes de 16 semanas."],["Restrição de sal na dieta como principal medida preventiva.","Errada: a restrição de sal não previne pré-eclâmpsia."]],"conc":"Suplementação de rotina (MS): ácido fólico 400 µg por dia (idealmente desde 30 dias antes da concepção até o fim do primeiro trimestre, ou durante a gestação no programa de suplementação) e ferro elementar 40 mg por dia. Em alto risco de pré-eclâmpsia: AAS em baixa dose, iniciado entre 12 e 16 semanas até 36 semanas, e cálcio em populações com baixa ingestão.","rac":"Pré-eclâmpsia prévia: alto risco. AAS 100 a 150 mg à noite a partir de 12 semanas até 36, carbonato de cálcio, ácido fólico e ferro.","pista":"Antecedente de pré-eclâmpsia.","mud":"Gestante sem fatores de risco não teria indicação de AAS.","cmp":"Ácido fólico: defeitos do tubo neural. Ferro: anemia. AAS e cálcio: pré-eclâmpsia em alto risco.","arm":"Iniciar AAS tarde ou em dose plena.","regra":"Pré-eclâmpsia prévia: AAS em baixa dose desde 12 semanas.","cf":"Mulheres com defeito do tubo neural em gestação anterior usam ácido fólico em dose alta (4 a 5 mg por dia).","fonte":"Brasil. Ministério da Saúde. Manual de Gestação de Alto Risco, 2022; Programa Nacional de Suplementação de Ferro: manual de condutas gerais, 2022; ACOG Committee Opinion nº 743: Low-Dose Aspirin Use During Pregnancy (2018)."},{"n":9,"sub":"Altura uterina","comp":"Interpretar a altura uterina no exame físico","tags":[],"rel":[],"enun":"Gestante de 32 semanas, com datação confiável por ultrassonografia do primeiro trimestre, tem altura uterina de 27 cm. BCF 140 bpm, PA normal. Qual é a conduta?","ops":[["Abaixo do esperado; solicitar ultrassonografia.","Correta: entre 20 e 32 semanas, a altura uterina em centímetros aproxima-se da idade gestacional; diferença maior que 3 cm exige investigação."],["Altura uterina normal para a idade gestacional; manter o seguimento habitual.","Errada: 27 cm com 32 semanas está mais de 3 cm abaixo do esperado."],["Indicar parto imediato por restrição de crescimento.","Errada: a altura uterina é rastreio; o diagnóstico de restrição exige ultrassonografia e Doppler."],["Repetir a medida apenas na consulta de 36 semanas.","Errada: a discrepância deve ser investigada agora."]],"conc":"A altura uterina é medida da sínfise ao fundo uterino. Entre 20 e 32 semanas, o valor em centímetros corresponde aproximadamente à idade gestacional (mais ou menos 2 a 3 cm). Discrepâncias sugerem erro de datação, restrição de crescimento, oligoâmnio, macrossomia, polidrâmnio ou gemelaridade. BCF normal: 110 a 160 bpm.","rac":"32 semanas com 27 cm: 5 cm abaixo. Datação confiável. Ultrassonografia com biometria fetal, líquido amniótico e Doppler.","pista":"Diferença maior que 3 cm em relação à idade gestacional.","mud":"Altura uterina maior que o esperado levaria a investigar macrossomia, polidrâmnio ou gemelaridade.","cmp":"Abaixo do esperado: restrição ou oligoâmnio. Acima: macrossomia, polidrâmnio, gemelar.","arm":"Ignorar discrepância da altura uterina.","regra":"Altura uterina mais de 3 cm abaixo: ultrassonografia.","cf":"As manobras de Leopold avaliam situação, apresentação e posição fetais a partir do terceiro trimestre.","fonte":"Brasil. Ministério da Saúde. Caderno de Atenção Básica nº 32: Atenção ao pré-natal de baixo risco, 2012."},{"n":10,"sub":"Estratificação de risco","comp":"Classificar o risco gestacional","tags":[],"rel":[],"enun":"Na UBS, quatro gestantes são avaliadas. Pela estratificação de risco da SES-MG, qual delas deve ser encaminhada ao pré-natal de alto risco?","ops":[["Gestante de 30 anos com hipertensão crônica em tratamento.","Correta: hipertensão arterial crônica, com ou sem medicação, é critério de alto risco, com encaminhamento ao pré-natal de alto risco."],["Primigesta de 26 anos, sem comorbidades, com IMC de 24 kg/m².","Errada: sem fatores de risco, é gestação de risco habitual, acompanhada na APS."],["Gestante de 37 anos, sem comorbidades, no terceiro filho.","Errada: idade acima de 35 anos isolada é fator que permite pré-natal na APS com apoio multiprofissional (risco intermediário)."],["Gestante de 24 anos com anemia leve (hemoglobina de 10,2 g/dL).","Errada: anemia leve a moderada (8 a 10,9 g/dL) permite seguimento na APS; anemia grave ou refratária é que indica alto risco."]],"conc":"A estratificação de risco orienta o local do pré-natal. Na SES-MG: risco habitual (sem fatores), fatores que permitem pré-natal na APS com apoio multiprofissional (por exemplo, idade abaixo de 15 ou acima de 35 anos, IMC de 30 a 39, anemia leve a moderada, sífilis não complicada, nuliparidade) e alto risco (por exemplo, hipertensão crônica, diabetes, gemelaridade, DMG confirmado, pré-eclâmpsia, anemia grave, HIV, doenças crônicas graves).","rac":"Hipertensa crônica: alto risco, compartilhada com o ambulatório de alto risco, mantendo o vínculo com a APS. As demais seguem na APS (habitual ou com apoio multiprofissional).","pista":"Doença clínica prévia (hipertensão crônica).","mud":"Se a gestante de 24 anos tivesse hemoglobina abaixo de 8 g/dL ou anemia refratária, seria alto risco.","cmp":"Risco habitual: APS. Intermediário: APS com apoio multiprofissional. Alto risco: APS com pré-natal especializado.","arm":"Encaminhar ao alto risco toda gestante acima de 35 anos, sobrecarregando o serviço.","regra":"Doença crônica prévia: alto risco; idade isolada não.","cf":"A estratificação deve ser refeita a cada consulta, pois o risco muda ao longo da gestação.","fonte":"Minas Gerais. Secretaria de Estado de Saúde. Estratificação de risco gestacional (SES-MG, 2025); Brasil. MS. Manual de Gestação de Alto Risco, 2022."}]},{"id":"M23","titulo":"Trabalho de parto e puerpério","bloco":3,"q":[{"n":1,"sub":"Fase latente versus fase ativa","comp":"Reconhecer o trabalho de parto ativo","tags":[],"rel":[],"enun":"Primigesta de 39 semanas chega à maternidade com contrações irregulares e dolorosas há 6 horas, duas a cada 10 minutos. Colo com 2 cm de dilatação, 50% apagado, bolsa íntegra, BCF 140 bpm, sem sangramento. Qual é a conduta?","ops":[["Fase latente: orientar e, se possível, liberar com sinais de alerta.","Correta: a fase ativa começa com contrações regulares e dilatação de 4 cm (MS 2017) ou 5 cm (OMS 2018); internar na fase latente aumenta intervenções."],["Internar e iniciar ocitocina para acelerar o trabalho de parto.","Errada: a fase latente não exige internação nem ocitocina; a aceleração precoce aumenta intervenções desnecessárias."],["Realizar amniotomia para induzir a fase ativa.","Errada: a amniotomia de rotina não é recomendada, principalmente na fase latente."],["Indicar cesárea por falha de progressão.","Errada: não há falha de progressão na fase latente; o tempo dessa fase é variável."]],"conc":"Diretriz Nacional de Assistência ao Parto Normal (MS, 2017): fase latente é o período com contrações dolorosas e alguma modificação cervical até 4 cm; fase ativa inclui contrações regulares e dolorosas com dilatação progressiva a partir de 4 cm. A OMS (2018) considera fase ativa a partir de 5 cm.","rac":"Contrações irregulares, colo com 2 cm: fase latente. Mãe e feto bem: orientar, medidas de conforto e retorno com sinais de alerta (contrações regulares, perda de líquido, sangramento, redução dos movimentos fetais).","pista":"Dilatação de 2 cm com contrações irregulares.","mud":"Contrações regulares com colo de 5 cm caracterizariam fase ativa, com internação e partograma.","cmp":"Fase latente: até 4 cm (MS) ou 5 cm (OMS). Fase ativa: a partir daí, com partograma.","arm":"Internar e intervir na fase latente.","regra":"Fase latente: orientar e acolher, sem pressa de internar.","cf":"Bolsa rota, sangramento ou alteração da vitalidade fetal mudariam a conduta para internação.","fonte":"Brasil. Ministério da Saúde. Diretriz Nacional de Assistência ao Parto Normal, 2017; OMS. Recomendações para uma experiência de parto positiva, 2018."},{"n":2,"sub":"Mecanismo de parto","comp":"Identificar os tempos do mecanismo de parto","tags":[],"rel":[],"enun":"No mecanismo de parto em apresentação cefálica fletida, qual é o movimento em que a cabeça fetal se desprende por deflexão (extensão), apoiando o suboccipital sob a sínfise púbica?","ops":[["Desprendimento cefálico.","Correta: no desprendimento, a cabeça se estende, com o suboccipital apoiado sob a sínfise, liberando fronte e face."],["Insinuação.","Errada: a insinuação é a passagem do maior diâmetro da apresentação pelo estreito superior da pelve."],["Rotação interna da cabeça fetal.","Errada: na rotação interna, o occipital gira em direção à sínfise, alinhando a sutura sagital ao diâmetro anteroposterior do estreito inferior."],["Rotação externa.","Errada: a rotação externa (restituição) ocorre após o desprendimento da cabeça, com o occipital voltando ao lado original."]],"conc":"Tempos do mecanismo de parto: insinuação (com flexão), descida, rotação interna, desprendimento cefálico (por deflexão), rotação externa (restituição) e desprendimento das espáduas e do corpo.","rac":"A cabeça fletida desce e roda; ao chegar ao estreito inferior, apoia o suboccipital sob a sínfise e se estende: desprendimento cefálico.","pista":"Movimento de extensão da cabeça sob a sínfise.","mud":"Variedade occipitoposterior persistente faria a cabeça se desprender com flexão adicional, aumentando o tempo expulsivo.","cmp":"Insinuação: estreito superior. Rotação interna: estreito médio. Desprendimento: estreito inferior.","arm":"Confundir rotação interna com rotação externa.","regra":"A cabeça sai estendendo-se sob a sínfise.","cf":"Os planos de De Lee referenciam a altura da apresentação em relação às espinhas isquiáticas (plano zero).","fonte":"Zugaib M. Obstetrícia, 5ª ed., 2023 (Mecanismo de parto); Rezende J. Obstetrícia, 14ª ed."},{"n":3,"sub":"Partograma","comp":"Identificar distocia pelo partograma","tags":[],"rel":[],"enun":"Multípara em fase ativa, com contrações eficazes (quatro em 10 minutos), bolsa rota, apresenta dilatação de 7 cm em dois toques consecutivos com intervalo de 2 horas. O partograma ultrapassa a linha de ação. Altura da apresentação inalterada. Qual é o diagnóstico e a conduta?","ops":[["Parada secundária da dilatação; cesárea.","Correta: dilatação inalterada por 2 horas ou mais em fase ativa, com contrações eficazes, caracteriza parada secundária, geralmente por desproporção."],["Fase ativa prolongada por hipoatividade uterina; iniciar ocitocina.","Errada: as contrações são eficazes, o que afasta hipoatividade; a dilatação não está lenta, está parada."],["Período expulsivo prolongado; aplicar fórcipe.","Errada: com 7 cm, ainda não há dilatação completa; não é período expulsivo."],["Evolução normal; manter conduta expectante por mais 6 horas.","Errada: ultrapassar a linha de ação com dilatação parada exige intervenção."]],"conc":"O partograma registra dilatação, descida e contrações. A linha de alerta é traçada a partir da primeira dilatação na fase ativa (1 cm por hora) e a linha de ação, 4 horas à direita. Distocias: fase ativa prolongada (dilatação lenta, geralmente hipoatividade), parada secundária da dilatação (dilatação inalterada por 2 horas ou mais com contrações adequadas, desproporção), período pélvico prolongado e parada secundária da descida.","rac":"Contrações eficazes, dilatação parada em 7 cm por 2 horas e altura inalterada: parada secundária da dilatação, desproporção cefalopélvica. Conduta: cesárea.","pista":"Dilatação inalterada por 2 horas apesar de contrações eficazes.","mud":"Contrações fracas e dilatação lenta (sem parada) apontariam fase ativa prolongada, corrigível com ocitocina e amniotomia.","cmp":"Fase ativa prolongada: hipoatividade, ocitocina. Parada secundária: desproporção, cesárea.","arm":"Tratar desproporção com ocitocina.","regra":"Parada da dilatação com contração boa: desproporção, cesárea.","cf":"Parto precipitado é a dilatação e expulsão em menos de 4 horas, associado a lacerações e hemorragia.","fonte":"Zugaib M. Obstetrícia, 5ª ed., 2023 (Distocias funcionais e partograma); OMS. Partograma (The partograph), 1994."},{"n":4,"sub":"Manejo ativo do terceiro período","comp":"Prevenir hemorragia pós-parto","tags":[],"rel":[],"enun":"Logo após o desprendimento do recém-nascido em parto vaginal, qual medida é a mais importante para prevenir a hemorragia pós-parto?","ops":[["Ocitocina 10 UI intramuscular após o nascimento.","Correta: a ocitocina profilática no terceiro período é a principal medida de prevenção da hemorragia pós-parto, recomendada para todas as parturientes."],["Tração vigorosa do cordão antes da separação placentária.","Errada: tração vigorosa pode causar inversão uterina; a tração controlada é opcional e realizada por profissional treinado."],["Massagem uterina contínua por 2 horas como única medida.","Errada: a massagem não substitui a ocitocina profilática."],["Clampeamento imediato do cordão em todos os recém-nascidos.","Errada: o clampeamento tardio (1 a 3 minutos) é recomendado no RN vigoroso e não aumenta hemorragia materna."]],"conc":"O terceiro período (dequitação) vai do nascimento à saída da placenta, normalmente em até 30 minutos com manejo ativo. A ocitocina 10 UI intramuscular após o nascimento é a medida central de prevenção. Clampeamento tardio e tração controlada do cordão compõem o manejo.","rac":"Recém-nascido saiu: ocitocina 10 UI intramuscular, clampeamento oportuno do cordão e vigilância do tônus uterino.","pista":"Prevenção de hemorragia logo após o nascimento.","mud":"Placenta não expulsa após 30 minutos com manejo ativo indicaria retenção placentária e extração manual.","cmp":"Primeiro período: dilatação. Segundo: expulsão. Terceiro: dequitação. Quarto (Greenberg): primeira hora pós-parto.","arm":"Clampear o cordão imediatamente por rotina.","regra":"Nasceu o bebê: ocitocina 10 UI intramuscular.","cf":"O quarto período (de Greenberg) é a primeira hora após a dequitação, de maior risco de hemorragia.","fonte":"OPAS. Recomendações assistenciais para prevenção, diagnóstico e tratamento da hemorragia obstétrica, 2018; Brasil. MS. Diretriz Nacional de Assistência ao Parto Normal, 2017."},{"n":5,"sub":"Hemorragia pós-parto","comp":"Tratar a atonia uterina","tags":[],"rel":[],"enun":"Puérpera, 20 minutos após parto vaginal, tem sangramento vaginal intenso (cerca de 900 mL), útero amolecido e acima da cicatriz umbilical, FC 118 bpm e PA 92/58 mmHg. Placenta íntegra. Qual é a conduta inicial?","ops":[["Massagem, ocitocina intravenosa e ácido tranexâmico.","Correta: atonia é a principal causa de hemorragia pós-parto; uterotônico, massagem e ácido tranexâmico precoce (até 3 horas) são a primeira linha."],["Histerectomia imediata.","Errada: a histerectomia é o último recurso após falha das medidas clínicas e cirúrgicas conservadoras."],["Aguardar 30 minutos para ver se o sangramento cessa espontaneamente.","Errada: a hemorragia pós-parto exige ação imediata; o atraso aumenta a mortalidade."],["Metilergometrina intravenosa em bolus como primeira droga.","Errada: a metilergometrina é segunda linha, por via intramuscular, e é contraindicada em hipertensas."]],"conc":"Hemorragia pós-parto: perda de 500 mL ou mais no parto vaginal ou 1.000 mL ou mais na cesárea, ou qualquer perda com instabilidade. Causas (4 Ts): tônus (atonia, a mais comum), trauma, tecido (retenção) e trombina (coagulopatia). O índice de choque (FC dividida pela PA sistólica) de 0,9 ou mais sinaliza gravidade.","rac":"Útero amolecido e acima do umbigo: atonia. Massagem bimanual, ocitocina intravenosa, ácido tranexâmico 1 g em 10 minutos, dois acessos, volume e hemoderivados conforme a necessidade. Sem resposta: misoprostol, metilergometrina, balão de tamponamento e cirurgia.","pista":"Útero amolecido e aumentado com sangramento intenso.","mud":"Útero contraído com sangramento persistente apontaria para laceração do canal de parto (trauma).","cmp":"Tônus: massagem e uterotônico. Trauma: sutura. Tecido: extração. Trombina: hemoderivados.","arm":"Esperar o sangramento parar sozinho.","regra":"Útero mole sangrando: massagem, ocitocina e ácido tranexâmico já.","cf":"O índice de choque de 118/92 (cerca de 1,3) indica perda volumosa e necessidade de transfusão provável.","fonte":"OPAS. Recomendações assistenciais para prevenção, diagnóstico e tratamento da hemorragia obstétrica, 2018; OMS. Recommendation on tranexamic acid for the treatment of PPH, 2017."},{"n":6,"sub":"Distocia de ombro","comp":"Conduzir a distocia de espáduas","tags":[],"rel":[],"enun":"No período expulsivo, após o desprendimento da cabeça, o mento retrai-se contra o períneo (sinal da tartaruga) e o ombro não se desprende com a tração habitual. Qual é a primeira manobra?","ops":[["McRoberts com pressão suprapúbica.","Correta: McRoberts com pressão suprapúbica resolve grande parte das distocias de ombro e é a primeira linha."],["Manobra de Kristeller (pressão no fundo uterino).","Errada: a pressão fúndica piora a impactação do ombro e aumenta lesões; é contraindicada."],["Tração vigorosa da cabeça fetal para baixo.","Errada: tração excessiva aumenta o risco de lesão do plexo braquial."],["Cesárea imediata com a cabeça já desprendida, sem tentar manobras.","Errada: a manobra de Zavanelli (recolocação e cesárea) é último recurso, após falha das demais."]],"conc":"A distocia de ombro ocorre quando o ombro anterior fica impactado na sínfise após a saída da cabeça. Fatores de risco: macrossomia, diabetes, obesidade, parto instrumental. Mnemônico ALEERTA: chamar ajuda, McRoberts, pressão suprapúbica, manobras internas (Rubin II, Woods), retirada do braço posterior, rolamento (Gaskin) e manobras de resgate.","rac":"Sinal da tartaruga: distocia de ombro. Chamar ajuda, McRoberts e pressão suprapúbica; se falhar, manobras internas e retirada do braço posterior.","pista":"Sinal da tartaruga após o desprendimento da cabeça.","mud":"Falha das manobras de primeira linha levaria às manobras rotacionais internas e à retirada do braço posterior.","cmp":"Primeira linha: McRoberts e pressão suprapúbica. Proibido: Kristeller.","arm":"Fazer pressão no fundo do útero.","regra":"Ombro preso: McRoberts e pressão acima do púbis.","cf":"A lesão do plexo braquial (Erb-Duchenne) é a complicação neonatal mais associada.","fonte":"ACOG Practice Bulletin nº 178: Shoulder Dystocia (2017); RCOG Green-top Guideline nº 42: Shoulder Dystocia (2012)."},{"n":7,"sub":"Parto após cesárea","comp":"Orientar a tentativa de parto vaginal","tags":[],"rel":[],"enun":"Gestante de 39 semanas, com uma cesárea anterior segmentar transversa há 3 anos por apresentação pélvica, sem outras intercorrências, deseja parto vaginal. O colo é desfavorável. Qual é a orientação correta?","ops":[["Pode tentar parto vaginal, sem usar misoprostol.","Correta: com uma cesárea segmentar transversa prévia, o parto vaginal é opção segura; prostaglandinas aumentam o risco de rotura."],["É obrigatório repetir a cesárea, pois uma cesárea prévia contraindica parto vaginal.","Errada: uma cesárea segmentar anterior não contraindica a tentativa de parto vaginal."],["Induzir com misoprostol vaginal, que é o método de escolha.","Errada: o misoprostol é contraindicado em útero com cicatriz pelo risco de rotura uterina."],["A tentativa de parto só é permitida se o intervalo for maior que 10 anos.","Errada: intervalo maior que 18 a 24 meses entre os partos já é considerado adequado."]],"conc":"A tentativa de trabalho de parto após cesárea tem sucesso na maioria dos casos. Contraindicações: cicatriz corporal ou em T, rotura uterina prévia, duas ou mais cesáreas em alguns protocolos, contraindicações gerais ao parto vaginal. A indução com prostaglandina (misoprostol) é contraindicada; a ocitocina e a sonda de Foley podem ser usadas com cautela.","rac":"Uma cesárea segmentar transversa por causa não recorrente: favorável à tentativa de parto vaginal. Colo desfavorável: preparar com sonda de Foley, não com misoprostol.","pista":"Cesárea prévia segmentar transversa por causa não recorrente.","mud":"Cicatriz uterina corporal (clássica) contraindicaria a tentativa de parto vaginal.","cmp":"Cicatriz segmentar transversa: permite tentativa. Corporal: cesárea eletiva.","arm":"Indicar cesárea de rotina por cesárea prévia.","regra":"Uma cesárea antes: pode tentar parto vaginal, sem misoprostol.","cf":"Dor abdominal súbita, perda da altura da apresentação e alteração da FCF sugerem rotura uterina.","fonte":"ACOG Practice Bulletin nº 205: Vaginal Birth After Cesarean Delivery (2019); Brasil. MS. Diretrizes de Atenção à Gestante: a operação cesariana, 2016."},{"n":8,"sub":"Endometrite puerperal","comp":"Tratar infecção puerperal","tags":[],"rel":[],"enun":"Puérpera no quarto dia após cesárea realizada após trabalho de parto prolongado com bolsa rota há 20 horas apresenta febre de 38,8 °C, dor à palpação uterina, útero subinvoluído e lóquios fétidos. Qual é o diagnóstico e o tratamento?","ops":[["Endometrite; clindamicina e gentamicina intravenosas.","Correta: febre, dor uterina e lóquios fétidos após cesárea caracterizam endometrite, de etiologia polimicrobiana."],["Mastite puerperal; cefalexina por via oral.","Errada: a mastite causa dor, calor e eritema mamário, não dor uterina e lóquios fétidos."],["Lóquios fisiológicos; apenas orientação.","Errada: lóquios fétidos com febre e dor uterina não são fisiológicos."],["Tromboflebite pélvica séptica; heparina isolada.","Errada: a tromboflebite pélvica é suspeitada quando a febre persiste apesar de antibiótico adequado, não como primeiro diagnóstico."]],"conc":"A endometrite é a infecção puerperal mais comum, com maior risco após cesárea, trabalho de parto prolongado, bolsa rota prolongada, muitos toques vaginais e corioamnionite. É polimicrobiana (aeróbios e anaeróbios).","rac":"Febre após 24 horas do parto, dor uterina, subinvolução e lóquios fétidos: endometrite. Clindamicina 900 mg de 8 em 8 horas e gentamicina 5 mg/kg por dia intravenosas até 24 a 48 horas afebril.","pista":"Dor uterina com lóquios fétidos e febre.","mud":"Febre persistente apesar de antibiótico adequado levaria a pesquisar abscesso, restos placentários ou tromboflebite pélvica séptica.","cmp":"Lóquios normais: rubros (1 a 4 dias), serosos (até cerca de 10 dias), brancos (até 4 a 6 semanas).","arm":"Considerar lóquios fétidos normais.","regra":"Febre, útero doloroso e lóquio fétido: endometrite, clindamicina e gentamicina.","cf":"A profilaxia antibiótica antes da incisão da cesárea reduz a endometrite.","fonte":"Williams Obstetrics, 26ª ed., 2022 (Puerperal Complications); Zugaib M. Obstetrícia, 5ª ed., 2023 (Infecção puerperal)."},{"n":9,"sub":"Consulta puerperal","comp":"Planejar o seguimento do puerpério","tags":[],"rel":[],"enun":"Puérpera de risco habitual recebe alta 48 horas após parto vaginal. Qual é o planejamento adequado do cuidado puerperal na APS?","ops":[["Atenção na primeira semana e consulta de revisão até 42 dias.","Correta: a primeira semana é o período de maior risco; a consulta até 42 dias completa o puerpério com planejamento reprodutivo."],["Retorno apenas após 6 meses, na consulta de puericultura do bebê.","Errada: o cuidado puerperal precoce é essencial para detectar hemorragia, infecção, hipertensão e depressão."],["Nenhum retorno é necessário se o parto foi normal.","Errada: todas as puérperas devem ter seguimento, inclusive as de risco habitual."],["Consulta apenas se houver febre ou sangramento.","Errada: o seguimento é programado, não apenas por demanda."]],"conc":"O puerpério vai do parto até cerca de 6 semanas (42 dias). O MS recomenda atenção na primeira semana (Rede Alyne: visita domiciliar até o 7º dia) e consulta puerperal até 42 dias. Avaliam-se sinais vitais, sangramento, involução uterina, mamas e amamentação, cicatriz, humor, vacinação (tríplice viral se suscetível) e contracepção.","rac":"Alta com 48 horas: visita até o 7º dia (mãe e bebê, teste do pezinho, amamentação) e consulta até 42 dias (contracepção, rastreio de depressão, revisão clínica).","pista":"Planejamento após alta de parto de risco habitual.","mud":"Puérpera com pré-eclâmpsia teria aferição de PA em poucos dias e seguimento mais estreito.","cmp":"Primeira semana: riscos agudos. Até 42 dias: revisão e planejamento reprodutivo.","arm":"Esperar o bebê completar meses para rever a mãe.","regra":"Puerpério: veja na primeira semana e reveja até 42 dias.","cf":"A gestante Rh negativo com RN Rh positivo deve ter recebido anti-D em até 72 horas após o parto.","fonte":"Brasil. Ministério da Saúde. Portaria GM/MS nº 5.350/2024 (Rede Alyne); Caderno de Atenção Básica nº 32, 2012."},{"n":10,"sub":"Blues puerperal versus depressão pós-parto","comp":"Diferenciar alterações de humor no puerpério","tags":[],"rel":[],"enun":"Puérpera de 5 dias relata choro fácil, irritabilidade e oscilação de humor, sem anedonia persistente, sem ideação de autoagressão e cuidando bem do bebê. Os sintomas começaram no terceiro dia. Qual é a interpretação e a conduta?","ops":[["Blues puerperal; acolher e reavaliar.","Correta: o blues é transitório, começa nos primeiros dias e resolve espontaneamente até cerca de 2 semanas, sem tratamento medicamentoso."],["Depressão pós-parto grave; iniciar antidepressivo imediatamente.","Errada: não há duração, intensidade ou prejuízo funcional que caracterizem depressão."],["Psicose puerperal; internação psiquiátrica de urgência.","Errada: a psicose tem alucinações, delírios e desorganização, que não estão presentes."],["Hipotireoidismo pós-parto; levotiroxina.","Errada: o quadro é típico de blues e surge nos primeiros dias, antes da fase usual de tireoidite pós-parto."]],"conc":"Blues puerperal: muito comum, início entre o 2º e o 5º dia, choro fácil e labilidade, resolução até 2 semanas. Depressão pós-parto: sintomas depressivos por mais de 2 semanas, com prejuízo funcional, em até 12 meses após o parto. Psicose puerperal: rara, grave, com delírios e alucinações, emergência psiquiátrica.","rac":"Início no terceiro dia, labilidade sem anedonia persistente ou ideação, função preservada: blues. Acolher, orientar rede de apoio e reavaliar; rastrear depressão com a escala de Edimburgo na consulta puerperal.","pista":"Início precoce com resolução esperada e sem prejuízo funcional.","mud":"Persistência além de 2 semanas, anedonia, culpa intensa, dificuldade de cuidar do bebê ou ideação suicida indicariam depressão pós-parto.","cmp":"Blues: até 2 semanas, sem tratamento. Depressão: mais de 2 semanas, tratar. Psicose: emergência.","arm":"Medicar o blues ou ignorar sintomas persistentes.","regra":"Choro nos primeiros dias que passa em 2 semanas: blues.","cf":"A escala de depressão pós-parto de Edimburgo (EPDS) é instrumento validado para rastreio.","fonte":"ACOG Clinical Practice Guideline nº 5: Treatment and Management of Mental Health Conditions During Pregnancy and Postpartum (2023); Brasil. MS. Caderno de Atenção Básica nº 32, 2012."}]}],"figs":{},"criterios":["As questões foram elaboradas a partir de diretrizes, consensos, manuais do Ministério da Saúde e livros-texto de referência, citados questão a questão. Não foram fornecidos slides ou apostilas da disciplina; por isso, alguma conduta pode diferir do que foi enfatizado em aula.","Recomendações brasileiras (Ministério da Saúde, Rede Alyne, PCDT, SES-MG, OPAS/FEBRASGO/SBD) foram priorizadas quando existem; na falta delas, usaram-se diretrizes internacionais (KDIGO, ACG, EAU, IDSA, OMS, ACOG, EASL, AASLD).","Onde as referências divergem, a correção mostra as duas posições: por exemplo, início da fase ativa do parto em 4 cm (MS, 2017) ou 5 cm (OMS, 2018) e número mínimo de consultas de pré-natal (7 na Rede Alyne; 8 contatos na OMS).","A estratificação de risco gestacional segue o documento da SES-MG (2025), que separa risco habitual, fatores que permitem o pré-natal na APS com apoio multiprofissional (o equivalente ao risco intermediário) e alto risco.","Os critérios de elegibilidade de contraceptivos seguem a OMS (5ª ed., 2015), com o CDC (2024) como complemento; a vacina contra o VSR na gestação segue a incorporação ao SUS a partir de 28 semanas.","Doses e esquemas aparecem como estão nas referências e servem ao raciocínio de prova; confira o protocolo vigente antes de prescrever. As vinhetas clínicas são fictícias."]};
const KEY='simulado-soi-8p-v1';
const BLOCOS={1:'Digestório, fígado, pâncreas e abdome agudo',2:'Rins e vias urinárias',3:'Obstetrícia'};
const LET=['A','B','C','D'];
function UN(x){return 'Matéria '+(+x.slice(1));}
const QMAP={},ALLQ=[],AULA={};
DATA.aulas.forEach(a=>{AULA[a.id]=a;a.q.forEach(q=>{const id=a.id+'-Q'+String(q.n).padStart(2,'0');
  const o={id,aula:a.id,n:q.n,sub:q.sub,comp:q.comp,tags:q.tags||[],rel:q.rel||[],enun:q.enun,
    ops:q.ops.map((x,i)=>({id:'o'+(i+1),t:x[0],a:x[1]})),correct:'o1',
    ma:{conc:q.conc,rac:q.rac,pista:q.pista,mud:q.mud,cmp:q.cmp,arm:q.arm,regra:q.regra,cf:q.cf},fonte:q.fonte,figc:q.figc||null};
  QMAP[id]=o;ALLQ.push(id);});});

/* ---------- armazenamento ---------- */
let storageOK=true;
function fresh(){return {v:1,favs:[],marks:[],tent:{},hist:[],session:null}}
function load(){try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);}catch(e){storageOK=false;return fresh();}
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){}
  return fresh();}
let S=load();
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;render();}}

/* ---------- utilidades ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function maxRun(a){let m=1,c=1;for(let i=1;i<a.length;i++){c=a[i]===a[i-1]?c+1:1;if(c>m)m=c;}return a.length?m:0;}
function balancedLetters(n){const base=Math.floor(n/4),rest=n%4;const arr=[];for(let k=0;k<4;k++)for(let i=0;i<base;i++)arr.push(k);
  shuffle([0,1,2,3]).slice(0,rest).forEach(k=>arr.push(k));
  let best=shuffle(arr.slice());for(let t=0;t<800&&maxRun(best)>3;t++){const c=shuffle(arr.slice());if(maxRun(c)<maxRun(best))best=c;}return best;}
function letterCounts(sess){const c=[0,0,0,0];sess.qids.forEach(id=>{c[sess.ord[id].indexOf(QMAP[id].correct)]++;});return c;}
function say(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const pct=(a,b)=>b?Math.round(100*a/b):0;
function lastAttempt(id){const t=S.tent[id];return t&&t.length?t[t.length-1]:null;}
function everWrong(id){return (S.tent[id]||[]).some(x=>!x.ok);}

/* ---------- sessão ---------- */
function newSession(opts){
  let qids=opts.qids.slice();if(opts.shuffle)shuffle(qids);
  let sess;for(let tries=0;tries<20;tries++){
    const L=balancedLetters(qids.length),ord={};
    qids.forEach((id,i)=>{const q=QMAP[id];const d=shuffle(q.ops.filter(o=>o.id!==q.correct).map(o=>o.id));d.splice(L[i],0,q.correct);ord[id]=d;});
    sess={id:Date.now(),modo:opts.modo,label:opts.label,qids,ord,resp:{},conf:{},done:{},cur:0,finished:false,startedAt:Date.now()};
    const c=letterCounts(sess);if(Math.max(...c)-Math.min(...c)<=1)break;}
  S.session=sess;save();view='quiz';render();window.scrollTo(0,0);}
function record(sess,id){const r=sess.resp[id];if(!r)return;const ok=r===QMAP[id].correct;
  (S.tent[id]=S.tent[id]||[]).push({opt:r,ok,conf:sess.conf[id]||null,at:Date.now(),modo:sess.modo});}
function finishSession(){const s=S.session;if(!s||s.finished)return;
  if(s.modo==='prova')s.qids.forEach(id=>record(s,id));
  s.finished=true;s.finishedAt=Date.now();const r=summarize(s);
  S.hist.push({at:s.finishedAt,modo:s.modo,label:s.label,n:s.qids.length,ok:r.ok,bad:r.bad,blank:r.blank});
  save();view='result';render();window.scrollTo(0,0);}
function summarize(s){let ok=0,bad=0,blank=0;const byA={},byB={},byC={baixa:[0,0],media:[0,0],alta:[0,0],'sem registro':[0,0]};
  s.qids.forEach(id=>{const q=QMAP[id],r=s.resp[id],answered=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    const a=byA[q.aula]=byA[q.aula]||{ok:0,bad:0,blank:0},b=byB[AULA[q.aula].bloco]=byB[AULA[q.aula].bloco]||{ok:0,bad:0,blank:0};
    if(!answered){blank++;a.blank++;b.blank++;return;}
    const k=s.conf[id]||'sem registro';const good=r===q.correct;byC[k][1]++;if(good){ok++;a.ok++;b.ok++;byC[k][0]++;}else{bad++;a.bad++;b.bad++;}});
  return {ok,bad,blank,byA,byB,byC};}

  <section><h2>Exportar resultado</h2><p class="small muted">Gera uma tabela (CSV) com sua resposta, a correta e a confiança de cada questão. Nada é enviado a servidores.</p>
   <div class="row"><button class="btn" data-act="csvcopy">Copiar CSV</button><button class="btn" data-act="csvdl">Baixar CSV</button><button class="btn" data-act="csvshow">${csvShown?'Ocultar texto':'Mostrar texto'}</button></div>
   ${csvShown?`<label for="csvt" class="small muted">Selecione e copie o texto abaixo se os botões não funcionarem neste aplicativo.</label><textarea id="csvt" readonly>${esc(csv(s))}</textarea>`:''}</section>`;}
function csv(s){const rows=[['questao','materia','subtema','sua_resposta','resposta_correta','resultado','confianca']];
  s.qids.forEach(id=>{const q=QMAP[id],ord=s.ord[id],r=s.resp[id],ans=s.modo==='prova'?!!r:(!!r&&s.done[id]);
    rows.push([id,AULA[q.aula].titulo,q.sub,ans?LET[ord.indexOf(r)]+') '+q.ops.find(o=>o.id===r).t:'',LET[ord.indexOf(q.correct)]+') '+q.ops.find(o=>o.id===q.correct).t,ans?(r===q.correct?'acerto':'erro'):'branco',s.conf[id]||'']);});
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');}

function vErros(){const ids=ALLQ.filter(everWrong);
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Caderno de erros</span><h1>Questões que você já errou</h1>
  <p class="muted">A primeira resposta fica registrada para sempre; refazer a questão cria uma nova tentativa. Uma questão passa a "revisada" quando a última tentativa está correta.</p></header>
  ${ids.length?`<div class="row"><button class="btn primary" data-act="rev" data-v="pend">Treinar as pendentes (${ids.filter(id=>!lastAttempt(id).ok).length})</button></div>
  <div class="stack">${ids.map(id=>{const q=QMAP[id],t=S.tent[id],first=t[0],firstWrong=t.find(x=>!x.ok),rev=lastAttempt(id).ok;
    const txt=o=>esc(q.ops.find(x=>x.id===o).t);
    return `<div class="card stack"><div class="qmeta"><span class="chip acc mono">${id}</span><span class="chip">${esc(AULA[q.aula].titulo)}</span><span class="chip">${rev?'Revisada':'Pendente'}</span><span class="chip mono">${t.length} tentativa(s)</span></div>
      <p>${esc(q.enun)}</p>
      <p class="small"><b>Primeira resposta:</b> ${txt(first.opt)} ${first.ok?'(acerto)':'(erro)'}${first.conf?` · confiança ${first.conf==='media'?'média':first.conf}`:''}</p>
      ${first.ok?`<p class="small"><b>Primeiro erro:</b> ${txt(firstWrong.opt)}</p>`:''}
      <p class="small"><b>Correta:</b> ${txt(q.correct)}</p>
      <details><summary>Ver explicação</summary><p class="small">${esc(q.ma.conc)}</p><p class="small gold">${esc(q.ma.regra)}</p><p class="small muted">${esc(q.fonte)}</p></details>
      <div class="row"><button class="btn" data-act="one" data-v="${id}">Refazer esta questão</button></div></div>`;}).join('')}</div>`
  :'<p class="card">Nenhum erro registrado ainda. Os erros dos simulados aparecem aqui automaticamente.</p>'}`;}

function vSobre(){const byB={};DATA.aulas.forEach(a=>(byB[a.bloco]=byB[a.bloco]||[]).push(a));
  return `<div class="row"><button class="btn ghost" data-act="go" data-v="home">Início</button></div>
  <header class="hero"><span class="eyebrow">Sobre o simulado</span><h1>Fontes, cobertura e critérios</h1></header>
  <section><h2>Estrutura</h2><p class="small muted">23 matérias × 10 questões = 230 questões e 920 alternativas. O simulado completo segue a ordem das matérias pedida: primeiro o bloco digestório, depois o renal e, por fim, o obstétrico. Cada questão traz a fonte específica (diretriz, consenso, manual do Ministério da Saúde ou livro-texto) na correção.</p>
   <div class="tbl"><table><thead><tr><th>Bloco</th><th>Matérias</th></tr></thead><tbody>
   ${Object.keys(byB).map(b=>`<tr><td>${esc(BLOCOS[b])}</td><td>${byB[b].map(a=>esc(UN(a.id)+' · '+a.titulo)).join('<br>')}</td></tr>`).join('')}</tbody></table></div></section>
  <section><h2>Cobertura por matéria</h2><div class="stack">${DATA.aulas.map(a=>`<details class="card"><summary>${a.id} · ${esc(a.titulo)}</summary><ul class="plain small">${a.q.map(q=>`<li><span class="mono">Q${String(q.n).padStart(2,'0')}</span> ${esc(q.sub)}: ${esc(q.comp)}</li>`).join('')}</ul></details>`).join('')}</div></section>
  <section><h2>Critérios adotados</h2><ul class="plain small">${DATA.criterios.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>
  <section><h2>Gabarito</h2><p class="small muted">A posição da alternativa correta é sorteada a cada simulado, com quantidades equilibradas de A, B, C e D (diferença máxima de 1) e sem mais de três letras iguais seguidas sempre que possível. O tamanho das alternativas também foi equilibrado para que a correta não seja, com frequência, a mais longa. Ao retomar um simulado, a ordem salva é mantida.</p></section>
  <section><h2>Uso</h2><p class="small muted">Material de estudo para prova e residência. Não substitui protocolos institucionais nem a conferência de doses e condutas no atendimento real.</p></section>`;}

/* ---------- eventos ---------- */
function bind(){document.querySelectorAll('[data-act]').forEach(el=>{const ev=(el.type==='checkbox'||el.type==='range')?(el.type==='range'?'input':'change'):'click';el.addEventListener(ev,e=>act(el.dataset.act,el.dataset.v,el,e));});}
function startAula(aid){newSession({modo:'estudo',qids:ALLQ.filter(id=>QMAP[id].aula===aid),label:UN(aid)+' · '+AULA[aid].titulo,shuffle:false});}
function act(a,v,el){const s=S.session;
  switch(a){
  case 'go':view=v;confirmReset=false;render();window.scrollTo(0,0);break;
  case 'resume':view='quiz';render();break;
  case 'fullmodo':fullModo=v;render();break;
  case 'full':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · 230 questões',shuffle:false});break;
  case 'fullshuf':newSession({modo:fullModo,qids:ALLQ,label:'Simulado completo · ordem embaralhada',shuffle:true});break;
  case 'aula':startAula(v);break;
  case 'custom':view='custom';render();window.scrollTo(0,0);break;
  case 'caula':el.checked?custom.aulas.add(v):custom.aulas.delete(v);custom.qtd=0;render();break;
  case 'call':DATA.aulas.forEach(x=>custom.aulas.add(x.id));custom.qtd=0;render();break;
  case 'cnone':custom.aulas.clear();custom.qtd=0;render();break;
  case 'cqtd':custom.qtd=+el.value;document.getElementById('qtdv').textContent=custom.qtd;document.querySelector('[data-act="cstart"]').textContent='Começar '+custom.qtd+' questões';break;
  case 'cmodo':custom.modo=v;render();break;
  case 'cshuf':custom.shuf=el.checked;break;
  case 'cstart':{let pool=poolCustom();const n=custom.qtd||pool.length;if(n<pool.length){pool=shuffle(pool.slice()).slice(0,n);pool.sort((x,y)=>ALLQ.indexOf(x)-ALLQ.indexOf(y));}
    newSession({modo:custom.modo,qids:pool,label:'Personalizado · '+pool.length+' questões',shuffle:custom.shuf});break;}
  case 'rev':{let ids=[],label='';
    if(v==='erradas'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok;});label='Revisão das erradas';}
    if(v==='alta'){ids=ALLQ.filter(id=>{const l=lastAttempt(id);return l&&!l.ok&&l.conf==='alta';});label='Erros de alta confiança';}
    if(v==='marcadas'){ids=ALLQ.filter(id=>S.marks.includes(id));label='Questões marcadas';}
    if(v==='favs'){ids=ALLQ.filter(id=>S.favs.includes(id));label='Favoritas';}
    if(v==='pend'){ids=ALLQ.filter(id=>everWrong(id)&&!lastAttempt(id).ok);label='Caderno de erros · pendentes';}
    if(ids.length)newSession({modo:'estudo',qids:ids,label,shuffle:false});break;}
  case 'one':newSession({modo:'estudo',qids:[v],label:'Refazer '+v,shuffle:false});break;
  case 'reset':confirmReset=true;render();break;
  case 'resetno':confirmReset=false;render();break;
  case 'resetyes':S=fresh();save();confirmReset=false;render();say('Progresso apagado.');break;
  case 'nav':navOpen=!navOpen;render();break;
  case 'jump':s.cur=+v;confirmFinish=false;save();render();window.scrollTo(0,0);break;
  case 'prev':if(s.cur>0){s.cur--;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'next':if(s.cur<s.qids.length-1){s.cur++;confirmFinish=false;save();render();window.scrollTo(0,0);}break;
  case 'pick':{const id=s.qids[s.cur];if(s.finished||(s.modo==='estudo'&&s.done[id]))break;s.resp[id]=v;save();render();
    if(s.modo==='prova')say('Resposta registrada.');break;}
  case 'conf':{const id=s.qids[s.cur];s.conf[id]=s.conf[id]===v?undefined:v;save();render();break;}
  case 'confirm':{const id=s.qids[s.cur];if(!s.resp[id])break;s.done[id]=true;record(s,id);save();render();
    say(s.resp[id]===QMAP[id].correct?'Resposta correta.':'Resposta incorreta. Veja a correção.');break;}
  case 'mark':{const id=s.qids[s.cur];const i=S.marks.indexOf(id);i>=0?S.marks.splice(i,1):S.marks.push(id);save();render();break;}
  case 'fav':{const id=s.qids[s.cur];const i=S.favs.indexOf(id);i>=0?S.favs.splice(i,1):S.favs.push(id);save();render();break;}
  case 'finish':confirmFinish=true;render();break;
  case 'finishno':confirmFinish=false;render();break;
  case 'finishyes':confirmFinish=false;finishSession();break;
  case 'reviewsess':s.cur=0;view='quiz';render();window.scrollTo(0,0);break;
  case 'redo':newSession({modo:s.modo,qids:s.qids.slice(),label:s.label+' (refeito)',shuffle:false});break;
  case 'redraw':{const aulas=new Set(s.qids.map(id=>QMAP[id].aula));const pool=ALLQ.filter(id=>aulas.has(QMAP[id].aula));
    newSession({modo:s.modo,qids:pool,label:'Novo sorteio · '+aulas.size+' matéria(s)',shuffle:true});break;}
  case 'csvcopy':{const t=csv(s);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>say('CSV copiado.'),()=>{csvShown=true;render();say('Não foi possível copiar; o texto está na caixa abaixo.');});}else{csvShown=true;render();}break;}
  case 'csvdl':{try{const b=new Blob(['﻿'+csv(s)],{type:'text/csv'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='resultado-simulado-soi.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){}
    csvShown=true;render();say('Se o download não começou, copie o texto exibido.');break;}
  case 'csvshow':csvShown=!csvShown;render();break;
  case 'rotfig':figRot[v]=!figRot[v];el.textContent=figRot[v]?'Ver girada para leitura':'Ver na orientação original';drawFigs();break;
  }}
render();
</script>
