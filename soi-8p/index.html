in e, depois, Ringer lactato 70 mL/kg em 2h30.","Correta: para 5 anos ou mais, o MS recomenda SF 30 mL/kg em 30 minutos e Ringer lactato 70 mL/kg em 2h30."],["Soro fisiológico 0,9% 20 mL/kg em 30 minutos, repetido até hidratação, como em menores de 5 anos.","Errada: esse é o esquema para menores de 5 anos; para 5 anos ou mais, usam-se 30 mL/kg e depois 70 mL/kg."],["Soro glicosado 5% 100 mL/kg em 24 horas.","Errada: soluções hipotônicas sem sódio não corrigem a desidratação grave e podem causar hiponatremia."],["Soro de reidratação oral 100 mL/kg em 4 horas.","Errada: na desidratação grave com incapacidade de beber, a reidratação deve ser venosa."]],"conc":"O plano C é a hidratação venosa na desidratação grave. Menores de 5 anos: SF 0,9% 20 mL/kg em 30 minutos, repetido até a hidratação. Cinco anos ou mais: SF 0,9% 30 mL/kg em 30 minutos, seguido de Ringer lactato 70 mL/kg em 2h30.","rac":"Letargia, incapacidade de beber e sinais de choque: desidratação grave, plano C. Paciente com 8 anos: esquema de 30 mL/kg e 70 mL/kg. Reavaliar continuamente e iniciar SRO assim que conseguir beber.","pista":"Idade acima de 5 anos com desidratação grave.","mud":"Recém-nascidos e cardiopatas graves recebem expansão mais lenta, com 10 mL/kg.","cmp":"Menor de 5 anos: 20 mL/kg repetido. A partir de 5 anos: 30 mL/kg mais 70 mL/kg.","arm":"Usar o mesmo esquema para todas as idades.","regra":"Plano C com 5 anos ou mais: 30, depois 70 mL/kg.","cf":"Na fase de manutenção, calcula-se a necessidade hídrica pela regra de Holliday-Segar somada às perdas.","fonte":"Brasil. Ministério da Saúde. Manejo do paciente com diarreia (cartaz), 2023."},{"n":4,"sub":"Zinco","comp":"Suplementar zinco na diarreia infantil","tags":[],"rel":[],"enun":"Lactente de 9 meses com diarreia aguda aquosa, hidratado após plano B. Além da SRO e da manutenção da alimentação, qual suplementação o Ministério da Saúde recomenda?","ops":[["Zinco 20 mg por dia por 10 a 14 dias.","Correta: o MS recomenda zinco 10 mg por dia para menores de 6 meses e 20 mg por dia para maiores de 6 meses, por 10 a 14 dias."],["Zinco 10 mg por dia por 3 dias.","Errada: a dose de 10 mg é para menores de 6 meses, e a duração é de 10 a 14 dias."],["Probiótico obrigatório por 30 dias.","Errada: probióticos não são recomendação universal do MS; o zinco é a suplementação recomendada."],["Vitamina A em dose alta para todas as crianças com diarreia.","Errada: a vitamina A tem indicações próprias (por exemplo, sarampo e deficiência), não é rotina na diarreia aguda."]],"conc":"O zinco reduz a duração e a gravidade da diarreia e diminui episódios nos meses seguintes. É recomendado pela OMS e pelo MS para crianças com diarreia.","rac":"Lactente de 9 meses: maior de 6 meses, zinco 20 mg por dia por 10 a 14 dias.","pista":"Idade acima de 6 meses.","mud":"Lactente de 4 meses receberia 10 mg por dia.","cmp":"Abaixo de 6 meses: 10 mg. Acima de 6 meses: 20 mg. Duração: 10 a 14 dias.","arm":"Suspender o zinco quando a diarreia para nos primeiros dias.","regra":"Diarreia na criança: SRO, alimentação e zinco.","cf":"Antidiarreicos e antieméticos de rotina não são recomendados em crianças pelo MS.","fonte":"Brasil. Ministério da Saúde. Manejo do paciente com diarreia, 2023; WHO. The treatment of diarrhoea, 2005."},{"n":5,"sub":"Disenteria febril no adulto","comp":"Indicar antibiótico na diarreia aguda","tags":[],"rel":[],"enun":"Homem de 35 anos, previamente hígido, com febre de 39 °C, dor abdominal, tenesmo e várias evacuações com sangue e muco há 2 dias. Está hidratado. Qual é a conduta mais adequada?","ops":[["Coprocultura e antibiótico empírico, sem antimotilidade.","Correta: disenteria febril em adulto é indicação de antibiótico empírico; antimotilidade deve ser evitada."],["Loperamida para reduzir o número de evacuações e alta sem exames.","Errada: antimotilidade em diarreia invasiva com febre pode prolongar a infecção e precipitar complicações."],["Apenas hidratação, pois toda diarreia aguda é autolimitada.","Errada: disenteria febril, sobretudo com toxemia, se beneficia de antibiótico."],["Metronidazol empírico para amebíase.","Errada: a disenteria aguda febril em adulto é mais frequentemente bacteriana; metronidazol só se houver suspeita específica de amebíase."]],"conc":"Na diarreia aguda do adulto, o antibiótico empírico é considerado em disenteria febril, sinais de sepse, imunossupressão ou diarreia do viajante moderada a grave. Coprocultura é indicada em diarreia com sangue, febre ou gravidade.","rac":"Febre alta, sangue e tenesmo: diarreia invasiva (Shigella, Campylobacter, Salmonella). Hidratar, colher coprocultura e iniciar azitromicina ou quinolona, conforme resistência local.","pista":"Febre alta com sangue e tenesmo.","mud":"Sangue sem febre, em criança ou com suspeita de E. coli produtora de Shiga toxina, levaria a evitar antibiótico pelo risco de síndrome hemolítico-urêmica.","cmp":"Diarreia aquosa sem febre: hidratação e sintomáticos. Disenteria febril: coprocultura e antibiótico.","arm":"Usar loperamida em diarreia com febre e sangue.","regra":"Disenteria febril no adulto: antibiótico e nada de antimotilidade.","cf":"Em regiões com alta resistência a quinolonas, a azitromicina é preferida.","fonte":"ACG Clinical Guideline: Acute Diarrheal Infections in Adults (Riddle MS et al., Am J Gastroenterol 2016;111:602-622); IDSA 2017 (Shane AL et al.)."},{"n":6,"sub":"Clostridioides difficile","comp":"Tratar o primeiro episódio","tags":[],"rel":[],"enun":"Mulher de 70 anos, internada, recebeu ceftriaxona por pneumonia. No quinto dia passou a ter 6 evacuações líquidas por dia, febre baixa e leucocitose de 16.000/mm³. Teste positivo para toxina de C. difficile. Creatinina normal. Qual é o tratamento?","ops":[["Suspender o antibiótico, se possível, e dar fidaxomicina ou vancomicina oral.","Correta: no primeiro episódio, fidaxomicina ou vancomicina oral são as opções recomendadas."],["Metronidazol intravenoso isolado por 10 dias, por ser o tratamento de primeira linha.","Errada: metronidazol intravenoso isolado não é recomendado; o metronidazol oral é alternativa apenas quando as outras opções não estão disponíveis em casos não graves."],["Vancomicina intravenosa por 14 dias, que atinge altas concentrações no cólon.","Errada: a vancomicina intravenosa não atinge o lúmen intestinal e não trata C. difficile."],["Loperamida e probiótico, mantendo a ceftriaxona.","Errada: antimotilidade é desaconselhada, e o antibiótico desencadeante deve ser suspenso quando possível."]],"conc":"O C. difficile é a principal causa de diarreia associada a antibióticos e de diarreia nosocomial. Fatores de risco: antibiótico (especialmente cefalosporinas, clindamicina, quinolonas), idade avançada, internação e IBP.","rac":"Diarreia nosocomial após antibiótico com toxina positiva: primeiro episódio, não fulminante (leucócitos abaixo de 15.000 seria não grave; aqui 16.000, grave). Tratamento com fidaxomicina ou vancomicina oral; suspender o antibiótico desencadeante.","pista":"Diarreia iniciada durante uso de cefalosporina em paciente internada.","mud":"Hipotensão, íleo ou megacólon (forma fulminante) exigiriam vancomicina oral em dose alta, metronidazol intravenoso e avaliação cirúrgica.","cmp":"Vancomicina oral: trata C. difficile. Vancomicina intravenosa: não trata.","arm":"Prescrever vancomicina intravenosa para colite por C. difficile.","regra":"C. difficile: suspenda o antibiótico e dê fidaxomicina ou vancomicina por via oral.","cf":"Precauções de contato e lavagem das mãos com água e sabão são essenciais, pois os esporos resistem ao álcool.","fonte":"IDSA/SHEA Focused Update Guidelines on C. difficile in Adults (Johnson S et al., Clin Infect Dis 2021;73:e1029-e1044)."},{"n":7,"sub":"Diarreia secretora versus osmótica","comp":"Usar o gap osmolar fecal","tags":[],"rel":[],"enun":"Homem de 50 anos com diarreia aquosa volumosa há 2 meses, que persiste durante o jejum. O gap osmolar fecal calculado é de 30 mOsm/kg. Qual é o tipo de diarreia?","ops":[["Secretora: persiste no jejum e tem gap baixo.","Correta: gap abaixo de 50 mOsm/kg e persistência no jejum indicam diarreia secretora."],["Diarreia osmótica, pois o volume é grande.","Errada: a diarreia osmótica melhora no jejum e tem gap acima de 100 a 125 mOsm/kg."],["Diarreia inflamatória, pela longa duração.","Errada: a duração não define o mecanismo; a inflamatória tem sangue, leucócitos ou calprotectina elevada."],["Diarreia funcional da SII, por ser crônica.","Errada: a SII raramente causa diarreia volumosa que persiste no jejum."]],"conc":"Gap osmolar fecal = 290 − 2 × (Na + K fecais). Gap alto (acima de 100 a 125) indica substância osmoticamente ativa não absorvida (diarreia osmótica). Gap baixo (abaixo de 50) indica perda ativa de eletrólitos (diarreia secretora).","rac":"Persistência no jejum e gap de 30: secretora. Causas: tumores neuroendócrinos (VIPoma, carcinoide), laxativos estimulantes, colite microscópica, má absorção de sais biliares.","pista":"Persistência da diarreia durante o jejum.","mud":"Melhora com jejum e gap acima de 125 indicariam diarreia osmótica (lactose, sorbitol, laxativos osmóticos).","cmp":"Osmótica: melhora no jejum, gap alto. Secretora: persiste no jejum, gap baixo.","arm":"Confundir volume grande com diarreia osmótica.","regra":"Diarreia que não para no jejum: secretora.","cf":"Colite microscópica é causa comum de diarreia secretora em idosos e exige biópsias do cólon, mesmo com mucosa normal.","fonte":"AGA Technical Review on Chronic Diarrhea; BSG Guidelines for Investigation of Chronic Diarrhoea (Arasaradnam RP et al., Gut 2018;67:1380-1399)."},{"n":8,"sub":"Intoxicação alimentar","comp":"Identificar toxina pré-formada","tags":[],"rel":[],"enun":"Seis pessoas de uma festa apresentam vômitos intensos, náuseas e cólicas cerca de 2 horas após comer salgados com recheio de maionese deixados fora da geladeira. Sem febre. O quadro melhora em 24 horas. Qual é o agente mais provável?","ops":[["Toxina pré-formada de Staphylococcus aureus.","Correta: o início em 1 a 6 horas com vômitos predominantes após alimento manipulado e mal conservado indica toxina estafilocócica pré-formada."],["Salmonella não tifoide, por ovos crus da maionese.","Errada: a salmonelose tem incubação de 6 a 72 horas, com febre e diarreia predominantes."],["Clostridium perfringens, por carne reaquecida.","Errada: o C. perfringens causa diarreia e cólicas após 8 a 16 horas, com poucos vômitos."],["Norovírus, pela ocorrência em grupo.","Errada: o norovírus tem incubação de 12 a 48 horas."]],"conc":"Toxinas pré-formadas (S. aureus, Bacillus cereus emético) causam vômitos poucas horas após a ingestão, pois a toxina já está no alimento. Infecções que exigem multiplicação no intestino têm incubação maior.","rac":"Incubação de 2 horas, vômitos predominantes, sem febre, alimento manipulado e não refrigerado: S. aureus. Tratamento de suporte; antibiótico não é indicado.","pista":"Início em 2 horas com vômitos predominantes.","mud":"Arroz frito reaquecido com vômitos em 1 a 6 horas sugeriria B. cereus.","cmp":"1 a 6 horas: toxina pré-formada (S. aureus, B. cereus). 8 a 16 horas: C. perfringens. Mais de 16 horas: infecções (Salmonella, Campylobacter, norovírus).","arm":"Prescrever antibiótico para intoxicação por toxina pré-formada.","regra":"Vômito em grupo 2 horas após a festa: toxina do estafilococo.","cf":"Surtos alimentares devem ser notificados à vigilância epidemiológica.","fonte":"CDC. Foodborne Illness — Diagnosis and Management: A Primer for Physicians, MMWR 2004;53(RR-4); IDSA 2017."},{"n":9,"sub":"Síndrome hemolítico-urêmica","comp":"Reconhecer complicação da diarreia por STEC","tags":[],"rel":[],"enun":"Menino de 4 anos teve diarreia sanguinolenta sem febre há 7 dias, após comer hambúrguer malpassado. Agora está pálido, com oligúria, hemoglobina 7 g/dL com esquizócitos, plaquetas 45.000/mm³ e creatinina 2,4 mg/dL. Qual é o diagnóstico e o cuidado?","ops":[["Síndrome hemolítico-urêmica por STEC; suporte, sem antibiótico.","Correta: anemia hemolítica microangiopática, plaquetopenia e lesão renal após diarreia sanguinolenta caracterizam SHU típica."],["Púrpura trombocitopênica imune; corticoide e imunoglobulina.","Errada: na PTI não há anemia hemolítica com esquizócitos nem lesão renal."],["Sepse por Shigella; ceftriaxona imediata.","Errada: a SHU por STEC não se trata com antibiótico, que pode até aumentar a liberação de toxina."],["Desidratação grave com IRA pré-renal; plano C isolado.","Errada: a hemólise com esquizócitos e a plaquetopenia não se explicam por desidratação."]],"conc":"A SHU típica é complicação da infecção por E. coli produtora de toxina Shiga (como O157:H7). Tríade: anemia hemolítica microangiopática, plaquetopenia e lesão renal aguda, geralmente 5 a 10 dias após diarreia sanguinolenta.","rac":"Diarreia sanguinolenta sem febre, carne malpassada e, depois, a tríade: SHU. Tratamento de suporte, com diálise se necessário; evitar antibióticos e antimotilidade.","pista":"Esquizócitos, plaquetopenia e lesão renal após diarreia sanguinolenta.","mud":"SHU sem diarreia prévia (atípica) sugeriria desregulação do complemento, com outro tratamento (eculizumabe).","cmp":"SHU típica: criança, diarreia por STEC. PTT: adulto, febre e alteração neurológica, ADAMTS13 baixa.","arm":"Prescrever antibiótico em diarreia sanguinolenta não febril em criança com suspeita de STEC.","regra":"Diarreia com sangue e depois anemia, plaquetopenia e rim: SHU.","cf":"A SHU é a principal causa de lesão renal aguda em crianças pequenas.","fonte":"IDSA 2017 (Shane AL et al., Clin Infect Dis 2017); Fakhouri F et al. Haemolytic uraemic syndrome. Lancet 2017;390:681-696."},{"n":10,"sub":"Diarreia aquosa leve no adulto","comp":"Evitar exames desnecessários","tags":[],"rel":[],"enun":"Mulher de 30 anos, saudável, com diarreia aquosa há 1 dia, 5 evacuações, sem febre, sem sangue, sem sinais de desidratação. Qual é a conduta?","ops":[["Hidratação oral e, se desejado, loperamida, sem exames.","Correta: diarreia aquosa leve sem febre, sangue ou desidratação é autolimitada; loperamida pode ser usada para alívio."],["Coprocultura e EPF antes de qualquer tratamento.","Errada: exames são reservados a febre, sangue, gravidade, imunossupressão ou duração prolongada."],["Ciprofloxacino empírico por 3 dias.","Errada: antibiótico não é indicado em diarreia aquosa leve, pois não muda a evolução e aumenta efeitos adversos."],["Internação para hidratação venosa.","Errada: não há desidratação nem gravidade."]],"conc":"A maioria das diarreias agudas aquosas do adulto é viral e autolimitada. O tratamento é hidratação, com loperamida opcional para alívio sintomático quando não há febre nem sangue.","rac":"Sem febre, sem sangue, sem desidratação, 1 dia de duração: hidratação oral, dieta habitual e sintomáticos. Reavaliar se surgirem sinais de alarme ou persistência além de 7 dias.","pista":"Ausência de febre, sangue e desidratação.","mud":"Febre alta, sangue, idade avançada, imunossupressão ou desidratação indicariam exames e, possivelmente, antibiótico.","cmp":"Diarreia não invasiva: loperamida permitida. Diarreia invasiva: loperamida evitada.","arm":"Solicitar coprocultura e antibiótico para toda diarreia aguda.","regra":"Diarreia aquosa leve: hidratar e observar.","cf":"Diarreia em contexto de surto, manipulador de alimentos ou creche pode justificar exames por motivo de saúde pública.","fonte":"ACG Clinical Guideline: Acute Diarrheal Infections in Adults (Riddle MS et al., 2016); IDSA 2017."}]},{"id":"M09","titulo":"Adenoma e adenocarcinoma colorretal","bloco":1,"q":[{"n":1,"sub":"Sequência adenoma-carcinoma","comp":"Identificar a ordem das mutações na via clássica","tags":[],"rel":[],"enun":"Na via clássica de instabilidade cromossômica, a maioria dos adenocarcinomas colorretais surge de adenomas por acúmulo sequencial de alterações genéticas. Qual alteração costuma ser o evento inicial dessa sequência?","ops":[["Perda de função do gene APC.","Correta: a inativação do APC é o evento inicial, levando à formação do adenoma; seguem-se KRAS e, mais tarde, TP53."],["Mutação inicial de TP53.","Errada: a perda de TP53 é evento tardio, associado à transição para carcinoma invasivo."],["Mutação inicial de KRAS.","Errada: o KRAS ocorre no crescimento do adenoma, depois do APC."],["Deficiência de reparo de mismatch.","Errada: a deficiência de reparo caracteriza a via de instabilidade de microssatélites (Lynch e esporádicos com hipermetilação), não a via clássica."]],"conc":"A carcinogênese colorretal segue três vias principais: instabilidade cromossômica (APC, KRAS, TP53; cerca de 70% a 85% dos casos), instabilidade de microssatélites (deficiência de reparo de mismatch) e via serrilhada (BRAF, hipermetilação CIMP).","rac":"Na via clássica, APC inativado gera o adenoma; KRAS favorece o crescimento; TP53 marca a transformação maligna. Isso explica por que retirar adenomas previne câncer.","pista":"Pergunta sobre o evento inicial da via clássica.","mud":"Pólipos serrilhados no cólon direito seguiriam a via serrilhada, com mutação de BRAF.","cmp":"Via clássica: APC, KRAS, TP53. Via de microssatélites: MLH1, MSH2, MSH6, PMS2. Via serrilhada: BRAF, CIMP.","arm":"Colocar o TP53 no início da sequência.","regra":"APC abre a porta, TP53 fecha o diagnóstico de câncer.","cf":"A polipose adenomatosa familiar decorre de mutação germinativa do APC, o que explica a carga de centenas de adenomas.","fonte":"Robbins & Cotran Pathologic Basis of Disease, 10ª ed. (Gastrointestinal Tract); Fearon ER, Vogelstein B. Cell 1990;61:759-767."},{"n":2,"sub":"Risco do adenoma","comp":"Reconhecer as características de adenoma avançado","tags":[],"rel":[],"enun":"Na colonoscopia de um homem de 55 anos, são retirados vários pólipos. Qual deles tem maior potencial de transformação maligna?","ops":[["Adenoma viloso de 2,5 cm com displasia de alto grau.","Correta: tamanho maior ou igual a 10 mm, componente viloso e displasia de alto grau definem adenoma avançado, de maior risco."],["Adenoma tubular de 4 mm com displasia de baixo grau.","Errada: adenoma tubular pequeno com baixo grau é o de menor risco entre os adenomas."],["Pólipo hiperplásico de 3 mm no reto.","Errada: pólipos hiperplásicos pequenos no reto e sigmoide não têm potencial maligno relevante."],["Pólipo inflamatório pós-colite.","Errada: pseudopólipos inflamatórios não são lesões pré-malignas por si."]],"conc":"O risco de câncer em um adenoma aumenta com o tamanho, o componente viloso e o grau de displasia. Adenoma avançado é o que tem 10 mm ou mais, componente viloso ou displasia de alto grau.","rac":"Compare os pólipos: o viloso, grande e com alto grau reúne os três fatores de risco.","pista":"Tamanho, histologia vilosa e displasia de alto grau no mesmo pólipo.","mud":"Um pólipo serrilhado séssil grande no cólon direito também seria lesão de alto risco.","cmp":"Tubular: menor risco. Tubuloviloso: intermediário. Viloso: maior risco.","arm":"Considerar todo pólipo igualmente perigoso, ou ignorar pólipos serrilhados.","regra":"Grande, viloso e com displasia de alto grau: adenoma avançado.","cf":"Adenoma avançado ressecado leva a colonoscopia de controle em 3 anos.","fonte":"Gupta S et al. USMSTF Recommendations for follow-up after colonoscopy and polypectomy. Gastroenterology 2020;158:1131-1153."},{"n":3,"sub":"Vigilância pós-polipectomia","comp":"Programar o intervalo após adenomas pequenos","tags":[],"rel":[],"enun":"Mulher de 58 anos fez colonoscopia de rastreio completa, com bom preparo, e foram retirados dois adenomas tubulares de 5 e 7 mm, com displasia de baixo grau. Quando deve ser a próxima colonoscopia?","ops":[["Em 7 a 10 anos.","Correta: um a dois adenomas tubulares menores que 10 mm têm baixo risco; a recomendação é nova colonoscopia em 7 a 10 anos."],["Em 1 ano.","Errada: intervalo de 1 ano não se aplica a adenomas pequenos com ressecção completa e bom preparo."],["Em 3 anos.","Errada: 3 anos é o intervalo para adenoma avançado ou 5 a 10 adenomas."],["Não precisa mais de colonoscopia.","Errada: a paciente mantém indicação de vigilância, com intervalo longo."]],"conc":"As recomendações pós-polipectomia dependem do número, tamanho e histologia das lesões. Baixo risco (1 a 2 adenomas tubulares menores que 10 mm): 7 a 10 anos. Três a quatro pequenos: 3 a 5 anos. Cinco a dez ou adenoma avançado: 3 anos. Mais de 10: 1 ano.","rac":"Dois adenomas tubulares pequenos, ressecção completa, bom preparo: baixo risco, 7 a 10 anos.","pista":"Apenas dois adenomas pequenos, tubulares e de baixo grau.","mud":"Preparo intestinal ruim levaria a repetir o exame em até 1 ano.","cmp":"Baixo risco: 7 a 10 anos. Avançado: 3 anos. Mais de 10 adenomas: 1 ano e avaliar síndrome genética.","arm":"Encurtar o intervalo sem indicação, sobrecarregando o serviço de endoscopia.","regra":"Um ou dois adenomas pequenos: volte em 7 a 10 anos.","cf":"Pólipo séssil maior que 20 mm ressecado em fragmentos exige revisão em 6 meses.","fonte":"Gupta S et al. USMSTF Recommendations for follow-up after colonoscopy and polypectomy. Gastroenterology 2020."},{"n":4,"sub":"Rastreio com história familiar","comp":"Iniciar o rastreio em risco aumentado","tags":[],"rel":[],"enun":"Homem de 38 anos, assintomático, cujo pai teve câncer colorretal diagnosticado aos 50 anos. Quando e como deve iniciar o rastreio?","ops":[["Colonoscopia aos 40 anos, repetida a cada 5 anos.","Correta: parente de primeiro grau com câncer antes dos 60 anos indica colonoscopia a partir dos 40 anos ou 10 anos antes da idade do caso, a cada 5 anos."],["Pesquisa de sangue oculto a partir dos 50 anos, como na população geral.","Errada: o paciente tem risco aumentado e precisa de rastreio mais precoce e com colonoscopia."],["Colonoscopia a partir dos 45 anos, a cada 10 anos.","Errada: esse é o esquema de risco médio; aqui o risco é maior."],["Teste genético para Lynch antes de qualquer colonoscopia.","Errada: um caso isolado aos 50 anos não preenche critérios de Amsterdam; o rastreio endoscópico é a conduta."]],"conc":"O risco de câncer colorretal aumenta com parentes de primeiro grau afetados, sobretudo se o diagnóstico ocorreu antes dos 60 anos ou se há mais de um parente acometido.","rac":"Pai com câncer aos 50 anos: 10 anos antes seria 40 anos. Colonoscopia aos 40 e, se normal, a cada 5 anos.","pista":"Parente de primeiro grau com diagnóstico antes dos 60 anos.","mud":"Se o pai tivesse sido diagnosticado aos 70 anos, o rastreio poderia começar aos 40 anos com o esquema de risco médio.","cmp":"Risco médio: início aos 45 anos. Parente de primeiro grau antes dos 60: aos 40 ou 10 anos antes, colonoscopia a cada 5 anos.","arm":"Aplicar o rastreio da população geral a quem tem história familiar.","regra":"Parente de primeiro grau jovem: colonoscopia 10 anos antes ou aos 40.","cf":"Na população de risco médio, as diretrizes norte-americanas recomendam iniciar o rastreio aos 45 anos.","fonte":"ACG Clinical Guidelines: Colorectal Cancer Screening 2021 (Shaukat A et al., Am J Gastroenterol 2021;116:458-479); USPSTF 2021 (JAMA 2021;325:1965-1977)."},{"n":5,"sub":"Síndrome de Lynch","comp":"Aplicar os critérios de Amsterdam II","tags":[],"rel":[],"enun":"Mulher de 35 anos com adenocarcinoma de cólon direito. A mãe teve câncer de endométrio aos 48 anos e o tio materno, câncer colorretal aos 44 anos. A imuno-histoquímica do tumor mostra perda de MLH1 e PMS2. Qual é a hipótese e a vigilância indicada para os parentes portadores?","ops":[["Lynch; colonoscopia a cada 1 a 2 anos a partir dos 20 a 25 anos.","Correta: três parentes com cânceres do espectro Lynch, duas gerações, um antes dos 50 anos e deficiência de reparo de mismatch indicam Lynch."],["Polipose adenomatosa familiar; colectomia profilática aos 20 anos.","Errada: a PAF cursa com centenas de pólipos e mutação do APC, não com perda de MLH1."],["Câncer esporádico; rastreio habitual aos 45 anos para os parentes.","Errada: a história familiar e a imuno-histoquímica sugerem síndrome hereditária."],["Síndrome de Peutz-Jeghers; enteroscopia a cada 5 anos.","Errada: Peutz-Jeghers cursa com pólipos hamartomatosos e manchas melanocíticas orais."]],"conc":"A síndrome de Lynch é a causa hereditária mais comum de câncer colorretal. Decorre de mutação germinativa em genes de reparo de mismatch (MLH1, MSH2, MSH6, PMS2) e predispõe a câncer de cólon (predomínio direito), endométrio, ovário, estômago, vias urinárias e outros.","rac":"Amsterdam II (3-2-1): três parentes com câncer do espectro Lynch, um deles parente de primeiro grau dos outros dois; duas gerações sucessivas; um caso antes dos 50 anos; PAF excluída. A IHQ confirma deficiência de reparo.","pista":"Câncer de endométrio e colorretal em gerações sucessivas, com perda de MLH1.","mud":"Perda de MLH1 com mutação de BRAF ou hipermetilação do promotor sugeriria tumor esporádico com instabilidade de microssatélites.","cmp":"Lynch: poucos pólipos, cólon direito, MSI. PAF: centenas de pólipos, APC.","arm":"Esperar o surgimento de pólipos múltiplos para suspeitar de síndrome hereditária.","regra":"3-2-1 e perda de MLH1: pense em Lynch.","cf":"Mulheres com Lynch podem considerar histerectomia e salpingo-ooforectomia profiláticas após completar a prole.","fonte":"ACG Clinical Guideline: Genetic Testing and Management of Hereditary GI Cancer Syndromes (Syngal S et al., Am J Gastroenterol 2015;110:223-262)."},{"n":6,"sub":"Polipose adenomatosa familiar","comp":"Conduzir a PAF clássica","tags":[],"rel":[],"enun":"Rapaz de 19 anos, cujo pai morreu de câncer colorretal aos 38 anos, realiza colonoscopia que mostra centenas de adenomas em todo o cólon. Qual é a conduta?","ops":[["Colectomia profilática e vigilância endoscópica duodenal.","Correta: a PAF clássica tem risco de câncer próximo de 100%; a colectomia é indicada, e os adenomas duodenais exigem vigilância."],["Polipectomias anuais indefinidamente, sem cirurgia.","Errada: com centenas de adenomas, a polipectomia não controla o risco de câncer."],["Colonoscopia a cada 5 anos.","Errada: o intervalo é inadequado para o altíssimo risco da PAF."],["Quimioprevenção isolada com ácido acetilsalicílico.","Errada: a quimioprevenção não substitui a colectomia na PAF clássica."]],"conc":"A PAF é autossômica dominante, por mutação germinativa do APC. Causa centenas a milhares de adenomas a partir da adolescência, com risco de câncer próximo de 100% até os 40 anos sem tratamento. Associa-se a adenomas duodenais, tumores desmoides e alterações extracolônicas.","rac":"Centenas de adenomas em jovem com história familiar: PAF. Colectomia profilática, geralmente entre o fim da adolescência e o início da vida adulta, e EDA para vigilância duodenal.","pista":"Centenas de adenomas em paciente jovem.","mud":"Menos de 100 adenomas com padrão recessivo sugeriria polipose associada ao MUTYH.","cmp":"PAF clássica: mais de 100 adenomas. PAF atenuada: 10 a 100 adenomas. Lynch: poucos pólipos.","arm":"Tratar a PAF com polipectomias repetidas.","regra":"Centenas de adenomas: colectomia.","cf":"Parentes em risco devem fazer teste genético e, se portadores, colonoscopia a partir dos 10 a 12 anos.","fonte":"ACG Clinical Guideline: Hereditary GI Cancer Syndromes (Syngal S et al., 2015)."},{"n":7,"sub":"Apresentação clínica","comp":"Associar a localização do tumor aos sintomas","tags":[],"rel":[],"enun":"Mulher de 72 anos com fraqueza progressiva e dispneia aos esforços. Sem alteração do hábito intestinal. Hemoglobina 8,4 g/dL, VCM 70 fL, ferritina baixa. Pesquisa de sangue oculto positiva. Qual é a localização mais provável de um tumor colorretal nesse quadro?","ops":[["Cólon direito (ceco ou ascendente).","Correta: tumores do cólon direito costumam causar sangramento oculto e anemia ferropriva, sem alteração do hábito intestinal."],["Retossigmoide, com tenesmo e fezes em fita.","Errada: lesões distais cursam com mudança de hábito, hematoquezia, tenesmo e afilamento das fezes."],["Cólon descendente, com obstrução precoce.","Errada: lesões do cólon esquerdo tendem a obstruir mais cedo, pois o lúmen é mais estreito e as fezes são sólidas."],["Reto baixo, com sangramento vivo à evacuação.","Errada: tumores retais causam sangramento visível, tenesmo e sensação de evacuação incompleta."]],"conc":"O cólon direito tem lúmen amplo e conteúdo líquido: o tumor cresce sem obstruir e sangra de forma oculta, levando a anemia ferropriva. O cólon esquerdo tem lúmen estreito e fezes sólidas: obstrução e mudança de hábito são mais comuns.","rac":"Idosa com anemia ferropriva, sangue oculto positivo e hábito intestinal normal: tumor de cólon direito até prova em contrário. Colonoscopia é obrigatória.","pista":"Anemia ferropriva sem alteração do hábito intestinal.","mud":"Constipação progressiva com fezes em fita e distensão sugeririam tumor de cólon esquerdo.","cmp":"Direito: anemia, massa, sangramento oculto. Esquerdo: obstrução, mudança de hábito. Reto: hematoquezia, tenesmo.","arm":"Tratar anemia ferropriva no idoso só com ferro.","regra":"Anemia ferropriva no idoso: procure tumor de cólon direito.","cf":"Se a colonoscopia for normal, investiga-se o trato digestivo alto e, depois, o delgado.","fonte":"Sabiston Textbook of Surgery, 21ª ed. (Colon and Rectum); NCCN Guidelines Colon Cancer, 2025."},{"n":8,"sub":"Câncer de reto localmente avançado","comp":"Indicar terapia neoadjuvante","tags":[],"rel":[],"enun":"Homem de 60 anos com adenocarcinoma de reto médio, a 8 cm da borda anal. O estadiamento com ressonância de pelve mostra T3 com linfonodos mesorretais suspeitos e, na tomografia, sem metástases a distância. Qual é a sequência terapêutica mais adequada?","ops":[["Neoadjuvância seguida de excisão total do mesorreto.","Correta: câncer de reto localmente avançado (T3 ou N+) recebe neoadjuvância antes da cirurgia com excisão total do mesorreto."],["Ressecção cirúrgica imediata seguida de quimioterapia, como no cólon.","Errada: no reto localmente avançado, a neoadjuvância reduz a recidiva local e é o padrão."],["Ressecção endoscópica local, pois o tumor está ao alcance do retossigmoidoscópio.","Errada: lesão T3 com linfonodos não é passível de ressecção local."],["Quimioterapia paliativa exclusiva.","Errada: não há metástases; o tratamento tem intenção curativa."]],"conc":"No câncer de reto, a ressonância de pelve define T, N e a relação com a fáscia mesorretal. Tumores T3 ou T4 ou com linfonodos positivos recebem neoadjuvância (quimiorradioterapia ou terapia neoadjuvante total) e depois excisão total do mesorreto.","rac":"Reto médio T3N1 sem metástase: estádio III. Neoadjuvância e cirurgia com excisão total do mesorreto. Resposta clínica completa pode permitir estratégia de observação vigilante em centros experientes.","pista":"Reto médio com T3 e linfonodos suspeitos.","mud":"Câncer de cólon estádio III seria operado primeiro e receberia quimioterapia adjuvante (FOLFOX ou CAPOX).","cmp":"Cólon estádio III: cirurgia e adjuvância. Reto localmente avançado: neoadjuvância e cirurgia.","arm":"Tratar câncer de reto como câncer de cólon.","regra":"Reto T3 ou N+: neoadjuvância antes da excisão total do mesorreto.","cf":"Tumores com deficiência de reparo de mismatch podem responder intensamente à imunoterapia neoadjuvante.","fonte":"NCCN Guidelines Rectal Cancer, 2025; ESMO Clinical Practice Guidelines: Localised Rectal Cancer (Glynne-Jones R et al., Ann Oncol 2017; atualização 2018)."},{"n":9,"sub":"Câncer de cólon estádio III","comp":"Indicar quimioterapia adjuvante","tags":[],"rel":[],"enun":"Mulher de 62 anos submetida a colectomia direita por adenocarcinoma de ceco. O anatomopatológico mostra tumor pT3 com 3 de 18 linfonodos positivos e margens livres. Não há metástases a distância. Qual é a conduta após a cirurgia?","ops":[["Quimioterapia adjuvante com FOLFOX ou CAPOX.","Correta: câncer de cólon com linfonodos positivos (estádio III) tem indicação de quimioterapia adjuvante."],["Apenas seguimento com CEA e colonoscopia, pois a ressecção foi completa.","Errada: linfonodo positivo aumenta o risco de recidiva; a adjuvância melhora a sobrevida."],["Radioterapia adjuvante no leito tumoral.","Errada: radioterapia não é rotina no câncer de cólon; é usada no reto."],["Nova cirurgia para colectomia total profilática.","Errada: não há indicação de ampliação; a ressecção foi oncológica com margens livres."]],"conc":"No câncer de cólon, o estádio III (linfonodo positivo) é indicação de quimioterapia adjuvante; no estádio II, a adjuvância é considerada se houver fatores de alto risco. O seguimento inclui CEA, tomografia e colonoscopia.","rac":"pT3N1, M0: estádio III. Quimioterapia adjuvante com FOLFOX ou CAPOX (3 a 6 meses, conforme o risco).","pista":"Linfonodos positivos na peça cirúrgica.","mud":"Estádio II sem fatores de alto risco poderia ser apenas acompanhado.","cmp":"Estádio I: cirurgia. Estádio II: adjuvância se alto risco. Estádio III: adjuvância.","arm":"Usar CEA como exame de rastreio ou dispensar adjuvância no estádio III.","regra":"Linfonodo positivo no cólon: quimioterapia adjuvante.","cf":"A colonoscopia de controle é feita 1 ano após a cirurgia.","fonte":"NCCN Guidelines Colon Cancer, 2025; ESMO Localised Colon Cancer Guidelines (Argilés G et al., Ann Oncol 2020)."},{"n":10,"sub":"Streptococcus gallolyticus","comp":"Investigar neoplasia associada à bacteremia","tags":[],"rel":[],"enun":"Homem de 66 anos com endocardite de valva aórtica por Streptococcus gallolyticus (antigo S. bovis biotipo I). Não tem queixas digestivas. Qual exame deve ser solicitado após a estabilização?","ops":[["Colonoscopia, pela forte associação com neoplasia colorretal.","Correta: bacteremia ou endocardite por S. gallolyticus associa-se a adenomas e câncer colorretal, e a colonoscopia é recomendada."],["Endoscopia digestiva alta para pesquisa de H. pylori.","Errada: a associação clássica é com neoplasia de cólon, não com H. pylori."],["Ultrassonografia de abdome para pesquisar cálculo na vesícula biliar.","Errada: a litíase biliar não se relaciona ao S. gallolyticus."],["Nenhum exame adicional, pois o agente é comensal.","Errada: mesmo sem sintomas, a colonoscopia é recomendada pela associação com neoplasia."]],"conc":"O Streptococcus gallolyticus está associado a lesões colônicas, especialmente adenomas e adenocarcinoma. Diante de bacteremia ou endocardite por esse agente, recomenda-se colonoscopia.","rac":"Endocardite por S. gallolyticus em idoso: colonoscopia mesmo sem sintomas digestivos.","pista":"Agente específico com associação conhecida a neoplasia colorretal.","mud":"Endocardite por S. viridans após procedimento dentário não exigiria colonoscopia.","cmp":"S. gallolyticus: cólon. Clostridium septicum: também associado a neoplasia colorretal.","arm":"Encerrar a investigação após tratar a endocardite.","regra":"S. gallolyticus no sangue: colonoscopia.","cf":"Bacteremia por Clostridium septicum também deve levar à investigação de câncer colorretal.","fonte":"AHA Scientific Statement: Infective Endocarditis in Adults (Baddour LM et al., Circulation 2015;132:1435-1486)."}]},{"id":"M10","titulo":"Hepatites virais","bloco":1,"q":[{"n":1,"sub":"Hepatite A","comp":"Confirmar hepatite A aguda","tags":[],"rel":[],"enun":"Criança de 8 anos com febre baixa, náuseas, colúria e icterícia há 5 dias. Outras crianças da escola tiveram quadro semelhante. ALT 1.850 U/L. Qual exame confirma a hipótese mais provável?","ops":[["Anti-HAV IgM.","Correta: o anti-HAV IgM positivo confirma hepatite A aguda."],["Anti-HAV IgG.","Errada: o anti-HAV IgG indica infecção passada ou vacinação; persiste por toda a vida e não diferencia infecção aguda."],["HBsAg.","Errada: a hepatite B é de transmissão sexual, vertical e parenteral; surtos escolares com icterícia sugerem hepatite A."],["Anti-HCV.","Errada: a hepatite C aguda raramente causa icterícia e não se transmite por via fecal-oral."]],"conc":"A hepatite A é de transmissão fecal-oral, autolimitada, sem cronificação. Em crianças, costuma ser assintomática ou leve; em adultos, mais sintomática. O diagnóstico é feito pelo anti-HAV IgM.","rac":"Surto em escola, quadro ictérico agudo e transaminases muito altas: hepatite A. O anti-HAV IgM confirma.","pista":"Casos semelhantes entre colegas de escola.","mud":"Anti-HAV IgM negativo com HBsAg positivo levaria a pensar em hepatite B aguda.","cmp":"Anti-HAV IgM: infecção aguda. Anti-HAV IgG: imunidade (infecção passada ou vacina).","arm":"Pedir anti-HAV total ou IgG para diagnosticar hepatite aguda.","regra":"Hepatite A aguda: anti-HAV IgM.","cf":"A vacina contra hepatite A está no calendário infantil do SUS (dose aos 15 meses), e contactantes suscetíveis podem receber vacina como profilaxia pós-exposição.","fonte":"Brasil. Ministério da Saúde. Manual Técnico para o Diagnóstico das Hepatites Virais, 2ª ed., 2018; Guia de Vigilância em Saúde, 6ª ed., 2023."},{"n":2,"sub":"Hepatite B aguda","comp":"Interpretar o perfil sorológico","tags":[],"rel":[],"enun":"Homem de 28 anos com icterícia há 1 semana, após relação sexual desprotegida há 2 meses. Exames: HBsAg reagente, anti-HBc IgM reagente, HBeAg reagente, anti-HBs não reagente. Qual é a interpretação?","ops":[["Hepatite B aguda com replicação viral.","Correta: HBsAg e anti-HBc IgM positivos indicam infecção aguda; o HBeAg positivo indica replicação."],["Hepatite B crônica reagudizada, sem risco de transmissão.","Errada: a hepatite crônica exige HBsAg por mais de 6 meses, e o HBeAg positivo indica alta transmissibilidade."],["Imunidade por vacinação.","Errada: a vacina gera apenas anti-HBs, sem HBsAg nem anti-HBc."],["Infecção passada curada.","Errada: na cura há anti-HBc IgG e anti-HBs, com HBsAg negativo."]],"conc":"HBsAg indica presença do vírus; anti-HBc IgM indica infecção recente; HBeAg indica replicação ativa e alta infectividade; anti-HBs indica imunidade.","rac":"HBsAg mais anti-HBc IgM: infecção aguda. HBeAg positivo: replicação. Acompanhar até negativação do HBsAg e soroconversão para anti-HBs.","pista":"Anti-HBc IgM reagente.","mud":"HBsAg positivo por mais de 6 meses com anti-HBc IgG caracterizaria infecção crônica.","cmp":"Aguda: HBsAg mais anti-HBc IgM. Crônica: HBsAg mais de 6 meses e anti-HBc IgG.","arm":"Confundir anti-HBc IgM com marcador de imunidade.","regra":"Anti-HBc IgM positivo: hepatite B recente.","cf":"Parceiros sexuais suscetíveis devem receber vacina e, se exposição recente, imunoglobulina.","fonte":"Brasil. Ministério da Saúde. Manual Técnico para o Diagnóstico das Hepatites Virais, 2018."},{"n":3,"sub":"Janela imunológica","comp":"Reconhecer o período de janela da hepatite B","tags":[],"rel":[],"enun":"Paciente com hepatite aguda tem HBsAg não reagente, anti-HBs não reagente e anti-HBc IgM reagente. Como interpretar?","ops":[["Janela imunológica: HBsAg já negativou e anti-HBs ainda não surgiu.","Correta: na janela, o único marcador positivo pode ser o anti-HBc IgM."],["Falso-positivo do anti-HBc IgM, pois sem HBsAg não há hepatite B.","Errada: a ausência de HBsAg não exclui hepatite B aguda na fase de janela."],["Infecção crônica com mutante pré-core.","Errada: o mutante pré-core tem HBsAg positivo com HBeAg negativo."],["Imunidade por vacinação incompleta.","Errada: a vacina não gera anti-HBc."]],"conc":"Na evolução da hepatite B aguda, o HBsAg desaparece e o anti-HBs surge semanas depois. Nesse intervalo (janela), o anti-HBc IgM é o marcador que identifica a infecção.","rac":"HBsAg negativo, anti-HBs negativo e anti-HBc IgM positivo: janela. Repetir a sorologia em semanas para documentar o anti-HBs.","pista":"Apenas o anti-HBc IgM reagente.","mud":"Anti-HBc total isolado (sem IgM) poderia indicar infecção passada com anti-HBs indetectável, infecção oculta ou falso-positivo.","cmp":"Janela: só anti-HBc IgM. Cura: anti-HBc IgG mais anti-HBs.","arm":"Excluir hepatite B pela negatividade do HBsAg.","regra":"HBsAg negativo não exclui hepatite B aguda: olhe o anti-HBc IgM.","cf":"O anti-HBc IgM pode persistir por até 6 meses após a infecção aguda.","fonte":"Brasil. Ministério da Saúde. Manual Técnico para o Diagnóstico das Hepatites Virais, 2018."},{"n":4,"sub":"Perfis de imunidade","comp":"Diferenciar vacinação de infecção passada","tags":[],"rel":[],"enun":"Dois profissionais de saúde fazem sorologia. A: HBsAg não reagente, anti-HBc total não reagente, anti-HBs 150 mUI/mL. B: HBsAg não reagente, anti-HBc total reagente, anti-HBs 80 mUI/mL. Como interpretar?","ops":[["A: imunidade vacinal; B: infecção passada curada.","Correta: anti-HBs isolado indica vacinação; anti-HBc com anti-HBs indica infecção passada resolvida."],["A e B têm hepatite B crônica controlada.","Errada: sem HBsAg, não há infecção crônica."],["A tem infecção passada; B foi vacinado.","Errada: a vacina gera apenas anti-HBs; o anti-HBc só surge após contato com o vírus."],["A e B precisam ser revacinados.","Errada: ambos têm anti-HBs maior que 10 mUI/mL, portanto estão imunes."]],"conc":"A vacina contém apenas HBsAg recombinante e induz anti-HBs. A infecção natural induz anti-HBc (e anti-HBs se houver cura). Anti-HBs de pelo menos 10 mUI/mL indica imunidade.","rac":"Anti-HBs sem anti-HBc: vacinal. Anti-HBs com anti-HBc: infecção curada.","pista":"Presença ou ausência do anti-HBc.","mud":"Anti-HBs abaixo de 10 mUI/mL após esquema completo levaria a repetir o esquema vacinal e refazer a sorologia.","cmp":"Vacina: só anti-HBs. Infecção curada: anti-HBc mais anti-HBs.","arm":"Interpretar anti-HBc positivo como resposta vacinal.","regra":"Anti-HBc só aparece se o vírus passou por ali.","cf":"Pacientes com anti-HBc positivo podem reativar a hepatite B se receberem imunossupressão intensa, como rituximabe.","fonte":"Brasil. Ministério da Saúde. Manual Técnico para o Diagnóstico das Hepatites Virais, 2018."},{"n":5,"sub":"Hepatite B crônica","comp":"Indicar tratamento antiviral","tags":[],"rel":[],"enun":"Mulher de 40 anos com HBsAg reagente há 2 anos, HBeAg não reagente, anti-HBe reagente, HBV-DNA 45.000 UI/mL, ALT 2,5 vezes o limite superior e elastografia sugerindo fibrose moderada. Sem cirrose e sem doença renal. Qual é a conduta?","ops":[["Iniciar tenofovir, pela replicação viral com ALT alta e fibrose.","Correta: HBeAg negativo com HBV-DNA acima de 2.000 UI/mL, ALT elevada e fibrose indica hepatite B crônica ativa com indicação de tratamento."],["Apenas acompanhar, pois o HBeAg negativo define portador inativo.","Errada: o portador inativo tem HBV-DNA baixo e ALT normal; aqui há replicação e inflamação."],["Lamivudina em monoterapia, por ser a droga de primeira escolha.","Errada: a lamivudina tem baixa barreira genética à resistência e não é primeira escolha."],["Ribavirina associada a interferon convencional.","Errada: a ribavirina não tem papel no tratamento da hepatite B."]],"conc":"A hepatite B crônica é HBsAg positivo por mais de 6 meses. A indicação de tratamento considera HBV-DNA, ALT, grau de fibrose, presença de cirrose e situações especiais. Tenofovir e entecavir são os análogos de alta barreira genética.","rac":"HBeAg negativo com HBV-DNA alto, ALT elevada e fibrose: hepatite crônica HBeAg negativa ativa (mutante pré-core). Tenofovir é a primeira escolha no Brasil.","pista":"HBV-DNA acima de 2.000 UI/mL com ALT elevada.","mud":"HBV-DNA abaixo de 2.000 UI/mL com ALT persistentemente normal caracterizaria infecção crônica HBeAg negativa (portador inativo), apenas monitorada.","cmp":"Tenofovir e entecavir: alta barreira genética. Lamivudina: baixa barreira.","arm":"Considerar todo HBeAg negativo como doença inativa.","regra":"HBeAg negativo com vírus alto e ALT alta: trate.","cf":"Em doença renal ou osteoporose, o entecavir ou o tenofovir alafenamida são alternativas ao tenofovir desoproxila.","fonte":"Brasil. Ministério da Saúde. PCDT para Hepatite B e Coinfecções (versão vigente); EASL Clinical Practice Guidelines on HBV infection (J Hepatol 2017;67:370-398)."},{"n":6,"sub":"Hepatite C: diagnóstico","comp":"Confirmar infecção ativa pelo HCV","tags":[],"rel":[],"enun":"Homem de 52 anos, com história de transfusão em 1988, tem anti-HCV reagente em teste rápido. Transaminases levemente elevadas. Qual é o próximo passo?","ops":[["Solicitar HCV-RNA (carga viral) para confirmar infecção ativa.","Correta: o anti-HCV indica contato; o HCV-RNA confirma se a infecção está ativa."],["Iniciar tratamento antiviral imediatamente com base no anti-HCV.","Errada: cerca de 15% a 45% dos infectados eliminam o vírus espontaneamente; é preciso confirmar viremia antes de tratar."],["Repetir o anti-HCV em 6 meses para confirmar cronicidade.","Errada: a repetição do anticorpo não confirma viremia; o anti-HCV persiste mesmo após a cura."],["Solicitar genotipagem obrigatória antes de qualquer outro exame.","Errada: com os esquemas pangenotípicos, a genotipagem não é mais obrigatória para iniciar o tratamento na maioria dos casos."]],"conc":"O anti-HCV indica exposição ao vírus, mas não diferencia infecção atual de passada. A infecção ativa é confirmada pelo HCV-RNA. O anticorpo permanece positivo após a cura espontânea ou após o tratamento.","rac":"Anti-HCV positivo: solicitar HCV-RNA. Se detectável, avaliar fibrose e tratar; se indetectável, infecção passada resolvida.","pista":"Anti-HCV reagente sem carga viral.","mud":"HCV-RNA indetectável indicaria infecção resolvida, sem necessidade de tratamento.","cmp":"Anti-HCV: exposição. HCV-RNA: infecção ativa.","arm":"Usar o anti-HCV para controle de cura após o tratamento.","regra":"Anti-HCV positivo: confirme com HCV-RNA.","cf":"O controle de cura é a resposta virológica sustentada: HCV-RNA indetectável 12 semanas após o fim do tratamento.","fonte":"Brasil. Ministério da Saúde. PCDT Hepatite C e Coinfecções (versão vigente); Manual Técnico para o Diagnóstico das Hepatites Virais, 2018."},{"n":7,"sub":"Hepatite C: tratamento","comp":"Escolher o esquema e o critério de cura","tags":[],"rel":[],"enun":"Paciente com hepatite C crônica confirmada (HCV-RNA detectável), sem cirrose, sem tratamento prévio e sem coinfecção. Qual tratamento e qual critério de cura são adequados?","ops":[["Sofosbuvir e velpatasvir por 12 semanas; cura por RVS12.","Correta: os antivirais de ação direta pangenotípicos curam mais de 95% dos casos, e a cura é a resposta virológica sustentada."],["Interferon peguilado com ribavirina por 48 semanas; cura pela negativação do anti-HCV.","Errada: o interferon foi substituído pelos antivirais de ação direta, e o anti-HCV não negativa com a cura."],["Tenofovir contínuo por tempo indeterminado; cura pela normalização da ALT.","Errada: o tenofovir trata hepatite B, não C, e a ALT normal não comprova cura."],["Observação clínica, pois a hepatite C crônica sem cirrose não tem indicação de tratamento.","Errada: todos os pacientes com hepatite C crônica têm indicação de tratamento."]],"conc":"A hepatite C é curável. Os antivirais de ação direta (inibidores de NS3/4A, NS5A e NS5B) por 8 a 12 semanas atingem resposta virológica sustentada em mais de 95% dos casos.","rac":"HCV-RNA detectável sem cirrose: tratar com esquema pangenotípico (sofosbuvir e velpatasvir por 12 semanas ou glecaprevir e pibrentasvir por 8 semanas). Confirmar cura com HCV-RNA 12 semanas após o fim.","pista":"Hepatite C crônica confirmada.","mud":"Cirrose descompensada exigiria ajuste de esquema (ribavirina associada, evitar inibidores de protease) e avaliação para transplante.","cmp":"Cura do HCV: RVS12. Anti-HCV: permanece positivo.","arm":"Esperar o anti-HCV negativar para considerar a cura.","regra":"Hepatite C: antiviral de ação direta e RVS12.","cf":"Pacientes cirróticos curados continuam com rastreio de carcinoma hepatocelular a cada 6 meses.","fonte":"Brasil. Ministério da Saúde. PCDT Hepatite C e Coinfecções (versão vigente); AASLD-IDSA HCV Guidance (atualização vigente)."},{"n":8,"sub":"Transmissão vertical da hepatite B","comp":"Proteger o recém-nascido de mãe HBsAg positiva","tags":[],"rel":[],"enun":"Recém-nascido a termo, de mãe HBsAg reagente, nasce de parto vaginal. Qual é a conduta para prevenir a transmissão vertical?","ops":[["Vacina e imunoglobulina anti-hepatite B nas primeiras 12 horas.","Correta: a combinação de vacina e imunoglobulina nas primeiras horas reduz drasticamente a transmissão vertical."],["Apenas a vacina contra hepatite B aos 2 meses de idade.","Errada: a vacina deve ser feita ao nascer, associada à imunoglobulina, no filho de mãe HBsAg positiva."],["Contraindicar o aleitamento materno.","Errada: o aleitamento não é contraindicado após a imunoprofilaxia adequada."],["Indicar cesariana eletiva para todas as gestantes HBsAg positivas.","Errada: a via de parto segue indicação obstétrica; a cesárea não é indicada para prevenir a transmissão da hepatite B."]],"conc":"A transmissão vertical da hepatite B ocorre principalmente no parto. A imunoprofilaxia do recém-nascido (vacina e imunoglobulina) e, em gestantes com alta carga viral ou HBeAg positivo, o tenofovir no terceiro trimestre reduzem o risco.","rac":"Mãe HBsAg positiva: vacina e imunoglobulina no recém-nascido nas primeiras 12 horas (até 7 dias, se não for possível antes), completar o esquema vacinal e fazer sorologia após o término.","pista":"Mãe HBsAg reagente.","mud":"Mãe com HBsAg desconhecido também exige vacina ao nascer e investigação materna imediata.","cmp":"Profilaxia neonatal: vacina e imunoglobulina. Profilaxia materna: tenofovir no terceiro trimestre se indicado.","arm":"Atrasar a vacina ou indicar cesárea para todas.","regra":"Filho de mãe HBsAg positiva: vacina e imunoglobulina nas primeiras 12 horas.","cf":"A sorologia da criança (HBsAg e anti-HBs) após o esquema confirma a proteção.","fonte":"Brasil. Ministério da Saúde. PCDT para Prevenção da Transmissão Vertical de HIV, Sífilis e Hepatites Virais (versão vigente)."},{"n":9,"sub":"Hepatite D","comp":"Reconhecer a dependência do HBV","tags":[],"rel":[],"enun":"Homem de 30 anos, natural da Amazônia ocidental, sabidamente portador de hepatite B crônica, apresenta piora aguda grave da função hepática. Qual hipótese deve ser investigada e por quê?","ops":[["Superinfecção pelo HDV, que depende do HBsAg e é endêmico na região.","Correta: o HDV é vírus defectivo que precisa do HBV; a superinfecção em portador crônico causa hepatite grave, e a Amazônia é área endêmica."],["Hepatite E, que depende do HBV para causar doença.","Errada: o HEV não depende do HBV; é transmitido por via fecal-oral ou zoonótica."],["Hepatite C aguda, que só ocorre em portadores de hepatite B.","Errada: o HCV não depende do HBV para infectar."],["Hepatite A, que só causa doença grave em quem tem anti-HBs.","Errada: a gravidade da hepatite A não depende de marcadores do HBV."]],"conc":"O HDV é um vírus RNA defectivo que usa o HBsAg como envelope. Ocorre como coinfecção (simultânea ao HBV) ou superinfecção (em portador crônico), esta com maior risco de cronificação e evolução grave. No Brasil, é endêmico na Amazônia.","rac":"Portador crônico de HBV da Amazônia com descompensação aguda: pesquisar anti-HDV e HDV-RNA.","pista":"Origem na Amazônia ocidental e portador crônico de HBV.","mud":"Ausência de HBV excluiria a hepatite D.","cmp":"Coinfecção HBV-HDV: geralmente aguda e autolimitada. Superinfecção: grave, cronifica com frequência.","arm":"Esquecer que a vacina contra hepatite B também previne a hepatite D.","regra":"Sem HBV, não há hepatite D.","cf":"O tratamento da hepatite D crônica inclui interferon peguilado, e a bulevirtida é opção onde disponível.","fonte":"Brasil. Ministério da Saúde. PCDT para Hepatite B e Coinfecções (versão vigente); Guia de Vigilância em Saúde, 2023."},{"n":10,"sub":"Insuficiência hepática aguda","comp":"Reconhecer critérios e encaminhamento","tags":[],"rel":[],"enun":"Mulher de 26 anos, sem hepatopatia prévia, com hepatite B aguda há 10 dias, passa a ter confusão mental e asterixe. INR 2,4, bilirrubina 18 mg/dL, glicemia 58 mg/dL. Qual é a conduta mais importante?","ops":[["Transferir precocemente para centro de transplante hepático.","Correta: coagulopatia (INR de pelo menos 1,5) com encefalopatia em paciente sem hepatopatia prévia define insuficiência hepática aguda, com indicação de avaliação para transplante."],["Acompanhar em enfermaria com hidratação, pois a hepatite B aguda é autolimitada.","Errada: com encefalopatia e coagulopatia, a mortalidade é alta sem tratamento intensivo e transplante."],["Plasma fresco congelado para normalizar o INR antes de transferir.","Errada: a correção rotineira do INR não é indicada sem sangramento e prejudica a avaliação prognóstica."],["Iniciar corticoide em dose alta para reduzir a inflamação hepática.","Errada: corticoide não tem papel na insuficiência hepática aguda por hepatite B."]],"conc":"A insuficiência hepática aguda é definida por coagulopatia (INR de pelo menos 1,5) e encefalopatia em paciente sem doença hepática prévia, com evolução de até 26 semanas. Causas: paracetamol, hepatites virais, fármacos, autoimune, isquemia.","rac":"Hepatite B aguda com encefalopatia e INR 2,4: insuficiência hepática aguda. Terapia intensiva, controle da glicemia, prevenção de edema cerebral, antiviral (tenofovir ou entecavir) e transferência para centro transplantador.","pista":"Encefalopatia com INR acima de 1,5 sem hepatopatia prévia.","mud":"Ausência de encefalopatia, com INR elevado, caracterizaria lesão hepática aguda grave, ainda com necessidade de vigilância estreita.","cmp":"Insuficiência hepática aguda: sem hepatopatia prévia. Crônica agudizada (ACLF): sobre cirrose.","arm":"Corrigir o INR rotineiramente com plasma.","regra":"Encefalopatia com INR alto em hepatite aguda: ligue para o centro de transplante.","cf":"Os critérios do King's College ajudam a indicar transplante.","fonte":"EASL Clinical Practice Guidelines on the management of acute (fulminant) liver failure (J Hepatol 2017;66:1047-1081)."}]},{"id":"M11","titulo":"Cirrose hepática","bloco":1,"q":[{"n":1,"sub":"Child-Pugh","comp":"Calcular a classificação de Child-Pugh","tags":[],"rel":[],"enun":"Homem de 55 anos com cirrose alcoólica: bilirrubina 2,6 mg/dL, albumina 2,9 g/dL, INR 1,9, ascite leve controlada com diurético e sem encefalopatia. Qual é a classificação de Child-Pugh?","ops":[["Child-Pugh B (9 pontos).","Correta: bilirrubina 2 a 3 (2 pontos), albumina 2,8 a 3,5 (2), INR 1,7 a 2,3 (2), ascite leve (2) e sem encefalopatia (1) somam 9 pontos, classe B."],["Child-Pugh A (6 pontos).","Errada: a soma correta é 9; classe A vai de 5 a 6 pontos."],["Child-Pugh C (11 pontos).","Errada: classe C exige 10 a 15 pontos; a soma aqui é 9."],["Child-Pugh B (7 pontos).","Errada: ascite controlada com diurético ainda pontua 2; o total é 9."]],"conc":"Child-Pugh usa cinco parâmetros (bilirrubina, albumina, INR ou tempo de protrombina, ascite e encefalopatia), cada um de 1 a 3 pontos. Classe A: 5 a 6; B: 7 a 9; C: 10 a 15.","rac":"Bilirrubina 2,6: 2 pontos (2 a 3 mg/dL). Albumina 2,9: 2 pontos (2,8 a 3,5). INR 1,9: 2 pontos (1,7 a 2,3). Ascite leve: 2. Sem encefalopatia: 1. Total 9: Child B.","pista":"INR e albumina na faixa intermediária, somados à ascite leve.","mud":"Albumina abaixo de 2,8 e ascite volumosa elevariam a pontuação para classe C.","cmp":"Child-Pugh: inclui ascite e encefalopatia (subjetivos). MELD: bilirrubina, INR, creatinina e sódio (objetivos).","arm":"Esquecer de pontuar a ascite controlada.","regra":"Child: 5-6 A, 7-9 B, 10-15 C.","cf":"O MELD-Na é usado para priorizar a lista de transplante.","fonte":"Pugh RN et al. Br J Surg 1973;60:646-649; EASL Clinical Practice Guidelines for decompensated cirrhosis (J Hepatol 2018;69:406-460)."},{"n":2,"sub":"Gradiente soro-ascite","comp":"Interpretar a análise do líquido ascítico","tags":[],"rel":[],"enun":"Paciente com ascite de início recente. Albumina sérica 2,8 g/dL e albumina no líquido 1,2 g/dL; proteína total do líquido 1,0 g/dL. Qual é a interpretação?","ops":[["GASA 1,6 g/dL com proteína baixa: hipertensão portal, sugestiva de cirrose.","Correta: GASA de pelo menos 1,1 indica hipertensão portal; proteína abaixo de 2,5 aponta para causa sinusoidal (cirrose)."],["GASA 1,6 g/dL com proteína baixa: carcinomatose peritoneal.","Errada: a carcinomatose costuma ter GASA abaixo de 1,1 e proteína alta."],["GASA 1,6 g/dL com proteína baixa: ascite cardíaca por insuficiência cardíaca.","Errada: na ascite cardíaca o GASA é alto, mas a proteína é geralmente acima de 2,5 g/dL."],["GASA 1,6 g/dL com proteína baixa: tuberculose peritoneal.","Errada: a tuberculose peritoneal tem GASA baixo, proteína alta e predomínio linfocitário."]],"conc":"GASA = albumina sérica − albumina do líquido. Valor de pelo menos 1,1 g/dL indica hipertensão portal (cirrose, cardíaca, Budd-Chiari). Abaixo de 1,1 sugere causas peritoneais (carcinomatose, tuberculose, pancreatite) ou síndrome nefrótica.","rac":"2,8 − 1,2 = 1,6: hipertensão portal. Proteína 1,0 (abaixo de 2,5): sinusoidal, típica de cirrose.","pista":"GASA alto com proteína baixa.","mud":"GASA alto com proteína acima de 2,5 sugeriria causa pós-sinusoidal (cardíaca, Budd-Chiari).","cmp":"GASA alto e proteína baixa: cirrose. GASA alto e proteína alta: cardíaca. GASA baixo: peritoneal.","arm":"Calcular o gradiente com proteína total em vez de albumina.","regra":"GASA de 1,1 ou mais: hipertensão portal.","cf":"Proteína do líquido abaixo de 1,5 g/dL aumenta o risco de peritonite bacteriana espontânea.","fonte":"AASLD Practice Guidance on Ascites, SBP and HRS (Biggins SW et al., Hepatology 2021;74:1014-1048)."},{"n":3,"sub":"Peritonite bacteriana espontânea","comp":"Tratar a PBE","tags":[],"rel":[],"enun":"Cirrótico com ascite apresenta febre baixa e dor abdominal difusa. A paracentese mostra 520 polimorfonucleares/mm³. Creatinina 1,4 mg/dL. Qual é a conduta?","ops":[["Ceftriaxona intravenosa e albumina nos dias 1 e 3.","Correta: PMN de pelo menos 250/mm³ define PBE; a albumina reduz lesão renal e mortalidade, especialmente com disfunção renal."],["Aguardar a cultura do líquido para iniciar antibiótico.","Errada: o tratamento é iniciado com PMN de 250/mm³ ou mais, sem esperar a cultura."],["Laparotomia exploradora para identificar a fonte da peritonite.","Errada: PBE é infecção sem foco cirúrgico; a laparotomia é para peritonite secundária."],["Paracentese de grande volume para retirar o líquido infectado, sem antibiótico.","Errada: a PBE exige antibiótico; a paracentese terapêutica não trata a infecção."]],"conc":"A PBE é infecção do líquido ascítico sem foco intra-abdominal cirúrgico. Diagnóstico: PMN de pelo menos 250/mm³ no líquido. Tratamento: cefalosporina de terceira geração (cefotaxima ou ceftriaxona) e albumina.","rac":"PMN 520: PBE. Antibiótico imediato e albumina (1,5 g/kg no dia 1 e 1 g/kg no dia 3). Depois, profilaxia secundária com quinolona ou sulfametoxazol-trimetoprima.","pista":"PMN acima de 250/mm³.","mud":"Líquido com múltiplos germes, glicose baixa e proteína alta sugeriria peritonite secundária (perfuração).","cmp":"PBE: monomicrobiana, PMN de 250 ou mais. Secundária: polimicrobiana, glicose baixa, DHL alta, cirurgia.","arm":"Esperar a cultura ou esquecer a albumina.","regra":"PMN de 250 ou mais: ceftriaxona e albumina.","cf":"Após um episódio de PBE, mantém-se profilaxia antibiótica indefinida.","fonte":"AASLD Practice Guidance (Biggins SW et al., 2021); EASL decompensated cirrhosis (J Hepatol 2018)."},{"n":4,"sub":"Paracentese de grande volume","comp":"Repor albumina após a paracentese","tags":[],"rel":[],"enun":"Cirrótico com ascite tensa e dispneia é submetido a paracentese de alívio, com retirada de 7 litros. O que deve ser feito para prevenir disfunção circulatória pós-paracentese?","ops":[["Albumina 6 a 8 g por litro retirado (cerca de 42 a 56 g).","Correta: para paracenteses acima de 5 litros, repõem-se 6 a 8 g de albumina por litro retirado."],["Soro fisiológico 1 litro para cada litro retirado.","Errada: cristaloides são menos eficazes que a albumina para prevenir a disfunção circulatória."],["Nenhuma reposição, pois a paracentese é bem tolerada em qualquer volume.","Errada: acima de 5 litros, o risco de disfunção circulatória, hiponatremia e lesão renal justifica albumina."],["Furosemida intravenosa em dose alta logo após o procedimento.","Errada: a furosemida não previne e pode piorar a disfunção circulatória."]],"conc":"A paracentese de grande volume pode causar disfunção circulatória (ativação do sistema renina-angiotensina, hiponatremia, lesão renal). A albumina, acima de 5 litros retirados, previne essa complicação.","rac":"7 litros: acima de 5. Albumina 6 a 8 g por litro: 42 a 56 g, geralmente em 20% infundida durante ou após o procedimento.","pista":"Retirada maior que 5 litros.","mud":"Paracentese de até 5 litros não exigiria albumina, salvo em situações de risco.","cmp":"Paracentese diagnóstica: sem reposição. Grande volume: albumina.","arm":"Usar cristaloide em vez de albumina.","regra":"Mais de 5 litros: 6 a 8 g de albumina por litro.","cf":"Ascite refratária pode exigir paracenteses seriadas, TIPS ou transplante.","fonte":"AASLD Practice Guidance (Biggins SW et al., Hepatology 2021); EASL decompensated cirrhosis (2018)."},{"n":5,"sub":"Hemorragia varicosa aguda","comp":"Conduzir o sangramento por varizes de esôfago","tags":[],"rel":[],"enun":"Cirrótico com hematêmese volumosa, FC 118 bpm, PA 90/60 mmHg e hemoglobina 7,8 g/dL. Após acesso venoso, qual conjunto de medidas é recomendado?","ops":[["Vasoativo, ceftriaxona, transfusão restritiva e ligadura em até 12 horas.","Correta: o tratamento combina vasoativo, profilaxia antibiótica, transfusão restritiva e ligadura elástica precoce."],["Transfusão liberal até hemoglobina de 12 g/dL antes da EDA, para garantir reserva.","Errada: a transfusão liberal aumenta a pressão portal e o ressangramento; o alvo é hemoglobina de 7 a 8 g/dL."],["Betabloqueador intravenoso imediato para reduzir a pressão portal.","Errada: betabloqueador é contraindicado na fase aguda com hipotensão; usa-se depois, na profilaxia secundária."],["Cirurgia de derivação portossistêmica de urgência como primeira linha.","Errada: a cirurgia é exceção; o TIPS é a opção de resgate em falha do tratamento endoscópico."]],"conc":"A hemorragia varicosa é a complicação mais grave da hipertensão portal. Pilares: reanimação com transfusão restritiva, vasoativo esplâncnico, antibiótico profilático (reduz infecção, ressangramento e mortalidade) e EDA precoce com ligadura.","rac":"Instabilidade e sangramento em cirrótico: vasoativo já, ceftriaxona, transfusão com alvo de 7 a 8 g/dL, EDA com ligadura em até 12 horas. Em alto risco (Child C 10 a 13 ou B com sangramento ativo), considerar TIPS preemptivo.","pista":"Cirrótico com hemorragia digestiva alta.","mud":"Varizes gástricas fúndicas sangrantes poderiam exigir cianoacrilato ou TIPS.","cmp":"Fase aguda: vasoativo, antibiótico, ligadura. Profilaxia secundária: betabloqueador mais ligadura.","arm":"Transfundir de forma liberal o cirrótico com sangramento varicoso.","regra":"Sangramento varicoso: vasoativo, antibiótico, ligadura, sem exagerar no sangue.","cf":"O balão de Sengstaken-Blakemore é ponte temporária em sangramento refratário.","fonte":"Baveno VII (de Franchis R et al., J Hepatol 2022;76:959-974); AASLD Guidance on Portal Hypertension (Kaplan DE et al., Hepatology 2024)."},{"n":6,"sub":"Profilaxia primária","comp":"Prevenir o primeiro sangramento varicoso","tags":[],"rel":[],"enun":"Cirrótico compensado, Child A, sem sangramento prévio, realiza EDA que mostra varizes de esôfago de grosso calibre. PA 130/80 mmHg, FC 80 bpm. Qual é a profilaxia primária recomendada?","ops":[["Betabloqueador não seletivo ou ligadura elástica.","Correta: varizes de grosso calibre têm indicação de profilaxia primária com betabloqueador não seletivo ou ligadura; o carvedilol é preferido."],["Nenhuma profilaxia, pois o paciente nunca sangrou.","Errada: varizes de grosso calibre têm alto risco de sangramento e exigem profilaxia."],["Nitrato isolado em dose plena.","Errada: nitrato isolado não é recomendado para profilaxia primária."],["TIPS eletivo para todos os pacientes com varizes grandes.","Errada: o TIPS não é indicado na profilaxia primária."]],"conc":"A profilaxia primária previne o primeiro sangramento. Betabloqueador não seletivo (propranolol, nadolol ou carvedilol) ou ligadura elástica são opções; o Baveno VII favorece o carvedilol também para prevenir descompensação em pacientes com hipertensão portal clinicamente significativa.","rac":"Varizes de grosso calibre em cirrótico compensado: profilaxia. Sem contraindicações, carvedilol (ou propranolol); se intolerância ou contraindicação, ligadura.","pista":"Varizes de grosso calibre sem sangramento prévio.","mud":"Após um sangramento, a profilaxia secundária combina betabloqueador e ligadura.","cmp":"Primária: betabloqueador ou ligadura. Secundária: betabloqueador mais ligadura.","arm":"Achar que só se trata quem já sangrou.","regra":"Varizes grossas: carvedilol ou ligadura.","cf":"O betabloqueador deve ser reduzido ou suspenso em hipotensão grave, PBE com instabilidade ou lesão renal.","fonte":"Baveno VII (de Franchis R et al., J Hepatol 2022)."},{"n":7,"sub":"Encefalopatia hepática","comp":"Identificar o fator precipitante e tratar","tags":[],"rel":[],"enun":"Cirrótico, previamente orientado, chega sonolento, com asterixe e desorientação. Está há 4 dias sem evacuar e não tem febre. Potássio 3,1 mEq/L. Qual é a conduta inicial?","ops":[["Corrigir constipação e hipocalemia e iniciar lactulose.","Correta: na encefalopatia, busca-se e corrige-se o fator precipitante e usa-se lactulose como primeira linha."],["Restrição proteica rigorosa abaixo de 0,5 g/kg por dia.","Errada: a restrição proteica não é recomendada e piora a sarcopenia; a ingestão deve ser de 1,2 a 1,5 g/kg por dia."],["Benzodiazepínico para controlar a agitação.","Errada: benzodiazepínicos são precipitantes clássicos de encefalopatia."],["Dosar amônia sérica e só tratar se estiver elevada.","Errada: a amônia não é necessária para diagnosticar nem para guiar o tratamento; o diagnóstico é clínico."]],"conc":"A encefalopatia hepática é disfunção cerebral pela insuficiência hepática ou derivação portossistêmica. Precipitantes: infecções, sangramento digestivo, constipação, distúrbios hidroeletrolíticos, sedativos, diuréticos em excesso e lesão renal.","rac":"Sonolência e asterixe em cirrótico: encefalopatia. Precipitantes aqui: constipação e hipocalemia. Corrigir potássio, lactulose e investigar infecção e sangramento.","pista":"Constipação e hipocalemia em cirrótico com asterixe.","mud":"Febre ou dor abdominal levariam a paracentese diagnóstica para excluir PBE.","cmp":"Lactulose: primeira linha. Rifaximina: associada para prevenir recorrência.","arm":"Restringir proteína ou dosar amônia para decidir.","regra":"Encefalopatia: ache o gatilho e dê lactulose.","cf":"Após o primeiro episódio, mantém-se lactulose; em recorrência, associa-se rifaximina.","fonte":"AASLD/EASL Practice Guideline on Hepatic Encephalopathy (Vilstrup H et al., Hepatology 2014;60:715-735)."},{"n":8,"sub":"Síndrome hepatorrenal","comp":"Diagnosticar e tratar a SHR-LRA","tags":[],"rel":[],"enun":"Cirrótico com ascite tem creatinina de 1,1 para 2,4 mg/dL em 3 dias. Os diuréticos foram suspensos e foi feita albumina 1 g/kg por 2 dias, sem melhora. Não há choque, uso de nefrotóxicos, proteinúria significativa nem alteração renal na ultrassonografia. Qual é o tratamento?","ops":[["Terlipressina associada a albumina.","Correta: preenchidos os critérios de síndrome hepatorrenal com lesão renal aguda, o tratamento é terlipressina e albumina, com avaliação para transplante."],["Furosemida em dose alta.","Errada: diuréticos pioram a hipoperfusão renal na síndrome hepatorrenal."],["Cristaloide, 4 litros por dia.","Errada: a expansão já foi feita com albumina sem resposta; mais cristaloide piora a ascite e não corrige a vasodilatação."],["Hemodiálise como primeira linha.","Errada: a diálise é ponte para transplante em casos refratários, não a primeira linha."]],"conc":"A síndrome hepatorrenal é lesão renal funcional por vasodilatação esplâncnica e hipoperfusão renal em cirrose avançada. O diagnóstico exige exclusão de hipovolemia (sem resposta à albumina), choque, nefrotóxicos e doença renal estrutural.","rac":"Lesão renal aguda em cirrótico sem resposta à retirada de diuréticos e à albumina, sem causa estrutural: SHR-LRA. Terlipressina e albumina; noradrenalina é alternativa em terapia intensiva.","pista":"Ausência de resposta à expansão com albumina e exame renal normal.","mud":"Proteinúria acima de 500 mg/dia, hematúria ou rins alterados na ultrassonografia indicariam doença renal intrínseca.","cmp":"SHR: funcional, sem lesão estrutural. NTA: lesão estrutural, cilindros granulosos, FENa alta.","arm":"Insistir em cristaloide ou diurético.","regra":"SHR: terlipressina e albumina, e pense no transplante.","cf":"O transplante hepático é o tratamento definitivo.","fonte":"International Club of Ascites / ADQI consensus (Nadim MK et al., J Hepatol 2024); AASLD Practice Guidance (Biggins SW et al., 2021)."},{"n":9,"sub":"Rastreio de carcinoma hepatocelular","comp":"Programar a vigilância","tags":[],"rel":[],"enun":"Mulher de 60 anos com cirrose por hepatite C, curada com antiviral há 1 ano, Child A. Qual é a vigilância para carcinoma hepatocelular?","ops":[["Ultrassonografia a cada 6 meses, mesmo após a cura viral.","Correta: cirróticos mantêm risco de carcinoma hepatocelular após a cura do HCV e devem continuar a vigilância semestral."],["Não há mais vigilância, pois a cura do HCV elimina o risco de câncer.","Errada: o risco diminui, mas persiste na cirrose estabelecida."],["Tomografia de abdome a cada 12 meses.","Errada: o intervalo recomendado é semestral, e a ultrassonografia é o exame padrão."],["Alfafetoproteína isolada anual.","Errada: a alfafetoproteína isolada tem baixa sensibilidade e não substitui a ultrassonografia."]],"conc":"Pacientes com cirrose de qualquer causa e alguns grupos com hepatite B sem cirrose devem fazer vigilância de carcinoma hepatocelular com ultrassonografia a cada 6 meses, com ou sem alfafetoproteína.","rac":"Cirrose estabelecida: vigilância semestral por toda a vida, independentemente da cura do HCV.","pista":"Cirrose mantida após a cura viral.","mud":"Nódulo acima de 1 cm na ultrassonografia levaria a tomografia ou ressonância multifásica (LI-RADS).","cmp":"Vigilância: ultrassonografia semestral. Diagnóstico de nódulo: tomografia ou ressonância trifásica.","arm":"Suspender a vigilância após a resposta virológica sustentada.","regra":"Cirrose: ultrassonografia a cada 6 meses, sempre.","cf":"O carcinoma hepatocelular pode ser diagnosticado por imagem típica (realce arterial com washout), sem biópsia, na cirrose.","fonte":"AASLD Practice Guidance on HCC (Singal AG et al., Hepatology 2023;78:1922-1965)."},{"n":10,"sub":"Ascite: tratamento inicial","comp":"Prescrever o manejo da ascite não complicada","tags":[],"rel":[],"enun":"Cirrótico com primeiro episódio de ascite moderada, sem PBE, creatinina e sódio normais. Qual é o tratamento inicial?","ops":[["Restrição de sódio e espironolactona, com furosemida se necessário.","Correta: dieta hipossódica moderada e espironolactona (com ou sem furosemida, na proporção 100:40) são a base do tratamento."],["Restrição hídrica rigorosa para 800 mL por dia.","Errada: a restrição hídrica só é indicada na hiponatremia grave (sódio abaixo de 125 mEq/L)."],["Furosemida isolada em dose alta, sem espironolactona.","Errada: o mecanismo é o hiperaldosteronismo secundário; a espironolactona é o diurético principal."],["Dieta com restrição total de sódio e de proteínas.","Errada: restrição extrema de sódio reduz a ingestão alimentar, e restrição proteica piora a desnutrição."]],"conc":"Na cirrose, a vasodilatação esplâncnica ativa o sistema renina-angiotensina-aldosterona, retendo sódio. Por isso, a base do tratamento é restrição moderada de sódio e antagonista da aldosterona.","rac":"Ascite moderada sem complicações: sódio cerca de 2 g por dia, espironolactona 100 mg (até 400) com ou sem furosemida 40 mg (até 160). Monitorar peso, sódio, potássio e creatinina.","pista":"Primeiro episódio de ascite com eletrólitos normais.","mud":"Hiponatremia abaixo de 125 mEq/L justificaria restrição hídrica e ajuste dos diuréticos.","cmp":"Espironolactona: base. Furosemida: complemento na proporção 100:40.","arm":"Restringir líquidos sem hiponatremia.","regra":"Ascite: pouco sal e espironolactona.","cf":"Ascite refratária é a que não responde a diuréticos em dose máxima ou recidiva rapidamente; conduz-se com paracenteses seriadas ou TIPS.","fonte":"AASLD Practice Guidance (Biggins SW et al., Hepatology 2021); EASL decompensated cirrhosis (2018)."}]},{"id":"M12","titulo":"Pancreatite","bloco":1,"q":[{"n":1,"sub":"Critérios diagnósticos","comp":"Aplicar os critérios de Atlanta revisados","tags":[],"rel":[],"enun":"Mulher de 48 anos com dor epigástrica intensa irradiada para o dorso há 8 horas e vômitos. Lipase 1.900 U/L (limite 60). Ultrassonografia com colelitíase. Qual é a conclusão sobre a necessidade de tomografia para o diagnóstico?","ops":[["O diagnóstico já está firmado; a tomografia não é necessária agora.","Correta: dois dos três critérios (dor típica, enzimas acima de 3 vezes, imagem) bastam; a TC fica para dúvida diagnóstica ou falta de melhora após 72 horas."],["A tomografia com contraste é obrigatória na admissão para confirmar o diagnóstico e definir a gravidade.","Errada: a TC precoce não muda a conduta e pode subestimar a necrose, que se define após 72 horas."],["O diagnóstico exige amilase também elevada acima de 3 vezes.","Errada: lipase ou amilase acima de 3 vezes bastam; a lipase é mais sensível e específica."],["O diagnóstico só é confirmado com ressonância de abdome mostrando edema pancreático.","Errada: a imagem é apenas um dos três critérios e não é necessária quando os outros dois estão presentes."]],"conc":"Atlanta revisado: pancreatite aguda com dois de três critérios: dor abdominal típica, lipase ou amilase acima de 3 vezes o limite superior e achados de imagem característicos.","rac":"Dor típica mais lipase acima de 3 vezes: diagnóstico. Ultrassonografia para etiologia biliar. TC com contraste só em dúvida diagnóstica ou piora clínica após 72 a 96 horas.","pista":"Dois critérios presentes sem necessidade do terceiro.","mud":"Dor atípica com lipase pouco elevada exigiria TC para confirmar o diagnóstico e excluir outras causas de abdome agudo.","cmp":"Ultrassonografia: etiologia (cálculos). TC: dúvida diagnóstica e complicações após 72 horas.","arm":"Pedir TC para todos na admissão.","regra":"Dor típica e lipase acima de 3 vezes: pancreatite confirmada.","cf":"A magnitude da lipase não se correlaciona com a gravidade.","fonte":"Banks PA et al. Classification of acute pancreatitis 2012: revision of the Atlanta classification. Gut 2013;62:102-111; ACG Guideline (Tenner S et al., Am J Gastroenterol 2024)."},{"n":2,"sub":"Etiologia","comp":"Investigar a causa da pancreatite","tags":[],"rel":[],"enun":"Homem de 50 anos com primeiro episódio de pancreatite aguda. Nega etilismo. Qual exame deve ser feito em todos os pacientes na admissão para investigar a causa mais comum?","ops":[["Ultrassonografia de abdome para pesquisar colelitíase.","Correta: a litíase biliar é a causa mais comum de pancreatite aguda, e a ultrassonografia deve ser feita em todos na admissão."],["Colangiopancreatografia retrógrada endoscópica diagnóstica.","Errada: a CPRE é terapêutica e reservada a colangite ou obstrução biliar persistente, não à investigação inicial."],["Ecoendoscopia de rotina no primeiro dia.","Errada: a ecoendoscopia é útil em pancreatite idiopática recorrente ou suspeita de microlitíase, não na admissão."],["Dosagem de IgG4 sérica como primeiro exame.","Errada: a pancreatite autoimune é causa rara; IgG4 não é exame inicial."]],"conc":"As principais causas de pancreatite aguda são litíase biliar e álcool, seguidas de hipertrigliceridemia, pós-CPRE, fármacos, hipercalcemia, trauma e causas genéticas e autoimunes.","rac":"Toda pancreatite: ultrassonografia na admissão. Também dosar triglicerídeos e cálcio. Na ausência de causa, investigar com ecoendoscopia ou colangiorressonância após a fase aguda.","pista":"Ausência de etilismo em primeiro episódio.","mud":"Triglicerídeos acima de 1.000 mg/dL indicariam hipertrigliceridemia como causa.","cmp":"Biliar: mais comum, ultrassonografia. Alcoólica: história. Hipertrigliceridemia: acima de 1.000 mg/dL.","arm":"Pular a ultrassonografia por ter pedido TC.","regra":"Pancreatite: ultrassonografia em todos, procure o cálculo.","cf":"Elevação de ALT acima de 150 U/L nas primeiras 48 horas sugere fortemente etiologia biliar.","fonte":"ACG Guideline: Management of Acute Pancreatitis (Tenner S et al., Am J Gastroenterol 2024;119:419-437)."},{"n":3,"sub":"Gravidade","comp":"Classificar a gravidade pela falência orgânica","tags":[],"rel":[],"enun":"Paciente com pancreatite aguda evolui com creatinina de 2,3 mg/dL e PaO2/FiO2 de 250 que persistem por 4 dias, apesar do tratamento. Qual é a classificação de gravidade segundo Atlanta revisado?","ops":[["Grave, por falência orgânica persistente por mais de 48 horas.","Correta: falência orgânica que persiste além de 48 horas define a forma grave."],["Pancreatite moderadamente grave, por haver falência de dois órgãos.","Errada: a moderadamente grave tem falência orgânica transitória (menos de 48 horas) ou complicações locais sem falência persistente."],["Pancreatite leve, pois não há necrose descrita.","Errada: a leve não tem falência orgânica nem complicações; a necrose não é o critério principal de gravidade."],["Pancreatite crítica, que exige necrose infectada.","Errada: a classificação de Atlanta revisada usa leve, moderadamente grave e grave."]],"conc":"Atlanta revisado: leve (sem falência orgânica e sem complicações), moderadamente grave (falência transitória, menos de 48 horas, ou complicações locais ou sistêmicas) e grave (falência orgânica persistente por mais de 48 horas). Falência é avaliada pelo escore de Marshall modificado.","rac":"Creatinina acima de 1,9 e PaO2/FiO2 abaixo de 300 são falências renal e respiratória. Persistiram por 4 dias: forma grave.","pista":"Duração da falência orgânica maior que 48 horas.","mud":"Falência que se resolvesse em 24 horas com hidratação seria forma moderadamente grave.","cmp":"Transitória: até 48 horas. Persistente: mais de 48 horas.","arm":"Usar a necrose na TC como único critério de gravidade.","regra":"Falência orgânica por mais de 48 horas: pancreatite grave.","cf":"Os escores BISAP e SIRS persistente ajudam a prever gravidade nas primeiras 24 horas.","fonte":"Banks PA et al. Revised Atlanta classification. Gut 2013."},{"n":4,"sub":"Hidratação","comp":"Prescrever reposição volêmica","tags":[],"rel":[],"enun":"Paciente com pancreatite aguda biliar, sem falência orgânica, PA 120/75 mmHg, FC 105 bpm, levemente desidratado. Qual estratégia de hidratação é a mais adequada?","ops":[["Ringer lactato em ritmo moderado, guiado por metas e reavaliado com frequência.","Correta: a hidratação moderada guiada por metas, preferencialmente com Ringer lactato, é recomendada; a agressiva aumenta sobrecarga sem melhorar desfechos."],["Hidratação agressiva de 20 mL/kg em bolus seguida de 3 mL/kg/h fixos por 48 horas para todos.","Errada: o estudo WATERFALL mostrou mais sobrecarga de volume com hidratação agressiva, sem benefício."],["Restrição hídrica para evitar edema pancreático.","Errada: a hipovolemia piora a perfusão pancreática e o prognóstico."],["Soro glicosado 5% isolado como solução de escolha.","Errada: solução sem sódio não corrige a hipovolemia e favorece hiponatremia."]],"conc":"A hidratação é a base do tratamento inicial. O estudo WATERFALL (2022) comparou hidratação agressiva e moderada com Ringer lactato e encerrou precocemente por mais sobrecarga hídrica no braço agressivo, sem melhora de desfechos.","rac":"Sem falência e levemente desidratado: Ringer lactato moderado (por exemplo, 1,5 mL/kg/h, com bolus de 10 mL/kg se hipovolêmico), ajustado por FC, diurese, hematócrito e ureia.","pista":"Paciente sem falência orgânica, com hipovolemia leve.","mud":"Choque exigiria reposiç
