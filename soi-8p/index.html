<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulado SOI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: coluna única de leitura (máx. 760px), barra fixa de progresso no simulado, cartões só para a questão e a correção */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14232B; --muted:#56666E; --line:#D3DDE1;
  --accent:#1C5A72; --accent-ink:#FFFFFF; --accent-soft:#E0EDF2;
  --ok:#276E49; --ok-soft:#E2F1E8; --bad:#A33C2B; --bad-soft:#F8E5E0; --warn:#8A5D0B; --warn-soft:#F7EED9;
  --display:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161A; --surface:#15212A; --ink:#E2EBEE; --muted:#93A4AC; --line:#2A3A44;
  --accent:#72B6CF; --accent-ink:#0B1A20; --accent-soft:#17323D;
  --ok:#6CC293; --ok-soft:#16312A; --bad:#EC8C79; --bad-soft:#3B201B; --warn:#E2B657; --warn-soft:#352A12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.3rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile strong{font-size:1.02rem}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.stat b{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hero{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--muted)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.checks input{margin-top:4px;width:18px;height:18px;flex:none}
.bloco{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
/* topo do simulado */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:40vh;overflow:auto;padding:2px}
.nb{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.85rem;position:relative}
.nb.ans{background:var(--accent-soft);border-color:var(--accent)}
.nb.cur{outline:2px solid var(--ink)}
.nb.ok{background:var(--ok-soft);border-color:var(--ok)}
.nb.bad{background:var(--bad-soft);border-color:var(--bad)}
.nb.mk::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.enun{font-size:1.06rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:48px}
.opt .L{font-family:var(--mono);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .tag{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.opt[disabled]{cursor:default}
.conf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.banner{padding:12px 14px;border-radius:8px;font-weight:600}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.blank{background:var(--warn-soft);color:var(--warn)}
.aula{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.aula dl{margin:0;display:flex;flex-direction:column;gap:10px}
.aula dt{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.aula dd{margin:2px 0 0}
.alts{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.alts li{display:grid;grid-template-columns:28px 1fr;gap:8px}
.alts li b{font-family:var(--mono)}
.gold{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-weight:600}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img,figure canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figcaption{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.notice{padding:10px 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:8px;font-size:.9rem}
.confirmbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:.78rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;min-height:32px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div class="sr" id="live" aria-live="assertive"></div>
<script>
document.documentElement.lang='pt-BR';
const DATA={"aulas":[{"id":"M01","titulo":"DRGE","bloco":1,"q":[{"n":1,"sub":"Sintomas típicos sem alarme","comp":"Indicar teste terapêutico com IBP sem endoscopia","tags":[],"rel":[],"enun":"Mulher de 34 anos relata pirose retroesternal e regurgitação ácida pós-prandial há 3 meses, cerca de três vezes por semana. Nega disfagia, odinofagia, perda de peso, vômitos ou sangramento. Exame físico normal, IMC 27 kg/m². Qual é a conduta inicial mais adequada?","ops":[["IBP em dose padrão antes do café da manhã por 8 semanas, com medidas comportamentais.","Correta: sintomas típicos sem sinais de alarme permitem teste terapêutico empírico com IBP por 8 semanas, sem exames prévios."],["Solicitar endoscopia digestiva alta antes de iniciar qualquer tratamento medicamentoso.","Errada: a EDA inicial é reservada a sinais de alarme, falha do IBP ou fatores de risco para Barrett; não é obrigatória aqui."],["Solicitar pHmetria de 24 horas para confirmar o refluxo antes de prescrever IBP.","Errada: a pHmetria é usada em sintomas refratários com EDA normal ou antes de cirurgia, não na abordagem inicial."],["Prescrever procinético isolado por 4 semanas e reavaliar a necessidade de IBP depois.","Errada: procinéticos não são terapia de primeira linha na DRGE; o IBP é o fármaco mais eficaz para cicatrizar e aliviar sintomas."]],"conc":"Pirose e regurgitação são os sintomas típicos da DRGE. Na ausência de sinais de alarme, o diagnóstico clínico presuntivo autoriza um teste terapêutico com IBP em dose padrão por 8 semanas.","rac":"Identifique sintomas típicos (pirose e regurgitação). Procure sinais de alarme: não há. Logo, não há indicação de EDA inicial; inicia-se IBP 30 a 60 minutos antes do café da manhã por 8 semanas e reavalia-se a resposta.","pista":"Ausência de disfagia, perda de peso, sangramento e vômitos em paciente jovem com sintomas típicos.","mud":"Disfagia, perda ponderal, anemia, hemorragia digestiva, vômitos persistentes ou massa palpável mudariam a conduta para EDA antes de qualquer tratamento.","cmp":"Sintomas típicos sem alarme: IBP empírico. Sinais de alarme ou falha terapêutica: EDA.","arm":"Solicitar EDA para todo paciente com pirose, gerando custo e atraso sem mudar a conduta.","regra":"DRGE típica sem alarme: teste com IBP por 8 semanas antes de investigar.","cf":"Se a paciente melhora com o IBP, tenta-se a menor dose eficaz ou o uso sob demanda; se não melhora, segue para EDA.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., Am J Gastroenterol 2022;117:27-56)."},{"n":2,"sub":"Sinais de alarme","comp":"Reconhecer indicação de endoscopia na DRGE","tags":[],"rel":[],"enun":"Homem de 61 anos, tabagista, com pirose há 10 anos, relata que nos últimos 2 meses passou a ter dificuldade para engolir alimentos sólidos e perdeu 6 kg sem intenção. Qual é a próxima etapa?","ops":[["Realizar endoscopia digestiva alta com biópsias antes de definir o tratamento.","Correta: disfagia progressiva e perda de peso são sinais de alarme que exigem EDA para excluir estenose, Barrett e neoplasia."],["Iniciar IBP em dose dobrada por 8 semanas e realizar endoscopia só se não houver melhora.","Errada: com sinais de alarme, o teste terapêutico atrasa o diagnóstico de possível neoplasia; a EDA vem primeiro."],["Solicitar esofagografia baritada como exame inicial e suficiente para o diagnóstico.","Errada: o esofagograma pode complementar, mas não permite biópsia e não substitui a EDA."],["Solicitar manometria esofágica para investigar distúrbio motor como causa da disfagia.","Errada: a manometria só é considerada após EDA normal, para excluir causa estrutural primeiro."]],"conc":"Sinais de alarme na dispepsia e na DRGE incluem disfagia, odinofagia, perda ponderal, anemia, sangramento digestivo, vômitos persistentes e massa abdominal. Na presença deles, a EDA é obrigatória antes do tratamento empírico.","rac":"O paciente tem DRGE de longa data (fator de risco para Barrett e adenocarcinoma), é tabagista, tem mais de 50 anos e desenvolveu disfagia progressiva com emagrecimento. A hipótese de estenose péptica ou adenocarcinoma exige EDA com biópsias.","pista":"Disfagia para sólidos de instalação recente associada à perda de peso não intencional.","mud":"Sem disfagia e sem perda de peso, num paciente jovem, seria aceitável o teste terapêutico com IBP.","cmp":"Estenose péptica: disfagia lenta, peso mantido, longa história de pirose. Neoplasia: disfagia rápida e progressiva, emagrecimento.","arm":"Tratar a disfagia como 'piora do refluxo' e dobrar o IBP sem investigar.","regra":"Sinal de alarme: endoscopia primeiro, tratamento depois.","cf":"Em homem branco acima de 50 anos com DRGE crônica e obesidade central, mesmo sem alarme, considera-se EDA para rastrear esôfago de Barrett.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022); ACG Guideline Barrett's Esophagus (Shaheen NJ et al., Am J Gastroenterol 2022)."},{"n":3,"sub":"Consenso de Lyon 2.0","comp":"Identificar o achado endoscópico conclusivo de DRGE","tags":[],"rel":[],"enun":"Paciente de 45 anos com pirose refratária realiza EDA sem uso de IBP. Segundo o Consenso de Lyon 2.0, qual achado isolado é considerado evidência conclusiva de DRGE?","ops":[["Esofagite erosiva de Los Angeles grau B.","Correta: no Lyon 2.0, esofagite LA B, C ou D, Barrett com segmento longo e estenose péptica são evidência conclusiva de DRGE."],["Esofagite erosiva de Los Angeles grau A.","Errada: LA A é considerada achado limítrofe ou inconclusivo, exigindo complementação com pHmetria."],["Hérnia hiatal por deslizamento de 3 cm.","Errada: hérnia hiatal é achado de suporte, mas isoladamente não confirma DRGE."],["Tempo de exposição ácida de 5% na pHmetria.","Errada: TEA entre 4% e 6% é zona inconclusiva; conclusivo é acima de 6%."]],"conc":"O Consenso de Lyon 2.0 classifica as evidências de DRGE em conclusivas (LA B, C ou D; Barrett de segmento longo; estenose péptica; TEA acima de 6%), limítrofes (LA A; TEA de 4% a 6%) e excludentes (TEA abaixo de 4%).","rac":"Pergunte-se: o achado, sozinho, encerra o diagnóstico? LA B sim. LA A e TEA de 5% estão na zona cinzenta. Hérnia hiatal só aumenta a probabilidade.","pista":"A mudança do Lyon 2.0 foi justamente incluir LA B como conclusivo (antes só C e D).","mud":"Se o paciente estivesse em uso de IBP, uma EDA normal não excluiria DRGE; o ideal é suspender o IBP por 2 a 4 semanas antes da EDA diagnóstica.","cmp":"Conclusivo: LA B, C, D, Barrett longo, estenose, TEA acima de 6%. Inconclusivo: LA A, TEA 4% a 6%. Normal: TEA abaixo de 4%.","arm":"Memorizar a versão antiga do consenso, em que LA B ainda era limítrofe.","regra":"Lyon 2.0: LA B já fecha DRGE; LA A não.","cf":"Se a EDA mostrar LA A e o paciente seguir sintomático, a próxima etapa é pHmetria prolongada sem IBP.","fonte":"Gyawali CP et al. Updates to the modern diagnosis of GERD: Lyon consensus 2.0. Gut 2024;73:361-371."},{"n":4,"sub":"pHmetria antes da cirurgia","comp":"Indicar a monitorização ambulatorial do pH","tags":[],"rel":[],"enun":"Homem de 39 anos com pirose e regurgitação há 2 anos responde apenas parcialmente ao IBP e deseja cirurgia antirrefluxo. A EDA, feita sem IBP, foi normal. Qual exame deve ser realizado para confirmar a DRGE antes de indicar a fundoplicatura?","ops":[["pHmetria prolongada (ou pH-impedanciometria) com o IBP suspenso.","Correta: com EDA normal, a DRGE precisa ser objetivamente confirmada por monitorização do pH sem IBP antes da cirurgia."],["pH-impedanciometria em uso de IBP em dose dobrada, para avaliar refluxo não ácido.","Errada: o exame em uso de IBP serve para investigar sintomas refratários em DRGE já comprovada, não para confirmar o diagnóstico."],["Nova EDA com biópsias aleatórias do esôfago distal para pesquisar esofagite microscópica.","Errada: biópsias do esôfago distal não confirmam DRGE e não são recomendadas com esse objetivo."],["Esofagografia baritada com manobras de Valsalva para demonstrar o refluxo.","Errada: demonstrar refluxo no esofagograma não tem sensibilidade nem especificidade para diagnosticar DRGE."]],"conc":"A DRGE sem esofagite (doença não erosiva) só é comprovada pela monitorização do pH. Antes de qualquer cirurgia antirrefluxo ou em sintomas atípicos, é necessário prova objetiva.","rac":"EDA normal não exclui DRGE. Como a cirurgia é irreversível, é preciso documentar exposição ácida patológica (TEA acima de 6%) com o IBP suspenso por cerca de 7 dias.","pista":"EDA normal e desejo de cirurgia: o diagnóstico ainda não está comprovado.","mud":"Se a EDA tivesse mostrado esofagite LA C, a DRGE estaria confirmada e a pHmetria não seria necessária para o diagnóstico.","cmp":"pHmetria sem IBP: confirmar DRGE. pH-impedanciometria com IBP: investigar refratariedade em DRGE comprovada.","arm":"Indicar fundoplicatura com base apenas nos sintomas e na resposta parcial ao IBP.","regra":"Antes de operar refluxo, comprove-o.","cf":"Também antes da cirurgia é obrigatória a manometria esofágica, para excluir acalasia e aperistalse.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022); Lyon consensus 2.0 (Gyawali CP et al., Gut 2024)."},{"n":5,"sub":"Esôfago de Barrett","comp":"Definir o intervalo de vigilância sem displasia","tags":[],"rel":[],"enun":"Homem de 56 anos com DRGE crônica realizou EDA que mostrou epitélio colunar estendendo-se 4 cm acima da junção esofagogástrica. As biópsias confirmaram metaplasia intestinal sem displasia. Além de manter IBP, qual é a conduta?","ops":[["Repetir a EDA com biópsias em 3 anos.","Correta: Barrett sem displasia com segmento de 3 cm ou mais tem vigilância endoscópica a cada 3 anos (segmento menor que 3 cm: a cada 5 anos)."],["Repetir a EDA com biópsias em 6 meses.","Errada: intervalos curtos se aplicam à displasia indefinida ou de baixo grau após otimização do IBP, não ao Barrett sem displasia."],["Indicar ablação endoscópica por radiofrequência imediatamente.","Errada: a erradicação endoscópica é indicada para displasia de baixo ou alto grau, não para Barrett sem displasia."],["Encerrar o seguimento, pois a ausência de displasia exclui risco de câncer.","Errada: Barrett é lesão pré-maligna para adenocarcinoma de esôfago, mesmo sem displasia; exige vigilância."]],"conc":"Esôfago de Barrett é a substituição do epitélio escamoso por epitélio colunar com metaplasia intestinal, estendendo-se ao menos 1 cm acima da junção esofagogástrica. É precursor do adenocarcinoma de esôfago.","rac":"Confirme o diagnóstico (≥1 cm com metaplasia intestinal). Avalie displasia: ausente. Avalie a extensão: 4 cm (segmento longo). Vigilância em 3 anos, com IBP contínuo.","pista":"Ausência de displasia na histologia e extensão maior ou igual a 3 cm.","mud":"Displasia de baixo grau confirmada por dois patologistas levaria a terapia endoscópica ou vigilância em 12 meses; alto grau ou carcinoma intramucoso, a ressecção e ablação endoscópicas.","cmp":"Sem displasia: vigilância (3 ou 5 anos). Displasia: erradicação endoscópica.","arm":"Indicar ablação para todo Barrett ou, ao contrário, dispensar seguimento por ausência de displasia.","regra":"Barrett sem displasia: vigiar; com displasia: tratar endoscopicamente.","cf":"Um Barrett de 2 cm sem displasia seria acompanhado com EDA a cada 5 anos.","fonte":"ACG Clinical Guideline: Diagnosis and Management of Barrett's Esophagus (Shaheen NJ et al., Am J Gastroenterol 2022;117:559-587)."},{"n":6,"sub":"Uso correto do IBP","comp":"Identificar falha por uso inadequado do IBP","tags":[],"rel":[],"enun":"Mulher de 42 anos com diagnóstico clínico de DRGE refere melhora apenas parcial após 6 semanas de omeprazol 20 mg, que toma à noite, logo após o jantar. Qual é a conduta mais adequada?","ops":[["Orientar a tomada do omeprazol 30 a 60 minutos antes do café da manhã.","Correta: o IBP age melhor quando tomado antes da primeira refeição, momento em que há mais bombas de prótons ativadas; corrigir o horário vem antes de aumentar a dose."],["Trocar o omeprazol por ranitidina, pois o IBP não foi eficaz.","Errada: antagonistas H2 são menos eficazes que o IBP; além disso, a falha se deve ao uso incorreto, não ao fármaco."],["Dobrar a dose para 40 mg à noite e manter o horário atual.","Errada: antes de dobrar a dose, deve-se corrigir o horário e a adesão, que são as causas mais comuns de resposta parcial."],["Indicar fundoplicatura laparoscópica por refratariedade clínica ao IBP.","Errada: não há refratariedade verdadeira; o tratamento ainda não foi otimizado e a DRGE nem foi comprovada objetivamente."]],"conc":"Os IBP inibem apenas bombas de prótons ativas. Por isso devem ser tomados 30 a 60 minutos antes do café da manhã (ou antes do jantar na segunda dose). Uso após refeições ou ao deitar reduz o efeito.","rac":"Diante de resposta parcial, a sequência é: verificar adesão e horário, otimizar a tomada, depois considerar dose dobrada (antes do café e antes do jantar) e, por fim, investigar com EDA e pHmetria.","pista":"A paciente toma o IBP após o jantar, longe do momento ideal.","mud":"Se o horário já estivesse correto e a adesão fosse boa, a próxima etapa seria dose dobrada ou investigação com EDA.","cmp":"IBP: antes da primeira refeição. Antagonista H2: pode ser usado ao deitar para sintomas noturnos, com menor eficácia.","arm":"Classificar como refratário um paciente que usa o IBP no horário errado.","regra":"Antes de aumentar o IBP, corrija o horário e a adesão.","cf":"Em sintomas noturnos persistentes apesar do IBP correto, elevar a cabeceira e evitar refeições 2 a 3 horas antes de deitar são medidas com evidência.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022)."},{"n":7,"sub":"Medidas comportamentais","comp":"Reconhecer as medidas com evidência de benefício","tags":[],"rel":[],"enun":"Homem de 50 anos, IMC 31 kg/m², com DRGE confirmada e sintomas predominantemente noturnos, que pioram ao deitar logo após o jantar. Quais medidas não farmacológicas têm melhor respaldo para esse paciente?","ops":[["Perda de peso, elevação da cabeceira da cama e evitar refeições 2 a 3 horas antes de deitar.","Correta: são as medidas com evidência de benefício, especialmente para obesos e para sintomas noturnos."],["Exclusão definitiva de café, chocolate, frutas cítricas e alimentos condimentados para todos os pacientes.","Errada: restrições alimentares universais não são recomendadas; só se excluem alimentos que comprovadamente desencadeiam sintomas no próprio paciente."],["Ingestão de leite à noite para tamponar o ácido e dieta líquida por 30 dias.","Errada: o leite tem efeito tampão transitório e pode estimular secreção ácida; dieta líquida não tem respaldo."],["Fracionar as refeições em oito por dia e deitar-se após cada uma para favorecer a digestão.","Errada: deitar após comer piora o refluxo; não há benefício em oito refeições diárias."]],"conc":"Entre as medidas comportamentais, as de maior evidência são a perda de peso em pacientes com sobrepeso ou obesidade, a elevação da cabeceira e evitar deitar até 2 a 3 horas após as refeições, nos sintomas noturnos. A cessação do tabagismo e do álcool também é recomendada.","rac":"Relacione cada sintoma a uma medida: obesidade, perda de peso; sintoma noturno, cabeceira elevada; piora ao deitar após jantar, antecipar o jantar.","pista":"Sintomas noturnos que pioram ao deitar logo após o jantar, em paciente obeso.","mud":"Se o paciente referisse piora claramente ligada a um alimento específico, a exclusão daquele item seria razoável.","cmp":"Medidas individualizadas (gatilhos do paciente) versus restrições genéricas (sem evidência).","arm":"Prescrever longas listas de restrições alimentares, que reduzem a adesão e pouco beneficiam.","regra":"Perder peso, elevar a cabeceira e não deitar de estômago cheio.","cf":"Na gestante com pirose, essas mesmas medidas, associadas a antiácidos ou alginatos, são a primeira linha.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022)."},{"n":8,"sub":"Estenose péptica","comp":"Reconhecer complicação da DRGE crônica","tags":[],"rel":[],"enun":"Mulher de 68 anos, com pirose há mais de 20 anos tratada de forma irregular, relata disfagia lenta e progressiva para sólidos há 1 ano, com peso estável. A EDA mostra estreitamento regular e liso no esôfago distal, com mucosa erosada, e as biópsias não mostram malignidade. Qual é a conduta?","ops":[["Dilatação endoscópica da estenose associada a IBP de manutenção.","Correta: a estenose péptica benigna é tratada com dilatação endoscópica e IBP contínuo, que reduz a recidiva."],["Esofagectomia distal, pela possibilidade de transformação maligna da estenose.","Errada: a estenose péptica benigna não tem indicação de esofagectomia; o tratamento é endoscópico."],["IBP isolado por 8 semanas, sem procedimento, pois a estenose regride com a cicatrização.","Errada: o IBP previne recidiva, mas a estenose fibrótica sintomática geralmente exige dilatação."],["Toxina botulínica no esfíncter esofágico inferior para reduzir a disfagia.","Errada: toxina botulínica é opção na acalasia, não na estenose péptica."]],"conc":"A estenose péptica decorre da cicatrização fibrótica da esofagite crônica. Manifesta-se com disfagia lenta e progressiva para sólidos, geralmente sem perda de peso importante.","rac":"Disfagia lenta, peso estável, longa história de pirose e estenose lisa com biópsia benigna caracterizam estenose péptica. O tratamento é dilatação e IBP de manutenção.","pista":"Estreitamento liso e regular com biópsia negativa para malignidade.","mud":"Emagrecimento rápido e estenose irregular, friável, levariam a repetir biópsias e a suspeitar de adenocarcinoma.","cmp":"Estenose péptica: lisa, distal, benigna, dilatação. Neoplasia: irregular, progressão rápida, emagrecimento.","arm":"Confundir a disfagia da estenose com acalasia ou indicar cirurgia para uma lesão benigna.","regra":"Estenose péptica: dilatar e manter IBP.","cf":"Disfagia súbita com impactação alimentar em jovem atópico com anéis esofágicos sugere esofagite eosinofílica, não estenose péptica.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022)."},{"n":9,"sub":"Manometria pré-operatória","comp":"Indicar exame obrigatório antes da fundoplicatura","tags":[],"rel":[],"enun":"Paciente de 44 anos com DRGE confirmada por pHmetria (TEA 9%) e regurgitação volumosa, apesar do IBP, será submetido a fundoplicatura laparoscópica. Qual exame deve ser feito antes da cirurgia para excluir um distúrbio motor que contraindica a técnica?","ops":[["Manometria esofágica de alta resolução.","Correta: a manometria exclui acalasia e aperistalse, que contraindicam ou modificam a fundoplicatura."],["Tomografia de tórax e abdome com contraste.","Errada: a TC não avalia a motilidade esofágica e não é exigida rotineiramente antes da fundoplicatura."],["Cintilografia de esvaziamento esofágico.","Errada: é exame de pouca utilidade prática; o padrão para motilidade é a manometria de alta resolução."],["Teste respiratório com ureia marcada para H. pylori.","Errada: o H. pylori não interfere na indicação nem na técnica da fundoplicatura."]],"conc":"A fundoplicatura cria uma barreira antirrefluxo. Em pacientes com acalasia ou aperistalse, ela pode causar disfagia grave. Por isso a manometria é obrigatória antes da cirurgia.","rac":"DRGE já está comprovada (TEA acima de 6%). O passo que falta é garantir que o esôfago tenha peristalse adequada para vencer a válvula: manometria de alta resolução.","pista":"Cirurgia programada e necessidade de excluir distúrbio motor.","mud":"Se a manometria mostrasse acalasia, a 'DRGE' seria provavelmente estase e fermentação, e a conduta mudaria para miotomia ou dilatação.","cmp":"pHmetria: prova o refluxo. Manometria: avalia a bomba esofágica e o esfíncter.","arm":"Esquecer a manometria e operar um paciente com acalasia diagnosticada como refluxo.","regra":"Antes da fundoplicatura: refluxo comprovado e manometria normal.","cf":"Em paciente com regurgitação refratária e obesidade grave, o bypass gástrico em Y de Roux é preferível à fundoplicatura.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., 2022); SAGES Guidelines for the surgical treatment of GERD (Slater BJ et al., Surg Endosc 2021)."},{"n":10,"sub":"DRGE extraesofágica","comp":"Conduzir sintomas atípicos isolados","tags":[],"rel":[],"enun":"Homem de 47 anos, não tabagista, com tosse crônica há 6 meses. Radiografia de tórax e espirometria normais, sem uso de IECA e sem sinais de rinossinusite. Nega pirose e regurgitação. Qual é a orientação mais adequada em relação à DRGE?","ops":[["Sem sintomas típicos, investigar o refluxo objetivamente antes de iniciar IBP.","Correta: sem pirose ou regurgitação, a resposta empírica ao IBP é pobre; a diretriz sugere testar o refluxo antes do tratamento."],["Iniciar IBP em dose dobrada por 12 meses, pois a DRGE é a causa mais provável da tosse.","Errada: o uso prolongado de IBP sem confirmação expõe a efeitos adversos sem garantia de benefício."],["Descartar DRGE como causa, pois a ausência de pirose exclui o diagnóstico.","Errada: manifestações extraesofágicas podem ocorrer sem sintomas típicos; a ausência de pirose não exclui DRGE."],["Indicar fundoplicatura, pois manifestações extraesofágicas respondem melhor à cirurgia.","Errada: a cirurgia exige DRGE comprovada e não tem melhor resposta nas manifestações extraesofágicas."]],"conc":"Tosse crônica, laringite, rouquidão e asma podem estar associadas à DRGE (manifestações extraesofágicas). Quando aparecem sem sintomas típicos, a probabilidade de resposta ao IBP é baixa.","rac":"Excluídas as causas mais comuns de tosse crônica, e sem pirose ou regurgitação, o melhor é investigar objetivamente (pHmetria) antes de expor o paciente a IBP prolongado.","pista":"Tosse isolada sem pirose ou regurgitação.","mud":"Se houvesse pirose e regurgitação associadas, um teste com IBP em dose dobrada por 8 a 12 semanas seria aceitável.","cmp":"Sintomas típicos mais extraesofágicos: IBP empírico. Extraesofágicos isolados: testar antes.","arm":"Atribuir automaticamente toda tosse crônica ao refluxo.","regra":"Sintoma atípico isolado: confirme o refluxo antes de tratar por longo tempo.","cf":"Rouquidão persistente por mais de 4 semanas exige laringoscopia, independentemente da hipótese de refluxo.","fonte":"ACG Clinical Guideline for GERD (Katz PO et al., Am J Gastroenterol 2022)."}]},{"id":"M02","titulo":"Gastrite, H. pylori e úlcera péptica","bloco":1,"q":[{"n":1,"sub":"Testar e tratar","comp":"Escolher a estratégia na dispepsia não investigada","tags":[],"rel":[],"enun":"Mulher de 28 anos com dor epigástrica em queimação e plenitude pós-prandial há 4 meses. Sem perda de peso, anemia, vômitos ou história familiar de câncer gástrico. Não usa AINE. Qual é a estratégia inicial recomendada?","ops":[["Pesquisar H. pylori por método não invasivo e tratar se positivo.","Correta: em jovem sem alarme, a estratégia testar e tratar com método não invasivo é recomendada."],["Realizar EDA com biópsias para pesquisa de H. pylori antes de qualquer tratamento.","Errada: EDA inicial é reservada a pacientes com sinais de alarme ou idade mais avançada."],["Solicitar sorologia para H. pylori e repeti-la após o tratamento para confirmar a erradicação.","Errada: a sorologia permanece positiva após a cura e não deve ser usada para controle."],["Prescrever IBP por tempo indeterminado sem pesquisar H. pylori.","Errada: deixar de pesquisar H. pylori perde a chance de tratar a causa e prevenir úlcera e câncer."]],"conc":"Na dispepsia não investigada em paciente jovem sem sinais de alarme, a estratégia testar e tratar (teste respiratório com ureia marcada ou antígeno fecal) é custo-efetiva.","rac":"Paciente jovem, sem alarme, sem AINE. O próximo passo é pesquisar H. pylori de forma não invasiva e erradicar se positivo; persistindo os sintomas, segue-se para IBP ou EDA.","pista":"Idade jovem e ausência de sinais de alarme.","mud":"Idade acima de 40 a 45 anos em região de alta incidência de câncer gástrico, ou sinais de alarme, levariam à EDA inicial.","cmp":"Teste respiratório e antígeno fecal: diagnóstico e controle. Sorologia: só diagnóstico epidemiológico, sem valor para controle.","arm":"Usar sorologia para confirmar a erradicação.","regra":"Jovem sem alarme: testar e tratar H. pylori.","cf":"Se o teste for negativo e os sintomas persistirem, trata-se como dispepsia funcional (Roma IV).","fonte":"IV Consenso Brasileiro sobre H. pylori (Coelho LGV et al., Arq Gastroenterol 2018); Maastricht VI/Florence (Malfertheiner P et al., Gut 2022)."},{"n":2,"sub":"Esquema de primeira linha","comp":"Prescrever a erradicação de primeira linha no Brasil","tags":[],"rel":[],"enun":"Homem de 40 anos com úlcera duodenal e teste da urease positivo, sem alergias e sem uso prévio de macrolídeos. Segundo o IV Consenso Brasileiro, qual é o esquema de primeira linha?","ops":[["IBP, amoxicilina 1 g e claritromicina 500 mg de 12/12 h por 14 dias.","Correta: a terapia tripla padrão por 14 dias é a primeira linha no Brasil para pacientes sem alergia à penicilina."],["IBP, amoxicilina 1 g e claritromicina 500 mg, de 12 em 12 horas, por 5 dias.","Errada: a duração recomendada é de 14 dias; esquemas curtos reduzem a taxa de erradicação."],["IBP isolado em dose dobrada por 8 semanas, sem antibióticos.","Errada: o IBP cicatriza a úlcera, mas não erradica a bactéria; a úlcera recidiva."],["Metronidazol 500 mg isolado de 8 em 8 horas por 7 dias.","Errada: monoterapia antibiótica tem baixa eficácia e induz resistência."]],"conc":"A erradicação do H. pylori combina supressão ácida e dois antibióticos. No Brasil, a primeira linha é IBP + amoxicilina + claritromicina por 14 dias; a quadrupla com bismuto é alternativa, inclusive na alergia à penicilina.","rac":"Paciente sem alergia e sem uso prévio de macrolídeos: terapia tripla padrão por 14 dias. Após o término, confirmar a cura.","pista":"Ausência de alergia à penicilina e de exposição prévia à claritromicina.","mud":"Alergia à penicilina ou uso prévio de macrolídeo levariam à terapia quadrupla com bismuto.","cmp":"Tripla padrão (IBP + amoxicilina + claritromicina) versus quadrupla com bismuto (IBP + bismuto + tetraciclina + metronidazol).","arm":"Achar que basta o IBP para tratar a úlcera associada ao H. pylori.","regra":"H. pylori no Brasil: IBP + amoxicilina + claritromicina por 14 dias.","cf":"Em falha do primeiro esquema, utiliza-se esquema de resgate com levofloxacino ou quadrupla com bismuto, de preferência guiado por sensibilidade.","fonte":"IV Consenso Brasileiro sobre H. pylori (Coelho LGV et al., Arq Gastroenterol 2018)."},{"n":3,"sub":"Controle de erradicação","comp":"Programar o teste de cura","tags":[],"rel":[],"enun":"Paciente concluiu esquema de erradicação para H. pylori há 10 dias e continua usando omeprazol para cicatrização da úlcera. Como e quando deve ser feito o controle de erradicação?","ops":[["Teste respiratório 4 semanas após os antibióticos, com IBP suspenso há 2 semanas.","Correta: o controle deve ser feito ao menos 4 semanas após o tratamento e 2 semanas sem IBP, para evitar falso-negativo."],["Teste respiratório imediatamente, mantendo o omeprazol, para não atrasar a confirmação.","Errada: o IBP e o exame precoce reduzem a carga bacteriana e causam falso-negativo."],["Sorologia IgG para H. pylori 4 semanas após o fim do tratamento.","Errada: anticorpos persistem por meses a anos após a cura; a sorologia não serve para controle."],["Não é necessário controle se o paciente estiver assintomático.","Errada: o controle é recomendado para todos os tratados, pois a melhora dos sintomas não comprova a erradicação."]],"conc":"Antibióticos e IBP suprimem o H. pylori e podem causar falso-negativo em testes baseados na urease ou no antígeno. Por isso: 4 semanas sem antibióticos e 2 semanas sem IBP antes do teste de controle.","rac":"Escolha o método (teste respiratório ou antígeno fecal; EDA se houver indicação de reavaliar a úlcera) e respeite os intervalos.","pista":"Exame feito cedo demais e com IBP em uso.","mud":"Úlcera gástrica exigiria nova EDA para documentar cicatrização e excluir câncer; o controle de H. pylori pode ser feito por biópsia nessa EDA.","cmp":"Teste respiratório e antígeno fecal: controle. Sorologia: não.","arm":"Fazer o controle em uso de IBP e interpretar o negativo como cura.","regra":"Controle: 4 semanas sem antibiótico e 2 sem IBP.","cf":"Se o paciente precisar manter IBP, pode-se usar antagonista H2 nas 2 semanas anteriores ao teste.","fonte":"Maastricht VI/Florence (Malfertheiner P et al., Gut 2022); IV Consenso Brasileiro (Coelho LGV et al., 2018)."},{"n":4,"sub":"Hemorragia por úlcera","comp":"Aplicar a classificação de Forrest","tags":[],"rel":[],"enun":"Homem de 59 anos com melena e hipotensão é estabilizado e submetido a EDA em 24 horas, que mostra úlcera duodenal com vaso visível não sangrante (Forrest IIa). Qual é a conduta?","ops":[["Hemostasia endoscópica seguida de IBP em altas doses por via intravenosa.","Correta: vaso visível tem alto risco de ressangramento e exige terapia endoscópica e IBP intravenoso em altas doses."],["Apenas IBP oral e alta hospitalar no dia seguinte, sem terapia endoscópica.","Errada: Forrest IIa é lesão de alto risco; tratar apenas com IBP oral expõe a ressangramento."],["Indicar gastrectomia de urgência por ser úlcera com vaso visível.","Errada: a cirurgia fica para falha da terapia endoscópica e da embolização, não como primeira opção."],["Repetir a EDA em 6 horas antes de qualquer tratamento endoscópico.","Errada: a hemostasia deve ser feita na própria EDA diagnóstica em lesões de alto risco."]],"conc":"A classificação de Forrest estima o risco de ressangramento: Ia (jato), Ib (babando), IIa (vaso visível) e IIb (coágulo aderido) são de alto risco; IIc (hematina) e III (base limpa) são de baixo risco.","rac":"Forrest IIa: alto risco. Conduta: hemostasia endoscópica (térmica ou clipes, combinada ou não com adrenalina) e IBP intravenoso em altas doses por 72 horas, depois oral. Pesquisar e erradicar H. pylori.","pista":"Vaso visível não sangrante no leito da úlcera.","mud":"Úlcera de base limpa (Forrest III) permitiria IBP oral, dieta precoce e alta precoce.","cmp":"Alto risco (Ia, Ib, IIa; IIb após remover o coágulo): tratar endoscopicamente. Baixo risco (IIc, III): só IBP.","arm":"Achar que a ausência de sangramento ativo dispensa a terapia endoscópica.","regra":"Vaso visível: hemostasia endoscópica e IBP intravenoso.","cf":"Adrenalina isolada não é suficiente; deve ser combinada a um segundo método.","fonte":"ACG Guideline: Upper GI and Ulcer Bleeding (Laine L et al., Am J Gastroenterol 2021); ESGE Guideline 2021 (Gralnek IM et al., Endoscopy 2021)."},{"n":5,"sub":"Úlcera gástrica","comp":"Conduzir a úlcera gástrica benigna em biópsia","tags":[],"rel":[],"enun":"Mulher de 63 anos com dor epigástrica tem úlcera de 1,5 cm na pequena curvatura gástrica. As biópsias mostram gastrite crônica com H. pylori, sem neoplasia. Após erradicação e IBP, qual é a conduta?","ops":[["Repetir a EDA em 8 a 12 semanas para documentar a cicatrização.","Correta: úlceras gástricas exigem controle endoscópico para excluir neoplasia que pode ter sido perdida nas biópsias iniciais."],["Dispensar nova EDA, pois a biópsia inicial excluiu malignidade.","Errada: a biópsia pode ter falso-negativo; a cicatrização documentada é parte da exclusão de câncer."],["Gastrectomia parcial eletiva, pela localização na pequena curvatura.","Errada: úlcera benigna tratada clinicamente não tem indicação de cirurgia."],["Seguimento apenas clínico, com nova EDA só se surgir sangramento.","Errada: o controle endoscópico é programado, não apenas em complicações."]],"conc":"Diferentemente da úlcera duodenal, que raramente é maligna, a úlcera gástrica pode ser um adenocarcinoma ulcerado. Por isso exige biópsias múltiplas e EDA de controle após o tratamento.","rac":"Biópsias iniciais benignas não encerram o caso: trate H. pylori e use IBP; repita a EDA em 8 a 12 semanas para confirmar a cicatrização e biopsiar o que restar.","pista":"Úlcera em estômago em paciente acima de 60 anos.","mud":"Na úlcera duodenal não complicada com H. pylori erradicado e sintomas resolvidos, nova EDA não é obrigatória.","cmp":"Úlcera duodenal: H. pylori em maioria, raramente maligna. Úlcera gástrica: biopsiar e controlar a cicatrização.","arm":"Confiar em uma biópsia única para dar alta à paciente.","regra":"Úlcera gástrica: biopsiar e repetir a EDA.","cf":"Uma úlcera que não cicatriza apesar do tratamento correto deve ser considerada neoplásica até prova em contrário.","fonte":"ACG Guideline Peptic Ulcer (Chey WD et al., H. pylori 2024); Sociedade Brasileira de Endoscopia Digestiva, recomendações em úlcera péptica."},{"n":6,"sub":"Úlcera perfurada","comp":"Reconhecer o abdome agudo perfurativo","tags":[],"rel":[],"enun":"Homem de 52 anos, usuário de AINE para lombalgia, apresenta dor epigástrica súbita e intensa há 3 horas, que se espalhou para todo o abdome. Abdome em tábua, com hipertimpanismo à percussão do hipocôndrio direito. A radiografia de tórax em pé mostra ar sob as cúpulas diafragmáticas. Qual é a conduta?","ops":[["Reanimação, antibióticos, IBP intravenoso e cirurgia para rafia da perfuração com epiplonplastia.","Correta: úlcera perfurada com peritonite exige cirurgia de urgência; a rafia com retalho de omento é o procedimento padrão."],["Tratamento conservador com IBP e jejum, pois a maioria das perfurações sela espontaneamente.","Errada: o tratamento conservador é exceção em pacientes muito selecionados, sem peritonite difusa; aqui há peritonite."],["EDA de urgência para localizar e fechar a perfuração com clipes.","Errada: a EDA é contraindicada na suspeita de perfuração, pois insufla ar e pode piorar o pneumoperitônio."],["Erradicação de H. pylori e reavaliação ambulatorial em 7 dias.","Errada: há abdome agudo perfurativo; a erradicação vem depois do tratamento cirúrgico."]],"conc":"A perfuração é complicação grave da úlcera péptica, associada a AINE e H. pylori. Manifesta-se com dor súbita, abdome em tábua, sinal de Jobert (perda da macicez hepática) e pneumoperitônio.","rac":"Dor súbita, peritonite e pneumoperitônio definem abdome agudo perfurativo: reanimação, antibiótico, IBP e cirurgia (rafia e epiplonplastia). Depois, suspender AINE e tratar H. pylori.","pista":"Pneumoperitônio na radiografia em pé e abdome em tábua.","mud":"Paciente estável, com perfuração tamponada na TC e sem peritonite, poderia ser tratado de forma conservadora em centro especializado.","cmp":"Perfuração: dor súbita, pneumoperitônio, cirurgia. Penetração: dor que se irradia para o dorso, pancreatite ou fístula.","arm":"Indicar EDA diagnóstica na suspeita de perfuração.","regra":"Úlcera perfurada com peritonite: operar.","cf":"O sinal de Jobert é a substituição da macicez hepática por timpanismo, por ar livre na cavidade.","fonte":"WSES guidelines for perforated and bleeding peptic ulcer (Tarasconi A et al., World J Emerg Surg 2020)."},{"n":7,"sub":"Prevenção de lesão por AINE","comp":"Proteger paciente de alto risco gastrointestinal","tags":[],"rel":[],"enun":"Mulher de 72 anos com osteoartrite grave tem história de úlcera duodenal com sangramento há 2 anos (H. pylori erradicado). Necessita de anti-inflamatório por tempo prolongado e não tem doença cardiovascular. Qual é a melhor estratégia?","ops":[["Inibidor seletivo da COX-2 associado a IBP.","Correta: em alto risco gastrointestinal (úlcera complicada prévia), a combinação de coxibe e IBP é a estratégia de maior proteção."],["Ibuprofeno em dose plena sem gastroproteção, pois o H. pylori já foi erradicado.","Errada: a erradicação não elimina o risco associado ao AINE em paciente com úlcera complicada prévia."],["AINE não seletivo associado a antagonista H2 em dose padrão.","Errada: o antagonista H2 em dose padrão não previne úlcera gástrica induzida por AINE de forma adequada."],["AINE não seletivo associado a sucralfato.","Errada: o sucralfato não tem eficácia comprovada na prevenção de úlceras por AINE."]],"conc":"Fatores de risco para úlcera por AINE: idade acima de 65 anos, úlcera prévia (especialmente complicada), dose alta, uso de corticoide, anticoagulante ou antiagregante. Em alto risco, recomenda-se evitar AINE; se indispensável, coxibe com IBP.","rac":"Paciente idosa com úlcera complicada prévia: alto risco gastrointestinal. Sem doença cardiovascular, a opção é coxibe com IBP.","pista":"Úlcera com sangramento prévio e idade acima de 65 anos.","mud":"Alto risco cardiovascular junto com alto risco gastrointestinal: evitar AINE; se inevitável, naproxeno com IBP.","cmp":"IBP e misoprostol têm eficácia comprovada na prevenção; antagonista H2 em dose padrão e sucralfato não.","arm":"Achar que erradicar o H. pylori basta para liberar AINE sem proteção.","regra":"Alto risco GI sem risco CV: coxibe com IBP.","cf":"Antes de iniciar AINE crônico em paciente com história de úlcera, pesquisa-se e trata-se o H. pylori.","fonte":"ACG Guidelines for Prevention of NSAID-Related Ulcer Complications (Lanza FL et al., Am J Gastroenterol 2009)."},{"n":8,"sub":"Síndrome de Zollinger-Ellison","comp":"Suspeitar de gastrinoma","tags":[],"rel":[],"enun":"Homem de 38 anos com úlceras duodenais recorrentes, pesquisa de H. pylori negativa e sem uso de AINE. A EDA atual mostra úlceras múltiplas na segunda porção do duodeno e no jejuno proximal. Tem diarreia crônica que melhora com IBP. Qual exame deve ser solicitado?","ops":[["Gastrina sérica em jejum (com IBP suspenso, quando seguro) e pH gástrico.","Correta: úlceras múltiplas, distais e refratárias com diarreia sugerem gastrinoma; a gastrina em jejum elevada com pH gástrico ácido sustenta o diagnóstico."],["Sorologia para H. pylori, pois o teste da urease pode ter sido falso-negativo.","Errada: a apresentação atípica (úlceras jejunais e diarreia) aponta para hipersecreção ácida por gastrinoma."],["Colonoscopia para investigar doença inflamatória intestinal como causa da diarreia.","Errada: a diarreia melhora com IBP porque decorre do excesso de ácido, típico do gastrinoma."],["Dosagem de cromogranina A isolada, que confirma o diagnóstico.","Errada: a cromogranina é inespecífica (eleva-se com IBP); o diagnóstico depende de gastrina e pH gástrico."]],"conc":"O gastrinoma secreta gastrina, levando a hipersecreção ácida, úlceras múltiplas e em locais atípicos (além do bulbo), refratárias, e diarreia. Associa-se à NEM 1 em cerca de 20% a 25% dos casos.","rac":"Úlceras pós-bulbares e jejunais, ausência de H. pylori e de AINE e diarreia que responde ao IBP: hipótese de Zollinger-Ellison. Dosar gastrina em jejum com pH gástrico; se duvidoso, teste da secretina.","pista":"Úlcera no jejuno e diarreia responsiva ao IBP.","mud":"Úlcera única de bulbo com H. pylori positivo seria explicada pela bactéria, sem necessidade de pesquisar gastrinoma.","cmp":"Hipergastrinemia com pH ácido: gastrinoma. Hipergastrinemia com pH alcalino: gastrite atrófica ou uso de IBP.","arm":"Interpretar hipergastrinemia em uso de IBP como gastrinoma.","regra":"Úlcera atípica, múltipla e refratária: pense em gastrinoma.","cf":"Diante do diagnóstico, investigar NEM 1 com cálcio, PTH e prolactina.","fonte":"Harrison's Principles of Internal Medicine, 21ª ed., cap. Peptic Ulcer Disease; NANETS consensus on gastrinoma (Metz DC et al.)."},{"n":9,"sub":"Gastrite autoimune","comp":"Reconhecer gastrite atrófica de corpo","tags":[],"rel":[],"enun":"Mulher de 55 anos com hipotireoidismo e vitiligo apresenta parestesias em pés, glossite e anemia macrocítica (VCM 112 fL). A EDA mostra atrofia de corpo e fundo gástricos com antro preservado. Qual é o mecanismo mais provável da anemia?","ops":[["Autoanticorpos contra células parietais e fator intrínseco, com má absorção de B12.","Correta: a gastrite autoimune destrói as células parietais do corpo, reduz o fator intrínseco e causa anemia perniciosa."],["Infecção crônica pelo H. pylori de predomínio antral com deficiência de ferro.","Errada: a atrofia restrita ao corpo com antro preservado e a macrocitose apontam para gastrite autoimune."],["Uso crônico de AINE com perda sanguínea oculta e anemia ferropriva.","Errada: perda sanguínea causa anemia microcítica, não macrocítica com neuropatia."],["Deficiência de folato por baixa ingestão de vegetais.","Errada: a deficiência de folato não causa parestesias por lesão de cordões posteriores e não explica a atrofia de corpo."]],"conc":"A gastrite autoimune (tipo A) acomete corpo e fundo, poupa o antro, cursa com acloridria, hipergastrinemia, deficiência de B12 e ferro e se associa a outras doenças autoimunes. Aumenta o risco de tumor neuroendócrino tipo 1 e de adenocarcinoma.","rac":"Associação com doenças autoimunes, anemia macrocítica com sintomas neurológicos e atrofia de corpo com antro poupado: gastrite autoimune com anemia perniciosa.","pista":"Atrofia de corpo com antro preservado em paciente com outras doenças autoimunes.","mud":"Atrofia antral multifocal com H. pylori positivo sugeriria gastrite ambiental, não autoimune.","cmp":"Autoimune: corpo, B12, gastrina alta. H. pylori: antro ou multifocal, risco de úlcera e câncer.","arm":"Tratar a macrocitose com ácido fólico isolado, mascarando a anemia e piorando a lesão neurológica.","regra":"Anemia megaloblástica com neuropatia e atrofia de corpo: anemia perniciosa.","cf":"O tratamento é reposição parenteral de B12 por toda a vida e vigilância endoscópica.","fonte":"AGA Clinical Practice Update on the Diagnosis and Management of Atrophic Gastritis (Shah SC et al., Gastroenterology 2021)."},{"n":10,"sub":"Linfoma MALT","comp":"Indicar a erradicação como tratamento oncológico","tags":[],"rel":[],"enun":"Homem de 50 anos com dispepsia realiza EDA que mostra lesão infiltrativa em antro. A biópsia confirma linfoma MALT gástrico de baixo grau, H. pylori positivo, restrito ao estômago (estádio I). Qual é o tratamento inicial?","ops":[["Erradicação do H. pylori com acompanhamento endoscópico e histológico.","Correta: no linfoma MALT localizado e H. pylori positivo, a erradicação induz remissão na maioria dos casos."],["Gastrectomia total com linfadenectomia D2, por se tratar de neoplasia gástrica.","Errada: a cirurgia não é tratamento de primeira linha no linfoma MALT localizado."],["Quimioterapia com R-CHOP imediatamente.","Errada: R-CHOP é usado em linfoma difuso de grandes células B, não no MALT de baixo grau localizado."],["Radioterapia gástrica antes de tratar o H. pylori.","Errada: a radioterapia é opção para doença que não responde à erradicação ou H. pylori negativa."]],"conc":"O linfoma MALT gástrico é uma neoplasia de células B associada à estimulação antigênica crônica pelo H. pylori. Na doença localizada, a erradicação é o tratamento inicial e induz remissão em grande parte dos pacientes.","rac":"MALT de baixo grau, estádio I, H. pylori positivo: erradicar e acompanhar com EDA e biópsias seriadas. Se não houver resposta, considerar radioterapia.","pista":"Linfoma MALT de baixo grau localizado e H. pylori positivo.","mud":"Translocação t(11;18) prevê menor resposta à erradicação; transformação para alto grau exige quimioimunoterapia.","cmp":"MALT localizado: erradicação. Linfoma difuso de grandes células B: R-CHOP.","arm":"Tratar o linfoma MALT como adenocarcinoma e indicar gastrectomia.","regra":"MALT gástrico H. pylori positivo: o antibiótico é o primeiro tratamento.","cf":"Outras indicações formais de erradicação incluem úlcera péptica, câncer gástrico ressecado e parente de primeiro grau com câncer gástrico.","fonte":"Maastricht VI/Florence (Malfertheiner P et al., Gut 2022); ESMO Gastric MALT lymphoma guidelines (Zucca E et al., Ann Oncol 2020)."}]},{"id":"M03","titulo":"Alergia e intolerância alimentar","bloco":1,"q":[{"n":1,"sub":"APLV IgE mediada","comp":"Conduzir alergia à proteína do leite de vaca IgE mediada","tags":[],"rel":[],"enun":"Lactente de 6 meses, até então em aleitamento materno exclusivo, recebe a primeira mamadeira de fórmula infantil à base de leite de vaca. Em 15 minutos surgem urticária generalizada, edema labial e um episódio de vômito, sem desconforto respiratório nem hipotensão, com melhora após anti-histamínico. Qual é a conduta mais adequada?","ops":[["Excluir a proteína do leite de vaca e usar fórmula extensamente hidrolisada se necessário.","Correta: na APLV IgE mediada sem anafilaxia, exclui-se o leite de vaca e usa-se fórmula extensamente hidrolisada quando o aleitamento materno não for possível."],["Trocar por fórmula sem lactose, pois o quadro se deve à intolerância à lactose.","Errada: fórmulas sem lactose contêm proteína do leite de vaca; urticária e angioedema em minutos indicam alergia, não intolerância."],["Manter a fórmula de leite de vaca com anti-histamínico profilático antes de cada mamadeira.","Errada: o anti-histamínico não previne reações graves; o tratamento da alergia é a exclusão do alérgeno."],["Introduzir leite de cabra como substituto, por ser menos alergênico.","Errada: há reatividade cruzada elevada entre as proteínas do leite de vaca e de cabra; não é substituto seguro."]],"conc":"A alergia à proteína do leite de vaca (APLV) é reação imunológica à proteína; pode ser IgE mediada (reação em minutos a 2 horas: urticária, angioedema, vômitos, anafilaxia), não IgE mediada (tardia: proctocolite, enterocolite) ou mista.","rac":"Reação cutânea e gastrointestinal em minutos após exposição: APLV IgE mediada. Sem anafilaxia: dieta de exclusão e, se necessário, fórmula extensamente hidrolisada. Com anafilaxia: fórmula de aminoácidos.","pista":"Sintomas imediatos (15 minutos) com urticária e angioedema.","mud":"Anafilaxia (desconforto respiratório, hipotensão) indicaria fórmula de aminoácidos e prescrição de adrenalina autoinjetável.","cmp":"Alergia: reação imunológica à proteína. Intolerância à lactose: deficiência de lactase, sem urticária.","arm":"Confundir APLV com intolerância à lactose e prescrever fórmula sem lactose.","regra":"APLV: tire a proteína do leite, não a lactose.","cf":"Se a mãe puder retomar o aleitamento, ele deve ser estimulado, com dieta materna de exclusão apenas se o lactente reagir à exposição via leite materno.","fonte":"Consenso Brasileiro sobre Alergia Alimentar 2018 (ASBAI/SBP; Solé D et al., Arq Asma Alerg Imunol 2018;2:7-82)."},{"n":2,"sub":"Proctocolite alérgica","comp":"Reconhecer a forma não IgE mediada em lactente amamentado","tags":[],"rel":[],"enun":"Lactente de 2 meses, em aleitamento materno exclusivo, com bom ganho de peso e bom estado geral, apresenta fezes com rajas de sangue e muco há 1 semana. Exame físico normal. Qual é a conduta?","ops":[["Manter o aleitamento e orientar a mãe a excluir leite de vaca e derivados.","Correta: proctocolite alérgica é APLV não IgE mediada; mantém-se o aleitamento e a mãe exclui o leite de vaca."],["Suspender o aleitamento materno e iniciar fórmula de aminoácidos.","Errada: o aleitamento deve ser mantido; a exclusão é feita na dieta da mãe."],["Solicitar IgE específica para leite de vaca para confirmar o diagnóstico.","Errada: nas formas não IgE mediadas, a IgE específica é negativa e não ajuda no diagnóstico."],["Realizar colonoscopia para excluir doença inflamatória intestinal de início precoce.","Errada: em lactente bem, com ganho de peso, o diagnóstico é clínico; endoscopia não é necessária."]],"conc":"A proctocolite alérgica induzida por proteína alimentar é a forma mais comum de APLV não IgE mediada em lactentes amamentados. Cursa com sangue e muco nas fezes em bebê saudável e com bom ganho ponderal.","rac":"Lactente bem, ganhando peso, com sangue nas fezes: proctocolite. Mantém-se o aleitamento, com exclusão do leite de vaca na dieta materna; os sinais melhoram em dias a semanas.","pista":"Bom estado geral e ganho de peso adequado com sangue nas fezes.","mud":"Repercussão sistêmica, baixo ganho ponderal ou instabilidade exigiriam investigação de outras causas (enterocolite necrosante, invaginação, infecção).","cmp":"Proctocolite: sangue nas fezes, bebê bem. FPIES: vômitos repetitivos e letargia horas após a ingestão.","arm":"Interromper o aleitamento materno por causa de alergia alimentar.","regra":"Proctocolite alérgica: mantenha o peito e retire o leite da dieta da mãe.","cf":"Geralmente há tolerância até o primeiro ano de vida; a reintrodução é feita com teste de provocação.","fonte":"Consenso Brasileiro sobre Alergia Alimentar 2018 (ASBAI/SBP)."},{"n":3,"sub":"Intolerância à lactose","comp":"Diferenciar intolerância de alergia e escolher o teste","tags":[],"rel":[],"enun":"Homem de 30 anos relata distensão abdominal, flatulência e diarreia aquosa cerca de 1 hora após consumir leite e sorvete. Nega urticária, sangue nas fezes ou perda de peso. Tolera queijos curados. Qual exame confirma a hipótese mais provável?","ops":[["Teste do hidrogênio expirado após sobrecarga de lactose.","Correta: o aumento do hidrogênio expirado após lactose confirma má absorção de lactose; é o exame de escolha."],["Dosagem de IgE específica para proteína do leite de vaca.","Errada: o quadro é de intolerância (deficiência de lactase), não de alergia; IgE não é útil."],["Biópsia de duodeno para dosagem de dissacaridases como exame inicial.","Errada: é invasiva e reservada a casos selecionados; o teste respiratório é o exame de primeira linha."],["Colonoscopia com biópsias para excluir colite microscópica.","Errada: a relação nítida com lactose e a tolerância a queijos curados apontam para intolerância à lactose."]],"conc":"A intolerância à lactose decorre da deficiência de lactase. A lactose não absorvida chega ao cólon, é fermentada (gases, hidrogênio) e causa diarreia osmótica, distensão e flatulência.","rac":"Sintomas digestivos após lactose, sem manifestações imunológicas, com tolerância a queijos curados (pouca lactose): intolerância. O teste do hidrogênio expirado confirma.","pista":"Tolerância a queijos curados, pobres em lactose, e ausência de manifestações cutâneas.","mud":"Urticária, angioedema ou sibilância após o leite sugeririam alergia IgE mediada.","cmp":"Intolerância: dose-dependente, digestiva, tolera pequenas quantidades. Alergia: imunológica, pode reagir a traços.","arm":"Prescrever exclusão total e definitiva de todos os laticínios para quem tem intolerância.","regra":"Intolerância à lactose: hidrogênio expirado; trate com redução da lactose e lactase.","cf":"Intolerância secundária pode surgir após gastroenterite ou na doença celíaca e regride com o tratamento da causa.","fonte":"ACG Clinical Guideline: Management of IBS (Lacy BE et al., 2021), seção de carboidratos fermentáveis; Misselwitz B et al. Lactose malabsorption and intolerance. Gut 2019;68:2080-2091."},{"n":4,"sub":"Teste de provocação oral","comp":"Identificar o padrão-ouro no diagnóstico de alergia alimentar","tags":[],"rel":[],"enun":"Criança de 4 anos tem IgE específica positiva para amendoim, mas nunca o ingeriu. Os pais querem saber se ela é de fato alérgica. Qual exame é considerado padrão-ouro para o diagnóstico de alergia alimentar?","ops":[["Teste de provocação oral, idealmente duplo-cego controlado por placebo, em ambiente preparado.","Correta: o teste de provocação oral é o padrão-ouro e deve ser realizado em local com recursos para tratar anafilaxia."],["Dosagem de IgE específica, pois um resultado positivo confirma a alergia.","Errada: IgE positiva indica sensibilização, não necessariamente alergia clínica."],["Teste cutâneo de leitura imediata (prick test), suficiente para confirmar o diagnóstico.","Errada: o prick test também indica sensibilização e tem valor preditivo positivo limitado."],["Teste de contato (patch test), que identifica alergias IgE mediadas.","Errada: o patch test avalia hipersensibilidade tardia e não é padrão-ouro para alergia alimentar."]],"conc":"Testes de IgE (sérica ou cutânea) mostram sensibilização. O diagnóstico de alergia exige correlação clínica; quando há dúvida, o teste de provocação oral confirma ou exclui a alergia.","rac":"Criança sensibilizada que nunca ingeriu o alimento: não se sabe se reagirá. O teste de provocação oral supervisionado define o diagnóstico.","pista":"IgE positiva sem história clínica de reação.","mud":"Se a criança já tivesse anafilaxia comprovada ao amendoim, o teste de provocação não seria necessário para o diagnóstico.","cmp":"Sensibilização (IgE positiva) versus alergia (sintomas após exposição).","arm":"Prescrever dietas restritivas com base apenas em painéis de IgE.","regra":"Padrão-ouro em alergia alimentar: provocação oral.","cf":"Em lactentes de alto risco, a introdução precoce do amendoim reduz a chance de alergia, conforme o estudo LEAP.","fonte":"Consenso Brasileiro sobre Alergia Alimentar 2018 (ASBAI/SBP); EAACI Food Allergy Guidelines (Santos AF et al., Allergy 2023)."},{"n":5,"sub":"Anafilaxia","comp":"Tratar anafilaxia por alimento","tags":[],"rel":[],"enun":"Adolescente de 16 anos, 60 kg, come castanhas e em 10 minutos apresenta urticária, edema de glote, sibilância e PA 80/50 mmHg. Qual é a primeira medida?","ops":[["Adrenalina 0,5 mg por via intramuscular na face anterolateral da coxa.","Correta: a adrenalina intramuscular (0,01 mg/kg, máximo 0,5 mg) é o tratamento de primeira linha e deve ser imediata."],["Anti-histamínico intravenoso e hidrocortisona, reservando a adrenalina se não houver melhora.","Errada: anti-histamínico e corticoide são adjuvantes e não substituem nem devem atrasar a adrenalina."],["Adrenalina 1 mg por via intravenosa em bolus.","Errada: bolus intravenoso de 1 mg é dose de parada cardíaca e pode causar arritmias graves em paciente com pulso."],["Salbutamol inalatório isolado para tratar o broncoespasmo.","Errada: o broncodilatador trata apenas o broncoespasmo; não reverte o edema de glote nem a hipotensão."]],"conc":"Anafilaxia é reação sistêmica grave, de instalação rápida, com acometimento de pele e mucosas associado a comprometimento respiratório, cardiovascular ou gastrointestinal. A adrenalina intramuscular é o fármaco de escolha.","rac":"Reação multissistêmica após alimento com hipotensão: anafilaxia. Dose de adrenalina 1 mg/mL: 0,01 mg/kg, máximo 0,5 mg, intramuscular na coxa, podendo repetir a cada 5 a 15 minutos; deitar o paciente, oxigênio e volume.","pista":"Hipotensão e edema de glote após exposição a alérgeno.","mud":"Reação apenas cutânea, sem comprometimento respiratório ou circulatório, poderia ser tratada com anti-histamínico e observação.","cmp":"Primeira linha: adrenalina intramuscular. Adjuvantes: anti-histamínico, corticoide, broncodilatador.","arm":"Atrasar a adrenalina para administrar anti-histamínico.","regra":"Anafilaxia: adrenalina intramuscular na coxa, sem demora.","cf":"Após o episódio, o paciente deve receber orientação, plano de ação e prescrição de adrenalina autoinjetável.","fonte":"World Allergy Organization Anaphylaxis Guidance 2020 (Cardona V et al., World Allergy Organ J 2020); Guia ASBAI de anafilaxia."},{"n":6,"sub":"Doença celíaca: diagnóstico","comp":"Solicitar a sorologia correta","tags":[],"rel":[],"enun":"Mulher de 27 anos com diarreia crônica, distensão e anemia ferropriva. Consome glúten normalmente. Qual é o exame inicial recomendado para rastrear doença celíaca?","ops":[["Anticorpo antitransglutaminase tecidual IgA associado à dosagem de IgA total.","Correta: o anti-tTG IgA é o teste de rastreio de escolha, com IgA total para excluir deficiência de IgA."],["Antigliadina nativa IgA e IgG, que têm maior sensibilidade.","Errada: os anticorpos antigliadina nativa têm baixa acurácia e não são mais recomendados."],["Tipagem HLA-DQ2/DQ8, que confirma o diagnóstico de doença celíaca quando positiva.","Errada: o HLA positivo é comum na população; serve para excluir a doença quando negativo, não para confirmar."],["Biópsia de cólon, que mostra atrofia de vilosidades característica.","Errada: a atrofia vilositária é avaliada no duodeno, não no cólon."]],"conc":"A doença celíaca é enteropatia imunomediada desencadeada pelo glúten em indivíduos geneticamente predispostos (HLA-DQ2/DQ8). O rastreio é sorológico com anti-tTG IgA e IgA total, e a confirmação, em adultos, é feita por biópsia duodenal.","rac":"Paciente com sintomas e dieta com glúten: anti-tTG IgA com IgA total. Se positivo, EDA com biópsias duodenais (pelo menos 4 do duodeno distal e 1 a 2 do bulbo), mantendo o glúten.","pista":"Paciente ainda em consumo de glúten, condição necessária para a sorologia e a biópsia.","mud":"Deficiência de IgA levaria a usar testes baseados em IgG (anti-DGP IgG ou anti-tTG IgG).","cmp":"Rastreio: anti-tTG IgA com IgA total. Confirmação: biópsia duodenal (Marsh). Exclusão: HLA-DQ2/DQ8 negativo.","arm":"Retirar o glúten antes de concluir a investigação.","regra":"Celíaca: anti-tTG IgA com IgA total, comendo glúten.","cf":"Anemia ferropriva sem causa aparente, osteoporose precoce e elevação de transaminases também justificam rastreio.","fonte":"ACG Clinical Guidelines: Diagnosis and Management of Celiac Disease (Rubio-Tapia A et al., Am J Gastroenterol 2023;118:59-76)."},{"n":7,"sub":"Celíaca com deficiência de IgA","comp":"Interpretar sorologia em deficiência de IgA","tags":[],"rel":[],"enun":"Homem de 22 anos com suspeita de doença celíaca tem anti-tTG IgA negativo e IgA sérica total indetectável. Qual é a próxima etapa?","ops":[["Solicitar testes baseados em IgG, como anti-DGP IgG ou anti-tTG IgG.","Correta: na deficiência de IgA, os testes IgA são falsamente negativos; usam-se os anticorpos IgG."],["Excluir doença celíaca, pois o anti-tTG IgA foi negativo.","Errada: com IgA total indetectável, o anti-tTG IgA negativo não tem valor."],["Repetir o anti-tTG IgA em 6 meses, após aumentar o consumo de glúten.","Errada: o problema é a deficiência de IgA, não a quantidade de glúten."],["Iniciar dieta sem glúten como teste terapêutico, sem mais exames.","Errada: a dieta antes do diagnóstico prejudica a confirmação e não é recomendada."]],"conc":"A deficiência seletiva de IgA é mais comum em celíacos do que na população geral. Por isso a IgA total deve ser dosada junto com o anti-tTG IgA.","rac":"IgA total ausente invalida o resultado IgA. Solicitam-se anti-DGP IgG ou anti-tTG IgG e, se positivos (ou se a suspeita for alta), biópsia duodenal.","pista":"IgA total indetectável.","mud":"Com IgA total normal, o anti-tTG IgA negativo tornaria a doença celíaca improvável (salvo alta suspeita clínica).","cmp":"IgA total normal: testes IgA. IgA deficiente: testes IgG.","arm":"Esquecer de dosar a IgA total e interpretar o negativo como exclusão.","regra":"Sem IgA, use os testes IgG.","cf":"Em casos de alta suspeita com sorologia negativa, a biópsia duodenal pode ser indicada diretamente.","fonte":"ACG Clinical Guidelines: Celiac Disease (Rubio-Tapia A et al., 2023)."},{"n":8,"sub":"Celíaca em dieta sem glúten","comp":"Investigar paciente que já retirou o glúten","tags":[],"rel":[],"enun":"Mulher de 35 anos retirou o glúten por conta própria há 8 meses, com melhora da distensão. Quer saber se é celíaca. A sorologia anti-tTG IgA é negativa e a IgA total é normal. Qual é a melhor conduta?","ops":[["Tipagem HLA-DQ2/DQ8; se negativa, a doença celíaca é praticamente excluída.","Correta: o HLA não depende da dieta; um resultado negativo tem alto valor preditivo negativo."],["Confirmar a doença celíaca, pois houve melhora com a retirada do glúten.","Errada: a melhora com a dieta não confirma doença celíaca; pode ocorrer em sensibilidade não celíaca ou SII."],["Descartar a doença celíaca, pois a sorologia é negativa.","Errada: em dieta sem glúten, a sorologia pode negativar; o resultado não exclui a doença."],["Realizar biópsia duodenal agora, mantendo a dieta sem glúten.","Errada: a mucosa pode estar normalizada pela dieta; a biópsia nessa situação tem baixa sensibilidade."]],"conc":"Sorologia e biópsia dependem da ingestão de glúten. Em pacientes já em dieta, a investigação começa pelo HLA-DQ2/DQ8: se negativo, exclui; se positivo, faz-se provocação com glúten antes de sorologia e biópsia.","rac":"Sorologia negativa em dieta sem glúten não é confiável. HLA negativo exclui a doença. HLA positivo exige reintrodução do glúten (por exemplo, por algumas semanas) e repetição da sorologia e biópsia.","pista":"Paciente em dieta sem glúten há meses.","mud":"Se o HLA fosse positivo, seria necessária reintrodução do glúten antes de concluir.","cmp":"HLA: só exclui. Sorologia e biópsia: dependem do glúten na dieta.","arm":"Concluir que é celíaca porque melhorou ao tirar o glúten.","regra":"Em dieta sem glúten, comece pelo HLA.","cf":"Sensibilidade ao glúten não celíaca é diagnóstico de exclusão, após afastar celíaca e alergia ao trigo.","fonte":"ACG Clinical Guidelines: Celiac Disease (Rubio-Tapia A et al., 2023)."},{"n":9,"sub":"FPIES","comp":"Reconhecer a enterocolite induzida por proteína alimentar","tags":[],"rel":[],"enun":"Lactente de 7 meses recebe arroz pela primeira vez. Duas horas depois apresenta vômitos repetitivos e incoercíveis, palidez e letargia, sem urticária nem sibilância. Melhora após hidratação venosa. Qual é a hipótese mais provável?","ops":[["Enterocolite induzida por proteína alimentar (FPIES), não IgE mediada.","Correta: vômitos repetitivos 1 a 4 horas após o alimento, com palidez e letargia, sem sintomas cutâneos, caracterizam FPIES aguda."],["Anafilaxia alimentar IgE mediada, que exige adrenalina intramuscular.","Errada: a ausência de manifestações cutâneas e respiratórias e o início tardio afastam anafilaxia IgE mediada."],["Intolerância à lactose desencadeada pelo novo alimento.","Errada: o arroz não contém lactose e a intolerância não causa letargia."],["Proctocolite alérgica, por ser forma não IgE mediada em lactente.","Errada: a proctocolite causa sangue nas fezes em bebê bem, não vômitos incoercíveis com letargia."]],"conc":"A FPIES é alergia alimentar não IgE mediada. Na forma aguda, causa vômitos repetitivos 1 a 4 horas após a ingestão, palidez, letargia e, às vezes, hipotensão. Os gatilhos comuns incluem leite, soja, arroz e aveia.","rac":"Início tardio, vômitos incoercíveis e ausência de pele ou via aérea envolvidas: FPIES. Tratamento agudo com hidratação e ondansetrona; IgE específica costuma ser negativa.","pista":"Vômitos repetitivos horas após alimento sólido introduzido pela primeira vez, sem urticária.","mud":"Urticária, angioedema ou broncoespasmo em minutos indicariam reação IgE mediada.","cmp":"FPIES: tardia, vômitos, letargia, IgE negativa. Anafilaxia: imediata, pele, via aérea, adrenalina.","arm":"Tratar FPIES como anafilaxia ou como gastroenterite infecciosa.","regra":"Vômito incoercível 2 horas após alimento novo, sem pele: FPIES.","cf":"O diagnóstico é clínico, e o alimento desencadeante é excluído até nova avaliação com teste de provocação supervisionado.","fonte":"International consensus guidelines for FPIES (Nowak-Węgrzyn A et al., J Allergy Clin Immunol 2017;139:1111-1126)."},{"n":10,"sub":"Celíaca: manifestação extraintestinal","comp":"Reconhecer apresentação atípica","tags":[],"rel":[],"enun":"Mulher de 24 anos com anemia ferropriva refratária à reposição oral de ferro, sem sangramento menstrual excessivo e com colonoscopia normal. Relata lesões vesiculares pruriginosas em cotovelos e joelhos. Qual é a hipótese diagnóstica unificadora?","ops":[["Doença celíaca com dermatite herpetiforme.","Correta: anemia ferropriva refratária ao ferro oral e lesões vesiculares pruriginosas em superfícies extensoras são típicas da doença celíaca."],["Doença de Crohn ileal com eritema nodoso.","Errada: o eritema nodoso causa nódulos dolorosos em face anterior das pernas, não vesículas pruriginosas em cotovelos."],["Psoríase com anemia de doença crônica.","Errada: a psoríase causa placas descamativas, não vesículas, e a anemia de doença crônica não é ferropriva refratária."],["Deficiência de vitamina B12 por gastrite autoimune.","Errada: a deficiência de B12 causa anemia macrocítica, não ferropriva."]],"conc":"A doença celíaca pode se apresentar sem diarreia, com anemia ferropriva (má absorção no duodeno), osteoporose, infertilidade, elevação de transaminases e dermatite herpetiforme.","rac":"O ferro é absorvido no duodeno, local acometido na doença celíaca; por isso a anemia não responde ao ferro oral. As vesículas pruriginosas em superfícies extensoras são dermatite herpetiforme, manifestação cutânea da celíaca.","pista":"Anemia ferropriva sem perdas que não responde ao ferro oral, associada a vesículas pruriginosas.","mud":"Sangramento menstrual volumoso explicaria a anemia ferropriva sem necessidade de pensar em má absorção.","cmp":"Dermatite herpetiforme: vesículas, extensoras, IgA granular em papilas dérmicas. Eritema nodoso: nódulos, face anterior das pernas.","arm":"Aumentar indefinidamente a dose de ferro oral sem investigar má absorção.","regra":"Anemia ferropriva refratária ao ferro oral: pesquise doença celíaca.","cf":"O tratamento das duas manifestações é a dieta sem glúten por toda a vida; a dapsona alivia a dermatite.","fonte":"ACG Clinical Guidelines: Celiac Disease (Rubio-Tapia A et al., 2023)."}]},{"id":"M04","titulo":"DII e SII","bloco":1,"q":[{"n":1,"sub":"Critérios de Roma IV","comp":"Diagnosticar síndrome do intestino irritável","tags":[],"rel":[],"enun":"Mulher de 29 anos refere dor abdominal em cólica, em média duas vezes por semana nos últimos 4 meses, que melhora após evacuar e se associa a fezes mais amolecidas e mais frequentes. Os sintomas começaram há 8 meses. Sem sangramento, perda de peso, febre ou sintomas noturnos; exame físico normal. Qual é a conclusão mais adequada?","ops":[["Preenche Roma IV para SII; investigar de forma limitada e tratar.","Correta: dor recorrente pelo menos 1 dia por semana nos últimos 3 meses, ligada à evacuação e a mudança de frequência e forma, com início há mais de 6 meses, define SII."],["Não preenche Roma IV, pois a dor precisa ocorrer todos os dias da semana.","Errada: Roma IV exige dor em média pelo menos 1 dia por semana, não diariamente."],["Exige colonoscopia antes de qualquer diagnóstico, pela idade da paciente.","Errada: sem sinais de alarme e com menos de 45 anos, a colonoscopia não é necessária."],["O diagnóstico de SII só pode ser feito após exclusão por tomografia de abdome.","Errada: a SII é diagnóstico positivo por critérios clínicos, com exames limitados, não de exclusão por imagem."]],"conc":"Roma IV: dor abdominal recorrente, em média pelo menos 1 dia por semana nos últimos 3 meses, associada a dois ou mais critérios (relação com a evacuação, alteração da frequência, alteração da forma das fezes), com início dos sintomas há pelo menos 6 meses.","rac":"Confira cada critério: dor 2 vezes por semana (sim), melhora ao evacuar (sim), fezes mais frequentes e amolecidas (sim), início há 8 meses (sim). Sem sinais de alarme: SII com predomínio de diarreia. Exames mínimos: hemograma, PCR, sorologia para celíaca e calprotectina fecal.","pista":"Ausência de sinais de alarme com critérios clínicos completos.","mud":"Sangramento, perda de peso, anemia, sintomas noturnos ou história familiar de câncer colorretal ou DII exigiriam colonoscopia.","cmp":"SII: diagnóstico positivo por critérios. Doença orgânica: suspeitar diante de sinais de alarme.","arm":"Tratar a SII como diagnóstico de exclusão e pedir uma bateria de exames desnecessários.","regra":"SII é diagnóstico positivo: critérios de Roma IV mais ausência de alarme.","cf":"Como há predomínio de diarreia, rastreia-se doença celíaca, que tem prevalência aumentada nesse subgrupo.","fonte":"Lacy BE et al. Bowel Disorders (Roma IV). Gastroenterology 2016;150:1393-1407; ACG Clinical Guideline: Management of IBS (Lacy BE et al., Am J Gastroenterol 2021)."},{"n":2,"sub":"Sinais de alarme","comp":"Indicar colonoscopia em sintomas intestinais","tags":[],"rel":[],"enun":"Homem de 58 anos, sem colonoscopia prévia, relata alteração do hábito intestinal há 3 meses, com alternância entre constipação e diarreia e dor abdominal que alivia com a evacuação. Hemoglobina 10,9 g/dL com ferritina baixa. Qual é a conduta?","ops":[["Colonoscopia, pela mudança recente do hábito intestinal com anemia ferropriva.","Correta: idade, início recente e anemia ferropriva são sinais de alarme que exigem colonoscopia para excluir câncer colorretal."],["Diagnosticar SII mista pelos critérios de Roma IV e iniciar antiespasmódico.","Errada: sinais de alarme afastam o diagnóstico clínico de SII até a investigação orgânica."],["Prescrever ferro oral e reavaliar o hábito intestinal em 3 meses.","Errada: anemia ferropriva em homem é perda sanguínea até prova em contrário; o ferro isolado atrasa o diagnóstico."],["Solicitar calprotectina fecal e só indicar colonoscopia se estiver elevada.","Errada: a calprotectina diferencia inflamação, mas não exclui neoplasia; com alarme, a colonoscopia é direta."]],"conc":"Sinais de alarme em sintomas intestinais: início após 45 a 50 anos, sangramento retal, anemia ferropriva, perda de peso, sintomas noturnos, febre, massa abdominal e história familiar de câncer colorretal ou DII.","rac":"Início recente aos 58 anos e anemia ferropriva em homem: suspeita de câncer colorretal. Colonoscopia é obrigatória antes de qualquer diagnóstico funcional.","pista":"Anemia ferropriva em homem acima de 50 anos com mudança de hábito intestinal.","mud":"Em paciente jovem, sem anemia nem outros sinais de alarme, seria possível diagnóstico clínico de SII.","cmp":"Alarme presente: investigar doença orgânica. Alarme ausente: diagnóstico positivo de SII.","arm":"Rotular como SII um idoso com início recente de sintomas.","regra":"Anemia ferropriva em homem: procure o sangramento, comece pelo cólon.","cf":"Endoscopia alta também é indicada se a colonoscopia não explicar a anemia.","fonte":"ACG Clinical Guideline: Management of IBS (Lacy BE et al., 2021); British Society of Gastroenterology guidelines on IBS (Vasant DH et al., Gut 2021)."},{"n":3,"sub":"Tratamento da SII","comp":"Escolher terapia para SII com dor predominante","tags":[],"rel":[],"enun":"Mulher de 34 anos com SII com predomínio de diarreia, diagnosticada pelos critérios de Roma IV e com exames iniciais normais. Já tentou ajustes gerais da dieta sem melhora. Seu principal problema é a dor abdominal recorrente. Qual opção tem melhor evidência?","ops":[[
