"Dieta pobre em FODMAP e tricíclico em dose baixa para a dor.","Correta: a dieta pobre em FODMAP reduz sintomas, e tricíclicos em dose baixa atuam como neuromoduladores para a dor."],["Corticoide oral por 8 semanas para reduzir a inflamação intestinal.","Errada: a SII não é doença inflamatória; corticoide não tem papel."],["Antibioticoterapia prolongada com ciprofloxacino por 3 meses.","Errada: não há indicação; o antibiótico com evidência na SII-D é a rifaximina em curso curto."],["Colectomia segmentar do sigmoide após confirmar dor persistente.","Errada: a SII não tem indicação cirúrgica."]],"conc":"O tratamento da SII é guiado pelo subtipo e pelo sintoma predominante: dieta (baixo FODMAP, fibras solúveis), antiespasmódicos, neuromoduladores (tricíclicos em dose baixa), rifaximina na SII-D, secretagogos na SII-C e terapias psicológicas.","rac":"Dor predominante na SII-D: tricíclico em dose baixa tem efeito analgésico visceral e reduz a frequência evacuatória. A dieta pobre em FODMAP, com reintrodução gradual, complementa.","pista":"Dor como sintoma principal e predomínio de diarreia.","mud":"Na SII com constipação, preferem-se fibras solúveis (psyllium) e secretagogos como linaclotida.","cmp":"SII-D: loperamida, rifaximina, tricíclico. SII-C: psyllium, linaclotida, ISRS (efeito pró-cinético leve).","arm":"Usar tricíclico em SII com constipação, piorando o quadro.","regra":"SII: trate o sintoma que domina e explique a doença ao paciente.","cf":"Terapia cognitivo-comportamental e hipnoterapia dirigida ao intestino também têm evidência em SII refratária.","fonte":"ACG Clinical Guideline: Management of IBS (Lacy BE et al., Am J Gastroenterol 2021;116:17-44)."},{"n":4,"sub":"Calprotectina fecal","comp":"Diferenciar SII de doença inflamatória","tags":[],"rel":[],"enun":"Homem de 26 anos com diarreia há 4 meses, 4 evacuações por dia, dor abdominal e um episódio de despertar noturno para evacuar. Hemograma e sorologia para celíaca normais. A calprotectina fecal é de 480 µg/g. Qual é a interpretação?","ops":[["Sugere inflamação intestinal; está indicada ileocolonoscopia.","Correta: calprotectina alta indica inflamação da mucosa e direciona para investigação de DII."],["Calprotectina elevada é comum na SII e não muda a conduta.","Errada: a SII não cursa com inflamação mucosa significativa; calprotectina alta afasta o diagnóstico funcional."],["Calprotectina elevada confirma doença de Crohn, dispensando colonoscopia.","Errada: é marcador inespecífico de inflamação (infecções, AINE, neoplasia); não confirma DII."],["Deve-se repetir a calprotectina em 12 meses antes de decidir.","Errada: com sintoma noturno e calprotectina alta, a investigação é imediata."]],"conc":"A calprotectina é proteína de neutrófilos liberada nas fezes quando há inflamação intestinal. Valores baixos (geralmente abaixo de 50 µg/g) tornam DII improvável; valores altos indicam inflamação.","rac":"Despertar noturno para evacuar é sinal de alarme, e a calprotectina alta reforça inflamação orgânica. A próxima etapa é ileocolonoscopia com biópsias.","pista":"Calprotectina muito acima do limite, com sintoma noturno.","mud":"Calprotectina abaixo de 50 µg/g, sem alarme, reforçaria o diagnóstico de SII.","cmp":"Calprotectina normal: sustenta SII. Elevada: investigar DII, infecção, AINE ou neoplasia.","arm":"Considerar a calprotectina um exame diagnóstico específico de DII.","regra":"Calprotectina alta: olhe a mucosa.","cf":"Na DII estabelecida, a calprotectina também é usada para monitorar a atividade e a resposta ao tratamento.","fonte":"ECCO-ESGAR Guideline for Diagnostic Assessment in IBD (Maaser C et al., J Crohns Colitis 2019); ACG IBS 2021."},{"n":5,"sub":"Crohn versus retocolite","comp":"Diferenciar doença de Crohn de retocolite ulcerativa","tags":[],"rel":[],"enun":"Homem de 23 anos, tabagista, com dor em fossa ilíaca direita, diarreia sem sangue, perda de peso e fístula perianal. A ileocolonoscopia mostra úlceras aftoides no íleo terminal e áreas de mucosa normal intercaladas com úlceras no cólon; a biópsia mostra granulomas não caseosos. Qual é o diagnóstico?","ops":[["Doença de Crohn ileocolônica com doença perianal.","Correta: acometimento ileal, lesões salteadas, fístula perianal, inflamação transmural e granulomas são típicos de Crohn."],["Retocolite ulcerativa extensa com ileíte de refluxo.","Errada: a retocolite é contínua a partir do reto, mucosa, e não causa fístulas nem granulomas."],["Tuberculose intestinal, pela presença de granulomas.","Errada: na tuberculose os granulomas tendem a ser caseosos e confluentes; fístula perianal e lesões salteadas apontam para Crohn."],["Colite isquêmica do cólon direito.","Errada: a colite isquêmica ocorre em idosos com fatores vasculares e não forma granulomas nem fístulas."]],"conc":"Crohn pode acometer qualquer segmento da boca ao ânus, com lesões salteadas e inflamação transmural, levando a fístulas, estenoses e abscessos; granulomas não caseosos são achado característico. O tabagismo piora o Crohn e protege contra a retocolite.","rac":"Some as pistas: íleo terminal, lesões salteadas, perianal, granulomas e tabagismo. Todas apontam para Crohn.","pista":"Fístula perianal com lesões salteadas e granulomas não caseosos.","mud":"Inflamação contínua a partir do reto, restrita à mucosa, com diarreia sanguinolenta e tenesmo, indicaria retocolite.","cmp":"Crohn: transmural, salteada, íleo, fístulas, ASCA. Retocolite: mucosa, contínua, reto, sangue, p-ANCA.","arm":"Considerar o tabagismo fator protetor para o Crohn (ele protege na retocolite).","regra":"Fístula e granuloma: pense em Crohn.","cf":"Em área endêmica, antes de imunossuprimir, é importante excluir tuberculose intestinal.","fonte":"ECCO Guidelines on Crohn's Disease: Medical Treatment (Gordon H et al., J Crohns Colitis 2024); ECCO-ESGAR Diagnostic Guideline (Maaser C et al., 2019)."},{"n":6,"sub":"Colite aguda grave","comp":"Conduzir retocolite grave pelos critérios de Truelove-Witts","tags":[],"rel":[],"enun":"Mulher de 31 anos com retocolite ulcerativa tem 9 evacuações com sangue por dia, frequência cardíaca de 108 bpm, temperatura de 38,1 °C, hemoglobina de 9,8 g/dL e PCR elevada. Qual é a conduta inicial?","ops":[["Internação, corticoide intravenoso e profilaxia de tromboembolismo.","Correta: colite aguda grave exige corticoide intravenoso, profilaxia de TEV, exclusão de infecção e avaliação de resposta no terceiro dia."],["Mesalazina oral em dose alta e acompanhamento ambulatorial semanal.","Errada: a colite grave tem risco de megacólon e perfuração; exige internação e corticoide intravenoso."],["Loperamida e opioide para controlar a diarreia e a dor.","Errada: antidiarreicos e opioides podem precipitar megacólon tóxico na colite grave."],["Colectomia total de urgência no primeiro dia de internação.","Errada: a cirurgia é reservada a perfuração, megacólon que não melhora, hemorragia maciça ou falha do resgate clínico."]],"conc":"Truelove-Witts: colite grave com 6 ou mais evacuações com sangue por dia mais ao menos um sinal sistêmico (FC acima de 90, temperatura acima de 37,8 °C, hemoglobina abaixo de 10,5 g/dL, VHS acima de 30 ou PCR elevada).","rac":"Há mais de 6 evacuações com sangue e sinais sistêmicos: colite aguda grave. Corticoide intravenoso (hidrocortisona ou metilprednisolona), heparina profilática, pesquisa de C. difficile e CMV conforme o caso. Sem resposta no terceiro dia: resgate com infliximabe ou ciclosporina ou cirurgia.","pista":"Taquicardia, febre e anemia em paciente com muitas evacuações sanguinolentas.","mud":"Até 4 evacuações por dia sem sinais sistêmicos seria colite leve, tratável ambulatorialmente com mesalazina.","cmp":"Leve: até 4 evacuações. Grave: 6 ou mais com toxicidade sistêmica.","arm":"Usar antidiarreico em colite grave.","regra":"Colite grave: interne, corticoide intravenoso, heparina e reavalie no terceiro dia.","cf":"O sangramento intestinal não contraindica a profilaxia farmacológica de TEV, pois o risco trombótico na DII ativa é alto.","fonte":"ECCO Guidelines on Ulcerative Colitis: Medical Treatment (Raine T et al., J Crohns Colitis 2022;16:2-17)."},{"n":7,"sub":"Proctite ulcerativa","comp":"Escolher a terapia na retocolite distal leve","tags":[],"rel":[],"enun":"Homem de 36 anos com sangramento retal, tenesmo e urgência. A colonoscopia mostra inflamação contínua restrita aos 12 cm distais do reto (proctite), atividade leve a moderada. Qual é o tratamento de primeira linha?","ops":[["Mesalazina em supositório retal diariamente.","Correta: na proctite, o 5-ASA tópico em supositório é a terapia mais eficaz e de primeira linha."],["Mesalazina oral isolada, pois a via oral alcança todo o cólon.","Errada: a via oral isolada é menos eficaz que o tópico na proctite; pode ser associada, não substituir."],["Infliximabe intravenoso como terapia inicial.","Errada: biológicos são reservados a doença moderada a grave refratária ou dependente de corticoide."],["Corticoide sistêmico em dose alta por 12 semanas.","Errada: corticoide sistêmico não é primeira linha na proctite leve, e o uso prolongado é inadequado."]],"conc":"Na retocolite ulcerativa, a extensão (Montreal E1 proctite, E2 colite esquerda, E3 extensa) define a via do 5-ASA. Na proctite, supositório; na colite esquerda, enema associado a 5-ASA oral; na extensa, oral associado a tópico.","rac":"Inflamação restrita ao reto e atividade leve a moderada: mesalazina supositório 1 g por dia. Se não houver resposta, associar oral ou corticoide tópico.","pista":"Extensão restrita ao reto.","mud":"Colite extensa moderada exigiria 5-ASA oral em dose alta associado a tópico; refratariedade levaria a corticoide e imunobiológicos.","cmp":"Supositório alcança o reto; enema alcança até a flexura esplênica.","arm":"Prescrever apenas 5-ASA oral na proctite.","regra":"Proctite: supositório de mesalazina.","cf":"A mesalazina também é usada na manutenção, na mesma via que induziu remissão.","fonte":"ECCO Guidelines on Ulcerative Colitis (Raine T et al., 2022); ACG Clinical Guideline: Ulcerative Colitis in Adults (Rubin DT et al., Am J Gastroenterol 2019)."},{"n":8,"sub":"Colangite esclerosante primária","comp":"Reconhecer a manifestação hepatobiliar da retocolite","tags":[],"rel":[],"enun":"Homem de 30 anos com retocolite ulcerativa extensa em remissão apresenta fosfatase alcalina e GGT elevadas há 6 meses, com transaminases pouco alteradas e prurido. Ultrassonografia sem cálculos ou dilatação. Qual exame confirma a principal hipótese?","ops":[["Colangiorressonância, com estenoses e dilatações alternadas das vias biliares.","Correta: a colangite esclerosante primária, associada à retocolite, é diagnosticada pela colangiorressonância com aspecto de contas de rosário."],["Biópsia hepática, obrigatória para o diagnóstico inicial.","Errada: a biópsia fica para suspeita de CEP de pequenos ductos ou sobreposição com hepatite autoimune."],["Anticorpo antimitocôndria, que confirma o diagnóstico quando positivo.","Errada: o antimitocôndria é marcador de colangite biliar primária, mais comum em mulheres, não de CEP."],["Ultrassonografia com Doppler hepático, suficiente para o diagnóstico.","Errada: a ultrassonografia não define as estenoses biliares típicas da CEP."]],"conc":"A colangite esclerosante primária é inflamação e fibrose das vias biliares intra e extra-hepáticas. Cerca de 70% dos pacientes têm DII, sobretudo retocolite. Aumenta o risco de colangiocarcinoma e de câncer colorretal.","rac":"Colestase (FA e GGT elevadas) em paciente com retocolite: suspeita de CEP. Colangiorressonância mostra estenoses multifocais com dilatações (contas de rosário).","pista":"Padrão colestático em homem jovem com retocolite.","mud":"Mulher de meia-idade com antimitocôndria positivo sugeriria colangite biliar primária.","cmp":"CEP: homem, retocolite, colangiorressonância. CBP: mulher, antimitocôndria, ductos intra-hepáticos pequenos.","arm":"Esquecer que CEP associada à retocolite exige colonoscopia anual a partir do diagnóstico.","regra":"Retocolite com colestase: colangiorressonância.","cf":"Esses pacientes têm vigilância colonoscópica anual pelo risco elevado de câncer colorretal.","fonte":"ECCO Guideline on Extraintestinal Manifestations in IBD (Gordon H et al., J Crohns Colitis 2024); AASLD Practice Guidance on PSC (Bowlus CL et al., Hepatology 2023)."},{"n":9,"sub":"Litíase na doença de Crohn","comp":"Explicar a hiperoxalúria entérica","tags":[],"rel":[],"enun":"Paciente de 40 anos com doença de Crohn e ressecção de 80 cm de íleo terminal apresenta cólica renal. O cálculo eliminado é de oxalato de cálcio. Qual é o mecanismo mais provável?","ops":[["Gordura não absorvida sequestra o cálcio e deixa oxalato livre para absorção.","Correta: na hiperoxalúria entérica, a gordura não absorvida sequestra o cálcio; o oxalato livre é absorvido no cólon e excretado na urina."],["Excesso de cálcio na dieta, que eleva a calciúria.","Errada: o cálcio da dieta reduz a absorção de oxalato; a restrição de cálcio piora a hiperoxalúria."],["Infecção urinária por germes produtores de urease.","Errada: germes produtores de urease formam cálculos de estruvita, não de oxalato de cálcio."],["Hiperparatireoidismo primário associado à doença de Crohn.","Errada: não há associação entre Crohn e hiperparatireoidismo; o mecanismo é intestinal."]],"conc":"A ressecção ou doença ileal extensa reduz a reabsorção de sais biliares e causa esteatorreia. Os ácidos graxos se ligam ao cálcio, liberando oxalato, que é absorvido no cólon. Também há maior risco de cálculos biliares e deficiência de vitamina B12.","rac":"Íleo ressecado leva a má absorção de sais biliares e gordura. Gordura sequestra cálcio, oxalato fica livre, é absorvido e precipita na urina como oxalato de cálcio.","pista":"Ressecção ileal extensa com cálculo de oxalato de cálcio.","mud":"Com cólon também ressecado (ileostomia), o mecanismo passaria a ser desidratação e cálculos de ácido úrico.","cmp":"Íleo: B12, sais biliares, oxalato. Cólon intacto: necessário para absorver o oxalato.","arm":"Restringir cálcio da dieta para prevenir cálculo de oxalato.","regra":"Íleo ressecado com cólon presente: hiperoxalúria entérica.","cf":"A prevenção inclui dieta pobre em gordura e oxalato, suplemento de cálcio com as refeições e hidratação.","fonte":"EAU Guidelines on Urolithiasis (Skolarikos A et al., EAU 2024); ECCO Crohn's Disease guidelines (Gordon H et al., 2024)."},{"n":10,"sub":"Antes do anti-TNF","comp":"Rastrear infecções antes de imunobiológico","tags":[],"rel":[],"enun":"Mulher de 28 anos com doença de Crohn moderada a grave, dependente de corticoide, iniciará infliximabe. Qual rastreio é obrigatório antes da primeira dose?","ops":[["Tuberculose latente e sorologias para hepatites B e C e HIV.","Correta: anti-TNF pode reativar tuberculose e hepatite B; o rastreio prévio é obrigatório."],["Colonoscopia de rastreio para câncer colorretal.","Errada: não é pré-requisito para anti-TNF; a vigilância oncológica segue critérios próprios."],["Densitometria óssea e dosagem de vitamina D como condição para iniciar.","Errada: são úteis em usuários de corticoide, mas não condicionam o início do anti-TNF."],["Dosagem de anticorpos anti-infliximabe antes da primeira infusão.","Errada: anticorpos antidroga surgem após exposição; não há sentido em dosá-los antes."]],"conc":"Os anti-TNF (infliximabe, adalimumabe) aumentam o risco de infecções, sobretudo tuberculose (reativação de infecção latente) e hepatite B. O rastreio inclui ILTB, HBV, HCV, HIV e atualização vacinal (vacinas vivas antes de iniciar).","rac":"Antes do anti-TNF: prova tuberculínica ou IGRA e radiografia; HBsAg, anti-HBc e anti-HBs; anti-HCV; anti-HIV. ILTB positiva: iniciar tratamento da ILTB antes do biológico, conforme protocolo.","pista":"Início de anti-TNF.","mud":"ILTB positiva levaria a iniciar o tratamento da infecção latente e começar o biológico após o período recomendado pelo protocolo local.","cmp":"Vacinas vivas: aplicar antes do imunossupressor. Inativadas: podem ser aplicadas durante o tratamento.","arm":"Iniciar o anti-TNF sem rastrear tuberculose em país de alta incidência.","regra":"Antes do anti-TNF: tuberculose, hepatite B, hepatite C e HIV.","cf":"No Brasil, o protocolo do Ministério da Saúde orienta o tratamento da ILTB antes do imunobiológico.","fonte":"ECCO Guidelines on the Prevention, Diagnosis and Management of Infections in IBD (Kucharzik T et al., J Crohns Colitis 2021); Brasil. MS. Manual de Recomendações para o Controle da Tuberculose, 2ª ed., 2019."}]},{"id":"M05","titulo":"Parasitoses (nematelmintos)","bloco":1,"q":[{"n":1,"sub":"Síndrome de Löeffler","comp":"Reconhecer o ciclo pulmonar dos nematódeos","tags":[],"rel":[],"enun":"Criança de 7 anos, de área rural, apresenta tosse seca, sibilância e febre baixa há 1 semana. Radiografia com infiltrados pulmonares migratórios e hemograma com eosinofilia de 18%. O exame parasitológico de fezes é negativo. Qual é a explicação mais provável?","ops":[["Síndrome de Löeffler por migração pulmonar de larvas de Ascaris.","Correta: no ciclo de Löeffler, as larvas passam pelos pulmões antes de chegar ao intestino; o EPF ainda é negativo porque não há vermes adultos produzindo ovos."],["Pneumonia bacteriana típica, que causa eosinofilia reacional.","Errada: pneumonia bacteriana cursa com neutrofilia, não com eosinofilia marcante e infiltrados migratórios."],["Infecção por Enterobius vermicularis com acometimento pulmonar.","Errada: o Enterobius não tem ciclo pulmonar; seu ciclo é exclusivamente intestinal."],["Giardíase com manifestação respiratória alérgica.","Errada: a Giardia é protozoário intestinal sem ciclo pulmonar e não causa eosinofilia relevante."]],"conc":"Ascaris, ancilostomídeos e Strongyloides fazem ciclo pulmonar (ciclo de Löeffler). A passagem das larvas causa pneumonite eosinofílica transitória, com tosse, sibilância, infiltrados migratórios e eosinofilia.","rac":"Sintomas respiratórios, infiltrados migratórios e eosinofilia com EPF negativo indicam fase larval: os ovos aparecem nas fezes semanas depois, quando os adultos estão no intestino.","pista":"Eosinofilia com infiltrado migratório e EPF ainda negativo.","mud":"EPF com ovos de Ascaris semanas depois confirmaria a infecção intestinal estabelecida.","cmp":"Ciclo pulmonar: Ascaris, ancilostomídeos, Strongyloides. Sem ciclo pulmonar: Enterobius, Trichuris.","arm":"Descartar parasitose porque o EPF inicial foi negativo.","regra":"Tosse, sibilância e eosinofilia com infiltrado migratório: ciclo de Löeffler.","cf":"O quadro costuma ser autolimitado; repete-se o EPF após algumas semanas e trata-se a infecção intestinal.","fonte":"Brasil. Ministério da Saúde. Doenças infecciosas e parasitárias: guia de bolso, 8ª ed., 2010 (ascaridíase); Neves DP. Parasitologia Humana, 14ª ed."},{"n":2,"sub":"Suboclusão por Ascaris","comp":"Conduzir obstrução intestinal por novelo de áscaris","tags":[],"rel":[],"enun":"Criança de 5 anos, desnutrida, com cólicas, vômitos e distensão abdominal há 1 dia. Eliminou vermes cilíndricos longos nas fezes e no vômito. Palpa-se massa móvel em mesogástrio, sem sinais de peritonite. Qual é a conduta inicial?","ops":[["Jejum, sonda nasogástrica, hidratação, óleo mineral e piperazina.","Correta: na suboclusão por áscaris, o tratamento clínico inicial combina descompressão, hidratação, óleo mineral e piperazina, que paralisa os vermes."],["Albendazol em dose única imediatamente, para eliminar rapidamente os vermes.","Errada: na suboclusão, o albendazol não é a primeira escolha; o tratamento inicial é clínico com piperazina e óleo mineral."],["Laparotomia exploradora imediata para retirada do novelo.","Errada: a cirurgia é reservada a falha do tratamento clínico, obstrução completa, volvo ou peritonite."],["Enema baritado para reduzir o novelo de vermes.","Errada: o enema baritado não trata a obstrução no delgado e não é recomendado."]],"conc":"Em infecções maciças, especialmente em crianças, os áscaris podem formar novelo e causar suboclusão no íleo terminal. Outras complicações incluem migração para vias biliares (colangite, pancreatite) e apendicite.","rac":"Sem peritonite, inicia-se tratamento clínico: jejum, SNG, hidratação, óleo mineral e piperazina. Após a resolução, completa-se com anti-helmíntico (albendazol) e tratam-se os contatos.","pista":"Massa móvel sem peritonite em criança que elimina vermes.","mud":"Peritonite, sinais de isquemia ou falha do tratamento clínico indicariam cirurgia.","cmp":"Piperazina: paralisa e facilita a eliminação. Albendazol: ação mais lenta, usado após a suboclusão.","arm":"Indicar cirurgia imediata em toda suboclusão por áscaris.","regra":"Suboclusão por áscaris sem peritonite: tratamento clínico com piperazina e óleo mineral.","cf":"A migração do verme para o colédoco pode causar colangite e pancreatite.","fonte":"Brasil. Ministério da Saúde. Doenças infecciosas e parasitárias: guia de bolso, 8ª ed., 2010 (ascaridíase)."},{"n":3,"sub":"Ancilostomíase","comp":"Relacionar parasitose e anemia ferropriva","tags":[],"rel":[],"enun":"Lavrador de 40 anos, que trabalha descalço, tem cansaço progressivo e palidez. Hemoglobina 7,8 g/dL, VCM 68 fL, ferritina baixa e eosinofilia leve. O EPF mostra ovos de casca fina com blastômeros. Qual é o parasita e o mecanismo da anemia?","ops":[["Ancilostomídeo, por perda sanguínea crônica no intestino delgado.","Correta: Necator e Ancylostoma se fixam na mucosa e sugam sangue, causando anemia ferropriva crônica."],["Ascaris lumbricoides, por competição pelos nutrientes da dieta.","Errada: o Ascaris pode causar desnutrição, mas não é causa de anemia ferropriva importante por sangramento."],["Strongyloides stercoralis, por hemólise intravascular.","Errada: o Strongyloides não causa hemólise; seu diagnóstico é pela larva nas fezes, não por ovos."],["Enterobius vermicularis, por sangramento perianal.","Errada: o Enterobius causa prurido anal; não provoca anemia ferropriva relevante."]],"conc":"Os ancilostomídeos penetram pela pele (geralmente pés descalços), fazem ciclo pulmonar e se fixam no delgado, onde espoliam sangue. A consequência clássica é anemia ferropriva, além de hipoproteinemia em infecções intensas.","rac":"Exposição ao solo descalço, anemia microcítica ferropriva e ovos de casca fina no EPF: ancilostomíase. Tratamento com albendazol 400 mg dose única e reposição de ferro.","pista":"Trabalho descalço no solo e anemia ferropriva.","mud":"Larvas, e não ovos, no exame de fezes apontariam para Strongyloides.","cmp":"Ancilostomídeo: penetra a pele, suga sangue, anemia ferropriva. Ascaris: ingestão de ovos, obstrução.","arm":"Tratar apenas com ferro, sem eliminar a causa da perda.","regra":"Anemia ferropriva em quem anda descalço na terra: pense em ancilostomíase.","cf":"A prevenção inclui uso de calçados e saneamento básico.","fonte":"Brasil. Ministério da Saúde. Doenças infecciosas e parasitárias: guia de bolso, 8ª ed., 2010 (ancilostomíase)."},{"n":4,"sub":"Hiperinfecção por Strongyloides","comp":"Reconhecer estrongiloidíase disseminada no imunossuprimido","tags":[],"rel":[],"enun":"Homem de 62 anos, natural de área endêmica, em uso de prednisona 40 mg por dia há 2 meses por doença pulmonar, apresenta diarreia, dispneia, infiltrado pulmonar difuso e meningite por bacilo gram-negativo. Qual é a hipótese e o tratamento antiparasitário?","ops":[["Síndrome de hiperinfecção por Strongyloides stercoralis; ivermectina.","Correta: o corticoide favorece a autoinfecção maciça; as larvas carregam bactérias entéricas, causando sepse e meningite por gram-negativos."],["Ascaridíase maciça com obstrução; piperazina.","Errada: a ascaridíase não causa disseminação com meningite por gram-negativos em imunossuprimidos."],["Ancilostomíase grave com anemia; albendazol 400 mg em dose única por via oral.","Errada: a ancilostomíase não causa síndrome de hiperinfecção; e o albendazol em dose única não trata o Strongyloides."],["Esquistossomose aguda; praziquantel.","Errada: a esquistossomose não se relaciona a hiperinfecção desencadeada por corticoide com bacteremia por gram-negativos."]],"conc":"O Strongyloides stercoralis é capaz de autoinfecção. Em imunossupressão, sobretudo por corticoide e infecção por HTLV-1, ocorre hiperinfecção e disseminação, com alta mortalidade e infecções por bactérias entéricas.","rac":"Corticoide em paciente de área endêmica, quadro pulmonar e intestinal, sepse e meningite por gram-negativo: hiperinfecção por Strongyloides. Tratamento com ivermectina, redução da imunossupressão e antibióticos.","pista":"Uso de corticoide com meningite por gram-negativo.","mud":"Em paciente imunocompetente com eosinofilia isolada, a estrongiloidíase seria crônica, leve e tratada com ivermectina ambulatorial.","cmp":"Strongyloides: larva nas fezes, autoinfecção, ivermectina. Outros nematódeos: ovos nas fezes, albendazol.","arm":"Iniciar corticoide em paciente de área endêmica sem rastrear ou tratar Strongyloides.","regra":"Corticoide mais área endêmica: lembre do Strongyloides.","cf":"Antes de imunossupressão prolongada em área endêmica, recomenda-se rastreio ou tratamento empírico com ivermectina.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (estrongiloidíase); CDC. Strongyloidiasis — Resources for Health Professionals."},{"n":5,"sub":"Enterobíase","comp":"Diagnosticar e tratar oxiuríase","tags":[],"rel":[],"enun":"Menina de 6 anos tem prurido anal intenso à noite, insônia e irritabilidade. Outras crianças da creche têm queixa semelhante. O EPF de rotina é negativo. Qual exame tem maior rendimento?","ops":[["Método da fita adesiva (Graham) pela manhã, antes da higiene.","Correta: a fêmea do Enterobius deposita ovos na região perianal à noite; a fita adesiva os captura."],["Repetir o EPF pelo método de Hoffmann em três amostras colhidas em dias alternados.","Errada: os ovos de Enterobius raramente aparecem nas fezes; o EPF tem baixa sensibilidade."],["Método de Baermann-Moraes, que concentra larvas.","Errada: o Baermann-Moraes pesquisa larvas de Strongyloides, não ovos de Enterobius."],["Sorologia para helmintos.","Errada: não há sorologia útil para o diagnóstico de enterobíase."]],"conc":"O Enterobius vermicularis tem ciclo exclusivamente intestinal. As fêmeas migram à noite para a região perianal para depositar ovos, causando prurido. A autoinfecção mão-boca e a transmissão entre contactantes são frequentes.","rac":"Prurido anal noturno em criança de creche: enterobíase. Diagnóstico pela fita adesiva pela manhã. Tratamento com albendazol ou mebendazol, repetido em 2 semanas, tratando os contactantes do domicílio.","pista":"Prurido anal noturno em contexto coletivo.","mud":"Prurido anal sem padrão noturno, com lesões cutâneas, sugeriria dermatite ou outras causas.","cmp":"Fita adesiva: Enterobius. Baermann-Moraes: Strongyloides. Kato-Katz: Schistosoma.","arm":"Confiar no EPF negativo para excluir oxiuríase.","regra":"Prurido anal noturno: fita adesiva de Graham.","cf":"Repetir a dose após 2 semanas cobre os vermes que eclodiram de ovos ingeridos após a primeira dose.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (enterobíase); CDC DPDx — Enterobiasis."},{"n":6,"sub":"Tricuríase","comp":"Associar parasitose a prolapso retal","tags":[],"rel":[],"enun":"Criança de 4 anos, de área sem saneamento, apresenta diarreia com muco e sangue, tenesmo, anemia e episódios de prolapso retal. O EPF mostra ovos em forma de barril com tampões polares. Qual é o diagnóstico?","ops":[["Tricuríase (Trichuris trichiura) de alta carga parasitária.","Correta: ovos em barril com tampões polares e prolapso retal em criança são característicos de tricuríase intensa."],["Enterobíase, que causa prolapso retal pelo prurido anal noturno intenso.","Errada: o Enterobius causa prurido perianal, mas não prolapso retal nem ovos em barril."],["Ancilostomíase, pela presença de anemia.","Errada: os ovos de ancilostomídeo são ovais de casca fina, sem tampões polares."],["Teníase, pela eliminação de proglotes.","Errada: a teníase não causa prolapso e não há ovos em barril."]],"conc":"O Trichuris trichiura habita o cólon e o reto. Em infecções maciças, causa colite, disenteria, anemia, retardo de crescimento e prolapso retal, no qual os vermes podem ser vistos na mucosa.","rac":"Ovos em barril com tampões polares, colite e prolapso retal: tricuríase de alta carga. Tratamento com albendazol (o esquema de 3 dias é mais eficaz) ou mebendazol.","pista":"Ovos em forma de barril com tampões polares.","mud":"Ovos com espículo lateral fariam pensar em Schistosoma mansoni.","cmp":"Tricuríase: cólon, prolapso retal, ovo em barril. Ancilostomíase: delgado, anemia ferropriva, ovo de casca fina.","arm":"Atribuir o prolapso à constipação e não pesquisar parasitose.","regra":"Prolapso retal em criança de área sem saneamento: pense em Trichuris.","cf":"A melhora do saneamento e a desparasitação periódica de escolares reduzem a carga parasitária.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (tricuríase); CDC DPDx — Trichuriasis."},{"n":7,"sub":"Método diagnóstico","comp":"Escolher o exame para pesquisa de Strongyloides","tags":[],"rel":[],"enun":"Paciente com eosinofilia persistente e suspeita de estrongiloidíase teve três EPF pelo método de Hoffmann (sedimentação espontânea) negativos. Qual método parasitológico é mais sensível para essa hipótese?","ops":[["Método de Baermann-Moraes, que concentra larvas.","Correta: o Baermann-Moraes concentra larvas vivas e é o método parasitológico de escolha para Strongyloides."],["Método de Kato-Katz, que quantifica ovos.","Errada: o Kato-Katz é usado para ovos de Schistosoma e outros helmintos, não para larvas de Strongyloides."],["Método de Graham, com fita adesiva perianal.","Errada: a fita adesiva é usada para Enterobius."],["Coloração de Ziehl-Neelsen modificada.","Errada: é usada para coccídeos como Cryptosporidium e Cystoisospora, não para Strongyloides."]],"conc":"O Strongyloides elimina larvas, não ovos, nas fezes, e de forma intermitente. Métodos que concentram larvas (Baermann-Moraes, cultura em placa de ágar) são mais sensíveis; sorologia também pode ser usada.","rac":"Hoffmann pesquisa ovos e cistos por sedimentação. Para larvas, usa-se Baermann-Moraes ou Rugai, que se baseiam na migração das larvas para a água morna.","pista":"Hipótese de Strongyloides com EPF convencional negativo.","mud":"Hipótese de esquistossomose levaria ao Kato-Katz; de Enterobius, à fita adesiva.","cmp":"Baermann-Moraes e Rugai: larvas. Hoffmann (HPJ): ovos e cistos. Kato-Katz: ovos, quantitativo. Faust: cistos de protozoários.","arm":"Pedir apenas EPF de rotina para Strongyloides.","regra":"Larva nas fezes? Baermann-Moraes.","cf":"Em imunossuprimidos, sorologia positiva já justifica tratamento com ivermectina.","fonte":"Neves DP. Parasitologia Humana, 14ª ed.; CDC DPDx — Strongyloidiasis."},{"n":8,"sub":"Larva migrans visceral","comp":"Reconhecer toxocaríase","tags":[],"rel":[],"enun":"Menino de 3 anos, com hábito de comer terra e convívio com filhotes de cães, apresenta febre baixa, hepatomegalia, sibilância e eosinofilia de 40%. O EPF é negativo. Qual é a hipótese e o exame confirmatório?","ops":[["Toxocaríase; sorologia por ELISA para Toxocara.","Correta: o ser humano é hospedeiro acidental; as larvas migram pelos tecidos sem chegar a vermes adultos, por isso o EPF é negativo."],["Ascaridíase; repetir o EPF em três amostras.","Errada: na toxocaríase não há vermes adultos no intestino humano; o EPF permanece negativo."],["Esquistossomose aguda; Kato-Katz.","Errada: não há relato de contato com água doce, e a idade e a geofagia apontam para Toxocara."],["Leucemia aguda; mielograma imediato.","Errada: eosinofilia extrema com geofagia e contato com cães sugere toxocaríase; leucemia não é a principal hipótese."]],"conc":"A toxocaríase é causada por larvas de Toxocara canis ou cati, ingeridas com ovos do solo contaminado por fezes de cães e gatos. A forma visceral causa febre, hepatomegalia, sintomas pulmonares e eosinofilia intensa; a forma ocular causa lesão retiniana.","rac":"Geofagia, filhotes, eosinofilia extrema e EPF negativo: larva migrans visceral. A sorologia por ELISA confirma. O tratamento é albendazol, com corticoide nas formas oculares.","pista":"Geofagia e contato com filhotes de cães.","mud":"Leucocoria ou baixa visual unilateral sugeririam forma ocular, que exige avaliação oftalmológica.","cmp":"Larva migrans visceral: Toxocara, ingestão de ovos. Larva migrans cutânea: Ancylostoma braziliense, penetração na pele.","arm":"Esperar o EPF positivo para confirmar toxocaríase.","regra":"Eosinofilia alta, geofagia e cachorro: Toxocara.","cf":"A desverminação de cães e gatos e o controle da geofagia previnem a doença.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (toxocaríase); CDC. Toxocariasis — Resources for Health Professionals."},{"n":9,"sub":"Larva migrans cutânea","comp":"Tratar bicho geográfico","tags":[],"rel":[],"enun":"Adulto retorna de férias na praia com lesão linear, serpiginosa e muito pruriginosa no pé, que avança alguns milímetros por dia. Qual é a conduta mais adequada?","ops":[["Ivermectina ou albendazol por via oral.","Correta: a larva migrans cutânea responde a ivermectina ou albendazol orais; o tiabendazol tópico pode ser usado em poucas lesões."],["Corticoide tópico de alta potência isolado.","Errada: o corticoide reduz o prurido, mas não elimina a larva."],["Antibiótico sistêmico para celulite.","Errada: não se trata de infecção bacteriana, salvo infecção secundária."],["Excisão cirúrgica da extremidade da lesão.","Errada: a remoção cirúrgica não é recomendada; a larva costuma estar além da lesão visível."]],"conc":"A larva migrans cutânea (bicho geográfico) é causada pela penetração de larvas de ancilostomídeos de cães e gatos (Ancylostoma braziliense) na pele. O ser humano é hospedeiro acidental e a larva não completa o ciclo.","rac":"Lesão serpiginosa, pruriginosa e migratória após contato com areia: larva migrans cutânea. Tratamento com ivermectina ou albendazol orais.","pista":"Lesão linear que avança e contato com areia de praia.","mud":"Lesão urticariforme migratória rápida (centímetros por hora) na região perianal e glútea sugeriria larva currens do Strongyloides.","cmp":"Larva migrans cutânea: avança milímetros por dia, pés. Larva currens: avança rápido, perianal, Strongyloides.","arm":"Tratar com corticoide isolado ou antibiótico.","regra":"Bicho geográfico: ivermectina ou albendazol.","cf":"A prevenção é evitar contato com areia onde circulam cães e gatos.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (larva migrans cutânea); CDC. Zoonotic Hookworm."},{"n":10,"sub":"Escolha do anti-helmíntico","comp":"Reconhecer o espectro do albendazol em dose única","tags":[],"rel":[],"enun":"Em campanha de desparasitação, administra-se albendazol 400 mg em dose única a escolares. Qual parasita é tratado de forma inadequada por esse esquema?","ops":[["Strongyloides stercoralis, que exige ivermectina.","Correta: o albendazol em dose única tem baixa eficácia para Strongyloides; a ivermectina é o tratamento de escolha."],["Ascaris lumbricoides, que exige esquema de 7 dias.","Errada: o albendazol 400 mg em dose única tem alta eficácia contra Ascaris."],["Ancilostomídeos, que só respondem ao praziquantel.","Errada: o albendazol é eficaz contra ancilostomídeos; o praziquantel é usado contra platelmintos."],["Enterobius vermicularis, que não responde a benzimidazóis.","Errada: o Enterobius responde ao albendazol ou mebendazol, repetidos em 2 semanas."]],"conc":"O albendazol é benzimidazol de amplo espectro contra nematódeos intestinais. A dose única de 400 mg é eficaz para Ascaris e ancilostomídeos e menos eficaz para Trichuris. Para Strongyloides, a ivermectina é superior.","rac":"Liste os nematódeos e a droga de escolha: Ascaris, ancilostomídeo e Enterobius respondem ao albendazol; Strongyloides, ivermectina; platelmintos, praziquantel.","pista":"O Strongyloides tem autoinfecção e exige droga com maior eficácia larvicida.","mud":"Para Trichuris, esquemas de 3 dias de albendazol ou combinação com ivermectina aumentam a taxa de cura.","cmp":"Nematódeos: albendazol (exceto Strongyloides: ivermectina). Platelmintos: praziquantel (cisticercose: albendazol).","arm":"Achar que a desparasitação em massa com albendazol trata a estrongiloidíase.","regra":"Strongyloides se trata com ivermectina.","cf":"A ivermectina é contraindicada em gestantes e em crianças com menos de 15 kg.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010; WHO. Preventive chemotherapy to control soil-transmitted helminth infections, 2017."}]},{"id":"M06","titulo":"Platelmintos","bloco":1,"q":[{"n":1,"sub":"Esquistossomose aguda","comp":"Reconhecer a febre de Katayama","tags":[],"rel":[],"enun":"Estudante de 22 anos, de Belo Horizonte, nadou em lagoa no interior de Minas Gerais. Três dias depois teve prurido e pápulas nas pernas; 5 semanas depois surgiram febre, tosse seca, urticária, diarreia, hepatoesplenomegalia dolorosa e eosinofilia de 35%. Qual é a hipótese mais provável?","ops":[["Esquistossomose aguda (febre de Katayama).","Correta: dermatite cercariana inicial seguida, semanas depois, de febre, urticária, tosse e eosinofilia após contato com água doce caracteriza a forma aguda."],["Leptospirose, pelo contato com água doce.","Errada: a leptospirose não causa dermatite cercariana nem eosinofilia intensa."],["Larva migrans cutânea com disseminação visceral.","Errada: a larva migrans cutânea fica restrita à pele e é adquirida em areia, não em lagoa."],["Hepatite A aguda.","Errada: a hepatite A não causa eosinofilia nem urticária com tosse após banho em lagoa."]],"conc":"Na esquistossomose, as cercárias penetram a pele em água doce (dermatite cercariana). A forma aguda ocorre 3 a 8 semanas depois, com a postura dos primeiros ovos: febre, cefaleia, tosse, urticária, diarreia, hepatoesplenomegalia e eosinofilia.","rac":"Contato com lagoa em área endêmica, prurido cutâneo inicial e, semanas depois, quadro sistêmico com eosinofilia: febre de Katayama.","pista":"Banho em água doce de área endêmica com eosinofilia intensa semanas depois.","mud":"Contato com enchente e mialgia em panturrilhas com icterícia sugeririam leptospirose.","cmp":"Fase aguda: febre, urticária, eosinofilia. Fase crônica: intestinal, hepatointestinal ou hepatoesplênica.","arm":"Esquecer a pergunta sobre contato com água doce em paciente febril com eosinofilia.","regra":"Febre com eosinofilia após lagoa em Minas Gerais: esquistossomose aguda.","cf":"O Kato-Katz pode ser negativo nas primeiras semanas; a sorologia ajuda, e o tratamento com praziquantel é repetido após a fase aguda.","fonte":"Brasil. Ministério da Saúde. Guia de Vigilância em Saúde, 6ª ed., 2023 (esquistossomose mansoni); Brasil. MS. Vigilância da esquistossomose mansoni: diretrizes técnicas, 4ª ed., 2014."},{"n":2,"sub":"Forma hepatoesplênica","comp":"Caracterizar a hipertensão portal esquistossomótica","tags":[],"rel":[],"enun":"Homem de 35 anos, natural do Vale do Jequitinhonha, tem hematêmese volumosa. Exame: esplenomegalia volumosa, sem icterícia, sem ascite e sem estigmas de insuficiência hepática. Albumina e INR normais. A ultrassonografia mostra fibrose periportal. Qual é a melhor explicação?","ops":[["Hipertensão portal pré-sinusoidal com função hepática preservada.","Correta: na esquistossomose hepatoesplênica, a fibrose periportal causa hipertensão portal pré-sinusoidal, varizes e esplenomegalia, com função hepatocelular preservada."],["Cirrose hepática alcoólica com hipertensão portal sinusoidal.","Errada: a cirrose cursaria com sinais de insuficiência hepatocelular, como hipoalbuminemia e coagulopatia."],["Trombose de veias supra-hepáticas (síndrome de Budd-Chiari).","Errada: Budd-Chiari é pós-sinusoidal, cursa com ascite volumosa e hepatomegalia dolorosa."],["Hepatite B crônica com cirrose compensada.","Errada: a fibrose periportal com função hepática preservada em área endêmica aponta para esquistossomose."]],"conc":"Os ovos de S. mansoni retidos nos ramos portais intra-hepáticos geram granulomas e fibrose periportal (de Symmers). Resulta hipertensão portal pré-sinusoidal, com esplenomegalia e varizes, mas sem insuficiência hepática.","rac":"Hemorragia varicosa com esplenomegalia grande e função hepática normal em área endêmica: esquistossomose hepatoesplênica. A ascite é rara porque a pressão sinusoidal é normal.","pista":"Varizes e esplenomegalia com albumina e INR normais.","mud":"Hipoalbuminemia, INR alargado e ascite indicariam hepatopatia parenquimatosa (cirrose).","cmp":"Pré-sinusoidal (esquistossomose): função preservada, ascite rara. Sinusoidal (cirrose): insuficiência hepática, ascite comum.","arm":"Diagnosticar cirrose em todo paciente com varizes de esôfago.","regra":"Esplenomegalia com varizes e fígado funcionante: esquistossomose.","cf":"O tratamento do sangramento é endoscópico; na profilaxia, ligadura elástica e betabloqueador, e a cirurgia (desconexão ázigo-portal com esplenectomia) é opção em casos selecionados.","fonte":"Brasil. Ministério da Saúde. Vigilância da esquistossomose mansoni: diretrizes técnicas, 4ª ed., 2014."},{"n":3,"sub":"Diagnóstico da esquistossomose","comp":"Escolher o exame parasitológico","tags":[],"rel":[],"enun":"Em inquérito em área endêmica do norte de Minas Gerais, deseja-se diagnosticar a esquistossomose mansoni e estimar a intensidade da infecção. Qual exame é o recomendado?","ops":[["Kato-Katz, que quantifica ovos com espículo lateral.","Correta: o Kato-Katz é quantitativo (ovos por grama de fezes) e é o método recomendado pelo Ministério da Saúde."],["Método de Baermann-Moraes, que concentra larvas.","Errada: o Baermann-Moraes é usado para Strongyloides; o Schistosoma elimina ovos."],["Método da fita adesiva perianal.","Errada: a fita adesiva serve para Enterobius."],["Exame de urina para ovos com espículo terminal.","Errada: espículo terminal na urina é S. haematobium, que não ocorre no Brasil."]],"conc":"O ovo de S. mansoni tem espículo lateral e é eliminado nas fezes. O Kato-Katz quantifica a carga parasitária e é o exame de escolha em inquéritos e na rotina; a biópsia retal é alternativa em baixa carga.","rac":"O objetivo é diagnosticar e quantificar ovos: Kato-Katz. Em baixa carga, repetem-se lâminas ou usam-se métodos complementares.","pista":"Necessidade de quantificar ovos.","mud":"Em paciente com forte suspeita e Kato-Katz repetidamente negativo, biópsia de mucosa retal ou sorologia podem ser usadas.","cmp":"S. mansoni: espículo lateral, fezes. S. haematobium: espículo terminal, urina, África.","arm":"Solicitar exame de urina para esquistossomose no Brasil.","regra":"Esquistossomose no Brasil: Kato-Katz nas fezes.","cf":"O ultrassom avalia a fibrose periportal, mas não confirma a infecção ativa.","fonte":"Brasil. Ministério da Saúde. Vigilância da esquistossomose mansoni: diretrizes técnicas, 4ª ed., 2014."},{"n":4,"sub":"Tratamento da esquistossomose","comp":"Prescrever o praziquantel na dose correta","tags":[],"rel":[],"enun":"Homem de 30 anos, 70 kg, com Kato-Katz positivo para S. mansoni, assintomático. Segundo o Ministério da Saúde, qual é o tratamento?","ops":[["Praziquantel 50 mg/kg em dose única (crianças: 60 mg/kg).","Correta: o esquema do Ministério da Saúde é praziquantel 50 mg/kg para adultos e 60 mg/kg para crianças, em dose única."],["Albendazol 400 mg em dose única.","Errada: o albendazol não é eficaz contra Schistosoma."],["Ivermectina 200 µg/kg em dose única.","Errada: a ivermectina é usada em nematódeos, como Strongyloides, não em trematódeos."],["Praziquantel 10 mg/kg em dose única, a mesma da teníase.","Errada: a dose para esquistossomose é bem maior que a usada na teníase."]],"conc":"O praziquantel é o fármaco de escolha para esquistossomose. É contraindicado no primeiro trimestre da gestação e, por segurança, o aleitamento é suspenso por 72 horas após a dose.","rac":"Adulto: 50 mg/kg em dose única, tomado após refeição. Efeitos comuns: tontura, náuseas e dor abdominal. Controle com Kato-Katz após o tratamento.","pista":"Infecção confirmada por S. mansoni em adulto.","mud":"Gestante seria tratada após o parto (ou após o primeiro trimestre, conforme avaliação).","cmp":"Trematódeos e cestódeos intestinais: praziquantel. Nematódeos: albendazol ou ivermectina.","arm":"Usar albendazol para esquistossomose.","regra":"Esquistossomose: praziquantel 50 mg/kg (adulto) ou 60 mg/kg (criança).","cf":"O controle de cura é feito com Kato-Katz seriado nos meses seguintes.","fonte":"Brasil. Ministério da Saúde. Vigilância da esquistossomose mansoni: diretrizes técnicas, 4ª ed., 2014."},{"n":5,"sub":"Neuroesquistossomose","comp":"Reconhecer mielorradiculopatia esquistossomótica","tags":[],"rel":[],"enun":"Homem de 26 anos, de área endêmica, apresenta lombalgia, fraqueza progressiva em membros inferiores, parestesias e retenção urinária há 2 semanas. A ressonância mostra lesão em cone medular com captação de contraste. O líquor tem eosinófilos. Qual é a hipótese e o tratamento?","ops":[["Neuroesquistossomose; praziquantel e corticoide.","Correta: a neuroesquistossomose acomete preferencialmente o cone medular e a cauda equina; trata-se com praziquantel e corticoide."],["Esclerose múltipla; pulsoterapia isolada.","Errada: a eosinofilia liquórica e a origem em área endêmica apontam para neuroesquistossomose."],["Hérnia discal lombar; cirurgia de urgência.","Errada: a lesão é intramedular no cone, não compressão discal."],["Neurocisticercose medular; albendazol isolado.","Errada: neurocisticercose medular é rara, e o quadro clássico em cone medular de área endêmica é a esquistossomose."]],"conc":"A mielorradiculopatia esquistossomótica é a forma ectópica mais grave de S. mansoni. Ocorre por ovos que chegam ao plexo venoso vertebral e causam reação granulomatosa no cone medular e na cauda equina.","rac":"Lombalgia, paraparesia, distúrbio esfincteriano, lesão no cone e eosinófilos no líquor em paciente de área endêmica: neuroesquistossomose. Tratamento precoce com praziquantel e corticoide reduz sequelas.","pista":"Lesão no cone medular com eosinofilia liquórica em paciente de área endêmica.","mud":"Ausência de exposição a áreas endêmicas e bandas oligoclonais no líquor apoiariam doença desmielinizante.","cmp":"Neuroesquistossomose: cone medular, cauda equina, praziquantel e corticoide. Neurocisticercose: parênquima cerebral, convulsões, albendazol.","arm":"Atrasar o tratamento à espera de Kato-Katz positivo.","regra":"Paraparesia com distúrbio esfincteriano em quem veio de área endêmica: pense em esquistossomose medular.","cf":"O diagnóstico é presuntivo, com base em epidemiologia, quadro clínico, imagem e exclusão de outras causas.","fonte":"Brasil. Ministério da Saúde. Guia de vigilância epidemiológica e controle da mielorradiculopatia esquistossomótica, 2006."},{"n":6,"sub":"Cisticercose: transmissão","comp":"Diferenciar teníase de cisticercose","tags":[],"rel":[],"enun":"Mulher vegetariana de 40 anos, que nunca comeu carne de porco, é diagnosticada com neurocisticercose. Ela trabalha como cozinheira com um colega que elimina proglotes. Qual é o mecanismo de transmissão mais provável?","ops":[["Ingestão de ovos de T. solium eliminados por portador de teníase.","Correta: a cisticercose humana ocorre pela ingestão de ovos de T. solium, não pela ingestão de carne com cisticercos."],["Ingestão de carne suína mal cozida contendo cisticercos.","Errada: comer carne suína com cisticercos causa teníase intestinal, não cisticercose."],["Penetração cutânea de larvas em solo contaminado.","Errada: a penetração cutânea é o mecanismo de ancilostomídeos e Strongyloides."],["Ingestão de carne bovina mal cozida com cisticercos de Taenia saginata.","Errada: T. saginata não causa cisticercose humana."]],"conc":"Teníase: o ser humano é hospedeiro definitivo; ingere cisticercos na carne mal cozida e desenvolve a tênia adulta no intestino. Cisticercose: o ser humano é hospedeiro intermediário; ingere ovos de T. solium (água, alimentos ou autoinfecção) e desenvolve cisticercos nos tecidos.","rac":"A paciente não come carne de porco, mas convive com portador de teníase que manipula alimentos: ingestão de ovos e cisticercose.","pista":"Paciente vegetariana com contato próximo com portador de tênia.","mud":"Se a paciente comesse carne suína crua e eliminasse proglotes, o diagnóstico seria teníase.","cmp":"Carne com cisticerco: teníase. Ovo de T. solium: cisticercose.","arm":"Achar que a cisticercose exige comer carne de porco.","regra":"Cisticercose vem do ovo; teníase vem da carne.","cf":"Portadores de teníase devem ser tratados para interromper a transmissão aos contactantes.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (teníase e cisticercose); IDSA/ASTMH Clinical Practice Guidelines for Neurocysticercosis (White AC et al., Clin Infect Dis 2018;66:e49-e75)."},{"n":7,"sub":"Neurocisticercose calcificada","comp":"Indicar o tratamento da forma inativa","tags":[],"rel":[],"enun":"Homem de 45 anos com primeira crise convulsiva focal. A tomografia mostra duas calcificações puntiformes no parênquima cerebral, sem cistos viáveis, sem edema e sem realce. Qual é a conduta?","ops":[["Antiepiléptico, sem antiparasitário.","Correta: lesões calcificadas são formas inativas; antiparasitário não traz benefício, e trata-se a epilepsia."],["Albendazol por 14 dias associado a corticoide.","Errada: o antiparasitário é indicado para cistos viáveis, não para calcificações."],["Praziquantel em dose única, para evitar novos cistos.","Errada: não há cistos viáveis a tratar; o praziquantel não muda a evolução das calcificações."],["Ressecção neurocirúrgica das calcificações.","Errada: calcificações não são tratadas cirurgicamente."]],"conc":"A neurocisticercose evolui do cisto vesicular (viável) ao coloidal, granular-nodular e calcificado. As formas viáveis e em degeneração podem receber antiparasitário; a forma calcificada é inativa, mas pode ser foco epileptogênico.","rac":"Calcificações sem cistos viáveis: forma inativa. Tratamento sintomático com antiepiléptico; não há indicação de albendazol.","pista":"Apenas calcificações, sem cistos viáveis.","mud":"Cistos viáveis parenquimatosos levariam a albendazol associado a corticoide (com praziquantel se mais de dois cistos).","cmp":"Cisto viável: antiparasitário e corticoide. Calcificação: só antiepiléptico.","arm":"Dar albendazol para todo achado de neurocisticercose.","regra":"Neurocisticercose calcificada: trate a convulsão, não o parasita.","cf":"Antes de iniciar antiparasitário em formas viáveis, deve-se fazer fundo de olho para excluir cisticerco ocular.","fonte":"IDSA/ASTMH Clinical Practice Guidelines for Neurocysticercosis (White AC et al., Clin Infect Dis 2018)."},{"n":8,"sub":"Neurocisticercose com hipertensão intracraniana","comp":"Contraindicar antiparasitário","tags":[],"rel":[],"enun":"Menina de 12 anos com cefaleia intensa, vômitos e papiledema. A ressonância mostra múltiplos cistos cerebrais em degeneração com edema difuso (encefalite cisticercótica). Qual é a conduta inicial?","ops":[["Corticoide e controle da pressão intracraniana, sem antiparasitário.","Correta: na encefalite cisticercótica, o antiparasitário pode piorar o edema; trata-se com corticoide e medidas para hipertensão intracraniana."],["Albendazol em dose alta imediata, para eliminar todos os cistos.","Errada: matar os cistos aumenta a inflamação e pode agravar a hipertensão intracraniana."],["Praziquantel associado a albendazol sem corticoide.","Errada: o antiparasitário está contraindicado nesta fase, e o corticoide é essencial."],["Derivação ventriculoperitoneal de urgência em todos os casos.","Errada: a derivação é para hidrocefalia obstrutiva; o problema aqui é edema difuso."]],"conc":"A encefalite cisticercótica ocorre com grande número de cistos em degeneração simultânea e edema difuso, mais comum em crianças e mulheres jovens. Antiparasitários são contraindicados até o controle do edema.","rac":"Múltiplos cistos com edema difuso e papiledema: encefalite cisticercótica. Prioridade: corticoide e controle da pressão intracraniana.","pista":"Edema cerebral difuso com papiledema.","mud":"Poucos cistos viáveis sem hipertensão intracraniana permitiriam albendazol com corticoide.","cmp":"Hidrocefalia por cisto ventricular: neuroendoscopia ou derivação. Encefalite: corticoide sem antiparasitário.","arm":"Iniciar albendazol em paciente com hipertensão intracraniana não controlada.","regra":"Hipertensão intracraniana na neurocisticercose: primeiro o corticoide.","cf":"Fundo de olho é obrigatório antes de qualquer antiparasitário, pois cisticerco ocular pode ser destruído pela inflamação.","fonte":"IDSA/ASTMH Clinical Practice Guidelines for Neurocysticercosis (White AC et al., Clin Infect Dis 2018)."},{"n":9,"sub":"Hidatidose","comp":"Reconhecer o cisto hidático","tags":[],"rel":[],"enun":"Homem de 50 anos, criador de ovelhas no Rio Grande do Sul, com cães na propriedade, apresenta dor no hipocôndrio direito. A tomografia mostra cisto hepático de 8 cm com septações e cistos-filhos. Qual cuidado é essencial na abordagem?","ops":[["Evitar punção sem preparo; albendazol e cirurgia ou PAIR.","Correta: o extravasamento do líquido hidático pode causar anafilaxia e implantes; o tratamento envolve albendazol e abordagem planejada."],["Puncionar o cisto imediatamente para cultura bacteriana.","Errada: punção sem preparo do cisto hidático expõe a anafilaxia e disseminação."],["Tratar com metronidazol, por ser abscesso amebiano.","Errada: o abscesso amebiano não tem septações e cistos-filhos, e o contexto epidemiológico é de hidatidose."],["Acompanhar apenas, pois cistos hepáticos são sempre benignos e simples.","Errada: cisto com septações e cistos-filhos não é cisto simples."]],"conc":"A hidatidose é causada pelo Echinococcus granulosus. O cão é hospedeiro definitivo e ovinos são intermediários; o ser humano se infecta pela ingestão de ovos. Forma cistos principalmente no fígado e no pulmão.","rac":"Criação de ovelhas com cães, no Sul do país, e cisto com cistos-filhos: hidatidose. Tratamento com albendazol e cirurgia ou PAIR (punção, aspiração, injeção de escolicida e reaspiração) em centro experiente.","pista":"Cisto com cistos-filhos em criador de ovelhas com cães.","mud":"Cisto simples, unilocular, de paredes finas, sem epidemiologia sugere cisto biliar benigno.","cmp":"Hidatidose: cão e ovelha, cisto com cistos-filhos. Abscesso amebiano: lobo direito, febre, 'pasta de anchova'.","arm":"Puncionar o cisto sem cobertura antiparasitária.","regra":"Cisto hepático com cistos-filhos e cães de criação: não puncione às cegas.","cf":"No Brasil, a hidatidose é mais frequente no Rio Grande do Sul, onde há criação de ovinos.","fonte":"WHO Informal Working Group on Echinococcosis. Expert consensus (Brunetti E et al., Acta Trop 2010); Brasil. MS. Guia de bolso, 2010."},{"n":10,"sub":"Teníase","comp":"Diferenciar Taenia saginata de T. solium","tags":[],"rel":[],"enun":"Homem de 38 anos, que come carne bovina malpassada com frequência, relata saída espontânea de segmentos brancos e móveis pelo ânus, fora do momento da evacuação. Qual é o diagnóstico mais provável e o tratamento?","ops":[["Teníase por Taenia saginata; praziquantel em dose única.","Correta: as proglotes de T. saginata são ativas e saem pelo ânus espontaneamente; trata-se com praziquantel ou niclosamida."],["Teníase por Taenia solium; albendazol por 14 dias.","Errada: as proglotes de T. solium costumam ser eliminadas passivamente com as fezes; e a teníase se trata com praziquantel ou niclosamida."],["Cisticercose por Taenia saginata; albendazol e corticoide.","Errada: T. saginata não causa cisticercose humana."],["Enterobíase; albendazol repetido em 2 semanas.","Errada: o Enterobius é pequeno e filiforme; segmentos brancos achatados e móveis são proglotes de tênia."]],"conc":"T. saginata (boi) e T. solium (porco) causam teníase. As proglotes da T. saginata são mais móveis e saem ativamente pelo ânus; as de T. solium saem passivamente nas fezes. Apenas a T. solium causa cisticercose.","rac":"Carne bovina malpassada e proglotes móveis que saem ativamente: T. saginata. Praziquantel 5 a 10 mg/kg em dose única ou niclosamida.","pista":"Proglotes que saem ativamente pelo ânus.","mud":"História de carne suína mal cozida apontaria para T. solium, com risco adicional de cisticercose para o paciente e contactantes.","cmp":"T. saginata: boi, proglote ativa, sem cisticercose. T. solium: porco, proglote passiva, causa cisticercose.","arm":"Achar que toda teníase traz risco de cisticercose.","regra":"Proglote que sai sozinha pelo ânus: Taenia saginata.","cf":"A inspeção sanitária de carnes e o cozimento adequado previnem a teníase.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (teníase e cisticercose)."}]},{"id":"M07","titulo":"Amebíase e giardíase","bloco":1,"q":[{"n":1,"sub":"Colite amebiana","comp":"Tratar disenteria amebiana","tags":[],"rel":[],"enun":"Homem de 30 anos com diarreia com muco e sangue, cólicas e tenesmo há 10 dias, sem febre alta. A colonoscopia mostra úlceras em botão de camisa no ceco e no retossigmoide, e o exame identifica trofozoítos hematófagos de Entamoeba histolytica. Qual é o tratamento?","ops":[["Nitroimidazol seguido de amebicida de ação luminal.","Correta: o nitroimidazol trata a invasão tecidual, e o amebicida luminal elimina os cistos remanescentes, evitando recidiva."],["Metronidazol isolado por 7 dias, sem necessidade de outra droga.","Errada: o metronidazol tem ação luminal limitada; sem amebicida luminal, os cistos persistem."],["Ciprofloxacino por 5 dias, como em toda disenteria.","Errada: quinolonas tratam disenterias bacterianas, não amebíase."],["Corticoide oral, por se tratar de colite inflamatória.","Errada: corticoide em colite amebiana pode precipitar colite fulminante e megacólon tóxico."]],"conc":"A Entamoeba histolytica invade a mucosa do cólon e forma úlceras em botão de camisa. Trofozoítos hematófagos indicam forma invasiva. O tratamento combina nitroimidazol e amebicida de ação luminal.","rac":"Disenteria com trofozoítos hematófagos: amebíase invasiva intestinal. Nitroimidazol para a forma tecidual, seguido de agente luminal.","pista":"Trofozoítos com hemácias fagocitadas.","mud":"Achado apenas de cistos em paciente assintomático levaria a usar só amebicida luminal (ou nada, se E. dispar).","cmp":"Tecidual: nitroimidazol. Luminal: teclozana, etofamida, paromomicina.","arm":"Tratar colite amebiana com corticoide por confusão com DII.","regra":"Amebíase invasiva: nitroimidazol mais luminal.","cf":"O metronidazol causa efeito antabuse com álcool, que deve ser evitado durante o tratamento.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (amebíase); Shirley DT et al. Open Forum Infect Dis 2018;5:ofy161."},{"n":2,"sub":"Abscesso hepático amebiano","comp":"Reconhecer e tratar o abscesso amebiano","tags":[],"rel":[],"enun":"Homem de 32 anos, de área com saneamento precário, tem febre, dor no hipocôndrio direito há 10 dias e hepatomegalia dolorosa. Sem icterícia. A ultrassonografia mostra lesão única hipoecoica no lobo direito. A sorologia para E. histolytica é positiva. Qual é a conduta?","ops":[["Metronidazol e amebicida luminal; drenagem só se necessário.","Correta: a maioria dos abscessos amebianos responde ao metronidazol; a drenagem fica para falha, risco de ruptura ou lobo esquerdo."],["Drenagem percutânea imediata obrigatória em todos os casos.","Errada: a drenagem não é rotineira; o tratamento clínico resolve a maioria dos casos."],["Ressecção hepática cirúrgica do lobo acometido.","Errada: a cirurgia é reservada a complicações como ruptura com peritonite."],["Antibioticoterapia para abscesso piogênico com ceftriaxona isolada.","Errada: a sorologia positiva, a lesão única e o perfil epidemiológico apontam para abscesso amebiano, que exige metronidazol."]],"conc":"O abscesso hepático amebiano é a forma extraintestinal mais comum. Predomina em homens jovens, costuma ser único e no lobo direito; o conteúdo é descrito como pasta de anchova. Muitos pacientes não têm diarreia concomitante.","rac":"Febre, dor em hipocôndrio direito, lesão única no lobo direito e sorologia positiva: abscesso amebiano. Metronidazol por 7 a 10 dias, seguido de agente luminal.","pista":"Lesão única em lobo direito com sorologia positiva.","mud":"Lesão no lobo esquerdo (risco de ruptura para o pericárdio), abscesso maior que 10 cm ou ausência de resposta em 72 a 96 horas indicariam drenagem.","cmp":"Amebiano: homem jovem, único, lobo direito, sorologia positiva. Piogênico: idoso, doença biliar, múltiplo, hemocultura positiva.","arm":"Drenar todo abscesso hepático.","regra":"Abscesso amebiano: metronidazol primeiro, drenagem só se necessário.","cf":"A ultrassonografia de controle pode mostrar a lesão por meses, mesmo com cura clínica.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (amebíase); Haque R et al. Amebiasis. N Engl J Med 2003;348:1565-1573."},{"n":3,"sub":"E. histolytica versus E. dispar","comp":"Interpretar cistos de Entamoeba no EPF","tags":[],"rel":[],"enun":"Mulher de 25 anos, assintomática, faz EPF admissional que mostra cistos tetranucleados de Entamoeba histolytica/dispar. Qual é a interpretação correta?","ops":[["A microscopia não diferencia as espécies; antígeno ou PCR define.","Correta: as duas espécies são morfologicamente idênticas; só a E. histolytica é patogênica."],["Trata-se de E. histolytica patogênica, que exige metronidazol e drenagem.","Errada: não há como afirmar a espécie pela microscopia, e a paciente é assintomática."],["É sempre E. dispar, que não precisa de tratamento.","Errada: a microscopia não permite excluir E. histolytica."],["O achado indica abscesso hepático, que deve ser investigado com tomografia.","Errada: cistos nas fezes de paciente assintomática não indicam abscesso hepático."]],"conc":"E. histolytica (patogênica) e E. dispar (comensal) têm cistos idênticos. Testes de antígeno específico ou PCR diferenciam as espécies. A presença de trofozoítos hematófagos sugere E. histolytica.","rac":"Cistos em assintomática: identificar a espécie. Se E. histolytica, amebicida luminal (pelo risco de doença invasiva e transmissão); se E. dispar, não tratar.","pista":"Laudo descreve 'E. histolytica/dispar', sem trofozoítos hematófagos.","mud":"Disenteria com trofozoítos hematófagos confirmaria forma invasiva e exigiria nitroimidazol.","cmp":"E. histolytica: patogênica, invasiva. E. dispar: comensal. Ambas: cistos de quatro núcleos.","arm":"Tratar todo laudo de cistos de Entamoeba com metronidazol.","regra":"Cisto de Entamoeba no microscópio não diz a espécie.","cf":"Entamoeba coli é outro comensal, com cistos de até oito núcleos, que não precisa de tratamento.","fonte":"Shirley DT et al. Open Forum Infect Dis 2018; CDC DPDx — Amebiasis."},{"n":4,"sub":"Giardíase: clínica","comp":"Reconhecer síndrome disabsortiva por Giardia","tags":[],"rel":[],"enun":"Criança de 4 anos que frequenta creche tem diarreia há 3 semanas, com fezes volumosas, gordurosas e fétidas, distensão, flatulência e perda de peso. Não há sangue nas fezes nem febre. Qual é o agente mais provável?","ops":[["Giardia lamblia (G. duodenalis).","Correta: a giardíase acomete o delgado proximal, causa diarreia disabsortiva com esteatorreia e é comum em creches."],["Entamoeba histolytica.","Errada: a amebíase invasiva causa disenteria com sangue e muco, por acometer o cólon."],["Shigella spp.","Errada: a shigelose causa disenteria febril aguda, não diarreia gordurosa prolongada."],["Rotavírus, por ser a principal causa de diarreia em creches.","Errada: o rotavírus causa diarreia aguda aquosa com vômitos e febre, autolimitada em dias."]],"conc":"A Giardia é protozoário flagelado que se fixa à mucosa do duodeno e do jejuno, causando atrofia vilositária, má absorção de gorduras e vitaminas lipossolúveis e intolerância secundária à lactose. A transmissão é fecal-oral, por água ou contato pessoa a pessoa.","rac":"Diarreia prolongada, fezes gordurosas e fétidas, distensão, perda de peso e ambiente de creche: giardíase.","pista":"Esteatorreia sem sangue em criança de creche.","mud":"Sangue e muco nas fezes sugeririam acometimento do cólon (amebíase, shigelose).","cmp":"Giardia: delgado, esteatorreia, sem sangue. E. histolytica: cólon, disenteria.","arm":"Atribuir a diarreia prolongada a virose sem investigar parasitose.","regra":"Esteatorreia em criança de creche: Giardia.","cf":"Pode haver intolerância secundária à lactose por semanas após a cura.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (giardíase); CDC. Giardiasis — Resources for Health Professionals."},{"n":5,"sub":"Giardíase: diagnóstico","comp":"Escolher o exame com maior sensibilidade","tags":[],"rel":[],"enun":"Na investigação de giardíase em paciente com diarreia crônica, um EPF único foi negativo. Por que se recomendam amostras seriadas ou pesquisa de antígeno nas fezes?","ops":[["A eliminação de cistos é intermitente; amostras seriadas ou antígeno são mais sensíveis.","Correta: a liberação intermitente de cistos reduz a sensibilidade de amostra única; antígeno fecal ou EPF seriado melhoram o diagnóstico."],["Porque a Giardia só é detectada por colonoscopia com biópsia do cólon.","Errada: a Giardia habita o delgado proximal; a colonoscopia não é o método diagnóstico."],["Porque só a sorologia sérica é confiável para giardíase.","Errada: a sorologia não é usada na prática clínica para giardíase."],["Porque o EPF negativo indica giardíase resistente ao tratamento.","Errada: EPF negativo não indica resistência; indica que a amostra pode não ter capturado cistos."]],"conc":"O diagnóstico de giardíase é feito por EPF (método de Faust para cistos), preferencialmente em três amostras em dias alternados, ou por pesquisa de antígeno fecal (ELISA, imunofluorescência), mais sensível. Aspirado duodenal é usado raramente.","rac":"Amostra única negativa não exclui. Repetir em três amostras ou solicitar antígeno fecal.","pista":"Eliminação intermitente de cistos.","mud":"Se a pesquisa de antígeno for negativa com clínica típica persistente, considera-se aspirado ou biópsia duodenal.","cmp":"Faust: concentra cistos de protozoários. Hoffmann: ovos e cistos por sedimentação.","arm":"Encerrar a investigação após um EPF negativo.","regra":"Giardia: três amostras ou antígeno nas fezes.","cf":"Na prática, em quadro típico com exames indisponíveis, o tratamento empírico é aceito.","fonte":"CDC DPDx — Giardiasis; Neves DP. Parasitologia Humana, 14ª ed."},{"n":6,"sub":"Giardíase: tratamento","comp":"Prescrever esquema para giardíase","tags":[],"rel":[],"enun":"Adulto de 28 anos com giardíase confirmada por antígeno fecal. Não está grávida e não usa álcool. Qual é uma opção de tratamento adequada?","ops":[["Tinidazol ou secnidazol 2 g em dose única.","Correta: os nitroimidazóis são o tratamento de escolha; tinidazol e secnidazol permitem dose única."],["Albendazol 400 mg em dose única, igual aos helmintos.","Errada: o albendazol tem alguma ação sobre Giardia, mas exige vários dias e não é a primeira escolha."],["Praziquantel 25 mg/kg em dose única.","Errada: o praziquantel é usado em platelmintos e não tem ação sobre Giardia."],["Ivermectina em dose única.","Errada: a ivermectina não trata giardíase."]],"conc":"A giardíase responde a nitroimidazóis (metronidazol, tinidazol, secnidazol). Nitazoxanida e albendazol são alternativas. Na gestação, a paromomicina é opção no primeiro trimestre.","rac":"Diagnóstico confirmado: nitroimidazol. Dose única com tinidazol ou secnidazol favorece a adesão.","pista":"Giardíase confirmada em adulto sem contraindicações.","mud":"Gestante no primeiro trimestre levaria a preferir paromomicina ou adiar o tratamento, conforme a gravidade.","cmp":"Protozoários intestinais (Giardia, Entamoeba): nitroimidazóis. Helmintos: benzimidazóis e outros.","arm":"Tratar Giardia com praziquantel ou ivermectina.","regra":"Giardia: nitroimidazol.","cf":"Orientar abstinência de álcool durante o uso e até 72 horas depois.","fonte":"Brasil. Ministério da Saúde. Guia de bolso, 2010 (giardíase); CDC. Giardiasis — Treatment."},{"n":7,"sub":"Giardíase recorrente","comp":"Investigar imunodeficiência","tags":[],"rel":[],"enun":"Homem de 26 anos com giardíase recorrente, apesar de tratamento correto, sinusites e pneumonias de repetição. Qual exame deve ser solicitado?","ops":[["Dosagem de imunoglobulinas séricas (IgA, IgG e IgM).","Correta: giardíase recorrente com infecções sinopulmonares sugere deficiência de IgA ou imunodeficiência comum variável."],["Teste do suor para fibrose cística.","Errada: a fibrose cística causa infecções respiratórias e má absorção, mas não explica giardíase de repetição."],["Colonoscopia com biópsias para doença de Crohn.","Errada: a combinação de infecções sinopulmonares e Giardia recorrente aponta para imunodeficiência humoral."],["Teste respiratório para supercrescimento bacteriano.","Errada: o supercrescimento não explica as infecções respiratórias de repetição."]],"conc":"A IgA secretora é importante na defesa contra a Giardia. Deficiência seletiva de IgA e imunodeficiência comum variável predispõem a giardíase crônica ou recorrente e a infecções respiratórias por germes encapsulados.","rac":"Giardíase de repetição mais sinusites e pneumonias: imunodeficiência humoral até prova em contrário. Dosar imunoglobulinas.","pista":"Infecções sinopulmonares de repetição associadas à giardíase.","mud":"Recidiva única após exposição a água contaminada, sem outras infecções, sugeriria reinfecção, não imunodeficiência.","cmp":"Deficiência de IgA: comum, geralmente branda. Imunodeficiência comum variável: queda de IgG, IgA e IgM, infecções graves.","arm":"Repetir o tratamento indefinidamente sem investigar a causa da recorrência.","regra":"Giardia de repetição: dose as imunoglobulinas.","cf":"Na deficiência de IgA, a sorologia para doença celíaca baseada em IgA fica falsamente negativa.","fonte":"Harrison's Principles of Internal Medicine, 21ª ed. (Primary Immune Deficiency Diseases; Protozoal Intestinal Infections)."},{"n":8,"sub":"Corticoide e amebíase","comp":"Excluir amebíase antes de tratar suposta DII","tags":[],"rel":[],"enun":"Paciente de 35 anos, de região com saneamento precário, com diarreia sanguinolenta há 3 semanas e colonoscopia com úlceras em cólon, recebe diagnóstico presuntivo de retocolite ulcerativa. Antes de iniciar corticoide, qual cuidado é essencial?","ops":[["Excluir amebíase, pois o corticoide pode causar colite amebiana fulminante.","Correta: a colite amebiana pode imitar DII, e o corticoide nesse contexto pode precipitar colite fulminante e perfuração."],["Iniciar corticoide imediatamente, pois o atraso piora a retocolite.","Errada: o risco de colite amebiana fulminante supera o atraso de poucos dias para exames."],["Prescrever albendazol empírico antes do corticoide.","Errada: o albendazol não trata amebíase."],["Solicitar apenas calprotectina fecal para confirmar a DII.","Errada: a calprotectina se eleva em qualquer inflamação, inclusive na colite amebiana."]],"conc":"A colite amebiana e a DII podem ter apresentação endoscópica semelhante. Em áreas endêmicas, o diagnóstico de DII exige exclusão de causas infecciosas, incluindo amebíase, C. difficile, tuberculose e CMV conforme o caso.","rac":"Diarreia sanguinolenta em área endêmica: antes de imunossuprimir, excluir E. histolytica com testes específicos e biópsias.","pista":"Epidemiologia favorável à amebíase e plano de iniciar corticoide.","mud":"Pesquisa negativa para E. histolytica e histologia de cronicidade (distorção de criptas, plasmocitose basal) sustentariam a retocolite.","cmp":"DII: cronicidade histológica. Colite infecciosa: inflamação aguda sem distorção arquitetural.","arm":"Começar corticoide antes de excluir infecção.","regra":"Antes de corticoide em colite, exclua amebíase.","cf":"A biópsia pode mostrar trofozoítos na borda das úlceras.","fonte":"ECCO-ESGAR Guideline for Diagnostic Assessment in IBD (Maaser C et al., J Crohns Colitis 2019); Haque R et al. N Engl J Med 2003."},{"n":9,"sub":"Prevenção","comp":"Indicar medida eficaz contra cistos de protozoários","tags":[],"rel":[],"enun":"Em uma comunidade rural com surto de giardíase, a água é distribuída apenas com cloração convencional. Qual medida doméstica é mais eficaz para inativar cistos de Giardia?","ops":[["Ferver a água para consumo ou usar filtração adequada.","Correta: os cistos de Giardia resistem à cloração convencional; fervura e filtração adequada os inativam ou removem."],["Adicionar mais hipoclorito por poucos segundos antes de beber.","Errada: os cistos resistem a concentrações e tempos de contato usuais de cloro."],["Tratar todos os moradores com albendazol a cada 6 meses.","Errada: o albendazol não é tratamento adequado de giardíase nem substitui o saneamento."],["Lavar as mãos apenas após o uso do banheiro.","Errada: a higiene das mãos é importante, mas isoladamente não resolve a transmissão hídrica."]],"conc":"Cistos de Giardia e Entamoeba resistem ao cloro em concentrações habituais. Fervura, filtração adequada e saneamento básico são as principais medidas de prevenção, junto com higiene das mãos e dos alimentos.","rac":"Transmissão hídrica com cloração ineficaz: fervura ou filtração para a água de consumo.","pista":"Surto com água apenas clorada.","mud":"Em transmissão pessoa a pessoa em creche, a prioridade seria higiene das mãos e manejo de fraldas.","cmp":"Cloro: eficaz contra bactérias, pouco eficaz contra cistos. Fervura: eficaz contra cistos.","arm":"Confiar apenas na cloração para prevenir protozooses.","regra":"Cisto de protozoário: ferva ou filtre a água.","cf":"O Cryptosporidium também é resistente ao cloro e causa surtos hídricos.","fonte":"CDC. Giardia — Prevention and Control; Brasil. MS. Guia de bolso, 2010."},{"n":10,"sub":"Diagnóstico diferencial de abscesso hepático","comp":"Distinguir abscesso piogênico de amebiano","tags":[],"rel":[],"enun":"Mulher de 72 anos, diabética, com colangite prévia por coledocolitíase, apresenta febre alta, calafrios e múltiplas lesões hepáticas hipoecoicas. Hemoculturas positivas para Klebsiella pneumoniae. Qual é o diagnóstico mais provável e a conduta?","ops":[["Abscesso piogênico; antibiótico e drenagem percutânea.","Correta: idade, doença biliar, diabetes, lesões múltiplas e hemocultura positiva caracterizam abscesso piogênico."],["Abscesso amebiano; metronidazol isolado.","Errada: o abscesso amebiano é mais comum em homens jovens, geralmente único, e não cursa com hemocultura positiva."],["Hidatidose hepática; albendazol e PAIR.","Errada: não há epidemiologia nem cistos-filhos; o quadro é séptico."],["Metástases hepáticas; biópsia guiada antes de tratar.","Errada: febre, calafrios e bacteremia apontam para infecção, não para neoplasia."]],"conc":"O abscesso piogênico costuma se originar de doença biliar, diverticulite ou bacteremia, é frequentemente múltiplo e exige antibiótico e drenagem. A Klebsiella pneumoniae é agente comum, sobretudo em diabéticos.","rac":"Perfil do paciente (idosa, diabética, doença biliar), lesões múltiplas e bacteremia: piogênico. Antibiótico de amplo espectro e drenagem; investigar e tratar a fonte biliar.","pista":"Hemocultura positiva para Klebsiella com lesões múltiplas.","mud":"Homem jovem com lesão única em lobo direito e sorologia positiva para E. histolytica indicaria abscesso amebiano.","cmp":"Piogênico: drenagem é regra, hemocultura positiva. Amebiano: metronidazol resolve, drenagem é exceção.","arm":"Tratar todo abscesso hepático com metronidazol isolado.","regra":"Abscesso hepático com doença biliar e bacteremia: piogênico.","cf":"Em abscesso por Klebsiella, recomenda-se fundoscopia pelo risco de endoftalmite metastática.","fonte":"Sabiston Textbook of Surgery, 21ª ed. (The Liver); Haque R et al. N Engl J Med 2003."}]},{"id":"M08","titulo":"Diarreia","bloco":1,"q":[{"n":1,"sub":"Classificação temporal","comp":"Classificar a diarreia pela duração","tags":[],"rel":[],"enun":"Mulher de 40 anos tem diarreia aquosa com 4 a 5 evacuações por dia há 20 dias, iniciada após viagem. Como a diarreia é classificada quanto à duração?","ops":[["Persistente, por durar entre 14 e 30 dias.","Correta: diarreia aguda dura até 14 dias; persistente, de 14 a 30 dias; crônica, mais de 30 dias (ou 4 semanas)."],["Aguda, por durar menos de 30 dias.","Errada: o limite da diarreia aguda é 14 dias."],["Crônica, por durar mais de 14 dias.","Errada: crônica é a que dura mais de 30 dias (ou 4 semanas)."],["Recorrente, por ter surgido após viagem.","Errada: a classificação temporal depende da duração, não do fator desencadeante."]],"conc":"A duração orienta a investigação: a aguda é geralmente infecciosa e autolimitada; a persistente sugere protozoários (Giardia, Cryptosporidium) ou bactérias específicas; a crônica amplia o diagnóstico para causas não infecciosas.","rac":"20 dias: entre 14 e 30. Diarreia persistente. Após viagem, pesquisar parasitas como Giardia e Cryptosporidium.","pista":"Duração de 20 dias.","mud":"Mais de 30 dias faria pensar também em causas não infecciosas, como DII, celíaca, SII e causas medicamentosas.","cmp":"Aguda: até 14 dias. Persistente: 14 a 30 dias. Crônica: mais de 30 dias.","arm":"Chamar de crônica toda diarreia com mais de 2 semanas.","regra":"14 e 30: os números da diarreia.","cf":"Diarreia persistente pós-viagem deve ser investigada com EPF e pesquisa de antígenos de protozoários.","fonte":"IDSA Clinical Practice Guidelines for Infectious Diarrhea (Shane AL et al., Clin Infect Dis 2017;65:e45-e80)."},{"n":2,"sub":"Plano B","comp":"Avaliar desidratação e escolher o plano de hidratação","tags":[],"rel":[],"enun":"Criança de 2 anos, 12 kg, com diarreia há 2 dias. Está irritada, com olhos fundos, bebe água com avidez e o sinal da prega desaparece lentamente. Está alerta e consegue beber. Segundo o Ministério da Saúde, qual é a conduta?","ops":[["Plano B: SRO na unidade, 50 a 100 mL/kg em 4 a 6 horas.","Correta: há desidratação (irritação, olhos fundos, sede, prega lenta) com capacidade de beber; o plano B é a reidratação oral supervisionada."],["Plano A: orientação para casa com aumento da oferta de líquidos.","Errada: o plano A é para crianças sem sinais de desidratação."],["Plano C: hidratação venosa com soro fisiológico 20 mL/kg em 30 minutos.","Errada: o plano C é para desidratação grave (letargia, incapacidade de beber, prega muito lenta)."],["Suspender a alimentação e manter apenas soro caseiro por 48 horas.","Errada: a alimentação deve ser mantida; o jejum prolongado piora o estado nutricional."]],"conc":"O MS classifica a hidratação em: sem desidratação (plano A, domicílio), com desidratação (plano B, SRO supervisionado na unidade) e desidratação grave (plano C, venoso). Sinais de desidratação: irritação, olhos fundos, sede, prega que desaparece lentamente.","rac":"Criança irritada, com olhos fundos, sedenta e com prega lenta, mas alerta e bebendo: desidratação sem gravidade, plano B. Reavaliar continuamente; ao hidratar, passar ao plano A.","pista":"Sede intensa com capacidade de beber.","mud":"Letargia, incapacidade de beber ou prega muito lenta (mais de 2 segundos) indicariam plano C.","cmp":"Plano A: sem desidratação. Plano B: desidratação, SRO na unidade. Plano C: grave, venoso.","arm":"Hidratar por via venosa toda criança desidratada que ainda consegue beber.","regra":"Bebe com avidez e está desidratada: plano B.","cf":"Se vomitar a SRO, oferecer volumes pequenos e frequentes; vômitos persistentes podem exigir sonda nasogástrica ou via venosa.","fonte":"Brasil. Ministério da Saúde. Manejo do paciente com diarreia (cartaz), 2023."},{"n":3,"sub":"Plano C","comp":"Prescrever hidratação venosa na desidratação grave","tags":[],"rel":[],"enun":"Menino de 8 anos, 25 kg, com diarreia e vômitos, está letárgico, não consegue beber, com olhos muito fundos, pulso fino e prega que desaparece muito lentamente. Qual é a fase rápida (expansão) do plano C segundo o Ministério da Saúde?","ops":[["SF 0,9% 30 mL/kg em 30 m
